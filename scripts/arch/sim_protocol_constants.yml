# The JavaScript protocol vocabulary belongs to @aresrpg/sim. This pack catches declarations of the
# numeric spell-effect vocabulary in consumer packages; scripts/sim-constants-gate.sh ratchets the
# current kill-list debt per rule + file, so only deletion can move the baseline.
rules:
  - id: sim-protocol-spell-effect-kind
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      Spell-effect kind ids belong to @aresrpg/sim/spell_effect. Import or derive the canonical
      vocabulary; do not re-declare a wire discriminant in a consumer package (#1603).
    pattern-either:
      - pattern: const K_ALTER_STAT = 9
      - pattern: const K_ALTER_RESIST = 11
      - pattern: const K_INVISIBILITY = 27
      - pattern: const FLAG_NEGATIVE = 8
      - patterns:
          - pattern: const $NAME = { ... }
          - metavariable-regex:
              metavariable: $NAME
              regex: '^(?:KIND_NAMES|kind_names)$'

  - id: sim-protocol-stat-id
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      Spell-effect stat ids belong to @aresrpg/sim/spell_effect. Import or derive the canonical
      vocabulary; do not re-declare the numeric stat map in a consumer package (#1603).
    patterns:
      - pattern: const $NAME = { ... }
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?:STAT_CHAIN_ID|STAT_VIEW)$'

  - id: sim-protocol-element-ordinal
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      Spell element ordinals belong to @aresrpg/sim/spell. Import or derive the canonical vocabulary;
      do not re-declare fire/water/earth/air/none ids in a consumer package (#1603).
    patterns:
      - pattern: const $NAME = { ... }
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?:ELEMENT_ORDINAL|RESIST_ELEMENT|element_names)$'

  - id: sim-protocol-aoe-shape-id
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      AoE shape ids belong to @aresrpg/sim/spell_effect. Import or derive the canonical vocabulary;
      do not re-declare point/circle/cross/line/tbar/ring/allmap/cone ids (#1603).
    patterns:
      - pattern: const $NAME = { ... }
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?:SHAPE_NAMES|shape_names)$'

  - id: sim-protocol-point-kind-id
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      AP/MP point-kind ids belong to @aresrpg/sim/spell_effect. Import or derive the canonical
      vocabulary; do not re-declare point discriminants or their lookup tables (#1603).
    pattern-either:
      - pattern: const POINT_AP = 0
      - pattern: const POINT_MP = 1
      - patterns:
          - pattern: const $NAME = { ... }
          - metavariable-regex:
              metavariable: $NAME
              regex: '^(?:POINT_POOL|POINT_VIEW|POOL_POINT_KIND)$'

  - id: sim-protocol-target-filter-bit
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      Target-filter bits belong to @aresrpg/sim/spell_effect. Import the canonical TF_* constant;
      do not re-declare a target bit in a consumer package (#1603).
    pattern-either:
      - pattern: const TF_NONE = 0
      - pattern: const TF_NOT_TEAM = 1
      - pattern: const TF_NOT_SELF = 2
      - pattern: const TF_NOT_ENEMY = 4
      - pattern: const TF_ONLY_CASTER = 32

  - id: sim-protocol-cast-cap-sentinel
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      The unlimited cast-cap sentinel belongs to @aresrpg/sim/spell_templates. Import
      CASTS_UNLIMITED; do not give 255 cast-limit meaning in a consumer package (#1603).
    pattern-either:
      - pattern: 'casts_per_turn: 255'
      - pattern: 'casts_per_target: 255'
      - pattern: $LEVEL.casts_per_turn >= 255
      - pattern: $LEVEL.casts_per_target >= 255
      - pattern: authored === 255

  - id: sim-protocol-character-level-ceiling
    languages: [js, ts]
    severity: ERROR
    paths:
      include: ['packages/frontend/src/**']
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      The character level ceiling derives from the SDK experience table. Import MAX_LEVEL from
      @aresrpg/sdk/experience; do not re-declare or re-derive it in the client (#782).
    pattern-either:
      - patterns:
          - pattern: const $NAME = 200
          - metavariable-regex:
              metavariable: $NAME
              regex: '^(?:MAX_LEVEL|MAX_CHARACTER_LEVEL|CHARACTER_MAX_LEVEL)$'
      - pattern: const MAX_CHARACTER_LEVEL = experience_to_level(Number.MAX_SAFE_INTEGER)

  - id: sim-protocol-displacement-kind
    languages: [js, ts]
    severity: ERROR
    paths:
      include: ['packages/fight/src/**']
      exclude:
        - '**/*.test.*'
        - '**/*.spec.*'
        - 'packages/fight/src/fight_render_prims.js'
    message: >-
      Displaced event kinds belong to fight_render_prims. Import DISPLACE_TELEPORT; do not re-declare
      the teleport wire discriminant in another fight module (#781).
    pattern-either:
      - pattern: const DISPLACE_TELEPORT = 14
      - pattern: const DISPLACE_TELEPORT = 14n

  - id: sim-protocol-grid-stride
    languages: [js, ts]
    severity: ERROR
    paths:
      include: ['packages/fight/src/**', 'packages/frontend/src/**']
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      Encoded fight cells use @aresrpg/sim/combat_grid GRID_W. Import the canonical stride; do not
      re-declare 20 or pass it as a local grid_width protocol constant (#782).
    pattern-either:
      - pattern: const GRID_W = 20
      - pattern: const CELL_STRIDE = 20
      - pattern: 'grid_width: 20'

  - id: sim-protocol-signed-value-bias
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      The signed-value bias belongs to @aresrpg/sim. Import the canonical shift; do not re-declare
      32768 under a local bias/shift name in a consumer package (#1603).
    pattern-either:
      - pattern: const SIGNED_SHIFT = 32768
      - pattern: const SIGNED_SHIFT = 32_768
      - pattern: const SIGNED_KINDS = new Set([9, 11])

  - id: sim-protocol-board-seed-fold
    languages: [js, ts]
    severity: ERROR
    paths:
      exclude: ['**/*.test.*', '**/*.spec.*', '**/test_helpers/**']
    message: >-
      The (world_seed, anchor) → board-seed fold belongs to @aresrpg/sim/board_gen. Import
      board_seed_from_anchor; do not re-declare the fold or its anchor primes in a consumer package
      (#1680). One digit of drift silently desyncs every generated board from the chain. The engine's
      binding/ twin is the ONE sanctioned copy (it ships no @aresrpg/sim dependency by design — see
      packages/engine/src/binding/prng.js) and is held to the sim by a live cross-import parity sweep
      in packages/engine/test/binding/board_seed_parity.test.js; it is out of this pack's scan
      targets (scripts/sim-constants-gate.sh) rather than baselined.
    pattern-either:
      - pattern: const $NAME = 0x85ebca77n
      - pattern: const $NAME = 0x85ebca77
      - pattern: const $NAME = 2240710263
      - pattern: const $NAME = 0xc2b2ae3dn
      - pattern: const $NAME = 0xc2b2ae3d
      - pattern: const $NAME = 3266489405
      - pattern: function board_seed_from_anchor(...) { ... }
      - pattern: const board_seed_from_anchor = (...) => { ... }
