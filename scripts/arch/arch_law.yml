# scripts/arch/arch_law.yml — DATAFLOW/CONTEXT rules the lexical eslint layer cannot express
# (docs/CODE_LAW.md "Arch gates"). Run via scripts/semgrep-gate.sh — never bare semgrep: the gate
# joins the extraction pack (laundered_extract.yml), self-tests both packs on scripts/arch/fixtures,
# and ratchets real-tree findings against scripts/arch/semgrep_baseline.json.
#
# Scope note: semgrep parses .jsx/.tsx natively, so these rules cover the component files the
# eslint FP layer can't opt in yet (fp_law.config.mjs F-1 debt).
#
# Semgrep-JS pattern semantics (probed 2026-07-17, semgrep 1.170.0 — fixtures pin these):
#   · arrow patterns ignore the `async` modifier AND the body form: `(...) => { ... }` matches every
#     arrow. There is NO way to demand async-ness of an arrow — rules anchor on `await`/promise
#     machinery instead.
#   · `(...) => ...` (ellipsis body) matches expression bodies ONLY — never use it as an arrow body.
#   · `async function $F(...) { ... }` DOES respect the modifier on declarations.
rules:
  # ── #1993 · every fight-visible fact has ONE source: the canonical projection ──────────────────
  # The projection audit (2026-08-02) found all six fight-visible facts — turn/phase, roster
  # identity, loot/outcome, position/cast landing, active effects, HP — with more than one
  # independent source-home across 734 files; #1740/#1865/#1867/#1859/#1872 are instances of that
  # one disease. This rule is the epic's METER, not its cure: it freezes the census so each family
  # can only pay its rows DOWN.
  #
  # SCOPE — the include set is the audited fight-visible mount tree: 24 consumer surfaces (18
  # currently dirty, 6 clean and held at floor 0, so a first bypass in them is an instant red).
  # Deliberately NOT consumers, hence absent: `world/use_fight_phase.js` and `game/store.js` ARE
  # the projection boundary, and `useFight(world_fight_view)` is the one sanctioned read (the
  # `pattern-not` arm) — every other listed hook/API call is a source read that must instead become
  # a fact on the canonical view.
  #
  # BASELINE PROVENANCE — 88 findings over 18 files, measured MAX-OF-3 per #2016
  # (scripts/arch/scan_stability.mjs; a single-pass floor is refused at the door) with semgrep
  # 1.170.0, re-measured at tip f18f6dad0 and stable across all 3 runs. Ratchet is SHRINK-ONLY from
  # day one: semgrep_verdict rejects any per-file increase, and the families (#1993 WP2-7) retire
  # their rows as they migrate onto `fight_visible_view`. Never regenerate this floor to absorb a
  # new bypass — that is the debt this gate exists to stop.
  #
  # FLOOR TODAY — 67 findings over 17 files (#1993 THE DOORS). The view publishes six records and only
  # `entities` had a React binding, which is why consumers kept reading sources; `useFightVisible*` is one
  # door per record and is deliberately ABSENT from the pattern set below — reading a RECORD is the cure,
  # not the disease. Two waves burned this down from 75: the carve-out wave took it to 69 (DeckCluster's
  # seed tuple, the min-turn floor, the actor verdict, the seat home), then `controls.action_slot` gave the
  # §7 slot a record and DeckCluster 2→1 + use_target_prediction 3→2 came off the raw-core selector.
  - id: arch-fight-visible-source-bypass
    languages: [js, ts]
    severity: ERROR
    message: Fight-visible code reads a source store/API directly; add the fact to the canonical fight-visible projection and read it there.
    paths:
      include:
        - '**/packages/frontend/src/components/CharacterSwitcher.tsx'
        - '**/packages/frontend/src/components/RpcLagBanner.tsx'
        - '**/packages/frontend/src/design_harness_main.jsx'
        - '**/packages/frontend/src/game/screens/hud/DeckCluster.jsx'
        - '**/packages/frontend/src/game/screens/hud/EntityTooltip.jsx'
        - '**/packages/frontend/src/game/screens/hud/FightControls.jsx'
        - '**/packages/frontend/src/game/screens/hud/FightPlacementBanner.jsx'
        - '**/packages/frontend/src/game/screens/hud/FightReport.jsx'
        - '**/packages/frontend/src/game/screens/hud/FightResult.jsx'
        - '**/packages/frontend/src/game/screens/hud/FightSummary.jsx'
        - '**/packages/frontend/src/game/screens/hud/FightTimeline.jsx'
        - '**/packages/frontend/src/game/screens/hud/PendingOutcomeBadge.jsx'
        - '**/packages/frontend/src/game/screens/hud/SpellBar.jsx'
        - '**/packages/frontend/src/game/screens/hud/TurnBanner.jsx'
        - '**/packages/frontend/src/game/screens/hud/use_target_prediction.js'
        - '**/packages/frontend/src/game/screens/hud/world/DungeonBoard.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/DungeonLeaveButton.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/FightSyncIndicator.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/GameWorldHud.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/PartyFrame.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/RewardRecap.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/SelfPlate.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/WorldChat.jsx'
        - '**/packages/frontend/src/world-shell/voxel_fight_adapter.js'
    pattern-either:
      - patterns:
          - pattern: useFight(...)
          - pattern-not: useFight(world_fight_view)
      - pattern: useGameState(...)
      - pattern: use_dungeon(...)
      - pattern: use_expedition(...)
      - pattern: use_party(...)
      - pattern: get_characters(...)
      - pattern: get_fights(...)
      - pattern: find_pending_outcome(...)
      - pattern: resolve_character_docs(...)
      - pattern: get_template_by_item_type_map(...)
      - pattern: get_template_detail_map(...)
      - pattern: resolve_rolled_stats(...)

  - id: arch-coop-visible-source-bypass
    languages: [js, ts]
    severity: ERROR
    message: Coop-visible consumer bypasses coop_visible_view; add the fact/provenance to the canonical view and select it there.
    paths:
      include:
        - '**/packages/frontend/src/GameWorldHost.tsx'
        - '**/packages/frontend/src/components/CharacterSwitcher.tsx'
        - '**/packages/frontend/src/game/remote_players.js'
        - '**/packages/frontend/src/game/screens/hud/Minimap.jsx'
        - '**/packages/frontend/src/game/screens/hud/PendingOutcomeBadge.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/FightsModal.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/OnlinePlayers.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/PartyFrame.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/PlayerActionMenu.jsx'
        - '**/packages/frontend/src/game/screens/hud/world/WorldChat.jsx'
    pattern-either:
      - pattern: use_party(...)
      - pattern: use_party.getState()
      - pattern: use_world_binding(...)
      - pattern: use_world_binding.getState()
      - pattern: use_presence(...)
      - pattern: use_presence.getState()
      - pattern: useGameState(...)
      - pattern: useGameState.getState()
      - pattern: use_dungeon(...)
      - pattern: use_dungeon.getState()
      - pattern: context.get_state()
      - pattern: get_characters(...)
      - pattern: get_fights(...)
      - pattern: find_pending_outcome(...)
      - pattern: resolve_character_docs(...)
      - pattern: presence_character(...)
      - pattern: presence_character_by_address(...)
      - pattern: presence_characters_by_address(...)
      - pattern: get_group_follow_snapshot(...)
      - pattern: peer_markers(...)
      - pattern: select_online_count(...)

  # ── L-P4 · the fight core executes NO effects ──────────────────────────────────────────────────
  # Census 2026-07-17: 0 awaits / 0 async fns / 0 .then / 0 new Promise across all 7 non-test
  # fight/ modules — effects are INJECTED (txs.js `deps.submit`; live submit lives in the context
  # shims, see fight/txs.js header). This rule freezes that: the core stays a pure sync reducer
  # surface; tests are exempt (paths below). ERROR-tier: clean today, any hit is a regression.
  # Known gap (semantics above): an `async` ARROW that never awaits/chains is unmatchable — its
  # first real effect (await/.then/Promise) still trips the rule.
  - id: arch-fight-effect-free
    languages: [js, ts]
    severity: ERROR
    metadata:
      law: L-P4
      doc: docs/CODE_LAW.md
    message: >-
      L-P4 — the fight core is promise-free by census (2026-07-17: zero effect machinery in all
      non-test fight/ modules). Effects are injected at the edge (fight/txs.js `deps.submit`, wired
      by the context shims); async results re-enter through the ONE input door
      (`input(msg, now)` / `apply_receipt`). Move the await/promise to the shim and pipe its result
      through `input` — never execute an effect inside the core.
    paths:
      include:
        - '**/packages/fight/src/**'
      exclude:
        - '**/*.test.js'
    pattern-either:
      - pattern: await $X
      - pattern: async function $F(...) { ... }
      - pattern: $P.then(...)
      - pattern: $P.catch(...)
      - pattern: $P.finally(...)
      - pattern: new Promise(...)
      - pattern: Promise.$M(...)

  # ── L-D2 · no store write smuggled into a functor mapping ─────────────────────────────────────
  # `map/filter/flatMap` are lawful transforms: `F.map(g).map(f) ≡ F.map(f∘g)` only holds when the
  # callback is pure. A store write inside one breaks the functor laws AND hides a state change in
  # what reads as data flow. (The lexical one-pipeline rule only sees this when the map sits inside
  # an async callback — this covers the sync-context form and the .jsx files eslint can't parse.)
  - id: arch-map-smuggled-store-write
    languages: [js, ts]
    severity: WARNING
    metadata:
      law: L-D2
      doc: docs/CODE_LAW.md
    message: >-
      L-D2 — a store write inside a map/filter/flatMap callback smuggles an effect into a functor
      mapping (map composition is only lawful over pure callbacks). Split it: derive the data with
      the mapping, then commit ONE store write with the result — or route it through the domain
      reducer's input door if this is an async re-entry.
    paths:
      include:
        - '**/packages/frontend/src/**'
      exclude:
        - '**/*.test.*'
        - '**/test_helpers/**'
    patterns:
      - pattern-either:
          - pattern-inside: $ARR.map((...) => { ... })
          - pattern-inside: $ARR.filter((...) => { ... })
          - pattern-inside: $ARR.flatMap((...) => { ... })
      - pattern-either:
          - pattern: $S.setState($...A)
          - pattern: $S.getState().$P = $V
  # ── L-D1/L-D2 · an await inside forEach = a dropped promise ───────────────────────────────────
  # `.forEach(async cb)` fires N promises nobody holds: failures cannot flow back as data (L-D1 —
  # no Either can catch a dropped promise), completion is unobservable, and the iterations race.
  # Anchored on the `await` (arrow async-ness is unmatchable — semantics note above); a
  # promise-returning call inside forEach WITHOUT await is invisible to this rule (needs types).
  - id: arch-foreach-async-dropped-promises
    languages: [js, ts]
    severity: WARNING
    metadata:
      law: L-D1
      doc: docs/CODE_LAW.md
    message: >-
      L-D1/L-D2 — an `await` inside a `.forEach` callback: forEach drops every promise its callback
      creates, so failures can never flow back as data and completion is unobservable. Use
      `for (const x of xs) await …` for sequential effects, or `await Promise.all(xs.map(async …))`
      when parallel — either way the caller holds the outcome.
    paths:
      include:
        - '**/packages/frontend/src/**'
      exclude:
        - '**/*.test.*'
        - '**/test_helpers/**'
    patterns:
      - pattern-either:
          - pattern-inside: $ARR.forEach((...) => { ... })
          - pattern-inside: $ARR.forEach(function (...) { ... })
          - pattern-inside: $ARR.forEach(function $NAME(...) { ... })
      - pattern: await $X
