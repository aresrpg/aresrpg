# GOLD STANDARD SUITE — one docker network: localnet + checkpoint store + indexer + read-api,
# ALL anchored to the same disposable localnet (docs/GOLD_STANDARD_SUITE.md §1). LOCALNET ONLY.
#
#   boot:  docker compose -f compose.gold.yml -p aresrpg-gold up -d
#   down:  docker compose -f compose.gold.yml -p aresrpg-gold down -v
#
# Port map (host, loopback-only — never collides with other local stacks: the primary dev localnet, or the rpc read-API stack):
#   9100 localnet JSON-RPC · 9223 faucet · 8083 checkpoint store · 6390 redis · 3100 /v1 read-api
#
# Image reuse: the localnet image is the gate lane's pinned 1.75.1 build (same Dockerfile context);
# indexer/api are the packages/rpc images — build blocks below only fire on a cold machine.

name: aresrpg-gold

services:
  localnet:
    build:
      context: ../localnet/harness
      dockerfile: Dockerfile
    image: aresrpg-localnet:1.75.1
    # TEST-RIG protocol dial (localnet only): raise max_move_package_size 100KB→256KB so the current-lineage
    # aresrpg package (104.7KB on this working tree) publishes to the disposable test chain. This is a test
    # localnet infra dial, NOT a gameplay fake — it does not alter any Move logic. NOTE (surfaced finding):
    # the package exceeding Sui's default 100KB (max_move_package_size=102400) means it is UNDEPLOYABLE to
    # testnet/mainnet as-is; that is a packages/move blocker for the publish lane, out of B0's fence.
    environment:
      SUI_PROTOCOL_CONFIG_OVERRIDE_ENABLE: '1'
      SUI_PROTOCOL_CONFIG_OVERRIDE_max_move_package_size: '262144'
    # Same retry-loop CMD as the harness (faucet/genesis race) + --data-ingestion-dir: the fullnode dumps
    # every executed checkpoint as /checkpoints/<seq>.chk — the exact file layout a remote checkpoint store
    # serves, which is how the UNMODIFIED Rust indexer ingests a localnet (REMOTE_STORE_URL → chk below).
    command:
      - sh
      - -c
      - |
        mkdir -p /checkpoints
        while true; do
          sui start --with-faucet=0.0.0.0:9123 --force-regenesis --fullnode-rpc-port 9000 --data-ingestion-dir /checkpoints
          echo 'sui start exited — regenesis retry'
          rm -rf /checkpoints/* 2>/dev/null || true
          sleep 1
        done
    ports:
      - '127.0.0.1:${GOLD_RPC_PORT:-9100}:9000'
      - '127.0.0.1:${GOLD_FAUCET_PORT:-9223}:9123'
    volumes:
      - checkpoints:/checkpoints
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -X POST http://127.0.0.1:9000 -H ''content-type: application/json'' -d ''{"jsonrpc":"2.0","id":1,"method":"sui_getChainIdentifier","params":[]}'' | grep -q result',
        ]
      interval: 3s
      timeout: 4s
      retries: 40
      start_period: 5s

  # A checkpoint "remote store" = plain static file serving of the ingestion dir (GET /<seq>.chk).
  chk:
    image: oven/bun:1.3-slim
    command:
      - bun
      - -e
      - |
        Bun.serve({
          port: 8083,
          async fetch(req) {
            const p = decodeURIComponent(new URL(req.url).pathname)
            if (p.includes('..')) return new Response('bad path', { status: 400 })
            const f = Bun.file('/checkpoints' + p)
            return (await f.exists()) ? new Response(f) : new Response('not found', { status: 404 })
          },
        })
        console.log('[chk] serving /checkpoints on :8083')
        await new Promise(() => {})
    volumes:
      - checkpoints:/checkpoints:ro
    ports:
      - '127.0.0.1:${GOLD_CHK_PORT:-8083}:8083'
    depends_on:
      localnet:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bun -e "await fetch(\"http://localhost:8083/\").then(r=>{if(r.status>=500)throw 0})"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Same digest pin as packages/rpc/docker-compose.yml. No volume: gold state is disposable per run.
    image: redis:8@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${GOLD_REDIS_PORT:-6390}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  indexer:
    build: ../../packages/rpc/indexer
    image: aresrpg-rpc-indexer:latest
    depends_on:
      redis:
        condition: service_healthy
      chk:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      REMOTE_STORE_URL: http://chk:8083
      NETWORK: localnet
      RUST_LOG: ${RUST_LOG:-info}
      # FIRST_CHECKPOINT / STREAMING_URL / ARES_PACKAGES deliberately ABSENT (clap Option/Vec pitfalls —
      # see packages/rpc/docker-compose.yml): genesis backfill + (module,name) event matching, correct for
      # a fresh localnet whose package ids regenerate every boot.
    restart: unless-stopped

  api:
    build: ../../packages/rpc/api
    image: aresrpg-rpc-api:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: '3000'
      REDIS_URL: redis://redis:6379
      NETWORK: localnet
      RATE_LIMIT_MAX: '10000' # a parallel suite hammers /v1 by design — never rate-limit the gate
      RATE_LIMIT_WINDOW_SEC: '60'
    ports:
      - '127.0.0.1:${GOLD_API_PORT:-3100}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Opt-in station primitive. SPONSOR_DEV_KEY is generated/funded by up_gold for this disposable chain only;
  # it is mapped to the station's GAS_POOL_KEYPAIR and never reaches api/sponsor.mjs or the manifest.
  gas-pool:
    profiles: ['sponsor']
    build: ../../packages/rpc/gas-pool
    image: aresrpg-gold-gas-pool:latest
    depends_on:
      localnet:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GAS_POOL_KEYPAIR: ${SPONSOR_DEV_KEY:?up_gold must inject a throwaway localnet sponsor key}
      GAS_POOL_REDIS_URL: redis://redis:6379
      SUI_FULLNODE_URL: http://localnet:9000
      GAS_POOL_PORT: '9527'
      GAS_POOL_DAILY_CAP: '2000000000'
      GAS_POOL_MAX_PER_REQUEST: '100000000'
      GAS_STATION_AUTH: gold-localnet-station-only
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://localhost:9527/\",{headers:{authorization:\"Bearer gold-localnet-station-only\"}}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  sponsor:
    profiles: ['sponsor']
    build: ../../api
    image: aresrpg-gold-sponsor:latest
    depends_on:
      gas-pool:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../packages/sdk/src/deployment:/packages/sdk/src/deployment:ro
      - ${GOLD_SPONSOR_RELEASE_PATH:-./.gold-sponsor-release.json}:/runtime/release.json:ro
    environment:
      SPONSOR_PORT: '9528'
      VITE_NETWORK: localnet
      SPONSOR_GRPC_URL: http://localnet:9000
      GAS_STATION_URL: http://gas-pool:9527
      GAS_STATION_AUTH: gold-localnet-station-only
      REDIS_URL: redis://redis:6379
      SPONSOR_DEV_BYPASS_ZKLOGIN: '1'
      SPONSOR_RELEASE_PATH: /runtime/release.json
    ports:
      - '127.0.0.1:${GOLD_SPONSOR_PORT:-9530}:9528'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://localhost:9528/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  checkpoints:
