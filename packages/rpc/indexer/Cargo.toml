[package]
name = "aresrpg-rpc-indexer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Read-only Sui checkpoint indexer for the AresRPG RPC — streams checkpoints into Redis."

[[bin]]
name = "aresrpg-rpc-indexer"
path = "src/main.rs"

[dependencies]
# --- Sui ingestion framework (Mysten) ---------------------------------------
# Pinned to the current mainnet rev, which matches the locally installed sui CLI
# (1.74.1-8fc60f1fa966). `default-features = false` drops the `cluster` / `postgres`
# stack (diesel, sui-pg-db) we never use — this indexer's store is Redis. The core
# Indexer, ingestion, pipeline and store traits are not feature-gated, and the
# checkpoint type is reached via the crate's `types` re-export (no direct
# sui-types dep, so we can never drift from the framework's sui-types version).
sui-indexer-alt-framework = { git = "https://github.com/MystenLabs/sui.git", rev = "8fc60f1fa966e90398c93beb67ad4f42992889c7", default-features = false }

# --- Store -------------------------------------------------------------------
# Redis 8 client. JSON.* / FT.* are issued as raw commands (redis::cmd), so no
# module-specific crate is needed — the query engine lives in the server.
redis = { version = "0.28", features = ["tokio-comp"] }

# --- Async runtime + framework trait glue ------------------------------------
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
scoped-futures = "0.1"
axum = "0.8"

# --- Metrics -----------------------------------------------------------------
# MUST match the framework's prometheus (0.14) so the `Registry` handed to
# `Indexer::new` is the same type. (0.13 was the predecessor's stale pin.)
prometheus = "0.14"

# --- Config / CLI / logging --------------------------------------------------
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Serialization + misc ----------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Move BCS — decodes on-chain event bodies (`event.contents`) into typed structs.
# TWO VERSIONS RESOLVE, deliberately: sui-types still locks bcs 0.1.x, so the tree carries 0.1.6
# alongside this 0.2.x. That is safe HERE and nowhere by default — BCS is a canonical wire format,
# not a crate-defined one: the same Rust type serialises to the same bytes under either version, and
# what changed across the major is the crate's API, not the encoding. This decoder only ever reads
# chain bytes into its own typed structs, and its round-trip tests are the proof.
# If a future type is ever handed ACROSS the boundary between the two versions, this note is wrong
# and the versions must be unified — a money decoder must never guess which BCS wrote a byte.
bcs = "0.2"
anyhow = "1"
hex = "0.4"
url = "2"
