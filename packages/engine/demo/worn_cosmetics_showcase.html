<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>AresRPG — Worn Cosmetics Showcase</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!--
      SCRATCH SHOWCASE — the equipped HAT + CLOAK on the roam avatar (the release-gap fix). NOT product code.
      Composes, scene-level: the REAL production avatar (create_character_avatar — senshi_male rig, IDLE) and
      the REAL engine capability the live roam player drives (create_worn_cosmetics — the aresrpg-legacy
      equip_hat/equip_cape mechanism: hat + cloak as Head/cape BONE CHILDREN; sui_helmet gets a
      measured fit; the rough0.4/metal0.35 worn material). Deterministic clock: window.__tick(dt) advances anim
      + orbit and draws ONE frame; window.__ready flips once the avatar + every REQUESTED worn slot has mounted
      + drawn. Params: ?head= ?back= (GLB urls) ?face= ?orbit= (deg) ?period= (s).
      [shop-asset render additions, 2026-07-13 — all opt-in, default (param-less) behavior UNCHANGED]:
      ?transparent=1 → alpha canvas, no clear color, no ground disc (product-cutout renders); ?spin=1 → a
      CONTINUOUS 360° camera orbit over `period` seconds instead of the sine sway (turntable video capture);
      ?aura=<STATUS_OVERLAY key> → attaches the real on-model status-glow (vfx_model_overlay.js) once ready;
      window resize now re-sizes the renderer/camera (was fixed-at-boot) so a batch script can render one GLB
      parse at multiple pixel sizes, the render_mob_icons.mjs two-tier idiom.
    -->
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer } from 'three/webgpu'
      import { create_character_avatar } from '/src/player/character_avatar.js'
      import { create_worn_cosmetics } from '/src/player/worn_cosmetics.js'
      import { attach_status_overlay, STATUS_OVERLAY } from '/src/render/vfx_model_overlay.js'

      const q = new URLSearchParams(location.search)
      // [issue #74 triage] '/sui_helmet.glb' (engine/public) was removed — cosmetics serve off the
      // Walrus CDN at runtime via a manifest fetch this standalone demo doesn't wire (no @aresrpg/sdk
      // dependency here). No safe default URL to hardcode, so the head slot is opt-in via ?head=<url>
      // and empty otherwise (HEAD || null below already treats '' as "no head cosmetic requested").
      const HEAD = q.get('head') || ''
      const BACK = q.get('back') || '' // a cloak GLB (spec routes it from ./models/equipment)
      const FACE = q.has('face') ? Number(q.get('face')) : 0 // 0 ⇒ face the +Z camera (front view)
      const ORBIT = (q.has('orbit') ? Number(q.get('orbit')) : 42) * (Math.PI / 180)
      const PERIOD = q.has('period') ? Number(q.get('period')) : 9
      const TRANSPARENT = q.has('transparent')
      const SPIN = q.has('spin')
      const AURA_KEY = q.get('aura') || ''

      try {
        // The page's own CSS (html,body{background:#0a0a0f}) composites UNDER the canvas before any
        // screenshot is taken — Playwright's omitBackground only suppresses ITS OWN default white page
        // background, it can't undo an explicit CSS color already painted there. Clear both so a
        // transparent-cleared WebGPU canvas actually reads back as transparent.
        if (TRANSPARENT) {
          document.documentElement.style.background = 'transparent'
          document.body.style.background = 'transparent'
        }
        const canvas = document.getElementById('c')
        const renderer = new WebGPURenderer({ canvas, antialias: true, alpha: TRANSPARENT })
        await renderer.init()
        renderer.setPixelRatio(1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        if (TRANSPARENT) renderer.setClearColor(0x000000, 0)
        else renderer.setClearColor(0x0a0a0f, 1)

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200)

        if (!TRANSPARENT) {
          const ground = new THREE.Mesh(
            new THREE.CircleGeometry(6, 64),
            new THREE.MeshStandardMaterial({ color: 0x0e0e16, roughness: 1 })
          )
          ground.rotation.x = -Math.PI / 2
          ground.receiveShadow = true
          scene.add(ground)
        }
        scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x14121a, 1.15))
        const key = new THREE.DirectionalLight(0xf5d0a9, 1.6)
        key.position.set(3, 6, 5)
        scene.add(key)
        const rim = new THREE.DirectionalLight(0x4a9eff, 1.2)
        rim.position.set(-4, 3, -5)
        scene.add(rim)

        // The REAL production avatar + the REAL worn rig (the live embed_voxel_player path). Bone children —
        // no scene membership, no per-frame pose: exactly the legacy equip_hat/equip_cape shape.
        const avatar = create_character_avatar({ cast_shadow: true })
        scene.add(avatar.object3d)
        const worn = create_worn_cosmetics({ avatar })
        const want = { head: HEAD || null, back: BACK || null }
        const requested = Object.entries(want)
          .filter(([, v]) => v)
          .map(([k]) => k)

        const TARGET = new THREE.Vector3(0, q.has('ty') ? Number(q.get('ty')) : 1.3, 0)
        const R = q.has('camr') ? Number(q.get('camr')) : 3.6
        const CAM_Y = q.has('camy') ? Number(q.get('camy')) : 1.65
        let t = 0
        let drew = false
        let aura = null // attach_status_overlay handle, once (avatar ready + AURA_KEY resolved)

        function draw_frame() {
          // SPIN (video turntable): one full 360° revolution over PERIOD seconds. Default (sine sway): the
          // original showcase sweep — UNCHANGED.
          const ang = SPIN ? (t / PERIOD) * Math.PI * 2 : Math.sin((t / PERIOD) * Math.PI * 2) * ORBIT
          camera.position.set(Math.sin(ang) * R, CAM_Y, Math.cos(ang) * R)
          camera.lookAt(TARGET)
          renderer.render(scene, camera)
          drew = true
        }

        function tick(dt) {
          t += dt
          if (avatar.ready) {
            avatar.object3d.rotation.y = FACE
            avatar.tick(dt)
            worn.set_slots(want) // idempotent — mounts each requested slot once its GLB resolves
            if (!aura && AURA_KEY && STATUS_OVERLAY[AURA_KEY])
              aura = attach_status_overlay(avatar.object3d, STATUS_OVERLAY[AURA_KEY])
            if (aura) aura.update(dt)
          }
          draw_frame()
        }
        window.__tick = tick

        window.addEventListener('resize', () => {
          renderer.setSize(window.innerWidth, window.innerHeight)
          camera.aspect = window.innerWidth / window.innerHeight
          camera.updateProjectionMatrix()
          draw_frame()
        })

        // deterministic seek: jump to absolute clock `target`, pose once, draw one frame.
        window.__seek = (target) => {
          const dt = Math.max(0, target - t)
          t = target
          if (avatar.ready) {
            avatar.object3d.rotation.y = FACE
            avatar.tick(dt)
            worn.set_slots(want)
            if (!aura && AURA_KEY && STATUS_OVERLAY[AURA_KEY])
              aura = attach_status_overlay(avatar.object3d, STATUS_OVERLAY[AURA_KEY])
            if (aura) aura.update(dt)
          }
          draw_frame()
        }

        let last = performance.now()
        let live = true
        window.__stop_live = () => {
          live = false
        }
        const loop = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000)
          last = now
          if (live) tick(dt)
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)

        // __ready = the avatar loaded + drawn AND every REQUESTED worn slot has mounted (provenance-gated).
        Object.defineProperty(window, '__ready', {
          get: () => {
            if (!(avatar.ready && drew)) return false
            const m = worn.mounted()
            return requested.every((slot) => m[slot])
          },
        })
        window.__info = () => ({
          avatar_ready: !!avatar.ready,
          drew,
          requested,
          worn: worn.mounted(),
        })
      } catch (err) {
        window.__fatal = String(err && err.message ? err.message : err)
        console.error('[worn-showcase] fatal', err)
      }
    </script>
  </body>
</html>
