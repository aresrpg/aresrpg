<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>AresRPG — Sui Helmet + Aura Showcase</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!--
      SCRATCH SHOWCASE (deliverable: "a character wearing a Sui hat and his aura"). NOT product code.
      Composes, scene-level: the REAL production avatar (create_character_avatar — senshi_male rig, IDLE anim,
      CHARACTER_HEIGHT scaling), the sui_helmet.glb cosmetic mounted on the rig's REAL 'Head' bone (the same
      attach point create_character_avatar uses for hair — the cosmetic-hat path), and the water/blue status
      aura (create_vfx_preset — sui_helmet pinned to water; default preset=remnant_water, the frontend's
      own water VFX per vfx_map.js). Deterministic clock: window.__tick(dt) advances anim+aura+orbit and draws
      ONE frame (even-spaced PNG capture); window.__ready flips true once avatar+helmet loaded and drawn once.
      Params: ?preset= ?ascale= ?hscale= ?hy= ?hrot= ?face= ?orbit= (deg amplitude) ?period= (s).
    -->
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer } from 'three/webgpu'
      import { create_character_avatar, get_glb_loader, apply_avatar_material } from '/src/player/character_avatar.js'
      import { create_vfx_preset } from '/src/render/vfx_preset_engine.js'
      import { PRESETS } from '/src/render/vfx_presets_data.js'
      import { attach_status_overlay, STATUS_OVERLAY } from '/src/render/vfx_model_overlay.js'

      const q = new URLSearchParams(location.search)
      // [2026-07-12] the on-body aura rebuild landed status_ice (STATUS.ice: pale-cyan hot / medium-blue body,
      // ice_flake look) — the actual worn on-body aura, not the old remnant_water CAST-linger ground puddle
      // this defaulted to before that lane landed (checked live: PRESETS.status_water does NOT exist — "water"
      // resolves to the STATUS shelf's "ice" entry, the closest blue/water-toned worn aura).
      const PRESET = q.get('preset') || 'status_ice'
      // [issue #74 triage] '/sui_helmet.glb' (engine/public) was removed — cosmetics serve off the
      // Walrus CDN at runtime, resolved via a manifest fetch this standalone demo doesn't wire (no
      // @aresrpg/sdk dependency here). No safe default URL to hardcode without one, so the helmet
      // load is now opt-in via ?helmet=<url> (any reachable GLB) and skipped entirely otherwise —
      // the avatar + aura still render and drive __ready (helmet was always best-effort, see __info).
      const HELMET_URL = q.get('helmet') || ''
      const ASCALE = q.has('ascale') ? Number(q.get('ascale')) : 1.25
      const HSCALE = q.has('hscale') ? Number(q.get('hscale')) : 1
      const HY = q.has('hy') ? Number(q.get('hy')) : 0 // vertical nudge (m) on the head
      const HROT = q.has('hrot') ? Number(q.get('hrot')) : 0 // helmet yaw (rad)
      const FACE = q.has('face') ? Number(q.get('face')) : Math.PI // avatar facing yaw (π ⇒ face toward +Z camera)
      const ORBIT = (q.has('orbit') ? Number(q.get('orbit')) : 42) * (Math.PI / 180) // sweep amplitude
      const PERIOD = q.has('period') ? Number(q.get('period')) : 9 // seconds per full oscillation

      /** find first bone whose name contains `name` (character_avatar's proven rule, e.g. 'mixamorig:Head'). */
      const find_bone = (origin, name) => {
        let bone = null
        const want = name.toLowerCase()
        origin.traverse((o) => {
          if (!bone && o.isBone && o.name.toLowerCase().includes(want)) bone = o
        })
        return bone
      }

      try {
        const canvas = document.getElementById('c')
        const renderer = new WebGPURenderer({ canvas, antialias: true })
        await renderer.init()
        renderer.setPixelRatio(1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setClearColor(0x0a0a0f, 1)

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200)

        // ── house dark backdrop: a subtle top spotlight + a dark ground disc so the character isn't in a void.
        // (WebGPURenderer auto-converts MeshStandardMaterial to a node material — the avatar rig relies on the same.)
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(6, 64),
          new THREE.MeshStandardMaterial({ color: 0x0e0e16, roughness: 1 })
        )
        ground.rotation.x = -Math.PI / 2
        ground.receiveShadow = true
        scene.add(ground)

        scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x14121a, 1.15))
        const key = new THREE.DirectionalLight(0xf5d0a9, 1.6) // warm gold key (house accent)
        key.position.set(3, 6, 5)
        scene.add(key)
        const rim = new THREE.DirectionalLight(0x4a9eff, 1.2) // cyan rim (house secondary) from behind
        rim.position.set(-4, 3, -5)
        scene.add(rim)

        // ── REAL production avatar (senshi_male rig, IDLE). Feet at origin.
        const avatar = create_character_avatar({ cast_shadow: true })
        scene.add(avatar.object3d)

        // ── sui_helmet cosmetic → CAP the character's HEAD. The helmet is MEASURED against the head bbox (the
        //    voxel head = the vertices skinned to the 'Head' bone) and scaled so it sits OVER the head like a worn
        //    helmet: outer width = head width × WOVER (slight overhang), centred on the head, vertical anchor VADJ.
        //    A pivot Group anchored to the head bone tracks the idle head motion. Tunables: ?wover ?vadj ?zadj ?hrot.
        // FITTED 2026-07-12 (waypoint: "the sui helm shell sits slightly forward — scale up a touch and
        // shift back to engulf the crown"): WOVER 1.22→1.28 (a touch more overhang so the dome fully clears the
        // crown/temple silhouette from every angle — verified front + 45° + profile, no new clipping), ZADJ
        // 0→-0.06 (shift back, fraction of head depth), HPITCH 0→-0.05 rad (tip the crown back slightly so the
        // rear lip drops over the skull instead of floating), VADJ 0→-0.015 (a hair lower so the front lip
        // overlaps the brow line). Verified: zero face/skin clipping at front, 45°, and full 90° profile.
        // REFIT 2026-07-12b ("helmets seems too low, from the back it looks like there is no neck at
        // all, and it could be bigger for a chibi look"): WOVER 1.28→1.4 (bigger dome/overhang — chibi-scaled,
        // verified 1.4-1.5 by eye, 1.4 was the largest that still cleared the neck; 1.45+ re-swallowed it —
        // WOVER growth extends the dome's bottom rim down almost as fast as VADJ raises it, so they trade off).
        // VADJ -0.015→0.35 (a MUCH bigger raise than it looks: fit_helmet() re-centers the WHOLE scaled mesh
        // on every WOVER change, so a modest-looking VADJ bump gets largely eaten by the size increase — swept
        // 0.08/0.16/0.24 first with near-zero visible gap, then 0.35/0.5/0.7: 0.5+ visibly FLOATS the dome off
        // the crown, 0.35 is the largest raise with zero floating and a clean neck gap front AND back — proof
        // stills: /tmp/aresrpg-engine-artifacts/helmet/push_v35_{front,back}.png). ZADJ/HPITCH unchanged (only
        // asked to raise + resize, not re-pitch — no new forward/back clipping observed at the new scale).
        const WOVER = q.has('wover') ? Number(q.get('wover')) : 1.4 // helmet outer width / head width (overhang)
        const VADJ = q.has('vadj') ? Number(q.get('vadj')) : 0.35 // vertical anchor, fraction of head height (+ = up)
        const ZADJ = q.has('zadj') ? Number(q.get('zadj')) : -0.06 // depth nudge, fraction of head depth (+ = forward/+z)
        const HPITCH = q.has('hpitch') ? Number(q.get('hpitch')) : -0.05 // helmet pitch (rad; NEGATIVE tips the crown BACK)
        // The sui helm is a legacy-corpus Armor_*_Helmet-style visible-slot appearance: a FULL-HEAD REPLACEMENT (it has its own
        // visor/eyes), not a cap — SPEC §7.11 renders headgear INSTEAD of the head appearance. Scene equivalent:
        // collapse the Head bone (hides the head block) and mount the helm AS the head. ?headscale=1 to disable.
        const HEADSCALE = q.has('headscale') ? Number(q.get('headscale')) : 0.01
        // Material shine ("material for helmets should be a bit more shiny"). The GLB's
        // own material is neutralised by apply_avatar_material (metalness→0; this scene has NO envmap, so
        // metalness renders flat black with only direct-light specular). Reapply a MODEST metalness + lower
        // roughness afterward: roughness carries the "shine" as a tighter specular highlight from the key/rim
        // directional lights, a little metalness adds a subtle cool tint to that highlight without going black.
        const ROUGH = q.has('rough') ? Number(q.get('rough')) : 0.4
        const METAL = q.has('metal') ? Number(q.get('metal')) : 0.35
        const helmet_pivot = new THREE.Group()
        scene.add(helmet_pivot)
        let head_bone = null
        let helmet_ready = false
        let helmet_mesh = null
        let helmet_raw_box = null
        let fitted = false
        const HDEBUG = q.get('hdebug') === '1'
        if (HELMET_URL)
          get_glb_loader().load(
            HELMET_URL,
            (gltf) => {
              helmet_mesh = gltf.scene
              apply_avatar_material(helmet_mesh) // kill metalness=1 (renders black without an envmap)
              helmet_mesh.traverse((o) => {
                if (!o.isMesh || !o.material) return
                for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
                  if (m && 'roughness' in m) m.roughness = ROUGH
                  if (m && 'metalness' in m) m.metalness = METAL
                }
              })
              // runtime provenance for the material sweep: read the values BACK off the live mesh
              // (not the requested constants) so a probe can prove the override actually landed.
              window.__mat_probe = () => {
                const out = []
                helmet_mesh.traverse((o) => {
                  if (!o.isMesh || !o.material) return
                  for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
                    if (m) out.push({ type: m.type, roughness: m.roughness, metalness: m.metalness })
                  }
                })
                return out
              }
              if (HDEBUG)
                helmet_mesh.traverse((o) => {
                  if (o.isMesh) {
                    o.material = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.55 })
                    o.frustumCulled = false
                  }
                })
              helmet_raw_box = new THREE.Box3().setFromObject(helmet_mesh) // helmet-local bounds (before scaling)
              helmet_pivot.add(helmet_mesh)
              helmet_ready = true // fit happens once the head bone is measurable (track_helmet → fit_helmet)
            },
            undefined,
            (err) => {
              window.__helmet_err = String(err && err.message ? err.message : err)
              console.error('[sui-showcase] helmet GLB load failed', err)
            }
          )

        /** Measure the HEAD bbox in world space = bounds of the vertices whose dominant skin weight is the 'Head'
         *  bone (the voxel head block). Returns a Box3 or null. */
        function measure_head_box() {
          let skinned = null
          avatar.object3d.traverse((o) => {
            if (!skinned && o.isSkinnedMesh) skinned = o
          })
          if (!skinned) return null
          const head_idx = skinned.skeleton.bones.findIndex((b) => b.name.toLowerCase().includes('head'))
          if (head_idx < 0) return null
          skinned.updateMatrixWorld(true)
          const geo = skinned.geometry
          const pos = geo.attributes.position
          const si = geo.attributes.skinIndex
          const sw = geo.attributes.skinWeight
          const box = new THREE.Box3()
          const v = new THREE.Vector3()
          let n = 0
          for (let i = 0; i < pos.count; i += 1) {
            let w = 0
            for (let k = 0; k < 4; k += 1) if (si.getComponent(i, k) === head_idx) w += sw.getComponent(i, k)
            if (w >= 0.5) {
              skinned.getVertexPosition(i, v).applyMatrix4(skinned.matrixWorld)
              box.expandByPoint(v)
              n += 1
            }
          }
          return n > 0 ? box : null
        }

        /** Scale + place the helmet so it CAPS the measured head box (outer width = head width × WOVER). Runs once. */
        function fit_helmet() {
          const hb = measure_head_box()
          if (!hb || !helmet_mesh || !helmet_raw_box) return false
          const hs = new THREE.Vector3()
          hb.getSize(hs)
          const hc = new THREE.Vector3()
          hb.getCenter(hc)
          const hr = new THREE.Vector3()
          helmet_raw_box.getSize(hr)
          const head_w = Math.max(hs.x, hs.z)
          const fit = (head_w * WOVER) / Math.max(hr.x, hr.z) // uniform scale, fit by the wider horizontal dim
          // apply scale + rotation FIRST, then align by the MEASURED world box — placement is then exact
          // regardless of where the GLB's origin sits (a pitch about the origin was translating the dome).
          helmet_mesh.scale.setScalar(fit)
          helmet_mesh.rotation.set(HPITCH, HROT, 0)
          helmet_mesh.position.set(0, 0, 0)
          helmet_mesh.updateMatrixWorld(true)
          const wb = new THREE.Box3().setFromObject(helmet_mesh)
          const wc = new THREE.Vector3()
          wb.getCenter(wc)
          const desired = new THREE.Vector3(hc.x, hc.y + VADJ * hs.y, hc.z + ZADJ * hs.z)
          const delta_world = desired.sub(wc)
          const inv = helmet_pivot.getWorldQuaternion(new THREE.Quaternion()).invert()
          helmet_mesh.position.copy(delta_world.applyQuaternion(inv))
          window.__fit = {
            head_box_world: [hb.min.x, hb.min.y, hb.min.z, hb.max.x, hb.max.y, hb.max.z].map((n) => +n.toFixed(3)),
            head_size: [hs.x, hs.y, hs.z].map((n) => +n.toFixed(3)),
            head_center: [hc.x, hc.y, hc.z].map((n) => +n.toFixed(3)),
            helmet_scale: +fit.toFixed(4),
            helmet_local_offset: [helmet_mesh.position.x, helmet_mesh.position.y, helmet_mesh.position.z].map(
              (n) => +n.toFixed(3)
            ),
            wover: WOVER,
            vadj: VADJ,
            zadj: ZADJ,
            hrot: HROT,
          }
          return true
        }

        const AURA_ON = q.get('aura') !== 'off'
        const AY = q.has('ay') ? Number(q.get('ay')) : 0.15 // aura origin height
        const TINT = q.has('tint') ? q.get('tint').split(',').map(Number) : null // [r,g,b] element recolour
        const EMISSION = q.has('emission') ? Number(q.get('emission')) : 1
        const SALT = q.has('salt') ? Number(q.get('salt')) : 0 // reseed the emitters (dodge seed outliers)
        const aura = AURA_ON
          ? create_vfx_preset(PRESETS[PRESET], {
              position: [0, AY, 0],
              scale: ASCALE,
              tint: TINT,
              emission: EMISSION,
              salt: SALT,
            })
          : { object3d: new THREE.Group(), update: () => {}, particle_count: 0 }
        scene.add(aura.object3d)

        // ON-MODEL STATUS OVERLAY — the worn-cosmetic BODY glow: the create_status_overlay shell mounted on the
        // avatar's OWN skinned mesh via attach_status_overlay — the EXACT engine capability the live roam avatar
        // uses (embed_voxel_player.js). sui_helmet→water = the "blue" overlay (STATUS_OVERLAY.water). ?overlay=<key>
        // swaps the element, ?overlay=off disables. Mounted lazily in tick() once the rig has loaded its mesh.
        const OVERLAY = q.get('overlay') || 'water'
        let body_overlay = null

        // Camera tunables (?camr= orbit radius, ?camy= camera height, ?ty= look-at height) — default is the
        // full-character SHOWCASE framing (deliverable: "a character wearing a Sui hat and his aura" —
        // needs the whole body + the aura shell in frame, not just the head), verified 2026-07-12 as the
        // actual video-capture framing (bench/_helmet_video_record.spec.js). For close head-only fit-checking
        // (judging helmet-vs-skull clipping) pass ?camr=2.7&camy=1.72&ty=1.62 instead.
        const TARGET = new THREE.Vector3(0, q.has('ty') ? Number(q.get('ty')) : 1.3, 0)
        const R = q.has('camr') ? Number(q.get('camr')) : 3.6
        const CAM_Y = q.has('camy') ? Number(q.get('camy')) : 1.65
        let t = 0
        let drew = false

        function draw_frame() {
          // slow oscillating turntable centred on the front (±ORBIT), house "slow atmospheric" feel.
          const ang = Math.sin((t / PERIOD) * Math.PI * 2) * ORBIT
          camera.position.set(Math.sin(ang) * R, CAM_Y, Math.cos(ang) * R)
          camera.lookAt(TARGET)
          renderer.render(scene, camera)
          drew = true
        }

        function tick(dt) {
          t += dt
          if (avatar.ready) {
            // the rig auto-plays IDLE on load; just advance the mixer + hold the facing yaw.
            avatar.object3d.rotation.y = FACE
            avatar.tick(dt)
            // mount the body glow once the skinned mesh exists, then advance its noise scroll every frame.
            if (OVERLAY !== 'off' && !body_overlay && STATUS_OVERLAY[OVERLAY])
              body_overlay = attach_status_overlay(avatar.object3d, STATUS_OVERLAY[OVERLAY])
            body_overlay?.update(dt)
          }
          aura.update(dt)
          if (head_bone == null && avatar.ready) head_bone = find_bone(avatar.object3d, 'Head')
          track_helmet()
          draw_frame()
        }
        window.__tick = tick

        // Track ONLY the head bone's world POSITION; keep the helmet UPRIGHT and yawed with the body (FACE).
        // (The rig's head-bone world quaternion is tilted — bones orient along their length — so inheriting it
        //  cocks an upright-authored helmet into the skull; position + body-yaw is the correct hat transform.)
        function track_helmet() {
          if (head_bone && helmet_ready) {
            head_bone.getWorldPosition(helmet_pivot.position)
            helmet_pivot.rotation.set(0, FACE, 0)
            helmet_pivot.updateMatrixWorld()
            if (!fitted && avatar.ready) fitted = fit_helmet() // measure head + replace it, once
            // re-assert the head-replacement collapse EVERY frame — the IDLE clip may carry scale tracks
            // that would restore the head block mid-loop.
            if (fitted && HEADSCALE !== 1) head_bone.scale.setScalar(HEADSCALE)
          }
        }

        // controlled framing for diagnostics: jump to absolute clock `target` and draw one frame (no anim advance).
        window.__seek = (target) => {
          t = target
          if (avatar.ready) avatar.object3d.rotation.y = FACE
          if (head_bone == null && avatar.ready) head_bone = find_bone(avatar.object3d, 'Head')
          track_helmet()
          draw_frame()
        }

        // live preview loop until the driver takes over (driver calls __tick with fixed dt after pausing this)
        let last = performance.now()
        let live = true
        window.__stop_live = () => {
          live = false
        }
        const loop = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000)
          last = now
          if (live) tick(dt)
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)

        Object.defineProperty(window, '__ready', {
          get: () => Boolean(avatar.ready && drew), // helmet verified separately (info + pixels)
        })
        window.__info = () => {
          const hp = new THREE.Vector3()
          if (head_bone) head_bone.getWorldPosition(hp)
          let hbox = null
          if (helmet_mesh) {
            const b = new THREE.Box3().setFromObject(helmet_mesh)
            hbox = [b.min.x, b.min.y, b.min.z, b.max.x, b.max.y, b.max.z].map((n) => +n.toFixed(3))
          }
          return {
            preset: PRESET,
            particles: aura.particle_count,
            overlay: OVERLAY,
            overlay_shells: body_overlay?.count ?? 0, // runtime provenance: the on-model glow actually mounted
            avatar_ready: avatar.ready,
            has_head: !!head_bone,
            head_world_y: head_bone ? +hp.y.toFixed(3) : null,
            helmet_ready,
            fitted,
            helmet_world_box: hbox,
            fit: window.__fit || null,
            helmet_err: window.__helmet_err || null,
          }
        }
      } catch (e) {
        window.__probe_err = String(e && e.stack ? e.stack : e)
        console.error('[sui-showcase] FAILED', e)
      }
    </script>
  </body>
</html>
