<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>AresRPG — VFX Preset Probe</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!--
      FLAGSHIP VFX standalone preset proof. Renders ONE VfxPreset on its OWN WebGPURenderer (no engine, no
      AgX post — the AgX-survival is proven separately by the in-engine demo). The frame is DETERMINISTIC:
      ?preset=<name>&t=<seconds> sets the preset age to exactly t and renders that frame (frame-series capture
      + ms timing). Omit t to animate from 0. ?bg=<hex>. Sets window.__probe_ready on the first draw,
      window.__probe_err on any GPU/init failure, window.__probe_ms = preset build time (ms).
    -->
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer, MeshStandardNodeMaterial } from 'three/webgpu'
      import { create_vfx_preset } from '/src/render/vfx_preset_engine.js'
      import { PRESETS } from '/src/render/vfx_presets_data.js'
      import { follow_entity } from '/src/render/vfx_anchor.js'
      import {
        create_model_overlay,
        ELEMENT_OVERLAY,
        create_status_overlay,
        STATUS_OVERLAY,
      } from '/src/render/vfx_model_overlay.js'
      import { SphereGeometry, TorusKnotGeometry, CapsuleGeometry } from 'three'

      const q = new URLSearchParams(location.search)
      const name = q.get('preset') || 'ground_explosion_01'
      const fixed_t = q.has('t') ? Number(q.get('t')) : null
      const bg = q.has('bg') ? Number('0x' + q.get('bg')) : 0x0a0a12

      try {
        const preset = PRESETS[name]
        if (!preset && !q.has('overlay')) throw new Error(`unknown preset "${name}"`)
        const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('c'))
        const renderer = new WebGPURenderer({ canvas, antialias: true })
        await renderer.init()
        renderer.setPixelRatio(1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setClearColor(bg, 1)

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500)
        camera.position.set(0, 2.6, 9)
        camera.lookAt(0, 1.6, 0)

        // ON-BODY AURA proof (?aura=el1,el2,…): N character-proxy CAPSULES side by side, each WEARING a rebuilt
        // status aura = the on-model BODY GLOW (create_status_overlay — the capsule's OWN silhouette glows, NOT an egg)
        // + the aura/symbol particle preset ridden by the real follow_entity anchor + the optional backdrop. Matches the
        // pack all.png read. `el` = a shop aura name (ice/heal/dark/flame/…) → status_<el> + STATUS_OVERLAY[el].
        if (q.has('aura')) {
          const auras = String(q.get('aura') || 'ice,heal,dark,flame').split(',')
          scene.add(new THREE.HemisphereLight(0x8899aa, 0x0a0a12, 1.1))
          const n = auras.length
          const gap = 3.5
          camera.position.set(0, 2.3, 4 + n * 1.5)
          camera.lookAt(0, 1.35, 0)
          const rides = []
          auras.forEach((el, i) => {
            const x = (i - (n - 1) / 2) * gap
            const preset = PRESETS[`status_${el}`]
            if (!preset) return
            // the character proxy — a capsule ~3 tall standing on the floor (feet at y=0, torso ≈ 1.5).
            const body = new THREE.Mesh(
              new CapsuleGeometry(0.5, 2, 8, 20),
              new MeshStandardNodeMaterial({ color: 0x9aa0ad, roughness: 0.7 })
            )
            body.position.set(x, 1.5, 0)
            scene.add(body)
            // BODY GLOW — the on-model status_overlay on the capsule's OWN geometry (the silhouette glows, not an egg).
            const oc = STATUS_OVERLAY[el] || { primary: [0.9, 0.95, 1], secondary: [0.4, 0.6, 0.9] }
            const ov = create_status_overlay(body.geometry, oc)
            ov.mesh.position.copy(body.position)
            scene.add(ov.mesh)
            // the entity anchor: a feet-level node the aura FOLLOWS (the preset lifts its layers to the torso).
            const feet = new THREE.Object3D()
            feet.position.set(x, 0, 0)
            scene.add(feet)
            const handle = create_vfx_preset(preset, { scale: 1 })
            scene.add(handle.object3d)
            const anchor = follow_entity(handle, feet)
            anchor.update()
            rides.push({ handle, anchor, ov })
          })
          window.__probe_particles = rides.reduce((s, r) => s + r.handle.particle_count, 0)
          window.__probe_draws = rides.reduce((s, r) => s + r.handle.draw_calls, 0)
          const t_a = q.has('t') ? Number(q.get('t')) : null
          if (t_a != null)
            for (const r of rides) {
              r.handle.age.value = t_a
              r.ov.age.value = t_a
            }
          let last_a = performance.now()
          const loop_a = (now) => {
            for (const r of rides) {
              if (t_a == null) {
                r.handle.update((now - last_a) / 1000)
                r.ov.update((now - last_a) / 1000)
              }
              r.anchor.update()
            }
            last_a = now
            renderer.render(scene, camera)
            window.__probe_ready = true
            requestAnimationFrame(loop_a)
          }
          requestAnimationFrame(loop_a)
        } else if (q.has('overlay')) {
          // ON-MODEL OVERLAY proof (?overlay=<element>): mount a base mesh + the element fire-crawl overlay shell
          // (create_model_overlay), effect=1, so the pack's on-mesh material effect can be captured on real geometry.
          const el = q.get('overlay') || 'fire'
          const geo =
            q.get('mesh') === 'knot' ? new TorusKnotGeometry(1, 0.32, 128, 24) : new SphereGeometry(1.3, 48, 32)
          const base = new THREE.Mesh(geo, new MeshStandardNodeMaterial({ color: 0x222228, roughness: 0.7 }))
          base.position.set(0, 1.6, 0)
          scene.add(base)
          scene.add(new THREE.HemisphereLight(0x8899aa, 0x111119, 1.2))
          const ov = create_model_overlay(geo, ELEMENT_OVERLAY[el] || ELEMENT_OVERLAY.fire)
          ov.effect.value = 1
          ov.mesh.position.copy(base.position)
          scene.add(ov.mesh)
          const t_ov = q.has('t') ? Number(q.get('t')) : null
          if (t_ov != null) ov.age.value = t_ov
          let last_ov = performance.now()
          const loop_ov = (now) => {
            if (t_ov == null) ov.update((now - last_ov) / 1000)
            last_ov = now
            base.rotation.y += 0.004
            ov.mesh.rotation.y = base.rotation.y
            renderer.render(scene, camera)
            window.__probe_ready = true
            requestAnimationFrame(loop_ov)
          }
          requestAnimationFrame(loop_ov)
          window.__probe_particles = 0
          window.__probe_draws = 2
        } else {
          const scale = q.has('scale') ? Number(q.get('scale')) : 1 // spell presets frame better a touch bigger
          const t0 = performance.now()
          const handle = create_vfx_preset(preset, { position: [0, 0.5, 0], scale })
          window.__probe_ms = performance.now() - t0
          scene.add(handle.object3d)
          window.__probe_preset = name
          window.__probe_particles = handle.particle_count
          window.__probe_draws = handle.draw_calls

          // moving-emitter proof: `&travel=x,y,z` sets the travel-velocity uniform so a bolt's `trail` emitters shed
          // a world-static wake even in a single fixed-age frame (the head rides origin; the trail lags by travel·age).
          if (q.has('travel')) {
            const tv = String(q.get('travel')).split(',').map(Number)
            handle.travel.value.set(tv[0] || 0, tv[1] || 0, tv[2] || 0)
          }
          if (fixed_t != null) handle.age.value = fixed_t
          let last = performance.now()
          const loop = (now) => {
            if (fixed_t == null) handle.update((now - last) / 1000)
            last = now
            renderer.render(scene, camera)
            window.__probe_ready = true
            requestAnimationFrame(loop)
          }
          requestAnimationFrame(loop)
        }
      } catch (e) {
        window.__probe_err = String(e && e.stack ? e.stack : e)
        console.error('[vfx-probe] FAILED', e)
      }
    </script>
  </body>
</html>
