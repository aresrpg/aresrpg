<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- S-17a ON-CHAIN BINDING SEAMS standalone demo — drives the gather glow (seam 3) + phase-out
         visibility (seam 4) behind ?seam= flags, defaults-off (engine worker law). Same canvas/gate skeleton. -->
    <link rel="icon" href="data:," />
    <title>AresRPG Engine — World Binding Seams</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0f;
        overflow: hidden;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #c8963c;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        padding: 24px;
        z-index: 100;
      }
      #gate[data-hidden='true'] {
        display: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        color: #8cf7b0;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        z-index: 50;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="gate">Booting world binding seams…</div>
    <script type="module" src="./binding_main.js"></script>
  </body>
</html>
