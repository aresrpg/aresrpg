<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ENG-18 WORLD BORDER standalone demo entry — decoupled from main.js so the border acceptance
         doesn't depend on the concurrent ENG-19/20 main.js edits. Same canvas/gate skeleton. -->
    <link rel="icon" href="data:," />
    <title>AresRPG Engine — World Border</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0f;
        overflow: hidden;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #c8963c;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        padding: 24px;
        z-index: 100;
      }
      #gate[data-hidden='true'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="gate">Booting world border…</div>
    <script type="module" src="./border_main.js"></script>
  </body>
</html>
