<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>AresRPG — Particle Kind Probe (B7)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <!--
      Standalone particle-kind proof (ENGINE_AAA_PLAN §8 B7 pose bar + the S-AMBIENCE TORMENTOR gauntlet).
      Renders ONE PARTICLE_KINDS field on its OWN WebGPURenderer (no engine, no bloom pass — the no-bloom law
      is proven separately by the colour-cap unit test) so the benches can screenshot each kind in isolation.
        ?kind=firefly|pollen|ember|snow|leaf|mote|ambient|bubble|sand   ?count=N   ?tod=night|noon (bg)
        ?frame=front|asym|moved|altitude — THE TARGET FRAMING CLASSES (pose-pin: asymmetric / far-moved /
             elevated), the gauntlet's radial-histogram poses (no camera-concentric arc-shells at any pose).
        ?soak=1 — the moving-camera 20s webm proof: the camera translates + sweeps its look so nothing can
             stay glued to screen-centre (the "huge circle following me" would ride the camera — this exposes it).
      Sets window.__probe_ready once the first frame draws; window.__probe_err on any GPU/init failure.
    -->
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer, SpriteNodeMaterial } from 'three/webgpu'
      import * as TSL from 'three/tsl'
      import { create_particles, advance_gust, PARTICLE_KINDS } from '/src/render/particles.js'

      const q = new URLSearchParams(location.search)
      const kind = q.get('kind') || 'firefly'
      const count = Number(q.get('count') || 500)
      const soak = q.get('soak') === '1'
      // ── DEPTH-FEEL PROOF rig (the parallax fix) — ADDITIVE, gated by ?scene; the gauntlet's default path
      // (no ?scene) is byte-untouched. scene=parallax adds depth-cue geometry (grid + posts at varied depths)
      // and a lateral STRAFE camera so world-anchored motes visibly parallax; scene=occluder adds an opaque
      // wall so depth-tested motes vanish behind it. anchor=camera swaps in the PRE-FIX camera-locked field
      // for the before/after A/B (default 'world' = the shipped create_particles). ?camx pins the camera X
      // (deterministic still frames — a spec may mutate window.__probe.camx live); ?strafe=1 auto-sweeps it
      // (webm). ?depthtest=0 forces the field depthTest off (the HUD-bug "before" for the occlusion tell).
      const scene_mode = q.get('scene') || '' // '' | 'parallax' | 'occluder' | 'bare'
      const anchor = q.get('anchor') || 'world' // 'world' (shipped) | 'camera' (pre-fix A/B shim)
      const strafe = q.get('strafe') === '1'
      // ?freeze=1 pins the field's TIME + gust after warm-up so ONLY the camera strafe moves it — the parallax
      // metric needs a saturation-free A/B (a camera-locked field then diffs to ~0, the world field to pure
      // depth parallax). Freezing three's nodeFrame.time (it accrues performance.now() deltas) + holding GUST.
      const freeze = q.get('freeze') === '1'
      const state = { camx: q.get('camx') != null ? Number(q.get('camx')) : null }
      window.__probe = state
      // THE TARGET FRAMING CLASSES — each an INSIDE-the-box view (the field is camera-centred) looking
      // outward, the exact viewing condition THE TORMENTOR arc-shells appeared under. `moved` is at a far
      // world coordinate (re-centre + large-coord fract proof); `altitude` is elevated looking down-out.
      const FRAMES = {
        front: { pos: [0, 30, 12], look: [0, 28, -8] },
        asym: { pos: [0, 31, 10], look: [18, 22, -14] }, // off-axis diagonal (catches axis-aligned structure)
        moved: { pos: [1024, 40, -768], look: [1030, 34, -784] }, // far world offset, same relative framing
        altitude: { pos: [0, 118, 22], look: [0, 96, -34] }, // high, looking down across the field
      }
      const frame = FRAMES[q.get('frame')] || FRAMES.front
      // Background per kind so the read is honest (fireflies against night, pollen in a lit meadow, …).
      const BG = {
        firefly: 0x07070c,
        ember: 0x0c0604,
        pollen: 0x33421f,
        snow: 0x8a99a8,
        leaf: 0x18280f,
        mote: 0x14140f,
        ambient: 0x14140f,
        bubble: 0x0a2735,
        sand: 0x6b5836,
      }
      const tod = q.get('tod')
      const bg = tod === 'noon' ? 0x33421f : tod === 'night' ? 0x07070c : (BG[kind] ?? 0x0a0a0f)

      // A/B SHIM (before/after proof ONLY — demo-scoped, NOT production): the EXACT pre-fix camera-locked
      // positionNode for a NAMED kind — a fract wrap in a box RE-CENTRED ON THE CAMERA every frame, so each mote
      // holds a CONSTANT offset from the camera ⇒ a fixed screen position (the "particles on screen" sticker). It
      // mirrors create_particles' kind params (size/colour/motion) EXACTLY, so a kind=mote A/B differs ONLY in
      // the anchoring (the whole point). Kept here, not in src, so production carries no dead comparison branch.
      function make_camera_locked_field(kind_name, n, alpha) {
        const kp = PARTICLE_KINDS[kind_name]
        if (!kp) throw new Error(`camera-locked shim needs a named kind, got "${kind_name}"`)
        const T = TSL
        const seeds = T.instancedArray(n, 'vec4')
        const params = T.instancedArray(n, 'vec4')
        const kernel = T.Fn(() => {
          const i = T.instanceIndex
          T.If(i.greaterThanEqual(n), () => {
            T.Return()
          })
          const fi = T.float(i)
          seeds.element(i).assign(T.vec4(T.hash(fi.add(11.1)), T.hash(fi.add(22.2)), T.hash(fi.add(33.3)), 0))
          params.element(i).assign(T.vec4(T.hash(fi.add(55.5)).mul(Math.PI * 2), T.hash(fi.add(66.6)), 0, 0))
        })().compute(n)
        const mat = new SpriteNodeMaterial()
        mat.transparent = true
        mat.depthWrite = false
        const seed = seeds.element(T.instanceIndex)
        const par = params.element(T.instanceIndex)
        const off = seed.xyz
        const phase = par.x
        const speed = par.y
        const box_min = T.cameraPosition.sub(T.vec3(42, 26 * 0.7, 42))
        const span = T.vec3(84, 26, 84)
        const fall = T.float(kp.fall_base).add(speed.mul(kp.fall_range))
        const sway_rate = T.float(kp.sway_base).add(speed.mul(kp.sway_range))
        const sway_amp = T.float(kp.sway_amp)
        // THE OLD wrap: fract in the camera-recentred [0,1) box ⇒ each mote keeps a CONSTANT camera offset ⇒ no parallax.
        const fx = off.x.add(T.time.mul(sway_rate).add(phase).sin().mul(sway_amp)).fract()
        const fy = off.y.sub(T.time.mul(fall.div(26))).fract()
        const fz = off.z.add(T.time.mul(sway_rate.mul(0.9)).add(phase).cos().mul(sway_amp)).fract()
        mat.positionNode = box_min.add(T.vec3(fx, fy, fz).mul(span))
        mat.scaleNode = T.float(kp.size)
        mat.colorNode = T.Fn(() => {
          const p = T.uv().sub(0.5)
          const shape = T.smoothstep(0.5, 0.0, p.length())
          const soft = shape.mul(shape)
          T.If(soft.lessThan(0.01), () => T.Discard())
          return T.vec4(T.vec3(kp.color[0], kp.color[1], kp.color[2]), soft.mul(alpha))
        })()
        return { object: mat, kernel }
      }

      // Depth-cue geometry (unlit BASIC materials ⇒ no lights needed; opaque ⇒ they write depth so the
      // transparent motes depth-test against them). Posts sit at varied depths so parallax is legible; the
      // wall is the occluder for the depth-test proof.
      function build_depth_scene(scene, mode) {
        const grid = new THREE.GridHelper(240, 48, 0x555566, 0x2b2b34)
        grid.position.set(0, 8, -14)
        scene.add(grid)
        if (mode === 'occluder') {
          const wall = new THREE.Mesh(
            new THREE.BoxGeometry(14, 30, 1.2),
            new THREE.MeshBasicMaterial({ color: 0x8a5a2c })
          )
          wall.position.set(0, 30, -4) // ~18 m ahead of the strafe line (z=14) ⇒ ~a third of the field sits behind it
          scene.add(wall)
        } else {
          // posts at (x, z, colour): near→far — the tall pillars the motes parallax against.
          for (const [x, z, c] of [
            [-6, -2, 0xff5a4a],
            [7, -18, 0x4aa0ff],
            [-3, -38, 0x9adf5a],
            [11, -30, 0xe0c04a],
          ]) {
            const post = new THREE.Mesh(new THREE.BoxGeometry(1.2, 40, 1.2), new THREE.MeshBasicMaterial({ color: c }))
            post.position.set(x, 28, z)
            scene.add(post)
          }
        }
      }

      try {
        if (kind !== 'ambient' && !PARTICLE_KINDS[kind]) throw new Error(`unknown kind "${kind}"`)
        const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('canvas'))
        const renderer = new WebGPURenderer({ canvas, antialias: true })
        await renderer.init()
        renderer.setPixelRatio(1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setClearColor(bg, 1)

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500)
        camera.position.set(frame.pos[0], frame.pos[1], frame.pos[2])
        camera.lookAt(frame.look[0], frame.look[1], frame.look[2])

        // 'bare' = the strafe camera with NO geometry (a clean motes-only field for the quantitative parallax
        // metric); 'parallax'/'occluder' add depth-cue geometry. Any truthy scene_mode drives the strafe rig.
        if (scene_mode === 'parallax' || scene_mode === 'occluder') build_depth_scene(scene, scene_mode)

        // anchor=camera ⇒ the pre-fix camera-locked A/B shim (mirrors the kind exactly); else the shipped field.
        const handle =
          anchor === 'camera'
            ? make_camera_locked_field(kind, count, scene_mode ? 0.7 : 0.9)
            : create_particles({ kind, count })
        // near-opaque + dense = the WORST case for alpha accumulation (strongest shell test); a touch gentler in
        // the depth-proof scenes so the posts/wall read through the field. The shim bakes its opacity in-shader.
        if (handle.opacity) handle.opacity.value = scene_mode ? 0.7 : 0.95
        if (q.get('depthtest') === '0') handle.object.depthTest = false // the HUD-bug "before" (motes draw on top)
        const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), handle.object, count)
        mesh.frustumCulled = false // billboards move in-shader; CPU bounds are wrong (waterfall_sheet idiom)
        scene.add(mesh)
        if (handle.bake) await handle.bake(renderer)
        else if (handle.kernel) await renderer.computeAsync(handle.kernel) // shim: raw seed kernel

        Object.assign(window, { __probe_kind: kind, __probe_count: count })
        const t0 = performance.now()
        let last = t0
        const loop = (now) => {
          const dt = (now - last) / 1000
          last = now
          if (!freeze) advance_gust(dt) // breathe the shared gust so sway visibly waves (held under ?freeze)
          if (scene_mode) {
            // Lateral STRAFE along X with a FIXED forward gaze (pure translation ⇒ maximal parallax): world-
            // anchored motes sweep the view at depth-dependent rates and track the posts; a camera-locked
            // (sticker) field stays glued to screen. ?camx pins X for deterministic stills (spec may mutate
            // window.__probe.camx live); else auto-sweep for the webm. depth-test proof: motes behind the wall.
            const s = (now - t0) / 1000
            const x = state.camx != null ? state.camx : Math.sin(s * 0.5) * 16
            camera.position.set(x, 30, 14)
            camera.lookAt(x, 27, -30) // gaze straight forward from wherever X is (constant view direction)
          } else if (soak) {
            // Move the camera through the world (cameraPosition sweeps ⇒ the box re-centres) AND rotate the
            // look — a camera-glued artifact ("circle following me") would sit dead-centre through all of it.
            const s = (now - t0) / 1000
            const a = s * 0.55
            camera.position.set(Math.sin(a) * 26, 30 + Math.sin(s * 0.4) * 12, Math.cos(a) * 26)
            camera.lookAt(Math.sin(a * 1.7) * 30, 22 + Math.sin(s * 0.6) * 6, Math.cos(a * 1.7) * 30 - 10)
          }
          renderer.render(scene, camera)
          // ?freeze: after the first real frame, pin nodeFrame.time so every later render reuses it (the field
          // stops evolving in time; only the camera strafe moves it — a saturation-free parallax A/B).
          if (freeze && !state.frozen) {
            const nf = renderer._nodes && renderer._nodes.nodeFrame
            if (nf) {
              const pinned = nf.time
              const orig = nf.update.bind(nf)
              nf.update = function () {
                orig()
                this.time = pinned
                this.deltaTime = 0
              }
              state.frozen = pinned
              window.__frozen_time = pinned
            }
          }
          window.__probe_ready = true
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)
      } catch (e) {
        window.__probe_err = String(e && e.stack ? e.stack : e)
        console.error('[particle-probe] FAILED', e)
      }
    </script>
  </body>
</html>
