<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>AresRPG — Night Sky Options Probe</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #02030a;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <!--
      Standalone WebGPU preview of the NIGHT SKY design options (src/render/sky/night_sky.js). Its OWN
      renderer — NO engine boot, NO terrain streaming (so no OOM), one fullscreen background dome shader:
      featherweight GPU. Renders the REAL night composite the MEDIUM/HIGH tier draws (base gradient +
      moon disc + moon atmosphere + stars + milky way + nebula + planets) through the SAME AgX tonemap, at the
      exposure the auto-exposure servo lands on at night (EXPOSURE_MAX 1.4 — a dark frame drives it to the
      ceiling), so the wash-out / read of each option is faithful.

      ?opt=neutral|a|b|c   which preset (neutral = today's shipped look — the neutral proof)
      ?frame=sky|horizon   full-sky vista (up toward the galactic core) or horizon-context (dark ground)
      ?seed=aresrpg        world seed (galaxy orientation + planet orbits)
      ?exp=1.4             tonemap exposure override

      Sets window.__probe_ready once the first frame draws; window.__probe_err on any GPU/init failure.
    -->
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer, MeshBasicNodeMaterial } from 'three/webgpu'
      import {
        clamp,
        float,
        mix,
        mx_fractal_noise_float,
        positionWorldDirection,
        smoothstep,
        uniform,
        vec3,
      } from 'three/tsl'

      import { create_night_sky_node, derive_night_sky_params } from '/src/render/sky/night_sky.js'
      import {
        disc_space_uv,
        moon_surface_mul,
        sun_dir_from_tod,
        MOON_DISC_COS,
        MOON_DISC_INNER_COS,
        MOON_DISC_RGB,
        MOON_DISC_INTENSITY,
        MOON_LIMB_EDGE,
        MOON_ANGULAR_RADIUS,
        MOON_NOISE_FREQ,
        MOON_NOISE_LACUNARITY,
        MOON_NOISE_DIMINISH,
      } from '/src/render/sky/sky_node.js'
      import { PRESETS } from '/demo/night_sky_presets.js'

      const q = new URLSearchParams(location.search)
      const opt = (q.get('opt') || 'neutral').toLowerCase()
      const frame = (q.get('frame') || 'sky').toLowerCase()
      const seed = q.get('seed') || 'aresrpg'
      const exposure = Number(q.get('exp')) || 1.4 // night auto-exposure ceiling (EXPOSURE_MAX)
      const NIGHT_TOD = 0.82 // deep night: sun well below horizon, moon up but off the galactic core
      const cfg = PRESETS[opt] || PRESETS.neutral

      const c3 = (c) => vec3(c[0], c[1], c[2])

      try {
        const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('canvas'))
        const renderer = new WebGPURenderer({ canvas, antialias: true })
        await renderer.init()
        renderer.setPixelRatio(1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.toneMapping = THREE.AgXToneMapping
        renderer.toneMappingExposure = exposure

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000)
        camera.position.set(0, 2, 0)

        // Aim at the galactic core (galaxy_a is a point ON the band, where the nebula orange pocket sits).
        const P = derive_night_sky_params(seed)
        const a = P.galaxy_a
        const up_bias = frame === 'horizon' ? 0.12 : 0.4 // horizon: band rises low; sky: band arcs overhead
        const yflat = frame === 'horizon' ? a[1] * 0.25 : a[1] * 0.6
        const fwd = new THREE.Vector3(a[0], yflat + up_bias, a[2]).normalize()
        // Roll the sky vista ~35° so the band reads as a diagonal galactic ARCH, not a vertical column
        // (the band is the great circle through galaxy_a; a level camera framed it straight down its length).
        if (frame === 'sky') camera.up.set(Math.sin(0.62), Math.cos(0.62), 0)
        camera.lookAt(camera.position.x + fwd.x, camera.position.y + fwd.y, camera.position.z + fwd.z)

        // Sun/moon: sun below the horizon at NIGHT_TOD, moon = its antipode (up).
        const sun_direction = uniform(sun_dir_from_tod(NIGHT_TOD))
        const view = positionWorldDirection.normalize()

        // Moon disc — mirrors sky_node.js's background moon (soft limb + maria mottling), the "existing moon".
        const moon_dir = sun_direction.negate()
        const cos_moon = view.dot(moon_dir)
        const moon_up = clamp(moon_dir.y.add(0.02).div(0.14), 0, 1)
        const moon_edge = smoothstep(float(MOON_DISC_COS), float(MOON_DISC_INNER_COS), cos_moon)
        const moon_rim_t = clamp(cos_moon.sub(float(MOON_DISC_COS)).div(1 - MOON_DISC_COS), 0, 1)
        const moon_limb = mix(float(MOON_LIMB_EDGE), float(1), moon_rim_t)
        const moon_uv = disc_space_uv(view, moon_dir).div(float(MOON_ANGULAR_RADIUS)).mul(float(MOON_NOISE_FREQ))
        const moon_noise = mx_fractal_noise_float(
          vec3(moon_uv, float(0)),
          2,
          float(MOON_NOISE_LACUNARITY),
          float(MOON_NOISE_DIMINISH)
        )
        const moon_surface = moon_surface_mul(clamp(moon_noise.mul(0.5).add(0.5), 0, 1))
        const moon_amt = moon_edge.mul(moon_limb).mul(moon_surface).mul(float(MOON_DISC_INTENSITY))
        const moon_body = c3(MOON_DISC_RGB).mul(moon_amt.mul(moon_up))

        // The full night sky (base gradient + moon atmosphere + stars + milky way + nebula + planets).
        const night = create_night_sky_node({
          seed,
          sun_dir: sun_direction,
          view_dir: view,
          with_base: true,
          with_milky_way: true,
          cfg,
        })
        // Render the sky as a BackSide skydome MESH (not scene.backgroundNode) so it goes through the
        // renderer's AgX tonemap — backgroundNode bypasses it, which flattened the deep darks to a washed
        // twilight blue. positionWorldDirection is the per-fragment view ray, correct on the dome. AgX now
        // crushes the base lows so the dome reads as DEEP SPACE and the additive features pop with chroma.
        const dome_mat = new MeshBasicNodeMaterial()
        dome_mat.colorNode = moon_body.add(night.node).max(0)
        dome_mat.side = THREE.BackSide
        dome_mat.depthWrite = false
        dome_mat.fog = false
        const dome = new THREE.Mesh(new THREE.SphereGeometry(1000, 64, 32), dome_mat)
        dome.renderOrder = -1
        scene.add(dome)

        // Horizon-context: a big dark ground plane so the sky meets a near-black world edge (the target
        // framing). Full terrain composite is re-captured in-engine at build time after the pick.
        if (frame === 'horizon') {
          const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(6000, 6000),
            new THREE.MeshBasicMaterial({ color: 0x05060c })
          )
          ground.rotation.x = -Math.PI / 2
          ground.position.y = -0.5
          scene.add(ground)
        }

        Object.assign(window, { __probe_opt: opt, __probe_frame: frame, __probe_seed: seed })
        const loop = async () => {
          await renderer.renderAsync(scene, camera)
          window.__probe_ready = true
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)
      } catch (e) {
        window.__probe_err = String(e && e.stack ? e.stack : e)
        console.error('[night-sky-probe] FAILED', e)
      }
    </script>
  </body>
</html>
