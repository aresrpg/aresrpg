<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>lens_water proof probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #c {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <!-- WebGPU target: the SHIPPED lens_water pass over a bold high-contrast trees+sky scene. Deterministic
         virtual clock + fixed RNG so Playwright can hit exact ages; boot() renders the DRY frame first
         (inactive = identity), splash() starts the wet film — the round-4 acceptance diffs wet vs dry.
         PROOF-ONLY throwaway (not a runtime path) — mirrors demo/vfx_presets_probe.html's standalone shape. -->
    <canvas id="c" width="960" height="540"></canvas>
    <script type="module">
      import { WebGPURenderer, RenderPipeline } from 'three/webgpu'
      import { Fn, float, fract, length, mix, screenUV, sin, smoothstep, step, vec2, vec3, vec4 } from 'three/tsl'
      import {
        LENS_WATER,
        build_droplets,
        droplet_state_at,
        create_lens_water,
      } from '/src/render/lighting/lens_water.js'

      const W = 960
      const H = 540
      const glc = /** @type {HTMLCanvasElement} */ (document.getElementById('c'))

      // ── BOLD high-contrast scene: crisp jagged horizon (bright band over near-black trees), sun disc,
      //    vertical trunk stripes. Chosen so any wet distortion is measurable in a wet-vs-dry diff.
      const scene_node = Fn(() => {
        const uv = screenUV
        const sky_top = vec3(0.28, 0.56, 0.98)
        const sky_horizon = vec3(1.0, 0.84, 0.5)
        const sky = mix(sky_horizon, sky_top, smoothstep(float(0.4), float(1.0), uv.y))
        const sd = length(uv.sub(vec2(0.73, 0.82)))
        const sun = smoothstep(float(0.085), float(0.0), sd)
        const sky_sun = mix(sky, vec3(1.0, 0.97, 0.85), sun)
        const band = smoothstep(float(0.4), float(0.425), uv.y).mul(smoothstep(float(0.5), float(0.43), uv.y))
        const lit_sky = mix(sky_sun, vec3(1.0, 0.95, 0.78), band.mul(0.85))
        const canopy = float(0.4)
          .add(sin(uv.x.mul(27)).mul(0.025))
          .add(sin(uv.x.mul(9)).mul(0.035))
        const is_tree = step(canopy, uv.y).oneMinus() // 1 where uv.y < canopy
        const trunk = step(float(0.55), fract(uv.x.mul(18)))
        const tree = mix(vec3(0.02, 0.06, 0.02), vec3(0.06, 0.17, 0.05), trunk)
        // fine additive checker grain (~10px period): gives EVERY pixel measurable texture so the
        // wet-vs-dry diff registers the film frame-wide, not only at the few scene edges
        const ga = step(float(0.5), fract(uv.x.mul(96)))
        const gb = step(float(0.5), fract(uv.y.mul(54)))
        const checker = ga.add(gb).sub(ga.mul(gb).mul(2)) // xor -> 0/1
        const grain = checker.mul(0.045).sub(0.0225)
        return vec4(mix(lit_sky, tree, is_tree).add(vec3(grain, grain, grain)), 1)
      })()

      // ── deterministic virtual clock: lens_water.update() self-clocks off performance.now — override it
      //    so Playwright drives exact ages. Fixed Math.random so the splash seed (⇒ bead layout) is known.
      let virtual_ms = 1_000_000
      performance.now = () => virtual_ms
      const FIXED_RAND = 0.4237
      Math.random = () => FIXED_RAND
      const SEED = FIXED_RAND * 1000
      const COUNT = LENS_WATER.count

      const renderer = new WebGPURenderer({ canvas: glc, antialias: false })
      renderer.setSize(W, H, false)

      const lens = create_lens_water({ tier: 'high' })
      const pipeline = new RenderPipeline(renderer)
      const dry_node = lens.apply(scene_node, false)
      const wet_node = lens.apply(scene_node, true)
      pipeline.outputNode = wet_node
      pipeline.needsUpdate = true

      const draw = async () => {
        for (let k = 0; k < 3; k += 1) {
          await (pipeline.renderAsync ? pipeline.renderAsync() : pipeline.render())
          await new Promise((r) => requestAnimationFrame(r))
        }
      }

      // ── Playwright API ──
      window.__lw = {
        async boot() {
          await renderer.init()
          // prime the self-clock while INACTIVE and render the DRY frame (identity contract — the
          // round-4 acceptance diffs every wet frame against this capture)
          virtual_ms = 1_000_000
          lens.update()
          await draw()
          return { seed: SEED, count: COUNT }
        },
        async path(mode) {
          pipeline.outputNode = mode === 'dry' ? dry_node : wet_node
          pipeline.needsUpdate = true
          await draw()
        },
        async splash() {
          virtual_ms = 1_000_000
          lens.update() // re-anchor the clock base so the first advance() measures dt from here
          lens.splash()
          await draw()
          return { intensity: lens.intensity.value }
        },
        async advance(age) {
          virtual_ms = 1_000_000 + age * 1000
          lens.update()
          await draw()
          return { age, intensity: lens.intensity.value }
        },
        beads(age) {
          // pure CPU twin of the packed shader state — coordinates for optional zoom targeting
          return build_droplets(SEED, COUNT).map((d) => droplet_state_at(d, age))
        },
      }
      window.__lw_ready = true
    </script>
  </body>
</html>
