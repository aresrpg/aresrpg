title: WebGPU indisponível
body: 'O mundo requer WebGPU e uma conexão segura (HTTPS ou localhost). Abra-o em um navegador compatível.'
engine_graphics_failure: Não foi possível iniciar os gráficos. Verifique as configurações gráficas do navegador ou atualize o driver gráfico e recarregue.
graphics_help:
  firefox_update: 'Você está usando o Firefox {version}. O WebGPU exige o Firefox {required} ou mais recente: abra o menu, depois Ajuda → Sobre o Firefox para atualizar, e recarregue.'
  firefox_unsupported: 'O Firefox ainda não oferece WebGPU neste sistema. Abra o jogo no Chrome ou no Edge.'
  firefox_settings: 'No Firefox, vá em Configurações → Geral → Desempenho, desmarque “Usar configurações de desempenho recomendadas” e ative “Usar aceleração de hardware quando disponível”. Depois reinicie o Firefox. Macs com Intel ainda não são compatíveis: use o Chrome ou o Safari 26.'
  safari: 'O WebGPU exige o Safari 26 ou mais recente. Atualize para o macOS 26, iOS 26 ou iPadOS 26 e recarregue.'
  chromium: 'Ative Configurações → Sistema → “Usar aceleração gráfica quando disponível” e reinicie o navegador. Em chrome://gpu, o WebGPU deve aparecer como acelerado por hardware.'
  chromium_linux: 'No Linux, ative “Unsafe WebGPU Support” e “Vulkan” em chrome://flags, ative Configurações → Sistema → “Usar aceleração gráfica quando disponível” e reinicie o navegador.'
  other: 'Abra o jogo na versão mais recente do Chrome, Edge ou Safari 26 com a aceleração gráfica ativada.'
engine_recovery: O mundo parou de carregar ou renderizar. Recarregue para tentar novamente.
