  chapter_gear: Equipe-se
  chapter_supplies: Suprimentos
  chapter_dungeon: Masmorra
  chapter_secret: Um último segredo
  welcome_title: Boas-vindas a Nauvis.
  welcome_body: AresRPG recompensa quem aprende, se prepara e joga com inteligência. Aprenda a otimizar e automatizar seu jogo gastando o mínimo de SUI possível. Siga esta jornada para dar os primeiros passos.
  hoe_title: Todos precisamos de uma enxada.
  hoe_body: Nauvis é seu primeiro mundo. Equipamentos mais fortes ajudam você a alcançar mundos mais perigosos, e ferramentas permitem coletar ingredientes para fabricá-los. Compre {{item}} de outro jogador ou fabrique em Personagens → Profissões → Artesão.
  hoe_objective: Tenha {{item}}
  wheat_title: Vamos pôr a mão na massa.
  wheat_body: Fabricar seus equipamentos começa pela coleta de ingredientes. Trigo é usado em alimentos e materiais de equipamento, então é um bom começo. Encontre um ponto de trigo em Nauvis e faça sua primeira colheita!
  wheat_objective: Colha trigo
  pickaxe_title: Seu próximo astro das rochas.
  pickaxe_body: Suas próximas melhorias exigem mais do que plantações. {{item}} permite minerar minerais para fabricar equipamentos. Encontre no mercado ou faça você mesmo. Sua carreira na mineração precisa começar em algum lugar.
  pickaxe_objective: Tenha {{item}}
  quartz_title: Não deixe pedra sobre pedra.
  quartz_body: Só trigo não vai equipar você. Armas e joias também precisam de minerais como quartzo. Use sua picareta para coletar um pouco para as próximas fabricações.
  quartz_objective: Colete quartzo
  sickle_title: Um corte acima.
  sickle_body: Plantas e cogumelos fornecem ingredientes para poções e materiais de fabricação. {{item}} abre a profissão de herborista. Compre de outro jogador ou fabrique o seu.
  sickle_objective: Tenha {{item}}
  mushroom_title: Cabe mais um.
  mushroom_body: Você precisa de mais do que plantações e minerais para continuar fabricando. Cogumelos verdes são usados em poções, couro e outros materiais. Colete seu primeiro e continue evoluindo as profissões de coleta para desbloquear mais ingredientes.
  mushroom_objective: Colete um cogumelo verde
  token_title: Faça sua própria sorte.
  token_body: Você vai precisar de muitos itens nas próximas fabricações. Aumentar sua Sorte melhora as chances de saque em combates. Vamos encontrar um talismã {{item}} e equipá-lo!
  token_objective: Tenha {{item}}
  croissant_title: Pão antes da batalha.
  croissant_body: Ao perder um combate, seus PV caem a zero. Você pode esperar a recuperação ou comer para voltar à ação mais rápido. Pegue {{item}} ou asse em Personagens → Profissões → Padeiro.
  croissant_objective: Tenha {{item}}
  lorito_title: Hora de arrepiar algumas penas.
  lorito_body: Equipamentos mais fortes exigem materiais que você não encontra num campo de trigo. Masmorras oferecem novos saques e XP, mas é preciso lutar por eles. Leve comida de cura e uma chave para Gilded Lorito em Thebes e conclua a sala final.
  lorito_objective: Conclua a masmorra Gilded Lorito
  suize_title: Um último segredo.
  suize_body: 'Muito bem, aventureiro. Colheitas melhores abrem novas receitas, então tenho um último desafio: colha Suize por conta própria. Onde encontrar? Considere esse seu primeiro problema sem supervisão.'
  suize_objective: Colha Suize
