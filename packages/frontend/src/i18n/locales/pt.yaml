  combat_detail: 100.000 KARES financiam um fundo público de combate. Qualquer pessoa pode adicionar tokens. Os níveis dos chefes determinam uma recompensa, dividida igualmente entre os personagens vencedores. O teto diário de cerca de 54,79 KARES garante ao fundo inicial pelo menos cinco anos de recompensas. Dias tranquilos e doações prolongam sua duração. A atividade por época ajusta o valor; recompensas não pagas nunca viram dívida.
  allocation_rationale: '590.000 KARES (59%) estão disponíveis no lançamento: venda, liquidez e equipe. Liberações programadas adicionam no máximo cerca de 82.000 no primeiro ano, ou 13,90% do valor inicial, antes de queimas. O staking pausa sem participantes. A liberação comunitária segue o calendário. O combate pode liberar menos. Essas liberações usam tokens existentes; a inflação por criação é zero. Doações redistribuem tokens existentes. Nenhum resultado de preço é garantido.'
