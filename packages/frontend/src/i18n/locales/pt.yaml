docs_page:
  title: Docs
  nav_label: Seções da documentação
  home: Início
  play: Jogar
  menu: Menu
  previous: Anterior
  next: Próximo
  search: Busque guias, itens e monstros
  search_empty: Nenhuma página corresponde a esta busca.
  data_note: Os números destas páginas vêm dos mesmos arquivos de conteúdo do jogo.
  kinds:
    guide: Guia
    item: Item
    mob: Monstro
  groups:
    start: Comece aqui
    mechanics: 'Mecânicas de jogo'
    automated: 'Jogo automatizado'
    reference: 'Referência'
    economy: Economia
    build: Construir
  guides:
    overview: O que é o AresRPG
    first_hour: 'Guia do iniciante'
    market: Mercado
    agents: 'Conectar um assistente'
    build: Construa sobre o AresRPG
    kares: Token KARES
    ways: 'Formas de jogar'
    bots: 'Bots hospedados'
  overview:
    lede: 'AresRPG é um MMORPG tático que funciona como um protocolo na Sui. Personagens, itens, lutas e o mercado são objetos e transações on-chain. O jogo que você vê é um cliente desse protocolo, e existem vários.'
    counts:
      items: Itens
      spells: Feitiços
      mobs: Monstros
      recipes: Receitas
      classes: Classes
      jobs: Profissões
    protocol_title: 'Um protocolo, não um único cliente'
    protocol:
      - 'As regras do jogo são contratos inteligentes. Uma luta, uma criação, uma colheita ou uma venda é uma transação, e o resultado é o mesmo seja qual for a interface que a enviou.'
      - 'Sua conta é dona dos seus personagens e itens. Nenhuma interface os guarda por você, exceto um bot hospedado ao qual você decide entregar um personagem.'
      - 'Toda interface lê o mesmo estado. Uma luta iniciada no mundo 3D pode ser acompanhada de outra página, e o saque ganho por um bot aparece no seu inventário.'
    loop_title: 'O que você faz no jogo'
    loop:
      - 'Lute por turnos contra grupos de monstros em uma grade. A cada turno você gasta pontos de ação em feitiços e pontos de movimento em passos.'
      - 'Colete recursos e crie ferramentas, equipamentos e consumíveis nas suas profissões.'
      - 'Conclua masmorras em grupo, sala após sala, pelo saque do chefe.'
      - 'Negocie com outros jogadores no mercado, em SUI.'
  ways:
    lede: 'O protocolo não tem uma única porta de entrada. Cada interface abaixo joga com os mesmos personagens, o mesmo saque e o mesmo mercado. Elas diferem em quem faz as jogadas e no que você precisa para usá-las.'
    note: 'Você pode usar várias interfaces ao mesmo tempo. Cada conta joga em uma sessão de jogo por vez; as páginas do site podem ficar abertas ao lado.'
    specs:
      runs_in: Roda em
      role: Seu papel
      good_for: Ideal para
      status: Status
    play:
      manual: Manual
      automated: Automático
    items:
      world:
        name: Mundo voxel
        status: Jogável
        body: O jogo completo no seu navegador. Percorra os planetas, forme um grupo e lute você mesmo no
          tabuleiro. No celular, o mesmo cliente muda para controles por toque.
        runs_in: Navegador com uma GPU potente
        role: Você joga cada movimento
        good_for: Exploração e lutas em grupo
      agent:
        name: Seu agente
        status: Em andamento
        body: Conecte Claude, ChatGPT ou Grok a um bot hospedado do AresRPG. Combine um objetivo com ele e
          assista enquanto ele joga com seu personagem dentro do jogo.
        runs_in: ChatGPT, Claude ou Grok
        role: Defina o objetivo e assista
        good_for: Partidas sem intervenção
      sdk:
        name: Seu próprio cliente
        status: Código disponível
        body: Construa sobre o SDK público que o próprio jogo usa. A licença permite clientes comerciais,
          remakes, ferramentas de fãs e bots que rodam na implantação oficial. Seu cliente ou bot
          assina com a própria carteira Sui.
        runs_in: Tudo o que você construir
        role: Você escreve o cliente
        good_for: Clientes próprios, ferramentas, bots
  bots:
    lede: 'Um bot hospedado joga com seus heróis por você nos servidores da AresRPG.'
    wallet_title: 'A carteira do bot'
    wallet:
      - 'Um bot joga a partir da própria carteira, separada da sua carteira de jogo. É uma multisig 1 de 2: o serviço hospedado pode assinar por ela, e sua conta Google também.'
      - 'Heróis e itens que você entrega vão para essa carteira. Lá o jogo é custodial: o serviço assina as jogadas.'
      - 'Você pode retomar tudo pela sua própria conta a qualquer momento, mesmo com o bot offline. Um resgate só precisa da sua assinatura.'
      - 'O bot paga as próprias taxas de rede. Mantenha um pouco de SUI na carteira dele. Transferir move SUI e KARES entre suas duas carteiras.'
    does_title: 'O que um bot faz'
    does:
      - 'Cada herói executa uma atividade por vez, como lutar ao redor de uma cidade, coletar e criar, ou concluir uma masmorra. Você escolhe, e o bot segue até terminar ou até você parar.'
      - 'Heróis da mesma carteira de bot podem lutar em equipe.'
      - 'Você pode pausar o bot ou parar um herói a qualquer momento. Uma ação já enviada à rede ainda termina.'
      - 'Um bot espera quando não tem nada aprovado para fazer, ou quando a carteira não tem SUI para taxas.'
    control_title: 'Quem pode comandá-lo'
    control:
      - 'Um assistente (ChatGPT, Claude ou Grok): combine um objetivo no chat. Ele chama as ferramentas do bot dentro do que você aprovou.'
  first_hour:
    lede: 'O objetivo da sua primeira hora: um personagem, algumas lutas vencidas e uma ferramenta
      fabricada por você. As taxas de drop e a receita abaixo são as reais.'
    drop_chance: '{{chance}}% de chance de drop'
    steps:
      - title: Crie um personagem.
        body: A criação custa {{price}} SUI mais gas. Sua classe define seus feitiços, então escolha
          com cuidado.
      - title: Vença suas primeiras lutas.
        body: Estes monstros rondam a primeira cidade. Aproxime-se de um grupo e desafie-o.
      - title: Reúna as peças de uma ferramenta.
        body: Sua primeira ferramenta de coleta é feita com drops de monstros. Cada peça aparece com sua
          melhor fonte.
      - title: Fabrique-a.
        body: Abra a profissão {{job}} e fabrique a ferramenta. Uma fabricação pode falhar e ainda
          consome os ingredientes, então leve peças extras.
      - title: Mire na primeira masmorra.
        body: Com um grupo e esta chave, você pode entrar na masmorra da primeira cidade.
  market:
    lede: Jogadores vendem para jogadores. Itens e recursos são negociados por anúncios on-chain, e o
      vendedor recebe em SUI.
    royalty: Royalty
    royalty_floor: Royalty mínimo
    lot_sizes: Tamanhos de lote
    points:
      - O comprador paga o preço anunciado, mais o royalty, mais o gas.
      - O vendedor recebe o preço anunciado e o retira em uma ação separada.
      - Em um anúncio barato, o royalty mínimo faz diferença. Compare o custo total de um lote, não só
        o preço anunciado.
  kares:
    lede: O KARES ainda não está pronto. Ele será adicionado em breve.
    note: Esta página vai descrever o token, sua oferta e seus fundos de recompensas quando ele for
      lançado. Nenhum saldo, preço ou valor de recompensa é publicado antes disso.
    live_lede: 'KARES é o token da AresRPG. Ele é negociado na Aftermath.'
  agents:
    lede: Conecte ChatGPT, Claude ou Grok a um bot hospedado do AresRPG. Você combina um objetivo, e o
      assistente joga com seu personagem dentro dele. Este recurso está em desenvolvimento.
    steps:
      - Escolha seu assistente e adicione o endereço de conexão do AresRPG como conector personalizado.
      - Entre com o Google e depois aprove o bot exato e o que ele pode fazer.
      - Entregue um personagem do seu inventário. Você pode recuperá-lo a qualquer momento.
    points:
      - O assistente nunca recebe uma chave de carteira e nunca pede uma no chat.
      - O jogo hospedado é custodial. Uma conta compartilhada 1 de 2 guarda o personagem e o agente
        hospedado assina os movimentos. Seu login com o Google continua sendo sua autenticação e sua
        recuperação.
      - Um bot conectado nem sempre está ativo. Ele espera quando não tem um próximo passo aprovado.
    guide: Leia o guia de conexão
    index: Abra o playbook para agentes
  build:
    lede: O cliente do jogo é construído sobre um SDK público. Você pode criar seu próprio cliente,
      ferramenta ou bot com as mesmas ações.
    source_title: Repositório do código
    source_body: Código do SDK, licença e versão correspondente.
    playbook_title: Playbook para agentes
    playbook_body: 'Os guias para desenvolvedores: conexão, custódia, SDK, protocolo, combate e
      economia.'
    blocks_title: Blocos básicos
    blocks:
      - 'Composição de ações: monte as mesmas transações que o jogo envia.'
      - 'Planejamento offline: consulte receitas e progressão sem assinante.'
      - 'Simulação de combate: planeje um turno antes de confirmá-lo.'
      - 'Pins de implantação: confira se você está falando com a implantação oficial.'
    license_title: Licença
    allowed_title: Permitido
    allowed:
      - Publicar e operar clientes comerciais, remakes do jogo, ferramentas de fãs, serviços e bots.
      - Automação que joga para lucrar.
    forbidden_title: Não permitido
    forbidden:
      - Implantar ou republicar os contratos do jogo, ou derivados deles, em qualquer blockchain.
      - Usar o nome ou o logo AresRPG como sua marca.
    license_note: Esta página é um resumo. O texto da licença é o que vale. Mantenha a licença e os
      avisos de copyright ao redistribuir.
    license_link: Leia a licença

