    stat_vitality: Vitalidade
    stat_vitality_desc: +1 PV máximo por ponto
    stat_wisdom: Sabedoria
    stat_wisdom_desc: Bônus de ganho de XP
    stat_strength_desc: Aumento de dano de terra
    stat_intelligence_desc: Aumento de dano de fogo e cura
    stat_chance_desc: Dano de água e mais saque
    stat_agility_desc: Aumento de dano de ar
    derived_formulas: FÓRMULAS DERIVADAS
    max_health: VIDA MÁXIMA
    loot_desc: Cada monstro derrotado sorteia cada entrada da sua tabela de saque uma vez. Uma entrada bem-sucedida produz uma quantidade aleatória dentro da faixa definida.
    stat_rolling: SORTEIO DE ATRIBUTOS
    stat_rolling_desc: Cada atributo é sorteado uniformemente dentro da faixa do modelo. Todos os valores têm a mesma chance.
    archimobs: ARQUIMONSTROS
    archimobs_desc: Cada monstro elegível tem 1% de chance de ser substituído por seu arquimonstro nomeado, permanentemente mais forte. Cada membro é sorteado de forma independente.
    max_members: Máximo de membros
    groups_desc: Um grupo reúne até {{max}} jogadores com eleição de líder. Estar em grupo não inclui ninguém automaticamente em um combate — todos devem enviar sua própria transação de entrada, em grupo ou não; não há inclusão passiva ou por proximidade.
    groups_xp: DIVISÃO DE XP
    groups_xp_desc: Os monstros derrotados formam uma reserva de XP base. Combatentes elegíveis aplicam o coeficiente de grupo Retro; diferenças entre os níveis totais dos jogadores e monstros o reduzem. Cada jogador recebe a parcela proporcional ao seu nível. Jogadores abaixo de um terço do maior nível não aumentam o coeficiente. Sabedoria é aplicada por último; dano pessoal não importa.
    groups_loot: DIVISÃO DE SAQUE
    groups_loot_desc: Cada monstro derrotado faz um sorteio de saque compartilhado. Os itens obtidos são distribuídos em rodízio entre os vencedores; mais jogadores não criam sorteios extras.
    dungeons_desc: Vá à entrada da masmorra na cidade definida, use a chave e conclua as salas em ordem. Cada masmorra tem uma sala de preparação ativa.
    dungeon_entry: Entrada
    dungeon_entry_value: Uma chave correspondente na entrada da cidade
    dungeon_instance: Instância
    dungeon_instance_value: Sala de masmorra com combates públicos ou de grupo
    dungeon_completion: Conclusão
    dungeon_completion_value: Concluir todas as salas
    dungeon_reward: Recompensa
    dungeon_reward_value: Distribuição padrão de saque
    classes_desc: 12 classes. As armas são universais — qualquer classe pode equipar e usar qualquer tipo — mas usar a arma da sua classe concede +10% de dano e dano crítico. Cada classe desbloqueia feitiços em níveis fixos ao progredir.
    table_class: CLASSE
    table_weapon: AFINIDADE
    table_hp: PV
    role_warrior: Guerreiro
    role_assassin: Assassino
    role_berserker: Berserker
    role_druid: Druida
    role_chronomancer: Cronomante
    role_guardian: Guardião
    role_archer: Arqueiro
    role_prospector: Prospector
    role_brawler: Brigão
    role_tomoda: Mestre das feras
    role_gambler: Apostador
    role_healer: Curandeiro
    weapon_daggers: Adagas
    weapon_spear: Lança
    weapon_bow: Arco
    weapon_axe: Machado
    weapon_sword: Espada
    marketplace: MERCADO
    marketplace_desc: Equipamentos e personagens são colocados no quiosque pelo preço que você definir; compradores pagam instantaneamente. Recursos são trocados por SUI em pools, sem ofertas. Cada venda paga 10% de royalties — o mercado é o único meio de vender.
    section_forgemagie: FORJAMAGIA
    forgemagie_desc: Forjamagia é o sistema de criação com runas. Triture equipamentos para obter runas e aplique-as em outros equipamentos para modificar atributos. Um sistema de alto risco e recompensa para aperfeiçoar equipamentos no fim do jogo.
    crushing: TRITURAÇÃO
    crushing_desc: 'Cada linha de atributo do item triturado é sorteada independentemente — valores maiores e atributos mais pesados produzem mais runas. Não há servidor: o divisor de rendimento combina uma curva fixa por nível do item com sua taxa, um coeficiente de inflação compartilhado na blockchain (1%–4000%) que a trituração reduz para esse modelo e aumenta para seus vizinhos.'
    crushing_tiers_desc: A categoria da runa (Ba/Pa/Ra) é sorteada. Valores de atributo maiores favorecem runas Ra.
    rune_tiers: CATEGORIAS DE RUNAS
    rune_ba: 'Categoria 1: menor peso por runa'
    rune_pa: 'Categoria 2: peso médio por runa'
    rune_ra: 'Categoria 3: maior peso por runa, XP em dobro'
    rune_weight_desc: Cada runa começa com valor × peso unitário; Retro arredonda o resultado para cima, para um peso inteiro. O peso é calculado automaticamente.
    rune_table_stat: ATRIBUTO
    rune_table_note: Runas de Alcance, Movimento e Ação são aplicadas uma vez cada; Chance de crítico até 10 vezes. Crítico e Resultados críticos não têm runas.
    rune_stat_range: Alcance
    rune_stat_movement: Movimento
    rune_stat_action: Ação
    rune_stat_raw_damage: Dano bruto
    rune_stat_critical_chance: Chance de crítico
    rune_stat_earth_resist: Resistência à terra
    rune_stat_fire_resist: Resistência ao fogo
    rune_stat_water_resist: Resistência à água
    rune_stat_air_resist: Resistência ao ar
    stat_unit_weights: PESOS UNITÁRIOS DOS ATRIBUTOS
    stat_unit_weights_desc: Cada atributo tem um peso unitário que reflete seu poder em combate. Itens com atributos pesados geram mais runas ao serem triturados, consomem mais orçamento do item e são mais difíceis de melhorar além do máximo.
    rune_application: APLICAÇÃO DE RUNAS
    rune_application_desc: 'Temporariamente liberada no nível 1 da profissão de fabricação correspondente ao equipamento para testes. Aplique uma runa por vez para modificar seus atributos. Há três resultados possíveis:'
    outcome_critical_success: Sucesso crítico
    outcome_critical_success_desc: Runa aplicada, sem perda de atributos
    outcome_neutral: Sucesso neutro
    outcome_neutral_desc: Runa aplicada, outros atributos podem diminuir
    outcome_critical_failure: Falha crítica
    outcome_critical_failure_desc: Runa falha, perda de atributos igual ao peso da runa
    success_rate: TAXA DE SUCESSO
    success_rate_desc: 'O sucesso depende da proximidade do atributo ao máximo: perto de 0%, a chance é ~99%; perto do máximo, ~50%; atributos exóticos ficam em ~1%, independentemente do nível. A divisão entre sucesso crítico (sem perda) e neutro (peso pago) muda da mesma forma, com +0,2% por nível de profissão acima de 1. Não há limite de nível do item para a profissão.'
    puits: RESERVA (PUITS)
    puits_desc: Um contador de peso exibido na interface, acumulado quando as perdas de atributos excedem o peso da runa. Absorve perdas futuras antes de afetar outros atributos. Fica no item e acompanha suas trocas de bancada e dono.
    over_maging: MAGIA ALÉM DO MÁXIMO
    over_maging_desc: Aumente atributos além do máximo natural. Cada linha é limitada a 101 de peso extra. O máximo adicional depende do peso unitário — Vitalidade (peso 0,25) pode ganhar ~404 pontos extras, enquanto Sabedoria (peso 3) ganha apenas ~33.
    forgemagie_tips: DICAS
    forgemagie_tips_desc: 'Para atributos exóticos ou acima do máximo: remova atributos baratos para formar uma reserva, aplique o atributo difícil com essa proteção e recoloque os atributos perdidos (mais fácil abaixo do máximo). Atributos exóticos e acima do máximo são perdidos primeiro em uma falha.'
    action_points: PONTOS DE AÇÃO (PA)
    movement_points: PONTOS DE MOVIMENTO (PM)
    critical_stat: CRÍTICO
    wisdom_xp: BÔNUS DE XP DA SABEDORIA
    wisdom_xp_desc: Cada ponto de Sabedoria efetiva, incluindo efeitos ativos, adiciona 1% ao XP ganho. Com 100 de Sabedoria efetiva, você ganha XP em dobro.
    chance_loot: SORTE E SAQUE
    chance_loot_desc: A Sorte efetiva média da equipe vencedora, incluindo efeitos ativos, multiplica todas as chances de saque. Com média de 600 de Sorte, a chance dobra. A chance nunca ultrapassa 100%.
    mob_loot_band: NÍVEL DO MONSTRO E CHANCE DE SAQUE
    mob_loot_band_desc: A chance definida é o ponto médio. Na faixa de nível do monstro, varia de 80% a 120%, limitada a 100%. Monstros de nível fixo usam exatamente a chance definida. A quantidade de saque não muda com o nível.
