  fight_enter: Entrar no combate
  reset_title: Tutoriais
  reset_hint: Exibir cada introdução novamente na próxima visita à página.
  reset_action: Redefinir
  world_compass_title: Mundos e zonas compartilhadas
  world_compass_body: AresRPG contém vários mundos desbloqueados durante sua progressão. Cada mundo é dividido em zonas com monstros, recursos e masmorras. Qualquer pessoa pode descobrir uma zona, e essa descoberta é compartilhada com todos os jogadores.
  world_hud_title: Vida e atalhos
  world_hud_body: Este painel mostra sua vida e os atalhos de itens. Quando um combate começa, a mesma área vira sua barra de feitiços.
  world_fps_title: Seus controles do mundo
  world_fps_body: O terreno é gerado de forma determinística a partir dos dados publicados. A Sui armazena o mundo e a posição X/Z oficial, enquanto a altura é calculada localmente. O modo plano muda apenas a apresentação desse espaço. Você também pode alterar a qualidade visual e restringir combates do mundo aos membros do grupo.
  world_character_title: Jogadores no mundo
  world_character_body: Este é seu personagem ativo. Clique com o botão direito em outro personagem próximo para abrir as interações disponíveis.
  world_character_tabs_title: Jogue com vários personagens
  world_character_tabs_body: Você pode ter até seis personagens. Convide seus outros personagens para um grupo e ative Seguir grupo para viajarem com você e entrarem automaticamente nos combates elegíveis ao chegar.
  fight_title: Seu primeiro combate na blockchain
  fight_body: Os combates são por turnos. Escolha movimentos e feitiços para preparar suas ações juntas. Encerrar turno envia o turno completo em uma transação Sui e calcula os turnos seguintes dos monstros até outro jogador poder agir. Todo o estado oficial do combate é registrado na Sui. Após a vitória, uma transação final usa aleatoriedade da blockchain para sortear o saque compartilhado e colocar cada recompensa no inventário do jogador designado.
  equipment_gear_title: Equipamento
  equipment_gear_body: Os itens equipados pertencem ao personagem selecionado. Arraste equipamentos para a figura, confira os bônus e confirme as alterações juntas.
  equipment_inventory_title: Inventário compartilhado
  equipment_inventory_body: Seu inventário é compartilhado por todos os personagens desta conta. Selecione outro personagem acima para equipar nele os mesmos itens disponíveis.
  stats_title: Características
  stats_body: Gaste pontos de característica para ficar mais forte. Vitalidade aumenta a vida, Sabedoria melhora o XP e a resistência à perda de PA/PM, Sorte melhora o dano de água e a chance de saque, e Agilidade melhora o dano de ar, críticos, bloqueio e esquiva de bloqueio.
  spells_title: Feitiços
  spells_body: Novos feitiços são desbloqueados conforme seu personagem progride. Subir de nível concede pontos de feitiço para melhorar os feitiços desbloqueados aqui.
  jobs_title: Profissões
  jobs_body: Acompanhe a progressão de coleta e fabricação, consulte receitas e fabrique itens disponíveis aqui. Com vários personagens, você pode fixar esta página em um artesão nas Configurações.
  runeforge_title: Forja de runas
  runeforge_body: No nível {{level}} da profissão, o ofício correspondente pode melhorar equipamentos com runas. Obtenha runas triturando itens e aplique-as aqui.
