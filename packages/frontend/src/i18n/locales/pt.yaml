  finished_title: Automação desbloqueada
  finished_body: AresRPG também é um jogo sobre automação. Muitos recursos futuros serão baseados nela. Você concluiu todas as missões iniciais e ganhou automação de coleta! Escolha um recurso, pressione Iniciar e deixe seu personagem coletar. Você pode recolher os controles enquanto ela funciona.
