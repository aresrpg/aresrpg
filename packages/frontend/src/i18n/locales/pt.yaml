    combat_desc: O combate ocorre por turnos em uma grade. No seu turno, você gasta Pontos de Ação (PA) para lançar feitiços e Pontos de Movimento (PM) para se mover. A linha de visão depende do feitiço — a maioria exige, alguns não. Você enfrenta grupos de monstros no mundo e outros jogadores no Kolizeum. O dano aumenta com o atributo elemental correspondente e bônus de dano bruto.
    elements: ELEMENTOS
    element_earth: TERRA
    element_fire: FOGO
    element_water: ÁGUA
    element_air: AR
    stat_strength: Força
    stat_intelligence: Inteligência
    stat_chance: Sorte
    stat_agility: Agilidade
    critical_hits: ACERTOS CRÍTICOS
    crit_desc: Cada feitiço ou arma tem uma chance crítica base, expressa como 1 em N. Crítico reduz N, mas a chance final nunca ultrapassa 1 em 2 (50%).
    crit_bonus_desc: Em um acerto crítico, o feitiço aplica seus efeitos críticos específicos (dano maior ou efeitos extras) no lugar dos normais.
    blocking: ESCUDOS
    blocking_desc: Alguns feitiços concedem um escudo que absorve dano do elemento correspondente até se esgotar. Não há vigor ou postura de guarda; escudos são a única absorção de dano.
    resistance: RESISTÊNCIA
    resistance_desc: A resistência elemental reduz o dano final em porcentagem, limitada a 50% por elemento. Resistência negativa (fraqueza) amplifica o dano.
    mob_level_bands: FAIXAS DE NÍVEL DOS MONSTROS
    mob_level_bands_desc: 'Dentro da faixa de nível definida, PV, XP, Agilidade, Sabedoria, resistência positiva e valores escaláveis dos feitiços sobem de 60% a 160%. PA e PM sobem de 100% a 130%. Resistências negativas invertem essa curva: a fraqueza cai de 160% no nível mínimo para 60% no máximo.'
    life_steal: ROUBO DE VIDA
    life_steal_desc: 'Efeitos de drenagem causam dano e curam o lançador pela metade da vida realmente perdida pelo alvo. Só a drenagem de jogadores cura: um monstro com o mesmo feitiço causa dano, mas não se cura.'
    life_steal_note: O dano passa primeiro pela fórmula padrão. Depois, o lançador recupera metade da vida realmente perdida pelo alvo original — um golpe redirecionado a outro combatente ou convertido em cura pelo alvo não rouba vida.
    chatiment: CASTIGO
    chatiment_desc: Castigo converte a perda real e não letal de PV em característica. Cada turno ativo de combatente tem seu limite; turnos posteriores acumulam bônus separados de cinco turnos. Dano de monstros conta integralmente. Dano de jogadores e seu limite são reduzidos à metade. Ares não usa erosão.
    healing: CURA
    healing_desc: Curas usam o valor base do feitiço, aumentado pela porcentagem da sua Inteligência, mais um bônus fixo de Cura de equipamentos e efeitos. A cura é limitada à vida máxima do alvo.
    healing_intel_value: +1% de cura por ponto de Inteligência
    heal_bonus: Bônus de cura
    heal_bonus_value: Bônus fixo de equipamentos/efeitos, adicionado após o aumento por Inteligência
    mobs: Monstros
    healing_mobs_value: Aumenta apenas com Inteligência, sem bônus de cura
    leveling_desc: O nível máximo é 200. Enfrente monstros na sua faixa de nível para obter mais XP.
    points_per_level: PONTOS POR NÍVEL
    stat_points: Pontos de atributo
    stat_points_value: '{{n}} por nível'
    stat_costs_desc: O custo das características depende da classe e do valor natural atual. Veja a progressão completa na página de cada classe.
    spell_points: Pontos de feitiço
    spell_points_value: '{{n}} por nível'
