    oeuftermath:
      title: Aftermath Eggs · Oeuftermath
      description: Quem possuía um Aftermath Egg no snapshot recebe um vale de mascote Oeuftermath. Confira a carteira que guardava seu Egg naquele momento; comprar um Egg depois não dá elegibilidade.
    suicune:
      title: SWEEBS · Suicune
      description: Quem possuía SWEEBS no snapshot recebe um vale de mascote Suicune. Conecte a carteira elegível do snapshot para importá-lo para sua conta do jogo.
    suifren_bullshark:
      title: Suifren Bullsharks
      description: Foram selecionadas 500 carteiras elegíveis de donos de Bullshark no snapshot. Confira sua carteira do snapshot para encontrar o vale de mascote; possuir um Bullshark não garante a seleção.
    suifren_capy:
      title: Suifren Capys
      description: Foram selecionadas 500 carteiras elegíveis de donos de Capy no snapshot. Confira sua carteira do snapshot para encontrar o vale de mascote; possuir um Capy não garante a seleção.
    primemachin:
      title: Prime Machin
      description: Os vales de mascote são destinados aos NFTs Prime Machin do snapshot. Primeiro retire o presente anexado ao seu NFT pelo Studio Mirai, depois conecte a carteira destinatária aqui para importá-lo.
    vaporeon:
      title: Donos de Vaporeon
      description: Carteiras selecionadas no snapshot de donos de Vaporeon recebem um vale de mascote Vaporeon. Confira a carteira usada no snapshot e importe o vale aqui.
    sui_basecamp_singapore:
      title: Sui Basecamp · Singapura
      description: Caixas Sui são distribuídas como vales-presente físicos no Sui Basecamp em Singapura. Leia o código QR do cartão e entre para resgatar sua caixa. Mantenha o código privado até o resgate.
    hytale_veterans:
      title: Veteranos do Hytale · Top 100
      description: Um agradecimento especial aos 100 melhores jogadores elegíveis do Hytale, classificados por coleções de itens, tempo de jogo, XP de personagens e profissões. As recompensas vão para o endereço Sui registrado no backup do Hytale. Use a conta Google original para acessar essa carteira.
    hytale_supporters:
      title: Apoiadores do Hytale · Marca dos Inabaláveis
      description: Para cada carteira vinculada ao Hytale com mais de {threshold} SUI em compras registradas na loja, independentemente da posição no top 100. O título vai para o endereço Sui do backup. Entre com a conta Google original para encontrar seu vale-presente.
