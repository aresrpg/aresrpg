  wallet_description: Sua carteira pessoal. Só você pode acessá-la. Deposite SUI para taxas de rede e trocas entre jogadores no mercado.
  moonpay_desc: Cartão de crédito, Apple Pay, transferência bancária
  transak_desc: Cartão de crédito, transferência bancária, mais de 100 países
  faq_what_is_sui: O que é SUI?
  faq_what_is_sui_answer: SUI é uma moeda digital, como dinheiro digital. Ela existe em uma rede rápida e segura chamada blockchain Sui. Você usa pequenas quantidades para taxas de rede e pode negociar diretamente com outros jogadores no mercado.
  faq_why_sui: Por que o AresRPG usa SUI?
  faq_why_sui_answer: SUI é nosso meio de pagamento preferido. As transações são instantâneas (menos de 1 segundo) e custam frações de centavo. Sem taxas de intermediários. Podemos aceitar moedas tradicionais (USD, EUR etc.) no futuro, mas isso exige muito trabalho jurídico e envolve taxas e impostos que ainda não estamos prontos para assumir.
  faq_legal: É legal?
  faq_legal_answer: Sim. Comprar e manter criptomoedas é legal na maioria dos países. SUI é um ativo digital legítimo negociado nas principais corretoras regulamentadas do mundo. AresRPG usa SUI para taxas de rede e trocas entre jogadores no mercado.
  faq_eula: É permitido pelos termos do jogo?
  faq_eula_answer: Sim. Desde que a criptomoeda seja usada apenas como meio de pagamento e não envolva NFTs ou esquemas especulativos, ela está em conformidade. Muitas grandes lojas de jogos também aceitam pagamentos em criptomoedas.
  faq_access: Quem pode acessar minha carteira?
  faq_access_answer: 'Só você. Sua carteira é criada a partir do login Google usando a tecnologia zkLogin da Sui. Ninguém (nem a equipe do AresRPG) pode acessar ou mover seus fundos. Importante: esta carteira serve apenas para atividades no AresRPG. Não guarde grandes valores aqui. Deposite apenas o que pretende usar.'
  faq_balance: Enviei SUI, mas meu saldo não atualizou?
  faq_balance_answer: Nosso sistema de atualização pode estar temporariamente lento. Confira se enviou SUI para o endereço correto (copie-o acima). Se ainda não aparecer, fale com a equipe no Discord e informe o ID da transação.
