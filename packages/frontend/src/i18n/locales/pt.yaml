  catalogue_title: Airdrops disponíveis
  check_wallet: Elegível para um destes airdrops? Confira a carteira usada no snapshot. Conecte uma carteira externa abaixo para importar seus vales-presente. Para recompensas enviadas à carteira do jogo, entre com a mesma conta Google. Cartões físicos são resgatados pelo código QR.
