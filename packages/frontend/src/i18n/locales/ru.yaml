  welcome_title: Добро пожаловать на Наувис.
  welcome_body: AresRPG вознаграждает тех, кто учится, готовится и действует с умом. Учитесь оптимизировать и автоматизировать игру, тратя как можно меньше SUI. Это путешествие поможет освоиться.
  hoe_title: Всем нужна мотыга.
  hoe_body: Наувис — ваш первый мир. Сильное снаряжение поможет добраться до опасных миров, а инструменты позволят собрать материалы для его создания. Купите {{item}} у игрока или изготовьте через «Персонажи → Профессии → Умелец».
  hoe_objective: Получить {{item}}
  wheat_title: Пора запачкать руки.
  wheat_body: Создание снаряжения начинается со сбора материалов. Пшеница нужна для еды и материалов экипировки — отличный первый шаг. Найдите пшеницу на Наувисе и соберите первый урожай!
  wheat_objective: Собрать пшеницу
  pickaxe_title: Будущая звезда шахты.
  pickaxe_body: Для следующих улучшений нужны не только растения. {{item}} позволит добывать минералы для снаряжения. Найдите её на рынке или сделайте сами. Шахтёрская карьера с чего-то начинается.
  pickaxe_objective: Получить {{item}}
  quartz_title: Ни камня нетронутым.
  quartz_body: Одной пшеницей не вооружиться. Оружию и украшениям нужны минералы, например кварц. Добудьте его киркой для следующих изделий.
  quartz_objective: Собрать кварц
  sickle_title: На острие успеха.
  sickle_body: Растения и грибы нужны для зелий и ремесленных материалов. {{item}} открывает профессию травника. Купите её у игрока или создайте сами.
  sickle_objective: Получить {{item}}
  mushroom_title: Ещё один гриб не помешает.
  mushroom_body: Для ремесла нужны не только растения и минералы. Зелёные грибы используются в зельях, коже и других материалах. Соберите первый гриб, а затем развивайте сбор, чтобы открыть новые ингредиенты.
  mushroom_objective: Собрать зелёный гриб
  token_title: Куйте свою удачу.
  token_body: Для следующих изделий понадобится много предметов. Удача повышает шанс добычи в боях. Найдите талисман {{item}} и наденьте его!
  token_objective: Получить {{item}}
  croissant_title: Хлеб перед боем.
  croissant_body: После поражения здоровье падает до нуля. Можно ждать восстановления или поесть и быстрее вернуться в бой. Возьмите {{item}} или испеките через «Персонажи → Профессии → Пекарь».
  croissant_objective: Получить {{item}}
  lorito_title: Пора взъерошить перья.
  lorito_body: Для сильного снаряжения нужны материалы, которых нет в пшеничном поле. Подземелья дают новую добычу и опыт, но за них придётся сразиться. Запаситесь лечебной едой и ключом, отправляйтесь в Gilded Lorito в Thebes и пройдите последнюю комнату.
  lorito_objective: Пройти подземелье Gilded Lorito
  suize_title: Последний секрет.
  suize_body: 'Отлично, искатель приключений. Лучший урожай открывает новые рецепты. Последнее испытание: соберите Suize сами. Где его найти? Считайте это первой задачей без наставника.'
