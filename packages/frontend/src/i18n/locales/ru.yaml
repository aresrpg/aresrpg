  finished_body: AresRPG — это ещё и игра об автоматизации. На ней будут строиться многие будущие возможности. Вы выполнили все задания новичка и заслужили автоматический сбор! Выберите ресурс, нажмите «Начать» и позвольте персонажу собирать его. Панель можно свернуть, не останавливая работу.
  reset_title: Задания новичка
  reset_hint: Сбросить задания аккаунта в этом браузере. После нового старта уже имеющиеся предметы снова будут учтены.
