  check_wallet: Подходите под один из аирдропов? Проверьте кошелёк на момент снимка. Подключите внешний кошелёк ниже для импорта карт. Для наград игрового кошелька войдите с тем же аккаунтом Google. Физические карты получают через QR-код.
