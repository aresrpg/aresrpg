  error_connection: Соединение не удалось. Проверьте подключение и повторите попытку.
  error_session: Сеанс кошелька недоступен. Подключитесь снова.
  error_unknown: Результат последнего действия ещё проверяется. Новые транзакции заблокированы до выяснения результата.
  error_recovered: Предыдущая транзакция найдена. Обновите страницу и проверьте результат перед следующим действием.
