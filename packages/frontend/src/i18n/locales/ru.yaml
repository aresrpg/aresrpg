  incentives_detail: Любой может внести SUI или KARES в общий фонд стейкинга. Каждый взнос распределяется с ближайшего активного дня за 30 активных дней. Пожертвования делятся пропорционально и не возвращаются.
  incentives_clock: Часы наград останавливаются без участников. Новые взносы не продлевают сроки старых.
  incentives_examples: Поддержите событие. Отметьте достижение. Наградите сообщество.
  play_title: Мир ждёт. Отправляйтесь исследовать.
  play_detail: Играйте в AresRPG во время первичной продажи. Познакомьтесь с сообществом и игрой за KARES.
  confirmed_refresh: Транзакция подтверждена. Обновите данные баланса.
  stage_minimum: Минимальное финансирование
  stage_maximum: Сбор до максимума
  minimum_refund: Полный возврат, если минимум не достигнут.
  full_refund_available: Весь ваш взнос доступен к возврату.
  refund_claim_note: Если продажа завершится ниже минимума, получите возврат здесь. Автоматически он не отправляется.
  staking_unavailable: Стейкинг пока недоступен в этой сети.
  basecamp_announcement: Встретьтесь с AresRPG на Sui Basecamp в Сингапуре 7–9 октября. Приходите познакомиться и получить ящики с добычей.
  funding_unknown: Данные финансирования недоступны.
  success_threshold: Порог успеха
  sale_cap: Максимум принятия
  cap_overflow: Сверх лимита
  overflow_refunds: зарезервировано для пропорционального возврата
  combat_rewards: Награды боссов
  combat_detail: 100 000 KARES обеспечивают общий боевой фонд, который может пополнить любой. Уровни боссов определяют награду, поровну делимую между победившими персонажами. Дневной предел около 54,79 KARES обеспечивает минимум пять лет начальных наград. Тихие дни и пожертвования продлевают срок. Активность эпохи меняет размер награды; пропущенные награды не становятся долгом.
  allocation_rationale: 'На старте доступно 590 000 KARES (59%): продажа, ликвидность и команда. По графику за первый год добавится максимум около 82 000, или 13,90% стартового объёма, до сжиганий. Без участников стейкинг приостанавливается. Резерв сообщества открывается по календарю. Бой может выдать меньше. Используются существующие токены, эмиссионной инфляции нет. Пожертвования перераспределяют имеющееся. Цена не гарантируется.'
  launch_market_cap: Капитализация обращения на старте
  launch_market_cap_note: 'Если продажа завершится сейчас: ограниченная цена × 590 000 KARES на старте. При недостижении минимума запуск не состоится.'
  error_generic: Не удалось завершить действие.
