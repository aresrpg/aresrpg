    section_classes: КЛАССЫ
    section_economy: ЭКОНОМИКА
    combat_desc: Бой пошаговый и проходит на сетке. На своём ходу вы тратите очки действия (ОД) на заклинания и очки движения (ОМ) на перемещение. Требование видимости задаётся каждым заклинанием. В мире вы сражаетесь с монстрами, в Колизее — с игроками. Урон зависит от соответствующей стихии и бонуса фиксированного урона.
    elements: СТИХИИ
    element_earth: ЗЕМЛЯ
    element_fire: ОГОНЬ
    element_water: ВОДА
    element_air: ВОЗДУХ
    stat_strength: Сила
    stat_intelligence: Интеллект
    stat_chance: Удача
    stat_agility: Ловкость
    critical_hits: КРИТИЧЕСКИЕ УДАРЫ
    crit_desc: У каждого заклинания и оружия есть базовый шанс крита 1 к N. Критическая характеристика уменьшает N, но шанс не превышает 1 к 2 (50%).
    crit_bonus_desc: 'При критическом ударе обычные эффекты заменяются особыми: усиленным уроном или дополнительными эффектами.'
    blocking: ЩИТЫ
    blocking_desc: 'Некоторые заклинания дают щит, поглощающий подходящий стихийный урон до истощения. Выносливости и защитной стойки нет: щиты — единственное поглощение урона.'
    resistance: СОПРОТИВЛЕНИЕ
    resistance_desc: Стихийное сопротивление снижает итоговый урон на процент, максимум 50% на стихию. Отрицательное сопротивление усиливает урон.
    mob_level_bands: ДИАПАЗОНЫ УРОВНЕЙ МОНСТРОВ
    mob_level_bands_desc: 'В заданном диапазоне уровней здоровье, опыт, Ловкость, Мудрость, положительные сопротивления и масштабируемые заклинания растут с 60% до 160%. ОД и ОМ — со 100% до 130%. Отрицательное сопротивление меняется наоборот: слабость уменьшается со 160% на минимальном уровне до 60% на максимальном.'
    life_steal: КРАЖА ЗДОРОВЬЯ
    life_steal_desc: Кража здоровья наносит урон и лечит заклинателя на половину реально потерянного целью здоровья. Лечение получают только игроки; монстры тем же заклинанием лишь наносят урон.
    life_steal_note: Сначала действует обычная формула урона, затем заклинатель лечится на половину здоровья, потерянного исходной целью. Перенаправленный урон и урон, превращённый целью в лечение, ничего не возвращают.
    chatiment: НАКАЗАНИЕ
    chatiment_desc: Наказание превращает фактически потерянное нелетальное здоровье в характеристику. У каждого хода активного бойца свой предел; следующие ходы добавляют отдельные бонусы на пять ходов. Урон монстров учитывается полностью, урон игроков и его предел — наполовину. Эрозии в Ares нет.
    healing: ЛЕЧЕНИЕ
    healing_desc: Лечение берёт базовое значение заклинания, увеличивает его Интеллектом и добавляет фиксированный бонус лечения от снаряжения и усилений. Здоровье не превышает максимум цели.
    healing_intel_value: +1% лечения за очко Интеллекта
    heal_bonus: Бонус лечения
    heal_bonus_value: Фиксированный бонус снаряжения и усилений после Интеллекта
    mobs: Монстры
    healing_mobs_value: Только Интеллект, без бонуса лечения
    leveling_desc: Максимальный уровень — 200. Лучший опыт дают монстры вашего диапазона уровней.
    points_per_level: ОЧКИ ЗА УРОВЕНЬ
    stat_points: Очки характеристик
    stat_points_value: '{{n}} за уровень'
    stat_costs_desc: Стоимость зависит от класса и базового значения характеристики. Полная шкала есть на странице класса.
    spell_points: Очки заклинаний
    spell_points_value: '{{n}} за уровень'
    xp_milestones: ВЕХИ ОПЫТА
    level_10: Уровень 10
    level_50: Уровень 50
    level_100: Уровень 100
    base_stats: БАЗОВЫЕ ХАРАКТЕРИСТИКИ
    stat_vitality: Живучесть
    stat_vitality_desc: +1 к максимуму здоровья за очко
    stat_wisdom: Мудрость
    stat_wisdom_desc: Бонус опыта
    stat_strength_desc: Масштабирование урона землёй
    stat_intelligence_desc: Усиление урона огнём и лечения
    stat_chance_desc: Урон водой и больше добычи
    stat_agility_desc: Масштабирование урона воздухом
    derived_formulas: ПРОИЗВОДНЫЕ ФОРМУЛЫ
    max_health: МАКСИМАЛЬНОЕ ЗДОРОВЬЕ
    loot_desc: Каждый побеждённый монстр проверяет каждую запись таблицы добычи один раз. При успехе количество выбирается случайно в заданном диапазоне.
    stat_rolling: БРОСКИ ХАРАКТЕРИСТИК
    stat_rolling_desc: Каждая характеристика равномерно выбирается в диапазоне шаблона. Все значения равновероятны.
    archimobs: АРХИМОНСТРЫ
    archimobs_desc: Каждый подходящий монстр с шансом 1% заменяется именованным, постоянно усиленным архимонстром. Броски независимы.
    max_members: Максимум участников
    groups_desc: 'Группа объединяет до {{max}} игроков с выбором лидера. Само членство не вводит в бой: каждый должен отправить собственную транзакцию входа. Пассивного входа по близости нет.'
    groups_xp: РАСПРЕДЕЛЕНИЕ ОПЫТА
    groups_xp_desc: Побеждённые монстры образуют общий запас опыта. Подходящие бойцы задают коэффициент группы Retro; разница общих уровней игроков и монстров уменьшает опыт. Затем каждый получает долю по своему уровню. Игрок ниже трети максимального уровня не повышает коэффициент. Мудрость применяется последней, личный урон не важен.
    groups_loot: РАСПРЕДЕЛЕНИЕ ДОБЫЧИ
    groups_loot_desc: Каждый побеждённый монстр делает один общий бросок добычи. Успешные предметы распределяются по очереди между победителями; новые игроки не добавляют бросков.
    dungeons_desc: Доберитесь до входа в городе, потратьте ключ и проходите комнаты по порядку. У каждого подземелья одно действующее лобби подготовки.
    dungeon_entry: Вход
    dungeon_entry_value: Подходящий ключ у городского входа
    dungeon_instance: Экземпляр
    dungeon_instance_value: Лобби с публичными или групповыми боями
    dungeon_completion: Завершение
    dungeon_completion_value: Пройти все комнаты
    dungeon_reward: Награда
    dungeon_reward_value: Обычное распределение добычи
    classes_desc: Всего 12 классов. Любой класс может пользоваться любым оружием, но родное оружие даёт +10% обычного и критического урона. Заклинания открываются на фиксированных уровнях.
    table_class: КЛАСС
    table_weapon: РОДНОЕ ОРУЖИЕ
    table_hp: ОЗ
    role_warrior: Воин
    role_assassin: Убийца
    role_berserker: Берсерк
    role_druid: Друид
    role_chronomancer: Хрономант
    role_guardian: Страж
    role_archer: Лучник
    role_prospector: Старатель
    role_brawler: Боец
    role_tomoda: Повелитель зверей
    role_gambler: Игрок
    role_healer: Целитель
    weapon_daggers: Кинжалы
    weapon_spear: Копьё
    weapon_bow: Лук
    weapon_axe: Топор
    weapon_sword: Меч
    marketplace: РЫНОК
    marketplace_desc: Снаряжение и персонажи выставляются в киоске по вашей цене, покупатель платит сразу. Ресурсы обмениваются на SUI в пулах без объявлений. Каждая продажа платит 10% роялти; рынок — единственный способ продажи.
    section_forgemagie: РУННАЯ КОВКА
    forgemagie_desc: Рунная ковка позволяет дробить снаряжение в руны и применять их к другим предметам для изменения характеристик. Это рискованный, но выгодный способ доводить экипировку до совершенства.
    crushing: ДРОБЛЕНИЕ
    crushing_desc: 'Каждая строка характеристики дробится независимо: высокие значения и тяжёлые характеристики дают больше рун. Сервер не решает результат. Делитель выхода соединяет кривую уровня предмета с коэффициентом шаблона в блокчейне (1%–4000%); дробление снижает его у своего шаблона и повышает у соседних.'
    crushing_tiers_desc: Ступень руны (Ba/Pa/Ra) выбирается случайно. Высокие значения повышают шанс Ra.
    rune_tiers: СТУПЕНИ РУН
    rune_ba: 'Ступень 1: минимальный вес руны'
    rune_pa: 'Ступень 2: средний вес руны'
    rune_ra: 'Ступень 3: максимальный вес, двойной опыт'
    rune_weight_desc: Вес руны равен значению, умноженному на удельный вес; Retro округляет вверх до целого. Расчёт автоматический.
    rune_table_stat: ХАРАКТЕРИСТИКА
    rune_table_note: Руны дальности, движения и действия применяются по одному разу, шанса крита — до десяти. Для Critical и Critical Outcomes рун нет.
    rune_stat_range: Дальность
    rune_stat_movement: Передвижение
    rune_stat_action: Действие
    rune_stat_raw_damage: Фиксированный урон
    rune_stat_critical_chance: Шанс критического удара
    rune_stat_earth_resist: Сопротивление земле
    rune_stat_fire_resist: Сопротивление огню
    rune_stat_water_resist: Сопротивление воде
    rune_stat_air_resist: Сопротивление воздуху
    stat_unit_weights: УДЕЛЬНЫЙ ВЕС ХАРАКТЕРИСТИК
    stat_unit_weights_desc: Удельный вес отражает боевую силу характеристики. Тяжёлые строки дают больше рун, занимают больше бюджета предмета и сложнее усиливаются сверх предела.
    rune_application: ПРИМЕНЕНИЕ РУН
    rune_application_desc: 'Для тестирования временно доступно с уровня 1 соответствующей ремесленной профессии. Применяйте по одной руне к снаряжению. Возможны три результата:'
    outcome_critical_success: Критический успех
    outcome_critical_success_desc: Руна проходит без потери характеристик
    outcome_neutral: Обычный успех
    outcome_neutral_desc: Руна проходит, другие характеристики могут снизиться
    outcome_critical_failure: Критическая неудача
    outcome_critical_failure_desc: Руна не проходит; теряется вес характеристик, равный весу руны
    success_rate: ШАНС УСПЕХА
    success_rate_desc: 'Шанс зависит от близости к максимуму: около нуля он примерно 99%, у максимума — 50%, для экзотических характеристик — около 1% независимо от уровня. Соотношение критического и обычного успеха меняется так же, с прибавкой 0,2% за уровень профессии выше первого. Ограничений по уровню обрабатываемого предмета нет.'
    puits: ЗАПАС ВЕСА (PUITS)
    puits_desc: Счётчик веса в интерфейсе накапливается, когда потери превышают вес руны. Он поглощает будущие потери раньше других характеристик и сохраняется на предмете при смене верстака и владельца.
    over_maging: УСИЛЕНИЕ СВЕРХ ПРЕДЕЛА
    over_maging_desc: Характеристики можно поднять выше естественного максимума, до 101 дополнительного веса на строку. Лёгкая Живучесть (0,25) допускает примерно +404, тяжёлая Мудрость (3) — около +33.
    forgemagie_tips: СОВЕТЫ
    forgemagie_tips_desc: Для экзо и усиления сверх предела сначала снимите дешёвые характеристики, накопив запас, затем проведите сложную руну и восстановите потери. Далёкие от максимума значения вернуть легче. При неудаче сверхлимитные и экзотические характеристики теряются первыми.
    action_points: ОЧКИ ДЕЙСТВИЯ (ОД)
    movement_points: ОЧКИ ДВИЖЕНИЯ (ОМ)
    critical_stat: КРИТИЧЕСКИЙ
    wisdom_xp: БОНУС ОПЫТА ОТ МУДРОСТИ
    wisdom_xp_desc: Каждое очко действующей Мудрости, включая эффекты, даёт +1% опыта. При 100 Мудрости опыт удваивается.
    chance_loot: УДАЧА И ДОБЫЧА
    chance_loot_desc: Средняя действующая Удача победителей, включая эффекты, множит все шансы добычи. При 600 шанс удваивается, но не превышает 100%.
    mob_loot_band: УРОВЕНЬ МОНСТРА И ДОБЫЧА
    mob_loot_band_desc: Заданный шанс — средняя точка. В диапазоне уровней он меняется с 80% до 120%, но не выше 100%. Монстры фиксированного уровня используют исходный шанс. Количество добычи от уровня не зависит.
