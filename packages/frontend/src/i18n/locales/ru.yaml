  reset_hint: Снова показывать вступление при следующем посещении каждой страницы.
  reset_action: Сбросить
  world_compass_title: Миры и общие зоны
  world_compass_body: В AresRPG несколько миров, открывающихся по мере развития. Каждый мир разделён на зоны с монстрами, ресурсами и подземельями. Зону может исследовать любой игрок, и открытие будет общим для всех.
  world_hud_title: Здоровье и быстрые ячейки
  world_hud_body: Здесь отображаются здоровье и ячейки быстрого использования предметов. В бою это место занимает панель заклинаний.
  world_fps_title: Управление миром
  world_fps_body: Рельеф детерминированно строится из опубликованных данных. Sui хранит мир и достоверную позицию X/Z, а высота вычисляется локально. Плоский режим меняет лишь отображение того же пространства. Здесь также можно выбрать качество и разрешить мировые бои только участникам группы.
  world_character_title: Игроки в мире
  world_character_body: Это ваш активный персонаж. Нажмите правой кнопкой на другого персонажа рядом, чтобы открыть доступные взаимодействия.
  world_character_tabs_title: Играйте несколькими персонажами
  world_character_tabs_body: 'У вас может быть до шести персонажей. Пригласите остальных в группу и включите следование за лидером: они будут путешествовать с вами и по прибытии автоматически вступать в подходящие мировые бои.'
  fight_title: Ваш первый ончейн-бой
  fight_body: 'Бои пошаговые. Выберите перемещения и заклинания: действия подготавливаются вместе. Завершение хода отправляет весь ход одной транзакцией Sui и рассчитывает последующие ходы монстров до следующего действия игрока. Достоверное состояние боя закрепляется на Sui. После победы заключительная транзакция использует ончейн-случайность для общей добычи и помещает награды в инвентари назначенных игроков.'
  equipment_gear_title: Снаряжение
  equipment_gear_body: Надетые предметы принадлежат выбранному персонажу. Перетащите снаряжение на силуэт, проверьте бонусы и подтвердите изменения вместе.
  equipment_inventory_title: Общий инвентарь
  equipment_inventory_body: Все персонажи аккаунта пользуются общим инвентарём. Выберите другого персонажа сверху, чтобы надеть на него те же доступные предметы.
  stats_title: Характеристики
  stats_body: Распределяйте очки характеристик, чтобы стать сильнее. Живучесть повышает здоровье, Мудрость — опыт и защиту от потери ОД/ОМ, Удача — урон водой и шанс добычи, Ловкость — урон воздухом, критические удары, удержание и выход из удержания.
  spells_title: Заклинания
  spells_body: По мере развития открываются новые заклинания. Полученные за уровни очки можно потратить здесь на их улучшение.
  jobs_title: Профессии
  jobs_body: Здесь можно следить за сбором и ремеслом, изучать рецепты и создавать предметы. Если персонажей несколько, закрепите эту страницу за ремесленником в настройках.
  runeforge_title: Рунная кузня
  runeforge_body: На уровне профессии {{level}} соответствующее ремесло позволяет улучшать снаряжение рунами. Получайте руны дроблением предметов и применяйте их здесь.
