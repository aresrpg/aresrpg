    oeuftermath:
      title: Aftermath Eggs · Oeuftermath
      description: Владельцы Aftermath Egg на момент снимка получают карту питомца Oeuftermath. Проверьте тот кошелёк; покупка Egg позднее не даёт права на награду.
    suicune:
      title: SWEEBS · Suicune
      description: Владельцы SWEEBS на момент снимка получают карту питомца Suicune. Подключите подходящий кошелёк для импорта в игровой аккаунт.
    suifren_bullshark:
      title: Suifren Bullsharks
      description: Из снимка выбрано 500 подходящих кошельков владельцев Bullshark. Проверьте карту питомца в кошельке снимка; само владение Bullshark не гарантирует отбора.
    suifren_capy:
      title: Suifren Capys
      description: Из снимка выбрано 500 подходящих кошельков владельцев Capy. Проверьте карту питомца в кошельке снимка; само владение Capy не гарантирует отбора.
    primemachin:
      title: Prime Machin
      description: Карты питомцев адресованы NFT Prime Machin из снимка. Сначала заберите подарок при NFT через Studio Mirai, затем подключите получивший кошелёк для импорта.
    vaporeon:
      title: Владельцы Vaporeon
      description: Выбранные кошельки из снимка владельцев Vaporeon получают карту питомца Vaporeon. Проверьте кошелёк снимка и импортируйте карту здесь.
    sui_basecamp_singapore:
      title: Sui Basecamp · Сингапур
      description: Ящики Sui раздаются физическими картами на Sui Basecamp в Сингапуре. Отсканируйте QR-код и войдите, чтобы получить ящик. Не раскрывайте код до получения.
    hytale_veterans:
      title: Ветераны Hytale · Топ-100
      description: Особая благодарность 100 лучшим подходящим игрокам Hytale по коллекциям, времени игры, опыту персонажей и профессиям. Награды отправляются на адрес Sui из резервной копии Hytale. Войдите в этот кошелёк через исходный аккаунт Google.
    hytale_supporters:
      title: Сторонники Hytale · Mark of the Unbroken
      description: Для каждого привязанного кошелька Hytale с покупками в магазине свыше {threshold} SUI, независимо от топ-100. Титул отправляется на адрес Sui из резервной копии. Войдите через исходный аккаунт Google, чтобы найти карту.
