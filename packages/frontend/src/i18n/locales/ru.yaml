wallet_legacy:
  sui: SUI
  how_to_get: Как получить SUI
  your_address: Адрес вашего кошелька
  send_sui: Отправьте SUI на этот адрес. Нажмите, чтобы скопировать.
  buy_directly: Купить напрямую
  buy_with_card: Купите SUI картой с доставкой прямо в кошелёк.
  buy_on_exchange: Купить на бирже
  withdraw_to_wallet: Купите SUI на бирже и выведите на адрес кошелька выше.
  faq: Частые вопросы
  wallet_description: Ваш личный кошелёк. Доступ есть только у вас. Пополняйте SUI для комиссий и торговли с игроками.
  moonpay_desc: Карта, Apple Pay, банковский перевод
  transak_desc: Карта, банковский перевод, более 100 стран
  faq_what_is_sui: Что такое SUI?
  faq_what_is_sui_answer: SUI — цифровая валюта, подобная цифровым наличным. Она работает в быстрой и безопасной сети Sui. Небольшие суммы нужны для комиссий и прямой торговли с игроками на рынке.
  faq_why_sui: Почему AresRPG использует SUI?
  faq_why_sui_answer: SUI — наш основной способ оплаты. Транзакции проходят мгновенно, менее чем за секунду, и стоят доли цента без посредников. В будущем возможны обычные валюты, но это требует значительной юридической работы, комиссий и налоговых расходов, к которым мы пока не готовы.
  faq_legal: Это законно?
  faq_legal_answer: Да. В большинстве стран покупка и хранение криптовалюты разрешены. SUI — цифровой актив, торгуемый на крупных регулируемых биржах мира. AresRPG использует его для комиссий и торговли между игроками.
  faq_eula: Это разрешено правилами игры?
  faq_eula_answer: Да. Когда криптовалюта служит только способом оплаты без NFT и спекулятивных схем, это соответствует правилам. Многие крупные игровые магазины тоже поддерживают такие платежи.
  faq_access: Кто может получить доступ к кошельку?
  faq_access_answer: 'Только вы. Кошелёк создаётся через ваш вход Google с технологией zkLogin Sui. Никто, даже команда AresRPG, не может получить доступ к средствам или переместить их. Кошелёк предназначен только для игры: не храните большие суммы, вносите лишь то, что собираетесь использовать.'
  faq_balance: Отправил SUI, но баланс не изменился?
  faq_balance_answer: Обновление может временно задерживаться. Проверьте адрес получателя, скопировав его выше. Если средства не отображаются, обратитесь в Discord и укажите ID транзакции.
