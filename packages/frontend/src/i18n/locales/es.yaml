  item_descriptions:
    aberrant_edge: 'Forjada mal. El acero se dobla en lugar de romperse. Mándala con cuidado: obedece ángulos, no fuerza.'
    aberrant_faceguard: 'Moldeada sobre un rostro que dejó de serlo. Desalienta cualquier charla.'
    aberrant_treads: 'Moldeadas sobre una forma que nunca fue del todo un pie. Dejan las huellas equivocadas.'
    abyss_core: 'Orbe pulsante de energía del vacío concentrada. Contiene los sueños de una realidad muerta. Manipular con precaución existencial.'
    abyss_loop: 'Sacado de un agua que engulló la luz por completo. Aún carga con su peso.'
    abyssal_blood_wheat: 'Grano infundido con hemoglobina con opiniones sobre los tipos de sangre.'
    abyssal_codex: 'Un grimorio dragado del fondo marino. Las páginas empapadas, de algún modo, aún pasan.'
    abyssal_conduit_staff: ''
    abyssal_edge: 'Una espada que parece absorber la luz alrededor de su hoja. La oscuridad es cosmetica. El dano no lo es.'
    abyssal_warplate: 'La diferencia entre historia de guerra y obituario.'
    abyssgrown_blade: 'Se hizo crecer su propia canal, su propio filo, su propia leve reticencia a ser envainada, de lo cual el herrero no se atribuye nada.'
    abyssgrown_cuirass_of_moonlit_mire: 'Siguió creciendo tras el ajuste, cosa que el portador descubrió el día en que dejó de quedarle y empezó, con suavidad, a insistir.'
    abyssgrown_extract: 'Un concentrado que se hizo más denso por sí solo tras embotellarse, así un frasco viejo pega más que uno nuevo y la etiqueta nunca se pone al día.'
    abyssgrown_gauntlets: 'Les crecieron garras que el herrero nunca añadió y no puede quitar, cosa que el portador ha decidido tomar como una ventaja.'
    abyssgrown_helm_of_quiet_drowning: 'Crecido, no forjado, de una concha que el Weald profundo empezó y abandonó. El portador hereda tanto la protección como el asunto pendiente.'
    abyssgrown_pendant_of_moonlit_mire: 'Le creció un hueco en el corazón que, jura el portador, guarda una gota de agua más vieja que el Weald. Se niega a evaporarse, lo que respalda la afirmación.'
    abyssgrown_pendant_of_quiet_drowning: 'Cuentas en un cordón que chascan suavemente cuando el portador respira, un consuelo en el hondo silencio hasta que caes en que chascan un tiempo después de cada respiración, no con ella.'
    abyssgrown_sabatons: 'Les creció un dibujo de suela que nadie diseñó, ajustado a un andar que nadie reconoce, y que le sienta al portador de todos modos.'
    abyssgrown_signet_of_moonlit_mire: 'Su cara-sello ha criado un patrón que cambia levemente cada vez que apartas la vista, que ningún par de testigos ha descrito jamás igual.'
    abyssrift_breastplate_of_torn_ground: 'Ingrávida en la gravedad tenue, lo cual es genial hasta que hace falta golpear de verdad.'
    abyssrift_legguards_of_split_sky: 'Diseñadas para caídas que la gravedad tenue vuelve casi sobrevivibles. Casi.'
    abyssrift_poultice_of_split_sky: 'Fresco al tacto, como el otro lado de la costura. No preguntes cómo lo saben.'
    abyssrift_treads_of_split_sky: 'No de los que vuelan. De los de «el suelo se fue y estás improvisando».'
    abyssrift_visor_of_torn_ground: 'La ranura te muestra justo lo que hay delante. El suelo nunca estuvo delante.'
    abyssrift_warbelt_of_torn_ground: 'Aguanta la carga para que tu columna no lo haga. Tu columna sigue escéptica y ruidosa.'
    adamantite_beastcaller: 'Envuelto en piel de yeti y grabado con viejos glifos de llamada. Golpea el suelo tres veces y algo aparece, por lo común frío y de mal humor.'
    adamantite_chopper: ''
    adamantite_earth_cleaver: 'Una espada larga alimentada por un corazon de ceniza aun fundido. Lo suficientemente pesada para partir la tierra. O lo que este encima.'
    adamantite_fang_daggers: 'Hojas gemelas rematadas con colmillos de rex y atadas en seda funeraria. Veloces para hender la brisa, y lo que se ocultaba tras ella.'
    adamantite_katana: 'Una katana con un corazon glacial en la empunadura. El filo corta la pretension. Y tambien a la gente. El frio adormece la culpa.'
    adamantite_longbow: 'Brazos con aleta de tiburón y placas de caparazón helado. Tensarlo exige ambos brazos y un rencor.'
    adamantite_tidestaff: 'Envuelto en seda frostshamble y coronado con un nucleo glacial. Vibra con el ritmo de mareas lejanas. Inutil para nadar.'
    adamantite_trident: 'Tres puntas de caparazon de cangrejo congelado que nunca se descongela. Eficaz contra peces, enemigos adyacentes a peces y el sentido comun.'
    adamantite_war_greaves: 'Forjadas entre levas, siempre que las fraguas tenían hierro de sobra.'
    adamantite_waraxe: 'Placas de caparazon helado en la hoja, corazon glacial en el pomo. El peso entrena tus brazos. El frio entrena tu voluntad.'
    adamantite_warhelm: 'Templado en agua de túmulo en vez de salmuera. Aguanta bien los golpes.'
    adamantsteel: 'Adamante plegado en acero por herreros que insisten en que el metal debe consentirlo primero. Las tandas logradas parecen, en efecto, extrañamente dispuestas.'
    aetherwing: ''
    alchemical_base: 'La base de todo trabajo alquimico. Huele a biblioteca humeda y promesas rotas.'
    allweather_cinch: 'Funciona igual de bien en pantanos, desiertos y tundra. Se ve mal en absolutamente todas partes.'
    aloe_crystal_salve: 'Gel de áloe cristalizado con residuos herbales. Los sanadores juran por él, los pacientes juran contra él.'
    aloe_vera: 'Una hoja suculenta llena de gel calmante. Los sanadores confían en ella, los alquimistas la acumulan, y todos los demás se preguntan por qué merece la pena pelear por una planta.'
    alpha_cleave: 'Tomada del alfa de la manada. No la dio voluntariamente, y francamente la manada tampoco.'
    alpha_fang: 'Quince centímetros de canino amarillento. El alfa que lo portaba no estaba disponible para comentar. Ni para respirar.'
    alpha_fang_circlet: 'Los lobos lloran a sus muertos con aullidos que cruzan todo el archipielago. Este circulo los recuerda todos.'
    amber: 'Savia de arbol fosilizada con bichos muertos hace millones de anos por fin util para algo.'
    amber_powder: 'Huele como un bosque que murio hace mucho tiempo y sigue resentido por ello.'
    ambivalent_torc_ap: 'Un amuleto que otorga un punto de acción por accidente, no por diseño. Su portador no puede decidir si ha sido bendecido o cargado.'
    amphibian_oil: 'Refinada de glándulas de koa. Impermeabiliza el cuero, lubrica engranajes, y hace que todo huela a pantano para siempre.'
    amulet_of_the_first_hollow: 'Recuperado del hueco que dejó la primera Polilla del Vacío jamás catalogada, cuando los catalogadores aún las numeraban en vez de nombrarlas. Es anterior a la convención de nombres. Recuerda haber sido un número.'
    ancient_hermit_robe: 'Cortado de una túnica desgastada tras cien entierros. El tejido aún retiene el polvo de las tumbas.'
    ancient_marrow: 'De algún modo aún líquido después de siglos en un esqueleto. Sabe a tristeza y cobre viejo. Por favor no preguntes cómo lo sabemos.'
    ancient_ram_splitter: ''
    ancient_tusk_cleaver: 'Tallada de una costilla mal formada. El filo aún se mantiene.'
    ancient_tusk_fragment: 'Una esquirla rota de una costilla crecida donde ninguna costilla debería.'
    anglerbone_cord: 'Ensartado en las propias vértebras de una Reina Rape, aún tenuemente luminiscente en plena oscuridad. Práctico para orientarse. Menos práctico para pasar desapercibido.'
    anglerdeep_key: 'Resbaladiza de una humedad del Weald que nunca se seca, tibia como lo es la luz-rape justo antes de dejar de serlo. La Matrona del Abismo las controla mejor de lo que aparenta.'
    anglerhide_helm: 'Cortado de la piel de la Reina Rape, las glándulas-señuelo dejadas apagadas y dormidas, en su mayoría. Mejor no comprobar cuán dormidas están.'
    anglerlight_lure_staff: 'Rematado con una luz-señuelo cautiva, que aún late al ritmo que atrae presas por el Weald profundo. Mejor no mirarla demasiado rato.'
    anglerlight_oil: 'Extraído de las glándulas-señuelo de la Reina Rape, tenuemente luminiscente incluso en el frasco. Mejor tragarlo antes de que empiece a atraer cosas.'
    antiphon_breastplate_of_last_verse: 'A prueba de agua, de fuego y de salsa. Échalo sobre los muebles o sobre ti, según qué haya que salvar.'
    antiphon_grips_of_last_verse: 'Hechas para el día de colada. Escurre una camisa, una fregona, o la verdad de alguien.'
    antiphon_grips_of_twelve_voices: 'Harina hasta el antebrazo, para siempre. La masa se defendió exactamente una vez.'
    antiphon_poultice_of_twelve_voices: 'Doce hierbas, doce rezos, una pasta. Nadie recuerda qué hierba obra, y quizá ninguna.'
    antiphon_treads_of_twelve_voices: 'Las botas de calle se quedan en el pórtico. La catedral es estricta con esto, y la lava respeta la tradición.'
    antiphon_visor_of_last_verse: 'Cuela sopa, lava y ambición con la misma eficacia imparcial. Barboquejo incluido.'
    antiphon_visor_of_twelve_voices: 'Ranurado para que doce vistas estrechas sean una. Aun así, de algún modo, se ve peor.'
    apexbound_cuirass_of_summit_vigil: 'Peto de reglamento del turno de guardia en la cima, lastrado para mantener a su portador en pie un turno entero sin tambalearse. Sentarse es otro problema, y no lo resuelve.'
    apexbound_gauntlets: 'Pensados para las manos que alcanzan la cima y aún tienen que agarrar algo al llegar. La mayoría no llega. Estos dan por hecho que tú sí.'
    apexbound_girdle_of_sealed_wound: 'Enrollado dos veces, al modo en que los Fragmentos del Muro enrollan todo aquello que no se fían del todo de que siga cerrado. De momento la cintura ha cooperado.'
    apexbound_helm_of_sealed_wound: 'Fundido para soportar lo que la Herida exhala cuando se la fuerza a cerrarse. La visera se sella por dentro, lo que te dice de qué protege de verdad al portador.'
    apexbound_pendant_of_summit_vigil: 'Destinado a reposar contra el esternón de quien monta la guardia más alta, lo bastante cerca del corazón para llevar la cuenta de a qué ritmo va.'
    apexbound_ration: 'Medicina de campaña repartida a los defensores del muro, sellada en cera y garantizada para durar lo que sus defensores no suelen durar. Siniestro, pero el etiquetado es honesto.'
    apprentice_blade: 'La primera espada que hace un herrero que no se rompe al instante. Un hito. Bajo pero aun asi.'
    aragog_fang: 'Un colmillo goteante de veneno arrancado de las fauces de la Reina Araña. La toxina que cubre su superficie oscila entre el púrpura y el negro, disolviendo todo lo que toca.'
    aragog_fangs: ''
    arcane_bread: 'Horneada en grandes cantidades, bendecida una vez, jamás cuestionada. Mantiene a una columna en marcha.'
    arcane_pastry: ''
    arcane_reagent: 'Siete hierbas, un chorro de agua y ningún motivo terrenal para el brillo morado. Los alquimistas lo archivan como investigación; los demás, como mala señal.'
    arcane_solution: 'Reactivo alquimico endgame que pulsa con potencial magico puro. Una gota sobre la piel causa sinestesia temporal.'
    arcane_spore: 'Saturada de magia pura hasta el punto de una agitación permanente, zumba en un tono que rompe el cristal cercano y reordena las notas al pie de los eruditos sin pedir permiso. La única regla de seguridad transmitida para manejarla: no estornudar.'
    arcaneshroom: 'Un hongo impregnado de energia arcana residual que le hace emitir un tenue resplandor acusatorio, como si responsabilizara personalmente al recolector por perturbar su contemplacion erudita. Manipularlo con la piel desnuda puede producir levitacion involuntaria, sinestesia temporal y un deseo inexplicable de tomos polvorientos.'
    arcanite: 'Zumba con magia residual que hace girar las brujulas y vuelve a los magos insoportablemente presumidos.'
    arcanite_hoe: 'Imbuida con suficiente energia arcana para hacer brotar tierra muerta. Tambien hace brotar granjeros muertos, pero de eso no hablamos.'
    arcanite_pickaxe: 'Rompe minerales endurecidos por la realidad como un recaudador rompe suenos. La veta no tiene oportunidad.'
    arcanite_powder: 'Se reorganiza espontaneamente en simbolos arcanos cuando se deja desatendido. Muy distractor.'
    arcanite_sickle: 'Forjada con mana cristalizado y malas decisiones. Corta matorrales malditos como si le debieran dinero.'
    arcanize_flour: 'Harina púrpura que levita brevemente, los panaderos trabajan rápido.'
    archaeo_belt: 'Emplumada, fosilizada, y aun convencida de que podia volar.'
    archaeo_longbow: 'Emplumado con plumas de un ave que cruzaba las profundidades mucho antes de que alguien llevara un calendario para anotar la fecha. Las flechas parecen conocer aún la vieja ruta. La toman, apuntes hacia allí o no.'
    archaeo_plume: 'Protopluma de una criatura aun indecisa, evolutivamente, entre lagarto y ave.'
    archaeo_plume_javelin: 'Emplumada con protoplumas. Vuela mas recto de lo que nada con plumas deberia tener derecho a volar.'
    archimob_legguards: 'Curtida de la piel del lider de la manada. El resto de la manada aun manda tarjetas de agradecimiento, sin que nadie lo pida.'
    arisen_tokeko: ''
    ashen_philter: 'Gris, arenoso y técnicamente potable. La ceniza nunca se posa, lo que te dice dónde estás.'
    ashen_visor: 'Huele siempre a fogata y decisiones cuestionables. Bloquea buena parte de ambas.'
    ashraptor_fang_pendant: 'El colmillo aun recuerda el fuego del que salio. Tu clavicula tambien, a veces.'
    backbone: 'Blindada primero a lo largo de la espina, bajo la sólida teoría de que un cadáver de pie sigue contando como línea sostenida.'
    backswing: 'El movimiento de retorno hace más daño que el golpe previsto. El herrero lo llama una característica. Quien la empuña lo llama una sorpresa.'
    bag_aloe_vera: 'Un recipiente alguna vez respetable que ahora rezuma una secrecion botanica viscosa por cada costura, consecuencia inevitable de confinar cincuenta especimenes de aloe vera en un espacio disenado para considerablemente menos plantas gelatinosas. Los alquimistas mantienen con admirable conviccion que sus propiedades terapeuticas aumentan con la compresion, una afirmacion que el exterior de la bolsa — resbaladizo, maloliente y vagamente palpitante — poco hace por respaldar.'
    bag_amber: 'Un pesado saco de lagrimas fosilizadas. El arbol lloro para que te hicieras rico.'
    bag_arcaneshroom: 'Cincuenta arcanosetas consolidadas en un recipiente que zumba con magia residual tan concentrada que ha desarrollado su propio debil campo gravitacional, causando que objetos pequenos deriven hacia el con la inevitabilidad de polillas hacia una llama particularmente libresca. La bolsa ocasionalmente levita cuando se deja desatendida, lo que su propietario debe explicar a posaderos cada vez mas escepticos.'
    bag_arcanite: 'El zumbido se intensifica cuando llevas mas de diez. Nadie sabe por que y nadie quiere averiguarlo.'
    bag_arcanize: 'Una luminiscencia púrpura se filtra por las costuras. El grano zumba a frecuencia inquietante.'
    bag_barley: 'Un saco de cebada que traquetea con el sonido de grano cosechado bajo protesta.'
    bag_blood_wheat: 'Palpita, débilmente, siguiendo un ritmo que nadie ha identificado. Inquietante en un saco de grano. Considerablemente peor en un equipaje junto al que pensabas dormir.'
    bag_bloodstone: 'Todo lo que contiene termina manchado de rojo. Estadisticamente, lo de fuera tambien.'
    bag_burnt_wheat: 'Abrir este saco libera una fragancia ahumada y la impresión de una terrible decisión agrícola.'
    bag_crimson_truffle: 'Cincuenta trufas, un solo saco, y un valor de mercado para el que la costura jamas fue disenada.'
    bag_cursed_fungus: 'Cincuenta hongos malditos sellados en una bolsa que murmura en una seleccion rotativa de idiomas, ninguno de los cuales pertenece a civilizacion viva alguna, dirigiendose a su portador por nombres que no reconoce pero que sin embargo producen un escalofrio involuntario. Herbolarios experimentados la llevan a distancia, no porque el manual lo recomiende sino porque la bolsa misma lo sugirio.'
    bag_cursed_gem: 'La bolsa susurra tus miedos mas profundos. Sobre todo gestion de inventario y limites de peso.'
    bag_draconite: 'Caliente al tacto, gruñe levemente. El ultimo mensajero dejo una resena de una estrella y ninguna direccion de reenvio.'
    bag_draconize: 'Las escamas de fuera podrian ser naturales, o significar que el grano de adentro se esta sindicalizando.'
    bag_dragonlily: 'Cincuenta lirios-dragon, escamas superpuestas, susurrando lo justo para mantener despierto al gato del porche toda la noche.'
    bag_duskite: 'Vieja rima de mineros: lo que la duskita toma, la duskita guarda, y la luz entra y nunca duerme. En la práctica solo significa que el saco pesa más de lo aparente y cuesta menos de lo debido.'
    bag_green_mushroom: 'Cincuenta setas verdes. Legal y botánicamente distintas de las divertidas.'
    bag_himalayan_wheat: 'Cosechado a altitudes donde el aire es escaso y las regulaciones agrícolas inexistentes.'
    bag_ivory_shrooms: 'Cincuenta hongos luminiscentes empacados con tal densidad temeraria que la bolsa emite un brillo fosforescente constante visible desde una distancia vergonzosa, funcionando como una luz nocturna portatil que nadie solicito y todos en un radio de treinta metros se ven obligados a reconocer. Comerciantes han intentado vender esto como una ventaja en vez de un inconveniente, con resultados predecibles.'
    bag_jade: 'Suficientes piedras verdes para hacer llorar a un mercader de alegria y luego de sospecha.'
    bag_malt: 'El leve aroma de fermentación sugiere que esta malta planifica su carrera como bebida.'
    bag_moonstone: 'Brilla a traves de la tela por la noche haciendo el sigilo completamente imposible para los ladrones.'
    bag_nightcap: 'Una bolsa con cincuenta setas nocturnas que parece devorar la luz ambiental en su vecindad inmediata, creando un bolsillo localizado de oscuridad que sigue a su portador con la persistencia silenciosa de una conciencia culpable. La proximidad prolongada induce un desasosiego existencial progresivo que los herbolarios han aprendido a confundir con profesionalismo.'
    bag_obsidianite: "Manéjalo con cuidado, o no, y en cualquier caso ten preparada de antemano tu excusa para el sanador. Ya ha oído todas las versiones de 'solo lo estaba cargando'."
    bag_phantom_spore: 'Cincuenta esporas que solo a veces están ahí, como una promesa que solo a veces se cumple. Cuéntalas dos veces. Una tercera por despecho. La cifra jamás concordará consigo misma.'
    bag_quartz: 'Cincuenta trozos de cristal turbio traqueteando como un saco de promesas rotas.'
    bag_red_orchid: 'Un bolso de cuero que contiene cincuenta orquideas sanguineas tan apretadas que la bolsa se ha tenido de un carmesi profundo y permanente desde adentro, como si fuera la escena de un crimen muy pequeno y muy botanico. Abrirlo libera un perfume que es partes iguales de dulzura metalica y amenaza silenciosa.'
    bag_suize: 'Los granos de dentro atrapan la luz como si audicionaran para un mejor recipiente.'
    bag_tanjirize: 'Una bolsa cálida, como si el tanjirize aún está convencido de pertenecer al sol.'
    bag_ukranize: 'El grano de Ukranize nunca se llevó bien con la buena tierra — cuentan que prefiere crecer donde la cosecha es más difícil de alcanzar. Cultivo astuto. Terrible para las rodillas.'
    bag_wheat: 'Cincuenta fanegas de trigo. El Centinela de Paja dio su vida; la panadería se encogió de hombros.'
    bag_witherbloom: 'Cada flor guarda su mejor actuación para el instante de su muerte, con la entrega teatral de un actor decidido a ser recordado. Abre el saco y todo bardo al alcance del oído coge la pluma a media conversación.'
    baked_compound: 'Un trozo endurecido de harina y esporas. Los alquimistas lo adoran. Los demas cuestionan el olor.'
    banner_shard: 'Arrancado del estandarte ceniciento antes de su caída. Aún carga el peso de la línea que marcaba.'
    barbfin_battleaxe: 'Aletas barbadas como algo sacado de aguas más profundas de las que el Weald técnicamente tiene. Nadie ha preguntado de dónde salieron en realidad las aletas.'
    bark_grimoire: 'Paginas de corteza prensada. Los hechizos son sobre todo dibujos de ovejas enfadadas.'
    barley_bread: 'Un pan denso que sabe a personalidad de granjero. Saciante, fiable y sin alegria.'
    barley_flour: 'Una harina gruesa que los cerveceros codician y los panaderos toleran.'
    barley_hardtack: 'Military rations that outlast the soldiers who carry them. Jewelers use the crumbs as polishing abrasive.'
    basalt_carapace_of_black_choir: 'Placa volcánica que bebe la luz. En una nave oscura eres, en la práctica, un agujero.'
    basalt_core: 'El centro sin fundir de una bomba de lava. Frío por fuera, aún decidiéndose por dentro. No lo apures.'
    basalt_crest_of_black_choir: 'Bastante pesada como para que cabecees con el réquiem, quieras o no.'
    basalt_crest_of_molten_antiphon: 'Ponértela no te hace invisible en la fiesta. Pero sí detiene las gotas de cera ardiendo.'
    basalt_falchion_of_molten_antiphon: 'Golpeas, responden, la conversación termina. Rara vez un diálogo largo.'
    basalt_fists_of_molten_antiphon_choir: 'El coro canta un verso, luego lo repite, más fuerte. Estos también. Aprende el tempo o llévate la segunda estrofa.'
    basalt_fists_of_molten_antiphon_pyre: 'Cerdas de alambre sobre los nudillos. La mugre, el óxido y la esperanza salen con la misma facilidad.'
    basalt_flail_of_black_choir: 'Girando en su cadena, suena a campana de difuntos. Apropiado, dadas las citas que cumple.'
    basalt_greaves: 'Lo más terco que jamás atarás a una rodilla. Tiene opiniones sobre moverse.'
    basalt_knobstick_of_molten_antiphon: 'De arce, bien enharinado, blandido con la autoridad de quien te ha esperado despierto toda la noche.'
    basalt_locket_of_black_choir: 'Guarda un único tono grave, sellado en piedra. Rómpelo en la crisis; lamenta en la calma posterior.'
    basalt_maul: 'Homologado para alfombras, tapices y cualquier otra cosa que guarde rencor junto con el polvo.'
    basic_pickaxe: 'Esto es lo que pasa cuando las restricciones presupuestarias se encuentran con la ambición subterránea.'
    bear_battleaxe: 'Imbuida con furia de oso y una cantidad irrazonable de calor corporal.'
    bear_claw: 'Hasta hace poco unida a un oso mucho mas grande y mucho menos cooperativo.'
    bear_claw_ring: 'El oso lucho por esto. Perdio. Sobre todo por un tecnicismo.'
    bear_club: 'El oso pidio regalias por este diseno. Legal dijo que no. El oso discrepo, en voz muy alta.'
    bearclaw_gauntlets: 'Provistos de garras arrancadas a un Oso de Musgo que ya no las necesitaba. La fuerza de agarre se transfiere; el temperamento también, por lo visto.'
    bearfury_battleaxe: 'El oso cuya garra fue usada para esta hacha estaba bastante molesto. Comprensible.'
    bearheart_signet: 'Engastado con un fragmento de garra del tamaño de la del propio Patriarca Oso. Llévalo el tiempo suficiente y olvidas cómo lanzar un golpe — solo recuerdas cómo sobrevivir a uno.'
    beast_hauler_sash: 'Ceñida por quien arrastraba los carros de recuperación. Deshilachada justo donde reposaba la cuerda.'
    beastcaller_talisman: 'Enhebrado con cuerda de Pastor Estático, zumba débilmente cuando la manada está cerca. Las manadas de rex confunden brevemente a quien lo lleva con uno de los suyos.'
    behemoth_pearl: 'Encontrada en la garganta de un antiguo Koa Titán. Vale una fortuna, si logras recuperarla con educación.'
    behemoth_pearl_amulet: 'Engastado con un fragmento demasiado liso para haberse roto solo.'
    bent_sword: "Forjada por alguien que confundio 'templar' con 'pisarla'. Funcional. Apenas."
    berserk: 'Forged for those who answer every problem with more axe. Rage not included, but implied.'
    binding_paste: 'Compuesto adhesivo que une materiales organicos y minerales. Los herreros lo compran mas rapido de lo que los alquimistas pueden preparar.'
    binding_ring: "Ata energia espectral a la carne mortal. La letra pequena menciona 'leve deriva existencial' y nada mas."
    binding_thread: 'Ata a un espectro a este plano. Cortalo y mira varios problemas evaporarse a la vez.'
    bisonbrute_bow: 'Encordado con tendon de bisonbruto. Cada flecha lleva el peso emocional de una estampida.'
    blizzard_tassets: 'Placas de muslo de torio incrustadas con cristales de escarcha. Cada paso suena a vidrio roto.'
    blockhead: 'Nombrada por el aprendiz del herrero, que lo decía como insulto, y aun así fue ascendido.'
    blood_wheat: 'Lo cortas y sangra — una savia espesa y oscura del color de una vieja herida, como si la tierra que lo hizo crecer hubiera sido lastimada primero y preguntada después.'
    blood_wheat_flour: 'Molida en un carmesí tenue, mejor horneada en pan que se come deprisa y nunca se piensa. El palpitar ocasional es, insisten los panaderos, puramente cosmético.'
    bloodstone: 'Mineral rojo oscuro que definitivamente obtuvo su color del oxido de hierro y no de maldiciones antiguas probablemente.'
    bloodstone_powder: 'Inquietantemente calido en la palma. Los alquimistas lo adoran. Todos los demas guardan las distancias.'
    bloodveil_orchid: 'Una orquídea carmesí cuyos pétalos lloran una savia tan oscura que mancha cuanto toca, incluida tu reputación de herbolario serio.'
    bloodwheat_bread: 'La miga carmesi pulsa debilmente al cortarla. Los panaderos insisten que es termico. Los panaderos mienten.'
    blue_antenna: "Aún late con el último pensamiento del insecto: '¿Por qué el gigante aplastó a mi pareja?'"
    blunt_cudgel: 'Un palo con pretensiones de arma. Tus enemigos moriran... de risa. Eventualmente.'
    boar_gorer: 'Diseñada para cazar jabalíes, pero funciona con todo lo que carga con poco juicio.'
    boar_hide: 'Grueso, erizado, y huele a barro. El jabalí estaba irrazonablemente enfadado por perderlo. Procedimiento estándar.'
    bogforged_core: 'Un núcleo endurecido sobre fuego de pantano frío, que lo deja denso y calladamente erróneo al tacto de un modo que nunca acaba de irse.'
    bogforged_elixir_of_fen_below: 'Destilado sobre fuego de pantano que arde frío, dándole un frescor que persiste en la lengua mucho después de acabada la cura.'
    bogforged_greataxe_of_fen_below: 'Forjada para quien baja al Fen de Abajo y espera aún blandir algo al subir, cosa que pocos hacen.'
    bogforged_greataxe_of_rising_tide: 'Martillada en un yunque de pantano que se traga las chispas enteras, cosa que el herrero halló inquietante y el hacha, por lo visto, de su agrado.'
    bogforged_sash: 'Tejido con junco de turbera que jamás llega a secarse del todo. Aclara la mente maravillosamente — sobre todo vaciándola. Quien lo lleva se siente estupendo y ya no sabría explicar por qué.'
    bogforged_vambraces_of_rising_tide_matron: 'Ajustados a esa marea cuya existencia el Weald finge ignorar, endurecidos en pleamar, cuando el metal, brevemente, accede a cooperar.'
    bogforged_vambraces_of_rising_tide_mire: 'Templados en agua de pantano tan inmunda que el metal salió más duro y el herrero salió tosiendo una semana.'
    bogsteel: 'Hierro de turbera reducido y plegado hasta tomar filo, cosa que hace a regañadientes y solo para quienes se lo ganaron a pulso.'
    bone_charm_necklace: 'Pequenos huesos ensartados en un cordon. Parece tribal-chic o asesino-serial-chic segun tu atuendo.'
    bone_flail: 'Ensamblado con lo que el bonelet dejo atras. Traquetea con cada golpe.'
    bone_greatbow: ''
    bone_marrow_club: 'Ahuecado del propio fémur de un Vagabundo de Médula y relleno de plomo por si acaso. En algún lugar allá abajo, se dice que Nerak termina notando estas cosas. Mejor tener a mano una buena excusa.'
    bone_wand: ''
    boneguard_edge: 'Tomado de un guardahuesos que, siendo justos, no oponía mucha resistencia en ese momento — sobre todo porque estaba completa, profesionalmente muerto.'
    boneherald_greatsword: 'Jurada sobre huesos anteriores a toda corona jamás fundida por otra mejor. El juramento, todos coinciden, es irrompible. La espada en sí, te recordará el heraldo, sigue muy a la venta.'
    bonelord_flail: 'Los huesos son auténticos, atados con el tendón de la bestia que rondaba estos pantanos. Oscila con un peso que desafía toda lógica; mejor no preguntar.'
    bonelord_greatsword: ''
    bonelord_legguards: 'Talladas en fémures demasiado grandes para nada que aún respire. El ajuste es exacto.'
    brackish_breastplate_of_brackish_deep: 'Homologado a presión para profundidades que el Weald oficialmente no tiene, la clase de cosa que un herrero estampa en un peto y luego prefiere no comentar.'
    brackish_composite: 'Un material estratificado curado en agua salada, que lo deja más fuerte y más raro, dado a un olor que se intensifica justo cuando preferirías que no.'
    brackish_edge_of_brackish_deep: 'El temple en agua salada lo dejó justo lo bastante corroído para herir de maneras que un corte limpio ignora, lo que el Weald cuenta como virtud.'
    brackish_grips_of_brackish_deep: 'La sal se metió en las junturas y se quedó; se agarrotan cada tanto en el momento menos oportuno, con fiabilidad.'
    brackish_legguards_of_brackish_deep: 'Homologados para vadear un agua que pudriría cualquier otra cosa hasta la pierna, cosa que a estos también les hará al final; el herrero solo no dice cuándo.'
    brackish_legguards_of_silt_throne: 'Recuperados de un cortesano que se sentó demasiado tiempo en la sala ahogada, y que, técnicamente, sigue sentado.'
    brackish_poultice_of_silt_throne: 'Rellena de barro salado que limpia una herida y escuece lo bastante para que el paciente sepa, con exactitud, cuándo hace efecto.'
    brackish_recurve_of_brackish_deep: 'Encordado con tendón hinchado por la sal que nunca menguó, así se tensa con más peso del que aparenta y premia a los brazos que lo esperaban.'
    brackish_twin_knives_of_silt_throne: 'Dagas de corte dragadas de la sala ahogada, aún cruzadas como se posaron sobre un cuerpo que el limo reclamó hace mucho.'
    brackish_waraxe_of_brackish_deep: 'La corrosión trepó al astil y se detuvo, contenida por nada identificable, algo en lo que su portador procura no confiar demasiado.'
    brackish_warbelt_of_silt_throne: 'Su hebilla de corte se corroyó en una forma abstracta que ahora no significa nada, lo cual es más honesto que lo que significaba antes.'
    breach_ash: 'El hollín que nunca cae. Aquí deriva de lado, por despecho hacia la gravedad.'
    breachforged_brew_of_nine_faults: 'Macerada con sal de médula de Guardapuertas, la beben los centinelas que cuentan brechas en lugar de ovejas. Cierra primero las heridas pequeñas; las grandes, según la teoría, saben esperar.'
    breachforged_carapace_of_fifth_breach: 'Desprendido entero de una Vaciopolilla que superó la quinta brecha sin lugar donde mudar. Encaja como segundo exoesqueleto: funcionalmente, ya lo es.'
    breachforged_carapace_of_nine_faults: 'Cada juntura es un punto por donde podría ceder. De momento no. «De momento» hace mucho trabajo.'
    breachforged_cincture_of_fifth_breach: 'Un Vigía del Umbral la ceñía mientras medía a palmos cada paso abierto antes de decidir si merecía seguir abierto. La hebilla aún marca cinco posiciones. Su significado se perdió con él.'
    breachforged_circle_of_nine_faults: 'Anillo de la mano contadora de un Guardapuertas cuyo oficio era registrar brechas antes de que maduraran en problema. Sigue contando. Ese instante extra de prontitud que regala es el anillo terminando su turno por ti.'
    breachforged_claymore_of_nine_faults: 'La blandía un Vigía del Umbral que dejó de contar fallas y pasó a cerrarlas en persona. Pesa demasiado para apuntar con finura. La finura nunca estuvo en el plan.'
    breachforged_crest_of_nine_faults: 'Nueve crestas, una por cada grieta que el fundidor contó antes de rendirse.'
    breachforged_fists_of_fifth_breach: 'Fundidos sobre los nudillos de un Guardapuertas que golpeaba primero y pedía credenciales después. Cada impacto deja un cardenal con forma de arco: una puertecita diminuta.'
    breachforged_greatbow_of_fifth_breach: 'Lo encordó un Guardapuertas que medía el alcance en umbrales cruzados, no en pasos. La flecha gana siempre, por un umbral entero, a cualquier arrepentimiento.'
    breachforged_philter_of_fifth_breach: 'Embotellada por el Guardapuertas al que tocó la quinta vela, en tiempos en que las velas aún terminaban. Sabe a quedarse inmóvil mucho rato.'
    breachforged_splitter_of_fifth_breach: 'Las cuatro anteriores no cuajaron. Esta se forjó de peor humor.'
    bread_leavening_agent: 'Hace que el pan suba con eficiencia alquimica. Los panaderos lo consideran un milagro. Los alquimistas consideran que los panaderos se impresionan facilmente.'
    bristleguard_cuirass: 'Cuero de tusker curtido en su propia bilis, porque los tuskers son justo el tipo de criatura que insistiria en eso.'
    bristlemail_gauntlets: 'Eslabones enhebrados con cerdas de jabali que se niegan, por principio, a quedar lisas.'
    bristlemail_pants: 'Sentarse con cuero de tusker es, tecnicamente, un acto de fe. Las cerdas discrepan de esa fe.'
    bristlemail_patch: 'Piel de vientre de jabalí tan densa que detiene flechas. El kevlar de la naturaleza, excepto que huele terrible y nadie te lo agradece.'
    bronze_greaves: 'Forjadas en bronce lo bastante denso para desviar una hoja y lo bastante pesado para convertir cada escalera en un enemigo mortal. El herrero, dicen, tenía antebrazos como árboles talados. Se espera que quien las use se procure los suyos.'
    bronze_helm_of_the_shore: 'Una cúpula de bronce adornada con percebes que ningún restregado quitará. El dueño original era un guardia costero que amaba el mar hasta que el mar le devolvió el amor. Permanentemente.'
    bronze_wolf_cuirass: 'Placas de bronce sobre cuero de lobo. Dicen que el último aullido del lobo está preservado en el metal — aunque la mayoría de usuarios solo reportan oír su propia respiración agitada tras el tercer tramo de escaleras.'
    browbeaten: 'Abollado en el mismo punto por los mismos escombros caídos, tantas veces que la abolladura tiene nombre propio entre los peregrinos.'
    bulwark_band: 'Tu dedo ahora, hablando legalmente, es una fortificacion.'
    bulwark_of_the_risen: 'Recuperado de un túmulo que se reabrió al anochecer. Los muertos ya no lo necesitaban.'
    bulwark_stubborn: 'Se niega a rendirse por puro y magnifico rencor. Hasta ahora, funciona.'
    burnt_wheat_flour: 'Harina pre-tostada, un servicio atento para los panaderos.'
    caller_embrace: 'Las yemas brillan cuando un familiar se acerca. Util. A veces demasiado intimo.'
    canticle_cuisses: 'Las estrías silban una quinta parte de tono al caminar. El coro ha aprendido a transportar a tu alrededor.'
    canticle_greataxe: 'Guardada para los troncos tercos del fondo de la pila. También zanja casi cualquier otra disputa de la finca.'
    cantor_basalt: 'Piedra de suelo de cocina, alisada por cuatro siglos de cocineros dando vueltas.'
    canvas_boots: 'Impermeables los primeros tres segundos. Despues son esponjas con cordones. Comodidad: humeda.'
    cape_fuwa_black: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_fuwa_white: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_kamui: 'A cloak cut from something that should not have had a hide. It remembers being worn by worse.'
    cape_lorito_agility: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_chance: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_intelligence: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_strength: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_vitality: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_wisdom: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    capstone_lattice: 'Un armazón cristalino que solo fragua bajo la presión que solo se halla en la cumbre, y por eso resulta exactamente tan difícil de obtener como suena.'
    capstone_treads_of_last_ascent: 'La suela que solo importa una vez, en el paso final, que es justo el momento en que a casi todos los portadores dejan de quedarles pies con que apreciarla.'
    capstone_visor_of_last_ascent: 'La corona que le entregan al peregrino que alcanza la cima, en el breve instante antes de que comprenda lo que alcanzar la cima cuesta de verdad.'
    capstone_warbelt_of_first_dawn: 'Lastrado para anclar un cuerpo contra la corriente ascendente que tira de todo lo cercano a la cima. Ancla bien. A qué te ancla es asunto tuyo.'
    capuche_bara: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_air: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_earth: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_fire: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_water: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_wisdom: ''
    capuche_mo: 'A tattered hood strung with tiny skulls. Mo never explains where they came from, and nobody asks twice.'
    casque_hayate: 'Swift-wind steel. Light enough to run in, loud enough to be heard coming.'
    cataclysm_brew_of_nine_faults: 'Los Profetas de Ceniza la preparan la noche antes de un cataclismo que ya han visto y no pueden dejar de ver. No evita nada. Solo calma la mano que debe mirar.'
    cataclysm_core_rift: 'El nudo denso que deja un seísmo al agotarse. Tibio, paciente, aún dudando si ha terminado.'
    cataclysm_core_void: 'No pesa nada y aun así cae. Se consultó a físicos; los físicos se marcharon.'
    cataclysm_extract: 'Lo último que se destila de un seísmo agotado. Amargo, potente y reacio a estarse quieto.'
    cataclysm_tassets_of_fifth_breach: 'Forjadas en la quinta vela por un centinela de puertas, cuando contar dejó de significar nada. El metal recuerda la posición de firmes; las piernas del portador, ya no tanto.'
    cataclysm_tassets_of_nine_faults: 'Nueve grietas cruzó el Guardapuertas en una sola ronda; la décima fue la que nadie contó.'
    cataclysm_warboots_of_fifth_breach: 'Para cruzar a toda prisa una brecha que se ensancha. La teoría es sólida. La brecha discrepa.'
    cataclysm_warboots_of_nine_faults: 'Hechas para pisar donde nada más lo hace. Ese «nada más» incluye el suelo.'
    celestial_wafer: 'Fue catalogado dos veces, bajo dos teorías distintas, una discrepancia que nadie tiene la tarea de resolver.'
    chantmarked_crusher_of_twelve_voices: 'Calidad de comedor colectivo. Lo que les hizo a las patatas, se lo hará a la moral.'
    chantmarked_edge_of_last_verse: 'La parte de la canción tras dar todos por hecho que había acabado. Una sorpresa. Siempre la última.'
    chantmarked_grips_of_twelve_voices: 'Calibrados con un tarro de encurtidos sellado antes de fundarse el coro. Se abrió. Con el tiempo.'
    chantmarked_legguards_of_last_verse: 'Reservado para oficios, funerales, y días en que ambos coinciden. Aquí, eso es casi a diario.'
    chantmarked_legguards_of_twelve_voices: 'Planchado hasta una raya capaz de abrir cartas. Sentarse sería vandalismo.'
    chantmarked_rod_of_twelve_voices: 'La parte útil se secó hace años. Desde entonces el palo dirige el coro, mal.'
    chantmarked_tonic_of_last_verse: 'Para cuando el combate había acabado y luego, groseramente, no. Te compra un estribillo más.'
    chantmarked_twin_knives_of_last_verse: 'Las agujas de la abuela. La bufanda nunca se terminó; el ladrón nunca se recuperó.'
    chantmarked_visor_of_last_verse: 'El pomo de arriba es un defecto de diseño y un asa de transporte, todo en uno.'
    chantmarked_warbelt_of_last_verse_choir: 'El verso al que la canción siempre vuelve. Abróchala y tú también vuelves. Molestamente.'
    chantmarked_warbelt_of_last_verse_pyre: 'Presillas para el martillo, las cizallas, la cera, el agua bendita. Una presilla vacía significa que el problema te encontró primero.'
    charged_vault_key: 'Forjada en voltvidrio, permanentemente cargada de electricidad estática de las células tormentosas de la meseta. La bóveda del Guardián de la Tormenta ha sido alcanzada por rayos más veces de las que nadie ha contado, y esta llave es la razón de que todavía abra.'
    charite_brick: 'Ladrillo denso de harina quemada y ambar. Los herreros lo muelen como agente de union para armaduras.'
    chief_mark_brand: 'Sirve para marcar reclutas demasiado nuevos para saber mejor. Calienta rápido, se borra despacio.'
    chipped_axe: 'La hoja tiene mas mellas que una bolsa de papas fritas. Cada golpe lanza fragmentos. AoE natural.'
    chitin_cutlass: 'Mitad quitina, mitad metal oxidado. Sorprendentemente efectivo para arrepentir acercamientos.'
    chitin_gauntlets: 'Caparazón de insecto laminado convertido en guantes, ligeros pero lo bastante resistentes para desviar golpes de refilón. Al parecer, el usuario anterior los encontró muy cómodos, justo hasta que le estalló la bolsa de veneno.'
    chitin_longsword: 'Esta hoja fue tallada del caparazón de alguna bestia sin nombre de las profundidades, su filo irregular pero inquietantemente afilado.'
    chitin_shellplate: 'Dicen que protege contra los apuñaladores, sobre todo porque el hedor asegura que nadie se acerque lo suficiente para intentarlo.'
    chitin_walkers: 'Estas botas se retuercen con cada paso, pues las placas de quitina son meramente un caparazón para las criaturas que viven dentro.'
    choir_conductor_staff: 'Apúntalo y toda la pira sigue tu tempo. Suéltalo y el fuego improvisa. No lo sueltes.'
    choir_hymnbread: 'Horneado durante una homilía que se negaba a terminar. La corteza cuajó hacia la cuarta hora.'
    choir_obsidian: 'Losa volcánica pulida. Fresca al tacto, inmune por igual a los cortes de cuchillo y a las sartenes calientes.'
    choir_procession_boots: 'Hechas para un paso lento y digno al altar. Echa a correr y la dignidad se va primero.'
    choirblade_altus: 'Una vara entera de roble curado. Cada niño de la parroquia sabe exactamente cuántos problemas mide.'
    choirforged_cuirass: 'Protección de placas completa con forma de delantal de repostería. El volante es estructural.'
    choirforged_draught: 'El último chorro de la olla. Amargo, arenoso, y aun así la taza más cargada del día.'
    choirforged_gauntlets_of_cooling_vent: 'Ranurados para expulsar el calor, lo cual hacen, directo a tus muñecas. Un trato, no un regalo.'
    choirforged_greatblade_of_cooling_vent: 'Sale cuando el asado está entero y la familia sentada. El asado rara vez es lo único que se trincha.'
    choirforged_greaves_of_ashen_song: 'Pinzas de ciclista en una catedral sin bicicletas. La previsión es su propia recompensa.'
    choirforged_helm: 'Hierro fundido, tamaño familiar. La abolladura de la izquierda es de cuando el anterior dueño tuvo una opinión.'
    choirforged_ration_of_ashen_song: 'Esto lo preparó la madre de alguien. Los bocadillos van cortados en triángulos; el apocalipsis puede esperar.'
    choirforged_sabatons_of_ashen_song: 'Homologadas para riadas, barro y magma poco profundo. Una talla de más, como debe ser.'
    choirforged_signet: 'De hierro, abollado, talla única que no le queda a nadie. Ha desviado agujas, astillas, y un asesinato.'
    choirmaster_locket: 'Todas las llaves de la catedral en un solo aro de hierro. Quien lo lleva responde de cada puerta cerrada y de cada ruido al otro lado.'
    chokepoint: 'Se posa justo donde la garganta se estrecha hasta la nada. El joyero que lo diseñó insiste: pura coincidencia.'
    cinchward: 'Se aprieta solo cuando quien lo lleva olvida respirar con cuidado cerca de la herida. Tiene opiniones firmes sobre la postura.'
    cinder_band: 'Un fragmento de un corazon que fue entero. Recuerda. Quiere recuperar el resto.'
    cinder_bow: ''
    cinder_cleave: ''
    cinder_crown: 'El brillo te hace ver importante. El conjunto completo te hace ver inevitable.'
    cinder_cuirass: 'Forrada con fragmentos de corazón de brasas. Te mantiene caliente en la tundra y ligeramente en llamas en cualquier otro lugar. Un compromiso térmico aceptado por todo el que sobrevivió al invierno.'
    cinder_fangs: ''
    cinder_fists: 'A un chasquido de dedos de convertirse tambien en el problema de las otras cinco piezas.'
    cinder_greaves: 'Cada silla en la que te sientas recuerda que estuviste ahi. La brasa tambien.'
    cinder_heart: 'Arrancada aún fundida del pecho de un gólem de acero de fuego, lo bastante caliente para servir de forja entera por sí sola. Los yunques colocados demasiado cerca simplemente se derriten. Los fieles de la forja dejaron de llamarlo accidente.'
    cinder_heart_amulet: 'La pieza a la que todas las demas siguen, en silencio, tratando de volver.'
    cinder_heart_scepter: 'Apuntalo al conjunto completo y algo en tu pecho empieza a tener ideas.'
    cinder_heart_staff: 'Contiene un rescoldo que jamás se enfría del todo. La columna recuerda su calor.'
    cinder_locket: 'Guarda una brasa que se niega, por principio, a apagarse.'
    cinder_loop: 'Engarzado con esquirlas de un núcleo de brasa. Agradablemente cálido y, a ratos, demasiado cálido tras unas copas.'
    cinder_maul: ''
    cinder_sash: 'Tejida con hilo de corazón de ceniza. Hace soportable la guardia en la hora más fría.'
    cinder_striders: 'Te abriga en invierno. Te seguira de noche. El conjunto siempre, de algun modo, observa.'
    cinder_waistguard: 'Nunca fria al tacto. Todo el conjunto tiene fiebre, cortesmente, al unisono.'
    cinderchant_robe: 'Acolchado, hasta el suelo, levemente chamuscado. Morir con él puesto es aceptable; abrir la puerta con él, no.'
    cinderchoir_alloy: 'Suena un acorde al golpearlo, encantador hasta que hace falta trabajarlo en silencio.'
    cinderchoir_brew_of_molten_antiphon: 'Elaborada junto a los respiraderos, no acaba de enfriarse. Suele calentarte. A veces te avisa.'
    cinderchoir_cincture_of_black_choir_pyre: 'Cálida al tacto y soltando gris sin ruido. Hallarás ceniza en tus raciones durante semanas.'
    cinderchoir_cincture_of_black_choir_vitrified: 'Una cinta de sastre marcada en pulgadas y palmos. Ha medido a tres emperadores y les mintió a todos.'
    cinderchoir_crest_of_black_choir: 'Llevado boca abajo desde la riada de ceniza. Huele a lejía y a determinación callada.'
    cinderchoir_locket_of_black_choir: 'Guarda una pizca de un himnario quemado. En noches quietas la ceniza forma versos legibles. No los leas.'
    cinderchoir_tassets_of_black_choir_pyre: 'Humea suave en el dobladillo. Elegante, cálido y un verdadero peligro cerca de hierba seca.'
    cinderchoir_tassets_of_black_choir_vitrified: 'Reforzadas donde el rezo desgasta más rápido. Los parches son nuevos; las rodillas de debajo, causa perdida.'
    cinderchoir_warboots_of_molten_antiphon: 'Suelas fundidas de la escoria enfriándose. Guardan el calor del día en la noche helada. Un regalo, casi siempre.'
    cindercloth_gloves: 'Convierte cada apreton de manos en una pequena charla de seguridad.'
    cindercloth_hood: 'Mantiene la cabeza caliente. Mantiene las cejas en ningun sitio en particular.'
    cindercloth_legs: 'La descarga electrica esta tecnicamente incluida. Nunca, en ninguna version, se penso como una funcion.'
    cindercloth_robe: 'Monjes lo tejieron bajo un voto de quemaduras de segundo grado. La mayoria cumplio el voto. Pocos conservaron cejas.'
    cindercloth_sandals: 'Deja huellas brillantes. El sigilo nunca fue realmente el plan aqui.'
    claude_axe: 'Antaño blandida por el incansable Claude, cuya resistencia en la batalla se hizo leyenda — y cuya resistencia en la alcoba se hizo una advertencia muy distinta.'
    cleancut: 'Deja un filo tan preciso que la herida cicatriza mal a su alrededor. Los cirujanos estudian las cicatrices. No publican sus hallazgos.'
    clearsight: 'Mejora la visibilidad en la Cicatriz, lo cual es menos misericordioso de lo que parece. Algunas cosas es mejor verlas a medias.'
    cobalt_battlecleaver: 'A dos manos, doble filo, aun caliente del lagarto ceniza. Terrible para abrir cartas, excelente para abrir enemigos.'
    cobalt_club: 'Madera kweebec tan densa que olvido que alguna vez vivio de la fotosintesis.'
    cobalt_crushers: 'Nudillos reforzados para cuando las palabras fallan. Las palabras siempre fallan.'
    cobalt_daggers: 'Untadas dos veces en extracto glandular, y una, extraoficialmente, en malas decisiones.'
    cobalt_longblade: 'Una hoja confiable calentada por escamas ceniza. Hace exactamente lo esperado. En un mundo de sorpresas eso vale algo.'
    cobalt_mace: 'Endurecida con cera de colmena y acero forjado al ocaso. Impone una sola ley: la colmena primero.'
    cobalt_pike: 'Punta de escama calida y asta de corteza kweebec. Lo suficientemente larga para pinchar desde lejos. Estrategia o cobardia, tu decides.'
    cobalt_shortbow: 'Brazos de corteza kweebec, cuerda de plumas cargadas de tormenta que zumban antes de cada disparo.'
    cobalt_staff: 'Corteza de kweebec coronada por un amuleto tallado específicamente para la paciencia, que buena falta le hace — canaliza la magia de agua con toda la serena calma de un grifo que nunca llega a cerrarse del todo.'
    cobalt_sword: 'Enfundada en piel de lagarto pielceniza. Calida al agarre y sin delatar absolutamente nada.'
    cobalt_waraxe: 'Tallada en escama calentada por el sol y sellada en cera ámbar, emite un zumbido que los woolice han aprendido a temer antes incluso de ver la hoja. Una reputación útil. Rara vez merecida, murmuran los pastores.'
    cobalt_wargreaves: 'Suficientemente pesados para que ponerse en cuclillas sea ejercicio. Suficientemente ligeros para correr cuando el ejercicio sale mal.'
    cobalt_warhelm: 'Equipo estándar para soldados que aún no han hecho nada para merecer un sombrero más molón.'
    cobalt_warplate: 'Protege los órganos vitales. Los que no lo son se las arreglan solos.'
    cocoon_king_amulet: 'Una cadena de seda dorada aún tibia del capullo del que fue cortada. El Rey nunca la reclama en voz alta. No hace falta: los pensamientos de quien la lleva se acallan un poco más cada día.'
    cocoon_king_cowl: 'Tejido con la misma seda dorada, calado bajo sobre los ojos. Todo más allá del alcance del brazo se difumina en una cómoda bruma dorada — ya sea piedad o el propósito mismo.'
    codex_of_the_damned: 'Encuadernado en cuero de túmulo. Cada hechizo aquí ya falló a quien lo lanzó.'
    codex_of_the_deep: ''
    coiffe_fuwa_black: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_fuwa_white: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_pepe: 'A humble green cap. The starter flex. Every royal was once just a pepe in a hat.'
    coiffe_pepe_royal: 'The pepe ascended. A gilded crown for those who bought the top and never sold.'
    collapse_alloy: 'Aleado de cosas que cayeron juntas. Solo parece estable porque las partes ya se rindieron.'
    collapse_bludgeon_of_last_tremor: 'Blandida una vez por un Rifling que zanjaba una disputa territorial, tras lo cual el territorio dejó de discutir. Termina frases, peleas y, ocasionalmente, muebles, más o menos en ese orden.'
    collapse_greaves: 'Pesadas a propósito. En un mundo donde puedes salir flotando, eso consuela, no molesta.'
    collapse_helm_of_widening_crack: 'Protege la cabeza de todo salvo de lo que hay justo encima, que es la amenaza real aquí.'
    collapse_pendant_of_widening_crack: 'Dentro descansa polvo de lo primero que cayó aquí. Descuida: no falta polvo en este lugar.'
    colophon: 'La marca del editor, al final, sobrevivió al editor, a la imprenta y a la mayor parte de la lengua en que se escribió el libro.'
    concussion: 'Nombrada clínicamente por la última persona a la que golpeó, en el breve instante antes de que olvidara cómo funciona el lenguaje.'
    convergence_pendant: 'Dos gemas, un engaste, una discusion eterna sobre cual amanecer cuenta.'
    copper_band: "Pone tu dedo verde en una hora. El joyero insiste en que es 'patina' no 'envenenamiento por cobre'."
    copper_cleaving_axe: ''
    copper_hoe: 'La herramienta agrícola más barata de cobre, y toda herramienta de cobre en la ciénaga termina luciendo exactamente el mismo tono de verde, lo quiera o no.'
    copper_pickaxe: 'Suficientemente blando para abollarse con un mal golpe. Los mineros compensan con mas golpes. La montana, como siempre, no se impresiona.'
    copper_sickle: 'El cobre se oxida en patina verde en una semana. Los herbolarios lo encuentran esteticamente apropiado. El cobre no tiene opiniones.'
    corbac_head: 'A crow-skull crown for the carrion-minded. The beak points at whatever you are about to loot.'
    cordwood: 'Medida en la vieja unidad que ya nadie usa para la madera, porque no queda suficiente madera para necesitarla.'
    core_forge_key: 'La leyenda dice que el Rey de las Brasas acuñó una única llave verdadera con su propio fuego de corazón, demasiado caliente para manos mortales desnudas. Esta no es esa llave. Varios herreros juran que se acerca bastante.'
    coronet_band_of_silent_court: 'Nadie recuerda haber aceptado cómo resultó esto, una afirmación que nunca ha sido puesta a prueba.'
    coronet_edge_of_silent_court: 'Su comportamiento contradice su propia descripción, una nota al pie que su artesano nunca llegó a escribir.'
    coronet_lattice: 'Su clasificación se ha disputado desde que fue hallado, algo que el equipo de estudio todavía discute.'
    coronet_legguards_of_silent_court: 'Fue construido para probar un punto que nadie recuerda, un hecho que su artesano considera una virtud.'
    coronet_poultice_of_empty_seats: 'Quien lo embotelló nunca se decidió por una versión final, y nadie ha pedido un reembolso, todavía.'
    coronet_resin: 'Nadie puede afirmar con certeza de dónde proviene esto, y el expediente se cerró discretamente, sin resolver.'
    coronet_rod_of_silent_court: 'El comité de diseño nunca se puso realmente de acuerdo en esto, lo cual resulta tranquilizador o profundamente preocupante.'
    coronet_tonic_of_silent_court: 'Su regusto es cuestión de opinión personal, un hecho discretamente omitido de la etiqueta.'
    coronet_torc_of_empty_seats: 'Funciona exactamente como se describe, según dicen, y aun así, eso sigue considerándose un éxito.'
    coronet_treads_of_silent_court: 'El diseño sobrevivió a tres objeciones distintas, así que nadie se molestó en presentar una queja.'
    coronet_visor_of_empty_seats: 'Funciona por un tecnicismo, y el comité nunca volvió a reunirse para revisarlo.'
    coronet_warblade_of_silent_court: 'Fue aprobado por una decisión dividida, y la discusión sobrevivió a todos los que la empezaron.'
    corvid_eye: 'Pequeño, negro, y parece seguir observando. Los boticarios los muelen para ungüentos de visión nocturna. Éticamente turbio.'
    corvid_feather_lance: 'Emplumada con plumas de corvido para aerodinamica. Los corvidos aun estan molestos.'
    crab_claw_grips: 'Fabricados con pinzas que pasaron toda una vida aferrándose a las cosas y negándose a soltar. Los guanteletes heredaron este rasgo. Quitárselos requiere agua tibia, paciencia y un amigo que no te juzgue.'
    crab_claw_hatchet: 'La pinza aun se abre y cierra sola. Casi siempre en el peor momento.'
    crab_claw_joint: 'El mecanismo de bisagra de una pinza masiva. Los ingenieros los estudian. La ingeniería es mejor que cualquier cosa que hayamos construido.'
    crab_pincer_shivs: 'Articulaciones de pinza de cangrejo afiladas. Pellizcan antes de cortar, lo cual es peor.'
    crab_shell: 'Un caparazón resistente extraído de un crustáceo que claramente perdió una discusión con alguien muy hambriento.'
    crab_shell_cuirass: "El armero miró al cangrejo, dijo 'eso ya es básicamente una coraza', y cobró el precio completo por lo que fue esencialmente un remodelado y una capa de aceite."
    cracked_bone: 'Un fémur que ha visto mejores siglos. Sorprendentemente sólido a pesar de las grietas. Los perros aún lo quieren. Los nigromantes también.'
    cracked_mace: 'La cabeza traquetea con cada golpe. La integridad estructural es una sugerencia no una garantia.'
    crazy_belt: 'Un cinturón de trasgo, teñido de rojo intenso con pigmentos que definitivamente no son jugo de bayas.'
    crazy_helmet: 'Ensamblada por un goblin que oyo una vez un rumor poco fiable sobre los cascos.'
    crazy_tunic: 'Una túnica carmesí usada anteriormente por un trasgo cuya cordura había partido hace mucho.'
    crimson_brick: 'Ladrillo rojo sangre que irradia calor horas despues del horno. Los tallistas lo perforan para varitas.'
    crimson_truffle: 'Un manjar subterraneo tan raro que su precio se fija por subasta, nunca por logica de mercado sensata.'
    crimson_truffle_heart: 'El nucleo denso y palpitante extraido de la camara mas profunda que una trufa carmesi formo jamas.'
    crooked_staff: "Un baston con delirios de grandeza magica. El unico hechizo que lanza es 'verguenza leve'."
    crow_feather: 'Una pluma negra iridiscente. Los fabricantes de plumas pagan bien. El fantasma del cuervo perseguirá tus trazos. Supuestamente.'
    crown_dust: 'Fue catalogado dos veces, bajo dos teorías distintas, por un comité que desde entonces se disolvió.'
    crown_of_quills: 'Una corona que ha olvidado qué corona. Se asienta incómodamente, sin estar convencida de su propia autoridad o propósito.'
    crown_of_the_void_sovereign: 'El vacío no tiene soberano, oficialmente. Esta corona fue una autoproclamación que nadie presente tuvo la densidad para discutir. Los catalogadores registran al propietario como «disputado».'
    crownfire_rod: 'Funciona, provisionalmente, a la espera de más revisión, así que nadie se molestó en presentar una queja.'
    crownless_blade: 'Su propósito se reconsideró una vez terminado, una pequeña gracia, considerando la alternativa.'
    crownless_cuisses: 'Funciona bajo reserva, sin reembolsos, sin más preguntas admitidas.'
    crownless_signet: 'Hace lo que se le ordena, eventualmente, un acuerdo alcanzado cuando todos dejaron de discutir.'
    crownrot_cuirass_crown: 'Su fiabilidad es objeto de debate constante, y su artesano siguió adelante antes de terminar la idea.'
    crownrot_cuirass_godbone: 'Hace lo que se le ordena, eventualmente, una resolución que resolvió muy poco.'
    crownrot_greaves_of_gilded_ruin: 'Hace exactamente una cosa, y hasta eso lo disputa, algo que bien podría ser un tropiezo de diseño o justo la gracia del asunto.'
    crownrot_helm_crown: 'Funciona exactamente como se describe, según dicen, y su artesano siguió adelante antes de terminar la idea.'
    crownrot_helm_godbone: 'Las instrucciones se perdieron en un debate acalorado, algo que su portador decidió simplemente aceptar por fe.'
    crownrot_ration_of_rotting_halo: 'Sabe a una decisión tomada demasiado rápido, así que el efecto varía considerablemente según el comensal.'
    crownrot_signet: 'Funciona, técnicamente, en la mayoría de las condiciones, y quien lo porta ha aprendido a vivir con la ambigüedad.'
    crude_branch: 'La leña de uno es aparentemente el componente de fabricación legendario de otro.'
    crude_hatchet: 'Mas bien una piedra afilada en un palo. La estetica cavernicola es gratuita.'
    crude_ring: 'Alambre doblado con aspiraciones de joyeria. Si entrecierras los ojos casi parece intencional.'
    crystal_bread: 'La corteza destella. La miga reluce. Tu dentista tendra opiniones, bien artesanales.'
    crystal_focus_staff: "Montado con una esquirla fracturada que desvía cada hechizo hacia donde más le apetece, que rara vez es hacia donde apuntabas. Los magos veteranos lo llaman 'carácter'. Todos los que están en la línea de tiro lo llaman de otra forma, más corta."
    crystal_ice_staff: 'El cristal que lo corona no se ha derretido ni una vez, ni con el calor de la forja, ni con el verano, ni por puro despecho. Práctico para mantener una bebida fría. Bastante más convincente sobre un enemigo.'
    crystal_tide_staff: 'Un báculo rematado con un cristal rojo que pulsa con energía mareal. Ocasionalmente gotea, lo cual arruina el efecto dramático cuidadosamente preparado por el portador en los grandes momentos.'
    crystal_ward_tome: 'Incrustado de cristal roto. Cada hechizo lanzado a traves de el suena como una lampara de arana cayendo muy despacio.'
    crystallized_loaf: 'Tan mineral que los herreros lo rompen por las esquirlas en vez de comerselo. Comprensible.'
    crystallized_tanjirize: 'Tanjirize que ha sufrido una transformación que ningún botánico sabe explicar y que la mayoría prefiere no imaginar.'
    cuirass_of_the_hollow_king: 'Ningún rey encargó esta armadura: la hizo crecer una Vaciopolilla, y un rey se atribuyó luego el portarla. La diferencia le importaba a una sola persona, ya sin voz para discutir.'
    cured_gauntlets: 'Cuero correctamente curtido. Por fin algo que no huele a perro mojado. Huele a perro seco en su lugar.'
    cursed_amalgam: 'La culminación de una carrera herbolaria condensada en un frasco. Susurra por las noches. Nadie pregunta qué dice.'
    cursed_boot_contradiction: 'Una bota maldita que cambia la libertad de movimiento por terquedad. El portador se mueve torpemente pero se cree invencible por pura contradicción.'
    cursed_fungus: 'La cima indiscutida de la ambicion herbolaria, un hongo de malevolencia tan concentrada que susurra los nombres de quienes se acercan con una voz como hojas secas raspando la tapa de un ataud. Recolectores veteranos informan que no se cosecha tanto como se permite ser tomado, una distincion que no ofrece consuelo alguno.'
    cursed_gem: 'Susurra oscuras promesas a quien lo sostenga demasiado aunque las promesas son sobre todo de dolor de espalda.'
    cursed_gem_powder: 'El susurro empeoro despues de molerlo. Ahora critica tu tecnica de artesania en tiempo real.'
    cursed_helm_paradox: 'Un yelmo maldito que embota la mente mientras fortifica el cuerpo. Otorga vida a través de la pérdida de claridad, un acuerdo escrito en paradoja.'
    cursed_loaf: 'Susurra recetas a quien lo sostiene. El pan tiene opiniones sobre tu tecnica y no son amables.'
    cursed_root: 'Arrancada de un hongo maldito con verdadero esfuerzo, pues tiene la costumbre de agarrar de vuelta con más fuerza de la que le corresponde a algo sin columna vertebral. Se mantiene caliente en almacenamiento y de vez en cuando se estremece. Los herbolarios veteranos lo llaman normal, con un tono que no convence a absolutamente nadie.'
    cursed_straw: 'Tomada de un espantapájaros significativamente más animado de lo esperado. Aún se estremece cuando nadie mira.'
    cursed_straw_amulet: 'Un juramento hecho por algo que tecnicamente no tiene boca. Lo cumplio de todos modos, por rencor.'
    cursed_wheat: 'Un tallo de grano ennegrecido por magia maligna, sus granos susurran con descontento.'
    deadweight: 'Más pesada de lo que el trabajo exige, y el trabajo nunca se ha quejado del excedente.'
    deathgrip: 'Traba los dedos en el momento del impacto y permanece trabado un instante más allá del gusto del portador.'
    deathless_blade: 'Extraída de los túmulos. Afilada en la frontera entre mundos. Una herramienta que recuerda su propósito.'
    deep_scale: 'Negra como el abismo del que viene. El leviatán llevaba miles. Tú tienes una. Sé humilde al respecto.'
    deepbreath: 'Ajusta tan ceñido que respirar hondo exige esfuerzo consciente. La mayoría deja de notarlo a partir de la segunda semana.'
    deepmoss_leggings: 'Acolchadas con musgo que sigue levemente húmedo por mucho que lo lleves, sacado de dondequiera que los Osos de Musgo hagan su guarida. Tiene una opinión sobre mantenerse seco. Esa opinión pierde.'
    deepreach: 'Extiende el alcance del lanzador hasta lugares que preferiría no visitar en persona.'
    deepscale_fists: 'Nudillos reforzados contra lo que anida en las tumbas viejas.'
    deepwater_breastplate: 'Curada en agua de cenagal hasta que el óxido se rindió. Huele al pantano porque es el pantano.'
    deepwater_stilts: 'Eleva a quien las lleva por encima de lo peor del légamo. Lo peor encuentra igual la forma de subir.'
    deepweald_longbow: 'Tensado lo bastante firme para soltar una flecha en silencio por la espesa oscuridad del Weald, donde el sonido llega más lejos de lo que la vista lo hizo jamás. La manada caza de oído aquí abajo; tú también deberías.'
    deepwoven_carapace_of_deep_canopy: 'Estratificado como el dosel que le da nombre, cada capa crecida de la de debajo, lo que hace de su reparación más asunto de jardinería que de herrería.'
    deepwoven_cincture_of_drowned_weald_matron: 'Enrollado del hilo de la propia Matrona, que sostiene un nudo que ninguna mano humana ató y del que no se le disuadirá.'
    deepwoven_cincture_of_drowned_weald_mire: 'Un cinturón tejido que se aprieta solo en agua fría, un reflejo útil hasta que recuerdas que no pregunta antes.'
    deepwoven_composite: 'Tejido a presión en el banco más profundo del Weald, donde las capas se unen tan prietas que la costura se vuelve un rumor más que un detalle.'
    deepwoven_crest_of_deep_canopy: 'Entretejida con liana de dosel viva que sigue creciendo en la cabeza del portador, despacio, en una dirección que él no elige.'
    deepwoven_crest_of_drowned_weald: 'Tejida tan prieta bajo el agua que nunca se secó del todo, y ahora pesa un pelo más de lo previsto, para siempre, por despecho.'
    deepwoven_philter_of_drowned_weald_matron: 'Macerado en seda-de-Matrona que nunca se disuelve del todo, así siempre queda un hilo, remendando cosas que nadie le pidió remendar.'
    deepwoven_philter_of_drowned_weald_mire: 'La versión sencilla que llevan los guías, la mitad de fuerte y mucho más fiable, trato que aquí abajo te mantiene respirando.'
    deepwoven_splitter_of_deep_canopy: 'Equilibrado para talar la liana de dosel que amarra los niveles, tarea mundana que ejecuta con un entusiasmo desmesurado.'
    deepwoven_tassets_of_deep_canopy: 'Crecidas en frondas superpuestas como el dosel de arriba, así un golpe bajo solo separa las hojas y encuentra más hojas.'
    demon_codex: ''
    dented_mace: "Mas abolladuras que un parachoques de estacionamiento. Cada una es una leccion de 'apunta debajo de la rodilla'."
    diadem_casque_of_broken_diadem_crown: 'Quien lo porta insiste en que funciona; la evidencia no es concluyente, una decisión tomada bajo considerable presión de tiempo.'
    diadem_casque_of_broken_diadem_godbone: 'La artesanía es sólida; la premisa no lo es, lo cual es tan tranquilizador como suena.'
    diadem_charm_of_falling_crown: 'Su eficacia nunca ha sido verificada de forma independiente, algo que ya nadie tiene energía para disputar.'
    diadem_chausses: 'Se terminó por pura terquedad, algo que ya nadie tiene energía para disputar.'
    diadem_cordial_of_falling_crown: 'La etiqueta menciona un ingrediente que nadie logra identificar, un hecho discretamente omitido de la etiqueta.'
    diadem_elixir_of_broken_diadem: 'Su efecto aparece, o no, de forma impredecible, así que se vende con un encogimiento de hombros en vez de garantía.'
    diadem_lattice_crown: 'Sus propiedades exactas dependen de a quién se le pregunte, una discrepancia que nadie tiene la tarea de resolver.'
    diadem_lattice_godbone: 'Si es uno o varios materiales sigue sin resolverse, y la segunda explicación nunca se descartó del todo.'
    diadem_vambraces_crown: 'Hace el trabajo que finalmente se le asignó, lo cual es todo el diseño o solo un error de redondeo.'
    diadem_vambraces_godbone: 'Cumple su función declarada con visible reticencia, así que el debate se pospuso indefinidamente.'
    diamond: 'Un fragmento de carbono comprimido que olvidó terminar de ser magnífico, arrancado del puño avaro de la tierra.'
    diamond_bag: 'El contenido de este zurrón podría comprar un pequeño reino, aunque sirva de armas arrojadizas bastante decepcionantes.'
    diamond_bread_1: 'Una barra de pan espolvoreada con diamantes triturados, cada bocado un crujido satisfactorio que castiga la mandíbula.'
    diamond_powder: 'Demuestra que lo único irrompible en este mundo es la etiqueta de precio que lleva pegada.'
    diving_crude_grips: 'Abajo en el pozo inundado, agarran todo con una fuerza que ninguna mano viva debería alcanzar. Aquí arriba, agarran tu paciencia con la misma fuerza — tres días para secarse, y cada hora huele a una poza de marea con una semana difícil.'
    diving_visor: "Forjado con un cangrejo que luchó contra tres pescadores y una gaviota antes de caer. La visera aún se cierra de golpe, algo que el artesano insiste en llamar 'característica'."
    doomed_axe: 'El último sepulturero la guardó. Setecientos sepulcros y siguen. El trabajo no para, la herramienta no oxida.'
    doomed_battleaxe: 'Emitida de oficio tras la tercera leva. Nadie pregunta qué fue de la segunda.'
    doomed_club: 'Cuando hablar deja de funcionar, esta es la siguiente frase. Hablar rara vez funciona aqui.'
    doomed_fang_daggers: 'Dagas gemelas arrancadas a la Viuda de Ceniza. Aún recuerdan el mordisco.'
    doomed_grimoire: 'Cada entrada registrada antes del entierro. Los márgenes siguen llenándose.'
    doomed_longsword: 'Cada golpe susurra el nombre de alguien que olvidaste. Coincidencia, probablemente.'
    doomed_mace: 'Forjada con promesas que nadie cumplio. Cada golpe es una disculpa que llego demasiado tarde.'
    doomed_shortbow: 'Las flechas disparadas con este arco llegan antes que el sonido. Los objetivos rara vez se quejan.'
    doomed_spear: 'Requisada a un lancero que ya no presenta quejas.'
    doomed_staff: 'Canaliza magia de agua a traves de un nucleo de terror comprimido. Muy eficiente, moralmente cuestionable.'
    doomed_sword: 'La ultima creacion del herrero antes de jubilarse. La jubilacion no fue voluntaria.'
    doomhammer_eternal: 'El martillo que una línea de Soldados Quebrados usaba para terminar disputas, combates y, finalmente, su propio historial de servicio. Aún se blande como si la disputa no estuviera del todo zanjada.'
    draconite: 'Esencia de dragon cristalizada que los dragones querrian recuperar por favor dejen de minarla.'
    draconite_powder: 'Humea levemente a temperatura ambiente. Guardarlo exige una boveda ignifuga y mucha calma mental.'
    draconize_flour: 'Requiere guantes ignifugos para amasar. El pan resultante, en ocasiones, ha gruñido de vuelta.'
    dragon_fire_breath: ''
    dragon_frost_breath: ''
    dragon_petal_extract: "Ocho ingredientes, un vial, cero de la explicacion de calor que la etiqueta llama 'magia'."
    dragon_pollen: 'Fino polvo dorado recolectado de los estambres del dragonlirio, que altera levemente cualquier aparato de medición alquímica jamás inventado, desprendiendo un calor que delata la cercanía de fuerzas que más valdría no molestar. Universalmente alergénico, extraordinariamente valioso y con el tenue pero inconfundible aroma del arrepentimiento.'
    dragon_void_essence: ''
    dragonite_crust: 'La corteza se defiende al romperla. Los herreros incrustan fragmentos en hachas para un filo auto-afilable.'
    dragonlily: 'Una imposibilidad botanica revestida de escamas iridiscentes que exhala un perfume maloliente descrito en el mejor de los casos como funeraria cruzada con pozo de azufre, que incluso los dragones reales encuentran lo suficientemente desagradable como para evitarlo. Los eruditos siguen divididos sobre si es una planta que finge ser reptil o un reptil que ha renunciado a toda ambicion.'
    drakar: 'Draconic plate that runs warm to the touch. Small dragons find it flattering; large ones find it rude.'
    draugature: 'Una banda de cuero endurecido forjado en el frío inquebrantable de las tumbas, hilada con los tendones de los muertos inquietos que vagan por los páramos helados.'
    draugr_bone: 'Sorprendentemente difícil de partir en dos. La vieja rigidez, dicen los sepultureros, nunca suelta de verdad a un draugr — y al parecer se saltó la parte donde se suponía que debía terminar tras la muerte.'
    draugr_bone_staff: ''
    draugr_daggers: 'Dicen que el idiota del pueblo las hizo. El idiota del pueblo lo niega, afirmando que tiene estándares.'
    draugr_fractured_amulet: 'Un amuleto agrietado de procedencia draugr, sus incrustaciones rúnicas fracturadas sobre hueso añejo.'
    draugr_helmet: 'Llevarla no concede ni autoridad ni respeto, aunque hace un trabajo excelente ocultando una entrada que retrocede.'
    dread_lance: ''
    driftwalkers: 'No deja huellas. Sobre todo porque nunca tocas el suelo el tiempo suficiente para dejarlas.'
    drowned_amber: 'Resina endurecida bajo el agua que atrapó lo que pasaba entonces, y que más vale no examinar a la luz de una vela.'
    drowned_root_grimoire: 'Encuadernado en corteza de raíz aún húmeda de dondequiera que se hallase, las páginas blandas de podredumbre pero la tinta, quién sabe cómo, intacta. Se rumorea que el Oráculo de las Profundidades escribió los márgenes.'
    drownmarked_casque_matron: 'Cortado de una placa que la Matrona mudó y no volvió a buscar, que es o suerte o una invitación que nadie quiere haber aceptado.'
    drownmarked_casque_mire: 'Lleva la pálida línea de marea que el Weald profundo deja en todo lo que toma y devuelve, que son más cosas de las que al Weald le gusta admitir devolver.'
    drownmarked_chausses_of_rising_tide: 'Marcadas a la altura exacta a la que subió el agua la noche en que el Weald tomó los niveles bajos, llevadas como recuerdo y, a veces, como advertencia.'
    drownmarked_cordial_of_rising_tide: 'Mezclado en el cambio de una marea cuya existencia el Weald niega, que el preparador ajusta por instinto y se niega a explicar.'
    drownmarked_elixir: 'Lleva la pálida línea de marea de todo cuanto el Weald profundo ha tocado, que la etiqueta presenta como sello de autenticidad y los sabios leen como la marca de por dónde ha andado.'
    drownmarked_kris_of_fen_below: 'Su ondulación se acentúa cuanto más reposa en agua del fen, así uno viejo abre una herida que ninguna hoja recta podría coser.'
    drownmarked_loop_matron: 'Fundido de un colmillo que la Matrona dejó en algo que juzgó no merecer ser rematado, distinción que el portador preferiría no compartir.'
    drownmarked_loop_mire: 'Teñido por las aguas de la ciénaga en un negro que se traga la luz de una vela, llevado por quienes prefieren que sus manos no llamen la atención.'
    drownmarked_resin: 'Resina rezumada de un tronco que el agua profunda se llevó, que aún llora despacio, cosa que los artesanos toman por señal de que no ha terminado de morir.'
    drownmarked_saber_of_fen_below: 'Recuperado del estrato que los guías llaman el Fen de Abajo, nombre que pronuncian más para disuadirte que para orientarte.'
    drownmarked_saber_of_rising_tide: 'Curvado a la forma del agua en que se templó, corta en el sentido de la corriente y se resiste a quien lo blande a contracorriente.'
    drownmarked_tome_of_rising_tide: 'La tinta se corre un poco más cada vez que se abre bajo el agua, cosa que los eruditos del Weald profundo prefieren leer como el libro corrigiéndose solo.'
    dualpact_circlet: 'Atado a dos elementos que solo aceptaron compartir la custodia, nada mas.'
    duke_breastplate: 'Grabada con un escudo de dos goblins peleando por una moneda. Ninguno gana.'
    duke_crossbow: ''
    duke_rapier: 'Sustraída a un duque goblin que juraba, alto y a menudo, que solo la usaba para rascarse la espalda. Ni un alma en la corte le creía, y todas, aun así, le dejaban seguir contándolo.'
    duke_sash: 'Lucida en cada ejecucion a la que el, personalmente, no asistio. La imagen importa.'
    duke_signet: 'Un sello con forma de monigote haciendo pulgar arriba. El mismo lo encargo.'
    duke_signet_ring: 'Nobleza estilo goblin: se otorga segun cuantos pares empujaste tu mismo escaleras abajo.'
    duke_sword: 'Perteneció a un duque goblin con opiniones firmísimas en materia fiscal.'
    dungeon_key_goblin_cave: 'Esta oxidada llave de hierro vibra con magia latente, permitiendo a su portador burlar las protecciones ocultas que custodian el tesoro del Rey Goblin.'
    duskfire_rusk: 'Brilla tenuemente al atardecer. Los curtidores remojan cuero en el para un acabado que nadie sabe explicar bien.'
    duskite: 'Un mineral que absorbe la luz tan agresivamente que los mineros no paran de perderlo en sus propios bolsillos.'
    duskite_powder: 'Tan oscuro que hace parecer soleada a la sombra verdadera en comparación. Los vendedores de cosméticos lo probaron exactamente una vez, cuenta la historia, y a la clienta nunca se la volvió a ver salir de la tienda en pleno día.'
    earthsea_tassets: 'Mitad terrenal, mitad oceanica. Cada mitad esta convencida de que la otra es solo para aparentar.'
    ectoplasm: 'Residuo fantasmal translúcido. Atraviesa contenedores no encantados. El almacenamiento es una aventura en sí mismo.'
    ectoplasm_locket: 'Se abre a un retrato que ningun vivo ha reconocido jamas. Varios muertos si, pero no hablan.'
    ectoplasmic_tome: 'La encuadernación rezuma un líquido translúcido. El bibliotecario dijo que era una característica, no un defecto.'
    ekusoni: 'An exorcist mask that hums faintly near the recently deceased. Probably nothing.'
    elder_totem: 'Tallado durante décadas por manos artríticas. Irradia sabiduría tranquila y leve desaprobación de todo lo que has hecho hoy.'
    elder_totem_amulet: 'Tallado en madera ancestral Kweebec por manos tan pequeñas que las marcas de herramientas parecen caligrafía. El tótem representa una criatura que los Kweebec se niegan a nombrar, describir o reconocer. Sin embargo, cobran generosamente por su efigie.'
    elder_totem_talisman: 'Tallado en un totem que la Matrona Celeste custodio mas tiempo del que Pandora lleva su nombre.'
    elemental_catalyst_air: ''
    elemental_catalyst_earth: ''
    elemental_catalyst_fire: ''
    elemental_catalyst_water: ''
    elixir_of_agility: 'Reflejos liquidos, calidad felina. La toma de decisiones no esta incluida, y se nota casi de inmediato.'
    elixir_of_chance: 'Probabilidad destilada. Mejora tu hoja de estadisticas. Tu suerte real sigue, tragicamente, igual.'
    elixir_of_intelligence: 'Agudiza la mente por una hora y el ego por bastante mas tiempo.'
    elixir_of_strength: 'Temporalmente te hace golpear como alguien del doble de tu tamano. Efectos secundarios: exceso de confianza y flexion involuntaria.'
    elixir_of_vitality: 'Repartido de oficio antes de un avance. No pregunta si estás listo.'
    embalmed_ancestral_club: 'Lo que queda tras los ritos de embalsamamiento. Más pesado de lo debido.'
    embalmed_bow: 'Conservada en las especias funerarias. Sacada del arsenal de un guardián de cadáveres. La cuerda nunca fue para los vivos, pero aguanta.'
    embalmed_club: 'Cada golpe despierta algo que dormia por una muy buena razon.'
    embalmed_cuirass: 'Forrada con seda de embalsamamiento sacada de las reservas de los sepultureros. Conserva su forma cuando todo lo demás ha cedido.'
    embalmed_grips: 'Envueltas en la misma seda que los muertos. El agarre no cede, ni siquiera después.'
    embalmed_legguards: 'Tus piernas estan momificadas y, no se sabe como, muy bien combinadas.'
    embalmed_locket: 'Guarda un retrato pintado en seda funeraria. El rostro no ha envejecido desde la sesión.'
    embalmed_silk: 'Vendajes arrancados de un vagabundo de escarcha, conservados frescos por siglos de frío antes que por cualquier arte de embalsamador. Hacen buenos vendajes, siempre que hayas decidido no preguntar dónde han estado.'
    embalmed_silk_ring: 'Un anillo tejido con seda embalsamada. Los muertos tienen un apretón de manos sorprendentemente firme cuando lo llevan.'
    ember_core: 'Un pequeño sol atrapado en mineral. Quema bolsas. Los aventureros experimentados los llevan en macetas de barro.'
    ember_core_scepter: 'Una brasa engastada en hierro, reconfortante hasta el momento en que notas que el calor lleva subiendo sin parar desde el principio. Los viejos herreros tienen una expresión para esa sensación. No se traduce amablemente.'
    ember_reduction: 'Grasa fundida de los asados del refectorio. Freír, impermeabilizar, sobornar a los sabuesos — un tarro lo hace todo.'
    ember_scripture: 'Escrito con una tinta que solo aflora con el calor. Leerlo exige un hogar encendido y la paciencia de un santo.'
    ember_shortbow: 'Las flechas disparadas brillan durante todo el trayecto hasta el blanco, lo que el flechero llama hermoso y el arquero llama el fin de sorprender a nadie, para siempre.'
    ember_silk: 'Hilo hilado de capullos que arden eternamente, cálido al tacto y peligroso para las manos descuidadas.'
    ember_silkblade: 'Forjada con fibras de seda inflamadas y templadas hasta convertirse en un filo ardiente que se niega a enfriarse. Lo bastante flexible para anudarla, suponiendo que tus dedos sean inmunes a las quemaduras de tercer grado.'
    ember_studded_belt: 'El magmooligan ardía cuando esquilaron esta lana. El esquilador también, poco después. El cinturón conserva un calorcito acogedor y una vaga sensación de arrepentimiento mutuo.'
    ember_walkers: 'Las suelas nunca se enfrian, ya sea prodigio de encantamiento o grave fallo de diseno.'
    emberchant_breastplate_of_last_verse: 'Arrancado de la mesa del altar de un solo tirón limpio. Los candelabros ni se enteraron.'
    emberchant_breastplate_of_twelve_voices: 'Ocho capas de guata entre tú y el mundo. El mundo capta la indirecta.'
    emberchant_composite: 'Laminado cantando, porque los viejos herreros juraban que fijaba la veta. La fija. Nadie sabe por qué.'
    emberchant_core: 'Un carbón que simplemente no se apaga. Las fraguas lo adoran; quien lo lleva en el bolsillo aprende pronto a dejarlo.'
    emberchant_extract: 'Lo que queda tras el hervor. El cocinero lo llama caldo; el alquimista, disolvente; el desagüe, colega.'
    emberchant_hand_axe_of_twelve_voices: 'Pequeña para lanzarla, ruin para conservarla. La decisión persigue cada combate.'
    emberchant_legguards_of_last_verse: 'Lana de invierno en un edificio calentado por un dragón. La abuela no acepta contraargumentos.'
    emberchant_tonic_of_last_verse: 'Miel, hierbas y un susurro de ceniza. Se disuelve lo bastante despacio para durar más que el sermón.'
    emberchant_treads_of_last_verse: 'Tejidos con grosor suficiente para cruzar las losas frías a medianoche sin despertar la cripta.'
    emberchant_waraxe_of_twelve_voices: 'El coro tiene doce voces. Esta zanja disputas con las doce a la vez.'
    emberglow_staff: 'La brasa en su punta nunca muere del todo. Tampoco las quemaduras en los dedos del portador.'
    embermaw_gauntlets: 'El calor residual de fragmentos de corazón de ceniza vuelve estos guanteletes incómodamente cálidos. Como un apretón de manos de alguien con fiebre.'
    emberwalk_striders: 'Te dejan cruzar un lecho de brasas sin inmutarte. Volver es una compra aparte.'
    emberweave_hauberk: 'Tejida con fibra que aun recuerda haber ardido y no te deja olvidarlo tampoco.'
    empyrean_charm_of_broken_diadem: 'Cumple su función declarada con visible reticencia, y la diferencia dejó de importar en cierto momento del trayecto.'
    empyrean_elixir: 'Las instrucciones de dosis se contradicen a mitad de la etiqueta, y nadie ha pedido un reembolso, todavía.'
    empyrean_sash_of_falling_crown: 'Su propósito se reconsideró una vez terminado, y su artesano lo sostiene, casi siempre.'
    enchanting_dust: 'Residuo magico en polvo que los joyeros esparcen sobre accesorios para hacerlos brillar ominosamente.'
    enka_muru: 'A traveller’s cloak stitched for long roads and short conversations.'
    enriched_dough: 'Masa tan enriquecida con minerales que practicamente es una muestra geologica. Los manitas la adoran.'
    ensable_crystal: 'Pertenece a una vitrina, segun todos los museos que siempre se negaron a pagarlo.'
    ensable_key: 'Insertala mal y la cerradura se llena de obsidiana. La fortuna favorece a los cautelosos.'
    ensable_pincers: 'Algo alla abajo lo quiere de vuelta con tantas ganas que sigue buscando.'
    etched_signet: 'Lleva un escudo grabado que podria ser un lobo un gato o arte abstracto. El joyero tampoco estaba seguro.'
    eternal_biscuit: ''
    eternal_eclipse_blade: 'Existe en sombra permanente sin importar la fuente de luz, igual que el ala de Polilla del Vacío de la que fue cortada. Los astrónomos tienen opiniones. La hoja nunca las ha pedido.'
    eternal_wisdom_chain: 'Lleva una llave por cada caja que alguna vez pasó por este puesto.'
    eternwool_band: 'Fundido en el mismo lote que otros cien. Este regresó.'
    ethereal_ukranize: 'Se halló donde los registros dicen que no debería estar, así que el registro simplemente lista ambas, una junto a otra.'
    evenhand: 'Equilibrada a una fracción que el herrero se niega a revelar. Todo portador jura que lo favorece personalmente. No es así.'
    executioners_verdict: 'Resuena como el mazo de un consejo de guerra al golpear, dictado por el Soldado Quebrado al que le tocó la pajita corta ese siglo. La sentencia es siempre la misma. No hace falta papeleo.'
    faded_spellbook: 'Faltan la mitad de las paginas. Contiene un hechizo legible: una lista de compras de hace 200 anos.'
    fangs_of_the_abyss: 'Extraídos de algo que debería haber seguido durmiendo en el fondo del vacío. Las empuñaduras aún se estremecen a veces.'
    farpoint: 'Apuntada a un objetivo que quien la porta apenas puede ver todavía. Para cuando impacta, eso ya no es cierto.'
    farshot: 'Tensado para un alcance que ningún arquero cuerdo necesita en la Cicatriz, donde todo lo que merece un disparo ya se huele de cerca.'
    farwalker: 'Construido para una distancia que se supone nadie necesita en el muro. Está claro que alguien la necesitó de todos modos.'
    faultline_extract: 'Extraído de una grieta viva. Se usan guantes; a la grieta le dan igual los guantes.'
    faultline_grips_of_split_sky: 'Moldeadas en la pata delantera de un Rifling la jornada en que el cielo sobre la falla dejó de fingir solidez. La fuerza de agarre se triplica. La percepción de profundidad no sobrevive al trato.'
    faultline_hand_axe_of_torn_ground: 'Vendida para prospección. Usada, exclusivamente, para lo otro.'
    faultline_poultice_of_split_sky: 'Aplicado en las juntas del Rifling durante la muda para que el caparazón nuevo no cuaje torcido. En personas funciona parecido: de forma despareja, pero funciona.'
    faultline_quartz: 'Creció siguiendo una fractura: impecable salvo en la única línea que de verdad importa.'
    faultline_torc_of_split_sky: 'Un vigía de la puerta la llevaba mientras contemplaba un cielo que, en rigor, ya no era uno solo. Refleja el horizonte dos veces por la costura. El segundo reflejo, dicen, devuelve la mirada.'
    faultline_torc_of_torn_ground: 'Te conecta a tierra, literalmente, en un mundo cuyo suelo es un chiste recurrente. Resultados mixtos.'
    faultline_treads_of_torn_ground: 'Suelas hechas con las placas de pie mudadas de un Rifling, que agarran el suelo fracturado con el mismo instinto que tenía el miembro vivo. Una suela siempre encuentra apoyo. La otra todavía lo discute.'
    faultline_visor_of_split_sky: 'Aquí el horizonte tiene una costura. Mirarla para atraer suerte es opcional y poco sensato.'
    faultline_warbelt_of_split_sky: 'Ancho para colgar un pequeño arsenal. El portador lo hace, y luego lamenta el peso.'
    featherfall_daggers: 'Nadie recuerda haber aceptado cómo resultó esto, y el comité nunca volvió a reunirse para revisarlo.'
    feathergilt_ingot: 'Su clasificación se ha disputado desde que fue hallado, así que se aconseja a los compradores juzgar por sí mismos.'
    feathergilt_visor_of_silent_court_crown: 'Acepta funcionar, bajo protesta escrita, así que el desacuerdo se incorporó silenciosamente al diseño.'
    feathergilt_visor_of_silent_court_godbone: 'Cumple su tarea y luego se disculpa por ello, así que la queja original nunca se retiró formalmente.'
    feathergilt_waraxe_of_silent_court: 'Su artesano se negó a dar más detalles, y quien lo porta ha aprendido a vivir con la ambigüedad.'
    fen_amulet: 'Nacido del pantano y con aroma a pantano. Combina bien con el aislamiento social.'
    fen_gland: 'Atrae presas. Repele literalmente a todos los demas, incluida su propia especie, a distancia.'
    fen_impaler: 'Sacada de un pantano que presento una objecion formal y chorreante.'
    fen_mace: 'Bendecida por algo que vive en la parte mas profunda del pantano. No quieres conocerlo.'
    fen_moss_clump: 'Musgo de pantano tóxico que prospera en criaturas de pantano. Los herbolarios lo usan en remedios contra veneno. La ironía no se les escapa.'
    fen_moss_mallet: 'Un mazo cubierto de musgo de pantano vivo que se regenera durante la noche. Golpea algo con suficiente fuerza y el musgo suspira.'
    fen_reaper_axe: 'Siega junco y hueso con la misma paciencia constante. Al pantano nunca le falta ni lo uno ni lo otro.'
    fen_reed: 'Un junco duro como el hierro que solo crece donde el fen es más hondo, cosechado por quienes se atreven a meter un brazo y confiar en que vuelva.'
    fen_trident: 'Tres puntas cubiertas de fango del pantano. El olor solo mantiene a raya a la mayoria. A los aliados tambien.'
    fenrot_composite: 'Un material dejado pudrir justo en el grado exacto, ventana que los maestros artesanos guardan con celo y que los aprendices arruinan con regularidad.'
    fenrot_draught: 'Fermenta cada día un poco más si no se bebe, hasta que al final deja de ser medicina y pasa a ser una decisión.'
    fenrot_draught_of_moonlit_mire: 'Llamado así por una luna que nunca llega tan hondo, cosa que el preparador halla poética y quien lo bebe, con razón, una advertencia.'
    fenrot_gauntlets: 'La podredumbre se comió la motricidad fina hace años. Lo que queda es un agarre que, sinceramente, nunca ha soltado nada — a propósito o no.'
    fenrot_girdle_of_moonlit_mire: 'Teñido por el agua de la ciénaga de un color que solo se lee como algo bajo la luz lunar, que nunca llega tan hondo, así que sigue siendo un misterio a propósito.'
    fenrot_girdle_of_quiet_drowning: 'Podrido hasta la flexibilidad para ceñirse con una mano en la oscuridad, pequeña gracia que el fen concede y te hace pagar de inmediato.'
    fenrot_greatblade: 'Dejado en el fen lo bastante para picarse y marcarse, cosa que el herrero rebautizó como carácter y encareció en consecuencia.'
    fenrot_greaves: 'Blandas de podredumbre de un modo que resulta moverse en silencio, la única moneda que el fen respeta.'
    fenrot_helm_of_moonlit_mire: 'El cuero se ha ablandado de podredumbre y así se ha quedado, lo que amortigua un golpe mejor que nada de lo que venden los de tierra seca.'
    fenrot_helm_of_quiet_drowning: 'Sellado lo bastante para mantener el fen fuera y, algunos portadores lo notan con desazón, lo bastante para mantener dentro un aliento contenido.'
    fenrot_ration: 'Medicina de campaña envuelta en hoja de fen que la conserva y le presta un sabor que nadie ha llamado nunca bueno, solo eficaz.'
    feran_gauntlets: 'Vuelven a crecer en una semana. Los feran, imperturbables, ya no se arrepienten de nada.'
    feran_hide_belt: 'Cuero de feran curtido, flexible y oscuro como una costa sin luna. El feran era un depredador solitario de las marismas, y el cinturón lleva su temperamento — cruje irritablemente cuando está mojado y se niega rotundamente a combinar con nada elegante.'
    feran_hunting_charm: 'Un tótem de hueso del cinturón de un feran. Huele a sangre de presa y emboscada. Los rangers pagan el doble. Sin preguntas.'
    feran_pelt: 'Piel manchada de felino increíblemente flexible. Los curtidores se emocionan con la calidad. El feran estaba menos emotivo.'
    feran_stalker_gloves: 'El pelaje se eriza cuando la presa se acerca — pero también en las tormentas, cerca de las fogatas, y justo en el instante en que su portador miente. Un guante de caza y una conciencia, cosidos en la misma piel, se haya pedido la segunda parte o no.'
    fingerbind: 'Se ajusta a cada dedo probado hasta ahora, algo que el herrero que lo forjó nunca ha encontrado tranquilizador.'
    fire_spellbook: ''
    firesteel_grimoire: ''
    firstlight_carapace_of_closing_age: 'Placado con el metal pálido que solo se forma donde la primera alba aún alcanza. Esa superficie mengua cada año, y los herreros se han dado cuenta.'
    firstlight_extract: 'Destilado en el minuto exacto de la primera luz, lo que deja a los alquimistas un solo intento al día y un genio muy corto ya al mediodía.'
    firstlight_halberd_of_world_wound: 'Lo bastante larga para mantener el borde de la Herida a la distancia exacta que los guardianes del muro consideran sobrevivible. La medida es precisa e innegociable.'
    firstlight_locket_of_world_wound: 'Guarda una pizca de la primera alba, sellada antes de que pudiera apagarse. No lo ha hecho. Se aconseja al portador no abrirlo para averiguar por qué.'
    firstlight_warboots_of_world_wound: 'Atadas para llevar a un peregrino durante la única hora en que la Herida permanece callada. Pierde la ventana y las botas son el menor de los problemas.'
    fish_scale: 'Escama con brillo arcoíris de un lucio. Los joyeros las pulen en colgantes baratos. El pez no tuvo voz en el asunto.'
    flame_crystal_staff: 'Coronado por una brasa que jamas termina de apagarse, igual que el mago que lo porta.'
    flare_band: 'Suave en la mano. Un riesgo real en cuanto lanzas algo de verdad.'
    flooded_nave_key: 'Pegajosa por la humedad de la nave, que nunca termina de secarse. El Prior Ahogado todavía guía una congregación allá abajo; nadie ha explicado a quién le queda predicar.'
    flying_fish_wing: 'Una aleta translucida que aun intenta, por costumbre, atrapar el viento.'
    footnote: 'Cita una fuente que ya no existe, para una afirmación que tampoco nadie ha podido refutar.'
    fortress_legguards: 'Tus piernas se convierten en una fortaleza. Tu movilidad se convierte en un recuerdo.'
    fracture_cordial_of_long_collapse: 'Fermentado en un nido de Rifling, en un caparazón que nunca cerró del todo. Sana lentamente y no pide nada a cambio, lo cual, después de todo lo demás en este mundo, resulta casi sospechoso.'
    fracture_hauberk_rift: 'Formada con hojas rotas. Cada una se quebró cumpliendo su labor; a ti te toca acabar la suya.'
    fracture_hauberk_void: 'Cota de malla ajustada al cuerpo pre-muda de un Rifling, cada anilla fundida ligeramente mal a propósito. Se mantiene unida como se mantenía el Rifling: apenas, y solo bajo tensión.'
    fracture_ingot: 'Fundido con una fisura capilar en el centro, vendido como «carácter». Aguanta. Casi siempre.'
    fracture_loop_rift: 'Hay en el aro una grieta que casi no ves. Sin duda pensarás en ella sin parar.'
    fracture_loop_void: 'Engarzada con una piedra que no lo es. Mirar directo al engaste vacío no se aconseja dos veces.'
    fracture_resin: 'Fragua más rápido de lo que puedes soltarte. Pregunta a cualquier aprendiz, por su apodo.'
    fracture_sash: 'Deshilachada en ambos extremos como se deshilacha la piel de un Rifling en una línea de muda, y igual de terca al mantener su forma. Reemplazarla se siente, de algún modo, como una traición.'
    fracture_scepter_of_long_collapse: 'No tanto gana peleas como las posterga, un muro derrumbándose a la vez, con la misma paciencia con que un Rifling sobrevive a un túnel que colapsa. Magia lenta. Magia fiable.'
    frost_grimoire: 'Sus páginas permanecen húmedas sin importar cuántos fuegos enciendas a su lado. Leerlo se siente como ahogarse en conocimiento — una sensación que su autor, quienquiera que fuese, evidentemente encontró instructiva.'
    frost_recurve: 'Un arco recurvo infundido con esencia glacial. Las flechas se congelan en vuelo. Los dedos del arquero tambien.'
    frost_sabre: 'Una hoja curva que arrastra escarcha. Cada golpe termina una relación.'
    frost_shard: 'Cristal permanentemente helado que drena el calor de todo alrededor. Se queda frío para que tú no tengas que estarlo.'
    frost_shard_spear: 'Un fragmento de escarcha montado en torio. Nunca se derrite, lo que hace que sostenerla sea una experiencia formativa.'
    frost_shard_sword: ''
    frost_titan_cudgel: 'Lo que un titán de hielo usa como mondadientes. Lo que te aplasta de un solo golpe.'
    frost_totemic_club: 'Rematada con una efigie totémica helada. Su expresión tallada cambia con el clima. Y con tu suerte.'
    frostbound_band: 'Marca la hora sin un solo sonido. Alguien todavía le da cuerda, por costumbre.'
    frostclaw_warhelm: 'Forjado a partir de quitina de garra de titán y templado en agua de deshielo glacial. El frío nunca le ha molestado. Tú, sin embargo, temblarás.'
    frostfang_bow: 'Disparado una vez, y todos los lobos en kilometros a la redonda responden.'
    frostfang_requiem: 'Mitad espada, mitad réquiem. Adivina qué mitad escuchas primero.'
    frostfur_hatchet: ''
    frostfur_tuft: 'Piel blanca de un lobo de escarcha, fría al tacto para siempre. Útil para abrigos. Grosero con el lobo.'
    frosthewn_axe: 'Tallada de un glaciar, filo de adamantita. Se sirve fría, siempre.'
    frosthowl_stilettos: 'Dagas que silban en el frío. El sonido resulta profundamente inquietante tanto para enemigos como para aliados. Principalmente para los aliados.'
    frostkoa_cleaver: 'Forjada en bilis de rana de hielo, la hoja destila un sudor frío que no logra congelarse del todo, ni siquiera aquí abajo. Nunca pide compasión. Aun así, la recibe.'
    frostkoa_eye_pendant: 'El ojo parpadea segun su propio horario. Decidiste no pensar en eso.'
    frostkoa_staff: 'Cortado de una espina dorsal que solto un ultimo croar muy convencido.'
    frostmaw_scale: 'Desprendida en la muda más antigua de la matriarca cenicienta. Aún tibia en los bordes.'
    frostshamble_girdle: 'Sostiene tu pantalon y algo bastante menos vivo arrastrandose detras de ti.'
    frostshamble_helm: 'Susurra toda la noche. Sobre todo criticas. Ninguna positiva.'
    frostshamble_longsword: ''
    frostshamble_pendant: 'Murmura tras el anochecer. Se niega a decir que quiere hasta que ya es demasiado tarde.'
    frostshamble_treads: 'Deja huellas que siguen arrastrandose unos pasos despues de que te detienes.'
    frostshell_aegis: 'Capas de caparazón de cangrejo helado sobre placa de torio. Biología marina, convertida en arma.'
    frostshell_grimoire: 'Encuadernado en caparazón de cangrejo helado. Se presenta antes de presentar la congelación.'
    frostshell_pendant: 'Un fragmento pulido de concha de escarcha en una cadena de torio. Irradia frío y una leve angustia existencial.'
    frostshell_plate: 'Armadura de cangrejo helada que nunca se descongela. Los herreros la trabajan en fraguas bajo cero, quejándose todo el tiempo.'
    frostshell_signet: 'Hecho de un fragmento de caparazón de garra de escarcha. El cangrejo no firmó el formulario de donación.'
    frostward_mace: ''
    frostweaver_wraps: 'Tejidos con piel de yeti y reforzados con esquirlas de corazón glacial. El yeti los quiere de vuelta.'
    frostwolf_fang_ring: 'Muerde de vuelta si intentas quitartelo. La manada no olvida insultos.'
    frostwolf_hauberk: 'Nunca mas tendras frio. Tampoco te invitaran de nuevo al sur.'
    frostwolf_leggings: 'Suave como una guarida. Blindada como un asedio. La manada contiene multitudes.'
    frostwolf_mitts: 'Tus manos siguen calidas. Todo el que te da la mano recuerda quien manda.'
    frostwolf_paws: 'Se aferra al hielo como si hubiera insultado a tu familia en persona. Es complicado.'
    frostwolf_staff: ''
    frozen_striders: 'Cuero tratado con hielo que por fin abandona la quietud. Movimiento, al fin.'
    fungal_flatbread: 'Un pan fino infusionado con pasta de orquidea marfil. Los sastres lo remojan para impermeabilizar telas.'
    galerunner_crown: 'Lo bastante aerodinámico para recortar medio segundo de tu tiempo de retirada.'
    gecko_chopper: 'Empunada, segun la leyenda, por el mayor rey gecko que Pandora jamas tuvo.'
    gecko_saber: ''
    gecko_scale_leggings: 'La cola del gecko volvio a crecer en una semana. Tu reputacion tardara bastante mas.'
    gecko_tail_segment: 'Desprendido voluntariamente por el gecko. Aún se retuerce. Puedes usarlo en alquimia o verlo bailar. Tú decides.'
    gecko_venom_lance: 'La herida es la parte fácil, acaba en un instante. Lo que deja atrás el veneno de gecko tarda considerablemente más en perdonarte por haber aparecido.'
    gecko_venom_sac: 'Pequeño pero potente. El veneno no es letal para humanos pero arruinará toda tu semana. Los boticarios los adoran.'
    genesis_blade: 'Forjada, según los peregrinos que aún hacen la ascensión, con aquello que el mundo era antes de fracturarse. Nadie está en posición de confirmarlo.'
    genesis_greataxe_of_origin_line: 'Con peso de sobra para que el primer golpe zanje casi cualquier disputa y el segundo sea sobre todo para que conste. Rara vez hay un tercero.'
    genesis_hauberk: 'Tejida con alambre trefilado antes de que a nadie se le ocurriera anotar cómo. La técnica murió con su herrero; la loriga, de momento, ha sobrevivido a la pérdida.'
    genesis_loop: 'Fundido de la primera aleación en que el mundo llegó a enfriarse, si hay que creer a los Auditores — y se les cree, casi siempre, cuando coinciden, lo cual es raro.'
    genesis_mail: 'Tejida con un metal que los peregrinos juran anterior a la fractura, aunque los herreros que lo sabrían con certeza no sobrevivieron para confirmarlo.'
    genesis_moss: 'Un musgo que solo crece donde aún cae la primera luz, y muere apenas se le da sombra. Los recolectores van rápido y se disculpan ante nadie en particular.'
    genesis_suize: 'La cepa original de suize, anterior al cultivo mismo. Probablemente sobrevivirá a quienes intenten cultivarla.'
    ghost_cap: 'Un hongo translúcido que brilla tenuemente en la oscuridad, como burlándose de ti por pasar horas buscándolo a plena luz del día.'
    ghost_wafer: 'Raspado de una llama errante de tumba tras apagarse. Los arqueros la convierten en resina para cuerdas.'
    ghostcap_alloy: 'Metal sembrado de esporas seta-fantasma que lo mantienen tenuemente luminoso, grato de trabajar e imposible de perder de vista en un banco oscuro.'
    ghostcap_almanac_of_deep_canopy: 'Sus páginas son seta-fantasma prensada, legibles solo en la oscuridad en que brillan, lo que hace del Weald profundo el único sitio donde de veras leerlo.'
    ghostcap_carapace_of_drowned_weald: 'Tachonado de setas seta-fantasma que siguen brillando cuando el portador deja de moverse, mal rasgo en un escondite y peor en un ataúd.'
    ghostcap_falchion_of_drowned_weald: 'Su hoja está veteada de esporas seta-fantasma que brillan siguiendo cada corte, así la herida se ilumina antes de que llegue el dolor.'
    ghostcap_fists_of_deep_canopy_matron: 'Tachonados de un sombrero más raro que solo brilla en la oscuridad verdadera, que bajo el dosel profundo es siempre, así que jamás se apagan.'
    ghostcap_fists_of_deep_canopy_mire: 'Los sombreros de seta en los nudillos brillan más cuanto más fuerte golpeas, convirtiendo una pelea en un espectáculo de luces no deseado.'
    ghostcap_flail_of_drowned_weald: 'Su cabeza es una seta-fantasma endurecida que se ilumina en el reculo, diciéndole al blanco el instante exacto de encogerse sin dejárselo del todo.'
    ghostcap_philter_of_drowned_weald: 'Brilla tenue una hora tras beberlo, lo bastante para hallar la salida de la oscuridad y lo justo para que algo te halle a ti.'
    ghostcap_warboots_of_drowned_weald_matron: 'Con suela de sombreros luminosos que delatan al portador en lo oscuro, cosa que el fabricante juzgó un trato justo a cambio de no perderse nunca.'
    ghostcap_warboots_of_drowned_weald_mire: 'Selladas contra un agua que nunca acaba de escurrirse de ellas, así cada paso aterriza con un pequeño chapoteo íntimo que solo el portador oye.'
    gilded_brew_of_last_regent: 'La receta se discutió más de lo que se preparó, un detalle que su creador insiste en llamar intencional.'
    gilded_carapace_of_hollow_throne: 'Funciona bajo el sistema del honor, algo que nadie puede confirmar sin reabrir la discusión.'
    gilded_chopper_of_hollow_throne: 'Cumple su tarea y luego se disculpa por ello, así que el manual se dejó deliberadamente vago.'
    gilded_circle_of_last_regent: 'Su fiabilidad es objeto de debate constante, así que el manual se dejó deliberadamente vago.'
    gilded_extract: 'Fue declarado auténtico por un estrecho margen, y la segunda explicación nunca se descartó del todo.'
    gilded_locket_of_last_regent: 'Acepta funcionar, bajo protesta escrita, un detalle que todos los implicados acordaron olvidar.'
    gilded_philter_of_hollow_throne: 'La receta generó más discusiones que lotes preparados, algo que la etiqueta revela en letra muy pequeña.'
    gilded_stilettos_of_last_regent: 'Se completó pese a la vacilación unánime, un acuerdo que ninguno de los implicados defendería con ganas.'
    gilded_tassets_of_hollow_throne: 'Su origen cambia según quién lo cuente, y la diferencia dejó de importar en algún punto del camino.'
    gildsteel: 'Se halló donde los registros dicen que no debería estar, así que ambas entradas permanecen en el registro, sin reconciliar.'
    girthstone: 'Tallada por un sastre que midió las ambiciones del portador en vez de su cintura. Ambas resultaron más grandes de lo esperado.'
    glacial_basinet: 'Un yelmo tan frío que se empaña por dentro. Visibilidad opcional, supervivencia obligatoria.'
    glacial_brand: 'Una espada larga templada en agua de deshielo glacial. La hoja se escarcha entre golpes, dramatico pero inutil.'
    glacial_buckle: 'La hebilla es una esquirla de escarcha que nunca se derrite. Práctico. A veces estructural.'
    glacial_cinch: 'Un cinturón forjado en aleación de corazón glacial. Se ajusta apretado y nunca afloja, un poco como la hipotermia.'
    glacial_fortress_greaves: 'Moverse con esto es un entrenamiento completo. Quedarse quieto también.'
    glacial_grasp: 'Todo lo que tocas se congela ligeramente. Incluyendo tu arma, tus aliados y tu almuerzo.'
    glacial_grips: 'Guanteletes ligeros forjados para arqueros y lanzadores del Gran Norte. La palma está forrada con una membrana translúcida que mejora la sensibilidad táctil mientras aísla del frío. Las manos permanecen precisas incluso a temperaturas letales. La membrana tiene un aspecto ligeramente fosforescente de noche, lo que algunos encuentran útil y otros inquietante.'
    glacial_heart: 'El núcleo helado del pecho de un yeti, con frío suficiente para congelar un lago. Ya lo hizo.'
    glacial_loop: 'Un anillo de cristal helado que se regenera al astillarse. La garantía es literalmente infinita.'
    glacial_march_boots: 'Hechas para la marcha eterna por páramos helados. O el trayecto al trabajo. Misma energía.'
    glacial_medallion: 'Un medallón de cristal de escarcha puro. Nunca deja de estar frío. Un poco como tu ex.'
    glacial_morningstar: ''
    glacial_pike: 'Punta de cristal glaciar. Mantiene a los enemigos a una distancia que no eligieron.'
    glacial_recurve: 'Encordado con tendones helados que nunca se aflojan, a diferencia de tu agarre al disparar.'
    glacial_signet: 'Tallado del cristal-corazón de un glaciar. Adormece el dedo que ocupa, cosa que el artesano jura que es una virtud.'
    glacial_verdict: 'La espada dicta su propia sentencia en cada combate: culpable de acercarse demasiado.'
    glacial_visor: 'La visera se empaña con clima cálido. El propietario anterior lo resolvió no yendo nunca a ningún sitio cálido.'
    glacial_waistguard: 'Relleno de cuero curado en ceniza. Sostiene mejor una línea que un brillo.'
    glasschant_daggers: 'Las tijeras buenas. Te dijeron que jamás las tocaras. Las estás usando.'
    glassong_grips: 'Goma hasta el codo. Aquí el agua del fregadero disuelve las cucharas, así que vienen algo gruesos.'
    glasswrought_brew_of_molten_antiphon: 'Cocido en el fogón desde el alba. Lo bastante fuerte para discutir con él.'
    glasswrought_carapace_of_black_choir: 'Atada por delante. Se pliega plana para guardarla y se despliega con un chirrido que vacía la sala.'
    glasswrought_claymore_of_black_choir: 'Suena una nota alta y clara al impactar. Esa nota fue lo último que oyeron varios.'
    glasswrought_falchion_of_black_choir: 'Con sierra para cortezas que se resisten. En esta parroquia, se resisten.'
    glasswrought_fists_of_black_choir: 'Acolchadas para una sartén que jamás se ha fregado, por principio y por el curado.'
    glasswrought_focus_of_molten_antiphon: 'Plumas de fénix, supuestamente. El polvo se enciende, que es una manera de ser minucioso.'
    glasswrought_philter_of_black_choir_pyre: 'Quema dos veces: al entrar, y otra vez cuando después dices lo que piensas.'
    glasswrought_philter_of_black_choir_vitrified: 'Medicinal, según la limpiadora. Gris, según todo el mundo.'
    glasswrought_stilettos_of_molten_antipho: 'Dos cuchillos mondadores, finos como excusas. Pelan una manzana en una tira o una cerradura en una sesión.'
    glasswrought_tassets_of_molten_antiphon: 'Con el bajo subido contra el agua sucia y las ratas. Lo práctico nunca tuvo un aspecto tan lúgubre.'
    gobadoc_eye: 'Un ojo inyectado en sangre arrancado del Señor de la Guerra Goblin. Aún se mueve nerviosamente, como buscando lo siguiente que comer.'
    gobeline_ring: 'Delicado para estándares goblin, lo que significa que solo tiene tres bordes afilados y una mancha sospechosa. La gema es un trozo de vidrio coloreado pulido del que el joyero goblin estaba extremadamente orgulloso. Señalarlo se considera un insulto grave en la cultura goblin. Y también una sentencia de muerte.'
    goblin_cleaver: 'Robada a un goblin que insistía en que era una herencia familiar. El óxido dice lo contrario.'
    goblin_ear: 'Oreja de goblin preservada en una solución salina artesanal. Utilizada en diversas preparaciones alquímicas como componente base. Los goblins encuentran esta práctica ofensiva. Los alquimistas encuentran la reacción de los goblins fascinante desde un punto de vista académico, lo que no mejora las relaciones diplomáticas.'
    goblin_grudge_axe: 'Cada goblin que tuvo esta hacha terminó usándola contra otro goblin. La tradición es tradición.'
    goblin_gunpowder: 'Compuesto explosivo casero. Los goblins miden cantidades por vibras. Las tasas de supervivencia reflejan esta metodología.'
    goblin_knuckle_ring: 'Forjado del nudillo favorito de un goblin — el suyo propio. Dicen que el goblin se tomó la pérdida con filosofía, hasta que dejó de hacerlo. Cabe perfectamente en cualquier dedo, porque los goblins aparentemente tienen nudillos de tamaño universal. La evolución es misteriosa.'
    goblin_loot_bag: 'Un pequeño saco de arpillera lleno de baratijas robadas. Mayormente botones, un hueso de pollo, y la carta de amor lamentable de alguien.'
    goblin_masher: 'Los goblins no sazonan su comida, se la presentan a esto. La técnica se traslada asombrosamente bien a los cráneos.'
    goblin_raider_vest: "Parcheada con al menos cuatro armaduras diferentes, ninguna combinaba y ninguna fue adquirida legalmente. Hay una insignia descolorida en el pecho que dice 'Propiedad de' seguido de un nombre raspado tan agresivamente que dejó un agujero."
    goblin_scimitar: 'Los goblins no forjan espadas. Las encuentran. Esta fue encontrada en la caja torácica de alguien más.'
    goblin_stompers: 'Cosidas por zapateros goblin que claramente tenían opiniones fuertes sobre la comodidad del pie pero ninguna formación. La bota izquierda es ligeramente más grande que la derecha. Si fue intencional sigue siendo motivo de furioso debate académico.'
    goblin_sword: 'El tinte verde viene del cobre, de sangre duende, o de ambos — los filósofos sugieren no preguntar.'
    goblin_tooth: 'Un canino con tapa de oro arrancado de la boca de un oficial goblin. El oro es real. La odontología no lo era.'
    goblin_tooth_belt: 'Cada diente perteneció a alguien que molesto en persona a un cacique goblin. La lista era larga.'
    goblin_trinket_chain: "Una cadena de baratijas robadas, monedas saqueadas y al menos un diente que no pertenecía al goblin. Los goblins lo llaman 'alta costura'. Todos los demás lo llaman prueba del delito."
    goblin_wartop: 'Un yelmo que ha pasado por más cráneos goblin que un dolor de cabeza particularmente persistente. Cada dueño grabó su nombre por dentro, creando una historia de caligrafía cada vez peor. Las abolladuras añaden carácter. Las manchas de sangre, contexto.'
    godbone_saber: 'Hace el trabajo que finalmente se le asignó, y los documentos no reflejan nada de esto.'
    godbone_shard: 'Sus propiedades exactas dependen de a quién se le pregunte, y el expediente se cerró discretamente, sin resolver.'
    godbone_torc: 'Fue forjado durante una discusión que nadie ganó, así que ya nadie que lo lleve puesto pregunta al respecto.'
    godflesh_plate: 'Su garantía se anula en cuanto lo cuestionas, y el segundo borrador nunca llegó a existir.'
    gods_maw_key: 'Fundida a partir de algo que solía ser parte del dios, cuando el dios aún lo usaba. Las Fauces no la reclaman de vuelta tanto como la esperan.'
    godspear_impaler: 'Forjada para sostener una línea en un umbral que ningún Guardián de la Puerta debía sostener solo jamás. El extremo que agarres importa menos que estar del lado correcto de la puerta.'
    godspine_staff: 'Su función se decidió a cara o cruz, una distinción sin mucha diferencia real.'
    godstep_sandals: 'Hace exactamente una cosa, y hasta eso lo disputa, lo cual resulta tranquilizador o profundamente preocupante.'
    golden_fleece: 'Brilla como oro de verdad. Todo juez, en algun momento, intento morderlo para comprobarlo.'
    golden_fleece_amulet: 'Crecida en un triple campeon que nunca tuvo que esforzarse.'
    golden_fleece_helm: 'Tejido tan apretado que detiene flechas y cualquier posibilidad de que te tomen en serio.'
    golden_fleece_legguards: 'Tan comodas que dos aventureros distintos se quedaron dormidos en pleno combate usandolas. Marca invicta.'
    golden_larvae: ''
    golden_mushroom: 'El oro del pobre—igual de inútil, mucho más difícil de encontrar, e imposible de gastar en la taberna.'
    golden_nightcap: ''
    golden_silk: 'Hilada por una matriarca más longeva que buena parte de los imperios. Cada hebra vale más que todo tu inventario.'
    golden_silkling: 'Una larva tejida con hilo precioso, cuya diminuta forma irradia esa determinación inquebrantable que convierte los golpes débiles en ataques aplastantes.'
    golden_wheat: ''
    grasploop: 'Lo último que muchos escaladores sostuvieron antes de dejar de necesitar sostener nada.'
    grave_dust: 'Fino polvo gris de los huesos de un hollow. Los nigromantes pagan bien. Tu reputación en el pueblo, sin embargo, no se recuperará.'
    great_woolame: 'Esta espada larga fue extraída de los restos relucientes de la última comida de un lanalfón, su metal extrañamente preservado por los potentes ácidos estomacales de la criatura. Se recomienda encarecidamente una limpieza a fondo antes de usar.'
    greater_healing_potion: 'Preparada con extracto de nightcap y fluidos biologicos cuestionables. Cierra heridas lo bastante rapido como para dar envidia a los cirujanos.'
    greater_stamina_tonic: 'Ambar, espeso, te inunda de mas ambicion de la que tus piernas estan listas para cumplir.'
    green_bread: 'Denso, pastoso y levemente luminiscente — este pan de hongos sustenta el cuerpo mientras pone a prueba el espíritu. Algunos prisioneros lo piden específicamente, solo para demostrar que han tocado fondo.'
    green_mushroom: 'Un hongo enfermizo cuyo verdor pálido sugiere que prospera gracias a algo más que la luz del sol.'
    green_mushroom_powder: 'Una bolsa de esporas finamente molidas, cosechadas de hongos de bosques frondosos. Sus propiedades tóxicas, concentradas en una sola pizca letal.'
    green_sap: 'Pegajosa, dulce, y levemente sensible. El kweebec no apreció la extracción. Esto es básicamente sangre de árbol.'
    green_stew: 'Esta emulsión de crecimiento forestal y desesperación restaura vitalidad a quienes están lo suficientemente desesperados como para ignorar su parecido con la bilis de trasgo.'
    grimoire_of_embers: 'Cada hechizo chamusca una página del pergamino de muda de una Sombrascua. Termina el libro y habrás memorizado su temperamento junto con los conjuros.'
    grimoire_of_tides: 'Las paginas permanecen siempre humedas. Leerlo se siente como ahogarse, algo que el autor considero una virtud.'
    grimoire_of_warding: ''
    grimreminder: 'Entregada a los nuevos peregrinos como lección de lo que la Cicatriz le hace al entusiasmo. Casi todos la conservan mucho después de aprender la lección.'
    grips_of_the_deathless: 'Toda profecía necesita una mano lo bastante firme para señalar el mal desenlace sin temblar. Estos eran los guantes de esa mano. El profeta se ha ido. La firmeza se quedó.'
    groundpounder_boots: 'Cada paso deja una huella del tamano de un plato. La sutileza nunca fue el objetivo.'
    groundswing: 'Continúa su trayectoria hasta el suelo cuando falla, algo que ocurre lo bastante seguido para que los albañiles del muro lleven la cuenta.'
    guardian_chain: 'Forjada eslabón a eslabón a imagen de la del Último Guardián, portada por aquellos a quienes el Guardián ha juzgado personalmente dignos de defender el último muro.'
    guardian_core: 'El denso metal-corazón recuperado del peto de un Guardián caído, y solo de uno caído. Nadie ha averiguado aún cómo pedirle el suyo a un Guardián que sigue en pie.'
    guardian_gauntlets: 'Fundidos para calzar el mismísimo agarre del Último Guardián, el único par conocido que no se está llevando ahora mismo en el muro. Todos suponen que hay una razón para ello.'
    guardian_waistplate: "Protege todo entre el pecho y las piernas. Tambien conocido como 'todo lo importante'."
    guardians_verdict: 'Blandido por el Último Guardián en las raras ocasiones en que las palabras no bastan. Todos los que lo han visto caer coinciden: las palabras no iban a bastar de todos modos.'
    hadean_ice: 'Hielo de antes de que existiera el sol. No se derrite. No le importa. Ha sobrevivido a galaxias. Eres una inconveniencia.'
    hadean_ichor: 'La sangre del vacío mismo. Cualquiera que lo toque sin encantamientos protectores olvida su propio nombre. Temporalmente.'
    hades_breath_weapon: 'Canaliza aquello que la puerta de abajo exhala entre aperturas. También huele a ello, algo que el encantador debió mencionar antes del ajuste.'
    hades_heart: 'Arrancado al Señor de los Huesos tras un tercer intento. Aún late a un ritmo al que nadie puede marchar.'
    hades_key: 'Tallada de un diente arrancado a algo que vigilaba esta puerta cuando aún no habían tomado el turno los Guardianes de la Puerta. Sostenerla hace doler los molares por solidaridad. El porqué sigue sin explicación.'
    halfturn: 'Demasiado pesada para blandirla dos veces en el tiempo en que un arma corriente logra tres. El primer golpe suele ser el único que importa.'
    halo_draught: 'Las instrucciones de dosis se contradicen a mitad de la etiqueta, algo que quien lo preparó insiste en que fue intencional.'
    halo_splitter: 'Funciona por un tecnicismo, lo cual es técnicamente cierto y completamente inútil.'
    halo_striders: 'Estas botas disputan el concepto de caminar. Creen que el movimiento es una cuestión de opinión filosófica en lugar de un hecho físico.'
    haloforged_brew_of_last_regent: 'Se preparó para zanjar una discusión, y no lo logró, así que los resultados pueden variar, considerablemente.'
    haloforged_carapace_of_last_regent: 'El diseño pasó por varios borradores irreconciliables, así que la queja original nunca se retiró formalmente.'
    haloforged_circle_of_last_regent: 'Funciona bajo el sistema del honor, algo que su artesano llama carácter.'
    haloforged_crest_of_last_regent: 'Su artesano se negó a dar más detalles, un acuerdo que nadie está del todo dispuesto a defender.'
    haloforged_fists_of_hollow_throne: 'Nadie ha confirmado que haga lo que la etiqueta dice, algo que su portador prefiere no pensar.'
    haloforged_fists_of_last_regent: 'El comité de diseño nunca se puso realmente de acuerdo en esto, así que el asunto sigue, por ahora, sin resolver.'
    haloforged_philter_of_hollow_throne: 'Quien lo embotelló nunca se decidió por una versión final, y quien lo preparó aún se niega a tomar partido.'
    haloforged_resin: 'Fue declarado auténtico por un estrecho margen, algo que cambia según la temporada y quién pregunte.'
    haloglass: 'Su pureza se mide en una escala variable y negociable, por un comité que desde entonces se disolvió.'
    hardening_compound: 'Aplicado al metal a medio forjar para que no cambie de idea sobre ser una espada.'
    hauler_harness: 'Más bolsillos que placas de armadura. Cuestión de prioridades.'
    healing_potion: 'Restaurador estandar de campo de batalla. Brilla debilmente, cura adecuadamente y huele peor que la herida que trata.'
    heartmender_torc: 'Emite un zumbido grave cuando alguien cercano está muriendo. Muy popular en las fiestas.'
    heartstring: 'Tira levemente hacia la Cicatriz en todo momento, como una brújula tira hacia el norte. Algunos portadores dejan de resistirse.'
    heartwood_core: 'El anillo más interno de un árbol que creció a través de un campo de batalla. Cuenta más que años.'
    heartwood_spear: 'Astada con una astilla del corazón mismo del árbol-mundo, que volvió a crecer apenas en siete días. Al árbol no parece importarle prestar trozos de sí mismo.'
    heartwood_summoner_club: 'Tallado de un duramen del Weald que aún responde cuando se golpea, en una lengua que nadie ha traducido. Los Osos de Musgo, en cambio, parecen entenderla perfectamente.'
    heavy_leather_vest: 'El feran que llevaba esta piel era, segun todos, el mas perezoso de una especie ya muy perezosa.'
    hemmed_leggings: 'Al menos los dobladillos estan rectos. Todo lo demas es un trabajo en progreso.'
    hermit_pilgrim_trousers: 'Manchado sin remedio desde la cuarta semana. Nadie entrega uno nuevo.'
    hermit_sage_cowl: 'Usada durante los turnos largos. El olor nunca se va del todo con el lavado.'
    hermit_sash: 'Marcada con muescas por cada caja entregada. Nadie ha vuelto a contar desde entonces.'
    hermitude_bow: 'Encordado con tendón de cangrejo. Las flechas huelen a marea baja, lo cual es tanto una desventaja como una distracción.'
    highguard: 'Sostenida en alto por los centinelas del muro durante tanto tiempo que la postura tiene nombre propio en tres idiomas, ninguno halagador.'
    himalayan_flour: 'La cumbre de la molienda, la harina juzga a los panaderos que la usan.'
    hive_ring: 'Tallado en jalea real endurecida con veneno, zumba con desaprobación ante decisiones que quien lo lleva aún no ha tomado. Uno aprende a dejar de preguntar cómo lo sabe. Toda familia tiene un pariente así.'
    hive_warden_mace: 'Recubierto hasta el mango con cera que la propia Madre-Colmena prensó. Todo scarak de las galerías profundas le cede un amplio y respetuoso espacio a quien lo porta — los listos, al menos; el cuento nunca habla dos veces de los tontos.'
    hive_wax: 'Ambar e impermeable, cosechada en camaras de colmena que los scarak abandonaron a medio pleito.'
    hive_wax_girdle: 'Moldeada en cera de abeja y llama alquímica, recuerda la forma de quien la llevó por última vez con una precisión inquietante. Nadie en el pueblo dirá adónde fue esa persona. Varios cambian de tema muy deprisa.'
    hiveguard_mace: 'Sellado contra el fuego y la inundación por igual, tal como dicen los viejos cuentos de los favoritos de la Madre-Colmena. Los scarak lo aprueban con el mismo gesto resignado de una tía que aprueba una boda que no organizó.'
    hivewax_belt: 'Quitina de scarak que murieron como habían vivido — hombro con hombro, diez mil a la vez, convencidos hasta el final de que el enjambre los protegía.'
    hollow_ichor: 'Extraído de las hondonadas más viejas del pantano. Los embalsamadores lo diluyen antes de usarlo; nadie dice por qué.'
    hollow_judge_mace: 'Envuelta en seda funeraria, marcada por viejos juicios. Jamás mostró piedad.'
    hollow_knuckles: 'Acolchados con seda sobre placa vieja. Golpean más fuerte de lo que el relleno sugiere.'
    hollow_legguards: 'Tomadas de un túmulo ya saqueado una vez. Tampoco quedó nada la segunda.'
    hollow_mace: 'Tallada en un femur que sobrevivio a su dueno y no lo oculta en absoluto.'
    hollow_reckoning_blade: ''
    hollow_root_key: 'Nunca cortada, solo crecida, de una raiz que el Tirano Fauceraiz roe sin cesar de vuelta a la oscuridad.'
    hollow_shiv: 'Hojas gemelas envueltas en seda funeraria. Los muertos, resulta, tienen un gusto notable para los mangos.'
    hollow_signet: 'Marca un sello en blanco sobre la cera. Ese vacío es intencional.'
    hollow_tome: 'La mitad de los nombres están tachados. El libro sigue anotándolos igual.'
    hollowcrown_draught: 'La etiqueta menciona un ingrediente que nadie logra identificar, algo que la etiqueta revela en letra muy pequeña.'
    holy_bible: 'Escritura divina capaz de limpiar una conciencia, suponiendo que todavía poseas una conciencia que limpiar.'
    hornhead_hatchet: 'Forjada alrededor de un cuerno roto. El cornicabra la quiere pero le faltan pulgares.'
    hornhead_horn: 'Un cuerno de carnero en espiral, aún caliente. El dueño anterior embistió un árbol y perdió.'
    hunting_javelin: 'Disenada para caza menor. Tambien funciona en caza mayor si la lanzas suficientes veces y crees con fuerza.'
    hush_moth_wing: 'Polvo de alas de una polilla que vuela sin emitir jamás sonido alguno por voluntad propia. Los alquimistas lo aprecian exactamente por eso. La polilla nunca ha explicado por qué.'
    hymn_ember: 'El calor que guarda una piedra cuando el fuego se marcha. Embotellado mientras se pudo.'
    hymn_of_endings: 'Funciona adecuadamente, según su propia admisión, y su artesano lo sostiene, en su mayor parte.'
    hymnbound_core: 'Ladrillo de yesca encerado del alijo privado del sacristán. Prende a la primera, lo que aquí cuenta como milagro.'
    hymnbound_cuirass: 'Se lleva sobre todo y no se compromete con nada. Bolsillos tan hondos que se pierde un incensario.'
    hymnbound_gauntlets_of_ashen_song: 'Para los arriates de lirios de fuego tras el ábside. Las espinas queman; los guantes no están de acuerdo.'
    hymnbound_girdle_choir: 'Te ciñe a la postura del coro: pecho fuera, mentón alto, blanco fácil para quien esté debajo.'
    hymnbound_girdle_pyre: 'Brilla rojo apagado en la hebilla. Es o una advertencia o una declaración de moda, y nunca se aclara.'
    hymnbound_hatchet_of_ashen_song: 'Ligera en la mano, pesada en las secuelas. Deja un fino polvo gris que se cuela en todo.'
    hymnbound_helm: 'Suena leve al anochecer sin campana alguna. El herrero dejó de aceptar preguntas al respecto.'
    hymnbound_ingot: 'Hierro macizo, calentado al fogón, guiado por el agravio. Las arrugas y la disidencia se rinden por igual.'
    hymnbound_sabatons_of_cooling_vent: 'Canalizan el calor del suelo por el talón. Pies calientes, huellas chamuscadas, sin quejas aún.'
    incandescent_lance: 'Brilla con un calor que jamas mengua, con una empunadura que claramente no fue pensada para eso.'
    infernal_cleaver: 'Arde con la furia de mil evaluaciones de desempeño. Irónico, en un mundo de hielo. Nadie se ha quejado todavía.'
    inferno_clutch: 'El cuero no se enfría desde las fosas donde arden los muertos. El agarre se aprieta solo cerca del calor.'
    inferno_pendant: 'La piedra de su centro no se ha enfriado desde que ardieron las primeras piras.'
    inferno_shard: 'Desecho de estufa fundido, rastrillado de la parrilla. El horno guarda sus recibos.'
    infested_legguards: 'Estas grebas se retuercen con colonias de crecimientos parasitarios, la malla quitinosa se ha fusionado hace mucho con el hierro que hay debajo.'
    infested_ring: 'Un aro de quitina hueca, cuyos surcos rebosan de cosas sin nombre que se retuercen y muerden.'
    infested_sash: 'Venas pulsantes recorren la tela contaminada como si la prenda siguiera viva y digiriendo. Llevarla puesta constituye una relación íntima con la enfermedad.'
    infinity_amber: ''
    infinity_arcanite: 'Irradia carga residual suficiente para mantener encendida una hoguera de guardia durante cualquier tormenta.'
    infinity_bloodstone: ''
    infinity_cursed_gem: ''
    infinity_diamond: ''
    infinity_draconite: ''
    infinity_duskite: ''
    infinity_jade: ''
    infinity_moonstone: ''
    infinity_obsidianite: ''
    infinity_quartz: ''
    iron_battleaxe: 'Forjada con fragmentos de caballero oscuro. La oscuridad es estructural. El peso forja el caracter.'
    iron_battlecleaver: 'La leyenda la llama el hacha que acabo una era. La historia recuerda sobre todo la valla.'
    iron_battleplate: 'Los caballeros sombra forjan su armadura solo en eclipses, muy pocos para la demanda.'
    iron_bludgeon: 'Garrote de hierro fundido — no es realmente un arma diseñada, sino más bien una pieza de metal con un extremo que se puede agarrar. Efectivo precisamente porque no es sofisticado. Los armeros lo venden con leve rubor. Los compradores lo adquieren sin vergüenza porque los resultados no dejan dudas.'
    iron_flanged_mace: 'Cada golpe huele vagamente a establo. Nadie ha explicado por que. Nadie quiere hacerlo.'
    iron_gauntlets: "Guanteletes reglamentarios de caballero sombrío. Las marcas de agarre del anterior dueño aún son visibles en el metal, congeladas en una expresión de 'oh no, otra vez no'."
    iron_kneeguards: 'Rescatadas de un caballero sombrío que se arrodilló ante el altar equivocado. Las rodilleras sobrevivieron. Su carrera en la oscuridad organizada, no.'
    iron_legplates: 'Hierro blanco hueso de las forjas imperecederas de abajo, donde los herreros nunca pronuncian palabra mientras trabajan. Apacible, hasta que recuerdas exactamente por qué han enmudecido.'
    iron_pounder: ''
    iron_sickle: 'Una hoja curva que corta hierbas con precision quirurgica. El dueno anterior no era cirujano, lo que explica la sangre.'
    iron_war_spear: 'Con punta de una antigua esquirla de médula que se resiste a secarse por completo. Lo que sea que dio su vida para hacer esta lanza no ha dejado de contribuir — llámalo dedicación, o un asunto sin terminar.'
    iron_warhelm: 'El herrero que forjó este yelmo trabajaba exclusivamente a la luz de la luna, alegando que las sombras le susurraban el diseño. Las sombras también le susurraron el precio. No fue razonable.'
    ironbark_treads: 'Corteza de un arbol que vio venir el hacha y se fue primero. Los pasos suenan vagamente a asentimiento.'
    ironbound_bread: "Sirve de escudo en emergencias. Las resenas lo llaman 'rustico'. Las resenas son generosas."
    ironbrow_casque: 'Te da un aspecto intimidante. Te duele el cuello. Cuestión de compensaciones.'
    ironbuckle_girdle: 'La hebilla por sí sola pesa más que un cinturón entero. Ese es precisamente el argumento de venta.'
    irongrip_signet: 'Se aprieta ligeramente cuando estás enfadado. Se afloja cuando te calmas. Sobre todo se mantiene apretado.'
    ironhide_girdle: 'Suficientemente grueso para desviar una hoja, suficientemente rígido para que arrodillarse sea una decisión, no un reflejo.'
    ironjaw: 'Diseñada para que quien la lleve conserve los dientes donde empezó la pelea. Una ambición modesta, rara vez lograda a esta altitud.'
    ironloaf_slab: 'Menos pan, mas material de construccion. Los armeros lo muelen como relleno y jamas miran atras.'
    ivory_orchid_paste: 'Una pasta tan suave que podría negociar tratados de paz, si los tratados de paz olieran a hongo de cueva y arrepentimiento.'
    ivory_shrooms: 'Hongos de color crema que parecen casi luminiscentes contra la tierra oscura de la que brotan. Prueba de que incluso en los lugares más oscuros, la belleza existe—generalmente justo antes de matarte.'
    iyashi_living_branch: 'El árbol del que proviene murió hace siglos. Nadie se lo dijo a la rama. Sigue brotando cada primavera.'
    jade: 'Lo bastante verde para dar envidia a una esmeralda y sin embargo mas barato que una comida de taberna.'
    jade_hoe: 'Una herramienta agricola tan hermosa que los granjeros dudan en usarla. Luego el hambre gana, como siempre.'
    jade_pickaxe: 'Usa jade para minar jade. Las implicaciones filosoficas se pierden en la mayoria de mineros, demasiado ocupados enriqueciendose.'
    jade_powder: 'Un fino polvo verde que mancha todo lo que toca incluida tu reputacion de minero limpio.'
    journeyman_saber: 'Suficiente para matar un goblin si se queda quieto y acepta ser apunalado. Progreso!'
    key_aragog: 'Cubierta de seda y residuos de veneno, esta ornada llave palpita con el latido de la colonia más aterradora del Bosque Prohibido.'
    kiln_potholder: 'Un cuadrado acolchado que no teme a ningún horno. Carga lo que sea en la cocina, salvo una melodía, una aguja, o el tacto de tus yemas.'
    kindling: 'Tallado en madera que la herida nunca terminó de quemar. Aún recuerda la forma del fuego.'
    kneebreakers: 'Reforzado en la articulación donde tres pares anteriores fallaron. Quien las lleva camina perfectamente. A todos los demás les parece sospechoso.'
    knucklebone: 'Fundido a partir de los nudillos de un molde del que nadie llevó registro. Calza como hecho para una mano algo más grande que la tuya.'
    knucklevow: 'Grabado con una promesa que ya nadie vivo sabe leer. El metal la recuerda mejor de lo que cualquier traductor podría.'
    koa_eye: 'Saltón, sin parpadear, y de alguna manera aún juzgándote. Reactivo para pociones de visión. Los efectos secundarios pueden incluir paranoia.'
    koa_eye_ring: 'Engastado con un ojo de Koa pulido que parece, inquietantemente, seguir buscando algo.'
    koa_eye_signet: 'Los Koa tienen más o menos la misma expresión estén felices, furiosos o convirtiéndose en joyería. El ojo de este anillo todavía parpadea alguna que otra vez, aunque nadie sabe si es a propósito.'
    koa_slime: 'Mucosidad viscosa de rana. Resbala de los recipientes y cubre todo lo demás. A los alquimistas les encanta. Todos los demás te odian.'
    koa_slime_brigandine: 'Placas de cuero lacadas con mucosidad de Koa, que se endurece en un recubrimiento sorprendentemente resistente. El Koa producía esta mucosidad como respuesta al estrés, lo que significa que esta armadura está literalmente hecha de ansiedad. Todavía brilla cuando llueve, dándote la apariencia de un guerrero excepcionalmente hidratado.'
    koa_slime_codex: 'Las paginas estan pegadas con baba de koa. Leerlo requiere habilidad y un estomago fuerte.'
    koa_slime_rod: 'Un palo recubierto de baba de koa solidificada. Canaliza magia o al menos finge.'
    koa_tongue: 'Un metro de músculo prensil. Se estira, chasquea, y ocasionalmente atrapa algo que no son moscas.'
    koagulant_longbow: 'La cuerda secreta un moco fino. Nadie sabe por qué. Nadie quiere saberlo.'
    koagulant_wand: 'Pulsa con energia pegajosa, curando heridas al recubrirlas con algo que es mejor no examinar de cerca.'
    kraken_depth_staff: 'Dicen que canaliza las fosas oceánicas más profundas. Los portadores sienten que los observan. Así es.'
    kraken_ink: 'Extraída de las glándulas más profundas del Kraken. Escribe profecías. También listas del supermercado. No es exigente.'
    kraken_key: 'Corroída por sal y percebes. El motivo de tentáculo en el mango no es nada sutil.'
    kraken_tide_boots: 'Se agarra a cualquier superficie, húmeda o seca. Las suelas de origen kraken leen la marea antes que tú.'
    kweebec_leaf_charm: 'Una hoja viva que jamás se marchita. Los druidas la usan como objeto de enfoque. La hoja juzga tu carácter en silencio.'
    kweebec_vine_sash: 'Atado durante un canto Kweebec de tres dias cuyas palabras ni los Kweebec recuerdan del todo.'
    lantern_shard_ring: 'Una esquirla de linterna espectral, aún tenuemente brillante. Te susurra la hora del día, lo cual sería útil si no estuviera perpetuamente equivocada y no fuera profundamente pasivo-agresiva cuando la corriges.'
    larvano: 'Pulsa como un diminuto latido. La colmena scarak de la que vino no ha dejado de contar sus perdidas.'
    last_guardian_aegis: 'Portada por el Último Guardián desde cuando la Cicatriz ni siquiera tenía nombre, abollada en lugares que nada ha logrado abollar dos veces desde entonces. Nunca, ni una sola vez, ha sido la razón de que el muro cayera.'
    lastbreath: 'Tallada para quien la lleve en último lugar. El armero nunca explica qué significa eso, y nadie ha vuelto a preguntar.'
    lastmile: 'Llamadas así por el tramo que todo peregrino jura más corto que el anterior. Nunca lo es.'
    lastwhisper: 'Porta un hechizo tan antiguo que las sílabas se han desgastado. Diga lo que dijera en origen, sigue funcionando.'
    lava_chitin: 'Caparazon de garramagma, naturalmente ignifugo. Huele levemente a la discusion que perdio.'
    leather_heavy_boots: 'Tres capas de cuero de tusker. Tus pies sobreviviran a tus rodillas con comodidad.'
    leather_treatment: 'Bano quimico que convierte pieles crudas en cuero flexible. Los curtidores no pueden funcionar sin un suministro constante.'
    legguards_of_the_primordial: 'Fundidas en la piel que muda un Profeta de Ceniza cuando una visión se alarga. El paso de quien las lleva se ralentiza al ritmo de un profeta: deliberado, sin prisa, y siempre llegando justo cuando llega la mala noticia.'
    legweight: 'Más pesado de lo reglamentario, bajo la teoría de que una pierna demasiado cansada para correr es una pierna que se queda a luchar.'
    leviathan_tentacles: 'Curadas rígidas tras arrancarlas de algo que el Kraken llama familia. Aún se sacuden. De vez en cuando.'
    lightless_striders: 'Suelas lo bastante negras para desaparecer en la oscuridad del bosque. Quien las lleva deja de ver dónde pisa hacia el tercer día. Al cuarto, ya no importa.'
    liquid_koa: 'Una baba que nunca aprendió a mantener una forma y ha hecho las paces con ello. Casi.'
    litany_of_cinders: 'Un pergamino interminable de tareas domésticas. Leído en voz alta, el polvo se recoloca solo por pura culpa.'
    living_spark: 'Una chispa incapaz de apagarse del todo, que revive sola en tu bolsillo. Los magos de fuego la usan como mechero. Riesgo para la seguridad.'
    living_spark_greataxe: 'La cabeza aún crepita con lo último que cortó, y nadie está del todo seguro de qué fue eso. Los informes están archivados y sellados. Lo que se sabe con certeza: el hacha elige sus objetivos. Quien sostiene el mango va mayormente de acompañante.'
    longdraw: 'Hace falta un aliento entero para tensarlo y otro entero para arrepentirse. Ambos son opcionales si el objetivo es lo bastante rápido.'
    longreach: 'Extiende el alcance de quien la empuña más allá del límite que casi todo rival considera justo. La justicia nunca formó parte del encargo.'
    lorito_helmet: 'A full parrot pulled over the ears. The sprout on top is load-bearing, emotionally.'
    lumber_cleaver: 'Diseñada para la madera. Usada para todo lo demás. La hoja todavía lleva rastros de resina, lo cual es tranquilizador — prueba de uso inocente — o inquietante, según lo que la resina cubría antes. Los leñadores que la llevaron al combate generalmente sobrevivieron. La madera, mucho menos.'
    lure_light_pendant: 'Guarda una esquirla de luz-rape cautiva, que late a su propio ritmo sin importar qué la lleve. Los señuelos reales del Weald han empezado a acercarse a quien lo porta. No se considera buena señal.'
    magmooligan_charm: 'Un amuleto de lana volcánica que irradia un calor suave y huele levemente a azufre y traición. El magmooligan del que proviene pastaba pacíficamente cerca de un río de lava cuando la oportunidad golpeó. Bueno. Cuando tú golpeaste.'
    magmooligan_hauberk: 'Lana volcánica afieltrada sobre viejos anillos de bronce, suficientemente cálida para ventiscas e insoportable en cualquier otro sitio. En noches frías, algo en el tejido todavía bala, débilmente. El juramento del armero de que la bestia estaba completamente terminada de antemano suena cada vez menos convincente con cada relato.'
    magmooligan_waraxe: 'Los magmooligans son pequeños, rencorosos y no dejan de incendiar cosas sin ninguna razón que una criatura cuerda aceptaría. Esta hacha es lo que queda cuando un herrero atrapa por fin a uno. El fuego jamás llegó a calmarse.'
    magmooligan_wool: 'Lana resistente al fuego que aún arde. Los tejedores reportan quemaduras leves y preguntas existenciales sobre telas inflamables.'
    magmooligan_wool_ring: 'Fieltrado con lana volcanica. Mantiene el dedo caliente, un consuelo mas raro de lo que suena.'
    malt_bread: 'Pan sospechosamente dulce que puede o no haber fermentado en tu bolsa. La moral mejora igual.'
    malt_flour: 'Harina con tono maltoso que hace que el pan sepa a cerveza.'
    marchworn: 'Ya desgastado por alguien que no sobrevivió para seguir usándolo. Tallado con generosidad, por cortesía profesional.'
    marginalia: 'El texto principal es anodino. Todo lo que vale la pena saber fue garabateado en los márgenes por alguien que, claramente, no estaba de acuerdo con él.'
    marrow_cinch: 'Tallado en una columna vertebral que una vez estuvo erguida y tuvo opiniones firmes todo el tiempo. Se aprieta solo cada vez que te saltas una comida, juzgando tus hábitos desde lo que quede del más allá.'
    marrow_knuckles: 'Guanteletes tallados de los huesos de algo que murió hace mucho tiempo y no lo ha superado del todo. Fríos en verano, más fríos en invierno, y helados cuando algo no-muerto está cerca. Un terrible sistema de alarma temprana, porque cuando tus dedos se entumecen, la cosa ya te respira en el cuello. Figurativamente. Los muertos no respiran.'
    marrow_ring: "Los nigromantes los adoran por esa estética de 'recién exhumado' sin la molestia de cavar."
    matriarch_tusk: 'Arrancado del Gran Colmillo Cenizo tras una pelea de la que la manada todavía habla. La tierra recuerda haber sido golpeada tan fuerte; desde entonces no ha perdonado a nadie.'
    matron_chitin: 'Placa de exoesqueleto de la viuda blanca misma. Más oscura que la obsidiana y el doble de dura. Los armeros lloran de alegría.'
    matron_chitin_gauntlets: 'Blindados con caparazón de la Viuda de Ceniza. Aún tibios de su madriguera.'
    matron_silk_slippers: 'Hiladas con la seda que la Matrona del Abismo muda en sus cacerías más profundas, lo bastante suaves para cruzar el suelo del Weald sin un ruido. El silencio es lo único que importa aquí abajo.'
    maw_cleaver: 'Quien lo hizo cambió de parecer a mitad de camino, algo que su artesano llama carácter.'
    maw_crusher_fists: 'Su comportamiento contradice su propia descripción, lo cual es una falla de diseño o todo el sentido de esto.'
    maw_tooth_ring: 'Un anillo que niega firmemente su propia existencia mientras se usa. Es simultáneamente absolutamente cierto y completamente dudoso.'
    maw_visage: 'Un yelmo que insiste en tener razón incluso cuando los hechos sugieren lo contrario. Toma posturas de principios sobre nada en particular.'
    mender_cuisses: 'Acolchada con hierbas curativas. Arrodillate, respira, deja que el papeleo — perdon, las hierbas — hagan el resto.'
    militia_breastplate: 'Estandar para guardias de aldea que no pueden pagar armadura real. Desvía flechas si crees con fuerza.'
    millstone: 'Las muelas del pueblo molieron trigo durante seis generaciones, hasta que a alguien se le ocurrió blandir una. Funciona. Nadie le preguntó al molinero.'
    mineral_biscuit: 'Una galleta enriquecida con polvo de diamante. Tecnicamente comestible, practicamente una muela para tus molares.'
    minor_healing_brew: 'Un lodo verde tibio que cura cortes de papel y egos heridos. Sabe a arrepentimiento con un toque de musgo.'
    mire_bloom: 'Una flor pálida que solo abre en plena oscuridad y se cierra al primer atisbo de luz, lo que hace de recogerla un tantear a ciegas con esperanza.'
    mire_heart: 'El corazón real de un fen dread. Aún late. Muy lentamente. Almacenar en un contenedor sellado a menos que quieras pesadillas.'
    mire_judge_mace: 'Llamado así por cómo zanja las disputas en las profundidades del Weald, es decir, para siempre. El Flautista de la Penumbra compuso una canción sobre él; a nadie le gusta oírla.'
    mire_waders: 'Calzado reglamentario para quien esté apostado más allá de los juncos. Los pies secos no forman parte del trato.'
    mirefang_kris: 'Hoja ondulada como el colmillo de una Reptante de la Ciénaga, sinceramente porque es exactamente de lo que está fundida. Entra con más facilidad de la esperada.'
    mirefang_loop: 'Doblado a partir de un solo colmillo curvo, lo bastante pequeño para olvidar que lo llevas hasta que algo, en el Weald, reacciona a él primero.'
    mireglass_infusion: 'Vidrio de limo fundido y recompuesto con algo vivo removido dentro, que los artesanos juran mejora el temple sin precisar nunca el de quién.'
    mireweald_brew_of_deep_canopy: 'Verde, espesa y levemente en movimiento, cosa que el preparador jura que es solo poso asentándose y preferiría que no la miraras muy de cerca.'
    mireweald_carapace_of_drowned_weald: 'Crecido en torno a su portador durante toda una estación, encaja a la perfección y se quita, cuando es preciso, como la corteza se despega de un árbol.'
    mireweald_crest_of_deep_canopy: 'Camuflada para el estrato donde el dosel tapa la poca luz que baja hasta ahí, es decir, para ocultarse, cosa que el Weald recompensa.'
    mireweald_lattice: 'Un armazón de cristal vivo que sigue creciendo tras la cosecha, despacio, en la dirección en que lo orientó el último que lo manejó, por terquedad o costumbre.'
    mireweald_tassets_of_deep_canopy: 'Placas vivas que fotosintetizan la poca luz que las alcanza, o sea nada, así que en su lugar se comen despacio al portador. Despacio.'
    mireweave_grips: 'Tejidos con seda-de-ciénaga que los Lomos de Espora hilan entre sistemas de raíces, lo bastante pegajosa para mejorar un agarre y lo bastante desagradable para que nadie pregunte cómo se cosecha.'
    mirrormelt_essence: 'Destilada del único punto de Mirrormere que nunca se congela del todo. Recuerda todo lo que se derritió en ella.'
    mithril_axe: 'Garras de oso para el agarre, quitina de garra de magma para el filo. Parte troncos, craneos y argumentos con entusiasmo volcanico.'
    mithril_battleaxe: 'A dos manos, doble filo y triple arrepentimiento. La quitina de esta garra volcánica mantiene el filo eternamente caliente. Literalmente.'
    mithril_cinder_striders: 'El par mejorado. De algun modo mas calido, mas ruidoso, y sigue observando.'
    mithril_club: 'Tachuelas de garra de oso, cubierta de jabali, forro de vellon dorado. Mas ligero de lo que parece, mas pesado de lo que esperas. Muy persuasivo.'
    mithril_longbow: 'Construido con las propias plumas de la cola de un halcón de tormenta, tensadas en alambre de mithril. El arquero se lleva el mérito. El viento, si pudiera hablar, tendría varias correcciones que hacer.'
    mithril_mace: ''
    mithril_sword: 'Forrada de vellón dorado y tan ligera que apenas se anuncia en tu mano — que es exactamente el problema para cualquiera que esté del otro lado.'
    mokan: 'A wide woven hat. Keeps the rain off and the questions away.'
    molten_verse_casque_of_glass_cathedral: 'Guarda en la cresta el hueso de un dedo de santo, para la suerte. La suerte del santo consta en acta.'
    molten_verse_charm_of_rising_hymn: 'Una cuenta de vidrio que nunca enfría del todo. Reconforta en la mano hasta que la olvidas sobre un pergamino.'
    molten_verse_hauberk_of_glass_cathedral_choir: 'Entregado a quien friega los suelos vitrificados. Las manchas tienen antigüedad.'
    molten_verse_hauberk_of_glass_cathedral_pyre: 'Cortado de las grandes cortinas de la nave. Las polillas se llevaron el dobladillo; la grandeza sobrevivió.'
    molten_verse_hauberk_of_rising_hymn: 'Se calienta cuanto más dura el combate. Los largos acaban contigo al rojo y el enemigo ausente.'
    molten_verse_sash_of_glass_cathedral: 'Trenzada con una cinta de vidrio de colores. Bonito, hasta que un reflejo te ciega a ti mismo.'
    molten_verse_scepter: 'Apaga velas, faroles y entusiasmo a distancia. El mango largo es para las arañas del techo.'
    momaku: 'A spirit-mask banner draped down the back to frighten debtors and impress no one already dead.'
    moonclad_band_of_silt_throne: 'Un aro de escama lunar que sigue fresco incluso en el calor febril del Weald profundo, al que el portador se aferra más de lo confesado.'
    moonclad_breastplate_of_silt_throne: 'Se dice que su placado de Garra de Luna brilla tenue las noches en que sale la luna, lo que tan hondo en el Weald significa nunca, así que la afirmación está a salvo de toda prueba.'
    moonclad_crusher_of_silt_throne: 'Revestido de concha pálida que muestra en blanco cada grieta que causa, llevando una cuenta pulcra y luminosa que quien lo empuña no puede apagar.'
    moonclad_pike_of_brackish_deep: 'Rematada en pálida escama lunar, fría hasta la punta, leve consuelo para quien sostiene el otro extremo en la oscuridad febril y tibia.'
    moonclad_poultice_of_silt_throne: 'Envuelto en concha pálida que sigue fría contra la fiebre, un consuelo que apreciaba la corte ahogada y que la corte ahogada ya no necesita.'
    moonclad_tonic_of_brackish_deep_matron: 'Embotellado bajo la concha pálida que lo mantiene fresco, lo más parecido a agua de luna que se prepara tan abajo.'
    moonclad_tonic_of_brackish_deep_mire: 'La base de agua de ciénaga se asienta en capas si se deja reposar, que el preparador dice agitar sin decir nunca qué es la capa del fondo.'
    moonclad_torc_of_silt_throne: 'Un collar de concha pálida que la corte llevaba para captar la luz lunar por una sala ahora a treinta metros bajo el limo. No ha captado ninguna desde entonces.'
    moonclad_treads_of_brackish_deep: 'Placadas con escama lunar que sigue fría bajo el pie, lo más parecido a la luz lunar que el portador sentirá tan hondo.'
    moonclad_visor_of_silt_throne: 'Placado con concha de Garra de Luna que capta la poca luz lunar que baja hasta aquí, casi nada, así que sobre todo recuerda que antes había una luna.'
    moonclaw_shard: 'Un fragmento de garra de la Emperatriz Garra de Luna. Reluce bajo la luna. Los encantadores que lo tocan afirman oír un ronroneo.'
    moonfang_precision_band: 'Engarzado con un fragmento de hueso de un depredador lunar que jamás erró a su presa. La precisión se transfiere por proximidad. Los arqueros que lo llevan notan que sus disparos se corrigen ligeramente solos. No es una muleta, insisten. Es una colaboración. Filosóficamente discutible pero prácticamente efectivo.'
    moonfang_waistguard: 'Recuperado del pelaje de una bestia que cazaba con luna llena y dormía el resto del tiempo. El cuero aún lleva algo nocturno que es difícil de explicar a plena luz del día. Los portadores describen una claridad inusual en la oscuridad. No exactamente visión nocturna. Más bien la sensación de que la oscuridad está de su lado.'
    moonlit_choker: 'Cerrada con fuerza justo cuando las tumbas comienzan a abrirse al anochecer. Se afloja solo al terminar la guardia.'
    moonlit_claw: 'Brilla débilmente cuando la luna la ilumina. El colmillo lunar del que proviene fue alguna vez una leyenda. Ahora es un material de artesanía. El círculo de la vida.'
    moonlit_recurve: ''
    moonrise_boots: 'Fieltrado con lana que aun recuerda estar viva y a veces todavia intenta pastar.'
    moonstone: 'Brilla tenuemente bajo la luz de las estrellas lo cual es totalmente inutil ya que los mineros trabajan bajo tierra.'
    moonstone_hoe: 'Labra el suelo con resonancia lunar. El trigo crece un 12% mas rapido. El granjero envejece un 12% mas rapido. Comercio justo.'
    moonstone_pickaxe: 'La cabeza pulsa con palida luminiscencia. Los mineros juran que encuentra vetas por si sola. El pico se niega a comentar.'
    moonstone_powder: 'Brilla en la oscuridad lo que lo hace facil de encontrar e imposible de esconder de los recaudadores de impuestos.'
    moonstone_sickle: 'Brilla debilmente bajo la luz de las estrellas. Los herbolarios dicen que mejora el rendimiento. Los alquimistas dicen que es placebo. Ambos estan equivocados.'
    mules_burden: 'Mas puntos de sujecion que la caja de un manejador de exposiciones. Tambien mas pesado.'
    muleteer_march: 'Recorrió más leguas tras la columna de suministros que ningún soldado vivo. Jamás perdió un carro.'
    neckoath: 'Llevada por peregrinos que juraron alcanzar el muro o morir en el intento. La mayoría todavía la lleva.'
    nerak_key: 'Hueso, grabado con runas que murmuran amenazas en lenguas que ya nadie vivo habla. A los muertos no les agradan mucho las visitas. Sus cerraduras, resulta, opinan exactamente lo mismo.'
    nerak_marrow: 'Médula ennegrecida extraída de los propios huesos ancestrales de Nerak, que aún zumba débilmente con una vida que no debería tener. Los alquimistas la aprecian por su potencia. Todos los demás la evitan por el susurro, cuyas palabras nadie ha llegado nunca a captar del todo.'
    nerak_marrow_bow: 'Encordado con un tendón que Nerak perdió hace siglos y nunca reclamó. Tensa el arco, y la cuerda tararea la misma nota grave que su corte sigue cantando bajo tierra, quieras unirte o no.'
    nexus_blade: 'Forjada en la calzada donde tres caminos se unen a los muertos. Aún zumba al anochecer.'
    nightcap: 'Un hongo bioluminiscente que pulsa con un inquietante resplandor azulado, sugiriendo origenes en cavernas donde la luz solar es menos un recuerdo que un rumor. Los alquimistas lo codician por sus propiedades soporiferas, aunque el hongo permanece profundamente indiferente a sus afectos.'
    nightcap_elixir_base: 'La base de cada poción cuestionable preparada después de medianoche por alguien que debería haberse ido a dormir.'
    nightfang_daggers: 'Hojas gemelas que desaparecen en la sombra y reaparecen en columnas vertebrales.'
    nightfang_razors: ''
    novice_wand: 'Tallada de una rama que claramente no estaba lista. Echa chispas ocasionalmente. Sobre todo en momentos inoportunos.'
    null_essence: 'Ausencia líquida. Disuelve las paredes del contenedor si se almacena demasiado tiempo. Los encantadores pagan precios obscenos. El almacenamiento es tu problema.'
    oblivion_saber: ''
    obsidian_arc_bow: 'Encordada con cinta de delantal encerada. Las cortinas cayeron hace años; la barra empezó una segunda carrera.'
    obsidian_casque_of_glass_cathedral: 'Abovedado como techo de capilla, e igual de bueno para dejar fuera la opinión de los fieles.'
    obsidian_choir_plate: 'La armadura del sagrario interior, donde solo están los de confianza. La confianza se da poco y se quita rápido.'
    obsidian_cordial_choir: 'Para cocinar, insiste la etiqueta. El cocinero insiste en lo contrario.'
    obsidian_cordial_of_rising_hymn: 'Un calor claro y ascendente que sube el ánimo y, un instante, el vello de los brazos.'
    obsidian_cordial_pyre: 'Un trago y te pitan los oídos, lloran los ojos, y las heridas se cierran por pura intimidación.'
    obsidian_core: 'El centro denso de una colada de vidrio. Córtalo mal y el conjunto vota por volverse mil cuchillos.'
    obsidian_elixir_of_glass_cathedral: 'Una copita antes de acostarse. La cama es opcional; la copita no.'
    obsidian_extract: 'Pulimento para los grandes fogones. El brillo dura una semana; el olor dura un matrimonio.'
    obsidian_flux: 'Pasta cáustica que arranca hollín, barniz y huellas. Cuidado con cuáles de esas cosas aún querías.'
    obsidian_psalter: 'Cada receta termina con la misma instrucción: dejarlo dentro hasta que deje de gritar. Funciona con asados. Funciona con herejes.'
    obsidian_signet: 'Estampa una marca en cera caliente y, si puede, en alguna frente. Sella igual en ambos casos.'
    obsidian_stompers: 'Suelas de vidrio pulido, brillantes como espejo. Lo último que ve un enemigo caído es su cara sorprendida.'
    obsidianite: 'Vidrio volcanico que se rompe en bordes lo bastante afilados para cortar piedra y ambiciones profesionales.'
    obsidianite_powder: 'Fragmentos microscópicos suspendidos en polvo mineral, con avisos de seguridad lo bastante largos para empapelar la sala de espera de un sanador. Están, sin excepción, todos justificados.'
    ocean_grimoire: 'Escrito con tinta que solo aparece sumergida. Material de estudio muy inconveniente.'
    ocean_sigil: 'Coral tallado con runas talokan. Los eruditos han descifrado tres de nueve. Las otras seis son peores.'
    old_hoe: 'Una herramienta de granja rústica reforzada con antenas azules dentadas, sus pelos sensoriales todavía se estremecen con reflejos residuales.'
    onyxium_aegis_pendant: 'Contiene un ojo de córvido preservado que parpadea cuando hay peligro cerca. A veces también parpadea sin más. No está claro por qué.'
    onyxium_bastion_greaves: 'Tan cómodas que tres soldados se durmieron en plena batalla usándolas. El mando no lo encontró gracioso.'
    onyxium_bulwark_helm: "Los caparazones de cangrejo tintinean levemente en combate. Los veteranos lo llaman 'el aplauso'. No es un aplauso."
    onyxium_caravanner_mail: 'Una Sombrascua la llevó por los caminos de la falla escoltando mercancía sin ser asaltada jamás; el olor se encargaba. Las caravanas aún contratan el patrón, ya que no la fuente.'
    onyxium_cleaver: ''
    onyxium_conduit: 'Coronado con una hoja viva de kweebec y envuelto en madera magmooligan. Tararea cuando lo ignoran.'
    onyxium_crit_band: 'Prensado del núcleo aún tibio de una Sombrascua, enfriado apenas lo justo para llevarlo sin remordimiento. Templa la piel de tal manera que agudiza el foco en los peores momentos.'
    onyxium_crushfists: 'Hechos para acabar una carga en un solo intercambio. Rara vez hace falta un segundo.'
    onyxium_edge: ''
    onyxium_fortress_girdle: 'Hecho de la piel de una criatura tan perezosa que desarrolló armadura en vez de huir del peligro.'
    onyxium_fortress_plate: 'Ensamblada con reliquias tribales por alguien que valoraba sobrevivir más que la sutileza. Se nota.'
    onyxium_greathelm: 'Visión periférica sacrificada por una mandibular que detiene casi todo.'
    onyxium_guardian_mace: 'Emitida de oficio a los guardianes de tumba. Las abolladuras sobreviven a quien la empuña.'
    onyxium_hatchet: ''
    onyxium_hauler_boots: 'La Sombrascua que subía mineral por esa cuesta imposible ardió sin llama todo el trayecto. Estas botas no se cansan. Humean, a veces.'
    onyxium_iron_wall_grips: 'Las escamas aún flexionan al cerrar el puño, como si el dueño original nunca lo hubiera soltado del todo.'
    onyxium_ironfoot: 'Impregnadas de esencia Koa. Los ojos de las hebillas te siguen por la habitación. Educadamente.'
    onyxium_loadbearer: 'Curtido con piel de Sombra de Ceniza mediante un proceso que implica humo, paciencia y una comprensión práctica de cosas que no deberían seguir calientes. Aguanta más peso del que parece.'
    onyxium_longbow: ''
    onyxium_packmule_grips: 'Dedos moldeados sobre una Sombrascua porteadora de brasas: cruzó el continente sin dejar caer ninguna. Lo que sostengas no lo soltarás hasta que ella misma lo hubiera soltado.'
    onyxium_porter_legguards: 'Una Sombrascua pasó un siglo arrodillada ante la misma fragua; las rodilleras cargan ese desgaste. Buenas para acarrear cuesta arriba. Para arrodillarse en otra parte, nunca más.'
    onyxium_sages_locket: 'Hallado enroscado en la cresta de una Sombrascua, tibio siglos después. Guarda su sabiduría para sí — y de paso la tuya — y lo compensa todo en pura resistencia.'
    onyxium_scholars_visage: 'La cresta superciliar de una Sombrascua pensativa, a juzgar por el desgaste. Mantiene despierto en consejos eternos. Los eruditos citan el diseño. Es el calor.'
    onyxium_spirit_club: 'Un fuego fatuo de tumba anida en la cabeza. Solo brilla cuando algo agoniza cerca.'
    onyxium_striders: 'Entregadas a quien saca el puesto más lejano. El regreso es más largo que la ida.'
    onyxium_trident: ''
    onyxium_war_signet: 'Entregado a quien sobrevive intacto a la lista de leva. Cambia de manos más de lo debido.'
    onyxium_warbelt: 'Gastado en tres campañas y reabrochado para una cuarta. El cuero las recuerda todas.'
    onyxium_warblade: 'Forjado según la huella que la cresta de garras de una Sombrascua dejó en lava tibia. Ingeniería inversa brillante, o una coincidencia que nadie quiere probar dos veces.'
    onyxium_warchain: 'Cada eslabón lleva grabada una campaña. Nadie los ha contado todos.'
    onyxium_ward_ring: 'El ojo incrustado ve cosas que preferirías que no viera. Tiene opiniones sobre tus decisiones.'
    onyxium_wargreaves: 'Marcadas donde se arrodilla uno. El pantano cobra su peaje en la postura.'
    onyxium_warplate: 'Una armadura completa de acero de guerra recuperado. Ponérsela cuesta más que quitársela.'
    orb_of_purity: 'Toda madre en el Bosque Pálido advierte a sus hijos sobre el orbe que te deja empezar de nuevo. Un apretón, y renaces impoluto, inocente y absolutamente despistado. La amnesia mágica sigue siendo amnesia; solo tiene mejores modales.'
    orchid_spore_blend: 'Pétalos de orquídea molidos mezclados con esporas trituradas en un proceso que huele peor de lo que sabe el resultado.'
    origin_composite: 'Prensado con las fibras más antiguas de la montaña en algo reacio a comportarse según su edad. Sospechosamente elástico para una reliquia.'
    origin_crest_of_world_wound: 'Marcada con la línea por la que se rasgó el mundo, para que el portador nunca olvide dónde está el abajo. El abajo, aquí, es una dirección con opiniones.'
    origin_philter_of_world_wound_genesis: 'Dosificado por el Oráculo en persona, que nunca explica la medida y nunca se ha equivocado con ella. La confianza es el único ingrediente que aportas tú.'
    origin_philter_of_world_wound_scar: 'Mezclado al ritmo que llevan los Cantores de la Cicatriz, una medida por verso de su canto, por lo que ningún lote sabe igual y ninguno se hace nunca con prisa.'
    ornate_bronze_legplates: 'El cuernoduro cuyo cuerno adorna estas grebas embistió diecisiete veces antes de que el herrero captara la indirecta. La decimoctava embestida fue la última del cuernoduro y la hora más gloriosa del herrero.'
    ornate_bronze_plate: 'Grueso. Denso. Inflexible. Como el cuerno del Cuernoduro, y tu personalidad.'
    packrat_thinking_cap: 'Bolsillos extra por dentro. Nadie en el ring de exhibicion pregunta que hay en ellos.'
    padded_boots: 'Acolchado extra para cuando pisas lo que no deberías, que en este mundo es básicamente todo. Mantiene tus pies agradecidos en silencio mientras el resto de ti entra en pánico justificado.'
    padded_coif: 'Tan acolchada que amortigua golpes y pensamientos por igual. Seguirás en pie para siempre, sin saber por qué.'
    paragon_spellbook: ''
    parrot_hat: 'It is a parrot. On your head. It does not talk, which is somehow worse.'
    patchwork_trousers: 'Cosido con cualquier tela disponible. Cada pierna es de un color diferente. Moda o llamada de auxilio?'
    patience_amulet: 'El Slothian espero cien anos a un dueno digno. Tecnicamente, todavia espera.'
    patience_charm: 'Alisada por siglos de ser sostenida durante discusiones de las que nunca formo parte.'
    patience_club: 'Se desplaza despacio, como todo lo que hace un slothiano se desplaza despacio, y golpea como si el propio suelo hubiera cambiado de opinión sobre quedarse quieto. Nadie lo ha acusado jamás de tener prisa.'
    pearl_shard: 'Un fragmento de perla agrietada del interior de la concha de un cangrejo ermitaño. Vale algo para los joyeros, nada para el cangrejo.'
    pearl_shard_mace: 'Tachonada con fragmentos de perla de cangrejo. Cada golpe suena a campanillas funerarias.'
    pearl_shard_pendant: 'Una perla agrietada de una ostra que supuestamente se defendió. El recolector perdió dos dedos y ganó un sano respeto por los bivalvos. La perla brilla tenuemente bajo el agua, lo cual es hermoso y completamente inútil dado que no puedes respirar ahí.'
    pebble_pendant: "Un guijarro liso en una cuerda. El joyero lo llamo 'diseno minimalista'. Todos los demas lo llamaron piedra."
    pet_admin: ''
    pet_aloe_gaia: 'Una variante medicinal que exuda una savia calmante que trata pequeños cortes, quemaduras solares y el orgullo herido. Trata cada rasguño como una herida mortal y flota ansiosa hasta que se reconoce su preocupación. La savia sabe fatal, algo que ella considera preventivo.'
    pet_amber_cactee: 'Huele a bosques de pinos ancestrales y malas decisiones de vida. Ocasionalmente atrapa moscas en su resina.'
    pet_anorak: 'Las runas esmeralda grabadas en el caparazón de esta araña pulsan con la esencia aprisionada de Aragog, la gran araña reducida a un tamaño manejable.'
    pet_arcane_gaia: 'Un espécimen de Gaia grabado con rúnicas arcanas luminosas que laten en secuencias que ningún erudito vivo ha logrado descifrar, aunque varios han publicado traducciones rivales que van desde profundas verdades cosmológicas hasta lo que parece ser un inventario de existencias. Carga con sus fardos con la resignación digna de un ser que sospecha haber estado destinado a cosas más grandes.'
    pet_arcanite_cactee: 'Tararea una cancion de cuna en frecuencias que duermen a animales pequenos y dan migranas a los magos.'
    pet_arcanize_bricheton: 'Patrones rúnicos en su piel en secuencias identificadas como un antiguo inventario de grano — prueba de que incluso los brichetons llevan sus cuentas, aunque sus contables fueran claramente hechiceros.'
    pet_arisen_bouloute: ''
    pet_arisen_corbac: ''
    pet_arisen_lootbox: ''
    pet_arisen_modni: ''
    pet_arisen_timon: ''
    pet_barley_bricheton: 'El doble de grande que el enano del trigo y la mitad de humilde. Hoza las hileras de cebada como si tuviera la escritura.'
    pet_blood_bricheton: 'Sus ojos se tiñen de carmesí al anochecer, y muestra un interés agudo y sostenido por tu pulso. Los sanadores llaman preocupante a esa costumbre. Los nigromantes la llaman un cumplido, e insisten en que tú también deberías.'
    pet_bloodstone_cactee: 'Sus agujas siguen permanentemente carmesi. Los veterinarios se niegan a examinarlo, por principio.'
    pet_bouloute: ''
    pet_burnt_bricheton: 'Un compañero cubierto de hollín que proporciona calor en invierno y un problema de seguros persistente todo el año. Las aseguradoras han desarrollado cláusulas específicas. Siguen siendo insuficientes.'
    pet_chomperion: ''
    pet_chromafin: ''
    pet_corbac: ''
    pet_cryofin: ''
    pet_cursed_bricheton: 'El compañero definitivo del granjero, un jabalí tan imbuido de maldición agrícola que los cultivos se marchitan a su paso. Paradójicamente, las malas hierbas prosperan. El universo tiene un sentido del humor peculiar.'
    pet_cursed_gaia: 'El companero supremo de la profesion herbolaria, un Gaia tan profundamente impregnado de energia fungica maldita que murmura comentarios no solicitados sobre la distribucion de peso del inventario de su dueno en idiomas anteriores a la historia registrada. Es una bestia de carga sin par cuya lealtad es absoluta y cuyos susurros nocturnos son, segun quienes han sobrevivido a la posesion prolongada, algo que eventualmente se deja de escuchar.'
    pet_cursed_gem_cactee: 'Murmura oscuras profecias sobre el peso del inventario mientras carga lealmente tus cosas. Criatura conflictuada.'
    pet_deadmaw: 'Hades rara vez presta sus perros a los mortales, sin embargo esta bestia chamuscada ahora camina con paso fiel junto a un nuevo amo.'
    pet_diamantine_cactee: 'Un cactus que echó un diamante en vez de una flor. Tiene opiniones sobre la presión, casi ninguna solicitada.'
    pet_doris: ''
    pet_draconite_cactee: 'Irradia calor como un horno con sentimientos. Terrible para tu bolsa de cuero, maravilloso en noches frias.'
    pet_draconize_bricheton: 'Un jabali escamado que te mira como si el fuera el dragon y tu, el chiste de la reencarnacion.'
    pet_dragon_gaia: 'Imponente, iridiscente, y a un mal humor de redecorar todo el campamento.'
    pet_duskite_cactee: 'Vieja historia: una vela se apagó en la galería profunda y nunca volvió a encenderse — esto creció donde ella estuvo. Perfecta para desaparecer en plena discusión. Jamás ha ayudado a nadie a ganar una.'
    pet_ensable_crayfish: ''
    pet_gaia: 'Un brote con el espíritu justo para detestar que lo pisen. Recuerda cada bota.'
    pet_heraklion: 'El infame Señor Esqueleto Nerak crió estos sabuesos para cazar a los vivos; sus costillas huecas resuenan con un apetito que ni la muerte pudo saciar. La domesticación sigue siendo... poco aconsejable.'
    pet_ice_corgi: ''
    pet_ivory_gaia: 'Un espíritu gentil de la tierra, obligado a custodiar los tesoros del reino de quienes saquearían sin medida.'
    pet_jade_cactee: 'Notablemente sereno para un cactus andante. Medita en momentos inapropiados como durante el combate.'
    pet_jones: 'Reza para que su hambre de veneración supere a la de los dedos de su propio cuidador.'
    pet_krinan: ''
    pet_lasgalen_rabbit: ''
    pet_lootbox: ''
    pet_malt_bricheton: 'Huele permanentemente a fermentación y transporta tus bienes con el andar inestable de una criatura que descubrió la cebada en su forma más peligrosa. Es el olor del compromiso, se dice a sí mismo.'
    pet_melted_koa: 'Hallada acurrucada junto a una pira que se enfriaba. Se niega a abandonar el calor.'
    pet_modni_lyk: ''
    pet_moonstone_cactee: 'Solo visible durante lunas llenas y martes nublados. Nadie ha averiguado por que los martes.'
    pet_moray: ''
    pet_nightcap_gaia: 'Una variante nocturna de la especie Gaia que se ha adaptado a la oscuridad perpetua con un entusiasmo que roza el compromiso filosofico, cargando las posesiones de su dueno por corredores sin luz mientras irradia una desaprobacion silenciosa e integral de cada decision que llevo a este acuerdo.'
    pet_obsidianite_cactee: 'Cada espina es afilada como el cristal y va absolutamente en serio con seguir siéndolo. La vieja advertencia pintada en su caja tiene una sola línea, y esa línea es correcta: no abrazar.'
    pet_ocean_lootbox: ''
    pet_phacochere_son: 'El más enclenque de la camada, sigue a su progenitor a todas partes... excepto hacia cualquier sitio verdaderamente peligroso.'
    pet_phantom_gaia: 'La abuela juraba que su cabra atravesaba el muro de la bodega en cada luna llena y volvía oliendo a esporas. Nadie le creyó hasta que las cabras empezaron a hacerlo ellas mismas. Esta todavía prefiere el muro a la puerta.'
    pet_quartz_cactee: 'A pale little cactus whose spines set into cloudy crystal. It hums quietly near ore veins, mostly to itself.'
    pet_radient: 'Un depredador primigenio cuyo pelaje luminoso arde con la esencia capturada de la luz celestial.'
    pet_rock_koa: 'Koa de Roca: un koa que se tomó «desarrolla una piel más gruesa» como una directriz de ingeniería literal — pesa una cantidad escandalosa, se hunde como un veredicto, gana cualquier duelo de miradas por pura geología.'
    pet_siluri: 'El último de un linaje ancestral, esta criatura curtida carga con el peso de milenios sobre su caparazón gastado. La leyenda dice que aún no perdona a los mamíferos por lo de la «extinción».'
    pet_suize_bricheton: 'Sus colmillos de cristal tintinean al viento, en una melodia que cualquier otro briscocheton se toma muy a pecho.'
    pet_talokan_feu: ''
    pet_tanjirize_bricheton: 'Una bestia de pelaje cobrizo que atrae a los mercaderes de especias y repele el espacio personal a una distancia aproximada de los olfatos menos sensibles de la región.'
    pet_timon: ''
    pet_tokeko: ''
    pet_truffle_gaia: 'Una Gaia cuyo olfato se refino tanto, mas alla de lo razonable, que ahora te encuentra personalmente ofensivo.'
    pet_ukranize_bricheton: 'Criado, dicen los pastores, a partir de una bestia que una vez cargó a un pueblo hambriento durante tres inviernos sin quejarse. No se ha quejado desde entonces. Tampoco te ha dejado viajar ligero ni una sola vez.'
    pet_vainquished: ''
    pet_velkarion_wyrmling: ''
    pet_wheat_bricheton: 'Cebado con la primera cosecha y convencido de haberse ganado cada grano. Sigue el arado y juzga los surcos.'
    pet_wind_koa: 'Koa del Viento: un koa tan aerodinámico que a veces olvida quedarse — atado con una cuerda, casi siempre, y tararea cuando cae la presión solo para presumir de tener razón.'
    pet_wither_gaia: 'Allá por donde camina, las flores se disponen en algo casi demasiado hermoso para llamarlo agonía. Una bestia de carga devota, siempre que hayas hecho las paces con lo que le hace a un jardín antes de la hora del té.'
    pet_zot: ''
    phacochef_tusk: 'Un colmillo colosal desprendido del cráneo de Phacochef durante su carga telúrica. Vetas de mineral recorren el marfil, aún vibrando con fuerza sísmica.'
    phacochere_key: 'Tallada de un colmillo de jabali y sellada con barro. Huele exactamente como esperarias que oliera una llave de mazmorra porcina.'
    phantom_distillate: 'Extraído de un fuego fatuo capturado. Parpadea entrando y saliendo, igual que su origen.'
    phantom_essence: ''
    phantom_razors: 'Tan finas que apenas existen. Las víctimas solo notan el corte cuando intentan recoger algo y se dan cuenta de que tienen menos dedos. Sutiles en el extremo y absolutamente desleales.'
    phantom_spore: 'Mitad en este mundo, mitad allá donde van las esporas que prefieren no ser tocadas, se escurre entre dedos indignos como un rumor se escurre bajo una puerta cerrada. Cosecharla exige una mente vacía — un estado que casi ningún herbolario alcanza salvo por accidente.'
    piranha_amulet: 'Dientes de un pez que se come todo, incluidos los sentimientos de su propio cardumen.'
    piranha_cleaver: 'Dentado con auténticos dientes de piraña, todavía aparentemente convencido de que todo lo que tiene delante es comida. Para ser justos, hasta ahora, no se ha equivocado muy a menudo.'
    piranha_tooth: 'Pequeno, triangular, y siempre vendido de a doscientos. Una sola piraña nunca es el problema.'
    plague_fang: 'Un diente de rata dentado cubierto de algo que realmente no quieres identificar. Manipular con guantes gruesos. Más gruesos.'
    plague_fang_signet: 'El joyero que engarzó este colmillo usó guantes. Luego guantes más gruesos. Luego tenazas. El colmillo pareció tomárselo como algo personal.'
    plague_mace: 'Lleva un tenue brillo verde y un olor verde nada tenue. El herrero usó guantes. Y máscara. Y una disculpa.'
    plague_razmo_fang_blades: 'Dagas reglamentarias contra alimañas. Las ratas de los túmulos también muerden; estas muerden primero.'
    plague_treads: 'Cada huella se vuelve verde en una hora. El plaguemo lo considera una firma, no un sintoma.'
    plaguefang_blade: 'Templada en extracto sacado de un colmillo de plaga, con un filo que ha adquirido un color sobre el que los metalúrgicos tienen opiniones firmes y preocupadas. Corta de maravilla. Lo que nadie quiere comentar son los cuidados posteriores.'
    plaguemo_boots: 'El curtidor de estas pieles sobrevivio a tres plagas distintas y a un sarpullido muy incomodo.'
    plaguemo_skullcap: 'Hecha con la propia placa craneal del plaguemo, curiosamente la parte menos preocupante del proceso.'
    plainsteel: 'Sin grabados, sin dorados, sin nombre ingenioso hasta que alguien más se lo dio. El acero nunca pidió la atención.'
    pocari_sweat: ''
    polar_fortress_plate: 'Tan fuertemente blindada que la movilidad se vuelve un concepto filosófico. Pero nada la atraviesa. Nada.'
    polar_reaver_breastplate: 'Tomado de un saqueador que confundió el pantano con terreno abierto. No lo era.'
    polar_reaver_greataxe: 'El arma preferida del capitán. Nadie queda neutral una vez que golpea.'
    polar_reavers_crook: 'Antes cayado de pastor, ahora de ladrón. Las ovejas fueron las afortunadas.'
    polishing_resin: "Acabado cristalino para joyeria y metalurgia fina. Da a todo ese brillo de 'recien saqueado de un jefe'."
    pollen_mote: 'Un simple grano de polen flotante que jamas se resigna del todo a posarse.'
    practice_longsword: 'Espada de entrenamiento sin filo. Lo unico que corta es tu dignidad cuando alguien te ve usandola.'
    praetorian_oath: 'Jurada antes de que cayera el estandarte. Nadie la relevó jamás del servicio.'
    preserving_oil: 'Evita que los materiales organicos se descompongan. Los panaderos lo usan para conservar el pan. Los nigromantes lo usan para otras cosas.'
    primal_catalyst: 'Reactivo universal endgame que combina las cuatro esencias elementales. Requerido para equipo legendario de todo oficio.'
    primeval_codex: 'Encuadernado en páginas más viejas que la propia fractura, el único testimonio conocido de cómo era el cénit intacto. Los Auditores de lo Profundo llevan generaciones discutiendo el último capítulo.'
    primordial_band_of_first_dawn: 'Más viejo que el dedo al que va destinado por un margen que hace al portador sentirse, brevemente y de forma saludable, pequeño.'
    primordial_bone: 'Extraído de la capa más profunda del túmulo más antiguo. Más viejo que cualquier nombre allí registrado.'
    primordial_cleaver: 'Más antiguo que casi todas las doctrinas que sirvió para acabar. La empuñadura se mantiene cálida por razones que el profeta que lo portaba nunca explicó y que el actual dueño ha dejado de preguntar.'
    primordial_draconize: ''
    primordial_lance: 'Un arma antigua que precede a la mayoria de las civilizaciones. Aun mas afilada que el debate politico promedio.'
    primordial_legplates: 'Recuperadas tras el fracaso del cuarto asalto. El quinto las llevó de todas formas.'
    primordial_poultice_of_first_dawn: 'Rellena de un musgo que solo se abre con la primera luz, de modo que la herida de debajo sana según un horario que fija el sol, no tú.'
    primordial_tonic_of_last_ascent_genesis: 'Macerado con el musgo vivo más viejo que se ha encontrado, que rebrota en el instante en que lo arrancan y parece ligeramente molesto de que lo preparen.'
    primordial_tonic_of_last_ascent_scar: 'El brebaje barato que se vende al pie de la subida a quien crea que un frasco hará la montaña más corta. No lo hará. Alivia un poco lo que duele.'
    primordial_totem_club: 'Tallado por quien profetizaba aquí antes del desgarro que volvió la profecía mayormente redundante. El rostro del tótem se alisó de tanto acertar.'
    primordial_treads_of_first_dawn: 'Remendadas con un cuero más viejo que el oficio de remendar. Crujen un idioma, y los zapateros que lo traducirían hace mucho que se fueron todos.'
    primordial_trident: ''
    primordial_warblade_of_last_ascent: 'Reforjada tantas veces que los herreros perdieron el original bajo los remiendos. Fuera lo que fuera al principio, ahora está hecha por entero de las ganas de seguir golpeando.'
    primordial_worldpiercer: 'Lo último que fabricas antes de la puerta de nivel 100, y lo primero que la sobrevive.'
    prisma_arcane_crown: 'Forjada con las pinzas de un cangrejo que pellizco exactamente al archimago equivocado. El fantasma sigue quejandose.'
    prisma_bastion_mace: 'Entregada a quien sostuvo la línea por última vez. Fue hace mucho tiempo.'
    prisma_convergence_amulet: 'Cada eslabón es una brasa distinta de Sombrascua, enfriada y engarzada por alguien con más paciencia que juicio. Lograr que brillen al unísono exige una quietud muy particular.'
    prisma_dual_plate: 'Dos semiplacas de dos Sombras de Ceniza distintas, soldadas a la forja por una costura que aún brilla débilmente en noches frías. Ninguna de las mitades recuerda haber aceptado esto.'
    prisma_dual_sash: 'Dos pieles de Sombra de Ceniza superpuestas, cada una aislando exactamente lo que la otra no puede. La superposición se mantiene lo bastante caliente como para secar ropa.'
    prisma_elementalist_grips: 'El último calor de una Sombrascua, plegado en el cuero antes de enfriar del todo. Palmas cálidas en cualquier invierno. Apretones de manos incómodos.'
    prisma_ember_band: 'Cálido de la fragua mucho después de dejarla. El calor no lo abandona jamás, como todo aquí.'
    prisma_emberstep: 'Deja una leve quemadura en cada huella. Se desvanece antes de que a alguien se le ocurra seguirla.'
    prisma_flameguard: 'Forjada en los pozos donde el clero de las hogueras quema a los muertos. El calor no la abandona jamás.'
    prisma_flameheart_pendant: 'Llevado bajo la armadura, lo bastante cerca para sentir la pira a través de la placa.'
    prisma_flamelegs: 'Usadas lo más cerca posible de los pozos de la pira. El bajo nunca deja de humear.'
    prisma_gale_sash: 'Atada para la leva final. Los nombres leídos aquel día siguen anotados en algún lugar.'
    prisma_gale_vest: 'Llevada en el último relevo antes de que las marismas enmudecieran. Siguen en silencio.'
    prisma_hybrid_crown: 'Mitad capucha, mitad corona, del todo indecisa — la silueta de una Sombrascua tampoco se compromete nunca con una forma. La indecisión es estructural.'
    prisma_longsword: 'Garras de oso como guardamano, plumas de tormenta en el canal. Hermosa. Absolutamente indiferente a tu opinion.'
    prisma_mace: 'Tachonada de colmillos y envuelta en lana robada. Amplifica cada rencor detras del golpe.'
    prisma_sabre: 'Afilada para la manada. Sola, solo es muy filosa; prefiere compania.'
    prisma_spellbinder_sash: 'Entretejida con el mismo código de señales que los guantes. Se lee más rápido de lo que debería.'
    prisma_spellweave_gloves: 'Marcados con el viejo código de señales del clero de las hogueras. Los dedos van más rápido que la lectura.'
    prisma_stormheart: 'Mantenido cálido por quien pasó la última lista. Aún late a un pulso que nadie más oye.'
    prisma_stormlegs: 'Cortadas para la última columna que marchó la línea. No regresó.'
    prisma_tempest_ring: 'Llevado en el último relevo antes de que los puestos enmudecieran.'
    prisma_tidal_treads: 'Fundidos en los respiraderos donde una Sombrascua gustaba de calentarse los pies entre rondas. Calientes semanas después de forjarse: virtud para los herreros, queja para quien los lleva.'
    prisma_tide_signet: 'Estampado con lo que a una Sombrascua le servía de rostro antes de que el fuego terminara la remodelación. Los documentos sellados llegan oliendo a chamusquina. Nadie pregunta.'
    prisma_tidewalker_legs: 'Cortadas de una Sombrascua que se quedó quieta hasta que el suelo memorizó su forma. La agilidad se escapa por las suelas; el aguante entra a raudales. Correr deja de ser una opción.'
    prisma_windcrown: 'Entregada a quien pasó la última lista. Nadie respondió al último nombre.'
    prisma_windweave_grips: 'Usados por corredores que llevaban mensajes entre las líneas de tumbas. Ninguno de ellos dejó de correr.'
    prisma_zephyr_boots: 'Desgastadas por mensajeros cuyo paso siempre superaba el avance de la guerra.'
    prismatic_saber: 'Un núcleo de brasa late en el pomo, tomado de una Sombrascua aún tibia cuando el herrero llegó. La hoja cambia de color con el humor del portador, sin pedir permiso.'
    pristine_malt: ''
    pyre_ash: 'Un recogedor de suelo de catedral: ceniza, brillo de vidrio, y un pendiente perdido por palada.'
    pyre_chain_girdle: 'Eslabones tibios en reposo, ardientes en combate. Te sujeta el pantalón y mantiene alerta al enemigo.'
    pyre_channeler_staff: 'Portado por los sacerdotes de la pira. La ceniza nunca termina de asentarse a su alrededor.'
    pyre_cleaver: 'El corazon de ceniza incrustado en el pomo mantiene el filo caliente. Genial para el combate. Terrible para las fundas.'
    pyre_crown_fragment: 'Una pieza del ornamento de cabeza del Tirano de Ceniza. Irradia autoridad y calor extremo. Los seguidores se forman involuntariamente cerca.'
    pyre_handler_mitts: 'Cosidas para el horno que cuece el vidrio del coro. Sujeta lo que sea. No te arrepientas de nada.'
    pyre_walkers: 'Suela gruesa para cruzar un lecho de brasas a paso normal. Normal, para este puesto.'
    pyrecleaver: 'Técnicamente para leña. Los feligreses pasan a su lado con una educación exquisita.'
    pyreguard_cuirass: 'Usada por quienes permanecían más cerca de la hoguera. Chamuscada, nunca traspasada por el fuego.'
    pyrehymn_cuirass: 'Cocida, no forjada. Salió del horno ya harta de tus problemas.'
    pyrehymn_draught_of_cooling_vent: 'Embotellada del vapor de un respiradero que se enfría. Sabe a minerales y a leve arrepentimiento. Reanima igual.'
    pyrehymn_gauntlets_of_ashen_song: 'Paños de cocina bien ceñidos a la muñeca. En alguna parte, un cajón los echa terriblemente de menos.'
    pyrehymn_girdle: 'Una banda de cuero chamuscado que corta un incendio a la cintura. Ha cortado varios. Se nota.'
    pyrehymn_greaves_of_cooling_vent_choir: 'Fundidas de la escoria enfriada, defectos incluidos. Los defectos ahora aguantan carga, así que déjalos.'
    pyrehymn_greaves_of_cooling_vent_pyre: 'Ranuradas para expulsar el calor hacia abajo, así tus botas cargan con lo peor y callan.'
    pyreward_diadem: 'Cálido en la frente a toda hora. El día que se enfríe, corre tú también.'
    quartz: 'Un cristal turbio que vibra a frecuencias que solo los alquimistas pretenciosos dicen entender.'
    quartz_choker: 'Piedra de cuarzo pulida en un marco de alambre. Vibra suavemente cerca de la magia. O cuando hay viento.'
    quartz_powder: 'Cuarzo molido mezclado con polvo de diamante. Estornudar cerca esta fuertemente desaconsejado.'
    quickbite: 'Tres golpes en el tiempo que toma notar el primero. La fauna de la Cicatriz ha dejado de esperar para comprobarlo.'
    quickstep_sash: 'Más decorativa que defensiva. Pero luce fantástica mientras esquivas.'
    quillbound_cord: 'Resiste el escrutinio, apenas, una afirmación que nunca ha sido puesta a prueba.'
    quillweave_grips: 'Funciona adecuadamente, según su propia admisión, algo que quien lo porta decidió aceptar por fe.'
    ramrage_sash: 'Tejida con lana de carnerofuria. Casi indestructible. El olor, en cambio, es eterno.'
    ramrage_waraxe: 'Equilibrada con un contrapeso de cuerno de ramrage. El equilibrio es relativo cuando el hacha pesa veinte kilos.'
    ramrage_warhelm: 'Decorado con cuernos de carnero furioso. Las puertas se vuelven una prueba real de la paciencia del publico.'
    rangers_longbow: 'Arco largo de los exploradores, pulido por años de servicio en los bosques oscuros. Cada arañazo en la madera da testimonio de una flecha lanzada en la oscuridad sin certeza de haber alcanzado el objetivo. Algunos de esos disparos salvaron vidas. Otros simplemente asustaron ciervos. Ambos cuentan en los archivos del regimiento.'
    raptor_bone_bow: 'Tallado en las propias costillas de un raptor, que aún conservan la forma de su última carga furiosa. Cada flecha abandona la cuerda rápida, furiosa, y absolutamente indiferente a tu opinión al respecto.'
    raptor_claw: 'Curvada, afilada como navaja, y aún caliente. Los herreros las forjan en dagas. El raptor la usaba como abrelatas.'
    raptor_hide_boots: 'Los raptores son la forma que tiene la naturaleza de recordarte que todo en la cadena alimentaria es el calzado de otro. Estas aún se estremecen cuando huelen una presa.'
    raptor_javelin: 'Puntiaguda con una garra de raptor que ha visto mejores días. Y peores presas.'
    raptor_scale_greaves: 'El raptor donante protesto a unos sesenta kilometros por hora. No logro alcanzarlas de vuelta.'
    rat_bile: 'Extraída de la glándula de rencor de la rata. Los científicos insisten en que esta glándula no existe. Las ratas discrepan.'
    rat_trousers: 'Una prenda de retales confeccionada con pieles de roedores, cada costura cuenta la historia de una lucha desesperada bajo las calles de la ciudad. Llevarla es prueba de que la dignidad es la primera víctima de la pobreza.'
    raven_beak: 'Duro como el hierro y afilado como la malicia. Los armeros los adjuntan a mayales. El cuervo tenía otros planes para él.'
    raven_coif: 'El arqueopterix que muto estas plumas dejo, en esencia, una promesa de venganza futura.'
    raven_eye_pendant: 'Sellado en ambar y cobre, otorga la paciencia de un halcon y el juicio de un buitre.'
    raven_flight_bow: 'Emplumada con plumas mudadas en pleno picado. Las flechas aun recuerdan hacia donde es abajo.'
    raven_grips: 'Forradas en piel de feran y con garras a juego. Los feranes no han perdonado al sastre.'
    raven_hauberk: 'Pieles de feran: eticamente dudosas, estructuralmente intachables, y lavables a maquina, segun dicen, aunque nadie lo probo.'
    raven_trousers: 'Pelaje abajo, forro de plumon arriba. Perturbador frente al espejo, extranamente perfecto en movimiento.'
    rawhide_belt: 'Cuero sin curtir que huele vagamente a angustia existencial y animal mojado. Primer proyecto real de un curtidor.'
    razendril: 'Un colmillo de rata, meticulosamente tallado en una hoja de elegancia y letalidad sorprendentes.'
    razlord_trophy_belt: 'Colgado de recuerdos tomados de cosas que ya no los necesitaban. Más pesado cada temporada.'
    razmaster_grudge: 'Tomado de una rata de túmulo que claramente mordió primero.'
    razmaster_longsword: 'El Razmaster resuelve todas las disputas de la misma forma. Esta hoja es el argumento final.'
    razmo_bone_pike: 'Tallada de un femur de razmo. Las marcas de dientes son una caracteristica.'
    razmo_pelt: 'Una piel de rata desaliñada. Los curtidores las aceptan pero te juzgarán absolutamente por ello.'
    razmoket: 'La cola cercenada de una rata de alcantarilla común, aún con rastros de la inmundicia que arrastró por túneles lúgubres.'
    razord_fangblade: 'Forjada alrededor de un colmillo que resistio todo intento de fundirlo. Los herreros terminaron construyendo en torno a el.'
    razord_skullcap: 'Plumas de razord forran el interior, y las opiniones de quien lo lleva se afilan notablemente.'
    razorfang: 'Talladas con los colmillos descomunales de las alimañas de las alcantarillas, estas hojas irregulares portan la maldición de la pestilencia.'
    reaver_visage: 'Visera de saqueador forjada para inspirar terror más que protección. Logra ambas cosas, pero en proporciones diferentes según el lado de la máscara en que uno se encuentre. El lado exterior inspira pánico. El lado interior inspira una leve claustrofobia y una meditación involuntaria.'
    recurve_practice_bow: 'Arco recurvo utilizado en las salas de entrenamiento. Perdona los errores de postura mejor que la mayoría de los arcos, lo que los instructores lamentan, pues los errores perdonados tienden a persistir. El propio arco no se queja. Sus resultados hablan en silencio.'
    red_gaia: 'Teñida por la arcilla ferrosa del cañón y calladamente orgullosa. Llora una savia roja que los herboristas fingen intencionada.'
    red_orchid: 'Esta orquídea carmesí conserva su vivo color incluso tras una larga cocción, sus pétalos tan gruesos como cuero curado.'
    refined_solution: 'Un medio alquímico purificado que jamás se oxida, por pura terquedad.'
    reforged_ember: 'Azufre raspado, rojo caramelo y ansioso. Un solo roce, sin devoluciones.'
    regalfall_breastplate_of_empty_seats: 'Funciona, técnicamente, en la mayoría de las condiciones, lo cual es tan tranquilizador como suena.'
    regalfall_grips_of_empty_seats: 'Funciona, provisionalmente, a la espera de más revisión, una pequeña gracia, considerando la alternativa.'
    regalfall_legguards_of_silent_court: 'Su garantía se anula en cuanto lo cuestionas, un detalle que todos los implicados acordaron olvidar.'
    regalfall_tonic_of_silent_court: 'Su efecto aparece, o no, de forma impredecible, así que se bebe bajo su propio riesgo, formalmente hablando.'
    regalfall_warbelt_of_silent_court: 'Las instrucciones se perdieron en un debate acalorado, así que la disputa original se declaró en tablas.'
    regent_ore: 'Dos informes distintos lo describen en términos contradictorios, algo que cambia según la temporada y quién pregunte.'
    regent_spellbook: ''
    reinforced_mitts: 'Tachuelas metalicas en los nudillos anaden proteccion y estetica amenazante. Los apretones de mano son un comunicado.'
    relic_aragog: 'La Madre de las Arañas soltó este colmillo voluntariamente — y por voluntariamente queremos decir que alguien se lo arrancó mientras digería a un aventurero particularmente grande. Todavía gotea veneno que hace que tus enemigos reconsideren sus decisiones de vida.'
    relic_chairman: ''
    relic_dragon_fire: 'El dragón murió hace siglos. Nadie avisó a la calefacción central. En algún lugar bajo la nave sigue ardiendo puntualmente, y los radiadores golpean dos veces antes de cada oficio.'
    relic_dragon_frost: 'Una única lágrima cristalizada derramada por un dragón de escarcha durante lo que los testigos describen como un desacuerdo emocional con un glaciar. Nunca se derrite, nunca se calienta, y se sabe que enfría las bebidas incómodamente desde el otro lado de la habitación. Los alquimistas han intentado estudiarla, pero sus instrumentos siguen congelándose.'
    relic_dragon_void: 'Arrancada de un dragón que llevaba tanto tiempo consumiendo energía del vacío que olvidó a qué sabía la luz del sol. La mandíbula vibra con una frecuencia que hace que los muebles se reorganicen solos y provoca que cualquiera cercano recuerde de repente cada cosa vergonzosa que haya hecho. Los guerreros que la portan reportan sentirse significativamente más fuertes, aunque también significativamente más existencialmente perturbados.'
    relic_duke: ''
    relic_ensable: 'Corre hacia atras mas seguido que hacia adelante. No trae garantia, ni expresa ni implicita.'
    relic_fenrik: ''
    relic_gobeline: 'Los goblins veneran este artefacto con el mismo fervor que aplican a no ser devorados, lo que significa: desesperadamente y sin dignidad.'
    relic_guardian: ''
    relic_koa: ''
    relic_kraken: 'Arrancado de un leviatán tan antiguo que recuerda cuando el mar era de otro color.'
    relic_magmalug: ''
    relic_nerak: 'Se dice que fue tallada de la propia columna de Nerak por un mercader de huesos que se desmoronó en polvo a media frase — la reseña más convincente que la corte haya recibido jamás, según ellos. Póntela y el viento empieza a contarte cosas. Mejor no responderle.'
    relic_pale_weaver: ''
    relic_past: 'Un eco de una era olvidada. Este artefacto fue forjado en su día en el crisol de la creación, pero su artífice se ha desvanecido desde entonces de todos los reinos conocidos. Solo queda un leve zumbido de poder ancestral — un susurro de lo que fue.'
    relic_phacochef: 'Arrancado de las fauces de un jabalí tan terco que una vez embistió una montaña y ganó. El hedor por sí solo otorga a su portador una resistencia sobrenatural — o quizás todos simplemente se mantienen lejos.'
    relic_ramrage: ''
    relic_razmo: ''
    relic_rex: ''
    relic_rrexn: 'Las notas del artesano son solo ideas tachadas, y aun así, eso sigue considerándose un éxito.'
    relic_seraph: ''
    relic_wanilla: ''
    reset_spells_scroll: 'Contiene conocimiento prohibido tan devastador que tu cerebro optó por la violencia y borró tu sistema operativo entero. Al menos por fin olvidarás aquello tan vergonzoso que dijiste en la taberna.'
    resonance_band: 'Suena sola cuando la nota justa resuena cerca. Aviso útil, salvo que la nota sea tu propio funeral.'
    resonant_pike: 'El cepillo se gastó hace tres siglos. El palo se niega a jubilarse.'
    rex_bone_cuisses: 'Protectores de muslo reforzados con placas de hueso de rex. Caminar es ejercicio. Correr es aspiracional.'
    rex_bone_signet: 'Un anillo de sello tallado en hueso de Rex. Portarlo es declarar al mundo que uno se enfrentó a una criatura que podría tragarte entero — o al menos que uno estuvo suficientemente cerca del cadáver para recoger un trozo.'
    rex_fang: 'Un diente más largo que tu antebrazo. El rex que lo creció era muy grande y muy enojado. En ese orden.'
    rex_fang_claymore: 'Un rex alfa dono su colmillo mas grande. Involuntariamente.'
    rex_hunter_longbow: 'Diseñado especificamente para cazar rex. Los cazadores que lo probaron nunca fueron vistos de nuevo, pero el arco volvio.'
    rex_jawbone_cleaver: 'Un cuchillo hecho de una mandibula de rex alfa. Los dientes en el filo son originales.'
    rex_jawbone_talisman: 'Un talismán tallado en el hueso de la mandíbula de un Rex. Los portadores reportan un aumento de la confianza y una disminución de las visitas a tabernas — porque dentro tampoco nadie se atreve a molestarles.'
    rex_knuckle_guards: 'Reforzados con fragmentos de colmillo de rex en los nudillos. Dar puñetazos ahora cuenta como prehistórico.'
    rex_ribcage_plate: 'Una placa de torso moldeada a partir de una costilla de Rex. El hueso era suficientemente ancho para cubrir a un hombre entero, lo que dice mucho del tamaño de la bestia y poco halagador sobre el tamaño del hombre.'
    rex_scale_breastplate: 'Arrancada escama a escama de algo que dominaba la cadena alimenticia y lo sabia.'
    rex_sinew_belt: 'Un cinturón trenzado con tendones de Rex. No se rompe — al menos no antes de que usted lo haga. Es una promesa de resistencia que pocos cinturones se atreven a hacer y menos aún pueden cumplir.'
    rex_stompers: 'Reforzadas con hueso de rex. Cada paso suena como un pequeño terremoto. La discreción nunca formó parte del plan.'
    rex_tooth_talisman: 'Da valor, segun dicen. Sobre todo da un torticolis permanente.'
    rift_torn_band_of_split_sky: 'Engastado con una esquirla del caparazón mudado de un Rifling, aún tibio de una muda terminada hace semanas. Atrapa la luz de forma incorrecta, a propósito, igual que la criatura que lo hizo crecer.'
    rift_torn_breastplate_of_split_sky: 'Desvía el vendaval, casi todas las hojas y absolutamente nada del vértigo existencial.'
    rift_torn_crusher_of_torn_ground: 'Guarda rencor como el caparazón de un Rifling guarda una grieta: lentamente, luego de golpe, luego para siempre. Se recomiendan los golpes cuesta abajo. Los golpes cuesta arriba también son técnicamente posibles.'
    rift_torn_extract: 'Rezuma en gotas lentas del suelo desgarrado. Recógelo con paciencia o nada.'
    rift_torn_grips_of_torn_ground: 'Cuando el suelo deja de ser fiable, aprendes a aferrarte. Estos se aferran también.'
    rift_torn_legguards_of_torn_ground: 'Recuperadas de una muda de Rifling que nunca terminó de endurecer. Se doblan en ángulos que una rodilla no debería, y ese es el punto: el suelo aquí no se queda plano el tiempo suficiente para discutirlo.'
    rift_torn_tonic_of_torn_ground_faultline: 'Un golpe de vigor que llega como el suelo subiendo a tu encuentro, cosa que también puede pasar.'
    rift_torn_tonic_of_torn_ground_void: 'Las Polillas del Vacío forran sus madrigueras con algo que no es del todo polvo ni del todo luz. Destilada, llena el estómago y vacía la cabeza, en ese orden.'
    rift_torn_twin_knives_of_torn_ground: 'Dos hojas nacidas de la misma muda de Rifling, aún discutiendo cuál es la original. El hueco entre ellas es exactamente el punto donde el plan de un oponente deja de encajar.'
    riftsteel: 'Forjado en la costura donde dos mundos se muelen. Recuerda la presión y guarda rencor.'
    riftsunder_blade: 'El primer golpe es educado. Son los cuatro siguientes los que tus costillas querrán discutir.'
    riftsunder_cleaver: 'Divide todo lo que golpea en un «antes» y un «después» limpios, igual que el Rifling que le da nombre se separó de su propia línea de muda. Un «después» rara vez forma parte del resultado.'
    riftsunder_cuirass_of_widening_crack: 'Hay una costura al frente que crece un cabello cada temporada, siguiendo la misma grieta que partió al Rifling del que proviene. Nadie se lo ha dicho aún a quien la lleva. Alguien debería.'
    riftsunder_draught: 'Extraída del hueco de un hueso de Rifling, hueco porque el Rifling, en sentido estructural, no ha terminado de existir del todo. Una dosis compra una decisión clara.'
    riftsunder_extract: 'Sacado tan hondo en la falla como alcancen una cuerda y un idiota valiente.'
    riftsunder_fangs: 'Heridas pequeñas. Muchas. El sangrado se encarga de negociar.'
    riftsunder_helm_of_last_tremor: 'El último temblor que provocó un Rifling en particular dejó un zumbido en este yelmo-caparazón que no se ha desvanecido desde entonces. Sobrevive al oído. Después, presumiblemente, te sobrevive a ti.'
    riftsunder_lattice: 'Una onda de piedra congelada a medio derrumbe. Parece temporal. Lo parece desde hace siglos.'
    riftsunder_ration: 'Horneado con la receta que seguía una compañía de Soldados Quebrados mientras la compañía aún estaba completa. Bastante denso para servir de arma. Alguien lo usó así.'
    riftsunder_ration_of_last_tremor: 'Aquello que come un Rifling entre mudas, secado y prensado en barras. Dura años. Sabe al interior de un cajón muy viejo.'
    ring_of_the_worldeater: 'Arrancado de un engaste demasiado grande para un dedo y llevado igual, colgado de una cadena. El Devoramundos se comió siete mundos sin que a nadie se le ocurriera comprobar si solo tenía hambre. La comprobación sigue pendiente.'
    ringfast: 'No se quita. Se le explicó esto con claridad a cada comprador antes de la venta. La mayoría lo compra de todos modos.'
    riven_casque: 'Vendido con descuento por faltarle el tercio izquierdo. Coloca a tus enemigos en consecuencia.'
    riven_charm: 'Agrietado limpiamente a lo largo de la misma línea donde se agrieta el caparazón de un Rifling en su primera muda, y considerado igual de afortunado por ello. La lógica no viaja bien fuera de este mundo. Aquí, es dogma.'
    riven_chausses_of_long_collapse: 'Las piernas a medio mudar de un Rifling atrapado en pleno colapso, aún dobladas en el ángulo de la caída que lo terminó. Quienes las llevan reportan que la misma rodilla falla, puntualmente, para siempre.'
    riven_longsword_of_long_collapse: 'Aquí la gravedad es una sugerencia, así que un tajo tarda una semana en llegar. Lleva merienda.'
    riven_saber_of_screaming_rift: 'Cortado de la propia hoja-miembro seccionada de un Rifling, aún gimiendo débilmente a la frecuencia de la grieta de la que proviene. Los forenses describen el sonido que hace al impactar como «poco útil».'
    roadworn: 'Recorrió el camino de los peregrinos tantas veces que el cuero olvidó haber sido nuevo. Recuerda cada milla desde entonces.'
    root_cellar_key: 'Repiquetea con una corriente fría que ninguna bodega debería producir. Las Fauces del Sótano acuñó un centenar de estas; nunca ha necesitado una cerradura.'
    roothold_treads: 'No te moverán de aquí. No porque no puedas. Porque no quieres.'
    rotted_flesh: 'Pelar un zombi es fácil. El olor persiste durante semanas. Los miembros de tu grupo recordarán esta traición.'
    rough_mitts: 'Mitones de cuero grueso que sacrifican destreza por calor. Agarrar una espada ahora es deporte de equipo.'
