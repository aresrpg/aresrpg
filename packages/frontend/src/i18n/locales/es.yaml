  job_desc:
    FARMER: Los granjeros cosechan cereales en los campos del mundo. Los niveles superiores desbloquean cultivos mas raros.
    HERBALIST: Los herbolarios recolectan plantas y flores para alquimia. Cada nivel requiere un nivel de oficio mas alto.
    MINER: Los mineros extraen minerales de depositos rocosos. Los metales raros se desbloquean con la progresion.
    SWORD_SMITH: Los herreros de espadas forjan espadas largas, espadas y dagas. Combina minerales y aleaciones para armas cortantes.
    AXE_SMITH: Los herreros de hachas fabrican hachas y hachas de batalla. Armas devastadoras de metales refinados.
    BLUNT_SMITH: Los herreros de mazas crean mazas y garrotes. Armas contundentes para guerreros de primera linea.
    STAFF_CARVER: Los talladores de bastones moldean bastones y grimorios. Herramientas esenciales para lanzadores de hechizos.
    BOWYER: Los arqueros fabrican arcos y lanzas. Armas de precision para luchadores agiles.
    ARMORSMITH: Los armeros forjan cascos y petos. Armadura pesada para maxima proteccion fisica.
    TAILOR: Los sastres cosen pantalones y botas. Piezas de armadura ligera para agilidad y movilidad.
    TANNER: Los curtidores fabrican cinturones y guanteletes. Accesorios versatiles con estadisticas equilibradas.
    JEWELER: Los joyeros crean amuletos y anillos. Accesorios con poderosas bonificaciones magicas.
    ALCHEMIST: Los alquimistas preparan pociones con hierbas recolectadas. Consumibles de curacion y mejora en combate.
    BAKER: Los panaderos preparan panes y comida con cereales cosechados. Consumibles que restauran salud.
    HANDYMAN: Los manitas fabrican llaves, herramientas y objetos utilitarios. Esenciales para mazmorras y actividades especiales.
