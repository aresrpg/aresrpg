    weapon_longsword: Espada larga
    weapon_daggers: Dagas
    weapon_battleaxe: Hacha de guerra
    weapon_spear: Lanza
    weapon_staff: Bastón
    weapon_spellbook: Grimorio
    weapon_bow: Arco
    weapon_axe: Hacha
    weapon_mace: Maza
    weapon_club: Garrote
    weapon_sword: Espada
    marketplace: MERCADO
    marketplace_desc: El equipo y los personajes se listan en el kiosco al precio que elijas; los compradores pagan al instante. Los recursos se intercambian por SUI en pools de swap en su lugar, sin anuncios. Cada venta paga una regalía del 10% — el mercado es la única forma de vender.
    section_forgemagie: FORGEMAGIA
    forgemagie_desc: La forgemagia es el sistema de runas. Tritura equipamiento para obtener runas, luego aplícalas en otro equipo para modificar sus estadísticas. Un sistema de alto riesgo y alta recompensa para perfeccionar el equipamiento.
    crushing: TRITURADO
    crushing_desc: 'Cada línea de stat del objeto triturado se evalúa independientemente — stats más altas y pesos más pesados producen más runas. No hay servidor: el divisor de rendimiento combina una curva fija por nivel de objeto con el taux propio de la plantilla del objeto, un coeficiente de inflación on-chain compartido (1%-4000%) que el propio triturado baja para esa plantilla y sube para sus vecinas.'
    crushing_tiers_desc: El nivel de runa (Ba/Pa/Ra) se selecciona probabilísticamente. Stats más altas favorecen runas Ra.
    rune_tiers: NIVELES DE RUNAS
    rune_ba: 'Tier 1: menor peso por runa'
    rune_pa: 'Tier 2: peso medio por runa'
    rune_ra: 'Tier 3: mayor peso por runa, doble XP'
    rune_weight_desc: Cada runa tiene un peso igual a su valor multiplicado por el peso unitario de la stat. El peso se calcula automáticamente.
    rune_table_stat: STAT
    rune_table_note: Las runas de Alcance, Movimiento y Acción se aplican una sola vez cada una; Probabilidad Crítica hasta 10 veces. Crítico y Resultados Críticos no tienen runa alguna.
    rune_stat_range: Alcance
    rune_stat_movement: Movimiento
    rune_stat_action: Acción
    rune_stat_raw_damage: Daño bruto
    rune_stat_critical_chance: Probabilidad crítica
    rune_stat_earth_resist: Resistencia tierra
    rune_stat_fire_resist: Resistencia fuego
    rune_stat_water_resist: Resistencia agua
    rune_stat_air_resist: Resistencia aire
    stat_unit_weights: PESOS UNITARIOS DE STATS
    stat_unit_weights_desc: Cada stat tiene un peso unitario que refleja su poder en combate. Los items con líneas de stats pesadas generan más runas al triturar, consumen más presupuesto y son más difíciles de sobre-forjar.
    rune_application: APLICACIÓN DE RUNAS
    rune_application_desc: 'Se desbloquea en el nivel 70 de CUALQUIER oficio — recolección o artesanía, el que hayas subido primero. Aplica runas al equipamiento, una a la vez, para modificar sus stats. Tres resultados posibles:'
    outcome_critical_success: Éxito Crítico
    outcome_critical_success_desc: La runa pasa, sin pérdida de stats
    outcome_neutral: Éxito Neutro
    outcome_neutral_desc: La runa pasa, otras stats pueden bajar
    outcome_critical_failure: Fallo Crítico
    outcome_critical_failure_desc: La runa falla, stats perdidas igual al peso de la runa
    success_rate: TASA DE ÉXITO
    success_rate_desc: 'El éxito depende de cuán cerca está la stat de su máximo: cerca del 0% es ~99% de éxito, cerca del máximo es ~50%, y las stats exóticas se quedan en ~1% sin importar el nivel. Que un éxito sea Crítico (sin pérdida) o Neutral (peso pagado) varía de la misma forma, más un pequeño +0,2% por nivel de oficio por encima de 1. No hay límite en qué nivel de objeto puede trabajar tu oficio.'
    puits: POZO (PUITS)
    puits_desc: Un contador de peso, visible en la interfaz, que se acumula cuando las pérdidas de stats superan el peso de la runa. Absorbe pérdidas futuras antes de que otras stats se vean afectadas. Se reinicia cuando el objeto deja el banco de forgemagia.
    over_maging: SOBRE-FORJA
    over_maging_desc: Lleva las stats por encima de su máximo natural. Cada línea de stat tiene un tope de 101 de peso extra. El máximo de sobre-forja depende del peso unitario de la stat — una stat ligera como la Vitalidad (peso 0,2) puede empujarse ~505 puntos de más, una pesada como la Sabiduría (peso 3) solo ~33.
    forgemagie_tips: CONSEJOS
    forgemagie_tips_desc: 'Para exótico/over-mage: quita primero las stats baratas para acumular un gran pozo, luego pasa la stat difícil con el colchón, después vuelve a añadir las stats perdidas (fácil ya que están lejos del máximo). No muevas el objeto durante una sesión. El pozo se reinicia. Las stats exóticas y over-mageadas se pierden primero en caso de fallo.'
    forgemagie_xp: EXPERIENCIA
    forgemagie_xp_desc: 'La XP solo se otorga en éxito (Crítico o Neutral). Los objetos de mayor nivel y las runas más pesadas dan significativamente más XP. Las runas Ra otorgan el doble de XP comparado con las runas Ba y Pa. Fórmula: max(1, pesoRuna × (1 + nivelObjeto / 50) × multiplicadorTier) donde el multiplicador es 2 para Ra, 1 en otro caso.'
    action_points: PUNTOS DE ACCIÓN (PA)
    movement_points: PUNTOS DE MOVIMIENTO (PM)
    critical_stat: CRÍTICO
    wisdom_xp: BONO DE XP DE SABIDURÍA
    wisdom_xp_desc: La Sabiduría aumenta toda la XP que ganas. Con 600 de Sabiduría ganas el doble de XP, con rendimientos decrecientes por encima.
    chance_loot: SUERTE Y BOTÍN
    chance_loot_desc: Tu stat de Suerte aumenta la probabilidad de drop de cada botín. Con 700 de Suerte cada probabilidad se duplica. Una probabilidad de drop nunca puede superar lo garantizado.
