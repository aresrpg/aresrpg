wallet_legacy:
  sui: SUI
  how_to_get: Como obtener SUI
  your_address: Tu Direccion de Billetera
  send_sui: Envia SUI a esta direccion. Haz clic para copiar.
  buy_directly: Comprar Directamente
  buy_with_card: Compra SUI con tarjeta de credito. Se deposita directo en tu billetera.
  buy_on_exchange: Comprar en un Exchange
  withdraw_to_wallet: Compra SUI en un exchange y retiralo a la direccion de tu billetera
    mostrada arriba.
  faq: FAQ
  wallet_description: Tu billetera personal. Solo tu puedes acceder. Deposita SUI
    para usarlo en la tienda.
  moonpay_desc: Tarjeta de credito, Apple Pay, transferencia bancaria
  transak_desc: Tarjeta de credito, transferencia bancaria, 100+ paises
  faq_what_is_sui: Que es SUI?
  faq_what_is_sui_answer: SUI es una moneda digital, como dinero electronico. Vive
    en una red rapida y segura llamada blockchain Sui. Usas pequenias cantidades de
    SUI para comprar objetos en la tienda de AresRPG. Piensa en ello como creditos
    de juego, excepto que nadie puede quitartelos.
  faq_why_sui: Por que AresRPG usa SUI?
  faq_why_sui_answer: SUI es nuestro metodo de pago preferido. Las transacciones son
    instantaneas (menos de 1 segundo) y cuestan fracciones de centavo. Sin intermediarios.
    Podriamos soportar monedas tradicionales (USD, EUR, etc.) en el futuro, pero eso
    requiere un trabajo legal significativo y conlleva tarifas e impuestos elevados
    que aun no estamos listos para asumir.
  faq_legal: Es legal?
  faq_legal_answer: Si. Comprar y poseer criptomonedas es legal en la mayoria de paises.
    SUI es un activo digital legitimo que se comercia en las principales plataformas
    reguladas del mundo. Simplemente lo usas como metodo de pago en nuestra tienda.
    Sin NFT, sin esquemas crypto.
  faq_eula: Esta permitido por los terminos del juego?
  faq_eula_answer: Si. Mientras las criptomonedas se usen unicamente como metodo de
    pago y no involucren NFT ni esquemas especulativos, es totalmente conforme. Muchas
    grandes tiendas de juegos incluso aceptan pagos con crypto.
  faq_access: Quien puede acceder a mi billetera?
  faq_access_answer: 'Solo tu. Tu billetera se crea a partir de tu login de Google
    usando la tecnologia zkLogin de Sui. Nadie (ni siquiera el equipo de AresRPG)
    puede acceder a tus fondos o moverlos. Importante: esta billetera es solo para
    compras en la tienda. No almacenes grandes cantidades aqui. Deposita solo lo que
    planeas gastar.'
  faq_balance: Envie SUI pero mi saldo no se actualizo?
  faq_balance_answer: Tranquilo. Nuestro sistema de actualizacion puede estar temporalmente
    lento. Verifica que enviaste SUI a la direccion correcta (copiala de arriba),
    y si aun no aparece, contacta al equipo en Discord con tu ID de transaccion.
