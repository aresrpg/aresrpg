    rune_wisdom_ra: ''
    runic_blade: 'Runas recorren toda la hoja, y no hay dos eruditos que coincidan en lo que dicen. El encantador insiste en que es un dialecto antiguo. El herrero insiste en que es solo una decoración cuyo aspecto le gustaba. A la hoja, nadie le preguntó.'
    runic_grimoire: 'La mitad de sus páginas contiene hechizos de verdad. La otra mitad, quejas sobre los magos que no dejaban de equivocarse, garabateadas al margen por una mano que nadie en el culto admite reconocer.'
    runic_ink: 'Tinta bioluminiscente que retiene carga magica. Usada por manitas para inscribir runas funcionales en equipo y mobiliario.'
    runic_warden_blade: 'Las runas kweebec brillan mas tenues al alba, igual que antano la lanza ceremonial de la que proviene.'
    rustshore_cutlass: 'Una hoja de marino que ha visto muchas mas trifulcas de taberna que batallas navales.'
    rusty_daggers: 'El tetanos es una caracteristica no un defecto. Cada golpe incluye riesgo de infeccion gratis.'
    sabertooth_axe: 'El colmillo es la hoja. El mango solo esta ahi como apoyo moral.'
    sabertooth_fang: 'Mas largo que una daga. Mas filoso que la mayoria de las replicas. El felino ya no lo necesitaba.'
    salve_biscuit: 'Mitad pan, mitad vendaje. Los alquimistas lo desmenuzan en pasta curativa. Sabe a medicina, funciona como un milagro.'
    sandwraith_legplates: "Placas blancas como hueso que se materializaron en una tumba del desierto junto a una nota que decía 'TÓMALAS Y VETE.' Nadie sabe quién dejó la nota. Nadie quiere averiguarlo. La arena que cae perpetuamente de las juntas no es de ningún desierto conocido, y barrerla es inútil — reaparece por la mañana."
    sandwraith_reaper: 'Desenterrada a medias de las dunas. A su anterior dueño lo hallaron bastante más enterrado.'
    sapling_bark: 'Pelada de un retoño kweebec. Se reformó en paneles de grado armadura por sí sola. Incluso muerta, esta madera tiene ambición.'
    sapling_bark_boots: 'La madera sigue tecnicamente viva, y tecnicamente sigue furiosa por el arreglo.'
    sapling_channeler: 'Tallado de un retoño que aún no había decidido qué quería ser. Los kweebecs consideran todo el bastón una toma de rehenes. Tú lo consideras un arma. Nadie tiene del todo la razón.'
    sash_of_the_void_emperor: 'La Polilla del Vacío más grande registrada llevaba esto en su muda final y nunca volvió a salir. Lo que la reemplazó en ese caparazón aún no ha sido catalogado, y los catalogadores no tienen prisa.'
    saurian_bow: 'Tensado lo suficiente para derribar algo que, hasta hace poco, te estaba cazando activamente.'
    saurian_fang: 'Agarre suficiente para sostener una comida que forcejea. Mordida suficiente para acabarlo.'
    saurian_gauntlets: 'Nudillos escamosos, con olor a fogata incluido. El dueno anterior NO consintio el reciclaje.'
    saurian_greataxe: ''
    saurian_ripper: 'Tallada en un hueso aun lo bastante tibio para poner nerviosos a los herreros.'
    saurian_scale: 'Gruesa, iridiscente, y lleva humedad tenue. Los armeros las tejen en placas acuáticas. Limpieza en seco no recomendada.'
    saurian_scale_helm: 'Los viejos reyes lagarto nunca entendieron por qué los más pequeños se molestaban con cascos — su propio cráneo bastaba para atravesar un muro. Suponían que quien llevaba uno solo estaba presumiendo. El cuento admite que no andaban del todo equivocados.'
    saurian_staff: ''
    saurian_throwing_spear: 'Equilibrada mas por instinto de serpiente de deriva que por oficio. Lanzada una vez, corrige su propio rumbo.'
    saurian_war_axe: ''
    saurian_war_harness: 'Recortado de un arnés hecho para un saurio tres tallas mayor que cualquier portador desde entonces, con el armero rezongando todo el tiempo sobre oficio y dignidad. Todavía conserva un vago aire de territorio que nadie se ha atrevido a reclamar.'
    saurian_war_horn: 'Tallado en una garganta que no respira hace diez mil anos. Sigue sonando demasiado fuerte a las 3 a.m.'
    saurian_waraxe: 'Tallada según el ángulo que preferían los reyes de piedra antes de dormirse bajo las profundidades; dicen que recuerda mejor las viejas afrentas que las nuevas. Tiene opiniones muy firmes sobre los cráneos. Nadie ha encontrado a quién preguntarle.'
    scale_mail_gauntlets: 'Cada escama fue arrancada a un raptor que protesto, en voz alta y por bastante rato.'
    scale_plate: 'Una gruesa escama de reptil del tamaño de un plato. Los armeros lo adoran. El raptor está menos entusiasmado con el arreglo.'
    scaled_hide: 'Pequeñas escamas superpuestas que atrapan la luz. Los curtidores cosen docenas juntas. Es tedioso. Se quejan.'
    scar_iron: 'Hierro arrancado directamente de la roca expuesta de la Cicatriz, que aún conserva el frío de la profundidad de donde salió. Los herreros lo dejan entibiar antes de trabajarlo, por respeto y por leve instinto de conservación.'
    scar_maul: 'Extraído de piedra-cicatriz lo bastante pesada como para que blandirlo se sienta como el último argumento que la herida necesitará oír jamás.'
    scar_sigil_amulet: 'Acuñado con el mismo sello que los Cantores de la Cicatriz graban en las paredes de fractura, destinado a rechazar lo que sea que la Herida devuelva trepando.'
    scar_suture_daggers: 'Copiadas de las hojas rituales de los Sacerdotes de Sutura, lo bastante finas para cerrar una herida o abrir otra, según el ángulo. Los Sacerdotes insisten en que siempre es lo primero.'
    scarab_cleaver_axe: 'Con forma de ala. Vuela tan bien como se sostuvieron las demas promesas del mercader.'
    scarak_chitin_belt: 'Placas de escarabajo que encajan como un rompecabezas hecho por un bicho sin aficiones ni amigos. Se ciñe solo, obedeciendo aún la última orden del enjambre: apretar.'
    scarak_cleaver: 'La colmena scarak convoco tres concilios para recuperar esto. Los tres fracasaron.'
    scarak_crown: 'Llevar la cabeza de un scarak en tu cabeza. Hay una recursión filosófica aquí que los scaraks definitivamente no han considerado.'
    scarak_overlord_ring: 'Emitido de oficio a los guardianes de tumba. No se opaca; nada se opaca en los túmulos.'
    scarak_shell: 'Placa quitinosa que chasquea cuando la golpeas. Hace buenas tejas. La reina estaría furiosa si tuviera emociones.'
    scarak_shell_plate: 'Placas de quitina cosechadas durante la muda. Los scaraks estaban furiosos, pero técnicamente desnudos, así que su protesta carecía de autoridad.'
    scarak_stinger: 'Arrancado directamente de un scarak y montado en un palo. Todavia se mueve.'
    scarforged_alloy: 'Batida sobre el propio calor de la Cicatriz, que los herreros racionan con cuidado — la Cicatriz no se recalienta a petición.'
    scarforged_grips_of_first_dawn: 'Templados en el frío que se estanca en el fondo de la fractura al alba. Ese frío nunca las abandona del todo, algo que el portador aprende a dejar de notar.'
    scarforged_legguards_of_last_ascent: 'Aplanados sobre la piedra-yunque de la propia Cicatriz, lo que deja en la placa una leve ondulación que ningún pulido quita. Ya nadie lo intenta.'
    scarforged_resin: 'Savia reducida al calor de la Cicatriz hasta cuajar vidriosa y sujetar una junta mejor que el propio hierro. Huele, débil y permanentemente, al fuego que la hizo.'
    scarforged_tonic_of_last_ascent: 'Repartido a un trago por escalador para el empujón final, bajo la lógica de que quien necesita un segundo trago no va a terminar la subida de todas formas.'
    scarforged_visor_of_first_dawn: 'Inclinado para captar la primera luz que jamás cruzó la Cicatriz, una luz que los herreros dicen distinta. Nadie los ha desmentido, sobre todo porque a ellos nadie les ha demostrado nada.'
    scarforged_warbelt_of_last_ascent: 'Abrochado con un cierre tallado del borde de la Cicatriz, por lo que nunca cierra del todo a ras. La rendija es pequeña, y siempre está ahí.'
    scarguard_helm: 'De reglamento para quien monta guardia en el último muro, la visera inclinada para que el portador nunca tenga que mirar la Herida directamente demasiado rato.'
    scarhewn_axe: 'Astillada del propio muro roto de la Cicatriz, el filo dejado tan dentado como lo está la línea de fractura. Corta como si el mundo ya hubiera dejado de resistirse.'
    scarwalk_leggings: 'Desgastadas hasta la trama por peregrinos que recorrieron el borde de la Cicatriz con una frecuencia que, francamente, excedía el diseño de las perneras.'
    schism_cuirass_of_last_tremor: 'Templada el día en que la línea de un Soldado Quebrado finalmente, de forma oficial, rompió filas por última vez. El metal dejó de resonar esa misma tarde. No ha hecho ruido desde entonces.'
    schism_gauntlets_rift: 'El guantelete izquierdo recuerda el agarre de un Soldado Quebrado sobre un escudo que ya no existe. El guantelete derecho nunca ha sostenido nada. Quien los lleva favorece un lado sin querer.'
    schism_gauntlets_void: 'Los dedos nunca acaban de entrar en calor. Útil para el temperamento, fatal para dar la mano.'
    schism_girdle_of_widening_crack: 'Diseñado por un intendente Soldado Quebrado para seguir funcionando después de romperse, lo cual es o bien un diseño brillante o un comentario muy triste sobre las expectativas. Probablemente ambos.'
    schism_greaves: 'La greba izquierda y la derecha fueron forjadas a partir de dos Soldados Quebrados distintos, que nunca sirvieron en la misma era. Todavía no se ponen del todo de acuerdo sobre el orden de marcha.'
    schism_resin: 'Rezuma de una roca partida en dos que nunca perdonó a ninguna mitad.'
    schism_sabatons_rift: 'El vacío sube por las suelas. Los portadores refieren corazón cálido y dedos insufribles.'
    schism_sabatons_void: 'Suelas lastradas para que la gravedad tenue no se te lleve a media zancada.'
    schism_signet_of_last_tremor: 'Dejó de zumbar justo cuando el último temblor de un Rifling murió dentro de su caparazón. Ahora solo descansa frío sobre la mano — al portador anterior eso le inquietaba más que el zumbido.'
    schism_signet_of_widening_crack: 'El grabado se alarga un cabello cada año, trazando la misma línea creciente que partió la insignia de rango original del Soldado Quebrado. Los joyeros se niegan a tasarlo dos veces.'
    scorch_grimoire: 'La portada está chamuscada. El contenido es peor. Quien lea el capítulo tres en voz alta pierde las cejas.'
    scorched_loaf: 'Quemado a propósito, y ni se te ocurra insinuar lo contrario. Ese crujido es toda la gracia, no la vergüenza de un panadero.'
    scorchtouch_grips: 'Todo lo que tocas se calienta. Los apretones de manos son ya un incidente diplomatico.'
    scrap_battleaxe: ''
    scrap_cuirass: "Martillada de placas recuperadas. Los huecos son 'caracteristicas de ventilacion' segun el herrero. Claro."
    scrawled_tome: 'Encontrado flotando en la Nave Inundada, su tinta aún húmeda tras lo que los barqueros juran fue una década bajo el agua. Nadie ha traducido la última página; las primeras tres ya disuadieron a todos.'
    scythe_of_the_abyss: 'Cuando el abismo te entrega un arma. Servicio al cliente sorprendentemente bueno.'
    sealed_core: 'Un núcleo forjado en torno a un fragmento de génesis y sellado como el Oráculo sella una herida — bien apretado, con una nota escrita que desaconseja abrirlo.'
    senshi_starter_sword: 'Es un palo. Le pegaste una empuñadura. No engañas a nadie, y menos a los goblins que sin duda se lo contarán a sus colegas.'
    sentinel_gorget: 'Protege el cuello. Una estrategia de supervivencia sorprendentemente infravalorada.'
    sentinel_teeth: ''
    sentinel_tooth: 'Uno se pregunta qué tipo de necio se acerca lo suficiente a un cocodrilo para arrancarle los dientes, y sin embargo aquí estamos.'
    seraph_chain: 'Fue aprobado por una decisión dividida, lo cual explica la cláusula de garantía tachada.'
    seraph_heart_pendant: 'Este amuleto se deshace a sí mismo con insistencia tranquila. Es simultáneamente aquí y en otro lugar, usado y descartado, real y disputado.'
    seraph_lance: 'El artesano aún no está seguro de haberlo terminado bien, lo cual explica la cláusula de garantía tachada.'
    seraph_petal: 'Si es uno o varios materiales sigue sin resolverse, y el informe se presentó de todos modos, con reservas incluidas.'
    seraph_plume: 'Su pureza se mide en una escala variable y negociable, así que el registro simplemente lista ambas, una junto a otra.'
    seraphbound_casque_of_falling_crown: 'Resiste el escrutinio, apenas, así que se envió de todos modos, dudas incluidas.'
    seraphbound_cordial_crown: 'Su regusto es cuestión de opinión personal, así que se vende con un encogimiento de hombros en vez de garantía.'
    seraphbound_cordial_godbone: 'Se preparó para zanjar una discusión, y no lo logró, así que se bebe bajo su propio riesgo, formalmente hablando.'
    seraphbound_longsword: 'El diseño sobrevivió a tres objeciones distintas, lo cual es todo el diseño o solo un error de redondeo.'
    seraphbound_loop_of_broken_diadem: 'El diseño pasó por varios borradores irreconciliables, lo cual es técnicamente cierto y completamente inútil.'
    seraphbound_resin: 'Quedó registrado como prueba en un debate que nadie llegó a concluir, así que se aconseja a los compradores juzgar por sí mismos.'
    seraphbound_stompers: 'Quien lo porta jura por él; todos los demás dudan, así que el debate se pospuso indefinidamente.'
    seraphbound_vambraces: 'Su función se decidió a cara o cruz, y la discusión sobrevivió a todos los que la empezaron.'
    seraphic_amalgam: 'Dos informes distintos lo describen en términos contradictorios, algo que el equipo de estudio todavía discute.'
    seraphine_hauberk: 'Las notas del artesano son solo ideas tachadas, así que el desacuerdo se incorporó silenciosamente al diseño.'
    shadow_blade: ''
    shadow_knight_signet: 'La inscripcion interior se traduce, a grandes rasgos, como una amenaza. Quienes lo forjaron juran que se trata de una promesa.'
    shadow_knight_visor: 'La ranura ocular es deliberadamente estrecha. Los caballeros sombra ven la vision periferica como una falta moral.'
    shadow_stilettos: 'Forjadas con esquirlas que absorben la luz. Tus enemigos tampoco veran venir el fallo.'
    shadowsteel_belt: 'Sostiene tu pantalon y, segun dicen, tu terror mortal. Una de estas afirmaciones no esta verificada.'
    shadowsteel_morningstar: 'Las puas beben la luz en vez de reflejarla, lo que la vuelve una lamparita nocturna pesima.'
    shadowsteel_shard: 'Roto de una armadura donde la oscuridad no era decoración sino estructura portante. Los herreros lo manejan con tenazas, una oración, y la cautela particular de quienes saben lo que le pasa a quien se salta la oración.'
    shark_bone_choker: 'Un collar de vértebras de tiburón. De moda en pueblos costeros. Aterrador en cualquier otro lugar.'
    shark_fin: 'Una aleta dorsal de tiburón martillo. Comerciantes de sopa han sido arrestados por menos.'
    shark_fin_saber: 'Serrada al estilo de dientes de tiburón. Los tiburones, comprensiblemente, siguen molestos por ello.'
    shark_harpoon: "Con una aleta de tiburón de origen 'ético'. El tiburón discreparía de la palabra 'ético'."
    shark_leather_belt: 'Aspera al punto de servir de lija. El tiburon no sobrevivio a la metafora.'
    shark_mail: 'Escamas de aleta tiburonesca cosidas a anillos de mithril. Impermeable, a prueba de tiburones y tema de conversación.'
    shark_scale_tassets: 'Escamas de aleta de tiburón en los muslos. Ahora eres aerodinámico bajo el agua. Legalmente, un pez.'
    shark_vertebra_ring: 'Una sola vértebra de tiburón, pulida. La mandíbula de donde vino sigue, técnicamente, cazando.'
    sharkhide_fists: 'Piel de tiburón envuelta sobre placas de torio. La textura áspera funciona también como rallador de queso.'
    sheep_eye: 'El ojo desprendido de un Lanalfón es mucho menos intimidante cuando no puede parpadear, lo cual resulta ser siempre.'
    shellguard_mitts: 'Forrados con quitina de cangrejo lo bastante gruesa para embotar golpes y motricidad fina por igual. Tus dedos están a salvo, tu destreza no, y lo que queda debajo es casi imposible de matar.'
    shiny_barley: ''
    shoddy_spear: 'Un palo puntiagudo con delirios de servicio militar. La punta se tambalea pero el compromiso es todo.'
    shore_amulet: 'Tallado del caparazón de un cangrejo que pellizcó al pescador equivocado. La arena atrapada dentro suena cuando el peligro se acerca, o cuando caminas. No distingue la diferencia.'
    shore_finns: 'El caparazón de grandes cangrejos, transformado en una resistente armadura para piernas que cruje levemente con olor a sal marina y marea soleada.'
    shore_mace: 'Incrustada con percebes que añaden textura y riesgo de tétanos.'
    silentedge: 'No hace ruido al desenvainar, al golpear ni al impactar. El silencio posterior es lo que la gente recuerda.'
    silk: 'Filamentos de calidad impecable, lisos como el agua y más fuertes que cadenas. Una lástima lo de los nudos — se mantienen firmes, pero los lazos familiares nunca debieron ponerse a prueba de esta forma.'
    silk_boots: 'Imposiblemente ligeras, tejidas con seda de arañas sobornadas con moscas para cooperar. El acuerdo duró exactamente lo suficiente para terminar un par. El aprendiz del zapatero sigue en terapia.'
    silk_bound_lexicon: 'Encuadernado con hilo de capullo. La mitad de hechizos son ilegibles la otra mitad peligrosos.'
    silk_cocoon: 'A medio formar y pegajoso. Lo de dentro es una larva o, preocupantemente, tu almuerzo.'
    silk_cowl: 'Tejida con criaturas que pasan toda su vida sobre corrientes ascendentes sin mirar nunca abajo.'
    silk_gloves: 'La cumbre de la moda para quienes nunca han trabajado ni un solo día de su vida, y cuya sangre corre bastante más caliente de lo que sus manos jamás estarán.'
    silk_leggings: 'Ligera como una brisa. Resistente como lo que causo la brisa, para empezar.'
    silk_tunic: 'Tejida por aranas cavernicolas que solo trabajan en oscuridad y silencio absolutos.'
    silk_woven_gauntlets: 'Tan ligeros que olvidas llevarlos puestos. Lo notaras justo cuando menos convenga.'
    silkamu: 'Tejido con hilos que ninguna araña cedió voluntariamente. El sindicato arácnido ha puesto precio a la cabeza del tejedor, pagadero en moscas.'
    silkling_stingers: 'Las púas casi microscópicas aseguran que las heridas supuren durante semanas, que es, cabe decir, el objetivo.'
    silkwinder_lance: 'Envuelta en seda de araña que la hace silbar en el aire. Los enemigos la oyen venir pero nunca pueden esquivarla.'
    silt_wrapped_core: 'Un núcleo de artesanía enfundado en limo que hay que quebrar para usar, y que se rehace en una noche si lo dejas demasiado entre trabajos.'
    silt_wrapped_cuirass_of_quiet_drowning: 'Costrada en una cáscara de limo que endurece como piedra en seco y ablanda en húmedo, lo que en el Weald significa que siempre está, calladamente, en transición.'
    silt_wrapped_gauntlets: 'Costrados de limo que endurece sobre los nudillos, así el primer puñetazo entrega también un puñado del suelo del Weald.'
    silt_wrapped_greaves: 'La cáscara de limo añade el peso de una piedra a cada paso, que el portador deja de notar más o menos cuando lo notan todos los demás.'
    silt_wrapped_lance: 'Su cáscara de limo salta al primer impacto y se lleva la atención del enemigo consigo, cosa que el segundo impacto aprovecha.'
    silt_wrapped_maul_of_quiet_drowning: 'Su envoltura de limo añade el peso de una piedra y, al impacto, un pequeño estallido del suelo del Weald, así cada golpe deja algo de hogar.'
    silversteel_saber: 'Brilla con cualquier luz disponible. Atrae atencion, sobre todo la que intentabas evitar.'
    sky_shard: 'Una pieza solidificada de nube de tormenta. Flota si la sueltas. Los arcanistas los atan a bastones. La gravedad está ofendida.'
    sky_shard_diadem: 'Lo lleva quien porta el último el estandarte ceniciento. El cargo cambia de manos a menudo.'
    skybound_ring: 'Forjado a fuego lento en las fosas de la pira, una y otra vez, hasta perder cualquier otro recuerdo.'
    skyburial_bow: 'Funciona bajo reserva, algo en lo que quien lo porta prefiere no pensar.'
    skyburial_leggings: 'Quien lo porta jura por él; todos los demás dudan, así que su portador ha dejado de hacer preguntas.'
    skyheld_carapace_of_hollow_throne: 'Se terminó por pura terquedad, una decisión tomada bajo considerable presión de tiempo.'
    skyheld_claymore_of_last_regent: 'Funciona, pero solo si no preguntas por qué, así que el asunto sigue, por ahora, sin resolver.'
    skyheld_crest_of_hollow_throne_crown: 'Su eficacia nunca ha sido verificada de forma independiente, algo que nadie puede confirmar sin reabrir la discusión.'
    skyheld_crest_of_hollow_throne_godbone: 'Quien lo hizo cambió de parecer a mitad de camino, una resolución que resolvió muy poco.'
    skyheld_halberd_of_hollow_throne: 'Se completó pese a la vacilación unánime, así que la disputa original se declaró en tablas.'
    skyheld_stilettos_of_hollow_throne: 'El artesano aún no está seguro de haberlo terminado bien, así que se envió de todos modos, dudas incluidas.'
    slackline: 'Nunca realmente flojo. Así lo llamaba su anterior dueño — hasta que dejó de ser cierto.'
    slag_clinker: 'Lo que el horno escupe cuando decide haber terminado con algo. Los mineros lo guardan de todos modos — el desecho, dice el viejo refrán, es solo mena a la que no se le pidió las cosas con amabilidad.'
    sloth_fur: 'Increíblemente suave y huele a musgo y paciencia. Los sastres lo adoran. El slothiano solo suspiró muy lentamente.'
    slothian_wisdom_stone: 'Una piedra cubierta de musgo que zumba con conocimiento antiguo. Conoce las respuestas. Simplemente no cree que estés listo.'
    smoldering_wheat: ''
    solomonk: 'The cowl of a monk who traded three vows of silence for one very loud hat.'
    soul_binder: 'Destilado de la estela que deja un aparecido al ser derribado por fin. Sirve para mantener unido el equipo ligado a espíritus.'
    soul_shard: 'Un fragmento cristalizado arrancado a un aparecido a mitad de rito. Aún resuena con algo inconcluso.'
    soul_shard_loop: 'Contiene una esquirla de algo que aún no se ha marchado del todo.'
    soulbinder_scepter: 'Lleva una fracción de lo que los Auditores de Almas ligan en la puerta de abajo, vibrando con una permanencia prestada. Un Profeta de Ceniza lo usaba para hacer preguntas que los muertos no suelen responder dos veces.'
    soulking_spellbook: ''
    sounding_hull_key: 'Recuperada del naufragio que el Guardián del Casco aún patrulla. Zumba levemente cada vez que cambia la marea, como si contara hacia algo.'
    spark_pendant: 'Una chispa cautiva demasiado terca para saber que debio apagarse hace decadas.'
    spark_ring: 'Un aro de cobre con corazón de magnetita que lanza chispas cada vez que quien lo lleva está enfadado, nervioso, o pensando demasiado en la cena. El encantador lo llamó anillo del humor. El pueblo lo llama peligro de incendio.'
    spectral_arcanize: ''
    spectral_edge: 'Mitad en este mundo, mitad en el siguiente. La aduana de la frontera es muy quisquillosa.'
    spectral_essence: 'Destilada del Regente Sin Alma mismo. Huele al vacío entre las estrellas. Valor de mercado absolutamente ruinoso.'
    spectral_fang_daggers: 'Forjados de quejas fantasmales condensadas. Cada puñalada viene con una queja detallada.'
    spectral_ruin_blade: 'Forjada de un caparazón de Polilla del Vacío lo bastante fino para ver a través con la luz adecuada, y lo bastante fino para cortar con cualquier luz. Los fantasmas de sus antiguos dueños a veces ofrecen consejos no solicitados.'
    spice_rusk: 'Cocido dos veces y tan aromatico que los armeros extraen su aceite para todo menos hornear.'
    spicebark_bread: 'Un mordisco y todos los senos nasales en tres mesas a la redonda se rinden sin condiciones.'
    spider_fang_club: ''
    spider_fang_daggers: 'Dos hojas de veneno cristalizado que zumban, muy leve, cuando la violencia se avecina.'
    spider_leg: 'Manéjalo con cuidado, a menos que disfrutes la sensación de arañas invisibles arrastrándose bajo tu piel durante semanas.'
    spider_silk_gland: 'Organo gelatinoso que produce hilo mas fuerte que un cable de acero del mismo grosor. Manejalo con cuidado igual.'
    spider_silk_grips: 'No suelta lo que sujeta. Maravilloso en combate, catastrofico para un apreton de manos.'
    spider_silk_treads: 'Calzado virtualmente silencioso hilado con seda de araña cavernaria. Perfecto para el sigilo, terrible para anunciar tu presencia en cenas elegantes. La seda a veces se pega a las superficies, lo cual es un defecto de diseño o la venganza final de la araña.'
    spider_thread_pants: 'Hilado con hebra que ninguna arana entrego jamas de buena gana. El origen etico nunca estuvo en la mesa.'
    spine_daggers: 'Cultivadas por una tal Elorie para la crueldad, no la piedad. La historia no dice cual gano.'
    spine_gauntlets: 'Púas de colmillero montadas sobre palmas de cuero. Cada apretón de manos se convierte en una negociación. Cada palmada en la espalda, en una declaración de guerra. La fabricación implicó arrancar espinas de una criatura muy enfadada, lo que explica el resentimiento residual.'
    spine_pants: 'Reforzado con puas de una criatura pequena y muy susceptible a que se sienten sobre ella.'
    spore_cracker: ''
    stabilizing_agent: 'Evita que mezclas volatiles se conviertan en explosiones no programadas. De los lotes fallidos no se habla.'
    staff_of_the_deep: 'Extraído de un templo hundido que nadie recuerda haber construido. Los percebes son lo menos extraño del asunto.'
    stamina_tonic: 'Estimulante mineral que convence a tus piernas de que no estan cansadas. Ellas saben la verdad, pero obedecen por miedo quimico.'
    starter_staff: 'Este desgastado bastón de bambú ha guiado a incontables vagabundos por pantanos y páramos. Curiosamente, funciona igual de bien como ayuda para caminar y como lección improvisada de humildad.'
    starter_weapon_ikari: 'Gruesa, roma y perezosa — todo lo que un arma de maestro no debería ser. Uno podría aplastar a un enemigo hasta la muerte con ella, suponiendo que primero pueda levantarla por encima de los hombros.'
    steadyhand: 'Detiene el temblor que la Cicatriz acaba dándole a todo el mundo. Solo la mano. El resto del temblor sigue siendo tu problema.'
    steel_cuirass: 'El dueno anterior dejo una direccion de reenvio. Nadie ha tenido el valor de comprobarla.'
    steel_flail_sword: 'Hoja flexible forjada al ocaso, envuelta en malla de cerdas. Se dobla como una promesa que nadie piensa cumplir.'
    steel_gauntlets: 'Los dedos se articulan a la perfeccion en la oscuridad y se agarrotan al tocarlos el sol.'
    steel_greaves: 'Ultima creacion del caballero sombra antes de retirarse a criar abejas en oscuridad total.'
    steel_incandescent_sword: 'Forjada a tal calor que el herrero, dicen, extravió su propio nombre durante el temple. La hoja recuerda el calor a la perfección. Lo que él perdió aquel día, la hoja nunca se lo ha devuelto.'
    steel_longsword: 'Tendon de lobo envuelve una hoja de acero oscuro. Afilada, oscura y profundamente indiferente a tus sentimientos.'
    steel_recurve: 'Encordado con tendon de lobo alfa que se tensa, apenas, cada vez que mientes sobre tu fuerza de tiro.'
    steel_treads: 'Forjadas durante un eclipse por un caballero que exigia silencio total, casi logrado.'
    steel_warhelm: 'Tan oscura que absorbe halagos junto con la luz. La visera solo abre desde dentro, broma de alguien.'
    stitched_trousers: 'Doble costura para durabilidad. El sastre estaba tan orgulloso que lo firmo por dentro. Con tinta visible. Mal.'
    stoneheart: 'Fría al tacto a toda hora, en toda estación, sin importar lo que le esté pasando a quien la lleva.'
    stormfeather: 'Una pluma que chispea cuando se sacude. Los magos de tormenta las tejen en varitas. Los carteros se niegan a entregarlas.'
    stormfeather_daggers: 'Plumas de halcón de tormenta plegadas en acero hasta que el metal olvidó haber sido alguna vez otra cosa. Cada golpe llega con el retumbo de un trueno de una tormenta que hace tiempo siguió su curso sin él.'
    stormfeather_longbow: 'Cada flecha crepita antes de soltarse. Todo arquero jura que era intencional.'
    stormfeather_loop: 'Trenzado con plumas que nunca dejan de crepitar. Un apreton de manos aqui viene con una pequena descarga apenada.'
    stormhowl_bow: 'Cada flecha grita hacia su objetivo. Los vecinos se han quejado.'
    stormtide_coif: 'No logra decidir si es para magos del agua o caballeros de la tierra. Sirve a ambos, de mala gana.'
    stormwalker_boots: 'Cruzan cualquier tormenta sin quejarse. Las botas, no quien las lleva, que se queja sin parar.'
    stormweave_leggings: 'Grises por el desgaste, no por el tinte. Nadie recuerda ya el color original.'
    stumpwork: 'Construida para los árboles que sobrevivieron a la herida solo a medias. Terminar el trabajo resultó ser una labor constante y fiable.'
    suize_flour: 'Cristalina y tan captadora de luz que los panaderos juran que hace el pan saber mas caro.'
    summit_alloy: 'La aleación más resistente que la fragua de la cima puede sostener antes de que ceda el propio crisol. Los herreros saben la temperatura exacta y nunca la anotan.'
    summit_cuirass_of_sealed_wound: 'Ajustada sobre la costura que más les costó cerrar a los suturadores, de modo que el portador carga la reparación consigo. Aguanta mejor en un pecho que en la Cicatriz.'
    summit_draught: 'Preparado contra el mareo que asalta a los escaladores cerca de la cima, donde el aire se enrarece y la mente empieza a negociar con el vacío. Bébelo antes de que arranquen las negociaciones.'
    summit_extract: 'Obtenido de musgo de la cima a presión, tan concentrado que una sola gota hace el trabajo de un frasco entero y cuesta más o menos lo mismo reponerla.'
    summit_girdle_of_summit_vigil: 'Ceñido para mantener en pie a un centinela durante una guardia que nadie debía sobrevivir de pie. Aguantó a los tres últimos; no se pone sentimental por ello.'
    summit_greaves: 'Reforzadas en la espinilla para el último tramo de la escalada, donde la montaña deja de ofrecer asideros y empieza a quitarlos.'
    summit_helm_of_summit_vigil: 'Se entrega a quien le toca la guardia más larga en la cima, con el argumento de que un yelmo más pesado impide que la cabeza dé cabezadas. Y lo impide. Sobre todo doliendo.'
    summit_ore: 'Adamante extraído en la mismísima cumbre, donde el mineral está más cerca de aquello de que está hecha la montaña por debajo. Pesado de una forma que se diría intencionada.'
    summit_sabatons_genesis: 'Placados sobre suelas que los herreros juran fueron las primeras jamás cortadas. Sea cierto o no, caminan como si no les quedara nada que demostrar.'
    summit_sabatons_scar: 'Herrados para pisar la piedra-cicatriz, que se mueve bajo el pie con la paciencia de algo que espera a que confíes en ella.'
    sundered_casque: 'Una grieta cruza la frente. El herrero la llama «canal de alivio de tensión». El herrero miente.'
    sundered_charm: 'La mitad de un medallón de unidad de los Soldados Quebrados, emitido en pares que jamás debían separarse. La otra mitad anda por ahí, seguramente aún empeñada en completar el juego.'
    sundered_chausses_of_screaming_rift: 'La postura arrodillada de una última orden, fijada en las articulaciones del Soldado Quebrado por lo que rematara la obra de la grieta. Levantarse exige, cada vez, una decisión nueva.'
    sundered_cordial: 'No es cura. Es una pausa. Aprovéchala para replantear lo que te trajo aquí.'
    sundered_cordial_of_long_collapse: 'Entregado a Soldados Quebrados que, técnicamente, siguen en la lista. Repara lo que puede y es honesto sobre el resto.'
    sundered_elixir_of_screaming_rift: 'Lo último que prepara una unidad de Soldados Quebrados en vísperas de disolverse. Ruidoso al tragarlo. Silencioso después.'
    sundered_sash: 'La única pieza del equipo de los Soldados Quebrados que nunca se deshizo, por muy a fondo que lo hiciera el resto de la historia. Aguanta. Sin más.'
    sundered_stompers_of_long_collapse: 'Cada paso cae como el veredicto que un consejo de guerra de Soldado Quebrado nunca llegó a pronunciar. Lento, deliberado y absolutamente definitivo, si la gravedad lo permite.'
    sundered_stompers_of_screaming_rift: 'La grieta de abajo contesta cada pisada del Soldado Quebrado, lo que arruina bastante las lecciones de sigilo. Las entradas sorpresa quedan, estructuralmente, descartadas.'
    sundered_vambraces_of_long_collapse: 'Atados para un pase de lista que nunca terminó de tomarse. Los brazos recuerdan mantenerse listos mucho después de que la mente preferiría no hacerlo. La resistencia sin fin sigue siendo, técnicamente, resistencia.'
    sundered_vambraces_of_screaming_rift: 'Acolchados gruesos sobre los «oídos» del brazo, lo cual no tiene sentido anatómico hasta que recuerdas de quién era ese brazo. Bloquea el sonido casi tan bien como bloquea las hojas.'
    sunglass_shard: 'Cortado de vidrio fusionado por dos soles que jamas se han puesto de acuerdo en nada mas.'
    sunken_mere_key: 'Sacada de bajo el hielo donde duerme el Dragón de Escarcha, lo bastante fría para entumecer una mano descubierta en segundos. Recuperarla fue más fácil de lo esperado, algo que a nadie tranquiliza.'
    sunscale_chopper: 'Filo de escamas que bebieron sol suficiente para brillar toda una generacion.'
    sunscale_cuirass: 'Una coraza de escamas relucientes que protege del acero y los hechizos, siempre que uno no termine asado dentro de ella.'
    sunwarmed_ring: 'Aun guarda algo del calor de aquel lagarto que, con todo respeto, ya no lo necesita.'
    sunwarmed_scale: 'Amplia escama de un lagarto pielceniza, aun tibia mucho despues de que el lagarto abandonara la conversacion.'
    surimi: 'Este vestigio sagrado del Surimi late con poder ancestral, su superficie alisada por el toque de peregrinos ya fallecidos. Extraño que la santidad sepa sospechosamente a marisco procesado.'
    suture_belt: 'Ceñido al modo en que un Sacerdote de Sutura ciñe una herida para que no se ensanche. Funciona más o menos igual de bien en una cintura que en la Cicatriz.'
    suture_loop: 'Doblado en un lazo cerrado como cierra todo la orden de sutura, según la teoría de que la Cicatriz no puede deshacer lo que nunca se dejó abierto.'
    swamp_conduit: 'Canaliza agua de pantano en algo vagamente mágico. El olor es enteramente mundano.'
    swamp_scale: 'Verde oscuro y perpetuamente viscosa. El cocodrilo creció una de repuesto. Los curtidores la aceptan con visible renuencia.'
    swamp_trident: 'Tres puntas de metal corroido perfectas para ensartar lo que salga del pantano.'
    swampfire_grips: 'Varias de las peores decisiones de la historia estan manchadas directamente en el cuero.'
    talokan_aero_tail: 'Esmeralda y venenosa. El color hace gratis el trabajo de la etiqueta de advertencia.'
    talokan_pearl: 'Una perla de aguas profundas usada como moneda por los talokan. Brilla tenuemente azul bajo el agua. Los mercaderes terrestres la aceptan a regañadientes.'
    talokan_sting_daggers: 'Bordes de coral y costra de sal. Huelen a marea baja y arrepentimiento.'
    talokan_tail_nakwa: 'Todo talabartero la quiere. Vuelven menos dedos por intento de los que uno esperaria.'
    talokan_tide_ring: 'Hecho de sal marina comprimida y perla talokan. Se disuelve si nadas con él. No nades con él.'
    talokan_trident: 'La punta de coral se regenera entre batallas. La naturaleza facilita tus habitos.'
    tanjirize_flour: 'Harina especiada que transforma todo en algo agresivamente aromático.'
    tanjirize_rod: 'El bastón de caminar de un peregrino que se acercó demasiado a la Herida y volvió cambiado. Para andar sigue sirviendo perfectamente. Ahora también hace otras cosas.'
    tanned_girdle: 'Rigido e incomodo como una primera cita. Se ablanda con el uso. El cinturon no la cita. Eso empeora.'
    tectonic_severance: 'Cuentan que el herrero que la forjó partió una montaña en el golpe de prueba. La montaña presentó demanda.'
    temperedglass: 'Láminas de vidrio de coro que sobreviven a cualquier horno. Los bizcochos se pegan igual, así es la ley.'
    tempering_flux: 'Fundente alquimico que reduce el punto de fusion de metales raros. Los herreros literalmente no pueden forjar equipo de alto nivel sin el.'
    tempest_requiem: 'Cada flecha lleva la pequeña tormenta que un Profeta de las Cenizas vio venir tres versos antes del impacto. El alcance extra no es fuerza: es saber dónde se parará el viento.'
    tempest_whisper_bow: 'Un arco encordado con filamento de fragmento celeste. Las flechas vuelan tan rapido que llegan antes que el sonido.'
    terminal_casque_genesis: 'Lo llevan los Auditores de lo Profundo mientras discuten los registros más antiguos. Bien acolchado, porque las discusiones se alargan y a veces acaban a golpes.'
    terminal_casque_scar: 'El último yelmo que forjó jamás la armería del muro, porque pasada esta altitud no hay talla superior ni siguiente portador que se espere que la necesite.'
    terminal_chausses_of_origin_line: 'Cortadas para la pierna que pretende llegar al límite y detenerse ahí, algo que el placado impone volviendo la carrera francamente molesta.'
    terminal_cordial_of_final_scar: 'Guardado en la enfermería del muro para los casos sin remedio, y luego hallado vergonzosamente eficaz en los que no lo eran. La fama se ajustó en consecuencia.'
    the_tenderizer: 'Comercializado entre los últimos carniceros de la Cicatriz como utensilio de cocina. Reutilizado casi de inmediato. El fabricante ha dejado de hacer comentarios.'
    thick_ursine_hide: 'Una piel, una armadura completa, un oso presentando una queja en el mas alla.'
    thickskull: 'El cumplido era literal. Ha salvado más vidas que el encantamiento cosido en el forro.'
    thorium_warhammer: 'Tachonado con colmillos de rex y reforzado con aleta de tiburon. Sustituye la fineza por fuerza bruta. Los resultados hablan por si solos. Alto.'
    thorium_warplate: 'Emitida de oficio a quien todavía mantiene unida una columna. Hoy, escasa.'
    threefold: 'Forjada una vez por el herrero, plegada dos veces más por algo que no es un herrero. Nadie ha preguntado qué.'
    throatlatch: 'Cerrado por quien lo llevó primero y nunca más abierto. El cierre sigue funcionando. Nadie lo ha probado.'
    throneless_cleaver_of_rotting_halo: 'La artesanía es sólida; la premisa no lo es, un acuerdo alcanzado cuando todos dejaron de discutir.'
    throneless_draught_of_gilded_ruin: 'Sabe a una decisión tomada demasiado rápido, y quien lo preparó aún se niega a tomar partido.'
    throneless_extract: 'Nadie puede afirmar con certeza de dónde proviene esto, así que ambas entradas permanecen en el registro, sin reconciliar.'
    throneless_gauntlets_of_gilded_ruin: 'Fue forjado durante una discusión que nadie ganó, y el segundo borrador nunca llegó a existir.'
    throneless_lattice: 'Se archivó como prueba de una disputa que jamás se resolvió del todo, y el informe se presentó de todos modos, con reservas incluidas.'
    throneless_pendant_crown: 'Quien lo porta insiste en que funciona; la evidencia no es concluyente, sin reembolsos, sin más preguntas admitidas.'
    throneless_pendant_godbone: 'Nadie ha confirmado que haga lo que la etiqueta dice, un hecho que su artesano considera una virtud.'
    throneless_sabatons_of_gilded_ruin_crown: 'Funciona, pero solo si no preguntas por qué, una distinción sin mucha diferencia real.'
    throneless_sabatons_of_gilded_ruin_godbone: 'Su origen cambia según quién lo cuente, y los documentos no reflejan nada de esto.'
    throneless_sabatons_of_rotting_halo: 'Fue construido para probar un punto que nadie recuerda, una nota al pie que su artesano nunca llegó a escribir.'
    tide_shard: 'Un fragmento cristalizado de océano vivo que gotea sin parar. Huele a sal y asuntos pendientes.'
    tide_throne_key: 'Fundida en coral que solo endurece por debajo de la línea de marea. El Regente Ahogado aún preside la corte allá abajo, y aún la espera de vuelta.'
    tidebinder_cord: 'Anudado con la precisión de un marinero y un toque de incompetencia mágica.'
    tidebound_band_of_brackish_deep: 'Se empaña y se aclara en un ciclo que nada tiene que ver con el uso, que el portador acaba por dejar de cotejar con la marea que le dicen que no existe.'
    tidebound_breastplate_of_brackish_deep: 'Forjado en agua demasiado salada para beber y demasiado dulce para conservar nada, un arreglo que el peto luce como un olor tenue y permanente.'
    tidebound_core: 'Un núcleo que se hace más pesado y más ligero en un ciclo lento que ningún artesano ha podido cotejar con nada, y menos con una corriente que el Weald jura ausente.'
    tidebound_grips_of_silt_throne_matron: 'Rescatados de la corte ahogada y nunca desalados, dejan una pálida huella blanca en todo lo que el portador toca mucho rato.'
    tidebound_grips_of_silt_throne_mire: 'Guanteletes recuperados de la corte ahogada, aún curvados en el agarre de algo que el limo se llevó hace mucho.'
    tidebound_treads_of_brackish_deep: 'El curtido en agua salada las dejó eternamente húmedas y eternamente silenciosas, trato justo en un lugar donde el ruido atrae dientes.'
    tidebound_treads_of_silt_throne: 'Calzado de corte hecho para quedarse perfectamente quieto en las ceremonias, ahora perfecto para quedarse perfectamente quieto mientras pasa algo grande.'
    tidebound_visor_of_brackish_deep: 'Costroso de sal por llevarse donde alcanza la marea, que el Weald jura no tener y que la corrosión del visor jura lo contrario.'
    tidebound_visor_of_silt_throne: 'Recuperado de la sala atascada de limo que los guías del Weald aún llaman sala del trono, más por costumbre que por prueba de que allí hubiera trono alguno.'
    tidecaller_mail: 'Resuena como una boya en la tormenta. Tus aliados siempre saben dónde estás. Los enemigos también.'
    tideflame_treads: 'Botas que arden con llama azul en cada contacto con el agua. El efecto es espectacular en los cruces de ríos y desastroso en las noches de lluvia en las ciudades. Los bomberos de las zonas portuarias han presentado una petición oficial contra su distribución.'
    tidesurge_leggings: 'Brillan como el océano al atardecer. Huelen como el océano en marea baja.'
    tidewalker_soles: 'Camina sobre el agua. No literalmente. Pero lo bastante cerca para molestar a los físicos.'
    timberfall: 'Calificada para talar los árboles petrificados que la herida dejó en pie. Rinde parecido con cualquier cosa que antes fuera una persona.'
    timberwolf_legguards: 'Grebas forradas con piel de lobo que mantienen las piernas calientes en invierno y sobrecalentadas el resto del año. El patrón del pelaje cambia a la luz del fuego, creando la inquietante impresión de que algo sigue vivo ahí dentro, esperando su momento.'
    tin_cap: 'Una cupulita que cambia neuronas por aguante. Sobrevivirás a tus propias buenas ideas.'
    titan_bear_moss: 'Musgo que creció en el pelaje vivo de un oso titán. Imbuido de siglos de energía de depredador supremo. Los druidas se vuelven salvajes.'
    titan_koa_greaves: 'El cuero correoso de un koa titán, moldeado en grebas. Croan cuando doblas las rodillas.'
    titan_koa_lance: 'Clavada en la línea de tumbas durante tres inviernos. Aún señala la misma dirección.'
    titan_koa_stompers: 'Hechas para el barro, no para el sigilo. La columna nunca debió ser silenciosa.'
    titan_koa_warspear: ''
    titan_shell_hauberk: 'Hervida y aplanada a martillazos. Lo que la vistió antes todavía deja olor.'
    title_veteran: "Press this searing brand against your flesh to prove you're a veteran and it'll be granted to you for life — because nothing says 'battle-hardened warrior' like voluntary third-degree burns."
    tokek_paw: 'Una pata arrancada de un geco tokek, aún tibia y aferrándose a la nada.'
    tome_of_elemental_spite: ''
    tome_of_oblivion: 'El último capítulo se escribe solo a medida que lees, con el polvo que deja una Polilla del Vacío cuando deja de existir a mitad de frase. Los críticos coinciden en que el final es honesto, si nada más.'
    tool_herbalist: "La cima de la elegancia agrícola, suponiendo que lo que buscas es esa estética de 'desesperación embarrada'."
    totem_club: 'Tallado con simbolos que ningun vivo sabe leer. Golpea suficientemente fuerte y parecen traducirse solos.'
    training_battleaxe: 'Un hacha de batalla de entrenamiento en madera endurecida que simula el peso y el equilibrio de un hacha real sin el inconveniente fatal de los bordes afilados. Ideal para aprender la forma correcta. Los instructores insisten en el término entrenamiento. Los reclutas lo olvidan regularmente.'
    training_helmet: 'Protege contra brisas suaves e insultos contundentes. Proteccion en combate: teorica.'
    tremor_brew_of_nine_faults: 'Cura y deja un temblor leve y permanente en ambas manos. Balance positivo, aseguran.'
    tremor_crest_of_fifth_breach: 'Vibra levemente todo el tiempo. Tras una semana dejas de notarlo. Ese es el problema.'
    tremor_fists_of_nine_faults: 'Dan el golpe, y luego un zumbido de más. Ese extra no se puede desactivar.'
    tribal_cudgel: 'Envuelto en amuletos totémicos que canalizan espíritus que, se dice, juzgan cada golpe tanto por la forma como por la fuerza. Según todos los relatos, siguen sin impresionarse. El garrote golpea igual de fuerte, sea cual sea su opinión.'
    tribal_summoner_totem: 'Un totem tallado por chamanes salvajes. Las tallas representan animales. Los animales representados han presentado quejas.'
    tribal_totem: 'Un fetiche de hueso tallado crepitando con poder residual. El jefe lo llevó a la batalla. No le ayudó.'
    truelength: 'Medida contra el propio antebrazo del herrero, una unidad que murió con él. La espada sigue siendo la única copia.'
    truestrike: 'Empuñada por peregrinos a quienes enseñaron que la Cicatriz premia la convicción más que la puntería. La hoja discrepa, en silencio, cada vez.'
    truffle_essence_compound: ''
    tusk_bludgeon: 'Una maza de marfil de colmilludo. Murio de causas naturales. Naturalmente tu las causaste.'
    tusk_buckle_belt: 'La hebilla es un auténtico colmillo de jabalí. El cuero huele a algo que te embistió y perdió. Abrocharlo requiere una breve pelea que el cinturón gana la mitad de las veces.'
    tusk_ivory: 'Marfil denso del colmillo de un jabalí verrugoso. Los talladores hacen piezas de ajedrez, porque aparentemente eso es un mercado.'
    tusker_musk_gland: 'Produce un olor que puede vaciar una habitación, un edificio, o un pequeño distrito. Los alquimistas extraen feromonas de ella.'
    twine_belt: 'Trenzado con lo que crecía al borde del camino. Se sostiene por pura terquedad y un nudo que ningún marinero reconocería. El anterior dueño eligió la gravedad.'
    tyrants_gavel: 'Servía para dictar sentencia a los desertores. En las marismas los hubo a montones.'
    ukranize_flour: 'Molida de un grano que atravesó cien malas cosechas para llegar hasta aquí, esta harina hornea panes tan resistentes que, según cuentan, un pueblo usó las sobras como tope de puerta durante toda una generación.'
    uncertain_bow_range: 'Un arco que dispara a distancia, pero argumenta sobre si la distancia es real. Sus flechas alcanzan objetivos solo por necesidad teórica.'
    underweald_casque: 'Pensado para los niveles bajo las raíces, donde la oscuridad es total y la única labor real de un yelmo es impedir que te partas el cráneo contra el techo.'
    underweald_charm: 'Un nudo de raíz y hueso que los guías juran que ahuyenta a las cosas de abajo. Nunca lo ha probado nadie que volviera a confirmarlo.'
    underweald_elixir_of_fen_below: 'Preparado con lo que crece en el fondo del Fen de Abajo, cura bien y sabe exactamente al sitio de donde viene.'
    underweald_hauberk_matron: 'Solapada con escamas que la Matrona muda a cientos, lo que suena abundante hasta que averiguas qué le hace a quien las recoge.'
    underweald_hauberk_mire: 'Tejida con hierro de turbera que nunca se oxida porque nunca estuvo seco lo suficiente para empezar, propiedad que los herreros venden como virtud.'
    underweald_loop: 'Un sencillo aro de raíz de los niveles bajos, llevado por los guías como una insignia que significa, más o menos, bajó ahí y volvió.'
    underweald_stompers_of_rising_tide: 'Lastradas para hacer pie en la corriente, porque aquí abajo el suelo es una sugerencia que el agua es libre de rechazar.'
    ursine_heart: 'Pesa ocho kilos y aún irradia calor. Los encantadores los atan en amuletos de protección. Los osos lo hacían gratis.'
    ursine_signet: 'Presionado en la cera de los formularios de requisición. La cera nunca endurece del todo bien.'
    ursine_totem_club: ''
    velkarion_breath_weapon: 'Un hierro de chimenea que removió la gran pira en persona. Tiene opiniones sobre cómo colocas la leña menuda.'
    velkarion_ember: 'Una astilla de la propia llama del dragón, guardada en un tarro de mermelada. Si se apaga, hay que reencender la catedral entera.'
    velkarion_key: 'El gran portón de la pira tiene nueve cerraduras, seis sellos y una única llave, y el sacristán la guarda exactamente donde estás pensando.'
    venom_band: 'El alquimista que estabilizo este recubrimiento perdio dos dedos demostrando que funciona. Funciona.'
    venom_battleaxe: 'El veneno de araña de esta hoja apenas añade daño. La expresión en la cara del oponente al notar el color del filo hace considerablemente más del trabajo real.'
    venom_belt: 'Tres antidotos fallidos y un sacerdote muy paciente lograron estabilizar el forro de este cinturon.'
    venom_concentrate: 'Toxina purificada usada en armas envenenadas y varias apuestas de taberna lamentables.'
    venom_gland: "Hinchado de toxina. Un solo pinchazo convierte tu velada de 'aventura' en 'negociar con un sanador.'"
    venom_legguards: 'Saturadas de toxinas que, tecnicamente, probablemente son inofensivas para ti en particular.'
    verdant_aloe: ''
    verger_teaspoon: 'La cucharilla de la suerte del sacristán, en un lazo de bramante. Remueve el té con ella y el minuto espera educadamente a que termines.'
    vitrified_casque_of_rising_hymn: 'Tejido para una tetera que explotó de todos modos. Mantiene una cabeza a temperatura de servicio.'
    vitrified_chausses: 'De corte tan estrecho que hubo que calmar al sastre dos veces. Arrodillarse es un recuerdo.'
    vitrified_cord: 'Con doble nudo, como insistía madre. Desatarlas es como empiezan los accidentes.'
    vitrified_crown: 'Fundida en un solo rayo. Al llevarla te sientes brevemente elegido. La sensación miente.'
    vitrified_edge: 'Enfriada despacio para que el vidrio no estallara. Conservó la paciencia y perdió la clemencia.'
    vitrified_elixir: 'Agua salada y cabezonería. El coro lo jura, una octava más alto que antes.'
    vitrified_glaive: 'Lo bastante largo para dorar pan sobre la gran pira sin perder las cejas por completo. Por completo.'
    vitrified_lattice: 'Una red congelada de hebras fundidas. Tómalo por lo grueso; lo fino te toma a ti.'
    vitrified_stompers: 'Cada pisada tañe como copa golpeada. Te anuncias, en todo momento.'
    vitrified_tear: 'Vidrio plano enfriado al ritmo del volcán. A las burbujas se les llama carácter.'
    vitrified_vambraces: 'No es armadura. Es una declaración. Alguien en esta catedral está a punto de ser fregado.'
    void_anchor_belt: 'Lastrado para mantener el equilibrio en suelo que cede bajo los pies. El pantano siempre cede.'
    void_distillate: 'Nada liquida extraida de restos de la familia del Vacio. Mirarlo demasiado causa angustia existencial y nauseas leves.'
    void_eye_lens: 'Una lente cristalizada de un Ojo del Vacío. Ve dimensiones paralelas. La mayoría son peores que esta, de alguna manera.'
    void_eye_talisman: 'Engastado con una lente pulida para vigilar la línea de tumbas tras el anochecer.'
    void_grips: 'Dedos manchados por un agua que nunca ve la luz del día. La mancha no se quita lavando.'
    void_oracle_staff: 'Ve todos los futuros posibles. En la mayoría, mueres. Te los muestra de todos modos.'
    void_shard: 'Un fragmento de la nada en forma física. Mirarlo demasiado tiempo causa sangrado nasal y crisis filosóficas.'
    void_shepherd_club: ''
    void_treads: 'Cada paso se hunde un poco y sale limpio. El pantano aún no ha aprendido a retenerlas.'
    void_whisper_bow: 'Dispara flechas que no existen hasta que llegan. El tiro con arco cuántico necesita una cláusula de exención de responsabilidad.'
    voidbake_tablet: 'Horneada en las fosas de la pira hasta dejar de ser cualquier otra cosa. Los herreros la aplanan antes de que enfríe.'
    voidcleave: 'Una hoja cuyo cada golpe deja una fisura temporal en el espacio visual — no en la realidad, solo en la apariencia. El efecto dura aproximadamente tres segundos antes de cerrarse. Suficiente para desestabilizar psicológicamente a un adversario. Insuficiente para justificar los precios pedidos por los herreros del vacío.'
    voidgazer_crown: 'Mira a través de rendijas desgastadas de tanto vigilar. El pantano observa a su vez.'
    voidpierce_stilettos: 'Afilados hasta un filo lo bastante fino para deslizarse entre las placas del caparazón de una Polilla del Vacío sin que esta lo note hasta bien después del hecho. Funciona con casi todo, con el mismo desprecio por la advertencia.'
    voidpiercer_bow: 'Las flechas disparadas con este arco llegan antes de que la cuerda se suelte completamente. La causalidad es más una sugerencia aquí.'
    voidpiercer_spear: 'Perfora el vacio entre dimensiones. Util para brochetas interdimensionales.'
    voidreaver_greatsword: ''
    voidreaver_longsword: ''
    voidstaff_nihil: 'Tallado en silencio cristalizado de Vaciopolilla: esa quietud exacta entre un aleteo y el siguiente. Lanza hechizos que técnicamente nunca ocurrieron; hacienda tiene sentimientos al respecto.'
    voidwalker_boots: 'Crecidas, no cosidas, en las patas de una Vaciopolilla ducha en pisar de una nada a la siguiente. Efectos secundarios: zumbido leve y la certeza tenaz de haber olvidado algo.'
    volatile_extract: 'Un reactivo inestable que vibra audiblemente. Manejar con cuidado o no manejar en absoluto.'
    walker_belt: 'Bastante elegante, siempre que tu ídolo de la moda sea un cadáver ambulante.'
    walker_hat: 'La cabeza del portador anterior aún está dentro, aunque en considerablemente peor estado que el propio yelmo.'
    wallbreaker: 'Calificada para la mampostería de la que está hecho el propio muro. La calificación no fue teórica. Hay un agujero que lo demuestra.'
    war_barrow_key: 'Tallada para una cerradura que nunca debía abrirse dos veces.'
    warden_spear: 'Lanza ceremonial de un guardian brote, reconvertida a una violencia que los kweebec nunca perdonaron del todo.'
    warlord_plate: 'Cortada de una armadura demasiado vieja para datarla. El patrón de escamas no coincide con nada catalogado.'
    warped_staff: 'Secado incorrectamente causando una torsion permanente. Canaliza magia en espirales impredecibles. Apuntar es un concepto.'
    water: 'Agua pura y refrescante que apaga la sed y limpia el cuerpo de impurezas. Una sustancia rara en un mundo donde la mayoría de los líquidos quieren matarte.'
    waxseal_wafer: 'Fina, cristalina, y hermetica en cuanto endurece. Los manitas las acaparan y no admiten nada.'
    weald_heartplate: 'Crecido en corteza en torno a un corazón de musgo prensado, aún tibio como la madera viva sabe seguir estándolo. Al Oso Titán le falta un trozo de piel de forma muy parecida.'
    weald_knot_belt: 'Atado con los mismos nudos-de-raíz con que los guías del Weald marcan un sendero seguro. Si esos nudos aún significan algo a tanta profundidad es otra cuestión.'
    wealdwarden_halberd: 'Portada por aquel a quien las manadas del Weald respetan lo bastante para no enfrentarlo solas. El uso en solitario es técnicamente posible. El Weald no lo recomienda.'
    weaver_daggers: 'Punta con glandula de seda de arana. El veneno es lento. El arrepentimiento, no.'
    weaver_silk_vest: "Hilada con seda de tejedora tan fina que es casi invisible. El sastre cobró el doble porque, cito textualmente, 'no puedes probar que no está ahí.'"
    weaving_solution: 'Fortalece las fibras textiles para resistir el abuso de combate. Los sastres remojan cada hilo en esto antes de coser algo serio.'
    weighted_club: 'Alguien metió piedras dentro de un tronco hueco y lo llamó ingeniería. Funciona. Los filósofos debaten si la intención basta para definir una herramienta. Los cráneos rotos, no.'
    welcome_doormat: 'Esteras de cerdas atadas a los tobillos. Absorberás todo lo que el mundo se limpie en ti, y dirás bienvenido.'
    wheat: 'Los pacíficos granjeros pasan incontables horas cosechando este grano, solo para que los soldados lo quemen como leña de asedio una semana después.'
    wheat_barley: 'Una humilde gavilla de cebada verde pálido, sus granos rechonchos preñados de la promesa de pan o cerveza.'
    wheat_burnt: 'Un puñado de grano ennegrecido por el fuego, su promesa dorada reducida a carbón y un amargo recuerdo.'
    wheat_draconize: 'Trigo cultivado en suelo volcánico empapado de sangre dracónica, con granos tan ardientes que hierven el agua al contacto. Una sola barra alimenta a una familia durante una semana, suponiendo que la familia disfrute de la combustión interna.'
    wheat_flour: 'Algunos aventureros sueñan con espadas legendarias, otros con baguettes crujientes recién salidas del horno. Estos últimos suelen vivir más tiempo, aunque con mucha menos gloria.'
    wheat_malt: 'Algunos guerreros prefieren su coraje fermentado, otros destilado — este grano satisface ambas filosofías.'
    wheat_purple: 'Los campesinos han aprendido por las malas que cosechar cultivos brillantes es la principal causa de hechicería espontánea en las comunidades agrícolas.'
    wheat_suize: 'La cosecha fue tradicional; la autenticación fue todo lo contrario, inmortalizada para siempre en el abrazo gélido de la blockchain.'
    wheat_tanjirize: 'Tallos dorados cosechados de los campos ancestrales del cazador de demonios, aún vibrando con el calor de un sol que nunca se pone del todo.'
    wheat_ukraine: 'Este trigo resistente se alza hacia horizontes lejanos, sus fibras teñidas del azul de cielos despejados y del oro de estepas infinitas.'
    wheat_white: 'Cosecha de gran altitud bendecida con inscripciones antiguas para sobrevivir el largo invierno.'
    whisker_bundle: 'Seis bigotes de feran, cada uno un instrumento de precision que el feran querria de vuelta con ganas.'
    whisker_weave_belt: 'Seis feranes contribuyeron, a su pesar, a un cinturon que ninguno se dejara ver usando jamas.'
    whittled_shortbow: 'Tallado durante un turno de guardia aburrido. La cuerda es de hierba trenzada. Alcance efectivo: tu imaginacion.'
    widow_club: 'Envuelta en seda de viuda que se endurece al impacto. Las aranas no donaron su seda voluntariamente.'
    widow_fang_daggers: 'Dos colmillos de dos viudas diferentes. Siguen sin llevarse bien.'
    widow_thread: 'Finisima como gasa, absurdamente fuerte. Hilada por algo que come presas cuatro tallas mas de lo razonable.'
    widows_kiss_daggers: ''
    wildling_bow: ''
    wildling_shortbow: 'Robado de un campamento salvaje. No se consulto a los duenos.'
    wildling_spear: ''
    wildlord_club: ''
    wildlord_war_girdle: 'Abrochado antes de cada lista. Nunca abrochado por un buen motivo.'
    windfire_cuirass: 'No logra decidirse entre afinidad de fuego o aire. Te quema la espalda, te hiela el pecho.'
    windshear_loop: 'Gira libremente en tu dedo como si intentara escapar. El encantamiento funciona según lo previsto.'
    windslicer_gloves: 'Finos como una promesa, rápidos como una excusa. Perfectos para dedos ágiles.'
    windstrider_sandals: 'Suficientemente abiertas para drenar rápido. Los pies mojados se secan antes que con botas pesadas.'
    windwalker_vest: 'Suficientemente ligero para seguir el paso de la columna. Los tambores de marcha no llevaban nada más pesado.'
    wisdoms_embrace_gauntlets: 'Contaba cada requisición dos veces antes de firmar. Costumbres así no mueren fácilmente.'
    wither_concentrate: 'Embotellado desde la podredumbre más profunda del cenagal. El corcho rara vez aguanta hasta el intendente.'
    wither_pastry: 'Un pastel que descompone todo lo organico que toca excepto a si mismo. Reactivo necrotico controlado.'
    wither_petal: ''
    witherbloom: 'Una flor que alcanza el pleno esplendor de su florecimiento solo en los momentos finales de su descomposicion, con petalos que se despliegan con un sentido teatral del tiempo que sugiere gusto por lo dramatico. Los poetas componen elegias enteras sobre ella, mientras los alquimistas simplemente anotan su tasa de descomposicion con desapego clinico.'
    wizard_staff: 'Disfrazado de baston. El fuego en la punta es menos convincente.'
    wolf_fang_blade: 'Una hoja con colmillos de lobo incrustados en el filo. El lobo no se ofrecio voluntario.'
    wolf_pelt: 'Cuero grueso de lobo del bosque. Cálido, duradero, y lleva un leve almizcle que pone muy incómodos a los caballos.'
    wolf_sinew: 'Elástico y resistente. Los arqueros pagan buen dinero por estos. La opinión del lobo al respecto ya no es relevante.'
    wolf_sinew_band: 'Trenzado con tendon de lobo alfa. Se tensa, casi imperceptiblemente, cuando estas a punto de cometer un error.'
    wolf_sinew_belt: 'El alfa no cedió sus tendones voluntariamente. Pero los alfas nunca se ofrecen voluntarios para nada que no sea violencia. Al menos este ahora sirve para sujetar pantalones.'
    wolf_trek_boots: 'Perteneció a un lobo que dejo atras caminando a todo cazador que Pandora le envio.'
    wolfbone_blade: 'El mango está tallado en el fémur de un lobo de bosque. Aúlla con vientos fuertes, lo que según la dudosa lógica de que el enemigo se distraerá con el ruido es una ventaja táctica.'
    wolfcrest_helm: 'Coronado con una cabeza de lobo preservada que mira al frente con una expresión entre amenazante y ligeramente molesta. El taxidermista estaba aparentemente borracho, lo que explica los ojos ligeramente bizcos y la lengua que asoma por el lado izquierdo.'
    wooden_greataxe: 'Mas poste de valla que arma. Las astillas hacen la mitad del dano.'
    wool_fists: "Nada grita 'luchador desesperado' como golpear enemigos con subproductos del ganado convertidos en armas."
    woolame_old: 'Recuperada de las profundidades brillantes del tracto digestivo de un wooligan, esta hoja luce el brillo inconfundible de la supervivencia gástrica.'
    woolamu: 'Este mechón de lana hilada calienta el pecho, pero no aporta nada más al campo de batalla. Al menos, quien lo lleve morirá calentito.'
    woolano: 'El accesorio perfecto para héroes que prefieren joyería lavable a máquina.'
    wooliboots: 'Perfectas cuando el frío se cuela por las tablas del suelo y la dignidad ya ha salido por la puerta.'
    wooligan_hammer: 'El wooligan lo usaba para aplanar la hierba. Tu le encontraste un uso mas creativo.'
    wooligan_hat: 'Garantizado para mantener la cabeza caliente, aunque lamentablemente no el cerebro de dentro.'
    wooling_fleece: 'Un mechón de lana grasienta arrancado de un cordero que no consintió en absoluto. Huele a arrepentimiento y suelo de granero.'
    wooling_practice_bow: 'Encordado con tripa de wooling. El sacrificio del wooling fue involuntario pero apreciado.'
    worldbreaker_battleaxe: ''
    worldheart_striders: 'Con suela de algo extraído de lo más hondo de la fractura, palpitando aún débilmente a un ritmo que nadie ha equiparado exactamente a un latido — pero que nadie ha descartado tampoco.'
    worldsplitter: 'Cuenta la leyenda que el primer golpe de prueba abrió un cañón. La leyenda exagera, pero solo un poco.'
    worldwound_brew_of_closing_age_genesis: 'Una de las últimas recetas anotadas antes de que los alquimistas dejaran de anotar nada. Funciona; la nota al margen que explica por qué no ha sobrevivido.'
    worldwound_brew_of_closing_age_scar: 'Reducida hasta resistir el tipo de lesión que reparte la Herida, es decir, aquellas de las que nadie espera salir con vida. Algunos lo consiguen ahora.'
    worldwound_carapace_of_world_wound: 'Crecido, no forjado, de una concha que la propia Herida empezó y nunca terminó. Los huecos están justo donde perdió el interés.'
    worldwound_circle_of_closing_age: 'Forjado en los últimos años, cuando los joyeros dejaron de firmar su obra. Nadie estaba seguro de que quedara alguien para leer el nombre.'
    worldwound_circle_of_world_wound: 'Un aro doblado de un solo filamento de metal-herida, cerrado tan sin costura que no sabrías decir dónde empezó. El metal sí. Y lo lleva a mal.'
    worldwound_edge: 'Trazado siguiendo la misma línea por la que se rasgó la realidad cuando la Cicatriz se abrió. La herida recuerda la forma que dejó el corte; la hoja recuerda la herida.'
    worldwound_fists_of_closing_age: 'Forjados cerca del fin de todo, cuando los herreros dejaron de decorar y se pusieron a hacer solo cosas que aguantaran. Estos aguantan.'
    worldwound_fists_of_world_wound: 'Con los nudillos placados en vidrio-herida que se descascarilla un poco con cada golpe. Inquietante para el enemigo; el resto lo considera desgaste aceptable.'
    worldwound_pendant: 'Guarda una esquirla de la propia Herida, sellada al modo del Oráculo de la Herida, que sella todo lo demás — con cuidado, y sin mucha confianza en que aguante.'
    worldwound_warboots_of_closing_age: 'Con suela para morder el borde resbaladizo de la Herida, donde un paso en falso es también, cómodamente, el último por el que tendrás que preocuparte.'
    wound_key: 'Soldada en torno a aquello que el Oráculo mantiene sellado en el centro de la Cicatriz. No gira tanto como se la persuade, y solo por un momento.'
    wound_marked_composite: 'Un material estratificado que lleva la marca de la Herida de lado a lado, de modo que cortarlo nunca elimina la marca — solo hace dos.'
    wound_marked_elixir: 'La versión sencilla que los suturadores reservan para sí, sin la puesta en escena que montan para los peregrinos. Sabe peor y actúa más rápido.'
    wound_marked_elixir_of_origin_line: 'Destilado por la orden de sutura con los residuos de su propia labor, que juran inofensivo y beben ellos mismos para demostrarlo. De momento siguen aquí.'
    wound_marked_greataxe_of_final_scar: 'Lleva una muesca que la Herida le puso cuando el herrero aún no la había tocado. El herrero trabajó alrededor de la muesca, con la sensata teoría de que estaba ahí por algo.'
    wound_marked_lattice_genesis: 'El mismo retículo formado en el respiradero más antiguo de la montaña en lugar de la Cicatriz, donde sale más limpio y, juran los artesanos, vagamente ufano al respecto.'
    wound_marked_lattice_scar: 'Un armazón quebradizo formado siguiendo el labio de la Cicatriz, donde el cristal adopta la forma del propio quiebre, lo quiera el artesano o no.'
    wound_marked_loop: 'Rozado una vez por la Herida y con una cicatriz propia, que el anillo luce con más gracia de la que logran la mayoría de sus portadores.'
    wound_marked_vambraces_of_origin_line: 'Rayados con la misma marca que la Herida deja en cuanto roza. Los herreros la añadieron a propósito, cosa que la Herida juzgó innecesaria y un poco insultante.'
    wound_pilgrim_boots: 'Con suela para el largo ascenso hasta la Herida y, menos a menudo, para la bajada. Casi ningún par hace más que el viaje de ida.'
    wound_salve: 'Embutido en las grietas que la propia Cicatriz se niega a cerrar, pensado para las heridas que ella misma ha causado. También sirve para lesiones menores, que es la única clemencia del asunto.'
    wound_ward_bow: 'Encordado para lanzar flechas siguiendo las líneas de fractura de la Cicatriz sin ensancharlas más, una disciplina que los Fragmentos del Muro imponen sin excepción.'
    woundstitch_grips: 'Cosidos por los Sacerdotes de Sutura con lo que sostiene una costura a la altitud del cénit, es decir, con poca cosa, y no por mucho tiempo.'
    woundwall_pike: 'Clavada a lo largo del último muro que los peregrinos tienen permitido cruzar, más mojón que arma — hasta que alguien intenta cruzarlo de todas formas.'
    wraith_banner: ''
    wraith_boots: 'Cada paso resuena a través de dos planos a la vez. Los vecinos de ambos han presentado una queja formal por ruido, y por una vez, ambas quejas coinciden en cada detalle.'
    wraith_crowned_helm: 'La corona aún vibra con los últimos pensamientos de su antiguo dueño, y la mayoría, resulta, son arrepentimientos. Unos pocos, extrañamente específicos, tratan de una lista de la compra que nunca llegó a terminar.'
    wraith_grimoire: 'Un recuento vivo de deudas de los muertos. Se actualiza solo. Nunca a tu favor.'
    wraith_lantern_shard: 'Partida de la linterna que un espectro lleva a todas partes por donde vaga. La llama en su interior nunca fue fuego — es memoria, y la memoria, resulta, arde considerablemente más despacio.'
    wraith_lantern_staff: 'Coronado con un farol que los Espectros de Piedra-Nave usan para atraer a los barqueros fuera de los caminos seguros. Todavía arde frío, y todavía funciona.'
    wraith_scripture: 'Se escribe solo cuando nadie mira, con una letra que cambia junto con quien lo lea. Los eruditos que lo han estudiado no se ponen de acuerdo sobre si eso es fascinante o profunda y personalmente alarmante. Normalmente es ambas cosas.'
    wraith_spellbook: 'Escrito por alguien con opiniones muy firmes sobre el servicio al cliente del mas alla.'
    wraith_touch_gauntlets: 'Todo lo que tocan queda leve, cortésmente muerto. Más o menos el efecto de tu vida amorosa, han señalado varios parroquianos de la taberna, salvo que ahora al menos se puede llevar puesto.'
    wraith_whisper_amulet: 'Un colgante translúcido que murmura en una lengua que casi logras seguir. Su último dueño tradujo exactamente una palabra antes de venderlo con prisa: detrás. Nadie desde entonces ha pedido una segunda.'
    wraith_whisper_knives: 'Templadas en ectoplasma de espectro, cortan limpiamente la armadura y, algo menos limpiamente, el sueño. Las heridas cierran bien, según informan las víctimas. Los sueños, nunca del todo.'
    yajin_starter_dagger: 'Las hojas gemelas de Yajin han visto días mejores, sus filos desafilados por innumerables intentos fallidos de violencia.'
    yeast: 'Una cepa virulenta de hongo parásito que se clava en la carne y no suelta.'
    yeast_cake: 'Un pastel de masa fermentada que huele a ambicion y mala ventilacion. Los manitas lo usan como sellador.'
    yeti_frostbite_daggers: 'Talladas de las garras de un yeti en plena ventisca. Cada corte viene con escalofrío de regalo.'
    yeti_fur_tuft: 'Blanco como nieve fresca, cálido como la culpa. El yeti ya no lo necesitaba. Insiste en ello.'
    yeti_jawbreaker: 'Llamado así por lo que hace a las mandíbulas, hecho de lo que alguna vez tuvo una.'
    yeti_scalp_hood: 'Huele a algo que era definitivamente, probablemente, casi con certeza real.'
    yeti_skull_crown: 'Cráneo de yeti hueco, reconvertido en tocado. El propietario original no presentó ninguna queja.'
    yetihide_stompers: 'Botas forradas con piel de yeti. Garantizan pies calientes y enemigos a raya. El olor por sí solo ya es un arma.'
    zenith_alloy: 'Una aleación que solo cuaja en la fragua más alta de la montaña, donde el aire es tan tenue que los herreros juran que deja de llevarles la contraria. Conserva un filo que nada de más abajo iguala.'
    zenith_crown: 'La lleva el peregrino que más alto asciende por la cima fracturada hasta que la escalada acaba con él. Ha cambiado de cabeza más veces de las que su portador actual quisiera pensar.'
    zenith_greaves: 'Placadas para sobrevivir a la ascensión de la cima fracturada, las articulaciones reforzadas allí donde a casi todos los peregrinos les ceden antes las rodillas.'
    zenith_signet: 'Marca a su portador como alguien que estuvo en el verdadero cénit, antes de la fractura, según una afirmación que exactamente nadie con vida puede confirmar ni desmentir.'
    zenith_staff: 'Tallado de una esquirla de la cima original del cénit; la Cicatriz se llevó todo lo demás. Apunta certero hacia lo que aún sigue en pie.'
    zenithscar_draught: 'Sacado del agua de deshielo que se estanca al pie de la Cicatriz y queda clara si esperas, turbia si tienes prisa. Aquí casi todos los que beben tienen prisa.'
    zenithscar_draught_of_summit_vigil: 'Lo bastante amargo para mantener despierto a un centinela durante una guardia que la parte tranquila de él preferiría dormir. No respeta ni los deseos del centinela ni los del enemigo.'
    zenithscar_fangs: 'Dos hojas afiladas en las paredes opuestas de la misma grieta, por lo que nunca quedan del todo paralelas. La separación cumple una labor que preferirías callar.'
    zenithscar_greatblade: 'Equilibrado siguiendo la costura exacta por donde el mundo se partió, de modo que siempre sabe hacia qué lado caer. Normalmente sobre alguien.'
    zephyr_legwraps: 'Tan ligeras que parece que no llevas nada. Lo cual también es una opción, pero menos protectora.'
    zephyr_silk_strand: 'Hilo de seda infundido con viento que flota solo. Los sastres lo adoran. Sus gatos lo consideran un enemigo personal.'
    zukin_muru: 'A shinobi cowl for people who want to look like they left quietly, even when they slam the door.'
