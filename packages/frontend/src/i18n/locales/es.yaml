    critical_hits: GOLPES CRÍTICOS
    crit_desc: Cada hechizo o arma tiene su propia probabilidad de crítico base, expresada como una posibilidad de 1 entre N. La estadística de Crítico reduce N, pero la probabilidad final nunca puede superar 1 entre 2 (50 %).
    crit_bonus_desc: En un golpe crítico, el hechizo aplica sus efectos críticos dedicados (más daño o efectos adicionales) en lugar de los normales.
    blocking: ESCUDOS
    blocking_desc: Algunos hechizos otorgan un escudo que absorbe el daño entrante de un elemento correspondiente hasta agotarse. No hay aguante ni postura de guardia, los escudos son la única absorción de daño.
    resistance: RESISTENCIA
    resistance_desc: La resistencia elemental es una reducción porcentual aplicada al daño final, con un tope del 50% por elemento. La resistencia negativa (una debilidad) amplifica el daño en su lugar.
    mob_level_bands: BANDAS DE NIVEL DE MOBS
    mob_level_bands_desc: Dentro de un rango de niveles, la vida, XP, Agilidad, Sabiduría, resistencia positiva y valores escalables de hechizos suben del 60% al 160%. Los PA y PM suben del 100% al 130%. La resistencia negativa usa la curva inversa, reduciendo la debilidad del 160% en el nivel mínimo al 60% en el máximo.
    life_steal: ROBO DE VIDA
    life_steal_desc: 'Los efectos de hechizo de drenaje infligen daño y curan al lanzador la mitad de la vida que el objetivo pierde realmente. Solo el drenaje de un jugador cura: un mob que lanza el mismo hechizo inflige su daño y no se cura nada.'
    life_steal_note: El daño pasa primero por la fórmula de daño estándar, luego el lanzador se cura la mitad de la vida que el objetivo previsto perdió realmente — un golpe redirigido a otro combatiente, o convertido en curación por el objetivo, no devuelve nada.
    chatiment: CASTIGO
    chatiment_desc: Castigo convierte los PdV no letales realmente perdidos en su característica. Cada turno de combatiente activo tiene su propio límite; los turnos posteriores crean bonificaciones separadas de cinco turnos. El daño de monstruos cuenta por completo. El daño procedente de jugadores y su límite se reducen a la mitad. Ares no utiliza erosión.
    healing: CURACIÓN
    healing_desc: Las curaciones aplican el valor base del hechizo, escalado por un porcentaje de tu Inteligencia, más un bono de Curación fijo del equipo y las mejoras. La curación está limitada a los PV máximos del objetivo.
    healing_intel_value: +1% de curación por punto de Inteligencia
    heal_bonus: Bono de curación
    heal_bonus_value: Bono fijo del equipo/mejoras, añadido después del escalado de Inteligencia
    mobs: Monstruos
    healing_mobs_value: Escala solo con Inteligencia, sin bono de curación
    leveling_desc: Nivel máximo 200. Combate mobs dentro de tu rango de nivel para XP óptima.
    points_per_level: PUNTOS POR NIVEL
    stat_points: Puntos de stat
    stat_points_value: '{{n}} por nivel'
    stat_costs_desc: El coste depende de la clase y del valor natural actual. La página de cada clase muestra la escala completa.
    spell_points: Puntos de hechizo
    spell_points_value: '{{n}} por nivel'
    xp_milestones: HITOS DE XP
    level_10: Nivel 10
    level_50: Nivel 50
    level_100: Nivel 100
    base_stats: STATS BASE
    stat_vitality: Vitalidad
    stat_vitality_desc: +1 PV máx por punto
    stat_wisdom: Sabiduría
    stat_wisdom_desc: Bono de XP
    stat_strength_desc: Escalado de daño de tierra
    stat_intelligence_desc: Daño fuego, escalado de curación
    stat_chance_desc: Daño agua, más botín
    stat_agility_desc: Escalado de daño de aire
    derived_formulas: FÓRMULAS DERIVADAS
    max_health: VIDA MÁX
    loot_desc: Cada mob derrotado tira una vez cada entrada de su tabla de botín. Una entrada exitosa produce una cantidad aleatoria dentro de su rango definido.
    stat_rolling: TIRADA DE STATS
    stat_rolling_desc: Cada stat se tira uniformemente dentro de su rango de plantilla. Cada valor tiene la misma probabilidad.
    archimobs: MOBS ARCHI
    archimobs_desc: 0,5% de probabilidad de aparecer como el archimob del mob en su lugar — una variante con nombre, permanentemente más fuerte. El único mecanismo de rareza que tienen los mobs.
    max_members: Miembros máx
    groups_desc: Un grupo es una plantilla compartida de hasta {{max}} jugadores con elección de líder. Estar agrupado no hace nada por sí solo en un combate — todos, agrupados o no, deben enviar su propia transacción de unión al combate para entrar; no hay inclusión pasiva ni por proximidad.
    groups_xp: REPARTO DE XP
    groups_xp_desc: Los mobs derrotados forman una reserva de XP base. Los combatientes aptos le dan el coeficiente de grupo Retro, la diferencia entre los niveles totales de jugadores y mobs la reduce y después cada jugador recibe la parte correspondiente a su nivel dentro del total del grupo. Un jugador por debajo de un tercio del nivel del jugador más alto no aumenta el coeficiente. La Sabiduría se aplica al final; el daño personal no importa.
    groups_loot: REPARTO DE BOTÍN
    groups_loot_desc: Cada mob derrotado realiza una única tirada de botín compartida. Los drops exitosos se asignan por turnos entre los jugadores ganadores; añadir jugadores no crea tiradas extra.
    dungeons_desc: Encuentra un portal en una zona explorada, gasta su llave y completa las salas en orden. Cada portal tiene su propia sala de espera en vivo.
    dungeon_entry: Entrada
    dungeon_entry_value: Una llave en un portal de zona descubierto
    dungeon_instance: Instancia
    dungeon_instance_value: Sala local del portal con combates públicos o de grupo
    dungeon_completion: Completar
    dungeon_completion_value: Despejar todas las salas
    dungeon_reward: Recompensa
    dungeon_reward_value: Distribución estándar de botín
    classes_desc: 12 clases. Las armas son universales — cualquier clase puede equipar y usar cualquier tipo de arma — pero empuñar el arma diseñada para tu clase otorga +10% de daño y daño crítico. Cada clase desbloquea sus hechizos en niveles fijos a medida que subes de nivel.
    table_class: CLASE
    table_weapon: AFINIDAD
    table_hp: PV
    role_warrior: Guerrero
    role_assassin: Asesino
    role_berserker: Berserker
    role_druid: Druida
    role_chronomancer: Cronomante
    role_guardian: Guardián
    role_archer: Arquero
    role_prospector: Prospector
    role_brawler: Luchador
    role_tomoda: Maestro de bestias
    role_gambler: Apostador
    role_healer: Sanador
    weapon_daggers: Dagas
    weapon_spear: Lanza
    weapon_bow: Arco
    weapon_axe: Hacha
    weapon_sword: Espada
    marketplace: MERCADO
    marketplace_desc: El equipo y los personajes se listan en el kiosco al precio que elijas; los compradores pagan al instante. Los recursos se intercambian por SUI en pools de swap en su lugar, sin anuncios. Cada venta paga una regalía del 10% — el mercado es la única forma de vender.
    section_forgemagie: FORGEMAGIA
    forgemagie_desc: La forgemagia es el sistema de runas. Tritura equipamiento para obtener runas, luego aplícalas en otro equipo para modificar sus estadísticas. Un sistema de alto riesgo y alta recompensa para perfeccionar el equipamiento.
    crushing: TRITURADO
    crushing_desc: 'Cada línea de stat del objeto triturado se evalúa independientemente — stats más altas y pesos más pesados producen más runas. No hay servidor: el divisor de rendimiento combina una curva fija por nivel de objeto con el taux propio de la plantilla del objeto, un coeficiente de inflación on-chain compartido (1%-4000%) que el propio triturado baja para esa plantilla y sube para sus vecinas.'
    crushing_tiers_desc: El nivel de runa (Ba/Pa/Ra) se selecciona probabilísticamente. Stats más altas favorecen runas Ra.
    rune_tiers: NIVELES DE RUNAS
    rune_ba: 'Tier 1: menor peso por runa'
    rune_pa: 'Tier 2: peso medio por runa'
    rune_ra: 'Tier 3: mayor peso por runa, doble XP'
    rune_weight_desc: El peso parte de valor × peso unitario; Retro redondea hacia arriba al peso entero. Se calcula automáticamente.
    rune_table_stat: STAT
    rune_table_note: Las runas de Alcance, Movimiento y Acción se aplican una sola vez cada una; Probabilidad Crítica hasta 10 veces. Crítico y Resultados Críticos no tienen runa alguna.
    rune_stat_range: Alcance
    rune_stat_movement: Movimiento
    rune_stat_action: Acción
    rune_stat_raw_damage: Daño bruto
    rune_stat_critical_chance: Probabilidad crítica
    rune_stat_earth_resist: Resistencia tierra
    rune_stat_fire_resist: Resistencia fuego
    rune_stat_water_resist: Resistencia agua
    rune_stat_air_resist: Resistencia aire
    stat_unit_weights: PESOS UNITARIOS DE STATS
    stat_unit_weights_desc: Cada stat tiene un peso unitario que refleja su poder en combate. Los items con líneas de stats pesadas generan más runas al triturar, consumen más presupuesto y son más difíciles de sobre-forjar.
    rune_application: APLICACIÓN DE RUNAS
    rune_application_desc: 'Desbloqueada temporalmente en el nivel 1 del oficio de artesanía correspondiente a la categoría del equipo para realizar pruebas. Aplica runas una a una para modificar sus stats. Hay tres resultados posibles:'
    outcome_critical_success: Éxito Crítico
    outcome_critical_success_desc: La runa pasa, sin pérdida de stats
    outcome_neutral: Éxito Neutro
    outcome_neutral_desc: La runa pasa, otras stats pueden bajar
    outcome_critical_failure: Fallo Crítico
    outcome_critical_failure_desc: La runa falla, stats perdidas igual al peso de la runa
    success_rate: TASA DE ÉXITO
    success_rate_desc: 'El éxito depende de cuán cerca está la stat de su máximo: cerca del 0% es ~99% de éxito, cerca del máximo es ~50%, y las stats exóticas se quedan en ~1% sin importar el nivel. Que un éxito sea Crítico (sin pérdida) o Neutral (peso pagado) varía de la misma forma, más un pequeño +0,2% por nivel de oficio por encima de 1. No hay límite en qué nivel de objeto puede trabajar tu oficio.'
    puits: POZO (PUITS)
    puits_desc: Un contador de peso, visible en la interfaz, que se acumula cuando las pérdidas de stats superan el peso de la runa. Absorbe pérdidas futuras antes de que otras stats se vean afectadas. Persiste en el objeto y lo acompaña entre bancos y propietarios.
    over_maging: SOBRE-FORJA
    over_maging_desc: Lleva las stats por encima de su máximo natural. Cada línea de stat tiene un tope de 101 de peso extra. El máximo de sobre-forja depende del peso unitario de la stat — una stat ligera como la Vitalidad (peso 0,25) puede empujarse ~404 puntos de más, una pesada como la Sabiduría (peso 3) solo ~33.
    forgemagie_tips: CONSEJOS
    forgemagie_tips_desc: 'Para exótico/over-mage: quita primero las stats baratas para acumular un gran pozo, luego pasa la stat difícil con el colchón, después vuelve a añadir las stats perdidas (fácil ya que están lejos del máximo). Las stats exóticas y over-mageadas se pierden primero en caso de fallo.'
    forgemagie_xp: EXPERIENCIA
    forgemagie_xp_desc: 'La XP solo se otorga en éxito (Crítico o Neutral). Los objetos de mayor nivel y las runas más pesadas dan significativamente más XP. Las runas Ra otorgan el doble de XP comparado con las runas Ba y Pa. Fórmula: max(1, pesoRuna × (1 + nivelObjeto / 50) × multiplicadorTier) donde el multiplicador es 2 para Ra, 1 en otro caso.'
    action_points: PUNTOS DE ACCIÓN (PA)
    movement_points: PUNTOS DE MOVIMIENTO (PM)
    critical_stat: CRÍTICO
    wisdom_xp: BONO DE XP DE SABIDURÍA
    wisdom_xp_desc: Cada punto de Sabiduría efectiva, incluidos los efectos activos, añade un 1 % a la XP obtenida. Con 100 de Sabiduría efectiva obtienes el doble de XP.
    chance_loot: SUERTE Y BOTÍN
    chance_loot_desc: La Suerte efectiva media del equipo ganador, incluidos los efectos activos, multiplica cada probabilidad de drop resuelta. Con 600 de Suerte media, la probabilidad se duplica. Nunca puede superar el 100%.
    mob_loot_band: NIVEL DEL MOB Y DROP
    mob_loot_band_desc: La probabilidad definida es el punto medio. Un mob de nivel mínimo usa el 80% y uno de nivel máximo el 120%, con tope del 100%. Los mobs de nivel fijo usan exactamente la probabilidad definida. La cantidad no escala con el nivel.
