    combat_desc: Le combat est au tour par tour sur une grille. À votre tour, vous dépensez des Points d'Action (PA) pour lancer des sorts et des Points de Mouvement (PM) pour vous déplacer. La ligne de vue est un indicateur propre à chaque sort — la plupart des sorts l'exigent, certains non. Vous affrontez des groupes de monstres dans le monde et d'autres joueurs au Kolizeum. Les dégâts dépendent de la stat élémentaire correspondante et de tout bonus de dégâts bruts.
    elements: ÉLÉMENTS
    element_earth: TERRE
    element_fire: FEU
    element_water: EAU
    element_air: AIR
