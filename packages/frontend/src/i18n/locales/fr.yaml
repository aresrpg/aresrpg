    blocks:
      - 'Composition d’actions : construisez les mêmes transactions que celles envoyées par le jeu.'
      - 'Planification hors ligne : consultez les recettes et la progression sans signataire.'
      - 'Simulation de combat : planifiez un tour avant de le valider.'
