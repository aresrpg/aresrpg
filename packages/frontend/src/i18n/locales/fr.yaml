  job_desc:
    FARMER: Les fermiers recoltent des cereales dans les champs. Les paliers superieurs debloquent des cultures rares pour les recettes avancees.
    HERBALIST: Les herboristes cueillent plantes et fleurs pour l'alchimie. Chaque palier necessite un niveau de metier plus eleve.
    MINER: Les mineurs extraient minerais et mineraux des gisements. Les metaux rares se debloquent avec la progression.
    SWORD_SMITH: Les forgerons d'epees fabriquent epees longues, epees et dagues a partir de minerais et alliages.
    AXE_SMITH: Les forgerons de haches fabriquent haches et haches de bataille. Armes devastatrices en metaux raffines.
    BLUNT_SMITH: Les forgerons de masses creent masses et gourdins. Armes contondantes pour guerriers de premiere ligne.
    STAFF_CARVER: Les sculpteurs de batons faconnent batons et grimoires. Outils essentiels pour les lanceurs de sorts.
    BOWYER: Les archetiers fabriquent arcs et lances. Armes de precision pour combattants agiles.
    ARMORSMITH: Les armuriers forgent casques et plastrons. Armure lourde pour protection physique maximale.
    TAILOR: Les tailleurs cousent pantalons et bottes. Armure legere favorisant l'agilite et la mobilite.
    TANNER: Les tanneurs fabriquent ceintures et gantelets. Accessoires polyvalents aux stats equilibrees.
    JEWELER: Les bijoutiers creent amulettes et anneaux. Accessoires aux puissants bonus magiques.
    ALCHEMIST: Les alchimistes preparent potions a partir de plantes. Consommables de soin et d'amelioration au combat.
    BAKER: Les boulangers préparent pains et nourriture à partir de céréales. Consommables restaurant la santé.
    HANDYMAN: Les bricoleurs fabriquent cles, outils et objets utilitaires. Essentiels pour donjons et activites speciales.
