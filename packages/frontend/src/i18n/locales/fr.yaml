  faq: FAQ
  wallet_description: Votre portefeuille personnel. Vous seul pouvez y accéder. Déposez
    du SUI pour les frais réseau et les échanges entre joueurs.
  moonpay_desc: Carte bancaire, Apple Pay, virement
  transak_desc: Carte bancaire, virement, 100+ pays
  faq_what_is_sui: Qu'est-ce que le SUI ?
  faq_what_is_sui_answer: Le SUI est une monnaie numérique, comme de l'argent dématérialisé.
    Il vit sur un réseau rapide et sécurisé appelé la blockchain Sui. Vous utilisez
    de petites quantités de SUI pour les frais réseau et les échanges entre joueurs.
  faq_why_sui: Pourquoi AresRPG utilise le SUI ?
  faq_why_sui_answer: Le SUI est notre moyen de paiement privilégié. Les transactions
    sont instantanées (moins d'1 seconde) et coûtent une fraction de centime. Aucun
    intermédiaire. Nous pourrions supporter les devises traditionnelles (USD, EUR,
    etc.) à l'avenir, mais cela nécessite un travail juridique conséquent et implique
    des frais et taxes importants que nous ne sommes pas prêts à assumer.
  faq_legal: Est-ce légal ?
  faq_legal_answer: Oui. Acheter et détenir de la cryptomonnaie est légal dans la
    plupart des pays. Le SUI est un actif numérique légitime échangé sur les principales
    plateformes réglementées au monde. AresRPG l'utilise pour les frais réseau et les
    échanges entre joueurs.
  faq_eula: Est-ce autorisé par les conditions du jeu ?
  faq_eula_answer: Oui. Tant que la cryptomonnaie est utilisée uniquement comme moyen
    de paiement et n'implique pas de NFT ou de schémas spéculatifs, c'est totalement
    conforme. De nombreuses grandes boutiques de jeux acceptent elles-mêmes les paiements
    en crypto.
  faq_access: Qui peut accéder à mon portefeuille ?
  faq_access_answer: "Vous seul. Votre portefeuille est créé à partir de votre connexion
    Google via la technologie zkLogin de Sui. Personne (pas même l'équipe AresRPG)
    ne peut accéder à vos fonds ou les déplacer. Important : ce portefeuille est destiné
    uniquement à votre activité AresRPG. N'y stockez pas de grosses sommes."
  faq_balance: J'ai envoyé du SUI mais mon solde n'a pas changé ?
  faq_balance_answer: Pas de panique. Notre système de rafraîchissement peut être
    temporairement lent. Vérifiez que vous avez envoyé le SUI à la bonne adresse (copiez-la
    ci-dessus), et si le problème persiste, contactez l'équipe sur Discord avec votre
    identifiant de transaction.
