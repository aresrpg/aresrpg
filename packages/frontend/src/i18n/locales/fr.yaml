    table_hp: PV
    role_warrior: Guerrier
    role_assassin: Assassin
    role_berserker: Berserker
    role_druid: Druide
    role_chronomancer: Chronomancien
    role_guardian: Gardien
    role_archer: Archer
    role_prospector: Prospecteur
    role_brawler: Bagarreur
    role_tomoda: Maître des bêtes
    role_gambler: Flambeur
    role_healer: Soigneur
    weapon_daggers: Dagues
    weapon_spear: Lance
    weapon_bow: Arc
    weapon_axe: Hache
    weapon_sword: Épée
    marketplace: MARCHÉ
    marketplace_desc: L'équipement et les personnages se listent sur le kiosque au prix de votre choix ; les acheteurs paient instantanément. Les ressources s'échangent contre du SUI dans des pools d'échange, sans annonce. Chaque vente paie une redevance de 10% — le marché est le seul moyen de vendre.
    section_forgemagie: FORGEMAGIE
    forgemagie_desc: La forgemagie est le système de runes. Concassez des équipements pour obtenir des runes, puis appliquez-les sur d'autres équipements pour modifier leurs stats. Un système risqué mais très rentable pour perfectionner son équipement.
    crushing: CONCASSAGE
    crushing_desc: "Chaque ligne de stat de l'objet concassé est évaluée indépendamment — des stats plus élevées et des poids plus lourds produisent plus de runes. Il n'y a pas de serveur : le diviseur de rendement combine une courbe fixe par niveau d'objet avec le taux propre au template de l'objet, un coefficient d'inflation on-chain partagé (1%-4000%) que le concassage lui-même fait baisser pour ce template et monter pour ses voisins."
    crushing_tiers_desc: Le palier de rune (Ba/Pa/Ra) est sélectionné de manière probabiliste. Des stats plus élevées favorisent les runes Ra.
    rune_tiers: PALIERS DE RUNES
    rune_ba: 'Tier 1: poids le plus faible par rune'
    rune_pa: 'Tier 2: poids moyen par rune'
    rune_ra: 'Tier 3: poids le plus élevé par rune, double XP'
    rune_weight_desc: Le poids part de valeur × poids unitaire ; Rétro arrondit le résultat à l'entier supérieur. Il est calculé automatiquement.
    rune_table_stat: STAT
    rune_table_note: Les runes Portée, Mouvement et Action s'appliquent une seule fois chacune ; Chance Critique jusqu'à 10 fois. Critique et Résultats Critiques n'ont aucune rune.
    rune_stat_range: Portée
    rune_stat_movement: Mouvement
    rune_stat_action: Action
    rune_stat_raw_damage: Dégâts bruts
    rune_stat_critical_chance: Chance critique
    rune_stat_earth_resist: Résistance terre
    rune_stat_fire_resist: Résistance feu
    rune_stat_water_resist: Résistance eau
    rune_stat_air_resist: Résistance air
    stat_unit_weights: POIDS UNITAIRES DES STATS
    stat_unit_weights_desc: Chaque stat a un poids unitaire reflétant sa puissance en combat. Les items avec des lignes de stats lourdes donnent plus de runes au concassage, consomment plus de budget et sont plus difficiles à sur-forger.
    rune_application: APPLICATION DE RUNES
    rune_application_desc: "Temporairement débloquée au niveau 1 du métier d'artisanat correspondant à la catégorie de l'équipement pour les tests. Appliquez les runes une par une pour modifier ses stats. Trois résultats sont possibles :"
    outcome_critical_success: Succès Critique
    outcome_critical_success_desc: La rune passe, aucune stat perdue
    outcome_neutral: Succès Neutre
    outcome_neutral_desc: La rune passe, d'autres stats peuvent baisser
    outcome_critical_failure: Échec Critique
    outcome_critical_failure_desc: La rune échoue, stats perdues égales au poids de la rune
    success_rate: TAUX DE RÉUSSITE
    success_rate_desc: "Le succès dépend de la proximité de la stat avec son maximum : près de 0% c'est ~99% de succès, près du max c'est ~50%, et les stats exotiques restent à ~1% quel que soit le niveau. Le fait qu'un succès soit Critique (aucune perte) ou Neutre (poids payé) varie de la même façon, plus un petit +0,2% par niveau de métier au-dessus de 1. Il n'y a aucune limite sur le niveau d'objet que votre métier peut travailler."
    puits: PUITS
    puits_desc: Un compteur de poids, affiché dans l'interface, qui s'accumule quand les pertes de stats dépassent le poids de la rune. Il absorbe les pertes futures avant que d'autres stats ne soient affectées. Se réinitialise quand l'objet quitte l'établi de forgemagie.
    over_maging: SUR-FORGE
    over_maging_desc: Poussez les stats au-delà de leur maximum naturel. Chaque ligne de stat est plafonnée à 101 de poids supplémentaire. Le max de sur-forge dépend du poids unitaire de la stat — une stat légère comme la Vitalité (poids 0,25) peut être poussée d'environ 404 points, une lourde comme la Sagesse (poids 3) seulement d'environ 33.
    forgemagie_tips: CONSEILS
    forgemagie_tips_desc: "Pour les exo/over : retirez d'abord les stats peu coûteuses pour accumuler un gros puits, puis passez la stat difficile avec le tampon, puis rajoutez les stats perdues (facile car loin du max). Ne déplacez pas l'objet en cours de session. Le puits se réinitialise. Les stats exotiques et over-magées sautent en premier en cas d'échec."
    forgemagie_xp: EXPÉRIENCE
    forgemagie_xp_desc: "L'XP n'est accordée que sur succès (Critique ou Neutre). Les objets de plus haut niveau et les runes plus lourdes donnent beaucoup plus d'XP. Les runes Ra octroient le double d'XP par rapport aux runes Ba et Pa. Formule : max(1, poidsRune × (1 + niveauObjet / 50) × multiplicateurTier) où le multiplicateur est 2 pour Ra, 1 sinon."
    action_points: POINTS D'ACTION (PA)
    movement_points: POINTS DE MOUVEMENT (PM)
    critical_stat: CRITIQUE
    wisdom_xp: BONUS D'XP DE SAGESSE
    wisdom_xp_desc: Chaque tranche de 6 Sagesse ajoute 1 % à l'XP gagnée. À 600 de Sagesse, vous gagnez le double d'XP.
    chance_loot: CHANCE & BUTIN
    chance_loot_desc: La Chance moyenne de l'équipe victorieuse multiplie chaque taux de drop résolu. À 600 de Chance moyenne, le taux double. Un taux de drop ne peut jamais dépasser 100%.
    mob_loot_band: NIVEAU DU MONSTRE & TAUX DE DROP
    mob_loot_band_desc: La chance définie est le point médian. Un monstre au niveau minimum en utilise 80%, et un monstre au niveau maximum 120%, avec un plafond de 100%. Un monstre à niveau fixe utilise exactement la chance définie. La quantité ne dépend pas du niveau.
