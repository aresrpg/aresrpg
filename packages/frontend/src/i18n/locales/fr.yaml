    dungeon_reward: Récompense
    dungeon_reward_value: Distribution standard du butin
    classes_desc: 12 classes. Les armes sont universelles — n'importe quelle classe peut équiper et utiliser n'importe quel type d'arme — mais manier l'arme conçue pour votre classe accorde +10% de dégâts et de dégâts critiques. Chaque classe débloque ses sorts à des niveaux fixes en progressant.
    table_class: CLASSE
