    stat_vitality_desc: +1 PV max par point
    stat_wisdom: Sagesse
    stat_wisdom_desc: Bonus de gain d'XP
    stat_strength_desc: Dégâts terre
    stat_intelligence_desc: Dégâts feu, mise à l'échelle du soin
    stat_chance_desc: Dégâts eau, plus de butin
    stat_agility_desc: Mise à l'échelle des dégâts air
    derived_formulas: FORMULES DÉRIVÉES
    max_health: VIE MAX
    loot_desc: Chaque entrée de butin a sa propre chance fixe, tirée indépendamment à la mort du monstre. La quantité est aléatoire dans la plage de l'entrée.
    stat_rolling: JET DE STATS
    stat_rolling_desc: Chaque stat est tirée uniformément dans sa plage de template. Chaque valeur a la même probabilité.
    archimobs: MOBS ARCHI
    archimobs_desc: 0,5% de chance d'apparaître à la place sous la forme du mob archi — une variante nommée, en permanence plus forte. Le seul mécanisme de rareté que les mobs possèdent.
    max_members: Membres max
    groups_desc: Un groupe est un roster partagé de jusqu'à {{max}} joueurs, avec élection de leader. Être en groupe ne fait rien à lui seul en combat — tout le monde, groupé ou non, doit envoyer sa propre transaction de participation au combat pour y entrer ; il n'y a aucune inclusion passive ou de proximité.
    groups_xp: PARTAGE DE L'XP
    groups_xp_desc: L'XP totale d'un combat gagné se répartit également entre chaque combattant, puis la Sagesse propre à chaque joueur et le bonus d'âge du groupe de mobs s'appliquent en plus. Les dégâts que vous avez personnellement infligés ne changent rien à votre part.
    groups_loot: PARTAGE DU BUTIN
    groups_loot_desc: Le butin n'est pas partagé. Chaque combattant victorieux tire indépendamment la table de butin complète du groupe de mobs avec sa propre stat de Chance — un groupe plus grand ne réduit les probabilités de personne.
    dungeons_desc: "Les donjons s'atteignent depuis n'importe où dans leur monde avec une clé — pas d'instance de groupe : tous les détenteurs de clé à l'intérieur partagent le même espace, comme dans le monde ouvert."
    dungeon_entry: Entrée
    dungeon_entry_value: Objet clé, depuis n'importe où dans le monde
    dungeon_instance: Instance
    dungeon_instance_value: Partagée — tous les détenteurs de clé se voient
    dungeon_completion: Complétion
    dungeon_completion_value: Nettoyer toutes les salles
    dungeon_reward: Récompense
    dungeon_reward_value: Distribution standard du butin
    classes_desc: 12 classes. Les armes sont universelles — n'importe quelle classe peut équiper et utiliser n'importe quel type d'arme — mais manier l'arme conçue pour votre classe accorde +10% de dégâts et de dégâts critiques. Chaque classe débloque ses sorts à des niveaux fixes en progressant.
