  item_descriptions:
    aberrant_edge: "Forgée de travers. L'acier plie plutôt que de casser. Ordonne-la avec soin : elle obéit aux angles, pas à la force."
    aberrant_faceguard: "Moulé sur un visage qui a cessé d'en être un. Décourage la conversation."
    aberrant_treads: 'Moulées sur une forme qui ne fut jamais vraiment un pied. Laissent de mauvaises empreintes.'
    abyss_core: "Orbe pulsante d'énergie du vide concentrée. Contient les rêves d'une réalité morte. Manipulez avec prudence existentielle."
    abyss_loop: "Tiré d'une eau qui a englouti la lumière tout entière. En garde encore le poids."
    abyssal_blood_wheat: "Du grain infusé d'hémoglobine ayant des opinions sur les groupes sanguins."
    abyssal_codex: 'Un grimoire dragué des profondeurs. Les pages détrempées se tournent encore, allez savoir comment.'
    abyssal_conduit_staff: ''
    abyssal_edge: "Une epee qui semble absorber la lumiere autour de sa lame. L'obscurite est cosmetique. Les degats ne le sont pas."
    abyssal_warplate: 'La difference entre un recit de guerre et un eloge funebre.'
    abyssgrown_blade: "Elle s'est fait pousser sa propre gouttière, son propre fil, sa propre légère réticence à être rengainée, dont le forgeron ne s'attribue rien."
    abyssgrown_cuirass_of_moonlit_mire: "Elle a continué de croître après l'ajustement, chose que le porteur découvrit le jour où elle cessa de lui aller et se mit, doucement, à insister."
    abyssgrown_extract: "Un concentré qui s'est densifié tout seul après la mise en flacon, si bien qu'une vieille fiole frappe plus fort qu'une neuve et que l'étiquette ne suit jamais."
    abyssgrown_gauntlets: "Ils se sont fait pousser des griffes que le forgeron n'a jamais ajoutées et ne peut ôter, chose que le porteur préfère prendre pour un avantage."
    abyssgrown_helm_of_quiet_drowning: 'Poussé, non forgé, depuis une coquille que le Weald profond entama puis délaissa. Le porteur hérite de la protection comme des affaires inachevées.'
    abyssgrown_pendant_of_moonlit_mire: "Il s'est creusé un vide en son cœur qui, jure le porteur, renferme une goutte d'eau plus vieille que le Weald. Elle refuse de s'évaporer, ce qui appuie l'affirmation."
    abyssgrown_pendant_of_quiet_drowning: "Des perles sur un cordon qui cliquettent doucement au souffle du porteur, réconfort dans le silence profond, du moins tant qu'on ignore qu'elles cliquettent un temps après chaque souffle, non avec lui."
    abyssgrown_sabatons: 'Ils se sont fait pousser une semelle jamais dessinée, accordée à une démarche que nul ne reconnaît, et qui va tout de même au porteur.'
    abyssgrown_signet_of_moonlit_mire: "Sa face-sceau s'est fait pousser un motif qui change légèrement chaque fois qu'on détourne les yeux, que jamais deux témoins n'ont décrit pareil."
    abyssrift_breastplate_of_torn_ground: 'Sans poids dans la gravité ténue : très agréable, moins quand il faut vraiment cogner.'
    abyssrift_legguards_of_split_sky: 'Conçues pour des chutes que la gravité ténue rend presque survivables. Presque.'
    abyssrift_poultice_of_split_sky: "Frais au contact, comme l'autre côté de la couture. Ne demande pas comment ils le savent."
    abyssrift_treads_of_split_sky: 'Pas le genre qui vole. Le genre « le sol est parti et tu improvises ».'
    abyssrift_visor_of_torn_ground: "La fente te montre exactement ce qu'il y a devant. Le sol n'a jamais été devant."
    abyssrift_warbelt_of_torn_ground: 'Encaisse la charge pour épargner ta colonne. Ta colonne reste sceptique et le fait savoir.'
    adamantite_beastcaller: "Enveloppé de fourrure de yéti et gravé d'antiques glyphes d'appel. Frappe le sol trois fois et quelque chose se présente, d'ordinaire froid et de mauvaise humeur."
    adamantite_chopper: ''
    adamantite_earth_cleaver: 'Une epee longue alimentee par un coeur de cendre encore en fusion. Assez lourde pour fendre la terre. Ou ce qui se tient dessus.'
    adamantite_fang_daggers: "Lames jumelles coiffées de crocs de rex et liées de soie funéraire. Assez vives pour fendre la brise, et ce qui s'y cachait."
    adamantite_katana: 'Un katana avec un coeur glacial dans la poignee. Le fil est si fin quil tranche la pretention. Et aussi les gens. Le froid engourdit la culpabilite.'
    adamantite_longbow: 'Membres en aileron de requin et plaques de carapace gelée. Le bander demande les deux bras et une vieille rancune.'
    adamantite_tidestaff: 'Enveloppe de soie de frostshamble et couronne dun noyau glacial. Vibre au rythme des marees lointaines. Inutile pour nager.'
    adamantite_trident: 'Trois pointes en carapace de crabe gelee qui ne degele jamais. Efficace contre les poissons, les ennemis adjacents aux poissons et le bon sens.'
    adamantite_war_greaves: 'Martelées entre deux appels, quand les forges avaient du fer à revendre.'
    adamantite_waraxe: 'Plaques de carapace givree sur la lame, coeur glacial dans le pommeau. Le poids entraine vos bras. Le froid entraine votre volonte.'
    adamantite_warhelm: "Trempé dans l'eau des tumulus plutôt que la saumure. Encaisse bien les chocs."
    adamantsteel: "De l'adamant replié en acier par des forgerons persuadés que le métal doit d'abord y consentir. Les fournées réussies paraissent, il est vrai, étrangement consentantes."
    aetherwing: ''
    alchemical_base: 'Le fondement de tout travail alchimique. Sent la bibliotheque humide et les promesses brisees.'
    allweather_cinch: "Fonctionne aussi bien dans les marais, les déserts et la toundra. A l'air moche absolument partout."
    aloe_crystal_salve: 'Du gel d aloès cristallisé superposé avec des résidus d herbes. Les guérisseurs ne jurent que par lui, les patients jurent contre lui.'
    aloe_vera: 'Une feuille succulente remplie de gel apaisant. Les soigneurs ne jurent que par elle, les alchimistes la stockent, et tout le monde se demande pourquoi on se bat pour une plante.'
    alpha_cleave: "Pris à l'alpha de la meute. Il ne l'a pas donné volontairement, et franchement la meute non plus."
    alpha_fang: "Quinze centimètres de canine jaunie. L'alpha qui la portait n'était pas disponible pour commenter. Ni pour respirer."
    alpha_fang_circlet: "Les loups pleurent leurs morts par des hurlements qui traversent tout l'archipel. Ce cercle s'en souvient tous."
    amber: "De la sève d'arbre fossilisée contenant des insectes morts depuis des millions d'années, enfin utiles à quelque chose."
    amber_powder: 'Sent comme une foret morte il y a tres longtemps et qui en est encore amere.'
    ambivalent_torc_ap: "Un amulette qui accorde un point d'action par accident, non par intention. Son porteur ne peut pas décider s'il a été béni ou chargé."
    amphibian_oil: 'Raffinée à partir de glandes de koa. Imperméabilise le cuir, lubrifie les engrenages, et fait tout sentir le marais pour toujours.'
    amulet_of_the_first_hollow: "Récupéré dans le creux laissé par la toute première Mite du Vide jamais cataloguée, à l'époque où les archivistes numérotaient au lieu de nommer. Il précède la convention de nommage, et n'a pas oublié son numéro."
    ancient_hermit_robe: "Découpé d'une robe usée à travers cent inhumations. Le tissage retient encore la poussière des tombes."
    ancient_marrow: 'Encore liquide après des siècles dans un squelette. Goût de tristesse et de vieux cuivre. Ne demandez pas comment on le sait.'
    ancient_ram_splitter: ''
    ancient_tusk_cleaver: 'Taillée dans une côte mal formée. Le tranchant tient toujours.'
    ancient_tusk_fragment: "Un éclat brisé d'une côte poussée là où nulle côte ne le devrait."
    anglerbone_cord: "Enfilé sur les vertèbres mêmes d'une Reine-Baudroie, encore faiblement luminescent en pleine obscurité. Pratique pour s'orienter. Moins pratique pour rester caché."
    anglerdeep_key: "Poisseuse d'une humidité du Weald qui ne sèche jamais, tiède comme l'est la lumière-lotte juste avant de ne plus l'être. La Matrone des Abysses en tient meilleur compte qu'elle ne le laisse paraître."
    anglerhide_helm: "Taillé dans la peau de la Reine-Baudroie, les glandes-leurres laissées éteintes et dormantes, pour l'essentiel. Il vaut mieux ignorer à quel point elles dorment."
    anglerlight_lure_staff: "Coiffé d'une lumière-leurre captive, pulsant encore au rythme qui attire les proies à travers le Weald profond. Mieux vaut ne pas la fixer trop longtemps."
    anglerlight_oil: "Extraite des glandes-leurres de la Reine-Baudroie, faiblement luminescente jusque dans la fiole. Mieux vaut l'avaler tôt — passé ce délai, elle se met à attirer des choses."
    antiphon_breastplate_of_last_verse: 'Étanche à l eau, au feu, à la sauce. À draper sur les meubles ou sur vous, selon ce qui doit être sauvé.'
    antiphon_grips_of_last_verse: 'Faites pour le jour de lessive. Essorez une chemise, une serpillière, ou la vérité de quelqu un.'
    antiphon_grips_of_twelve_voices: 'De la farine jusqu à l avant-bras, pour toujours. La pâte s est rebellée exactement une fois.'
    antiphon_poultice_of_twelve_voices: "Douze herbes, douze prières, une pâte. Nul ne sait quelle herbe agit, et c'est peut-être aucune."
    antiphon_treads_of_twelve_voices: 'Les bottes s arrêtent au porche. La cathédrale est intraitable là-dessus, et la lave respecte la tradition.'
    antiphon_visor_of_last_verse: 'Égoutte la soupe, la lave et l ambition avec la même efficacité impartiale. Jugulaire incluse.'
    antiphon_visor_of_twelve_voices: "Fendu pour que douze regards étroits n'en fassent qu'un. C'est quand même, on ne sait comment, pire."
    apexbound_cuirass_of_summit_vigil: "Plastron réglementaire de la faction du sommet, lesté pour tenir son porteur debout un tour entier sans vaciller. S'asseoir est un autre problème, qu'elle ne résout pas."
    apexbound_gauntlets: "Destinés aux mains qui atteignent la cime et doivent encore agripper quelque chose une fois arrivées. La plupart n'y arrivent pas. Ceux-ci supposent que si."
    apexbound_girdle_of_sealed_wound: "Enroulé deux fois, à la manière dont les Fragments du Mur enroulent tout ce qu'ils ne croient pas vraiment capable de rester clos. Jusqu'ici, la taille a coopéré."
    apexbound_helm_of_sealed_wound: "Coulé pour endurer les exhalaisons de la Plaie quand on la force à se refermer. La visière se scelle de l'intérieur, ce qui vous dit de quoi elle protège vraiment le porteur."
    apexbound_pendant_of_summit_vigil: 'Censé reposer contre le sternum de qui tient la plus haute faction, assez près du cœur pour tenir le compte de sa cadence.'
    apexbound_ration: "Médecine de campagne distribuée aux défenseurs du mur, scellée à la cire et garantie de se conserver plus longtemps que la moyenne de ses défenseurs. Sinistre, mais l'étiquetage est honnête."
    apprentice_blade: "La premiere epee d'un forgeron qui ne casse pas immediatement. Une etape. Modeste mais quand meme."
    aragog_fang: "Un croc dégoulinant de venin arraché de la gueule de la Reine Araignée. La toxine qui recouvre sa surface oscille entre le violet et le noir, dissolvant tout ce qu'elle touche."
    aragog_fangs: ''
    arcane_bread: 'Cuite en masse, bénie une fois, jamais remise en question. Fait avancer une colonne.'
    arcane_pastry: ''
    arcane_reagent: "Sept herbes, un trait d'eau, et aucune raison terrestre à cette lueur violette. Les alchimistes classent ça en recherche ; les autres, en signal d'alarme."
    arcane_solution: 'Reactif alchimique endgame pulsant de potentiel magique brut. Une goutte sur la peau cause une synesthesie temporaire.'
    arcane_spore: "Saturée de magie brute au point d'une agitation permanente, elle bourdonne à une fréquence qui brise le verre alentour et réarrange les annotations marginales des érudits sans leur demander leur avis. La seule règle de sécurité transmise pour sa manipulation : ne pas éternuer."
    arcaneshroom: "Un champignon imprégné d'énergie arcanique résiduelle qui lui confère une lueur faible et accusatrice, comme s'il tenait le cueilleur personnellement responsable d'avoir troublé sa contemplation savante. Le manipuler à mains nues provoque parfois une lévitation involontaire, une synesthésie temporaire et une envie inexplicable de vieux grimoires."
    arcanite: 'Vibre de magie residuelle qui fait tourner les boussoles et rend les mages insupportablement suffisants.'
    arcanite_hoe: "Impregnee d'assez d'energie arcane pour faire germer la terre morte. Fait aussi germer les fermiers morts, mais on n'en parle pas."
    arcanite_pickaxe: "Brise les mineraux durcis par la realite comme un percepteur brise les reves. La veine n'a aucune chance."
    arcanite_powder: 'Se reorganise spontanement en symboles arcaniques quand on le laisse sans surveillance. Tres distrayant.'
    arcanite_sickle: "Forgee a partir de mana cristallisee et de mauvaises decisions. Tranche les fourres maudits comme s'ils lui devaient de l'argent."
    arcanize_flour: 'Farine violette qui lévite brièvement, les boulangers travaillent vite.'
    archaeo_belt: "Emplumee, fossilisee, et toujours convaincue qu'elle pouvait voler."
    archaeo_longbow: "Empennée de plumes d'un oiseau qui traversait les profondeurs bien avant que quiconque tienne un calendrier pour en noter la date. Les flèches semblent encore connaître l'ancienne route. Elles la prennent, que ce soit ou non là où vous visiez."
    archaeo_plume: "Proto-plume d'une creature encore indecise, sur le plan evolutif, entre lezard et oiseau."
    archaeo_plume_javelin: "Empennee de proto-plumes. Elle vole plus droit que tout ce qui a des plumes n'y a droit."
    archimob_legguards: "Tiree de la peau du chef de meute. Le reste de la meute envoie encore des cartes de remerciement, sans qu'on demande."
    arisen_tokeko: ''
    ashen_philter: 'Gris, granuleux et techniquement buvable. La cendre ne retombe jamais, ce qui te situe.'
    ashen_visor: 'Sent en permanence le feu de camp et les choix douteux. Bloque en partie les deux.'
    ashraptor_fang_pendant: 'Le croc se souvient encore du feu dont il vient. Votre clavicule aussi, parfois.'
    backbone: "Blindée le long de l'échine en priorité, selon la théorie solide qu'un cadavre encore debout tient tout de même la ligne."
    backswing: 'Le mouvement de retour accomplit plus de dégâts que le coup prévu. Le forgeron appelle ça une fonctionnalité. Le porteur appelle ça une surprise.'
    bag_aloe_vera: "Un récipient autrefois respectable qui suinte désormais une sécrétion botanique visqueuse par chaque couture, conséquence inévitable de confiner cinquante spécimens d'aloe vera dans un espace conçu pour considérablement moins de plantes gélatineuses. Les alchimistes maintiennent avec une conviction admirable que ses propriétés thérapeutiques augmentent avec la compression, une affirmation que l'extérieur du sac — glissant, malodorant et vaguement palpitant — ne soutient guère."
    bag_amber: 'Un lourd sac de larmes fossilisees. L arbre a pleure pour que vous puissiez vous enrichir.'
    bag_arcaneshroom: "Cinquante arcanechampignons consolidés dans un récipient qui bourdonne d'une magie résiduelle si concentrée qu'il a développé son propre champ gravitationnel, attirant les petits objets avec l'inévitabilité de papillons de nuit vers une flamme particulièrement érudite. Le sac lévite occasionnellement quand il est laissé sans surveillance, ce que son propriétaire doit alors expliquer à des aubergistes de plus en plus sceptiques."
    bag_arcanite: "Le bourdonnement s'intensifie quand on en porte plus de dix. Personne ne sait pourquoi et personne ne tient à le découvrir."
    bag_arcanize: 'Une luminescence violette suinte des coutures. Le grain bourdonne à une fréquence troublante pour les chats.'
    bag_barley: "Un sac d'orge qui cliquète avec le son de grain récolté sous la protestation de son gardien."
    bag_blood_wheat: "Il palpite, faiblement, selon un rythme dont personne n'a percé le mystère. Déstabilisant dans un sac de grain. Bien pire encore dans un bagage à côté duquel vous comptiez dormir."
    bag_bloodstone: "Tout ce qu'il contient finit par tacher de rouge. Statistiquement, tout le reste aussi."
    bag_burnt_wheat: "Ouvrir ce sac libère un parfum fumé et l'impression d'une terrible décision agricole."
    bag_crimson_truffle: "Cinquante truffes, un seul sac, et une valeur marchande que la couture n'a jamais ete prevue pour supporter."
    bag_cursed_fungus: "Cinquante champignons maudits scellés dans un sac qui murmure dans une sélection tournante de langues, dont aucune n'appartient à une civilisation vivante, s'adressant à son porteur par des noms qu'il ne reconnaît pas mais qui produisent néanmoins un frisson involontaire. Les herboristes chevronnés le portent à bout de bras, non parce que le manuel le recommande mais parce que le sac en a fait lui-même la suggestion."
    bag_cursed_gem: 'Le sac murmure vos peurs les plus profondes. Surtout la gestion d inventaire et les limites de poids.'
    bag_draconite: 'Chaud au toucher et grondant faiblement. Le dernier livreur a laisse un avis a une etoile, sans adresse de suivi.'
    bag_draconize: "Les ecailles a l'exterieur sont peut-etre naturelles, ou signifient que le grain a l'interieur se syndique."
    bag_dragonlily: 'Cinquante lys-dragons, ecailles chevauchantes, bruissant juste assez pour tenir le chat du perron eveille toute la nuit.'
    bag_duskite: "Vieille comptine de mineurs : ce que la duskite prend, la duskite le garde, et la lumière y entre sans jamais dormir. En pratique, ça veut surtout dire que le sac pèse plus lourd qu'il n'y paraît, et coûte moins cher que de raison."
    bag_green_mushroom: 'Cinquante champignons verts. Juridiquement et botaniquement distincts de la variété amusante.'
    bag_himalayan_wheat: "Récolté à des altitudes où l'air est rare et les réglementations agricoles inexistantes."
    bag_ivory_shrooms: "Cinquante champignons luminescents emballés avec une densité si imprudente que le sac émet une lueur phosphorescente constante visible à une distance embarrassante, fonctionnant comme une veilleuse portable réclamée par personne et que quiconque dans un rayon de trente mètres est contraint de reconnaître. Des marchands ont tenté de commercialiser cela comme un avantage plutôt qu'un inconvénient, avec des résultats prévisibles."
    bag_jade: 'Assez de pierres vertes pour faire pleurer un marchand de joie puis de mefiance.'
    bag_malt: 'Le léger arôme de fermentation suggère que ce malt planifie sa carrière de boisson.'
    bag_moonstone: 'Brille a travers le tissu la nuit rendant la furtivite totalement impossible pour les voleurs.'
    bag_nightcap: "Un sac contenant cinquante bonnets de nuit qui semble dévorer la lumière ambiante dans son voisinage immédiat, créant une poche de ténèbres localisée qui suit son porteur avec la persistance discrète d'une mauvaise conscience. La proximité prolongée induirait un malaise existentiel rampant que les herboristes ont appris à confondre avec le professionnalisme."
    bag_obsidianite: "Manipulez-le avec soin, ou pas, et dans les deux cas préparez votre excuse pour le guérisseur à l'avance. Il a déjà entendu toutes les versions de « je le portais, c'est tout »."
    bag_phantom_spore: "Cinquante spores qui ne sont là que par intermittence, comme une promesse qu'on ne tient qu'à moitié. Comptez-les deux fois. Une troisième par dépit. Le chiffre ne se mettra jamais d'accord avec lui-même."
    bag_quartz: 'Cinquante morceaux de cristal trouble qui s entrechoquent comme un sac de promesses brisees.'
    bag_red_orchid: "Une bourse en cuir contenant cinquante orchidées sanguines si comprimées que le sac s'est teint d'un cramoisi profond et permanent de l'intérieur, comme s'il avait été la scène d'un crime très petit et très botanique. L'ouvrir libère un parfum à parts égales de douceur métallique et de menace silencieuse."
    bag_suize: "Les grains a l'interieur captent la lumiere comme s'ils auditionnaient pour un meilleur contenant."
    bag_tanjirize: "Une bourse chaude, comme si le tanjirize est encore convaincu qu'il appartient au soleil."
    bag_ukranize: "Le grain d'Ukranize n'a jamais aimé la bonne terre — on raconte qu'il préfère pousser où la récolte est la plus dure à atteindre. Culture avisée. Désastreuse pour les genoux."
    bag_wheat: 'Cinquante boisseaux de blé. La Sentinelle de Bale a donné sa vie ; la boulangerie a haussé les épaules.'
    bag_witherbloom: "Chaque fleur garde sa plus belle performance pour l'instant de sa mort, avec l'engagement théâtral d'un acteur déterminé à rester dans les mémoires. Ouvrez le sac et tout barde à portée de voix saisit sa plume en pleine conversation."
    baked_compound: "Un bloc durci de farine et spores. Les alchimistes adorent. Les autres questionnent l'odeur."
    banner_shard: "Arraché à l'étendard cendré avant sa chute. Porte encore le poids de la ligne qu'il marquait."
    barbfin_battleaxe: "Ailerons barbelés comme quelque chose remonté d'une eau plus profonde que le Weald n'en a techniquement. Nul n'a demandé d'où venaient vraiment les ailerons."
    bark_grimoire: 'Pages en ecorce pressee. Les sorts sont surtout des dessins de moutons en colere.'
    barley_bread: 'Un pain dense au gout de personnalite de fermier. Nourrissant, fiable et sans joie.'
    barley_flour: 'Une farine grossière que les brasseurs convoitent et les boulangers tolèrent.'
    barley_hardtack: 'Military rations that outlast the soldiers who carry them. Jewelers use the crumbs as polishing abrasive.'
    basalt_carapace_of_black_choir: 'Plaque volcanique qui boit la lumière. Dans une nef sombre, tu es, en somme, un trou.'
    basalt_core: "Le centre non fondu d'une bombe de lave. Froid dehors, encore hésitant dedans. Ne le presse pas."
    basalt_crest_of_black_choir: 'Assez lourd pour que tu hoches la tête au requiem, que tu le veuilles ou non.'
    basalt_crest_of_molten_antiphon: 'Le porter ne vous rend pas invisible à la fête. Mais il arrête les gouttes de cire brûlante.'
    basalt_falchion_of_molten_antiphon: "Tu frappes, ils répondent, la conversation s'achève. Rarement un long dialogue."
    basalt_fists_of_molten_antiphon_choir: 'Le chœur chante une ligne, puis la reprend, plus fort. Eux aussi. Apprends le tempo ou encaisse le second couplet.'
    basalt_fists_of_molten_antiphon_pyre: 'Des poils d acier sur les phalanges. La crasse, la rouille et l espoir partent avec la même facilité.'
    basalt_flail_of_black_choir: "Lancée en cercle sur sa chaîne, elle sonne comme un glas. Approprié, vu les rendez-vous qu'elle honore."
    basalt_greaves: 'La chose la plus têtue que tu attacheras jamais à un genou. Elle a son avis sur le fait de bouger.'
    basalt_knobstick_of_molten_antiphon: 'En érable, bien fariné, brandi avec l autorité de quelqu un qui vous a attendu toute la nuit.'
    basalt_locket_of_black_choir: "Renferme un unique ton grave, scellé dans la pierre. Brise-le en crise ; regrette-le dans le calme d'après."
    basalt_maul: 'Homologuée pour les tapis, les tentures et tout ce qui garde rancune en même temps que la poussière.'
    basic_pickaxe: "Voici ce qui arrive quand les contraintes budgétaires rencontrent l'ambition souterraine."
    bear_battleaxe: "Impregnee de rage d'ours et d'une quantite deraisonnable de chaleur corporelle."
    bear_claw: 'Recemment attachee a un ours bien plus grand et bien moins cooperatif.'
    bear_claw_ring: "L'ours s'est battu pour ca. Il a perdu. Surtout a cause d'un detail technique."
    bear_club: "L'ours a demande des droits d'auteur sur ce design. Le service juridique a refuse. L'ours n'etait pas d'accord, bruyamment."
    bearclaw_gauntlets: "Munis de griffes arrachées à un Ours de Mousse qui n'en avait plus besoin. La force de préhension se transmet ; le caractère aussi, apparemment."
    bearfury_battleaxe: "L'ours dont la griffe a servi pour cette hache etait apparemment tres mecontent. Comprehensible."
    bearheart_signet: "Serti d'un éclat de griffe à la taille de celle du Patriarche Ours. Le porter assez longtemps, et on oublie comment donner un coup — on ne se souvient plus que d'en encaisser un."
    beast_hauler_sash: 'Serrée par quiconque tirait les charrettes de récupération. Effilochée exactement là où la corde reposait.'
    beastcaller_talisman: "Enfilée d'une corde de Berger Statique, bourdonnant faiblement quand le troupeau est proche. Les meutes de rex confondent brièvement le porteur avec l'un des leurs."
    behemoth_pearl: "Trouvée dans le gosier d'un ancien Koa Titan. Vaut une fortune, à condition de la récupérer poliment."
    behemoth_pearl_amulet: "Serti d'un fragment trop lisse pour s'être brisé tout seul."
    bent_sword: "Forgee par quelqu'un qui confond 'trempe' et 'marcher dessus'. Fonctionnelle. A peine."
    berserk: 'Forged for those who answer every problem with more axe. Rage not included, but implied.'
    binding_paste: "Compose adhesif qui lie les materiaux organiques et mineraux. Les forgerons et tailleurs l'achetent plus vite qu'on ne la brasse."
    binding_ring: "Lie l'energie spectrale a la chair mortelle. Les petits caracteres mentionnent une 'derive existentielle legere', rien de plus."
    binding_thread: "Attache un spectre a ce plan. Coupez-le et regardez plusieurs de vos problemes s'evaporer d'un coup."
    bisonbrute_bow: "Corde en tendon de bisonbrute. Chaque fleche porte le poids emotionnel d'une ruee."
    blizzard_tassets: 'Plaques de cuisse en thorium incrustées de cristaux de givre. Chaque pas sonne comme du verre brisé.'
    blockhead: "Baptisée par l'apprenti du forgeron, qui y voyait une insulte — promu malgré tout."
    blood_wheat: "On le coupe, et il saigne — une sève épaisse et sombre couleur de vieille blessure, comme si la terre qui l'a fait pousser avait d'abord été blessée, et n'avait posé de questions qu'ensuite."
    blood_wheat_flour: "Moulue d'un rouge sombre discret, meilleure en pain mangé vite et jamais réfléchi. Le battement occasionnel est, insistent les boulangers, purement esthétique."
    bloodstone: 'Mineral rouge fonce qui tient definitivement sa couleur de l oxyde de fer et pas de maledictions anciennes probablement.'
    bloodstone_powder: "Deconcertant de chaleur dans la paume. Les alchimistes l'adorent. Tous les autres gardent leurs distances."
    bloodveil_orchid: "Une orchidée cramoisie dont les pétales pleurent une sève assez sombre pour tacher tout sur son passage, y compris votre réputation d'herboriste sérieux."
    bloodwheat_bread: "La mie cramoisie pulse faiblement quand on la coupe. Les boulangers insistent c'est thermique. Les boulangers mentent."
    blue_antenna: "Pulse encore de la dernière pensée de l'insecte : 'Pourquoi le géant a-t-il écrasé ma compagne ?'"
    blunt_cudgel: 'Un baton qui pretend etre une arme. Vos ennemis mourront... de rire. Eventuellement.'
    boar_gorer: 'Conçue pour la chasse au sanglier, mais marche sur tout ce qui charge avec un mauvais jugement.'
    boar_hide: 'Épaisse, hérissée, et sent la boue. Le sanglier était déraisonnablement en colère de la perdre. Procédure standard.'
    bogforged_core: "Un noyau durci sur un feu de marais froid, qui le laisse dense et discrètement anormal au toucher, sensation qui ne s'estompe jamais vraiment."
    bogforged_elixir_of_fen_below: "Distillé sur un feu de marais qui brûle froid, lui donnant une fraîcheur qui s'attarde longtemps sur la langue après la guérison."
    bogforged_greataxe_of_fen_below: "Forgée pour qui descend au Fen-d'en-Bas et compte encore brandir quelque chose au retour, ce que peu font."
    bogforged_greataxe_of_rising_tide: 'Martelée sur une enclume de marais qui avale les étincelles tout entières, chose que le forgeron trouva troublante et la hache, apparemment, à son goût.'
    bogforged_sash: "Tissée de roseau-tourbe qui reste toujours humide au fond. Elle éclaircit merveilleusement l'esprit — surtout en le vidant. Le porteur se sent formidable et ne saurait plus dire pourquoi."
    bogforged_vambraces_of_rising_tide_matron: "Calés sur cette marée dont le Weald feint l'absence, durcis à pleine eau, quand le métal, brièvement, consent à coopérer."
    bogforged_vambraces_of_rising_tide_mire: 'Trempés dans une eau de marais si infecte que le métal en sortit plus dur et le forgeron en toussa une semaine.'
    bogsteel: "Du fer-des-tourbières réduit et replié jusqu'à tenir un fil, chose qu'il concède à contrecœur et seulement pour qui l'a mérité de haute lutte."
    bone_charm_necklace: "Petits os enfils sur un cordon. L'air soit tribal-chic soit tueur-en-serie-chic selon votre tenue."
    bone_flail: 'Assemble a partir de ce que le bonelet a laisse. Cliquette a chaque coup.'
    bone_greatbow: ''
    bone_marrow_club: "Creusé dans le propre fémur d'un Charnier de Moelle et bourré de plomb pour faire bonne mesure. Quelque part en dessous, dit-on, Nerak finit toujours par remarquer ce genre de chose. Mieux vaut tenir une bonne excuse prête."
    bone_wand: ''
    boneguard_edge: "Pris à un garde-os qui, en toute honnêteté, ne se battait pas très fort pour le garder à ce moment-là — surtout parce qu'il était mort, complètement, professionnellement."
    boneherald_greatsword: "Jurée sur des ossements plus anciens que toute couronne jamais fondue pour en forger une meilleure. Le serment, tous s'accordent à le dire, est incassable. L'épée elle-même, le héraut vous le rappellera, reste tout à fait à vendre."
    bonelord_flail: "Les os sont vrais. Liés par le tendon de la chose qui errait ces terres. Il balance plus lourd que la physique ne le permet ; les forgerons ont cessé de s'interroger."
    bonelord_greatsword: ''
    bonelord_legguards: "Taillées dans des fémurs trop grands pour quoi que ce soit qui respire encore. L'ajustement est parfait."
    brackish_breastplate_of_brackish_deep: "Éprouvé pour des pressions à des profondeurs dont le Weald nie officiellement l'existence, ce qu'un forgeron estampe sur un plastron avant de préférer ne pas en parler."
    brackish_composite: "Une matière stratifiée traitée en eau salée, qui la rend plus solide et plus étrange, sujette à une odeur qui s'intensifie pile quand on préférerait le contraire."
    brackish_edge_of_brackish_deep: "La trempe à l'eau salée l'a laissé juste assez corrodé pour blesser d'une façon qu'une coupe nette ignore, ce que le Weald compte pour un atout."
    brackish_grips_of_brackish_deep: "Le sel s'est logé dans les articulations et y est resté ; elles se bloquent donc de temps à autre au pire moment, avec fiabilité."
    brackish_legguards_of_brackish_deep: "Homologués pour patauger dans une eau qui rongerait tout le reste jusqu'à la jambe, ce qu'elle finira par faire à ceux-ci aussi ; le forgeron refuse juste de dire quand."
    brackish_legguards_of_silt_throne: 'Récupérés sur un courtisan resté trop longtemps assis dans la salle noyée, et qui, techniquement, y est toujours assis.'
    brackish_poultice_of_silt_throne: 'Garni de boue salée qui assainit une plaie et pique assez pour que le patient sache, précisément, quand il agit.'
    brackish_recurve_of_brackish_deep: "Encordé d'un tendon que le sel a gonflé sans retour, de sorte qu'il se bande plus lourd que son allure ne le laisse croire et récompense les bras qui s'y attendaient."
    brackish_twin_knives_of_silt_throne: 'Dagues de cour draguées de la salle noyée, encore croisées comme on les posa sur un corps que la vase a depuis longtemps réclamé.'
    brackish_waraxe_of_brackish_deep: "La corrosion a gagné le manche puis s'est arrêtée, tenue en respect par rien d'identifiable, sur quoi le porteur s'efforce de ne pas trop compter."
    brackish_warbelt_of_silt_throne: "Sa boucle de cour s'est corrodée en une forme abstraite qui ne signifie plus rien, ce qui est plus honnête que ce qu'elle signifiait avant."
    breach_ash: 'La suie qui ne retombe jamais. Ici elle dérive de côté, par dépit envers la gravité.'
    breachforged_brew_of_nine_faults: "Infusée dans le sel-moelle d'un Gardien de Porte, bue par les sentinelles qui comptent les brèches au lieu des moutons. Referme d'abord les petites plaies, sur le principe que les grandes peuvent attendre leur tour."
    breachforged_carapace_of_fifth_breach: "Pelée d'un seul tenant sur une Néantphalène qui avait dépassé la cinquième brèche sans plus nulle part où muer. S'ajuste comme un second exosquelette : fonctionnellement, c'en est un."
    breachforged_carapace_of_nine_faults: "Chaque jointure est un endroit où elle pourrait céder. Jusqu'ici, non. « Jusqu'ici » en fait beaucoup."
    breachforged_cincture_of_fifth_breach: "Un Veilleur du Seuil la serrait en mesurant chaque passage à l'empan avant de trancher s'il resterait ouvert. La boucle claque encore sur cinq crans. Leur sens est parti avec lui."
    breachforged_circle_of_nine_faults: "Bague de la main compteuse d'un Gardeporte chargé de recenser les brèches avant qu'elles ne mûrissent en problème. Elle compte toujours. L'instant de promptitude qu'elle accorde, c'est la bague qui achève sa garde à votre place."
    breachforged_claymore_of_nine_faults: "Un Veilleur du Seuil l'a brandie le jour où il a cessé de compter les failles pour les refermer lui-même. Trop lourde pour viser finement. La finesse ne figurait pas au plan."
    breachforged_crest_of_nine_faults: "Neuf arêtes, une par fissure que le fondeur a comptée avant d'abandonner le comptage."
    breachforged_fists_of_fifth_breach: "Coulés sur les phalanges d'un Gardeporte qui cognait d'abord et contrôlait les laissez-passer ensuite. Chaque impact laisse un bleu en forme d'arche : une porte minuscule."
    breachforged_greatbow_of_fifth_breach: "Bandé par un Gardeporte pour qui la portée se comptait en seuils franchis, jamais en pas. La flèche devance d'un seuil entier le regret qui l'a lâchée."
    breachforged_philter_of_fifth_breach: "Mise en flacon par le Gardeporte de la cinquième veille, du temps où les veilles finissaient encore. Un goût d'immobilité prolongée."
    breachforged_splitter_of_fifth_breach: "Les quatre précédentes n'ont pas tenu. Celle-ci a été forgée de bien plus mauvaise humeur."
    bread_leavening_agent: 'Fait lever le pain avec une efficacite alchimique. Les boulangers considerent ca comme un miracle. Les alchimistes considerent les boulangers facilement impressionnes.'
    bristleguard_cuirass: 'Cuir de tusker tanne dans sa propre bile, car les tuskers sont precisement le genre de creature a exiger cela.'
    bristlemail_gauntlets: 'Anneaux enfiles de soies de sanglier qui refusent, par principe, de rester a plat.'
    bristlemail_pants: "S'asseoir en cuir de tusker est, techniquement, un acte de foi. Les soies contestent cette foi."
    bristlemail_patch: "Peau de ventre de sanglier si dense qu'elle arrête les flèches. Le kevlar de la nature, sauf que ça pue et personne ne vous remercie."
    bronze_greaves: "Martelées dans un bronze assez dense pour dévier une lame et assez lourd pour faire de chaque escalier un ennemi mortel. Le forgeron, dit-on, avait des avant-bras comme des arbres abattus. On attend des porteurs qu'ils s'en fassent pousser d'aussi solides."
    bronze_helm_of_the_shore: "Un dôme de bronze orné de bernacles qu'aucun récurage ne pourra enlever. Le propriétaire original était un garde côtier qui aimait la mer, avant que la mer ne le lui rende. Définitivement."
    bronze_wolf_cuirass: 'Plaques de bronze sur peau de loup des bois. Le dernier hurlement du loup serait préservé dans le métal — bien que rares sont les porteurs qui entendent autre chose que leur propre souffle après le troisième escalier.'
    browbeaten: 'Cabossé au même endroit par les mêmes débris tombants, assez souvent pour que la bosse ait son propre nom chez les pèlerins.'
    bulwark_band: 'Votre doigt est desormais, juridiquement parlant, une fortification.'
    bulwark_of_the_risen: "Récupéré d'un tumulus rouvert au crépuscule. Les morts n'en avaient plus l'usage."
    bulwark_stubborn: "Refuse d'abandonner par pure et magnifique rancune. Ca marche, pour l'instant."
    burnt_wheat_flour: 'Farine pré-grillée, un service attentionné pour les boulangers.'
    caller_embrace: "Le bout des doigts s'illumine quand un familier s'approche. Pratique. Parfois un peu trop intime."
    canticle_cuisses: 'Les côtes sifflent un cinquième de ton à chaque pas. Le chœur a appris à transposer autour de vous.'
    canticle_greataxe: 'Gardé pour les bûches têtues du fond du tas. Il clôt aussi la plupart des autres désaccords du domaine.'
    cantor_basalt: 'Pierre à sol de cuisine, polie par quatre siècles de cuisiniers qui font les cent pas.'
    canvas_boots: 'Etanche pendant les trois premieres secondes. Ensuite ce sont des eponges avec des lacets. Confort: humide.'
    cape_fuwa_black: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_fuwa_white: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_kamui: 'A cloak cut from something that should not have had a hide. It remembers being worn by worse.'
    cape_lorito_agility: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_chance: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_intelligence: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_strength: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_vitality: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_wisdom: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    capstone_lattice: "Une trame cristalline qui ne prend que sous la pression propre au sommet, ce qui la rend exactement aussi pénible à obtenir qu'on l'imagine."
    capstone_treads_of_last_ascent: "La semelle qui ne compte qu'une fois, à l'ultime pas, soit précisément l'instant où la plupart des porteurs cessent d'avoir des pieds pour l'apprécier."
    capstone_visor_of_last_ascent: "La couronne remise au pèlerin qui atteint le sommet, dans le bref instant avant qu'il ne comprenne ce que gagner le sommet coûte vraiment."
    capstone_warbelt_of_first_dawn: "Lesté pour ancrer un corps contre le courant ascendant qui tire sur tout ce qui approche la cime. Il ancre bien. À quoi il vous ancre, c'est votre affaire."
    capuche_bara: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_air: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_earth: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_fire: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_water: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_wisdom: ''
    capuche_mo: 'A tattered hood strung with tiny skulls. Mo never explains where they came from, and nobody asks twice.'
    casque_hayate: 'Swift-wind steel. Light enough to run in, loud enough to be heard coming.'
    cataclysm_brew_of_nine_faults: "Les Prophètes de Cendre le brassent la veille d'un cataclysme qu'ils ont déjà vu et ne peuvent oublier. Ça n'empêche rien. Ça stabilise juste la main qui doit regarder."
    cataclysm_core_rift: "Le nœud dense laissé là où un séisme s'est épuisé. Tiède, patient, il hésite encore à en avoir fini."
    cataclysm_core_void: 'Ne pèse rien et tombe quand même. On a consulté des physiciens ; les physiciens sont partis.'
    cataclysm_extract: "La dernière chose qu'on distille d'un séisme épuisé. Amer, puissant, et peu enclin à rester tranquille."
    cataclysm_tassets_of_fifth_breach: "Plaquées à la hanche pendant la cinquième veille d'un Gardeporte, quand compter a perdu tout sens. Le métal se rappelle le garde-à-vous. Les jambes du porteur, beaucoup moins."
    cataclysm_tassets_of_nine_faults: "Neuf fissures enjambées par le Gardeporte en une seule ronde ont donné le nom. La dixième n'a figuré dans aucun compte."
    cataclysm_warboots_of_fifth_breach: "Pour franchir un fossé qui s'élargit à toute vitesse. La théorie tient. Le fossé, non."
    cataclysm_warboots_of_nine_faults: "Faites pour tenir là où rien d'autre ne tient. Ce « rien d'autre » inclut le sol."
    celestial_wafer: "Il a été catalogué deux fois, sous deux théories différentes, un écart dont la résolution n'a été confiée à personne."
    chantmarked_crusher_of_twelve_voices: 'Qualité de cantine. Ce qu il a fait aux pommes de terre, il le fera au moral.'
    chantmarked_edge_of_last_verse: "La partie du chant après que tous croyaient que c'était fini. Une surprise. Toujours la dernière."
    chantmarked_grips_of_twelve_voices: 'Étalonnés sur un bocal de cornichons scellé avant la fondation du chœur. Il s est ouvert. Finalement.'
    chantmarked_legguards_of_last_verse: 'Réservés aux offices, aux enterrements, et aux jours où les deux tombent ensemble. Ici, c est presque tous les jours.'
    chantmarked_legguards_of_twelve_voices: 'Repassé jusqu à un pli capable d ouvrir le courrier. S asseoir serait du vandalisme.'
    chantmarked_rod_of_twelve_voices: 'Le bout utile a séché depuis belle lurette. Depuis, le manche dirige le chœur, mal.'
    chantmarked_tonic_of_last_verse: "Pour quand le combat était fini et puis, grossièrement, ne l'était plus. T'achète un refrain de plus."
    chantmarked_twin_knives_of_last_verse: 'Les aiguilles de grand-mère. L écharpe est restée inachevée; le cambrioleur, lui, ne s en est pas remis.'
    chantmarked_visor_of_last_verse: 'Le bouton au sommet est à la fois un défaut de conception et une poignée de transport.'
    chantmarked_warbelt_of_last_verse_choir: 'La ligne où le chant revient toujours. Boucle-la et tu reviens aussi. De façon agaçante.'
    chantmarked_warbelt_of_last_verse_pyre: 'Des passants pour le marteau, la cisaille, la cire, l eau bénite. Un passant vide signifie que les ennuis vous ont trouvé d abord.'
    charged_vault_key: "Forgée en voltverre, en permanence chargée d'électricité statique issue des cellules orageuses du plateau. Le coffre du Gardien des Tempêtes a été frappé par la foudre plus de fois que quiconque ne l'a compté, et c'est grâce à cette clé qu'il s'ouvre encore."
    charite_brick: 'Brique dense de farine brulee et ambre. Les armuriers la broient en agent de liaison pour les armures.'
    chief_mark_brand: "Sert à marquer les conscrits trop jeunes pour s'y opposer. Chauffe vite, s'efface lentement."
    chipped_axe: "La lame a plus d'eclats qu'un sac de chips. Chaque frappe envoie des fragments. AoE naturel."
    chitin_cutlass: "Moitie chitine, moitie metal rouille. Etonnamment efficace pour faire regretter d'approcher."
    chitin_gauntlets: "Enveloppe d'insecte lamellée façonnée en gantelets, légers mais assez résistants pour dévier les coups de glissement. Le porteur précédent les a apparemment trouvés très confortables, jusqu'à ce que la poche à poison n'éclate."
    chitin_longsword: "Cette lame fut taillée dans la carapace d'une bête des profondeurs sans nom, son tranchant irrégulier mais effroyablement aiguisé."
    chitin_shellplate: "On dit que la porter protège des traîtres, surtout parce que la puanteur assure que personne ne s'approche assez pour essayer."
    chitin_walkers: "Ces bottes gigotent à chaque pas, car les plaques de chitine ne sont qu'une coquille pour les créatures qui vivent à l'intérieur."
    choir_conductor_staff: 'Pointe-le et tout le bûcher suit ton tempo. Lâche-le et le feu improvise. Ne le lâche pas.'
    choir_hymnbread: 'Cuit pendant une homélie qui refusait de finir. La croûte a pris vers la quatrième heure.'
    choir_obsidian: 'Dalle volcanique polie. Fraîche au toucher, insensible aux coups de couteau comme aux poêles brûlantes.'
    choir_procession_boots: "Faites pour une marche lente et digne vers l'autel. Mets-toi à courir et la dignité part en premier."
    choirblade_altus: 'Une verge entière de chêne sec. Chaque enfant de la paroisse sait très précisément combien d ennuis elle mesure.'
    choirforged_cuirass: 'Une protection de plates complète en forme de tablier de pâtissier. Le volant est porteur.'
    choirforged_draught: 'La dernière tasse du pot. Amère, granuleuse, et pourtant la plus corsée de la journée.'
    choirforged_gauntlets_of_cooling_vent: "Fendus pour évacuer la chaleur, ce qu'ils font, droit sur tes poignets. Un marché, pas un cadeau."
    choirforged_greatblade_of_cooling_vent: 'Sorti quand le rôti est entier et la famille assise. Le rôti est rarement la seule chose découpée.'
    choirforged_greaves_of_ashen_song: 'Des pinces à vélo dans une cathédrale sans vélos. La prévoyance est sa propre récompense.'
    choirforged_helm: 'Fonte, format familial. La bosse à gauche date du jour où le propriétaire précédent s est permis un avis.'
    choirforged_ration_of_ashen_song: 'La mère de quelqu un a préparé ça. Les sandwichs sont coupés en triangles; l apocalypse attendra.'
    choirforged_sabatons_of_ashen_song: 'Homologuées pour les inondations, la boue et le magma peu profond. Une pointure de trop, comme il se doit.'
    choirforged_signet: 'En fer, cabossé, taille unique qui ne va à personne. Il a détourné des aiguilles, des échardes, et un assassinat.'
    choirmaster_locket: 'Toutes les clés de la cathédrale sur un seul anneau de fer. Qui le porte répond de chaque porte fermée et de chaque bruit derrière.'
    chokepoint: "Se place exactement là où la gorge se resserre jusqu'à rien. Le joaillier qui l'a conçu insiste : c'est une coïncidence."
    cinchward: 'Se resserre tout seul quand le porteur oublie de respirer prudemment près de la plaie. Sur la posture, il professe des convictions fermes.'
    cinder_band: "Un eclat d'un coeur jadis entier. Il se souvient. Il veut recuperer le reste."
    cinder_bow: ''
    cinder_cleave: ''
    cinder_crown: "La lueur vous donne l'air important. L'ensemble, complet, vous donne l'air inevitable."
    cinder_cuirass: 'Doublée de fragments de cœur de cendre. Vous réchauffe dans la toundra et vous embrase légèrement ailleurs. Un compromis thermique assumé par tous ceux qui ont survécu à leur premier hiver.'
    cinder_fangs: ''
    cinder_fists: "A un claquement de doigts d'etre aussi le probleme des cinq autres pieces."
    cinder_greaves: 'Chaque siege ou vous vous asseyez se souvient de votre passage. La braise aussi.'
    cinder_heart: "Arraché encore en fusion à la poitrine d'un golem d'acier de feu, assez brûlant pour tenir lieu de forge entière à lui seul. Les enclumes posées trop près fondent tout simplement. Les fidèles de la forge ont cessé d'appeler ça un accident."
    cinder_heart_amulet: 'La piece que toutes les autres tentent encore, discretement, de rejoindre.'
    cinder_heart_scepter: "Pointez-le vers l'ensemble au complet et quelque chose dans votre poitrine se met a avoir des idees."
    cinder_heart_staff: "Porte une braise dont la chaleur ne s'éteint jamais vraiment. La colonne s'en souvient."
    cinder_locket: "Renferme une braise qui refuse, par principe, de s'eteindre."
    cinder_loop: "Sertie d'éclats de cœur de braise. Agréablement chaude, et de temps à autre bien trop chaude après quelques verres."
    cinder_maul: ''
    cinder_sash: "Tissée du même fil que le Cœur-de-Cendre. Rend une garde supportable durant l'heure la plus froide."
    cinder_striders: "Vous rechauffe l'hiver. Vous pistage la nuit. L'ensemble garde toujours un oeil ouvert, allez savoir pourquoi."
    cinder_waistguard: "Jamais froide au toucher. L'ensemble entier a de la fievre, poliment, ensemble."
    cinderchant_robe: 'Matelassé, long jusqu au sol, légèrement roussi. Mourir dedans est acceptable; ouvrir la porte dedans, non.'
    cinderchoir_alloy: "Sonne un accord quand on le frappe, ce qui charme jusqu'au moment où il faut le travailler en silence."
    cinderchoir_brew_of_molten_antiphon: "Brassée près des cheminées, elle refuse obstinément de refroidir. Souvent elle te réchauffe. Parfois elle t'avertit."
    cinderchoir_cincture_of_black_choir_pyre: 'Chaude à la main et perdant discrètement du gris. Tu trouveras de la cendre dans tes vivres des semaines.'
    cinderchoir_cincture_of_black_choir_vitrified: 'Un ruban de tailleur gradué en pouces et en empans. Il a mesuré trois empereurs et leur a menti à tous.'
    cinderchoir_crest_of_black_choir: 'Porté à l envers depuis la crue de cendres. Sent la lessive et la détermination tranquille.'
    cinderchoir_locket_of_black_choir: "Renferme une pincée d'un recueil brûlé. Les nuits calmes, la cendre s'ordonne en vers lisibles. Ne les lis pas."
    cinderchoir_tassets_of_black_choir_pyre: "Couve doucement à l'ourlet. Élégant, chaud, et un vrai danger près de l'herbe sèche."
    cinderchoir_tassets_of_black_choir_vitrified: 'Renforcées là où la prière use le plus vite. Les pièces sont neuves; les genoux en dessous sont une cause perdue.'
    cinderchoir_warboots_of_molten_antiphon: 'Semelles coulées dans la coulée refroidie. Elles gardent la chaleur du jour tard dans la nuit glaciale. Un cadeau, surtout.'
    cindercloth_gloves: 'Transforme chaque poignee de main en petit briefing de securite.'
    cindercloth_hood: 'Garde la tete au chaud. Garde les sourcils nulle part en particulier.'
    cindercloth_legs: "La decharge electrique est techniquement incluse. Elle n'a jamais, dans aucune version, ete voulue comme un atout."
    cindercloth_robe: "Des moines l'ont tisse sous un voeu de brulures au second degre. La plupart ont tenu le voeu. Peu leurs sourcils."
    cindercloth_sandals: "Laisse des empreintes lumineuses. La discretion n'a jamais vraiment ete le plan."
    claude_axe: "Jadis maniée par l'infatigable Claude, dont l'endurance au combat devint légende — et dont l'endurance sous les draps devint un tout autre avertissement."
    cleancut: 'Laisse un tranchant si précis que la plaie se referme mal autour. Les chirurgiens étudient les cicatrices. Ils ne publient pas leurs conclusions.'
    clearsight: 'Améliore la visibilité à la Cicatrice — une faveur moins douce que prévu. Certaines choses sont mieux à moitié vues.'
    cobalt_battlecleaver: 'A deux mains, double tranchant, encore chaud du lezard cendreux. Terrible pour ouvrir le courrier, excellent pour ouvrir les ennemis.'
    cobalt_club: "Bois kweebec si dense qu'il a oublie avoir jadis vecu de photosynthese."
    cobalt_crushers: 'Jointures renforcées pour les moments où parler ne sert plus à rien. Ce qui arrive tout le temps.'
    cobalt_daggers: "Enduites deux fois d'extrait glandulaire, et une fois, officieusement, de mauvaises decisions."
    cobalt_longblade: 'Une lame fiable rechauffee par les ecailles cendrées. Fait exactement ce quon attend. Dans un monde de surprises ca vaut quelque chose.'
    cobalt_mace: "Durcie a la cire de ruche et a l'acier forge au crepuscule. Elle impose une loi : la ruche avant tout."
    cobalt_pike: 'Pointe en ecaille chaude et montee en ecorce de kweebec. Assez longue pour piquer de loin. Strategie ou lachete, a vous de voir.'
    cobalt_shortbow: "Bras en ecorce kweebec, corde de plumes chargees d'orage qui bourdonnent avant chaque tir."
    cobalt_staff: "Écorce de kweebec surmontée d'une amulette taillée spécialement pour la patience, dont elle a bien besoin — il canalise la magie de l'eau avec la sérénité tranquille d'un robinet qui refuse obstinément de se fermer pour de bon."
    cobalt_sword: 'Gainee de peau de lezard cendre. Chaude en main et ne trahissant absolument rien.'
    cobalt_waraxe: "Taillée dans une écaille chauffée au soleil et scellée de cire ambrée, elle bourdonne d'une note que les woolices ont appris à craindre avant même de voir la lame. Une réputation utile. Rarement méritée, marmonnent les bergers."
    cobalt_wargreaves: "Assez lourdes pour que s'accroupir devienne un exercice. Assez légères pour courir quand l'exercice tourne mal."
    cobalt_warhelm: "Équipement standard pour les soldats qui n'ont encore rien fait pour mériter un couvre-chef plus classe."
    cobalt_warplate: 'Protège les organes vitaux. Les autres se débrouillent seuls.'
    cocoon_king_amulet: "Une chaîne de soie dorée encore tiède du cocon dont elle fut tranchée. Le Roi ne la réclame jamais à voix haute. Il n'en a pas besoin — les pensées du porteur s'effacent un peu plus chaque jour."
    cocoon_king_cowl: 'Tissée de la même soie dorée, portée basse sur les yeux. Tout au-delà de la portée du bras se brouille en une brume dorée bien confortable — miséricorde ou dessein, au choix.'
    codex_of_the_damned: "Relié en cuir de tumulus. Chaque sort qu'il contient a déjà trahi son lanceur."
    codex_of_the_deep: ''
    coiffe_fuwa_black: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_fuwa_white: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_pepe: 'A humble green cap. The starter flex. Every royal was once just a pepe in a hat.'
    coiffe_pepe_royal: 'The pepe ascended. A gilded crown for those who bought the top and never sold.'
    collapse_alloy: 'Allié de choses tombées ensemble. Il ne paraît stable que parce que les composants ont déjà renoncé.'
    collapse_bludgeon_of_last_tremor: 'Brandie une fois par un Rifflet réglant un différend territorial, après quoi le territoire a cessé de discuter. Termine les phrases, les combats, et parfois le mobilier, à peu près dans cet ordre.'
    collapse_greaves: "Lourdes exprès. Dans un monde où l'on peut s'envoler, c'est un réconfort, pas une plainte."
    collapse_helm_of_widening_crack: 'Protège la tête de tout, sauf de ce qui se trouve juste au-dessus — autrement dit, la vraie menace ici.'
    collapse_pendant_of_widening_crack: 'Renferme une pincée de poussière de la première chose tombée ici. Il y a beaucoup de poussière ici.'
    colophon: "La marque de l'imprimeur, au dos, a survécu à l'imprimeur, à l'atelier, et à la majeure partie de la langue dans laquelle le livre fut écrit."
    concussion: "Nommée cliniquement par sa dernière victime, dans le bref instant avant qu'elle n'oublie comment fonctionne le langage."
    convergence_pendant: 'Deux gemmes, une monture, une dispute sans fin sur le lever de soleil qui compte.'
    copper_band: "Rend votre doigt vert apres une heure. Le joaillier insiste c'est une 'patine' pas un empoisonnement au cuivre."
    copper_cleaving_axe: ''
    copper_hoe: "L'outil agricole le moins cher en cuivre, et chaque outil de cuivre de la fange finit par arborer exactement la même teinte de vert, qu'il le veuille ou non."
    copper_pickaxe: "Assez tendre pour se bosseler a chaque mauvais coup. Les mineurs compensent en frappant plus. La montagne, comme toujours, n'est pas impressionnee."
    copper_sickle: "Le cuivre s'oxyde en patine verte en une semaine. Les herboristes trouvent cela esthetiquement approprie. Le cuivre n'a pas d'opinion."
    corbac_head: 'A crow-skull crown for the carrion-minded. The beak points at whatever you are about to loot.'
    cordwood: "Mesurée dans l'ancienne unité tombée en désuétude pour le bois, faute d'assez de bois restant pour la justifier."
    core_forge_key: "La légende veut que le Roi-Braise ait frappé une clé unique dans son propre feu de cœur couvé, trop brûlante pour une main mortelle. Ce n'est pas cette clé. Plusieurs forgerons jurent qu'elle en est proche."
    coronet_band_of_silent_court: 'Nul ne se rappelle avoir accepté ce résultat, une affirmation restée, à ce jour, sans la moindre vérification.'
    coronet_edge_of_silent_court: "Son comportement contredit sa propre description, une annotation que l'artisan a remise à plus tard, indéfiniment."
    coronet_lattice: "Sa classification est contestée depuis sa découverte, ce dont l'équipe d'étude débat encore."
    coronet_legguards_of_silent_court: "Il a été conçu pour prouver un argument que personne ne se rappelle, un fait que l'artisan considère comme un atout."
    coronet_poultice_of_empty_seats: "Celui qui l'a mis en flacon n'a jamais arrêté de version finale, et personne n'a encore demandé de remboursement."
    coronet_resin: "Personne ne peut dire avec certitude d'où cela vient, et le dossier a été discrètement clos, sans résolution."
    coronet_rod_of_silent_court: "Le comité de conception n'a en réalité jamais tranché la question, un constat qu'on peut choisir de trouver rassurant ou franchement inquiétant."
    coronet_tonic_of_silent_court: "Son arrière-goût relève de l'opinion personnelle, un fait discrètement omis de l'étiquette."
    coronet_torc_of_empty_seats: "Il fonctionne exactement comme décrit, à ce qu'on dit, et pourtant, c'est toujours considéré comme une réussite."
    coronet_treads_of_silent_court: "Le design a survécu à trois objections distinctes, si bien que toute plainte à ce sujet a fini par s'éteindre d'elle-même."
    coronet_visor_of_empty_seats: "Il fonctionne grâce à un détail technique, et le comité n'a plus jamais siégé pour en reparler."
    coronet_warblade_of_silent_court: 'Il a été approuvé par une décision partagée, et la dispute a enterré tous ses instigateurs.'
    corvid_eye: 'Perçant, noir, et semble encore vous observer. Les apothicaires les broient pour des onguents de vision nocturne. Éthiquement trouble.'
    corvid_feather_lance: "Empennee de plumes de corbeau pour l'aerodynamisme. Les corbeaux sont encore faches."
    crab_claw_grips: "Façonnées à partir de pinces qui ont passé une vie entière à s'accrocher aux choses. Les gantelets ont hérité ce trait. Les retirer nécessite de l'eau chaude, de la patience et un ami qui ne vous jugera pas."
    crab_claw_hatchet: "La pince s'ouvre et se ferme encore toute seule. Surtout aux pires moments."
    crab_claw_joint: "Le mécanisme de charnière d'une pince massive. Les ingénieurs les étudient. L'ingénierie est meilleure que tout ce qu'on a construit."
    crab_pincer_shivs: 'Articulations de pince de crabe aiguisées. Elles pincent avant de couper, ce qui est pire.'
    crab_shell: "Une carapace robuste prélevée sur un crustacé qui a clairement perdu un débat avec quelqu'un de très affamé."
    crab_shell_cuirass: "L'armurier a regardé le crabe, a dit « c'est déjà une cuirasse en gros », et a facturé plein tarif pour ce qui était essentiellement un remodelage et une couche d'huile."
    cracked_bone: 'Un fémur qui a connu de meilleurs siècles. Étonnamment solide malgré les fissures. Les chiens le veulent encore. Les nécromanciens aussi.'
    cracked_mace: "La tete cliquette a chaque mouvement. L'integrite structurelle est une suggestion pas une garantie."
    crazy_belt: 'Une ceinture de gobelin, teinte en rouge profond avec des pigments qui ne sont certainement pas du jus de baies.'
    crazy_helmet: 'Assemblee par un gobelin ayant entendu, une fois, une rumeur peu fiable sur les casques.'
    crazy_tunic: 'Une robe cramoisie autrefois portée par un gobelin dont la santé mentale avait déserté depuis longtemps.'
    crimson_brick: 'Brique rouge sang irradiant de chaleur des heures apres le four. Les sculpteurs de batons en font des logements de baguette.'
    crimson_truffle: 'Un mets souterrain si rare que son prix se fixe aux encheres, jamais par une logique de marche sensee.'
    crimson_truffle_heart: "Le noyau dense et palpitant tire de la chambre la plus profonde qu'une truffe cramoisie ait formee."
    crooked_staff: "Une canne avec des illusions de grandeur magique. Le seul sort qu'il lance c'est 'embarras leger'."
    crow_feather: 'Une plume noire irisée. Les fabricants de plumes paient bien. Le fantôme du corbeau hantera vos traits de plume. Prétendument.'
    crown_dust: 'Il a été catalogué deux fois, sous deux théories différentes, par un comité depuis dissous.'
    crown_of_quills: "Une couronne qui a oublié ce qu'elle couronne. Elle s'asseoit mal à l'aise, non convaincue de sa propre autorité ou de son but."
    crown_of_the_void_sovereign: "Le vide n'a officiellement pas de souverain. Cette couronne fut une auto-nomination que personne de présent n'a eu la densité de contester. Les archivistes indiquent le propriétaire comme « contesté »."
    crownfire_rod: "Il fonctionne, provisoirement, en attendant un nouvel examen, alors personne n'a pris la peine de se plaindre."
    crownless_blade: "Son but a été reconsidéré une fois terminé, une maigre consolation, vu l'alternative."
    crownless_cuisses: 'Il fonctionne sous réserve, aucun remboursement, aucune autre question acceptée.'
    crownless_signet: "Il fait ce qu'on lui dit, éventuellement, un compromis trouvé une fois que tout le monde a renoncé à discuter."
    crownrot_cuirass_crown: "Sa fiabilité fait l'objet d'un débat permanent, et l'artisan est passé à autre chose avant de finir sa pensée."
    crownrot_cuirass_godbone: "Il fait ce qu'on lui dit, éventuellement, une résolution qui n'a presque rien résolu."
    crownrot_greaves_of_gilded_ruin: "Il fait exactement une chose, et la conteste même, une malfaçon, ou peut-être tout l'intérêt de la chose."
    crownrot_helm_crown: "Il fonctionne exactement comme décrit, à ce qu'on dit, et l'artisan est passé à autre chose avant de finir sa pensée."
    crownrot_helm_godbone: "Le mode d'emploi s'est perdu dans un débat houleux, ce que le porteur a décidé de prendre pour argent comptant."
    crownrot_ration_of_rotting_halo: "Le goût rappelle une décision prise trop vite, donc l'effet varie, considérablement, d'un convive à l'autre."
    crownrot_signet: 'Il fonctionne, techniquement, dans la plupart des cas, et le porteur a appris à vivre avec cette ambiguïté.'
    crude_branch: 'Le bois de chauffage des uns est apparemment le composant de fabrication légendaire des autres.'
    crude_hatchet: "Plutot un caillou aiguise sur un baton. L'esthetique homme des cavernes est gratuite."
    crude_ring: "Du fil de fer plie avec des aspirations de joaillerie. Si vous plissez les yeux ca a presque l'air intentionnel."
    crystal_bread: 'La croute scintille. La mie brille. Votre dentiste aura un avis, artisanal qui plus est.'
    crystal_focus_staff: "Monté d'un éclat fracturé qui dévie chaque sort vers l'endroit qui lui plaît, rarement celui que vous visiez. Les vieux mages appellent ça du « caractère ». Tous ceux en aval appellent ça autrement, en plus court."
    crystal_ice_staff: "Le cristal qui le couronne n'a jamais fondu, ni sous la chaleur de forge, ni sous l'été, ni par pure rancune. Pratique pour garder une boisson fraîche. Bien plus convaincant sur un ennemi."
    crystal_tide_staff: "Un bâton surmonté d'un cristal rouge qui pulse d'énergie marémotrice. Il arrive qu'il dégoutte, ce qui ruine l'effet dramatique pourtant soigneusement préparé par le porteur lors des grands moments."
    crystal_ward_tome: "Incruste d'eclats de cristal. Chaque sort lance a travers elle sonne comme un lustre qui tombe tres lentement."
    crystallized_loaf: 'Si dense en mineraux que les forgerons le brisent pour les eclats plutot que de le manger. Comprehensible.'
    crystallized_tanjirize: "Du tanjirize ayant subi une transformation qu'aucun botaniste ne sait expliquer et que la plupart préfèrent ne pas imaginer."
    cuirass_of_the_hollow_king: "Nulle commande royale ici : une Néantphalène a fait pousser cette armure, un roi s'en est attribué le port. La nuance importait à une seule personne, désormais hors d'état d'en débattre."
    cured_gauntlets: 'Cuir correctement tanne. Enfin quelque chose qui ne sent pas le chien mouille. Ca sent le chien sec a la place.'
    cursed_amalgam: 'L aboutissement d une carrière d herboriste condensé dans un pot. Il chuchote la nuit. Personne ne demande ce qu il dit.'
    cursed_boot_contradiction: "Une botte maudite qui échange la liberté de mouvement contre l'obstination. Le porteur se déplace maladroitement mais se croit invincible par pure contradiction."
    cursed_fungus: "L'apogée incontestée de l'ambition herboristique, un champignon d'une malveillance si concentrée qu'il murmure les noms de ceux qui approchent d'une voix semblable à des feuilles mortes raclant un couvercle de cercueil. Les cueilleurs vétérans rapportent que la récolte n'a lieu que s'il consent à se laisser prendre, une distinction qui n'apporte aucun réconfort."
    cursed_gem: 'Murmure de sombres promesses a quiconque le tient trop longtemps bien que les promesses concernent surtout le mal de dos.'
    cursed_gem_powder: 'Le murmure a empire apres le broyage. Maintenant il critique votre technique d artisanat en temps reel.'
    cursed_helm_paradox: "Un heaume maudit qui émousse l'esprit tout en fortifiant le corps. Il accorde la vie par la perte de clarté, un marché écrit dans le paradoxe."
    cursed_loaf: 'Chuchote des recettes a quiconque le tient. Le pain a des opinions sur votre technique et elles ne sont pas tendres.'
    cursed_root: "Arrachée à un champignon maudit avec de réels efforts, car elle a l'habitude de riposter plus fort qu'il n'est raisonnable pour quelque chose sans colonne vertébrale. Elle reste chaude en réserve et tressaille parfois. Les herboristes chevronnés appellent ça normal, d'un ton qui ne convainc absolument personne."
    cursed_straw: "Prise d'un épouvantail significativement plus animé que prévu. Tressaute encore quand personne ne regarde."
    cursed_straw_amulet: "Un serment prete par une chose qui, techniquement, n'a pas de bouche. Il l'a tenu quand meme, par depit."
    cursed_wheat: 'Un épi de grain noirci par la magie maléfique, ses grains murmurent de mécontentement.'
    deadweight: "Plus lourde que le travail ne l'exige, et le travail n'a jamais protesté contre l'excédent."
    deathgrip: "Verrouille les doigts à l'instant de l'impact et le reste un battement de plus que le porteur ne le souhaiterait."
    deathless_blade: 'Extraite des tumulus. Affûtée sur la limite du monde des morts. Un outil qui se souvient du sang.'
    deep_scale: "Noire comme l'abysse d'où elle vient. Le léviathan en portait des milliers. Tu en as une. Reste humble."
    deepbreath: "Ajusté si près qu'inspirer à fond demande un effort conscient. La plupart des porteurs cessent de le remarquer dès la deuxième semaine."
    deepmoss_leggings: "Rembourrées d'une mousse qui reste faiblement humide quel que soit le temps de port, tirée d'où que les Ours de Mousse fassent leur tanière. Elle a un avis sur le fait de rester au sec. Cet avis perd."
    deepreach: "Étend la portée du lanceur jusqu'à des endroits qu'il préférerait ne pas visiter en personne."
    deepscale_fists: 'Jointures renforcées contre ce qui niche dans les vieilles tombes.'
    deepwater_breastplate: "Tannée au fond du bourbier ; la rouille a fini par renoncer. Elle sent le marais parce qu'elle en vient."
    deepwater_stilts: 'Élève le porteur au-dessus du pire de la vase. Le pire trouve quand même un chemin vers le haut.'
    deepweald_longbow: "Tendu assez ferme pour décocher une flèche en silence à travers l'épaisse obscurité du Weald, où le son porte plus loin que la vue ne l'a jamais fait. La meute chasse à l'oreille, ici ; vous devriez en faire autant."
    deepwoven_carapace_of_deep_canopy: 'Étagée comme la canopée dont elle porte le nom, chaque pli poussé du précédent, ce qui fait de sa réparation une affaire de jardinage plus que de forge.'
    deepwoven_cincture_of_drowned_weald_matron: "Enroulée du fil de la Matrone elle-même, qui tient un nœud qu'aucune main humaine n'a fait et dont on ne le dissuadera pas."
    deepwoven_cincture_of_drowned_weald_mire: "Une ceinture tissée qui se serre toute seule en eau froide, réflexe pratique, tant qu'on oublie qu'elle ne prévient jamais avant."
    deepwoven_composite: "Tissé sous pression à l'établi le plus profond du Weald, où les couches se lient si étroitement que la couture devient une rumeur plutôt qu'un détail."
    deepwoven_crest_of_deep_canopy: "Entrelacé de liane de canopée vivante qui continue de pousser sur la tête du porteur, lentement, dans une direction qu'il ne choisit pas."
    deepwoven_crest_of_drowned_weald: "Tissé si serré sous l'eau qu'il n'a pour ainsi dire pas séché, et pèse désormais un cheveu de plus que prévu, à jamais, par pure rancune."
    deepwoven_philter_of_drowned_weald_matron: "Infusé de soie-de-Matrone qui ne se dissout jamais complètement, de sorte qu'un fil en demeure toujours, réparant ce qu'on ne lui a jamais demandé."
    deepwoven_philter_of_drowned_weald_mire: 'La version simple que portent les guides, moitié moins forte et nettement plus fiable, échange qui, ici-bas, vous garde en vie.'
    deepwoven_splitter_of_deep_canopy: "Équilibré pour abattre la liane de canopée qui ligature les paliers, tâche banale qu'il accomplit avec un enthousiasme démesuré."
    deepwoven_tassets_of_deep_canopy: "Poussées en frondes qui se chevauchent comme la canopée au-dessus, si bien qu'un coup bas écarte les feuilles et n'y trouve que d'autres feuilles."
    demon_codex: ''
    dented_mace: "Plus de bosses qu'un pare-chocs de parking. Chacune represente une lecon de 'viser sous le genou'."
    diadem_casque_of_broken_diadem_crown: "Le porteur insiste qu'il fonctionne ; les preuves restent incertaines, une décision prise sous une forte pression temporelle."
    diadem_casque_of_broken_diadem_godbone: "Le savoir-faire est solide ; la prémisse ne l'est pas, ce qui est aussi rassurant que ça en a l'air."
    diadem_charm_of_falling_crown: "Son efficacité reste à ce jour non vérifiée de façon indépendante, ce que plus personne n'a l'énergie de contester."
    diadem_chausses: "Il a été terminé par pure entêtement, que plus personne n'a l'énergie de contester."
    diadem_cordial_of_falling_crown: "L'étiquette mentionne un ingrédient qu'aucun connaisseur ne parvient à identifier, un fait discrètement omis de ladite étiquette."
    diadem_elixir_of_broken_diadem: "Son effet se déclenche, ou pas, de façon imprévisible, alors il est vendu avec un haussement d'épaules plutôt qu'une garantie."
    diadem_lattice_crown: 'Ses propriétés exactes dépendent de la personne interrogée, un écart resté sans responsable désigné pour le résoudre.'
    diadem_lattice_godbone: "Savoir si c'est une matière ou plusieurs demeure une affaire ouverte, et la seconde explication garde, encore aujourd'hui, des partisans."
    diadem_vambraces_crown: "Il fait le travail qui lui a finalement été assigné, ce qui relève soit du concept entier, soit d'une simple erreur d'arrondi."
    diadem_vambraces_godbone: 'Il remplit sa fonction déclarée avec une réticence visible, alors le débat a été reporté indéfiniment.'
    diamond: "Un éclat de carbone compressé qui a oublié de devenir magnifique, arraché à l'étreinte avare de la terre."
    diamond_bag: "Le contenu de cette bourse pourrait acheter un petit royaume, bien qu'il serve assez mal d'arme de jet."
    diamond_bread_1: 'Une miche de pain saupoudrée de diamants concassés, chaque bouchée un craquement satisfaisant qui punit la mâchoire.'
    diamond_powder: "La preuve que la seule chose incassable en ce bas monde, c'est l'étiquette de prix qui va avec."
    diving_crude_grips: "Au fond du puits noyé, elles agrippent tout avec une force qu'aucune main vivante ne devrait tenir. Ici en surface, elles agrippent votre patience tout aussi fort — trois jours pour sécher, chaque heure sentant la mare tidale qui traverse une mauvaise semaine."
    diving_visor: "Fabriquée à partir d'un crabe qui a combattu trois pêcheurs et une mouette avant de succomber. La visière se referme encore par surprise, ce que l'artisan qualifie de fonctionnalité."
    doomed_axe: "Le dernier fossoyeur a gardé celle-ci. Sept cents tombes et ça continue. Le travail n'arrête pas, l'outil ne rouille pas."
    doomed_battleaxe: "Fournie d'office après le troisième appel. Nul ne sait ce qui est advenu du deuxième."
    doomed_club: 'Quand les mots ne suffisent plus, voici la phrase suivante. Les mots suffisent rarement, par ici.'
    doomed_fang_daggers: 'Lames jumelles prises à la Veuve de Cendre. Elles se souviennent encore de la morsure.'
    doomed_grimoire: "Chaque entrée consignée avant l'inhumation. Les marges se remplissent encore."
    doomed_longsword: "Chaque coup murmure le nom de quelqu'un que vous avez oublie. Coincidence, probablement."
    doomed_mace: 'Forgee a partir de promesses jamais tenues. Chaque coup est des excuses arrivees bien trop tard.'
    doomed_shortbow: 'Les fleches tirees par cet arc arrivent avant le son. Les cibles se plaignent rarement.'
    doomed_spear: 'Réquisitionnée sur un lancier qui ne dépose plus de plaintes.'
    doomed_staff: "Canalise la magie de l'eau a travers un noyau de terreur compressee. Tres efficace, moralement discutable."
    doomed_sword: "La derniere creation du forgeron avant la retraite. La retraite n'etait pas volontaire."
    doomhammer_eternal: "Le marteau qu'une lignée de Soldats Brisés utilisait pour clore les disputes, les combats, et finalement son propre dossier de service. Se manie encore comme si la dispute n'était pas tout à fait terminée."
    draconite: 'Essence de dragon cristallisee que les dragons aimeraient beaucoup recuperer arretez de la miner s il vous plait.'
    draconite_powder: 'Fume legerement a temperature ambiante. Le stockage exige un coffre ignifuge et un mental tres calme.'
    draconize_flour: 'Necessite des gants ignifuges pour petrir. La miche obtenue a, parfois, grogne en retour.'
    dragon_fire_breath: ''
    dragon_frost_breath: ''
    dragon_petal_extract: "Huit ingredients, une fiole, aucune explication pour la chaleur que l'etiquette appelle « magie »."
    dragon_pollen: "Fine poussière dorée récoltée sur les étamines de dragonlys, qui affole légèrement tout appareil de mesure alchimique jamais inventé, dégageant une chaleur qui trahit la proximité de forces qu'il vaudrait mieux ne pas déranger. Universellement allergène, extraordinairement précieuse, et portant l'effluve ténue mais indéniable du regret."
    dragon_void_essence: ''
    dragonite_crust: 'La croute se defend quand on la brise. Les forgerons incrustent des eclats dans les haches pour un tranchant auto-affute.'
    dragonlily: "Une impossibilité botanique revêtue d'écailles iridescentes et exhalant un parfum malodorant qu'on décrirait au mieux comme un croisement entre salon funéraire et fosse de soufre, que même les vrais dragons trouvent suffisamment désagréable pour l'éviter. Les érudits restent divisés sur la question de savoir s'il s'agit d'une plante prétendant être un reptile ou d'un reptile ayant renoncé à toute ambition."
    drakar: 'Draconic plate that runs warm to the touch. Small dragons find it flattering; large ones find it rude.'
    draugature: 'Une bande de cuir endurci forgée dans le froid implacable des cryptes, tissée des tendons des morts sans repos qui errent dans les étendues gelées.'
    draugr_bone: "Étonnamment difficile à briser en deux. La vieille rigidité, disent les fossoyeurs, ne relâche jamais vraiment un draugr — et n'a apparemment jamais lu la partie où elle était censée s'arrêter après la mort."
    draugr_bone_staff: ''
    draugr_daggers: "On dit que c'est l'idiot du village qui les a forgés. L'idiot du village refuse, prétendant qu'il a des standards."
    draugr_fractured_amulet: "Un charme fissuré d'origine draugr, ses incrustations runiques éclatées sur l'os vieilli."
    draugr_helmet: 'La porter ne vous confère ni autorité ni respect, mais elle dissimule parfaitement une tempe qui se dégarnit.'
    dread_lance: ''
    driftwalkers: 'Ne laisse aucune trace. Surtout parce que vous ne touchez jamais le sol assez longtemps pour ca.'
    drowned_amber: "De la résine durcie sous l'eau qui a emprisonné ce qui passait alors, qu'on aurait tort d'examiner à la lueur d'une bougie."
    drowned_root_grimoire: "Relié en écorce de racine encore humide d'on ne sait où, les pages molles de pourriture mais l'encre, allez savoir comment, intacte. On murmure que l'Oracle des Profondeurs en aurait écrit les marges."
    drownmarked_casque_matron: 'Taillé dans une plaque que la Matrone a muée sans revenir la chercher, soit de la chance, soit une invitation que nul ne veut avoir acceptée.'
    drownmarked_casque_mire: "Porte la pâle ligne de marée que le Weald profond laisse sur tout ce qu'il prend et rend, soit plus de choses que le Weald n'aime avouer rendre."
    drownmarked_chausses_of_rising_tide: "Marquées à la hauteur exacte où l'eau monta la nuit où le Weald prit les paliers inférieurs, portées en souvenir et, parfois, en avertissement."
    drownmarked_cordial_of_rising_tide: "Mélangé au tournant d'une marée dont le Weald nie l'existence, que le brasseur cale à l'instinct et refuse d'expliquer."
    drownmarked_elixir: "Porte la pâle ligne de marée de tout ce qu'a touché le Weald profond, que l'étiquette présente comme un gage d'authenticité et que les sages lisent comme la trace de son parcours."
    drownmarked_kris_of_fen_below: "Son ondulation s'accentue à mesure qu'il baigne dans l'eau du fen, si bien qu'un vieux kris ouvre une plaie qu'aucune lame droite ne saurait recoudre."
    drownmarked_loop_matron: "Coulé d'un croc que la Matrone laissa dans quelque chose qu'elle jugea pas digne d'être achevé, distinction que le porteur préférerait ne pas partager."
    drownmarked_loop_mire: "Teinté par l'eau du bourbier d'un noir qui engloutit la lueur d'une bougie, porté par qui préfère que ses mains n'attirent pas le regard."
    drownmarked_resin: "De la résine suintée d'un arbre que l'eau profonde a pris, pleurant encore lentement, ce que les artisans tiennent pour signe que sa mort n'est pas achevée."
    drownmarked_saber_of_fen_below: "Récupéré dans la strate que les guides nomment le Fen-d'en-Bas, nom qu'ils prononcent plus pour vous en dissuader que pour vous y mener."
    drownmarked_saber_of_rising_tide: "Courbé à la forme de l'eau où il fut trempé, il taille dans le sens du courant et résiste à qui le manie à contre-courant."
    drownmarked_tome_of_rising_tide: "L'encre coule un peu plus à chaque ouverture sous l'eau, ce que les érudits du Weald profond soutiennent être le livre qui se corrige lui-même."
    dualpact_circlet: "Liee a deux elements qui n'ont accepte de partager que la garde, rien d'autre."
    duke_breastplate: "Gravee d'un blason de deux gobelins se disputant une piece. Aucun des deux ne gagne."
    duke_crossbow: ''
    duke_rapier: "Dérobée à un duc gobelin qui jurait, haut et fort et souvent, ne s'en servir que pour se gratter le dos. Pas une âme à la cour ne le croyait, et toutes le laissaient pourtant continuer de le raconter."
    duke_sash: "Portee a chaque execution a laquelle il n'a personnellement pas assiste. L'image, ca compte."
    duke_signet: "Un sceau en forme de bonhomme allumette faisant un pouce leve. Il l'a commande lui-meme."
    duke_signet_ring: "Noblesse a la mode gobeline : accordee selon le nombre de pairs qu'on a pousses dans l'escalier."
    duke_sword: 'Appartenait a un duc gobelin qui avait des opinions tres arretes sur la fiscalite.'
    dungeon_key_goblin_cave: 'Cette clé rouillée vibre de magie latente, permettant à son porteur de franchir les protections dissimulées qui gardent le trésor du Roi Gobelin.'
    duskfire_rusk: "Luit faiblement au crepuscule. Les tanneurs y trempent le cuir pour une finition que personne n'arrive a expliquer."
    duskite: 'Un mineral qui absorbe la lumiere si agressivement que les mineurs n arretent pas de le perdre dans leurs propres poches.'
    duskite_powder: "Si sombre qu'elle fait paraître la véritable ombre ensoleillée par comparaison. Les marchands de cosmétiques l'ont essayée une seule fois, raconte-t-on, et la cliente n'a plus jamais été revue quittant la boutique en plein jour."
    earthsea_tassets: "Moitie terreux, moitie oceanique. Chaque moitie est convaincue que l'autre n'est que pour la frime."
    ectoplasm: 'Résidu de fantôme translucide. Passe à travers les conteneurs non enchantés. Le stockage est une aventure en soi.'
    ectoplasm_locket: "S'ouvre sur un portrait qu'aucun vivant n'a jamais reconnu. Plusieurs morts, si, mais ils se taisent."
    ectoplasmic_tome: "La reliure suinte un liquide translucide. Le bibliothécaire a dit que c'était une fonctionnalité, pas un défaut."
    ekusoni: 'An exorcist mask that hums faintly near the recently deceased. Probably nothing.'
    elder_totem: "Sculpté sur des décennies par des mains arthritiques. Irradie une sagesse calme et une légère désapprobation de tout ce que vous avez fait aujourd'hui."
    elder_totem_amulet: "Sculpté dans le bois d'ancien Kweebec par des mains si petites que les marques d'outils ressemblent à de la calligraphie. Le totem représente une créature que les Kweebec refusent de nommer, décrire ou reconnaître. Ils facturent cependant généreusement son effigie."
    elder_totem_talisman: "Taille dans un totem que la Matrone-Ciel a garde plus longtemps que Pandora n'a de nom."
    elemental_catalyst_air: ''
    elemental_catalyst_earth: ''
    elemental_catalyst_fire: ''
    elemental_catalyst_water: ''
    elixir_of_agility: "Des reflexes liquides, qualite feline. La prise de decision n'est pas incluse, et ca se voit tres vite."
    elixir_of_chance: 'Probabilite distillee. Ameliore votre feuille de personnage. Votre chance reelle reste, tragiquement, inchangee.'
    elixir_of_intelligence: "Aiguise l'esprit pour une heure, et l'ego pour beaucoup plus longtemps."
    elixir_of_strength: "Vous fait temporairement frapper comme quelqu'un de deux fois votre taille. Effets secondaires: excès de confiance et flexion involontaire."
    elixir_of_vitality: "Distribuée d'office avant un assaut. Elle ne demande pas si vous êtes prêt."
    embalmed_ancestral_club: "Voici tout ce qui subsiste après les rites d'embaumement. Un poids que sa taille ne laissait pas deviner."
    embalmed_bow: "Conservée dans les épices funéraires. Tirée de l'arsenal d'un garde-cadavre. La corde n'était pas destinée aux vivants, et pourtant elle tient."
    embalmed_club: 'Chaque coup reveille quelque chose qui dormait pour une tres bonne raison.'
    embalmed_cuirass: "Doublée de soie d'embaumement récupérée aux réserves des fossoyeurs. Garde sa forme quand tout le reste a cédé."
    embalmed_grips: 'Enveloppées de la même soie que les morts. La prise ne se relâche jamais, même après.'
    embalmed_legguards: 'Vos jambes sont momifiees et, allez savoir comment, remarquablement bien accessoirisees.'
    embalmed_locket: "Renferme un portrait peint sur soie funéraire. Le visage n'a pas vieilli depuis la séance."
    embalmed_silk: "Bandelettes arrachées à un charnier-de-givre, conservées fraîches par des siècles de froid plutôt que par l'art d'un embaumeur. Font d'excellents pansements, à condition d'avoir renoncé à demander d'où elles viennent."
    embalmed_silk_ring: 'Un anneau tissé de soie embaumée. Les morts ont une poignée de main étonnamment ferme quand ils le portent.'
    ember_core: "Un petit soleil piégé dans du minéral. Brûle les sacoches. Les aventuriers expérimentés les transportent dans des pots d'argile."
    ember_core_scepter: "Une braise sertie de fer, réconfortante jusqu'au moment où l'on remarque que la chaleur n'a jamais cessé de grimper. Les vieux forgerons ont une expression pour cette sensation. Elle ne se traduit pas gentiment."
    ember_reduction: 'Gras fondu des rôtis du réfectoire. Friture, imperméabilisation, corruption des chiens — un seul pot fait tout.'
    ember_scripture: "Encré d'une écriture qui n'apparaît qu'à la chaleur. La lire réclame un âtre et une patience de saint."
    ember_shortbow: "Les flèches tirées luisent tout le chemin jusqu'à la cible, ce que le fletcher appelle magnifique et l'archer appelle la fin de toute surprise, pour toujours."
    ember_silk: 'Fil tissé à partir de cocons qui couvent éternellement, tiède au toucher et périlleux pour la main imprudente.'
    ember_silkblade: 'Forgée à partir de fibres de soie enflammées et trempées en une lame brûlante qui refuse de refroidir. Assez souple pour être nouée, à condition que vos doigts soient immunisés contre les brûlures au troisième degré.'
    ember_studded_belt: 'Le magmooligan brûlait quand cette laine a été tondue. Le tondeur aussi, peu après. La ceinture conserve une chaleur douillette et un vague sentiment de regret mutuel.'
    ember_walkers: "Les semelles ne refroidissent jamais, prodige d'enchantement ou grave defaut de conception, au choix."
    emberchant_breastplate_of_last_verse: 'Retirée de la table d autel d un seul coup sec. Les chandeliers n ont rien remarqué.'
    emberchant_breastplate_of_twelve_voices: 'Huit épaisseurs de ouate entre vous et le monde. Le monde comprend le message.'
    emberchant_composite: 'Stratifié en chantant, car les vieux forgerons juraient que ça fixait le grain. Ça fixe le grain. Nul ne sait pourquoi.'
    emberchant_core: "Un charbon qui refuse tout net de s'éteindre. Les forges l'adorent ; qui le met en poche apprend vite à cesser."
    emberchant_extract: 'Ce qui reste après l ébullition. Le cuisinier dit bouillon; l alchimiste dit solvant; l évier dit collègue.'
    emberchant_hand_axe_of_twelve_voices: 'Assez petite pour être lancée, assez méchante pour être gardée. Le choix hante chaque combat.'
    emberchant_legguards_of_last_verse: 'De la laine d hiver dans un bâtiment chauffé par un dragon. Grand-mère n accepte aucune objection.'
    emberchant_tonic_of_last_verse: 'Du miel, des herbes et un soupçon de cendre. Fond assez lentement pour survivre au sermon.'
    emberchant_treads_of_last_verse: 'Tricotées assez épais pour traverser les dalles froides à minuit sans réveiller la crypte.'
    emberchant_waraxe_of_twelve_voices: "Le chœur a douze voix. Celle-ci règle les disputes avec les douze d'un coup."
    emberglow_staff: "Le noyau de braise en son cœur ne s'éteint presque jamais totalement. Les brûlures qu'il inflige non plus."
    embermaw_gauntlets: 'La chaleur résiduelle de fragments de cœur de cendre rend ces gantelets désagréablement chauds. Comme une poignée de main donnée par un fiévreux.'
    emberwalk_striders: 'Te laissent traverser un lit de braises sans souci. Le retour est un achat à part.'
    emberweave_hauberk: "Tissee dans une fibre qui garde le souvenir des flammes et refuse de vous laisser l'oublier."
    empyrean_charm_of_broken_diadem: "Il remplit sa fonction déclarée avec une hésitation manifeste, et la différence a cessé d'avoir de l'importance en chemin."
    empyrean_elixir: "Les instructions se contredisent à mi-parcours de l'étiquette, et personne n'a encore demandé de remboursement."
    empyrean_sash_of_falling_crown: "Son but a été reconsidéré une fois terminé, et l'artisan le maintient, pour l'essentiel."
    enchanting_dust: 'Residu magique en poudre que les joailliers saupoudrent sur les accessoires pour les faire briller de maniere inquietante.'
    enka_muru: 'A traveller’s cloak stitched for long roads and short conversations.'
    enriched_dough: "Une pâte crue si enrichie en minéraux qu'elle passerait presque pour un échantillon géologique. Les bricoleurs en raffolent."
    ensable_crystal: 'A sa place sous vitrine, selon tous les musees qui ont toujours refuse de le payer.'
    ensable_key: "Inseree de travers, la serrure se remplit d'obsidienne. La fortune sourit aux prudents."
    ensable_pincers: 'Quelque chose la-dessous en veut assez pour continuer a chercher.'
    etched_signet: "Porte un blason grave qui pourrait etre un loup un chat ou de l'art abstrait. Le joaillier non plus ne savait pas."
    eternal_biscuit: ''
    eternal_eclipse_blade: "Existe dans une ombre permanente quelle que soit la source de lumière, tout comme l'aile de Mite du Vide dont elle a été taillée. Les astronomes ont des opinions. La lame ne les a jamais sollicitées."
    eternal_wisdom_chain: 'Porte une clé pour chaque caisse jamais expédiée par ce poste.'
    eternwool_band: "Coulé dans le même lot qu'une centaine d'autres. Celui-ci est revenu."
    ethereal_ukranize: "On l'a trouvé là où les archives disent qu'il ne devrait pas être, alors le registre liste simplement les deux, côte à côte."
    evenhand: "Équilibrée à une fraction que le forgeron refuse de révéler. Chaque porteur jure qu'elle le favorise personnellement. Il n'en est rien."
    executioners_verdict: "Résonne comme le marteau d'une cour martiale à l'abattage, rendu par le Soldat Brisé qui a tiré la courte paille ce siècle-là. La sentence est toujours la même. Les papiers ne sont pas requis."
    faded_spellbook: "La moitie des pages manquent. Contient un seul sort lisible: une liste de courses d'il y a 200 ans."
    fangs_of_the_abyss: 'Arrachés à quelque chose qui aurait dû rester endormi au fond du vide. Les manches tremblent encore parfois.'
    farpoint: "Visée sur une cible que le porteur peut à peine voir encore. Le temps qu'elle touche, ce n'est déjà plus vrai."
    farshot: "Bandé pour une portée dont aucun archer sensé n'a besoin à la Cicatrice, où tout ce qui mérite d'être visé se sent déjà à l'odeur."
    farwalker: "Conçu pour une distance dont personne n'est censé avoir besoin au mur. Quelqu'un en a manifestement eu besoin quand même."
    faultline_extract: "Tiré d'une fissure vive. Les manipulateurs portent des gants ; la fissure s'en moque."
    faultline_grips_of_split_sky: "Moulées sur l'avant-bras d'un Rifflet le jour où le ciel surplombant la faille a cessé de feindre la solidité. La force de préhension triple. La perception de la profondeur ne survit pas à l'échange."
    faultline_hand_axe_of_torn_ground: "Vendue pour la prospection. Employée, exclusivement, pour l'autre usage."
    faultline_poultice_of_split_sky: "Appliqué dans les jointures d'un Rifflet en mue pour empêcher la nouvelle carapace de durcir de travers. Ça fonctionne à peu près pareil sur les gens : inégalement, mais ça fonctionne."
    faultline_quartz: "A poussé le long d'une fracture : parfait partout, sauf sur la seule ligne qui compte."
    faultline_torc_of_split_sky: "Un veilleur le portait en fixant un ciel qui, techniquement, avait cessé d'être un seul ciel. Reflète l'horizon deux fois le long de la couture. Le second reflet regarderait en retour, murmure-t-on."
    faultline_torc_of_torn_ground: 'Te relie, littéralement, à un monde dont le sol est une blague récurrente. Résultats mitigés.'
    faultline_treads_of_torn_ground: "Semelées avec les plaques de pied muées d'un Rifflet, qui accrochent le sol fracturé avec le même instinct que le membre vivant autrefois. Une semelle trouve toujours prise. L'autre en discute encore."
    faultline_visor_of_split_sky: "Ici, l'horizon a une couture. La fixer pour attirer la chance est facultatif et déconseillé."
    faultline_warbelt_of_split_sky: 'Assez large pour y pendre un petit arsenal. Le porteur le fait souvent, puis regrette le poids.'
    featherfall_daggers: "Personne ne se souvient avoir accepté ce résultat, et le comité ne s'est jamais réuni à nouveau pour en reparler."
    feathergilt_ingot: 'Sa classification est contestée depuis sa découverte, alors les acheteurs sont invités à juger par eux-mêmes.'
    feathergilt_visor_of_silent_court_crown: 'Il accepte de fonctionner, sous protestation écrite, alors le désaccord a été discrètement intégré au design.'
    feathergilt_visor_of_silent_court_godbone: "Il fait son travail, puis s'en excuse, alors la plainte d'origine n'a été retirée par personne, officiellement."
    feathergilt_waraxe_of_silent_court: "Son artisan a refusé d'en dire davantage, et le porteur a appris à vivre avec cette ambiguïté."
    fen_amulet: "Né du marais et parfumé au marais. Se marie bien avec l'isolement social."
    fen_gland: 'Attire les proies. Repousse litteralement tout le reste, y compris sa propre espece, a distance.'
    fen_impaler: 'Arrachee a un marecage qui a depose une objection formelle et toute trempee.'
    fen_mace: 'Benie par quelque chose qui vit dans la partie la plus profonde du marais. Vous ne voulez pas le rencontrer.'
    fen_moss_clump: "Mousse de marais toxique qui prospère sur les créatures de marais. Les herboristes l'utilisent dans les remèdes anti-poison. L'ironie ne leur échappe pas."
    fen_moss_mallet: 'Un maillet recouvert de mousse de marais vivante qui se régénère la nuit. Frappez suffisamment fort et la mousse soupire.'
    fen_reaper_axe: "Fauche le roseau et l'os avec la même patience. Le marais n'en manque jamais."
    fen_reed: "Un roseau dur comme le fer qui ne pousse que là où le fen est le plus profond, récolté par ceux prêts à y plonger un bras et à croire qu'il ressortira."
    fen_trident: "Trois pointes enduites de boue de marais. L'odeur seule tient la plupart des ennemis a distance. Les allies aussi malheureusement."
    fenrot_composite: 'Une matière laissée pourrir juste au bon degré, fenêtre que les maîtres artisans gardent jalousement et que les apprentis gâchent avec régularité.'
    fenrot_draught: "Fermente un peu plus chaque jour où on ne la boit pas, jusqu'à cesser d'être un remède pour devenir une décision."
    fenrot_draught_of_moonlit_mire: "Nommée d'après une lune qui n'atteint jamais si profond, détail que le brasseur trouve poétique et le buveur, un avertissement, à juste titre."
    fenrot_gauntlets: "La pourriture a rongé la motricité fine depuis des années. Ce qui reste, c'est une prise qui, sincèrement, n'a jamais lâché — exprès ou non."
    fenrot_girdle_of_moonlit_mire: "Teint par l'eau du bourbier d'une couleur qui ne se révèle que sous un rayon de lune, lequel n'atteint jamais si profond, si bien qu'elle reste un mystère à dessein."
    fenrot_girdle_of_quiet_drowning: "Pourri jusqu'à la souplesse pour se serrer d'une main dans le noir, petite grâce que le fen accorde avant de vous la faire payer aussitôt."
    fenrot_greatblade: 'Laissé dans le fen assez longtemps pour se piqueter et se marquer, ce que le forgeron a rebaptisé caractère et facturé en conséquence.'
    fenrot_greaves: "Molles de pourriture d'une façon qui se révèle avancer sans bruit, seule monnaie que le fen respecte."
    fenrot_helm_of_moonlit_mire: "Le cuir s'est ramolli de pourriture et l'est resté, ce qui amortit un coup mieux que tout ce que vendent les gens de la terre sèche."
    fenrot_helm_of_quiet_drowning: 'Scellé assez près pour tenir le fen dehors et, certains porteurs le notent, gênés, assez près pour garder dedans une inspiration retenue.'
    fenrot_ration: "Médecine de campagne enveloppée de feuille de fen qui la conserve et lui prête un goût jamais qualifié de bon par quiconque, seulement d'efficace."
    feran_gauntlets: 'Repoussees en une semaine. Les ferans, imperturbables, ne regrettent deja plus rien.'
    feran_hide_belt: "Cuir de feran tanné, souple et sombre comme une côte sans lune. Le feran était un prédateur solitaire des vasières, et la sangle a hérité de son tempérament — elle grince avec irritation quand elle est mouillée et ne s'accordera jamais avec la moindre élégance."
    feran_hunting_charm: "Un totem d'os de la ceinture d'un feran. Sent le sang de proie et l'embuscade. Les rangers paient le double. Pas de questions."
    feran_pelt: 'Fourrure tachetée de félin incroyablement souple. Les tanneurs ont les larmes aux yeux devant la qualité. Le feran était moins émotif.'
    feran_stalker_gloves: "Le poil se hérisse quand une proie approche — mais aussi durant les orages, près des feux de camp, et à l'instant où le porteur ment. Un gant de chasse et une conscience, cousus dans une seule peau, qu'on ait demandé la seconde partie ou non."
    fingerbind: "S'ajuste à chaque doigt essayé jusqu'ici — un fait que le forgeron qui l'a fait n'a jamais trouvé rassurant."
    fire_spellbook: ''
    firesteel_grimoire: ''
    firstlight_carapace_of_closing_age: "Plaquée du métal pâle qui ne se forme que là où la première aube atteint encore. Cette surface rétrécit chaque année, et les forgerons l'ont remarqué."
    firstlight_extract: 'Distillé à la minute exacte de la première lueur, ce qui laisse aux alchimistes un seul essai par jour et une humeur très courte dès midi.'
    firstlight_halberd_of_world_wound: 'Assez longue pour tenir la lisière de la Plaie à la distance exacte jugée survivable par les gardiens du mur. La mesure est précise et non négociable.'
    firstlight_locket_of_world_wound: "Renferme une pincée de la première aube, scellée avant le moindre pâlissement. Elle n'a pas pâli. Il est conseillé au porteur de ne pas l'ouvrir pour en connaître la raison."
    firstlight_warboots_of_world_wound: "Lacées pour porter un pèlerin durant l'unique heure où la Plaie reste calme. Ratez le créneau et les bottes sont le moindre des soucis."
    fish_scale: "Écaille arc-en-ciel d'un brochet. Les joailliers les polissent en pendentifs bon marché. Le poisson n'a pas eu son mot à dire."
    flame_crystal_staff: "Couronne d'une braise qui refuse de mourir, tout comme le mage qui la porte."
    flare_band: 'Douce en main. Un vrai probleme des que vous lancez quoi que ce soit.'
    flooded_nave_key: "Gluante d'une eau de nef qui ne sèche jamais vraiment. Le Prieur Noyé y mène encore une congrégation ; personne n'a expliqué à qui il reste à prêcher."
    flying_fish_wing: "Une nageoire translucide qui essaie encore, par habitude, d'attraper le vent."
    footnote: "Cite une source qui n'existe plus, à l'appui d'une affirmation restée elle aussi sans réfutation."
    fortress_legguards: 'Vos jambes deviennent une forteresse. Votre mobilité devient un souvenir.'
    fracture_cordial_of_long_collapse: 'Fermenté dans un nid de Rifflets, dans une carapace restée entrouverte pour de bon. Il soigne lentement et ne réclame rien en retour — ce qui, ici, frôle le suspect.'
    fracture_hauberk_rift: "Composée de lames brisées. Chacune a cédé en faisant son travail ; à toi d'achever le leur."
    fracture_hauberk_void: "Cotte de mailles taillée pour le corps pré-mue d'un Rifflet, chaque anneau coulé légèrement de travers, exprès. Elle tient comme tenait le Rifflet : à peine, et seulement sous tension."
    fracture_ingot: 'Coulé avec une microfissure au milieu, vendu comme « du caractère ». Ça tient. À peu près.'
    fracture_loop_rift: "Il y a dans l'anneau une fêlure que tu ne vois pas vraiment. Tu y penseras absolument sans arrêt."
    fracture_loop_void: "Sertie d'une pierre qui n'en est pas une. Fixer le chaton vide n'est pas conseillé deux fois."
    fracture_resin: "Durcit plus vite que tu ne peux te dégager. Demande à n'importe quel apprenti, par son surnom."
    fracture_sash: "Effilochée aux deux bouts comme la peau d'un Rifflet s'effiloche à une ligne de mue, et tenant sa forme avec la même entêtement. La remplacer ressemble, allez savoir pourquoi, à une trahison."
    fracture_scepter_of_long_collapse: "Ne gagne pas tant les combats qu'il ne les repousse, un mur croulant à la fois, avec la même patience qu'un Rifflet survivant à un tunnel qui s'effondre. Magie lente. Magie fiable."
    frost_grimoire: "Ses pages restent humides, quel que soit le nombre de feux qu'on allume à côté. Le lire donne l'impression de se noyer dans le savoir — une sensation que son auteur, qui qu'il fût, trouvait apparemment instructive."
    frost_recurve: "Un arc recurve impreigne d'essence glaciaire. Les fleches gelent en vol. Les doigts de l'archer aussi."
    frost_sabre: 'Une lame courbe qui traîne du givre. Chaque coup met fin à une relation.'
    frost_shard: "Cristal éternellement gelé qui vole la chaleur à tout son entourage. Reste froid pour que tu n'aies pas à l'être."
    frost_shard_spear: 'Un éclat de givre monté sur du thorium. Il ne dégèle jamais, ce qui fait de le tenir une expérience qui forge le caractère.'
    frost_shard_sword: ''
    frost_titan_cudgel: "Ce qu'un titan des glaces utilise comme cure-dent. Ce qui t'aplatit en un seul coup."
    frost_totemic_club: "Surmontée d'une effigie totémique gelée. Son expression sculptée change avec le temps. Et ta chance."
    frostbound_band: "Marque l'heure sans un bruit. Quelqu'un continue de le remonter, par habitude."
    frostclaw_warhelm: "Forgé à partir de chitine de griffe de titan et trempé dans l'eau de fonte des glaciers. Le froid ne semble jamais l'avoir dérangé. Vous, cependant, frissonnerez."
    frostfang_bow: 'Tiree une seule fois, et tous les loups a des kilometres a la ronde repondent.'
    frostfang_requiem: 'Moitié épée, moitié chant funèbre. Devine quelle moitié tu entends en premier.'
    frostfur_hatchet: ''
    frostfur_tuft: "Fourrure blanche d'un loup-de-givre, éternellement froide au toucher. Utile pour les manteaux. Impoli envers le loup."
    frosthewn_axe: 'Taillée dans un glacier, tranchant en adamantite. Servie froide, à chaque fois.'
    frosthowl_stilettos: 'Des dagues qui sifflent dans le froid. Le son est profondement perturbant pour les ennemis et les allies. Surtout les allies.'
    frostkoa_cleaver: 'Forgée dans la bile de grenouille des glaces, la lame suinte une sueur froide qui refuse de geler même ici-bas. Elle ne demande jamais de sympathie. Elle en reçoit quand même.'
    frostkoa_eye_pendant: "L'oeil cligne selon son propre horaire. Vous avez decide de ne pas y penser."
    frostkoa_staff: 'Taille dans une echine qui a pousse un dernier coassement, tres convaincu.'
    frostmaw_scale: 'Muée lors de la plus vieille mue de la matriarche cendrée. Encore tiède sur les bords.'
    frostshamble_girdle: 'Retient votre pantalon et quelque chose de nettement moins vivant qui traine derriere vous.'
    frostshamble_helm: "Chuchote toute la nuit. Surtout des critiques. Aucune n'est positive."
    frostshamble_longsword: ''
    frostshamble_pendant: "Marmonne apres la tombee de la nuit. Refuse de preciser ce qu'il veut jusqu'a ce qu'il soit trop tard."
    frostshamble_treads: 'Laisse des empreintes qui continuent de trainer quelques pas apres que vous vous soyez arrete.'
    frostshell_aegis: 'Des couches de carapace de crabe gelée sur plaque de thorium. La biologie marine, militarisée.'
    frostshell_grimoire: "Relié en carapace de crabe gelée. Il se présente avant de présenter l'engelure."
    frostshell_pendant: 'Un fragment poli de coquille-de-givre sur une chaîne de thorium. Il irradie le froid et une légère angoisse existentielle.'
    frostshell_plate: 'Armure de crabe gelée qui ne dégèle jamais. Les forgerons la travaillent dans des forges sous-zéro, en se plaignant tout du long.'
    frostshell_signet: "Faite d'un fragment de carapace de griffe-de-givre. Le crabe n'a pas signé le formulaire de don."
    frostward_mace: ''
    frostweaver_wraps: "Tissées dans la toison d'un yéti et renforcées d'éclats de cœur glaciaire. Le yéti les veut récupérer."
    frostwolf_fang_ring: "Mord en retour quand vous essayez de l'enlever. La meute n'oublie pas les insultes."
    frostwolf_hauberk: "Vous n'aurez plus jamais froid. Vous ne serez plus jamais invite au sud non plus."
    frostwolf_leggings: 'Douce comme une taniere. Blindee comme un siege. La meute contient des multitudes.'
    frostwolf_mitts: 'Vos mains restent chaudes. Quiconque vous serre la main se souvient qui commande.'
    frostwolf_paws: "Mord la glace comme si elle avait insulte votre famille personnellement. C'est complique."
    frostwolf_staff: ''
    frozen_striders: "Cuir traité au froid qui renonce enfin à l'immobilité. Le mouvement, enfin."
    fungal_flatbread: "Un pain fin infuse de pate d'orchidee ivoire. Les tailleurs le trempent pour impermeabiliser les tissus."
    galerunner_crown: 'Assez aérodynamique pour gagner une demi-seconde sur votre temps de retraite.'
    gecko_chopper: "Manie, dit-on, par le plus grand roi gecko que Pandora n'ait jamais eu."
    gecko_saber: ''
    gecko_scale_leggings: 'La queue du gecko a repousse en une semaine. Votre reputation prendra sans doute plus longtemps.'
    gecko_tail_segment: "Détaché volontairement par le gecko. Il se tortille encore. Vous pouvez l'utiliser en alchimie ou le regarder danser. À vous de voir."
    gecko_venom_lance: "La blessure est la partie facile, finie en un instant. Ce que laisse derrière lui le venin de gecko met bien plus longtemps à vous pardonner d'être passé par là."
    gecko_venom_sac: "Petite mais puissante. Le venin n'est pas mortel pour les humains mais ruinera toute votre semaine. Les apothicaires les adorent."
    genesis_blade: "Forgée, d'après les pèlerins qui font encore l'ascension, à partir du visage qu'avait le monde avant de se fracturer. Personne n'est en position de le confirmer."
    genesis_greataxe_of_origin_line: 'Assez lourde pour que son premier coup règle la plupart des différends et que le second soit surtout pour la forme. Il y a rarement un troisième.'
    genesis_hauberk: "Maillé d'un fil tréfilé avant que quiconque songe à consigner la méthode. La technique est morte avec son forgeron ; le haubert, jusqu'ici, a survécu à la perte."
    genesis_loop: "Coulée du premier alliage que le monde ait jamais refroidi, s'il faut en croire les Auditeurs — et on les croit, la plupart du temps, quand ils s'accordent, ce qui est rare."
    genesis_mail: "Maillée d'un métal dont les pèlerins jurent qu'il précède la fracture, même si les forgerons qui en auraient la certitude n'ont pas survécu pour le confirmer."
    genesis_moss: "Une mousse qui ne pousse que là où tombe encore la première lumière, et meurt dès qu'on l'ombrage. Les récolteurs vont vite et s'excusent auprès de personne en particulier."
    genesis_suize: 'La souche originelle de suize, antérieure à la culture elle-même. Elle survivra probablement à ceux qui tentent de la cultiver.'
    ghost_cap: 'Un champignon translucide qui brille faiblement dans le noir, comme pour se moquer de vous qui avez passé des heures à le chercher en plein jour.'
    ghost_wafer: 'Racié sur un feu-follet des tombes après son extinction. Les arbaletiers en font une résine pour cordes.'
    ghostcap_alloy: 'Un métal ensemencé de spores spectrales qui le gardent faiblement luminescent, agréable à travailler et impossible à égarer sur un établi sombre.'
    ghostcap_almanac_of_deep_canopy: 'Ses pages sont de coiffe-de-spectre pressée, lisibles seulement dans le noir où elles luisent, ce qui fait du Weald profond le seul endroit où le lire vraiment.'
    ghostcap_carapace_of_drowned_weald: 'Cloutée de champignons coiffe-de-spectre qui continuent de luire quand le porteur cesse de bouger, mauvais trait dans une cachette et pire encore dans un cercueil.'
    ghostcap_falchion_of_drowned_weald: "Sa lame est parcourue de spores coiffe-de-spectre qui luisent le long de chaque entaille, de sorte que la plaie s'éclaire avant que la douleur n'arrive."
    ghostcap_fists_of_deep_canopy_matron: "Cloutés d'une coiffe plus rare qui ne luit que dans le noir véritable, soit toujours sous la canopée profonde, si bien qu'ils ne s'éteignent jamais."
    ghostcap_fists_of_deep_canopy_mire: 'Les coiffes de champignon sur les jointures luisent plus fort selon la force du coup, transformant une bagarre en spectacle lumineux non désiré.'
    ghostcap_flail_of_drowned_weald: "Sa tête est une coiffe-de-spectre durcie qui s'allume à l'armé, indiquant à la cible l'instant précis où broncher sans jamais vraiment le lui permettre."
    ghostcap_philter_of_drowned_weald: "Luit faiblement une heure après qu'on l'a bu, assez pour trouver la sortie du noir et juste assez pour que quelque chose vous trouve."
    ghostcap_warboots_of_drowned_weald_matron: "Semelées de coiffes luisantes qui trahissent le porteur dans le noir, ce que le fabricant a jugé un échange équitable contre le fait de ne jamais s'égarer."
    ghostcap_warboots_of_drowned_weald_mire: "Étanchéifiées contre une eau qui jamais ne s'évacue tout à fait, si bien que chaque pas se pose sur un petit floc intime que seul le porteur entend."
    gilded_brew_of_last_regent: "La recette a fait plus l'objet de disputes que de brassage, ce que le brasseur affirme être intentionnel."
    gilded_carapace_of_hollow_throne: 'Il fonctionne sur la base de la confiance, ce que personne ne peut confirmer sans relancer la dispute.'
    gilded_chopper_of_hollow_throne: "Il fait son travail, puis s'en excuse, alors le manuel a été volontairement laissé vague."
    gilded_circle_of_last_regent: "Sa fiabilité fait l'objet d'un débat permanent, alors le manuel a été volontairement laissé vague."
    gilded_extract: "Son authenticité a été validée de justesse, et rien n'est venu écarter tout à fait la seconde explication."
    gilded_locket_of_last_regent: "Il accepte de fonctionner, sous protestation écrite, un détail que tous les concernés ont accepté d'oublier."
    gilded_philter_of_hollow_throne: "La recette a fait plus l'objet de disputes que de brassage, un détail que l'étiquette révèle en tout petits caractères."
    gilded_stilettos_of_last_regent: 'Il a été achevé malgré une hésitation unanime, un compromis que nul ne se montre vraiment prêt à défendre.'
    gilded_tassets_of_hollow_throne: "Son histoire change selon qui la raconte, et la différence a cessé d'avoir de l'importance en chemin."
    gildsteel: "On l'a trouvé là où les archives jurent qu'il n'aurait pas dû se trouver, alors les deux entrées restent au dossier, sans réconciliation."
    girthstone: 'Taillée par un tailleur qui a mesuré les ambitions du porteur plutôt que son tour de taille. Les deux se sont révélées plus grandes que prévu.'
    glacial_basinet: "Un heaume si froid qu'il s'embue de l'intérieur. Visibilité facultative, survie obligatoire."
    glacial_brand: "Une epee longue trempee dans l'eau de fonte glaciaire. La lame givre entre les coups, c'est dramatique et ne resout rien."
    glacial_buckle: 'La boucle est un éclat de givre qui ne fond jamais. Pratique. Parfois porteur.'
    glacial_cinch: "Une ceinture forgée en alliage de cœur glaciaire. Elle se resserre et ne se desserre jamais, un peu comme l'hypothermie."
    glacial_fortress_greaves: 'Bouger dans ces jambières est un entraînement complet. Rester immobile aussi.'
    glacial_grasp: 'Tout ce que vous touchez gèle légèrement. Y compris votre arme, vos alliés, et votre déjeuner.'
    glacial_grips: "Gantelets légers forgés pour les archers et lanceurs du grand Nord. La paume est doublée d'une membrane translucide qui améliore la sensibilité tactile tout en isolant du froid. Les mains restent précises même à des températures létales. La membrane a un aspect légèrement phosphorescent la nuit, ce que certains trouvent utile et d'autres trouvent inquiétant."
    glacial_heart: "Le noyau gelé de la poitrine d'un yéti, contenant assez de froid pour geler un lac. C'est déjà fait."
    glacial_loop: "Un anneau de cristal gelé qui se régénère quand il s'ébrèche. La garantie est littéralement infinie."
    glacial_march_boots: 'Conçues pour la marche éternelle à travers les étendues gelées. Ou le trajet du matin. Même énergie.'
    glacial_medallion: "Un médaillon de cristal de givre pur. Il ne cesse jamais d'être froid. Un peu comme votre ex."
    glacial_morningstar: ''
    glacial_pike: "Une longue pique à pointe de cristal glaciaire. Garde les ennemis à une distance confortable, c'est-à-dire n'importe laquelle."
    glacial_recurve: 'Cordée de tendons gelés qui ne se détendent jamais, contrairement à ta prise au tir.'
    glacial_signet: "Taillée dans le cristal-cœur d'un glacier. Elle engourdit le doigt qu'elle occupe, un effet que son fabricant qualifie d'avantage."
    glacial_verdict: "La lame rend son propre jugement à chaque combat : coupable de s'être approché."
    glacial_visor: "La visière s'embue par temps chaud. L'ancien propriétaire a résolu le problème en n'allant jamais nulle part de chaud."
    glacial_waistguard: "Bourrée de cuir tanné à la cendre. Tient mieux une ligne qu'un éclat."
    glasschant_daggers: 'Les bons ciseaux. On vous a dit de ne jamais y toucher. Vous y touchez.'
    glassong_grips: 'Du caoutchouc jusqu au coude. Ici l eau de l évier dissout les cuillères, alors ils taillent épais.'
    glasswrought_brew_of_molten_antiphon: 'Infusé sur le fourneau depuis l aube. Assez fort pour qu on puisse se disputer avec.'
    glasswrought_carapace_of_black_choir: 'Sanglée côté poitrine. Se plie à plat pour le rangement et se déplie dans un cri qui vide la pièce.'
    glasswrought_claymore_of_black_choir: "Sonne une note haute et claire à l'impact. Cette note fut la dernière qu'entendirent plusieurs."
    glasswrought_falchion_of_black_choir: 'Denté pour les croûtes qui se défendent. Dans cette paroisse, elles se défendent.'
    glasswrought_fists_of_black_choir: 'Rembourrées pour une poêle jamais lavée, par principe et pour le culottage.'
    glasswrought_focus_of_molten_antiphon: 'Plumes de phénix, paraît-il. La poussière s enflamme, ce qui est une façon d être minutieux.'
    glasswrought_philter_of_black_choir_pyre: 'Brûle deux fois: en entrant, puis quand vous dites enfin ce que vous pensez.'
    glasswrought_philter_of_black_choir_vitrified: 'Médicinale, selon la femme de ménage. Grise, selon tout le monde.'
    glasswrought_stilettos_of_molten_antipho: 'Deux couteaux d office, minces comme des excuses. Pèlent une pomme en un ruban ou une serrure en une séance.'
    glasswrought_tassets_of_molten_antiphon: 'Ourlée haut contre l eau de vaisselle et les rats. Jamais le pratique n aura semblé si lugubre.'
    gobadoc_eye: 'Un œil injecté de sang arraché au Seigneur de Guerre Gobelin. Il roule encore nerveusement, comme s il cherchait la prochaine chose à dévorer.'
    gobeline_ring: 'Délicat selon les normes gobelins, ce qui signifie seulement trois arêtes tranchantes et une tache suspecte. La pierre précieuse est un morceau de verre coloré poli dont le joaillier gobelin était extrêmement fier. Le signaler est une insulte grave dans la culture gobeline. Et aussi une condamnation à mort.'
    goblin_cleaver: "Volé à un gobelin qui jurait que c'était un héritage familial. La rouille dit le contraire."
    goblin_ear: "Oreille de gobelin préservée dans une solution saline artisanale. Utilisée dans diverses préparations alchimiques comme composant de base. Les gobelins trouvent cette pratique offensante. Les alchimistes trouvent la réaction des gobelins fascinante d'un point de vue académique, ce qui n'améliore pas les relations diplomatiques."
    goblin_grudge_axe: "Chaque gobelin qui a possédé cette hache l'a utilisée sur un autre gobelin. La tradition c'est la tradition."
    goblin_gunpowder: 'Composé explosif artisanal. Les gobelins mesurent les quantités au feeling. Les taux de survie reflètent cette méthodologie.'
    goblin_knuckle_ring: "Forgée à partir de l'os de phalange préféré d'un gobelin — le sien. Le gobelin aurait été philosophe face à cette perte, et puis il a cessé de l'être. S'adapte à tous les doigts, car les gobelins ont apparemment des phalanges de taille universelle. L'évolution est mystérieuse."
    goblin_loot_bag: "Un petit sac de jute plein de babioles volées. Surtout des boutons, un os de poulet, et la lettre d'amour regrettable de quelqu'un."
    goblin_masher: "Les gobelins n'assaisonnent pas leur nourriture, ils la présentent à ceci. La technique se transpose remarquablement bien aux crânes."
    goblin_raider_vest: "Rapiécé à partir d'au moins quatre armures différentes, aucune n'étant assortie ni acquise légalement. Un insigne effacé sur la poitrine dit 'Propriété de' suivi d'un nom gratté si violemment qu'il a laissé un trou."
    goblin_scimitar: "Les gobelins ne forgent pas d'épées. Ils les trouvent. Celle-ci a été trouvée dans la cage thoracique de quelqu'un d'autre."
    goblin_stompers: "Cousues par des cordonniers gobelins qui avaient clairement des avis tranchés sur le confort des pieds mais aucune formation. La botte gauche est légèrement plus grande que la droite. Si c'était intentionnel reste un sujet de débat académique féroce."
    goblin_sword: 'La teinte verte provient du cuivre, du sang de gobelin, ou des deux — les philosophes conseillent de ne pas poser la question.'
    goblin_tooth: "Une canine plaquée or arrachée de la bouche d'un officier gobelin. L'or est réel. La dentisterie ne l'était pas."
    goblin_tooth_belt: "Chaque dent appartenait a quelqu'un qui avait agace un chef gobelin en personne. La liste etait longue."
    goblin_trinket_chain: "Une chaîne de babioles volées, de pièces chapardées et d'au moins une dent qui n'appartenait pas au gobelin. Les gobelins appellent ça « haute couture ». Les autres appellent ça une pièce à conviction."
    goblin_wartop: "Un casque qui a traversé plus de crânes gobelins qu'une migraine particulièrement tenace. Chaque propriétaire a gravé son nom à l'intérieur, créant une histoire en couches d'une calligraphie de plus en plus déplorable. Les bosses ajoutent du caractère. Les taches de sang, du contexte."
    godbone_saber: "Il fait le travail qui lui a finalement été assigné, et les documents officiels n'en disent rien."
    godbone_shard: 'Ses propriétés exactes dépendent de la personne interrogée, et le dossier a été discrètement clos, sans résolution.'
    godbone_torc: "Il a été forgé pendant une dispute que personne n'a gagnée, alors le porteur a cessé de demander."
    godflesh_plate: "Sa garantie s'annule dès qu'on le questionne, et la seconde version n'a jamais vu le jour."
    gods_maw_key: "Coulée dans quelque chose qui faisait jadis partie du dieu, du temps où le dieu s'en servait encore. La Gueule ne la réclame pas tant qu'elle l'exige."
    godspear_impaler: "Forgée pour tenir une ligne à un seuil qu'aucun Gardien de Porte n'était censé tenir seul. Peu importe l'extrémité que vous saisissez ; ce qui compte, c'est d'être du bon côté de la porte."
    godspine_staff: 'Sa fonction a été tranchée à pile ou face, une distinction sans grande différence.'
    godstep_sandals: 'Il fait exactement une chose, et la conteste même, ce qui est soit rassurant, soit profondément préoccupant.'
    golden_fleece: "Brille comme de l'or veritable. Chaque juge a, un jour, essaye de mordre dedans pour verifier."
    golden_fleece_amulet: "Cette toison vient d'un triple champion habitue a gagner sans le moindre effort."
    golden_fleece_helm: "Tisse si serre qu'il arrete les fleches et toute chance d'etre pris au serieux."
    golden_fleece_legguards: 'Si confortables que deux aventuriers distincts ont fait la sieste en plein combat en les portant. Record invaincu.'
    golden_larvae: ''
    golden_mushroom: "L'or du pauvre—tout aussi inutile, bien plus difficile à trouver, et impossible à dépenser à la taverne."
    golden_nightcap: ''
    golden_silk: 'Filée par une matrone en vie depuis plus longtemps que bien des empires. Chaque fil vaut davantage que tout votre inventaire réuni.'
    golden_silkling: 'Une larve tissée de fil précieux, dont la minuscule forme irradie cette détermination inébranlable qui transforme les coups faibles en attaques dévastatrices.'
    golden_wheat: ''
    grasploop: "La dernière chose que bien des grimpeurs ont tenue avant de n'avoir plus rien eu à retenir."
    grave_dust: "Fine poudre grise des os d'un hollow. Les nécromanciens paient bien. Votre réputation en ville, cependant, ne s'en remettra pas."
    great_woolame: "Cette épée longue fut extraite des restes luisants du dernier repas d'un moutonnaire, son métal étrangement préservé par les puissants acides gastriques de la créature. Un nettoyage approfondi est fortement recommandé avant usage."
    greater_healing_potion: "Brassee a partir d'extrait de nightcap et de fluides biologiques douteux. Referme les plaies assez vite pour rendre les chirurgiens jaloux."
    greater_stamina_tonic: "Ambre, epaisse, et vous inonde de plus d'ambition que vos jambes ne sont prêtes a assumer."
    green_bread: "Dense, pâteux et faiblement luminescent — ce pain aux champignons nourrit le corps tout en mettant l'esprit à l'épreuve. Certains prisonniers le réclament spécifiquement, juste pour prouver qu'ils ont touché le fond."
    green_mushroom: "Un champignon maladif dont la verdure pâle suggère qu'il prospère grâce à autre chose que la lumière du soleil."
    green_mushroom_powder: 'Un sac de spores finement broyées, récoltées sur les champignons des forêts verdoyantes. Leurs propriétés toxiques sont concentrées en une pincée mortelle.'
    green_sap: "Collant, sucré, et légèrement sentient. Le kweebec n'a pas apprécié l'extraction. C'est essentiellement du sang d'arbre."
    green_stew: 'Cette émulsion de croissance forestière et de désespoir redonne de la vitalité à ceux qui sont assez désespérés pour ignorer sa ressemblance avec la bile de gobelin.'
    grimoire_of_embers: "Chaque sort roussit une page tirée du parchemin de mue d'une Ombrebraise. Finissez le livre : vous connaîtrez son tempérament par cœur, en plus des incantations."
    grimoire_of_tides: "Les pages restent en permanence humides. Le lire donne l'impression de se noyer, ce que l'auteur voyait comme un atout."
    grimoire_of_warding: ''
    grimreminder: "Remise aux nouveaux pèlerins comme leçon sur ce que la Cicatrice fait de l'enthousiasme. La plupart la gardent bien après que la leçon a porté."
    grips_of_the_deathless: "Toute prophétie a besoin d'une main assez ferme pour désigner le pire dénouement sans trembler. Voici les gants de cette main. Le prophète a disparu. La fermeté est restée."
    groundpounder_boots: "Chaque pas laisse une empreinte de la taille d'une assiette. Ici, la discretion n'a jamais figure au programme."
    groundswing: 'Continue sa course jusque dans le sol en cas de raté, ce qui arrive assez souvent pour que les maçons du mur en tiennent un décompte.'
    guardian_chain: "Forgée maillon par maillon à l'image de celle du Dernier Gardien, portée par ceux que le Gardien a personnellement jugés dignes de tenir le dernier mur."
    guardian_core: "Le métal-cœur dense récupéré dans le plastron d'un Gardien tombé, et seulement d'un tombé. Nul n'a encore trouvé comment demander le sien à un Gardien encore debout."
    guardian_gauntlets: "Coulés pour épouser la prise même du Dernier Gardien, l'unique paire connue qui ne soit pas actuellement portée au mur. Chacun suppose une raison à cela."
    guardian_waistplate: "Protege tout entre la poitrine et les jambes. Aussi connu sous le nom d'« tout ce qui compte »."
    guardians_verdict: "Brandi par le Dernier Gardien lors des rares occasions où les mots ne suffisent pas. Quiconque l'a vu s'abattre en convient : les mots n'allaient de toute façon pas suffire."
    hadean_ice: "Glace d'avant l'existence du soleil. Elle ne fond pas. Elle s'en fiche. Elle a survécu aux galaxies. Vous êtes un inconvénient."
    hadean_ichor: 'Le sang du vide lui-même. Quiconque le touche sans enchantements protecteurs oublie son propre nom. Temporairement.'
    hades_breath_weapon: "Canalise ce que la porte en contrebas exhale entre deux ouvertures. En porte aussi l'odeur, ce que l'enchanteur aurait vraiment dû mentionner avant l'essayage."
    hades_heart: 'Arraché au Seigneur des Os après une troisième tentative. Bat encore selon un rythme sur lequel nul ne peut marcher.'
    hades_key: "Taillée dans une dent arrachée à quelque chose qui surveillait cette porte avant que les Gardiens de Porte ne prennent la relève. La tenir fait souffrir vos molaires par sympathie. Nul n'a expliqué pourquoi, à ce jour."
    halfturn: 'Trop lourde pour être balancée deux fois dans le temps où une arme ordinaire en place trois. Le premier coup est généralement le seul qui compte.'
    halo_draught: "Le mode d'emploi se contredit à mi-parcours de l'étiquette, ce que le brasseur affirme être intentionnel."
    halo_splitter: 'Il fonctionne grâce à un détail technique, ce qui est techniquement vrai et totalement inutile.'
    halo_striders: "Ces bottes contestent le concept de marche. Elles croient que le mouvement est une question d'opinion philosophique plutôt qu'un fait physique."
    haloforged_brew_of_last_regent: 'Il a été brassé pour trancher un débat, sans succès, donc les résultats peuvent varier, considérablement.'
    haloforged_carapace_of_last_regent: 'Le design a connu plusieurs versions inconciliables, alors la plainte de départ reste, à ce jour, non retirée.'
    haloforged_circle_of_last_regent: 'Il fonctionne sur la base de la confiance, une particularité que son créateur assume pleinement.'
    haloforged_crest_of_last_regent: "Son artisan a refusé d'en dire davantage, un compromis que personne n'est vraiment prêt à défendre."
    haloforged_fists_of_hollow_throne: "Personne n'a confirmé qu'il fait ce que l'étiquette prétend, ce à quoi le porteur a choisi de ne plus penser."
    haloforged_fists_of_last_regent: "Le comité de conception n'est jamais parvenu à un vrai consensus, alors l'affaire reste, pour l'instant, non résolue."
    haloforged_philter_of_hollow_throne: "La personne qui l'a mis en flacon n'a jamais arrêté de version finale, et le brasseur refuse toujours de choisir un camp."
    haloforged_resin: 'Son authenticité a été validée de justesse, ce qui change selon la saison et la personne qui demande.'
    haloglass: 'Sa pureté est jugée sur une échelle mouvante et négociable, par un comité depuis dissous.'
    hardening_compound: "Applique sur le metal en pleine forge pour l'empecher de changer d'avis sur son destin d'epee."
    hauler_harness: 'Plus de poches que de plaques de blindage. Question de priorités.'
    healing_potion: 'Restaurateur de champ de bataille standard. Brille faiblement, soigne correctement, et sent pire que la blessure traitee.'
    heartmender_torc: "Bourdonne d'une note grave quand quelqu'un à proximité se meurt. Très prisé dans les soirées."
    heartstring: 'Tire faiblement vers la Cicatrice en permanence, comme une boussole tire vers le nord. Certains porteurs cessent de résister.'
    heartwood_core: "L'anneau le plus intime d'un arbre qui a grandi à travers un champ de bataille. Compte plus que des années."
    heartwood_spear: "Montée sur un éclat du cœur même de l'arbre-monde, qui a repoussé en une semaine. L'arbre ne semble pas contrarié de prêter des morceaux de lui-même."
    heartwood_summoner_club: "Taillé dans un cœur-de-bois du Weald qui répond encore quand on y frappe, dans une langue que nul n'a traduite. Les Ours de Mousse, eux, semblent très bien la comprendre."
    heavy_leather_vest: "Le feran qui portait cette fourrure etait, de l'avis general, le plus paresseux d'une espece deja tres paresseuse."
    hemmed_leggings: 'Au moins les ourlets sont droits. Tout le reste est un travail en cours.'
    hermit_pilgrim_trousers: "Taché au-delà de tout rattrapage dès la quatrième semaine. Personne n'en délivre de neuf."
    hermit_sage_cowl: "Portée durant les longues gardes. L'odeur y reste accrochée, lavage après lavage."
    hermit_sash: "Marquée d'encoches pour chaque caisse cédée. Personne n'a recompté depuis."
    hermitude_bow: "Arc conçu pour chasser seul en forêt profonde pendant des semaines. La conception favorise la précision sur la puissance — l'ermite n'a pas d'équipage pour ramener un gibier massif. Une flèche, un animal, un repas. La philosophie est plus simple que la plupart des livres de chasse."
    highguard: 'Tenue au-dessus de la tête par les sentinelles du mur si longtemps que la posture a son propre nom en trois langues, aucune flatteuse.'
    himalayan_flour: "Le summum de la meunerie, la farine juge les boulangers qui l'utilisent."
    hive_ring: "Sculpté dans une gelée royale durcie au venin, il bourdonne de désapprobation pour des décisions que le porteur n'a pas encore prises. On finit par ne plus demander comment il sait. Chaque famille a un parent comme ça."
    hive_warden_mace: "Enduit jusqu'au manche d'une cire pressée par la Mère-Ruche elle-même. Tout scarak des galeries profondes s'écarte respectueusement de son porteur — les malins, du moins ; le conte ne parle jamais deux fois des étourdis."
    hive_wax: 'Ambree et impermeable, recoltee dans des chambres de ruche que les scarak ont desertees en pleine dispute.'
    hive_wax_girdle: "Moulée dans la cire d'abeille et la flamme alchimique, elle se souvient de la forme de son dernier porteur avec une précision troublante. Personne au village ne dira où cette personne est passée. Plusieurs changeront de sujet très vite."
    hiveguard_mace: "Scellé contre le feu et l'inondation, comme le veulent les vieux contes pour les favoris de la Mère-Ruche. Les scaraks l'approuvent, du même air résigné qu'une vieille tante approuve un mariage qu'elle n'a pas arrangé."
    hivewax_belt: "Chitine de scaraks morts comme ils avaient vécu — épaule contre épaule, dix mille à la fois, convaincus jusqu'au bout que l'essaim les protégeait."
    hollow_ichor: "Extrait des plus vieux creux du marais. Les embaumeurs le diluent avant usage ; personne n'explique pourquoi."
    hollow_judge_mace: 'Enroulée de soie funéraire, entaillée de vieux jugements. La pitié ne figure pas parmi ses attributs.'
    hollow_knuckles: 'Rembourrés de soie sur une vieille plaque. Frappent plus fort que le rembourrage ne le laisse croire.'
    hollow_legguards: "Prises dans un tumulus déjà pillé une fois. Rien n'y restait non plus la seconde fois."
    hollow_mace: 'Taillee dans un femur qui a survecu a son proprietaire, sans la moindre discretion a ce sujet.'
    hollow_reckoning_blade: ''
    hollow_root_key: "Jamais taillee, seulement cultivee, d'une racine que le Tyran Gueule-Racine ronge sans cesse vers l'ombre."
    hollow_shiv: "Lames jumelles enroulées de soie funéraire. Les morts, il s'avère, ont un goût remarquable pour les manches."
    hollow_signet: 'Imprime un sceau vierge dans la cire. Cette absence de motif est voulue.'
    hollow_tome: 'La moitié des noms sont biffés. Le livre continue de les inscrire.'
    hollowcrown_draught: "L'étiquette mentionne un ingrédient que personne n'arrive à identifier, précisé sur l'étiquette, mais en caractères minuscules."
    holy_bible: "Écriture divine capable de nettoyer une conscience, à condition d'en avoir encore une à nettoyer."
    hornhead_hatchet: "Forgee autour d'une corne cassee de cornu. Le cornu la veut toujours, mais il lui manque des pouces."
    hornhead_horn: "Une corne de bélier en spirale, encore chaude. L'ancien propriétaire a foncé tête baissée dans un arbre et a perdu."
    hunting_javelin: 'Concu pour le petit gibier. Fonctionne aussi sur le gros si vous le lancez assez de fois et y croyez fort.'
    hush_moth_wing: "Poussière d'aile d'un papillon de nuit qui vole sans jamais consentir au moindre bruit. Les alchimistes la prisent exactement pour cette raison. Le papillon n'a jamais expliqué pourquoi."
    hymn_ember: 'La chaleur qu une pierre garde après le départ du feu. Mise en bocal tant qu il était temps.'
    hymn_of_endings: "Il fonctionne convenablement, de son propre aveu, et l'artisan le maintient, pour l'essentiel."
    hymnbound_core: 'Brique d allumage cirée de la réserve privée du bedeau. Prend du premier coup, ce qui compte ici comme un miracle.'
    hymnbound_cuirass: 'Portée par-dessus tout, engagée envers rien. Des poches assez profondes pour y perdre un encensoir.'
    hymnbound_gauntlets_of_ashen_song: 'Pour les parterres de lys de feu derrière l abside. Les épines brûlent; les gants refusent de l admettre.'
    hymnbound_girdle_choir: 'Te serre dans la posture du chœur : poitrine en avant, menton haut, cible facile pour qui est en bas.'
    hymnbound_girdle_pyre: "Rougeoie faiblement tout au fil de la boucle. C'est soit un avertissement, soit un style, et ça ne se précise jamais."
    hymnbound_hatchet_of_ashen_song: "Légère en main, lourde de conséquences. Laisse une fine poussière grise qui s'infiltre partout."
    hymnbound_helm: 'Sonne faiblement au crépuscule sans cloche attachée. Le forgeron a cessé de répondre aux questions.'
    hymnbound_ingot: 'Fer massif, chauffé sur le fourneau, guidé par la rancune. Les plis et la contestation capitulent pareil.'
    hymnbound_sabatons_of_cooling_vent: "Évacuent la chaleur du sol par le talon. Pieds au chaud, empreintes calcinées, aucune plainte pour l'instant."
    incandescent_lance: "Rougeoie d'une chaleur qui ne faiblit jamais, avec une prise visiblement pas concue pour suivre."
    infernal_cleaver: "Brûle avec la fureur de mille entretiens annuels. Ironique, dans un monde de glace. Personne ne s'est encore plaint."
    inferno_clutch: "Le cuir ne refroidit plus depuis les fosses des bûchers. La prise se resserre d'elle-même près de la chaleur."
    inferno_pendant: "La pierre en son centre n'a pas refroidi depuis les premiers feux des bûchers."
    inferno_shard: 'Résidu de fourneau fondu, tiré de la grille au râteau. La chaudière garde ses reçus.'
    infested_legguards: "Ces grèves grouillent de colonies parasitaires, la trame chitineuse s'étant depuis longtemps fusionnée au fer qui les soutient."
    infested_ring: 'Un anneau de chitine évidée, dont les sillons grouillent de choses sans nom qui rampent et mordent.'
    infested_sash: 'Des veines pulsantes parcourent le tissu souillé comme si le vêtement était encore vivant et en train de digérer. Le porter établit une relation intime avec la maladie.'
    infinity_amber: ''
    infinity_arcanite: 'Dégage une charge résiduelle suffisante pour maintenir un feu de garde allumé quelle que soit la tempête.'
    infinity_bloodstone: ''
    infinity_cursed_gem: ''
    infinity_diamond: ''
    infinity_draconite: ''
    infinity_duskite: ''
    infinity_jade: ''
    infinity_moonstone: ''
    infinity_obsidianite: ''
    infinity_quartz: ''
    iron_battleaxe: 'Forge a partir declats de chevalier sombre. Les tenebres sont porteuses. Le poids forge le caractere.'
    iron_battlecleaver: "La legende l'appelle la hache qui mit fin a une ere. L'histoire retient surtout la cloture."
    iron_battleplate: "Les chevaliers d'ombre ne forgent leur armure qu'aux eclipses, bien trop rares pour la demande."
    iron_bludgeon: "Gourdin en fer coulé — pas vraiment une arme conçue, plutôt une pièce de métal avec un bout préhensible. Efficace précisément parce qu'il n'est pas sophistiqué. Les armuriers le vendent en rougissant légèrement. Les acheteurs l'acquièrent sans honte parce que les résultats ne laissent pas de doute."
    iron_flanged_mace: "Chaque coup sent vaguement l'etable, sans qu'on sache ni ose vraiment demander pourquoi."
    iron_gauntlets: "Gantelets réglementaires de chevalier sombre. Les empreintes de l'ancien propriétaire sont encore visibles dans le métal, figées dans une expression de « oh non, pas encore »."
    iron_kneeguards: 'Récupérées sur un chevalier sombre agenouillé devant le mauvais autel. Les genouillères ont survécu. Sa carrière dans les ténèbres organisées, non.'
    iron_legplates: "Fer blanc-os des forges impérissables d'en bas, où les forgerons ne prononcent jamais un mot en travaillant. Paisible, en apparence — avant qu'on ne se souvienne pourquoi ils se sont tus."
    iron_pounder: ''
    iron_sickle: "Une lame courbee qui coupe les herbes avec une precision chirurgicale. Le precedent proprietaire n'etait pas chirurgien, ce qui explique le sang."
    iron_war_spear: "Pointue d'un éclat de moelle ancienne qui refuse de sécher complètement. Ce qui a donné sa vie pour fabriquer cette lance n'a pas cessé d'y contribuer — appelez ça du dévouement, ou une transaction inachevée."
    iron_warhelm: "Le forgeron qui a créé ce heaume ne travaillait qu'au clair de lune, prétendant que les ombres lui chuchotaient le motif. Les ombres lui ont aussi chuchoté le prix. Il n'était pas raisonnable."
    ironbark_treads: "Ecorce d'un arbre qui a vu venir la hache et est parti le premier. Les pas ressemblent vaguement a un assentiment."
    ironbound_bread: "Fait aussi office de bouclier en cas d'urgence. Les avis le qualifient de « rustique ». Les avis sont genereux."
    ironbrow_casque: 'Vous donne un air intimidant. Vous donne mal au cou. Question de compromis.'
    ironbuckle_girdle: "La boucle à elle seule pèse plus lourd qu'une ceinture entière. C'est justement l'argument de vente."
    irongrip_signet: 'Se resserre légèrement quand vous êtes en colère. Se desserre quand vous vous calmez. Reste surtout serré.'
    ironhide_girdle: "Assez épaisse pour dévier une lame, assez raide pour faire de s'agenouiller un choix, pas un réflexe."
    ironjaw: 'Conçue pour garder les dents du porteur là où il a commencé le combat. Une ambition modeste, rarement atteinte à cette altitude.'
    ironloaf_slab: "Moins du pain, plus un materiau de construction. Les armuriers le broient en mastic et n'y reviennent jamais."
    ivory_orchid_paste: 'Une pâte si lisse qu elle pourrait négocier des traités de paix, si les traités de paix sentaient le champignon de grotte et le regret.'
    ivory_shrooms: "Champignons crème qui semblent presque luminescents contre la terre noire dont ils émergent. La preuve que même dans les lieux les plus sombres, la beauté existe—généralement juste avant qu'elle ne vous tue."
    iyashi_living_branch: "L'arbre dont elle vient s'est éteint depuis des siècles, mais la nouvelle n'a jamais atteint la branche. Elle bourgeonne encore chaque printemps."
    jade: 'Assez vert pour rendre une emeraude jalouse et pourtant moins cher qu un repas a la taverne.'
    jade_hoe: "Un outil agricole si beau que les fermiers hesitent a l'utiliser. Puis la faim gagne, comme toujours."
    jade_pickaxe: "Utilise du jade pour miner du jade. Les implications philosophiques echappent a la plupart des mineurs, trop occupes a s'enrichir."
    jade_powder: 'Une fine poudre verte qui tache tout ce qu elle touche y compris votre reputation de mineur propre.'
    journeyman_saber: "Assez bon pour tuer un gobelin s'il reste immobile et accepte d'etre poignarde. Progres!"
    key_aragog: 'Recouverte de soie et de résidus de venin, cette clé ornée pulse au rythme cardiaque de la colonie la plus terrifiante de la Forêt Interdite.'
    kiln_potholder: 'Un carré matelassé qui ne craint aucun four. Portez tout ce que la cuisine contient, sauf une mélodie, une aiguille, ou la sensation au bout de vos doigts.'
    kindling: "Taillé dans un bois que la plaie n'a jamais fini de consumer. Il se souvient encore de la forme du feu."
    kneebreakers: "Renforcé à l'articulation où trois paires précédentes ont cédé. Le porteur marche très bien. Tous les autres trouvent ça suspect."
    knucklebone: "Coulé sur les jointures d'un moule dont nul n'a gardé la trace. S'ajuste comme s'il était fait pour une main légèrement plus grande que la vôtre."
    knucklevow: "Gravée d'une promesse qu'aucun vivant ne sait plus lire. Le métal s'en souvient mieux qu'aucun traducteur ne le pourrait."
    koa_eye: 'Globuleux, sans cligner, et qui vous juge encore. Réactif pour potions de vision. Les effets secondaires peuvent inclure la paranoïa.'
    koa_eye_ring: "Serti d'un oeil de Koa poli qui semble, de facon troublante, chercher encore quelque chose."
    koa_eye_signet: "Les Koas ont à peu près la même expression qu'ils soient heureux, furieux, ou transformés en bijoux. L'œil dans cette bague cligne encore parfois, sans que personne sache si c'est intentionnel."
    koa_slime: 'Du mucus de grenouille visqueux. Glisse des conteneurs, recouvre tout le reste. Les alchimistes adorent. Tous les autres vous détestent.'
    koa_slime_brigandine: "Plaques de cuir laquées de mucus de Koa, qui durcit en un revêtement étonnamment résistant. Le Koa produisait ce mucus en réponse au stress, ce qui signifie que cette armure est littéralement faite d'anxiété. Elle brille encore sous la pluie, vous donnant l'apparence d'un guerrier remarquablement hydraté."
    koa_slime_codex: 'Les pages sont collees par la bave de koa. Le lire demande du talent et un estomac solide.'
    koa_slime_rod: 'Un baton enduit de bave de koa solidifiee. Ca canalise la magie ou pretend le faire.'
    koa_tongue: "Un mètre de muscle préhensile. S'étire, claque, et attrape parfois autre chose que des mouches."
    koagulant_longbow: 'La corde sécrète un mucus fin. Personne ne sait pourquoi. Personne ne veut savoir.'
    koagulant_wand: "Pulse d'une energie collante, soignant les plaies en les enduisant de quelque chose qu'il vaut mieux ne pas examiner de pres."
    kraken_depth_staff: 'Réputé canaliser les tranchées océaniques les plus profondes. Les porteurs rapportent se sentir observés. Ils le sont.'
    kraken_ink: 'Récoltée dans les glandes les plus profondes du Kraken. Écrit des prophéties. Aussi de simples listes de courses. Elle ne fait pas la difficile.'
    kraken_key: 'Corrodée par le sel et les balanes. Le motif de tentacule sur la poignée manque cruellement de subtilité.'
    kraken_tide_boots: "Adhère à toute surface, sèche ou mouillée. Les semelles d'origine kraken lisent la marée avant toi."
    kweebec_leaf_charm: "Une feuille vivante qui refuse de faner. Les druides l'utilisent comme focus. La feuille juge votre caractère en silence."
    kweebec_vine_sash: 'Noue durant un chant Kweebec de trois jours dont meme les Kweebec ont oublie les paroles.'
    lantern_shard_ring: "Un éclat de lanterne spectrale, encore faiblement lumineux. Il murmure l'heure qu'il est, ce qui serait utile s'il n'avait pas perpétuellement tort et n'était pas profondément passif-agressif quand on le corrige."
    larvano: "Palpite comme un minuscule battement de coeur. La ruche scarak d'origine n'a pas cesse de compter ses pertes."
    last_guardian_aegis: "Portée par le Dernier Gardien depuis avant que la Cicatrice n'ait un nom, cabossée en des endroits que rien depuis n'a réussi à cabosser deux fois. Jamais, pas une seule fois, elle n'a été la raison de la chute du mur."
    lastbreath: "Taillée pour celui ou celle qui la portera en dernier. L'armurier n'explique jamais ce que ça signifie, et nul n'a posé la question deux fois."
    lastmile: "Nommées d'après le tronçon que chaque pèlerin jure plus court que le précédent. Il ne l'est jamais."
    lastwhisper: "Porte un sort si ancien que les syllabes se sont usées. Quoi qu'il ait dit à l'origine, ça fonctionne toujours."
    lava_chitin: "Carapace de griffe-magma, naturellement ignifuge. Sent vaguement l'altercation qu'elle a perdue."
    leather_heavy_boots: 'Trois couches de cuir de tusker. Vos pieds survivront a vos genoux, et de loin.'
    leather_treatment: 'Bain chimique qui transforme les peaux brutes en cuir souple. Les tanneurs ne fonctionnent pas sans un approvisionnement constant.'
    legguards_of_the_primordial: "Moulées dans la peau qu'un Prophète de Cendre perd quand une vision s'éternise. La foulée du porteur ralentit au rythme d'un prophète : délibérée, sans hâte, et toujours arrivant exactement en même temps que les mauvaises nouvelles."
    legweight: "Plus lourd que le règlement ne l'autorise, selon la théorie qu'une jambe trop fatiguée pour courir est une jambe qui reste et se bat."
    leviathan_tentacles: 'Durcies après avoir été arrachées à quelque chose que le Kraken appelle famille. Ça tressaute encore. Parfois.'
    lightless_striders: "Semelles assez noires pour disparaître dans l'obscurité du bosquet. Le porteur cesse de voir où il met les pieds vers le troisième jour. Le quatrième, ça n'a plus d'importance."
    liquid_koa: "Une bave qui ne sut jamais garder une forme et s'en est fait une raison. Presque."
    litany_of_cinders: 'Un rouleau de tâches ménagères sans fin. Lu à voix haute, il pousse la poussière à se ranger toute seule, par pure culpabilité.'
    living_spark: "Une étincelle qui refuse de mourir. Continue de se rallumer dans votre poche. Les mages de feu l'utilisent comme briquet. Danger de sécurité."
    living_spark_greataxe: "La tête crépite encore de ce qu'elle a tranché en dernier, et personne n'est tout à fait sûr de ce que c'était. Les rapports sont classés et scellés. Ce qu'on sait avec certitude : la hache choisit ses cibles. Celui qui tient le manche n'est là que pour le trajet."
    longdraw: 'Il faut un souffle entier pour le bander et un souffle entier pour le regretter. Les deux sont facultatifs si la cible est assez rapide.'
    longreach: "Étend l'allonge du porteur au-delà du seuil que l'adversaire moyen juge équitable. L'équité n'a jamais fait partie du cahier des charges."
    lorito_helmet: 'A full parrot pulled over the ears. The sprout on top is load-bearing, emotionally.'
    lumber_cleaver: "Conçue pour le bois. Utilisée pour tout le reste. La lame porte encore des traces de résine, signe soit rassurant — preuve d'un usage innocent — soit inquiétant, selon ce que la résine recouvrait avant. Les bûcherons qui l'ont portée au combat ont généralement survécu. Le bois, lui, beaucoup moins."
    lure_light_pendant: "Renferme un éclat de lumière-lotte captive, pulsant à son propre rythme sans égard pour ce qui la porte. Les vrais leurres du Weald ont commencé à se rapprocher de qui le porte. On n'y voit pas un bon signe."
    magmooligan_charm: "Un charme en laine volcanique qui irradie une douce chaleur et sent vaguement le soufre et la trahison. Le magmooligan d'où il vient broutait paisiblement près d'une coulée de lave quand l'opportunité a frappé. Enfin. Quand vous avez frappé."
    magmooligan_hauberk: "Laine volcanique feutrée sur de vieux anneaux de bronze, assez chaude pour les blizzards et insupportable partout ailleurs. Les nuits froides, quelque chose dans le tissage bêle encore, faiblement. Le serment de l'armurier que la bête était parfaitement finie avant a perdu en crédibilité à chaque récit."
    magmooligan_waraxe: "Les magmooligans sont petits, hargneux, et passent leur temps à tout enflammer sans la moindre raison qu'une créature sensée accepterait. Cette hache est ce qu'il reste quand un forgeron en attrape enfin un. Le feu, lui, n'a jamais consenti à se calmer."
    magmooligan_wool: 'Laine ignifugée qui couve encore. Les tisserands signalent de légères brûlures et des questions existentielles sur les tissus inflammables.'
    magmooligan_wool_ring: "Feutre de laine volcanique. Garde le doigt au chaud, un confort plus etrange qu'il n'y parait."
    malt_bread: "Pain etrangement sucre qui a peut-etre fermente dans votre sac. Le moral s'ameliore quand meme."
    malt_flour: 'De la farine avec une note maltée qui donne au pain un goût de bière.'
    marchworn: "Déjà rodé par un prédécesseur qui n'a pas survécu pour continuer à le porter. Taillé large, par courtoisie professionnelle."
    marginalia: "Le texte principal est banal. Tout ce qui vaut d'être su a été griffonné dans les marges d'une main visiblement en désaccord."
    marrow_cinch: "Sculptée dans une colonne vertébrale qui se tenait droite jadis et avait des opinions bien arrêtées tout du long. Elle se resserre d'elle-même chaque fois qu'un repas est sauté, jugeant vos habitudes depuis ce qui lui reste d'au-delà."
    marrow_knuckles: "Gantelets taillés dans les os à moelle de quelque chose mort il y a longtemps qui ne s'en est pas tout à fait remis. Froids en été, glacials en hiver, et arctiques quand un mort-vivant approche. Un système d'alarme médiocre, car quand vos doigts s'engourdissent, la chose vous souffle déjà dans le cou. Au figuré. Les morts ne soufflent pas."
    marrow_ring: "Les nécromanciens adorent pour ce look 'fraîchement exhumé' sans l'effort de creuser."
    matriarch_tusk: "Arrachée au Grand Tusk Dos-de-Cendre après un combat dont le troupeau parle encore. La terre se souvient d'avoir été frappée aussi fort ; elle n'a pardonné à personne depuis."
    matron_chitin: "Plaque d'exosquelette de la veuve blanche elle-même. Plus sombre que l'obsidienne et deux fois plus dure. Les armuriers pleurent de joie."
    matron_chitin_gauntlets: 'Plaqués de carapace prise à la Veuve de Cendre. Encore tièdes de son terrier.'
    matron_silk_slippers: 'Filés dans la soie que la Matrone des Abysses perd lors de ses chasses les plus profondes, assez doux pour traverser le sol du Weald sans un bruit. Le silence est tout ce qui compte, ici-bas.'
    maw_cleaver: "Son créateur a changé d'avis à mi-chemin, ce que l'artisan appelle du caractère."
    maw_crusher_fists: "Son comportement contredit sa propre description, ce qui est soit un défaut de conception, soit tout l'intérêt."
    maw_tooth_ring: 'Une bague qui nie fermement sa propre existence tout en étant portée. Elle est à la fois absolument certaine et entièrement douteuse.'
    maw_visage: 'Un heaume qui insiste pour avoir raison même quand les faits suggèrent le contraire. Il prend des positions de principe sur rien en particulier.'
    mender_cuisses: "Rembourree d'herbes curatives. Agenouillez-vous, respirez, laissez la paperasse — pardon, les herbes — faire le reste."
    militia_breastplate: "Standard, fiable, impossible à remarquer dans une foule de soldats. C'est précisément le but. L'anonymat est la première défense du soldat de base, et ce plastron le garantit. Aucune histoire héroïque ne lui est attachée. Plusieurs histoires ordinaires, peut-être. L'histoire ordinaire a ses propres mérites."
    millstone: "Les meules du village ont moulu le blé pendant six générations avant que quelqu'un ne pense à en brandir une. Ça marche. Personne n'a demandé l'avis du meunier."
    mineral_biscuit: 'Un biscuit enrichi de poussiere de diamant. Techniquement comestible, pratiquement une meule pour vos molaires.'
    minor_healing_brew: 'Une bouillie verte tiede qui soigne les coupures et les egos meurtris. Gout de regret avec une note de mousse.'
    mire_bloom: "Une fleur pâle qui refuse de s'ouvrir hors du noir complet et se referme au premier soupçon de lumière, si bien que la cueillir revient à tâtonner en espérant."
    mire_heart: "Le véritable cœur d'un fen dread. Bat encore. Très lentement. Conservez dans un récipient scellé sauf si vous voulez des cauchemars."
    mire_judge_mace: "Nommé pour sa façon de régler les différends dans les tréfonds du Weald, à savoir définitivement. Le Sombre Flûtiste en a composé une chanson ; personne n'aime l'entendre."
    mire_waders: 'Équipement standard pour quiconque est posté au-delà des roseaux. Les pieds au sec ne sont pas garantis.'
    mirefang_kris: "Lame ondulée comme le croc d'une Rampante du Bourbier, et pour cause : c'est exactement ce dont on l'a coulée. Entre plus facilement qu'il ne le devrait."
    mirefang_loop: "Ployé dans un unique croc recourbé, assez petit pour qu'on oublie le porter avant que quelque chose, dans le Weald, n'y réagisse le premier."
    mireglass_infusion: "Du verre de vase fondu puis refixé avec un ajout vivant, dont les artisans jurent qu'il améliore la trempe sans jamais préciser celle de qui."
    mireweald_brew_of_deep_canopy: "Verte, épaisse et faiblement mouvante, chose que le brasseur jure n'être que du dépôt qui se tasse et préférerait que vous ne l'observiez pas de trop près."
    mireweald_carapace_of_drowned_weald: "Poussée autour de son porteur sur une saison entière, elle épouse parfaitement et se retire, quand il le faut, comme l'écorce se détache d'un arbre."
    mireweald_crest_of_deep_canopy: 'Camouflé pour la strate où la canopée masque le peu de lumière qui descend jusque-là, autrement dit pour se cacher, ce que le Weald récompense.'
    mireweald_lattice: "Une trame de cristal vivant qui continue de croître après la récolte, lentement, dans la direction où l'a orientée le dernier manipulateur, par entêtement ou par habitude."
    mireweald_tassets_of_deep_canopy: 'Plaques vivantes qui photosynthétisent le peu de lumière qui les atteint, soit rien, alors elles mangent lentement le porteur à la place. Lentement.'
    mireweave_grips: 'Tissées de soie-de-bourbier que les Dos-à-Spores filent entre les systèmes de racines, assez collante pour améliorer une prise et assez déplaisante pour que nul ne demande comment on la récolte.'
    mirrormelt_essence: "Distillée du seul coin de Mirrormere qui ne gèle jamais complètement. Chaque goutte garde la mémoire de ce qu'elle a englouti."
    mithril_axe: 'Griffes dours pour la prise, chitine de griffe-magma pour le tranchant. Fend les buches, les cranes et les arguments avec un enthousiasme volcanique.'
    mithril_battleaxe: 'A deux mains, double tranchant et triple regret. Le chitin de griffe-magma garde le fil eternellement chaud. Litteralement.'
    mithril_cinder_striders: 'La paire amelioree. Plus chaude, plus bruyante, et toujours aussi attentive, allez savoir pourquoi.'
    mithril_club: 'Clous en griffes dours, cuir de sanglier, doublure en toison doree. Plus leger quil ne parait, plus lourd quon ne lespererait. Tres persuasif.'
    mithril_longbow: "Fabriqué à partir des propres plumes caudales d'un faucon-tempête, montées sur fil de mithril. L'archer en prend tout le mérite. Le vent, s'il pouvait parler, aurait plusieurs corrections à apporter."
    mithril_mace: ''
    mithril_sword: "Doublée de toison dorée et si légère qu'elle se fait à peine sentir dans la main — ce qui est précisément le problème pour quiconque se tient de l'autre côté."
    mokan: 'A wide woven hat. Keeps the rain off and the questions away.'
    molten_verse_casque_of_glass_cathedral: "Loge dans le cimier l'os d'un doigt de saint, pour la chance. La chance du saint est bien documentée."
    molten_verse_charm_of_rising_hymn: "Une perle de verre qui refuse de refroidir complètement. Réconfortante en main, jusqu'à l'oubli sur un parchemin."
    molten_verse_hauberk_of_glass_cathedral_choir: 'Fournie à qui récure les sols vitrifiés. Les taches ont de l ancienneté.'
    molten_verse_hauberk_of_glass_cathedral_pyre: 'Taillée dans les grands rideaux de la nef. Les mites ont pris l ourlet; la majesté a survécu.'
    molten_verse_hauberk_of_rising_hymn: "Se réchauffe à mesure que le combat dure. Les longs combats finissent avec toi rougeoyant et l'ennemi parti."
    molten_verse_sash_of_glass_cathedral: "Tissée d'un ruban de verre coloré. Joli, tant qu'un reflet ne t'aveugle pas toi-même."
    molten_verse_scepter: 'Éteint les bougies, les lanternes et l enthousiasme à distance. Le long manche, c est pour les lustres.'
    momaku: 'A spirit-mask banner draped down the back to frighten debtors and impress no one already dead.'
    moonclad_band_of_silt_throne: "Un anneau d'écaille lunaire qui reste frais jusque dans la chaleur fiévreuse du Weald profond, auquel le porteur se raccroche plus qu'il ne l'avoue."
    moonclad_breastplate_of_silt_throne: "Son plaquage de Griffe-de-Lune luirait faiblement les nuits où la lune se montre, ce qui, si profond dans le Weald, veut dire jamais, si bien que l'affirmation ne risque aucune épreuve."
    moonclad_crusher_of_silt_throne: "Coiffé d'une coquille pâle qui montre en blanc chaque fêlure qu'il inflige, tenant un décompte net et lumineux que le porteur ne peut éteindre."
    moonclad_pike_of_brackish_deep: "Pointée d'écaille lunaire pâle, froide jusqu'à la pointe, mince réconfort pour qui en tient l'autre bout dans l'obscurité tiède et fiévreuse."
    moonclad_poultice_of_silt_throne: "Enveloppé d'une coquille pâle qui reste froide contre la fièvre, réconfort que prisait la cour noyée et dont la cour noyée n'a plus besoin."
    moonclad_tonic_of_brackish_deep_matron: "Mis en flacon sous la coquille pâle qui le garde frais, ce qui ressemble le plus à de l'eau lunaire qu'on brasse si bas."
    moonclad_tonic_of_brackish_deep_mire: "La base d'eau de bourbier se sépare en couches si on la laisse reposer, que le brasseur dit d'agiter sans jamais dire ce qu'est la couche du fond."
    moonclad_torc_of_silt_throne: "Un collier de coquille pâle que la cour portait pour capter le clair de lune à travers une salle désormais à cent pieds sous la vase. Il n'en a capté aucun depuis."
    moonclad_treads_of_brackish_deep: "Plaquées d'écaille lunaire qui reste froide sous le pied, à peu près le plus proche d'un rayon de lune que le porteur sentira si loin sous terre."
    moonclad_visor_of_silt_throne: "Plaqué de coquille de Griffe-de-Lune qui capte le peu de clair de lune qui descend jusqu'ici, soit presque rien, si bien qu'il rappelle surtout qu'il y avait jadis une lune."
    moonclaw_shard: "Un fragment de griffe de l'Impératrice Griffe-de-Lune. Il luit sous la lune. Les enchanteurs qui le touchent affirment entendre un ronronnement."
    moonfang_precision_band: "Serti d'un fragment d'os de prédateur lunaire dont la morsure ne manquait jamais sa proie. La précision est transférée par proximité. Les archers qui le portent remarquent que leurs tirs corrigent légèrement d'eux-mêmes. Il ne s'agit pas d'une béquille, insistent-ils. D'une collaboration, plutôt. Philosophiquement discutable mais pratiquement efficace."
    moonfang_waistguard: "Récupéré du pelage d'une créature qui chassait à la pleine lune et dormait le reste du temps. Le cuir porte encore quelque chose de nocturne qui est difficile à expliquer en plein jour. Les porteurs décrivent une clarté inhabituelle dans l'obscurité. Pas de vision nocturne à proprement parler. Plutôt un sentiment que l'obscurité est de leur côté."
    moonlit_choker: "Fermé serré avant que les tombes ne s'ouvrent au crépuscule. Desserré seulement la garde finie."
    moonlit_claw: "Luit faiblement au clair de lune, provenant d'un croc-de-lune jadis légendaire. Maintenant, c'est un matériau d'artisanat."
    moonlit_recurve: ''
    moonrise_boots: "Feutree a partir d'une laine qui se souvient d'avoir ete vivante, et tente parfois encore de paitre."
    moonstone: 'Brille faiblement sous la lumiere des etoiles ce qui est parfaitement inutile vu que les mineurs travaillent sous terre.'
    moonstone_hoe: 'Laboure le sol avec une resonance lunaire. Le ble pousse 12% plus vite. Le fermier vieillit 12% plus vite. Marche equitable.'
    moonstone_pickaxe: "La tete pulse d'une pale luminescence. Les mineurs jurent qu'elle trouve les veines toute seule. La pioche refuse de commenter."
    moonstone_powder: 'Scintille dans l obscurite ce qui le rend facile a trouver et impossible a cacher aux collecteurs d impots.'
    moonstone_sickle: "Brille faiblement sous la lumiere des etoiles. Les herboristes disent que ca ameliore le rendement. Les alchimistes disent que c'est un placebo. Les deux ont tort."
    mules_burden: "Plus de points d'attache que la caisse a outils d'un handler de concours. Aussi plus lourde."
    muleteer_march: "A parcouru plus de lieues derrière la colonne de ravitaillement qu'aucun soldat vivant. Jamais perdu un chariot."
    neckoath: "Portée par les pèlerins qui ont juré d'atteindre le mur ou d'y mourir. La plupart la portent encore."
    nerak_key: "De l'os, gravé de runes qui marmonnent des menaces dans des langues que plus personne de vivant ne parle. Les morts n'apprécient guère les visiteurs. Leurs serrures, s'avère-t-il, pensent exactement pareil."
    nerak_marrow: "Moelle noircie tirée des ossements anciens de Nerak lui-même, bourdonnant encore faiblement d'une vie qu'elle ne devrait pas avoir. Les alchimistes lui accordent grand prix pour sa puissance. Tous les autres l'évitent à cause du murmure, dont personne n'est jamais parvenu à saisir les mots avec certitude."
    nerak_marrow_bow: "Cordé d'un tendon que Nerak a perdu il y a des siècles sans jamais le réclamer. Tendez-le, et la corde fredonne la même note grave que sa cour chante encore sous terre, que vous ayez ou non l'intention de vous y joindre."
    nexus_blade: 'Forgée à la chaussée où trois routes rejoignent les morts. Elle bourdonne encore au crépuscule.'
    nightcap: "Un champignon bioluminescent qui pulse d'une lueur azurée inquiétante, suggérant des origines dans des cavernes où la lumière du soleil relève moins du souvenir que de la rumeur. Les alchimistes le convoitent pour ses propriétés soporifiques, bien que le champignon lui-même demeure profondément indifférent à leurs attentions."
    nightcap_elixir_base: 'Le socle de chaque potion douteuse jamais préparée après minuit par un fêtard qui aurait dû aller se coucher.'
    nightfang_daggers: "Lames jumelles qui disparaissent dans l'ombre et reapparaissent dans les colonnes vertebrales."
    nightfang_razors: ''
    novice_wand: "La première baguette que chaque apprenti mage reçoit. Elle est délibérément imprécise pour enseigner la concentration. Elle est délibérément peu puissante pour enseigner l'humilité. Elle est délibérément inconfortable pour enseigner la patience. L'académie qui la conçoit considère la souffrance mineure comme une méthode pédagogique valide. Les anciens élèves ont des opinions mitigées."
    null_essence: 'Absence liquide. Dissout les parois des conteneurs si stockée trop longtemps. Les enchanteurs paient des prix obscènes. Le stockage est votre problème.'
    oblivion_saber: ''
    obsidian_arc_bow: 'Bandée avec du cordon de tablier ciré. Les rideaux sont tombés depuis des années; la tringle s est reconvertie.'
    obsidian_casque_of_glass_cathedral: "Bombé comme un toit de chapelle, et à peu près aussi doué pour tenir dehors l'avis des fidèles."
    obsidian_choir_plate: "L'armure du sanctuaire intérieur, où seuls les élus se tiennent. La confiance est rare et vite retirée."
    obsidian_cordial_choir: 'Pour la cuisine, insiste l étiquette. Le cuisinier insiste sur le contraire.'
    obsidian_cordial_of_rising_hymn: 'Une chaleur claire et montante qui remonte le moral et, brièvement, les poils de tes bras.'
    obsidian_cordial_pyre: 'Une gorgée et tes oreilles sifflent, tes yeux pleurent, et tes plaies se referment par pure intimidation.'
    obsidian_core: "Le cœur dense d'une coulée de verre. Coupe-le mal et l'ensemble vote pour devenir mille couteaux."
    obsidian_elixir_of_glass_cathedral: 'Un petit verre avant le lit. Le lit est facultatif; le verre ne l est pas.'
    obsidian_extract: 'Cirage pour les grandes cuisinières. Le lustre tient une semaine; l odeur tient un mariage.'
    obsidian_flux: 'Pâte caustique qui décape la suie, le vernis et les empreintes. Vérifiez lesquels vous vouliez garder.'
    obsidian_psalter: 'Chaque recette finit par la même consigne: laisser au four tant que ça hurle encore. Marche pour les rôtis. Marche pour les hérétiques.'
    obsidian_signet: "Imprime une marque dans la cire chaude et, à l'occasion, dans un front. Ça scelle, dans les deux cas."
    obsidian_stompers: "Semelles de verre poli, brillantes comme un miroir. Le dernier reflet d'un ennemi à terre, c'est sa tête surprise."
    obsidianite: 'Verre volcanique qui se brise en lames assez tranchantes pour couper la pierre et les ambitions de carriere.'
    obsidianite_powder: "Éclats microscopiques en suspension dans une poussière minérale, accompagnés d'avertissements de sécurité assez longs pour tapisser la salle d'attente d'un guérisseur. Ils sont, sans exception, tous justifiés."
    ocean_grimoire: "Ecrit avec une encre qui n'apparait que sous l'eau. Un materiel d'etude tres peu pratique."
    ocean_sigil: 'Corail sculpté portant des runes talokan. Les érudits en ont décodé trois sur neuf. Les six autres sont pires.'
    old_hoe: "Un outil agricole rustique renforcé d'antennes bleues dentelées, leurs poils sensoriels tressaillant encore de réflexes résiduels."
    onyxium_aegis_pendant: 'Contient un œil de corvidé préservé qui cligne quand le danger approche. Cligne aussi parfois sans raison claire.'
    onyxium_bastion_greaves: "Si confortables que trois soldats se sont endormis en pleine bataille en les portant. Le commandement n'a pas apprécié."
    onyxium_bulwark_helm: "Les carapaces de crabe cliquettent légèrement au combat. Les vétérans appellent ça 'les applaudissements'. Ce n'en est pas."
    onyxium_caravanner_mail: "Une Ombrebraise l'a portée sur les routes de faille en convoyant des marchandises, sans jamais se faire détrousser — l'odeur y pourvoyait. Les caravanes retiennent encore le motif, à défaut de la source."
    onyxium_cleaver: ''
    onyxium_conduit: "Couronné d'une feuille de kweebec vivante et enveloppé de bois magmooligan. Il fredonne quand on l'ignore."
    onyxium_crit_band: "Pressé dans le noyau tiède d'une Ombrebraise, refroidi juste assez pour être porté sans remords. Il chauffe la peau d'une manière qui aiguise la concentration aux pires instants."
    onyxium_crushfists: 'Conçus pour arrêter une charge en un seul échange. Un second est rarement nécessaire.'
    onyxium_edge: ''
    onyxium_fortress_girdle: "Faite de la fourrure d'une créature si paresseuse qu'elle a fait évoluer une armure plutôt que de fuir le danger."
    onyxium_fortress_plate: 'Assemblée à partir de reliques tribales par un artisan préférant la survie à la discrétion. Ça se voit.'
    onyxium_greathelm: 'La vision périphérique cédée pour une mâchoire qui arrête presque tout.'
    onyxium_guardian_mace: "Fournie d'office aux gardiens de tombe. Les bosses survivent au porteur."
    onyxium_hatchet: ''
    onyxium_hauler_boots: "L'Ombrebraise qui hissait le minerai par cette pente impossible couvait tout du long. Ces bottes ne fatiguent pas. Elles fument, parfois."
    onyxium_iron_wall_grips: "Les écailles fléchissent encore au poing serré, comme si l'ancien propriétaire n'avait jamais vraiment lâché prise."
    onyxium_ironfoot: "Infusées d'essence Koa. Les yeux sur les boucles te suivent dans la pièce. Poliment."
    onyxium_loadbearer: "Tanné depuis une peau d'Ombrebraise selon un procédé fait de fumée, de patience et d'une compréhension pratique des choses qui devraient avoir refroidi. Supporte bien plus de poids que son allure ne l'annonce."
    onyxium_longbow: ''
    onyxium_packmule_grips: "Doigts moulés sur une Ombrebraise convoyeuse de braises : un continent traversé, pas une seule tombée. Ce que vous tenez, vous ne le lâcherez qu'au moment où elle l'aurait lâché."
    onyxium_porter_legguards: "Une Ombrebraise resta un siècle agenouillée devant la même forge ; les genoux de ces chausses en portent l'usure. Bonnes pour le portage en montée. Pour s'agenouiller ailleurs, plus jamais."
    onyxium_sages_locket: "Trouvé enroulé à la crête d'une Ombrebraise, tiède après des siècles. Il garde sa sagesse pour lui — la vôtre aussi, d'ailleurs — et rembourse le tout en pure endurance."
    onyxium_scholars_visage: "L'arcade d'une Ombrebraise songeuse, à en juger par l'usure du bourrelet. Tient éveillé pendant les conseils interminables. Les érudits invoquent le design. C'est la chaleur."
    onyxium_spirit_club: 'Un feu-follet des tombes niche dans la tête. Il ne brille que si quelque chose agonise à proximité.'
    onyxium_striders: "Attribuées à qui tire le poste le plus éloigné. Le chemin du retour est plus long que l'aller."
    onyxium_trident: ''
    onyxium_war_signet: "Remis à qui survit intact à l'appel. Change de main plus souvent qu'on ne le voudrait."
    onyxium_warbelt: 'Usée sur trois campagnes et reboucléе pour une quatrième. Le cuir se souvient de toutes.'
    onyxium_warblade: "Forgée d'après l'empreinte que la crête griffue d'une Ombrebraise laissa dans la lave tiédissante. Rétro-ingénierie brillante ou coïncidence que nul ne veut tester deux fois."
    onyxium_warchain: "Chaque maillon porte l'empreinte d'une campagne. Personne ne les a tous comptés."
    onyxium_ward_ring: "L'œil incrusté voit des choses que tu préférerais qu'il ignore. Il a un avis sur tes choix."
    onyxium_wargreaves: "Marquées à l'endroit où l'on s'agenouille. Le marais impose son tribut à la posture."
    onyxium_warplate: "Une armure complète en acier de guerre récupéré. L'enfiler coûte plus cher que l'enlever."
    orb_of_purity: "Chaque mère du Bois-Pâle met ses enfants en garde contre l'orbe qui permet de tout recommencer. Une pression, et vous renaissez immaculé, innocent, et totalement ignorant. L'amnésie magique reste de l'amnésie ; elle a juste de meilleures manières."
    orchid_spore_blend: 'Des pétales d orchidée broyés mélangés à des spores écrasées dans un processus qui sent pire que le résultat n en a le goût.'
    origin_composite: 'Pressé à partir des fibres les plus anciennes de la montagne en une matière qui refuse de se comporter selon son âge. Étrangement élastique pour une relique.'
    origin_crest_of_world_wound: "Marqué de la ligne le long de laquelle le monde s'est déchiré, afin que son porteur garde toujours le sens du bas. Le bas, ici, étant une direction qui a des avis."
    origin_philter_of_world_wound_genesis: "Dosé par l'Oracle en personne, qui n'explique jamais la mesure et ne s'est encore jamais trompé dessus. La confiance est le seul ingrédient que vous fournissez."
    origin_philter_of_world_wound_scar: "Mélangé au rythme que tiennent les Chantres de la Cicatrice, une mesure par vers de leur chant, d'où le fait qu'aucun lot n'ait le même goût et qu'aucun ne soit jamais bâclé."
    ornate_bronze_legplates: "Le cornecorne dont la corne orne ces cuissards a chargé dix-sept fois avant que le forgeron comprenne. La dix-huitième charge fut la dernière du cornecorne et l'heure de gloire du forgeron."
    ornate_bronze_plate: 'Épais. Dense. Inflexible. Comme la corne du Cornu, et votre personnalité.'
    packrat_thinking_cap: "Poches supplementaires a l'interieur. Personne sur le ring n'ose demander le contenu."
    padded_boots: "Rembourrage extra pour quand vous marchez sur ce que vous ne devriez pas. C'est-a-dire presque tout."
    padded_coif: "Tellement rembourrée qu'elle étouffe les coups comme les pensées. Vous tiendrez debout éternellement, sans savoir pourquoi."
    paragon_spellbook: ''
    parrot_hat: 'It is a parrot. On your head. It does not talk, which is somehow worse.'
    patchwork_trousers: "Cousu avec tout tissu trouvé. Chaque jambe a une couleur differente. Mode ou appel a l'aide?"
    patience_amulet: 'Le Slothian a attendu cent ans un proprietaire digne. Techniquement, il attend encore.'
    patience_charm: 'Polie par des siecles a etre tenue pendant des disputes ou elle ne fut jamais vraiment partie prenante.'
    patience_club: "Il se déplace lentement, comme tout ce que fait un slothien se déplace lentement, et s'abat comme si le sol lui-même avait changé d'avis sur l'idée de rester en place. Personne ne l'a jamais accusé d'être pressé."
    pearl_shard: "Un fragment de perle fissurée de l'intérieur de la coquille d'un bernard-l'hermite. Vaut quelque chose pour les joailliers, rien pour le crabe."
    pearl_shard_mace: 'Incrustee de fragments de perle de crabe. Chaque coup sonne comme un carillon funeraire.'
    pearl_shard_pendant: "Une perle fissurée d'une huître qui aurait riposté. Le récolteur a perdu deux doigts et gagné un profond respect pour les bivalves. La perle brille faiblement sous l'eau, ce qui est beau et parfaitement inutile vu que vous ne respirez pas là-dessous."
    pebble_pendant: "Un galet lisse sur une ficelle. Le joaillier appelle ca 'design minimaliste'. Tout le monde appelle ca un caillou."
    pet_admin: ''
    pet_aloe_gaia: "Une variante médicinale qui suinte une sève apaisante soignant petites coupures, coups de soleil et fierté blessée. Elle traite la moindre égratignure comme une blessure mortelle et plane autour de vous, anxieuse, réclamant un geste de réconfort. Sa sève a un goût infect — qu'elle considère comme préventif."
    pet_amber_cactee: 'Sent les forets de pins anciennes et les mauvaises decisions de vie. Piege occasionnellement des mouches dans sa resine.'
    pet_anorak: "Les runes émeraude gravées sur la carapace de cette araignée pulsent de l'essence emprisonnée d'Aragog, la grande araignée réduite à une taille gérable."
    pet_arcane_gaia: "Un spécimen de Gaïa gravé de runes arcaniques lumineuses qui pulsent selon des séquences qu'aucun érudit vivant n'est parvenu à déchiffrer, bien que plusieurs aient publié des traductions concurrentes allant de profondes vérités cosmologiques à ce qui ressemble à un inventaire de stock. Il porte ses fardeaux avec la résignation digne d'un être qui se doute qu'il était destiné à de plus grandes choses."
    pet_arcanite_cactee: 'Fredonne une berceuse a des frequences qui endorment les petits animaux et donnent des migraines aux mages.'
    pet_arcanize_bricheton: 'Des motifs runiques rampent sur sa peau en séquences identifiées comme un ancien inventaire de grain — preuve que même les brichetons tiennent leurs comptes, même si leurs comptables étaient visiblement des sorciers.'
    pet_arisen_bouloute: ''
    pet_arisen_corbac: ''
    pet_arisen_lootbox: ''
    pet_arisen_modni: ''
    pet_arisen_timon: ''
    pet_barley_bricheton: "Deux fois plus gros que l'avorton de blé, deux fois moins humble. Il fouille les rangs d'orge comme s'il en détenait le titre."
    pet_blood_bricheton: 'Ses yeux virent au cramoisi à la tombée de la nuit, et il porte à votre pouls un intérêt vif et soutenu. Les guérisseurs appellent ça une habitude inquiétante. Les nécromanciens appellent ça un compliment, et insistent pour que vous fassiez de même.'
    pet_bloodstone_cactee: "Ses aiguilles restent en permanence cramoisies. Les veterinaires refusent de l'examiner, par principe."
    pet_bouloute: ''
    pet_burnt_bricheton: "Un compagnon couvert de suie qui fournit de la chaleur en hiver et un problème d'assurance persistant toute l'année. Les compagnies d'assurance ont développé des clauses spécifiques. Elles restent insuffisantes."
    pet_chomperion: ''
    pet_chromafin: ''
    pet_corbac: ''
    pet_cryofin: ''
    pet_cursed_bricheton: "Le compagnon ultime du fermier, un phacochère si imprégné de malédiction agricole que les cultures flétrissent à son passage. Paradoxalement, les mauvaises herbes prospèrent. L'univers a un sens de l'humour particulier."
    pet_cursed_gaia: "Le compagnon suprême de la profession d'herboriste, un Gaïa si profondément imprégné d'énergie fongique maudite qu'il murmure des commentaires non sollicités sur la répartition du poids de l'inventaire de son propriétaire dans des langues antérieures à l'histoire écrite. C'est une bête de somme sans pareille dont la loyauté est absolue et dont les murmures nocturnes sont, selon ceux qui ont survécu à une possession prolongée, quelque chose que l'oreille apprend, avec le temps, à ne plus remarquer."
    pet_cursed_gem_cactee: 'Marmonne de sombres propheties sur le poids de l inventaire tout en portant loyalement vos affaires. Creature tiraillee.'
    pet_deadmaw: "Hadès prête rarement ses chiens aux mortels, pourtant cette bête calcinée trotte désormais fidèlement aux côtés d'un nouveau maître."
    pet_diamantine_cactee: "Un cactus qui a fait pousser un diamant au lieu d'une fleur. Il a des avis sur la pression, rarement sollicités."
    pet_doris: ''
    pet_draconite_cactee: 'Irradie de la chaleur comme un four avec des sentiments. Terrible pour votre sacoche en cuir, merveilleux les nuits froides.'
    pet_draconize_bricheton: "Un phacochere ecaille qui vous regarde comme s'il etait le dragon et vous, la blague de reincarnation."
    pet_dragon_gaia: 'Imposant, irise, et a une mauvaise humeur pres de redecorer tout le campement.'
    pet_duskite_cactee: "Vieille histoire : une chandelle s'est éteinte dans la galerie profonde et n'est jamais revenue — voilà ce qui a poussé à sa place. Parfait pour disparaître en plein reproche. Ça n'a jamais aidé personne à en sortir vainqueur."
    pet_ensable_crayfish: ''
    pet_gaia: "Une pousse dotée d'assez d'esprit pour détester qu'on la piétine. Elle se souvient de chaque botte."
    pet_heraklion: "L'infâme Seigneur Squelette Nerak a engendré ces molosses pour traquer les vivants, leurs côtes creuses résonnant d'un appétit que la mort seule ne saurait rassasier. La domestication reste... déconseillée."
    pet_ice_corgi: ''
    pet_ivory_gaia: 'Un esprit bienveillant de la terre, lié à la protection des trésors du royaume contre ceux qui les pilleraient sans vergogne.'
    pet_jade_cactee: 'Remarquablement serein pour un cactus ambulant. Medite a des moments inappropries comme pendant les combats.'
    pet_jones: "Priez pour que son appétit de vénération l'emporte sur celui des doigts de son gardien."
    pet_krinan: ''
    pet_lasgalen_rabbit: ''
    pet_lootbox: ''
    pet_malt_bricheton: "Sent en permanence la fermentation et transporte vos biens avec la démarche instable d'une créature qui a découvert l'orge sous sa forme la plus dangereuse. C'est l'odeur de l'engagement, dit-il."
    pet_melted_koa: "Trouvé roulé en boule près d'un bûcher refroidissant. Refuse de quitter la chaleur."
    pet_modni_lyk: ''
    pet_moonstone_cactee: 'Visible uniquement lors des pleines lunes et des mardis couverts. Personne n a compris pourquoi les mardis.'
    pet_moray: ''
    pet_nightcap_gaia: "Une variante nocturne de l'espèce Gaïa qui s'est adaptée aux ténèbres perpétuelles avec un enthousiasme frôlant l'engagement philosophique, transportant les possessions de son propriétaire à travers des corridors sans lumière tout en irradiant une désapprobation silencieuse et exhaustive de chaque décision ayant mené à cet arrangement."
    pet_obsidianite_cactee: "Chaque épine est tranchante comme du verre et tient absolument à le rester. Le vieil avertissement peint sur sa caisse ne compte qu'une ligne, et cette ligne est juste : ne pas câliner."
    pet_ocean_lootbox: ''
    pet_phacochere_son: "Le plus chétif de la portée, suivant son parent partout, sauf là où c'est vraiment risqué."
    pet_phantom_gaia: "Grand-mère jurait que sa chèvre traversait le mur de la cave à chaque pleine lune et revenait sentant les spores. Personne ne l'a crue — puis les chèvres ont commencé à en faire autant. Celle-ci préfère encore le mur à la porte."
    pet_quartz_cactee: 'A pale little cactus whose spines set into cloudy crystal. It hums quietly near ore veins, mostly to itself.'
    pet_radient: "Un chasseur primordial dont la fourrure lumineuse irradie l'essence capturée de la lumière céleste."
    pet_rock_koa: "Koa de Roche : un koa qui a pris « développe une peau plus épaisse » comme un cahier des charges d'ingénierie littéral — pèse un poids scandaleux, coule comme un verdict, gagne tous les concours de regard fixe par pure géologie."
    pet_siluri: "Le dernier d'une lignee antique, cette creature erodee porte le poids des millenaires sur sa carapace usee par le temps. La legende veut qu'il garde encore une rancune tenace envers les mammiferes pour cette histoire d'« extinction »."
    pet_suize_bricheton: 'Ses defenses de cristal tintent au vent, en une melodie que tout autre bricheton prend tres personnellement.'
    pet_talokan_feu: ''
    pet_tanjirize_bricheton: "Un animal au pelage cuivré qui attire les marchands d'épices et repousse l'espace personnel à une distance approximative des odorats les moins sensibles de la région."
    pet_timon: ''
    pet_tokeko: ''
    pet_truffle_gaia: "Une Gaia au nez si affine, bien au-dela du raisonnable, qu'elle vous trouve desormais personnellement offensant."
    pet_ukranize_bricheton: "Élevé, disent les bergers, à partir d'une bête qui porta jadis un village affamé à travers trois hivers sans se plaindre. Elle ne s'est plainte depuis. Elle ne vous a non plus jamais laissé voyager léger."
    pet_vainquished: ''
    pet_velkarion_wyrmling: ''
    pet_wheat_bricheton: "Engraissé à la première moisson, persuadé d'avoir mérité chaque grain. Suit la charrue et juge les sillons."
    pet_wind_koa: "Koa du Vent : un koa si aérodynamique qu'il oublie parfois de rester en place — attaché à une ficelle, la plupart du temps, et il fredonne quand la pression chute, juste pour se vanter d'avoir eu raison."
    pet_wither_gaia: "Partout où elle marche, les fleurs s'arrangent en quelque chose de presque trop beau pour qu'on l'appelle mourir. Une bête de somme dévouée, à condition d'avoir fait la paix avec ce qu'elle inflige à un jardin avant l'heure du thé."
    pet_zot: ''
    phacochef_tusk: "Une défense colossale brisée du crâne de Phacochef lors de sa charge sismique. Des veines de minerai parcourent l'ivoire, vibrant encore de force sismique."
    phacochere_key: "Taillee dans une defense de phacochere et scellee avec de la boue. Sent exactement comme on s'y attendrait pour une cle de donjon porcin."
    phantom_distillate: "Extrait d'un feu-follet capturé. Vacille par intermittence, comme sa source."
    phantom_essence: ''
    phantom_razors: "Si fines qu'elles existent à peine. Les victimes ne remarquent la coupure qu'en essayant de ramasser quelque chose et en réalisant qu'elles ont moins de doigts. Subtiles à l'extrême et absolument déloyales."
    phantom_spore: "Mi-présente en ce monde, mi-ailleurs, là où vont les spores qui préfèrent qu'on ne les touche pas, elle glisse entre des doigts indignes comme une rumeur glisse sous une porte close. La récolter exige un esprit vide — un état que peu d'herboristes atteignent autrement que par accident."
    piranha_amulet: "Dents d'un poisson qui mange tout, y compris les sentiments de son propre banc."
    piranha_cleaver: "Dentelé de vraies dents de piranha, encore apparemment convaincu que tout ce qui se trouve devant lui est un repas. En toute honnêteté, jusqu'ici, il ne s'est pas trompé souvent."
    piranha_tooth: "Petit, triangulaire, et toujours vendu par lots de deux cents. Un seul piranha n'est jamais le probleme."
    plague_fang: 'Une dent de rat dentelée enrobée de quelque chose que vous ne voulez vraiment pas identifier. Manipulez avec des gants épais. Plus épais.'
    plague_fang_signet: "Le joaillier qui a serti ce croc portait des gants. Puis des gants plus épais. Puis des pinces. Le croc l'a apparemment pris comme une offense personnelle."
    plague_mace: 'Porte une faible lueur verte et une odeur verte pas si faible. Le forgeron portait des gants. Et un masque. Et des excuses.'
    plague_razmo_fang_blades: 'Lames de vermine réglementaires. Les rats des tumulus mordent aussi ; celles-ci mordent avant.'
    plague_treads: 'Chaque empreinte vire au vert en une heure. Le plaguemo y voit une signature, pas un symptome.'
    plaguefang_blade: "Trempée dans un extrait tiré d'un croc pestilentiel, avec un tranchant qui a pris une couleur sur laquelle les métallurgistes ont des avis tranchés et inquiets. Elle coupe très bien. C'est le suivi post-blessure dont personne ne veut parler."
    plaguemo_boots: 'Le tanneur qui a traite ces peaux a survecu a trois pestes distinctes et une eruption tres genante.'
    plaguemo_skullcap: 'Faconnee dans la propre plaque cranienne du plaguemo, curieusement la partie la moins derangeante du procede.'
    plainsteel: "Pas de gravure, pas de dorure, pas de nom malin jusqu'à ce qu'autrui lui en donne un. L'acier n'a jamais réclamé l'attention."
    pocari_sweat: ''
    polar_fortress_plate: 'Si lourdement blindé que la mobilité en devient un concept philosophique. Mais rien ne passe. Rien.'
    polar_reaver_breastplate: "Pris à un pillard qui a confondu le marais avec un terrain découvert. Ce n'en était pas un."
    polar_reaver_greataxe: "L'arme de choix du capitaine. Personne ne reste neutre une fois qu'elle s'abat."
    polar_reavers_crook: "Autrefois une houlette de berger, aujourd'hui celle d'un voleur. Les moutons ont eu de la chance."
    polishing_resin: "Finition cristalline pour la joaillerie et le travail fin des metaux. Donne a tout ce brillant 'fraichement pille sur un boss'."
    pollen_mote: 'Un simple grain de pollen flottant qui ne consent jamais tout a fait a se poser.'
    practice_longsword: "Lame d'entrainement emoussee. La seule chose qu'elle coupe c'est votre dignite."
    praetorian_oath: "Prêté avant la chute de l'étendard. Ce service n'a jamais reçu de décharge."
    preserving_oil: "Empeche les materiaux organiques de se decomposer. Les boulangers l'utilisent pour garder le pain frais. Les necromanciens l'utilisent autrement."
    primal_catalyst: "Reactif universel endgame combinant les quatre essences elementaires. Requis pour l'equipement legendaire de chaque metier."
    primeval_codex: 'Relié en pages plus vieilles que la fracture elle-même, seul témoignage connu de ce à quoi ressemblait le zénith intact. Les Auditeurs des Profondeurs se disputent le dernier chapitre depuis des générations.'
    primordial_band_of_first_dawn: 'Il précède de si loin le doigt auquel il est destiné que le porteur se sent, brièvement et sainement, tout petit.'
    primordial_bone: 'Tiré de la couche la plus profonde du plus vieux tumulus. Plus ancien que tout nom qui y est encore inscrit.'
    primordial_cleaver: "Plus ancien que presque toutes les doctrines qu'il a servi à clore. La poignée reste chaude pour des raisons que le prophète porteur n'a jamais expliquées — l'actuel propriétaire a cessé de poser la question."
    primordial_draconize: ''
    primordial_lance: 'Une arme ancienne qui precede la plupart des civilisations. Toujours plus affutee que le debat politique moyen.'
    primordial_legplates: "Récupérées après l'échec du quatrième assaut. Le cinquième les a portées quand même."
    primordial_poultice_of_first_dawn: "Garni d'une mousse qui ne s'ouvre qu'à la première lueur, si bien que la blessure en dessous guérit selon un horaire fixé par le soleil, pas par vous."
    primordial_tonic_of_last_ascent_genesis: "Infusé avec la plus vieille mousse vivante qu'on ait trouvée, laquelle repousse dès la cueillette et paraît légèrement contrariée d'être infusée."
    primordial_tonic_of_last_ascent_scar: "La potion bon marché vendue au pied de l'ascension à quiconque croit qu'une fiole rendra la montagne plus courte. Elle ne le fera pas. Elle soulage un peu ce qui fait mal."
    primordial_totem_club: "Sculpté par celui ou celle qui prophétisait ici avant que le déchirement ne rende la prophétie largement superflue. Le visage du totem s'est poli à force d'avoir eu raison trop souvent."
    primordial_treads_of_first_dawn: "Ressemelées d'un cuir plus vieux que le métier de cordonnier. Elles craquent une langue, et les cordonniers qui la traduiraient ont tous disparu depuis longtemps."
    primordial_trident: ''
    primordial_warblade_of_last_ascent: "Reforgée tant de fois que les forgerons ont perdu l'original sous les réparations. Quoi qu'elle ait été au départ, elle n'est plus faite que de la volonté de continuer à frapper."
    primordial_worldpiercer: 'La dernière chose que tu forges avant la porte du niveau 100, et la première à y survivre.'
    prisma_arcane_crown: "Forgee dans les pinces d'un crabe qui a pince exactement le mauvais archimage. Le fantome se plaint encore."
    prisma_bastion_mace: "Confiée à qui a tenu la ligne en dernier. C'était il y a bien longtemps."
    prisma_convergence_amulet: "Chaque maillon est une braise distincte d'Ombre de Cendre, refroidie et assemblée par quelqu'un ayant plus de patience que de bon sens. Les faire luire à l'unisson exige une immobilité très particulière."
    prisma_dual_plate: "Deux demi-plaques issues de deux Ombres de Cendre différentes, soudées à la forge sur une couture qui luit encore les nuits froides. Ni l'une ni l'autre moitié n'admet avoir accepté."
    prisma_dual_sash: "Deux peaux d'Ombres de Cendre superposées, chacune isolant précisément ce que l'autre ne peut pas. Le chevauchement reste assez chaud pour sécher du linge."
    prisma_elementalist_grips: "La dernière chaleur d'une Ombrebraise, pliée dans le cuir avant refroidissement complet. Paumes chaudes par tous les hivers. Poignées de main gênantes."
    prisma_ember_band: "Chaud de la forge longtemps après l'avoir quittée. Ne refroidit jamais entièrement, comme tout ici."
    prisma_emberstep: "Laisse une légère brûlure à chaque empreinte. Elle s'efface avant que quiconque songe à la suivre."
    prisma_flameguard: 'Cuite dans les fosses où les prêtres des bûchers brûlent les morts. Ne refroidit jamais entièrement.'
    prisma_flameheart_pendant: "Porté sous l'armure, assez près pour sentir le bûcher à travers la plaque."
    prisma_flamelegs: "Portées au plus près des fosses à bûcher. L'ourlet ne cesse jamais de fumer."
    prisma_gale_sash: "Nouée pour l'ultime rassemblement. Les noms lus ce jour-là sont encore consignés quelque part."
    prisma_gale_vest: 'Portée durant la dernière relève avant que les marches ne se taisent. Elles se taisent encore.'
    prisma_hybrid_crown: "Mi-capuche, mi-couronne, parfaitement indécise — la silhouette d'une Ombrebraise ne s'arrête jamais non plus sur une forme. L'indécision est porteuse."
    prisma_longsword: "Des griffes d'ours en garde-main, des plumes de tempete dans le pan creux. Magnifique. Totalement indifferente a votre avis."
    prisma_mace: 'Cloutee de crocs et enveloppee de laine volee. Amplifie chaque rancune derriere le coup.'
    prisma_sabre: 'Aiguisee pour la meute. Seule, elle est juste tres tranchante ; elle prefere la compagnie.'
    prisma_spellbinder_sash: "Filée du même code de signaux que les gants. Se lit plus vite qu'elle ne devrait."
    prisma_spellweave_gloves: 'Marqués du vieux code de signaux des prêtres des bûchers. Les doigts vont plus vite que la lecture.'
    prisma_stormheart: "Gardé chaud par qui a lancé le dernier appel. Bat encore selon un pouls que nul autre n'entend."
    prisma_stormlegs: "Taillées pour la dernière colonne à marcher la ligne. Elle n'est jamais revenue."
    prisma_tempest_ring: 'Porté lors de la dernière relève avant que les postes ne se taisent.'
    prisma_tidal_treads: 'Coulés dans les évents où une Ombrebraise aimait se chauffer les pieds entre deux rondes. Chauds des semaines après la forge : atout selon les forgerons, grief selon les porteurs.'
    prisma_tide_signet: "Frappé de ce qui tenait lieu de visage à une Ombrebraise avant que le feu n'achève la retouche. Les documents scellés arrivent avec une pointe de brûlé. Les destinataires ne demandent pas."
    prisma_tidewalker_legs: "Taillées dans une Ombrebraise restée si longtemps immobile que le sol retint sa forme. L'agilité s'écoule par les semelles ; l'endurance s'y engouffre. Courir cesse d'être une option."
    prisma_windcrown: "Remise à qui a lancé le dernier appel. Personne n'a répondu au dernier nom."
    prisma_windweave_grips: "Portés par les coureurs qui portaient les messages entre les lignes de tombes. Aucun d'eux ne s'est arrêté de courir."
    prisma_zephyr_boots: "Rodées par les coureurs qui portaient les nouvelles plus vite que la guerre n'avançait."
    prismatic_saber: "Un noyau de braise bat dans le pommeau, prélevé sur une Ombrebraise encore tiède quand le forgeron s'en est saisi. La lame change de couleur selon l'humeur du porteur, consentement non requis."
    pristine_malt: ''
    pyre_ash: 'Une pelle de sol de cathédrale: cendre, paillettes de verre, et une boucle d oreille perdue par pelletée.'
    pyre_chain_girdle: "Maillons tièdes au repos, brûlants au combat. Elle te tient le pantalon et l'ennemi sur ses gardes."
    pyre_channeler_staff: "Portée par les prêtres des bûchers. La cendre s'y accumule sans jamais se dissiper."
    pyre_cleaver: 'Le coeur de cendre incruste dans le pommeau garde le tranchant brulant. Ideal au combat. Desastreux pour les fourreaux.'
    pyre_crown_fragment: "Un morceau de l'ornement de tête du Tyran de Cendres. Irradie autorité et chaleur extrême. Des suiveurs se forment involontairement autour."
    pyre_handler_mitts: 'Cousus pour le four qui cuit le verre du chœur. Tenez n importe quoi. Ne regrettez rien.'
    pyre_walkers: "Semelles assez épaisses pour traverser un lit de braises d'un pas normal. Normal, pour ce poste."
    pyrecleaver: 'Techniquement pour le bois de chauffage. Les fidèles défilent devant avec une politesse remarquable.'
    pyreguard_cuirass: 'Portée par ceux qui se tenaient au plus près du brasier. Roussie, jamais traversée par le feu.'
    pyrehymn_cuirass: 'Cuite, non forgée. Elle est sortie du four déjà lasse de tes problèmes.'
    pyrehymn_draught_of_cooling_vent: "Mis en flacon depuis la vapeur d'une cheminée qui refroidit. Goût de minéraux et de vague regret. Ranime quand même."
    pyrehymn_gauntlets_of_ashen_song: 'Des torchons serrés jusqu au poignet. Quelque part, un tiroir de cuisine les regrette terriblement.'
    pyrehymn_girdle: 'Une bande de cuir calciné qui arrête un brasier à la taille. Elle en a arrêté plusieurs. Ça se voit.'
    pyrehymn_greaves_of_cooling_vent_choir: 'Coulées dans les coulées refroidies, défauts compris. Les défauts sont porteurs désormais, alors laisse-les.'
    pyrehymn_greaves_of_cooling_vent_pyre: 'Fendues pour évacuer la chaleur vers le bas, si bien que tes bottes encaissent et se taisent.'
    pyreward_diadem: 'Chaud au front à toute heure. Le jour où il devient froid, cours toi aussi.'
    quartz: 'Un cristal trouble qui vibre a des frequences que seuls les alchimistes pretentieux pretendent comprendre.'
    quartz_choker: 'Pierre de quartz polie sertie dans un cadre en fil. Vibre doucement pres de la magie. Ou quand il y a du vent.'
    quartz_powder: 'Quartz broye melange a de la poussiere de diamant. Eternuer a proximite est fortement deconseille.'
    quickbite: "Trois frappes dans le temps qu'il faut pour remarquer la première. La faune de la Cicatrice a arrêté d'attendre pour vérifier."
    quickstep_sash: 'Plus décorative que défensive. Mais elle a fière allure pendant une esquive.'
    quillbound_cord: "Il résiste à l'examen, de justesse, une affirmation demeurée sans le moindre test."
    quillweave_grips: 'Il fonctionne convenablement, de son propre aveu, ce que le porteur a décidé de prendre pour argent comptant.'
    ramrage_sash: "Tissée de laine de bélifureur. Quasiment indestructible. L'odeur, en revanche, est éternelle."
    ramrage_waraxe: "Equilibree par un contrepoids en corne de ramrage. L'equilibre est relatif quand la hache pese vingt kilos."
    ramrage_warhelm: 'Orne de cornes de belier enrage. Les portes deviennent un veritable test de patience pour la foule.'
    rangers_longbow: "Un vrai arc long fabrique par quelqu'un qui savait presque ce qu'il faisait. Le 'presque' est structurel."
    raptor_bone_bow: "Taillé dans les propres côtes d'un raptor, gardant encore la forme de sa dernière charge furieuse. Chaque flèche quitte la corde rapide, enragée, et parfaitement indifférente à ce que vous en pensez."
    raptor_claw: "Incurvée, tranchante comme un rasoir, et encore chaude. Les forgerons en font des dagues. Le raptor l'utilisait comme ouvre-boîte."
    raptor_hide_boots: "Les raptors sont la façon qu'a la nature de rappeler que tout dans la chaîne alimentaire finit en chaussure. Celles-ci frémissent encore quand elles flairent une proie."
    raptor_javelin: "Pointée d'une griffe de raptor qui a connu des jours meilleurs. Et des proies pires."
    raptor_scale_greaves: "Le raptor donneur a proteste a environ soixante kilometres a l'heure. Il n'a pas rattrape son bien."
    rat_bile: "Extraite de la glande de dépit du rat. Les scientifiques insistent que cette glande n'existe pas. Les rats ne sont pas d'accord."
    rat_trousers: "Un vêtement façonné de peaux de rongeurs, chaque couture racontant l'histoire d'une lutte désespérée sous les rues de la ville. Les porter prouve que la dignité est la première victime de la pauvreté."
    raven_beak: "Dur comme le fer et tranchant comme la malveillance. Les armuriers les attachent aux fléaux. Le corbeau avait d'autres plans pour."
    raven_coif: "L'archeopteryx qui a mue ces plumes a laisse, en substance, une promesse de vengeance future."
    raven_eye_pendant: "Scelle dans l'ambre et le cuivre, il donne la patience d'un faucon et le jugement d'un vautour."
    raven_flight_bow: 'Empennee de plumes muees en plein piquet. Les fleches se souviennent encore du sens de la chute.'
    raven_grips: "Doublees de fourrure de feran et griffees en consequence. Les ferans n'ont pas pardonne au tailleur."
    raven_hauberk: 'Peaux de feran : ethiquement douteuses, structurellement irreprochables, et lavables en machine, dit-on, mais jamais tentees.'
    raven_trousers: 'Fourrure en dessous, doublure de duvet au-dessus. Perturbant dans un miroir, curieusement parfait en mouvement.'
    rawhide_belt: "Cuir non tanne qui sent vaguement l'angoisse existentielle et l'animal mouille. Premier vrai projet d'un tanneur."
    razendril: "Un croc de rat, méticuleusement taillé en une lame d'une élégance et d'une létalité surprenantes."
    razlord_trophy_belt: "Chargée de babioles prises à des choses qui n'en avaient plus besoin. Plus lourde à chaque saison."
    razmaster_grudge: 'Prise sur un rat des tumulus qui avait manifestement mordu le premier... et perdu.'
    razmaster_longsword: "Le Razmaster regle tous les differends de la meme maniere. Cette lame est l'argument final."
    razmo_bone_pike: 'Taillee dans un femur de razmo. Les marques de dents sont une fonctionnalite.'
    razmo_pelt: 'Une peau de rat décharnée. Les tanneurs les acceptent mais ils vous jugeront absolument pour ça.'
    razmoket: "La queue tranchée d'un rat d'égout commun, portant encore les traces de l'immondice qu'elle a traînée dans les tunnels humides."
    razord_fangblade: "Forgee autour d'un croc qui a refuse toute tentative de fonte. Les forgerons ont fini par batir autour."
    razord_skullcap: "Des plumes de razord tapissent l'interieur, et les opinions du porteur s'aiguisent nettement."
    razorfang: 'Façonnée à partir des crocs démesurés des rongeurs des égouts, ces lames irrégulières portent la malédiction de la pestilence.'
    reaver_visage: 'Masque de reaver forgé pour inspirer la terreur plutôt que la protection. Il réussit les deux, mais dans des proportions différentes selon le côté du masque où on se trouve. Le côté extérieur inspire la panique. Le côté intérieur inspire une claustrophobie légère et une méditation involontaire.'
    recurve_practice_bow: "Le recurve ajoute de la puissance. La fabrication mediocre l'enleve. Resultat: a peine mieux que lancer des cailloux."
    red_gaia: "Teintée par l'argile ferrugineuse du canyon et discrètement fière. Elle pleure une sève rouge que les herboristes prétendent volontaire."
    red_orchid: 'Cette orchidée cramoisie garde sa teinte vive même après une longue cuisson, ses pétales aussi épais que du cuir tanné.'
    refined_solution: "Un milieu alchimique purifie qui refuse de s'oxyder par pure obstination."
    reforged_ember: 'Du soufre gratté, rouge bonbon et impatient. Une seule friction, aucun remboursement.'
    regalfall_breastplate_of_empty_seats: "Il fonctionne, techniquement, dans la plupart des cas, ce qui est aussi rassurant que ça en a l'air."
    regalfall_grips_of_empty_seats: "Il fonctionne, provisoirement, en attendant un nouvel examen, une maigre consolation, vu l'alternative."
    regalfall_legguards_of_silent_court: "Sa garantie s'annule dès qu'on le questionne, un détail que tous les concernés ont accepté d'oublier."
    regalfall_tonic_of_silent_court: 'Son effet se déclenche, ou pas, de façon imprévisible, donc à boire à ses risques et périls, formellement parlant.'
    regalfall_warbelt_of_silent_court: "La notice s'est perdue dans un débat houleux, alors le différend d'origine a été déclaré match nul."
    regent_ore: 'Deux rapports distincts le décrivent en termes contradictoires, ce qui change selon la saison et la personne qui demande.'
    regent_spellbook: ''
    reinforced_mitts: 'Des clous metalliques sur les phalanges ajoutent protection et esthetique menacante. Les poignees de main deviennent un statement.'
    relic_aragog: "La Mère des Araignées a perdu ce croc volontairement — et par volontairement, on veut dire que quelqu'un l'a arraché pendant qu'elle digérait un aventurier particulièrement corpulent. Il dégouline encore d'un venin qui fait reconsidérer à vos ennemis leurs choix de vie."
    relic_chairman: ''
    relic_dragon_fire: 'Le dragon est mort voilà des siècles. Le chauffage central n est pas au courant. Quelque part sous la nef, ça brûle encore aux heures prévues, et les radiateurs cognent deux fois avant chaque office.'
    relic_dragon_frost: 'Une larme cristallisée versée par un dragon de givre lors de ce que les témoins décrivent comme un désaccord émotionnel avec un glacier. Elle ne fond jamais, ne se réchauffe jamais, et est connue pour rendre les boissons inconfortablement froides depuis l autre bout de la pièce. Les alchimistes ont tenté de l étudier, mais leurs instruments gèlent systématiquement.'
    relic_dragon_void: "Arrachée à un dragon qui avait consommé l'énergie du vide si longtemps qu'il en avait oublié quel goût pouvait avoir le soleil. La mâchoire vibre à une fréquence qui fait se réorganiser les meubles et pousse quiconque à proximité à se rappeler soudain chaque chose embarrassante qu'il a faite. Les guerriers qui la portent se disent nettement plus forts, mais aussi nettement plus troublés sur le plan existentiel."
    relic_duke: ''
    relic_ensable: "Tourne a l'envers plus souvent qu'a l'endroit. Aucune garantie, ni expresse ni implicite, ne l'accompagne."
    relic_fenrik: ''
    relic_gobeline: "Les gobelins vénèrent cet artefact avec la même ferveur qu'ils mettent à ne pas se faire dévorer, c'est-à-dire : désespérément et sans dignité."
    relic_guardian: ''
    relic_koa: ''
    relic_kraken: "Arraché à un léviathan si ancien qu'il se souvient d'une mer d'une autre couleur."
    relic_magmalug: ''
    relic_nerak: "Taillée, dit-on, dans la colonne même de Nerak par un marchand d'ossements tombé en poussière en pleine phrase — la meilleure critique que la cour ait jamais reçue, à son avis. Portez-la et le vent se met à vous parler. Mieux vaut ne pas lui répondre."
    relic_pale_weaver: ''
    relic_past: "Un écho d'un âge oublié. Cet artefact fut jadis forgé dans le creuset de la création, mais son artisan s'est depuis évanoui de tous les royaumes connus. Il n'en reste qu'un faible bourdonnement de puissance ancienne — le murmure de ce qui fut."
    relic_phacochef: "Arraché de la gueule d'un sanglier si têtu qu'il a un jour donné un coup de tête à une montagne et a gagné. La puanteur seule confère à son porteur une résistance surnaturelle — ou alors chacun garde simplement ses distances."
    relic_ramrage: ''
    relic_razmo: ''
    relic_rex: ''
    relic_rrexn: "Les notes de l'artisan ne contiennent que des idées biffées, et pourtant, c'est toujours considéré comme une réussite."
    relic_seraph: ''
    relic_wanilla: ''
    reset_spells_scroll: 'Contient un savoir interdit si dévastateur que votre cerveau a choisi la violence et a purement supprimé votre OS. Au moins, vous oublierez enfin cette remarque gênante que vous avez sortie à la taverne.'
    resonance_band: 'Vibre seule quand la juste note sonne à proximité. Avertissement utile, sauf si la note est ton propre enterrement.'
    resonant_pike: 'La brosse a rendu l âme il y a trois siècles. Le manche refuse la retraite.'
    rex_bone_cuisses: "Protège-cuisses renforcés de plaques d'os de rex. Marcher est un exercice. Courir relève du rêve."
    rex_bone_signet: "Un anneau-sceau taillé dans l'os du Rex. Porter ce sceau, c'est déclarer au monde entier qu'on a tenu tête à une créature qui pouvait vous avaler entier — ou du moins qu'on s'est approché suffisamment du cadavre pour en ramasser un morceau."
    rex_fang: "Une dent plus longue que votre avant-bras. Le rex qui l'a développée était très gros et très en colère. Dans cet ordre."
    rex_fang_claymore: 'Un rex alpha a donne son plus gros croc. Involontairement.'
    rex_hunter_longbow: "Concu specifiquement pour la chasse au rex. Les chasseurs qui l'ont teste n'ont jamais ete revus, mais l'arc est revenu."
    rex_jawbone_cleaver: "Un couperet fait d'une machoire de rex alpha. Les dents sur le tranchant sont d'origine."
    rex_jawbone_talisman: "Un talisman taillé dans l'os de la mâchoire d'un Rex. Les porteurs rapportent une augmentation de la confiance en soi et une diminution de la fréquentation des tavernes — car personne ne vient les embêter à l'intérieur non plus."
    rex_knuckle_guards: 'Renforcés de fragments de croc de rex sur les jointures. Donner un coup de poing relève désormais de la préhistoire.'
    rex_ribcage_plate: "Une armure de torse façonnée à partir d'une côte de Rex. L'os était assez large pour couvrir un homme entier, ce qui en dit long sur la taille de la bête et peu de flatteur sur la taille de l'homme."
    rex_scale_breastplate: 'Detachee ecaille par ecaille de quelque chose qui regnait sur la chaine alimentaire, et le savait.'
    rex_sinew_belt: "Une ceinture tressée à partir des tendons de Rex. Elle ne se déchire pas — du moins pas avant que vous ne vous déchiriez, vous. C'est une promesse de résistance que peu de ceintures osent faire, et encore moins peuvent tenir."
    rex_stompers: "Renforcées d'os de rex. Chaque pas résonne comme un petit séisme. La discrétion n'a jamais fait partie du plan."
    rex_tooth_talisman: 'Donnerait du courage, parait-il. Donne surtout un torticolis permanent.'
    rift_torn_band_of_split_sky: "Serti d'une esquille de carapace muée de Rifflet, encore tiède d'une mue conclue des semaines plus tôt. Capte la lumière de travers, exprès, comme la créature d'origine."
    rift_torn_breastplate_of_split_sky: 'Détourne la bourrasque, la plupart des lames, et absolument rien du vertige existentiel.'
    rift_torn_crusher_of_torn_ground: "Garde rancune comme une carapace de Rifflet garde une fissure : lentement, puis d'un coup, puis pour de bon. Coups en descente recommandés. En montée : techniquement possibles."
    rift_torn_extract: 'Perle lentement du sol déchiré. Récolte-le patiemment ou pas du tout.'
    rift_torn_grips_of_torn_ground: "Quand le sol cesse d'être fiable, on apprend à s'agripper. Ceux-ci s'agrippent en retour."
    rift_torn_legguards_of_torn_ground: "Récupérées d'une mue de Rifflet qui n'a jamais complètement durci. Se plient selon des angles qu'un genou ne devrait pas prendre, et c'est voulu : le sol ici ne reste pas plat assez longtemps pour qu'on discute."
    rift_torn_tonic_of_torn_ground_faultline: 'Un regain de vigueur qui frappe comme le sol qui monte à ta rencontre, ce qui peut aussi arriver.'
    rift_torn_tonic_of_torn_ground_void: "Les Mites du Vide tapissent leurs terriers d'une matière qui n'est ni tout à fait poussière ni tout à fait lumière. Distillée, elle remplit l'estomac et vide la tête, dans cet ordre."
    rift_torn_twin_knives_of_torn_ground: "Deux lames issues de la même mue de Rifflet, se disputant encore pour savoir laquelle est l'originale. L'écart entre elles est exactement l'endroit où le plan d'un adversaire cesse de tenir."
    riftsteel: 'Forgé dans la couture où deux mondes se broient. Il garde en mémoire cette pression, et la rancune avec.'
    riftsunder_blade: 'Le premier coup est poli. Ce sont les quatre suivants dont tes côtes voudront discuter.'
    riftsunder_cleaver: 'Divise sa cible en un « avant » et un « après » nets, comme le Rifflet éponyme se sépara de sa propre ligne de mue. Le « plus tard » fait rarement partie du résultat.'
    riftsunder_cuirass_of_widening_crack: "Une couture sur le devant s'élargit d'un cheveu chaque saison, suivant la fissure qui fendit le Rifflet d'origine. Nul ne l'a encore signalé au porteur. Quelqu'un devrait."
    riftsunder_draught: "Tirée du creux d'un os de Rifflet, creux parce que le Rifflet n'a, structurellement parlant, pas fini d'exister. Une dose achète une décision claire."
    riftsunder_extract: "Extrait d'aussi profond dans la faille qu'une corde et un idiot courageux peuvent descendre."
    riftsunder_fangs: "De petites plaies. Beaucoup. C'est l'hémorragie qui mène la négociation."
    riftsunder_helm_of_last_tremor: "Le tout dernier tremblement d'un Rifflet a laissé dans ce heaume-carapace un bourdonnement qui, depuis, refuse de s'estomper. Il survivra à votre ouïe. Puis, vraisemblablement, à vous."
    riftsunder_lattice: "Une ondulation de pierre figée en plein effondrement. Ça a l'air provisoire. Ça l'a l'air depuis des siècles."
    riftsunder_ration: "Cuit selon la recette qu'une compagnie de Soldats Brisés suivait avant que la compagnie cesse d'être entière. Assez dense pour servir d'arme. Certains l'ont fait."
    riftsunder_ration_of_last_tremor: "Ce que mange un Rifflet entre deux mues, séché et pressé en barres. Se conserve des années. Le goût de l'intérieur d'un très vieux tiroir."
    ring_of_the_worldeater: "Arraché d'une cavité trop large pour un doigt, et porté quand même, en pendentif. Le Dévoreur de Mondes engloutit sept mondes avant qu'on songe à vérifier s'il avait simplement faim. Nul n'a revérifié depuis."
    ringfast: "Ne s'enlève pas. On l'a expliqué clairement à chaque acheteur avant la vente. La plupart l'achètent quand même."
    riven_casque: "Vendu au rabais vu qu'il manque le tiers gauche. Oriente tes ennemis en conséquence."
    riven_charm: "Fendu net selon la même ligne où la carapace d'un Rifflet se fend à sa première mue, et jugé tout aussi porte-bonheur pour cela. La logique voyage mal hors de ce monde. Ici, c'est parole d'évangile."
    riven_chausses_of_long_collapse: "Les jambes à moitié muées d'un Rifflet surpris en plein effondrement, encore pliées selon l'angle de la chute qui l'a achevé. Les porteurs rapportent le même genou qui lâche, à heure fixe, pour toujours."
    riven_longsword_of_long_collapse: "Ici la gravité n'est qu'une suggestion : un coup vers le bas met une semaine à arriver. Prends un casse-croûte."
    riven_saber_of_screaming_rift: "Taillé dans la propre lame-membre sectionnée d'un Rifflet, gémissant encore faiblement à la fréquence de la faille dont elle provient. Les légistes décrivent le son qu'elle produit à l'impact comme « peu utile »."
    roadworn: 'A parcouru la route des pèlerins tant de fois que le cuir a oublié avoir été neuf. Il se souvient de chaque mille depuis.'
    root_cellar_key: "Elle cliquette dans un courant d'air glacé qu'aucune cave ne devrait produire. La Gueule-Cave en a frappé une centaine ; elle n'a jamais eu besoin d'une serrure."
    roothold_treads: 'On ne vous déplacera pas. Pas parce que vous ne le pouvez pas. Parce que vous ne le voulez pas.'
    rotted_flesh: "Peler un zombie est facile. L'odeur persiste pendant des semaines. Vos compagnons se souviendront de cette trahison."
    rough_mitts: "Mitaines en cuir epais qui sacrifient la dexterite pour la chaleur. Tenir une epee est maintenant un sport d'equipe."
