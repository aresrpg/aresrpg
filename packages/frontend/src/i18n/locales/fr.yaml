  next: Suivant
  finish: Terminer
  fight_enter: Entrer dans le combat
  reset_title: Tutoriels
  reset_hint: Réafficher chaque introduction lors de votre prochaine visite de la page.
  reset_action: Réinitialiser
  world_compass_title: Mondes et zones partagées
  world_compass_body: AresRPG contient plusieurs mondes débloqués au fil de votre progression. Chaque monde est divisé en zones contenant des monstres, des ressources et des donjons. Tout joueur peut découvrir une zone, et cette découverte est partagée avec tous.
  world_hud_title: Vie et raccourcis
  world_hud_body: Cette interface affiche votre vie et vos emplacements d’objets rapides. Lorsqu’un combat commence, cette même zone devient votre barre de sorts.
  world_fps_title: Contrôles du monde
  world_fps_body: Le terrain est généré de façon déterministe depuis les données publiées. Sui conserve le monde et la position X/Z de référence, tandis que le terrain détermine localement la hauteur. Le mode Plat ne change donc que l’affichage. Vous pouvez aussi régler la qualité et réserver les combats du monde aux membres du groupe.
  world_character_title: Joueurs dans le monde
  world_character_body: Voici votre personnage actif. Faites un clic droit sur un personnage proche pour ouvrir les interactions disponibles.
  world_character_tabs_title: Jouez plusieurs personnages
  world_character_tabs_body: Vous pouvez posséder jusqu’à six personnages. Invitez vos autres personnages dans un groupe et activez le suivi de groupe pour qu’ils voyagent avec vous et rejoignent automatiquement les combats du monde éligibles à leur arrivée.
  fight_title: Votre premier combat on-chain
  fight_body: Les combats se jouent au tour par tour. Choisissez vos déplacements et vos sorts, puis vos actions sont préparées ensemble. Fin du tour soumet le tour complet en une transaction Sui et calcule les tours de monstres suivants jusqu’à ce qu’un autre joueur puisse agir. Tout l’état de combat de référence est réglé sur Sui. Après la victoire, une dernière transaction Sui utilise le hasard on-chain pour tirer le butin partagé et placer chaque récompense dans l’inventaire du joueur désigné.
  equipment_gear_title: Équipement
  equipment_gear_body: Les objets équipés appartiennent au personnage sélectionné. Faites glisser l’équipement sur le mannequin, vérifiez les bonus obtenus, puis confirmez les changements ensemble.
  equipment_inventory_title: Inventaire partagé
  equipment_inventory_body: Votre inventaire est partagé entre tous les personnages de ce compte. Sélectionnez un autre personnage ci-dessus pour lui équiper les mêmes objets disponibles.
  stats_title: Caractéristiques
  stats_body: Dépensez vos points de caractéristiques pour devenir plus puissant. La Vitalité augmente la vie, la Sagesse améliore l’XP et la résistance aux pertes de PA/PM, la Chance améliore les dégâts Eau et le butin, et l’Agilité améliore les dégâts Air, les critiques, le tacle et la fuite.
  spells_title: Sorts
  spells_body: De nouveaux sorts se débloquent avec la progression du personnage. Les niveaux accordent des points de sorts à dépenser ici pour améliorer les sorts débloqués.
  jobs_title: Métiers
  jobs_body: Suivez votre progression de récolte et d’artisanat, consultez les recettes et fabriquez les objets disponibles. Avec plusieurs personnages, les paramètres peuvent verrouiller cette page sur un artisan dédié.
  runeforge_title: Forgemagie
  runeforge_body: Au niveau 70 d’un métier, la profession d’artisanat correspondante peut améliorer l’équipement avec des runes. Obtenez des runes en brisant des objets, puis appliquez-les ici.
