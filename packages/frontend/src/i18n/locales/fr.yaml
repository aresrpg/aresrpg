  map_travel_body: 'Ouvrez la carte et choisissez un endroit accessible à proximité. Laissez votre personnage y marcher automatiquement. Cette méthode permet aussi de sortir des obstacles si vous êtes coincé.'
  map_travel_objective: 'Rejoindre une destination proche avec la carte'
