    critical_hits: COUPS CRITIQUES
    crit_desc: Chaque sort ou arme a son propre taux de critique de base, exprimé comme une chance sur N. La stat de Critique réduit N, mais le taux final ne peut jamais dépasser 1 sur 2 (50 %).
    crit_bonus_desc: Lors d'un coup critique, le sort applique ses effets critiques dédiés (dégâts renforcés ou effets supplémentaires) à la place de ses effets normaux.
    blocking: BOUCLIERS
    blocking_desc: Certains sorts accordent un bouclier qui absorbe les dégâts entrants d'un élément correspondant jusqu'à épuisement. Il n'y a ni endurance ni posture de garde, les boucliers sont la seule absorption de dégâts.
    resistance: RÉSISTANCE
    resistance_desc: La résistance élémentaire est une réduction en pourcentage appliquée aux dégâts finaux, plafonnée à 50% par élément. Une résistance négative (une faiblesse) amplifie les dégâts à la place.
    life_steal: VOL DE VIE
    life_steal_desc: "Les effets de sort de drain infligent des dégâts et soignent le lanceur de la moitié des points de vie réellement perdus par la cible. Seul le drain d'un joueur soigne : un monstre lançant le même sort inflige ses dégâts et ne se soigne pas."
    life_steal_note: Les dégâts passent d'abord par la formule standard, puis le lanceur récupère la moitié des points de vie réellement perdus par la cible visée — un coup redirigé sur un autre combattant, ou converti en soin par la cible, ne rend rien.
    healing: SOIN
    healing_desc: Les soins appliquent la valeur de base du sort, augmentée d'un pourcentage de votre Intelligence, plus un bonus de Soin fixe venant de l'équipement et des buffs. Le soin est plafonné aux PV maximum de la cible.
    healing_intel_value: +1% de soin par point d'Intelligence
    heal_bonus: Bonus de soin
    heal_bonus_value: Bonus fixe de l'équipement/des buffs, ajouté après la mise à l'échelle d'Intelligence
    mobs: Monstres
    healing_mobs_value: Mis à l'échelle avec l'Intelligence uniquement, pas de bonus de soin
    leveling_desc: Niveau max 200. Combattez des mobs dans votre tranche de niveau pour un XP optimal.
