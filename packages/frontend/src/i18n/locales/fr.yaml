    section_classes: CLASSES
    section_economy: ÉCONOMIE
    combat_desc: Le combat est au tour par tour sur une grille. À votre tour, vous dépensez des Points d'Action (PA) pour lancer des sorts et des Points de Mouvement (PM) pour vous déplacer. La ligne de vue est un indicateur propre à chaque sort — la plupart des sorts l'exigent, certains non. Vous affrontez des groupes de monstres dans le monde et d'autres joueurs au Kolizeum. Les dégâts dépendent de la stat élémentaire correspondante et de tout bonus de dégâts bruts.
    elements: ÉLÉMENTS
    element_earth: TERRE
    element_fire: FEU
    element_water: EAU
    element_air: AIR
    stat_strength: Force
    stat_intelligence: Intelligence
    stat_chance: Chance
    stat_agility: Agilité
    critical_hits: COUPS CRITIQUES
    crit_desc: Chaque sort ou arme a son propre taux de critique de base, exprimé comme une chance sur N. La stat de Critique réduit N, mais le taux final ne peut jamais dépasser 1 sur 2 (50 %).
    crit_bonus_desc: Lors d'un coup critique, le sort applique ses effets critiques dédiés (dégâts renforcés ou effets supplémentaires) à la place de ses effets normaux.
    blocking: BOUCLIERS
    blocking_desc: Certains sorts accordent un bouclier qui absorbe les dégâts entrants d'un élément correspondant jusqu'à épuisement. Il n'y a ni endurance ni posture de garde, les boucliers sont la seule absorption de dégâts.
    resistance: RÉSISTANCE
    resistance_desc: La résistance élémentaire est une réduction en pourcentage appliquée aux dégâts finaux, plafonnée à 50% par élément. Une résistance négative (une faiblesse) amplifie les dégâts à la place.
    mob_level_bands: PLAGES DE NIVEAU DES MONSTRES
    mob_level_bands_desc: Dans une plage de niveaux, les PV, l'XP, l'Agilité, la Sagesse, les résistances positives et les valeurs de sorts ajustables passent de 60% à 160%. Les PA et PM passent de 100% à 130%. Une résistance négative suit la courbe inverse, avec une faiblesse de 160% au niveau minimum à 60% au niveau maximum.
    life_steal: VOL DE VIE
    life_steal_desc: "Les effets de sort de drain infligent des dégâts et soignent le lanceur de la moitié des points de vie réellement perdus par la cible. Seul le drain d'un joueur soigne : un monstre lançant le même sort inflige ses dégâts et ne se soigne pas."
    life_steal_note: Les dégâts passent d'abord par la formule standard, puis le lanceur récupère la moitié des points de vie réellement perdus par la cible visée — un coup redirigé sur un autre combattant, ou converti en soin par la cible, ne rend rien.
    chatiment: CHÂTIMENT
    chatiment_desc: Un Châtiment convertit les points de vie non létaux réellement perdus dans sa caractéristique. Chaque tour de combattant actif possède son propre plafond ; les tours suivants créent des bonus séparés de cinq tours. Les dégâts des monstres comptent entièrement. Les dégâts provenant d'un joueur et leur plafond sont divisés par deux. Ares n'utilise pas l'érosion.
    healing: SOIN
    healing_desc: Les soins appliquent la valeur de base du sort, augmentée d'un pourcentage de votre Intelligence, plus un bonus de Soin fixe venant de l'équipement et des buffs. Le soin est plafonné aux PV maximum de la cible.
    healing_intel_value: +1% de soin par point d'Intelligence
    heal_bonus: Bonus de soin
    heal_bonus_value: Bonus fixe de l'équipement/des buffs, ajouté après la mise à l'échelle d'Intelligence
    mobs: Monstres
    healing_mobs_value: Mis à l'échelle avec l'Intelligence uniquement, pas de bonus de soin
    leveling_desc: Niveau max 200. Combattez des mobs dans votre tranche de niveau pour un XP optimal.
    points_per_level: POINTS PAR NIVEAU
    stat_points: Points de stat
    stat_points_value: '{{n}} par niveau'
    stat_costs_desc: Le coût dépend de la classe et de la valeur naturelle actuelle. Chaque page de classe affiche tous ses paliers.
    spell_points: Points de sort
    spell_points_value: '{{n}} par niveau'
    xp_milestones: PALIERS D'XP
    level_10: Niveau 10
    level_50: Niveau 50
    level_100: Niveau 100
    base_stats: STATS DE BASE
    stat_vitality: Vitalité
    stat_vitality_desc: +1 PV max par point
    stat_wisdom: Sagesse
    stat_wisdom_desc: Bonus de gain d'XP
    stat_strength_desc: Dégâts terre
    stat_intelligence_desc: Dégâts feu, mise à l'échelle du soin
    stat_chance_desc: Dégâts eau, plus de butin
    stat_agility_desc: Mise à l'échelle des dégâts air
    derived_formulas: FORMULES DÉRIVÉES
    max_health: VIE MAX
    loot_desc: Chaque monstre vaincu effectue une fois le jet de chaque entrée de sa table de butin. Une entrée réussie donne une quantité aléatoire dans sa plage définie.
    stat_rolling: JET DE STATS
    stat_rolling_desc: Chaque stat est tirée uniformément dans sa plage de template. Chaque valeur a la même probabilité.
    archimobs: MOBS ARCHI
    archimobs_desc: Chaque monstre éligible a 1 % de chance d’être remplacé par son archimonstre nommé, définitivement plus puissant. Chaque membre effectue son propre jet.
    max_members: Membres max
    groups_desc: Un groupe est un roster partagé de jusqu'à {{max}} joueurs, avec élection de leader. Être en groupe ne fait rien à lui seul en combat — tout le monde, groupé ou non, doit envoyer sa propre transaction de participation au combat pour y entrer ; il n'y a aucune inclusion passive ou de proximité.
    groups_xp: PARTAGE DE L'XP
    groups_xp_desc: Les mobs vaincus forment une réserve d'XP de base. Les combattants éligibles lui donnent le coefficient de groupe Rétro, l'écart entre les niveaux totaux des joueurs et des mobs la réduit, puis chaque joueur reçoit la part correspondant à son niveau dans le total du groupe. Un joueur sous le tiers du niveau du plus haut joueur n'augmente pas le coefficient. La Sagesse s'applique en dernier ; les dégâts personnels ne comptent pas.
    groups_loot: PARTAGE DU BUTIN
    groups_loot_desc: Chaque monstre vaincu effectue un unique jet de butin partagé. Les drops réussis sont attribués à tour de rôle aux joueurs victorieux ; ajouter des joueurs ne crée aucun jet supplémentaire.
    dungeons_desc: Rejoignez l'entrée du donjon dans sa ville définie, dépensez sa clé, puis terminez les salles dans l'ordre. Chaque donjon possède un vestibule en direct.
    dungeon_entry: Entrée
    dungeon_entry_value: Une clé correspondante à l'entrée de la ville
    dungeon_instance: Instance
    dungeon_instance_value: Vestibule du donjon, combats publics ou de groupe
    dungeon_completion: Complétion
    dungeon_completion_value: Nettoyer toutes les salles
    dungeon_reward: Récompense
    dungeon_reward_value: Distribution standard du butin
    classes_desc: 12 classes. Les armes sont universelles — n'importe quelle classe peut équiper et utiliser n'importe quel type d'arme — mais manier l'arme conçue pour votre classe accorde +10% de dégâts et de dégâts critiques. Chaque classe débloque ses sorts à des niveaux fixes en progressant.
    table_class: CLASSE
    table_weapon: AFFINITÉ
    table_hp: PV
    role_warrior: Guerrier
    role_assassin: Assassin
    role_berserker: Berserker
    role_druid: Druide
    role_chronomancer: Chronomancien
    role_guardian: Gardien
    role_archer: Archer
    role_prospector: Prospecteur
    role_brawler: Bagarreur
    role_tomoda: Maître des bêtes
    role_gambler: Flambeur
    role_healer: Soigneur
    weapon_daggers: Dagues
    weapon_spear: Lance
    weapon_bow: Arc
    weapon_axe: Hache
    weapon_sword: Épée
    marketplace: MARCHÉ
    marketplace_desc: L'équipement et les personnages se listent sur le kiosque au prix de votre choix ; les acheteurs paient instantanément. Les ressources s'échangent contre du SUI dans des pools d'échange, sans annonce. Chaque vente paie une redevance de 10% — le marché est le seul moyen de vendre.
    section_forgemagie: FORGEMAGIE
    forgemagie_desc: La forgemagie est le système de runes. Concassez des équipements pour obtenir des runes, puis appliquez-les sur d'autres équipements pour modifier leurs stats. Un système risqué mais très rentable pour perfectionner son équipement.
    crushing: CONCASSAGE
    crushing_desc: "Chaque ligne de stat de l'objet concassé est évaluée indépendamment — des stats plus élevées et des poids plus lourds produisent plus de runes. Il n'y a pas de serveur : le diviseur de rendement combine une courbe fixe par niveau d'objet avec le taux propre au template de l'objet, un coefficient d'inflation on-chain partagé (1%-4000%) que le concassage lui-même fait baisser pour ce template et monter pour ses voisins."
    crushing_tiers_desc: Le palier de rune (Ba/Pa/Ra) est sélectionné de manière probabiliste. Des stats plus élevées favorisent les runes Ra.
    rune_tiers: PALIERS DE RUNES
    rune_ba: 'Tier 1: poids le plus faible par rune'
    rune_pa: 'Tier 2: poids moyen par rune'
    rune_ra: 'Tier 3: poids le plus élevé par rune, double XP'
    rune_weight_desc: Le poids part de valeur × poids unitaire ; Rétro arrondit le résultat à l'entier supérieur. Il est calculé automatiquement.
    rune_table_stat: STAT
    rune_table_note: Les runes Portée, Mouvement et Action s'appliquent une seule fois chacune ; Chance Critique jusqu'à 10 fois. Critique et Résultats Critiques n'ont aucune rune.
    rune_stat_range: Portée
    rune_stat_movement: Mouvement
    rune_stat_action: Action
    rune_stat_raw_damage: Dégâts bruts
    rune_stat_critical_chance: Chance critique
    rune_stat_earth_resist: Résistance terre
    rune_stat_fire_resist: Résistance feu
    rune_stat_water_resist: Résistance eau
    rune_stat_air_resist: Résistance air
    stat_unit_weights: POIDS UNITAIRES DES STATS
    stat_unit_weights_desc: Chaque stat a un poids unitaire reflétant sa puissance en combat. Les items avec des lignes de stats lourdes donnent plus de runes au concassage, consomment plus de budget et sont plus difficiles à sur-forger.
    rune_application: APPLICATION DE RUNES
    rune_application_desc: "Temporairement débloquée au niveau 1 du métier d'artisanat correspondant à la catégorie de l'équipement pour les tests. Appliquez les runes une par une pour modifier ses stats. Trois résultats sont possibles :"
    outcome_critical_success: Succès Critique
    outcome_critical_success_desc: La rune passe, aucune stat perdue
    outcome_neutral: Succès Neutre
    outcome_neutral_desc: La rune passe, d'autres stats peuvent baisser
    outcome_critical_failure: Échec Critique
    outcome_critical_failure_desc: La rune échoue, stats perdues égales au poids de la rune
    success_rate: TAUX DE RÉUSSITE
    success_rate_desc: "Le succès dépend de la proximité de la stat avec son maximum : près de 0% c'est ~99% de succès, près du max c'est ~50%, et les stats exotiques restent à ~1% quel que soit le niveau. Le fait qu'un succès soit Critique (aucune perte) ou Neutre (poids payé) varie de la même façon, plus un petit +0,2% par niveau de métier au-dessus de 1. Il n'y a aucune limite sur le niveau d'objet que votre métier peut travailler."
    puits: PUITS
    puits_desc: Un compteur de poids, affiché dans l'interface, qui s'accumule quand les pertes de stats dépassent le poids de la rune. Il absorbe les pertes futures avant que d'autres stats ne soient affectées. Il persiste sur l'objet et le suit entre les établis et les propriétaires.
    over_maging: SUR-FORGE
    over_maging_desc: Poussez les stats au-delà de leur maximum naturel. Chaque ligne de stat est plafonnée à 101 de poids supplémentaire. Le max de sur-forge dépend du poids unitaire de la stat — une stat légère comme la Vitalité (poids 0,25) peut être poussée d'environ 404 points, une lourde comme la Sagesse (poids 3) seulement d'environ 33.
    forgemagie_tips: CONSEILS
    forgemagie_tips_desc: "Pour les exo/over : retirez d'abord les stats peu coûteuses pour accumuler un gros puits, puis passez la stat difficile avec le tampon, puis rajoutez les stats perdues (facile car loin du max). Les stats exotiques et over-magées sautent en premier en cas d'échec."
    forgemagie_xp: EXPÉRIENCE
    forgemagie_xp_desc: "L'XP n'est accordée que sur succès (Critique ou Neutre). Les objets de plus haut niveau et les runes plus lourdes donnent beaucoup plus d'XP. Les runes Ra octroient le double d'XP par rapport aux runes Ba et Pa. Formule : max(1, poidsRune × (1 + niveauObjet / 50) × multiplicateurTier) où le multiplicateur est 2 pour Ra, 1 sinon."
    action_points: POINTS D'ACTION (PA)
    movement_points: POINTS DE MOUVEMENT (PM)
    critical_stat: CRITIQUE
    wisdom_xp: BONUS D'XP DE SAGESSE
    wisdom_xp_desc: Chaque point de Sagesse effective, effets actifs inclus, ajoute 1 % à l'XP gagnée. À 100 de Sagesse effective, vous gagnez le double d'XP.
    chance_loot: CHANCE & BUTIN
    chance_loot_desc: La Chance effective moyenne de l'équipe victorieuse, effets actifs inclus, multiplie chaque taux de drop résolu. À 600 de Chance moyenne, le taux double. Un taux de drop ne peut jamais dépasser 100%.
    mob_loot_band: NIVEAU DU MONSTRE & TAUX DE DROP
    mob_loot_band_desc: La chance définie est le point médian. Un monstre au niveau minimum en utilise 80%, et un monstre au niveau maximum 120%, avec un plafond de 100%. Un monstre à niveau fixe utilise exactement la chance définie. La quantité ne dépend pas du niveau.
