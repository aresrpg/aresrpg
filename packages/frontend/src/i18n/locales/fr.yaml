    build: Construire sur AresRPG
    kares: Jeton KARES
    ways: 'Façons de jouer'
    bots: 'Bots hébergés'
  overview:
    lede: 'AresRPG est un MMORPG tactique qui fonctionne comme un protocole sur Sui. Les personnages, les objets, les combats et le marché sont des objets et des transactions on-chain. Le jeu que vous voyez est un client de ce protocole, et il en existe plusieurs.'
    counts:
      items: Objets
      spells: Sorts
      mobs: Monstres
      recipes: Recettes
      classes: Classes
      jobs: Métiers
    protocol_title: 'Un protocole, pas un seul client'
    protocol:
      - 'Les règles du jeu sont des smart contracts. Un combat, une fabrication, une récolte ou une vente est une transaction, et son résultat est le même quelle que soit l’interface qui l’a envoyée.'
      - 'Votre compte possède vos personnages et vos objets. Aucune interface ne les détient pour vous, sauf un bot hébergé auquel vous choisissez de confier un personnage.'
      - 'Chaque interface lit le même état. Un combat lancé dans le monde 3D peut être suivi depuis une autre page, et le butin gagné par un bot apparaît dans votre inventaire.'
    loop_title: 'Ce que vous faites dans le jeu'
    loop:
      - 'Affrontez des groupes de monstres sur une grille, au tour par tour. À chaque tour, vous dépensez des points d’action pour les sorts et des points de mouvement pour vous déplacer.'
      - 'Récoltez des ressources et fabriquez outils, équipement et consommables dans vos métiers.'
      - 'Terminez des donjons en groupe, salle après salle, pour le butin du boss.'
      - 'Échangez avec d’autres joueurs sur le marché, en SUI.'
  ways:
    lede: 'Le protocole n’a pas une seule porte d’entrée. Chaque interface ci-dessous joue les mêmes personnages, avec le même butin et le même marché. Elles diffèrent par qui joue les coups et par ce qu’il faut pour les utiliser.'
    note: 'Vous pouvez utiliser plusieurs interfaces, avec une limite : une seule connexion active par compte. Ouvrir le jeu 3D remplace une session de la dapp web du même compte.'
  bots:
    lede: 'Un bot hébergé joue vos héros à votre place sur les serveurs d’AresRPG. La dapp web, Telegram et un assistant connecté pilotent tous le même bot.'
    wallet_title: 'Le portefeuille du bot'
    wallet:
      - 'Un bot joue depuis son propre portefeuille, séparé de votre portefeuille de jeu. C’est un multisig 1-sur-2 : le service hébergé peut signer pour lui, et votre compte Google aussi.'
      - 'Les héros et objets que vous confiez passent dans ce portefeuille. Le jeu y est custodial : le service signe les actions.'
      - 'Vous pouvez tout reprendre depuis votre compte à tout moment, même si le bot est hors ligne. Un rappel ne demande que votre signature.'
      - 'Le bot paie ses propres frais de réseau. Gardez un peu de SUI dans son portefeuille. Transférer déplace SUI et KARES entre vos deux portefeuilles.'
    does_title: 'Ce que fait un bot'
    does:
      - 'Chaque héros mène une activité à la fois : combattre autour d’une ville, récolter et fabriquer, ou terminer un donjon. Vous la choisissez, et le bot la suit jusqu’à sa fin ou jusqu’à ce que vous l’arrêtiez.'
      - 'Les héros d’un même portefeuille de bot peuvent combattre en équipe.'
      - 'Vous pouvez mettre le bot en pause ou arrêter un héros à tout moment. Une action déjà envoyée à la chaîne se termine quand même.'
      - 'Un bot attend quand il n’a rien d’approuvé à faire, ou quand son portefeuille n’a plus de SUI pour les frais.'
    control_title: 'Qui peut le commander'
    control:
      - 'La dapp web : lancer et arrêter des activités, monter caractéristiques et sorts, et commercer sur le marché en tant que bot.'
      - 'Telegram : choisir une stratégie vérifiée et l’approuver.'
      - 'Un assistant (ChatGPT, Claude ou Grok) : convenez d’un objectif dans la conversation. Il appelle les outils du bot dans la limite de ce que vous avez approuvé.'
  first_hour:
    lede: 'L’objectif de votre première heure : un personnage, quelques combats gagnés et un outil
      fabriqué par vous-même. Les taux de drop et la recette ci-dessous sont les vrais.'
    drop_chance: '{{chance}}% de chance de drop'
    steps:
      - title: Créez un personnage.
        body: La création coûte {{price}} SUI plus le gas. Votre classe détermine vos sorts, alors
          choisissez bien.
      - title: Gagnez vos premiers combats.
        body: Ces monstres errent autour de la première ville. Approchez-vous d’un groupe et défiez-le.
      - title: Réunissez les pièces d’un outil.
        body: Votre premier outil de récolte se fabrique avec des drops de monstres. Chaque pièce est
          indiquée avec sa meilleure source.
      - title: Fabriquez-le.
        body: Ouvrez le métier {{job}} et fabriquez l’outil. Une fabrication peut échouer et consomme
          quand même ses ingrédients, alors prévoyez des pièces en plus.
      - title: Visez le premier donjon.
        body: Avec un groupe et cette clé, vous pouvez entrer dans le donjon de la première ville.
  market:
    lede: Les joueurs vendent aux joueurs. Objets et ressources s’échangent via des annonces on-chain,
      et le vendeur est payé en SUI.
    royalty: Redevance
    royalty_floor: Redevance minimale
    lot_sizes: Tailles de lot
    points:
      - L’acheteur paie le prix affiché, plus la redevance, plus le gas.
      - Le vendeur reçoit le prix affiché et le retire dans une action séparée.
      - Sur une annonce bon marché, la redevance minimale compte. Comparez le coût total d’un lot, pas
        seulement son prix affiché.
  kares:
    lede: KARES n’est pas encore prêt. Il sera ajouté bientôt.
    note: Cette page décrira le jeton, son offre et ses réserves de récompenses à son lancement. Aucun
      solde, prix ou montant de récompense n’est publié d’ici là.
  agents:
    lede: Connectez ChatGPT, Claude ou Grok à un bot AresRPG hébergé. Vous convenez d’un objectif, et
      l’assistant joue votre personnage dans ce cadre. Cette fonctionnalité est en cours de
      développement.
    steps:
      - Choisissez votre assistant et ajoutez l’adresse de connexion AresRPG comme connecteur
        personnalisé.
      - Connectez-vous avec Google, puis approuvez le bot exact et ce qu’il peut faire.
      - Confiez un personnage depuis votre inventaire. Vous pouvez le récupérer à tout moment.
    points:
      - L’assistant ne reçoit jamais de clé de portefeuille, et n’en demande jamais dans le chat.
      - Le jeu hébergé est en mode dépositaire. Un compte partagé 1 sur 2 détient le personnage et
        l’agent hébergé signe les actions. Votre connexion Google reste votre authentification et votre
        moyen de récupération.
      - Un bot connecté n’est pas toujours actif. Il attend quand il n’a pas d’étape suivante approuvée.
    guide: Lire le guide de connexion
    index: Ouvrir le playbook pour agents
  build:
    lede: Le client du jeu repose sur un SDK public. Vous pouvez créer votre propre client, outil ou
      bot avec les mêmes actions.
