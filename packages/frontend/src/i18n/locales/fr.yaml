  chapter_secret: 'Dernier secret'
  welcome_title: 'Bienvenue sur Nauvis.'
  welcome_body: 'AresRPG récompense ceux qui apprennent, se préparent et jouent intelligemment. Apprenez à optimiser et automatiser votre jeu en dépensant le moins de SUI possible. Suivez ce voyage pour prendre vos marques.'
  hoe_title: 'On a tous besoin d’une houe.'
  hoe_body: 'Achetez un {{item}} ou fabriquez-le via Personnages → Métiers → Bricoleur. Ouvrez la recette et sélectionnez les ingrédients pour voir leurs sources. Cherchez les Tinkers autour de Thebes et dans les forêts ; les joueurs plus forts peuvent chasser les sangliers dans les plaines et forêts pour leurs branches rongées.'
  hoe_objective: 'Posséder {{item}}'
  wheat_title: 'Les mains dans la terre.'
  wheat_body: 'Fabriquer votre équipement commence par récolter des ingrédients. Le blé sert à préparer de la nourriture et des matériaux d’équipement : un bon point de départ. Trouvez du blé sur Nauvis et faites votre première récolte !'
  wheat_objective: 'Récolter du blé'
  pickaxe_title: 'Une carrière prometteuse.'
  pickaxe_body: 'Vos prochaines améliorations demanderont plus que des récoltes. Avec {{item}}, vous pourrez extraire des minerais pour fabriquer votre équipement. Achetez cet outil ou fabriquez-le. Votre carrière de mineur doit bien commencer quelque part.'
  pickaxe_objective: 'Posséder {{item}}'
  quartz_title: 'Sous les pierres.'
  quartz_body: 'Le blé ne suffira pas à vous équiper. Les armes et les bijoux demandent aussi des minerais comme le quartz. Récoltez-en avec votre pioche pour vos prochaines fabrications.'
  quartz_objective: 'Récolter du quartz'
  sickle_title: 'Une coupe d’avance.'
  sickle_body: 'Plantes et champignons fournissent des ingrédients pour les potions et les matériaux de fabrication. Avec {{item}}, découvrez le métier d’herboriste. Achetez cet outil à un joueur ou fabriquez-le.'
  sickle_objective: 'Posséder {{item}}'
  mushroom_title: 'Un champignon de plus.'
  mushroom_body: 'Pour continuer à fabriquer, il vous faudra plus que des céréales et des minerais. Les champignons verts servent aux potions, au cuir et à d’autres matériaux. Récoltez votre premier champignon, puis faites progresser vos métiers de récolte pour débloquer de nouveaux ingrédients.'
  mushroom_objective: 'Récolter un champignon vert'
  token_title: 'Provoquez votre chance.'
  token_body: 'Vos prochaines fabrications vont demander pas mal d’objets. Augmenter votre Chance améliore vos chances d’en obtenir en combat. Trouvons un talisman {{item}} et équipons-le !'
  token_objective: 'Posséder {{item}}'
  croissant_title: 'Du pain avant la bataille.'
  croissant_body: 'Après une défaite, vos PV tombent à zéro. Vous pouvez attendre qu’ils remontent, ou manger pour repartir au combat plus vite. Procurez-vous {{item}}, ou préparez-en dans Personnages → Métiers → Boulanger.'
  croissant_objective: 'Posséder {{item}}'
  lorito_title: 'Il va y laisser des plumes.'
  lorito_body: 'Un meilleur équipement demande des matériaux qu’on ne trouve pas dans un champ de blé. Les donjons offrent du butin et de l’XP, mais il faudra se battre. Prenez de quoi vous soigner, apportez une clé au Lorito doré à Thèbes et triomphez de sa dernière salle.'
  lorito_objective: 'Terminer le donjon du Lorito doré'
  suize_title: 'Un dernier secret.'
  suize_body: 'Bravo, aventurier. De meilleures récoltes ouvrent de nouvelles recettes. Un dernier défi : récoltez vous-même du Suize. Où en trouver ? Voilà votre premier problème à résoudre sans moi.'
  suize_objective: 'Récolter du Suize'
  welcome_objective: ''
  saving: Sauvegarde…

