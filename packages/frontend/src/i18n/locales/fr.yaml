      title: 'Vétérans Hytale · Top 100'
      description: 'Un cadeau pour les 100 meilleurs joueurs Hytale éligibles, classés selon leurs collections, leur temps de jeu, l’XP de leurs personnages et leurs métiers. Les récompenses vont à l’adresse Sui enregistrée dans la sauvegarde Hytale. Utilisez le compte Google d’origine pour accéder à ce portefeuille.'
