    spell_points_value: '{{n}} par niveau'
    xp_milestones: PALIERS D'XP
    level_10: Niveau 10
    level_50: Niveau 50
    level_100: Niveau 100
    base_stats: STATS DE BASE
    stat_vitality: Vitalité
    stat_vitality_desc: +1 PV max par point
    stat_wisdom: Sagesse
    stat_wisdom_desc: Bonus de gain d'XP
    stat_strength_desc: Dégâts terre
    stat_intelligence_desc: Dégâts feu, mise à l'échelle du soin
    stat_chance_desc: Dégâts eau, plus de butin
    stat_agility_desc: Mise à l'échelle des dégâts air
    derived_formulas: FORMULES DÉRIVÉES
    max_health: VIE MAX
    loot_desc: Chaque monstre vaincu effectue une fois le jet de chaque entrée de sa table de butin. Une entrée réussie donne une quantité aléatoire dans sa plage définie.
    stat_rolling: JET DE STATS
    stat_rolling_desc: Chaque stat est tirée uniformément dans sa plage de template. Chaque valeur a la même probabilité.
    archimobs: MOBS ARCHI
    archimobs_desc: 0,5% de chance d'apparaître à la place sous la forme du mob archi — une variante nommée, en permanence plus forte. Le seul mécanisme de rareté que les mobs possèdent.
    max_members: Membres max
    groups_desc: Un groupe est un roster partagé de jusqu'à {{max}} joueurs, avec élection de leader. Être en groupe ne fait rien à lui seul en combat — tout le monde, groupé ou non, doit envoyer sa propre transaction de participation au combat pour y entrer ; il n'y a aucune inclusion passive ou de proximité.
    groups_xp: PARTAGE DE L'XP
    groups_xp_desc: Les mobs vaincus forment une réserve d'XP de base. Les combattants éligibles lui donnent le coefficient de groupe Rétro, l'écart entre les niveaux totaux des joueurs et des mobs la réduit, puis chaque joueur reçoit la part correspondant à son niveau dans le total du groupe. Un joueur sous le tiers du niveau du plus haut joueur n'augmente pas le coefficient. La Sagesse s'applique en dernier ; les dégâts personnels ne comptent pas.
    groups_loot: PARTAGE DU BUTIN
    groups_loot_desc: Chaque monstre vaincu effectue un unique jet de butin partagé. Les drops réussis sont attribués à tour de rôle aux joueurs victorieux ; ajouter des joueurs ne crée aucun jet supplémentaire.
    dungeons_desc: Trouvez un portail dans une zone explorée, dépensez sa clé, puis terminez les salles dans l'ordre. Chaque portail possède son propre vestibule en direct.
    dungeon_entry: Entrée
    dungeon_entry_value: Une clé à un portail de zone découvert
