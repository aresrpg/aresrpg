    runic_blade: "Des runes courent sur toute la longueur de la lame, et deux érudits ne s'accordent jamais sur leur sens. L'enchanteur insiste que c'est un vieux dialecte. Le forgeron insiste que ce n'est qu'un décor dont il aimait l'allure. Personne n'a consulté la lame."
    runic_grimoire: "La moitié de ses pages contient de vrais sorts. L'autre moitié, des plaintes contre les mages qui n'arrêtaient pas de se tromper, griffonnées en marge d'une main que personne dans le culte n'admet reconnaître."
    runic_ink: 'Encre bioluminescente qui conserve sa charge magique. Utilisee par les bricoleurs pour inscrire des runes fonctionnelles.'
    runic_warden_blade: "Les runes kweebec luisent au plus faible a l'aube, comme jadis la lance ceremonielle dont elle est issue."
    rustshore_cutlass: 'Une lame de marin qui a connu bien plus de bagarres de taverne que de batailles navales.'
    rusty_daggers: "Le tetanos est une fonctionnalite pas un defaut. Chaque coup offre un risque d'infection gratuit."
    sabertooth_axe: "Le croc est la lame. Le manche n'est la que pour le soutien moral."
    sabertooth_fang: "Plus long qu'une dague. Plus tranchant que la plupart des reparties. Le fauve, desormais, n'en a plus l'usage."
    salve_biscuit: "Moitie pain, moitie bandage. Les alchimistes l'emiettent en pate cicatrisante. Gout de medicament, efficace comme un miracle."
    sandwraith_legplates: "Plaques blanches comme l'os apparues dans un tombeau du désert avec un mot disant 'PRENEZ-LES ET PARTEZ.' Personne ne sait qui a laissé le mot. Personne ne veut le découvrir. Le sable qui tombe perpétuellement des joints ne provient d'aucun désert connu, et le balayer est futile — il réapparaît au matin."
    sandwraith_reaper: 'Déterrée à demi enfouie dans les dunes. Son ancien propriétaire, lui, fut retrouvé bien plus enfoui.'
    sapling_bark: "Pelée d'un jeune kweebec. Elle s'est reformée en panneaux de qualité armure toute seule. Même mort, ce bois a de l'ambition."
    sapling_bark_boots: 'Le bois est techniquement encore vivant, et techniquement encore furieux de la situation.'
    sapling_channeler: "Taillé dans une jeune pousse qui n'avait pas encore choisi ce qu'elle voulait devenir. Les kweebecs considèrent tout ce bâton comme une prise d'otage. Vous, comme une arme. Personne n'a complètement tort."
    sash_of_the_void_emperor: "La plus grande Mite du Vide recensée portait ceci lors de sa mue finale, dont elle n'est jamais ressortie. Ce qui l'a remplacée dans la carapace reste à cataloguer, et les archivistes ne se pressent pas."
    saurian_bow: "Tendu assez fort pour abattre quelque chose qui, jusqu'a recemment, vous chassait activement."
    saurian_fang: 'Assez de prise pour tenir un repas qui se debat. Assez de morsure pour que ca cesse.'
    saurian_gauntlets: "Phalanges ecailleuses, odeur de feu de camp incluse. Le proprietaire precedent n'a PAS consenti au recyclage."
    saurian_greataxe: ''
    saurian_ripper: 'Taillee dans un os encore assez chaud pour rendre les forgerons nerveux.'
    saurian_scale: 'Épaisse, irisée, et porte une légère humidité. Les armuriers les tissent en armure aquatique. Nettoyage à sec non recommandé.'
    saurian_scale_helm: "Les vieux rois-lézards n'ont jamais compris pourquoi les plus petits s'embêtaient avec des casques — leur propre crâne suffisait à défoncer un mur. Ils supposaient que quiconque en portait un frimait, tout simplement. Le conte admet qu'ils n'avaient pas complètement tort."
    saurian_staff: ''
    saurian_throwing_spear: "Equilibre plus par l'instinct du serpent des courants que par l'artisanat. Lance une fois, il corrige seul sa trajectoire."
    saurian_war_axe: ''
    saurian_war_harness: "Retaillé à partir d'un harnois conçu pour un saurien trois tailles au-dessus de tout porteur depuis, l'armurier ronchonnant tout du long sur l'art et la dignité. Il garde encore un vague parfum de territoire dont personne n'a osé reprendre possession."
    saurian_war_horn: "Taillee dans une gorge qui n'a plus respire depuis dix mille ans. Toujours trop bruyante a 3h du matin."
    saurian_waraxe: "Taillée selon l'angle que préféraient les rois-de-pierre avant de s'endormir sous les profondeurs, on dit qu'elle se souvient mieux des vieilles offenses que des récentes. Elle a des opinions bien arrêtées sur les crânes. Personne n'a trouvé à qui les demander."
    scale_mail_gauntlets: 'Chaque ecaille fut arrachee a un raptor qui protesta, vocalement, et longuement.'
    scale_plate: "Une grosse écaille de reptile de la taille d'une assiette. Les armuriers adorent. Le raptor est moins enthousiaste sur l'arrangement."
    scaled_hide: "Petites écailles chevauchantes qui accrochent la lumière. Les tanneurs en cousent des douzaines. C'est fastidieux. Ils se plaignent."
    scar_iron: "Fer arraché directement à la roche mise à nu de la Cicatrice, conservant encore le froid de sa profondeur d'origine. Les forgerons le laissent se réchauffer avant de le travailler, par respect et par légère prudence."
    scar_maul: "Extraite de pierre-cicatrice assez lourde pour que la brandir ait le poids du dernier argument que la plaie aura jamais besoin d'entendre."
    scar_sigil_amulet: 'Frappée du même sceau que les Chantres de la Cicatrice gravent dans les parois de fracture, censée repousser les remontées que la Plaie recrache.'
    scar_suture_daggers: "Calquées sur les lames rituelles des Prêtres-Sutures, assez fines pour refermer une plaie ou en ouvrir une, selon l'angle. Les Prêtres jurent que c'est toujours la première."
    scarab_cleaver_axe: "En forme d'aile. Vole exactement aussi bien que tenaient les autres promesses du marchand."
    scarak_chitin_belt: "Plaques de scarabée qui s'emboîtent comme un casse-tête conçu par un insecte sans loisirs ni amis. Elle se resserre seule, obéissant encore au dernier ordre de la ruche : serrer."
    scarak_cleaver: 'La ruche scarak a tenu trois conseils pour recuperer ceci. Les trois ont echoue.'
    scarak_crown: "Porter la tête d'un scarak sur votre tête. Il y a une récursion philosophique là-dedans que les scaraks n'ont absolument pas considérée."
    scarak_overlord_ring: "Fourni d'office aux gardiens de tombe. Ne ternit pas ; rien ne ternit dans les tumulus."
    scarak_shell: 'Plaque chitineuse qui claque quand on la pichenette. Fait de bonnes tuiles. La reine serait furieuse si elle avait des émotions.'
    scarak_shell_plate: "Plaques de chitine récoltées pendant la mue. Les scaraks étaient furieux, mais aussi techniquement nus, donc leur protestation manquait d'autorité."
    scarak_stinger: "Arrache directement d'un scarak et monte sur un baton. Encore fremissant."
    scarforged_alloy: 'Martelé sur la chaleur propre de la Cicatrice, que les forgerons rationnent avec soin — la Cicatrice ne se réchauffe pas sur demande.'
    scarforged_grips_of_first_dawn: "Trempées dans le froid qui stagne au fond de la fracture à l'aube. Ce froid ne les quitte jamais complètement, que le porteur finit par ne plus remarquer."
    scarforged_legguards_of_last_ascent: "Aplatis sur la pierre-enclume de la Cicatrice elle-même, ce qui laisse dans la plaque une légère ondulation qu'aucun polissage n'efface. Plus personne n'essaie."
    scarforged_resin: "Sève réduite sur la chaleur de la Cicatrice jusqu'à prendre un aspect vitreux et tenir une jointure mieux que le fer lui-même. Elle sent, faiblement et à jamais, le feu qui l'a faite."
    scarforged_tonic_of_last_ascent: "Distribué une gorgée par grimpeur pour l'assaut final, au motif que quiconque a besoin d'une seconde gorgée ne finira de toute façon pas l'ascension."
    scarforged_visor_of_first_dawn: 'Incliné pour capter la première lueur ayant jamais franchi la Cicatrice, une lumière que les forgerons disent différente. Nul ne les a démentis, surtout parce que nul ne leur a rien démontré du tout.'
    scarforged_warbelt_of_last_ascent: "Bouclé d'un fermoir taillé à même le rebord de la Cicatrice, de sorte qu'il ne se ferme jamais parfaitement à ras. L'interstice est petit, et il est toujours là."
    scarguard_helm: "Réglementaire pour quiconque monte la garde au dernier mur, la visière inclinée pour que le porteur n'ait jamais à fixer la Plaie trop longtemps."
    scarhewn_axe: "Éclatée à même le mur brisé de la Cicatrice, le tranchant laissé aussi déchiqueté que l'est la ligne de fracture. Elle coupe comme si le monde avait déjà renoncé à résister."
    scarwalk_leggings: "Usées jusqu'à la trame par des pèlerins qui ont arpenté le bord de la Cicatrice plus de fois que les jambières, franchement, n'étaient conçues pour."
    schism_cuirass_of_last_tremor: "Trempée le jour où la ligne d'un Soldat Brisé a enfin, formellement, rompu le rang pour la dernière fois. Le métal a cessé de résonner cet après-midi-là. Il n'a plus fait un bruit depuis."
    schism_gauntlets_rift: "Le gantelet gauche se souvient de la prise d'un Soldat Brisé sur un bouclier qui n'existe plus. Le gantelet droit n'a jamais rien tenu du tout. Les porteurs favorisent un côté sans le vouloir."
    schism_gauntlets_void: 'Les doigts ne se réchauffent jamais vraiment. Pratique pour les nerfs, désastreux pour serrer la main.'
    schism_girdle_of_widening_crack: "Conçue par un intendant Soldat Brisé pour continuer à fonctionner après sa rupture, ce qui relève soit d'un génie de conception, soit d'un commentaire bien triste sur les attentes. Les deux, probablement."
    schism_greaves: "La grève gauche et la grève droite furent forgées à partir de deux Soldats Brisés qui n'ont jamais servi à la même époque. Elles ne s'accordent toujours pas vraiment sur l'ordre de marche."
    schism_resin: "Suinte d'une roche fendue en deux qui n'a jamais pardonné à aucune moitié."
    schism_sabatons_rift: 'Le vide remonte par les semelles. Les porteurs signalent un cœur chaud et des orteils insupportables.'
    schism_sabatons_void: "Semelles lestées pour que la gravité ténue ne t'emporte pas en pleine foulée."
    schism_signet_of_last_tremor: "A cessé de vibrer à l'instant où le dernier tremblement d'un Rifflet s'est éteint dans sa carapace. Maintenant, il reste simplement froid sur la main, ce que le précédent porteur trouvait plus troublant que la vibration ne l'avait jamais été."
    schism_signet_of_widening_crack: "La gravure s'allonge d'un cheveu chaque année, retraçant la même ligne grandissante qui a fendu l'insigne de rang original du Soldat Brisé. Les joailliers refusent de l'expertiser deux fois."
    scorch_grimoire: 'La couverture est roussie. Le contenu est pire. Quiconque lit le chapitre trois à voix haute perd ses sourcils.'
    scorched_loaf: "Brûlé exprès, et n'ose pas insinuer le contraire. Ce croquant, c'est tout l'intérêt, pas la honte d'un boulanger."
    scorchtouch_grips: "Chaque objet saisi devient plus chaud entre vos mains. Serrer la main de quelqu'un est desormais un incident diplomatique."
    scrap_battleaxe: ''
    scrap_cuirass: "Martelee a partir de plaques recuperees. Les trous sont des 'aerations' selon le forgeron. Bien sur."
    scrawled_tome: "Trouvé flottant dans la Nef Engloutie, son encre encore fraîche après ce que les bateliers jurent être une décennie sous l'eau. Personne n'a traduit la dernière page ; les trois premières en ont dissuadé plus d'un."
    scythe_of_the_abyss: "Quand l'abîme te tend une arme. Un service client étonnamment bon."
    sealed_core: "Un noyau forgé autour d'une écharde de genèse et scellé comme l'Oracle scelle une plaie — bien serré, avec une note écrite déconseillant de l'ouvrir."
    senshi_starter_sword: "C'est un bâton. Tu y as scotché une poignée. Tu ne trompes personne, surtout pas les gobelins qui vont absolument en parler à leurs potes."
    sentinel_gorget: 'Protège le cou. Une stratégie de survie étonnamment sous-estimée.'
    sentinel_teeth: ''
    sentinel_tooth: "On se demande quel genre d'imbécile s'approche assez près d'un crocodile pour lui arracher les dents, et pourtant nous voilà."
    seraph_chain: 'Il a été approuvé par une décision partagée, ce qui explique la clause de garantie biffée.'
    seraph_heart_pendant: 'Ce pendentif se défait avec une insistance tranquille. Il est simultanément ici et ailleurs, porté et jeté, réel et contesté.'
    seraph_lance: "L'artisan n'est toujours pas sûr de l'avoir bien terminé, ce qui explique la clause de garantie biffée."
    seraph_petal: "La question de savoir si c'est une matière ou plusieurs reste ouverte, et le rapport a quand même été déposé, réserves incluses."
    seraph_plume: 'Sa pureté est jugée sur une échelle mouvante et négociable, alors le registre liste simplement les deux, côte à côte.'
    seraphbound_casque_of_falling_crown: "Il résiste à l'examen, de justesse, alors il a été livré quand même, doutes compris."
    seraphbound_cordial_crown: "Son arrière-goût relève de l'opinion personnelle, alors il est vendu avec un haussement d'épaules plutôt qu'une garantie."
    seraphbound_cordial_godbone: 'Il a été brassé pour trancher un débat, sans succès, donc à boire à ses risques et périls, formellement parlant.'
    seraphbound_longsword: "Le design a survécu à trois objections distinctes, soit l'essence même du concept, soit une simple erreur d'arrondi."
    seraphbound_loop_of_broken_diadem: 'Le design a connu plusieurs versions inconciliables, ce qui est techniquement vrai et totalement inutile.'
    seraphbound_resin: 'Il a été consigné comme preuve dans un débat jamais achevé, alors les acheteurs sont invités à juger par eux-mêmes.'
    seraphbound_stompers: "Le porteur en fait l'éloge sans réserve ; tous les autres doutent, alors le débat a été reporté indéfiniment."
    seraphbound_vambraces: "Sa fonction a été tranchée à pile ou face, et la dispute a survécu à tous ceux qui l'ont lancée."
    seraphic_amalgam: "Deux rapports distincts le décrivent en termes contradictoires, ce dont l'équipe d'étude débat encore."
    seraphine_hauberk: "Les notes de l'artisan ne contiennent que des idées biffées, alors le désaccord a été discrètement intégré au design."
    shadow_blade: ''
    shadow_knight_signet: "L'inscription interieure se traduit, en gros, par une menace. Ceux qui l'ont forge jurent que c'est une promesse."
    shadow_knight_visor: "La fente oculaire reste volontairement etroite. Les chevaliers d'ombre jugent la vision peripherique immorale."
    shadow_stilettos: "Forgees d'eclats absorbant la lumiere. Vos ennemis ne verront pas non plus l'echec arriver."
    shadowsteel_belt: "Retient votre pantalon et, parait-il, votre effroi mortel. L'une de ces affirmations n'est pas verifiee."
    shadowsteel_morningstar: 'Les pointes boivent la lumiere plutot que de la refleter, ce qui en fait une veilleuse deplorable.'
    shadowsteel_shard: "Brisé d'une armure où l'obscurité n'était pas décoration mais structure porteuse. Les forgerons le manient avec des pinces, une prière, et la prudence particulière de ceux qui savent ce qui arrive à qui saute la prière."
    shark_bone_choker: 'Un collier de vertèbres de requin. À la mode dans les villes côtières. Terrifiant absolument partout ailleurs.'
    shark_fin: 'Un aileron dorsal de requin-marteau. Des marchands de soupe ont été arrêtés pour moins que ça.'
    shark_fin_saber: "Dentelée à l'image de dents de requin. Les requins, on les comprend, en sont encore contrariés."
    shark_harpoon: "Munie d'un aileron de requin à l'éthique certifiée. Le requin contesterait le mot 'éthique'."
    shark_leather_belt: "Assez rugueux pour servir de papier de verre. Le requin n'a pas survecu a la metaphore."
    shark_mail: "Écailles d'aileron de requin cousues sur anneaux de mithril. Étanche, anti-requin, et sujet de conversation garanti."
    shark_scale_tassets: "Écailles d'aileron de requin aux cuisses. Tu es désormais aérodynamique sous l'eau. Légalement, un poisson."
    shark_vertebra_ring: 'Une seule vertèbre de requin, polie. La mâchoire dont elle vient chasse encore, techniquement.'
    sharkhide_fists: 'Peau de requin enroulée sur des plaques de thorium. La texture rugueuse fait aussi office de râpe à fromage.'
    sheep_eye: "L'oeil détaché d'un Mérignard est bien moins intimidant quand il ne peut pas cligner, ce qui s'avère être toujours le cas."
    shellguard_mitts: 'Doublées de chitine de crabe assez épaisse pour émousser les coups et la motricité fine. Vos doigts sont en sécurité, pas votre dextérité — et le reste, en dessous, est presque impossible à tuer.'
    shiny_barley: ''
    shoddy_spear: "Un baton pointu avec des illusions de service militaire. La pointe vacille mais l'engagement c'est tout."
    shore_amulet: "Taillée dans la carapace d'un crabe, celui qui a pincé le mauvais pêcheur. Le sable emprisonné à l'intérieur cliquette quand le danger approche, ou quand vous marchez. Il ne fait pas la différence."
    shore_finns: "La carapace de grands crabes, façonnée en armure de jambe robuste qui crépite légèrement d'une odeur de sel marin et de marée séchée au soleil."
    shore_mace: 'Incrustée de bernacles qui ajoutent de la texture et un risque de tétanos.'
    silentedge: "Ne fait aucun bruit au dégainage, au coup, ni à l'impact. C'est le silence d'après que l'on retient."
    silk: "Filaments d'une qualité irréprochable, lisses comme l'eau et plus solides que les chaînes. Quel dommage pour les nœuds — ils tiennent bon, mais les liens familiaux n'ont jamais vocation à être mis à l'épreuve ainsi."
    silk_boots: "Impossiblement légères, tissées avec la soie d'araignées soudoyées avec des mouches. L'arrangement a duré juste assez longtemps pour finir une paire. L'apprenti cordonnier est toujours en thérapie."
    silk_bound_lexicon: "Relie en fil de cocon de silkling. La moitie des sorts est illisible l'autre moitie est dangereuse."
    silk_cocoon: "A demi forme et poisseux. Ce qu'il y a dedans est soit une larve, soit, plus inquietant, votre dejeuner."
    silk_cowl: 'Tisse a partir de creatures qui passent leur vie entiere sur les courants ascendants sans jamais regarder en bas.'
    silk_gloves: 'Le summum de la mode pour les oisifs de naissance, et dont le sang coule bien plus chaud que leurs mains ne le seront jamais.'
    silk_leggings: 'Legere comme une brise. Robuste comme ce qui a cause la brise en premier lieu.'
    silk_tunic: "Tissee par des araignees cavernicoles qui n'oeuvrent que dans l'obscurite et le silence absolus."
    silk_woven_gauntlets: "Si legers qu'on oublie les porter. On s'en souvient au pire moment possible."
    silkamu: "Tissé de fils qu'aucune araignée n'a cédés volontairement. Le syndicat arachnéen a mis la tête du tisseur à prix, payable en mouches."
    silkling_stingers: 'Leurs barbes quasi microscopiques garantissent des plaies qui suppurent pendant des semaines, ce qui est sans doute le but recherché.'
    silkwinder_lance: "Enveloppée de soie d'araignée qui la fait siffler dans l'air. Les ennemis l'entendent mais ne l'esquivent jamais."
    silt_wrapped_core: "Un noyau d'artisanat gainé de vase qu'il faut fracturer pour utiliser, et qui se reforme en une nuit si on le laisse trop longtemps entre deux ouvrages."
    silt_wrapped_cuirass_of_quiet_drowning: "Enrobée d'une gangue de vase qui durcit en pierre au sec et s'amollit à l'humide, ce qui, dans le Weald, signifie qu'elle est toujours, discrètement, en transition."
    silt_wrapped_gauntlets: 'Croûtés de vase qui durcit sur les jointures, si bien que le premier coup de poing livre aussi une poignée du sol du Weald.'
    silt_wrapped_greaves: "La gangue de vase ajoute le poids d'une pierre à chaque pas, que le porteur finit par ignorer à peu près quand tous les autres le remarquent."
    silt_wrapped_lance: "Sa gangue de vase éclate au premier choc et emporte l'attention de l'ennemi avec elle, dont le second choc profite."
    silt_wrapped_maul_of_quiet_drowning: "Sa gangue de vase ajoute le poids d'une pierre et, à l'impact, une petite gerbe du sol du Weald, de sorte que chaque coup laisse un peu de chez-soi."
    silversteel_saber: "Brille sous n'importe quelle lumiere. Attire l'attention, surtout celle qu'on cherchait a eviter."
    sky_shard: "Un morceau solidifié de nuage d'orage. Flotte si vous le lâchez. Les arcanistes les lient dans des bâtons. La gravité est vexée."
    sky_shard_diadem: "Porté par le dernier à tenir l'étendard cendré. La charge change souvent de mains."
    skybound_ring: "Cuit dans les fosses à bûcher, encore et encore, jusqu'à n'avoir plus d'autre mémoire."
    skyburial_bow: 'Il fonctionne sous réserve, ce à quoi le porteur a choisi de ne plus penser.'
    skyburial_leggings: 'Le porteur ne jure que par lui ; tous les autres doutent, alors le porteur a cessé de demander.'
    skyheld_carapace_of_hollow_throne: 'Il a été terminé par pure entêtement, une décision prise sous une forte pression temporelle.'
    skyheld_claymore_of_last_regent: "Il fonctionne, mais seulement si on ne demande pas pourquoi, alors l'affaire reste, pour l'instant, non résolue."
    skyheld_crest_of_hollow_throne_crown: 'Son efficacité attend toujours une vérification indépendante, ce que personne ne peut confirmer sans relancer la dispute.'
    skyheld_crest_of_hollow_throne_godbone: "Son créateur a changé d'avis à mi-chemin, une résolution qui n'a presque rien résolu."
    skyheld_halberd_of_hollow_throne: "Il a été achevé malgré une hésitation unanime, alors le différend d'origine a été déclaré match nul."
    skyheld_stilettos_of_hollow_throne: "L'artisan n'est toujours pas sûr de l'avoir bien terminé, alors il a été livré quand même, doutes compris."
    slackline: "Jamais réellement lâche. C'est le nom que lui donnait son précédent propriétaire, juste avant que ça ne cesse d'être vrai."
    slag_clinker: "Ce que la fournaise recrache une fois qu'elle a décidé d'en avoir fini avec quelque chose. Les mineurs le gardent quand même — le rebut, dit le vieux dicton, reste un minerai qu'on n'a pas su demander gentiment."
    sloth_fur: 'Incroyablement doux et sent la mousse et la patience. Les tailleurs adorent. Le slothian a juste soupiré très lentement.'
    slothian_wisdom_stone: "Une pierre couverte de mousse qui vibre de savoir ancien. Elle connaît les réponses. Elle pense juste que vous n'êtes pas prêt."
    smoldering_wheat: ''
    solomonk: 'The cowl of a monk who traded three vows of silence for one very loud hat.'
    soul_binder: "Distillé de ce qui subsiste une fois un revenant enfin abattu. Sert à maintenir assemblé l'équipement lié aux esprits."
    soul_shard: "Un fragment cristallisé arraché à un revenant en plein rite. Résonne encore de quelque chose d'inachevé."
    soul_shard_loop: "Enferme un éclat de quelque chose qui n'est pas encore tout à fait parti."
    soulbinder_scepter: "Porte une fraction de ce que les Auditeurs d'Âmes lient à la porte en contrebas, vibrant d'une permanence empruntée. Un Prophète de Cendre s'en servait pour poser des questions auxquelles les morts ne répondent d'ordinaire pas deux fois."
    soulking_spellbook: ''
    sounding_hull_key: "Récupérée dans l'épave que le Gardien de la Coque patrouille encore. Elle vibre faiblement à chaque tournant de marée, comme si elle décomptait vers quelque chose."
    spark_pendant: "Une etincelle captive trop tetue pour savoir qu'elle aurait du s'eteindre il y a des decennies."
    spark_ring: "Un cercle de cuivre au cœur d'aimant qui projette des étincelles chaque fois que son porteur est en colère, anxieux, ou pense trop fort au dîner. L'enchanteur l'appelait bague d'humeur. Le village l'appelle risque d'incendie."
    spectral_arcanize: ''
    spectral_edge: "Moitié dans ce monde, moitié dans l'autre. Les douanes à la frontière sont très pointilleuses."
    spectral_essence: 'Distillée du Régent Sans Âme lui-même. Sent le vide entre les étoiles. Valeur marchande absolument ruineuse.'
    spectral_fang_daggers: 'Forgés à partir de plaintes fantomatiques condensées. Chaque coup vient avec un grief détaillé.'
    spectral_ruin_blade: "Forgée dans une carapace de Mite du Vide assez fine pour voir au travers sous le bon éclairage, et assez fine pour trancher sous n'importe quel éclairage. Les fantômes de ses anciens propriétaires offrent parfois des conseils non sollicités."
    spice_rusk: "Cuite deux fois et si aromatique que les forgerons d'armes en extraient l'huile pour tout sauf la patisserie."
    spicebark_bread: 'Une bouchee et tous les sinus dans un rayon de trois tables capitulent sans condition.'
    spider_fang_club: ''
    spider_fang_daggers: 'Deux lames de venin cristallise qui bourdonnent, tres faiblement, des que la violence se profile.'
    spider_leg: "Manipulez avec précaution, à moins que vous ne savouriez la sensation d'araignées invisibles rampant sous votre peau pendant des semaines."
    spider_silk_gland: "Organe gelatineux produisant un fil plus resistant qu'un cable d'acier de meme diametre. Manier avec douceur quand meme."
    spider_silk_grips: "Ne relache jamais ce qu'elle tient. Formidable au combat, catastrophique pour une poignee de main."
    spider_silk_treads: "Chaussures quasi silencieuses tissées en soie d'araignée des cavernes. Parfaites pour la discrétion, catastrophiques pour annoncer votre présence aux dîners mondains. La soie colle parfois aux surfaces — défaut de conception ou ultime vengeance de l'araignée."
    spider_thread_pants: "File a partir d'un fil qu'aucune araignee n'a jamais cede de bon gre. L'approvisionnement ethique n'etait pas envisage."
    spine_daggers: "Cultivees par une certaine Elorie pour la cruaute, non la pitie. L'histoire n'a pas dit laquelle l'emporta."
    spine_gauntlets: "Piquants de broustailleur montés sur des paumes de cuir. Chaque poignée de main devient une négociation. Chaque tape dans le dos, une déclaration de guerre. La fabrication impliquait d'arracher des épines à une créature très en colère, ce qui explique le ressentiment résiduel."
    spine_pants: "Renforce de piquants venus d'une creature petite et tres susceptible qu'on s'assoie sur elle."
    spore_cracker: ''
    stabilizing_agent: 'Empeche les melanges instables de devenir des explosions non planifiees. Les lots ratés ne sont jamais evoques.'
    staff_of_the_deep: "Tiré d'un temple englouti que personne ne se souvient avoir bâti. Les balanes sont la partie la moins étrange."
    stamina_tonic: "Stimulant mineral qui convainc vos jambes qu'elles ne sont pas fatiguees. Elles savent mieux, mais obeissent par peur chimique."
    starter_staff: "Ce bâton de bambou usé a guidé d'innombrables vagabonds à travers marais et landes. Curieusement, il fonctionne aussi bien comme aide à la marche que comme leçon improvisée d'humilité."
    starter_weapon_ikari: "Épaisse, émoussée et pesante — tout ce qu'une arme digne de ce nom refuse d'être. On pourrait en matraquer un ennemi à mort, à condition de réussir à la soulever au-dessus des épaules."
    steadyhand: 'Arrête le tremblement que la Cicatrice finit par donner à tout le monde. Seulement la main. Le reste des tremblements reste votre problème.'
    steel_cuirass: "L'ancien proprietaire a laisse une adresse de suivi. Personne n'a eu le courage de la verifier."
    steel_flail_sword: "Lame souple forgee au crepuscule, enveloppee de maille a soies. Elle plie comme une promesse que nul n'entend tenir."
    steel_gauntlets: "Les doigts s'articulent parfaitement dans l'obscurite et se raidissent des que le soleil les touche."
    steel_greaves: "Derniere creation du chevalier d'ombre avant sa retraite pour elever des abeilles dans le noir complet."
    steel_incandescent_sword: "Forgée à une chaleur telle que le forgeron aurait égaré son propre nom quelque part dans la trempe. La lame se souvient parfaitement de la chaleur. Ce qu'il a perdu ce jour-là, la lame ne le lui a jamais rendu."
    steel_longsword: 'Du tendon de loup entoure une lame dacier sombre. Tranchante, sombre et profondement indifferente a vos sentiments.'
    steel_recurve: "Cordee de tendon de loup alpha qui se tend, tres legerement, chaque fois qu'on ment sur sa force de tir."
    steel_treads: 'Forgees durant une eclipse par un chevalier exigeant un silence total, presque atteint.'
    steel_warhelm: "Si sombre qu'elle absorbe les compliments avec la lumiere. La visiere ne s'ouvre que de l'interieur, la blague de quelqu'un."
    stitched_trousers: "Double couture pour la durabilite. Le tailleur etait si fier qu'il l'a signe a l'interieur. A l'encre visible. Mal."
    stoneheart: "Froide au toucher à toute heure, en toute saison, quoi qu'il arrive à la personne qui la porte."
    stormfeather: 'Une plume qui crépite quand on la secoue. Les mages de tempête les tissent dans les baguettes. Les postiers refusent de les livrer.'
    stormfeather_daggers: "Des plumes de faucon-tempête repliées dans l'acier, si longtemps que le métal en a fini par oublier avoir été autre chose. Chaque frappe arrive avec le grondement d'un tonnerre venu d'une tempête qui a poursuivi sa route depuis longtemps sans elle."
    stormfeather_longbow: "Chaque fleche crepite avant le tir. Chaque archer jure que c'etait voulu."
    stormfeather_loop: "Tressee de plumes qui ne cessent jamais de crepiter. Une poignee de main s'accompagne ici d'une petite decharge penaude."
    stormhowl_bow: 'Chaque fleche hurle vers sa cible. Les voisins se sont plaints.'
    stormtide_coif: "N'arrive pas à choisir entre mages de l'eau et chevaliers de la terre. Sert les deux, à contrecœur."
    stormwalker_boots: "Traversent n'importe quelle tempete sans broncher. Les bottes, pas le porteur, qui se plaint sans arret."
    stormweave_leggings: "Devenues grises à l'usure, non à la teinture. La couleur d'origine s'est perdue depuis longtemps."
    stumpwork: "Conçue pour les arbres qui n'ont survécu qu'à moitié à la plaie. Finir le travail s'est révélé une tâche stable et fiable."
    suize_flour: "Cristalline et si accrocheuse de lumiere que les boulangers jurent qu'elle rend le pain plus cher au gout."
    summit_alloy: "L'alliage le plus résistant que la forge du sommet puisse tenir avant que le creuset lui-même ne lâche. Les forgerons connaissent la température exacte et ne la notent jamais."
    summit_cuirass_of_sealed_wound: 'Ajustée sur la couture que les Prêtres-Sutures ont eu le plus de mal à refermer, de sorte que le porteur trimballe la réparation avec lui. Elle tient mieux sur un torse que sur la Cicatrice.'
    summit_draught: "Brassée contre le vertige qui prend les grimpeurs près du sommet, là où l'air se raréfie et l'esprit se met à négocier avec le vide. À boire avant le début des pourparlers."
    summit_extract: "Tiré de mousse du sommet sous pression, assez concentré pour qu'une seule goutte fasse le travail d'une fiole entière et coûte à peu près autant à remplacer."
    summit_girdle_of_summit_vigil: "Serré pour tenir une sentinelle debout durant une faction que nul n'était censé survivre debout. Il a tenu les trois derniers ; il n'en fait pas tout un plat."
    summit_greaves: "Renforcées au tibia pour le dernier tronçon de l'ascension, là où la montagne cesse d'offrir des prises et se met à les reprendre."
    summit_helm_of_summit_vigil: "Remis à qui écope de la plus longue faction au sommet, au motif qu'un heaume plus lourd empêche la tête de dodeliner. C'est vrai. Surtout en faisant mal."
    summit_ore: "De l'adamant extrait tout au sommet, là où le minerai est au plus près de ce dont la montagne est faite en dessous. Lourd d'une manière qui semble intentionnelle."
    summit_sabatons_genesis: "Plaqués par-dessus des semelles que les forgerons jurent avoir été les toutes premières taillées. Vrai ou non, elles marchent comme n'ayant plus rien à prouver."
    summit_sabatons_scar: "Ferrés pour tenir sur la pierre-cicatrice, qui bouge sous le pied avec la patience d'une chose qui attend que vous lui accordiez votre confiance."
    sundered_casque: 'Une fissure barre le front. Le forgeron appelle ça un « canal de décharge ». Le forgeron ment.'
    sundered_charm: "La moitié d'un médaillon d'unité des Soldats Brisés, frappé par paires jamais censées se séparer. L'autre moitié traîne quelque part, sans doute encore occupée à compléter la paire."
    sundered_chausses_of_screaming_rift: "La posture agenouillée d'un dernier ordre, verrouillée dans les articulations du Soldat Brisé par ce qui acheva l'œuvre de la faille. Se relever exige, chaque fois, une décision neuve."
    sundered_cordial: "Pas un remède. Une pause. Profite de la pause pour reconsidérer ce qui t'a mené ici."
    sundered_cordial_of_long_collapse: "Distribué aux Soldats Brisés qui figurent, techniquement, toujours au rôle. Répare ce qu'il peut et reste honnête sur le reste."
    sundered_elixir_of_screaming_rift: "La dernière chose qu'une unité de Soldats Brisés brasse avant de cesser d'être une unité. Bruyant en descendant. Silencieux ensuite."
    sundered_sash: "L'unique pièce d'équipement des Soldats Brisés à ne s'être jamais désunie, si complètement que le reste de l'histoire l'ait fait. Elle tient. C'est tout."
    sundered_stompers_of_long_collapse: "Chaque pas retombe comme le verdict qu'une cour martiale de Soldat Brisé n'a jamais eu l'occasion de rendre. Lent, réfléchi, et absolument définitif, la gravité le permettant."
    sundered_stompers_of_screaming_rift: "La faille en dessous répond à chaque pas du Soldat Brisé, ce qui ruine l'intérêt des leçons de discrétion. Les entrées surprises sont, structurellement, exclues."
    sundered_vambraces_of_long_collapse: "Sanglés pour un appel resté pour toujours inachevé. Les bras se souviennent de se tenir prêts bien après que l'esprit préférerait ne plus. L'endurance sans fin reste, techniquement, de l'endurance."
    sundered_vambraces_of_screaming_rift: "Rembourrés épais au niveau des « oreilles » du bras, ce qui n'a aucun sens anatomique tant qu'on ignore à qui appartenait ce bras. Bloque le son presque aussi bien que les lames."
    sunglass_shard: "Taille dans un verre fusionne par deux soleils qui ne se sont jamais accordes sur rien d'autre."
    sunken_mere_key: 'Extraite de sous la glace où dort le Dragon des Frimas, assez froide pour engourdir une main nue en quelques secondes. La récupérer fut plus facile que prévu, ce qui ne rassure personne.'
    sunscale_chopper: 'Une lame aux ecailles qui ont bu assez de soleil pour briller une generation entiere.'
    sunscale_cuirass: "Une cuirasse d'écailles luisantes qui protège de l'acier et des sorts, en supposant qu'on ne finisse pas rôti à l'intérieur."
    sunwarmed_ring: "Garde encore la chaleur d'un lezard qui, tout respect gardé, ne s'en sert plus."
    sunwarmed_scale: "Large ecaille d'un lezard cendre-peau, encore chaude longtemps apres que le lezard a quitte la conversation."
    surimi: "Ce vestige sacré du Surimi pulse d'une puissance ancienne, sa surface polie par les caresses de pèlerins disparus. Étrange que la sainteté rappelle tant la chair de poisson transformée."
    suture_belt: "Serrée à la façon dont les Prêtres-Sutures serrent une plaie pour l'empêcher de s'élargir. Fonctionne aussi bien sur une taille que sur la Cicatrice, peu ou prou."
    suture_loop: "Recourbé en boucle fermée à la manière dont les Prêtres-Sutures ferment tout, sur la théorie que la Cicatrice ne peut défaire ce que l'on n'a jamais laissé ouvert."
    swamp_conduit: "Canalise l'eau des marais en quelque chose de vaguement magique. L'odeur est entièrement banale."
    swamp_scale: "Vert foncé et perpétuellement gluant. Le crocodile en a fait pousser une de rechange. Les tanneurs l'acceptent avec une réticence visible."
    swamp_trident: 'Trois pointes de metal corrode parfaites pour embrocher ce qui sort du bourbier.'
    swampfire_grips: "Plusieurs des pires decisions de l'histoire sont directement tachees dans le cuir."
    talokan_aero_tail: "Emeraude et venimeuse. La couleur fait le travail de l'etiquette d'avertissement gratuitement."
    talokan_pearl: "Une perle des profondeurs portée comme monnaie par les talokan. Brille faiblement en bleu sous l'eau. Les marchands terrestres l'acceptent à contrecœur."
    talokan_sting_daggers: 'Bords de corail et croutes de sel. Elles sentent la maree basse et le regret.'
    talokan_tail_nakwa: "Tous les tanneurs en veulent une. Moins de doigts reviennent par tentative que vous ne l'esperiez."
    talokan_tide_ring: 'Fait de sel marin compressé et de perle talokan. Se dissout si vous nagez avec. Ne nagez pas avec.'
    talokan_trident: 'La pointe de corail se regenere entre les combats. La nature encourage vos mauvaises habitudes.'
    tanjirize_flour: "Farine épicée transformant tout en quelque chose d'agressivement aromatique."
    tanjirize_rod: "Le bâton de marche d'un pèlerin qui s'est trop approché de la Plaie et en est revenu changé. Il marche toujours très bien. Il fait aussi d'autres choses, désormais."
    tanned_girdle: "Raide et inconfortable comme un premier rendez-vous. S'assouplit avec l'usage. La ceinture pas le rendez-vous."
    tectonic_severance: "La legende dit que le forgeron qui l'a fabriquee a fendu une montagne au premier essai. La montagne a porte plainte."
    temperedglass: 'Des plaques de verre de chœur qui survivent à tous les fours. Les gâteaux attachent quand même, c est la loi.'
    tempering_flux: 'Flux alchimique qui abaisse le point de fusion des metaux rares. Les forgerons ne peuvent litteralement pas forger sans.'
    tempest_requiem: "Chaque flèche transporte le petit orage qu'un Prophète des Cendres avait vu venir trois strophes avant l'impact. La portée en plus n'est pas de la force : c'est savoir où le vent se tiendra."
    tempest_whisper_bow: "Un arc corde de filament d'eclat celeste. Les fleches volent si vite qu'elles arrivent avant le son."
    terminal_casque_genesis: "Porté par les Auditeurs des Profondeurs pendant qu'ils débattent des plus vieux registres. Bien rembourré, car les débats s'éternisent et virent parfois aux coups."
    terminal_casque_scar: "Le dernier heaume que l'armurerie du mur ait jamais forgé, car passé cette altitude, aucune taille au-dessus n'existe, ni de porteur suivant censé en avoir besoin."
    terminal_chausses_of_origin_line: "Taillées pour la jambe qui compte atteindre la limite et s'y arrêter, ce que le plaquage impose en rendant la course franchement pénible."
    terminal_cordial_of_final_scar: "Gardé à l'infirmerie du mur pour les cas au-delà de tout soin, puis reconnu d'une efficacité gênante sur ceux qui ne l'étaient pas. Sa réputation s'est ajustée en conséquence."
    the_tenderizer: 'Vendu aux derniers bouchers de la Cicatrice comme ustensile de cuisine. Détourné de son usage presque aussitôt. Le fabricant a cessé tout commentaire.'
    thick_ursine_hide: "Une peau, une armure complete, un ours qui depose une plainte dans l'au-dela."
    thickskull: "Le compliment était littéral. Il a sauvé plus de vies que l'enchantement cousu dans la doublure."
    thorium_warhammer: 'Cloute de crocs de rex et renforce daileron de requin. Substitue la finesse par la force brute. Les resultats parlent deux-memes. Fort.'
    thorium_warplate: "Fournie d'office à quiconque tient encore une colonne unie. Rare, aujourd'hui."
    threefold: "Frappée une fois par le forgeron, repliée deux fois de plus par une chose qui n'est pas un forgeron. Personne n'a demandé laquelle."
    throatlatch: "Fermé par son premier porteur et jamais rouvert depuis. Le fermoir fonctionne toujours — nul ne l'a vérifié."
    throneless_cleaver_of_rotting_halo: "Le savoir-faire est solide ; la prémisse l'est moins, un compromis trouvé une fois que tout le monde a renoncé à discuter."
    throneless_draught_of_gilded_ruin: 'Le goût rappelle une décision prise trop vite, et le brasseur refuse toujours de choisir un camp.'
    throneless_extract: "Personne ne peut dire avec certitude d'où cela vient, alors les deux entrées restent au dossier, sans réconciliation."
    throneless_gauntlets_of_gilded_ruin: "Il a été forgé pendant une dispute que personne n'a gagnée, et la seconde version n'a jamais vu le jour."
    throneless_lattice: 'Il a été consigné comme preuve dans un débat jamais achevé, et le rapport a quand même été déposé, réserves incluses.'
    throneless_pendant_crown: "Le porteur insiste qu'il fonctionne ; les preuves restent incertaines, aucun remboursement, aucune autre question acceptée."
    throneless_pendant_godbone: "Personne n'a confirmé qu'il fait ce que l'étiquette prétend, un fait que l'artisan considère comme un atout."
    throneless_sabatons_of_gilded_ruin_crown: 'Il fonctionne, mais seulement si on ne demande pas pourquoi, une distinction sans grande différence.'
    throneless_sabatons_of_gilded_ruin_godbone: "Son histoire change selon qui la raconte, et les documents officiels n'en disent rien."
    throneless_sabatons_of_rotting_halo: "Il a été conçu pour prouver un argument tombé dans l'oubli général, une note de bas de page que l'artisan n'a jamais écrite."
    tide_shard: "Un fragment cristallisé d'océan vivant qui goutte sans arrêt. Sent le sel et les affaires inachevées."
    tide_throne_key: "Coulée dans un corail qui ne durcit qu'en dessous de la ligne de marée. Le Régent Noyé y tient toujours sa cour, et l'attend toujours en retour."
    tidebinder_cord: "Noué avec la précision d'un marin et une pointe d'incompétence magique."
    tidebound_band_of_brackish_deep: "Se ternit et s'éclaircit selon un cycle sans rapport avec l'usure, au point que le porteur cesse d'y voir le moindre lien avec les eaux montantes que le Weald refuse d'admettre."
    tidebound_breastplate_of_brackish_deep: 'Forgé dans une eau trop salée à boire et trop douce pour rien conserver, compromis que le plastron porte comme une odeur ténue et permanente.'
    tidebound_core: "Un noyau qui s'alourdit et s'allège selon un cycle lent qu'aucun artisan n'a su rattacher à rien de précis, encore moins d'un flux que le Weald nie posséder."
    tidebound_grips_of_silt_throne_matron: 'Récupérées de la cour noyée et jamais dessalées, elles laissent une pâle empreinte blanche sur tout ce que sa peau frôle longtemps.'
    tidebound_grips_of_silt_throne_mire: "Gantelets récupérés de la cour noyée, encore recourbés dans la prise d'un objet que la vase a depuis longtemps emporté."
    tidebound_treads_of_brackish_deep: "Le tannage à l'eau salée les a laissées à jamais humides et à jamais silencieuses, échange équitable là où le bruit attire des crocs."
    tidebound_treads_of_silt_throne: 'Chaussures de cour faites pour rester parfaitement immobile lors des cérémonies, désormais parfaites pour rester parfaitement immobile pendant que quelque chose de grand passe.'
    tidebound_visor_of_brackish_deep: "Croûté de sel d'avoir servi là où monte la marée, que le Weald jure ne pas avoir et que la corrosion du ventail jure du contraire."
    tidebound_visor_of_silt_throne: "Récupéré dans la salle engorgée de vase que les guides du Weald appellent encore salle du trône, par habitude plus que par preuve qu'un trône y fut jamais."
    tidecaller_mail: 'Résonne comme une bouée dans la tempête. Vos alliés savent toujours où vous êtes. Les ennemis aussi.'
    tideflame_treads: "Des bottes qui brûlent avec une flamme bleue à chaque contact avec l'eau. L'effet est spectaculaire lors des traversées de rivières et désastreux lors des nuits de pluie dans les villes. Les pompiers des zones portuaires ont fait une pétition officielle contre leur distribution."
    tidesurge_leggings: "Chatoient comme l'océan au crépuscule. Sentent comme l'océan à marée basse."
    tidewalker_soles: "Marchez sur l'eau. Pas littéralement. Mais assez pour agacer les physiciens."
    timberfall: 'Homologuée pour abattre les arbres pétrifiés que la plaie a laissés debout. Se montre tout aussi efficace sur ce qui fut jadis une personne.'
    timberwolf_legguards: "Des jambières doublées de fourrure de loup qui gardent vos jambes au chaud en hiver et en surchauffe le reste du temps. Le motif de la fourrure bouge à la lumière du feu, donnant l'impression que quelque chose vit encore là-dedans et attend son heure."
    tin_cap: 'Un petit dôme qui échange les neurones contre du rebond. Vous survivrez à vos propres bonnes idées.'
    titan_bear_moss: "De la mousse qui poussait dans la fourrure vivante d'un ours titan. Imprégnée de siècles d'énergie de prédateur suprême. Les druides deviennent sauvages."
    titan_koa_greaves: "Le cuir coriace d'un koa titan, façonné en jambières. Elles coassent quand vous pliez les genoux."
    titan_koa_lance: 'Plantée à la ligne des tombes trois hivers durant. Elle pointe toujours la même direction.'
    titan_koa_stompers: "Conçus pour la boue, pas pour le silence. Personne n'a jamais exigé la discrétion d'une colonne."
    titan_koa_warspear: ''
    titan_shell_hauberk: 'Bouillie puis aplatie au marteau. Ce qui la portait avant laisse encore une odeur.'
    title_veteran: "Press this searing brand against your flesh to prove you're a veteran and it'll be granted to you for life — because nothing says 'battle-hardened warrior' like voluntary third-degree burns."
    tokek_paw: "Une patte sectionnée d'un gecko tokek, encore faiblement tiède et agrippant le vide."
    tome_of_elemental_spite: ''
    tome_of_oblivion: "Le dernier chapitre s'écrit pendant la lecture, dans la poussière que laisse une Néantphalène qui cesse d'exister au milieu d'une phrase. La critique s'accorde : la fin, au moins, est honnête."
    tool_herbalist: "Le summum du chic agricole, à condition que le style recherché soit 'désespoir maculé de boue'."
    totem_club: "Grave de symboles qu'aucun vivant ne sait lire. Frappez assez fort et ils semblent se traduire seuls."
    training_battleaxe: "Lestee de plomb au lieu d'etre affutee. Excellent pour la masse musculaire. Terrible pour tout le reste."
    training_helmet: 'Protege contre les brises legeres et les insultes bien formulees. Protection au combat: theorique.'
    tremor_brew_of_nine_faults: 'Rend de la vie et installe un léger tremblement permanent dans les deux mains. Bilan positif, paraît-il.'
    tremor_crest_of_fifth_breach: "Vibre faiblement en permanence. Au bout d'une semaine, tu ne le remarques plus. C'est là le problème."
    tremor_fists_of_nine_faults: "Portent le coup, puis un petit bourdonnement en rab. Ce rab n'est pas une option désactivable."
    tribal_cudgel: "Enveloppé de charmes totémiques canalisant des esprits qui, dit-on, jugent chaque coup autant sur la forme que sur la force. De l'avis général, ils restent indifférents. Le gourdin frappe tout aussi fort, quelle que soit leur opinion."
    tribal_summoner_totem: 'Un totem sculpte par des chamans sauvages. Les gravures representent des animaux. Les animaux representes ont depose plainte.'
    tribal_totem: "Un fétiche en os sculpté crépitant d'énergie résiduelle. Le chef l'a porté au combat. Ça ne l'a pas aidé."
    truelength: "Mesurée sur l'avant-bras même du forgeron, une unité de mesure morte avec lui. L'épée en reste l'unique exemplaire."
    truestrike: "Visée par des pèlerins à qui l'on a enseigné que la Cicatrice récompense la conviction plus que la précision. La lame n'est pas d'accord, en silence, à chaque fois."
    truffle_essence_compound: ''
    tusk_bludgeon: 'Un gourdin en ivoire de sanglier. Le sanglier est mort de causes naturelles. Naturellement vous les avez causees.'
    tusk_buckle_belt: "La boucle est un véritable croc de broustailleur. Le cuir sent la bête qui vous a chargé et a perdu. L'attacher exige une brève lutte que la ceinture remporte une fois sur deux."
    tusk_ivory: "Ivoire dense d'une défense de phacochère. Les sculpteurs en font des pièces d'échecs, parce qu'apparemment c'est un marché."
    tusker_musk_gland: 'Produit une odeur capable de vider une pièce, un bâtiment, ou un petit quartier. Les alchimistes en extraient des phéromones.'
    twine_belt: "Tressé à partir de tout ce qui poussait au bord du chemin. Tient par la grâce d'un nœud que même un marin refuserait de revendiquer. Le porteur précédent a opté pour la gravité."
    tyrants_gavel: 'Servait à prononcer la sentence des déserteurs. Les marches en comptaient beaucoup.'
    ukranize_flour: "Moulue d'un grain qui a traversé cent mauvaises récoltes pour arriver jusqu'ici, cette farine donne des pains si résistants qu'un village aurait, dit-on, utilisé les restes comme cale-porte pendant une génération entière."
    uncertain_bow_range: 'Un arc qui tire à distance, mais argumente sur le fait que la distance est réelle. Ses flèches atteignent les cibles seulement par nécessité théorique.'
    underweald_casque: "Prévu pour les paliers sous les racines, où l'obscurité est totale et où l'unique vrai rôle d'un heaume est de vous empêcher de vous fendre le crâne au plafond."
    underweald_charm: "Un nœud de racine et d'os dont les guides jurent qu'il repousse les choses d'en bas. Personne qui l'ait éprouvé n'est jamais revenu le confirmer."
    underweald_elixir_of_fen_below: "Brassé de ce qui pousse tout au fond du Fen inférieur, qui guérit bien et a le goût précis de son lieu d'origine."
    underweald_hauberk_matron: "Chevauché d'écailles que la Matrone mue par centaines, ce qui semble abondant avant qu'on n'apprenne ce qu'elle réserve à qui les ramasse."
    underweald_hauberk_mire: "Maillé de fer-des-tourbières qui ne rouille jamais faute d'avoir jamais séché assez pour commencer, propriété que les forgerons vendent comme un atout."
    underweald_loop: 'Un simple anneau de racine des paliers inférieurs, porté par les guides comme un insigne signifiant, en gros, y est descendu et en est revenu.'
    underweald_stompers_of_rising_tide: "Lestées pour tenir pied dans le courant, car ici-bas le sol tient de la suggestion, que l'eau est libre de rejeter."
    ursine_heart: 'Pèse huit kilos et irradie encore de la chaleur. Les enchanteurs les lient en amulettes de protection. Les ours le faisaient gratuitement.'
    ursine_signet: 'Pressé dans la cire des formulaires de réquisition. La cire ne durcit jamais bien.'
    ursine_totem_club: ''
    velkarion_breath_weapon: 'Un fer de cheminée qui a remué le grand bûcher en personne. Il a des opinions sur votre façon d empiler le petit bois.'
    velkarion_ember: 'Un éclat de la flamme du dragon, conservé dans un pot à confiture. Si elle s éteint, toute la cathédrale est à rallumer.'
    velkarion_key: 'La grande porte du bûcher a neuf serrures, six sceaux et une seule clé, et le bedeau la range très exactement là où vous pensez.'
    venom_band: "L'alchimiste qui a stabilise ce revetement y a perdu deux doigts pour le prouver. Ca marche."
    venom_battleaxe: "Le venin d'araignée sur cette lame n'ajoute presque rien aux dégâts. L'expression sur le visage de l'adversaire quand il remarque la couleur du tranchant fait bien plus le vrai travail."
    venom_belt: 'Trois antidotes rates et un pretre tres patient furent necessaires pour stabiliser cette doublure.'
    venom_concentrate: 'Toxine purifiee utilisee dans les armes empoisonnees et plusieurs paris de taverne regrettables.'
    venom_gland: "Gonfle de toxine. Une seule piqure transforme votre soiree d'aventure en negociation avec un soigneur."
    venom_legguards: 'Saturees de toxines qui sont, techniquement, sans doute inoffensives pour vous en particulier.'
    verdant_aloe: ''
    verger_teaspoon: 'La petite cuillère porte-bonheur du bedeau, sur une boucle de ficelle. Remuez votre thé avec, et la minute attend poliment que vous finissiez.'
    vitrified_casque_of_rising_hymn: 'Tricoté pour une théière qui a explosé quand même. Maintient une tête à température de service.'
    vitrified_chausses: 'Taillé si étroit qu il a fallu raisonner le tailleur deux fois. S agenouiller est un souvenir.'
    vitrified_cord: 'Noués en double comme maman l exigeait. Les dénouer, c est ainsi que commencent les accidents.'
    vitrified_crown: 'Fondu en un seul éclair. En la portant, tu te sens brièvement élu. Ce sentiment est un mensonge.'
    vitrified_edge: 'Refroidie lentement pour que le verre ne se brise pas. Elle a gardé la patience et perdu la clémence.'
    vitrified_elixir: 'De l eau salée et de l entêtement. Le chœur ne jure que par ça, une octave plus haut qu avant.'
    vitrified_glaive: 'Assez longue pour dorer le pain au-dessus du grand bûcher sans perdre entièrement vos sourcils. Entièrement.'
    vitrified_lattice: 'Une toile figée de filaments fondus. Prends-le par les parties épaisses ; les fines te prennent.'
    vitrified_stompers: "Chaque pas tinte comme un verre qu'on frappe. Tu t'annonces, en permanence."
    vitrified_tear: 'Verre plat refroidi au rythme du volcan. Les bulles, on appelle ça du caractère.'
    vitrified_vambraces: 'Pas une armure. Une déclaration. Quelqu un dans cette cathédrale va se faire récurer.'
    void_anchor_belt: "Lestée pour garder l'équilibre sur un sol qui se dérobe. Le marais se dérobe toujours."
    void_distillate: "Neant liquide extrait des restes de la famille du Vide. Le fixer trop longtemps cause de l'angoisse existentielle et une legere nausee."
    void_eye_lens: "Une lentille cristallisée d'un Oeil du Vide. Voit dans les dimensions parallèles. La plupart sont pires que celle-ci, étrangement."
    void_eye_talisman: "Serti d'une lentille taillée pour surveiller la ligne des tombes une fois le soir venu."
    void_grips: 'Doigts tachés par une eau qui ne voit jamais le jour. La tache ne part pas au lavage.'
    void_oracle_staff: 'Voit tous les futurs possibles. La plupart te voient mourir. Elle te les montre quand même.'
    void_shard: 'Un fragment de néant sous forme physique. Le regarder trop longtemps cause des saignements de nez et des crises philosophiques.'
    void_shepherd_club: ''
    void_treads: "Chaque pas s'enfonce légèrement puis ressort net. Le marais n'a pas encore appris à les retenir."
    void_whisper_bow: "Tire des flèches qui n'existent pas avant leur arrivée. L'archerie quantique appelle une clause de non-responsabilité."
    voidbake_tablet: "Cuite dans les fosses à bûcher jusqu'à n'être plus rien d'autre. Les forgerons l'aplatissent avant qu'elle ne refroidisse."
    voidcleave: "Tranche l'armure, le moral et parfois les barrières dimensionnelles. À manier avec précaution existentielle."
    voidgazer_crown: 'Vise à travers des fentes usées à force de veiller. Le marais observe en retour.'
    voidpierce_stilettos: "Aiguisées jusqu'à un fil assez fin pour se glisser entre les plaques de carapace d'une Mite du Vide sans qu'elle s'en aperçoive avant longtemps. Fonctionne sur la plupart des choses avec le même mépris de l'avertissement."
    voidpiercer_bow: "Les flèches tirées par cet arc arrivent avant que la corde ne soit complètement relâchée. La causalité n'est qu'une suggestion ici."
    voidpiercer_spear: 'Perce le vide entre les dimensions. Utile pour les brochettes interdimensionnelles.'
    voidreaver_greatsword: ''
    voidreaver_longsword: ''
    voidstaff_nihil: "Sculpté dans le silence cristallisé d'une Mite du Vide, ce calme précis entre deux battements d'aile. Lance des sorts qui, techniquement, n'ont jamais eu lieu — le fisc a de forts sentiments à ce sujet."
    voidwalker_boots: "Poussées, non cousues, sur les pattes d'une Néantphalène rompue à enjamber le néant pièce par pièce. Effets secondaires : bourdonnement discret, et la certitude tenace d'avoir oublié quelque chose."
    volatile_extract: 'Un reactif instable qui vibre de maniere audible. A manipuler avec soin ou pas du tout.'
    walker_belt: 'Assez élégant, à condition que votre icône de mode soit un cadavre errant.'
    walker_hat: "La tête du précédent porteur est toujours à l'intérieur, bien que dans un bien plus piteux état que le heaume lui-même."
    wallbreaker: "Homologuée pour la maçonnerie dont le mur lui-même est fait. L'homologation n'était pas théorique. Il existe un trou pour le prouver."
    war_barrow_key: "Taillée pour une serrure qui ne devait jamais s'ouvrir deux fois."
    warden_spear: "Lance ceremonielle d'un gardien-jeune-pousse, detournee vers une violence que les kweebec n'ont jamais tout a fait pardonnee."
    warlord_plate: "Découpée d'une armure trop ancienne pour être datée. Le motif d'écailles ne correspond à rien de répertorié."
    warped_staff: 'Seche incorrectement causant une torsion permanente. Canalise la magie en spirales imprevisibles. Viser est un concept.'
    water: "De l'eau pure et rafraîchissante qui étanche la soif et purifie le corps des impuretés. Une substance rare dans un monde où la plupart des liquides veulent votre mort."
    waxseal_wafer: "Fine, cristalline, et hermetique des qu'elle durcit. Les bricoleurs en amassent et n'admettent rien."
    weald_heartplate: "Poussé en écorce autour d'un cœur de mousse tassée, encore tiède comme le bois vivant sait le rester. À l'Ours Titan manque un morceau de cuir de forme très semblable."
    weald_knot_belt: 'Nouée des mêmes nœuds-de-racine dont les guides du Weald marquent une piste sûre. Que ces nœuds signifient encore quelque chose aussi profond est une autre question.'
    wealdwarden_halberd: "Portée par celui que les meutes du Weald respectent assez pour ne pas l'affronter seules. L'usage en solitaire est techniquement possible. Le Weald ne le recommande pas."
    weaver_daggers: "Pointe d'une glande a soie d'araignee. Le poison est lent. Le regret, lui, arrive tot."
    weaver_silk_vest: "Filée à partir de soie de tisseuse si fine qu'elle en est presque invisible. Le tailleur a facturé le double parce que, je cite, « vous ne pouvez pas prouver qu'elle n'est pas là »."
    weaving_solution: 'Renforce les fibres textiles pour résister à un usage de combat. Les tailleurs y trempent chaque fil avant la moindre couture sérieuse.'
    weighted_club: "Quelqu'un a fourré des rochers dans une bûche creuse et a appelé ça de l'ingénierie. Ça marche. Les philosophes débattent si l'intention suffit à définir un outil. Les crânes brisés, non."
    welcome_doormat: 'Des paillassons à poils lacés aux chevilles. Vous absorberez tout ce que le monde essuie sur vous, et vous direz bienvenue.'
    wheat: "Des fermiers pacifiques passent d'innombrables heures à récolter ce grain, pour que des soldats le brûlent comme bois de siège une semaine plus tard."
    wheat_barley: "Une modeste gerbe d'orge vert pâle, aux grains rebondis gorgés de la promesse du pain ou de la bière."
    wheat_burnt: 'Une poignée de grain noirci par les flammes, sa promesse dorée réduite à du charbon et un amer souvenir.'
    wheat_draconize: "Blé cultivé en sol volcanique imprégné de sang draconique, aux grains assez brûlants pour faire bouillir l'eau au contact. Un seul pain nourrit une famille pendant une semaine, en supposant que la famille apprécie la combustion interne."
    wheat_flour: "Certains aventuriers rêvent d'épées légendaires, d'autres de baguettes croustillantes sortant du four. Ces derniers vivent généralement plus longtemps, sinon beaucoup moins glorieusement."
    wheat_malt: "Certains guerriers préfèrent leur courage fermenté, d'autres distillé — ce grain satisfait les deux philosophies."
    wheat_purple: 'Les paysans ont appris à leurs dépens que la récolte de cultures luminescentes est la première cause de sorcellerie spontanée dans les communautés agricoles.'
    wheat_suize: "La récolte était traditionnelle ; l'authentification tout sauf, immortalisée à jamais dans l'étreinte glaciale de la blockchain."
    wheat_tanjirize: "Chaumes dorés récoltés dans les champs ancestraux du tueur de démons, vibrant encore de la chaleur d'un soleil qui ne se couche jamais vraiment."
    wheat_ukraine: "Ce blé robuste tend vers des horizons lointains, ses fibres teintées du bleu des ciels sans nuages et de l'or des steppes infinies."
    wheat_white: "Récolte de haute altitude bénie d'inscriptions anciennes pour survivre au long hiver."
    whisker_bundle: 'Six moustaches de feran, chacune un instrument de precision que le feran aimerait vivement recuperer.'
    whisker_weave_belt: "Six ferans ont contribue, bien malgre eux, a une ceinture qu'aucun ne portera jamais publiquement."
    whittled_shortbow: 'Sculpte pendant un tour de garde ennuyeux. La corde est en herbe tressee. Portee effective: votre imagination.'
    widow_club: "Enveloppee de soie de veuve qui durcit a l'impact. Les araignees n'ont pas donne leur soie volontairement."
    widow_fang_daggers: "Deux crocs de deux veuves differentes. Elles ne s'entendent toujours pas."
    widow_thread: 'Fin comme de la gaze, absurdement solide. Tisse par quelque chose qui mange des proies quatre tailles trop grandes.'
    widows_kiss_daggers: ''
    wildling_bow: ''
    wildling_shortbow: "Vole dans un camp sauvage. Les proprietaires n'ont pas ete consultes."
    wildling_spear: ''
    wildlord_club: ''
    wildlord_war_girdle: 'Bouclée avant chaque appel. Jamais bouclée pour une bonne raison.'
    windfire_cuirass: "N'arrive pas à choisir entre affinité feu et air. Vous brûle le dos, vous glace le torse."
    windshear_loop: "Tourne librement à votre doigt comme s'il essayait de s'échapper. L'enchantement fonctionne comme prévu."
    windslicer_gloves: 'Fines comme une promesse, rapides comme une excuse. Parfaites pour les doigts agiles.'
    windstrider_sandals: "Assez ouvertes pour s'égoutter vite. Les pieds mouillés sèchent plus tôt qu'avec de lourdes bottes."
    windwalker_vest: 'Assez léger pour suivre le rythme de la colonne. Les tambours de marche ne portaient rien de plus lourd.'
    wisdoms_embrace_gauntlets: "Comptait chaque réquisition deux fois avant de signer. Ce genre d'habitude a la vie dure."
    wither_concentrate: "Mis en flacon depuis la pourriture accumulée au cœur du bourbier. Le bouchon tient rarement jusqu'au quartier-maître."
    wither_pastry: "Une patisserie qui decompose tout sauf elle-meme. Les alchimistes l'utilisent comme reactif necrotique."
    wither_petal: ''
    witherbloom: "Une fleur qui n'atteint la pleine splendeur de sa floraison que dans les derniers instants de sa décomposition, ses pétales se déployant avec un sens du timing théâtral qui suggère un goût prononcé pour le dramatique. Les poètes lui composent des élégies entières, tandis que les alchimistes se contentent de noter sa vitesse de décomposition avec un détachement clinique."
    wizard_staff: 'Deguise en canne de marche. Le feu au bout est moins convaincant.'
    wolf_fang_blade: "Une lame avec des crocs de loup incrustes dans le tranchant. Le loup ne s'est pas porte volontaire."
    wolf_pelt: "Cuir épais de loup de forêt. Chaud, durable, et porte un musc léger qui rend les chevaux profondément mal à l'aise."
    wolf_sinew: "Élastique et résistant. Les fabricants d'arcs paient le prix fort. L'opinion du loup sur la question n'est plus pertinente."
    wolf_sinew_band: "Tresse d'un tendon de loup alpha. Il se resserre, presque imperceptiblement, quand vous allez commettre une erreur."
    wolf_sinew_belt: "L'alpha n'a pas cédé ses tendons de bon cœur. Remarquez, les alphas ne se portent jamais volontaires, sauf pour la violence. Au moins, celui-ci sert désormais à retenir un pantalon."
    wolf_trek_boots: 'Appartint jadis a un loup qui a distance a la marche chaque chasseur envoye contre lui.'
    wolfbone_blade: "Le manche est taillé dans un fémur de loup. Il hurle par grand vent, ou peut-être que c'est juste le vent."
    wolfcrest_helm: "Couronné d'une tête de loup empaillée dont l'expression oscille entre menaçant et légèrement contrarié. Le taxidermiste était apparemment ivre, ce qui explique les yeux légèrement croisés et la langue qui dépasse du côté gauche."
    wooden_greataxe: "Plus un piquet de cloture qu'une arme. Les echardes font la moitie des degats."
    wool_fists: "Rien ne crie 'bagarreur désespéré' comme frapper des ennemis avec des sous-produits d'animaux arnachés en armes."
    woolame_old: "Récupérée des profondeurs luisantes du tractus digestif d'un wooligan, cette lame porte l'éclat incontestable d'une survie gastrique."
    woolamu: "Cette touffe de laine filée réchauffe le torse, mais n'apporte strictement rien au combat. Au moins, son porteur mourra au chaud."
    woolano: "L'accessoire parfait pour les héros qui préfèrent des bijoux lavables en machine."
    wooliboots: "Parfaites quand le froid s'infiltre par les planchers et que la dignité a déjà fui par la porte."
    wooligan_hammer: "Le wooligan s'en servait pour aplatir l'herbe. Vous avez trouve un usage plus creatif."
    wooligan_hat: "Garantie de garder la tête au chaud, mais malheureusement pas le cerveau qu'elle contient."
    wooling_fleece: "Une touffe de laine grasse arrachée à un agneau qui n'a absolument pas consenti. Sent le regret et le sol de grange."
    wooling_practice_bow: 'Corde en boyau de wooling. Le sacrifice du wooling etait involontaire mais apprecie.'
    worldbreaker_battleaxe: ''
    worldheart_striders: "Semelés de quelque chose tiré du tréfonds de la fracture, palpitant encore faiblement sur un rythme que nul n'est parvenu à rapprocher d'un battement de cœur, sans que quiconque l'ait pour autant écarté."
    worldsplitter: "La légende dit que le premier coup d'essai a créé un canyon. La légende exagère, mais à peine."
    worldwound_brew_of_closing_age_genesis: "L'une des dernières recettes consignées avant que les alchimistes ne cessent de rien consigner du tout. Elle fonctionne ; la note en marge expliquant pourquoi ne nous est pas parvenue."
    worldwound_brew_of_closing_age_scar: "Réduite jusqu'à tenir contre le genre de blessure que distribue la Plaie, autrement dit celles dont nul n'espère réchapper. Certains y parviennent, désormais."
    worldwound_carapace_of_world_wound: "Poussée, non forgée, depuis une coquille que la Plaie elle-même a entamée sans jamais l'achever. Les trous sont précisément là où elle a perdu tout intérêt."
    worldwound_circle_of_closing_age: "Forgé dans les dernières années, quand les joailliers ont cessé de signer leur ouvrage. Nul n'était sûr qu'il resterait quelqu'un pour lire le nom."
    worldwound_circle_of_world_wound: "Un anneau ployé d'un unique filament de métal-plaie, refermé si parfaitement qu'on ne saurait dire où il commence. Le métal, lui, le sait. Il en garde rancune."
    worldwound_edge: "Tracée sur la ligne même où la réalité s'est déchirée quand la Cicatrice s'est ouverte. La plaie garde en mémoire la forme qu'a laissée la coupure ; la lame, elle, garde le souvenir de la plaie."
    worldwound_fists_of_closing_age: 'Forgés vers la fin de tout, quand les forgerons ont cessé de décorer pour ne faire que des choses qui tiendraient. Ceux-ci tiennent.'
    worldwound_fists_of_world_wound: "Poings plaqués de verre-plaie qui s'écaille un peu à chaque coup. Inquiétant pour l'ennemi ; jugé usure acceptable par tous les autres."
    worldwound_pendant: "Renferme un éclat de la Plaie elle-même, scellé comme l'Oracle de la Plaie scelle tout le reste — avec soin, et sans grande confiance que cela tienne."
    worldwound_warboots_of_closing_age: 'Semelées pour mordre le bord glissant de la Plaie, où un faux pas est aussi, commodément, le dernier dont vous aurez jamais à vous soucier.'
    wound_key: "Soudée close autour de ce que l'Oracle de la Plaie garde scellé au cœur de la Cicatrice. Elle ne tourne pas vraiment : on la persuade, et brièvement."
    wound_marked_composite: "Une matière stratifiée qui porte la marque de la Plaie de part en part, de sorte que la couper n'efface jamais la marque — elle en fait juste deux."
    wound_marked_elixir: "La version simple que les Prêtres-Sutures gardent pour eux, sans la mise en scène qu'ils réservent aux pèlerins. Il a plus mauvais goût et agit plus vite."
    wound_marked_elixir_of_origin_line: "Distillé par les Prêtres-Sutures à partir des résidus de leur propre ouvrage, qu'ils jurent sans danger et boivent eux-mêmes pour le prouver. Ils sont toujours là, jusqu'ici."
    wound_marked_greataxe_of_final_scar: "Porte une entaille que la Plaie y a mise avant même que le forgeron ne la touche. Le forgeron a composé avec l'entaille, sur la saine théorie qu'elle avait sa raison d'être."
    wound_marked_lattice_genesis: "Le même treillis formé à l'évent le plus ancien de la montagne plutôt qu'à la Cicatrice, où il ressort plus net et, jurent les artisans, vaguement suffisant à ce sujet."
    wound_marked_lattice_scar: "Une trame cassante formée sur la lèvre même de la Cicatrice, où le cristal épouse la forme de la fracture, que l'artisan le veuille ou non."
    wound_marked_loop: "Effleuré une fois par la Plaie et resté avec sa propre cicatrice, que l'anneau porte avec plus de grâce que n'y parviennent la plupart de ses porteurs."
    wound_marked_vambraces_of_origin_line: "Rayés de la même marque que la Plaie laisse sur ce qu'elle effleure. Les forgerons l'ont ajoutée exprès, ce que la Plaie a jugé superflu et un brin insultant."
    wound_pilgrim_boots: "Semelées pour la longue montée jusqu'à la Plaie et, plus rarement, pour la descente. La plupart des paires ne font jamais que l'aller."
    wound_salve: "Fourré dans les fissures que la Cicatrice elle-même refuse de refermer, prévu pour les blessures qu'elle a personnellement infligées. Efficace aussi sur les blessures moindres, ce qui est la seule clémence en jeu."
    wound_ward_bow: 'Encordé pour décocher des flèches le long des lignes de fracture de la Cicatrice sans les élargir davantage, une discipline que les Fragments du Mur imposent sans exception.'
    woundstitch_grips: "Cousues par les Prêtres-Sutures à partir de ce qui tient une couture à l'altitude du zénith : pas grand-chose, et pas longtemps."
    woundwall_pike: 'Plantée le long du dernier mur que les pèlerins ont le droit de franchir, davantage borne que lance, du moins tant que personne ne tente quand même de le franchir.'
    wraith_banner: ''
    wraith_boots: 'Chaque pas résonne à travers deux plans à la fois. Les voisins des deux ont déposé une plainte officielle pour tapage, et pour une fois, les deux plaintes concordent sur chaque détail.'
    wraith_crowned_helm: "La couronne fredonne encore les dernières pensées de son propriétaire, et la plupart, il s'avère, sont des regrets. Quelques-unes, étrangement précises, concernent une liste de courses qu'il n'a jamais fini de dresser."
    wraith_grimoire: 'Un compte courant des dettes des morts. Il se met a jour tout seul. Jamais en votre faveur.'
    wraith_lantern_shard: "Brisé de la lanterne qu'un spectre porte partout où il dérive. La flamme à l'intérieur ne fut jamais du feu — c'est de la mémoire, et la mémoire, s'avère-t-il, brûle bien plus lentement."
    wraith_lantern_staff: "Coiffé d'une lanterne que les Spectres de Pierre-Nef utilisent pour attirer les bateliers hors des chemins sûrs. Elle brûle toujours froid, et elle fonctionne toujours."
    wraith_scripture: "Il s'écrit tout seul quand personne ne regarde, d'une écriture qui change avec quiconque le lit. Les érudits qui l'ont étudié ne s'entendent pas pour dire si c'est fascinant ou profondément, personnellement alarmant. C'est généralement les deux."
    wraith_spellbook: "Ecrit par quelqu'un ayant des avis tres tranches sur le service client de l'au-dela."
    wraith_touch_gauntlets: "Tout ce qu'ils touchent devient légèrement, poliment mort. À peu près l'effet de votre vie sentimentale, ont fait remarquer plusieurs habitués de la taverne, sauf qu'au moins maintenant on peut le porter."
    wraith_whisper_amulet: "Un pendentif translucide qui murmure dans une langue que vous suivez presque. Son dernier propriétaire en a traduit exactement un mot avant de le revendre à la hâte : derrière. Personne depuis n'en a demandé un second."
    wraith_whisper_knives: "Trempées dans l'ectoplasme de spectre, elles tranchent net l'armure et, un peu moins net, le sommeil. Les blessures guérissent bien, rapportent les victimes. Les rêves, eux, ne guérissent jamais complètement."
    yajin_starter_dagger: "Les lames jumelles de Yajin ont connu des jours meilleurs, leur tranchant émoussé par d'innombrables tentatives de violence ratées."
    yeast: "Une souche virulente de champignon parasite qui s'enfonce dans la chair et refuse de lâcher prise."
    yeast_cake: "Un gateau de pate levee qui sent l'ambition et la mauvaise ventilation. Les bricoleurs l'utilisent comme mastic."
    yeti_frostbite_daggers: "Taillées dans les griffes d'un yéti en pleine tempête. Chaque coupure vient avec un frisson offert."
    yeti_fur_tuft: "Blanc comme neige fraîche, chaud comme la culpabilité. Le yéti n'en avait plus besoin. Il insiste."
    yeti_jawbreaker: "Nommé pour ce qu'il fait aux mâchoires, taillé dans ce qui en avait une."
    yeti_scalp_hood: 'Sent comme quelque chose qui etait definitivement, probablement, presque certainement reel.'
    yeti_skull_crown: "Crâne de yéti évidé, reconverti en couvre-chef. Le propriétaire initial n'a déposé aucune plainte."
    yetihide_stompers: "Bottes doublées d'une épaisse toison de yéti. Garantissent des pieds au chaud et des ennemis à distance. L'odeur, à elle seule, est une arme."
    zenith_alloy: "Un alliage qui ne prend qu'à la forge la plus haute de la montagne, là où l'air est assez rare pour que les forgerons jurent qu'il cesse de leur tenir tête. Il garde un fil qu'aucun métal d'en bas n'égale."
    zenith_crown: "Portée par le pèlerin qui grimpe le plus haut sur le pic fracturé avant que l'ascension ne l'achève. Elle a changé de tête plus souvent que son porteur actuel n'aimerait y penser."
    zenith_greaves: "Plaquées pour survivre à l'ascension du pic fracturé, les jointures renforcées là où les genoux de la plupart des pèlerins lâchent en premier."
    zenith_signet: 'Marque son porteur comme ayant tenu le vrai zénith, avant la fracture, selon une prétention que précisément personne encore en vie ne peut confirmer ni démentir.'
    zenith_staff: "Taillé dans un éclat du pic originel du zénith, avant que la Cicatrice n'emporte le reste. Il pointe juste vers ce qui reste encore debout."
    zenithscar_draught: "Tirée des eaux de fonte qui stagnent au pied de la Cicatrice et devient claire si l'on patiente, trouble si l'on se presse. Ici, la plupart des buveurs se pressent."
    zenithscar_draught_of_summit_vigil: "Assez amère pour tenir une sentinelle éveillée durant une faction que la part tranquille d'elle-même préférerait dormir. Elle ne respecte ni les vœux de la sentinelle ni ceux de l'ennemi."
    zenithscar_fangs: "Deux lames affûtées sur les parois opposées de la même fissure, ce qui explique qu'elles ne soient jamais parfaitement parallèles. L'écart fait le travail que vous préféreriez taire."
    zenithscar_greatblade: "Équilibré le long de la couture exacte où le monde s'est disloqué, et sait donc toujours de quel côté tomber. En général sur quelqu'un."
    zephyr_legwraps: "Si légers qu'on croirait ne rien porter. Une option qui existe aussi, mais bien moins protectrice."
    zephyr_silk_strand: "Fil de soie infusé de vent qui flotte seul. Les tailleurs l'adorent. Leurs chats le considèrent comme un ennemi personnel."
    zukin_muru: 'A shinobi cowl for people who want to look like they left quietly, even when they slam the door.'
