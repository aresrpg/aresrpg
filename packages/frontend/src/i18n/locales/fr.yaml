title: WebGPU n'est pas disponible
body: 'Le monde nécessite WebGPU et une connexion sécurisée (HTTPS ou localhost). Ouvrez-le dans un navigateur compatible.'
engine_graphics_failure: Le rendu graphique n’a pas pu démarrer. Vérifiez les paramètres graphiques du navigateur ou mettez à jour votre pilote graphique, puis rechargez.
graphics_help:
  firefox_update: 'Vous utilisez Firefox {version}. WebGPU nécessite Firefox {required} ou plus récent : ouvrez le menu, puis Aide → À propos de Firefox pour mettre à jour, et rechargez.'
  firefox_unsupported: 'Firefox ne prend pas encore en charge WebGPU sur ce système. Ouvrez le jeu dans Chrome ou Edge.'
  firefox_settings: 'Dans Firefox, allez dans Paramètres → Général → Performances, décochez « Utiliser les paramètres de performance recommandés » et activez « Utiliser l’accélération graphique matérielle si disponible », puis redémarrez Firefox. Les Mac Intel ne sont pas encore pris en charge : utilisez Chrome ou Safari 26.'
  safari: 'WebGPU nécessite Safari 26 ou plus récent. Passez à macOS 26, iOS 26 ou iPadOS 26, puis rechargez.'
  chromium: 'Activez Paramètres → Système → « Utiliser l’accélération graphique si disponible », puis relancez le navigateur. chrome://gpu doit indiquer WebGPU comme accéléré matériellement.'
  chromium_linux: 'Sous Linux, activez « Unsafe WebGPU Support » et « Vulkan » dans chrome://flags, activez Paramètres → Système → « Utiliser l’accélération graphique si disponible », puis relancez le navigateur.'
  other: 'Ouvrez le jeu dans la dernière version de Chrome, Edge ou Safari 26 avec l’accélération graphique activée.'
