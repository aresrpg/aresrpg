    rune_wisdom_ra: ''
    runic_blade: '刀身の全長にルーンが刻まれているが、その意味について二人の学者が同じ見解を示したことは一度もない。魔法使いは古い方言だと言い張る。鍛冶師は気に入った見た目の飾りに過ぎないと言い張る。刀身自身に尋ねた者は、誰もいない。'
    runic_grimoire: 'ページの半分には本物の呪文が記されている。残り半分は、いつも呪文を間違え続けた魔法使いたちへの不満で、余白に書き込んだ筆跡の主が誰なのか、教団の誰も認めようとしない。'
    runic_ink: '魔法チャージを保持する生物発光インク。職人が機能的なルーンを刻むのに使用。'
    runic_warden_blade: 'クィーベックの符文は夜明けに最も淡く光る。これが鍛え直された儀式用の槍もかつてそうだった。'
    rustshore_cutlass: '船乗りの剣。海戦よりも酒場の乱闘をはるかに多く経験してきた。'
    rusty_daggers: '破傷風はバグではなく仕様。毎回の攻撃に無料の感染リスク付き。'
    sabertooth_axe: '牙が刃だ。柄は精神的な支えのためだけにある。'
    sabertooth_fang: '短剣より長く、大抵の切り返しより鋭い。あの猫にはもう不要なものだった。'
    salve_biscuit: '半分パン、半分包帯。錬金術師が治癒ペーストに砕く。薬の味、奇跡の効果。'
    sandwraith_legplates: '砂漠の墓で「持って行け、そして去れ」という手紙と共に出現した骨のように白い板。誰が手紙を残したか知る者はない。知りたい者もいない。継ぎ目から絶えず落ちる砂はどの既知の砂漠のものでもなく、掃いても無駄だ。朝には再び現れる。'
    sandwraith_reaper: '砂丘に半ば埋もれていたのを掘り出した。前の持ち主は、はるかに深く埋もれた状態で見つかった。'
    sapling_bark: 'クウィーベックの苗木から剥いだ。自らアーマーグレードのパネルに再形成した。死んでもこの木には野心がある。'
    sapling_bark_boots: 'この木は理屈の上ではまだ生きており、理屈の上ではまだこの扱いに怒っている。'
    sapling_channeler: 'まだ何になりたいか決めていなかった若木から彫り出された杖。クウィベックたちはこの杖全体を人質事件だと見なしている。あなたはこれを武器だと見なしている。どちらも完全に間違ってはいない。'
    sash_of_the_void_emperor: '記録上最大のヴォイドモスは、これを身につけて最後の脱皮に入り、二度と出てこなかった。その殻の中で何がそれに取って代わったのかはまだ目録に載っていない。目録係も急いではいない。'
    saurian_bow: 'つい先ほどまで自分を追っていた相手すら仕留められるほど、強く張られた弦。'
    saurian_fang: '暴れる獲物を抑えるだけの握力。そして抵抗を終わらせるだけの牙。'
    saurian_gauntlets: '鱗に覆われた拳、焚き火の匂い付き。前の持ち主はこの再利用に同意していない。'
    saurian_greataxe: ''
    saurian_ripper: 'まだほんのり温かい骨から削り出された一振り。鍛冶屋たちを落ち着かなくさせる温度。'
    saurian_scale: '厚く、虹色で、わずかな湿気を帯びている。甲冑師は水中プレートに織り込む。ドライクリーニング非推奨。'
    saurian_scale_helm: '古の蜥蜴王たちには、なぜ小さき者たちが兜などにこだわるのか理解できなかった——彼ら自身の頭蓋骨だけで壁を打ち破れたのだから。兜を着ける者は単に見栄を張っているのだと思い込んでいた。伝承も認める通り、それはあながち間違いでもなかった。'
    saurian_staff: ''
    saurian_throwing_spear: '職人技よりもドリフトサーペントの本能で均衡が取られている。一度投げれば、自ら軌道を修正する。'
    saurian_war_axe: ''
    saurian_war_harness: 'それ以来のどの着用者よりも三回り大きいソーリアン用に作られた胸当てを、職人としての誇りをぼやきながら切り詰めたもの。今もかすかに、誰も奪い返そうとしない縄張りの気配を纏っている。'
    saurian_war_horn: '一万年も息をしていない喉から削り出された角笛。それでも深夜3時には迷惑なほど響く。'
    saurian_waraxe: '深淵の下で眠りにつく前の石の王たちが好んだという角度で打たれている。新しい恨みより古い恨みをよく覚えているという。頭蓋骨については確固たる持論があるらしい。誰に尋ねればいいのか、まだ誰も見つけていない。'
    scale_mail_gauntlets: 'どの鱗も、長々と大声で抗議したラプターから引き剥がされたものだ。'
    scale_plate: 'ディナープレートサイズの厚い爬虫類の鱗。甲冑師は大好き。ラプトルはこの取り決めにあまり熱心ではない。'
    scaled_hide: '光を捉える小さな重なり合うウロコ。なめし職人は何十も縫い合わせる。退屈だ。彼らは文句を言う。'
    scar_iron: '傷痕の露出した岩から直に引き出された鉄で、産まれた深みの冷たさをいまだ抱いている。鍛冶師は敬意と、ささやかな自己保存本能から、加工する前にそれを温めさせる。'
    scar_maul: '傷痕石から切り出され、振るうとまるで、傷がこの先聞く必要のある最後の論拠のように重い。'
    scar_sigil_amulet: '傷痕の詠唱者が亀裂の壁に刻むのと同じ印が打たれ、創傷が這い上がらせて送り返すものを何であれ退けるためのものだ。'
    scar_suture_daggers: '縫合の司祭の儀式刃を模したもので、角度次第で傷を閉じるにも開くにも足るほど薄い。司祭たちは常に前者だと言い張る。'
    scarab_cleaver_axe: '翼の形をしている。飛行性能は、あの商人の他の売り文句と同程度に信頼できる。'
    scarak_chitin_belt: '趣味も友も無い虫が設計したパズルのように噛み合う甲虫の板。ひとりでに締まる。巣の最後の命令、「締めろ」に今も従って。'
    scarak_cleaver: 'スカラクの巣はこれを取り戻すため三度評議会を開いた。三度とも失敗した。'
    scarak_crown: 'スカラクの頭を自分の頭に載せる装備。ここには哲学的な再帰構造があるが、スカラクは絶対にそれについて考えたことがない。思索は獣には無用であり、装着者にも同様に無用である。重ねることで増すのは強度ではなく疑問だが、戦場で哲学する時間はない。'
    scarak_overlord_ring: '墓衛兵への制式支給品。曇らない。塚では何も曇りはしない。'
    scarak_shell: '弾くとカチッと音がするキチン板。まともな屋根板になる。女王は感情があれば激怒するだろう。'
    scarak_shell_plate: '脱皮期に収穫された甲殻板。スカラクは激怒したが、技術的に全裸だったため抗議に威厳を欠いた。後に彼らは脱皮期の警備を強化したが、甲冑職人はすでに次の脱皮期を待っていた。自然の周期と商業の周期は、驚くほど一致するのだ。'
    scarak_stinger: 'スカラクから直接引き抜いて棒に取り付けた。まだぴくぴく動いている。'
    scarforged_alloy: '傷痕自身の熱の上で打ち合わされたもので、鍛冶師はその熱を慎重に配分する — 傷痕は求めに応じて再加熱してはくれない。'
    scarforged_grips_of_first_dawn: '夜明けに亀裂の底へ淀む冷気で焼き入れされている。その冷たさが完全に抜けることはなく、着用者はそれを気に留めなくなることを覚える。'
    scarforged_legguards_of_last_ascent: '傷痕自身の金床石の上で平らに叩かれ、どれだけ磨いても取れないかすかな波紋が板に残る。もう誰も試さない。'
    scarforged_resin: '傷痕の熱で、ガラス質に固まり大半の金属より継ぎ目をよく保つまで煮詰めた樹液。それを生んだ火の匂いを、かすかに、そして永久に帯びている。'
    scarforged_tonic_of_last_ascent: '最後のひと押しのため、登攀者一人につきひと口ずつ配られる。二口目が要る者はどのみち登り切らない、という理屈だ。'
    scarforged_visor_of_first_dawn: '傷痕を越えた最初の光を捉えるよう傾けられている。鍛冶師はそれを別種の光だと言い張る。誰もそれを否定できていない。何より、誰も彼らに何ひとつ証明できていないからだ。'
    scarforged_warbelt_of_last_ascent: '傷痕の縁から切り出した留め金で締めるため、決してぴったりとは閉じない。隙間は小さく、そしていつもそこにある。'
    scarguard_helm: '最後の壁で見張りに立つ者への支給品で、着用者が創傷を長く直視せずに済むよう面頬が傾けられている。'
    scarhewn_axe: '傷痕自身の砕けた壁から削り出され、刃は亀裂の線そのものと同じくらいギザギザのまま残されている。世界がとうに抵抗をあきらめたかのように断ち切る。'
    scarwalk_leggings: '傷痕の縁を、正直この脚衣が耐えるように作られた回数よりも多く歩いた巡礼者たちによって、すり切れるほど履き込まれている。'
    schism_cuirass_of_last_tremor: '分断兵の隊列が、ついに正式に、最後の隊列離脱をした日に焼き入れされた。金属はその日の午後に鳴るのをやめた。以来、一度も音を立てていない。'
    schism_gauntlets_rift: '左の籠手は、もう存在しない盾を握った分断兵の感触を覚えている。右の籠手は何も握ったことがない。着用者は意図せず片側を優先するようになる。'
    schism_gauntlets_void: '指はいつまでも温まらない。癇癪には便利だが、握手には最悪だ。'
    schism_girdle_of_widening_crack: '壊れた後も機能し続けるよう、分断兵の需品係が設計した。見事な設計と言うべきか、期待というものへの悲しい論評と言うべきか。おそらく両方だ。'
    schism_greaves: '左の脛当と右の脛当は、決して同じ時代に仕えなかった二人の異なる分断兵から鍛えられた。今も行軍の順序について完全には合意していない。'
    schism_resin: '真っ二つに割れ、どちらの半分も許さなかった岩から滲み出る。'
    schism_sabatons_rift: '虚空が靴底から染み上がる。着用者は温かい心と耐え難いつま先を報告している。'
    schism_sabatons_void: '重りを入れた靴底。希薄な重力が一歩の途中であなたを連れ去らないように。'
    schism_signet_of_last_tremor: 'リフトリングの最後の震えがその殻の中で絶えた瞬間、唸るのをやめた。今はただ手の上で冷たく座っているだけだが、前の着用者にとってはその唸りよりも、それの方がずっと不安だった。'
    schism_signet_of_widening_crack: '彫刻は毎年髪の毛一本分ずつ伸び、分断兵の元の階級章を割った、あの広がる線をなぞっている。宝石商は二度目の鑑定を断る。'
    scorch_grimoire: '表紙が焦げている。中身はもっと酷い。第三章を声に出して読むと眉毛がなくなる。'
    scorched_loaf: 'わざと焦がした。違うなどとほのめかすな。あのカリッとした食感こそが狙いであって、パン屋の失態ではない。'
    scorchtouch_grips: '触れるもの全てが温かくなる。おかげで握手は外交問題と化した。'
    scrap_battleaxe: ''
    scrap_cuirass: '回収した金属板を叩いて作った。隙間は鍛冶師曰く『通気機能』。そうですか。'
    scrawled_tome: '水没した身廊で浮かんでいるのを発見された。船頭たちが十年は水中にあったと誓う代物なのに、インクはまだ濡れている。最後の頁を訳した者はいない——最初の三頁で誰もが諦めた。'
    scythe_of_the_abyss: '深淵が武器をくれた。意外と良いカスタマーサービス。'
    sealed_core: '創世の欠片を包んで鍛えられ、神託が傷を封じるやり方で封じられた核 — きつく、そして開けぬよう忠告する書き付きで。'
    senshi_starter_sword: 'ただの棒切れだ。持ち手をガムテープで巻きつけただけ。誰も騙されない。特にゴブリンたちは、この恥ずかしい代物を絶対に仲間に吹聴するだろう。'
    sentinel_gorget: '首を守る。生存戦略として驚くほど過小評価されている。'
    sentinel_teeth: ''
    sentinel_tooth: 'ワニに歯をむしろうとするほど近づく馬鹿がどんな奴か疑問だが、さてここにいるわけだ。'
    seraph_chain: '票が割れた末に承認された。それが取り消し線付きの保証条項の理由だ。'
    seraph_heart_pendant: 'このアミュレットは静かな執着で自分自身を元に戻す。それは同時にここにあり他の場所にあり、身に着けられ、捨てられ、本物で、異議を唱えられている。'
    seraph_lance: '作り手は正しく完成したのか、今も確信が持てない。それが取り消し線付きの保証条項の理由だ。'
    seraph_petal: '一つの素材か複数の素材かはいまだ未決着だ。それでも留保付きのまま報告書は提出された。'
    seraph_plume: 'その純度は融通の利く、交渉可能な尺度で評価される。そのため台帳には両方が並記されているだけだ。'
    seraphbound_casque_of_falling_crown: '精査にかろうじて耐える。それでも疑念を抱えたまま出荷された。'
    seraphbound_cordial_crown: '後味は個人の意見次第だ。そのため保証ではなく、肩をすくめる仕草付きで売られている。'
    seraphbound_cordial_godbone: '論争に決着をつけるために作られたが、失敗した。したがって、正式には自己責任での飲用となる。'
    seraphbound_longsword: '設計は三つの異議を乗り越えた。それは設計の核心か、単なる誤差にすぎない。'
    seraphbound_loop_of_broken_diadem: '設計は相容れない複数の草案を経た。それは形式上は正しく、まったく役に立たない。'
    seraphbound_resin: '誰も決着させなかった論争の証拠として記録された。そのため購入者は自ら判断するよう勧められている。'
    seraphbound_stompers: '着用者はそれを絶賛するが、他の誰もが疑っている。そのため議論は無期限に棚上げされた。'
    seraphbound_vambraces: 'その機能はコイントスで決められた。その論争は始めた者たち全員より長く続いた。'
    seraphic_amalgam: '二つの別々の報告書がこれを矛盾した言葉で説明している。調査チームは今もそれについて議論している。'
    seraphine_hauberk: '作り手のメモは取り消し線だらけの案ばかりだ。そのため意見の相違はそっと設計に組み込まれた。'
    shadow_blade: ''
    shadow_knight_signet: '内側の銘は、おおよそ脅し文句と訳せる。影の騎士たちはこれを約束だと言い張る。'
    shadow_knight_visor: '覗き穴はわざと狭く作られている。影の騎士にとって周辺視野は道徳的な欠陥なのだ。'
    shadow_stilettos: '光を吸い込む破片から鍛えられた。外れる一撃さえ、敵には見えない。'
    shadowsteel_belt: 'ズボンを支え、そしてご丁寧に、死の恐怖まで抑えるという。片方は未検証である。'
    shadowsteel_morningstar: '棘は光を反射せず吸い込む。夜の明かりとしては本当に役立たずだ。'
    shadowsteel_shard: '闇が装飾ではなく荷重を支える構造そのものだった鎧から砕け落ちたもの。鍛冶師たちはトングと祈り、そして祈りを省いた者に何が起きるかを知る者だけが持つ特別な用心をもって、これを扱う。'
    shark_bone_choker: 'サメの脊椎で作られたネックレス。沿岸の町では流行の品。それ以外の場所では文字通り恐ろしい。'
    shark_fin: 'シュモクザメの背びれ。スープ商人はこれより軽い罪で捕まったことがある。'
    shark_fin_saber: 'サメの歯を模してギザギザに加工されている。サメたちは当然、今もこれに腹を立てている。'
    shark_harpoon: '『倫理的に調達された』サメのヒレが先端に付いている。サメ本人はその『倫理的』に異議を唱えるだろう。'
    shark_leather_belt: '紙やすり代わりにもなる粗さ。そのサメは、この比喩ごと生き延びられなかった。'
    shark_mail: 'サメのヒレの鱗をミスリルの輪に縫い付けた。防水、対サメ、そして話のネタにもなる。'
    shark_scale_tassets: '腿にサメのヒレの鱗。水中では今や流線形だ。法的には、魚。'
    shark_vertebra_ring: '研磨されたサメの脊椎骨がひとつ。それが取れた顎は、今も技術的には狩りを続けている。'
    sharkhide_fists: 'サメ革をソリウム板に巻きつけた。ざらついた表面はチーズおろし器としても使える。'
    sheep_eye: 'ウーリガンの切り離された目は、瞬きできない時はずっと脅威が少ない。そしてそれは常にそうである。'
    shellguard_mitts: '蟹のキチン質で分厚く裏打ちされ、打撃も指先の器用さも等しく鈍らせる。指は無事だが器用さはそうではない。その下にあるものは、もはやほとんど殺せない。'
    shiny_barley: ''
    shoddy_spear: '軍務妄想を持つ尖った棒。先端はグラグラだが覚悟が全て。'
    shore_amulet: '間違った漁師を挟んだ蟹の殻から彫られた。内部に閉じ込められた砂が危険が近づくと鳴る。歩いても鳴る。区別はつかない。'
    shore_finns: '巨大な蟹の甲羅を頑丈な脚部防具に仕立てたもの。潮風と陽に焼けた磯の香りが微かに漂う。'
    shore_mace: 'フジツボがこびり付き、質感と破傷風リスクが増す。'
    silentedge: '抜く時も、振る時も、当たる時も音を立てない。人々が覚えているのは、その後の静寂の方だ。'
    silk: '非の打ちどころのない糸、水のように滑らかで鎖より強靭。結び目が惜しい — 確かにしっかりと結ばれるが、家族の絆をこれほど試すものではない。'
    silk_boots: 'ありえないほど軽い。協力するためにハエで買収された蜘蛛の糸で織られた。取り決めは一足分を仕上げるのにちょうど足りるだけ続いた。靴屋の弟子はまだ療養中。'
    silk_bound_lexicon: 'シルクリングの繭糸で綴じた。呪文の半分は読めず残り半分は危険。'
    silk_cocoon: '半分形になった粘つく繭。中身は幼虫か、あるいは厄介なことにあなたの昼食かもしれない。'
    silk_cowl: '生涯を上昇気流に乗って過ごし、一度も下を見ない生き物から織られた。'
    silk_gloves: '一日も働いたことがない者のための最高級品。血は温かいのに、手だけはいつも冷たい連中にぴったり。'
    silk_leggings: 'そよ風のように軽い。そのそよ風を生み出した何かと同じくらい頑丈だ。'
    silk_tunic: '全き暗闇と静寂の中でのみ働く洞窟グモが織った絹。'
    silk_woven_gauntlets: '着けていることを忘れるほど軽い。思い出すのは、最悪の瞬間になる。'
    silkamu: 'どの蜘蛛も自発的に譲らなかった糸から織られた。蜘蛛組合は織り手の首に懸賞金をかけた。支払いはハエで。'
    silkling_stingers: '微視的な棘は傷が数週間にわたって化膿することを保証する。それが多分、狙いなのだろう。'
    silkwinder_lance: '蜘蛛の糸で巻かれ空を切る音がする。敵は聞こえるが避けられない。'
    silt_wrapped_core: '使うには割り開かねばならぬ泥の鞘に覆われた工作の核。仕事の合間に置きすぎると、ひと晩で元に戻る。'
    silt_wrapped_cuirass_of_quiet_drowning: '乾けば石に固まり湿れば軟らかくなる泥の殻に覆われている。ウィールドでは、それが常に、ひそかに、移り変わり続けることを意味する。'
    silt_wrapped_gauntlets: '拳頭の上で固まる泥にまみれ、最初の一撃はウィールドの地面を一掴みも届ける。'
    silt_wrapped_greaves: '泥の殻が一歩ごとに石ひとつ分の重みを加える。着用者がそれに気づかなくなるのは、ちょうど他の皆が気づく頃だ。'
    silt_wrapped_lance: 'その泥の殻は最初の一撃で砕け散り、敵の注意を道連れにする。二撃目がそれを利用する。'
    silt_wrapped_maul_of_quiet_drowning: 'その泥の外殻は石ひとつ分の重みを加え、衝撃の瞬間にウィールドの地面を小さく噴き出す。だから一撃ごとに、故郷を少し残していく。'
    silversteel_saber: 'どんな光の下でも輝く。注目を集めるが、それはたいてい避けたかった類のものだ。'
    sky_shard: '固化した嵐雲の一片。手を放すと浮く。秘術師は杖に束ねる。重力は侮辱されている。'
    sky_shard_diadem: '灰の軍旗を最後に掲げた者が戴く。その役目はしばしば入れ替わる。'
    skybound_ring: '火葬の穴で焼かれ、金属は他の記憶を失った。'
    skyburial_bow: '留保付きで機能する。着用者はそれについて考えないことにした。'
    skyburial_leggings: '着用者はそれを絶賛するが、他の誰もが疑っている。そのため着用者はもう尋ねるのをやめた。'
    skyheld_carapace_of_hollow_throne: '純粋な意地だけで完成させられた。かなりの時間的圧力の中で下された決定だ。'
    skyheld_claymore_of_last_regent: 'なぜかを尋ねない限り機能する。そのためこの件は今のところ未解決のままだ。'
    skyheld_crest_of_hollow_throne_crown: 'その効果は独立した検証を一度も受けていない。それを確かめるには議論を蒸し返すしかない。'
    skyheld_crest_of_hollow_throne_godbone: '作り手は途中で気が変わった。ほとんど何も解決しない解決策だ。'
    skyheld_halberd_of_hollow_throne: '満場一致の躊躇にもかかわらず完成させられた。そのため元の論争は引き分けと宣言された。'
    skyheld_stilettos_of_hollow_throne: '作り手は正しく完成したのか、今も確信が持てない。それでも疑念を抱えたまま出荷された。'
    slackline: '実際に緩んだことは一度もない。前の持ち主がそう呼んでいた名だ——それが真実でなくなる直前まで。'
    slag_clinker: '炉が何かとの用事を終えたと判断したときに吐き出すもの。それでも鉱夫たちはこれを取っておく——古い言い伝えによれば、廃棄物とは丁寧に頼み方を間違えられただけの鉱石なのだという。'
    sloth_fur: '信じられないほど柔らかく、苔と忍耐の臭い。仕立て屋は大好き。スロシアンはとてもゆっくりとため息をついただけ。'
    slothian_wisdom_stone: '古代の知識で唸る苔むした石。答えを知っている。ただあなたの準備ができていないと思っているだけ。'
    smoldering_wheat: ''
    solomonk: 'The cowl of a monk who traded three vows of silence for one very loud hat.'
    soul_binder: '亡者をついに鎮めた後に残るものから精製される。精霊結合の装備をつなぎ留めるために使う。'
    soul_shard: '儀式の最中に亡者から引き剥がされた結晶片。未完のまま何かを響かせ続ける。'
    soul_shard_loop: 'まだ完全には去っていない何かの欠片を宿す。'
    soulbinder_scepter: '下方の門で魂監査官が縛るものの一部を宿し、借り物の永続性で唸っている。灰の預言者はこれを使い、死者が普通は二度と答えない問いを投げかけた。'
    soulking_spellbook: ''
    sounding_hull_key: '船体の番人が今も見回る難破船から回収した。潮が変わるたびかすかに唸り、何かへの秒読みをしているようだ。'
    spark_pendant: '何十年も前に消えるべきだったと知らぬほど頑固な、捕らわれた火花。'
    spark_ring: '磁鉄鉱を芯に持つ銅の輪で、着用者が怒っているとき、不安なとき、あるいは夕食のことを考えすぎたときに火花を散らす。作った魔法使いはこれを気分指輪と呼んだ。村ではもっぱら火災の元と呼ばれている。'
    spectral_arcanize: ''
    spectral_edge: '半分はこの世、半分はあの世。国境の税関はやたらと細かい。'
    spectral_essence: 'ソウルレス・リージェント自身から蒸留。星の間の虚空の臭い。市場価値は破壊的。'
    spectral_fang_daggers: '凝縮された幽霊の苦情から鍛造された。刺すたびに詳細な苦情書が付いてくる。'
    spectral_ruin_blade: '適切な光の下では透けて見えるほど、そしてどんな光の下でも斬れるほど薄いヴォイドモスの甲殻から鍛えられた。歴代の所有者の亡霊が、時折頼みもしない助言をしてくる。'
    spice_rusk: '二度焼きされ、非常に香り高いため、武器鍛冶はその油を製菓以外の用途に使う。'
    spicebark_bread: '一口かじれば、三卓分の鼻という鼻が無条件降伏する。'
    spider_fang_club: ''
    spider_fang_daggers: '結晶化した毒でできた双剣。暴力が近づくと、ごくかすかに唸る。'
    spider_leg: '巨大蜘蛛の脚を刺突武器に改造したもの。天然のキチン質は処理鋼より硬く、残留感覚毛が使用者に環境への不安な触覚的意識を与える。数人の所有者が天井に対する説明のつかない嫌悪感を発症した。。この感覚に慣れるまで通常三週間かかるが、慣れた後はむしろそれを手放せなくなる。'
    spider_silk_gland: '同じ太さの鋼線より強い糸を生む、ゼラチン質の器官。それでも丁寧に扱うこと。'
    spider_silk_grips: '掴んだものを離さない。戦闘には最高だが、握手には最悪だ。'
    spider_silk_treads: '蜘蛛の糸で編まれた靴、噂のように軽く裏切りのように強い。靴底は不安なほどさりげなく垂直面に張り付く。それを履く盗賊は、他の人間がその能力を持たないことを時々忘れる。。製造元は垂直面だけでなく天井にも対応できると記載しているが、保証書には天井は含まれていない。'
    spider_thread_pants: '蜘蛛が自ら進んで手放したことのない糸で紡がれている。倫理的な調達など最初から論外だった。'
    spine_daggers: 'エロリーという者が慈悲でなく残酷さのために育てた。どちらが勝ったかは記録に残っていない。'
    spine_gauntlets: '革の掌に牙獣の棘を装着。握手は全て交渉になる。背中を叩けば宣戦布告。製作過程では非常に怒った生物から棘を抜く必要があり、篭手が残留怨恨を放っているように見える理由はそれで説明がつく。'
    spine_pants: '小さいが座られることに強い意見を持つ何かの棘で補強されている。'
    spore_cracker: ''
    stabilizing_agent: '不安定な混合物が予定外の爆発になるのを防ぐ。失敗した分については誰も語らない。'
    staff_of_the_deep: '誰も建てた記憶がない沈没神殿から引き上げられた。フジツボはその中で一番普通な部分だ。'
    stamina_tonic: '足が疲れていないと錯覚させるミネラル刺激剤。足は真実を知っているが化学的恐怖から従う。'
    starter_staff: 'この使い古された竹の棒は数えきれない放浪者を沼地や荒野を通して導いた。歩行補助としても、即席の謙虚の教訓としても同じくらい使える。'
    starter_weapon_ikari: '分厚く、鈍く、重々しい———達人の武器にあるまじき欠陃の権化。肩より高く持ち上げられることさえできれば、敵を撲殺することもできよう。'
    steadyhand: '傷痕がいずれ誰にでも与える震えを止める。だが手だけだ。残りの震えはあなたの問題のままだ。'
    steel_cuirass: '前の持ち主は転送先の住所を残していった。それを確かめる勇気を持つ者はまだいない。'
    steel_flail_sword: '黄昏に鍛えられた柔軟な刃を剛毛鎖で包んでいる。誰も守るつもりのない約束のようにしなる。'
    steel_gauntlets: '闇の中では指が完璧に動くが、陽光が触れた瞬間に強張る。'
    steel_greaves: '影の騎士が完全な暗闇で養蜂に隠居する前に手がけた最後の作品。'
    steel_incandescent_sword: '焼き入れのどこかで自分の名前を失くしてしまったと噂されるほどの高熱で鍛えられた剣。刀身はその熱を完璧に覚えている。あの日彼が失ったものを、刀身は一度として返したことがない。'
    steel_longsword: '普通に機能を果たす普通の鋼の長剣。呪いなし、魔法の特性なし、悲劇的な歴史なし。提示されたものを切り、素早く拭けば清潔に保たれる。コレクターは無視する。生存者は選ぶ。。何の変哲もない鋼の剣が、最終的に最も多くの戦場を渡り歩いた武器となった記録がある。'
    steel_recurve: 'アルファウルフの腱を弦に張った。引き重量について嘘をつくたび、わずかに締まる。'
    steel_treads: '皆既日食の間、完全な静寂を求めた騎士が鍛えた。ほぼその通りになった。'
    steel_warhelm: '光もろとも賛辞まで吸い込むほど暗い。バイザーは内側からしか開かない。誰かの悪ふざけらしい。'
    stitched_trousers: 'それぞれ独自の歴史を持つ複数の異なる革の断片から組み立てたズボン。縫い目は見えており、意図的だ——製造者は目に見える修理を誠実さの印と考えている。満月の夜に継ぎ目から囁きが聞こえると主張する着用者もいる。'
    stoneheart: '着用者の身に何が起ころうと、いつの時刻、いつの季節でも触れると冷たい。'
    stormfeather: '振ると火花を散らす羽。嵐の魔法使いは杖に織り込む。配達員は届けるのを拒否する。'
    stormfeather_daggers: '嵐鷹の羽根を鋼へと折り込み続け、金属はついに自分が他の何かだったことすら忘れてしまった。一撃ごとに、とうの昔にこの刃を置いて過ぎ去った嵐の雷鳴が轟く。'
    stormfeather_longbow: '放つ前に矢はいつも音を立てる。射手は皆それを狙っていたと言い張る。'
    stormfeather_loop: '絶えずパチパチと音を立てる羽根で編まれている。ここでの握手には申し訳程度の小さな感電がついてくる。'
    stormhowl_bow: '矢が標的に向かって叫ぶ。近所から苦情。'
    stormtide_coif: '水魔法使い用か地騎士用か決められない。どちらにも渋々仕える。'
    stormwalker_boots: 'どんな嵐も文句なく歩き抜く。ブーツはだが。履く者は始終文句を言っている。'
    stormweave_leggings: '染めではなく、使い込みで灰色になった。元の色を覚えている者はいない。'
    stumpwork: '傷を半分だけ生き延びた木々のために作られた。仕事を終わらせることは、着実で頼りになる作業だと分かった。'
    suize_flour: '結晶質で光を捉えるほどのきらめきがあり、パン職人はパンをより高級に見せると誓う。'
    summit_alloy: '坩堝そのものが音を上げる寸前まで、山頂の炉が保ちうる最も強靭な合金。鍛冶師は正確な温度を知っていて、決して書き留めない。'
    summit_cuirass_of_sealed_wound: '縫合の司祭が最も苦労して閉じた縫い目に合わせて仕立てられ、着用者はその補修を持ち歩くことになる。傷痕の上より、胸の上のほうがよく保つ。'
    summit_draught: '頂上近くで登攀者を襲うめまいのために煮出された。空気が薄くなり、精神が奈落と交渉を始める場所だ。交渉が始まる前に飲むこと。'
    summit_extract: '圧をかけて山頂の苔から絞り出したもので、一滴が丸一瓶ぶんの仕事をこなし、補充にも同じくらいかかるほど濃い。'
    summit_girdle_of_summit_vigil: '誰も立ったまま生き延びられないはずの番の間、歩哨を直立させておくために締められている。直近の三人を支えた。そのことを感傷的には語らない。'
    summit_greaves: '登攀の最後の一区間のために脛が補強されている。山が手がかりを差し出すのをやめ、それを取り返し始める場所だ。'
    summit_helm_of_summit_vigil: '山頂で最も長い番を引き当てた者に支給される。重い兜は頭が船を漕ぐのを防ぐという理屈だ。実際に防ぐ。主に痛みで。'
    summit_ore: 'まさに頂で掘り出されるアダマント。鉱石が、山を下で形づくる何かに最も近い場所だ。まるで意図されたかのように重い。'
    summit_sabatons_genesis: '鍛冶師が史上初めて裁たれたものだと誓う靴底の上に板金されている。真偽はどうあれ、もう証明すべきものは何もないという歩き方をする。'
    summit_sabatons_scar: '傷痕石での足場のために鉄が打たれている。その石は、君が信を置くのを待つ何かのような辛抱強さで足元でずれる。'
    sundered_casque: '額に亀裂が走っている。鍛冶屋はそれを「応力逃がしの溝」と呼ぶ。鍛冶屋は嘘つきだ。'
    sundered_charm: '分断兵の部隊メダルの半分。本来、対で発行され、決して離れるはずのなかった種類のものだ。もう半分はどこかにあり、おそらく今もその対を完成させようとしている。'
    sundered_chausses_of_screaming_rift: '分断兵が最後の命令で取った跪きの姿勢が、裂け目の仕事を仕上げた何かによって関節に固定された。立ち上がるには毎回、意識的な決断が要る。'
    sundered_cordial: '治療ではない。小休止だ。その間に、なぜここに来たかを考え直せ。'
    sundered_cordial_of_long_collapse: '名簿上はまだ在籍している分断兵に支給される。治せるものは治し、治せないものについては正直だ。'
    sundered_elixir_of_screaming_rift: '分断兵の部隊が、部隊であることをやめる直前に醸す最後のもの。飲み下す時は騒がしく、その後は静かだ。'
    sundered_sash: '分断兵の装備の中で、物語の他の部分がどれほど徹底的にばらばらになろうと、決してほどけなかった唯一の部品。保つ。ただ、保つ。'
    sundered_stompers_of_long_collapse: '一歩ごとに、分断兵の軍法会議がついに下せなかった判決のように着地する。ゆっくりと、慎重に、そして重力が許す限り、絶対的に最終的だ。'
    sundered_stompers_of_screaming_rift: '分断兵が一歩踏み出すたび、下の裂け目が応える。忍び足の訓練の意味がほぼ失われる。驚きの登場は、構造上、選択肢から外れている。'
    sundered_vambraces_of_long_collapse: '決して終わらなかった点呼のために装着された。腕は、心がもう望まなくなった後も、構えたままでいることを覚えている。終わりのない忍耐も、技術的には、やはり忍耐だ。'
    sundered_vambraces_of_screaming_rift: '腕の「耳」の上に厚く詰め物がされている。それが誰の腕だったかを思い出すまでは解剖学的に意味不明だ。刃を防ぐのとほぼ同じくらい、音も防ぐ。'
    sunglass_shard: '他には何一つ意見が合わない二つの太陽が、唯一融合させて作った硝子の欠片。'
    sunken_mere_key: 'フロストドラゴンが眠る氷の下から引き上げられた、素手を数秒で痺れさせるほど冷たい。取り戻すのは誰もが思うより簡単だった——それを安心材料と見る者は誰もいない。'
    sunscale_chopper: '陽光を吸い込んだ鱗の刃。ヤモリの一世代分の間、輝き続けるという。'
    sunscale_cuirass: '輝く鱗の胸甲。鋼鉄も魔法も防ぐが、中で丸焼けにならなければの話だ。'
    sunwarmed_ring: 'かつてのトカゲの温もりがまだ残っている。本人はもう使う予定がないのだが。'
    sunwarmed_scale: '灰肌トカゲの広い板状の鱗。そのトカゲが立ち去った後もずっと温かいままだ。'
    surimi: 'このスリミの聖なる遺物は太古の力で脈動し、その表面は遥か昔に絶えた巡礼者たちの崇敬なる触れ合いで滑らかに磨り減っている。神聖さが不自然なほど加工魚肉を連想させるのが奇妙だ。'
    suture_belt: '縫合の司祭が、傷が広がる前に締めるやり方で締めてある。腰に対しても、傷痕に対してと同じくらいには効く。'
    suture_loop: '縫合の司祭が何もかもを閉じるやり方で閉じた輪に曲げられている。傷痕は、そもそも開けたままにされなかったものをほどけない、という理屈だ。'
    swamp_conduit: '沼の水をぼんやり魔法的な何かに導く。臭いは完全に俗世のもの。'
    swamp_scale: '暗い緑色で常にぬるぬる。ワニは予備を生やした。なめし職人は目に見えて渋々受け取る。'
    swamp_trident: '腐食した三叉の金属。沼から這い出るものを串刺しにするのに最適。'
    swampfire_grips: '歴史上最悪の決断のいくつかが、そのまま革に染み込んでいる。'
    talokan_aero_tail: '翠色にして毒あり。その色自体が無料の警告表示になっている。'
    talokan_pearl: 'タロカンが通貨として持つ深海の真珠。水中でかすかに青く光る。地上の商人は渋々受け取る。'
    talokan_sting_daggers: '珊瑚の刃先と塩の結晶。引き潮と後悔の匂いがする。'
    talokan_tail_nakwa: '革職人なら誰もが欲しがる。だが挑戦のたびに戻ってくる指の数は、期待より少ない。'
    talokan_tide_ring: '圧縮海塩とタロカンの真珠から作られている。泳ぐと溶ける。泳がないこと。'
    talokan_trident: '珊瑚の穂先は戦闘の合間に再生する。自然があなたの癖を助長している。'
    tanjirize_flour: 'すべてを攻撃的に芳香にするスパイス粉。'
    tanjirize_rod: '創傷に近づきすぎて変わり果てて戻った巡礼者の杖。歩くには今も申し分ない。今では他のこともする。'
    tanned_girdle: '時間と気候条件によって硬化した日干し革のベルト。魔法の特性はなく、あると主張もしない。ズボンと内臓を同時に所定の位置に保つ——それはすでに大半の装備品よりもできることだ。。これを着けていた者が数十年後に同じベルトを使い続けているという事例が確認されており、その耐久性は本物だ。'
    tectonic_severance: 'この斧を鍛えた鍛冶師は試し振りで山を割ったと伝えられる。山は訴訟を起こした。'
    temperedglass: 'どんな窯にも耐える聖歌隊ガラスの板。それでもケーキはくっつく。それが掟だ。'
    tempering_flux: '希少金属の融点を下げる錬金フラックス。武器鍛冶はこれなしでは高級装備を鍛造できない。'
    tempest_requiem: 'すべての矢は、灰の預言者が到来の三節前に見た小さな雷雨を宿している。その余分な射程は力ではない。風がどこに立つかを知っていることだ。'
    tempest_whisper_bow: '天空の欠片の糸で張った弓。矢は音より先に届く。'
    terminal_casque_genesis: '深淵の審問官が最も古い記録をめぐって論じる間にかぶる。詰め物が厚い。論争は長引き、時に殴り合いに発展するからだ。'
    terminal_casque_scar: '壁の武具庫が鍛えた最後の兜。この高度から先には次の大きさもなければ、それを必要とすると見込まれる次の着用者もいないからだ。'
    terminal_chausses_of_origin_line: '境界に達してそこで止まるつもりの脚のために裁たれている。板金はそれを、走るのを心底不快にすることで徹底させる。'
    terminal_cordial_of_final_scar: '壁の療養所で手の施しようのない症例のために保管されていたが、そうでない症例にきまり悪いほどよく効くと判明した。評判はそれ相応に改まった。'
    the_tenderizer: '傷痕に残る肉屋たちに台所道具として売られた。ほぼ即座に転用された。製造元はもうコメントしていない。'
    thick_ursine_hide: '一枚の毛皮から防具一式が生まれ、当の熊は今頃あの世で苦情を申し立てている。'
    thickskull: 'その褒め言葉は文字通りの意味だった。裏地に縫い込まれた魔法よりも多くの命を救ってきた。'
    thorium_warhammer: 'レックスの牙を鋲打ちし、鮫ヒレで補強した戦鎚。繊細さの代わりに純粋な鈍器の力を提供し、結果は騒々しく雄弁に語る。静寂を愛する者には向かないが、静寂を求める敵には極めて効果的である。墓の静けさもまた静寂の一種ではある。'
    thorium_warplate: '隊列をまだ保っている者への制式支給品。今では希少だ。'
    threefold: '鍛冶屋によって一度打たれ、鍛冶屋ではない何かによってさらに二度折り重ねられた。それが何かは誰も尋ねていない。'
    throatlatch: '最初の着用者が閉じてから、二度と開かれていない。留め金は今も機能している。誰も試していないだけだ。'
    throneless_cleaver_of_rotting_halo: '技術は確かだが、前提はそうではない。全員が議論をあきらめた末の妥協案だ。'
    throneless_draught_of_gilded_ruin: '急いで下された決断のような味がする。そして醸造者は今も態度を決めかねている。'
    throneless_extract: 'これがどこから来たのか、確かなことは誰にも言えない。そのため両方の記録が未整理のまま残っている。'
    throneless_gauntlets_of_gilded_ruin: '誰も勝てなかった口論の最中に鍛えられた。そして第二稿は結局実現しなかった。'
    throneless_lattice: '誰も決着させなかった論争の証拠として記録された。それでも留保付きのまま報告書は提出された。'
    throneless_pendant_crown: '着用者は機能すると言い張るが、証拠は決定的でない。返金なし、追加の質問も受け付けない。'
    throneless_pendant_godbone: 'ラベルの主張通りに機能するか誰も確認していない。作り手はそれを長所だと考えている。'
    throneless_sabatons_of_gilded_ruin_crown: 'なぜかを尋ねない限り機能する。たいした違いのない区別だ。'
    throneless_sabatons_of_gilded_ruin_godbone: '語る者によって由来の話が変わる。書類上はこの経緯が一切反映されていない。'
    throneless_sabatons_of_rotting_halo: '誰も覚えていない主張を証明するために作られた。作り手がついぞ書かなかった脚注だ。'
    tide_shard: '絶えず滴る、生きた海の結晶化した欠片。塩と未解決事項の匂いがする。'
    tide_throne_key: '潮位線より下でしか硬まらない珊瑚から鋳造された。〈溺レタ摂政〉は今もそこで謁見を続け、この鍵が戻るのを待っている。'
    tidebinder_cord: '水夫の精密さと少しの魔法的無能さで結ばれている。'
    tidebound_band_of_brackish_deep: '摩耗とは無関係の周期で曇り、また輝く。着用者はやがて、無いと言われる潮とそれを照らし合わせるのをやめる。'
    tidebound_breastplate_of_brackish_deep: '飲むには塩辛すぎ、何かを保つには淡すぎる水で鍛えられた。その妥協を、胸甲はかすかで消えない匂いとして身につけている。'
    tidebound_core: '遅い周期で重くも軽くもなる核。どの職人も、それを何かに、まして無いとウィールドが言い張る潮に、結びつけられなかった。'
    tidebound_grips_of_silt_throne_matron: '溺れた宮廷から拾われ、塩抜きされたことがなく、着用者が長く触れるものすべてに淡い白い跡を残す。'
    tidebound_grips_of_silt_throne_mire: '溺れた宮廷から回収された籠手。泥がとうに奪った何かを握る形に、いまだ丸まっている。'
    tidebound_treads_of_brackish_deep: '塩水なめしにより永遠に湿り、永遠に静かになった。音が牙を引き寄せる場所では公平な取引だ。'
    tidebound_treads_of_silt_throne: '儀式で完璧に静止するために作られた宮廷履き。今や、大きな何かが通り過ぎる間に完璧に静止するのにうってつけだ。'
    tidebound_visor_of_brackish_deep: '潮の届く場所で使われて塩をふいている。ウィールドはそんな潮などないと言い張り、面頬の腐食は逆を言い張る。'
    tidebound_visor_of_silt_throne: 'ウィールドの案内人がいまだ玉座の間と呼ぶ、泥に詰まった広間から回収された。玉座がそこにあった証拠というより、習慣からだ。'
    tidecaller_mail: '嵐の中のブイのように鳴る。味方はいつも居場所がわかる。敵もだけど。'
    tideflame_treads: '水と接触するたびに青い炎で燃える靴。川の渡渉では壮観な効果だが、都市の雨の夜には悲惨だ。港湾地区の消防士たちはその普及に反対する公式請願書を提出した。。雨天時には屋内での使用を強く勧める。屋外での使用は法的問題に発展する場合がある。'
    tidesurge_leggings: '夕焼けの海のように輝く。干潮時の海のように臭う。'
    tidewalker_soles: '水の上を歩ける。文字通りではない。でも物理学者を苛立たせる程度には。'
    timberfall: '傷が立ったまま残した石化樹を伐採するために格付けされている。かつて人間だった何かに対しても、ほぼ同程度に機能する。'
    timberwolf_legguards: '獣の本能を保持する古い手法で鞣した森狼の革の脚甲。着用者は群れ、夜の狩り、地図にない領土のはかない映像を時々受け取る。たいていは重要な会議の最中に。。長期使用者の中には狩りの夢を見ることに慣れすぎて、現実とを混同し始める者も出てきた。'
    tin_cap: '頭脳と引き換えに頑丈さをくれる小さなドーム。自分の名案より長生きできる。'
    titan_bear_moss: 'タイタンベアの生きた毛皮に生えた苔。何世紀もの頂点捕食者のエネルギーが注入されている。ドルイドは野生化する。'
    titan_koa_greaves: '巨躯コアの丈夫な皮を脛当てに仕立てたもの。膝を曲げると鳴く。'
    titan_koa_lance: '三度の冬を墓の境界に立てられた。今も同じ方角を指す。'
    titan_koa_stompers: '静けさではなく泥のために作られた。縦隊が静かである必要など元よりない。'
    titan_koa_warspear: ''
    titan_shell_hauberk: '煮て叩き延ばされた。以前これを纏っていた物の臭いがまだ残る。'
    title_veteran: "Press this searing brand against your flesh to prove you're a veteran and it'll be granted to you for life — because nothing says 'battle-hardened warrior' like voluntary third-degree burns."
    tokek_paw: 'トケック・ヤモリの切り落とされた足。まだかすかに温かく、何もない空間を掴もうとしている。'
    tome_of_elemental_spite: ''
    tome_of_oblivion: '最終章は、ヴォイドモスが文の途中で存在をやめる時に残す塵によって、読みながら自ら書かれていく。批評家たちは、少なくとも結末は誠実だという点では一致している。'
    tool_herbalist: '農業ファッションの頂点。目指しているのが『泥まみれの絶望』ってルックなら、の話だけど。'
    totem_club: '生者の誰にも読めぬ symbols が刻まれている。十分強く殴れば、勝手に意味が伝わるようだ。'
    training_battleaxe: '鋭い刃のない致命的な欠点なしに本物の斧の重さとバランスをシミュレートする硬化木材の訓練用戦闘斧。正しいフォームを学ぶのに理想的だ。教官は訓練という言葉にこだわる。新兵たちは定期的にそれを忘れる。。訓練中に骨折した事例が十件以上あり、指導者は訓練用という言葉の意味を繰り返し説明し続けている。'
    training_helmet: 'そよ風と強い言葉の侮辱から守る。実戦防御力：理論上。'
    tremor_brew_of_nine_faults: '体力を回復し、両手に微弱な震えを恒久的に取り付ける。差し引きプラスだと言い張っている。'
    tremor_crest_of_fifth_breach: '常にかすかに震えている。一週間もすれば気にならなくなる。それが問題なのだ。'
    tremor_fists_of_nine_faults: '一撃を与え、そのあとに余分な震えが来る。その余分はオフにできる機能ではない。'
    tribal_cudgel: '力だけでなく型まで審査するという精霊を宿すトーテムの護符で包まれている。伝え聞く限り、精霊たちは一向に感心していないらしい。それでも棍棒の威力は、彼らの評価とは無関係に変わらない。'
    tribal_summoner_totem: 'リズミカルな打撃のシステムを通じて祖先の霊と通信する部族の召喚トーテム。霊は応答する。必ずしも求めたものではないが、応答する。召喚したものと得たものの違いが、その部族全体の口伝の伝統を形成している。。伝承によれば、正しい音程と力加減を守った場合のみ望む霊が現れるとされているが、正しい音程を知る者は今では誰もいない。'
    tribal_totem: '残存する力でパチパチと音を立てる彫刻された骨のフェティッシュ。首長はこれを戦いに持っていった。役に立たなかった。'
    truelength: '鍛冶屋自身の前腕を基準に測られた、彼と共に失われた単位。この剣だけが唯一の写しとして残る。'
    truestrike: '傷痕は狙いよりも信念に報いると教えられた巡礼者たちが振るう。だが刃は毎回、静かに異を唱える。'
    truffle_essence_compound: ''
    tusk_bludgeon: 'タスクレットの牙で作った棍棒。タスクレットは自然死した。当然あなたが原因だ。'
    tusk_buckle_belt: '生物の牙から削られた留め金を持つベルト。留め金は数人の所有者、生き残るはずのなかった戦闘、少なくとも一つの火災を生き延びた。破壊不可能な物体の退屈な静けさで存在し続けている。。過去三代の所有者が試みた廃棄は全て失敗し、それぞれ別の理由でベルトが手元に戻ってきた。'
    tusk_ivory: 'イボイノシシの牙からの密な象牙。彫刻師はチェスの駒に整形する、どうやらそれが市場らしい。'
    tusker_musk_gland: '部屋、建物、または小さな地区を一掃できる臭いを生産する。錬金術師はフェロモンを抽出する。'
    twine_belt: '道端に生えていたもので編まれたベルト。純粋な意地と、どの教科書にも載っていない結び方で繋がっている。保証は付かない。'
    tyrants_gavel: '脱走兵への宣告に用いられた。この湿地にはその類が数多くいた。'
    ukranize_flour: '百度の不作を乗り越えてここまで辿り着いた穀物から挽かれた粉。焼き上がるパンはあまりに頑丈で、ある村ではその残りをひと世代の間、ドアストッパーとして使い続けたと伝えられている。'
    uncertain_bow_range: '距離で射撃する弓だが、距離が実在するかどうかについて議論する。その矢は理論的必然性によってのみターゲットに到達する。'
    underweald_casque: '根の下の層のためのもので、そこでは闇が完全で、兜の唯一の本当の仕事は、天井で自分の頭蓋を割らせないことだ。'
    underweald_charm: '案内人が、下のものを退けると誓う根と骨の結び目。それを確かめに戻ってきた者に試されたことは、ただの一度もない。'
    underweald_elixir_of_fen_below: '下層フェンの底に生えるものから煮出され、よく癒やし、その出どころそのものの味がする。'
    underweald_hauberk_matron: '深淵のマトロンが数百と落とす鱗で重ねられている。豊富に聞こえるが、それを集める者に彼女が何をするかを知るまでの話だ。'
    underweald_hauberk_mire: '決して錆びぬ沼鉄で編まれている。錆び始めるほど乾いたことが一度もないからだ。鍛冶師はその性質を長所として売る。'
    underweald_loop: '下層から来た飾り気のない根の輪で、案内人が、おおよそ『あそこへ下りて戻ってきた』を意味する記章として身につける。'
    underweald_stompers_of_rising_tide: '流れの中で足場を保つよう重みが持たせてある。ここでは地面は提案にすぎず、水は自由にそれを覆せるからだ。'
    ursine_heart: '8キロの重さでまだ温もりを放射している。エンチャンターは保護のアミュレットに束ねる。クマは無料でやっていた。'
    ursine_signet: '徴発書の封蝋に押される。その蝋はいつも上手く固まらない。'
    ursine_totem_club: ''
    velkarion_breath_weapon: 'かつて大火葬壇そのものをかき回した暖炉の鉄棒。あなたの焚き付けの積み方に一家言ある。'
    velkarion_ember: 'ジャム瓶に保管された、竜自身の炎のかけら。これが消えたら、大聖堂を丸ごと点け直すことになる。'
    velkarion_key: '大火葬門には九つの錠と六つの封印と、たった一本の鍵。堂守はそれを、あなたの想像どおりの場所にしまっている。'
    venom_band: 'この被膜を安定させた錬金術師は、それを証明するために指を二本失った。効く。'
    venom_battleaxe: 'この刃に塗られた蜘蛛の毒が加える実際のダメージはごくわずかだ。相手が刃の色に気づいた瞬間の表情の方が、実際の仕事の大部分をこなしている。'
    venom_belt: '三度の失敗した解毒剤と、非常に辛抱強い一人の司祭がこの裏地を安定させた。'
    venom_concentrate: '毒塗り武器や、いくつかの後悔だらけの酒場の賭けに使われる精製毒。'
    venom_gland: '毒でぱんぱんに膨らんでいる。一刺しで、その夜は「冒険」から「治療師との交渉」に変わる。'
    venom_legguards: '染み込んだ毒は、あなたに限っては技術的にはおそらく無害とされている。'
    verdant_aloe: ''
    verger_teaspoon: '堂守の幸運のティースプーン、麻ひもの輪つき。これで紅茶をかき混ぜると、一分が礼儀正しく待ってくれる。'
    vitrified_casque_of_rising_hymn: 'それでも爆発したティーポットのために編まれた。頭を給仕適温に保つ。'
    vitrified_chausses: '仕立て屋を二度なだめる必要があったほど細い裁断。ひざまずくことは思い出になった。'
    vitrified_cord: '母の言いつけどおりの固結び。これをほどくところから事故は始まる。'
    vitrified_crown: '一度の落雷で融けて固まった。かぶると、束の間、選ばれた気がする。その気分は嘘だ。'
    vitrified_edge: 'ガラスが砕けぬよう、ゆっくり冷ました。忍耐は残し、慈悲は失った。'
    vitrified_elixir: '塩水と頑固さ。聖歌隊はこれを信奉している。以前より一オクターブ高い声で。'
    vitrified_glaive: '大火葬壇の上でパンを焼いても眉毛を完全には失わずに済む長さ。完全には。'
    vitrified_lattice: '溶けた糸が凍った網。太い部分を持て。細い部分はこちらを掴んでくる。'
    vitrified_stompers: '一歩ごとにグラスを弾いたように鳴る。あなたは常に、自分の存在を告げている。'
    vitrified_tear: '火山の都合で冷まされた板ガラス。気泡は「味」と呼ばれている。'
    vitrified_vambraces: '鎧ではない。意思表示だ。この大聖堂の誰かが、これから磨き上げられる。'
    void_anchor_belt: '足元が崩れる地面で踏ん張るために重りが仕込まれている。沼は常に崩れる。'
    void_distillate: '虚無の家族の残骸から抽出された液体の無。長く見つめると実存的不安と軽い吐き気を引き起こす。'
    void_eye_lens: 'ヴォイドアイの結晶化したレンズ。並行次元を見る。そのほとんどはなぜかこれより悪い。'
    void_eye_talisman: '夜更けの墓の境界を見張るために研かれたレンズが嵌め込まれている。'
    void_grips: '陽の光を知らぬ水に染まった指先。その染みは洗っても取れない。'
    void_oracle_staff: 'あらゆる未来を見通す。その大半でお前は死ぬ。それでも見せてくる。'
    void_shard: '物理的な形を与えられた無の断片。長く見すぎると鼻血と哲学的危機を引き起こす。'
    void_shepherd_club: ''
    void_treads: '一歩ごとにわずかに沈み、綺麗に抜ける。沼はまだこれを捕らえる術を知らない。'
    void_whisper_bow: '到達するまで存在しない矢を放つ。量子弓術には免責事項が必要だ。'
    voidbake_tablet: '他の何物でもなくなるまで火葬の穴で焼かれた。冷める前に鍛冶師が押し延ばす。'
    voidcleave: '各打撃が視覚的空間に一時的な亀裂を残す刀身——現実ではなく、外見のみに。効果は閉じる前に約三秒間持続する。敵を心理的に不安定にするには十分だ。虚空の鍛冶師が求める価格を正当化するには不十分だ。。空間の亀裂から何かが覗いているように見えたという証言が七件あるが、それを証明するものはまだ存在しない。'
    voidgazer_crown: '見張り続けてすり減った覗き穴から見る。沼もまたこちらを見ている。'
    voidpierce_stilettos: 'ヴォイドモスがそれと気づくよりずっと後まで、甲殻の板の間にすり抜けられるほど細く研ぎ澄まされている。他の大抵のものにも、同じように警告を意に介さず通用する。'
    voidpiercer_bow: '矢がエネルギーバリアを避けるために一時的に虚空の空間を通過するため、魔法の盾を魔法が存在しないかのように通り抜けるロングボウ。この特性を発見した魔術師たちは最初自分たちの盾が欠陥品だと思った。。防御魔法の専門家がこの弓の存在を知った時の反応は、怒りよりも純粋な技術的感嘆の方が勝っていたという。'
    voidpiercer_spear: '次元間の虚空を貫く。異次元バーベキューのケバブにも便利。'
    voidreaver_greatsword: ''
    voidreaver_longsword: ''
    voidstaff_nihil: '結晶化したヴォイドモスの静寂——一回の羽ばたきと次の羽ばたきの間にある、その特定の静けさ——から彫り出された。技術的には起きなかったことになる呪文を唱える。税務署はこれに強い意見を持っている。'
    voidwalker_boots: '縫われたのではなく、無の一片から次の一片へと踏み渡ることを覚えたヴォイドモスの脚に生えたものだ。副作用として耳のかすかな唸りと、何かを忘れたという拭えない感覚がある。'
    volatile_extract: '可聴振動する不安定な試薬。慎重に扱うか全く触れないか。'
    walker_belt: 'おしゃれといえばおしゃれ、ただしお手本がほろほろ死体の場合に限る。'
    walker_hat: '前の着用者の頭部がまだ中にあるが、兜そのものより遥かに劣った状態だ。'
    wallbreaker: '壁そのものを構成する石材にも通用する等級付けがされている。それは理論上の話ではなかった。それを証明する穴が実在する。'
    war_barrow_key: '二度と開くはずのなかった錠のために削られた。'
    warden_spear: '苗木の番人が持つ儀式用の槍。転用された暴力を、クィーベックは今も完全には許していない。'
    warlord_plate: '年代不明の甲冑から切り出された。その鱗紋様は記録のどれとも一致しない。'
    warped_staff: '乾燥が不十分で永続的なねじれが生じている。魔法を予測不能な形で導くが、それが主な欠陥なのか唯一の美点なのかは見方次第だ。呪文はあなたが望む場所ではなく、呪文自身が望む場所へと向かう。制御は幻想に過ぎない。'
    water: '純粋で清涼な水。喉の渇きを癒し、体から不純物を洗い流す。大半の液体があなたを殺そうとするこの世界では、非常に貴重な物質だ。持ち運びは重いが、その価値は重さを大幅に上回る。持ち運びは重いが価値は重さを大幅に上回る。'
    waxseal_wafer: '薄く結晶質で、硬化した瞬間に気密になる。職人たちはこれを溜め込み、何も認めない。'
    weald_heartplate: '詰まった苔の芯の周りに樹皮として育ち、生木がそうあり続けるようにいまだ温かい。巨躯熊は、これとよく似た形の毛皮を一片欠いている。'
    weald_knot_belt: 'ウィールドの案内人が安全な道筋を記すのと同じ根結びで結ばれている。その結びがこれほど深くでもまだ意味を持つのかは、別の問いだ。'
    wealdwarden_halberd: 'ウィールドの群れが単独では試さぬほど敬う者が携える。単独での使用は理論上可能だ。ウィールドは勧めない。'
    weaver_daggers: '蜘蛛の絹腺を仕込んだ刃。毒はゆっくり効くが、後悔はすぐにやってくる。'
    weaver_silk_vest: 'ほぼ見えないほど細かく織られたウィーバー絹のベスト。仕立屋は二倍の料金を請求した。曰く「ここに存在しないと証明することはできない」とのこと。見えないからこそ高い、という逆説的な価格設定である。洗濯物に紛れて失くす者が後を絶たないのも、同じ理屈で説明される。'
    weaving_solution: '戦闘級の酷使に耐えるよう繊維を強化する。仕立て屋は本格的な縫製前に全ての糸をこれに浸す。'
    weighted_club: '誰かが空洞の丸太に石を詰め込んでそれをエンジニアリングと呼んだ。機能する。哲学者たちは意図だけで道具を定義できるかどうか議論するが、砕けた頭蓋骨はしない。定義を議論する能力を失っているからだ。定義を議論する能力を既に失っているためだ。'
    welcome_doormat: '足首にくくりつけた剛毛のマット。世界が拭いつけてくる全てを吸い込み、それでも「ようこそ」と言うのだ。'
    wheat: '平和な農夫たちは何時間もかけてこの穀物を収穫するが、一週間後には兵士たちが攻城用の薪として燃やしてしまう。農夫と兵士の間に存在する、この永遠に繰り返される悲劇の循環は誰も止めようとしない。農夫と兵士の悲劇的な循環は誰も止めようとしない。'
    wheat_barley: '淡い緑の大麦の慎ましい束。その粒は、パンか酒の約束に満ちてふっくらと膨らんでいる。'
    wheat_burnt: '炎に黒ずんだ一握りの穀物。黄金の約束は木炭と苦い記憶へと変わった。'
    wheat_draconize: '竜に焼き尽くされた畑の灰の中で育った小麦。焼けた土地から何か形容しがたいものを吸収している。これを使うパン職人は、何週間もオーブンの調子が良くなると報告する。なぜかは誰も深く調べようとしない。なぜかは誰も深く調べようとしない不思議な現象だ。'
    wheat_flour: '小麦粉。生の穀物と食べられるパンの間の工程で、文明人とそれ以外を分けるもの。触れたあらゆる表面を覆う。それが小麦粉の唯一の真の意志だ。調理人たちはこれを「拡散への欲望」と呼ぶことがある。調理人たちはこれを拡散への欲望と呼ぶことがある。'
    wheat_malt: '丁寧に発芽させ乾燥させた小麦。穀物の錬金術師だ。単純なものを複雑に、淡白なものを風味豊かに、水を飲み物へと変える。飲む価値のあるものすべての基礎であり、それを理解する者は生き方を知っている。それを理解する者は人生の本質を理解しているといえる。'
    wheat_purple: '数百年にわたって魔法が土壌に染み込んだ地域で育つ紫がかった小麦の品種。生産される粉はわずかに奇妙な特性を持つパンを作る。誰もそれが具体的にどんな特性かを定義できていないが、再び買い求める者は多い。再び買い求める者が多いという事実が全てを語る。'
    wheat_suize: 'デルタの湿地帯で栽培された小麦。周囲の湿気を非常に効率よく吸収するため、収穫物は決して完全に乾かない。粉屋は触れることを拒む。醸造家は通常の三倍の値を払う。その差は需要と供給が生み出す残酷な現実だ。その差は需要と供給が生み出す残酷な現実を示している。'
    wheat_tanjirize: 'やや野心的すぎる魔法使い農夫が開発したハイブリッド品種。通常の小麦の二倍の速さで育つが、収穫後も頑固に成長を止めることを拒む。サイロが問題を抱えており、隣の畑の農夫たちからの苦情が絶えない。苦情は年々増えており終わりが見えない状況だ。'
    wheat_ukraine: '抵抗が千年の伝統である土地の黄金の穂。戦争を知る手によって蒔かれ、それに負けることを拒んだ手によって収穫された。その粉は多くの鋼よりも強い。大地の記憶が粉の中に宿っているとも言われる。大地の記憶が粉の中に宿っているとも言われている。'
    wheat_white: '長い冬の保存に耐えるよう、古代の銘で祝福された高地の収穫物。'
    whisker_bundle: '六本のフェランの髭。どれも精密な器官で、フェラン自身は返してほしいと強く思っている。'
    whisker_weave_belt: '六匹のフェランが不本意ながら提供した帯。誰一人として人前で着けはしないだろう。'
    whittled_shortbow: '退屈な見張り番の最中に削り出した。弦は編んだ草でできている。短距離の定義について楽観的であれば、短距離では効果的だ。作った弓師が考える時間をたっぷり持っていたことは明らかで、その成果がこれだ。その成果がこれだということを誰も否定できない。'
    widow_club: '衝撃で硬化する寡婦蜘蛛の糸で巻かれている。蜘蛛は自発的に糸を提供したわけではない。'
    widow_fang_daggers: '二匹の寡婦蜘蛛から取った牙。いまだに仲が悪い。'
    widow_thread: '紗のように薄く、馬鹿げた強度を持つ。分別を四段階も超えた獲物を食らう何かが紡いだ糸。'
    widows_kiss_daggers: ''
    wildling_bow: ''
    wildling_shortbow: 'ワイルドリングの野営地から盗んだ。持ち主には相談していない。'
    wildling_spear: ''
    wildlord_club: ''
    wildlord_war_girdle: '点呼のたびに締められる。まともな理由で締められたことは一度もない。'
    windfire_cuirass: '火と風、どちらの適性にするか決めかねている。背中は焼け、正面は凍える。絶えず身をすくめる衝撃はあらゆるものを削るが、立ち続ける意志だけは削れない。'
    windshear_loop: '逃げようとするかのように指の上で自由に回る。エンチャントは正常に動作している。'
    windslicer_gloves: '約束のように薄く、言い訳のように速い。器用な指にぴったり。'
    windstrider_sandals: '水が素早く抜けるほど開いている。重い長靴より濡れた足は早く乾く。'
    windwalker_vest: '縦隊の歩調に遅れぬほど軽い。行軍鼓手はこれより重い物を纏わなかった。'
    wisdoms_embrace_gauntlets: '署名の前に必ず二度、徴発品を数えた。そうした癖はなかなか消えぬ。'
    wither_concentrate: '最も深い沼の腐敗から瓶詰めされた。栓は兵站将の元まで持たぬことが多い。'
    wither_pastry: '自分以外の有機物を腐敗させるペストリー。錬金術師が壊死試薬として使う。'
    wither_petal: ''
    witherbloom: '腐敗の最後の瞬間にのみ満開の壮麗さを見せる花で、花弁は芝居がかったタイミングで開き、劇的なものへの才能を感じさせる。詩人たちはこの花に丸ごと哀歌を捧げるが、錬金術師は分解速度を冷静に記録するだけである。'
    wizard_staff: '杖に偽装されている。先端の炎はあまり説得力がない。'
    wolf_fang_blade: '刃に狼の牙が埋め込まれた剣。狼は志願しなかった。'
    wolf_pelt: '厚い森のオオカミの革。暖かく、丈夫で、馬を深く不安にさせるかすかな麝香を帯びている。'
    wolf_sinew: '弾力があって丈夫。弓師はこれに最高の金を払う。この件に関するオオカミの意見はもう関係ない。'
    wolf_sinew_band: 'アルファウルフの腱を編み込んだ指輪。過ちを犯しそうになるたび、ほとんど気づかぬほどわずかに締まる。'
    wolf_sinew_belt: 'アルファは自発的に腱を差し出さなかった。もっともアルファが自発的に差し出すものは暴力以外にないが。少なくとも今回は、ズボンを支えるという穏やかな用途に転用された。死後の役目としては、驚くほど平和的である。'
    wolf_trek_boots: 'パンドラが差し向けたどの狩人よりも歩き続けた、一匹の狼のものだった。'
    wolfbone_blade: '柄は森の狼の大腿骨から彫られている。強風の中で遠吠えするが、それは敵が騒音に気を取られるという疑わしい論理によれば戦術的利点だとされる。実際に試した者の報告は分かれている。実際に試した者の報告は二つに分かれたままだ。'
    wolfcrest_helm: '正面を見つめる剥製の狼の頭が冠に付いており、ある者には威圧的に、ある者には哀れに見える表情をしている。狼は明らかに処置の前のほうが尊厳があった。ヘルム自体はそのことを知っているようだ。ヘルム自体がそのことを十分に理解しているようだ。'
    wooden_greataxe: '武器というより柵の柱。破片がダメージの半分を与える。'
    wool_fists: '家畜の副産物を武器化したもので敵を殴るほど、『必死の暴れん坊』を物語るものはない。'
    woolame_old: 'ウーリガンの消化管の輝く深淵から回収されたこの刃は、胃酸を生き延びた独特の輝きを帯びている。'
    woolamu: '紡がれた羊毛のこの束は胸を温めてくれるが、戦場では何の役にも立たない。せめて、着る者は暖かく死ねるだろう。快適さと有用性は必ずしも同じ方向を向いていないことの典型例だ。快適さと有用性は必ずしも同じ方向を向いていないことの典型例だ。'
    woolano: '機械洗いできる宝石を好む勇者にぴったりのアクセサリー。'
    wooliboots: '床板から忍び寄る寒さと、ドアから逃げ出した尊厳に最適。'
    wooligan_hammer: 'ウーリガンは草を平らにするのに使っていた。あなたはもっと創造的な用途を見つけた。'
    wooligan_hat: '頭は確実に暖かいが、中身の脳みそは残念ながら温まらない。'
    wooling_fleece: 'まったく同意していない子羊から引きちぎった脂っこい羊毛の房。後悔と納屋の床の臭い。'
    wooling_practice_bow: 'ウーリングの腸で弦を張った。ウーリングの犠牲は不本意だが感謝されている。'
    worldbreaker_battleaxe: ''
    worldheart_striders: '亀裂の最も深い部分から引き出された何かで底が張られ、いまだかすかに脈打っている。その律動を心臓の鼓動と正確に重ねた者はいないが、否定した者もいない。'
    worldsplitter: '伝説では最初の試し振りが峡谷を作ったという。伝説は誇張しているが、ほんの少しだけ。'
    worldwound_brew_of_closing_age_genesis: '錬金術師が何も書き留めなくなる前に記された最後の処方の一つ。効く。理由を説明した欄外の書き込みは、現存しない。'
    worldwound_brew_of_closing_age_scar: '創傷が振りまく類の傷、つまり誰も生きて帰れると思わない傷に耐えるまで煮詰められている。今では、生き延びる者もいる。'
    worldwound_carapace_of_world_wound: '鍛えたのではなく、創傷自身が始めて決して仕上げなかった殻から育った。隙間はまさに、創傷が興味を失った箇所にある。'
    worldwound_circle_of_closing_age: '最後の数年、宝飾師が己の作に署名するのをやめた頃に鍛えられた。その名を読む者が残っているのか、誰も確信が持てなかった。'
    worldwound_circle_of_world_wound: '一本の創傷金属の繊維から曲げられた輪。継ぎ目なく閉じられ、どこから始まったのか見分けがつかない。金属にはわかる。そしてそれを恨んでいる。'
    worldwound_edge: '傷痕が初めて開いたとき、現実が裂けたその同じ線に沿って引かれた。傷は切り口が残した形を覚えている。刃はその傷を覚えている。'
    worldwound_fists_of_closing_age: 'あらゆるものの終わり際に鍛えられた。鍛冶師が装飾をやめ、保つものだけを作り始めた頃だ。これらは保つ。'
    worldwound_fists_of_world_wound: '拳頭が創傷硝子で覆われ、一撃ごとに少しずつ剥がれ落ちる。敵にとっては不穏だが、それ以外の全員には許容範囲の摩耗と見なされている。'
    worldwound_pendant: '創傷そのものの一片を収め、創傷の神託が他のすべてを封じるやり方で — 慎重に、そしてそれが保つという確信もさほどなく — 封じられている。'
    worldwound_warboots_of_closing_age: '創傷の滑りやすい縁を掴むよう底が張られている。そこでの一歩の踏み外しは、都合よく、君が気に病む最後の一歩でもある。'
    wound_key: '創傷の神託が傷痕の中心に封じているものの周りに溶接されている。回すというより説得するもので、しかもほんの束の間だけだ。'
    wound_marked_composite: '創傷の印を端から端まで帯びた積層素材で、切っても決して印は消えない — ただ二つになるだけだ。'
    wound_marked_elixir: '縫合の司祭が自分たち用に取っておく飾り気のない版で、巡礼者向けの演出はない。味は悪く、効きは速い。'
    wound_marked_elixir_of_origin_line: '縫合の司祭が自らの仕事の滲出液から蒸留したもので、彼らは無害だと言い張り、証明のために自分で飲む。今のところ、まだ彼らは生きている。'
    wound_marked_greataxe_of_final_scar: '鍛冶師が触れる前から、創傷がつけた刻みを帯びている。鍛冶師はその刻みを避けて仕事をした。理由あってそこにあるのだ、という賢明な読みで。'
    wound_marked_lattice_genesis: '傷痕ではなく山で最も古い噴気孔で育てた同じ格子で、そこではより澄んで仕上がり、職人いわく、それをどこか得意げにしている。'
    wound_marked_lattice_scar: '傷痕の縁に沿って育つ脆い骨格で、そこでは職人が望もうと望むまいと、結晶が亀裂の形をとる。'
    wound_marked_loop: '一度だけ創傷に触れられ、自身の傷痕を負って残った。指輪はそれを、たいていの持ち主よりも優雅に身につけている。'
    wound_marked_vambraces_of_origin_line: '創傷がかすめたものすべてに残すのと同じ印が刻まれている。鍛冶師がわざわざ加えたもので、創傷はそれを不要かつやや無礼だと感じた。'
    wound_pilgrim_boots: '創傷への長い登りのために、そしてより稀に下りのために底が張られている。ほとんどの一足は片道しか果たさない。'
    wound_salve: '傷痕自身が閉じようとしない裂け目に詰め込むもので、傷痕が自ら負わせた傷のために作られた。軽い傷にも効くが、それがこの品に含まれる唯一の慈悲だ。'
    wound_ward_bow: '傷痕の亀裂線をこれ以上広げずに矢を放てるよう張られている。壁の断片が例外なく課す規律だ。'
    woundstitch_grips: '縫合の司祭が、天頂の高度で縫い目を保つもの、つまりごくわずかで長続きしないものから縫い上げた。'
    woundwall_pike: '巡礼者が越えることを許された最後の壁沿いに立てられ、武器というより境界標だ — 誰かがそれでも越えようとするまでは。'
    wraith_banner: ''
    wraith_boots: '一歩ごとに、二つの位相が同時に鳴り響く。両方の隣人が正式な騒音苦情を提出しており、珍しいことに、両方の苦情の内容は細部まで一致している。'
    wraith_crowned_helm: '王冠は今も前の持ち主の最後の思考で振動しており、その大半は後悔だとわかっている。いくつかは奇妙に具体的で、彼が最後まで書き終えられなかった買い物リストに関するものだ。'
    wraith_grimoire: '死者たちの借りを記す帳簿。自動で更新され続け、決してあなたに有利には働かない。'
    wraith_lantern_shard: '亡霊がどこを漂うにも携えているランタンから砕け落ちたもの。中の炎はかつて一度も火だったことがない――それは記憶であり、記憶というものは、思いのほかずっとゆっくりと燃えるらしい。'
    wraith_lantern_staff: '身廊石の亡霊たちが船頭を安全な道から誘い出すために使う灯りを頂く杖。今も冷たく燃え、今も効く。'
    wraith_scripture: '誰も見ていないときに自ら書き記す本で、その筆跡は読む者ごとに変わり続ける。研究した学者たちは、それが魅惑的なのか、それとも個人的に深く不穏なのか、意見が一致しない。たいていはその両方である。'
    wraith_spellbook: 'あの世の接客対応について、非常に強い意見を持つ誰かが記したもの。'
    wraith_touch_gauntlets: '触れるものすべてが、かすかに、丁重に死んでいく。酒場の常連たちに言わせれば、あなたの恋愛事情とだいたい同じ効果らしい。ただし今回は、少なくとも身に着けられる形をしている。'
    wraith_whisper_amulet: '半透明のペンダントが、ほとんど聞き取れそうな言語で何かを呟いている。前の持ち主はただ一語だけ訳して、慌てて売り払った――「背後」。それ以来、誰も二語目を求めていない。'
    wraith_whisper_knives: '亡霊のエクトプラズムで焼き入れされ、鎧を綺麗に切り裂く。眠りも切り裂くが、こちらはやや不完全に。傷はきちんと塞がると、被害者たちは口を揃える。夢の方は、決して完全には塞がらない。'
    yajin_starter_dagger: 'ヤジンの双刃はかつてのような輝きを失い、無数の失敗した暴力の試みによって刃が鈍っている。'
    yeast: '肉に潜り込み、決して離れない悪性の寄生菌の株。'
    yeast_cake: '野心と換気不良の匂いがする発酵ケーキ。職人は工業用シーラントとして使う。'
    yeti_frostbite_daggers: '吹雪の最中に切り取られたイエティの爪。斬るたびに寒気のおまけ付き。'
    yeti_fur_tuft: '新雪のように白く、罪悪感のように温かい。イエティにはもう必要なかった。本人がそう言い張っている。'
    yeti_jawbreaker: '顎に何をするかで名付けられた。かつて顎を持っていたものから作られた。'
    yeti_scalp_hood: '間違いなく、おそらく、ほぼ確実に実在した何かの匂いがする。'
    yeti_skull_crown: '空洞化したイエティの頭蓋骨を王冠として被る。元の持ち主は直接、大声で抗議しに来た。'
    yetihide_stompers: 'イエティの毛皮で裏打ちされたブーツ。魔法の特性のためではなく、濡れたイエティの匂いがする人間に近づきたい者がいないため、足を温かく保ち敵を遠ざけることが保証されている。悪臭も戦術の一つだ。悪臭も立派な戦術の一つだということをこれが証明する。'
    zenith_alloy: '山で最も高い炉でしか成らない合金。空気は薄く、鍛冶師はそこでこそ、合金が己に逆らうのをやめると誓う。下界の何ものも及ばぬ切れ味を保つ。'
    zenith_crown: '砕けた頂を、登攀に命を絶たれるまでに最も高くまで登った巡礼者がかぶる。今の持ち主が考えたくないほど何度も、かぶる頭を替えてきた。'
    zenith_greaves: '砕けた頂の登攀に耐えるよう板金され、たいていの巡礼者の膝が真っ先に折れる箇所で関節が補強されている。'
    zenith_signet: '亀裂の前に、真の天頂に立った者として持ち主を示す — 今生きている者の誰一人として、まさに肯定も否定もできない主張に基づいて。'
    zenith_staff: '傷痕が残りを奪う前の、天頂本来の頂の欠片から削り出された。まだ立っているものへと的確に指し示す。'
    zenithscar_draught: '傷痕沿いに淀む雪解け水から汲まれる。待てば澄み、急げば濁る。ここで飲む者はたいてい急いでいる。'
    zenithscar_draught_of_summit_vigil: '歩哨を、その静かな部分なら眠って過ごしたい番の間じゅう起こしておくほど苦い。歩哨の望みも敵の望みも、どちらも顧みない。'
    zenithscar_fangs: '同じ亀裂の相対する壁で研がれた二振りの刃。だから決して完全には平行にならない。その隙間が、君が認めたくない仕事をこなす。'
    zenithscar_greatblade: '世界が割れたまさにその継ぎ目に沿って均衡が取られ、どちらへ倒れるべきかを常に心得ている。たいていは誰かの上に。'
    zephyr_legwraps: '何も履いていないかのように軽い。何も履かないのも選択肢だが、防御力は落ちる。'
    zephyr_silk_strand: '風が注入された自力で浮く絹糸。仕立て屋は大好き。その猫は個人的な敵とみなしている。'
    zukin_muru: 'A shinobi cowl for people who want to look like they left quietly, even when they slam the door.'
