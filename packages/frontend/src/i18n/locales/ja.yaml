    stat_vitality: 体力
    stat_vitality_desc: ポイントあたり最大HP+1
    stat_wisdom: 知恵
    stat_wisdom_desc: 獲得XPボーナス
    stat_strength_desc: 地ダメージのスケーリング
    stat_intelligence_desc: 火ダメージ、回復スケーリング
    stat_chance_desc: 水ダメージ、戦利品増加
    stat_agility_desc: 風ダメージのスケーリング
    derived_formulas: 派生計算式
    max_health: 最大HP
    loot_desc: 各ドロップエントリーには独自の固定確率があり、モブが死亡したときに個別にロールされます。数量はエントリーの範囲内でランダムです。
    stat_rolling: ステータスロール
    stat_rolling_desc: 各ステータスはテンプレート範囲内で均一にロールされます。すべての値が等確率です。
    archimobs: アーキモブ
    archimobs_desc: 代わりにそのモブのアーキモブとして出現する確率0.5%——名前を持つ、永続的に強化されたバリアントです。モブが持つ唯一のレア度システムです。
    max_members: 最大メンバー数
    groups_desc: パーティーは最大{{max}}人で構成される共有名簿で、リーダーが選出されます。パーティーを組んでいるだけでは戦闘において何の効果もありません——パーティーの有無にかかわらず、全員が自分自身の参加トランザクションを送って戦闘に入る必要があり、自動参加や近接による参加はありません。
    groups_xp: XPの分配
    groups_xp_desc: 勝利した戦闘の合計XPは、参加した全戦闘員に均等に分配され、その後各プレイヤー自身の知恵とモブ集団の経過ボーナスがさらに適用されます。個人が与えたダメージ量は取り分に影響しません。
    groups_loot: 戦利品の分配
    groups_loot_desc: 戦利品は分割されません。勝利した各戦闘員は自分自身の幸運ステータスを使って、モブ集団の戦利品テーブル全体を個別に判定します——パーティーが大きくても誰の確率も下がりません。
    dungeons_desc: ダンジョンはそのワールド内のどこからでも鍵を使って入場できます——グループインスタンスはなく、中にいる鍵所持者全員が同じ空間を共有します。オープンワールドと同様です。
    dungeon_entry: 入場
    dungeon_entry_value: 鍵アイテム、ワールド内のどこからでも
    dungeon_instance: インスタンス
    dungeon_instance_value: 共有——鍵所持者同士がお互いに見える
    dungeon_completion: クリア
    dungeon_completion_value: すべての部屋をクリア
    dungeon_reward: 報酬
    dungeon_reward_value: 標準の戦利品分配
    classes_desc: 12クラス。武器は共通化されています——どのクラスもあらゆる武器タイプを装備・使用できます——ただし自分のクラス用に設計された武器を使うとダメージとクリティカルダメージが+10%になります。各クラスはレベルアップに伴い、決まったレベルで呪文を解放します。
    table_class: クラス
    table_weapon: 適性
    table_hp: HP
    role_warrior: ウォリアー
    role_assassin: アサシン
    role_berserker: バーサーカー
    role_druid: ドルイド
    role_chronomancer: クロノマンサー
    role_guardian: ガーディアン
    role_archer: アーチャー
    role_prospector: プロスペクター
    role_brawler: ブロウラー
    role_tomoda: Tomoda
    role_gambler: ギャンブラー
    role_healer: ヒーラー
    weapon_longsword: ロングソード
    weapon_daggers: ダガー
    weapon_battleaxe: バトルアックス
    weapon_spear: スピア
    weapon_staff: スタッフ
    weapon_spellbook: スペルブック
    weapon_bow: ボウ
    weapon_axe: アックス
    weapon_mace: メイス
    weapon_club: クラブ
    weapon_sword: ソード
    marketplace: マーケットプレイス
    marketplace_desc: 装備とキャラクターは好きな価格でキオスクに出品でき、購入者は即座に支払います。資源はリスティングなしでスワッププールを通じてSUIと交換されます。すべての販売に10%のロイヤリティがかかります——マーケットプレイスが唯一の売却手段です。
    section_forgemagie: フォルジュマジー
    forgemagie_desc: フォルジュマジーはルーン製作システムです。装備を破壊してルーンに変え、そのルーンを他の装備に適用してステータスを変更します。装備を完璧にするためのハイリスク・ハイリターンのエンドゲームシステム。
    crushing: 粉砕
    crushing_desc: 粉砕されたアイテムの各ステータス行は独立して判定されます——高いステータス値と重いステータスほど多くのルーンを生成します。サーバーは存在しません。生成数の除数は、アイテムレベルごとの固定カーブと、アイテムテンプレート自身のtaux（粉砕そのものがそのテンプレートでは下げ、同じ帯の他のテンプレートでは上げる、共有のオンチェーン・インフレ係数、1%〜4000%）を組み合わせたものです。
    crushing_tiers_desc: ルーンのティア（Ba/Pa/Ra）は確率的に選択されます。高いステータス値はRaルーンを優遍します。
    rune_tiers: ルーンティア
    rune_ba: ティア1：ルーンあたり最低ウェイト
    rune_pa: ティア2：ルーンあたり中ウェイト
    rune_ra: ティア3：ルーンあたり最高ウェイト、経験値2倍
    rune_weight_desc: 各ルーンのウェイトは、その値にステータスの単位ウェイトを掛けたものです。ウェイトは自動計算されます。
    rune_table_stat: ステータス
    rune_table_note: 範囲、移動、行動のルーンはそれぞれ1回のみ適用可能。クリティカル率は最大10回まで。クリティカルとクリティカル結果にはルーンが一切存在しません。
    rune_stat_range: 範囲
    rune_stat_movement: 移動
    rune_stat_action: 行動
    rune_stat_raw_damage: 生ダメージ
    rune_stat_critical_chance: クリティカル率
    rune_stat_earth_resist: 地耐性
    rune_stat_fire_resist: 火耐性
    rune_stat_water_resist: 水耐性
    rune_stat_air_resist: 風耐性
    stat_unit_weights: ステータス単位ウェイト
    stat_unit_weights_desc: 各ステータスには戦闘力を反映した単位ウェイトがあります。重いステータスラインを持つアイテムは粉砕時により多くのルーンを生成し、アイテム予算を多く消費し、オーバーメイジが困難です。
    rune_application: ルーン適用
    rune_application_desc: 任意のジョブでレベル70に達すると解放されます——採集でも製作でも、最初にレベルを上げた方で構いません。ルーンを一つずつ装備に適用してステータスを変更します。3つの結果があります：
    outcome_critical_success: クリティカル成功
    outcome_critical_success_desc: ルーン成功、ステータス損失なし
    outcome_neutral: ニュートラル成功
    outcome_neutral_desc: ルーン成功、他のステータスが下がる可能性
    outcome_critical_failure: クリティカル失敗
    outcome_critical_failure_desc: ルーン失敗、ルーンウェイト分のステータス損失
    success_rate: 成功率
    success_rate_desc: 成功はステータスが最大値にどれだけ近いかに依存します：0%付近では成功率~99%、最大付近では~50%、エキゾチックなステータスはレベルに関係なく~1%です。成功がクリティカル（損失なし）になるかニュートラル（ウェイトを支払う）になるかも同様に変動し、さらにジョブレベル1を超えるごとに小さな+0.2%が加わります。ジョブが扱えるアイテムレベルに上限はありません。
    puits: シンク（ピュイ）
    puits_desc: UIに表示されるウェイトカウンターで、ステータス損失がルーンウェイトを超えたときに蓄積されます。他のステータスが影響を受ける前に将来の損失を吸収します。アイテムがフォルジュマジーワークベンチを離れるとリセットされます。
    over_maging: オーバーメイジ
    over_maging_desc: ステータスを自然な最大値以上に押し上げます。各ステータス行は101の追加ウェイトが上限です。オーバーメイジの最大値はステータスの単位ウェイトに依存します——体力（ウェイト0.2）のような軽いステータスは約505ポイント超過できますが、知恵（ウェイト3）のような重いステータスは約33ポイントしか超過できません。
    forgemagie_tips: ヒント
    forgemagie_tips_desc: エキゾチック/オーバーメイジの場合：まず安いステータスを外してシンクを貯め、バッファがある状態で難しいステータスを通し、その後失ったステータスを戻す（最大値から遠いので簡単）。セッション中にアイテムを移動しないこと。シンクがリセットされます。オーバーメイジとエキゾチックのステータスは失敗時に最初に失われます。
    forgemagie_xp: 経験値
    forgemagie_xp_desc: 経験値は成功時のみ付与されます（クリティカルまたはニュートラル）。高レベルアイテムや重いルーンほど多くの経験値を獲得できます。Raルーンは BaやPaルーンの2倍の経験値を付与します。計算式：max(1, ルーンウェイト × (1 + アイテムレベル / 50) × ティア倍率)、Raの倍率は2、それ以外は1。
    action_points: アクションポイント（AP）
    movement_points: 移動ポイント（MP）
    critical_stat: クリティカル
    wisdom_xp: 知恵によるXPボーナス
    wisdom_xp_desc: 知恵は獲得するすべてのXPを増加させます。知恵600で獲得XPが2倍になり、それ以上は逓減します。
    chance_loot: 幸運＆戦利品
    chance_loot_desc: 幸運ステータスはすべての戦利品のドロップ率を上げます。幸運700で各ドロップ率が2倍になります。ドロップ率が確定（100%）を超えることはありません。
