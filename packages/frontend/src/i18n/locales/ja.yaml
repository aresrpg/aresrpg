    section_classes: クラス
    section_economy: 経済
    combat_desc: 戦闘はグリッド上のターン制です。自分のターンにはアクションポイント（AP）を消費して呪文を唱え、移動ポイント（MP）を消費して移動します。視線（ライン・オブ・サイト）は呪文ごとの設定です——ほとんどの呪文は必要としますが、不要な呪文もあります。ワールドではモブの集団と、コリゼウムでは他のプレイヤーと戦います。ダメージは対応する属性ステータスと生ダメージボーナスに応じてスケーリングします。
    elements: 属性
    element_earth: 地
    element_fire: 火
    element_water: 水
    element_air: 風
    stat_strength: 筋力
    stat_intelligence: 知力
    stat_chance: 幸運
    stat_agility: 敏捷
    critical_hits: クリティカルヒット
    crit_desc: 各呪文や武器には、N分の1で表される固有の基本クリティカル率があります。クリティカルはNを減少させますが、最終的な確率が2分の1（50%）を超えることはありません。
    crit_bonus_desc: クリティカルヒット時、呪文は通常の効果の代わりに専用のクリティカル効果（より強いダメージや追加効果）を適用します。
    blocking: シールド
    blocking_desc: 一部の呪文は、対応する属性の入ってくるダメージを使い切るまで吸収するシールドを付与します。スタミナやガード姿勢はなく、シールドが唯一のダメージ吸収手段です。
    resistance: 耐性
    resistance_desc: 属性耐性は最終ダメージに適用される割合減少で、属性ごとに上限50%です。負の耐性（弱点）は代わりにダメージを増幅します。
    mob_level_bands: モブのレベル帯
    mob_level_bands_desc: 設定されたレベル帯では、HP、XP、素早さ、賢さ、正の耐性、スケール対象の呪文値が60%から160%へ上昇します。APとMPは100%から130%です。負の耐性は逆の曲線を使い、弱点の大きさは最低レベルの160%から最高レベルの60%へ縮小します。
    life_steal: ライフスティール
    life_steal_desc: ドレイン呪文の効果はダメージを与え、対象が実際に失った体力の半分だけ詠唱者を回復します。回復するのはプレイヤーのドレインだけで、同じ呪文を唱えたモブはダメージを与えるだけで回復しません。
    life_steal_note: ダメージはまず標準のダメージ計算式を通り、その後詠唱者は本来の対象が実際に失った体力の半分を回復します。他の戦闘員へ転嫁された攻撃や、対象が回復に変換した攻撃では何も奪えません。
    chatiment: チャティマン
    chatiment_desc: チャティマンは、致死に至らず実際に失ったHPを対応する能力値へ変換します。行動中の戦闘者のターンごとに上限があり、後のターンのボーナスは別々に5ターン持続します。モンスター由来のダメージは全量、プレイヤー由来のダメージと上限は半分です。Aresではエロージョンを使用しません。
    healing: 回復
    healing_desc: 回復は呪文の基礎値に、知力の割合分を上乗せし、さらに装備やバフからの固定回復ボーナスを加えて適用されます。回復は対象の最大HPが上限です。
    healing_intel_value: 知力1につき回復+1%
    heal_bonus: 回復ボーナス
    heal_bonus_value: 装備・バフからの固定ボーナス、知力によるスケーリングの後に加算
    mobs: モブ
    healing_mobs_value: 知力のみでスケーリング、回復ボーナスなし
    leveling_desc: 最大レベルは200。最適なXPのためにレベル範囲内のモブと戦いましょう。
    points_per_level: レベルあたりのポイント
    stat_points: ステータスポイント
    stat_points_value: レベルあたり{{n}}
    stat_costs_desc: コストはクラスと現在の基礎値で決まります。各クラスページで全段階を確認できます。
    spell_points: スペルポイント
    spell_points_value: レベルあたり{{n}}
    xp_milestones: XPマイルストーン
    level_10: レベル10
    level_50: レベル50
    level_100: レベル100
    base_stats: 基本ステータス
    stat_vitality: 体力
    stat_vitality_desc: ポイントあたり最大HP+1
    stat_wisdom: 知恵
    stat_wisdom_desc: 獲得XPボーナス
    stat_strength_desc: 地ダメージのスケーリング
    stat_intelligence_desc: 火ダメージ、回復スケーリング
    stat_chance_desc: 水ダメージ、戦利品増加
    stat_agility_desc: 風ダメージのスケーリング
    derived_formulas: 派生計算式
    max_health: 最大HP
    loot_desc: 倒された各モブは、戦利品テーブルの各項目を1回ずつ判定します。成功した項目の数量は設定範囲内でランダムに決まります。
    stat_rolling: ステータスロール
    stat_rolling_desc: 各ステータスはテンプレート範囲内で均一にロールされます。すべての値が等確率です。
    archimobs: アーキモブ
    archimobs_desc: 代わりにそのモブのアーキモブとして出現する確率0.5%——名前を持つ、永続的に強化されたバリアントです。モブが持つ唯一のレア度システムです。
    max_members: 最大メンバー数
    groups_desc: パーティーは最大{{max}}人で構成される共有名簿で、リーダーが選出されます。パーティーを組んでいるだけでは戦闘において何の効果もありません——パーティーの有無にかかわらず、全員が自分自身の参加トランザクションを送って戦闘に入る必要があり、自動参加や近接による参加はありません。
    groups_xp: XPの分配
    groups_xp_desc: 倒したモブの基礎XPを一つのプールに合算します。条件を満たす戦闘員の人数でRetro式のグループ係数を掛け、プレイヤー側とモブ側の合計レベル差で減額し、最後に各プレイヤーのレベルがパーティ合計レベルに占める割合で分配します。最高レベルの3分の1未満のプレイヤーは係数を増やしません。知恵は最後に適用され、個人の与ダメージは影響しません。
    groups_loot: 戦利品の分配
    groups_loot_desc: 倒された各モブは共有の戦利品判定を1回行います。成功したドロップは勝利したプレイヤーへ順番に割り当てられ、参加者が増えても判定回数は増えません。
    dungeons_desc: 探索済みゾーンでポータルを見つけ、鍵を使い、順番にルームを攻略します。各ポータルには専用のライブロビーがあります。
    dungeon_entry: 入場
    dungeon_entry_value: 発見済みゾーンのポータルで鍵を使用
    dungeon_instance: インスタンス
    dungeon_instance_value: ポータル別ロビー、公開またはグループ戦闘
    dungeon_completion: クリア
    dungeon_completion_value: すべての部屋をクリア
    dungeon_reward: 報酬
    dungeon_reward_value: 標準の戦利品分配
    classes_desc: 12クラス。武器は共通化されています——どのクラスもあらゆる武器タイプを装備・使用できます——ただし自分のクラス用に設計された武器を使うとダメージとクリティカルダメージが+10%になります。各クラスはレベルアップに伴い、決まったレベルで呪文を解放します。
    table_class: クラス
    table_weapon: 適性
    table_hp: HP
    role_warrior: ウォリアー
    role_assassin: アサシン
    role_berserker: バーサーカー
    role_druid: ドルイド
    role_chronomancer: クロノマンサー
    role_guardian: ガーディアン
    role_archer: アーチャー
    role_prospector: プロスペクター
    role_brawler: ブロウラー
    role_tomoda: 獣使い
    role_gambler: ギャンブラー
    role_healer: ヒーラー
    weapon_daggers: ダガー
    weapon_spear: スピア
    weapon_bow: ボウ
    weapon_axe: アックス
    weapon_sword: ソード
    marketplace: マーケットプレイス
    marketplace_desc: 装備とキャラクターは好きな価格でキオスクに出品でき、購入者は即座に支払います。資源はリスティングなしでスワッププールを通じてSUIと交換されます。すべての販売に10%のロイヤリティがかかります——マーケットプレイスが唯一の売却手段です。
    section_forgemagie: フォルジュマジー
    forgemagie_desc: フォルジュマジーはルーン製作システムです。装備を破壊してルーンに変え、そのルーンを他の装備に適用してステータスを変更します。装備を完璧にするためのハイリスク・ハイリターンのエンドゲームシステム。
    crushing: 粉砕
    crushing_desc: 粉砕されたアイテムの各ステータス行は独立して判定されます——高いステータス値と重いステータスほど多くのルーンを生成します。サーバーは存在しません。生成数の除数は、アイテムレベルごとの固定カーブと、アイテムテンプレート自身のtaux（粉砕そのものがそのテンプレートでは下げ、同じ帯の他のテンプレートでは上げる、共有のオンチェーン・インフレ係数、1%〜4000%）を組み合わせたものです。
    crushing_tiers_desc: ルーンのティア（Ba/Pa/Ra）は確率的に選択されます。高いステータス値はRaルーンを優遍します。
    rune_tiers: ルーンティア
    rune_ba: ティア1：ルーンあたり最低ウェイト
    rune_pa: ティア2：ルーンあたり中ウェイト
    rune_ra: ティア3：ルーンあたり最高ウェイト、経験値2倍
    rune_weight_desc: ウェイトは値×単位ウェイトから始まり、Retroでは整数へ切り上げます。自動計算されます。
    rune_table_stat: ステータス
    rune_table_note: 範囲、移動、行動のルーンはそれぞれ1回のみ適用可能。クリティカル率は最大10回まで。クリティカルとクリティカル結果にはルーンが一切存在しません。
    rune_stat_range: 範囲
    rune_stat_movement: 移動
    rune_stat_action: 行動
    rune_stat_raw_damage: 生ダメージ
    rune_stat_critical_chance: クリティカル率
    rune_stat_earth_resist: 地耐性
    rune_stat_fire_resist: 火耐性
    rune_stat_water_resist: 水耐性
    rune_stat_air_resist: 風耐性
    stat_unit_weights: ステータス単位ウェイト
    stat_unit_weights_desc: 各ステータスには戦闘力を反映した単位ウェイトがあります。重いステータスラインを持つアイテムは粉砕時により多くのルーンを生成し、アイテム予算を多く消費し、オーバーメイジが困難です。
    rune_application: ルーン適用
    rune_application_desc: テスト用として、装備カテゴリに対応する製作ジョブのレベル1で一時的に解放されています。ルーンを一つずつ装備に適用してステータスを変更します。3つの結果があります：
    outcome_critical_success: クリティカル成功
    outcome_critical_success_desc: ルーン成功、ステータス損失なし
    outcome_neutral: ニュートラル成功
    outcome_neutral_desc: ルーン成功、他のステータスが下がる可能性
    outcome_critical_failure: クリティカル失敗
    outcome_critical_failure_desc: ルーン失敗、ルーンウェイト分のステータス損失
    success_rate: 成功率
    success_rate_desc: 成功はステータスが最大値にどれだけ近いかに依存します：0%付近では成功率~99%、最大付近では~50%、エキゾチックなステータスはレベルに関係なく~1%です。成功がクリティカル（損失なし）になるかニュートラル（ウェイトを支払う）になるかも同様に変動し、さらにジョブレベル1を超えるごとに小さな+0.2%が加わります。ジョブが扱えるアイテムレベルに上限はありません。
    puits: シンク（ピュイ）
    puits_desc: UIに表示されるウェイトカウンターで、ステータス損失がルーンウェイトを超えたときに蓄積されます。他のステータスが影響を受ける前に将来の損失を吸収します。アイテムに保持され、作業台や所有者が変わっても引き継がれます。
    over_maging: オーバーメイジ
    over_maging_desc: ステータスを自然な最大値以上に押し上げます。各ステータス行は101の追加ウェイトが上限です。オーバーメイジの最大値はステータスの単位ウェイトに依存します——体力（ウェイト0.25）のような軽いステータスは約404ポイント超過できますが、知恵（ウェイト3）のような重いステータスは約33ポイントしか超過できません。
    forgemagie_tips: ヒント
    forgemagie_tips_desc: エキゾチック/オーバーメイジの場合：まず安いステータスを外してシンクを貯め、バッファがある状態で難しいステータスを通し、その後失ったステータスを戻す（最大値から遠いので簡単）。オーバーメイジとエキゾチックのステータスは失敗時に最初に失われます。
    forgemagie_xp: 経験値
    forgemagie_xp_desc: 経験値は成功時のみ付与されます（クリティカルまたはニュートラル）。高レベルアイテムや重いルーンほど多くの経験値を獲得できます。Raルーンは BaやPaルーンの2倍の経験値を付与します。計算式：max(1, ルーンウェイト × (1 + アイテムレベル / 50) × ティア倍率)、Raの倍率は2、それ以外は1。
    action_points: アクションポイント（AP）
    movement_points: 移動ポイント（MP）
    critical_stat: クリティカル
    wisdom_xp: 知恵によるXPボーナス
    wisdom_xp_desc: 有効中の効果を含む実効知恵1ポイントごとに獲得XPが1%増加します。実効知恵100で獲得XPは2倍になります。
    chance_loot: 幸運＆戦利品
    chance_loot_desc: 有効中の効果を含む勝利チームの平均幸運が、確定した各ドロップ率に乗算されます。平均幸運600で確率は2倍になります。ドロップ率は100%を超えません。
    mob_loot_band: モブレベルとドロップ率
    mob_loot_band_desc: 設定確率が中央値です。最低レベルのモブは80%、最高レベルは120%を使い、上限は100%です。固定レベルのモブは設定確率をそのまま使います。数量はモブレベルで変化しません。
