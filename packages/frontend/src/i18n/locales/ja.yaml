wallet_legacy:
  sui: SUI
  how_to_get: SUIの入手方法
  your_address: ウォレットアドレス
  send_sui: このアドレスにSUIを送金してください。クリックでコピー。
  buy_directly: 直接購入
  buy_with_card: クレジットカードでSUIを購入。ウォレットに直接届きます。
  buy_on_exchange: 取引所で購入
  withdraw_to_wallet: 取引所でSUIを購入し、上記のウォレットアドレスに出金してください。
  faq: よくある質問
  wallet_description: あなた専用のウォレットです。あなただけがアクセスできます。ショップで使うSUIを入金してください。
  moonpay_desc: クレジットカード、Apple Pay、銀行振込
  transak_desc: クレジットカード、銀行振込、100ヶ国以上対応
  faq_what_is_sui: SUIとは？
  faq_what_is_sui_answer: SUIはデジタル通貨で、電子マネーのようなものです。Suiブロックチェーンという高速で安全なネットワーク上にあります。AresRPGショップでアイテムを購入するために少額のSUIを使用します。ゲーム内通貨のようなものですが、私たちがあなたから取り上げることはできません。
  faq_why_sui: なぜAresRPGはSUIを使うの？
  faq_why_sui_answer: SUIは私たちの推奨決済方法です。取引は即座（1秒以内）に完了し、手数料はほぼゼロ。仲介者手数料もかかりません。将来的には従来の通貨（USD、EURなど）にも対応する予定ですが、法的手続きが膨大で、高額な手数料や税金が発生するため、まだ準備が整っていません。
  faq_legal: 合法ですか？
  faq_legal_answer: はい。暗号通貨の購入と保有は、ほとんどの国で合法です。SUIは世界中の主要な規制された取引所で取引されている正当なデジタル資産です。ショップでの支払い手段として使用するだけであり、NFTや暗号通貨スキームは一切ありません。
  faq_eula: ゲームの利用規約で許可されていますか？
  faq_eula_answer: はい。暗号通貨が純粋に支払い手段として使用され、NFTや投機的な暗号通貨スキームを含まない限り、完全に準拠しています。多くの大手ゲームストアでさえ暗号通貨決済に対応しています。
  faq_access: 誰が私のウォレットにアクセスできますか？
  faq_access_answer: あなただけです。ウォレットはSuiのzkLogin技術を使い、Googleログインから作成されます。AresRPGチームを含め、誰もあなたの資金にアクセスしたり移動したりすることはできません。重要：このウォレットはショップでの購入専用です。大量の資金を保管しないでください。使う分だけ入金してください。
  faq_balance: SUIを送ったのに残高が更新されない？
  faq_balance_answer: ご安心ください。更新システムが一時的に遅れている場合があります。正しいアドレス（上記からコピー）にSUIを送金したことを確認し、それでも反映されない場合はトランザクションIDを添えてDiscordのチームまでお問い合わせください。
