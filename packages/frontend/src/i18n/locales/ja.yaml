    combat_desc: 戦闘はグリッド上のターン制です。自分のターンにはアクションポイント（AP）を消費して呪文を唱え、移動ポイント（MP）を消費して移動します。視線（ライン・オブ・サイト）は呪文ごとの設定です——ほとんどの呪文は必要としますが、不要な呪文もあります。ワールドではモブの集団と、コリゼウムでは他のプレイヤーと戦います。ダメージは対応する属性ステータスと生ダメージボーナスに応じてスケーリングします。
    elements: 属性
    element_earth: 地
    element_fire: 火
    element_water: 水
    element_air: 風
    stat_strength: 筋力
    stat_intelligence: 知力
    stat_chance: 幸運
    stat_agility: 敏捷
    critical_hits: クリティカルヒット
    crit_desc: 各呪文や武器には、N分の1で表される固有の基本クリティカル率があります。クリティカルはNを減少させますが、最終的な確率が2分の1（50%）を超えることはありません。
    crit_bonus_desc: クリティカルヒット時、呪文は通常の効果の代わりに専用のクリティカル効果（より強いダメージや追加効果）を適用します。
    blocking: シールド
    blocking_desc: 一部の呪文は、対応する属性の入ってくるダメージを使い切るまで吸収するシールドを付与します。スタミナやガード姿勢はなく、シールドが唯一のダメージ吸収手段です。
    resistance: 耐性
    resistance_desc: 属性耐性は最終ダメージに適用される割合減少で、属性ごとに上限60%です。負の耐性（弱点）は代わりにダメージを増幅します。
    life_steal: ライフスティール
    life_steal_desc: ドレイン呪文の効果はダメージを与え、対象が実際に失った体力の半分だけ詠唱者を回復します。回復するのはプレイヤーのドレインだけで、同じ呪文を唱えたモブはダメージを与えるだけで回復しません。
    life_steal_note: ダメージはまず標準のダメージ計算式を通り、その後詠唱者は本来の対象が実際に失った体力の半分を回復します。他の戦闘員へ転嫁された攻撃や、対象が回復に変換した攻撃では何も奪えません。
    healing: 回復
    healing_desc: 回復は呪文の基礎値に、知力の割合分を上乗せし、さらに装備やバフからの固定回復ボーナスを加えて適用されます。回復は対象の最大HPが上限です。
    healing_intel_value: 知力1につき回復+1%
    heal_bonus: 回復ボーナス
    heal_bonus_value: 装備・バフからの固定ボーナス、知力によるスケーリングの後に加算
    mobs: モブ
    healing_mobs_value: 知力のみでスケーリング、回復ボーナスなし
    leveling_desc: 最大レベルは200。最適なXPのためにレベル範囲内のモブと戦いましょう。
    points_per_level: レベルあたりのポイント
    stat_points: ステータスポイント
    stat_points_value: レベルあたり{{n}}
    spell_points: スペルポイント
