  item_descriptions:
    aberrant_edge: '誤りて鍛えられた。鋼は折れずに曲がる。角度で指令せよ。力では従わぬ。'
    aberrant_faceguard: '顔でなくなった顔を象って作られた。会話を遠ざける。'
    aberrant_treads: '足とは言い切れぬ形から鋳られた。残す足跡はどこか間違っている。'
    abyss_core: '凝縮された虚空エネルギーの脈動する球。死んだ現実の夢を含む。存在論的注意を持って扱え。'
    abyss_loop: '光をまるごと飲み込んだ水から引き上げられた。今もその重さを宿す。'
    abyssal_blood_wheat: '血液型について意見を持つヘモグロビン穀物。'
    abyssal_codex: '深海から引き揚げられた魔導書。水浸しのページは、なぜかまだめくれる。'
    abyssal_conduit_staff: ''
    abyssal_edge: '刃の周囲の光を吸収するように見える剣。暗闘は装飾。ダメージは本物。'
    abyssal_warplate: '武勇伝と追悼文の違い。'
    abyssgrown_blade: '自らの樋を、自らの刃を、鞘に納められることへの自らのかすかな渋りを生やした。そのどれも、鍛冶師は手柄にしない。'
    abyssgrown_cuirass_of_moonlit_mire: '採寸後も育ち続けた。着用者がそれに気づいたのは、体に合わなくなり、そっと、迫り始めた日だった。'
    abyssgrown_extract: '瓶詰め後にひとりでに濃くなった濃縮液。だから古い小瓶は新しいものより強く効き、表示は決して追いつかない。'
    abyssgrown_gauntlets: '鍛冶師が付けてもいないのに爪が生え、外すこともできない。着用者はそれを利点と見なすことにした。'
    abyssgrown_helm_of_quiet_drowning: '鍛えたのではなく、深いウィールドが始めて放り出した殻から育った。着用者は、その守りと未完の因縁の両方を受け継ぐ。'
    abyssgrown_pendant_of_moonlit_mire: 'その芯に空洞が生じ、着用者いわく、ウィールドより古い水の一滴を宿すという。それは蒸発を拒み、その主張を裏づける。'
    abyssgrown_pendant_of_quiet_drowning: '着用者の息に合わせて柔らかく鳴る紐通しの珠。静かな深みでの慰めだが、それが息と共にではなく、ひと呼吸ごとに一拍遅れて鳴ると気づくまでの話だ。'
    abyssgrown_sabatons: '誰も設計していない踏み跡の模様が生え、誰も知らぬ歩き方に合わせられ、それでも着用者にはしっくりくる。'
    abyssgrown_signet_of_moonlit_mire: 'その印面には、目をそらすたびにわずかに変わる模様が生え、二人として同じに言い表せた証人はいない。'
    abyssrift_breastplate_of_torn_ground: '希薄な重力の中では重さがない。実際に何かを殴る必要が出るまでは最高の気分だ。'
    abyssrift_legguards_of_split_sky: '希薄な重力のおかげでほぼ生き延びられる落下向けに作られている。ほぼ、だ。'
    abyssrift_poultice_of_split_sky: '触れたところが涼しい。継ぎ目の向こう側のように。どうして知っているかは訊くな。'
    abyssrift_treads_of_split_sky: '空を飛ぶ類ではない。「地面が去り、あなたは即興で対応中」の類だ。'
    abyssrift_visor_of_torn_ground: '隙間からは前にあるものが正確に見える。床が前にあったことなど一度もない。'
    abyssrift_warbelt_of_torn_ground: '背骨の代わりに負荷を引き受ける。背骨はなお納得せず、それを声高に主張する。'
    adamantite_beastcaller: 'イエティの毛皮を巻き、古い呼び声の紋様を刻んである。地を三度叩けば何かが現れる。たいていは冷たく、不機嫌だ。'
    adamantite_chopper: ''
    adamantite_earth_cleaver: 'まだ溶けている燼心で駆動する長剣。大地を割るのに十分な重さを誇り、少なくともその上に立つ者は確実に粉砕する。柄から伝わる熱は冬の野営でありがたいが、夏場は手を焼くだけの厄介な副作用でしかない。鞘に収めても熱は冷めず、所有者の寝台を焦がすことも珍しくない。'
    adamantite_fang_daggers: 'レックスの牙を先端に付け、喪の絹で巻いた双刃。そよ風を、そしてその陰に潜むものを断つほど速い。'
    adamantite_katana: '柄に氷河の心臓を収めた刀。刃は気取りを断ち切るほど鋭く、ついでに人も断ち切る。冷気が罪悪感を麻痺させるため、振るった後も良心の呵責に悩まされることがない。便利だが倫理的には問題含みの代物である。鞘に戻した後の静寂は特に深い。'
    adamantite_longbow: 'サメのヒレとフロストシェルの板でできた弓幹。引くには両腕と積年の恨みが要る。'
    adamantite_tidestaff: '霜被りの絹で巻かれ、氷河の核で飾られた杖。遠くの潮騒と同じ律動で静かに唸り続けるが、水泳の役には立たない。泳ぐ前に杖を置いた者だけが溺れずに済むという皮肉な教訓を残している。持ち主は海辺での経験を、独特の記憶として語るようになる。'
    adamantite_trident: '決して溶けない凍結カニ殻の三叉槍。魚、魚に似た敵、そして常識に対して極めて効果的である。近海の漁師たちは武器と呼ぶが、調理人たちは頑なに調理器具だと主張して譲らない。用途の議論は今も続き、結論は出ていない。'
    adamantite_war_greaves: '召集の合間、鍛冶場に余った鉄で打たれた。'
    adamantite_waraxe: '氷殻の板を刃に、氷河の心臓を柄頭に据えた戦斧。重さが腕を鍛え、冷気が覚悟を鍛える。使いこなす頃には、戦士は斧を振るう者というより斧に振るわれる者になっているらしい。熟達と依存の境界線は、鍛冶師が語りたがらない話題の一つだ。'
    adamantite_warhelm: '塩水ではなく塚の水で焼き入れされた。凹んでもよく持ちこたえる。'
    adamantsteel: 'まず金属が同意せねばならぬと言い張る鍛冶師たちが、アダマントを折り重ねて鋼にしたもの。うまくいった一釜は、確かに妙に乗り気に見える。'
    aetherwing: ''
    alchemical_base: '全錬金術の基盤。湿った図書館と破られた約束の匂い。'
    allweather_cinch: '沼地でも砂漠でもツンドラでも同じように機能する。どこで着てもみっともないのも同じだ。'
    aloe_crystal_salve: '結晶化したアロエジェルと薬草の残滓を重ねたもの。治療師は信奉し、患者は呪う。'
    aloe_vera: '癒しのジェルがたっぷり詰まった多肉植物の葉。治癒師は信頼し、錬金術師は買い占め、他の誰もがなぜ植物のために争うのか不思議に思う。'
    alpha_cleave: '群れのアルファから奪った。自発的ではなかったし、群れも同様だった。'
    alpha_fang: '黄ばんだ15センチの犬歯。これを持っていたアルファはコメントできなかった。呼吸も。'
    alpha_fang_circlet: '狼は群島全体に届く遠吠えで死者を悼む。この額冠はそのすべてを記憶している。'
    amber: '数百万年前に死んだ虫を含む化石化した樹液がようやく何かの役に立つ。'
    amber_powder: 'ずっと昔に死んだ森の匂いがする。まだ恨んでいるようだ。'
    ambivalent_torc_ap: '意図ではなく事故によってアクションポイントを付与するアミュレット。その所有者は祝福されたのか負担されたのか決めることができない。'
    amphibian_oil: 'コアの腺から精製。革を防水にし、歯車を潤滑にし、全てを永遠に沼の臭いにする。'
    amulet_of_the_first_hollow: '記録者がまだ命名ではなく番号で管理していた頃、初めて目録に載ったヴォイドモスが残した空洞から回収された。命名規則より古い。番号で呼ばれていたことを覚えている。'
    ancient_hermit_robe: '百の埋葬を経た衣から切り取られた。織り目には今も墓の埃が残る。'
    ancient_marrow: '何世紀も骸骨の中にいたのにまだ液体。悲しみと古い銅の味。どうやって知ったかは聞かないで。'
    ancient_ram_splitter: ''
    ancient_tusk_cleaver: '歪んで育った肋骨から削られた。刃はまだ落ちていない。'
    ancient_tusk_fragment: 'あるはずのない場所に生えた肋骨から砕け取れた欠片。'
    anglerbone_cord: 'アングラー・クイーン自身の背骨に通され、完全な闇の中でもかすかに光る。方角を知るには便利。身を隠すには不便だ。'
    anglerdeep_key: '決して乾かぬウィールドの湿りでぬめり、誘光がそうでなくなる直前の温もりを帯びている。深淵のマトロンは、素振り以上にこれらをきちんと把握している。'
    anglerhide_helm: 'アングラー・クイーンの皮から裁たれ、誘引腺は暗く休眠したままにされている、おおむね。どれほど休眠しているかは試さぬがよい。'
    anglerlight_lure_staff: '捕らえた誘い光を先端に戴き、深いウィールドを通して獲物を引き寄せる律動でいまだ脈打つ。あまり長く見つめないほうがいい。'
    anglerlight_oil: 'アングラー・クイーンの誘引腺から搾り出したもので、瓶の中でもかすかに光る。何かを引き寄せ始める前に飲み下すのが賢明だ。'
    antiphon_breastplate_of_last_verse: '防水、防火、グレイビー対応。家具にかけるか自分にかけるかは、どちらを守りたいか次第。'
    antiphon_grips_of_last_verse: '洗濯日のための逸品。シャツでも、モップでも、誰かの本音でも絞れる。'
    antiphon_grips_of_twelve_voices: '前腕まで粉まみれ、永遠に。生地が反撃したのは、きっかり一度だけ。'
    antiphon_poultice_of_twelve_voices: '十二の薬草、十二の祈り、一つの練り薬。どの草が効くか誰も覚えておらず、どれでもないのかもしれない。'
    antiphon_treads_of_twelve_voices: '外靴は玄関ポーチまで。大聖堂はこの点に厳格で、溶岩も伝統には敬意を払う。'
    antiphon_visor_of_last_verse: 'スープも溶岩も野心も、等しく公平に濾し切る。あご紐つき。'
    antiphon_visor_of_twelve_voices: '十二の狭い視界を一つにするための細長い切れ込み。それでも、なぜか、見えづらい。'
    apexbound_cuirass_of_summit_vigil: '山頂の番のための支給胸当てで、着用者が一手番まるごとふらつかず直立できるよう重みが持たせてある。座ることは別問題で、これは解決してくれない。'
    apexbound_gauntlets: '頂に到達し、着いてなお何かを握らねばならない手のために作られた。ほとんどは到達しない。これらは、君は到達すると決めてかかっている。'
    apexbound_girdle_of_sealed_wound: '壁の断片が、閉じたままでいると全幅の信は置けないものを巻くやり方で、二重に巻いてある。今のところ腰は協力的だ。'
    apexbound_helm_of_sealed_wound: '無理やり閉じられたとき、創傷が吐き出すものに耐えるよう鋳造されている。面頬は内側から封じる。それが、着用者を本当は何から守っているのかを物語る。'
    apexbound_pendant_of_summit_vigil: '最も高い番に就く者の胸骨に当たるよう作られている。心臓に十分近く、その鼓動がどれほど速いかを数えていられるほどに。'
    apexbound_ration: '壁の守り手に支給される野戦医薬。蝋で封じられ、守り手の大半より長持ちすると保証されている。陰惨だが、表示は正直だ。'
    apprentice_blade: '鍛冶師が初めて作った折れない剣。低いが一応マイルストーン。'
    aragog_fang: '蜘蛛の女王の顎からもぎ取られた毒の滴る牙。表面を覆う毒素は紫と黒の間を揺れ動き、触れるもの全てを溶かす。'
    aragog_fangs: ''
    arcane_bread: '大量に焼かれ、一度だけ祝福され、二度と疑われぬ。行軍を止めさせぬための糧。'
    arcane_pastry: ''
    arcane_reagent: '七つの薬草、水少々、そして紫に光る理由は皆無。錬金術師はそれを研究と呼び、他の者は危険信号と呼ぶ。'
    arcane_solution: '生の魔法的潜在力で脈動するエンドゲーム錬金試薬。素肌に一滴で一時的な共感覚を引き起こす。'
    arcane_spore: '生の魔力を、永続的な興奮状態に達するほど飽和させたもの。近くのガラスを砕き、学者の脚注を断りもなく並べ替える音程で唸る。取り扱いについて代々伝わる唯一の安全規則――くしゃみをするな。'
    arcaneshroom: '残留する秘術エネルギーに満ちた菌類で、採取者を個人的に咎めるような淡い光を放つ。素肌で触れると不随意の浮遊、一時的な共感覚、そして埃まみれの書物への不可解な渇望を引き起こすことが知られている。'
    arcanite: '残留魔力で唸り羅針盤を狂わせ魔法使いを鼻持ちならないほど得意にさせる。'
    arcanite_hoe: '死んだ土を芽吹かせるほどの秘術エネルギーが宿る。死んだ農家も芽吹くが、その話はしない。'
    arcanite_pickaxe: '徴税人が夢を砕くように現実硬化鉱物を粉砕する。鉱脈に勝ち目はない。'
    arcanite_powder: '放置すると自発的にアーケインシンボルに並び替わる。非常に気が散る。'
    arcanite_sickle: '結晶化したマナと悪い判断から鍛造。呪われた茂みを借金取りのように切り裂く。'
    arcanize_flour: '一瞬浮遊する紫の粉。パン屋は素早く作業を学んだ。'
    archaeo_belt: '羽毛付きの化石。今でも飛べたと言い張っている。'
    archaeo_longbow: '誰かが暦をつけて日付を記すよりずっと昔、深部を渡っていた鳥の羽で矧がれている。矢は今もその古い道を覚えているようだ。あなたがどこを狙っていようと、構わずその道を辿っていく。'
    archaeo_plume: 'トカゲか鳥か、進化の途上でいまだ決めかねている生物の原羽毛。'
    archaeo_plume_javelin: '原羽毛で羽根を付けられている。羽根を持つものが飛べる限度を超えてまっすぐ飛ぶ。'
    archimob_legguards: '群れの頭領の皮から作られた。残りの群れは今も頼まれもせず礼状を送ってくる。'
    arisen_tokeko: ''
    ashen_philter: '灰色でざらつき、一応飲める。灰は決して沈まない。それでここがどこか分かる。'
    ashen_visor: '常に焚き火と怪しい判断の匂いがする。そのどちらもある程度は防いでくれる。'
    ashraptor_fang_pendant: 'その牙は引き抜かれた炎をまだ覚えている。時々、あなたの鎖骨も。'
    backbone: '背筋に沿って最優先で装甲されている。立ったままの死体でも陣は保てるという、しっかりした理論に基づく。'
    backswing: '戻りの一振りが、狙った一撃よりも大きな仕事をする。鍛冶屋はそれを仕様と呼ぶ。使い手はそれを不意打ちと呼ぶ。'
    bag_aloe_vera: 'かつては品のある容器だったが、今やあらゆる縫い目から粘性のある植物分泌液が染み出している。五十株のアロエベラをゼラチン質の植物向けにしてはかなり少ない容量の空間に閉じ込めた当然の帰結である。錬金術師たちは圧縮により治療効果が増すと見事な確信を持って主張するが、袋の外観——滑り、悪臭を放ち、かすかに脈動する——はその主張をほとんど裏付けていない。'
    bag_amber: '化石化した涙の重い袋。あなたが金持ちになるために木は泣いた。'
    bag_arcaneshroom: '五十個の秘術キノコをまとめた器で、濃縮された残留魔力で唸り、独自の微弱な重力場を発生させ、特に学究的な炎に引かれる蛾のような必然性で小物を引き寄せる。放置すると時折浮遊し、持ち主はますます懐疑的な宿屋の主人にそれを説明しなければならない。'
    bag_arcanite: '10個以上持つとハミングが大きくなる。理由は誰も知らないし誰も知りたがらない。'
    bag_arcanize: '紫の発光が縫い目から漏れ出す。中の穀物は猫に危機を引き起こす周波数で唸る。'
    bag_barley: '守護者の抗議の中で収穫された穀物の音を立てる大麦の袋。'
    bag_blood_wheat: '誰も突き止められない周期で、かすかに脈打つ。穀物袋としては不穏だ。隣で眠るつもりの荷物としては、なおのこと厄介である。'
    bag_bloodstone: '中身はいずれ赤く染まる。統計的には、外側もいずれそうなる。'
    bag_burnt_wheat: '袋を開けると煙い香りとひどい農業上の決断の印象が放たれる。'
    bag_crimson_truffle: '五十個のトリュフが一つの袋に。縫い目が想定していなかった市場価値だ。'
    bag_cursed_fungus: '五十個の呪われたキノコが封じられた袋で、生きた文明のいずれにも属さない言語を入れ替わりで囁き、持ち主を本人が覚えのない名で呼ぶが、それでも不随意の悪寒を引き起こす。熟練の薬草師は腕の長さ分離して持つが、それはマニュアルの推奨ではなく袋自身がそう提案したからである。'
    bag_cursed_gem: '袋があなたの最も深い恐怖をささやく。主にインベントリ管理と重量制限について。'
    bag_draconite: '触ると熱く、かすかに唸る。前の配達員は星ひとつのレビューを残し、転送先も告げず去った。'
    bag_draconize: '外側の鱗は天然かもしれないし、中の穀物が労働組合を結成している兆候かもしれない。'
    bag_dragonlily: '五十本のドラゴンリリー。重なる鱗が、玄関先の猫を一晩中眠らせないほどにかすかに鳴る。'
    bag_duskite: '古い鉱夫の言い伝え——ダスカイトが奪ったものは、ダスカイトが手放さない。光は入ってきて、二度と眠らない。実際のところ、見た目より重く、値段の割に得なだけの袋である。'
    bag_green_mushroom: '五十個の緑キノコ。楽しい種類とは法的にも植物学的にも別物。'
    bag_himalayan_wheat: '空気が薄く農業規制が存在しない高地で収穫された。'
    bag_ivory_shrooms: '五十本の発光キノコが無謀な密度で詰め込まれ、恥ずかしいほどの距離から見える安定した燐光を放ち、誰も要望していないのに三十メートル圏内の全員が認めざるを得ない携帯ナイトライトとして機能する。商人たちはこれを欠点ではなく特徴として売り出そうとしたが、結果は予想通りだった。'
    bag_jade: '商人が喜びの涙を流しその後疑いの涙を流すほどの緑の石。'
    bag_malt: '発酵の香りはこのモルトが飲料としてのキャリアを計画し始めたことを示唆。'
    bag_moonstone: '夜に布越しに光り泥棒のステルスを完全に不可能にする。'
    bag_nightcap: '五十個のナイトキャップが入った袋で、周囲の光を貪り食い、やましい良心の静かな執拗さで持ち主を追う局所的な闇の領域を生み出す。長時間の近接は忍び寄るような実存的不安を誘発するが、薬草師たちはそれをプロ意識と取り違えることを覚えたという。'
    bag_obsidianite: '丁寧に扱ってもそうでなくても、いずれにせよ治療師への言い訳はあらかじめ用意しておくこと。「ただ運んでいただけです」のあらゆるバリエーションを、彼らはもう聞き飽きている。'
    bag_phantom_spore: '五十個の胞子は、時々しかそこにいない。守られたり守られなかったりする約束のように。二度数えてみるといい。意地で三度目も。数はいつまでも自分自身と一致しない。'
    bag_quartz: '曇った水晶が50個、壊れた約束の袋のようにカタカタ鳴っている。'
    bag_red_orchid: '五十本の血蘭が詰められた革袋で、内側から深く永久的な深紅に染まっており、まるで極めて小さく極めて植物学的な犯罪の現場であるかのようだ。開封すると、金属的な甘さと静かな脅威が等分のアロマが立ち上る。'
    bag_suize: '中の粒はまるでもっと良い容器のオーディションを受けているかのように光を捉える。'
    bag_tanjirize: '中のタンジライズがまだ太陽の下にいるべきだと確信しているかのように熱を放つ袋。'
    bag_ukranize: 'ウクラナイズの穀物は良い土を好んだことがない。収穫が最も困難な場所をこそ好むのだと語り継がれている。賢い作物だ。膝には最悪だが。'
    bag_wheat: '五十ブッシェルの小麦。チャフ・センチネルは命を捧げ、パン屋は肩をすくめた。'
    bag_witherbloom: 'どの花も、最期の瞬間のために最高の演技を取っておく。記憶に残ろうと決意した役者のような、芝居がかった献身とともに。袋を開ければ、声の届く範囲にいる吟遊詩人は皆、会話の最中に羽ペンへ手を伸ばす。'
    baked_compound: '粉とキノコ胞子を焼き固めた塊。錬金術師は大好き。他の皆は匂いに疑問を持つ。'
    banner_shard: '灰の軍旗が倒れる前に引き裂かれた。かつて示した戦列の重みを今も宿す。'
    barbfin_battleaxe: 'ウィールドが理屈上持つより深い水から引き上げられた何かのように、鰭が棘立っている。その鰭が実際どこから来たのかは、誰も尋ねていない。'
    bark_grimoire: '圧縮樹皮のページ。呪文はほとんど怒った羊の絵。'
    barley_bread: '農夫の全人格のような味の重いパン。満腹感があり信頼でき、全く喜びがない。'
    barley_flour: '醸造家が欲しがりパン屋が許容する粗い粉。'
    barley_hardtack: 'Military rations that outlast the soldiers who carry them. Jewelers use the crumbs as polishing abrasive.'
    basalt_carapace_of_black_choir: '光を飲む火山岩の板。薄暗い身廊では、あなたは実質、穴だ。'
    basalt_core: '溶岩弾の溶け残った中心。外は冷たく、内はまだ迷っている。急かすな。'
    basalt_crest_of_black_choir: 'うなずいて葬送歌に合わせてしまうほど重い、そのつもりがあろうとなかろうと。'
    basalt_crest_of_molten_antiphon: 'かぶっても宴会で透明にはなれない。ただし燃える蝋のしずくは防いでくれる。'
    basalt_falchion_of_molten_antiphon: 'こちらが振り、相手が応え、会話は終わる。長い対話になることは、まずない。'
    basalt_fists_of_molten_antiphon_choir: '聖歌隊は一節を歌い、また歌う、より強く。これも同じだ。拍子を覚えるか、二番を食らうかだ。'
    basalt_fists_of_molten_antiphon_pyre: '拳の上に鋼のブラシ。汚れも錆も希望も、同じ手軽さで落ちる。'
    basalt_flail_of_black_choir: '鎖で振り回すと弔鐘のように鳴る。こなす約束を思えば、ふさわしい。'
    basalt_greaves: '膝に括りつける中で最も頑固なもの。動くことについて一家言ある。'
    basalt_knobstick_of_molten_antiphon: '楓材、打ち粉たっぷり。あなたの帰りを一晩中待っていた人の貫禄で振られる。'
    basalt_locket_of_black_choir: '石に封じた、たった一つの低音を収める。危機に割れ。そのあとの静けさで後悔しろ。'
    basalt_maul: '絨毯、タペストリー、そして埃と一緒に恨みまで溜め込むあらゆる物に対応。'
    basic_pickaxe: '予算制限と地下への野心が出会うと、こうなる。'
    bear_battleaxe: '熊の怒りと不当な量の体温が注入されている。'
    bear_claw: 'つい最近まで、はるかに大きく、はるかに非協力的な熊についていた。'
    bear_claw_ring: '熊はこれを賭けて戦った。そして敗れた。主に些細な反則のせいで。'
    bear_club: '熊はこの意匠の印税を要求した。法務部は却下した。熊は大声で異議を唱えた。'
    bearclaw_gauntlets: 'もう必要としなくなった苔熊からもぎ取った爪を備えている。握力は受け継がれる。気性も、どうやら、そうらしい。'
    bearfury_battleaxe: 'この斧に爪を使われた熊はかなり怒っていたらしい。当然だ。'
    bearheart_signet: '熊の族長そのものの爪ほどの欠片が嵌め込まれている。長く着ければ殴り方を忘れる——覚えているのは殴られてから生き延びる方法だけだ。'
    beast_hauler_sash: '回収荷車を引いた者たちが締めた。縄が当たった箇所だけ擦り切れている。'
    beastcaller_talisman: '静電羊飼いの紐を通した、群れが近いとかすかに唸る。レックスの群れは一瞬、着用者を仲間と勘違いする。'
    behemoth_pearl: '古代のタイタン・コアの喉から見つかった。丁寧に取り出せるなら、一財産の価値がある。'
    behemoth_pearl_amulet: '自然に砕けたにしては滑らかすぎる欠片が嵌め込まれている。'
    bent_sword: '焼き入れと踏みつけを混同した人の作。まだ使える。辛うじて。'
    berserk: 'Forged for those who answer every problem with more axe. Rage not included, but implied.'
    binding_paste: '有機物と鉱物を接着する化合物。鍛冶屋と仕立て屋が錬金術師の醸造速度より早く買い占める。'
    binding_ring: '幽体のエネルギーを肉体に縛りつける。細字にはただ「軽度の実存的漂流」とだけ記されている。'
    binding_thread: '亡霊をこの世界に繋ぎ止める糸。切れば、いくつもの厄介事が一気に消える。'
    bisonbrute_bow: 'ビゾンブルートの腱で張られた。矢の一本一本が暴走の重みを運ぶ。'
    blizzard_tassets: '霜の結晶をまとったソリウム製の腿当て。一歩ごとにガラスが割れる音がする。'
    blockhead: '鍛冶屋の弟子が侮辱のつもりで名付けたが、それでも昇進した。'
    blood_wheat: '刈れば血を流す――古傷の色をした、濃く暗い樹液を。まるでそれを育てた土壌が、まず傷つけられ、問いはその後にしか許されなかったかのように。'
    blood_wheat_flour: 'かすかな深紅に挽かれ、素早く食べて二度と考えないパンに焼くのが一番いい。時折感じる脈動は、パン職人たちに言わせれば、純粋に見た目だけの問題だという。'
    bloodstone: '暗赤色の鉱物で色は間違いなく酸化鉄由来であり古代の呪いではない多分。'
    bloodstone_powder: '手のひらの中で不気味に温かい。錬金術師はこれを溺愛するが、他の誰もが距離を置く。'
    bloodveil_orchid: '花弁が、触れるものすべてを — 真面目な薬草師としての君の評判も含めて — 染めるほど暗い樹液を滴らせる深紅のラン。'
    bloodwheat_bread: '切ると深紅のパン生地がかすかに脈打つ。パン屋は熱反応だと言い張る。パン屋は嘘つきだ。'
    blue_antenna: 'まだ虫の最期の思考で脈打っている：「なぜ巨人は私のつがいを潰したのか？」'
    blunt_cudgel: '武器のふりをした棒。敵は死ぬ...笑い死にだが。いつかは。'
    boar_gorer: '猪狩り用だが、判断力の悪いものなら何にでも効く。'
    boar_hide: '厚く、剛毛で、泥の臭い。イノシシはそれを失うことに不合理に怒っていた。標準手順。'
    bogforged_core: '冷たい沼火で硬化させた核。緻密で、触れるとひそかに違和感があり、その感覚は決して完全には消えない。'
    bogforged_elixir_of_fen_below: '冷たく燃える沼火で蒸留され、癒やしが終わってからも長く舌に居座る冷たさを帯びる。'
    bogforged_greataxe_of_fen_below: '下層フェンへ下り、戻り道でなお何かを振るうつもりの者のために鍛えられた。そうする者は多くない。'
    bogforged_greataxe_of_rising_tide: '火花を丸ごと呑み込む沼の金床で叩かれた。鍛冶師はそれを不気味に思い、斧はどうやらお気に召したらしい。'
    bogforged_sash: '決して完全には乾かない泥炭の葦で織られている。見事に頭を軽くする——主に空っぽにすることによって。着用者は素晴らしい気分になるが、もう理由を説明できない。'
    bogforged_vambraces_of_rising_tide_matron: 'ウィールドが無いふりをする潮に合わせ、満ち潮のとき、金属が束の間協力に応じる瞬間に硬化させた。'
    bogforged_vambraces_of_rising_tide_mire: 'あまりに汚い沼水で焼き入れされ、金属はより硬く仕上がり、鍛冶師は一週間咳き込んだ。'
    bogsteel: '沼鉄を煮詰めて折り重ね、刃を保つまでにしたもの。しぶしぶ、そして苦労してそれを勝ち取った者にだけ、そうする。'
    bone_charm_necklace: '紐に通した小骨。服装次第でトライバルシックかシリアルキラーシックに見える。'
    bone_flail: 'ボーンレットの残骸から組み立てた。振るたびにガタガタ鳴る。'
    bone_greatbow: ''
    bone_marrow_club: '髄シャンブラーその者の大腿骨をくり抜き、念のため鉛を詰めたもの。地の底のどこかで、ネラクはいずれこういうことに気づくと言われている。言い訳は前もって用意しておいた方がいい。'
    bone_wand: ''
    boneguard_edge: '骨衛兵から奪い取ったもの。もっとも、公平に言えばそのとき彼はさほど抵抗していなかった――ひとえに、徹底的に、いっそ玄人はだしに死んでいたせいである。'
    boneherald_greatsword: 'より良い王冠へと鋳直されたあらゆる王冠よりも古い骨に誓われたもの。誓いそのものは不滅であると、誰もが認める。だが剣自体は、と伝令は念を押す――今も普通に売り物である。'
    bonelord_flail: '骨は本物だ。この沼地を歩いた物の腱で縛られた。物理では許さぬ重さで揺れる。理由など聞くな。'
    bonelord_greatsword: ''
    bonelord_legguards: '今なお息をする何者にも大きすぎる大腿骨から削られた。その合わせは寸分違わぬ。'
    brackish_breastplate_of_brackish_deep: 'ウィールドが公式には持たぬ深さの水圧に耐えると認証されている。鍛冶師が胸甲に刻印しておいて、その後あまり語りたがらぬ類のことだ。'
    brackish_composite: '塩水で処理した積層素材で、より強く、より奇妙になり、こちらが望まぬまさにその時に強まる匂いを帯びがちだ。'
    brackish_edge_of_brackish_deep: '塩水の焼き入れが、清潔な切り傷にはない形で傷つけるだけの腐食をちょうど残した。ウィールドはそれを長所に数える。'
    brackish_grips_of_brackish_deep: '塩が関節に入り込んで残り、だから最悪の瞬間に時折、確実に固まる。'
    brackish_legguards_of_brackish_deep: '他の何もかもを脚から腐り落とす水を渡る認証を受けている。これらにもいずれそうする。鍛冶師はいつとは言わないだけだ。'
    brackish_legguards_of_silt_throne: '溺れた広間に長く座りすぎた廷臣から回収され、そして、厳密には、今も座っている。'
    brackish_poultice_of_silt_throne: '傷を清める塩泥が詰められ、患者がいつ効いているかを正確に分かるほどしみる。'
    brackish_recurve_of_brackish_deep: '塩で膨らんで縮み戻らなかった腱で張られ、見た目より重く引け、それを見越した腕に報いる。'
    brackish_twin_knives_of_silt_throne: '溺れた広間から浚われた宮廷の短剣。泥がとうに引き取った亡骸の上に置かれたときのまま、いまだ交差している。'
    brackish_waraxe_of_brackish_deep: '腐食は柄まで這い上がって止まった。何とも知れぬものに食い止められている。使い手は、それにあまり頼りすぎぬよう努める。'
    brackish_warbelt_of_silt_throne: 'その宮廷の留め金は腐食して抽象的な形になり、今や何も意味しない。それは、以前意味していたものより正直だ。'
    breach_ash: '決して落ちない煤。ここでは重力への当てつけに、横へと漂う。'
    breachforged_brew_of_nine_faults: '門番の髄塩から醸された、裂け目を羊の代わりに数える歩哨が飲む酒。大きな傷は後回しにできるという理論のもと、まず小さな傷から塞ぐ。'
    breachforged_carapace_of_fifth_breach: '第五の裂け目を超えて成長し、もう脱皮する場所がなくなったヴォイドモスから丸ごと剥がされた。第二の外骨格のように身体に合う。機能的には、実際そうなっているからだ。'
    breachforged_carapace_of_nine_faults: '継ぎ目のどれもが崩れうる場所だ。今のところは大丈夫。その「今のところ」が重労働をしている。'
    breachforged_cincture_of_fifth_breach: '開けたままにするかどうかを決める前に、あらゆる敷居を手幅で測っていた門番が締めたもの。バックルは今も五つの異なる位置でカチリと鳴る。それが何を意味するのか、もう誰も覚えていない。'
    breachforged_circle_of_nine_faults: '裂け目が問題になる前に数え上げるのが仕事だった門番の、数える方の手にはめられていた。今も数え続けている。この指輪が与えるわずかな備えの余裕は、門番の仕事を代わりに仕上げているのだ。'
    breachforged_claymore_of_nine_faults: '断層を数えるのをやめ、自ら閉じ始めた門番が振るった。正確に狙うには重すぎる。そもそも正確さは計画に入っていなかった。'
    breachforged_crest_of_nine_faults: '九つの稜線。溶解工が数えるのをやめる前に数えた亀裂の数だけある。'
    breachforged_fists_of_fifth_breach: 'まず殴り、身分確認は後回しにする門番の拳から鋳られた。一撃ごとに、小さな戸口のようなアーチ形の痣が残る。'
    breachforged_greatbow_of_fifth_breach: '歩数ではなく越えた敷居の数で射程を測っていた門番によって弦を張られた。矢は、それを放った後悔を確実に追い越していく。'
    breachforged_philter_of_fifth_breach: 'まだ当直が終わる時代があった頃、五番目の当直を引いた門番が瓶詰めした。長い間じっと立ち尽くすような味がする。'
    breachforged_splitter_of_fifth_breach: '先の四つは失敗した。これは、もっと不機嫌なときに鍛えられた。'
    bread_leavening_agent: '錬金術的効率でパンを膨らませる。パン屋は奇跡と考える。錬金術師はパン屋が感動しやすいと考える。'
    bristleguard_cuirass: 'タスカー自身の胆汁でなめした革。タスカーとはまさにそれを主張しそうな生き物だ。'
    bristlemail_gauntlets: '猪の剛毛を通した鎖帷子。その毛は主義として決して寝ない。'
    bristlemail_pants: 'タスカー革のズボンで座るのは、理屈上は信仰の行為だ。剛毛はその信仰に同意していない。'
    bristlemail_patch: '矢を止めるほど密なイノシシの腹の皮。自然のケブラー、ただし酷い臭いで誰も感謝しない。'
    bronze_greaves: '刃を弾き返すほど緻密で、あらゆる階段を宿敵に変えるほど重い青銅から打ち出された脛当て。鍛冶師は倒木のような前腕を持っていたという。着用者にも、それに見合う腕を育てることが期待されている。'
    bronze_helm_of_the_shore: 'どれだけ磨いても取れないフジツボで飾られた青銅のドーム。元の持ち主は海を愛した沿岸警備兵だった。海が愛を返すまでは。永遠に。'
    bronze_wolf_cuirass: '森狼の皮の上に青銅板。狼の最後の遠吠えが金属に保存されているという噂だが、大半の着用者は階段三段目以降、自分の荒い息しか聞こえないと報告している。'
    browbeaten: '同じ落下物が同じ箇所を何度も凹ませたため、その凹みには巡礼者たちの間で固有の名がついている。'
    bulwark_band: 'あなたの指はもはや、法的には要塞である。'
    bulwark_of_the_risen: '夕暮れに再び開いた塚から回収された。死者にはもう不要だった。'
    bulwark_stubborn: '純粋で見事な意地だけで持ちこたえている。今のところ効果はある。'
    burnt_wheat_flour: 'パン屋の手間を省く事前トースト済み粉。'
    caller_embrace: '使い魔が近づくと指先が光る。便利だが、時に親密すぎる。'
    canticle_cuisses: '歩くたびに畝が五分の一音だけ鳴る。聖歌隊はあなたに合わせて移調することを覚えた。'
    canticle_greataxe: '山の底で粘る丸太のために取ってある。ついでに、敷地内のたいていの揉め事も終わらせる。'
    cantor_basalt: '台所の床材。四世紀ぶんの、行ったり来たりする料理人にすり減らされて滑らかになった。'
    canvas_boots: '最初の3秒は防水。その後は紐付きスポンジ。快適度：湿っぽい。'
    cape_fuwa_black: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_fuwa_white: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_kamui: 'A cloak cut from something that should not have had a hide. It remembers being worn by worse.'
    cape_lorito_agility: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_chance: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_intelligence: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_strength: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_vitality: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_wisdom: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    capstone_lattice: '頂でしか得られぬ圧の下でしか固まらぬ結晶の骨格。ゆえに、聞こえるとおりまさに入手困難だ。'
    capstone_treads_of_last_ascent: 'ただ一度、最後の一歩でだけ意味を持つ底。それはまさに、たいていの着用者がそれを味わう足を失う瞬間でもある。'
    capstone_visor_of_last_ascent: '頂に到達した巡礼者に手渡される冠。頂に達することが実際に何を代償とするのかを悟る、その直前のわずかな間に。'
    capstone_warbelt_of_first_dawn: '頂付近のあらゆるものを引っ張る上昇気流に抗い、身体を係留するよう重みが持たせてある。よく係留する。何に係留するかは君の問題だ。'
    capuche_bara: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_air: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_earth: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_fire: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_water: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_wisdom: ''
    capuche_mo: 'A tattered hood strung with tiny skulls. Mo never explains where they came from, and nobody asks twice.'
    casque_hayate: 'Swift-wind steel. Light enough to run in, loud enough to be heard coming.'
    cataclysm_brew_of_nine_faults: '灰の預言者は、すでに見てしまい忘れられない大災害の前夜にこれを醸す。何も防げはしない。ただ、見届ける手を落ち着かせるだけだ。'
    cataclysm_core_rift: '地震が力尽きた場所に残る密な塊。温かく、辛抱強く、終わったかどうかまだ決めかねている。'
    cataclysm_core_void: '重さはないのに、それでも落ちる。物理学者に相談した。物理学者は去った。'
    cataclysm_extract: '尽きた地震から最後に蒸留するもの。苦く、強力で、じっとしていたがらない。'
    cataclysm_tassets_of_fifth_breach: '数えることに意味がなくなった日、五番目の当直を引いた門番によって腰に鋳込まれた。金属は気をつけの姿勢を覚えている。着用者の脚は、あまり覚えていない。'
    cataclysm_tassets_of_nine_faults: 'これを着けた門番が一度の巡回で跨いだ亀裂の数にちなんで名付けられた。誰も数えなかった十番目の亀裂こそが問題だった。'
    cataclysm_warboots_of_fifth_breach: '広がる裂け目を全速で越えるためのもの。理論は正しい。裂け目は同意しない。'
    cataclysm_warboots_of_nine_faults: '何も立てぬ場所に立つために作られた。その「何も」には地面も含まれる。'
    celestial_wafer: '二つの異なる説のもとで二度も分類された。その食い違いを解決する担当者は誰も任命されていない。'
    chantmarked_crusher_of_twelve_voices: '給食施設仕様。じゃがいもにしたことを、士気にもする。'
    chantmarked_edge_of_last_verse: '皆が終わったと思い込んだ後に来る歌の一節。不意打ちだ。いつも最後の。'
    chantmarked_grips_of_twelve_voices: '聖歌隊創設より前に封じられたピクルス瓶で調整済み。開いた。最終的には。'
    chantmarked_legguards_of_last_verse: '礼拝と葬式、そして両方が同じ日に重なる時のための一着。ここでは、ほとんど毎日がそうだ。'
    chantmarked_legguards_of_twelve_voices: '手紙が開けられそうな折り目までアイロン済み。座るのは器物損壊にあたる。'
    chantmarked_rod_of_twelve_voices: '肝心の先端は何年も前に干からびた。以来、柄が聖歌隊を指揮している。下手に。'
    chantmarked_tonic_of_last_verse: '戦いが終わって、それから無礼にも終わっていなかった時のために。もう一節ぶんを買ってくれる。'
    chantmarked_twin_knives_of_last_verse: 'おばあちゃんの編み針。マフラーは完成しなかったが、泥棒も回復しなかった。'
    chantmarked_visor_of_last_verse: 'てっぺんのつまみは設計ミスであり、持ち運びの取っ手でもある。'
    chantmarked_warbelt_of_last_verse_choir: '歌が何度も戻ってくる一節。締めれば、あなたも戻ってくる。うっとうしいほどに。'
    chantmarked_warbelt_of_last_verse_pyre: '金槌、鋏、蝋、聖水のための輪。空いた輪があるなら、面倒のほうが先にあなたを見つけたということ。'
    charged_vault_key: '高原の嵐細胞から来る静電気を永久に帯びたヴォルトガラスで鍛えた。嵐の守人の金庫は誰も数えきれないほど雷に打たれてきたが、今も開くのはこの鍵のおかげだ。'
    charite_brick: '焦げ粉と琥珀の密なレンガ。鎧鍛冶が板の継ぎ目を繋ぐ接合剤に挽く。'
    chief_mark_brand: '右も左も分からぬ新兵に押される。熱するのは速く、消えるのは遅い。'
    chipped_axe: '刃のかけらはポテチより多い。振るたびに破片が飛ぶ。天然範囲攻撃。'
    chitin_cutlass: '半分キチン、半分錆びた金属。近づいたことを後悔させる意外な効果。'
    chitin_gauntlets: '鱗状の昆虫の甲羅を籠手に仕上げた品。軽量だが、掠めた攻撃なら逸らせるほどの耐久性を持つ。前の所有者は毒嚢が破裂する直前まで、これをとても快適だと感じていたらしい。'
    chitin_longsword: 'この刃は名もなき深淵の獣の甲羅から削り出された。その切っ先はギザギザながら、不気味なほど鋭い。'
    chitin_shellplate: '背後からの刺客を防ぐと言われているが、実際は悪臭で誰も近づけないだけだ。'
    chitin_walkers: 'これらのブーツは一歩ごとに蠢く。キチンの装甲は、中に生きる生き物たちの mere 殻に過ぎないからだ。'
    choir_conductor_staff: 'これを向ければ、炎壇すべてが拍子を合わせる。落とせば、火が即興を始める。落とすな。'
    choir_hymnbread: '終わろうとしない説教の最中に焼かれた。皮が固まったのは四時間目あたりだ。'
    choir_obsidian: '磨き上げた火山岩の板。触れれば冷たく、包丁傷にも熱い鍋にも動じない。'
    choir_procession_boots: '祭壇へのゆっくりとした威厳ある歩みのために作られた。走り出せば、まず威厳が去る。'
    choirblade_altus: '乾燥させた樫の一间棒。教区の子どもは皆、それが測る面倒の量を正確に知っている。'
    choirforged_cuirass: '製菓用エプロンの形をしたフルプレート。フリルは構造材である。'
    choirforged_draught: 'ポットの最後の一注ぎ。苦く、ざらつき、なぜか一日で一番効く。'
    choirforged_gauntlets_of_cooling_vent: '熱を逃がすための切れ込みがあり、実際に逃がす。あなたの手首へ直接。取引であって、贈り物ではない。'
    choirforged_greatblade_of_cooling_vent: 'ローストが丸ごと出て、家族が席についた時に登場する。切り分けられるのはローストだけとは限らない。'
    choirforged_greaves_of_ashen_song: '自転車のない大聖堂での自転車ズボン留め。備えあれば、それ自体が報酬。'
    choirforged_helm: '鋳鉄製、家族サイズ。左のへこみは、前の持ち主が意見を述べた時のもの。'
    choirforged_ration_of_ashen_song: '誰かの母親が詰めたもの。サンドイッチは三角に切ってある。終末は待ってもらおう。'
    choirforged_sabatons_of_ashen_song: '洪水、泥、浅めのマグマに対応。作法どおり、ワンサイズ大きめ。'
    choirforged_signet: '鉄製、へこみあり、誰にも合わないフリーサイズ。針と木くずと、暗殺一件をそらしてきた。'
    choirmaster_locket: '大聖堂じゅうの鍵をひとつの鉄輪に。身につけた者は、すべての施錠された扉と、その向こうの物音に責任を負う。'
    chokepoint: '喉が何もないところまで狭まる、まさにその位置に収まる。設計した宝飾師は偶然だと言い張っている。'
    cinchward: '着用者が傷の近くで注意深く呼吸するのを忘れると、勝手に締まる。姿勢について強い持論がある。'
    cinder_band: 'かつて一つだった心臓の欠片。それは覚えている。残りを取り戻したがっている。'
    cinder_bow: ''
    cinder_cleave: ''
    cinder_crown: 'その輝きは重要人物に見せる。揃った暁には、避けようのない存在に見せる。'
    cinder_cuirass: '燃え殻の心臓の破片で裏打ち。ツンドラでは温かく、それ以外では少し燃えている。'
    cinder_fangs: ''
    cinder_fists: '指を鳴らすだけで、残り五つの装備の問題にもなりかねない。'
    cinder_greaves: '座った椅子はどれも、あなたが座ったことを覚えている。残り火も同じく。'
    cinder_heart: '火鋼ゴーレムの胸から、まだ溶融したまま引き抜かれたもの。それ単体で鍛冶場一つ分の熱を持つ。近くに置いた金床は普通に溶ける。鍛冶教団は、もうこれを事故と呼ぶのをやめた。'
    cinder_heart_amulet: '他の装備が今も静かに戻ろうとしている、その中心の一片。'
    cinder_heart_scepter: '揃った装備一式に向ければ、胸の奥の何かが色めき立つ。'
    cinder_heart_staff: '決して完全には冷めぬ残り火を宿す。行軍はその温もりを覚えている。'
    cinder_locket: '決して消えることを良しとしない残り火を、ひとつ抱いている。'
    cinder_loop: '燠の心臓の欠片を嵌めてある。心地よく温かく、数杯やった後にはときどき熱すぎるほどだ。'
    cinder_maul: ''
    cinder_sash: '灰燼の心の糸で織られている。最も冷え込む刻限の見張りを凌がせる。'
    cinder_striders: '冬は暖め、夜は足跡を残す。この一式はいつも、なぜか見ている。'
    cinder_waistguard: '触れても決して冷たくない。装備一式で、行儀よく揃って熱を出している。'
    cinderchant_robe: 'キルト仕立て、床まで届く丈、うっすら焦げ跡。これを着て死ぬのは許される。これを着て来客に出るのは許されない。'
    cinderchoir_alloy: '打つと和音を鳴らす。それが魅力だ、静かに加工する必要が出るまでは。'
    cinderchoir_brew_of_molten_antiphon: '噴気孔の近くで醸すため、完全には冷めない。たいていは温める。ときに警告する。'
    cinderchoir_cincture_of_black_choir_pyre: '手に温かく、静かに灰色をこぼす。何週間も糧食から灰が出てくる。'
    cinderchoir_cincture_of_black_choir_vitrified: '親指幅と手幅で目盛られた仕立て屋のリボン。三人の皇帝を測り、三人全員に嘘をついた。'
    cinderchoir_crest_of_black_choir: '灰の洪水この方、逆さにかぶられている。灰汁と静かな決意のにおいがする。'
    cinderchoir_locket_of_black_choir: '焼けた聖歌集をひとつまみ収めている。静かな夜、灰は読める詩句に並ぶ。読むな。'
    cinderchoir_tassets_of_black_choir_pyre: '裾がやわらかにくすぶる。洒落ていて暖かく、乾いた草の近くでは本物の厄介事だ。'
    cinderchoir_tassets_of_black_choir_vitrified: '祈りで最も早くすり切れる場所を補強。当て布は新品、その下の膝は手遅れ。'
    cinderchoir_warboots_of_molten_antiphon: '冷えゆく流れ滓で鋳た靴底。凍える夜の遅くまで昼の熱を保つ。おおむね、贈り物だ。'
    cindercloth_gloves: '握手のたびに、ちょっとした安全講習が始まる。'
    cindercloth_hood: '頭は暖かく保つ。眉毛はどこにも保たない。'
    cindercloth_legs: '放電は一応含まれている。どのバージョンでも、それを機能として意図したことは一度もない。'
    cindercloth_robe: '修道士たちが二度熱傷の誓いのもとに織った。誓いは大抵守られたが、眉毛はあまり残らなかった。'
    cindercloth_sandals: '光る足跡を残す。もとより隠密行動など計画にはなかった。'
    claude_axe: 'かつて不屈のクロードが振るった。戦場での耐久力は伝説となり、寝室での耐久力はまったく別種の戒めとなった。'
    cleancut: '傷がその周りで正しく閉じないほど精密な切れ味を残す。外科医たちはその傷痕を研究している。だが所見は公表しない。'
    clearsight: '傷痕での視界を良くする。それは聞こえほど慈悲深いことではない。半分しか見えない方がいいものもある。'
    cobalt_battlecleaver: '両手持ち両刃、灰肌トカゲの温もりが残る。手紙には最悪、敵には最高。'
    cobalt_club: 'あまりに緻密なクィーベック材で、かつて光合成で生きていたことすら忘れている。'
    cobalt_crushers: '言葉が通じない時のための強化ナックル。言葉はいつも通じない。'
    cobalt_daggers: '腺の抽出液を二度、そして非公式には悪い判断を一度、塗り重ねている。'
    cobalt_longblade: 'アッシュスキンの鱗で温められた信頼できる一振り。期待通りのことを正確にこなす。驚きに満ちた世界において、それは何物にも代え難い価値である。派手さを求める戦士は他を選ぶが、生き残りたい戦士はこれを選ぶ。安定は退屈ではなく、熟練の証なのだ。'
    cobalt_mace: '巣蜜蝋と黄昏に鍛えた鋼で硬化させた。掟はただ一つ、巣が最優先。'
    cobalt_pike: '陽温めの鱗を穂先に、クウィベックの樹皮を柄に仕込んだ長槍。快適な距離から突くのに十分な長さがある。戦略か臆病か、判断は使う者次第だ。遠距離を愛する戦士の間では、これを使うことが成熟の証とされている。近くで戦う必要はない、という哲学である。'
    cobalt_shortbow: 'クィーベックの樹皮の弓幹に、放つたびうなる嵐を帯びた羽根の弦を張った。'
    cobalt_staff: '忍耐のためだけに彫られた護符を戴くクウィベックの樹皮の杖。実際それが必要だ――水の魔力を、決して完全には閉まらない蛇口のような、静かで穏やかな落ち着きで導いていく。'
    cobalt_sword: '灰肌トカゲの革で覆われている。握れば温かく、何も気取らせない。'
    cobalt_waraxe: '陽に温められた鱗から削り出され、琥珀色の蝋で封じられている。刃を見る前から、ウーライスはその唸り音を恐れることを学んだ。役に立つ評判だ。羊飼いたちに言わせれば、めったに正当な評判ではないが。'
    cobalt_wargreaves: 'スクワットが筋トレになるほど重い。筋トレがまずくなったら逃げられる程度には軽い。'
    cobalt_warhelm: 'まだカッコいい兜を貰うほどの功績を上げていない兵士への支給品。'
    cobalt_warplate: '重要な臓器を守る。重要でない臓器は自力で頑張れ。'
    cocoon_king_amulet: '切り出されたばかりの繭でまだ温かい金色の絹の鎖。王は決して声高に返済を求めない。その必要がない——着用者の思考は日ごとに静かになっていくのだから。'
    cocoon_king_cowl: '同じ金色の絹で織られ、目深に被る。腕の届く先はすべて心地よい金色の靄にぼやける——それが慈悲なのか、そもそもの狙いなのか。'
    codex_of_the_damned: '墓革で装丁されている。収録された呪文はどれも一度は術者を裏切った。'
    codex_of_the_deep: ''
    coiffe_fuwa_black: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_fuwa_white: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_pepe: 'A humble green cap. The starter flex. Every royal was once just a pepe in a hat.'
    coiffe_pepe_royal: 'The pepe ascended. A gilded crown for those who bought the top and never sold.'
    collapse_alloy: '共に崩れ落ちたものを混ぜてある。安定して見えるのは、成分がとっくに諦めているからだ。'
    collapse_bludgeon_of_last_tremor: '縄張り争いを収めるためリフトリングが一度振るい、それ以来その縄張りは異議を唱えなくなった。文を終わらせ、喧嘩を終わらせ、時には家具も終わらせる。だいたいその順番で。'
    collapse_greaves: 'わざと重い。浮かんで流されうる世界では、それは不満ではなく安心だ。'
    collapse_helm_of_widening_crack: '頭を何からでも守るが、真上にあるものだけは別だ。ここで本当に危ないのはそれなのに。'
    collapse_pendant_of_widening_crack: 'ここで最初に落ちたものの塵をひとつまみ収めている。ここには塵が実に多い。'
    colophon: '巻末の刊記は、出版者よりも、印刷所よりも、この本が書かれた言語の大部分よりも長く生き残った。'
    concussion: '最後に殴られた者が、言葉の使い方を忘れる直前のわずかな間に、臨床的にそう名付けた。'
    convergence_pendant: '二つの宝石、一つの台座、そしてどちらの日の出を数えるかを巡る終わらぬ口論。'
    copper_band: '1時間で指が緑に。宝石職人は『緑青』であり『銅中毒』ではないと主張。安心だ。'
    copper_cleaving_axe: ''
    copper_hoe: '銅製農具の中で最も安価な一品。沼地の銅道具は好むと好まざるとにかかわらず、いずれ寸分違わぬ緑色を纏うことになる。'
    copper_pickaxe: '下手に振れば凹むほど柔らかい。鉱夫たちは振る回数で補う。山は、いつも通り、意に介さない。'
    copper_sickle: '銅は一週間で緑青に酸化する。薬草師はそれを美的に相応しいと思う。銅に意見はない。'
    corbac_head: 'A crow-skull crown for the carrion-minded. The beak points at whatever you are about to loot.'
    cordwood: 'もはや誰も木材に使わない古い単位で測られている。それを必要とするほどの木材が、もう残っていないからだ。'
    core_forge_key: '熾火王が自らの心臓の火から唯一の真の鍵を打ったという伝説がある。生身の手では熱すぎて握れぬほどに。これはその鍵ではない。だが幾人もの鍛冶師が、限りなくそれに近いと誓っている。'
    coronet_band_of_silent_court: 'この結果に同意した覚えは誰にもない。一度も検証されたことのない主張だ。'
    coronet_edge_of_silent_court: 'その挙動は自らの説明と矛盾している。作り手がついぞ書かなかった脚注だ。'
    coronet_lattice: '発見されて以来、その分類は議論の的だ。調査チームは今もそれについて議論している。'
    coronet_legguards_of_silent_court: '誰も覚えていない主張を証明するために作られた。作り手はそれを長所だと考えている。'
    coronet_poultice_of_empty_seats: '瓶詰めした者は最終版を決めきれなかった。そして今のところ返金を求めた者はいない。'
    coronet_resin: 'これがどこから来たのか、確かなことは誰にも言えない。そして事件簿は未解決のまま静かに閉じられた。'
    coronet_rod_of_silent_court: '設計委員会はこれについて実は合意していない。それは安心材料か、あるいは深刻な懸念材料だ。'
    coronet_tonic_of_silent_court: '後味は個人の意見次第だ。その事実はラベルからそっと省かれている。'
    coronet_torc_of_empty_seats: '説明通りに機能するとされている。それでもなお、成功と見なされている。'
    coronet_treads_of_silent_court: '設計は三つの異議を乗り越えた。そのため誰も苦情を申し立てなかった。'
    coronet_visor_of_empty_seats: '形式上の抜け道で機能している。委員会はそれを見直すために再招集されることはなかった。'
    coronet_warblade_of_silent_court: '票が割れた末に承認された。その論争は始めた者たち全員より長く続いた。'
    corvid_eye: 'ビーズのように黒く、まだ見ているようだ。薬剤師は夜間視力の軟膏に挽く。倫理的に不透明。'
    corvid_feather_lance: '空気力学のためカラスの羽で飾った。カラスたちはまだ怒っている。'
    crab_claw_grips: '生涯を物にしがみついて決して離さなかった鋏から作られた篭手だ。その頑強な特性をそのまま受け継いでいる。外すには温水と忍耐と、そして批判しない友人が必要になる。それでも数時間かかる場合もある。覚悟せよ。'
    crab_claw_hatchet: 'その爪は今も勝手に開閉する。たいてい都合の悪い瞬間に。'
    crab_claw_joint: '巨大な爪のヒンジ機構。技術者はこれを研究する。その工学は我々が作ったどんなものより優れている。'
    crab_pincer_shivs: '研いだ蟹の爪関節。切る前につねる。それがなぜか余計に痛い。'
    crab_shell: '非常に空腹な誰かとの口論に明らかに負けた甲殻類から収穫された、頑丈な殻。'
    crab_shell_cuirass: '甲冑職人は蟹を一目見て「これはもう胸当てだ」と言い、本質的には形を整え油を塗っただけの作業に満額を請求した。抗議しても通じなかった。職人ギルドはこの種の商取引を「伝統的な価格設定」と呼んでいる。新人が請求書を書くときの手本として、今も使われているという。'
    cracked_bone: 'もっと良い世紀を見てきた大腿骨。ひびにもかかわらず驚くほど固い。犬はまだ欲しがる。ネクロマンサーも。'
    cracked_mace: '振るたびに頭部がガタガタ鳴る。構造的完全性は保証ではなく提案。'
    crazy_belt: 'ゴブリンのベルト。ベリージュースでは絶対にない顔料で深紅に染められている。'
    crazy_helmet: '兜についての当てにならない噂を、又聞きで一度だけ聞いたゴブリンが組み上げた。'
    crazy_tunic: '正気を失って久しいゴブリンがかつて身にまとっていた深紅のローブ。'
    crimson_brick: '炉から出て何時間も温かい血赤のレンガ。杖彫師が杖の芯に削る。'
    crimson_truffle: 'あまりに希少な地下の珍味で、価格はまともな市場の論理ではなく競売で決まる。'
    crimson_truffle_heart: '深紅のトリュフが作り出した最も深い房から取り出された、密で脈打つ核。'
    crooked_staff: '魔法の壮大な妄想を持つ杖。唱えられる唯一の呪文は『軽い恥ずかしさ』。'
    crow_feather: '虹色に輝く黒い羽。ペン職人は良い金を払う。カラスの亡霊がペンの軌跡に取り憑く。らしい。'
    crown_dust: '二つの異なる説のもとで二度も分類された。その後解散した委員会によって。'
    crown_of_quills: '何を戴冠させるのか忘れた王冠。それは不快に座り、その独自の権威や目的を確信していない。'
    crown_of_the_void_sovereign: '虚無には公式には君主がいない。この王冠は自称にすぎず、その場に居合わせた誰にも異を唱えるだけの密度がなかった。目録には所有者が「係争中」と記されている。'
    crownfire_rod: 'さらなる審査待ちの、暫定的な稼働状態にある。そのため誰も苦情を申し立てなかった。'
    crownless_blade: '完成後にその目的が見直された。代替案を思えば、ささやかな救いだ。'
    crownless_cuisses: '留保付きで機能する。返金なし、追加の質問も受け付けない。'
    crownless_signet: '結局は言われた通りにする。全員が議論をあきらめた末の妥協案だ。'
    crownrot_cuirass_crown: 'その信頼性は今も議論の的だ。作り手はその考えを終える前に次へ進んでしまった。'
    crownrot_cuirass_godbone: '結局は言われた通りにする。ほとんど何も解決しない解決策だ。'
    crownrot_greaves_of_gilded_ruin: 'たった一つのことをこなし、それすら疑っている。それは設計上の欠陥か、あるいは意図そのものだ。'
    crownrot_helm_crown: '説明通りに機能するとされている。作り手はその考えを終える前に次へ進んでしまった。'
    crownrot_helm_godbone: '説明書は白熱した議論の中で失われた。着用者はそれを信じることに決めた。'
    crownrot_ration_of_rotting_halo: '急いで下された決断のような味がする。そのため結果には大きな個人差がありうる。'
    crownrot_signet: 'ほとんどの状況で、一応は機能する。着用者はその曖昧さと共存することを学んだ。'
    crude_branch: 'ある者にとっての薪は、どうやら別の者にとっては伝説のクラフト素材らしい。'
    crude_hatchet: '棒に付けた研いだ石。原始人スタイルは無料。'
    crude_ring: '宝飾品を志す曲げた針金。目を細めて首を傾ければほぼ意図的に見える。'
    crystal_bread: '皮はきらめき、中身も光る。あなたの歯医者は、職人気質な意見を述べるだろう。'
    crystal_focus_staff: '砕けた水晶が取り付けられており、あらゆる呪文を自分の気に入った方向へ曲げてしまう。それはめったに、あなたが狙っていた方向ではない。古参の魔導士たちはこれを「個性」と呼ぶ。射線上にいる者たちは、もっと短い言葉で呼ぶのだが。'
    crystal_ice_staff: '頂を飾る水晶は一度も溶けたことがない――鍛冶場の熱にも、夏の日差しにも、意地にも屈せずに。飲み物を冷やすには便利だ。敵に対して使えば、はるかに説得力を増す。'
    crystal_tide_staff: '潮力エネルギーで脈動する赤い水晶が頂に乗った杖だ。時折滴り落ちることがあり、大事な場面で持ち主が丹念に準備したドラマチックな効果を余すところなく台無しにする。水は場の空気を読まない生き物だ。水が語る。'
    crystal_ward_tome: '砕けた水晶で覆われている。これを通して唱える呪文はどれも、ゆっくり落ちるシャンデリアのような音がする。'
    crystallized_loaf: 'あまりに鉱物質が濃く、鍛冶屋は食べずに砕いて破片を採る。無理もない。'
    crystallized_tanjirize: 'どんな植物学者にも説明できず、大半が考えたがらない変質を遂げたタンジライズ。'
    cuirass_of_the_hollow_king: '王が発注した鎧ではない。ヴォイドモスが育てた鎧を、後に王が自分の手柄として着用しただけだ。その違いを気にしたのはただ一人。もはや異議を唱えられる立場にはない。'
    cured_gauntlets: '適切になめされた革。やっと濡れた犬の匂いがしない。代わりに乾いた犬の匂い。'
    cursed_amalgam: '薬草師のキャリアの集大成を一つの瓶に凝縮。夜にささやく。何を言っているかは誰も聞かない。'
    cursed_boot_contradiction: '動きの自由を頑固さと交換する呪われた長靴。着用者は不器用に動くが、純粋な矛盾を通じて自分たちは無敵だと考える。'
    cursed_fungus: '薬草師の野望の紛れもない頂点であり、棺の蓋を擦る枯葉のような声で近づく者の名を囁くほど凝縮された悪意を持つ菌類。熟練の採取者によれば、採取されるというよりは自らが取られることを許すのであり、その区別は何の慰めにもならない。'
    cursed_gem: '長く持ちすぎた者に暗い約束をささやくが約束の大半は腰痛に関するものだ。'
    cursed_gem_powder: '粉砕後にささやきがひどくなった。今ではリアルタイムでクラフト技術を批評する。'
    cursed_helm_paradox: '心を鈍くしながら体を強化する呪われたヘルム。それは明快さの喪失を通じて人生を与え、矛盾に書かれた取引である。'
    cursed_loaf: '持つ者にレシピを囁く。パンはあなたの製造技術に意見を持っており、それは優しくない。'
    cursed_root: '呪われた菌類から本当の苦労をして引き剥がされたもの。背骨も持たぬ身にはおよそ不相応な力で握り返す癖があるからだ。保管中も温かさを保ち、時折痙攣する。熟練の薬草師たちはこれを正常だと言うが、その口調は誰一人として納得させない。'
    cursed_straw: '予想以上に活発だったかかしから取った。誰も見ていないとまだ痙攣する。'
    cursed_straw_amulet: '口を持たないはずの何かが立てた誓い。それでも意地だけでその誓いを守り続けている。'
    cursed_wheat: '邪悪な魔法で黒ずんだ穀物の茎。その粒は不満げに囁いている。'
    deadweight: '仕事に必要な以上に重い。だがその余剰について、仕事の方から文句が出たことは一度もない。'
    deathgrip: '衝撃の瞬間に指を固定し、着用者が望むよりも一拍長く固定されたままになる。'
    deathless_blade: '古き墓地から引き出された。死と生の狭間に研がれた。自らの役割を覚えた道具。'
    deep_scale: 'そこから来た深淵のように黒い。リヴァイアサンは何千枚もまとっていた。お前が持つのは一枚だ。謙虚でいろ。'
    deepbreath: '深呼吸に意識的な努力が要るほど体にぴったり合う。大抵の着用者は二週目には気にならなくなる。'
    deepmoss_leggings: 'どれだけ履いてもかすかに湿ったままの苔が詰められ、苔熊が巣くうどこかから採られている。乾いていることについて一家言ある。その意見は負ける。'
    deepreach: '術者の届く範囲を、本人が直接訪れたくはない場所にまで広げる。'
    deepscale_fists: '古い墓に巣くう者への備えとして拳を補強した。'
    deepwater_breastplate: '泥沼の水に浸され、錆すら諦めた。沼の匂いがするのは、それが沼そのものだからだ。'
    deepwater_stilts: '最悪の泥からは逃れられる高さに立たせる。それでも悪臭は這い上がってくる。'
    deepweald_longbow: 'ウィールドの濃い闇の中を矢を音もなく放てるほど張られている。ここでは音が視覚よりも遠くまで届く。この地の群れは耳で狩る。君もそうすべきだ。'
    deepwoven_carapace_of_deep_canopy: 'その名の由来である樹冠のように層をなし、各層が下の層から育つ。だから修理は鍛冶より園芸の仕事になる。'
    deepwoven_cincture_of_drowned_weald_matron: 'マトロン自身の糸で巻かれ、人の手が結んでいない結び目を保ち、それを解くよう説得されはしない。'
    deepwoven_cincture_of_drowned_weald_mire: '冷たい水の中でひとりでに締まる織りの帯。便利な反射だが、先に尋ねてこないことを思い出すまでの話だ。'
    deepwoven_composite: 'ウィールドで最も深い作業台で圧をかけて織られ、層があまりに固く結びつくため、継ぎ目は特徴というより噂になる。'
    deepwoven_crest_of_deep_canopy: '生きた樹冠の蔓が織り込まれ、着用者の頭の上でゆっくりと、本人の選ばぬ方向へ伸び続ける。'
    deepwoven_crest_of_drowned_weald: '水中であまりに固く織られ、ついぞ完全には乾かず、今や意地でもあるべきより髪一筋ぶん重い。永遠に。'
    deepwoven_philter_of_drowned_weald_matron: '決して完全には溶けきらぬマトロン絹に浸され、その糸が一本必ず残り、頼まれもせぬものを繕う。'
    deepwoven_philter_of_drowned_weald_mire: '案内人が携える飾り気のない版で、効き目は半分、信頼は二倍。ここでは、その取引が君を生かしておく。'
    deepwoven_splitter_of_deep_canopy: '層を縛り閉ざす樹冠の蔓を切り倒すために均衡が取られた、平凡な仕事を、桁外れの熱意でこなす。'
    deepwoven_tassets_of_deep_canopy: '上の樹冠のように重なり合う葉状に育ち、低い一撃は葉を分けても、さらなる葉に行き当たるだけだ。'
    demon_codex: ''
    dented_mace: '駐車場のバンパーより凹みが多い。各凹みは『膝より低く狙え』の教訓。'
    diadem_casque_of_broken_diadem_crown: '着用者は機能すると言い張るが、証拠は決定的でない。かなりの時間的圧力の中で下された決定だ。'
    diadem_casque_of_broken_diadem_godbone: '技術は確かだが、前提はそうではない。それは聞こえる通り、まさにその程度の安心感でしかない。'
    diadem_charm_of_falling_crown: 'その効果は独立した検証を一度も受けていない。もはや誰もそれに異議を唱える気力がない。'
    diadem_chausses: '純粋な意地だけで完成させられた。もはや誰もそれに異議を唱える気力がない。'
    diadem_cordial_of_falling_crown: 'ラベルには誰にも特定できない成分が記載されている。その事実はラベルからそっと省かれている。'
    diadem_elixir_of_broken_diadem: '効果は現れることもあれば、現れないこともある。そのため保証ではなく、肩をすくめる仕草付きで売られている。'
    diadem_lattice_crown: 'その正確な性質は誰に尋ねるかによって変わる。その食い違いを解決する担当者は誰も任命されていない。'
    diadem_lattice_godbone: '一つの素材か複数の素材かはいまだ未決着だ。そして二つ目の説明は完全には否定されなかった。'
    diadem_vambraces_crown: '最終的に割り当てられた仕事をこなす。それは設計の核心か、単なる誤差にすぎない。'
    diadem_vambraces_godbone: '申告された機能を目に見える渋々さで果たす。そのため議論は無期限に棚上げされた。'
    diamond: '圧縮された炭素の欠片。壮大になるのを忘れてしまった。大地の強欲な握りから掘り出されたもの。'
    diamond_bag: 'この袋の中身なら小国が買えるが、投擲武器としては期待外れだ。'
    diamond_bread_1: '粉々に砕いたダイヤモンドをまぶしたパン。その一口ごとの満足感ある歯ざわりは、顎に罰を与える。'
    diamond_powder: 'この世で壊れないものが値札だけだという証拠。'
    diving_crude_grips: '水没した坑道の奥では、生きた手には到底扱えぬほどの握力で何でも掴み取る。地上に戻れば、その握力はあなたの忍耐力に向けられる——乾くまで三日、その間ずっと、調子の悪い潮だまりのような匂いを漂わせ続ける。'
    diving_visor: '沈む前に三人の漁師とカモメ一羽と戦ったカニから作られた面当てだ。まだ不意にガチャンと閉まることがある。それを職人はあらゆる論理に反する揺るぎない自信を持って「仕様」と呼び続けており、誰も訂正しない。。'
    doomed_axe: '最後の埋葬人が保った。七百の墓。仕事は止まらぬ。故に錆びぬ。'
    doomed_battleaxe: '三度目の召集で支給された制式装備。二度目の行方を聞く者はいない。'
    doomed_club: '言葉が尽きた後に続く一文。この地で言葉が通じることは滅多にない。'
    doomed_fang_daggers: '灰の寡婦から得た双子の刃。まだ噛み跡を覚えている。'
    doomed_grimoire: '埋葬前に記録された一項一項。余白は今なお埋まり続けている。'
    doomed_longsword: '振るうたびに忘れた誰かの名を囁く。偶然だろう、たぶん。'
    doomed_mace: '誰も守らなかった約束から鍛えられた。一振りごとが、あまりに遅れて届く謝罪。'
    doomed_shortbow: 'この弓から放たれた矢は音より先に届く。的が文句を言うことは滅多にない。'
    doomed_spear: 'もう苦情を申し立てぬ槍兵から徴発された。'
    doomed_staff: '圧縮された恐怖の核を通して水魔法を伝導する。非常に効率的で、道徳的には疑わしい。'
    doomed_sword: '鍛冶師の引退前最後の作品。引退は自発的ではなかった。'
    doomhammer_eternal: '分断兵の系譜が、論争や戦闘を、そして最終的には自らの兵歴そのものを終わらせるために使ったハンマー。論争がまだ完全には終わっていないかのように、今も振るわれる。'
    draconite: 'ドラゴンがぜひ返してほしい結晶化したドラゴンエッセンス。採掘をやめてください。'
    draconite_powder: '常温でもうっすら煙が上がる。保管には耐火金庫と、かなり落ち着いた精神が要る。'
    draconize_flour: 'こねるには耐火手袋が必要。出来上がったパンは時折、こちらに唸り返すことがある。'
    dragon_fire_breath: ''
    dragon_frost_breath: ''
    dragon_petal_extract: '八つの材料、一本の小瓶。ラベルが『魔法』と呼ぶ温かさの説明は一切ない。'
    dragon_pollen: 'ドラゴンリリーの雄しべから採れる細かな金色の粉。これまで考案されたあらゆる錬金測定器をわずかに狂わせ、乱さぬが賢明な力の近さを匂わせる温もりを放つ。あまねくアレルギーを引き起こし、並外れて貴重で、そしてかすかだが紛れもない後悔の香りを帯びている。'
    dragon_void_essence: ''
    dragonite_crust: '割ると反撃する皮。斧鍛冶が自己研磨効果のために破片を斧頭に埋め込む。'
    dragonlily: '虹色の鱗を纏い、葬儀場と硫黄坑を掛け合わせたとしか言いようのない悪臭を放つ植物学上の不可能物で、本物の竜でさえ不快に感じて避けるほどである。学者たちは、これが爬虫類のふりをした植物なのか、野心を捨てた爬虫類なのかで意見が分かれている。'
    drakar: 'Draconic plate that runs warm to the touch. Small dragons find it flattering; large ones find it rude.'
    draugature: '古墳墓の容赦ない寒さで鍛えられた硬化革の帯。凍てつく荒野を彷徨う安息なき死者の腱で編まれている。'
    draugr_bone: '驚くほど二つに折れない。古い死後硬直は、と墓掘り人たちは言う、ドラウグルを本当の意味で離すことはない――どうやら、死後には終わるはずだという肝心な部分を読み損ねたらしい。'
    draugr_bone_staff: ''
    draugr_daggers: '村のバカが作ったと言われている。しかし村のバカは否定し、自分には基準があると主張している。'
    draugr_fractured_amulet: 'ドラウグル由来のひび割れた魔除け、そのルーン文字の象眼が古びた骨の上で砕けている。'
    draugr_helmet: '身につけても権威も敬意も得られないが、後退する生え際を隠すには絶好の品だ。'
    dread_lance: ''
    driftwalkers: '跡を残さない。そもそも地面に触れている時間が短すぎるからだ。'
    drowned_amber: '水中で固まり、その時通りかかった何かを閉じ込めた樹脂。蝋燭の明かりで検めぬほうがいい。'
    drowned_root_grimoire: 'どこで見つかったのか根の樹皮で綴じられ、腐って柔らかい頁だが、なぜかインクだけは無傷だ。余白は深淵の神託が書いたと囁かれている。'
    drownmarked_casque_matron: '深淵のマトロンが脱ぎ捨てて取りに戻らなかった板から裁たれた。それは幸運か、あるいは誰も受けたことにしたくない誘いのどちらかだ。'
    drownmarked_casque_mire: '深いウィールドが、奪って返すものすべてに残す蒼白い潮線を帯びている。それは、ウィールドが返すと認めたがるより多くのものだ。'
    drownmarked_chausses_of_rising_tide: 'ウィールドが下層を奪った夜、水が上がったまさにその高さに印がつけられ、記憶として、時に警告として穿かれる。'
    drownmarked_cordial_of_rising_tide: 'ウィールドが無いと言い張る潮の変わり目に調合され、仕込む者は勘で見計らい、説明を拒む。'
    drownmarked_elixir: '深いウィールドが触れたものすべての蒼白い潮線を帯びる。表示はそれを真正の証と謳い、賢者はそれがどこを経てきたかの印として読む。'
    drownmarked_kris_of_fen_below: '沼水に浸る時が長いほど波紋が深まり、古いものはまっすぐな刃では縫い閉じられぬ傷を切り開く。'
    drownmarked_loop_matron: 'マトロンが、仕上げる価値なしと決めた何かに残した牙から鋳造された。着用者が共有したくない栄誉だ。'
    drownmarked_loop_mire: '沼水で、蝋燭の光を呑み込む黒に染められ、己の手が目を引かぬほうがいい者たちが身につける。'
    drownmarked_resin: '深い水が引き取った木から滲み出た樹脂で、いまだゆっくりと涙し、職人はそれを、まだ死に終えていない証と受け取る。'
    drownmarked_saber_of_fen_below: '案内人が下層フェンと呼ぶ層から回収された。彼らがその名を口にするのは、道案内のためというより、近づかせぬためだ。'
    drownmarked_saber_of_rising_tide: '焼き入れされた水の形に湾曲し、流れに沿って断ち、流れに逆らって振る者には抗う。'
    drownmarked_tome_of_rising_tide: '水中で開くたびにインクが少しずつ滲む。深いウィールドの学者は、それは本が自ら改訂しているのだと言い張る。'
    dualpact_circlet: '二つの元素に縛られている。合意したのは共同親権のことだけ。'
    duke_breastplate: '一枚のコインを取り合う二匹のゴブリンの紋章が刻まれている。どちらも勝てない。'
    duke_crossbow: ''
    duke_rapier: 'ゴブリンの公爵から奪ったもの。背中を掻くためだけに使っていたのだと、大声で何度も言い張っていた。宮廷の誰一人として信じなかったが、誰もがそのまま語らせておいた。'
    duke_sash: '自らは出席しなかった処刑のたびに纏われた帯。体裁がすべて。'
    duke_signet: '親指を立てた棒人間の形をした印章。本人が自ら発注したものだ。'
    duke_signet_ring: 'ゴブリン流の高貴さとは、自ら何人の同輩を階段から突き落としたかで決まる。'
    duke_sword: 'かつて税制について非常に強い意見を持つゴブリン公爵のものだった。'
    dungeon_key_goblin_cave: 'この錆びた鉄の鍵は微かな魔力を帯びており、所持者はゴブリン王の宝を守る隠された結界を通り抜けることができる。'
    duskfire_rusk: '夕暮れ時にほのかに光る。革職人はこれに革を浸すが、その仕上がりを説明できる者はいない。'
    duskite: '光をあまりに貪欲に吸収するため鉱夫が自分のポケットの中で見失い続ける鉱物。'
    duskite_powder: '本物の影さえ日向のように見せてしまうほどの暗さ。化粧品商人がただ一度だけこれを試したという言い伝えがある——それ以来、その客が昼日中に店を出るところを見た者は誰もいない。'
    earthsea_tassets: '半分は大地、半分は海洋。互いに相手を見せかけだと確信している。'
    ectoplasm: '半透明の幽霊の残留物。エンチャントされていない容器を通過する。保管はそれ自体が冒険。'
    ectoplasm_locket: '生者の誰も見覚えのない肖像が開く。死者の何人かは知っているが、語らない。'
    ectoplasmic_tome: '製本が半透明の粘液を滲み出し続けている不気味な魔導書だ。司書はそれが正常だと断言した。その司書もまた半透明だった。それはサインだったはずだ。しかし誰もそれ以上の質問をしようとはしなかったのである。。その真実は闇の中に眠る。'
    ekusoni: 'An exorcist mask that hums faintly near the recently deceased. Probably nothing.'
    elder_totem: '関節炎の手で数十年かけて彫られた。穏やかな知恵と、今日あなたがしたこと全てへの軽い不承認を放射する。'
    elder_totem_amulet: '道具の痕が書道のように見えるほど小さな手で、クウィベックの古木から彫られた。トーテムはクウィベックが名付けることも、描写することも、存在を認めることも拒む生き物を描いている。しかし、その肖像には立派な代金を請求する。'
    elder_totem_talisman: '空の母后がパンドラに名がつく前から守り続けた図騰から彫られた。'
    elemental_catalyst_air: ''
    elemental_catalyst_earth: ''
    elemental_catalyst_fire: ''
    elemental_catalyst_water: ''
    elixir_of_agility: '猫並みの液体反射神経。判断力は付属しない。それはほぼ即座に露呈する。'
    elixir_of_chance: '確率を蒸留した一品。ステータス表は向上するが、実際の運は悲しいほど変わらない。'
    elixir_of_intelligence: '一時間だけ知性を研ぎ澄ませ、自尊心はそれよりずっと長く研ぎ澄ませる。'
    elixir_of_strength: '一時的に二倍の体格の者のように殴れる。副作用は過信と不随意の筋肉アピール。'
    elixir_of_vitality: '進撃前に定例支給される。準備ができているかは問わぬ。'
    embalmed_ancestral_club: '防腐の儀式の後に残ったもの。あるべき重さより重い。'
    embalmed_bow: '埋葬香に漬け込まれた。死体番人の兵器庫から抜かれた。弦は生者のためではない。それでも保つ。'
    embalmed_club: '一振りごとに、深い理由あって眠っていた何かを起こしてしまう。'
    embalmed_cuirass: '墓掘り人の備蓄から得た防腐の絹で裏打ちされている。他のすべてが崩れた後も形を保つ。'
    embalmed_grips: '死者と同じ絹に包まれている。握りは緩まぬ、その後でさえも。'
    embalmed_legguards: '脚はミイラのように包帯だらけ。それでいて妙に装飾のセンスがいい。'
    embalmed_locket: '葬絹に描かれた肖像を収める。中の顔は写された日から老いていない。'
    embalmed_silk: '霜シャンブラーから引き剥がされた包帯で、防腐術士の技巧ではなく、幾世紀もの寒さによって新鮮なまま保たれている。それがどこにあったのか尋ねないと決めたなら、上質な包帯になる。'
    embalmed_silk_ring: '防腐絹で編まれた指輪。死者はこれを着けると驚くほどしっかり握手する。'
    ember_core: '鉱物に閉じ込められた小さな太陽。ポーチを焼き抜ける。経験豊富な冒険者は陶器の壺で運ぶ。'
    ember_core_scepter: '鉄にはめ込まれた熾火。安らぎを感じるのは、その熱が一度たりとも上がるのをやめていないと気づくまでの間だけだ。古参の鍛冶師たちにはその感覚を表す言葉がある。優しく訳せる言葉ではない。'
    ember_reduction: '食堂のロースト肉から取った脂。揚げ物に、防水に、猟犬の買収に。一瓶で全部こなす。'
    ember_scripture: '熱を受けてはじめて浮かぶ文字で記されている。読むには炉と、聖人並みの忍耐がいる。'
    ember_shortbow: '放たれた矢は的に届くまでずっと輝き続ける。矢羽根職人はそれを美しいと呼び、射手はそれを、二度と誰も驚かせられなくなることだと呼ぶ。'
    ember_silk: '永遠にくすぶり続けるコクーンから丁寧に紡ぎ出された希少な素材の糸。触れると心地よい温もりが確かに伝わってくるが、不用意に扱えばたちまち制御不能な熱を帯びる非常に危険な素材だ。扱いには注意せよ。慎重に扱うべき素材だ。'
    ember_silkblade: '発火して焼き入れされた絹の繊維から鍛えられた、決して冷えることのない燃える刃。指が重度の火傷に対して免疫を持っていれば、結んで結ぶこともできる。'
    ember_studded_belt: 'この羊毛が刈り取られた瞬間、マグムーリガンは全身炎上していた。刈り手も程なく同じ悲惨な運命を辿ることになった。完成したベルトは残り火の温もりと、時間が経っても薄れることのない相互後悔の感情を宿している。'
    ember_walkers: '靴底は決して冷めない。魔法の驚異か、深刻な設計ミスかは意見が分かれる。'
    emberchant_breastplate_of_last_verse: '祭壇のテーブルから一息に引き抜かれた。燭台は何も気づかなかった。'
    emberchant_breastplate_of_twelve_voices: 'あなたと世界の間に、綿入れ八層。世界は察してくれる。'
    emberchant_composite: '歌いながら重ねる。昔の鍛冶がそれで木目が締まると言い張ったからだ。実際締まる。理由は誰も知らない。'
    emberchant_core: 'どうしても消えない炭。鍛冶場は喜ぶ。ポケットに入れて運ぶ者は、すぐにやめることを学ぶ。'
    emberchant_extract: '煮立てたあとに残るもの。料理人は出汁と呼び、錬金術師は溶媒と呼び、排水口は同僚と呼ぶ。'
    emberchant_hand_axe_of_twelve_voices: '投げられるほど小さく、手放せぬほど質が悪い。その選択が戦うたびにつきまとう。'
    emberchant_legguards_of_last_verse: '竜が暖房を務める建物での真冬用ウール。おばあちゃんは反論を受け付けない。'
    emberchant_tonic_of_last_verse: '蜂蜜と薬草と、ささやくほどの灰。説教より長持ちする溶けにくさ。'
    emberchant_treads_of_last_verse: '真夜中に冷たい敷石を渡っても地下聖堂を起こさない厚編み。'
    emberchant_waraxe_of_twelve_voices: '聖歌隊には十二の声がある。これはその十二すべてで一度に口論を片づける。'
    emberglow_staff: '先端の燃え殻は完全には消えない。使い手の指先の火傷も同様に。'
    embermaw_gauntlets: '燃え殻の心臓の破片から持続的に発せられる残留熱が、このガントレットを着用中に常に不快なほど温かくし続けている。熱病患者と握手を交わしたときのあの独特で忘れがたい感覚に酷似している。忘れがたい感覚だ。熱は収まらない。'
    emberwalk_striders: '生きた炭の上を平然と渡らせてくれる。帰りは別売りだ。'
    emberweave_hauberk: '燃えていたことを今も覚えている繊維で織られており、あなたにもそれを忘れさせない。'
    empyrean_charm_of_broken_diadem: '申告された機能を目に見える渋々さで果たす。その違いはいつしかどうでもよくなった。'
    empyrean_elixir: '用量の説明はラベルの途中で矛盾し始める。そして今のところ返金を求めた者はいない。'
    empyrean_sash_of_falling_crown: '完成後にその目的が見直された。作り手はおおむねそれを支持している。'
    enchanting_dust: 'ジュエラーがアクセサリーに振りかけて不吉に光らせる魔法残留物の粉末。'
    enka_muru: 'A traveller’s cloak stitched for long roads and short conversations.'
    enriched_dough: '鉱物で強化された生地。地質サンプルと言っても通る。職人はこれを信奉する。'
    ensable_crystal: '博物館に置かれるべきだと、支払いを拒んだあらゆる博物館が口を揃えて言う。'
    ensable_key: '差し込み方を誤れば錠は黒曜石で満たされる。幸運は慎重な者に味方する。'
    ensable_pincers: '地の底の何かは、今なお探し続けるほど強くこれを取り戻したがっている。'
    etched_signet: '狼か猫か抽象芸術かもしれない刻印の紋章。宝石職人も確信がなかった。'
    eternal_biscuit: ''
    eternal_eclipse_blade: '光源が何であれ常に影の中に存在する。それが切り出されたヴォイドモスの翅と同じように。天文学者たちは意見を持っている。この刃はそれを求めたことは一度もない。'
    eternal_wisdom_chain: 'この駐屯地を通った木箱すべての鍵を提げている。'
    eternwool_band: '百の同胞と同じ鋳型から作られた。これだけが戻ってきた。'
    ethereal_ukranize: '記録上あるはずのない場所で発見された。そのため台帳には両方が並記されているだけだ。'
    evenhand: '鍛冶屋が明かさない微細な比率で均衡が取られている。使い手は皆、自分だけを贔屓していると誓う。実際はそうではない。'
    executioners_verdict: '振り下ろすと軍法会議の木槌のように鳴る。その世紀にくじで貧乏くじを引いた分断兵が下したものだ。判決は常に同じ。書類手続きは不要。'
    faded_spellbook: '半分のページが欠落し残りは滲んでいる。判読可能な呪文は200年前の買い物リスト1つ。'
    fangs_of_the_abyss: '虚空の底で永遠に眠り続けるべきだった太古の何かから、強引に引き抜かれた一対の双刃。その柄は今でも時折、まるで確固たる意思を持つかのように不気味に小刻みで痙攣を繰り返す。今も眠れぬものだ。深淵は覚えている。'
    farpoint: '使い手がまだかろうじて見える程度の標的に照準を合わせる。着弾する頃には、それはもう真実ではない。'
    farshot: '傷痕でまともな射手が必要とする射程を超えて張られている。撃つ価値のあるものは、既に匂うほど近くにいるというのに。'
    farwalker: '壁で誰も必要としないはずの距離のために作られた。だが明らかに誰かがそれを必要としていた。'
    faultline_extract: '生きた亀裂から搾り取る。扱う者は手袋をするが、亀裂は手袋など気にしない。'
    faultline_grips_of_split_sky: '断層の上の空がついに固体であるふりをやめた日、リフトリングの前肢に鋳込まれた。握力は三倍になる。奥行き知覚はその代償に耐えられない。'
    faultline_hand_axe_of_torn_ground: '探鉱用として売られている。使い道はもっぱら、そのもう一つのほうだ。'
    faultline_poultice_of_split_sky: '脱皮中のリフトリングの継ぎ目に詰め込み、新しい殻が歪んで固まるのを防ぐ。人間にもだいたい同じ程度に効く。つまり、むらはあるが効く。'
    faultline_quartz: '破断面に沿って育った。だから肝心の一本の線以外は完璧だ。'
    faultline_torc_of_split_sky: '技術的にはもはや一つの空ではなくなった空を見つめながら、ある門番がこれを身につけていた。継ぎ目に沿って地平線を二重に映す。二つ目の映り込みは、こちらを見返すとも言われている。'
    faultline_torc_of_torn_ground: '文字通りあなたを大地に接地させる。その大地が笑い話のような世界で。結果はまちまちだ。'
    faultline_treads_of_torn_ground: 'リフトリングの脱皮した足板を底に用いており、かつて生きていた肢と同じ本能で断裂した地面を掴む。片方の靴底は常に足場を見つける。もう片方は、それについてまだ言い争っている。'
    faultline_visor_of_split_sky: 'この世界では地平線に継ぎ目がある。縁起担ぎに見つめるのは自由だが、賢明ではない。'
    faultline_warbelt_of_split_sky: '小さな武器庫を吊るせるほど幅広い。着用者はたいていそうして、重さを後悔する。'
    featherfall_daggers: 'この結果に同意した覚えは誰にもない。委員会はそれを見直すために再招集されることはなかった。'
    feathergilt_ingot: '発見されて以来、その分類は議論の的だ。そのため購入者は自ら判断するよう勧められている。'
    feathergilt_visor_of_silent_court_crown: '書面での抗議のもとで機能に同意している。そのため意見の相違はそっと設計に組み込まれた。'
    feathergilt_visor_of_silent_court_godbone: '仕事を終えたあとに、それを謝罪する。そのため元の苦情は正式に取り下げられていない。'
    feathergilt_waraxe_of_silent_court: '作り手はそれ以上の説明を拒んだ。着用者はその曖昧さと共存することを学んだ。'
    fen_amulet: '沼生まれで沼の香り。社会的孤立とよく合う。'
    fen_gland: '獲物を引き寄せる。それ以外の全員は、同族すら遠ざける。'
    fen_impaler: '沼から引き抜かれた。沼はびしょ濡れのまま正式に抗議した。'
    fen_mace: '沼の最深部に住む何かに祝福された。会いたくはないだろう。'
    fen_moss_clump: '湿地生物に繁茂する有毒な沼の苔。薬草師は毒の治療薬に使う。皮肉は彼らにも分かっている。'
    fen_moss_mallet: '夜が明けると自然に完全に再生する生きた沼の苔で全体を覆われたマレット。十分に力を込めて何かを叩きつけると、苔が静かで物悲しいため息をつく。それが満足の声なのか不快の声なのかは永遠に不明だ。苔は正直者だ。'
    fen_reaper_axe: '葦も骨も同じ辛抱強さで刈り取る。沼はどちらにも事欠かない。'
    fen_reed: '沼が最も深い場所にしか育たぬ鉄のように硬い葦。腕を突っ込み、それが戻ってくると信じられる者だけが採る。'
    fen_trident: '沼の泥を分厚くまとった三本の穂先を持つトライデント。放つ強烈な悪臭だけで大抵の敵を十分な安全距離に退けることができる。残念なことに、同じ忌避効果が味方にも完全に等しく働いてしまう。味方まで退ける。敵も味方も遠ざける。'
    fenrot_composite: 'ちょうど適した度合いまで腐らせた素材。親方が嫉妬深く守り、弟子が決まって台無しにする好機だ。'
    fenrot_draught: '飲まれぬ日ごとに少しずつ発酵が進み、やがて薬であることをやめ、一つの決断になり始める。'
    fenrot_draught_of_moonlit_mire: 'これほど深くには決して届かぬ月にちなんで名づけられた。仕込む者はそれを詩的と思い、飲む者は、正しくも、警告と受け取る。'
    fenrot_gauntlets: '腐敗は何年も前に指先の器用さを食い尽くした。残ったのは、故意にせよ偶然にせよ、本当に一度も離したことのない握力だけだ。'
    fenrot_girdle_of_moonlit_mire: '沼水で、月光の下でしか何かとして見えぬ色に染められている。月光はこれほど深くまで決して届かず、ゆえにわざと謎のままだ。'
    fenrot_girdle_of_quiet_drowning: '闇の中で片手で締められるほど腐って柔らかい。沼地が与え、直ちに代償を取り立てる小さな慈悲だ。'
    fenrot_greatblade: '点食と傷を負うほど長く沼地に置かれた。鍛冶師はそれを風格と言い換え、それ相応に値を上げた。'
    fenrot_greaves: '腐って柔らかく、それが結果として静かに動くことになる。沼地が敬う唯一の通貨だ。'
    fenrot_helm_of_moonlit_mire: '革は腐って柔らかくなり、そのままだ。それが、乾いた地の者が売る何よりも打撃をよく和らげると判明した。'
    fenrot_helm_of_quiet_drowning: '沼地を締め出すほどぴったりと封じられ、そして一部の着用者が不安げに気づくには、止めた息を中に閉じ込めておけるほどぴったりだ。'
    fenrot_ration: '沼葉に包まれた野戦医薬。それが新鮮に保ち、誰も旨いとは言わず、ただ効くとだけ言う味を与える。'
    feran_gauntlets: '一週間で生え戻る。フェランたちは動じることなく、すでに後悔など何もしていない。'
    feran_hide_belt: 'なめされたフェランの皮革は、月のない夜の海岸のように柔らかく暗い。フェランは潮間帯の孤独な捕食者であり、このベルトもその気性を受け継いでいる。湿れば不機嫌にきしみ、洒落た装備との組み合わせを断固として拒む。'
    feran_hunting_charm: 'フェランのベルトからの骨のトーテム。獲物の血と待ち伏せの臭い。レンジャーは倍額払う。質問なし。'
    feran_pelt: '信じられないほどしなやかな斑点のある猫族の毛皮。なめし職人は品質に涙する。フェランはあまり感動していなかった。'
    feran_stalker_gloves: '獲物が近づくと毛が逆立つ——それだけでなく、雷雨のとき、焚き火のそば、そして着用者が嘘をついた瞬間にも。狩人の手袋と良心が、一枚の毛皮に縫い込まれている。良心の方を望んだかどうかは関係なく。'
    fingerbind: 'これまで試したどの指にも合ってしまう。作った鍛冶屋は、それを一度たりとも安心できることだとは思っていない。'
    fire_spellbook: ''
    firesteel_grimoire: ''
    firstlight_carapace_of_closing_age: '始まりの暁がまだ届く場所にしか生じない蒼白い金属で板金されている。その面積は年ごとに狭まっており、鍛冶師たちも気づいている。'
    firstlight_extract: '始まりの光のまさにその一分で蒸留される。だから錬金術師には一日一回の好機しかなく、正午にはひどく短気になっている。'
    firstlight_halberd_of_world_wound: '壁の断片が生存可能と見なす、まさにその距離に創傷の縁を保てるほど長い。その寸法は精密で、交渉の余地はない。'
    firstlight_locket_of_world_wound: '始まりの暁のひとつまみを、色褪せる前に封じて収めている。褪せていない。着用者は、その理由を確かめようと開けぬよう忠告されている。'
    firstlight_warboots_of_world_wound: '創傷が静まる唯一の一時間、巡礼者を運び切るよう紐が締められている。その好機を逃せば、靴など問題のうちで最も小さい。'
    fish_scale: 'パイクの虹色の鱗。宝石商は安いペンダントに磨く。魚はこの件に発言権がなかった。'
    flame_crystal_staff: '決して消えぬ残り火を頂く。それを持つ魔導士自身も、なかなかしぶとい。'
    flare_band: '手にある分には穏やか。だが実際に詠唱した瞬間、本当に厄介になる。'
    flooded_nave_key: '決して完全には乾かない身廊の水で滑る。溺れた司祭は今も地下で信徒を率いている——誰に説教しているのか、説明した者はいない。'
    flying_fish_wing: '半透明の鰭。今も習慣で風を捉えようとする。'
    footnote: 'もはや存在しない出典を引用し、誰にも反証できていない主張を裏付けている。'
    fortress_legguards: '脚が要塞になる。機動力が思い出になる。'
    fracture_cordial_of_long_collapse: 'リフトリングの巣で、完全には閉じない殻の中で醸された。ゆっくりと癒し、見返りを求めない。この世界の他の何もかもを思えば、それはほとんど怪しい。'
    fracture_hauberk_rift: '折れた刃を重ねて作られている。どれも役目の途中で砕けた。その続きは、あなたが果たす。'
    fracture_hauberk_void: '脱皮前のリフトリングの体格に合わせた鎖帷子で、どの輪もわざと少しだけ歪めて鋳造されている。リフトリングと同じように、辛うじて、張力がかかっている時だけ形を保つ。'
    fracture_ingot: '真ん中に細い亀裂を入れて鋳造し、「味わい」として売る。保つ。だいたいは。'
    fracture_loop_rift: '輪に、ほとんど見えない亀裂がある。あなたは間違いなく、それを四六時中考える。'
    fracture_loop_void: '石ではない石が嵌まっている。空の台座を直視するのは、二度目はおすすめしない。'
    fracture_resin: '振りほどくより早く固まる。どの弟子にでも、そのあだ名で訊いてみろ。'
    fracture_sash: 'リフトリングの皮膚が脱皮線で擦り切れるように、両端が擦り切れている。それでいて、同じ頑固さで形を保ち続ける。取り替えることは、なぜか裏切りのように感じられる。'
    fracture_scepter_of_long_collapse: '戦いに勝つというより、崩れる壁を一枚ずつ先送りにする。崩落するトンネルをリフトリングが辛抱強く生き延びるのと同じやり方だ。遅い魔法。信頼できる魔法。'
    frost_grimoire: 'そばでどれだけ火を焚こうとも、ページは湿ったままだ。読むと知識に溺れるような感覚に襲われる――その著者が誰であれ、どうやらそれを有益な体験だと考えていたらしい。'
    frost_recurve: '氷河の深部から採取した純粋な本質を丁寧に注入したリカーブボウ。放たれた矢は飛翔の途中で完全に凍結していく。弓を引く射手の指も、遅れることなく全く同じ運命を確実に辿ることになる。凍傷に注意されたし。凍傷は想定内だ。'
    frost_sabre: '霜を引きずる曲刀。一振りごとに関係は終わる。'
    frost_shard: '永久に凍った結晶で、周囲の熱を奪い続ける。お前が冷たくならずに済むよう、代わりに冷たくいる。'
    frost_shard_spear: 'トリウムの頑丈な柄に取り付けられた霜の破片の穂先を持つ槍。いかなる熱でも決して融けることがなく、握り続けることは真の意味で人格を鍛える過酷な試練となる。それを望む者には最適の武器だ。忍耐が最大の武器だ。'
    frost_shard_sword: ''
    frost_titan_cudgel: '霜の巨人にとっては爪楊枝。お前にとっては一撃で終わる話。'
    frost_totemic_club: '凍ったトーテム像を頂く。彫られた表情は天候によって変わる。お前の運もだ。'
    frostbound_band: '音もなく刻限を示す。今も誰かが習慣で巻き続けている。'
    frostclaw_warhelm: '巨人の爪のキチンを丹念に鍛え上げ、氷河の融解水で徹底的に焼き入れした戦兜。永遠の寒さはこのヘルメット自身を少しも気にしない。しかし実際に着用するあなたは、身体の芯から確実に震えることになるだろう。震えながら戦えばいい。'
    frostfang_bow: '一度放てば、周囲の狼がこぞって遠吠えで応える。'
    frostfang_requiem: '半分は剣、半分は葬送歌。どちらを先に聞くかは、もうお前にはわからない。'
    frostfur_hatchet: ''
    frostfur_tuft: 'フロストウルフの白い毛皮、触れるといつまでも冷たい。コートには便利だ。狼には失礼な話だが。'
    frosthewn_axe: '氷河から切り出され、アダマンタイトで刃を付けた。いつでも冷製で提供される。'
    frosthowl_stilettos: '凍てつく寒気の中で不気味な口笛のような音を立て続ける一対の双剣。その奇妙で不快な音は敵にも味方にも深い不安と恐怖を植え付ける。特に味方への精神的な悪影響の方が顕著に大きい点が問題だ。味方への影響が深刻だ。'
    frostkoa_cleaver: '氷蛙の胆汁で鍛えられたこの刃は、この深部でさえ決して凍らない冷や汗をにじませ続ける。同情を求めたことは一度もない。それでも同情は寄せられる。'
    frostkoa_eye_pendant: 'その目は独自のリズムで瞬く。深く考えないことにした。'
    frostkoa_staff: '最後の一鳴きを実に堂々とやり遂げた背骨から削り出された杖。'
    frostmaw_scale: '灰の寡婦が最も古く脱いだ殻。縁にはまだ微かな温もりが残る。'
    frostshamble_girdle: 'ズボンを支えると同時に、あまり生きていない何かを後ろに引き連れている。'
    frostshamble_helm: '夜通し囁き続ける。ほとんどが批評で、しかも一つも好意的ではない。'
    frostshamble_longsword: ''
    frostshamble_pendant: '日が暮れると呟き出す。望みを口にするのは、いつも手遅れになってから。'
    frostshamble_treads: '立ち止まった後も、足跡だけが数歩よろめき続ける。'
    frostshell_aegis: '凍った蟹の甲羅を幾重にもソリウム板に重ねた。武装した海洋生物学。'
    frostshell_grimoire: '凍った蟹の甲羅で装丁されている。凍傷を紹介する前に、まず自己紹介をしてくる。'
    frostshell_pendant: '研磨されたフロストシェルの欠片をソリウムの鎖に通した。冷気と軽い心的外傷を放っている。'
    frostshell_plate: '決して解けない凍った蟹の甲殻。鍛冶師は氷点下の炉でずっと文句を言いながら加工する。'
    frostshell_signet: 'フロストクロウの甲羅の欠片で作られている。蟹は寄付届に一度もサインしていない。'
    frostward_mace: ''
    frostweaver_wraps: 'イエティの毛皮で織られ、氷河の心臓の欠片で補強されている。イエティ本人はこれに一言ある。'
    frostwolf_fang_ring: '外そうとすると噛み返してくる。群れは侮辱を忘れない。'
    frostwolf_hauberk: 'もう二度と寒さを感じない。そして二度と南の宴には呼ばれない。'
    frostwolf_leggings: '巣穴のように柔らかく、包囲戦のように頑丈。群れとは矛盾を内包するもの。'
    frostwolf_mitts: '手はいつも温かい。握手した相手には、誰が上かをそれとなく思い出させる。'
    frostwolf_paws: 'まるで家族を侮辱されたかのように氷を掴む。事情は複雑なのだ。'
    frostwolf_staff: ''
    frozen_striders: '氷処理された革が、ついに静止をやめる。ついに、動ける。'
    fungal_flatbread: '象牙蘭ペーストを染み込ませた薄いパン。仕立屋が布の防水処理に使う。'
    galerunner_crown: '退却時間を0.5秒短縮できるほど空力的。'
    gecko_chopper: '伝説によれば、パンドラが実際には持たなかった最も偉大なヤモリ王が振るったという。'
    gecko_saber: ''
    gecko_scale_leggings: 'ヤモリの尻尾は一週間で生え戻った。あなたの評判はそれよりずっとかかるだろう。'
    gecko_tail_segment: 'ヤモリが自発的に切り離した。まだくねくね動いている。錬金術に使うか、踊りを見るか。あなた次第。'
    gecko_venom_lance: '傷そのものは容易い部分で、一瞬で終わる。ゲッコーの毒が残していくものは、あなたがそこに現れたことを許すまでに、はるかに長い時間を要する。'
    gecko_venom_sac: '小さいが強力。毒は人間には致死的ではないが、一週間を完全に台無しにする。薬剤師は大好き。'
    genesis_blade: '今なお登攀を続ける巡礼者たちによれば、世界が砕ける前の姿そのものから鍛えられたという。それを裏付けられる立場の者は誰もいない。'
    genesis_greataxe_of_origin_line: '最初の一振りでたいていの諍いが片づき、二振り目はおおむね記録のためという重さだ。三振り目はめったにない。'
    genesis_hauberk: 'その作り方を記録しようと誰かが思いつく前に引かれた線で編まれている。技術は鍛冶師とともに死んだ。鎖帷子は今のところ、その喪失を生き延びている。'
    genesis_loop: '審問官を信じるならば、世界が初めて冷えて固まった最初の合金から鋳造された。そして彼らが一致するとき、たいていは信じられる。もっとも一致は稀だが。'
    genesis_mail: '巡礼者が亀裂より古いと誓う金属で編まれているが、確かなことを知る鍛冶師たちはそれを裏付けるまで生き延びなかった。'
    genesis_moss: '最初の光がなお届く場所にしか育たず、陰になった瞬間に枯れる苔。採り手は手早く動き、特に誰にというでもなく詫びる。'
    genesis_suize: '栽培そのものよりも古い、スーズの原初の系統。おそらくそれを育てようとする者たちより長く生き延びる。'
    ghost_cap: '暗闇でほのかに光る半透明のキノコ。真昼間に何時間も探し回ったあなたを嘲笑うかのように。'
    ghost_wafer: '燃え尽きた墓場の鬼火から削り取られた。弓匠はこれを弦用樹脂に加工する。'
    ghostcap_alloy: '幽霊傘の胞子を仕込まれ、かすかに光り続ける金属。加工しやすく、暗い作業台の上でも見失いようがない。'
    ghostcap_almanac_of_deep_canopy: 'その頁は圧した幽霊傘で、それが光る闇の中でしか読めず、ゆえに深いウィールドこそが、実際にそれを読める唯一の場所となる。'
    ghostcap_carapace_of_drowned_weald: '着用者が動きを止めた後も光り続ける幽霊傘の茸がちりばめられている。隠れ場所では困った性質で、棺の中ではさらに困る。'
    ghostcap_falchion_of_drowned_weald: 'その刃は幽霊傘の胞子が織り込まれ、切り口に沿って光る。だから痛みが来る前に傷が灯る。'
    ghostcap_fists_of_deep_canopy_matron: '真の闇でしか光らぬより稀な傘がちりばめられ、深い樹冠の下ではそれが常なので、一度も暗くならない。'
    ghostcap_fists_of_deep_canopy_mire: '拳頭の茸の傘は、強く打つほど明るく光り、乱闘を望まぬ光の見世物に変える。'
    ghostcap_flail_of_drowned_weald: 'その頭は硬化した幽霊傘で、振りかぶりに灯り、的にひるむべき瞬間を正確に告げながら、決してそれを許しきらない。'
    ghostcap_philter_of_drowned_weald: '飲んでから一時間かすかに光る。闇から抜け出す道を見つけるには足り、そして何かが君を見つけるにも、ちょうど足りる。'
    ghostcap_warboots_of_drowned_weald_matron: '闇の中で着用者の居所を明かす光る傘で底が張られている。作り手は、決して道に迷わぬことと引き換えなら公平な取引だと考えた。'
    ghostcap_warboots_of_drowned_weald_mire: '決して完全には抜けきらぬ水を防ぐよう封じられ、一歩ごとに、着用者だけが聞く小さな内緒のぐちゃりと着地する。'
    gilded_brew_of_last_regent: 'この製法は醸造よりも議論に時間を費やした。醸造者はそれを意図的だったと言い張っている。'
    gilded_carapace_of_hollow_throne: '信用制度のもとで機能する。それを確かめるには議論を蒸し返すしかない。'
    gilded_chopper_of_hollow_throne: '仕事を終えたあとに、それを謝罪する。そのため説明書はわざと曖昧にされた。'
    gilded_circle_of_last_regent: 'その信頼性は今も議論の的だ。そのため説明書はわざと曖昧にされた。'
    gilded_extract: '僅差で本物と認定された。そして二つ目の説明は完全には否定されなかった。'
    gilded_locket_of_last_regent: '書面での抗議のもとで機能に同意している。関係者全員が忘れることに同意した詳細だ。'
    gilded_philter_of_hollow_throne: 'この製法は醸造よりも議論に時間を費やした。それはラベルの非常に小さな文字で明かされている。'
    gilded_stilettos_of_last_regent: '満場一致の躊躇にもかかわらず完成させられた。誰も全面的には擁護しきれない妥協案だ。'
    gilded_tassets_of_hollow_throne: '語る者によって由来の話が変わる。その違いはいつしかどうでもよくなった。'
    gildsteel: '記録上あるはずのない場所で発見された。そのため両方の記録が未整理のまま残っている。'
    girthstone: '着用者の野心を、腰回りではなく測った仕立て屋によって仕立てられた。どちらも予想より大きかった。'
    glacial_basinet: '内側から曇るほど冷たい兜。視界は任意、生存は必須。'
    glacial_brand: '氷河の融水で焼き入れした長剣。斬撃の間に刃へ霜が付き、劇的に見えるだけで実際には何の解決にもならない。とはいえ敵の士気を削ぐ効果は侮れず、見た者の半数は戦う前に正気を疑うという。残り半数は戦って正気を失う。'
    glacial_buckle: 'バックルは決して溶けない霜の欠片でできている。便利だ。時々、体重を支える。'
    glacial_cinch: '氷河の心臓合金で鍛えられている。きつく締まり、決して緩まない。まずは丁寧に頼め。'
    glacial_fortress_greaves: 'これを着て動くのは立派な運動だ。じっとしているのも同じくらい運動になる。'
    glacial_grasp: '触れるものすべてがわずかに凍る。武器も。友情も。'
    glacial_grips: '極北の射手や術師のために鍛造された軽量の籠手。手のひらには半透明の膜が張られており、触覚を高めながら寒さから断熱する。致命的な温度でも手は正確に動き続ける。夜間に膜がわずかに燐光を放つことがある。それを便利と思う者もいれば、不安を覚える者もいる。'
    glacial_heart: 'イエティの胸にある凍った核心。湖を凍らせるのに十分な冷気を持つ。もう凍らせている。'
    glacial_loop: '欠けても再生する凍った結晶の指輪。いつかは寒さを感じなくなる。いつかは。'
    glacial_march_boots: '凍てつく荒野を永遠に行進するために作られた。通勤でも同じことだ。'
    glacial_medallion: '純粋な霜の結晶でできたメダリオン。一財産の価値がある。借金のような手触りだ。'
    glacial_morningstar: ''
    glacial_pike: '氷河結晶の穂先。敵は自分で選んでいない距離まで押し戻される。'
    glacial_recurve: '凍った腱で張られた弦は決して緩まない。放つ瞬間のお前の握力とは違って。'
    glacial_signet: '氷河の芯結晶から削り出した。嵌めた指を痺れさせるが、作り手はそれを長所だと言い張る。'
    glacial_verdict: 'この剣は戦いのたびに自ら判決を下す。近づきすぎた罪、それだけだ。'
    glacial_visor: '暖かいと曇る。前の持ち主は深く考えないことで解決した。'
    glacial_waistguard: '灰鞣しの革を詰めてある。輝きより戦列を保つ方が得意だ。'
    glasschant_daggers: '例の上等なはさみ。絶対に使うなと言われたはずだ。いま使っている。'
    glassong_grips: '肘まで届くゴム製。ここの流しの水はスプーンを溶かすので、少し厚手にできている。'
    glasswrought_brew_of_molten_antiphon: '夜明けからコンロで煮出し続けた一杯。口論できるほど濃い。'
    glasswrought_carapace_of_black_choir: '胸側を前にして固定する。収納時は平らに畳め、広げる時は部屋から人がいなくなる音が鳴る。'
    glasswrought_claymore_of_black_choir: '命中の瞬間に澄んだ高音が鳴る。その音を最後に聞いた者が幾人もいる。'
    glasswrought_falchion_of_black_choir: '反撃してくるパンの皮のための波刃。この教区では、実際に反撃してくる。'
    glasswrought_fists_of_black_choir: '一度も洗われたことのないフライパンのための当て布。主義として、そして油ならしのために。'
    glasswrought_focus_of_molten_antiphon: '不死鳥の羽、という触れ込み。埃が発火する。徹底的と言えば徹底的。'
    glasswrought_philter_of_black_choir_pyre: '二度焼ける。含んだ時と、そのあと本音を口にした時。'
    glasswrought_philter_of_black_choir_vitrified: '掃除婦いわく薬効あり。全員いわく灰色。'
    glasswrought_stilettos_of_molten_antipho: '言い訳のように薄い皮むきナイフ二本。林檎なら一筋で、錠前なら一晩でむける。'
    glasswrought_tassets_of_molten_antiphon: '洗い水と鼠を避けて裾を高く上げてある。実用性がこれほど陰気に見えたことはない。'
    gobadoc_eye: 'ゴブリンの戦争領主から引き裂かれた充血した目。次に食べるものを探すかのように、まだ落ち着きなく動き回っている。'
    gobeline_ring: 'ゴブリンの基準では繊細、つまり鋭い端が三つと怪しい染みが一つだけ。宝石はゴブリンの宝石職人が極めて誇りに思っていた磨かれた色ガラスの欠片。これを指摘することはゴブリン文化では重大な侮辱とされる。同時に死刑宣告でもある。'
    goblin_cleaver: '家宝だと言い張るゴブリンから盗んだ。錆がそれを否定している。'
    goblin_ear: '手作りの塩水溶液で保存されたゴブリンの耳。様々な錬金術的調合の基本成分として使用される。ゴブリンはこの慣行を侮辱的と感じている。錬金術師たちはゴブリンの反応を学術的に興味深いと感じており、それは外交関係を改善しない。'
    goblin_grudge_axe: 'この斧を持ったゴブリンは皆、最終的に別のゴブリンに使った。伝統は伝統。'
    goblin_gunpowder: '自家製爆発物。ゴブリンは量をバイブスで測る。生存率はこの方法論を反映している。'
    goblin_knuckle_ring: 'ゴブリンのお気に入りの指関節から鍛造された。本人のだ。ゴブリンはこの損失を哲学的に受け止めたと言われている。受け止められなくなるまでは。どの指にもぴったり合うのは、ゴブリンの関節が普遍的なサイズだからだろう。進化とは不思議なものだ。'
    goblin_loot_bag: '盗まれた小物でいっぱいの小さな麻袋。ほとんどボタン、鶏の骨、そして誰かの後悔のラブレター。'
    goblin_masher: 'ゴブリンは料理を味付けするのではなく、これに紹介する。この技術は頭蓋骨にも驚くほどよく通用する。'
    goblin_raider_vest: '雑多な皮革で縫い合わされたゴブリンの略奪者の胴鎧——各パネルは異なる出所を持つ。縫い目は不均一だが頑丈だ。内側の詰め物はその日に手に入ったもので作られている。全体的に通気性が悪く、六ヶ月間野営のにおいがする。それは特徴であって欠陥ではない。'
    goblin_scimitar: 'ゴブリンは剣を鍛えない。見つけるのだ。これは誰かの肋骨の中で見つかった。'
    goblin_stompers: '再利用金属で爪先が補強されたゴブリンの戦闘ブーツ。地面にあるものすべてを踏み潰すよう設計されており、地面にあるべきでなかったものも含まれる。ゴブリンは付随的損害の概念を発明したわけではないが、それを完成させた。'
    goblin_sword: '緑色の色合いは銅かゴブリンの血か、その両方——哲学者は尋ねない方がいいと言う。'
    goblin_tooth: 'ゴブリン将校の口から引き抜いた金冠の犬歯。金は本物。歯科治療はそうではなかった。'
    goblin_tooth_belt: 'どの歯も、ゴブリンの族長を個人的に怒らせた者のものだった。その名簿は長い。'
    goblin_trinket_chain: '盗んだ装飾品、くすねた硬貨、そしてゴブリンの物ではない歯が少なくとも一本含まれる鎖。ゴブリンはこれを「高級ファッション」と呼ぶ。それ以外の誰もが「証拠品」と呼ぶ。名称の違いは視点の違いを見事に表している。'
    goblin_wartop: '獣の頭蓋骨と粗雑に溶接された金属板で継ぎ接ぎしたゴブリンの兜。板が存在する方向への防御は十分に確保されている。覆われていない方向は、その部位への打撃を避ける動機付けと見なされる。それが適応による生存のゴブリン哲学だ。'
    godbone_saber: '最終的に割り当てられた仕事をこなす。書類上はこの経緯が一切反映されていない。'
    godbone_shard: 'その正確な性質は誰に尋ねるかによって変わる。そして事件簿は未解決のまま静かに閉じられた。'
    godbone_torc: '誰も勝てなかった口論の最中に鍛えられた。そのため着用者はもう尋ねるのをやめた。'
    godflesh_plate: '疑問を持った瞬間に保証は無効になる。そして第二稿は結局実現しなかった。'
    gods_maw_key: 'かつて神の一部だったもの、神がまだそれを使っていた頃のものから鋳造された。顎門はそれを返せと求めるというより、返って当然と見なしている。'
    godspear_impaler: '門番がひとりで守るべきではなかった敷居で戦線を保つために鍛えられた。どちらの端を握るかよりも、門のどちら側に立っているかの方が重要だ。'
    godspine_staff: 'その機能はコイントスで決められた。たいした違いのない区別だ。'
    godstep_sandals: 'たった一つのことをこなし、それすら疑っている。それは安心材料か、あるいは深刻な懸念材料だ。'
    golden_fleece: '本物の金のように輝く。どの審査員も一度は本物か噛んで確かめようとした。'
    golden_fleece_amulet: '三連覇の王者から得た毛。努力など一度もしたことがなかった。'
    golden_fleece_helm: '矢を止めるほどきつく編まれている。ついでに真面目に見られる可能性も止めてしまう。'
    golden_fleece_legguards: 'あまりの快適さに、二人の冒険者が戦闘中にうたた寝した実績を持つ。無敗記録継続中。'
    golden_larvae: ''
    golden_mushroom: '貧者の黄金—同じくらい役立たず、見つけるのは遥かに難しく、酒場では使えない。'
    golden_nightcap: ''
    golden_silk: 'ほとんどの帝国より長く生きてきた女長が紡いだ。各糸はあなたの全インベントリより価値がある。'
    golden_silkling: '糸が自然に金色である小さな飼育蚕。養蚕は非常に繊細で——温度が二十度を超えると、あるいは五メートル以内で誰かが歌うと、シルクリングは糸を紡ぐことを拒む。飼育者は静かな習慣と温度計への独特の親しみを育てる。'
    golden_wheat: ''
    grasploop: '多くの登攀者が、何も掴む必要がなくなる前に握っていた最後のものだ。'
    grave_dust: 'ホローの骨からの灰色の微粉。ネクロマンサーは良い金を払う。しかし、町での評判は回復しない。'
    great_woolame: 'この長剣はウーリガンの最後の食事の残骸から引き抜かれた。その金属は、この生き物の強力な胃酸によって奇妙なほど保存されていた。使用前には徹底的な洗浄を強く推奨する。'
    greater_healing_potion: 'ナイトキャップ抽出物と怪しい体液から醸造。外科医が嫉妬するほど早く傷を塞ぐ。'
    greater_stamina_tonic: '琥珀色の粘液が、脚が追いつけないほどの野心を全身に満たす。'
    green_bread: '未熟な緑の小麦粉で焼いたパン。その特徴的な色と微かな苦味の源泉だ。これを提供するパン屋は必ずその色が意図的なものだと説明する。購入する客はカビではないと既に知っている。他の客は二度見して疑問を持ち続ける。慣れると悪くない味だ。'
    green_mushroom: '青白い緑色をした病めたキノコ。太陽光ではなく、別のもので育っているようだ。'
    green_mushroom_powder: '緑のキノコを乾燥させて粉砕した粉末。粉砕工程で解放される臭いを、実践者は土っぽいと表現するが、彼らの家族は別の言葉で形容する傾向がある。多くの煎じ薬の基本成分として重宝される。密封した瓶で六ヶ月保存可能だが、他の容器ではより短い。'
    green_sap: 'ベタベタで甘く、わずかに知性がある。クウィーベックは抽出を評価しなかった。これは基本的に木の血だ。'
    green_stew: '緑野菜と森のキノコで作られた煮込み料理。栄養価があり、不快ではなく、わずかに苦い。野営の料理人は軍隊のために鍋いっぱいに作る。兵士たちは熱意なく、しかし抵抗もなく食べる。それはまさに軍の補給担当者が食糧との間に望む関係だ。'
    grimoire_of_embers: '呪文を唱えるたびに、シンダーシェイドが脱皮した皮革羊皮紙から取ったページが焦げる。この本を読み終える頃には、呪文と一緒にそのシェイドの気性まで暗記していることだろう。'
    grimoire_of_tides: 'ページは常に湿ったままだ。読むと溺れているように感じるが、著者はそれを長所だと考えていた。'
    grimoire_of_warding: ''
    grimreminder: '傷痕が熱意に何をするかを教える教訓として、新しい巡礼者に渡される。その教訓が身に染みた後も、大抵は手放さない。'
    grips_of_the_deathless: 'あらゆる預言には、震えずに悪い結末を指し示せる安定した手が要る。これはその手の手袋だった。預言者は去った。安定だけが残った。'
    groundpounder_boots: '一歩ごとに皿ほどの足跡が残る。控えめさなど端から狙っていない。'
    groundswing: '外した際には地面まで振り抜かれる。それは壁の石工たちが逐一数え続けるほど頻繁に起きる。'
    guardian_chain: '最後の守護者のものに倣い一環ずつ鍛えられ、守護者が最後の壁を守るにふさわしいと自ら見定めた者たちが身につける。'
    guardian_core: '倒れた守護者の胸甲から回収される緻密な心臓金属で、回収できるのは倒れた者からだけだ。立っている守護者にそれを譲ってくれと頼む方法は、まだ誰も見つけていない。'
    guardian_gauntlets: '最後の守護者自身の握りに合わせて鋳造され、今この瞬間に壁で着用されていない唯一知られた一対だ。誰もがそこには理由があると考えている。'
    guardian_waistplate: '胸から脚までのすべてを守る。俗に言う『大事なところ全部』である。'
    guardians_verdict: '言葉では足りない稀な場面で、最後の守護者が振るう。それが振り下ろされるのを見た者は皆こう認める — どのみち言葉では足りなかったのだ、と。'
    hadean_ice: '太陽が存在する前の氷。溶けない。気にしない。銀河を生き延びた。あなたは不便な存在。'
    hadean_ichor: '虚空そのものの血。防護エンチャントなしで触れた者は自分の名前を忘れる。一時的に。'
    hades_breath_weapon: '下方の門が開閉の合間に吐き出す何かを通す。その匂いもする。付与術師は、装着前にそれを言っておくべきだった。'
    hades_heart: '三度目の挑戦でようやく骨王から引き抜かれた。誰も歩調を合わせられぬ律動を今も刻む。'
    hades_key: '門番たちが当直を引き継ぐ前にこの門を見張っていた何かから抜かれた歯から削り出された。これを持つと奥歯が同情するように痛む。理由はまだ誰も説明していない。'
    halfturn: 'たいていの武器が三振りする間に二振りもできないほど重い。通常、意味を持つのは最初の一振りだけだ。'
    halo_draught: '用量の説明はラベルの途中で矛盾し始める。醸造者はそれを意図的だったと言い張っている。'
    halo_splitter: '形式上の抜け道で機能している。それは形式上は正しく、まったく役に立たない。'
    halo_striders: 'これらのブーツは歩行の概念に異議を唱える。彼らは運動が物理的な事実ではなく哲学的な意見の問題だと信じている。'
    haloforged_brew_of_last_regent: '論争に決着をつけるために作られたが、失敗した。そのため結果には大きな個人差がありうる。'
    haloforged_carapace_of_last_regent: '設計は相容れない複数の草案を経た。そのため元の苦情は正式に取り下げられていない。'
    haloforged_circle_of_last_regent: '信用制度のもとで機能する。作り手はそれを個性と呼んでいる。'
    haloforged_crest_of_last_regent: '作り手はそれ以上の説明を拒んだ。誰も全面的には擁護しきれない妥協案だ。'
    haloforged_fists_of_hollow_throne: 'ラベルの主張通りに機能するか誰も確認していない。着用者はそれについて考えないことにした。'
    haloforged_fists_of_last_regent: '設計委員会はこれについて実は合意していない。そのためこの件は今のところ未解決のままだ。'
    haloforged_philter_of_hollow_throne: '瓶詰めした者は最終版を決めきれなかった。そして醸造者は今も態度を決めかねている。'
    haloforged_resin: '僅差で本物と認定された。それは季節と尋ねる相手によって変わる。'
    haloglass: 'その純度は融通の利く、交渉可能な尺度で評価される。その後解散した委員会によって。'
    hardening_compound: '鍛造の途中で金属に塗り、剣になる決意を翻さないようにする。'
    hauler_harness: '装甲板よりポケットの方が多い。優先順位。'
    healing_potion: '標準戦場用回復剤。微かに光り、そこそこ治り、傷より臭い。'
    heartmender_torc: '近くで誰かが死にかけると低い音を発する。パーティーで大人気。'
    heartstring: '常に傷痕へとかすかに引かれる。羅針盤が北へ引かれるように。抗うのをやめる着用者もいる。'
    heartwood_core: '戦場を貫いて育った木の最も内なる年輪。刻むのは年月だけではない。'
    heartwood_spear: '世界樹の真の心臓から取った欠片を柄に仕込んだ——一週間で再生した。木は自身の一部を貸すことを気にしていないようだ。'
    heartwood_summoner_club: '叩くとまだ応える、ウィールドの心材から削り出された。誰も訳せていない言葉でだ。苔熊たちはそれをちゃんと解しているらしい。'
    heavy_leather_vest: 'この毛皮の持ち主だったフェランは、ただでさえ怠惰な種の中でも最も怠惰だったという。'
    hemmed_leggings: '少なくとも裾はまっすぐ。他は全部作業中。'
    hermit_pilgrim_trousers: '四週目には染みが取り返しのつかぬものとなる。新しいものは支給されない。'
    hermit_sage_cowl: '長い勤務の間に着用された。臭いは洗っても完全には取れない。'
    hermit_sash: '引き渡した木箱ごとに刻み目がつけてある。それ以来、誰も数え直していない。'
    hermitude_bow: '深い森で何週間も一人で狩りをするために設計された弓。設計は力よりも精度を重視している。隠者には大きな獲物を持ち帰る仲間がいないからだ。一本の矢、一頭の動物、一食分の食事。その思想はほとんどの狩猟書より遥かに単純で明快だ。'
    highguard: '壁の哨兵たちがあまりに長く頭上に構え続けたため、その姿勢には三つの言語でそれぞれ名がついている。どれも褒め言葉ではない。'
    himalayan_flour: '製粉の頂点。使おうとするパン屋を粉が裁く。'
    hive_ring: '毒で硬化させたローヤルゼリーから彫られたこの指輪は、着用者がまだ下してもいない決断に対してさえ、不満げに唸る。どうしてわかるのか尋ねるのはやめておくことを学ぶ。どの家にも、そういう親戚が一人はいるものだ。'
    hive_warden_mace: '柄の先まで、巣母自身が搾った蝋で覆われている。深部の坑道に住むスカラクは皆、持ち主に敬意を払って距離を取る——賢い者に限っての話だが。愚かな者について、物語は二度と語らない。'
    hive_wax: '琥珀色で防水性があり、スカラクが口論の最中に放棄した巣房から採れる。'
    hive_wax_girdle: '蜜蝋と錬金の炎で型取られたこの帯は、最後に着けていた者の体形を不気味なほど正確に覚えている。その者がどこへ行ったのか、村の誰も語ろうとしない。何人かは、やけに素早く話題を変える。'
    hiveguard_mace: '火にも水にも封じられている——古い言い伝えの中で、巣母のお気に入りが常にそうであるように。スカラクたちはこれを認めている。自分が取り仕切らなかった結婚式を渋々認める伯母のような態度で。'
    hivewax_belt: '生きていた時と同じように死んだスカラクたちのキチン質。肩を並べ、一万を数え、群れこそが自分たちを守ると最後まで信じ続けたまま。'
    hollow_ichor: '沼で最も古い虚ろから採れる。防腐師は使う前に薄める。理由を語る者はいない。'
    hollow_judge_mace: '墓絹に巻かれ、古い裁きの刻み目を持つ。慈悲を見せたことは一度もない。'
    hollow_knuckles: '古い板金の上に絹の詰め物。見た目より遥かに強く打つ。'
    hollow_legguards: '既に一度荒らされた塚から得た。二度目もまた何も残っていなかった。'
    hollow_mace: '持ち主より長生きした大腿骨から削り出された、それを隠す気もない一振り。'
    hollow_reckoning_blade: ''
    hollow_root_key: '切られたことはなく、育っただけの根。根喰いの暴君が絶えず闇へと齧り戻している。'
    hollow_shiv: '喪の絹を巻いた双刃。死者というのは、柄の趣味がやけに良いものらしい。'
    hollow_signet: '蝋に何も刻まぬ印を押す。その空白こそが意味を持つ。'
    hollow_tome: '名の半分は消されている。それでも書は記し続ける。'
    hollowcrown_draught: 'ラベルには誰にも特定できない成分が記載されている。それはラベルの非常に小さな文字で明かされている。'
    holy_bible: '良心を洗い清める神聖な経典——まだ洗うべき良心が残っていればの話だが。'
    hornhead_hatchet: '折れた角を芯に鍛造した。ホーンヘッドは返して欲しいが親指がない。'
    hornhead_horn: 'まだ温かい螺旋状の雄羊の角。前の持ち主は木に頭突きして負けた。'
    hunting_javelin: '最小限の訓練で最大射程を実現するよう設計された狩猟用投槍。穂先は衝撃後に獲物に留まるよう返し加工されている。それを取り除くには忍耐か、あるいは獲物を諦めるかが必要だ。ほとんどの猟師は忍耐を選ぶ。獲物にその選択はない。'
    hush_moth_wing: '決して音を立てようとしない蛾から採れる翅の粉。錬金術師たちはまさにその理由でこれを重宝する。蛾自身がその理由を語ったことは、これまで一度もない。'
    hymn_ember: '火が去ったあとも石が抱えている熱。瓶詰めできるうちに瓶詰めした。'
    hymn_of_endings: '自認する限り、一応の性能は発揮する。作り手はおおむねそれを支持している。'
    hymnbound_core: '堂守の私物庫から出た蝋引きの焚き付け。一発で点く。ここではそれは奇跡に数えられる。'
    hymnbound_cuirass: '何の上にも羽織れて、何にも縛られない。ポケットは香炉をなくせるほど深い。'
    hymnbound_gauntlets_of_ashen_song: '後陣の裏、火百合の花壇のための手袋。棘は燃えるが、手袋は同意しない。'
    hymnbound_girdle_choir: '聖歌隊の姿勢に締め上げる。胸を張り、顎を上げ、下にいる者には格好の的だ。'
    hymnbound_girdle_pyre: '留め金に沿って鈍い赤に光る。警告か、装いの主張か、どちらとも決してはっきりしない。'
    hymnbound_hatchet_of_ashen_song: '手には軽く、後始末は重い。あらゆる隙間に入り込む細かな灰色の塵を残す。'
    hymnbound_helm: '鐘もないのに、夕暮れにかすかに鳴る。鍛冶屋はそれに関する質問を受け付けなくなった。'
    hymnbound_ingot: 'かまどで熱した無垢の鉄。恨みが舵を取る。しわも異論も、等しく降伏する。'
    hymnbound_sabatons_of_cooling_vent: '地面の熱を踵から逃がす。足は暖かく、足跡は焦げ、今のところ苦情はない。'
    incandescent_lance: '決して弱まらぬ熱を放つが、握りの部分はそれに全く追いついていない。'
    infernal_cleaver: '千回の人事評価面談級の怒りで燃える。氷の世界では皮肉なことだ。まだ誰も文句を言っていない。'
    inferno_clutch: '火葬の穴以来、革は冷めることがない。熱が近づくと握りが自ずと締まる。'
    inferno_pendant: '中心の石は、初めて火葬の炎が灯って以来冷めていない。'
    inferno_shard: '火格子からかき出された溶融ゴミ。窯は領収書を捨てない。'
    infested_legguards: '感染した敵から回収した脚甲。金属の暗い染みは、どんな洗浄方法を試みても落ちない。鎧の専門家はそれらの染みの化学組成を分析することを避ける傾向がある。駆け出しの冒険者たちは見つかったものを使うから装備している。美観は優先事項ではない。'
    infested_ring: 'くり抜かれたキチン質の指輪。溝には名も無き蟲がうごめき、噛みつく。'
    infested_sash: '汚れた布を脈打つ血管が貫く。まるで衣服自体がまだ生きていて、消化しているかのようだ。身につけることは病気との親密な関係を意味する。'
    infinity_amber: ''
    infinity_arcanite: 'どんな嵐の中でも見張り火を絶やさぬだけの残留力を帯びている。'
    infinity_bloodstone: ''
    infinity_cursed_gem: ''
    infinity_diamond: ''
    infinity_draconite: ''
    infinity_duskite: ''
    infinity_jade: ''
    infinity_moonstone: ''
    infinity_obsidianite: ''
    infinity_quartz: ''
    iron_battleaxe: '影の騎士の破片から鍛造。闇は構造材。重さは人格形成。'
    iron_battlecleaver: '伝説はこれを時代を終わらせた斧と呼ぶ。歴史が覚えているのは主に叩き壊した柵だ。'
    iron_battleplate: '影の騎士は皆既日食のときにしか鎧を鍛えない。需要にはまるで追いつかない頻度だ。'
    iron_bludgeon: '鋳鉄の棍棒——本当に設計された武器というよりも、握れる端を持つ金属の塊だ。洗練されていないがゆえに効果的だ。防具師はわずかに赤面しながら売る。結果が疑いの余地を残さないため、買い手は恥ずかしがらずに手に入れる。'
    iron_flanged_mace: '振るうたびにかすかに畜舎の匂いがする。理由を説明した者はいない。誰も説明したくないのだ。'
    iron_gauntlets: '標準的な影の騎士の篭手。前の持ち主の握り跡がまだ金属に残っており、「ああ、またかよ」という表情で凍り付いている。手を入れた者は前任者の無念を僅かに感じるが、追求する者はいない。伝統的な品質を保つには、過去の記憶を尊重することも時には必要なのだ。'
    iron_kneeguards: '間違った祭壇にひざまずいた影の騎士から回収された膝当て。膝当ては生き延びたが、騎士の組織化された暗闇における経歴は終焉を迎えた。装備の耐久性と信仰の選択は必ずしも一致しないという教訓を、この膝当ては無言で新しい持ち主に伝え続けている。'
    iron_legplates: '地下の不滅の鍛冶場から生まれた、骨のように白い鉄。そこの鍛冶師たちは作業中、一言も口をきかない。穏やかに聞こえる――彼らがなぜ黙り込んだのか、正確に思い出すまでは。'
    iron_pounder: ''
    iron_sickle: '外科的精度で薬草を刈る曲刃。前の持ち主は外科医ではなかった。血痕がその証拠だ。'
    iron_war_spear: '完全に乾くことを拒む古代の髄の欠片を穂先に据えている。この槍を作るために命を捧げた何かは、貢献をやめてはいない——それを献身と呼ぶか、未完の取引と呼ぶかは自由だ。'
    iron_warhelm: 'この兜を鍛えた鍛冶師は月光の下でのみ働き、影がデザインを囁いたと主張した。影は価格も囁いたが、それは良心的ではなかった。月の出ていない夜には鍛冶場が完全に沈黙するため、納期は常に予測不能だった。それが問題となるのは発注者の方で、鍛冶師本人は一切気にしなかった。'
    ironbark_treads: '斧が来るのを見て、先に立ち去った木の樹皮。足音はかすかに同意しているように響く。'
    ironbound_bread: '緊急時には盾になる。口コミは『素朴』と評しているが、それはかなり優しい表現だ。'
    ironbrow_casque: '威圧感が出る。首が痛くなる。トレードオフ。'
    ironbuckle_girdle: 'バックルだけでほとんどのベルトより重い。それが売り。'
    irongrip_signet: '怒ると少し締まる。落ち着くと緩む。大体締まっている。'
    ironhide_girdle: '刃を逸らすほど厚く、跪くことを反射ではなく決断に変えるほど硬い。'
    ironjaw: '着用者の歯を、戦いを始めた時のまま保つために作られた。控えめな目標だが、この高度ではめったに達成されない。'
    ironloaf_slab: 'パンというより建材。防具鍛冶は迷いなくこれを砕いて隙間埋めに使う。'
    ivory_orchid_paste: '洞窟キノコと後悔の匂いさえしなければ、平和条約を仲介できるほど滑らかなペースト。'
    ivory_shrooms: '骨の影にしか生えない不穏なほど白いキノコ。錬金術師は珍重する。まともな人間は避ける。知的好奇心と致命的な無謀さの境界線は、しばしばアイボリーマッシュルームによって引かれる。風味：土っぽく、警告の後味がある。'
    iyashi_living_branch: '元の木は何世紀も前に枯れた。枝にはまだ伝わっていない。今も毎年春に芽吹く。'
    jade: 'エメラルドが嫉妬するほど緑なのに酒場の食事より安い。'
    jade_hoe: '美しすぎて農家が使うのを躊躇う農具。しかし空腹はいつも勝つ。'
    jade_pickaxe: '翡翠で翡翠を採掘する。哲学的含意は金儲けに忙しい大半の鉱夫には理解されない。'
    jade_powder: '触れるもの全てを汚す細かい緑の粉末。清潔な鉱夫としての評判も含めて。'
    journeyman_saber: 'ゴブリンがじっと立って刺されることに同意すれば倒せる。進歩だ！'
    key_aragog: 'アラゴグの縄張りの下のトンネルを開くキチン編みの鍵。蜘蛛はあなたが持っていることを知らない。たぶん。あの大きさの蜘蛛には、地図師が公式報告書に記載するのをためらう感覚器官がある。幸運を。必要になるだろう。'
    kiln_potholder: 'どんな窯も恐れないキルトの四角。台所のものは何でも運べる。ただし旋律と、縫い針と、指先の感覚は除く。'
    kindling: '傷が燃やし尽くせなかった木から彫り出された。今も炎の形を覚えている。'
    kneebreakers: '先代が三着連続で壊れた関節部を補強してある。着用者の歩行に問題はない。それが周囲には不審に映る。'
    knucklebone: '誰も記録を残さなかった鋳型の関節から鋳造された。あなたの手よりわずかに大きな手のために作られたかのように合う。'
    knucklevow: '生きている者が誰も読めなくなった誓いが刻まれている。どんな翻訳者よりも、金属自身がそれをよく覚えている。'
    koa_eye: '飛び出した、瞬きしない、そしてなぜかまだあなたを裁いている。視覚ポーションの試薬。副作用にはパラノイアを含む場合がある。'
    koa_eye_ring: '磨かれたコアの目がはめ込まれている。不気味なことに、今も何かを探しているように見える。'
    koa_eye_signet: 'コアは嬉しい時も怒った時も宝飾品にされる時もほぼ同じ表情をしている。この指輪の目は時折まばたきをするが、意図的にしているのかは誰にも分からない。反射なのか意識なのか、コア学者たちは今も議論を続けている。'
    koa_slime: '粘り気のあるカエルの粘液。容器から滑り落ち、他の全てを覆う。錬金術師は大好き。他の全員はあなたを嫌う。'
    koa_slime_brigandine: '驚くほど弾力のある被膜に硬化するコアの粘液で漆塗りされた革板。コアはストレス反応としてこの粘液を生成していた。つまりこの鎧は文字通り不安でできている。雨の日にはまだ艶めき、非常によく保湿された戦士の外見を与える。'
    koa_slime_codex: 'ページはコアスライムでくっついている。読むには技術と強い胃袋が必要。'
    koa_slime_rod: '固まったコアスライムで覆われた棒。魔力を導くか少なくともそのふりをする。'
    koa_tongue: '約1メートルの把持筋肉。伸び、弾け、時々ハエ以外のものを捕まえる。'
    koagulant_longbow: '弦が薄い粘液を分泌する。誰も理由を知らない。知りたくもない。'
    koagulant_wand: '粘つくエネルギーで脈打ち、よく見ない方がいい何かで傷を覆って治療する。'
    kraken_depth_staff: '最も深い海溝の力を通すと言われる。使い手は見られている感覚を訴える。実際に見られている。'
    kraken_ink: 'クラーケンの最深部の腺から採取される。予言を書く。ただの買い物リストも書く。選り好みはしない。'
    kraken_key: '塩とフジツボに蝕まれている。持ち手の触手模様はまったく控えめではない。'
    kraken_tide_boots: '濡れていようが乾いていようがどんな地面にも食いつく。クラーケン由来の靴底はお前より先に潮を読む。'
    kweebec_leaf_charm: '枯れることを拒否する生きた葉。ドルイドはフォーカスアイテムとして使う。葉は黙ってあなたの性格を裁く。'
    kweebec_vine_sash: '三日間続くクィーベックの詠唱で結ばれたが、その歌詞はクィーベック自身も覚えていない。'
    lantern_shard_ring: '死霊のランタンの破片で、今もかすかに光っている。時刻を囁くが、常に間違っており、訂正に対して深く消極的攻撃的である。時計として使うより、心理的嫌がらせ装置として理解した方が良いかもしれない。死霊は時間の流れを生者とは異なる方法で認識するのだ。'
    larvano: '小さな鼓動のように脈打つ。その出自であるスカラクの巣は、今も損失を数え続けている。'
    last_guardian_aegis: '傷痕に名がつく前から最後の守護者が身につけ、それ以来何ものも二度とへこませられなかった箇所がへこんでいる。壁が落ちた理由になったことは、ただの一度もない。'
    lastbreath: '最後に着る者に合わせて仕立てられている。それが何を意味するのか、鎧職人は決して説明しない。誰も二度とは尋ねない。'
    lastmile: 'どの巡礼者も前より短いと誓う区間にちなんで名付けられた。決してそうではない。'
    lastwhisper: '音節がすり減るほど古い呪文を宿している。元々何を唱えていたにせよ、今も効いている。'
    lava_chitin: 'マグマクロウの甲殻。天然の耐火性を持つが、負けた口論のかすかな匂いがする。'
    leather_heavy_boots: 'タスカーの革を三層重ねた。足は膝よりも余裕をもって長持ちするだろう。'
    leather_treatment: '生皮を柔軟な加工皮革に変える化学浴。なめし職人はこれの安定供給なしには機能しない。'
    legguards_of_the_primordial: '幻視が長引いた時に灰の預言者が脱ぎ捨てた皮から鋳られた。着用者の歩みは預言者の速度に落ち着く。慎重で、急がず、常に悪い知らせとぴったり同時に到着する。'
    legweight: '規定より重い。走るには疲れすぎた脚は、その場に留まって戦う脚になるという理論に基づく。'
    leviathan_tentacles: 'クラーケンが家族と呼ぶ何かから引き剥がされ、硬く鞣された。今もたまに動く。'
    lightless_striders: '深林の闇に溶け込むほど黒い靴底。三日目になると、着用者はもう自分がどこを歩いているのか見えなくなる。四日目には、それすらどうでもよくなる。'
    liquid_koa: '形を保つことを覚えず、それを受け入れたスライム。ほぼ。'
    litany_of_cinders: '果てのない家事の巻物。読み上げると、埃が罪悪感のあまり勝手に並び直す。'
    living_spark: '死ぬことを拒否する火花。ポケットの中で再着火し続ける。火の魔法使いはライターとして使う。安全上の危険。'
    living_spark_greataxe: '斧頭は最後に斬り伏せた何かの余韻でいまだにばちばちと音を立てているが、それが何だったのか誰も完全には把握していない。報告書は提出され、封印された。確かなのはひとつ――この斧は標的を自分で選ぶ。柄を握る者は、たいてい同乗しているだけだ。'
    longdraw: '引き絞るのに一息、後悔するのにもう一息かかる。標的が十分速ければ、どちらの息も要らない。'
    longreach: '使い手の間合いを、ほとんどの敵が公平と見なす範囲を超えて広げる。公平さは元より設計方針になかった。'
    lorito_helmet: 'A full parrot pulled over the ears. The sprout on top is load-bearing, emotionally.'
    lumber_cleaver: '木材のために設計された。それ以外のすべてに使われた。刃にはまだ樹脂の跡があり、それは安心材料（無実の使用の証拠）であるか、あるいは以前に樹脂が何を覆っていたかによっては不穏だ。戦場にこれを持ち込んだ木こりたちはおおむね生き残った。木材はそれほどでもなかった。'
    lure_light_pendant: '捕らえた誘光の一片を収め、何が身につけていようとお構いなしに、自らの律動で脈打つ。ウィールドの本物の誘餌が、身につけた者へ近づき始めた。これは吉兆とは見なされていない。'
    magmooligan_charm: '明らかにアクセサリーになりたくなかった生き物の灰の中で鍛えられた。お守りは触ると温かい。これは魔法的な特性ではなく、つい最近まで燃えていたものの自然な温度だ。冬は指を温かく保つ。夏はまた別の深刻な問題になる。'
    magmooligan_hauberk: '古い青銅の輪の上に重ねられた、火山羊毛のフェルト。吹雪には十分な暖かさだが、それ以外の場所では耐え難いほど暑い。冷たい夜には、織り目のどこかから今もかすかに鳴き声が聞こえる。獣は作業前に完全に事切れていたという甲冑師の誓いは、語られるたびに説得力を失っている。'
    magmooligan_waraxe: 'マグムーリガンは小さく意地悪で、まともな生き物には到底納得できない理由で、いつも何かに火をつけている。この斧は、鍛冶師がついに一匹を捕まえた後に残ったものだ。その炎は、いまだに一向に鎮まっていない。'
    magmooligan_wool: 'まだくすぶっている耐火羊毛。織り手は軽い火傷と可燃性の布に関する存在論的疑問を報告。'
    magmooligan_wool_ring: '火山性の羊毛でフェルト状にされている。指を温めるが、その心地よさは思うより奇妙だ。'
    malt_bread: 'バッグの中で発酵したかもしれない怪しく甘いパン。いずれにせよ士気は上がる。'
    malt_flour: 'パンをビールのような味にするモルト風味の粉。'
    marchworn: '履き続けられなかった誰かによって、既に馴染ませてある。職業上の礼儀として、大きめに仕立てられている。'
    marginalia: '本文は取るに足らない。知る価値のあることはすべて、明らかにそれに異を唱えていた誰かによって欄外に走り書きされている。'
    marrow_cinch: 'かつて直立し、常に確固たる意見を持っていた背骨から彫られたベルト。食事を抜くたびに勝手に締まり、来世に残された何かからあなたの習慣を裁いてくる。'
    marrow_knuckles: 'ずっと昔に死んだのにまだ完全には諦めていない何かの髄骨から彫られた篭手。夏は冷たく、冬はもっと冷たく、アンデッドが近くにいると氷のように冷たい。ひどい早期警報システムだ。指が痺れた頃には、その存在はもう首筋に息を吹きかけている。比喩的に。死者は呼吸しない。'
    marrow_ring: '死霊術師には大人気。穴を掘る手間なしで「掘り起こしたて」の雰囲気が味わえる。'
    matriarch_tusk: '灰背の大牙獣から、群れが今も語り草にする戦いの末に引き裂かれた。大地はこれほど強く打たれたことを覚えている——以来、誰も許していない。'
    matron_chitin: '白い未亡人自身の外骨格板。黒曜石より暗く2倍硬い。甲冑師は喜びに泣く。'
    matron_chitin_gauntlets: '灰の寡婦の殻で覆われている。巣穴の温もりがまだ微かに残る。'
    matron_silk_slippers: '深淵のマトロンが最も深い狩りで落とす絹で紡がれ、ウィールドの地面を音もなく渡れるほど柔らかい。ここでは沈黙こそがすべてだ。'
    maw_cleaver: '作り手は途中で気が変わった。作り手はそれを個性と呼んでいる。'
    maw_crusher_fists: 'その挙動は自らの説明と矛盾している。それは設計上の欠陥か、あるいは意図そのものだ。'
    maw_tooth_ring: '着用中に自分自身の存在を断固として否定する指輪。それは同時に絶対に確実で、完全に疑わしい。'
    maw_visage: '事実が別のことを示唆していても正しいことを主張するヘルム。特に何もないことについて原則的な主張をする。'
    mender_cuisses: '治癒草を詰めた膝当て。跪き、息を整え、あとは書類仕事――もとい薬草に任せればいい。'
    militia_breastplate: '標準的で信頼性があり、兵士の群れの中では気づかれない。それがまさに目的だ。匿名性は一般兵士の最初の防御であり、この胸当てはそれを保証する。英雄的な逸話は何もない。いくつかの普通の話はあるかもしれない。普通の話もそれ自体の価値を持つ。'
    millstone: '村の石臼は六世代にわたって小麦を挽いてきた。誰かがそれを振り回そうと思いつくまでは。効果はある。粉屋の意見は誰も聞いていない。'
    mineral_biscuit: 'ダイヤモンドダストで強化されたビスケット。技術的に食用、実質的に臼歯用の研削盤。'
    minor_healing_brew: '紙切れの傷と傷ついた自尊心を癒すぬるい緑のスラッジ。苔風味の後悔の味。'
    mire_bloom: '完全な闇でしか開かず、光の兆しに閉じる蒼白い花。採るには手探りで望みをかけるほかない。'
    mire_heart: 'フェンドレッドの実際の心臓。まだ鼓動している。非常にゆっくり。悪夢が欲しくなければ密封容器に保管。'
    mire_judge_mace: 'ウィールドの深部で諍いを片づけるやり方、つまり永久に、にちなんで名づけられた。薄闇の笛吹きがそれを歌にしたが、聞いて喜ぶ者はいない。'
    mire_waders: '葦の境界より先に配置される者への標準装備。乾いた足は約束されていない。'
    mirefang_kris: '沼を這うものの牙のように波打つ刃。正直に言えば、まさにそれを鋳込んだからだ。あるべきより容易に滑り込む。'
    mirefang_loop: '一本の湾曲した牙から曲げられ、身につけていることを忘れるほど小さい — ウィールドの何かが先にそれへ反応するまでは。'
    mireglass_infusion: '泥硝子を溶かし、生きた何かを混ぜて固め直したもの。職人はそれが焼き加減を良くすると誓い、誰のとは決して言わない。'
    mireweald_brew_of_deep_canopy: '緑で濃く、かすかに動いている。仕込む者はそれをただの澱の沈殿だと誓い、あまり近くで見ないでほしいと思っている。'
    mireweald_carapace_of_drowned_weald: '一季まるごとかけて着用者の周りに育ち、完璧に体に合い、外さねばならぬときは、樹皮が木から剥がれるように外れる。'
    mireweald_crest_of_deep_canopy: '樹冠が、ここまで届くわずかな光を覆い隠す層のために迷彩されている。つまり身を隠すためで、ウィールドはそれに報いる。'
    mireweald_lattice: '収穫後も育ち続ける生きた結晶の骨組み。ゆっくりと、最後に扱った者が向けた方向へ、意地か習慣で伸びていく。'
    mireweald_tassets_of_deep_canopy: '届くわずかな光を光合成する生きた板金、つまり何も光合成せず、代わりにゆっくり着用者を食べる。ゆっくりと。'
    mireweave_grips: '胞子背たちが根の系統の間に紡ぐ沼絹で織られ、握りを高めるほど粘り、どう採取するのか誰も尋ねぬほど不快だ。'
    mirrormelt_essence: 'ミラーメアで唯一完全には凍らない一角から蒸留された。そこに溶け込んだすべてを覚えている。'
    mithril_axe: '熊の爪の握り、マグマクローの甲殻の刃。丸太、頭蓋骨、哲学的議論を火山のような熱意で切り裂く。議論の勝利を物理的に確保する方法として、学者の間で密かに憧れられている。ただし大学での使用は禁止されており、議論はあくまで言葉で終わるべきとされる。'
    mithril_battleaxe: '完全には冷えることのなかった溶岩の中で鍛えられた。頭部は普通の金属が溶ける温度でわずかに振動し、それが創造的な収納問題を引き起こす。作った鍛冶師たちは短い交代勤務で働いた。長い勤務は選択肢になかった。苦情も同様だ。'
    mithril_cinder_striders: '改良版の一足。なぜか前より暖かく、なぜかうるさく、そしてなぜか今も見ている。'
    mithril_club: '熊の爪の鋲、イノシシの皮の巻き、黄金の羊毛の裏地。見た目より軽く、望むよりは重い。非常に説得力がある。説得される側の意見は残らないが、それは交渉の成果を問わない伝統的な手法でもある。結果重視の戦士には今なお好まれている。'
    mithril_longbow: '嵐鷹自身の尾羽をミスリルの弦に張って作られた弓。手柄を持っていくのは射手だ。もし風が話せたなら、いくつか訂正したいことがあるだろう。'
    mithril_mace: ''
    mithril_sword: '黄金の羊毛で裏打ちされ、手の中でその存在をほとんど主張しないほど軽い――それこそが、反対側に立つすべての者にとっての本当の問題である。'
    mokan: 'A wide woven hat. Keeps the rain off and the questions away.'
    molten_verse_casque_of_glass_cathedral: '兜飾りに聖人の指の骨を収めている、幸運のために。その聖人の幸運は、記録に残っている。'
    molten_verse_charm_of_rising_hymn: '決して完全には冷めない硝子の玉。手の中では心地よい、羊皮紙の上に置き忘れるまでは。'
    molten_verse_hauberk_of_glass_cathedral_choir: 'ガラス化した床を磨く者に支給される。染みのほうが先輩だ。'
    molten_verse_hauberk_of_glass_cathedral_pyre: '身廊の大カーテンから裁った。裾は蛾に食われたが、威厳は生き残った。'
    molten_verse_hauberk_of_rising_hymn: '戦いが長引くほど熱くなる。長い戦いは、あなたが赤熱し、敵が消えて終わる。'
    molten_verse_sash_of_glass_cathedral: '色硝子のリボンが織り込まれている。美しい、光を受けて自分の目を眩ませるまでは。'
    molten_verse_scepter: '蝋燭も、提灯も、熱意も、離れたまま消せる。長い柄はシャンデリア用。'
    momaku: 'A spirit-mask banner draped down the back to frighten debtors and impress no one already dead.'
    moonclad_band_of_silt_throne: '深いウィールドの熱に浮かされた温もりの中でも冷たいままの月爪の殻の指輪。着用者は認める以上にそれにすがる。'
    moonclad_breastplate_of_silt_throne: 'その月爪の板金は、月が姿を見せる夜にかすかに光ると言われる。これほど深いウィールドではそれは決してなく、ゆえにその主張は検証の危険を免れている。'
    moonclad_crusher_of_silt_throne: '自ら生む亀裂をことごとく白く映す蒼白い殻で覆われ、使い手が消せぬ、几帳面で光る勘定をつけ続ける。'
    moonclad_pike_of_brackish_deep: '先まで冷たいままの月爪の殻を穂先に戴き、熱にほてる暖かな闇の中で後端を握る者への、ささやかな慰めだ。'
    moonclad_poultice_of_silt_throne: '熱に対して冷たいままの蒼白い殻に包まれ、溺れた宮廷が重んじ、そして溺れた宮廷がもう必要としない慰めだ。'
    moonclad_tonic_of_brackish_deep_matron: '冷たさを保つ蒼白い殻の下で瓶詰めされ、これほど下で仕込まれる、月光を浴びた水に最も近いものだ。'
    moonclad_tonic_of_brackish_deep_mire: '沼水の基剤は放置すると層に分かれる。仕込む者は振れと言い、底の層が何かは決して言わない。'
    moonclad_torc_of_silt_throne: '宮廷が、今や泥の三十メートル下にある広間越しに月光を捉えるために身につけた蒼白い殻の首輪。以来、一筋も捉えていない。'
    moonclad_treads_of_brackish_deep: '足の下で冷たいままの月爪の殻で板金され、これほど深い地の底で着用者が感じる、月光に最も近いものだ。'
    moonclad_visor_of_silt_throne: '月爪の殻で板金され、ここまで届くわずかな月光を捉える。つまりほとんど何も捉えず、主にかつて月があったことを思い出させる。'
    moonclaw_shard: '月爪の女帝の爪の破片。月の下で光る。触れた付与術師は、喉を鳴らす音が聞こえると言う。'
    moonfang_precision_band: '獲物を外したことがない月の捕食者の骨片がはめ込まれている。精度は近接によって転移する。これを着けた弓使いは、矢が自然とわずかに修正されることに気づく。松葉杖ではないと彼らは主張する。協力だと。哲学的には議論の余地があるが、実用的には有効だ。'
    moonfang_waistguard: '満月に狩りをし、それ以外は眠っていた獣の毛皮から取り出された。革にはまだ日中は説明しにくい夜的なものが残っている。着用者は暗闇の中で異常な明晰さを感じると言う。正確な夜目というわけではない。どちらかといえば、暗闇が自分の味方だという感覚だ。'
    moonlit_choker: '夕暮れに墓が開く前にきつく締められる。見張りが終わって初めて緩む。'
    moonlit_claw: '月光の下でかすかに光る、かつて伝説だった月牙の遺物。今ではただの制作素材だ。'
    moonlit_recurve: ''
    moonrise_boots: 'かつて生きていたことを覚えている羊毛でできており、時折まだ草を食もうとする。'
    moonstone: '星明かりの下でほのかに光るが鉱夫は地下で働くので全く役に立たない。'
    moonstone_hoe: '月の共鳴で土を耕す。小麦は12%早く育つ。農家も12%早く老ける。等価交換だ。'
    moonstone_pickaxe: '先端が淡い発光で脈動する。鉱夫たちは自力で鉱脈を見つけると誓う。ツルハシはノーコメント。'
    moonstone_powder: '暗闇で輝くので見つけやすいが徴税人から隠すのは不可能。'
    moonstone_sickle: '星明かりの下で微かに光る。薬草師は収穫量が上がると言い、錬金術師はプラシーボだと言う。両方間違っている。'
    mules_burden: '品評会のハンドラーの道具箱より留め具が多い。重さもそれ以上。'
    muleteer_march: '生きるどの兵よりも補給縦隊の後を長く歩いた。荷車を失ったことは一度もない。'
    neckoath: '壁に到達するか、そこで死ぬかを誓った巡礼者たちが身につけていた。その大半が今もまだ身につけている。'
    nerak_key: '骨に刻まれたルーンが、もはや生者の誰も話さぬ言語で脅し文句を呟いている。死者は来訪者をあまり歓迎しない。その錠前もまた、まったく同じ考えらしい。'
    nerak_marrow: 'ネラク自身の太古の骨から採られた黒ずんだ骨髄で、あるはずのない生命でかすかに今も唸っている。錬金術師はその効力ゆえにこれを珍重する。それ以外の誰もが、その囁きを理由に避ける――その言葉を正確に聞き取れた者は、いまだかつて一人もいない。'
    nerak_marrow_bow: 'ネラクが幾世紀も前に脱ぎ捨て、二度と気にも留めなかった腱で張られている。弦を引けば、地下で今も彼の宮廷が歌い続ける低い旋律を、望むと望まざるとに関わらず、共に響かせることになる。'
    nexus_blade: '三つの道が死者と交わる土手道で鍛えられた。夕暮れにはまだ低く唸る。'
    nightcap: '不穏な碧い光を放つ生物発光キノコで、日光が記憶というより噂に過ぎない洞窟を出自とする。錬金術師たちはその催眠特性を切望するが、キノコ自身は彼らの愛情に深く無関心である。'
    nightcap_elixir_base: '真夜中過ぎに寝るべき人間が醸造した、あらゆる怪しい薬の土台。'
    nightfang_daggers: '影に消えて脊椎に再出現する双刃。整体師推奨。'
    nightfang_razors: ''
    novice_wand: 'すべての魔法使い見習いが最初に受け取る杖。集中力を教えるため意図的に不正確。謙虚さを教えるため意図的に非力。忍耐を教えるため意図的に不快。それを設計した学院は軽微な苦痛を有効な教育方法と見なしている。卒業生の意見は様々だ。'
    null_essence: '液体の不在。長く保管すると容器の壁を溶かす。エンチャンターは法外な価格を払う。保管はあなたの問題。'
    oblivion_saber: ''
    obsidian_arc_bow: '蝋引きのエプロン紐を弦に張った。カーテンはとうの昔に落ち、レールは第二の人生を歩んでいる。'
    obsidian_casque_of_glass_cathedral: '礼拝堂の屋根のように丸く、信徒の意見を締め出すのも同じくらい得意だ。'
    obsidian_choir_plate: '内陣の鎧。信を得た者だけが立つ場所の。信頼は惜しんで与えられ、素早く取り消される。'
    obsidian_cordial_choir: '料理用です、とラベルは言い張る。料理人は逆を言い張る。'
    obsidian_cordial_of_rising_hymn: '明るく昇る温もりが気分を高め、束の間、腕の毛も逆立てる。'
    obsidian_cordial_pyre: '一口で耳鳴りがし、目が潤み、傷は純粋な威圧によって閉じる。'
    obsidian_core: '硝子流の密な中心。切り方を誤ると、全体が千の刃になることに票を投じる。'
    obsidian_elixir_of_glass_cathedral: '寝る前の小さな一杯。ベッドは任意、一杯は必須。'
    obsidian_extract: '大かまど用の艶出し。輝きは一週間もつ。においは結婚生活ひとつぶん。'
    obsidian_flux: '煤も、ニスも、指紋も剥がす苛性ペースト。どれがまだ必要だったか、よく考えてから。'
    obsidian_psalter: 'どのレシピも同じ一文で終わる。悲鳴がやむまで火から出さないこと。ロースト向け。異端者にも有効。'
    obsidian_signet: '熱い蝋に印を押す。折があれば、額にも。どちらにせよ封をする。'
    obsidian_stompers: '鏡のように磨かれた硝子の靴底。転ばされた敵が最後に見るのは、驚いた自分の顔だ。'
    obsidianite: '石もキャリアの野望も切り裂けるほど鋭い刃に砕ける火山ガラス。'
    obsidianite_powder: '鉱物粉に浮遊する微細な破片で、治療師の待合室の壁を埋め尽くせるほど長大な安全警告文が添えられている。その警告は、例外なくすべて正当なものである。'
    ocean_grimoire: '水に沈めた時だけ浮かび上がるインクで書かれている。非常に不便な教材だ。'
    ocean_sigil: 'タロカン文字が刻まれた珊瑚。学者は九つのうち三つを解読した。残り六つはもっと厄介だ。'
    old_hoe: 'ギザギザの青い触角で強化された素朴な農具。感覚毛はまだ残存反射でピクピクと動いている。'
    onyxium_aegis_pendant: '危険が近づくと瞬きするカラス科の目が保存されている。理由不明のまま、たまにただ瞬きもする。'
    onyxium_bastion_greaves: 'あまりに快適で、戦闘中に三人の兵士がこれを履いたまま眠った。司令部は笑えなかった。'
    onyxium_bulwark_helm: '戦闘中に蟹の甲羅がかすかに鳴る。古参兵はそれを『拍手』と呼ぶ。拍手ではない。'
    onyxium_caravanner_mail: '断層道を通って商品を運び、その臭いのせいで一度も襲われなかったシンダーシェイドが身につけていた。隊商は今も、出所はともかく、その意匠だけは重宝している。'
    onyxium_cleaver: ''
    onyxium_conduit: '生きたクウィーベックの葉を頂き、マグムーリガン材で包まれている。無視されると小さく唸る。'
    onyxium_crit_band: 'シンダーシェイドのまだ熱い核から圧し固められ、後悔せずに身につけられる程度にだけ冷やされている。肌の上で温かさを保ち、それがちょうど悪いタイミングで集中力を研ぎ澄ませる。'
    onyxium_crushfists: '一度の打ち合いで突撃を終わらせるために作られた。二度目はほぼ要らぬ。'
    onyxium_edge: ''
    onyxium_fortress_girdle: '危険から逃げる代わりに鎧を進化させるほど怠惰な生き物の毛皮から作られている。'
    onyxium_fortress_plate: '繊細さより生存を重んじた誰かが部族の遺物を組み合わせて作った。一目でわかる。'
    onyxium_greathelm: '周辺視野と引き換えに、大抵のものを止める顎当てを得た。'
    onyxium_guardian_mace: '墓衛兵への制式支給品。凹みは持ち主より長生きする。'
    onyxium_hatchet: ''
    onyxium_hauler_boots: '登れるはずのない斜面を、道中ずっとくすぶりながら鉱石を運び上げたシンダーシェイドが履いていた。疲れない。時々煙を上げる。'
    onyxium_iron_wall_grips: '拳を握ると今も鱗がしなる。まるで元の持ち主が完全には手放していないかのように。'
    onyxium_ironfoot: 'コアの精髄が染み込んでいる。バックルの目が部屋の中でお前を追ってくる。礼儀正しく。'
    onyxium_loadbearer: '煙と忍耐、そしてまだ温かいはずのないものへの実践的な理解を要する工程で、シンダーシェイドの皮からなめされた。見た目以上の重さに耐える。'
    onyxium_longbow: ''
    onyxium_packmule_grips: '大陸を横断して燠を一つも落とさずに運んだシンダーシェイドから鋳られた指。何を握っていようと、そのシェイドが手放すはずのタイミングまでは手放せない。'
    onyxium_porter_legguards: '同じ鍛冶場に一世紀跪き続けたシンダーシェイドによって膝が擦り切れている。坂道での荷運びには良い。それ以外の場所で跪くには、もう二度と向かない。'
    onyxium_sages_locket: 'シンダーシェイドの首の隆起に巻きついたまま見つかり、何世紀経っても温かい。己の知恵を胸に抱え込み——ついでに着用者の知恵も——その負債をすべて頑健さで返してくる。'
    onyxium_scholars_visage: 'その隆起の摩耗具合から見て、物思いに深く耽っていたらしいシンダーシェイドの眉稜。長い評議の間も着用者を覚醒させ続ける。学者は設計のおかげだと言い張るが、実際は熱のせいだ。'
    onyxium_spirit_club: '頭部に墓場の鬼火が棲みつく。近くで何かが死にかけている時だけ光る。'
    onyxium_striders: '最も遠い持ち場を引いた者に支給される。帰り道は行きより長い。'
    onyxium_trident: ''
    onyxium_war_signet: '点呼を無傷で生き延びた者に与えられる。持ち主が変わりすぎる。'
    onyxium_warbelt: '三度の戦役を経て、四度目のために締め直された。革はその全てを覚えている。'
    onyxium_warblade: '冷えゆく溶岩にシンダーシェイド自身の鉤爪の隆起が残した模様通りに鍛えられた。見事な逆行工学か、あるいは誰も二度は試したがらない偶然か、そのどちらかだ。'
    onyxium_warchain: '輪の一つ一つに戦役の刻印がある。その全てを数えた者はいない。'
    onyxium_ward_ring: '埋め込まれた目は見てほしくないものまで見る。お前の選択に一言申したいらしい。'
    onyxium_wargreaves: '跪く箇所が擦り減っている。沼は姿勢にまで代償を求める。'
    onyxium_warplate: '回収された戦鋼の全身鎧。着るのは脱ぐより骨が折れる。'
    orb_of_purity: 'ペイルウッドのどの母親も、やり直しをさせてくれる宝珠について子供たちに警告する。一度握れば、汚れなく、無垢に、そして見事に何もわからない状態で生まれ変わる。魔法の健忘症も所詮は健忘症だ。ただ、少しばかり礼儀正しいだけで。'
    orchid_spore_blend: '蘭の花弁と砕いた胞子を混ぜ合わせたもの。出来上がりの味より製造過程の臭いの方がひどい。'
    origin_composite: '山で最も古い繊維を圧して作られた、年齢相応に振る舞うことを拒む何か。遺物にしては怪しいほど弾む。'
    origin_crest_of_world_wound: '世界が裂けた線が刻まれ、着用者が下がどちらかを忘れないようになっている。ここでの下とは、意見を持った方角のことだ。'
    origin_philter_of_world_wound_genesis: '創傷の神託が量り分ける。用量を決して説明せず、それでいてまだ一度も外したことがない。信頼だけが、君の用意する材料だ。'
    origin_philter_of_world_wound_scar: '傷痕の詠唱者が刻む拍子に合わせて調合される。歌の一行につき一計量。だからどの一釜も同じ味にはならず、どれも決して急がされない。'
    ornate_bronze_legplates: 'この脛当てを飾る角の主は、鍛冶師が意図を悟るまで十七回突進した。十八回目の突進は角頭の最後であり、鍛冶師の最高傑作の始まりであった。執念と頑固さが残した最良の遺産である。耐久性は折り紙付きだ。素材の強度は証明済みだ。'
    ornate_bronze_plate: '厚い。密度が高い。頑固。角頭の角のように、そしてあなたの性格のように。'
    packrat_thinking_cap: '内側に余分なポケットがある。品評会のリングで中身を尋ねる者はいない。'
    padded_boots: '踏んではいけないものを踏んだ時のための追加パッド——この世界ではそれが基本的に全てだ。足は無言で感謝し、残りの体は正当な理由でパニックに陥る。少なくとも足元だけは守られているという安堵感がある。安全は靴から始まる。'
    padded_coif: '分厚い詰め物が打撃も思考も等しく吸い込む。永遠に立っていられるが、理由は思い出せない。'
    paragon_spellbook: ''
    parrot_hat: 'It is a parrot. On your head. It does not talk, which is somehow worse.'
    patchwork_trousers: '転がっていた布で縫った。各脚の色が違う。ファッション声明か助けを求める叫びか？'
    patience_amulet: 'スロシアンはふさわしい持ち主を百年待った。厳密には、まだ待っている。'
    patience_charm: '決して当事者ではなかった諍いの最中、何世紀も握られ続けて滑らかになった石。'
    patience_club: 'スロシアンのすることすべてがそうであるように、ゆっくりと動く。そして、地面そのものがその場に留まる気をなくしたかのように振り下ろされる。急いでいると咎められたことは、これまで一度もない。'
    pearl_shard: 'ヤドカリの殻の中からの割れた真珠の破片。宝石商には価値があるが、カニにはない。'
    pearl_shard_mace: '蟹の真珠片がちりばめられている。一撃ごとに葬式の風鈴のような音がする。'
    pearl_shard_pendant: '反撃したと伝えられる牡蠣から採れたひび割れた真珠。採取者は指を二本失い、二枚貝への敬意を得た。真珠は水中で淡く光るが、そこでは呼吸できないので美しいだけで無意味な代物だ。しかし確かに美しい。海の宝は陸でも輝く。'
    pebble_pendant: '紐に通した滑らかな河原石。宝石職人は『ミニマリストデザイン』と呼んだ。他の全員は石と呼んだ。'
    pet_admin: ''
    pet_aloe_gaia: '薬用の変種。小さな切り傷、日焼け、そして傷ついたプライドを癒す鎮静樹液を滲み出す。すべての擦り傷を致命傷のように扱い、世話を認めるまで不安そうに浮遊する。樹液の味は最悪だが、そもそも怪我をしないようにするための予防策だと本人は考えている。'
    pet_amber_cactee: '古代の松林と悪い人生の決断の匂いがする。時々樹脂でハエを捕まえる。'
    pet_anorak: 'この蜘蛛の甲殻に刻まれたエメラルドのルーンは、管理可能な大きさに縮小された大蜘蛛アラゴグの封印された本質で脈動している。縮小された威厳は依然として威厳だ——ただ本人の蜘蛛はそのことに激しく同意していない。'
    pet_arcane_gaia: '生きた学者の誰も解読に成功していない配列で脈動する発光する秘術ルーンが刻まれたガイア標本で、複数の学者が深遠な宇宙論的真理から在庫目録に見えるものまで競合する翻訳を出版している。より大きなことのために作られたと疑う生物の威厳ある諦念で荷を運ぶ。'
    pet_arcanite_cactee: '小動物を眠らせ魔法使いに片頭痛を与える周波数で子守唄をハミングする。'
    pet_arcanize_bricheton: '皮膚のルーン文様は古代の穀物在庫管理システムとして特定されたシーケンスで這い回る——ブリシュトンでさえ帳簿をつけるという証拠だ。たとえその会計士が明らかに高度な魔法使いだったとしても、帳簿は正確だ。魔法と農業の交差点に立つ。'
    pet_arisen_bouloute: ''
    pet_arisen_corbac: ''
    pet_arisen_lootbox: ''
    pet_arisen_modni: ''
    pet_arisen_timon: ''
    pet_barley_bricheton: '小麦の小物の倍の大きさで、謙虚さは半分。証文でも持っているかのように大麦の畝を掘り返す。'
    pet_blood_bricheton: '夜が更けると瞳が深紅に染まり、あなたの脈拍に鋭く持続的な関心を寄せる。治療師はその習性を不穏と呼ぶ。死霊術師はそれを賛辞と呼び、あなたにもそう思うべきだと言い張る。'
    pet_bloodstone_cactee: 'その針は常に深紅に染まったまま。獣医は原則としてこれを診察したがらない。'
    pet_bouloute: ''
    pet_burnt_bricheton: '煤まみれの相棒。冬は暖かさを提供し、年間を通じて火災保険の問題を提供し続ける。保険会社は特別な免責条項を設けた。それでも足りない。煤の跡が残る場所は、冒険の証として受け入れるしかないだろう。温もりには常に代償がある。'
    pet_chomperion: ''
    pet_chromafin: ''
    pet_corbac: ''
    pet_cryofin: ''
    pet_cursed_bricheton: '農家の頂点たる相棒。農業の呪いに浸かりきったイボイノシシで、通り過ぎると作物が萎れる。逆説的に雑草だけは繁茂する。宇宙のユーモアは独特だ。農家にとっては複雑な感情を抱かせる存在といえる。農業と魔術は相容れない場合がある。'
    pet_cursed_gaia: '薬草師という職業の頂点の相棒であり、呪われた菌類エネルギーに徹底的に浸透したガイアで、記録された歴史より古い言語で所有者のインベントリの重量配分について求められていない解説を呟く。比類なき荷駄獣で忠誠は絶対であり、その夜間の囁きは、長期所有を生き延びた者によれば、やがて聞こえなくなるものだという。'
    pet_cursed_gem_cactee: 'インベントリの重量について暗い予言をつぶやきながら、忠実に荷物を運ぶ矛盾した生き物。その予言が正確なのは、荷物を運んでいるのが自分自身だからに他ならない。この事実を本人は全く気にしていないようだ。予言と現実は一致する場合がある。'
    pet_deadmaw: 'ハデスは己の猟犬を人間に貸すことは滅多にない。だがこの焦げた野獣は今、新たな主の傍らに忠実に付き従う。地獄の熱は毛皮から消えず、足跡は草を焦がし続ける。それを問題と呼ぶ者は、隣人くらいのものだ。冥界の絆は断ち切れない。'
    pet_diamantine_cactee: '花の代わりにダイヤを咲かせたサボテン。圧力について一家言あるが、誰も聞いていない。'
    pet_doris: ''
    pet_draconite_cactee: '感情を持つ竈のように熱を放つ。革鞄には最悪、寒い夜には最高の相棒。'
    pet_draconize_bricheton: '鱗を持つイボイノシシ。まるで自分こそが竜で、あなたの方が転生ネタだと言わんばかりに見てくる。'
    pet_dragon_gaia: '威風堂々、虹色の輝き。機嫌を損ねれば、野営地の内装はたちまち変わる。'
    pet_duskite_cactee: '古い言い伝えによれば、深い坑道で蝋燭が消えたまま二度と灯らなかった場所に、これが生えたという。口論の最中に姿を消すのに最適だ。もっとも、それで議論に勝った者は一人もいない。'
    pet_ensable_crayfish: ''
    pet_gaia: '踏まれるのを恨む程度の魂を宿した苗。すべての靴を覚えている。'
    pet_heraklion: '悪名高きスケルトンロード・ネラクが育てたこの猟犬は生者を狩るためのものだ。その空洞の肋骨は、死しても癒えぬ飢餓を響かせる。飼い慣らすことは推奨しない——が、誰もあなたを止めることはできないだろう。猟犬の本能は死を超える。'
    pet_ice_corgi: ''
    pet_ivory_gaia: '古い大理石に差す月光のように青白いこのガイアの変種は、亡命王族の威厳を纏っている。土の道を歩くことを拒み、明らかな軽蔑を込めて僅かに浮遊する。頼まれてもいないのに近くの水源を浄化することがあるが、それをする時にあれほど得意げでなければ好ましいのだが。'
    pet_jade_cactee: '歩くサボテンにしては驚くほど穏やか。戦闘中など不適切なタイミングで瞑想する。'
    pet_jones: '崇拝への飢えが、飼い主の指への飢えに勝つことを祈れ。'
    pet_krinan: ''
    pet_lasgalen_rabbit: ''
    pet_lootbox: ''
    pet_malt_bricheton: '発酵の匂いが絶えず漂い、大麦の最も危険な形を発見した生き物のおぼつかない足取りで荷物を運ぶ。これが献身の匂いだ、と自分に言い聞かせている。その言葉を信じるかどうかは、所有者の判断に委ねられている。献身の形は様々だ。'
    pet_melted_koa: '冷えゆく火葬堆のそばで丸くなっていた。その温もりを離れようとしない。'
    pet_modni_lyk: ''
    pet_moonstone_cactee: '満月と曇りの火曜日にしか見えない。なぜ火曜日なのかは誰にもわからない。'
    pet_moray: ''
    pet_nightcap_gaia: '哲学的献身に近い熱意で永遠の闇に適応したガイア種の夜行性変種で、光のない回廊を通って所有者の持ち物を運びながら、この取り決めに至った全ての判断への静かな不承認を放っている。影の民はそれを賢慮と呼ぶ。闇の中でこそ真価が問われる。'
    pet_obsidianite_cactee: '棘の一本一本がガラスのように鋭く、その鋭さを保つことに全く妥協がない。木箱に描かれた古い警告文はたった一行だが、その一行は正しい――抱きしめるべからず。'
    pet_ocean_lootbox: ''
    pet_phacochere_son: '兄弟の中で一番小さく、親の後ろをどこまでもついていく……本当に危険な場所を除いては。'
    pet_phantom_gaia: '祖母は満月のたびに山羊が地下室の壁を通り抜け、胞子の匂いをまとって戻ってくると言い張っていた。山羊たち自身がそれを始めるまで、誰も信じなかった。この個体は今でも扉より壁を好む。'
    pet_quartz_cactee: 'A pale little cactus whose spines set into cloudy crystal. It hums quietly near ore veins, mostly to itself.'
    pet_radient: '天界の光の捕らえられた本質を、輝く毛皮が燃え立たせる太古の狩人。'
    pet_rock_koa: '岩コア:「もっと厚い皮膚を育てろ」という助言を文字通りの設計仕様として受け取ったコア——とんでもない重さで、判決のように沈み、地質学の力だけであらゆる睨めっこに勝つ。'
    pet_siluri: '古の血統の最後の生き残り。時を経た甲羅に幾千年の重みを背負う。伝説によれば、いまだに「絶滅」騒動を哺乳類に許していないとか。それが真実だとすれば、これほど長い根に持ち方は歴史上でも珍しい部類に入る。長生きには長い根が必要だ。'
    pet_suize_bricheton: '結晶の牙が風に鳴る。そのメロディーを、他のブリシュトンは皆ひどく個人的に受け止める。'
    pet_talokan_feu: ''
    pet_tanjirize_bricheton: '銅色の毛皮で香辛料商人を引きつけ、地域で最も感度の低い鼻にも届く距離まで個人空間を押しのける荷獣。接近してくる商人の数と個人空間の縮小は、完全に比例関係にある。荷物は確実に届く。それだけは確かだ。香りは距離を無視する。'
    pet_timon: ''
    pet_tokeko: ''
    pet_truffle_gaia: '嗅覚があまりに研ぎ澄まされ、もはやあなたの存在そのものを不快に感じるガイア。'
    pet_ukranize_bricheton: '牧人たちの話では、かつて飢えた村を三度の冬にわたって不平ひとつ言わずに運んだ獣の血を引くという。以来、不平を言ったことはない。ただし荷物を軽くさせてくれたこともまた、一度もない。'
    pet_vainquished: ''
    pet_velkarion_wyrmling: ''
    pet_wheat_bricheton: '初収穫で肥え、穀物のすべてを自分の手柄と信じている。鋤を追い、畝を品定めする。'
    pet_wind_koa: '風のコア:あまりに空力的すぎて、たまに留まることを忘れるコア——ほとんどは紐で繋いである。気圧が下がると唸るが、それはただ自分が正しかったと自慢するためだ。'
    pet_wither_gaia: 'その歩いた跡には、枯死と呼ぶにはあまりに美しい光景が花々によって描かれる。献身的な荷駄獣ではあるが、それがおやつの時間までに庭に何をするか、覚悟しておく必要がある。'
    pet_zot: ''
    phacochef_tusk: 'ファコシェフの大地を揺るがす突進で頭蓋から砕け落ちた巨大な牙。鉱石の脈が象牙を走り、今なお地震の力で唸っている。'
    phacochere_key: 'イノシシの牙を削り泥で封じた鍵。豚のダンジョンの鍵に期待通りの臭いがする。'
    phantom_distillate: '捕らえた鬼火から精製された。その出所同様、明滅を繰り返す。'
    phantom_essence: ''
    phantom_razors: '薄すぎてほぼ存在しない。何かを拾い上げようとして初めて指が減っていることに気づく。極限まで繊細で、完全に卑劣な武器だ。被害者は常に「気づくのが遅すぎた」と述べる。それ以外の証言は存在しない。見えない刃は最も深く刺さる。'
    phantom_spore: 'この世界に半分、触れられたくない胞子たちの行く場所にもう半分身を置きながら、閉ざされた扉の下を滑り抜ける噂話のように、値しない指の間をすり抜けていく。採取には無心が必要だ——たいていの薬草師は、偶然にしかその境地に至らない。'
    piranha_amulet: '群れの仲間の気持ちごと何もかも食らう魚の歯。'
    piranha_cleaver: '本物のピラニアの歯で鋸歯状に加工されており、今なお目の前のすべてを食事だと思い込んでいるらしい。公平に言えば、これまでのところその判断はさほど外れていない。'
    piranha_tooth: '小さく三角形で、いつも二百本単位で売られる。一匹のピラニアだけが問題になることはない。'
    plague_fang: '本当に特定したくない何かでコーティングされたギザギザのネズミの歯。厚い手袋で扱え。もっと厚い。'
    plague_fang_signet: '七つの都市でその名を禁じられた生き物の紋章が刻まれた印章指輪。それが残す封蝋は決して完全には乾かない——そしてそれで封をされた手紙は、どれほど遠くとも必ず届く。届かない場合、差出人に問題があったとされる。'
    plague_mace: 'かすかな緑の輝きと、そうでない緑の臭いを放つ。打撃部は癒し手が特定を拒む何かで覆われている。その拒否は医学的見地からではなく、おそらく契約上の問題から来ている。知らないことは、答える義務を免れる唯一の方法なのだ。'
    plague_razmo_fang_blades: '害獣駆除の制式双刃。墓穴鼠も噛みつくが、これはより先に噛む。'
    plague_treads: '足跡は一時間で緑に変わる。プレイグモはこれを症状ではなく署名だと考えている。'
    plaguefang_blade: '疫病の牙から抽出した液で焼き入れされ、刃は冶金師たちが強い不安を抱く色合いに変じている。切れ味は申し分ない。誰も話したがらないのは、その後の手当てについてだ。'
    plaguemo_boots: 'この革をなめした職人は、三度の疫病と一度の非常に気まずい発疹を生き延びた。'
    plaguemo_skullcap: 'プレイグモ自身の頭蓋板から作られた。奇妙なことに、それが工程の中で最も気にならない部分だった。'
    plainsteel: '彫刻もなく、金箔もなく、誰かが名付けるまでは気の利いた名もなかった。鋼自身は注目など求めていなかった。'
    pocari_sweat: ''
    polar_fortress_plate: '重装甲すぎて機動性は都市伝説と化す。何も貫けない。いずれお前もだ。'
    polar_reaver_breastplate: '沼を開けた地面と見誤った略奪者から奪った。そうではなかった。'
    polar_reaver_greataxe: '船長お気に入りの得物。一振りされれば中立でいられる者はいない。'
    polar_reavers_crook: 'かつては羊飼いの杖、今は盗賊の杖。羊たちは幸運だった。'
    polishing_resin: '宝飾品と精密金属加工用の透明仕上げコート。全てに『ボスから取りたて』の輝きを付与。'
    pollen_mote: '決して着地しようとしない、たった一粒の漂う花粉。'
    practice_longsword: '鈍い練習用の刃。切れるのは誰かに見られた時の尊厳だけ。'
    praetorian_oath: '軍旗が倒れる前に立てられた誓い。誰も任を解いてはいない。'
    preserving_oil: '有機物の分解を防ぐ。パン屋はパンの保存に使い、ネクロマンサーは別の目的に使う。'
    primal_catalyst: '四大属性エッセンスを結合するエンドゲーム万能試薬。全職業の伝説級装備に必要。'
    primeval_codex: '亀裂そのものより古い頁で綴じられ、天頂が無傷だった頃の姿を伝える唯一知られた記録だ。深淵の審問官たちは何世代にもわたり最終章をめぐって論じ続けている。'
    primordial_band_of_first_dawn: 'はめられるべき指よりも、着用者に束の間、健やかなほどの卑小さを覚えさせる差だけ古い。'
    primordial_bone: '最古の塚の最下層から引き上げられた。そこに記された如何なる名よりも古い。'
    primordial_cleaver: 'それが終わらせるのに使われた教義の大半よりも古い。柄が温かいのには理由があるが、それを携えた預言者は一度も説明せず、今の所有者はもう尋ねるのをやめた。'
    primordial_draconize: ''
    primordial_lance: '幾久しく絶滅した巨人の歯から鍛えた槍。穂先は決して鈍らない。この種の敵もまた存在し続けているからではないかと示唆する理論家もいる。その理論は不人気だが、反証もされていない。夜は長く、理論家たちは多い。'
    primordial_legplates: '四度目の突撃失敗の後に回収された。五度目はそれでも着用した。'
    primordial_poultice_of_first_dawn: '始まりの光でしか開かない苔が詰められ、下の傷は太陽が定める予定に従って癒える。君ではなく。'
    primordial_tonic_of_last_ascent_genesis: '見つかった中で最も古い生きた苔を煎じたもので、摘まれた瞬間に再生し、煮出されることをやや不服そうにしている。'
    primordial_tonic_of_last_ascent_scar: '登り口で、一本あれば山が短くなると思う者に売られる安酒。短くはならない。痛むところを少しだけ和らげる。'
    primordial_totem_club: '分裂が預言をほとんど無用にしてしまう前、ここで預言していた者によって彫られた。図像柱の顔は、あまりに何度も正しかったせいで滑らかに擦り減っている。'
    primordial_treads_of_first_dawn: '靴直しという生業よりも古い革で仕立てられている。ある言語で軋むが、それを訳せる靴職人はとうに一人残らず去った。'
    primordial_trident: ''
    primordial_warblade_of_last_ascent: 'あまりに何度も打ち直され、鍛冶師は修理の下に原型を見失った。元が何であれ、今やそれは打ち続けるという意志だけでできている。'
    primordial_worldpiercer: 'レベル100の門の前に作る最後の一品であり、それを生き延びる最初の一品でもある。'
    prisma_arcane_crown: 'よりによって間違った大魔導士を挟んだ蟹の鋏から鍛えられた。その幽霊は今も文句を言っている。'
    prisma_bastion_mace: '最後まで戦列を守った者に支給された。それはもう遠い昔のことだ。'
    prisma_convergence_amulet: '各輪は別々のシンダーシェイドの燠が冷やされ、分別より忍耐の勝った誰かによってつなげられたものだ。それらを揃って輝かせるには、極めて特殊な静けさが要る。'
    prisma_dual_plate: '二体の異なるシンダーシェイドから取れた二枚の半板が、寒い夜には今も微かに光る継ぎ目で鍛接されている。どちらの半分も、これに同意した記憶はない。'
    prisma_dual_sash: '二枚のシンダーシェイドの皮を重ね合わせたもので、それぞれが相手にできないことを補って絶縁する。重なり部分は洗濯物を乾かせるほど温かい。'
    prisma_elementalist_grips: '完全に冷める前に革へ折り込まれた、シンダーシェイドの最後の熱。掌はどんな冬でも温かいままだ。握手は気まずいものになる。'
    prisma_ember_band: '鍛冶場を離れて久しくとも温かい。ここの物はみな、完全には冷めない。'
    prisma_emberstep: '一歩ごとに微かな焦げ跡を残す。誰かが辿ろうと思う頃には消えている。'
    prisma_flameguard: '火葬司祭が死者を焼く穴で焼き固められた。完全に冷めることはない。'
    prisma_flameheart_pendant: '甲冑の下に着け、板金越しにも火葬の熱を感じるほど近くにある。'
    prisma_flamelegs: '火葬の穴に最も近く纏われる。裾はいつまでも燻り続ける。'
    prisma_gale_sash: '最後の招集のために結ばれた。その日読み上げられた名はどこかにまだ記されている。'
    prisma_gale_vest: '沼沢地が静まる前、最後の交代で纏われた。今なお静かなままだ。'
    prisma_hybrid_crown: '半分は頭巾、半分は王冠で、まったく決めかねている。シンダーシェイド自身の輪郭が、いつまでも一つの形に定まらないのと同じだ。この優柔不断さこそが構造を支えている。'
    prisma_longsword: '熊の爪を鍔に、嵐の羽根を樋に。美しい。そしてあなたの感想には一切興味がない。'
    prisma_mace: '牙を打ち込み、盗んだ羊毛で巻いてある。振るう者の恨みをそのまま増幅する。'
    prisma_sabre: '群れ狩り用に研がれた刃。単独でもよく切れるが、仲間といる方を好む。'
    prisma_spellbinder_sash: '手袋と同じ信号符号が織り込まれている。読み取りは思うより速い。'
    prisma_spellweave_gloves: '火葬司祭が使った古い信号符号が刻まれている。指の動きは読みより速い。'
    prisma_stormheart: '最後の点呼を行った者によって温められ続けた。他の誰にも聞こえぬ鼓動を今も刻む。'
    prisma_stormlegs: '戦列を進んだ最後の縦隊のために仕立てられた。それは戻らなかった。'
    prisma_tempest_ring: '詰所が静まる前、最後の交代で身に着けられた。'
    prisma_tidal_treads: '巡回の合間に足を温めるためシンダーシェイドが好んだ噴気孔で鋳造された。作られてから何週間も熱いままで、鍛冶師はそれを利点と呼び、着用者は不満と呼ぶ。'
    prisma_tide_signet: '炎が造形を終える前のシンダーシェイドの顔らしきものが刻印されている。これで封をした書類はかすかに焦げた匂いがして届く。受け取った者が理由を尋ねることは滅多にない。'
    prisma_tidewalker_legs: '地面がその形を覚えるまで動かなかったシンダーシェイドから裁たれた。俊敏さは靴底から流れ出し、代わりに頑健さが流れ込む。走るという選択肢は献立から消える。'
    prisma_windcrown: '最後の点呼を行った者に授けられた。最後の名には誰も応えなかった。'
    prisma_windweave_grips: '墓の戦列間で伝令を運んだ走者が纏った。誰一人として走るのをやめなかった。'
    prisma_zephyr_boots: '戦況より速く報せを運んだ走者たちが履き慣らした。'
    prismatic_saber: '柄頭では燠の核が脈打っている。鍛冶師が取りかかった時にはまだ冷え切っていなかったシンダーシェイドから回収されたものだ。使い手の機嫌に合わせて色を変える。使い手の意思とは関係なく。'
    pristine_malt: ''
    pyre_ash: 'ちり取り一杯分の大聖堂の床。灰、ガラスのきらめき、そして一すくいにつき片方のイヤリング。'
    pyre_chain_girdle: '鎖の輪は普段は温かく、戦えば熱い。ズボンを留め、敵を警戒させておく。'
    pyre_channeler_staff: '火葬の司祭が携えた杖。灰は決してその周りに落ち着かない。'
    pyre_cleaver: '火山の炎で焼き入れした鋼で鍛えたパイアのクリーバー。切るというより焼灼する。戦場の外科医たちが一時検討したが、慎重さには効用があることを誰かに思い出させられた。肉屋たちは迷わず採用した。用途の違いは少ない。'
    pyre_crown_fragment: 'シンダータイラントの頭飾りの一部。権威と極度の熱を放射する。追従者が無意識にその近くに形成される。'
    pyre_handler_mitts: '聖歌隊のガラスを焼く窯のために縫われた。何でも掴め。何も悔いるな。'
    pyre_walkers: '普段の歩調で炭床を渡れるほど厚い靴底。この持ち場では、それが普段のことだ。'
    pyrecleaver: '建前上は薪割り用。会衆はその前を実に礼儀正しく通り過ぎる。'
    pyreguard_cuirass: '燃え盛る炎に最も近く立つ者が纏った。焦げても燃え抜かれたことはない。'
    pyrehymn_cuirass: '鍛えたのではなく、焼いた。窯から出てきた時にはもう、あなたの問題にうんざりしていた。'
    pyrehymn_draught_of_cooling_vent: '冷えゆく噴気孔の蒸気を瓶詰めした。鉱物とかすかな後悔の味。それでも生き返らせる。'
    pyrehymn_gauntlets_of_ashen_song: '手首まできつく巻いたふきん。どこかの台所の引き出しが、ひどく寂しがっている。'
    pyrehymn_girdle: '腰で火勢を止める焦げた革の帯。すでに幾度も止めてきた。それが見て取れる。'
    pyrehymn_greaves_of_cooling_vent_choir: '冷えた流れ滓から鋳造した、欠陥ごと。今やその欠陥が荷を支えている。触るな。'
    pyrehymn_greaves_of_cooling_vent_pyre: '熱を下へ逃がすための切れ込みがあり、そのぶん靴が矢面に立って、何も言わない。'
    pyreward_diadem: 'いつでも額が温かい。冷たくなった日には、あなたも走れ。'
    quartz: '気取った錬金術師だけが理解すると主張する周波数で振動する曇った水晶。'
    quartz_choker: '周囲光を捕らえ、夜にそっと返す磨かれた石英のチョーカー。ナイトライトとして有用。武器としては役に立たない。一部の冒険者たちは暗闇で読書するために使用しており、魔道書の出版社はそれを歓迎するが、暗闇に潜む暗殺者たちは感謝しない。'
    quartz_powder: 'ダイヤモンドダストと混ぜた粉砕クォーツ。近くでくしゃみすることは強くお勧めしない。'
    quickbite: '最初の一撃に気づく間に、三撃が入る。傷痕の生物たちは、確かめるために待つのをやめた。'
    quickstep_sash: '防御より装飾。でも回避中は最高に映える。'
    quillbound_cord: '精査にかろうじて耐える。一度も検証されたことのない主張だ。'
    quillweave_grips: '自認する限り、一応の性能は発揮する。着用者はそれを信じることに決めた。'
    ramrage_sash: 'ラムレイジの羊毛から織られた。ほぼ破壊不能。ただし臭いは永遠。'
    ramrage_waraxe: 'ラムレイジの角のカウンターウェイトでバランスを取った。斧が20キロの時、バランスは相対的。'
    ramrage_warhelm: '怒れる牡羊の角で飾られている。戸口をくぐるたび、見物人の忍耐が本気で試される。'
    rangers_longbow: '暗い森での何年もの奉仕で磨かれた斥候の長弓。木の傷のひとつひとつが、命中の確信なく闇に放たれた矢を証言する。それらの射撃の一部は命を救った。他は単に鹿を驚かせただけだ。どちらも連隊の記録に数えられる。'
    raptor_bone_bow: 'ラプトル自身の肋骨から削り出され、その最期の怒りの突進の形を今も留めている。放たれるどの矢も、速く、怒りに満ち、あなたの意見など一切気にも留めない。'
    raptor_claw: '曲がっていて剃刀のように鋭く、まだ温かい。武器鍛冶はダガーに鍛造する。ラプトルは缶切りとして使っていた。'
    raptor_hide_boots: '書き残すことを拒む三世代の靴職人が口伝えで受け継いできた方法で鞣したラプターの革で作られたブーツ。質感は独特だ。匂いは時間とともに薄れる。その時間は可変で、一般に購入者が期待するより長い。忍耐が必要だ。'
    raptor_javelin: 'もっと良い日を知っていたラプトルの爪が先端についている。そしてもっと酷い獲物も。'
    raptor_scale_greaves: '提供元のラプターは時速六十キロほどで抗議した。追いつくことはなかった。'
    rat_bile: 'ネズミの悪意腺から抽出。科学者はこの腺は存在しないと主張。ネズミは反対している。'
    rat_trousers: 'ネズミの皮から作られた継ぎ接ぎの衣服。その縫い目の一つ一つが、街の地下での必死の闘いを物語っている。これを身にまとうことは、貧困における最初の犠牲者が尊厳であることの証だ。'
    raven_beak: '鉄のように硬く、悪意のように鋭い。武器鍛冶はフレイルに取り付ける。カラスはそれに別の計画があった。'
    raven_coif: 'この羽を落とした始祖鳥は、実質的に将来の復讐を約束していったようなものだ。'
    raven_eye_pendant: '琥珀と銅で封じられ、鷹の忍耐と禿鷲の審判を与える。'
    raven_flight_bow: '急降下の最中に抜け落ちた羽で矢羽根を作った。矢は今も下がどちらか覚えている。'
    raven_grips: 'フェランの毛皮を裏地にし、爪まで揃えた。フェランたちは仕立て屋を今も許していない。'
    raven_hauberk: 'フェランの毛皮は倫理的には微妙だが構造的には完璧。洗濯機で洗えるとも言われるが、誰も試していない。'
    raven_trousers: '下は毛皮、裏地は羽毛。鏡で見ると落ち着かないが、動いている時は不思議と決まる。'
    rawhide_belt: 'なめしていない革。微かに実存的恐怖と湿った動物の匂い。なめし職人の初めての本格作品。'
    razendril: 'ネズミの牙を精巧に削り出した、驚くほど優雅で致命的な刃。'
    razlord_trophy_belt: 'もはや不要となった者たちから得た証を下げている。季節ごとに重くなる。'
    razmaster_grudge: '先に噛みついたはずの墓穴鼠から得た。'
    razmaster_longsword: 'ラズマスターは全ての争いを同じ方法で解決する。この刃が最終弁論だ。'
    razmo_bone_pike: 'ラズモの大腿骨から削り出した。歯形は欠陥ではなく特徴。'
    razmo_pelt: 'みすぼらしいネズミの皮。なめし職人は受け取るが、完全に軽蔑の目で見られる。'
    razmoket: 'ありふれた下水ネズミの切り落とされた尾。薄暗いトンネルで引きずっていた汚物の痕跡がまだ残っている。'
    razord_fangblade: '決して溶かせなかった牙を中心に鍛えられた。鍛冶師たちは結局その牙の周りに剣を組み上げた。'
    razord_skullcap: '内側に剃刀鴉の羽が敷かれ、着用者の意見は目に見えて鋭くなる。'
    razorfang: '下水道に巣食う害獣の巨大な牙から削り出された、このギザギザの刃は疫病の呪いを帯びている。'
    reaver_visage: '保護よりも恐怖を与えるために鍛えられた略奪者の面頬。どちらも達成するが、マスクのどちら側にいるかによって異なる割合で。外側は恐慌を起こさせる。内側は軽い閉所恐怖症と不本意な瞑想を起こさせる。バランスは崩れている。'
    recurve_practice_bow: '訓練室で使われるリカーブ弓。ほとんどの弓より姿勢のミスを許容する。教官たちはそれを残念に思う——許容されたミスは持続する傾向があるからだ。弓自体は文句を言わない。その結果が黙って語る。常に正直な証人だ。'
    red_gaia: '峡谷の鉄分を含む粘土に染まり、密かにそれを誇っている。薬草師が意図的だと言い張る赤い樹液を流す。'
    red_orchid: '気密水晶の中に保存された錬金術的な赤い蘭。既知のどの地図にも存在しない山の頂上で摘まれた。わずかにまだ成長している——水晶が気密に封じられているため錬金術師たちはどのようにかを知らない。理由を理解しようとするには好奇心が強すぎる。水晶を開けるには慎重すぎる。'
    refined_solution: '純粋な頑固さから酸化を拒む精製された錬金媒体。'
    reforged_ember: '削り取った硫黄。飴のように赤く、やる気満々。一擦りかぎり、返金なし。'
    regalfall_breastplate_of_empty_seats: 'ほとんどの状況で、一応は機能する。それは聞こえる通り、まさにその程度の安心感でしかない。'
    regalfall_grips_of_empty_seats: 'さらなる審査待ちの、暫定的な稼働状態にある。代替案を思えば、ささやかな救いだ。'
    regalfall_legguards_of_silent_court: '疑問を持った瞬間に保証は無効になる。関係者全員が忘れることに同意した詳細だ。'
    regalfall_tonic_of_silent_court: '効果は現れることもあれば、現れないこともある。したがって、正式には自己責任での飲用となる。'
    regalfall_warbelt_of_silent_court: '説明書は白熱した議論の中で失われた。そのため元の論争は引き分けと宣言された。'
    regent_ore: '二つの別々の報告書がこれを矛盾した言葉で説明している。それは季節と尋ねる相手によって変わる。'
    regent_spellbook: ''
    reinforced_mitts: '拳のメタルスタッドが防御と威圧感を両立。握手が声明になる。'
    relic_aragog: '蜘蛛の母は自発的にこの牙を落とした——自発的というのは、特に大きな冒険者を消化している間に誰かが引き抜いたという意味だ。まだ毒が滴り、敵に人生の選択を再考させる。'
    relic_chairman: ''
    relic_dragon_fire: '竜は何世紀も前に死んだ。セントラルヒーティングには誰も伝えていない。身廊の下のどこかで今も時間どおりに燃え続け、暖房管は礼拝のたびに二度ノックする。'
    relic_dragon_frost: '霜竜が氷河との感情的な口論の最中に流した結晶化した一粒の涙。決して溶けず、温まらず、部屋の向こうから飲み物を不快なほど冷やすことで知られている。錬金術師が研究を試みたが、器具が凍り付いて閉じてしまう。'
    relic_dragon_void: '虚空のエネルギーを長く摂取しすぎて日光の味を忘れた竜から引き剥がされた顎骨。家具が勝手に並び替わる周波数で唸り、近くにいる者は突然、自分がしたすべての恥ずかしいことを思い出す。持ち運ぶ戦士は著しく強くなると報告するが、同時に著しく実存的に不安定にもなるという。'
    relic_duke: ''
    relic_ensable: '前に進むより後ろに戻る方が多い。保証は明示も黙示も一切ない。'
    relic_fenrik: ''
    relic_gobeline: 'ゴブリンたちはこのアーティファクトを、食べられないために注ぐのと同じ熱意で崇拝している。つまり：必死に、そして威厳なく。'
    relic_guardian: ''
    relic_koa: ''
    relic_kraken: '海の色が今と違った頃を覚えているほど古いリヴァイアサンから抉り取られた。'
    relic_magmalug: ''
    relic_nerak: '話の途中で塵と化した骨商人が、ネラクその人の背骨から削り出したと語られる品。宮廷にとっては史上最も説得力のある論評だったという。身に着ければ、風が何かを語りかけてくる。答えない方が身のためだ。'
    relic_pale_weaver: ''
    relic_past: '忘れられた時代の残響。この遺物はかつて創造の坩堝で鍛えられたが、その作り手は既に知られるすべての領域から姿を消した。残るのはかすかな古の力のうなりだけ — かつてあったもののささやきだ。'
    relic_phacochef: '山に頭突きして勝ったほど頑固な猪の顎から引き抜かれた牙。その悪臭だけで持ち主に超自然的な頑丈さを与える——あるいは、みんなただ近寄らないだけかもしれない。'
    relic_ramrage: ''
    relic_razmo: ''
    relic_rex: ''
    relic_rrexn: '作り手のメモは取り消し線だらけの案ばかりだ。それでもなお、成功と見なされている。'
    relic_seraph: ''
    relic_wanilla: ''
    reset_spells_scroll: '脳が暴力を選び、OSを完全削除するほど衝撃的な禁断の知識が封印されている。少なくとも酒場で口走ったあの恥ずかしい失言は、ようやく忘れられるだろう。'
    resonance_band: 'そばで正しい音が鳴ると、独りでに鳴る。便利な警告だ、その音があなたの葬式でなければ。'
    resonant_pike: '穂先は三百年前にすり切れた。柄のほうは引退を拒んでいる。'
    rex_bone_cuisses: 'レックスの骨の装甲で強化された大腿ガード。歩くのが筋トレ。走るのは願望。'
    rex_bone_signet: 'レックスの骨に牙を嵌め込んだ印章。蝋に押すと印が残る。敵に押すともっと残る。'
    rex_fang: '前腕より長い歯。これを生やしたレックスは非常に大きく、非常に怒っていた。その順番で。'
    rex_fang_claymore: 'レックスアルファが最大の牙を寄付した。不本意ながら。'
    rex_hunter_longbow: 'レックス狩り専用設計。テストした狩人は二度と見られなかったが、弓は戻ってきた。'
    rex_jawbone_cleaver: 'レックスアルファの顎骨から作った斧。刃に沿う歯は原物。'
    rex_jawbone_talisman: '磨いてタリスマンに仕立てた一本のレックスの牙。前の持ち主はレックスではなかった。その前の持ち主はレックスだった。'
    rex_knuckle_guards: 'ナックル部分にレックスの牙の破片で強化。殴ることが先史時代になった。'
    rex_ribcage_plate: 'レックスアルファの肋骨から作られた。職人は見つけた時にはもう死んでいたと主張。'
    rex_scale_breastplate: '食物連鎖の頂点に立つ自覚のある存在から、一枚ずつ剥がした鱗。'
    rex_sinew_belt: 'レックスアルファの腱で編まれた。鎧をまとめ、臓器を中に留める。マルチタスク。'
    rex_stompers: 'レックスの骨で強化。一歩ごとに小さな地震のように響く。控えめさは計画になかった。'
    rex_tooth_talisman: '勇気を授けるらしい。実際にくれるのは、たいてい首の慢性的な痛みだけ。'
    rift_torn_band_of_split_sky: '何週間も前に終えた脱皮による、まだかすかに温かいリフトリングの抜け殻の欠片がはめ込まれている。それを育てた生き物と同じように、わざと光を歪めて捉える。'
    rift_torn_breastplate_of_split_sky: '突風をそらし、たいていの刃をそらし、実存的なめまいだけは一切そらさない。'
    rift_torn_crusher_of_torn_ground: 'リフトリングの殻が亀裂を抱くように恨みを抱く。ゆっくりと、それから一気に、それから永久に。下り坂での一撃が推奨される。上り坂での一撃も技術的には可能ではある。'
    rift_torn_extract: '裂けた地面からゆっくりと玉になって滲む。気長に集めるか、諦めるかだ。'
    rift_torn_grips_of_torn_ground: '床が当てにならなくなると、人は掴むことを覚える。これは掴み返してくる。'
    rift_torn_legguards_of_torn_ground: '完全には硬化しなかったリフトリングの脱皮殻から作られた。膝がとるべきでない角度に曲がるが、それが狙いだ。この地面は平らな状態を長く保たない。'
    rift_torn_tonic_of_torn_ground_faultline: '床がせり上がって迎えに来るような活力の奔流。ついでに本当にそうなることもある。'
    rift_torn_tonic_of_torn_ground_void: 'ヴォイドモスは巣穴を、塵とも光ともつかない何かで覆う。蒸留すると、まず腹を満たし、次に頭を空にする。順番はその通りだ。'
    rift_torn_twin_knives_of_torn_ground: '同じリフトリングの脱皮から育った二枚の刃で、どちらが本物かを今も言い争っている。その隙間こそが、敵の計画がぴったり合わなくなる場所だ。'
    riftsteel: '二つの世界が擦れ合う継ぎ目で鍛えられた。その圧を覚えていて、恨みを抱く。'
    riftsunder_blade: '最初の一撃は礼儀正しい。問題は、あなたの肋骨が語りたがる次の四発だ。'
    riftsunder_cleaver: 'その名の由来となったリフトリングが自らの脱皮線から分かれたのと同じように、打つものすべてをきれいな「前」と「後」に分ける。「その後」が結果に含まれることは滅多にない。'
    riftsunder_cuirass_of_widening_crack: '前面の継ぎ目は季節ごとに髪の毛一本分広がり、それを生んだリフトリングを引き裂いた同じ亀裂をなぞっている。着用者にはまだ誰も伝えていない。誰かが伝えるべきだ。'
    riftsunder_draught: 'リフトリングの骨の空洞から採れる。空洞なのは、リフトリングが構造的にまだ存在を完了していないからだ。一服で、一つの明確な決断が買える。'
    riftsunder_extract: 'ロープと勇敢な間抜けが届く限り、断層の奥深くから引き上げる。'
    riftsunder_fangs: '傷は小さい。数は多い。交渉役は出血が務める。'
    riftsunder_helm_of_last_tremor: '特定のリフトリングが引き起こした最後の震えが、この殻兜に唸りを残し、それは以来一度も消えていない。聴覚より長く続く。そしておそらく、あなたよりも長く続く。'
    riftsunder_lattice: '崩落の途中で凍った石の波。仮のものに見える。何世紀もそう見え続けている。'
    riftsunder_ration: '分断兵の中隊がまだ丸ごと存在していた頃に従っていたレシピで焼かれた。武器として使えるほど硬い。実際に使った者もいた。'
    riftsunder_ration_of_last_tremor: 'リフトリングが脱皮の合間に食べる何か、それを乾燥させて棒状に固めたもの。何年ももつ。とても古い引き出しの中のような味がする。'
    ring_of_the_worldeater: '指にはめるには大きすぎる台座からもぎ取られ、それでも鎖に通して身につけられている。世界喰らいは、それがただ空腹なだけなのか誰かが確かめる前に、七つの世界を喰らい尽くした。それ以来、誰も確かめていない。'
    ringfast: '外れない。売買の前に、すべての買い手に明確に説明されている。それでも大抵の者は買う。'
    riven_casque: '左の三分の一が欠けているので割引価格。敵の位置はそれに合わせて調整せよ。'
    riven_charm: 'リフトリングの殻が最初の脱皮で割れるのと同じ線に沿ってきれいに割れており、それゆえに同じく幸運とされている。この理屈はこの世界の外ではうまく通用しない。ここでは、それが福音だ。'
    riven_chausses_of_long_collapse: '崩落の最中に脱皮半ばで捕らわれたリフトリングの脚。それを仕留めた落下の角度のまま曲がっている。着用者は同じ膝が、決まって、永遠に崩れると報告する。'
    riven_longsword_of_long_collapse: 'この世界では重力は提案にすぎず、振り下ろしが着くまで一週間はかかる。弁当を持って行け。'
    riven_saber_of_screaming_rift: 'リフトリング自身の切断された肢刃から裁たれ、その裂け目の周波数でかすかに泣き続けている。検死官は衝突時の音を「役に立たない」と評している。'
    roadworn: '巡礼路をあまりに何度も歩いたため、革は自分が新品だったことを忘れた。それ以来の一マイル一マイルを覚えている。'
    root_cellar_key: '地下室が生むはずのない冷気とともに鳴る。セラー・モウはこれを百個も鋳造した——錠など一度も要らなかった。'
    roothold_treads: '動かされない。動けないからではない。動かないからだ。'
    rotted_flesh: 'ゾンビを剥ぐのは簡単。臭いは何週間も残る。パーティーメンバーはこの裏切りを覚えている。'
    rough_mitts: '器用さを犠牲にして暖かさを取った厚革ミトン。剣を握るのがチームスポーツに。'
