  job_desc:
    FARMER: 農夫は世界中の畑で穀物を収穫します。高いティアではより希少な作物が解放されます。
    HERBALIST: 薬草師は錬金術に使用する植物や花を採集します。各ティアにはより高い職業レベルが必要です。
    MINER: 鉱夫は岩石から鉱石や鉱物を採掘します。レベルが上がるにつれ希少な金属が利用可能になります。
    SWORD_SMITH: 刀鍛冶はロングソード、剣、短剣を鍛造します。鉱石と合金を組み合わせて強力な刃物武器を作ります。
    AXE_SMITH: 斧鍛冶は斧と戦斧を製作します。精錬された金属と希少素材が必要な強力武器です。
    BLUNT_SMITH: 鈍器鍛冶はメイスと棍棒を作成します。前線の戦士に好まれる頑丈な打撃武器です。
    STAFF_CARVER: 杖彫師は杖と魔導書を形作ります。知力系キャスターに不可欠な道具です。
    BOWYER: 弓師は弓と槍を製作します。敏捷性重視の戦士向け精密遠距離武器です。
    ARMORSMITH: 防具鍛冶はヘルメットと胸当てを鍛造します。最大の物理防御を提供する重装備です。
    TAILOR: 仕立て屋はパンツとブーツを縫います。敏捷性と機動性に優れた軽装備です。
    TANNER: 皮なめし職人はベルトとガントレットを製作します。バランスの取れたステータスを持つ万能アクセサリーです。
    JEWELER: 宝石職人はアミュレットとリングを作成します。強力な魔法ボーナスを持つアクセサリーです。
    ALCHEMIST: 錬金術師は採集した薬草からポーションを調合します。回復やバフの消耗品です。
    BAKER: パン職人は収穫した穀物からパンや食料を作ります。HPを回復する消耗品です。
    HANDYMAN: 職人は鍵、道具、ユーティリティアイテムを製作します。ダンジョンや特殊活動に不可欠です。
