  item_descriptions:
    aberrant_edge: 'Forged wrong. The steel bends instead of breaks. Command it carefully—it answers to angles, not strength.'
    aberrant_faceguard: 'Modeled off a face that stopped being one. Deters conversation.'
    aberrant_treads: 'Soles cast from a shape that was never quite a foot. Leaves the wrong prints.'
    abyss_core: 'Pulsing orb of concentrated void energy. Contains the dreams of a dead reality. Handle with existential caution.'
    abyss_loop: 'Pulled from water that swallowed the light whole. Still carries the weight of it.'
    abyssal_blood_wheat: ''
    abyssal_codex: 'A spellbook dredged from the deep sea. The waterlogged pages somehow still turn.'
    abyssal_conduit_staff: ''
    abyssal_edge: 'A sword that seems to absorb light around its blade. The darkness is cosmetic. The damage is not.'
    abyssal_warplate: 'The difference between a war story and a eulogy.'
    abyssgrown_blade: 'Grew its own fuller, its own edge, its own faint reluctance to be sheathed, none of which the smith takes credit for.'
    abyssgrown_cuirass_of_moonlit_mire: 'It kept growing after it was fitted, which the wearer discovered the day it stopped fitting and started, gently, insisting.'
    abyssgrown_extract: 'A concentrate that grew denser on its own after bottling, so an old vial hits harder than a fresh one and the label never keeps up.'
    abyssgrown_gauntlets: "Grew claws the smith never added and can't remove; the wearer files them under perks and moves on."
    abyssgrown_helm_of_quiet_drowning: 'Grown, not forged, from a shell the deep weald started and abandoned. The wearer inherits both the protection and the unfinished business.'
    abyssgrown_pendant_of_moonlit_mire: 'Grew a hollow at its heart that the wearer swears holds a drop of water older than the weald. It refuses to evaporate, which supports the claim.'
    abyssgrown_pendant_of_quiet_drowning: 'Beads on a cord that click softly when the wearer breathes, a comfort in the silent deep until you realize they click a beat after each breath, not with it.'
    abyssgrown_sabatons: 'Grew a tread pattern nobody designed, matched to a gait nobody recognizes, which fits the wearer anyway.'
    abyssgrown_signet_of_moonlit_mire: 'Its seal-face grew a pattern that changes slightly each time you look away, which no two witnesses have ever described the same.'
    abyssrift_breastplate_of_torn_ground: 'Weightless in the thin gravity, which feels great until you need to actually hit something.'
    abyssrift_legguards_of_split_sky: 'Rated for falls the plummet through thin gravity makes almost survivable. Almost.'
    abyssrift_poultice_of_split_sky: 'Cool where it touches, like the far side of the seam. Do not ask how they know.'
    abyssrift_treads_of_split_sky: "Not the flying kind. The 'the ground left and you're improvising' kind."
    abyssrift_visor_of_torn_ground: "The slit shows you exactly what's in front. The floor was never in front."
    abyssrift_warbelt_of_torn_ground: "Takes the strain so your spine doesn't. Your spine remains unconvinced and vocal about it."
    adamantite_beastcaller: 'Bound in yeti pelt and scored with old calling-glyphs. Rap the ground three times and something turns up, usually cold and in a foul mood.'
    adamantite_chopper: ''
    adamantite_earth_cleaver: 'A longsword powered by a still-molten cinder heart. Heavy enough to split the earth. Or at least whatever is standing on it.'
    adamantite_fang_daggers: 'Paired blades capped with rex fangs and lashed in grave-silk. Quick enough to split the breeze, and whatever was hiding behind it.'
    adamantite_katana: 'A katana with a glacial heart in the hilt. The edge is so fine it cuts through pretension. And also through people. The cold numbs the guilt.'
    adamantite_longbow: 'Shark-fin limbs and frostshell plating. Drawing it takes both arms and a grudge.'
    adamantite_tidestaff: 'Wrapped in frostshamble silk and crowned with a glacial core. Hums with the rhythm of distant tides. Useless for swimming.'
    adamantite_trident: 'Three prongs of frozen crab-shell that never thaw. Effective against fish, fish-adjacent enemies, and common sense.'
    adamantite_war_greaves: 'Hammered out between musters, whenever the forges had iron to spare.'
    adamantite_waraxe: 'Frostshell plates on the blade, glacial heart in the pommel. The weight trains your arms. The cold trains your resolve.'
    adamantite_warhelm: 'Quenched in barrow-water instead of brine. Holds a dent well.'
    adamantsteel: 'Adamant folded into steel by smiths who insist the metal has to agree to it first. The successful batches do seem oddly willing.'
    aetherwing: ''
    alchemical_base: 'The foundation of all alchemical work. Smells like wet library and broken promises. Every craft chain starts here.'
    allweather_cinch: 'Works equally well in swamps, deserts, and tundra. Looks bad absolutely everywhere.'
    aloe_crystal_salve: ''
    aloe_vera: ''
    alpha_cleave: 'Taken from the alpha of the pack. He did not give it willingly, and frankly neither did the pack.'
    alpha_fang: ''
    alpha_fang_circlet: 'Wolves mourn their dead in howls that carry across the whole archipelago. This circlet remembers every one.'
    amber: 'Fossilized tree sap containing bugs that died millions of years ago, finally useful for something.'
    amber_powder: ''
    ambivalent_torc_ap: "An amulet that grants action point by accident, not design. Its bearer cannot decide if they've been blessed or burdened."
    amphibian_oil: 'Refined from koa glands. Waterproofs leather, lubricates gears, and makes everything smell like a swamp forever.'
    amulet_of_the_first_hollow: 'Recovered from the hollow left by the first Voidmoth ever catalogued, back when the catalogers still numbered them instead of naming them. It predates the naming convention. It remembers being numbered.'
    ancient_hermit_robe: ''
    ancient_marrow: ''
    ancient_ram_splitter: ''
    ancient_tusk_cleaver: 'Carved from a rib that grew wrong. Still holds an edge.'
    ancient_tusk_fragment: ''
    anglerbone_cord: "Strung from an Anglerqueen's own spine-bones, still faintly luminous in full dark. Convenient for navigation. Less convenient for staying hidden."
    anglerdeep_key: "Slick with weald damp that never dries, faintly warm the way anglerlight is warm right before it isn't. The Anglerdeep Matron keeps better track of these than she lets on."
    anglerhide_helm: 'Cut from Anglerqueen hide, lure-glands left dark and dormant, mostly. Best not to test how dormant.'
    anglerlight_lure_staff: 'Topped with a captured lure-light, still pulsing the same rhythm that draws prey through the deep weald. Best not to stare at it too long.'
    anglerlight_oil: 'Rendered from Anglerqueen lure-glands, faintly luminous even in the bottle. Best swallowed before it starts attracting things.'
    antiphon_breastplate_of_last_verse: 'Waterproof, fireproof, gravy-proof. Drape it over furniture or over yourself, whichever needs saving.'
    antiphon_grips_of_last_verse: 'Made for laundry day. Wring a shirt, a mop, or the truth out of somebody.'
    antiphon_grips_of_twelve_voices: 'Flour to the forearm, forever. The dough fought back exactly once.'
    antiphon_poultice_of_twelve_voices: 'Twelve herbs, twelve prayers, one paste. Nobody remembers which herb does the work, and it may be none.'
    antiphon_treads_of_twelve_voices: 'Outdoor boots end at the porch. The cathedral is firm about this, and the lava respects tradition.'
    antiphon_visor_of_last_verse: 'Drains soup, lava and ambition with the same even-handed efficiency. Chin strap included.'
    antiphon_visor_of_twelve_voices: 'Slotted so twelve narrow views become one. It is still, somehow, a worse view.'
    apexbound_cuirass_of_summit_vigil: 'Standard plate for the summit watch, weighted so the wearer can stand still for a full turn without swaying. Sitting down is a separate problem it does not solve.'
    apexbound_gauntlets: "Meant for the hands that reach the peak and still have to grip something once they arrive. Most don't. These assume you will."
    apexbound_girdle_of_sealed_wound: "Wrapped twice, the way the Wall Fragments wrap anything they don't fully trust to stay shut. So far the waist has cooperated."
    apexbound_helm_of_sealed_wound: "Cast to withstand whatever the Wound exhales when it's forced shut. The visor seals from the inside, which tells you who it's really protecting the wearer from."
    apexbound_pendant_of_summit_vigil: "Meant to rest against the sternum of whoever holds the highest watch, close enough to the heart to keep count of how fast it's going."
    apexbound_ration: "Field medicine issued to the wall's defenders, sealed in wax and rated to keep longer than most of the defenders do. Grim, but honest labelling."
    apprentice_blade: "The first sword a smith makes that doesn't immediately snap. A milestone. A low one, but still."
    aragog_fang: ''
    aragog_fangs: ''
    arcane_bread: 'Baked in bulk, blessed once, questioned never. Keeps a column moving.'
    arcane_pastry: ''
    arcane_reagent: 'Seven herbs, a splash of water, and no earthly reason for the purple glow. Alchemists file that under research; everyone else files it under warning sign.'
    arcane_solution: ''
    arcane_spore: "Saturated with raw magic to the point of permanent agitation, it hums at a pitch that shatters nearby glass and rearranges scholars' footnotes without asking. The one safety rule handed down for handling it: don't sneeze."
    arcaneshroom: 'A fungus suffused with residual arcane energy that causes it to emit a faint, accusatory glow, as though it holds the harvester personally responsible for disturbing its scholarly contemplation. Handling it with bare skin has been known to produce involuntary levitation, temporary synesthesia, and an inexplicable craving for dusty tomes.'
    arcanite: 'Hums with residual magic that makes compasses spin and wizards insufferably smug.'
    arcanite_hoe: "Imbued with enough arcane energy to make dead soil sprout. Also makes dead farmers sprout, but we don't talk about that."
    arcanite_pickaxe: "Shatters reality-hardened minerals like a tax collector shatters dreams. The vein doesn't stand a chance."
    arcanite_powder: 'Spontaneously rearranges itself into arcane symbols when left unattended. Very distracting.'
    arcanite_sickle: 'Forged from crystallized mana and bad decisions. Cuts through cursed thickets like they owe it money.'
    arcanize_flour: ''
    archaeo_belt: 'Feathered, fossilized, and still trying to convince everyone it could fly.'
    archaeo_longbow: "Fletched in plumes from a bird that crossed the depths long before anyone kept a calendar to write the date down. The arrows still seem to know the old route. They take it whether or not it's where you're aiming."
    archaeo_plume: ''
    archaeo_plume_javelin: 'Fletched with proto-feathers. It flies straighter than anything with feathers has any right to.'
    archimob_legguards: "Skinned from the pack's leader. The rest of the pack still sends thank-you cards, unprompted."
    arisen_tokeko: ''
    ashen_philter: 'Grey, gritty, and technically drinkable. The ash never settles, which tells you where you are.'
    ashen_visor: 'Smells permanently of campfire and questionable choices. Blocks most of both.'
    ashraptor_fang_pendant: 'The fang still remembers the fire it was pulled from. So, occasionally, does your collarbone.'
    backbone: 'Plated along the spine first, on the sound theory that a standing corpse still counts as holding the line.'
    backswing: 'The return stroke does more work than the intended one. The smith calls that a feature. The wielder calls it a surprise.'
    bag_aloe_vera: "A once-respectable container now oozing a viscous botanical secretion from every seam, the inevitable consequence of confining fifty aloe vera specimens in a space designed for considerably fewer gelatinous plants. Alchemists maintain with admirable conviction that its therapeutic properties increase with compression, a claim that the bag's exterior — slick, malodorous, and faintly pulsating — does little to support."
    bag_amber: 'A heavy sack of fossilized tears. The tree cried so you could get rich.'
    bag_arcaneshroom: 'Fifty arcaneshrooms consolidated into a vessel that hums with such concentrated residual magic that it has developed its own feeble gravitational field, causing small objects to drift toward it with the inevitability of moths toward a particularly bookish flame. The bag occasionally levitates when left unattended, which its owner must then explain to increasingly skeptical innkeepers.'
    bag_arcanite: 'The humming gets louder when you carry more than ten. Nobody knows why and nobody wants to find out.'
    bag_arcanize: 'Purple luminescence seeps through the stitching. The grain inside hums at a frequency that gives nearby cats a crisis.'
    bag_barley: 'A sack of barley that rattles with the unmistakable sound of grain harvested under protest from its guardian.'
    bag_blood_wheat: "It throbs, faintly, on a schedule nobody's identified. Unsettling in a grain sack. Considerably worse in luggage you were planning to sleep next to."
    bag_bloodstone: 'Everything inside stains red eventually. Statistically, so will everything outside.'
    bag_burnt_wheat: 'Opening this bag releases a smoky fragrance and the faint impression that someone made a terrible agricultural decision.'
    bag_crimson_truffle: 'Fifty truffles, one container, and a market value the stitching was never rated for.'
    bag_cursed_fungus: "Fifty cursed fungi sealed within a bag that murmurs in a rotating selection of languages, none of which belong to any living civilization, addressing its bearer by names they do not recognize but which nonetheless produce an involuntary chill. Seasoned herbalists carry it at arm's length, not because the manual recommends it but because the bag made the suggestion itself."
    bag_cursed_gem: 'The bag whispers your deepest fears. Mostly about inventory management and weight limits.'
    bag_draconite: 'Hot to the touch and growling faintly. The last courier left a one-star review and no forwarding address.'
    bag_draconize: 'The scales on the outside may be natural, or may mean the grain inside is unionizing.'
    bag_dragonlily: "Fifty dragonlilies, scales overlapping, rustling just loud enough that the porch cat won't sleep tonight."
    bag_duskite: "Old miners' rhyme: what duskite takes, duskite keeps, and the light goes in and never sleeps. Mostly it just means the bag is heavier than it looks and cheaper than it should be."
    bag_green_mushroom: 'Fifty green mushrooms. Legally and botanically distinct from the fun kind.'
    bag_himalayan_wheat: 'Harvested from altitudes where the air is thin and the farming regulations are nonexistent.'
    bag_ivory_shrooms: 'Fifty luminescent mushrooms packed with such reckless density that the bag emits a steady phosphorescent glow visible from an embarrassing distance, functioning as a portable nightlight that no one requested and everyone within a thirty-meter radius is forced to acknowledge. Merchants have attempted to market this as a feature rather than a liability, with predictable results.'
    bag_jade: 'Enough green stones to make a merchant weep tears of joy and then suspicion.'
    bag_malt: 'The faint aroma of fermentation suggests this malt has already begun planning its next career as a beverage.'
    bag_moonstone: 'Glows through the fabric at night, making stealth entirely impossible for thieves.'
    bag_nightcap: 'A bag containing fifty nightcaps that appears to devour ambient light in its immediate vicinity, creating a localized pocket of darkness that follows its bearer with the quiet persistence of a guilty conscience. Prolonged proximity reportedly induces a creeping existential unease that herbalists have learned to mistake for professionalism.'
    bag_obsidianite: "Handle it gently, or don't, and either way plan your excuse for the healer in advance. They've heard every version of 'I was just carrying it.'"
    bag_phantom_spore: 'Fifty spores that are only sometimes there, the way a promise is only sometimes kept. Count them twice. Count them a third time out of spite. The number will not agree with itself.'
    bag_quartz: 'Fifty pieces of cloudy crystal rattling around like a sack of broken promises.'
    bag_red_orchid: 'A leather pouch containing fifty sanguine orchids packed so tightly that the bag has been stained a deep and permanent crimson from within, as though it were the scene of a very small and very botanical crime. Opening it releases a perfume that is equal parts metallic sweetness and quiet menace.'
    bag_suize: "The grains inside catch light like they're auditioning for a better container."
    bag_tanjirize: 'A warm pouch that radiates faint heat, as though the tanjirize inside is still convinced it belongs in the sun.'
    bag_ukranize: 'Ukranize grain never took to good soil — the story goes it prefers wherever the harvest is hardest to reach. Wise crop. Terrible for your knees.'
    bag_wheat: 'Fifty bushels of wheat. The Chaff Sentinel gave its life; the bakery gave a shrug.'
    bag_witherbloom: 'Each bloom saves its finest performance for the moment it dies, with the theatrical commitment of an actor determined to be remembered. Open the bag and every bard within earshot reaches for a quill mid-conversation.'
    baked_compound: 'A hardened lump of baked flour and mushroom spores. Alchemists love it. Everyone else questions the smell.'
    banner_shard: ''
    barbfin_battleaxe: "Fin-barbed like something dragged up from deeper water than the weald technically has. Nobody's asked where the fins actually came from."
    bark_grimoire: 'Pages made of pressed bark. The spells are mostly drawings of angry sheep.'
    barley_bread: "A dense loaf that tastes like a farmer's entire personality. Filling, dependable, and utterly joyless."
    barley_flour: 'A coarse flour that brewers covet and bakers tolerate, ground from barley with just enough wheat for plausible deniability.'
    barley_hardtack: 'Military rations that outlast the soldiers who carry them. Jewelers use the crumbs as polishing abrasive.'
    basalt_carapace_of_black_choir: 'Volcanic plate that drinks the light. In a dim nave you are, effectively, a hole.'
    basalt_core: 'The unmelted centre of a lava bomb. Cold on the outside, still deciding on the inside. Do not rush it.'
    basalt_crest_of_black_choir: 'Heavy enough that you nod along to the dirge whether you meant to or not.'
    basalt_crest_of_molten_antiphon: 'Wearing it does not make you invisible at the party. It does stop the drips of burning wax.'
    basalt_falchion_of_molten_antiphon: 'You swing, they answer, the conversation ends. Rarely a long dialogue.'
    basalt_fists_of_molten_antiphon_choir: 'The choir sings a line, then sings it again, harder. So do these. Learn the tempo or wear the second verse.'
    basalt_fists_of_molten_antiphon_pyre: 'Wire bristles across the knuckles. Grime, rust and hope come off with equal ease.'
    basalt_flail_of_black_choir: 'Swung on a chain, it sounds like a funeral bell. Fitting, given the appointments it keeps.'
    basalt_greaves: 'The single most stubborn thing you will ever strap to a knee. It objects, strenuously, to being moved.'
    basalt_knobstick_of_molten_antiphon: 'Maple, well floured, swung with the authority of someone who has waited up all night for you.'
    basalt_locket_of_black_choir: 'Holds a single low tone, sealed in stone. Crack it in a crisis; regret it in the quiet after.'
    basalt_maul: 'Rated for rugs, tapestries and anything else that holds a grudge along with its dust.'
    basic_pickaxe: 'This is what happens when budget constraints meet subterranean ambition.'
    bear_battleaxe: 'Infused with bear rage and an unreasonable amount of body heat.'
    bear_claw: ''
    bear_claw_ring: 'The bear fought for this. It lost. Mostly on a technicality.'
    bear_club: 'The bear asked for royalties on this design. Legal said no. The bear disagreed, loudly.'
    bearclaw_gauntlets: "Fitted with claws pried from a Moss Bear that didn't need them anymore. The grip strength transfers; the temper does too, apparently."
    bearfury_battleaxe: 'The bear whose claw went into this axe was reportedly quite annoyed about it. Understandable.'
    bearheart_signet: "Set with a claw-fragment matching a Bear Patriarch's own in scale. Wear it long enough and you forget how to throw a punch — you just remember how to survive one."
    beast_hauler_sash: 'Cinched by whoever dragged the salvage carts. Frayed exactly where the rope sat.'
    beastcaller_talisman: 'Threaded from Static Shepherd cord, humming faintly whenever the herd is close. Rex packs mistake the wearer for one of their own, briefly.'
    behemoth_pearl: 'Found in the gullet of an ancient Titan Koa. Worth a fortune, assuming you can retrieve it politely.'
    behemoth_pearl_amulet: 'Set with a fragment too smooth to have broken on its own.'
    bent_sword: "Forged by someone who clearly confused 'tempering' with 'stepping on it'. Still functional. Barely."
    berserk: 'Forged for those who answer every problem with more axe. Rage not included, but implied.'
    binding_paste: 'Adhesive compound that bonds organic and mineral materials. Armorsmiths and tailors buy this faster than alchemists can brew it.'
    binding_ring: "Binds spectral energy to mortal flesh. The fine print mentions 'mild existential drift' and nothing further."
    binding_thread: ''
    bisonbrute_bow: 'Strung with bisonbrute sinew. Every arrow carries the emotional weight of a stampede.'
    blizzard_tassets: 'Thorium leg plates crusted with frost crystals. Every step sounds like breaking glass.'
    blockhead: "Named by the smith's apprentice, who meant it as an insult, and got promoted anyway."
    blood_wheat: ''
    blood_wheat_flour: ''
    bloodstone: 'Dark red mineral that definitely got its color from iron oxide and not ancient curses, probably.'
    bloodstone_powder: ''
    bloodveil_orchid: ''
    bloodwheat_bread: 'The crimson crumb pulses faintly when cut. Bakers insist it is a thermal reaction. Bakers are liars.'
    blue_antenna: "Still pulses with the insect's last thought: 'Why did the giant squash my mate?'"
    blunt_cudgel: 'A stick with pretensions of being a weapon. Your enemies will die of laughter, eventually.'
    boar_gorer: 'Designed for boar hunting but works on anything that charges at you with poor decision-making skills.'
    boar_hide: 'Thick, bristly, and smells like mud. The boar was unreasonably angry about losing it. Standard procedure.'
    bogforged_core: 'A core hardened over cold bog-fire, which leaves it dense and quietly wrong to the touch, a feel that never quite goes away.'
    bogforged_elixir_of_fen_below: 'Distilled over bog-fire that burns cold, giving it a chill that lingers on the tongue long after the healing is done.'
    bogforged_greataxe_of_fen_below: 'Forged for whoever descends to the Fen Below and expects to swing something on the way back up, which not many do.'
    bogforged_greataxe_of_rising_tide: 'Hammered on a bog anvil that swallows sparks whole, which the smith found unsettling and the axe apparently found agreeable.'
    bogforged_sash: 'Woven from bog-reed that never fully dries. It clears the head wonderfully, mostly by emptying it — the wearer feels marvelous and can no longer explain why.'
    bogforged_vambraces_of_rising_tide_matron: 'Timed to the tide the weald pretends it lacks, hardened at high water when the metal, briefly, agrees to cooperate.'
    bogforged_vambraces_of_rising_tide_mire: 'Quenched in bog-water so foul the metal came out harder and the smith came out coughing for a week.'
    bogsteel: 'Bog-iron cooked down and folded until it holds an edge, which it does grudgingly and only for those who earned it the hard way.'
    bone_charm_necklace: 'Small bones threaded on a cord. Looks either tribal-chic or serial-killer-chic depending on your outfit.'
    bone_flail: 'Assembled from whatever the bonelet left behind. Rattles with every swing.'
    bone_greatbow: ''
    bone_marrow_club: "Hollowed from a Marrow Shambler's own femur and packed with lead for good measure. Somewhere below, Nerak is said to notice things like this eventually. Best to have a good excuse ready."
    bone_wand: ''
    boneguard_edge: "Taken from a boneguard who, in fairness, wasn't putting up much of a fight for it at the time — mostly on account of being thoroughly, professionally dead."
    boneherald_greatsword: 'Sworn on bones that predate every crown ever melted down for a better one. The oath, everyone agrees, is unbreakable. The sword itself, the herald will remind you, is still very much for sale.'
    bonelord_flail: 'The bones are genuine. Bound with sinew from the thing that walked these marches. It swings heavier than physics allows; the smiths stopped asking.'
    bonelord_greatsword: ''
    bonelord_legguards: 'Carved from femurs too large for anything that still breathes. The fit is exact.'
    brackish_breastplate_of_brackish_deep: "Pressure-rated for depths the weald officially doesn't have, which is the sort of thing a smith stamps on a plate and then doesn't like to talk about."
    brackish_composite: "Layered stock cured in salt water, which leaves it stronger and stranger, prone to a smell that intensifies right when you'd rather it didn't."
    brackish_edge_of_brackish_deep: "The salt-water quench left it just corroded enough to hurt in ways a clean cut doesn't, which the weald counts as a feature."
    brackish_grips_of_brackish_deep: 'The salt got into the joints and stayed, so they seize now and then at the worst possible moment, reliably.'
    brackish_legguards_of_brackish_deep: "Wading-rated for water that would rot anything else off the leg, which it eventually will to these too; the smith just won't say when."
    brackish_legguards_of_silt_throne: 'Recovered from a courtier who sat too long in the drowned hall, and are, technically, still sitting.'
    brackish_poultice_of_silt_throne: "Packed with salt-mud that draws a wound clean and stings enough that the patient knows, precisely, when it's working."
    brackish_recurve_of_brackish_deep: 'Strung with sinew that swelled in the salt and never shrank back, so it draws heavier than it looks and rewards the arms that expected it.'
    brackish_twin_knives_of_silt_throne: 'Court daggers dredged from the drowned hall, still crossed the way they were laid on a body the silt has long since claimed.'
    brackish_waraxe_of_brackish_deep: 'The corrosion crept into the haft and stopped, held off by nothing anyone can identify, which the wielder tries not to rely on too heavily.'
    brackish_warbelt_of_silt_throne: 'Its court buckle corroded into an abstract shape that means nothing now, which is more honest than what it meant before.'
    breach_ash: 'The soot that never lands. It drifts sideways here, out of spite for gravity.'
    breachforged_brew_of_nine_faults: 'Steeped from Gate Watcher marrow-salt, drunk by sentries who count breaches instead of sheep. It mends the small wounds first — the big ones, it reckons, can wait their turn.'
    breachforged_carapace_of_fifth_breach: 'Peeled whole from a Voidmoth that outgrew the fifth breach and had nowhere left to molt. Fits like a second exoskeleton, because functionally, now it is one.'
    breachforged_carapace_of_nine_faults: "Every seam is a place it could give. So far it hasn't. 'So far' is doing heavy lifting."
    breachforged_cincture_of_fifth_breach: 'Cinched by a Gate Watcher who measured every threshold by hand-span before deciding whether to let it stay open. The buckle still clicks in five distinct positions. Nobody remembers what they mean.'
    breachforged_circle_of_nine_faults: "Worn on the counting hand of a Gate Watcher whose job was tallying breaches before they became a problem. It still counts. The extra beat of readiness it grants is the ring finishing the Watcher's job for you."
    breachforged_claymore_of_nine_faults: 'Swung by the Gate Watcher who quit counting faults and took to closing them personally. Too heavy for precise aim. Precision was never the plan.'
    breachforged_crest_of_nine_faults: 'Nine ridges, one per crack the smelter counted before giving up counting.'
    breachforged_fists_of_fifth_breach: 'Cast from the knuckles of a Gate Watcher who punched first and checked credentials later. Every impact leaves a faint arch-shaped bruise, like a tiny doorway.'
    breachforged_greatbow_of_fifth_breach: 'Strung by one Gate Watcher who measured range in thresholds crossed, never in paces. The arrow stays a full threshold ahead of whatever regret loosed it.'
    breachforged_philter_of_fifth_breach: 'Bottled by whichever Gate Watcher drew the fifth shift, back when shifts still ended. Tastes like standing still for a very long time.'
    breachforged_splitter_of_fifth_breach: "Four earlier ones didn't take. This one was forged in a worse mood."
    bread_leavening_agent: 'Makes bread rise with alchemical efficiency. Bakers consider this a miracle. Alchemists consider bakers easily impressed.'
    bristleguard_cuirass: 'Tusker hide cured in its own bile, because tuskers are exactly the kind of creature that would insist on that.'
    bristlemail_gauntlets: 'Chain links threaded through boar bristles that refuse, on principle, to lie flat.'
    bristlemail_pants: 'Sitting down in tusker leather is, technically, an act of faith. The bristles disagree with the faith.'
    bristlemail_patch: ''
    bronze_greaves: 'Hammered from bronze dense enough to turn a blade and heavy enough to make every staircase a mortal enemy. The smith, they say, had forearms like felled trees. Wearers are expected to grow their own.'
    bronze_helm_of_the_shore: 'A bronze dome adorned with barnacles that no amount of scrubbing will remove. The original owner was a coastal guard who reportedly loved the sea until the very day the sea loved him back. Permanently.'
    bronze_wolf_cuirass: "Bronze plates over timberwolf hide. The wolf's final howl is supposedly preserved in the metal — though most wearers report hearing nothing but their own heavy breathing after the third flight of stairs."
    browbeaten: 'Dented in the same spot by the same falling debris often enough that the dent has its own name among the pilgrims.'
    bulwark_band: 'Your finger is now, legally speaking, a fortification.'
    bulwark_of_the_risen: 'Recovered from a barrow that reopened at dusk. The dead had no more use for it.'
    bulwark_stubborn: "Refuses to quit out of pure, magnificent spite. It's working so far."
    burnt_wheat_flour: ''
    caller_embrace: 'Fingertips glow whenever a familiar creeps close. Handy. Occasionally a little too intimate.'
    canticle_cuisses: 'The ridges whistle a fifth of a tone when you walk. The choir has learned to transpose around you.'
    canticle_greataxe: 'Kept for the stubborn logs the rest of the pile hides. It also ends most other disagreements on the property.'
    cantor_basalt: 'Kitchen floor stock, worn smooth by four centuries of pacing cooks.'
    canvas_boots: "Waterproof for the first three seconds. After that they're sponges with laces. Comfort rating: damp."
    cape_fuwa_black: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_fuwa_white: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_kamui: 'A cloak cut from something that should not have had a hide. It remembers being worn by worse.'
    cape_lorito_agility: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_chance: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_intelligence: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_strength: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_vitality: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_wisdom: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    capstone_lattice: 'A crystalline frame that only sets under the pressure found at the peak, which makes it exactly as hard to obtain as it sounds.'
    capstone_treads_of_last_ascent: 'The tread that only matters once, on the final step, which is exactly the moment most wearers stop having feet to appreciate it with.'
    capstone_visor_of_last_ascent: 'The crown they hand the pilgrim who reaches the top, in the brief window before they understand what reaching the top actually costs.'
    capstone_warbelt_of_first_dawn: 'Weighted to anchor a body against the updraft that hauls at anything near the peak. It anchors well. What it anchors you to is your business.'
    capuche_bara: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_air: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_earth: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_fire: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_water: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_wisdom: ''
    capuche_mo: 'A tattered hood strung with tiny skulls. Mo never explains where they came from, and nobody asks twice.'
    casque_hayate: 'Swift-wind steel. Light enough to run in, loud enough to be heard coming.'
    cataclysm_brew_of_nine_faults: "Ash Prophets brew this the night before a cataclysm they've already seen and can't unsee. It doesn't prevent anything. It just steadies the hand that has to watch."
    cataclysm_core_rift: "The dense knot left where a quake spent itself. Warm, patient, still deciding whether it's done."
    cataclysm_core_void: 'Weighs nothing and drops anyway. Physicists were consulted; the physicists left.'
    cataclysm_extract: 'The last thing you distil from a spent quake. Bitter, potent, and disinclined to keep still.'
    cataclysm_tassets_of_fifth_breach: "Plated at the hip by whichever Gate Watcher pulled fifth shift on the day the count stopped meaning anything. The metal remembers standing at attention. The wearer's legs, less so."
    cataclysm_tassets_of_nine_faults: 'Named for how many cracks the Gate Watcher wearing them stepped over on a single patrol. The tenth crack is the one nobody counted.'
    cataclysm_warboots_of_fifth_breach: 'For crossing a widening gap at speed. The theory is sound. The gap disagrees.'
    cataclysm_warboots_of_nine_faults: "Built to stand where nothing else will. The 'nothing else' includes the ground."
    celestial_wafer: 'It was catalogued twice, under two different theories, a discrepancy nobody has been assigned to resolve.'
    chantmarked_crusher_of_twelve_voices: 'Institutional grade. What it did to the potatoes, it will do to morale.'
    chantmarked_edge_of_last_verse: 'The part of the song after everyone assumed it was over. Comes as a surprise. Always the last one.'
    chantmarked_grips_of_twelve_voices: 'Calibrated on a pickle jar sealed before the founding of the choir. It opened. Eventually.'
    chantmarked_legguards_of_last_verse: 'Reserved for services, funerals, and days when both happen at once. Here, that is most days.'
    chantmarked_legguards_of_twelve_voices: 'Ironed to a crease that could open letters. Sitting down would be vandalism.'
    chantmarked_rod_of_twelve_voices: 'The business end dried out years ago. The stick has conducted the choir ever since, badly.'
    chantmarked_tonic_of_last_verse: "For when the fight was over and then, rudely, wasn't. Buys you one more chorus."
    chantmarked_twin_knives_of_last_verse: 'Grandmother knitting needles. The scarf was never finished; the burglar never recovered.'
    chantmarked_visor_of_last_verse: 'The knob on top is a design flaw and a carrying convenience in one.'
    chantmarked_warbelt_of_last_verse_choir: 'The line the song keeps coming back to. Buckle it on and you keep coming back too. Annoyingly.'
    chantmarked_warbelt_of_last_verse_pyre: 'Loops for the hammer, the snips, the wax, the holy water. An empty loop means trouble found you first.'
    charged_vault_key: "Forged in voltglass, permanently live with static charge from the plateau's storm cells. The Storm Warden's vault has been struck by lightning more times than anyone's counted, and this key is why it still opens."
    charite_brick: ''
    chief_mark_brand: ''
    chipped_axe: 'The blade has more chips than a bag of crisps. Each swing sends fragments flying. Natural AoE.'
    chitin_cutlass: 'Half chitin, half rusty metal. Surprisingly effective at making things regret getting close.'
    chitin_gauntlets: 'Lamellated insect husk fashioned into gauntlets, lightweight yet durable enough to turn aside glancing blows. The previous wearer reportedly found them quite comfortable right up until the poison sac burst.'
    chitin_longsword: 'This blade was carved from the carapace of some nameless deep-dwelling beast, its edge jagged yet unnervingly sharp.'
    chitin_shellplate: 'They say wearing it protects against backstabbers, mostly because the stench ensures no one ever gets close enough to try.'
    chitin_walkers: 'These boots wriggle with each step, for the chitin plates are merely a shell for the creatures living within.'
    choir_conductor_staff: "Point it and the whole pyre keeps your tempo. Drop it and the fire improvises. Don't drop it."
    choir_hymnbread: 'Baked during a homily that refused to end. The crust set somewhere around the fourth hour.'
    choir_obsidian: 'Polished volcanic slab. Cool to the touch, immune to knife scars and hot pans alike.'
    choir_procession_boots: 'Built for a slow dignified walk to the altar. Break into a run and the dignity leaves first.'
    choirblade_altus: 'One full yard of seasoned oak. Every child in the parish knows exactly how much trouble it measures.'
    choirforged_cuirass: 'Full plate protection in the shape of a baking apron. The frill is structural.'
    choirforged_draught: 'The last pour of the pot. Bitter, gritty, and somehow the strongest cup of the day.'
    choirforged_gauntlets_of_cooling_vent: 'Slotted to breathe off the heat, which they do, directly onto your wrists. A trade, not a gift.'
    choirforged_greatblade_of_cooling_vent: 'Brought out when the roast is whole and the family is seated. The roast is rarely the only thing carved.'
    choirforged_greaves_of_ashen_song: 'Bicycle clips in a cathedral with no bicycles. Preparedness is its own reward.'
    choirforged_helm: 'Cast iron, family size. The dent on the left is from the last owner having an opinion.'
    choirforged_ration_of_ashen_song: 'Somebody mother packed this. The sandwiches are cut into triangles; the apocalypse can wait.'
    choirforged_sabatons_of_ashen_song: 'Rated for floodwater, mud, and shallow magma. One size too big, as is proper.'
    choirforged_signet: 'Iron, dented, one size fits none. It has turned aside needles, splinters, and one assassination.'
    choirmaster_locket: 'Every key in the cathedral on one iron loop. Whoever wears it answers for every locked door and every noise behind them.'
    chokepoint: "Sits exactly where a throat narrows to nothing. The jeweler who designed it insists that's a coincidence."
    cinchward: 'Tightens by itself when the wearer forgets to breathe carefully near the wound. It holds firm opinions about posture.'
    cinder_band: 'One shard of a heart that used to be whole. It remembers. It wants the rest back.'
    cinder_bow: ''
    cinder_cleave: ''
    cinder_crown: 'The glow makes you look important. The set, once complete, makes you look inevitable.'
    cinder_cuirass: 'Lined with cinder heart fragments. Keeps you warm in the tundra and slightly on fire everywhere else.'
    cinder_fangs: ''
    cinder_fists: "One finger-snap away from being the other five pieces' problem too."
    cinder_greaves: 'Every seat you sit in remembers you were here. So does the ember.'
    cinder_heart: "Pulled still-molten from a firesteel golem's chest, hot enough to serve as a whole forge on its own. Anvils set too close simply melt. The forge-cult has stopped calling this an accident."
    cinder_heart_amulet: 'The piece all the others are still, quietly, trying to get back to.'
    cinder_heart_scepter: 'Point it at the complete set and something in your chest gets ideas.'
    cinder_heart_staff: 'Carries an ember that never fully cools. The march remembers its warmth.'
    cinder_locket: 'Holds one ember that refuses, on principle, to go out.'
    cinder_loop: 'Set with shards of a cinder heart. Pleasantly warm, and now and then far too warm once a few drinks are in.'
    cinder_maul: ''
    cinder_sash: 'Woven from cinder-heart thread. Keeps a watch bearable through the coldest hour.'
    cinder_striders: 'Warms you in winter. Tracks you at night. The set is always, somehow, watching.'
    cinder_waistguard: 'Never once cold in the hand. The whole set runs a fever, politely, together.'
    cinderchant_robe: 'Quilted, floor-length, faintly singed. Dying in it is acceptable; answering the door in it is not.'
    cinderchoir_alloy: 'Rings a chord when struck, which is charming right up until you need to work it quietly.'
    cinderchoir_brew_of_molten_antiphon: 'Brewed near the vents, so it never quite cools. Mostly it warms you. Occasionally it warns you.'
    cinderchoir_cincture_of_black_choir_pyre: 'Warm to the hand and quietly shedding grey. You will find ash in your rations for weeks.'
    cinderchoir_cincture_of_black_choir_vitrified: 'A tailor ribbon marked in thumbs and handspans. It has measured three emperors and lied to all of them.'
    cinderchoir_crest_of_black_choir: 'Worn upside down since the flood of ash. Smells of lye and quiet determination.'
    cinderchoir_locket_of_black_choir: "Holds a pinch of a burned hymnal. On still nights the ash arranges itself into legible verses. Don't read them."
    cinderchoir_tassets_of_black_choir_pyre: 'Smoulders gently at the hem. Fashionable, warm, and a genuine liability near dry grass.'
    cinderchoir_tassets_of_black_choir_vitrified: 'Reinforced where praying wears fastest. The patches are new; the knees beneath are a lost cause.'
    cinderchoir_warboots_of_molten_antiphon: "Soles poured from cooling runoff. They hold the day's heat well into the freezing night. A gift, mostly."
    cindercloth_gloves: 'Turns every handshake into a minor safety briefing.'
    cindercloth_hood: 'Keeps the head warm. Keeps the eyebrows nowhere in particular.'
    cindercloth_legs: 'Electrical discharge is technically included. It was never, in any version, meant to be a feature.'
    cindercloth_robe: 'Monks wove this under a vow of second-degree burns. Most kept the vow. Fewer kept eyebrows.'
    cindercloth_sandals: 'Leaves glowing footprints. Stealth was never really the plan here.'
    claude_axe: 'Once wielded by the tireless Claude, whose stamina in battle became the stuff of legends — and whose stamina in bed became the stuff of nightmares.'
    cleancut: "Leaves an edge so precise the wound closes wrong around it. Surgeons study the scars. They don't publish their findings."
    clearsight: 'Improves visibility at the Scar, which is less a mercy than it sounds. Some things are better half-seen.'
    cobalt_battlecleaver: 'Two-handed, double-edged, still warm from the ashskin lizard. Terrible for opening letters, excellent for opening enemies.'
    cobalt_club: 'Kweebec wood so dense it forgot it used to photosynthesize for a living.'
    cobalt_crushers: 'Reinforced knuckles for when words fail. Words always fail.'
    cobalt_daggers: 'Coated twice in gland extract and once, unofficially, in bad decisions.'
    cobalt_longblade: 'A reliable blade warmed by ashskin scales. Does exactly what you expect. In a world of surprises, that is worth something.'
    cobalt_mace: 'Hardened with hive wax and dusk-forged steel. It enforces one law: the hive comes first.'
    cobalt_pike: 'Tipped with sunwarmed scale and shafted in kweebec bark. Long enough to poke from a comfortable distance. Strategy or cowardice, your call.'
    cobalt_shortbow: 'Limbed with kweebec bark and strung with storm-charged feathers that hum before every shot.'
    cobalt_staff: 'Kweebec bark topped with a charm carved specifically for patience, which it needs — it channels water magic with all the calm serenity of a tap that never quite shuts off.'
    cobalt_sword: 'Sheathed in ashskin lizard hide. Warm in the grip and giving absolutely nothing away.'
    cobalt_waraxe: 'Cut from sun-warmed scale and sealed in amber wax, it hums a note the woolice have learned to fear before they see the blade. A useful reputation. Rarely an earned one, the shepherds mutter.'
    cobalt_wargreaves: 'Heavy enough that squatting becomes a workout. Light enough to run when the workout goes wrong.'
    cobalt_warhelm: "Standard issue for soldiers who haven't done anything to earn a cooler hat yet."
    cobalt_warplate: 'Protects the vital organs. The non-vital ones are on their own.'
    cocoon_king_amulet: "A golden silk chain still warm from the cocoon it was cut from. The King never asks for it back out loud. He doesn't have to; the wearer's thoughts get quieter every day."
    cocoon_king_cowl: "Woven from the same golden silk, worn low over the eyes. Everything past arm's reach blurs to a comfortable gold haze — a mercy, or perhaps the whole point."
    codex_of_the_damned: 'Bound in barrow-leather. Every spell inside failed its caster at least once.'
    codex_of_the_deep: ''
    coiffe_fuwa_black: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_fuwa_white: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_pepe: 'A humble green cap. The starter flex. Every royal was once just a pepe in a hat.'
    coiffe_pepe_royal: 'The pepe ascended. A gilded crown for those who bought the top and never sold.'
    collapse_alloy: 'Blended from things that fell together. It only feels stable because the parts already gave up.'
    collapse_bludgeon_of_last_tremor: 'Swung once by a Riftling settling an argument about territory, and the territory stopped arguing. Ends sentences, fights, and occasionally furniture, roughly in that order.'
    collapse_greaves: 'Heavy on purpose. In a world where you can float away, that is a comfort, not a complaint.'
    collapse_helm_of_widening_crack: 'Protects the head from everything except the thing directly above it, which is the actual threat here.'
    collapse_pendant_of_widening_crack: 'Inside sits dust off the very first thing that fell here. There is, rest assured, no shortage of dust in this place.'
    colophon: "The publisher's mark at the back outlived the publisher, the print house, and most of the language the book was written in."
    concussion: 'Named clinically by whoever it last hit, in the brief window before they forgot how language works.'
    convergence_pendant: 'Two gems, one setting, one ongoing argument about whose sunrise counts.'
    copper_band: "Turns your finger green after an hour. The jeweler insists it's 'patina' not 'copper poisoning'. Reassuring."
    copper_cleaving_axe: ''
    copper_hoe: "Copper's cheapest farm tool, and every copper tool in the fen ends up wearing the exact same shade of green, whether it wants to or not."
    copper_pickaxe: 'Soft enough to dent on a bad swing. Miners compensate with more swings. The mountain, as always, remains unimpressed.'
    copper_sickle: 'Copper oxidizes into a green patina within a week. Herbalists find this aesthetically appropriate. The copper does not have opinions.'
    corbac_head: 'A crow-skull crown for the carrion-minded. The beak points at whatever you are about to loot.'
    cordwood: "Measured in the old unit nobody uses for lumber anymore, because there isn't enough lumber left to need it."
    core_forge_key: 'Legend has the Ember King minting one true key from his own banked heart-fire, too hot for mortal hands to hold bare. This is not that key. It is, several smiths swear, close enough.'
    coronet_band_of_silent_court: 'Nobody remembers agreeing to how this turned out, a claim tested exactly zero times.'
    coronet_edge_of_silent_court: 'Its behavior contradicts its own description, a footnote the maker kept postponing until it stopped mattering.'
    coronet_lattice: 'Its classification has been disputed since it was found, which the survey team still argues about.'
    coronet_legguards_of_silent_court: 'It was built to prove a point nobody remembers, a fact the maker considers a feature.'
    coronet_poultice_of_empty_seats: 'Whoever bottled it never settled on a final version, and nobody has asked for a refund, yet.'
    coronet_resin: 'Nobody can say for certain where this came from, and the case file was quietly closed, unresolved.'
    coronet_rod_of_silent_court: 'The design committee never actually agreed on this, which is either reassuring or deeply concerning.'
    coronet_tonic_of_silent_court: 'Opinions on its aftertaste vary considerably, a fact quietly omitted from the label.'
    coronet_torc_of_empty_seats: "It works exactly as described, allegedly, and somehow that's still considered a success."
    coronet_treads_of_silent_court: 'The design survived three separate objections, so nobody bothered filing a complaint.'
    coronet_visor_of_empty_seats: 'It functions on a technicality, and the committee never reconvened to revisit it.'
    coronet_warblade_of_silent_court: 'It was approved on a split decision, and the argument outlived everyone who started it.'
    corvid_eye: 'Beady, black, and still seems to be watching. Apothecaries grind these for night-vision salves. Ethically murky.'
    corvid_feather_lance: 'Fletched with corvid feathers for aerodynamics. The corvids are still upset about it.'
    crab_claw_grips: "Fashioned from pincers that spent a lifetime clamping onto things and refusing to let go. The gauntlets inherited this trait. Removing them requires warm water, patience, and a friend who won't judge you."
    crab_claw_hatchet: 'The claw still opens and closes on its own. Mostly at inconvenient moments.'
    crab_claw_joint: ''
    crab_pincer_shivs: 'Sharpened crab claw joints. They pinch before they cut, which is honestly just rude.'
    crab_shell: 'A sturdy husk harvested from a crustacean that clearly lost an argument with someone very hungry.'
    crab_shell_cuirass: "The armourer took one look at the crab, said 'that's basically a breastplate already,' and charged full price for what was essentially reshaping and a coat of oil."
    cracked_bone: "A femur that's seen better centuries, surprisingly solid despite the cracks. Dogs still want it. So do necromancers."
    cracked_mace: 'The head rattles ominously with each swing. Structural integrity is a suggestion, not a guarantee.'
    crazy_belt: "A goblin's belt, dyed deep red with pigments that definitely aren't berry juice."
    crazy_helmet: 'Assembled by a goblin who heard a rumor about helmets once, secondhand, from someone unreliable.'
    crazy_tunic: 'A crimson robe previously worn by a goblin whose sanity had long since departed.'
    crimson_brick: 'A blood-red brick that radiates warmth hours after leaving the furnace. Staff carvers core it into wand housings.'
    crimson_truffle: 'A subterranean delicacy so rare its price is set by auction, not by any sane market logic.'
    crimson_truffle_heart: ''
    crooked_staff: "A walking stick with delusions of magical grandeur. The only spell it casts is 'mild embarrassment'."
    crow_feather: ''
    crown_dust: 'It was catalogued twice, under two different theories, by a committee that has since disbanded.'
    crown_of_quills: 'A crown that has forgotten what it crowns. It sits uneasily, unconvinced of its own authority or purpose.'
    crown_of_the_void_sovereign: "The void has no sovereign, officially. This crown was a self-appointment nobody present had the density to argue with. Cataloguers list its holder as 'disputed.'"
    crownfire_rod: 'It works, provisionally, pending further review, so nobody bothered filing a complaint.'
    crownless_blade: 'Its purpose was reconsidered after it was finished, a small mercy, considering the alternative.'
    crownless_cuisses: 'It functions under advisement, no refunds, no further questions entertained.'
    crownless_signet: "It does what it's told, eventually, a compromise reached after everyone gave up arguing."
    crownrot_cuirass_crown: 'How reliable it is remains hotly debated, and the maker moved on before finishing the thought.'
    crownrot_cuirass_godbone: "It does what it's told, eventually, a resolution that resolved very little."
    crownrot_greaves_of_gilded_ruin: 'It does exactly one thing, and disputes even that; nobody involved will say if that was the plan all along.'
    crownrot_helm_crown: 'It works exactly as described, allegedly, and the maker moved on before finishing the thought.'
    crownrot_helm_godbone: 'The instructions were lost in a heated debate, and the wearer decided long ago to take it on faith.'
    crownrot_ration_of_rotting_halo: 'It tastes like a decision made too quickly, so results may vary, considerably.'
    crownrot_signet: 'It functions, technically, in most conditions, and the wearer has learned to live with the ambiguity.'
    crude_branch: "One man's kindling is another man's legendary crafting component, apparently."
    crude_hatchet: 'More of a sharpened rock on a stick. The caveman aesthetic is free of charge.'
    crude_ring: 'Bent wire with aspirations of being jewelry. If you squint and tilt your head it almost looks intentional.'
    crystal_bread: 'The crust sparkles. The crumb shimmers. Your dentist will have opinions, artisanal ones.'
    crystal_focus_staff: "Mounted with a fractured shard that bends every spell toward wherever it likes best, which is rarely wherever you were pointing. The old mages call this 'character.' Everyone downrange calls it something shorter."
    crystal_ice_staff: "The crystal crowning it hasn't melted once, not through forge-heat, not through summer, not through spite. Handy for keeping a drink cold. Considerably more convincing on an enemy."
    crystal_tide_staff: 'A staff topped with a red crystal that pulses with tidal energy. It occasionally drips, which ruins the dramatic effect.'
    crystal_ward_tome: 'Encrusted with shattered crystal. Every spell cast through it sounds like a chandelier falling very slowly.'
    crystallized_loaf: ''
    crystallized_tanjirize: ''
    cuirass_of_the_hollow_king: "Not armor a king commissioned — armor a Voidmoth grew, that a king later claimed credit for wearing. The distinction mattered to exactly one person, and he's not in a position to argue anymore."
    cured_gauntlets: "Properly cured leather. Finally something that doesn't smell like a wet dog. It smells like a dry dog instead."
    cursed_amalgam: 'The culmination of an herbalist career condensed into one jar. It whispers at night. Nobody asks what it says.'
    cursed_boot_contradiction: 'A cursed boot that trades freedom of movement for stubbornness. The wearer moves clumsily but thinks themselves invincible through sheer contradiction.'
    cursed_fungus: 'The undisputed apex of herbalist ambition, a fungus of such concentrated malevolence that it whispers the names of those who approach in a voice like dry leaves scraping across a coffin lid. Veteran gatherers report that it does not so much get harvested as it permits itself to be taken, which is a distinction that brings no comfort whatsoever.'
    cursed_gem: 'Whispers dark promises to anyone who holds it too long, though the promises are mostly about back pain.'
    cursed_gem_powder: 'The whispering got worse after grinding. Now it critiques your crafting technique in real time.'
    cursed_helm_paradox: 'A cursed helm that dulls the mind while fortifying the body. It grants life through the loss of clarity, a bargain written in paradox.'
    cursed_loaf: 'Whispers recipes to anyone holding it. The bread has opinions about your crafting technique, and they are not kind.'
    cursed_root: 'Pulled from cursed fungus with real effort, since it has a habit of gripping back harder than anything lacking a spine has any business managing. It stays warm in storage and twitches on occasion. Veteran herbalists call this normal in a tone that convinces absolutely nobody.'
    cursed_straw: ''
    cursed_straw_amulet: 'A vow sworn by something that technically lacks a mouth. It has kept the vow anyway, out of spite.'
    cursed_wheat: 'A stalk of grain blackened by fell magic, its kernels whispering with discontent.'
    deadweight: 'Heavier than it needs to be for the job, and the job has never once complained about the surplus.'
    deathgrip: 'Locks the fingers at the moment of impact and stays locked a beat longer than the wearer would prefer.'
    deathless_blade: 'Drawn from the barrows. Sharpened against the veil between dead and living. A tool that remembers its work.'
    deep_scale: 'Black as the abyss it came from. The leviathan wore thousands. You have one. Be humble about it.'
    deepbreath: 'Fits snug enough that drawing a full breath takes conscious effort. Most wearers stop noticing by the second week.'
    deepmoss_leggings: 'Padded with moss that stays faintly damp no matter how long you wear it, drawn from wherever the Moss Bears den. It resents staying dry, and that resentment loses.'
    deepreach: "Extends the caster's reach into places the caster would rather not personally visit."
    deepscale_fists: 'Knuckles reinforced against whatever nests in the old graves.'
    deepwater_breastplate: 'Cured in bog-water until the rust gave up. Smells like the marsh because it is the marsh.'
    deepwater_stilts: 'Raises the wearer clear of the worst of the silt. The worst of it still finds a way up.'
    deepweald_longbow: "Strung taut enough to loose an arrow silently through the weald's thick dark, where sound carries further than sight ever does. The pack hunts by ear down here; so should you."
    deepwoven_carapace_of_deep_canopy: "Layered like the canopy it's named for, each ply grown from the one below, which makes repairing it a matter of gardening more than smithing."
    deepwoven_cincture_of_drowned_weald_matron: "Wound from the Matron's own thread, which holds a knot no human hand tied and will not be talked out of it."
    deepwoven_cincture_of_drowned_weald_mire: "A woven belt that cinches tighter by itself in cold water, a helpful reflex until you remember it doesn't ask first."
    deepwoven_composite: 'Woven under pressure at the deepest bench in the weald, where the layers bond so tightly the seam becomes a rumor rather than a feature.'
    deepwoven_crest_of_deep_canopy: "Threaded through with living canopy-vine that keeps growing on the wearer's head, slowly, in a direction the wearer does not choose."
    deepwoven_crest_of_drowned_weald: 'Woven so tight underwater that it never fully dried, and now weighs a hair more than it should, forever, out of spite.'
    deepwoven_philter_of_drowned_weald_matron: 'Steeped in Matron-silk that never fully dissolves, so a thread of it always stays behind, mending things it was never asked to mend.'
    deepwoven_philter_of_drowned_weald_mire: 'The plain version the guides carry, half the strength and twice the reliability, which down here is the trade that keeps you breathing.'
    deepwoven_splitter_of_deep_canopy: 'Balanced for felling the canopy-vine that ropes the tiers shut, a mundane task it performs with wildly disproportionate enthusiasm.'
    deepwoven_tassets_of_deep_canopy: 'Grown in overlapping fronds like the canopy above, so a low blow just parts the leaves and finds more leaves.'
    demon_codex: ''
    dented_mace: "More dents than a parking lot bumper. Each one represents a lesson in 'aim lower than the kneecap'."
    diadem_casque_of_broken_diadem_crown: 'The wearer insists it works; the evidence is inconclusive, a decision made under considerable time pressure.'
    diadem_casque_of_broken_diadem_godbone: 'The craftsmanship is sound; the premise is not, which is exactly as reassuring as it sounds.'
    diadem_charm_of_falling_crown: 'Its effectiveness has never been independently verified, which nobody has the energy to dispute anymore.'
    diadem_chausses: 'It was finished purely out of stubbornness, which nobody has the energy to dispute anymore.'
    diadem_cordial_of_falling_crown: 'The label lists an ingredient nobody can identify, a fact quietly omitted from the label.'
    diadem_elixir_of_broken_diadem: "Its effect kicks in, or it doesn't, unpredictably, so it's sold with a shrug instead of a guarantee."
    diadem_lattice_crown: 'Its exact properties depend on who is asked, a discrepancy nobody has been assigned to resolve.'
    diadem_lattice_godbone: 'Whether it counts as one material or several remains unsettled, and the second explanation was never fully ruled out.'
    diadem_vambraces_crown: 'It does the job it was eventually assigned, which is either the whole design or a rounding error.'
    diadem_vambraces_godbone: 'It performs its stated function with visible reluctance, so the debate was tabled indefinitely.'
    diamond: "A shard of compressed carbon that forgot to finish becoming magnificent, dug from the earth's miserly grip."
    diamond_bag: 'The contents of this pouch could buy a small kingdom, though they make for rather disappointing throwing weapons.'
    diamond_bread_1: 'A loaf of bread dusted with crushed diamonds, each bite a satisfying crunch that punishes the jaw.'
    diamond_powder: 'Proof that the only thing unbreakable in this world is the price tag attached to it.'
    diving_crude_grips: 'Down in the flooded shaft they hold anything with a grip no living hand should manage. Up here, they hold your patience just as hard — three days to dry, and every hour smells like a tide pool having a difficult week.'
    diving_visor: 'Crafted from a crab that fought three fishermen and a seagull before going down. The visor still clamps shut unexpectedly, which the crafter insists is a feature.'
    doomed_axe: "The last gravedigger kept this. Seven hundred graves and counting. The work doesn't stop, so the tool doesn't rust."
    doomed_battleaxe: 'Standard-issue after the third muster. Nobody asks where the second went.'
    doomed_club: 'When talking stops working, this is the next sentence. Talking rarely works out here.'
    doomed_fang_daggers: 'Paired blades off the Cinder Widow. They still remember the bite.'
    doomed_grimoire: 'Every entry logged before the burial. The margins are still being filled.'
    doomed_longsword: 'Every swing whispers the name of someone you forgot. Coincidence, probably.'
    doomed_mace: 'Forged from promises nobody kept. Every swing is an apology that showed up far too late.'
    doomed_shortbow: 'Arrows fired from this bow arrive before the sound does. Targets rarely get to complain.'
    doomed_spear: 'Requisitioned from a lancer who no longer files complaints.'
    doomed_staff: 'Channels water magic through a core of compressed dread. Very efficient, morally questionable.'
    doomed_sword: "The smith's last creation before retirement. The retirement was not voluntary."
    doomhammer_eternal: "The hammer a Sundered Soldier's line used to end arguments, combats, and eventually its own service record. Still swings like the argument isn't quite over."
    draconite: 'Crystallized dragon essence that dragons would very much like back, please stop mining it.'
    draconite_powder: ''
    draconize_flour: ''
    dragon_fire_breath: ''
    dragon_frost_breath: ''
    dragon_petal_extract: ''
    dragon_pollen: ''
    dragon_void_essence: ''
    dragonite_crust: 'The crust fights back when broken. Axe smiths embed shards into axe heads for a self-sharpening edge effect.'
    dragonlily: 'A botanical impossibility clad in iridescent scales and exuding a malodorous perfume best described as funeral parlor crossed with sulfur pit, which even actual dragons find disagreeable enough to avoid. Scholars remain divided on whether it is a plant pretending to be a reptile or a reptile that has given up on ambition.'
    drakar: 'Draconic plate that runs warm to the touch. Small dragons find it flattering; large ones find it rude.'
    draugature: 'A band of hardened leather forged in the unyielding cold of the barrow-tombs, threaded with the sinew of the restless dead who wander the frozen wastes.'
    draugr_bone: ''
    draugr_bone_staff: ''
    draugr_daggers: 'They say the village idiot made these. The village idiot disagrees, claiming he has standards.'
    draugr_fractured_amulet: 'A cracked charm of draugr provenance, its runic inlays splintered across aged bone.'
    draugr_helmet: 'Wearing it grants neither authority nor respect, though it does an excellent job of concealing a receding hairline.'
    dread_lance: ''
    driftwalkers: 'Leaves no tracks. Mostly because you never touch the ground long enough to make one.'
    drowned_amber: 'Resin that hardened underwater and trapped whatever was passing at the time, which is best not examined by candlelight.'
    drowned_root_grimoire: 'Bound in root-bark still damp from wherever it was found, pages soft with rot but the ink somehow untouched. The Deep Oracle is rumored to have written the margins.'
    drownmarked_casque_matron: 'Cut from a plate the Anglerdeep Matron shed and did not come back for, which is either luck or an invitation nobody wants to have accepted.'
    drownmarked_casque_mire: 'Bears the pale tideline the deep weald leaves on everything it takes and gives back, which is more things than the weald likes to admit giving back.'
    drownmarked_chausses_of_rising_tide: 'Marked at the exact height the water rose the night the weald took the lower tiers, worn as a reminder and, occasionally, a warning.'
    drownmarked_cordial_of_rising_tide: "Mixed at the turn of the tide the weald says it doesn't have, which the brewer times by feel and refuses to explain."
    drownmarked_elixir: "Bears the pale tideline of everything the deep weald has touched, which the label lists as a mark of authenticity and the wise read as a mark of where it's been."
    drownmarked_kris_of_fen_below: 'Its wave-pattern deepens the longer it sits in fen-water, so an old one cuts a wound no straight blade could stitch shut.'
    drownmarked_loop_matron: "Cast from a fang the Matron left in something she decided wasn't worth finishing, a distinction the wearer would rather not share."
    drownmarked_loop_mire: 'Stained by mire-water to a black that swallows candlelight, worn by those who would rather their hands not catch the eye.'
    drownmarked_resin: "Resin that bled from a tree the deep water claimed, still weeping slowly, which the crafters take as a sign it hasn't finished dying."
    drownmarked_saber_of_fen_below: 'Recovered from the layer the guides call the Fen Below, which they say more to warn you off than to give directions.'
    drownmarked_saber_of_rising_tide: 'Curved to match the water it was quenched in, so it cuts along the current and fights anyone who swings it against.'
    drownmarked_tome_of_rising_tide: "The ink runs a little more each time it's opened underwater, which the deep-weald scholars insist is the book revising itself."
    dualpact_circlet: 'Bound to two elements that agreed to share custody and nothing else.'
    duke_breastplate: 'Engraved with a crest of two goblins fighting over one coin. Neither goblin wins.'
    duke_crossbow: ''
    duke_rapier: 'Lifted from a goblin duke who swore, loudly and often, that he only ever used it to scratch his back. Not one soul in the court believed him, and every one of them let him keep telling it.'
    duke_sash: "Worn to every execution he personally didn't attend. Optics matter."
    duke_signet: ''
    duke_signet_ring: "Nobility, goblin-style: awarded for how many peers you've personally shoved downstairs."
    duke_sword: 'Once belonged to a goblin duke who had very strong opinions about taxation.'
    dungeon_key_goblin_cave: "This rusted iron key hums with faint enchantments, granting its bearer passage past the concealed wards guarding the Goblin King's treasure trove."
    duskfire_rusk: ''
    duskite: 'A mineral that absorbs light so aggressively miners keep losing it in their own pockets.'
    duskite_powder: ''
    earthsea_tassets: 'Half-earthen, half-oceanic. Each half is convinced the other one is just for show.'
    ectoplasm: 'Translucent ghost residue. Passes through non-enchanted containers. Storage is an adventure in itself.'
    ectoplasm_locket: "Opens to a portrait nobody living has ever recognized. Several dead have, but they aren't talking."
    ectoplasmic_tome: 'The binding oozes translucent goo. The librarian said it was normal. The librarian was also translucent.'
    ekusoni: 'An exorcist mask that hums faintly near the recently deceased. Probably nothing.'
    elder_totem: ''
    elder_totem_amulet: 'Carved from Kweebec elder-wood by hands so small the tool marks look like calligraphy. The totem depicts a creature that the Kweebec refuse to name, describe, or acknowledge exists. They do, however, charge handsomely for its likeness.'
    elder_totem_talisman: 'Carved from a totem the Sky Matron guarded longer than Pandora Reach has had a name.'
    elemental_catalyst_air: ''
    elemental_catalyst_earth: ''
    elemental_catalyst_fire: ''
    elemental_catalyst_water: ''
    elixir_of_agility: 'Liquid reflexes, cat-grade. Decision-making not included, and it shows almost immediately.'
    elixir_of_chance: 'Distilled probability. Improves your stat sheet. Your actual luck remains, tragically, unchanged.'
    elixir_of_intelligence: 'Sharpens the mind for an hour and the ego for considerably longer.'
    elixir_of_strength: 'Temporarily makes you hit like someone twice your size. Side effects include overconfidence and involuntary flexing.'
    elixir_of_vitality: "Standard-issue before a push. Doesn't ask if you're ready."
    embalmed_ancestral_club: "What's left after the embalming rites. Weighs more than a club this size has any right to."
    embalmed_bow: "Preserved in the burial spice. Drawn from a corpse-keeper's arsenal. The string was never meant for the living; it still holds."
    embalmed_club: 'Every swing wakes something that was sleeping for a very good reason.'
    embalmed_cuirass: "Lined with embalming silk salvaged from the barrow-workers' stores. Holds its shape after everything else has given out."
    embalmed_grips: "Wrapped in the same silk as the dead. Grip doesn't loosen, even after."
    embalmed_legguards: 'Your legs are mummified and, somehow, extremely well accessorized.'
    embalmed_locket: "Holds a portrait painted on burial silk. The face inside hasn't aged since the sitting."
    embalmed_silk: "Bindings pulled off a frostshamble, kept fresh by centuries of cold rather than any embalmer's craft. Makes fine bandages, provided you've decided not to ask where they've been."
    embalmed_silk_ring: 'A ring woven from embalmed silk. The dead have a surprisingly firm handshake when wearing this.'
    ember_core: 'A tiny sun trapped in mineral. Burns through pouches. Experienced adventurers carry these in clay pots.'
    ember_core_scepter: 'An ember set in iron, comforting right up until the moment you notice the heat has never once stopped climbing. The old smiths have a phrase for that feeling. It does not translate kindly.'
    ember_reduction: 'Rendered fat from the refectory roasts. Frying, waterproofing, bribing the hounds — one jar does all.'
    ember_scripture: 'Inked in a script that surfaces only under heat. Reading it calls for a hearth and the patience of a saint.'
    ember_shortbow: 'Arrows loosed from it glow the whole way to the target, which the fletcher calls beautiful and the archer calls the end of ever surprising anyone again.'
    ember_silk: 'Thread spun from cocoons that smolder eternally, warm to the touch and perilous to the careless hand.'
    ember_silkblade: "Forged from silk fibers ignited and tempered into a burning edge that refuses to cool. Flexible enough to tie in a knot, assuming one's fingers are immune to third-degree burns."
    ember_studded_belt: 'The magmooligan was on fire when this wool was sheared. The shearer was also on fire shortly after. The belt retains a cozy warmth and a faint sense of mutual regret.'
    ember_walkers: 'The soles never cool: a marvel of enchantment, or possibly just a serious design flaw.'
    emberchant_breastplate_of_last_verse: 'Pulled off the altar table in one clean yank. The candlesticks never noticed.'
    emberchant_breastplate_of_twelve_voices: 'Eight layers of batting between you and the world. The world takes the hint.'
    emberchant_composite: 'Layered while singing, because the old smiths swore it set the grain. It set the grain. Nobody knows why.'
    emberchant_core: 'A coal that simply will not go out. Forges love it; anyone carrying it in a pocket learns fast to stop.'
    emberchant_extract: 'What remains after the boiling. The cook calls it stock; the alchemist calls it a solvent; the drain calls it a colleague.'
    emberchant_hand_axe_of_twelve_voices: 'Light enough to hurl, nasty enough to hang onto. That choice haunts every fight.'
    emberchant_legguards_of_last_verse: 'Winter-weight wool in a building heated by a dragon. Grandmother does not accept counterarguments.'
    emberchant_tonic_of_last_verse: 'Honey, herbs and a whisper of ash. Dissolves slowly enough to outlast the sermon.'
    emberchant_treads_of_last_verse: 'Knitted thick enough to cross the cold flagstones at midnight without waking the crypt.'
    emberchant_waraxe_of_twelve_voices: 'The choir has twelve voices. This settles arguments with all of them at once.'
    emberglow_staff: 'The ember core at its tip never fully dies. Neither do the burns it inflicts.'
    embermaw_gauntlets: 'Residual heat from cinder heart fragments makes these gauntlets uncomfortably warm. Like a handshake from a fever patient.'
    emberwalk_striders: 'Let you cross a bed of live coals unbothered. Crossing back is a separate purchase.'
    emberweave_hauberk: "Woven from fiber that still remembers being on fire and won't let you forget either."
    empyrean_charm_of_broken_diadem: 'It performs its stated function with visible reluctance, and the difference stopped mattering somewhere along the way.'
    empyrean_elixir: 'The dosage instructions contradict themselves halfway down the label, and no refund request has ever been filed, yet.'
    empyrean_sash_of_falling_crown: 'Its purpose was reconsidered after it was finished, and the maker stands by that, mostly.'
    enchanting_dust: ''
    enka_muru: 'A traveller’s cloak stitched for long roads and short conversations.'
    enriched_dough: 'Raw dough so enriched with minerals it practically qualifies as a geological sample. Handymen swear by it.'
    ensable_crystal: ''
    ensable_key: 'Insert it wrong and the lock fills with obsidian. Fortune favors the careful.'
    ensable_pincers: 'Something down there wants this back badly enough to still be looking.'
    etched_signet: "Bears an etched crest that could be a wolf, a cat, or abstract art. The jeweler wasn't sure either."
    eternal_biscuit: ''
    eternal_eclipse_blade: 'Exists in permanent shadow regardless of the light source, same as the Voidmoth wing it was cut from. Astronomers have opinions. The blade has never asked for them.'
    eternal_wisdom_chain: 'Carries a key for every crate that ever shipped through this post.'
    eternwool_band: 'Cut from the same batch as a hundred others. This one came back.'
    ethereal_ukranize: ''
    evenhand: "Balanced to a fraction the smith won't disclose. Every wielder swears it favors them personally. It doesn't."
    executioners_verdict: 'Rings like a court-martial gavel on the downswing, delivered by whichever Sundered Soldier drew the short straw that century. The sentence is always the same. The paperwork is not required.'
    faded_spellbook: 'Half the pages are missing and the rest are smudged. Contains one legible spell: a grocery list from 200 years ago.'
    fangs_of_the_abyss: 'Pulled from something that should have stayed sleeping at the bottom of the void. The handles still twitch sometimes.'
    farpoint: "Sighted for a target the wielder can barely see yet. By the time it lands, that's no longer true."
    farshot: 'Strung for range no sane archer needs at the Scar, where everything worth shooting is already close enough to smell.'
    farwalker: "Built for a distance nobody's supposed to need at the wall. Somebody clearly needed it anyway."
    faultline_extract: 'Bled from a live crack. Handlers wear gloves; the crack does not care about the gloves.'
    faultline_grips_of_split_sky: "Molded on a Riftling's forelimb the day the sky over the faultline finally gave up pretending to be solid. Grip strength triples. Depth perception does not survive the trade."
    faultline_hand_axe_of_torn_ground: 'Marketed for prospecting. Used, exclusively, for the other thing.'
    faultline_poultice_of_split_sky: 'Packed into the seams of a molting Riftling to keep the new shell from setting crooked. Works about as well on people — unevenly, that is, but it works.'
    faultline_quartz: "Grew along a fracture, so it's flawless everywhere except the one line that matters."
    faultline_torc_of_split_sky: 'A Gate Watcher wore this while staring at a sky that had, technically, stopped being one sky. Reflects the horizon twice along the seam. The second reflection watches back, allegedly.'
    faultline_torc_of_torn_ground: 'Grounds you, literally, to a world whose ground is a running joke. Mixed results.'
    faultline_treads_of_torn_ground: "Soled with a Riftling's shed foot-plates, which grip fractured ground the same instinctive way the living limb once did. One sole always finds purchase. The other is still arguing about it."
    faultline_visor_of_split_sky: 'In this world the horizon has a seam in it. Staring at it for luck is optional and unwise.'
    faultline_warbelt_of_split_sky: 'Wide enough to hang a small armoury from. The wearer usually does, then regrets the weight.'
    featherfall_daggers: 'Nobody remembers agreeing to how this turned out, and the committee never reconvened to revisit it.'
    feathergilt_ingot: 'Its classification has been disputed since it was found, so buyers are advised to judge for themselves.'
    feathergilt_visor_of_silent_court_crown: 'It agrees to function, under written protest, so the disagreement was quietly absorbed into the design.'
    feathergilt_visor_of_silent_court_godbone: 'It does its job, then apologizes for doing it, so the original complaint was never formally withdrawn.'
    feathergilt_waraxe_of_silent_court: 'Its maker refused to elaborate further, and the wearer has learned to live with the ambiguity.'
    fen_amulet: 'Swamp-born and swamp-scented. Pairs well with social isolation.'
    fen_gland: ''
    fen_impaler: 'Pulled from a swamp that filed a formal, sopping objection.'
    fen_mace: "Blessed by something that lives in the deepest part of the swamp. You don't want to meet it."
    fen_moss_clump: ''
    fen_moss_mallet: 'A mallet covered in living fen moss that regenerates overnight. Hit something hard enough and the moss sighs.'
    fen_reaper_axe: 'Harvests reed and bone with equal patience. The marsh never runs short of either.'
    fen_reed: 'Iron-hard reed that grows only where the fen runs deepest, harvested by those willing to reach an arm in and trust it comes back.'
    fen_trident: 'Three prongs coated in fen muck. The smell alone keeps most enemies at bay. Allies too unfortunately.'
    fenrot_composite: 'Stock left to rot to exactly the right degree, a window the master crafters guard jealously and the apprentices ruin routinely.'
    fenrot_draught: "Ferments a little more with every day it isn't drunk, until eventually it stops being medicine and starts being a decision."
    fenrot_draught_of_moonlit_mire: 'Named for a moon that never reaches this deep, which the brewer finds poetic and the drinker finds a warning, correctly.'
    fenrot_gauntlets: "The rot ate the fine motor control years ago. What's left is a grip that has genuinely never once let go, on purpose or otherwise."
    fenrot_girdle_of_moonlit_mire: 'Dyed by mire-water to a color that only reads as anything under moonlight, which never reaches this deep, so it stays a mystery on purpose.'
    fenrot_girdle_of_quiet_drowning: 'Rotted supple enough to cinch one-handed in the dark, a small mercy the fen grants and immediately makes you pay for.'
    fenrot_greatblade: 'Left in the fen long enough to pit and scar, which the smith reframed as character and priced up accordingly.'
    fenrot_greaves: 'Soft with rot in a way that turns out to move quietly, which is the only currency the fen respects.'
    fenrot_helm_of_moonlit_mire: "The leather's gone soft with rot and stayed that way, which turns out to cushion a blow better than anything the dry-landers sell."
    fenrot_helm_of_quiet_drowning: 'Sealed close enough to keep the fen out and, some wearers note uneasily, close enough to keep a held breath in.'
    fenrot_ration: 'Field medicine wrapped in fen-leaf that keeps it fresh and lends it a taste no one has ever called good, only effective.'
    feran_gauntlets: 'Grown back within the week. The ferans, unbothered, already regret nothing.'
    feran_hide_belt: 'Tanned feran leather, supple and dark as a moonless coast. The feran was a solitary predator of the tidal flats, and the belt carries its temperament — it creaks irritably when wet and absolutely refuses to pair with anything fashionable.'
    feran_hunting_charm: ''
    feran_pelt: ''
    feran_stalker_gloves: 'The fur stands on end when prey draws close — and also in thunderstorms, near campfires, and the instant its wearer lies. A hunting glove and a conscience, sewn into one pelt whether you asked for the second part or not.'
    fingerbind: "Fits every finger it's tried on so far — a fact the smith who made it never found reassuring."
    fire_spellbook: ''
    firesteel_grimoire: ''
    firstlight_carapace_of_closing_age: 'Plated in the pale metal that only forms where the first dawn still reaches. There is less of that surface every year, and the smiths have noticed.'
    firstlight_extract: 'Distilled at the exact minute of first light, which gives the alchemists one shot a day and a very short temper by noon.'
    firstlight_halberd_of_world_wound: "Long enough to keep the Wound's edge at exactly the distance the Wall Fragments consider survivable. The measurement is precise and non-negotiable."
    firstlight_locket_of_world_wound: "Holds a pinch of the first dawn, sealed before it could fade. It hasn't. The wearer is advised not to open it and find out why."
    firstlight_warboots_of_world_wound: 'Laced to carry a pilgrim through the one hour the Wound stays quiet. Miss the window and the boots are the least of the problems.'
    fish_scale: ''
    flame_crystal_staff: 'Crowned with an ember that refuses to die, much like the mage carrying it.'
    flare_band: 'Mild in the hand. A genuine liability the moment you actually cast something.'
    flooded_nave_key: "Slick with nave-water that never quite dries. The Drowned Prior still leads a congregation down there; nobody has explained who's left to preach to."
    flying_fish_wing: ''
    footnote: "Cites a source that no longer exists, for a claim nobody's been able to disprove either."
    fortress_legguards: 'Your legs become a fortress. Your mobility becomes a memory.'
    fracture_cordial_of_long_collapse: 'Fermented in a Riftling nest, in a shell that never fully closed. It heals slowly and asks nothing back, which around here borders on suspicious.'
    fracture_hauberk_rift: 'Layered from failed blades. Each one broke doing its job; you get to finish theirs.'
    fracture_hauberk_void: "Chainmail sized for a Riftling's pre-molt frame, every ring cast slightly wrong on purpose. It holds together the way the Riftling did: barely, and only under tension."
    fracture_ingot: "Cast with a hairline crack down the middle, sold as 'character'. It holds. Mostly."
    fracture_loop_rift: "There's a crack in the band you can't quite see. You will absolutely think about it constantly."
    fracture_loop_void: "Set with a stone that isn't. Looking directly at the empty setting is not recommended twice."
    fracture_resin: 'Sets faster than you can pull free. Ask any apprentice by their nickname.'
    fracture_sash: "Frayed at both ends the way a Riftling's hide frays at a molt-line, and just as stubbornly still holding its shape. Replacing it feels, somehow, like a betrayal."
    fracture_scepter_of_long_collapse: "Doesn't win fights so much as postpone them, one crumbling wall at a time, the same patient way a Riftling outlasts a collapsing tunnel. Slow magic. Reliable magic."
    frost_grimoire: 'Its pages stay damp no matter how many fires you set beside it. Reading it feels like drowning in knowledge — a sensation the author, whoever they were, apparently found instructive.'
    frost_recurve: "A recurve bow infused with glacial essence. The arrows freeze in flight. So do the archer's fingers."
    frost_sabre: 'A curved blade trailing frost. Every swing is a relationship ender.'
    frost_shard: ''
    frost_shard_spear: 'A frost shard mounted on thorium. It never thaws, which makes holding it a character-building experience.'
    frost_shard_sword: ''
    frost_titan_cudgel: 'What a frost titan flosses with. What flattens you in one swing.'
    frost_totemic_club: 'Topped with a frozen totemic effigy. Its carved expression changes with the weather. And your luck.'
    frostbound_band: 'Marks the hour without a sound. Someone still winds it, out of habit.'
    frostclaw_warhelm: 'Forged from titan claw chitin and tempered in glacier runoff. The cold never bothered it. You, however, will shiver.'
    frostfang_bow: 'Loosed once, and every wolf for a mile answers back.'
    frostfang_requiem: 'Half sword, half funeral hymn. Guess which part you hear first.'
    frostfur_hatchet: ''
    frostfur_tuft: ''
    frosthewn_axe: 'Hewn from a glacier, edged with adamantite. Serves cold, every time.'
    frosthowl_stilettos: 'Daggers that whistle in the cold. The sound is deeply unsettling to both enemies and allies. Mostly allies.'
    frostkoa_cleaver: 'Forged in ice-frog bile, the blade sheds a cold sweat that refuses to freeze even down here. It never asks for sympathy. It gets some anyway.'
    frostkoa_eye_pendant: "The eye blinks on its own schedule. You've decided not to think about that."
    frostkoa_staff: 'Cut from a spine that let out one last, very committed croak.'
    frostmaw_scale: ''
    frostshamble_girdle: 'Cinches your trousers in place while something considerably less alive shuffles along behind you.'
    frostshamble_helm: 'Whispers all night. Mostly reviews. None of them positive.'
    frostshamble_longsword: ''
    frostshamble_pendant: "Mutters after dark. Refuses to specify what it wants until it's far too late."
    frostshamble_treads: "Leaves footprints that keep shuffling for a few steps after you've stopped."
    frostshell_aegis: 'Layers of frozen crab shell over thorium plate. Marine biology, weaponized.'
    frostshell_grimoire: 'Bound in frozen crab shell. It introduces itself before it introduces frostbite.'
    frostshell_pendant: 'A polished frostshell fragment on a thorium chain. It radiates cold and mild trauma.'
    frostshell_plate: ''
    frostshell_signet: "Made from a frostclaw's shell fragment. The crab never signed the donation form."
    frostward_mace: ''
    frostweaver_wraps: 'Woven from yeti fur, reinforced with glacial heart shards. The yeti has opinions about this.'
    frostwolf_fang_ring: 'Bites back when you try to take it off. The pack does not forget insults.'
    frostwolf_hauberk: 'You will never be cold again. You will also never be invited south again.'
    frostwolf_leggings: 'Soft as a den. Armored as a siege. The pack contains multitudes.'
    frostwolf_mitts: "Your hands stay warm. Everyone you shake hands with stays reminded who's in charge."
    frostwolf_paws: "Grips ice like it insulted your family personally. It's complicated."
    frostwolf_staff: ''
    frozen_striders: 'Ice-treated leather that finally lets go of standing still. Motion, at last.'
    fungal_flatbread: 'A thin bread infused with ivory orchid paste. Tailors soak it in dye and use the residue to waterproof fabrics.'
    galerunner_crown: 'Aerodynamic enough to shave half a second off your retreat time.'
    gecko_chopper: 'Wielded, legend insists, by the greatest gecko king Pandora Reach never actually had.'
    gecko_saber: ''
    gecko_scale_leggings: "The gecko's tail grew back within the week. Your reputation may take considerably longer."
    gecko_tail_segment: 'Detached voluntarily by the gecko, still wriggling. Use it in alchemy or watch it dance. Your call.'
    gecko_venom_lance: "The wound is the easy part, over in a moment. What the gecko's venom leaves behind takes considerably longer to forgive you for showing up."
    gecko_venom_sac: ''
    genesis_blade: "Forged, according to the pilgrims who still make the climb, from whatever the world looked like before it fractured. Nobody's in a position to confirm that."
    genesis_greataxe_of_origin_line: 'Heavy enough that the first swing settles most disputes and the second is mostly for the record. There is rarely a third.'
    genesis_hauberk: 'Ringed from wire drawn before anyone thought to record how. The technique died with its smith; the hauberk, so far, has outlived the loss.'
    genesis_loop: 'Cast from the first alloy the world ever cooled into, if the Auditors are to be believed, and they are, mostly, when they agree, which is rarely.'
    genesis_mail: "Ringed in metal pilgrims swear predates the fracture, though the smiths who'd know for certain didn't survive to confirm it."
    genesis_moss: "Moss that grows only where the first light still lands, and dies the instant it's shaded. Harvesters work fast and apologize to nobody in particular."
    genesis_suize: ''
    ghost_cap: ''
    ghost_wafer: ''
    ghostcap_alloy: 'Metal seeded with ghost-cap spores that keep it faintly aglow, warm to work and impossible to lose track of on a dark bench.'
    ghostcap_almanac_of_deep_canopy: 'Its pages are pressed ghost-cap, legible only in the dark they glow in, which makes the deep weald the one place you can actually read it.'
    ghostcap_carapace_of_drowned_weald: 'Studded with ghost-cap mushrooms that keep glowing after the wearer stops moving, which is a poor trait in a hiding place and a worse one in a coffin.'
    ghostcap_falchion_of_drowned_weald: 'Its blade is threaded with ghost-cap spores that glow along each cut, so the wound lights up before the pain does.'
    ghostcap_fists_of_deep_canopy_matron: 'Studded with a rarer cap that glows only in true dark, which under the deep canopy is always, so they never once go dim.'
    ghostcap_fists_of_deep_canopy_mire: 'The mushroom caps on the knuckles glow brighter the harder you strike, turning a brawl into an unwanted light show.'
    ghostcap_flail_of_drowned_weald: 'Its head is a hardened ghost-cap that lights up on the backswing, telling the target exactly when to flinch and never quite letting them.'
    ghostcap_philter_of_drowned_weald: 'Glows faintly for an hour after you drink it, long enough to find your way out of the dark and just long enough for something to find you.'
    ghostcap_warboots_of_drowned_weald_matron: 'Soled in glowing caps that give the wearer away in the dark, which the maker considered a fair trade for never getting lost.'
    ghostcap_warboots_of_drowned_weald_mire: 'Sealed against water that never fully drains out of them, so each step lands with a small, private squelch only the wearer hears.'
    gilded_brew_of_last_regent: 'The recipe was argued over more than it was brewed, which the brewer insists was intentional.'
    gilded_carapace_of_hollow_throne: 'It works on the honor system, which nobody can confirm without starting the argument over.'
    gilded_chopper_of_hollow_throne: 'It does its job, then apologizes for doing it, so the manual was left deliberately vague.'
    gilded_circle_of_last_regent: "Whether it's reliable remains an open debate, so the manual was left deliberately vague."
    gilded_extract: 'It was declared authentic by a narrow margin, and the second explanation was never fully ruled out.'
    gilded_locket_of_last_regent: 'It agrees to function, under written protest, a detail everyone involved has agreed to forget.'
    gilded_philter_of_hollow_throne: 'The recipe was argued over more than it was brewed, which the label discloses in very small print.'
    gilded_stilettos_of_last_regent: 'It was completed despite unanimous hesitation, a compromise nobody is fully willing to defend.'
    gilded_tassets_of_hollow_throne: 'Its origin story changes depending on who tells it, and the difference stopped mattering somewhere along the way.'
    gildsteel: "It was found where the records say it shouldn't be, so both entries remain on the record, unreconciled."
    girthstone: "Sized by a tailor who measured the wearer's ambitions rather than their waist. Both turned out larger than expected."
    glacial_basinet: 'A helmet so cold it fogs up from the inside. Visibility optional, survival mandatory.'
    glacial_brand: 'A longsword quenched in glacial meltwater. The blade frosts over between strikes, which looks dramatic and solves nothing.'
    glacial_buckle: 'The buckle is a frost shard that never melts. Convenient. Occasionally load-bearing.'
    glacial_cinch: 'Forged from glacial heart alloy. Cinches tight and never loosens. Ask it nicely first.'
    glacial_fortress_greaves: 'Moving in these is a full workout. Standing still is also a full workout.'
    glacial_grasp: 'Everything you touch freezes slightly. Including your weapon. Including your friendships.'
    glacial_grips: 'Gauntlets that never thaw. Your fingers will go numb, but at least you will grip things with conviction.'
    glacial_heart: ''
    glacial_loop: 'A ring of frozen crystal that regenerates when chipped. You will, eventually, stop being cold. Eventually.'
    glacial_march_boots: 'Built for the eternal march through frozen wastes. Or the commute. Same energy.'
    glacial_medallion: 'A medallion of pure frost crystal. Worth a fortune. Feels like a debt.'
    glacial_morningstar: ''
    glacial_pike: "Tipped with glacial crystal. Keeps enemies at a distance they didn't choose."
    glacial_recurve: 'Strung with frozen sinew that never loosens, unlike your grip when it fires.'
    glacial_signet: "Carved from a glacier's heart-crystal. It deadens whichever finger it rides on, which the maker swears is a feature."
    glacial_verdict: 'The blade hands down its own ruling on every fight: guilty of standing too close.'
    glacial_visor: 'Fogs up in warm weather. The last owner solved this by not thinking too hard.'
    glacial_waistguard: 'Packed with ash-cured leather. Holds a line better than it holds a shine.'
    glasschant_daggers: 'The good scissors. You were told never to use them. You are using them.'
    glassong_grips: 'Rubber to the elbow. The sink water here dissolves spoons, so they run a little thick.'
    glasswrought_brew_of_molten_antiphon: 'Stewed on the stovetop since dawn. Strong enough to argue with.'
    glasswrought_carapace_of_black_choir: 'Strapped on front-first. Folds flat for storage and unfolds with a shriek that clears the room.'
    glasswrought_claymore_of_black_choir: 'Rings a clear high note on impact. The note is the last thing several people ever heard.'
    glasswrought_falchion_of_black_choir: 'Serrated for crusts that fight back. In this parish, they do.'
    glasswrought_fists_of_black_choir: 'Padded for a pan that has never once been washed, on principle and for the seasoning.'
    glasswrought_focus_of_molten_antiphon: 'Phoenix feathers, allegedly. The dust ignites, which is one way to be thorough.'
    glasswrought_philter_of_black_choir_pyre: 'Burns twice: going in, and again when you speak your mind afterward.'
    glasswrought_philter_of_black_choir_vitrified: 'Medicinal, according to the charwoman. Grey, according to everyone.'
    glasswrought_stilettos_of_molten_antipho: 'Two paring knives, thin as excuses. Peel an apple in one strip or a lock in one sitting.'
    glasswrought_tassets_of_molten_antiphon: 'Hemmed high against the wash-water and the rats. Practicality has never looked so grim.'
    gobadoc_eye: ''
    gobeline_ring: 'Dainty by goblin standards, which means it only has three sharp edges and one suspicious stain. The gemstone is a polished bit of coloured glass the goblin jeweller was extremely proud of. Pointing this out is considered a grave insult in goblin culture. Also a death sentence.'
    goblin_cleaver: 'Stolen from a goblin who insisted it was a family heirloom. It was not.'
    goblin_ear: ''
    goblin_grudge_axe: 'Every goblin who owned this axe eventually used it on another goblin. The cycle continues.'
    goblin_gunpowder: ''
    goblin_knuckle_ring: "Forged from a goblin's favourite knucklebone — its own. The goblin was reportedly philosophical about the loss, right up until it wasn't. Fits perfectly on any finger, because goblins apparently have universally-sized knuckles. Evolution is mysterious."
    goblin_loot_bag: "A tiny burlap sack full of stolen trinkets. Mostly buttons, a chicken bone, and someone's regrettable love letter."
    goblin_masher: "Goblins don't season their food so much as introduce it to this. The technique transfers remarkably well to skulls."
    goblin_raider_vest: "Patched together from at least four different armours, none of which matched and none of which were acquired legally. There's a faded insignia on the chest that says 'Property Of' followed by a name scratched out so aggressively it left a hole."
    goblin_scimitar: "Goblins do not forge swords. They find them. This one was found in someone else's inventory."
    goblin_stompers: 'Stitched together by goblin cobblers who clearly had strong opinions about foot comfort but no formal training. The left boot is slightly larger than the right. Whether this was intentional remains a matter of furious academic debate.'
    goblin_sword: 'The green tint comes from copper content, goblin blood, or both—philosophers suggest not asking.'
    goblin_tooth: ''
    goblin_tooth_belt: 'Every tooth belonged to somebody who personally annoyed a goblin chieftain. The list was long.'
    goblin_trinket_chain: "A chain of stolen baubles, pilfered coins, and at least one tooth that doesn't belong to the goblin. Goblins call this 'haute couture.' Everyone else calls it evidence."
    goblin_wartop: 'A helmet that has passed through more goblin skulls than a particularly persistent headache. Each owner carved their name inside, resulting in a layered history of increasingly poor penmanship. The dents add character. The bloodstains add context.'
    godbone_saber: 'It does the job it was eventually assigned, and the paperwork reflects none of this.'
    godbone_shard: 'Its exact properties depend on who is asked, and the case file was quietly closed, unresolved.'
    godbone_torc: 'It was forged during an argument nobody won, so the wearer has stopped asking.'
    godflesh_plate: 'Its warranty is void the moment you question it, and the second draft never materialized.'
    gods_maw_key: "Cast from something that used to be part of the god, back when the god was still using it. The Maw doesn't ask for it back so much as expect it."
    godspear_impaler: "Forged to hold a line at a threshold no Gate Watcher was ever meant to hold alone. Whichever end you grip matters less than whether you're standing on the right side of the gate."
    godspine_staff: 'Its function was settled by a coin flip, a distinction without much of a difference.'
    godstep_sandals: 'It does exactly one thing, and disputes even that, which is either reassuring or deeply concerning.'
    golden_fleece: ''
    golden_fleece_amulet: 'Grown by a three-time champion who never once had to try.'
    golden_fleece_helm: 'Woven so tight it stops arrows and any chance of being taken seriously.'
    golden_fleece_legguards: 'So comfortable that two separate adventurers have napped mid-battle wearing them. Undefeated record.'
    golden_larvae: ''
    golden_mushroom: ''
    golden_nightcap: ''
    golden_silk: ''
    golden_silkling: 'A larva spun from precious thread, its tiny form radiating the kind of unyielding determination that turns feeble strikes into crushing blows.'
    golden_wheat: ''
    grasploop: 'The last thing a great many climbers held before they stopped needing to hold anything.'
    grave_dust: "Fine grey powder from a hollow's bones. Necromancers pay well. Your reputation in town, however, will not recover."
    great_woolame: "This longsword was pulled from the glistening remains of a wooligan's last meal, its metal strangely preserved by the creature's potent stomach acids. A thorough cleaning is strongly recommended before use."
    greater_healing_potion: 'Brewed from nightcap extract and questionable biological fluids. Closes wounds fast enough to make surgeons jealous.'
    greater_stamina_tonic: 'Amber, thick, and floods you with more ambition than your legs are currently prepared to honor.'
    green_bread: "Dense, doughy, and faintly luminescent — this mushroom bread sustains the body while testing the spirit. Some prisoners request it specifically, just to prove they've hit rock bottom."
    green_mushroom: 'A sickly fungus whose pale verdure suggests it thrives on something other than sunlight.'
    green_mushroom_powder: 'A bag of finely ground spores harvested from verdant forest fungi, their toxic properties concentrated into a single, lethal pinch.'
    green_sap: ''
    green_stew: 'This emulsion of forest growth and desperation restores vitality to those desperate enough to ignore its resemblance to goblin bile.'
    grimoire_of_embers: "Each spell cast singes a page pulled from a Cinder Shade's own molted hide-parchment. Finish the book and you'll have memorized the Shade's temperament along with the incantations."
    grimoire_of_tides: 'The pages stay permanently damp. Reading it feels like drowning, which the author considered a feature.'
    grimoire_of_warding: ''
    grimreminder: 'Issued to new pilgrims as a lesson in what the Scar does to enthusiasm. Most keep it long after the lesson lands.'
    grips_of_the_deathless: "Every prophecy needs a hand steady enough to point at the bad outcome without shaking. These were that hand's gloves. The prophet is gone. The steadiness stayed behind."
    groundpounder_boots: 'Every step leaves a print the size of a dinner plate. Subtlety was never the point.'
    groundswing: "Follows through into the dirt on a miss, which happens often enough that the wall's masons keep a running tally."
    guardian_chain: "Forged link by link to match the Last Guardian's own, worn by those the Guardian has personally judged fit to stand the last wall."
    guardian_core: "The dense heart-metal recovered from a fallen Guardian's chest-plate, and only ever from a fallen one. Nobody has yet worked out how to ask a standing Guardian for theirs."
    guardian_gauntlets: "Cast to match the Last Guardian's own grip, the only known pair not currently being worn at the wall. Everyone assumes there's a reason for that."
    guardian_waistplate: "Protects everything between chest and legs. Also known as 'everything important.'"
    guardians_verdict: "Wielded by the Last Guardian on the rare occasion words aren't enough. Everyone who's seen it swung agrees: words weren't going to be enough anyway."
    hadean_ice: "Ice from before the sun existed that doesn't melt and has outlived galaxies. You are an inconvenience."
    hadean_ichor: 'The blood of the void itself. Anyone who touches it without protective enchantments forgets their own name. Temporarily.'
    hades_breath_weapon: 'Channels whatever the gate below exhales between openings. Smells of it too, which the enchanter really should have mentioned before the fitting.'
    hades_heart: ''
    hades_key: "Cut from a tooth pulled from something that used to watch this gate before the Gate Watchers took over the shift. Holding it makes your molars ache in sympathy. Nobody's explained why yet."
    halfturn: 'Too heavy to swing twice in the time most weapons manage three. The first swing is generally the only one that matters.'
    halo_draught: 'The dosage instructions contradict themselves halfway down the label, which the brewer insists was intentional.'
    halo_splitter: 'It functions on a technicality, which is technically true and completely unhelpful.'
    halo_striders: 'These boots dispute the concept of walking. They believe movement is a matter of philosophical opinion rather than physical fact.'
    haloforged_brew_of_last_regent: "It was brewed to settle an argument, and didn't, so results may vary, considerably."
    haloforged_carapace_of_last_regent: 'The design went through several irreconcilable drafts, so the original complaint was never formally withdrawn.'
    haloforged_circle_of_last_regent: 'It works on the honor system, which the maker calls character.'
    haloforged_crest_of_last_regent: 'Its maker refused to elaborate further, a compromise nobody is fully willing to defend.'
    haloforged_fists_of_hollow_throne: 'Nobody has confirmed it does what the label claims, a subject the wearer has chosen not to revisit.'
    haloforged_fists_of_last_regent: 'The design committee never actually agreed on this, so the matter remains, for now, unresolved.'
    haloforged_philter_of_hollow_throne: 'Whoever bottled it never settled on a final version, and the brewer still refuses to pick a side.'
    haloforged_resin: 'It was declared authentic by a narrow margin, which changes depending on the season and the asker.'
    haloglass: 'Its purity is graded on a sliding, negotiable scale, by a committee that has since disbanded.'
    hardening_compound: ''
    hauler_harness: 'More pockets than armor plates. Priorities.'
    healing_potion: 'Standard-issue battlefield restorative. Glows faintly, heals adequately, and smells worse than the wound it treats.'
    heartmender_torc: 'Hums a low note when someone nearby is dying. Very popular at parties.'
    heartstring: 'Pulls faintly toward the Scar at all times, the way a compass pulls toward north. Some wearers stop fighting it.'
    heartwood_core: ''
    heartwood_spear: "Shafted from a shaving cut straight off the world-tree's actual heart, which regrew within the week. The tree doesn't seem to mind lending out pieces of itself."
    heartwood_summoner_club: "Carved from weald heartwood that still answers when knocked on, in a language nobody's translated yet. The Moss Bears seem to understand it fine."
    heavy_leather_vest: 'The feran who wore this pelt was, by all accounts, the laziest of an extremely lazy species.'
    hemmed_leggings: 'At least the hems are straight. Everything else about these leggings is a work in progress.'
    hermit_pilgrim_trousers: 'Stained past saving by the fourth week. Nobody issues a fresh pair.'
    hermit_sage_cowl: 'Worn during the long shifts. The smell never fully washes out.'
    hermit_sash: 'Marked with tally-scratches for every crate signed over. Nobody has recounted since.'
    hermitude_bow: 'Strung with crab sinew. The arrows smell like low tide, which is both a disadvantage and a distraction.'
    highguard: "Held overhead by the wall's sentries so long the stance has its own name in three languages, none of them flattering."
    himalayan_flour: ''
    hive_ring: "Carved from royal jelly hardened in venom, it buzzes with disapproval at decisions the wearer hasn't made yet. You learn to stop asking how it knows. Every household has one relative like that."
    hive_warden_mace: 'Coated to the haft in wax the Combmother herself pressed. Every scarak in the deep galleries gives the bearer a wide, respectful berth — the smart ones, anyway; the tale never mentions the foolish ones twice.'
    hive_wax: ''
    hive_wax_girdle: 'Moulded in beeswax and alchemical flame, it remembers the shape of whoever wore it last with unsettling precision. Nobody in the village will say where that person went. Several will change the subject very quickly.'
    hiveguard_mace: "Sealed against fire and flood both, the way the old tales say the Combmother's favorites always are. The scarak approve of it, in the grudging way an old aunt approves of a wedding she didn't arrange."
    hivewax_belt: "Chitin from scarak who died the way they'd lived — shoulder to shoulder, ten thousand strong, convinced right up to the end that the swarm made them safe."
    hollow_ichor: ''
    hollow_judge_mace: 'Wound in grave-silk, notched with old rulings. Mercy was never part of the design.'
    hollow_knuckles: 'Padded with silk over old plate. Hits harder than the padding suggests.'
    hollow_legguards: 'Taken from a barrow that had already been picked clean once. Nothing left the second time either.'
    hollow_mace: 'Carved from a femur that outlived its owner and is not shy about it.'
    hollow_reckoning_blade: ''
    hollow_root_key: 'Grown, never cut, from a root the Rootmaw Tyrant keeps gnawing back into the dark.'
    hollow_shiv: 'Paired blades wound in grave-silk. The dead, as it turns out, have remarkably fine taste in handles.'
    hollow_signet: 'Presses a blank seal into wax. The blankness is the point.'
    hollow_tome: 'Half the names are crossed out. The book keeps writing them anyway.'
    hollowcrown_draught: 'The label lists an ingredient nobody can identify, which the label discloses in very small print.'
    holy_bible: 'Divine scripture capable of scrubbing a conscience clean, assuming one still possesses a conscience to scrub.'
    hornhead_hatchet: "Forged around a hornhead's broken horn. The hornhead wants it back but lacks the thumbs."
    hornhead_horn: 'A spiraling ram horn, still warm. The previous owner headbutted a tree and lost. Nature is metal.'
    hunting_javelin: 'Designed for hunting small game. Also works on large game if you throw it enough times and believe hard enough.'
    hush_moth_wing: "Wingdust from a moth that flies without a sound it's ever willing to make. Alchemists prize it for exactly that reason. The moth has never once explained why."
    hymn_ember: 'The heat a stone keeps after the fire moves on. Bottled while the bottling was good.'
    hymn_of_endings: 'It performs adequately, by its own admission, and the maker stands by that, mostly.'
    hymnbound_core: 'Waxed kindling brick from the sexton private stash. Lights first time, which here counts as a miracle.'
    hymnbound_cuirass: 'Worn over everything, committed to nothing. Pockets deep enough to lose a censer in.'
    hymnbound_gauntlets_of_ashen_song: 'For the beds of fire-lilies behind the apse. The thorns burn; the gloves disagree.'
    hymnbound_girdle_choir: "Cinches you into the choir's posture: chest out, chin up, an easy target for anyone below."
    hymnbound_girdle_pyre: 'Glows dull red along the buckle. It is either a warning or a fashion statement, and it never clarifies.'
    hymnbound_hatchet_of_ashen_song: 'Light in the hand, heavy in the aftermath. Leaves a fine grey dust that gets into everything.'
    hymnbound_helm: 'Rings faintly at dusk with no bell attached. The smith stopped taking questions about it.'
    hymnbound_ingot: 'Solid iron, heated on the stove, guided by grievance. Creases and dissent surrender alike.'
    hymnbound_sabatons_of_cooling_vent: 'Channel the ground-heat out through the heel. Warm feet, scorched footprints, no complaints yet.'
    incandescent_lance: "Glows with heat that never dims and a grip that clearly wasn't built to match."
    infernal_cleaver: "Burns with the fury of a thousand performance reviews. Ironic, for an ice world. Nobody's complained yet."
    inferno_clutch: 'The leather never fully cools, not since the pyre pits. Grip tightens on its own near heat.'
    inferno_pendant: "The stone at its center hasn't cooled since the pyres were first lit."
    inferno_shard: 'Fused stove waste raked from the grate. The furnace keeps its receipts.'
    infested_legguards: 'These greaves writhe with colonies of parasitic growth, the chitinous mesh having long since bonded with the iron beneath.'
    infested_ring: 'A band of hollowed chitin, its grooves teeming with nameless things that wriggle and bite.'
    infested_sash: 'Pulsing veins run through the tainted fabric as if the garment itself were somehow still alive and digesting. Wearing it constitutes an intimate relationship with disease.'
    infinity_amber: ''
    infinity_arcanite: ''
    infinity_bloodstone: ''
    infinity_cursed_gem: ''
    infinity_diamond: ''
    infinity_draconite: ''
    infinity_duskite: ''
    infinity_jade: ''
    infinity_moonstone: ''
    infinity_obsidianite: ''
    infinity_quartz: ''
    iron_battleaxe: 'Forged from shadow knight shards. The darkness is load-bearing. The weight is character-building.'
    iron_battlecleaver: 'Legend calls it the axe that ended an age. History mostly just remembers the fence it hit.'
    iron_battleplate: 'Shadow knights forge their armor only during eclipses, which is nowhere near often enough for demand.'
    iron_bludgeon: 'Packed with goblin gunpowder in the head. Nobody told the goblins that was the plan. Nobody tells goblins anything.'
    iron_flanged_mace: 'Every swing smells faintly of barn. Nobody has explained why. Nobody wants to.'
    iron_gauntlets: "Standard issue shadow knight gauntlets. The previous owner's grip marks are still visible in the metal, frozen in an expression of 'oh no, not again.'"
    iron_kneeguards: "Salvaged from a shadow knight who knelt before the wrong altar. The kneeguards survived. The knight's career in organized darkness did not."
    iron_legplates: "Bone-white iron from the undying forges below, where the smiths never speak a word while they work. Peaceful, until you remember exactly why they've gone quiet."
    iron_pounder: ''
    iron_sickle: 'A curved blade that cuts herbs with surgical precision. The previous owner was not a surgeon, which explains the blood.'
    iron_war_spear: "Tipped with an ancient marrow shard that refuses to fully dry. Whatever gave its life to make this spear hasn't entirely stopped giving — call it dedication, or call it an unfinished transaction."
    iron_warhelm: 'The smith who forged this helm worked exclusively by moonlight, claiming the shadows whispered the design to him. The shadows also whispered the price. It was not reasonable.'
    ironbark_treads: 'Bark from a tree that saw the axe coming and left first. Footsteps sound faintly like agreement.'
    ironbound_bread: "Doubles as a shield in emergencies. Reviews call it 'rustic.' Reviews are being generous."
    ironbrow_casque: 'Makes you look intimidating. Makes your neck hurt. Tradeoffs.'
    ironbuckle_girdle: "The buckle alone weighs more than most belts. That's the selling point."
    irongrip_signet: "Tightens slightly when you're angry. Loosens when you calm down. Mostly stays tight."
    ironhide_girdle: 'Thick enough to turn a blade, stiff enough to make kneeling a decision, not a reflex.'
    ironjaw: "Built to keep the wearer's teeth where they started the fight. A modest ambition, rarely met at this altitude."
    ironloaf_slab: ''
    ivory_orchid_paste: 'A paste so smooth it could negotiate peace treaties, if peace treaties smelled like cave fungus and regret.'
    ivory_shrooms: 'Cream-colored mushrooms that seem almost luminescent against the dark earth from which they sprout. Proof that even in the darkest places, beauty exists—usually right before it kills you.'
    iyashi_living_branch: 'The tree it came from died centuries ago. Nobody told the branch. It still buds every spring.'
    jade: 'Green enough to make an emerald jealous, yet somehow cheaper than a tavern meal.'
    jade_hoe: 'A farming tool so beautiful that farmers hesitate to use it. Then hunger wins, as it always does.'
    jade_pickaxe: 'Uses jade to mine jade. The philosophical implications are lost on most miners, who are too busy getting rich.'
    jade_powder: 'A fine green powder that stains everything it touches including your reputation as a clean miner.'
    journeyman_saber: 'Good enough to kill a goblin if the goblin stands very still and agrees to be stabbed. Progress.'
    key_aragog: "Covered in silk and venom residue, this ornate key pulses with the heartbeat of the Forbidden Forest's most terrifying colony."
    kiln_potholder: 'A quilted square that fears no oven. Carry anything in the kitchen except a tune, a needle, or the feeling in your fingertips.'
    kindling: 'Carved from wood the wound never finished burning. It still remembers the shape of the fire.'
    kneebreakers: 'Reinforced at the joint where three prior pairs failed. The wearer walks fine. Everyone else finds that suspicious.'
    knucklebone: 'Cast from the knuckles of a mold nobody kept records on. Fits like it was made for a hand slightly larger than yours.'
    knucklevow: 'Engraved with a promise nobody living can read anymore. The metal remembers it better than any translator would.'
    koa_eye: ''
    koa_eye_ring: 'Set with a polished Koa eye that appears, unsettlingly, to still be looking for something.'
    koa_eye_signet: "Koas have roughly the same expression whether they're happy, angry, or being turned into jewellery. The eye in this ring still blinks occasionally, though nobody's sure if it's on purpose."
    koa_slime: 'Viscous frog mucus that slides off containers and coats everything else. Alchemists love it. Everyone else hates you.'
    koa_slime_brigandine: 'Leather plates lacquered with Koa mucus, which hardens into a surprisingly resilient coating. The Koa produced this mucus as a stress response, which means this armour is literally made of anxiety. It still glistens when it rains, giving you the appearance of a very well-moisturised warrior.'
    koa_slime_codex: 'The pages are stuck together with koa slime. Reading it requires both skill and a strong stomach.'
    koa_slime_rod: 'A stick coated in solidified koa slime. It channels magic or at least pretends to.'
    koa_tongue: 'Three feet of prehensile muscle. Stretches, snaps, and occasionally catches something other than flies.'
    koagulant_longbow: 'The bowstring secretes a thin mucus. Nobody knows why. Nobody wants to know.'
    koagulant_wand: 'Pulses with sticky energy, healing wounds by coating them in something best not examined closely.'
    kraken_depth_staff: 'Said to channel the deepest ocean trenches. Wielders report feeling watched. They are.'
    kraken_ink: "Harvested from the Kraken's deepest glands. Writes prophecies. Also just regular grocery lists. It's not picky."
    kraken_key: 'Corroded by salt and barnacles. The tentacle motif on the handle is not subtle.'
    kraken_tide_boots: 'Grips any surface, wet or dry. The kraken-derived soles read the tide before you do.'
    kweebec_leaf_charm: ''
    kweebec_vine_sash: 'Bound during a three-day Kweebec chant that not even the Kweebec fully remember the words to.'
    lantern_shard_ring: "A sliver of a wraith lantern, still dimly glowing. It whispers the time of day to you, which would be useful if it weren't perpetually wrong and deeply passive-aggressive about corrections."
    larvano: 'Pulses like a tiny heartbeat. The scarak hive it came from has not stopped counting its losses.'
    last_guardian_aegis: 'Worn by the Last Guardian since before the Scar had a name, dented in places nothing since has managed to dent twice. Not once has it been the reason the wall fell.'
    lastbreath: "Sized for whoever wears it last. The armorer never explains what that means, and nobody's asked twice."
    lastmile: 'Named for the stretch every pilgrim swears is shorter than the last one. It never is.'
    lastwhisper: 'Carries a spell so old the syllables have worn smooth. Whatever it originally said, it still works.'
    lava_chitin: ''
    leather_heavy_boots: 'Three layers of tusker leather. Your feet will outlive your knees by a comfortable margin.'
    leather_treatment: 'Chemical bath that turns raw hides into supple crafting leather. Tanners cannot function without a steady supply of this.'
    legguards_of_the_primordial: "Cast from the hide an Ash Prophet sheds when a vision runs long. Wearer's stride slows to a prophet's pace: deliberate, unhurried, and always arriving exactly when the bad news does."
    legweight: 'Heavier than regulation, on the theory that a leg too tired to run is a leg that stays put and fights.'
    leviathan_tentacles: 'Cured stiff after being pried from something the Kraken calls family. It still twitches. Occasionally.'
    lightless_striders: "Soled black enough to vanish in the weald's dark. The wearer stops seeing what they're walking into around the third day. By the fourth, it stops mattering."
    liquid_koa: 'A slime that never learned to hold a shape and made peace with it. Mostly.'
    litany_of_cinders: 'An endless scroll of housework. Read aloud, it makes the dust rearrange itself out of sheer guilt.'
    living_spark: ''
    living_spark_greataxe: "The head still crackles with whatever it last cut down, and nobody's entirely sure what that was. The reports are filed and sealed. What's known for certain: the axe picks its targets. The one holding the handle is mostly along for the ride."
    longdraw: 'Takes a full breath to draw and a full breath to regret. Both breaths are optional if the target is fast enough.'
    longreach: "Extends the wielder's range past the point most opponents consider fair. Fairness was never part of the brief."
    lorito_helmet: 'A full parrot pulled over the ears. The sprout on top is load-bearing, emotionally.'
    lumber_cleaver: 'Repurposed from a logging camp. Smells of pine sap and existential career changes. Surprisingly effective.'
    lure_light_pendant: "Holds a sliver of captured anglerlight, pulsing on its own rhythm regardless of what's carrying it. The weald's real lures have started drifting closer to whoever wears it. This is not considered a good sign."
    magmooligan_charm: 'A volcanic wool charm that radiates gentle warmth and smells faintly of sulphur and betrayal. The magmooligan from which it came was grazing peacefully near a lava flow when opportunity struck. Well. When you struck.'
    magmooligan_hauberk: "Felted volcanic wool over old bronze rings, warm enough for blizzards and unbearable everywhere else. On cold nights something in the weave still bleats, faintly. The armourer's oath that the beast was thoroughly finished beforehand has grown less convincing with every retelling."
    magmooligan_waraxe: "Magmooligans are small, mean, and forever setting things alight for no reason a sane creature would accept. This axe is what's left when a smith finally caught one. The fire never did calm down."
    magmooligan_wool: ''
    magmooligan_wool_ring: 'Felted from volcanic wool. Keeps your finger warm, which is a stranger comfort than it sounds.'
    malt_bread: 'Suspiciously sweet bread that may or may not have fermented in your bag. Either way, morale is improved.'
    malt_flour: 'Flour with a sweet, malty undertone that makes bread taste suspiciously like it is trying to become beer.'
    marchworn: "Already broken in by someone who didn't survive to keep wearing them. Sized generously, as a professional courtesy."
    marginalia: 'The main text is unremarkable. Everything worth knowing was scrawled in the margins by someone who clearly disagreed with it.'
    marrow_cinch: "Carved from a spine that stood upright once and had strong opinions the whole time. It tightens on its own whenever a meal gets skipped, judging your habits from whatever's left of the afterlife."
    marrow_knuckles: "Gauntlets carved from the marrow-bones of something that died a long time ago and isn't entirely over it. They're cold in summer, colder in winter, and ice-cold when something undead is nearby. A terrible early warning system, since by the time your fingers go numb, the thing is already breathing down your neck. Figuratively. The dead don't breathe."
    marrow_ring: "Necromancers love these for that 'freshly exhumed' aesthetic without the hassle of digging."
    matriarch_tusk: 'Torn from the Great Ashback Tusker after a fight the herd still talks about. The earth remembers being hit that hard; it has forgiven no one since.'
    matron_chitin: ''
    matron_chitin_gauntlets: 'Plated with shell off the Cinder Widow. Still faintly warm from the burrow.'
    matron_silk_slippers: 'Spun from silk the Anglerdeep Matron sheds during her deepest hunts, soft enough that crossing the weald floor makes no sound at all. Silence is the whole point down here.'
    maw_cleaver: 'Whoever made it changed their mind halfway through, which the maker calls character.'
    maw_crusher_fists: 'Its behavior contradicts its own description, which is either a design flaw or the entire point.'
    maw_tooth_ring: 'A ring that firmly denies its own existence while being worn. It is both absolutely certain and entirely doubtful.'
    maw_visage: 'A helm that insists on being right even when the facts suggest otherwise. It makes principled stands about nothing in particular.'
    mender_cuisses: 'Padded with healing herbs. Kneel, breathe, let the paperwork — sorry, the herbs — do the rest.'
    militia_breastplate: "Standard issue for village guards who can't afford real armor. Deflects arrows if you believe in it hard enough."
    millstone: 'Village millstones ground wheat for six generations before someone thought to swing one. It works. Nobody asked the miller.'
    mineral_biscuit: 'A biscuit fortified with diamond dust. Technically edible, practically a grinding wheel for your molars.'
    minor_healing_brew: 'A tepid green sludge that heals paper cuts and bruised egos. Tastes like regret with a hint of moss.'
    mire_bloom: 'A pale flower that opens only in full dark and shuts at the first hint of light, which makes gathering it a matter of feeling around and hoping.'
    mire_heart: ''
    mire_judge_mace: "Named for the way it settles arguments in the weald's deeper reaches, which is to say permanently. The Gloom Piper composed a song about it; nobody enjoys hearing it."
    mire_waders: 'Standard footing for anyone posted past the reed line. Dry feet are not part of the contract.'
    mirefang_kris: "Wavy-bladed like a Mire Creeper's own fang, honestly because that's exactly what it's cast from. Slides in easier than it should."
    mirefang_loop: "Bent from a single curved fang, small enough to forget you're wearing it until something in the weald reacts to it first."
    mireglass_infusion: 'Silt-glass melted down and re-set with something living stirred in, which the crafters swear improves the temper and never specify whose.'
    mireweald_brew_of_deep_canopy: 'Green and thick and faintly moving, which the brewer swears is just settling and would rather you not watch it too closely.'
    mireweald_carapace_of_drowned_weald: 'Grown around its wearer over a full season, so it fits perfectly and comes off, when it must, the way bark comes off a tree.'
    mireweald_crest_of_deep_canopy: 'Camouflaged for the layer where the canopy blots out what little light gets this deep, which is to say for hiding, which the weald rewards.'
    mireweald_lattice: 'A living crystal frame that keeps growing after harvest, slowly, in whatever direction the last handler faced it, out of stubbornness or habit.'
    mireweald_tassets_of_deep_canopy: 'Living plating that photosynthesizes what little light reaches it, which is nothing, so it slowly eats the wearer instead. Slowly.'
    mireweave_grips: "Woven from mire-silk the Sporebacks spin between root systems, sticky enough to improve a grip and unpleasant enough that nobody asks how it's harvested."
    mirrormelt_essence: 'Distilled from the one patch of Mirrormere that never fully freezes. It remembers everything that melted into it.'
    mithril_axe: 'Bear claws for the grip, magmaclaw chitin for the edge. Splits logs, skulls, and philosophical arguments with volcanic enthusiasm.'
    mithril_battleaxe: 'Two-handed, double-bladed, and triple the regret. Magmaclaw chitin keeps the edge forever hot. Literally.'
    mithril_cinder_striders: 'The upgraded pair. Somehow warmer, somehow louder, somehow still watching.'
    mithril_club: 'Bear-claw studs, boar-hide wrap, golden fleece lining. Lighter than it looks, heavier than you would hope. Very persuasive.'
    mithril_longbow: "Built from a stormhawk's own tailfeathers strung on mithril wire. The archer takes the credit. The wind, if it could talk, would have several corrections to make."
    mithril_mace: ''
    mithril_sword: 'Lined in golden fleece and so light it barely announces itself in your grip — which is precisely the problem for everyone standing on the other side of it.'
    mokan: 'A wide woven hat. Keeps the rain off and the questions away.'
    molten_verse_casque_of_glass_cathedral: "Holds one saint's fingerbone in the crest, for luck. The saint's luck is a matter of record."
    molten_verse_charm_of_rising_hymn: 'A bead of glass that never fully cools. Comforting in the hand until you forget and set it on parchment.'
    molten_verse_hauberk_of_glass_cathedral_choir: 'Issued to whoever scrubs the vitrified floors. The stains have seniority.'
    molten_verse_hauberk_of_glass_cathedral_pyre: 'Cut from the nave great curtains. Moths took the hem; the grandeur survived.'
    molten_verse_hauberk_of_rising_hymn: 'Grows warmer the longer the fight runs. Long fights end with you glowing and the enemy gone.'
    molten_verse_sash_of_glass_cathedral: 'Threaded with a ribbon of coloured glass. Pretty, until it catches the light and blinds your own eyes.'
    molten_verse_scepter: 'Extinguishes candles, lanterns and enthusiasm at range. The long handle is for the chandeliers.'
    momaku: 'A spirit-mask banner draped down the back to frighten debtors and impress no one already dead.'
    moonclad_band_of_silt_throne: 'A ring of Moonclaw shell that stays cool even in the fever-warmth of the deep weald, which the wearer clings to more than they admit.'
    moonclad_breastplate_of_silt_throne: 'Its Moonclaw plating is said to glow faintly on nights the moon shows, which this deep in the weald means never, so the claim is safe from testing.'
    moonclad_crusher_of_silt_throne: "Faced in pale shell that shows every crack it makes in white, keeping a tidy, glowing tally the wielder can't switch off."
    moonclad_pike_of_brackish_deep: 'Tipped in pale lunar shell, cold right to the point, a small comfort to whoever holds the far end in the fever-warm dark.'
    moonclad_poultice_of_silt_throne: 'Wrapped in pale shell, cold against a fever, a comfort the drowned court prized and the drowned court no longer needs.'
    moonclad_tonic_of_brackish_deep_matron: 'Bottled under the pale shell that keeps it cool, the closest thing to moonlit water anyone brews this far below.'
    moonclad_tonic_of_brackish_deep_mire: 'The mire-water base settles into layers if left to stand, which the brewer says to shake and never says what the bottom layer is.'
    moonclad_torc_of_silt_throne: 'A neck-ring of pale shell that the court wore to catch moonlight through a hall now a hundred feet under silt. It has caught none since.'
    moonclad_treads_of_brackish_deep: 'Plated in Moonclaw shell that stays cold underfoot, which is the closest thing to moonlight the wearer will feel this far down.'
    moonclad_visor_of_silt_throne: 'Plated in Moonclaw shell that catches what moonlight makes it this deep, which is almost none, so it mostly just reminds you there used to be a moon.'
    moonclaw_shard: ''
    moonfang_precision_band: 'A ring carved from a moonfang alpha claw. It guides your strikes to vital points. The moonfang taught by example.'
    moonfang_waistguard: 'A belt fashioned from moonfang alpha hide. Howls faintly during full moons. Awkward at dinner parties.'
    moonlit_choker: 'Clasped tight before the graves open at dusk. Loosened only after the watch ends.'
    moonlit_claw: "Glows faintly under moonlight, from a moonfang that was once a legend. Now it's a crafting material."
    moonlit_recurve: ''
    moonrise_boots: 'Felted from wool that still remembers being alive, and occasionally still tries to graze.'
    moonstone: 'Glows faintly under starlight which is utterly useless since miners work underground.'
    moonstone_hoe: 'Tills soil with lunar resonance. The wheat grows 12% faster. The farmer ages 12% faster.'
    moonstone_pickaxe: 'The head pulses with pale luminescence. Miners swear it finds veins on its own. The pickaxe has no comment.'
    moonstone_powder: ''
    moonstone_sickle: "Glows faintly under starlight. Herbalists claim it improves yield. Alchemists claim that's placebo."
    mules_burden: "More attachment points than a show handler's tackle box. Also heavier than one."
    muleteer_march: 'Logged more miles behind the supply column than any soldier alive. Never once lost a wagon.'
    neckoath: 'Worn by pilgrims who swore to reach the wall or die trying. Most of them are still wearing it.'
    nerak_key: "Bone, etched with runes that mutter threats in languages nobody living speaks anymore. The dead don't much care for visitors. Their locks, it turns out, feel exactly the same way."
    nerak_marrow: ''
    nerak_marrow_bow: 'Strung with a tendon Nerak shed centuries ago and never once asked after. Draw it, and the string hums the same low note his court still sings underground, whether or not you meant to join in.'
    nexus_blade: 'Forged at the causeway where three roads meet the dead. It still hums at dusk.'
    nightcap: 'A bioluminescent fungus that pulses with an unsettling azure glow, suggesting origins in caverns where sunlight is less a memory than a rumor. Alchemists covet it for its soporific properties, though the mushroom itself remains profoundly indifferent to their affections.'
    nightcap_elixir_base: ''
    nightfang_daggers: 'Twin blades that vanish in shadow and reappear in spines. Chiropractors recommend them.'
    nightfang_razors: ''
    novice_wand: 'Carved from a branch that was clearly not ready for this responsibility. Sparks occasionally. Mostly at inconvenient times.'
    null_essence: 'Liquid absence that dissolves container walls if stored too long. Enchanters pay obscene prices. Storage is your problem.'
    oblivion_saber: ''
    obsidian_arc_bow: 'Strung with waxed apron cord. The drapes fell years ago; the rod moved on to a second career.'
    obsidian_casque_of_glass_cathedral: "Domed like a chapel roof, and about as good at keeping the congregation's opinions out."
    obsidian_choir_plate: 'The armour of the inner sanctum, where only the trusted stand. Trust is issued sparingly and revoked fast.'
    obsidian_cordial_choir: 'For cooking, the label insists. The cook insists otherwise.'
    obsidian_cordial_of_rising_hymn: 'A bright ascending warmth that lifts the spirits and, briefly, the actual hair on your arms.'
    obsidian_cordial_pyre: 'One swallow and your ears ring, your eyes water, and your wounds close out of sheer intimidation.'
    obsidian_core: 'The dense middle of a glass flow. Cut it wrong and the whole thing votes to become a thousand knives.'
    obsidian_elixir_of_glass_cathedral: 'One small glass before bed. The bed is optional; the glass is not.'
    obsidian_extract: 'Polish for the great ranges. The shine lasts a week; the smell lasts a marriage.'
    obsidian_flux: 'Caustic paste that strips soot, varnish and fingerprints. Mind which of those you still wanted.'
    obsidian_psalter: 'Every recipe ends with the same instruction: leave it in until it stops screaming. Works on roasts. Works on heretics.'
    obsidian_signet: 'Presses a mark into hot wax and, given the chance, into the odd forehead. It seals things either way.'
    obsidian_stompers: 'Polished glass soles, mirror-bright. The last thing a tripped enemy sees is their own surprised face.'
    obsidianite: 'Volcanic glass that shatters into edges sharp enough to cut through both stone and career ambitions.'
    obsidianite_powder: "Microscopic shards suspended in mineral dust, with safety notices long enough to wallpaper a healer's waiting room. They are, without exception, all justified."
    ocean_grimoire: 'Written in ink that only appears when submerged. Very inconvenient study material.'
    ocean_sigil: 'Carved coral bearing talokan runes. Scholars have decoded three of the nine. The other six are worse.'
    old_hoe: 'A rustic farming tool reinforced with jagged blue antennae, their sensory hairs still twitching with residual reflex.'
    onyxium_aegis_pendant: 'Contains a preserved corvid eye that blinks when danger is near. Also just blinks sometimes. Unclear why.'
    onyxium_bastion_greaves: 'So comfortable, three soldiers fell asleep mid-battle wearing them. Command was not amused.'
    onyxium_bulwark_helm: "Crab shells rattle faintly in combat. Veterans call it 'the applause'. It is not applause."
    onyxium_caravanner_mail: 'Worn by a Cinder Shade that hauled goods along the fault roads and never once got mugged, on account of the smell. Trade caravans still hire the pattern, if not the source.'
    onyxium_cleaver: ''
    onyxium_conduit: "Crowned with a living kweebec leaf and wrapped in magmooligan wood. It hums when it's ignored."
    onyxium_crit_band: 'Pressed from the still-hot core of a Cinder Shade, cooled just enough to wear without regret. Runs warm against the skin in a way that sharpens focus at exactly the wrong moments.'
    onyxium_crushfists: 'Built to end a charge in one exchange. Rarely needs a second.'
    onyxium_edge: ''
    onyxium_fortress_girdle: 'Made from the fur of a creature so lazy it evolved armor instead of moving away from danger.'
    onyxium_fortress_plate: 'Assembled from tribal relics by someone who valued survival over subtlety. It shows.'
    onyxium_greathelm: 'Peripheral vision traded for a jaw that stops most things.'
    onyxium_guardian_mace: 'Standard-issue to the tomb wards. Dents outlast the wielder.'
    onyxium_hatchet: ''
    onyxium_hauler_boots: "Worn by a Cinder Shade that hauled ore up a slope that shouldn't have been climbable while smoldering the whole way. Doesn't tire. Does occasionally smoke."
    onyxium_iron_wall_grips: 'The scales still flex when you clench a fist, like the original owner never quite let go.'
    onyxium_ironfoot: 'Infused with Koa essence. The eyes on the buckles follow you around the room. Politely.'
    onyxium_loadbearer: "Tanned from a Cinder Shade hide using a process that involves smoke, patience, and a working understanding of things that shouldn't still be warm. Holds more weight than it looks like it should."
    onyxium_longbow: ''
    onyxium_packmule_grips: 'Finger-guards molded on the forelimbs of an ember-carrier Cinder Shade: one continent crossed, zero embers dropped. Whatever you hold stays held until the Shade would have let go.'
    onyxium_porter_legguards: 'One Cinder Shade knelt a century at the same forge; the knee plates carry that wear. Good for hauling uphill. For kneeling anywhere else — never again.'
    onyxium_sages_locket: "Found coiled at the neck-ridge of a Cinder Shade, warm centuries on. It keeps its wisdom close to its chest — yours too, while it's at it — and pays the whole debt back in raw endurance."
    onyxium_scholars_visage: "The brow-ridge of some deeply thoughtful Cinder Shade, judging by the wear. Keeps you awake through endless councils. Scholars credit the design. It's the heat."
    onyxium_spirit_club: 'A gravewisp nests in the head. It only glows when something is dying nearby.'
    onyxium_striders: 'Issued to whoever draws the furthest post. The walk back is longer than the walk out.'
    onyxium_trident: ''
    onyxium_war_signet: 'Given to whoever survives the muster roll intact. Rotates more than it should.'
    onyxium_warbelt: 'Worn through three campaigns and re-buckled for a fourth. The leather remembers all of them.'
    onyxium_warblade: "Smithed to the pattern a Cinder Shade's own claw-ridge left in cooling lava, which is either brilliant reverse engineering or a coincidence nobody's willing to test twice."
    onyxium_warchain: 'Each link stamped with a campaign. Nobody has counted them all.'
    onyxium_ward_ring: "The embedded eye sees things you'd rather it didn't, and judges your choices freely."
    onyxium_wargreaves: 'Scored where the kneeling happens. The marsh takes its toll on posture.'
    onyxium_warplate: 'A full plate of salvaged war-steel. Getting into it costs more than getting out.'
    orb_of_purity: "Every mother in the Palewood warns her children about the orb that lets you start over. One squeeze, and you're reborn spotless, innocent, and thoroughly clueless. Magical amnesia is still amnesia; it just has better manners."
    orchid_spore_blend: 'Ground orchid petals blended with crushed spores in a process that smells worse than the result tastes.'
    origin_composite: 'Pressed from the oldest fibers on the mountain into something that refuses to behave like its age. Suspiciously springy for a relic.'
    origin_crest_of_world_wound: 'Marked with the line the world tore along, so the wearer never forgets which way is down. Down, here, being a direction with opinions.'
    origin_philter_of_world_wound_genesis: 'Measured out by the Wound Oracle, who never explains the dose and has never yet been wrong about it. Trust is the only ingredient you supply.'
    origin_philter_of_world_wound_scar: 'Mixed to the rhythm the Scar Chanters keep, one measure per line of their song, which is why no two batches taste identical and none are ever rushed.'
    ornate_bronze_legplates: "The hornhead whose horn adorns these legplates charged seventeen times before the blacksmith got the hint. The eighteenth charge was the hornhead's last, and the blacksmith's finest hour."
    ornate_bronze_plate: "The hornhead charged into battle headfirst. This is what's left of that plan."
    packrat_thinking_cap: "Extra pockets on the inside. Nobody in the show ring asks what's in them."
    padded_boots: "Extra padding for when you step on things you shouldn't. Which, in this world, is basically everything."
    padded_coif: "Stuffed so thick it muffles blows and thoughts alike. You'll stand forever, wondering why."
    paragon_spellbook: ''
    parrot_hat: 'It is a parrot. On your head. It does not talk, which is somehow worse.'
    patchwork_trousers: 'Sewn from whatever fabric was lying around. Each leg is a different color. Fashion statement or cry for help?'
    patience_amulet: 'The Slothian waited a hundred years for a worthy owner. It is still, technically, waiting.'
    patience_charm: ''
    patience_club: "It travels slowly, the way everything a slothian does travels slowly, and lands like the ground itself changed its mind about staying put. Nobody's ever accused it of being in a hurry."
    pearl_shard: "A cracked pearl fragment from inside a hermit crab's shell. Worth something to jewelers, nothing to the crab."
    pearl_shard_mace: 'Studded with crab pearl fragments. Every hit sounds like wind chimes at a funeral.'
    pearl_shard_pendant: "A cracked pearl from an oyster that reportedly fought back. The harvester lost two fingers and gained a healthy respect for bivalves. The pearl glows faintly underwater, which is beautiful and completely useless given that you can't breathe there."
    pebble_pendant: "A smooth river pebble on a string. The jeweler called it 'minimalist design'. Everyone else called it a rock."
    pet_admin: ''
    pet_aloe_gaia: 'A medicinal variant, oozing a soothing sap that treats small cuts, sunburn, and wounded pride. Every scratch gets treated like a mortal wound — it hovers anxiously until the concern is acknowledged. The sap tastes awful, which it insists is preventative.'
    pet_amber_cactee: 'Smells like ancient pine forests and poor life decisions. Occasionally traps flies in its resin.'
    pet_anorak: "The emerald runes etched into this arachnid's carapace pulse with the bound essence of Aragog, the great spider reduced to a manageable size."
    pet_arcane_gaia: 'A Gaia specimen inscribed with luminous arcane runes that pulse in sequences no living scholar has managed to decode, though several have published competing translations ranging from profound cosmological truths to what appears to be an inventory manifest. It carries burdens with the dignified resignation of a creature that suspects it was meant for greater things.'
    pet_arcanite_cactee: 'Hums a lullaby in frequencies that put small animals to sleep and give wizards migraines.'
    pet_arcanize_bricheton: 'Runic patterns crawl across its hide in sequences scholars identified as an ancient grain inventory system.'
    pet_arisen_bouloute: ''
    pet_arisen_corbac: ''
    pet_arisen_lootbox: ''
    pet_arisen_modni: ''
    pet_arisen_timon: ''
    pet_barley_bricheton: 'Its digestive system converts barley into loyalty at a conversion rate that economists find deeply troubling.'
    pet_blood_bricheton: 'Its eyes catch crimson after dark, and it takes a keen, sustained interest in your pulse. Healers call the habit worrying. Necromancers call it a compliment, and insist you should too.'
    pet_bloodstone_cactee: 'Its needles stay permanently crimson. Veterinarians decline to examine it, as a rule.'
    pet_bouloute: ''
    pet_burnt_bricheton: 'A soot-covered companion whose proximity provides warmth in winter and a persistent fire insurance problem year-round.'
    pet_chomperion: ''
    pet_chromafin: ''
    pet_corbac: ''
    pet_cryofin: ''
    pet_cursed_bricheton: 'The apex companion of the farmer profession, a warthog so steeped in agricultural malediction that crops wilt as it passes.'
    pet_cursed_gaia: "The apex companion of the herbalist profession, a Gaia so thoroughly permeated by cursed fungal energy that it murmurs unsolicited commentary about the weight distribution of its owner's inventory in languages that predate recorded history. It is an unparalleled beast of burden whose loyalty is absolute and whose nocturnal whispering is, according to those who have survived prolonged ownership, something one eventually stops hearing."
    pet_cursed_gem_cactee: 'Mutters dark prophecies about inventory weight while loyally carrying your stuff. Conflicted creature.'
    pet_deadmaw: 'Hades seldom lends his hounds to mortals, yet this scorched beast now pads faithfully alongside a new master.'
    pet_diamantine_cactee: 'A crystalline cactus no larger than a fist, perpetually vibrating at a frequency that makes nearby glass nervous. It feeds on raw diamond and judges you silently for your mining technique.'
    pet_doris: ''
    pet_draconite_cactee: 'Radiates heat like a furnace with feelings. Terrible for your leather satchel, wonderful for cold nights.'
    pet_draconize_bricheton: "A scaled warthog that looks at you like it's the dragon and you're the reincarnation joke."
    pet_dragon_gaia: 'Imposing, iridescent, and one bad mood away from redecorating the camp.'
    pet_duskite_cactee: 'Old story: a candle went out in the deep gallery and never came back on — this is what grew where it stood. Perfect for vanishing mid-argument. It has never once helped anyone win one.'
    pet_ensable_crayfish: ''
    pet_gaia: "A gentle spirit of the earth, bound to safeguard the land's treasures from those who would plunder them recklessly."
    pet_heraklion: 'The infamous Skeleton Lord Nerak bred these hounds to hunt the living, their hollow ribs echoing with an appetite that death alone could not satiate. Domestication remains... inadvisable.'
    pet_ice_corgi: ''
    pet_ivory_gaia: 'An earthbound guardian spirit, sworn to keep buried riches away from careless plunderers.'
    pet_jade_cactee: 'Remarkably serene for a walking cactus. Meditates at inappropriate times like during combat.'
    pet_jones: "Pray its appetite for worship exceeds its appetite for its own keeper's fingers."
    pet_krinan: ''
    pet_lasgalen_rabbit: ''
    pet_lootbox: ''
    pet_malt_bricheton: 'Permanently smells of fermentation and carries your goods with the unsteady gait of a creature that sampled too much of its feed.'
    pet_melted_koa: 'Found curled by a cooling pyre. Refuses to leave the warmth.'
    pet_modni_lyk: ''
    pet_moonstone_cactee: 'Only visible during full moons and overcast Tuesdays. Nobody has figured out why Tuesdays.'
    pet_moray: ''
    pet_nightcap_gaia: "A nocturnal variant of the Gaia species that has adapted to perpetual darkness with an enthusiasm that borders on philosophical commitment, carrying its owner's possessions through lightless corridors while radiating a silent and comprehensive disapproval of every decision that led to this arrangement."
    pet_obsidianite_cactee: 'Every spine is glass-sharp and entirely serious about staying that way. The old warning painted on its crate has one line, and the line is correct: do not hug.'
    pet_ocean_lootbox: ''
    pet_phacochere_son: 'The runt of the litter, following its parent everywhere except into anything actually dangerous.'
    pet_phantom_gaia: 'Grandmother swore her nanny-goat walked through the cellar wall every full moon and came back smelling of spores. Nobody believed her until the goats started doing it themselves. This one still prefers the wall to the door.'
    pet_quartz_cactee: 'A pale little cactus whose spines set into cloudy crystal. It hums quietly near ore veins, mostly to itself.'
    pet_radient: 'A primal hunter whose luminous fur blazes with the captured essence of celestial light.'
    pet_rock_koa: 'Rock Koa: a koa that took "grow thicker skin" as a literal engineering brief — weighs a scandalous amount, sinks like a verdict, wins every staring contest by geology.'
    pet_siluri: "The last of an ancient lineage, this weathered creature carries the weight of millennia upon its timeworn shell. Legend claims it still hasn't forgiven the mammals for the whole 'extinction' business."
    pet_suize_bricheton: 'Its crystal tusks chime in the wind, in a melody every other bricheton finds deeply personal.'
    pet_talokan_feu: ''
    pet_tanjirize_bricheton: 'A copper-furred pack beast that attracts spice merchants and repels personal space at approximately equal rates.'
    pet_timon: ''
    pet_tokeko: ''
    pet_truffle_gaia: 'A Gaia whose nose was refined so far past reasonable that it now finds you personally offensive.'
    pet_ukranize_bricheton: "Bred, the herders say, from a beast that once carried a starving village across three winters without complaint. It hasn't complained since. It also hasn't once let you pack light."
    pet_vainquished: ''
    pet_velkarion_wyrmling: ''
    pet_wheat_bricheton: 'A miniature warthog that has imprinted on wheat fields and considers your inventory an extension of its territory.'
    pet_wind_koa: 'Wind Koa: a koa so aerodynamic it occasionally forgets to stay — tethered with a string, mostly, and it hums when the pressure drops just to gloat about being right.'
    pet_wither_gaia: "Wherever it walks, the flowers arrange themselves into something almost too lovely to call dying. A devoted pack animal, provided you've made peace with what it does to a garden by teatime."
    pet_zot: ''
    phacochef_tusk: "A colossal tusk shattered from Phacochef's skull during its final charge. The impact crater where it broke off is reportedly still smoking."
    phacochere_key: "Carved from a warthog tusk and sealed with mud. Smells exactly how you'd expect a key to a pig dungeon to smell."
    phantom_distillate: ''
    phantom_essence: ''
    phantom_razors: 'So thin they barely exist. Victims only notice the cut when they try to pick something up and realize they have fewer fingers.'
    phantom_spore: "Half in this world and half wherever spores go when they'd rather not be touched, they slip through unworthy fingers like a rumour slipping through a closed door. Harvesting them takes an empty mind — a state most herbalists reach only by accident."
    piranha_amulet: "Teeth from a fish that eats everything, including its own school's feelings."
    piranha_cleaver: "Serrated with true piranha teeth, still apparently under the impression that everything in front of it is a meal. In fairness, so far, it hasn't been wrong often."
    piranha_tooth: ''
    plague_fang: "A jagged rat tooth coated in something you really don't want identified. Handle with thick gloves. Thicker."
    plague_fang_signet: 'The jeweller who set this fang into a ring setting wore gloves. Then thicker gloves. Then tongs. The fang seemed to take it personally.'
    plague_mace: 'Carries a faint green glow and an unfaint green smell. The business end is coated in something that healers refuse to identify.'
    plague_razmo_fang_blades: 'Standard vermin-work blades. The barrow rats bite back; these bite first.'
    plague_treads: 'Every footprint fades green after an hour. The plaguemo considers this a signature, not a symptom.'
    plaguefang_blade: "Tempered in extract drawn from a plague fang, with an edge that's gone a colour metallurgists have strong, worried opinions about. It cuts fine. It's the aftercare nobody wants to discuss."
    plaguemo_boots: 'The tanner who cured these hides survived three separate plagues and one deeply awkward rash.'
    plaguemo_skullcap: "Fashioned from the plaguemo's own cranial plate, which was, somehow, the least concerning part of the process."
    plainsteel: 'No engraving, no gilt, no clever name until someone else gave it one. The steel never asked for the attention.'
    pocari_sweat: ''
    polar_fortress_plate: 'So heavily armored, mobility becomes a rumor. Nothing gets through. Including you, eventually.'
    polar_reaver_breastplate: "Taken off a raider who mistook the marsh for open ground. It wasn't."
    polar_reaver_greataxe: "The captain's weapon of choice. Nobody stays neutral once it swings."
    polar_reavers_crook: "Once a shepherd's staff, now a thief's. The sheep were the lucky ones."
    polishing_resin: ''
    pollen_mote: 'A single grain of floating pollen that never quite agrees to land.'
    practice_longsword: 'A blunted training blade. The only thing it cuts is your dignity when someone sees you wielding it.'
    praetorian_oath: 'Sworn before the standard fell. Nobody released it from service.'
    preserving_oil: 'Prevents organic materials from decomposing. Bakers use it to keep bread fresh. Necromancers use it for other things.'
    primal_catalyst: 'Endgame universal reagent that combines all four elemental essences. Required for legendary-tier equipment across every craft job.'
    primeval_codex: 'Bound in pages older than the fracture itself, the only known record of what the zenith looked like whole. The Deep Auditors have spent generations arguing over the last chapter.'
    primordial_band_of_first_dawn: "Older than the finger it's meant for by a margin that makes the wearer feel briefly, healthily small."
    primordial_bone: ''
    primordial_cleaver: 'Older than most of the doctrines it was used to end. The grip runs warm for reasons the prophet who carried it never explained and the current owner has stopped asking about.'
    primordial_draconize: ''
    primordial_lance: 'An ancient weapon that predates most civilizations. Still sharper than your average political debate.'
    primordial_legplates: 'Salvaged after the fourth push failed. The fifth wore them anyway.'
    primordial_poultice_of_first_dawn: "Packed with moss that only opens at first light, so the wound underneath heals on a schedule the sun sets and you don't."
    primordial_tonic_of_last_ascent_genesis: "Steeped from the oldest living moss anyone's found, which regrows the moment it's picked and appears mildly annoyed to be brewed."
    primordial_tonic_of_last_ascent_scar: "The cheap draught sold at the foot of the climb to anyone who thinks a bottle will make the mountain shorter. It won't. It helps a little with the parts that hurt."
    primordial_totem_club: "Carved by whoever prophesied here before the sundering made prophecy mostly redundant. The totem's face has worn smooth from being right too often."
    primordial_treads_of_first_dawn: "Cobbled from leather older than the trade of cobbling. It creaks a language, and the cobblers who'd translate it are all long gone."
    primordial_trident: ''
    primordial_warblade_of_last_ascent: 'Reforged so many times the smiths lost the original under the repairs. Whatever it started as, it is now entirely made of the intent to keep swinging.'
    primordial_worldpiercer: 'The last thing you craft before the L100 gate, and the first thing that survives it.'
    prisma_arcane_crown: 'Forged from the pincers of a crab that pinched exactly the wrong archmage. The ghost still complains.'
    prisma_bastion_mace: 'Issued to whoever held the line last. That was a long time ago.'
    prisma_convergence_amulet: 'Each link is a separate Cinder Shade ember, cooled and joined by someone with more patience than sense. Getting them to glow in unison takes a very particular kind of stillness.'
    prisma_dual_plate: 'Two half-plates from two different Cinder Shades, forge-welded along a seam that still glows faintly on cold nights. Neither half remembers agreeing to this.'
    prisma_dual_sash: "Two Cinder Shade hides layered against each other, each one insulating exactly what the other one can't. The overlap runs warm enough to dry laundry."
    prisma_elementalist_grips: 'The last heat of one Cinder Shade, folded into leather before it could finish cooling. Palms stay warm through any winter. Handshakes get awkward.'
    prisma_ember_band: 'Warm from the forge long after it left it. Never fully cools, like everything else here.'
    prisma_emberstep: 'Leaves a faint scorch with every print. Fades by the time anyone thinks to follow it.'
    prisma_flameguard: 'Fired in the pits where the pyre priests burn the dead. Never fully cools.'
    prisma_flameheart_pendant: 'Worn beneath the armor, close enough to feel the pyre through the plate.'
    prisma_flamelegs: 'Worn closest to the pyre pits. The hem never stops smoking.'
    prisma_gale_sash: 'Tied on for the final muster. The names read that day are still recorded somewhere.'
    prisma_gale_vest: "Worn on the final rotation before the marches went quiet. It's still quiet."
    prisma_hybrid_crown: 'Part hood, part crown, wholly undecided — no Cinder Shade silhouette ever commits to one shape either. The indecision is load-bearing.'
    prisma_longsword: 'Bear claws for a crossguard, stormfeathers in the fuller. Beautiful. Deeply unbothered by your opinion.'
    prisma_mace: 'Studded with fangs and wrapped in stolen fleece. Amplifies every grudge behind the swing.'
    prisma_sabre: "Pack-hunter honed. Alone, it's just very sharp; it prefers company."
    prisma_spellbinder_sash: 'Threaded with the same signal-code as the gloves. Reads faster than it should.'
    prisma_spellweave_gloves: 'Marked with the old signal-code the pyre priests used. Fingers move faster than the reading does.'
    prisma_stormheart: 'Kept warm by whoever called the last roll. Still keeps time with a pulse no one else can hear.'
    prisma_stormlegs: 'Cut for the last column to march the line. It did not come back.'
    prisma_tempest_ring: 'Worn on the last rotation before the posts went silent.'
    prisma_tidal_treads: 'Cast in the vents a Cinder Shade favored for warming its feet between patrols. Stay hot for weeks after crafting, which the smiths list as a feature and the wearers list as a complaint.'
    prisma_tide_signet: "Stamped with what passed for a face on one particular Cinder Shade before the fire finished its edits. Sealed documents arrive smelling faintly of char. Recipients don't ask."
    prisma_tidewalker_legs: 'Cut from the Cinder Shade that stood still until the ground memorized its shape. Agility drains out through the soles; endurance floods in to replace it. Running stops being on the menu.'
    prisma_windcrown: 'Given to whoever called the final roll. No one answered the last name.'
    prisma_windweave_grips: 'Worn by runners who carried word between the tomb lines. None of them stopped running.'
    prisma_zephyr_boots: 'Broken in by runners who carried word faster than the war moved.'
    prismatic_saber: "An ember core beats in the pommel, pulled off a Cinder Shade still warm when the smith reached it. The blade recolors itself to the wielder's mood, consent not required."
    pristine_malt: ''
    pyre_ash: 'A dustpan of cathedral floor: ash, glass glitter, and one lost earring per shovelful.'
    pyre_chain_girdle: 'Links that idle warm and turn hot the second you fight. It keeps your trousers up and your enemies wary.'
    pyre_channeler_staff: 'Carried by the pyre priests. Ash never quite settles around it.'
    pyre_cleaver: 'The cinder heart embedded in the pommel keeps the edge permanently hot. Great for combat. Terrible for scabbards.'
    pyre_crown_fragment: "A piece of the Cinder Tyrant's head ornament. Radiates authority and extreme heat. Followers form involuntarily near it."
    pyre_handler_mitts: 'Stitched for the kiln that fires the choir glass. Hold anything. Regret nothing.'
    pyre_walkers: 'Soled thick enough to cross the coal beds at a normal pace. Normal, for this posting.'
    pyrecleaver: 'Technically for firewood. The congregation files past it very politely.'
    pyreguard_cuirass: 'Scorched at the collar from standing closest to the burning. Never once burnt through.'
    pyrehymn_cuirass: 'Fired, not forged. It came out of the furnace already sick of your problems.'
    pyrehymn_draught_of_cooling_vent: 'Bottled from the steam off a cooling vent. Tastes of minerals and mild regret. Revives all the same.'
    pyrehymn_gauntlets_of_ashen_song: 'Tea towels wound tight to the wrist. Somewhere a kitchen drawer misses them terribly.'
    pyrehymn_girdle: 'A band of scorched leather that stops a blaze at the waist. It has stopped several. It shows.'
    pyrehymn_greaves_of_cooling_vent_choir: 'Cast from cooled runoff, flaws and all. The flaws are load-bearing now, so leave them be.'
    pyrehymn_greaves_of_cooling_vent_pyre: 'Slotted to vent the heat downward, so your boots take the brunt and say nothing.'
    pyreward_diadem: 'Warm on the brow at all hours. On the day it runs cold, run too.'
    quartz: 'A cloudy crystal that vibrates at frequencies only pretentious alchemists claim to understand.'
    quartz_choker: "A polished quartz stone set in a wire frame. Vibrates gently when magic is nearby. Or when it's windy."
    quartz_powder: 'Ground quartz mixed with diamond dust. Sneezing near it is strongly discouraged.'
    quickbite: "Three strikes in the time it takes to notice the first one. The Scar's wildlife has stopped waiting to find out."
    quickstep_sash: 'More decoration than defense. But it looks fantastic while dodging.'
    quillbound_cord: 'It holds up under scrutiny, barely, a claim that has never once been tested.'
    quillweave_grips: 'It performs adequately, by its own admission, which the wearer has decided to take on faith.'
    ramrage_sash: 'Woven from ramrage wool. Nearly indestructible. The smell, however, is eternal.'
    ramrage_waraxe: 'Balanced by a ramrage horn counterweight. Balanced is relative when the axe weighs forty pounds.'
    ramrage_warhelm: "Decorated with ramrage horns. Doorways become a genuine test of the crowd's patience."
    rangers_longbow: "A proper longbow made by someone who almost knew what they were doing. The 'almost' is load-bearing."
    raptor_bone_bow: "Carved from a raptor's own ribs, still holding the shape of its final furious charge. Every arrow leaves the string fast, angry, and utterly unconcerned with your opinion of the matter."
    raptor_claw: ''
    raptor_hide_boots: "Raptors are nature's way of reminding you that everything in the food chain is someone else's footwear. These ones still twitch when they smell prey."
    raptor_javelin: 'Tipped with a raptor claw that has seen better days. And worse prey.'
    raptor_scale_greaves: 'The donor raptor objected at roughly forty miles an hour. It did not catch up.'
    rat_bile: "Extracted from the rat's spite gland. Scientists insist this gland doesn't exist. The rats disagree."
    rat_trousers: 'A patchwork garment fashioned from rodent hides, each seam telling the story of a desperate struggle beneath the city streets. Wearing them is proof that dignity is the first casualty of poverty.'
    raven_beak: ''
    raven_coif: 'The archaeopteryx that shed these feathers left, in essence, a promise of future revenge.'
    raven_eye_pendant: "Amber-sealed and copper-bound, it grants the wearer a hawk's patience and a vulture's judgment."
    raven_flight_bow: 'Fletched from feathers shed mid-dive. The arrows still remember which way is down.'
    raven_grips: 'Feran-fur lined and taloned to match. The ferans have not forgiven the tailor.'
    raven_hauberk: 'Feran pelts: ethically dubious, structurally unimpeachable, and reportedly machine-washable, though nobody has dared.'
    raven_trousers: 'Fur below, feather-down lining above. Deeply unsettling in a mirror, somehow perfect in motion.'
    rawhide_belt: "Untanned leather that smells faintly of existential dread and damp animal. A tanner's first real project."
    razendril: "A rat's fang, meticulously carved into a blade of surprising elegance and lethality."
    razlord_trophy_belt: 'Hung with tokens taken off things that no longer needed them. Heavier every season.'
    razmaster_grudge: 'Taken off a barrow rat that had clearly been bitten first.'
    razmaster_longsword: 'The Razmaster settles all disputes the same way. This blade is the closing argument.'
    razmo_bone_pike: 'Carved from a razmo femur. The teeth marks are a feature, not a flaw.'
    razmo_pelt: 'A scraggly rat hide. Leather workers accept these but they will absolutely judge you for it.'
    razmoket: 'The severed tail of a common sewer rat, still bearing traces of the filth it once dragged through dank tunnels.'
    razord_fangblade: 'Forged around a fang that refused every attempt to melt it down. The smiths built around it instead.'
    razord_skullcap: "Razord feathers line the interior, and the wearer's opinions grow noticeably sharper."
    razorfang: 'Carved from the oversized fangs of sewer-dwelling vermin, these jagged blades carry the curse of pestilence.'
    reaver_visage: 'Worn by polar reavers who patrol the ice wastes. The frost runes carved into it are purely decorative. Mostly.'
    recurve_practice_bow: 'The recurve adds power. The shoddy craftsmanship removes it. Net result: slightly better than throwing rocks.'
    red_gaia: "A gentle spirit of the earth, bound to safeguard the land's treasures from those who would plunder them recklessly."
    red_orchid: 'This crimson orchid retains its vivid hue even after prolonged baking, its petals as thick as cured leather.'
    refined_solution: ''
    reforged_ember: 'Scraped sulphur, candy-red and eager. One strike, no refunds.'
    regalfall_breastplate_of_empty_seats: 'It functions, technically, in most conditions, which is exactly as reassuring as it sounds.'
    regalfall_grips_of_empty_seats: 'It works, provisionally, pending further review, a small mercy, considering the alternative.'
    regalfall_legguards_of_silent_court: 'Its warranty is void the moment you question it, a detail everyone involved has agreed to forget.'
    regalfall_tonic_of_silent_court: "Its effect kicks in, or it doesn't, unpredictably, so drink at your own risk, formally speaking."
    regalfall_warbelt_of_silent_court: 'The instructions were lost in a heated debate, so the original argument was declared a draw.'
    regent_ore: 'Two separate reports describe it in contradictory terms, which changes depending on the season and the asker.'
    regent_spellbook: ''
    reinforced_mitts: 'Metal studs on the knuckles add both protection and a menacing aesthetic. Handshakes become a statement.'
    relic_aragog: 'The Mother of Spiders shed this fang voluntarily — and by voluntarily, we mean someone pried it out while she was digesting a particularly large adventurer. It still drips with venom that makes your enemies reconsider their life choices.'
    relic_chairman: ''
    relic_dragon_fire: 'The dragon died centuries ago. Nobody told the central heating. Somewhere under the nave it still burns on schedule, and the radiators knock twice before every service.'
    relic_dragon_frost: 'A single crystallized tear shed by a frost dragon during what witnesses describe as an emotional disagreement with a glacier. The tear never melts, never warms, and has been known to make drinks uncomfortably cold from across the room. Alchemists have tried to study it, but their instruments keep freezing shut.'
    relic_dragon_void: 'Wrenched from a dragon that had been consuming void energy so long it forgot what sunlight tasted like. The jawbone hums with a frequency that makes furniture rearrange itself and causes anyone nearby to suddenly remember every embarrassing thing they have ever done. Warriors who carry it report feeling significantly stronger, though also significantly more existentially unsettled.'
    relic_duke: ''
    relic_ensable: 'Runs backward more often than forward. No warranty, express or implied, comes with it.'
    relic_fenrik: ''
    relic_gobeline: 'The goblins venerate this artifact with the same fervor they apply to not being eaten — meaning desperately and without dignity.'
    relic_guardian: ''
    relic_koa: ''
    relic_kraken: 'Plucked from a leviathan so ancient it remembers when the sea had a different color.'
    relic_magmalug: ''
    relic_nerak: "Said to be cut from Nerak's own spine by a bone-merchant who turned to dust mid-sentence, which the court considers the single most convincing review it's ever received. Wear it and the wind starts telling you things. Best not to answer back."
    relic_pale_weaver: ''
    relic_past: 'An echo from a forgotten age. This artifact was once forged in the crucible of creation, but its maker has since vanished from all known realms. Only a faint hum of ancient power remains — a whisper of what once was.'
    relic_phacochef: 'Ripped from the maw of a boar so stubborn it once headbutted a mountain and won. The stench alone grants its bearer supernatural toughness — or maybe everyone just stays far away.'
    relic_ramrage: ''
    relic_razmo: ''
    relic_rex: ''
    relic_rrexn: "The maker's notes consist entirely of crossed-out ideas, and somehow that's still considered a success."
    relic_seraph: ''
    relic_wanilla: ''
    reset_spells_scroll: "Contains forbidden knowledge so earth-shattering that your brain simply chose violence and deleted your OS entirely. At least you'll finally forget that embarrassing thing you said at the tavern."
    resonance_band: 'Rings by itself the instant a matching note sounds nearby. Handy warning, unless the note is your own funeral.'
    resonant_pike: 'The head wore out three centuries back. The handle refuses retirement.'
    rex_bone_cuisses: 'Thigh guards reinforced with rex bone plating. Walking is a workout. Running is aspirational.'
    rex_bone_signet: 'Carved from rex bone with a fang inset. Pressing it into wax leaves a mark. Pressing it into enemies leaves more.'
    rex_fang: 'A tooth longer than your forearm. The rex that grew this was very large and very angry. In that order.'
    rex_fang_claymore: 'A rex alpha donated its largest fang. Involuntarily.'
    rex_hunter_longbow: 'Designed specifically for rex hunting. The rex hunters who tested it were never seen again, but the bow came back.'
    rex_jawbone_cleaver: 'A cleaver made from a rex alpha jawbone. The teeth along the edge are original.'
    rex_jawbone_talisman: 'A single rex fang, polished and mounted as a talisman. The previous owner was not a rex. The one before was.'
    rex_knuckle_guards: 'Reinforced with rex fang fragments on the knuckles. Punching things now counts as prehistoric.'
    rex_ribcage_plate: 'Fashioned from the ribcage of a rex alpha. The crafters insist it was already dead when they found it.'
    rex_scale_breastplate: 'Peeled scale by scale off something that ruled the food chain and knew it.'
    rex_sinew_belt: 'Woven from the sinews of a rex alpha. Holds your armor together and your organs inside. Multitasking.'
    rex_stompers: 'Reinforced with rex bone. Every step sounds like a minor earthquake. Subtlety was never the plan.'
    rex_tooth_talisman: 'Grants courage, allegedly. Mostly grants a permanent crick in the neck.'
    rift_torn_band_of_split_sky: "Set with a sliver of a Riftling's shed shell, still faintly warm from a molt that finished weeks ago. Catches light wrong, on purpose, same as the creature that grew it."
    rift_torn_breastplate_of_split_sky: 'Turns aside the gale, most blades, and precisely none of the existential vertigo.'
    rift_torn_crusher_of_torn_ground: "Holds a grudge the way a Riftling's shell holds a crack: slowly, then all at once, then permanently. Downhill swings are recommended. Uphill swings are also technically possible."
    rift_torn_extract: 'Weeps from the torn ground in slow beads. Collect it patiently or not at all.'
    rift_torn_grips_of_torn_ground: 'When the floor stops being reliable, you learn to grab things. These grab back.'
    rift_torn_legguards_of_torn_ground: "Salvaged from a Riftling molt that never fully hardened. Bends at angles a knee shouldn't, which is the point — the ground here doesn't stay flat long enough to argue with."
    rift_torn_tonic_of_torn_ground_faultline: 'A rush of vigour that hits like the floor coming up to meet you, which it also might.'
    rift_torn_tonic_of_torn_ground_void: "Voidmoths line their burrows with something that isn't quite dust and isn't quite light. Distilled, it fills the stomach and empties the head, in that order."
    rift_torn_twin_knives_of_torn_ground: "Two blades grown from the same Riftling molt, still arguing about which one is the original. The gap between them is exactly where an opponent's plan stops fitting."
    riftsteel: 'Forged in the seam where two worlds grind. It remembers the pressure and holds a grudge.'
    riftsunder_blade: "The first strike is polite. It's the next four your ribs will want to discuss."
    riftsunder_cleaver: "Splits whatever it hits into a clean 'before' and 'after,' the same way the Riftling it's named for split from its own molt-line. A 'later' is rarely part of the outcome."
    riftsunder_cuirass_of_widening_crack: "There's a seam down the front that grows a hair's width every season, tracking the same crack that split the Riftling it came from. Nobody's told the wearer yet. Someone should."
    riftsunder_draught: 'Drawn from the hollow of a Riftling bone, which is hollow because the Riftling is, in a structural sense, not entirely finished existing. One dose buys one clear decision.'
    riftsunder_extract: 'Pulled from as far down the fault as a rope and a brave idiot will reach.'
    riftsunder_fangs: 'Small wounds. Lots of them. The bleeding does the negotiating.'
    riftsunder_helm_of_last_tremor: "The final tremor a particular Riftling ever caused left a hum in this shell-casque that hasn't faded since. Outlasts hearing. Then, presumably, outlasts you."
    riftsunder_lattice: 'A frozen ripple of stone caught mid-collapse. It looks temporary. It has looked temporary for centuries.'
    riftsunder_ration: 'Baked to the recipe a Sundered Soldier company followed before the company stopped being whole. Dense enough to use as a weapon. Some did.'
    riftsunder_ration_of_last_tremor: 'Whatever a Riftling eats between molts, dried and pressed into bars. Keeps for years. Tastes like the inside of a very old drawer.'
    ring_of_the_worldeater: 'Pried from a socket too large to be a finger and worn anyway, on a chain instead. The Worldeater ate seven worlds before anyone checked whether it was simply hungry. Nobody has checked since.'
    ringfast: "Doesn't come off. This was explained to every buyer, clearly, before the sale. Most buy it anyway."
    riven_casque: 'Sold at a discount on account of the missing left third. Aim your enemies accordingly.'
    riven_charm: "Cracked clean along the same line a Riftling's shell cracks at first molt, and just as considered lucky for it. The logic doesn't travel well outside this world. Here, it's gospel."
    riven_chausses_of_long_collapse: 'The half-molted legs of a Riftling caught mid-collapse, still bent at the angle of the fall that finished it. Wearers report the same knee giving out, on schedule, forever.'
    riven_longsword_of_long_collapse: 'In this world gravity is a suggestion, so a downswing takes about a week to land. Pack a lunch.'
    riven_saber_of_screaming_rift: "Cut from a Riftling's own severed limb-blade, still keening faintly at the frequency of the rift it came from. Coroners describe the sound it makes on impact as 'unhelpful.'"
    roadworn: 'Walked the pilgrim road so many times the leather forgot it was ever new. It remembers every mile since.'
    root_cellar_key: 'Rattles with a cold draft no cellar should produce. The Cellar Maw minted a hundred of these; it has never once needed to use a lock.'
    roothold_treads: "You will not be moved. Not because you can't. Because you won't."
    rotted_flesh: 'Peeling off a zombie is easy. The smell lingers for weeks. Your party members will remember this betrayal.'
    rough_mitts: 'Thick leather mittens that sacrifice dexterity for warmth. Gripping a sword is now a team sport with your hands.'
