title: WebGPU is unavailable
body: 'The world requires WebGPU and a secure connection (HTTPS or localhost). Open it in a supported browser.'
engine_graphics_failure: Graphics could not start. Check your browser’s graphics settings or update your graphics driver, then reload.
graphics_help:
  firefox_update: 'You are using Firefox {version}. WebGPU needs Firefox {required} or later: open the menu, then Help → About Firefox to update, and reload.'
  firefox_unsupported: 'Firefox does not support WebGPU on this system yet. Open the game in Chrome or Edge.'
  firefox_settings: 'In Firefox Settings → General → Performance, clear “Use recommended performance settings” and turn on “Use hardware acceleration when available”, then restart Firefox. Intel Macs are not supported yet: use Chrome or Safari 26.'
  safari: 'WebGPU needs Safari 26 or later. Update to macOS 26, iOS 26 or iPadOS 26, then reload.'
  chromium: 'Turn on Settings → System → “Use graphics acceleration when available”, then relaunch the browser. chrome://gpu should list WebGPU as hardware accelerated.'
  chromium_linux: 'On Linux, enable “Unsafe WebGPU Support” and “Vulkan” in chrome://flags, turn on Settings → System → “Use graphics acceleration when available”, then relaunch the browser.'
  other: 'Open the game in the latest Chrome, Edge or Safari 26 with graphics acceleration turned on.'
