  job_desc:
    FARMER: Farmers harvest cereals from fields across the world. Higher tiers unlock rarer crops needed for advanced recipes.
    HERBALIST: Herbalists gather plants and flowers used in alchemy. Each tier requires a higher job level to collect.
    MINER: Miners extract ores and minerals from rock deposits. Rare metals become available as your mining level increases.
    SWORD_SMITH: Sword Smiths forge longswords, swords, and daggers. Combine ores and alloys to craft powerful bladed weapons.
    AXE_SMITH: Axe Smiths craft axes and battleaxes. These heavy-hitting weapons require refined metals and rare materials.
    BLUNT_SMITH: Blunt Smiths create maces and clubs. Sturdy, crushing weapons favored by frontline warriors.
    STAFF_CARVER: Staff Carvers shape staves and spellbooks. Essential tools for intelligence-based casters.
    BOWYER: Bowyers craft bows and spears. Precision ranged weapons for agility-focused fighters.
    ARMORSMITH: Armorsmiths forge helmets and chestplates. Heavy armor for maximum physical protection.
    TAILOR: Tailors sew pants and boots. Light armor pieces favoring agility and mobility.
    TANNER: Tanners craft belts and gauntlets. Versatile accessories providing balanced stats.
    JEWELER: Jewelers create amulets and rings. Accessories packed with powerful magical bonuses.
    ALCHEMIST: Alchemists brew potions from gathered herbs. Consumables that heal, buff, and enhance combat ability.
    BAKER: Bakers prepare breads and food from harvested cereals. Consumables restoring health.
    HANDYMAN: Handymen craft keys, tools, and utility items. Essential accessories for dungeon access and special activities.
