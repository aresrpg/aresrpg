    marketplace: MARKETPLACE
    marketplace_desc: Gear and characters list on the kiosk at any price you set; buyers pay instantly. Resources trade against SUI in swap pools instead, no listings. Every sale pays a 10% royalty — the marketplace is the only way to sell.
    section_forgemagie: FORGEMAGIE
    forgemagie_desc: Forgemagie is the rune crafting system. Crush equipment into runes, then apply those runes to other gear to modify its stats. A high-risk, high-reward endgame system for perfecting equipment.
    crushing: CRUSHING
    crushing_desc: "Each stat line on the crushed item rolls independently — higher stat values and heavier stats produce more runes. There is no server: the yield divisor combines a fixed per-item-level curve with the item template's own taux, a shared on-chain inflation coefficient (1%-4000%) that crushing itself pushes down for that template and up for its neighbors."
    crushing_tiers_desc: Rune tier (Ba/Pa/Ra) is selected probabilistically. Higher stat values bias toward Ra runes.
    rune_tiers: RUNE TIERS
    rune_ba: 'Tier 1: lowest weight per rune'
    rune_pa: 'Tier 2: medium weight per rune'
    rune_ra: 'Tier 3: highest weight per rune, double XP'
    rune_weight_desc: Each rune has a weight equal to its value multiplied by the stat's unit weight. Weight is auto-computed.
    rune_table_stat: STAT
    rune_table_note: Range, Movement, and Action runes apply once each; Critical Chance up to 10 times. Critical and Critical Outcomes have no rune at all.
    rune_stat_range: Range
    rune_stat_movement: Movement
    rune_stat_action: Action
    rune_stat_raw_damage: Raw Damage
    rune_stat_critical_chance: Critical Chance
    rune_stat_earth_resist: Earth Resistance
    rune_stat_fire_resist: Fire Resistance
    rune_stat_water_resist: Water Resistance
    rune_stat_air_resist: Air Resistance
    stat_unit_weights: STAT UNIT WEIGHTS
    stat_unit_weights_desc: Each stat has a unit weight reflecting its combat power. Items with heavy stat lines yield more runes when crushed, consume more item budget, and are harder to over-mage.
    rune_application: RUNE APPLICATION
    rune_application_desc: 'Unlocks at level 70 in ANY job — gathering or crafting, whichever you leveled first. Apply runes to equipment, one at a time, to modify its stats. Three outcomes are possible:'
    outcome_critical_success: Critical Success
    outcome_critical_success_desc: Rune passes, no stats lost
    outcome_neutral: Neutral Success
    outcome_neutral_desc: Rune passes, other stats may decrease
    outcome_critical_failure: Critical Failure
    outcome_critical_failure_desc: Rune fails, stats lost equal to rune weight
    success_rate: SUCCESS RATE
    success_rate_desc: 'Success depends on how close the stat is to its maximum: near 0% is ~99% success, near max is ~50%, and exotic stats sit at ~1% regardless of level. Whether a success lands Critical (no loss) or Neutral (weight paid) shifts the same way, plus a small +0.2% per job level above 1. There is no cap on which item level your job can work on.'
    puits: SINK (PUITS)
    puits_desc: A weight counter, shown in the UI, that accumulates when stat losses exceed the rune weight. It absorbs future losses before other stats are affected. Resets when the item leaves the forgemagie workbench.
    over_maging: OVER-MAGING
    over_maging_desc: Push stats above their natural maximum. Each stat line is capped at 101 extra weight. Max over-mage depends on the stat's unit weight — a light stat like Vitality (weight 0.2) can be pushed ~505 points over, a heavy one like Wisdom (weight 3) only ~33.
    forgemagie_tips: TIPS
    forgemagie_tips_desc: "For exotic/over-mage: strip cheap stats first to build a large sink, then pass the hard stat while buffered, then re-add lost stats (easy since they're far below max). Don't move the item during a session. The sink resets. Over-maged and exotic stats are lost first on failure."
    forgemagie_xp: EXPERIENCE
    forgemagie_xp_desc: 'XP is awarded only on success (Critical or Neutral). Higher level items and heavier runes give significantly more XP. Ra runes grant double XP compared to Ba and Pa runes. Formula: max(1, runeWeight × (1 + itemLevel / 50) × tierMultiplier) where tierMultiplier is 2 for Ra, 1 otherwise.'
    action_points: ACTION POINTS (AP)
    movement_points: MOVEMENT POINTS (MP)
    critical_stat: CRITICAL
    wisdom_xp: WISDOM XP BONUS
    wisdom_xp_desc: Wisdom boosts all the XP you earn. At 600 Wisdom you gain double XP, with diminishing returns above that.
    chance_loot: CHANCE & LOOT
    chance_loot_desc: Your Chance stat raises the drop rate of every loot entry. At 700 Chance each drop rate is doubled. A drop rate can never exceed guaranteed.
