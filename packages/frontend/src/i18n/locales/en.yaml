    runic_blade: "Runes run the length of the blade, and no two scholars agree what they say. The enchanter insists it's an old dialect. The smith insists it's just decoration he liked the look of. Nobody consulted the blade."
    runic_grimoire: 'Half its pages hold real spells. The other half are complaints about the mages who kept getting them wrong, filed in the margins by a hand nobody in the cult will admit to recognizing.'
    runic_ink: ''
    runic_warden_blade: 'Kweebec runes glow faintest at dawn, exactly when the ceremonial spear this was forged from once did too.'
    rustshore_cutlass: "A sailor's blade that has seen more tavern brawls than naval battles, by a wide margin."
    rusty_daggers: 'The tetanus is a feature, not a bug. Every hit comes with a complimentary infection risk.'
    sabertooth_axe: 'The fang is the blade. The handle is just there for moral support.'
    sabertooth_fang: ''
    salve_biscuit: ''
    sandwraith_legplates: "Bone-white plates that materialized in a desert tomb alongside a note reading 'TAKE THEM AND LEAVE.' Nobody knows who left the note. Nobody wants to find out. The sand that perpetually falls from the joints isn't from any known desert, and sweeping it up is futile — it reappears by morning."
    sandwraith_reaper: 'Dug up half-buried in the dunes. Its former owner was recovered considerably more buried.'
    sapling_bark: 'Peeled from a kweebec sapling. It reformed into armor-grade panels on its own. Even dead, this wood has ambition.'
    sapling_bark_boots: 'The wood is technically still alive, and technically still furious about the arrangement.'
    sapling_channeler: "Carved from a sapling that hadn't yet chosen what it wanted to be. The kweebecs consider the whole staff a hostage situation. You consider it a weapon. Nobody's fully wrong."
    sash_of_the_void_emperor: "The largest Voidmoth on record wore this into its final molt and never came back out. Whatever replaced it in that shell hasn't been catalogued yet, and the catalogers are in no hurry."
    saurian_bow: 'Strung tight enough to drop something that was, until recently, actively hunting you.'
    saurian_fang: ''
    saurian_gauntlets: 'Scaled knuckles, campfire smell included. The previous owner did NOT consent to the upcycling.'
    saurian_greataxe: ''
    saurian_ripper: 'Carved from bone still warm enough to make the smiths nervous.'
    saurian_scale: ''
    saurian_scale_helm: 'The old lizard-kings never understood why smaller folk bothered with helmets — their own skulls could open a wall unassisted. They assumed anyone wearing one was simply showing off. They were, the tale admits, not entirely wrong.'
    saurian_staff: ''
    saurian_throwing_spear: 'Balanced more by drift-serpent instinct than by craft. Thrown once, it corrects its own course.'
    saurian_war_axe: ''
    saurian_war_harness: "Cut down from a harness built for a saurian three sizes larger than any wearer since, the armourer grumbling the whole while about craft and dignity. It still carries a faint air of a territory nobody's dared re-claim."
    saurian_war_horn: ''
    saurian_waraxe: "Carved to the angle the stone-kings favored before they went to sleep under the depths, said to remember old scores better than new ones. It has strong opinions about skulls. Nobody's found who to ask about it."
    scale_mail_gauntlets: 'Each scale was pried from a raptor that objected, vocally, at considerable length.'
    scale_plate: 'A thick reptile scale the size of a dinner plate. Armorers love it. The raptor is less enthusiastic about the arrangement.'
    scaled_hide: 'Tiny overlapping scales that catch the light. Leatherworkers stitch dozens together and complain the entire time.'
    scar_iron: 'Iron pulled straight from the exposed rock of the Scar, still holding the cold of the depth it came from. Smiths let it warm before working it, out of respect and mild self-preservation.'
    scar_maul: 'Quarried from Scar-stone heavy enough that swinging it feels like the last argument the wound will ever need to hear.'
    scar_sigil_amulet: 'Stamped with the same sigil the Scar Chanters carve into the fracture walls, meant to ward off whatever the Wound sends climbing back up.'
    scar_suture_daggers: "Modeled after the Suture Priests' own ritual blades, thin enough to close a wound or open one depending on the angle. The Priests insist it's always the former."
    scarab_cleaver_axe: "Shaped like a wing. Flies exactly as well as the merchant's other claims held up."
    scarak_chitin_belt: "Beetle plates that interlock like a puzzle built by a bug with no hobbies and no friends. It cinches on its own, still obeying the hive's final order: squeeze."
    scarak_cleaver: 'The scarak hive has convened three separate councils about getting this back. All three failed.'
    scarak_crown: "Wearing a scarak's head on your head. There's a philosophical recursion here that the scaraks definitely haven't thought about."
    scarak_overlord_ring: "Standard-issue to the tomb wards. Doesn't tarnish; nothing in the barrows does."
    scarak_shell: 'Chitinous plate that clicks when you flick it. Makes decent shingles. The queen would be furious if she had emotions.'
    scarak_shell_plate: 'Chitin plates harvested during molting season. The scaraks were furious, but also technically naked, so their protest lacked authority.'
    scarak_stinger: 'Pulled straight from a scarak and mounted on a stick. Still twitching.'
    scarforged_alloy: 'Beaten together on heat drawn straight off the Scar, which the smiths ration carefully — the Scar does not reheat on request.'
    scarforged_grips_of_first_dawn: 'Quenched in the cold that pools at the fracture floor at dawn. They never quite lose the chill, which the wearer learns to stop noticing.'
    scarforged_legguards_of_last_ascent: "Beaten flat on the Scar's own anvil-stone, which leaves a faint ripple in the plate that no amount of polishing takes out. Nobody tries anymore."
    scarforged_resin: 'Sap boiled down over Scar-heat until it sets glassy and holds a seam better than most metals. It smells, faintly and permanently, of the fire that made it.'
    scarforged_tonic_of_last_ascent: "Doled out one swallow per climber for the final push, on the reasoning that anyone who needs a second swallow isn't finishing the climb anyway."
    scarforged_visor_of_first_dawn: "Angled to catch the first light that ever crossed the Scar, which the smiths claim is different light. Nobody's proven them wrong, chiefly because nobody's proven them anything."
    scarforged_warbelt_of_last_ascent: "Buckled with a clasp cut from the Scar's edge, which means it never quite closes flush. The gap is small, and it is always there."
    scarguard_helm: 'Standard-issue for whoever stands watch at the last wall, visor angled so the wearer never has to look directly at the Wound for long.'
    scarhewn_axe: "Chipped from the Scar's own broken wall, edge kept jagged the way the fracture line itself is jagged. It cuts like the world already gave up resisting."
    scarwalk_leggings: "Worn thin by pilgrims who walked the Scar's edge more times than the leggings, frankly, were built for."
    schism_cuirass_of_last_tremor: "Quenched the day one Sundered Soldier line formally broke rank for the last time. The metal quit ringing that afternoon and hasn't made a sound since."
    schism_gauntlets_rift: 'The left gauntlet remembers gripping a shield that no longer exists; its Sundered Soldier does not. The right has never held anything. Wearers pick a favorite side without meaning to.'
    schism_gauntlets_void: 'The fingers never quite warm up. Handy for tempers, terrible for handshakes.'
    schism_girdle_of_widening_crack: 'Engineered by a Sundered Soldier quartermaster to keep working after it broke, which is either brilliant design or a very sad commentary on expectations. Both, probably.'
    schism_greaves: "Left greave and right greave were forged from two different Sundered Soldiers who never served in the same era. They still don't fully agree on the marching order."
    schism_resin: 'Oozes from a rock that split in two and never forgave either half.'
    schism_sabatons_rift: 'The void seeps up through the soles. Wearers report warm hearts and unbearable toes.'
    schism_sabatons_void: "Weighted soles so the thin gravity doesn't walk off with you mid-stride."
    schism_signet_of_last_tremor: "Stopped humming the instant a Riftling's last tremor died in its shell. Now it just sits cold on the hand, which the previous wearer found more unsettling than the humming ever was."
    schism_signet_of_widening_crack: "The engraving lengthens by a hair each year, tracing the same widening line that split the Sundered Soldier's original rank insignia. Jewellers decline to appraise it twice."
    scorch_grimoire: 'The cover is singed. The contents are worse. Anyone who reads chapter three out loud is asked to leave.'
    scorched_loaf: "Burnt on purpose, and don't you dare imply otherwise. That crunch is the entire point, not some baker's shame."
    scorchtouch_grips: 'Everything you touch gets warmer. Handshakes have become a diplomatic incident.'
    scrap_battleaxe: ''
    scrap_cuirass: "Hammered from salvaged metal plates. The gaps are 'ventilation features' according to the smith. Sure they are."
    scrawled_tome: 'Found floating in the Flooded Nave, its ink still wet after what the barge-folk swear was a decade underwater. Nobody has translated the last page; the first three discouraged them.'
    scythe_of_the_abyss: 'When you stare into the abyss and the abyss hands you a weapon. Surprisingly good customer service.'
    sealed_core: 'A core forged around a fragment of genesis and sealed the way the Oracle seals a wound — tightly, and with a written note advising against opening it.'
    senshi_starter_sword: "It's a stick. You taped a handle to it. You're not fooling anyone, least of all the goblins who are absolutely going to tell their friends about this."
    sentinel_gorget: 'Protects the neck. Which is surprisingly underrated as a survival strategy.'
    sentinel_teeth: ''
    sentinel_tooth: 'One wonders what manner of fool gets close enough to wrestle a crocodile for its teeth, yet here we are.'
    seraph_chain: 'It was approved on a split decision, which explains the crossed-out warranty clause.'
    seraph_heart_pendant: 'This amulet undoes itself with quiet insistence. It is simultaneously here and elsewhere, worn and discarded, real and disputed.'
    seraph_lance: "The maker still isn't sure it was finished correctly, which explains the crossed-out warranty clause."
    seraph_petal: 'Whether it counts as one material or several remains unsettled, and the report was filed anyway, caveats included.'
    seraph_plume: 'Its purity is graded on a sliding, negotiable scale, so the ledger simply lists both, side by side.'
    seraphbound_casque_of_falling_crown: 'It holds up under scrutiny, barely, so it shipped anyway, doubts and all.'
    seraphbound_cordial_crown: "Nobody quite agrees on its aftertaste, so it's sold with a shrug instead of a guarantee."
    seraphbound_cordial_godbone: "It was brewed to settle an argument, and didn't, so drink at your own risk, formally speaking."
    seraphbound_longsword: 'The design survived three separate objections, which is either the whole design or a rounding error.'
    seraphbound_loop_of_broken_diadem: 'The design went through several irreconcilable drafts, which is technically true and completely unhelpful.'
    seraphbound_resin: 'It was logged as evidence in an argument nobody finished, so buyers are advised to judge for themselves.'
    seraphbound_stompers: 'The wearer swears by it; everyone else has doubts, so the debate was tabled indefinitely.'
    seraphbound_vambraces: 'Its function was settled by a coin flip, and the argument outlived everyone who started it.'
    seraphic_amalgam: 'Two separate reports describe it in contradictory terms, which the survey team still argues about.'
    seraphine_hauberk: "The maker's notes consist entirely of crossed-out ideas, so the disagreement was quietly absorbed into the design."
    shadow_blade: ''
    shadow_knight_signet: "The inscription inside translates, roughly, to a threat. The shadow knights insist it's a promise."
    shadow_knight_visor: 'The eye slit stays deliberately narrow. Shadow knights consider peripheral vision a moral failing.'
    shadow_stilettos: "Forged from light-absorbing shards. Your enemies won't see the miss coming either."
    shadowsteel_belt: 'Keeps your trousers from becoming a problem, and allegedly your mortal dread too. Only one of those claims is verified.'
    shadowsteel_morningstar: 'The spikes drink light rather than reflect it, which makes it a genuinely terrible night-light.'
    shadowsteel_shard: "Broken from armor where the darkness wasn't decoration but load-bearing structure. Smiths handle it with tongs, a prayer, and the specific caution of people who've heard what happens to those who skip the prayer."
    shark_bone_choker: 'A necklace of shark vertebrae. Fashionable in coastal towns. Terrifying literally everywhere else.'
    shark_fin: 'A dorsal fin from a hammerhead. Soup merchants have been arrested for less.'
    shark_fin_saber: 'Serrated after shark teeth. The sharks remain, understandably, quite bitter about the whole thing.'
    shark_harpoon: "Tipped with an ethically sourced shark fin. The shark would disagree with 'ethically'."
    shark_leather_belt: 'Rough enough to double as sandpaper. The shark did not survive the metaphor.'
    shark_mail: 'Shark fin scales sewn onto mithril rings. Waterproof, sharkproof, and a conversation piece.'
    shark_scale_tassets: 'Shark fin scales on the thighs. You are now aerodynamic underwater. Legally, a fish.'
    shark_vertebra_ring: 'A single shark vertebra, ground and polished. The jawline it came from is still, technically, hunting.'
    sharkhide_fists: 'Shark skin wrapped over thorium plates. The rough texture doubles as a cheese grater.'
    sheep_eye: "A Wooligan's detached eye is much less intimidating when it can't blink, which turns out to be always."
    shellguard_mitts: "Lined with crab chitin thick enough to blunt strikes and fine motor control alike. Your fingers are safe, your dexterity is not, and whatever's left underneath is nearly impossible to kill."
    shiny_barley: ''
    shoddy_spear: 'A pointy stick with delusions of military service. The tip wobbles but commitment is everything.'
    shore_amulet: "Carved from the shell of a crab that pinched the wrong fisherman. The sand trapped inside rattles when danger approaches, or when you walk. It can't tell the difference."
    shore_finns: 'The carapace of great crabs, fashioned into rugged leg armor that crackles faintly with the scent of sea salt and sunbaked tide.'
    shore_mace: 'Encrusted with barnacles that add texture and tetanus risk.'
    silentedge: 'Makes no sound on the draw, the swing, or the landing. The silence afterward is the part people remember.'
    silk: 'Filaments of impeccable quality, smooth as water and stronger than chains. A pity about the knots — they hold fast, but familial bonds were never meant to be tested this way.'
    silk_boots: "Impossibly light, woven from the silk of spiders that were bribed with flies to cooperate. The arrangement lasted exactly long enough to finish one pair. The cobbler's assistant is still in therapy."
    silk_bound_lexicon: 'Bound in silkling cocoon thread. Half the spells are illegible, the other half are dangerous.'
    silk_cocoon: ''
    silk_cowl: 'Woven from creatures that spend entire lives riding updrafts and never once look down.'
    silk_gloves: 'The height of fashion for the terminally unemployed, and whose blood runs considerably warmer than their hands ever will.'
    silk_leggings: 'Light as a breeze. Tough as whatever made the breeze in the first place.'
    silk_tunic: 'Woven by cave-dwelling spiders who work exclusively in total darkness and total silence.'
    silk_woven_gauntlets: "So light you'll forget you're wearing gloves. You'll remember at the worst possible moment."
    silkamu: "Woven from threads no spider surrendered willingly. The arachnid union has placed a bounty on the weaver's head, payable in flies."
    silkling_stingers: 'The near-microscopic barbs ensure wounds fester for weeks, which is arguably the point.'
    silkwinder_lance: 'Wrapped in spider silk that makes it whistle through the air. Enemies hear it coming but cannot agree on which direction.'
    silt_wrapped_core: 'A crafting core sheathed in silt that has to be cracked open to use, and re-forms overnight if you leave it too long between jobs.'
    silt_wrapped_cuirass_of_quiet_drowning: 'Caked in a silt shell that hardens to stone in the dry and softens in the wet, which in the weald means it is always, quietly, in transition.'
    silt_wrapped_gauntlets: 'Caked in silt that hardens over the knuckles, so the first punch also delivers a fistful of the weald floor.'
    silt_wrapped_greaves: "The silt shell adds a stone's weight to each step, which the wearer stops noticing right around the time everyone else does."
    silt_wrapped_lance: "Its silt shell cracks off on the first hit and takes the enemy's attention with it, which the second hit uses."
    silt_wrapped_maul_of_quiet_drowning: 'Its silt casing adds a stone of weight and, on impact, a small burst of the weald floor, so every blow leaves a little of home behind.'
    silversteel_saber: 'Gleams in any light available. Attracts attention, mostly the kind you were trying to avoid.'
    sky_shard: 'A solidified piece of storm cloud that floats if you let go. Arcanists bind them into staves. Gravity is offended.'
    sky_shard_diadem: 'Worn by whoever last carried the ashen standard. The role rotates often.'
    skybound_ring: 'Fired in the pyre pits until the metal remembered nothing else.'
    skyburial_bow: 'It functions under advisement, which the wearer has chosen not to think about.'
    skyburial_leggings: 'The wearer swears by it; everyone else has doubts, so the wearer has stopped asking.'
    skyheld_carapace_of_hollow_throne: 'It was finished out of sheer stubbornness, a decision made under considerable time pressure.'
    skyheld_claymore_of_last_regent: "It works, but only if you don't ask why, so the matter remains, for now, unresolved."
    skyheld_crest_of_hollow_throne_crown: 'Its effectiveness has never been independently verified, which nobody can confirm without starting the argument over.'
    skyheld_crest_of_hollow_throne_godbone: 'Whoever made it changed their mind halfway through, a resolution that resolved very little.'
    skyheld_halberd_of_hollow_throne: 'It was completed despite unanimous hesitation, so the original argument was declared a draw.'
    skyheld_stilettos_of_hollow_throne: "The maker still isn't sure it was finished correctly, so it shipped anyway, doubts and all."
    slackline: "Never actually slack. The name is what the previous owner called it, right before it wasn't."
    slag_clinker: "What the furnace spits out once it's decided it's finished with something. Miners keep it anyway — waste, the old saying goes, is just ore that hasn't been asked nicely."
    sloth_fur: 'Incredibly soft and smells like moss and patience. Tailors love it. The slothian just sighed very slowly.'
    slothian_wisdom_stone: "A moss-covered stone that hums with ancient knowledge. It knows the answers. It just doesn't think you're ready."
    smoldering_wheat: ''
    solomonk: 'The cowl of a monk who traded three vows of silence for one very loud hat.'
    soul_binder: ''
    soul_shard: ''
    soul_shard_loop: "Holds a sliver of something that hasn't fully left yet."
    soulbinder_scepter: 'Carries a fraction of whatever the Soul Auditors bind at the gate below, humming with borrowed permanence. An Ash Prophet used it to ask questions the dead rarely agree to answer twice.'
    soulking_spellbook: ''
    sounding_hull_key: 'Salvaged from the wreck the Hull Warden still patrols. It hums faintly whenever the tide turns, as if counting down to something.'
    spark_pendant: 'A captive spark too stubborn to know it should have died out decades ago.'
    spark_ring: 'A copper loop with a lodestone heart that throws off sparks whenever its wearer is angry, anxious, or thinking too hard about supper. The enchanter called it a mood ring. The village calls it a fire hazard.'
    spectral_arcanize: ''
    spectral_edge: 'Half in this world, half in the next. Customs at the border are very particular.'
    spectral_essence: 'Distilled from the Soulless Regent himself. Smells like the void between stars. Absolutely ruinous market value.'
    spectral_fang_daggers: 'Forged from condensed ghost complaints. Every stab comes with an itemized grievance.'
    spectral_ruin_blade: 'Forged from a Voidmoth carapace thin enough to see through in the right light, and thin enough to cut with in any light at all. The ghosts of its previous owners occasionally offer unsolicited advice.'
    spice_rusk: ''
    spicebark_bread: 'One bite and every sinus in a three-table radius surrenders unconditionally.'
    spider_fang_club: ''
    spider_fang_daggers: 'Twin blades of crystallized venom that hum, very faintly, whenever violence becomes likely.'
    spider_leg: ''
    spider_silk_gland: ''
    spider_silk_grips: "Won't release whatever it's holding. Wonderful for combat, catastrophic for handshakes."
    spider_silk_treads: "Virtually silent footwear spun from cave spider silk. Perfect for stealth, terrible for announcing your presence at dinner parties. The silk sometimes sticks to surfaces, which is either a design flaw or the spider's final act of revenge."
    spider_thread_pants: 'Spun from thread no spider ever willingly gave up. Ethical sourcing was never on the table.'
    spine_daggers: "Cultivated by someone named Elorie for cruelty, not mercy. History hasn't recorded which one won."
    spine_gauntlets: 'Tusklet quills mounted on leather palms. Every handshake becomes a negotiation. Every pat on the back becomes a declaration of war. The crafting process involved pulling spines from a very angry creature, which explains why the gauntlets seem to radiate residual resentment.'
    spine_pants: 'Reinforced with quills from something small and extremely opinionated about being sat on.'
    spore_cracker: ''
    stabilizing_agent: ''
    staff_of_the_deep: 'Pulled from a sunken temple no one remembers building. The barnacles are the least strange part.'
    stamina_tonic: "Mineral-laced stimulant that convinces your legs they aren't tired. Your legs know better, but comply out of chemical fear."
    starter_staff: 'This weathered bamboo pole has guided countless wanderers through marsh and moorland alike. Curiously, it functions equally well as a walking aid and as an impromptu lesson in humility.'
    starter_weapon_ikari: 'Thick, blunt, and ponderous—everything a master weapon should not be. One might bludgeon a foe to death with it, assuming they can first lift it above their shoulders.'
    steadyhand: 'Stops the tremor the Scar gives everyone eventually. Only the hand. The remainder of the shaking is your problem.'
    steel_cuirass: 'The previous owner left a forwarding address. Nobody has been brave enough to check it.'
    steel_flail_sword: 'A flexible dusk-forged blade wrapped in bristlemail. Bends like a promise nobody intends to keep.'
    steel_gauntlets: 'Fingers articulate perfectly in darkness and stiffen the instant sunlight touches them.'
    steel_greaves: "The shadow knight's final creation before retiring to keep bees in complete darkness."
    steel_incandescent_sword: 'Forged so hot the smith is said to have misplaced his own name somewhere in the quench. The blade remembers the heat perfectly. Whatever he lost that day, the blade has never given it back.'
    steel_longsword: 'Wolf sinew wraps a blade of shadow knight steel. Sharp, dark, and deeply uninterested in your feelings.'
    steel_recurve: 'Strung with alpha-wolf sinew that tightens, ever so slightly, whenever you lie about your draw weight.'
    steel_treads: 'Forged during an eclipse by a knight who insisted on total silence and mostly achieved it.'
    steel_warhelm: "So dark it absorbs compliments along with light. The visor opens only from the inside — somebody's idea of a joke."
    stitched_trousers: 'Double-stitched for durability. The tailor was so proud they signed it on the inside. In visible ink, poorly.'
    stoneheart: "Cold to the touch at every hour, in every season, regardless of what's happening to the person wearing it."
    stormfeather: 'A feather that sparks when shaken. Storm mages weave these into wands. Postal workers refuse to deliver them.'
    stormfeather_daggers: "Stormhawk feathers folded into steel until the metal forgot it was ever anything else. Every strike lands with a rumble of thunder from a storm that's long since moved on without it."
    stormfeather_longbow: 'Every arrow crackles before release. Every archer swears they meant for it to do that.'
    stormfeather_loop: 'Plaited from plumes that never stop crackling. A handshake here comes with a small, apologetic shock.'
    stormhowl_bow: 'Each arrow screams on the way to its target. The neighbors have complained.'
    stormtide_coif: "Can't decide if it's for water mages or earth knights. Serves both grudgingly."
    stormwalker_boots: 'Walks through any storm without complaint. The boots, not the wearer — the wearer complains constantly.'
    stormweave_leggings: 'Woven grey from wear, not from dye. Nobody remembers the original color.'
    stumpwork: 'Built for the trees that survived the wound only halfway. Finishing the job turned out to be steady, reliable work.'
    suize_flour: ''
    summit_alloy: 'The strongest alloy the summit forge can hold before the crucible itself gives out. The smiths know the exact temperature and never write it down.'
    summit_cuirass_of_sealed_wound: 'Fitted over the seam the Suture Priests worked hardest to close, so the wearer carries the repair around with them. It holds better on a chest than it did on the Scar.'
    summit_draught: 'Brewed for the dizziness that takes climbers near the top, where the air thins and the mind starts negotiating with the drop. Drink before the negotiations begin.'
    summit_extract: 'Rendered from summit moss under pressure, concentrated enough that a single drop does the work of a full flask and costs about as much to replace.'
    summit_girdle_of_summit_vigil: "Cinched to keep a sentry upright through a watch nobody was expected to survive standing. It kept the last three; it isn't sentimental about it."
    summit_greaves: 'Reinforced at the shin for the last stretch of the climb, where the mountain stops offering handholds and starts taking them back.'
    summit_helm_of_summit_vigil: 'Issued to whoever draws the longest watch at the summit, on the reasoning that a heavier helm keeps the head from nodding off. It does. Mostly by hurting.'
    summit_ore: 'Adamant quarried at the very summit, where the ore sits closest to whatever the mountain is made of underneath. Heavy in a manner that feels deliberate.'
    summit_sabatons_genesis: "Plated over soles the smiths swear were the first ever cut. Whether or not that's true, they walk like they have nothing left to prove."
    summit_sabatons_scar: 'Iron-shod for footing on scar-stone, which shifts underfoot with the patience of something waiting for you to trust it.'
    sundered_casque: "There's a fissure across the brow. The smith calls it a 'stress-relief channel'. The smith lies."
    sundered_charm: 'Half a unit medallion of the Sundered Soldiers, issued in pairs that were never meant to part. The other half is out there, presumably still working on completing the set.'
    sundered_chausses_of_screaming_rift: "The kneeling stance of a last order, locked into the joints of a kneeling Sundered Soldier by whatever finished the rift's work. Standing back up takes a fresh decision every time."
    sundered_cordial: 'Not a cure. A pause. Use the pause to reconsider whatever led you here.'
    sundered_cordial_of_long_collapse: 'Issued to Sundered Soldiers who are, technically, still on the roster. Mends what it can and is honest about the rest.'
    sundered_elixir_of_screaming_rift: 'The final brew a unit puts up before it stops being a unit. Loud going down. Quiet after.'
    sundered_sash: 'The single piece of Sundered Soldier kit that never came apart, however thoroughly everything else in the story did. Holds. Just holds.'
    sundered_stompers_of_long_collapse: 'Every step lands like the verdict some Sundered Soldier court-martial never got to deliver. Slow, deliberate, and absolutely final, gravity permitting.'
    sundered_stompers_of_screaming_rift: 'The rift beneath answers every footfall a Sundered Soldier takes, which rather defeats the purpose of the sneaking lessons. Surprise entrances are, structurally, off the table.'
    sundered_vambraces_of_long_collapse: 'Strapped on for a roll call that never finished being taken. The arms remember standing ready long after the mind would rather not. Endurance without end is still, technically, endurance.'
    sundered_vambraces_of_screaming_rift: 'Padded thick over the ears of the arm, which makes no anatomical sense until you remember whose arm it was. Blocks sound almost as well as it blocks blades.'
    sunglass_shard: 'Cut from glass fused by two suns that have never once agreed on anything else.'
    sunken_mere_key: 'Pulled from beneath the ice where the Frost Dragon sleeps. Cold enough to hurt, warm enough to still work.'
    sunscale_chopper: 'Edged with scales that drank enough sunlight to glow for a whole generation of geckos.'
    sunscale_cuirass: "A cuirass of gleaming scales that offers protection from steel and spells alike, assuming one doesn't roast inside it first."
    sunwarmed_ring: 'Still holds the warmth of a lizard that, respectfully, is no longer using it.'
    sunwarmed_scale: ''
    surimi: 'This sacred remnant of the Surimi pulses with ancient power, its surface worn smooth by the reverent touch of pilgrims long dead. Strange that holiness should feel so suspiciously like processed seafood.'
    suture_belt: 'Cinched the way the Suture Priests cinch a wound before it can widen. Works about as well on a waist as it does on the Scar.'
    suture_loop: "Bent into a closed loop the way the Suture Priests close everything, on the theory that the Scar can't unravel what was never left open."
    swamp_conduit: 'Channels swamp water into something vaguely magical. The smell never washes off.'
    swamp_scale: ''
    swamp_trident: 'Three prongs of corroded metal, perfect for skewering anything that crawls out of the mire.'
    swampfire_grips: "History's worst decisions, several of them, are stained directly into the leather."
    talokan_aero_tail: ''
    talokan_pearl: 'A deep-sea pearl carried as currency by the talokan. Glows faintly blue underwater. Land merchants accept it reluctantly.'
    talokan_sting_daggers: 'Coral-edged and salt-crusted. They smell like low tide and regret.'
    talokan_tail_nakwa: ''
    talokan_tide_ring: "Made from compressed sea salt and talokan pearl. Dissolves if you swim with it. Don't swim with it."
    talokan_trident: "The coral tip regenerates itself between battles. Nature's way of enabling your habits."
    tanjirize_flour: ''
    tanjirize_rod: "A pilgrim's walking stick that wandered too close to the Wound and came back changed. It still works fine for walking. It does other things too now."
    tanned_girdle: 'Stiff and uncomfortable, like a first date. Softens with use. The belt, not the date — that gets worse.'
    tectonic_severance: 'Legends say the blacksmith who forged this split a mountain in the test swing. The mountain sued.'
    temperedglass: 'Choir-glass sheets that survive any oven. The cakes stick anyway, as is law.'
    tempering_flux: ''
    tempest_requiem: "Each arrow carries the small thunderstorm an Ash Prophet saw coming three verses before it arrived. The extra reach isn't strength. It's knowing where the wind will be standing."
    tempest_whisper_bow: 'A bow strung with sky shard filament. Arrows fly so fast they arrive before the sound.'
    terminal_casque_genesis: 'Worn by the Deep Auditors while they argue the oldest records. Padded thick, because the arguments run long and occasionally come to blows.'
    terminal_casque_scar: "The last helm the wall's armory ever forged, because after this altitude there is no next size up, and no next wearer expected to need one."
    terminal_chausses_of_origin_line: 'Cut for the leg that intends to reach the boundary and stop there, which the plating enforces by being genuinely unpleasant to run in.'
    terminal_cordial_of_final_scar: "Kept in the wall infirmary for the cases past mending, then found to work embarrassingly well on the cases that weren't. Reputation adjusted accordingly."
    the_tenderizer: "Marketed to the Scar's remaining butchers as a kitchen tool. Repurposed almost immediately. The manufacturer has stopped commenting."
    thick_ursine_hide: ''
    thickskull: 'The compliment was meant literally. It has saved more lives than the enchantment stitched into the lining.'
    thorium_warhammer: 'Studded with rex fangs and braced with shark fin. Substitutes finesse for raw blunt force. The results speak for themselves. Loudly.'
    thorium_warplate: 'Standard-issue to whoever still holds a column together. Rare, now.'
    threefold: "Struck once by the smith, folded twice more by something that isn't a smith. Nobody's asked what."
    throatlatch: "Clasped shut by whoever wore it first and never reopened since. The clasp still works. Nobody's tested it."
    throneless_cleaver_of_rotting_halo: 'The craftsmanship is sound; the premise is not, a compromise reached after everyone gave up arguing.'
    throneless_draught_of_gilded_ruin: 'It tastes like a decision made too quickly, and the brewer still refuses to pick a side.'
    throneless_extract: 'Nobody can say for certain where this came from, so both entries remain on the record, unreconciled.'
    throneless_gauntlets_of_gilded_ruin: 'It was forged during an argument nobody won, and the second draft never materialized.'
    throneless_lattice: 'It was logged as evidence in an argument nobody finished, and the report was filed anyway, caveats included.'
    throneless_pendant_crown: 'The wearer insists it works; the evidence is inconclusive, no refunds, no further questions entertained.'
    throneless_pendant_godbone: 'Nobody has confirmed it does what the label claims, a fact the maker considers a feature.'
    throneless_sabatons_of_gilded_ruin_crown: "It works, but only if you don't ask why, a distinction without much of a difference."
    throneless_sabatons_of_gilded_ruin_godbone: 'Its origin story changes depending on who tells it, and the paperwork reflects none of this.'
    throneless_sabatons_of_rotting_halo: 'It was built to prove a point nobody remembers, a footnote the maker never got around to writing.'
    tide_shard: 'A crystallized fragment of living ocean that drips constantly. Smells like salt and unfinished business.'
    tide_throne_key: 'Cast in coral that only hardens below the tideline. The Drowned Regent still holds court down there, and still expects it back.'
    tidebinder_cord: "Knotted with sailor's precision and a touch of magical incompetence."
    tidebound_band_of_brackish_deep: "Tarnishes and brightens on a cycle that has nothing to do with wear, which the wearer eventually stops timing against the tide they're told isn't there."
    tidebound_breastplate_of_brackish_deep: 'Forged in water too salt to drink and too fresh to preserve anything, a compromise the plate wears as a permanent, faint smell.'
    tidebound_core: 'A core that grows heavier and lighter on a slow cycle no craftsman has matched to anything, least of all to a tide the weald denies having.'
    tidebound_grips_of_silt_throne_matron: 'Scavenged from the drowned court and never desalted, so they leave a faint white print on everything the wearer touches for long.'
    tidebound_grips_of_silt_throne_mire: 'Recovered gauntlets from the drowned court, still curled in the grip of holding something the silt long since took.'
    tidebound_treads_of_brackish_deep: 'The salt-water tanning left them permanently damp and permanently silent, a fair trade in a place where sound draws teeth.'
    tidebound_treads_of_silt_throne: 'Court footwear built for standing perfectly still on ceremony, now perfect for standing perfectly still while something large passes.'
    tidebound_visor_of_brackish_deep: "Salt-crusted from being worn where the tide reaches, which the weald insists it doesn't have and the visor's corrosion insists it does."
    tidebound_visor_of_silt_throne: "Recovered from the silt-choked hall the weald's guides still call a throne room, out of habit more than any evidence a throne was ever there."
    tidecaller_mail: 'Rings like a buoy in a storm. Your allies always know where you are. So do enemies.'
    tideflame_treads: 'Boots infused with both glacial and cinder essences. Your left foot is warm, your right foot is cold. Balance achieved.'
    tidesurge_leggings: 'Shimmer like the ocean at sunset. Smell like the ocean at low tide.'
    tidewalker_soles: 'Walk on water. Not literally. But close enough to annoy physicists.'
    timberfall: 'Rated to fell the petrified trees the wound left standing. Works just as well on anything that once was a person.'
    timberwolf_legguards: 'Wolf fur-lined greaves that keep your legs warm in winter and overheated in everything else. The fur pattern shifts in firelight, creating the unsettling impression that something is still alive in there and merely biding its time.'
    tin_cap: 'A doll-sized dome that trades brains for bounce. You will outlive your own good ideas.'
    titan_bear_moss: ''
    titan_koa_greaves: 'The leathery hide of a titan koa, shaped into leggings. They croak when you bend your knees.'
    titan_koa_lance: 'Planted at the tomb line for three winters. Still points the same direction.'
    titan_koa_stompers: 'Built for the mud, not for silence. Silence was never the point of a column on the march.'
    titan_koa_warspear: ''
    titan_shell_hauberk: 'Boiled and beaten flat. Whatever wore it first still leaves a smell.'
    title_veteran: "Press this searing brand against your flesh to prove you're a veteran and it'll be granted to you for life — because nothing says 'battle-hardened warrior' like voluntary third-degree burns."
    tokek_paw: 'A severed paw from a tokek gecko, still faintly warm and clutching at nothing.'
    tome_of_elemental_spite: ''
    tome_of_oblivion: 'The last chapter writes itself as you read, in whatever dust a Voidmoth leaves behind when it stops existing mid-sentence. Reviewers agree the ending is honest, if nothing else.'
    tool_herbalist: "The height of agricultural chic, assuming the look one is going for is 'dirt-smeared desperation.'"
    totem_club: 'Carved with symbols nobody living can translate. Hit something hard enough and it seems to translate itself.'
    training_battleaxe: 'Weighted with lead instead of sharpened with steel. Excellent for building arm mass. Terrible for everything else.'
    training_helmet: 'Protects against gentle breezes and strongly worded insults. Actual combat protection: theoretical.'
    tremor_brew_of_nine_faults: 'Restores health and installs a permanent low-grade tremor in both hands. Net positive, they insist.'
    tremor_crest_of_fifth_breach: "Vibrates faintly at all times. After a week you stop noticing. That's the problem."
    tremor_fists_of_nine_faults: 'Deliver the blow, then a little extra buzz. The extra is not a feature you can turn off.'
    tribal_cudgel: 'Wrapped in totemic charms that channel spirits said to judge every swing on form as much as force. By all accounts they remain unimpressed. The cudgel hits just as hard regardless of their opinion.'
    tribal_summoner_totem: 'A totem carved by wildling shamans. The carvings depict animals. The animals depicted have filed complaints.'
    tribal_totem: ''
    truelength: "Measured against the smith's own forearm, a unit of measurement that died with him. The sword remains the only copy."
    truestrike: 'Aimed by pilgrims taught that the Scar rewards conviction over aim. The blade disagrees, quietly, every single time.'
    truffle_essence_compound: ''
    tusk_bludgeon: 'A tusklet ivory club. The tusklet died of natural causes. Naturally, you caused them.'
    tusk_buckle_belt: 'The buckle is a genuine tusklet fang. The leather smells like something that charged at you and lost. Fastening it requires a brief wrestling match that the belt wins about half the time.'
    tusk_ivory: "Dense ivory from a warthog's tusk. Carvers shape these into chess pieces, because apparently that's a market."
    tusker_musk_gland: 'Produces a smell that can clear a room, a building, or a small district. Alchemists extract pheromones from it.'
    twine_belt: 'Woven from whatever was growing near the road. It smells faintly of desperation and holds together through sheer spite. The knot is decorative. The function is theoretical.'
    tyrants_gavel: 'Used to pass sentence on deserters. The marches had a great many.'
    ukranize_flour: ''
    uncertain_bow_range: 'A bow that shoots at distance, but argues about whether distance is real. Its arrows reach targets only by theoretical necessity.'
    underweald_casque: "Meant for the tiers below the roots, where the dark is total and a helmet's only real job is to stop you cracking your own skull on the ceiling."
    underweald_charm: 'A knot of root and bone that guides swear wards off the things below. No one who tested it has ever come back to confirm it works.'
    underweald_elixir_of_fen_below: 'Brewed from what grows at the bottom of the Fen Below, which heals well and tastes like exactly where it came from.'
    underweald_hauberk_matron: 'Overlapped in scales the Anglerdeep Matron sheds by the hundred, which sounds abundant until you learn what she does to anyone collecting them.'
    underweald_hauberk_mire: 'Ringed in bog-iron that never rusts because it was never dry long enough to start, a property the smiths sell as a feature.'
    underweald_loop: 'A plain root-ring from the tiers below, worn by guides as a badge that means, roughly, has been down there and come back.'
    underweald_stompers_of_rising_tide: 'Weighted to keep a footing in current, because down here the ground is a suggestion the water is free to overrule.'
    ursine_heart: ''
    ursine_signet: 'Pressed into wax on requisition forms. The wax never quite sets right.'
    ursine_totem_club: ''
    velkarion_breath_weapon: 'A fireplace iron that once stirred the great pyre itself. It has opinions about your kindling arrangement.'
    velkarion_ember: ''
    velkarion_key: 'The grand pyre gate has nine locks, six wards and exactly one key, and the sexton keeps it precisely where you think he does.'
    venom_band: 'The alchemist who stabilized this coating lost two fingers proving it works. It works.'
    venom_battleaxe: "The spider venom on this blade barely adds to the damage. The look on your opponent's face when they notice the colour of the edge does considerably more of the actual work."
    venom_belt: "Three failed antidotes and one very patient priest went into stabilizing this belt's lining."
    venom_concentrate: ''
    venom_gland: ''
    venom_legguards: 'Saturated in toxins that are mostly, technically, probably harmless to you specifically.'
    verdant_aloe: ''
    verger_teaspoon: 'The verger lucky teaspoon on a loop of twine. Stir your tea with it and the minute politely waits for you to finish.'
    vitrified_casque_of_rising_hymn: 'Knitted for a teapot that exploded anyway. Keeps a head at serving temperature.'
    vitrified_chausses: 'Cut so narrow the tailor had to be talked down twice. Kneeling is a memory.'
    vitrified_cord: 'Double-knotted the way mother insisted. Untying them is how accidents start.'
    vitrified_crown: 'Fused in one lightning strike. Wearing it, you feel briefly chosen. The feeling is a lie.'
    vitrified_edge: "Cooled slow so the glass wouldn't shatter. It kept the patience and lost the mercy."
    vitrified_elixir: 'Salt water and stubbornness. The choir swears by it, an octave higher than before.'
    vitrified_glaive: 'Long enough to brown bread over the great pyre without losing your eyebrows entirely. Entirely.'
    vitrified_lattice: 'A frozen web of molten strands. Handle it by the thick parts; the thin parts handle you.'
    vitrified_stompers: 'Every footfall taps like a struck goblet. You are, at all times, announcing yourself.'
    vitrified_tear: 'Sheet glass cooled on the volcano own schedule. The bubbles are called character.'
    vitrified_vambraces: 'Not armor. A statement. Somebody in this cathedral is about to get cleaned.'
    void_anchor_belt: 'Weighted to keep footing on ground that shifts underfoot. The marsh always shifts.'
    void_distillate: 'Liquid nothingness extracted from Void family remains. Staring into it too long causes existential dread and mild nausea.'
    void_eye_lens: 'A crystallized lens from a Void Eye. Sees into parallel dimensions. Most of them are worse than this one, somehow.'
    void_eye_talisman: 'Set with a lens ground for watching the tomb line after dark.'
    void_grips: "Fingers stained by water that never sees daylight. The stain doesn't wash out."
    void_oracle_staff: 'Sees all possible futures. Most involve you dying. It shows you anyway.'
    void_shard: 'A fragment of nothing given physical form. Looking at it too long causes nosebleeds and philosophical crises.'
    void_shepherd_club: ''
    void_treads: "Each step sinks half an inch and rises clean. The marsh hasn't learned to keep them yet."
    void_whisper_bow: "Fires arrows that don't exist until they arrive. Quantum archery is a liability disclaimer waiting to happen."
    voidbake_tablet: ''
    voidcleave: 'Cleaves through armor, morale, and the occasional dimensional barrier. Handle with existential care.'
    voidgazer_crown: 'Sights through eye-slits worn thin by watching. The marsh watches back.'
    voidpierce_stilettos: "Ground to an edge fine enough to slip between a Voidmoth's carapace plates without the Voidmoth noticing until well after the fact. Works on most things with a similar disregard for warning."
    voidpiercer_bow: 'Arrows loosed from this bow strike the target before the string has fully released. Out here, causality is less a law than a polite suggestion.'
    voidpiercer_spear: 'Pierces the void between dimensions. Also useful for kebabs at interdimensional cookouts.'
    voidreaver_greatsword: ''
    voidreaver_longsword: ''
    voidstaff_nihil: 'Carved from crystallized Voidmoth silence — the specific quiet between one wingbeat and the next. Casts spells that technically never happened, which the tax office has strong opinions about.'
    voidwalker_boots: 'Grown, not stitched, on the legs of a Voidmoth that learned to step between one patch of nothing and the next. Side effects include a faint hum in the ears and an unshakeable sense of having forgotten something.'
    volatile_extract: "An unstable reagent that vibrates audibly. Handle with care or don't handle at all. Weapon smiths can't get enough of it."
    walker_belt: "Fashionable enough, assuming one's style icon is a shambling corpse."
    walker_hat: "The previous wearer's head is still inside, though in considerably worse condition than the helmet itself."
    wallbreaker: 'Rated for masonry the wall itself is made of. The rating was not theoretical. There is a hole to prove it.'
    war_barrow_key: 'Cut to fit a lock that was never meant to open twice.'
    warden_spear: "A sapling warden's ceremonial spear, repurposed for violence the kweebec never quite forgave."
    warlord_plate: ''
    warped_staff: 'Dried improperly, resulting in a permanent twist. Channels magic in unpredictable spirals. Aim is more of a vibe.'
    water: 'Pure, refreshing water that quenches thirst and cleanses the body of impurities. A rare substance in a world where most liquids want to kill you.'
    waxseal_wafer: ''
    weald_heartplate: 'Grown from bark around a heart of packed moss, still faintly warm the way living wood stays warm. The Titan Bear is missing a very similarly shaped chunk of hide.'
    weald_knot_belt: "Tied in the same root-knots the weald's guides use to mark a safe trail. Whether the knots still mean anything this deep is a separate question."
    wealdwarden_halberd: "Carried by whoever the weald's packs respect enough not to test alone. Solo use is technically possible. The weald does not recommend it."
    weaver_daggers: 'Tipped with spider silk gland. The poison is slow. The regret arrives early.'
    weaver_silk_vest: "Spun from weaver silk so fine it's almost invisible. The tailor charged double because, and I quote, 'you can't prove it's not there.'"
    weaving_solution: ''
    weighted_club: "Someone shoved rocks inside a hollow log and called it engineering. It works. Physics doesn't care about elegance."
    welcome_doormat: 'Bristle mats lashed to the ankles. You will absorb everything the world wipes on you, and you will say welcome.'
    wheat: 'Peaceful farmers spend endless hours harvesting this grain, only for soldiers to burn it as siege kindling a week later.'
    wheat_barley: 'A humble sheaf of pale green barley, its grains plump with the promise of bread or beer.'
    wheat_burnt: ''
    wheat_draconize: 'Wheat grown in volcanic soil soaked through with draconic blood, its kernels hot enough to boil water on contact. A single loaf feeds a family for a week, assuming the family enjoys internal combustion.'
    wheat_flour: 'Some adventurers dream of legendary swords, others of crusty baguettes warm from the oven. The latter tend to live longer, if considerably less gloriously.'
    wheat_malt: 'Some warriors prefer their courage fermented, others distilled — this grain accommodates both philosophies.'
    wheat_purple: 'Peasants have learned the hard way that harvesting glowing crops is the leading cause of spontaneous wizardry in agricultural communities.'
    wheat_suize: "The harvest was traditional; the authentication was anything but, immortalized forever in blockchain's cold embrace."
    wheat_tanjirize: "Golden stalks harvested from the demon slayer's ancestral fields, still humming with the warmth of a sun that never truly sets."
    wheat_ukraine: 'This hardy wheat strains toward distant horizons, its fibers dyed the blue of cloudless skies and the gold of endless steppe.'
    wheat_white: 'High-altitude harvest blessed with ancient inscriptions to survive the long winter storage.'
    whisker_bundle: ''
    whisker_weave_belt: 'Six ferans contributed, unwillingly, to a belt not one of them will ever be caught wearing.'
    whittled_shortbow: 'Carved during a boring guard shift. The string is made of braided grass. Effective range: your imagination.'
    widow_club: "Wrapped in widow silk that hardens on impact. The spiders didn't volunteer their silk."
    widow_fang_daggers: "Two fangs from two different widows. They still don't get along."
    widow_thread: ''
    widows_kiss_daggers: ''
    wildling_bow: ''
    wildling_shortbow: 'Stolen from a wildling camp. They were not consulted about the transaction.'
    wildling_spear: ''
    wildlord_club: ''
    wildlord_war_girdle: 'Buckled on before every roll call. Never once buckled on for a good reason.'
    windfire_cuirass: "Can't decide between fire and air affinity. Burns your back, chills your front, and the constant flinching wears down everything except your will to keep standing."
    windshear_loop: "Spins freely on your finger like it's trying to escape. The enchantment is working as intended."
    windslicer_gloves: 'Thin as a promise, fast as an excuse. Perfect for the nimble-fingered.'
    windstrider_sandals: 'Open enough to drain fast. Wet feet dry quicker than heavy boots ever do.'
    windwalker_vest: 'Light enough to keep pace with the column. The march drummers wore nothing heavier.'
    wisdoms_embrace_gauntlets: "Counted every requisition twice before signing off. Habits like that don't die easily."
    wither_concentrate: ''
    wither_pastry: 'A pastry that decays anything organic it touches except itself. Alchemists use it as a controlled necrotic reagent.'
    wither_petal: ''
    witherbloom: 'A flower that achieves the full splendor of its bloom only in the final moments of its decay, petals unfurling with theatrical timing that suggests a flair for the dramatic. Poets compose entire elegies about it, while alchemists merely note its decomposition rate with clinical detachment.'
    wizard_staff: 'Disguised as a walking stick. The fire at the tip is less convincing.'
    wolf_fang_blade: 'A blade with wolf fangs embedded in the edge. The wolf did not volunteer them.'
    wolf_pelt: 'Thick forest wolf hide. Warm, durable, and carries a faint musk that makes horses deeply uncomfortable.'
    wolf_sinew: "Elastic and tough. Bowyers pay top coin for these. The wolf's opinion on the matter is no longer relevant."
    wolf_sinew_band: "Braided from an alpha wolf's sinew. It tightens, almost imperceptibly, whenever you're about to make a mistake."
    wolf_sinew_belt: "The alpha didn't give up its sinew willingly. But then again, alphas never volunteer for anything except violence. At least this one's been repurposed for holding up trousers."
    wolf_trek_boots: 'Once belonged to a wolf who outwalked every hunter Pandora Reach ever sent after him.'
    wolfbone_blade: 'The handle is carved from a timber wolf femur. It howls in strong winds, which is either atmospheric or deeply concerning.'
    wolfcrest_helm: "Crowned with a preserved wolf's head that stares forward with an expression somewhere between menacing and mildly inconvenienced. The taxidermist was reportedly drunk, which explains the slightly crossed eyes and the tongue that pokes out on the left side."
    wooden_greataxe: 'More fence post than weapon. The splinters do half the damage.'
    wool_fists: "Nothing says 'desperate brawler' quite like punching enemies with weaponized livestock byproduct."
    woolame_old: "Recovered from the glistening depths of a wooligan's digestive tract, this blade bears the unmistakable sheen of gastric survival."
    woolamu: 'This tuft of spun wool brings warmth to the chest and absolutely nothing else to the battlefield. At least the wearer will die cozy.'
    woolano: 'The perfect accessory for heroes who prefer their jewelry machine-washable.'
    wooliboots: 'Perfect for when the cold creeps in through the floorboards and dignity has already fled out the door.'
    wooligan_hammer: 'The wooligan used it to flatten grass. You found a more creative purpose.'
    wooligan_hat: 'Guaranteed to keep the head warm, though sadly not the brain inside it.'
    wooling_fleece: 'A tuft of greasy wool ripped from a lamb that absolutely did not consent. Smells like regret and barn floor.'
    wooling_practice_bow: "Strung with wooling gut. The wooling's sacrifice was involuntary but appreciated."
    worldbreaker_battleaxe: ''
    worldheart_striders: "Soled with something pulled from the deepest part of the fracture, still faintly pulsing on a rhythm nobody's matched to a heartbeat exactly, but nobody's ruled it out either."
    worldsplitter: 'Legend says the first test swing created a canyon. Legend exaggerates, but only slightly.'
    worldwound_brew_of_closing_age_genesis: 'One of the last recipes written down before the alchemists stopped writing anything down. It works; the marginal note explaining why does not survive.'
    worldwound_brew_of_closing_age_scar: 'Boiled down until it holds against the kind of injury the Wound hands out, meaning the injuries nobody expects to walk away from. Some do now.'
    worldwound_carapace_of_world_wound: 'Grown rather than forged, from a shell the Wound itself started and never finished. The gaps are exactly where it lost interest.'
    worldwound_circle_of_closing_age: "Forged in the final years, when jewelers stopped signing their work. Nobody was sure there'd be anyone left to read the name."
    worldwound_circle_of_world_wound: "A band bent from a single filament of wound-metal, closed so seamlessly you can't tell where it started. The metal can. It resents it."
    worldwound_edge: 'Drawn across the same line reality tore along when the Scar first opened. The wound remembers what shape the cut left; the blade remembers the wound.'
    worldwound_fists_of_closing_age: 'Forged near the end of everything, when the smiths stopped decorating and started just making things that would hold. These hold.'
    worldwound_fists_of_world_wound: 'Knuckle-plated in wound-glass that flakes a little with every strike. Alarming for the enemy; considered acceptable wear by everyone else.'
    worldwound_pendant: "Holds a splinter the Wound left behind, sealed the way the Wound Oracle seals everything else — carefully, and with little confidence it'll hold."
    worldwound_warboots_of_closing_age: "Soled to grip the slick edge of the Wound, where one wrong step is also, conveniently, the last one you'll ever have to worry about."
    wound_key: "Fused shut around whatever the Wound Oracle keeps sealed at the center of the Scar. It doesn't turn so much as it's persuaded, and only briefly."
    wound_marked_composite: "Layered stock that carries the Wound's mark all the way through, so cutting it never removes the mark — it just makes two of it."
    wound_marked_elixir: 'The plain version the Suture Priests keep for themselves, without the presentation they put on for pilgrims. It tastes worse and works faster.'
    wound_marked_elixir_of_origin_line: 'Distilled by the Suture Priests from the runoff of their own work, which they insist is safe and drink themselves to prove it. They are still here, so far.'
    wound_marked_greataxe_of_final_scar: 'Bears a nick the Wound put there before the smith ever touched it. The smith worked around the nick, on the sound theory that it was there for a reason.'
    wound_marked_lattice_genesis: "The same lattice grown at the mountain's oldest vent instead of the Scar, where it comes out cleaner and, the crafters insist, faintly smug about it."
    wound_marked_lattice_scar: "A brittle frame grown along the lip of the Scar, where the crystal takes the fracture's shape whether the crafter wants it to or not."
    wound_marked_loop: 'Touched once by the Wound and left with a scar of its own, which the ring wears more gracefully than most of its bearers manage.'
    wound_marked_vambraces_of_origin_line: 'Scored with the same mark the Wound leaves on everything it grazes. The smiths added it deliberately, which the Wound found unnecessary and slightly insulting.'
    wound_pilgrim_boots: 'Soled for the long climb to the Wound and, less often, for the walk back down. Most pairs only ever make the one trip.'
    wound_salve: "Packed into cracks the Scar itself won't close, meant for wounds it has personally caused. Effective on lesser injuries too, which is the only mercy involved."
    wound_ward_bow: "Strung to loose arrows along the Scar's fracture lines without widening them further, a discipline the Wall Fragments enforce without exception."
    woundstitch_grips: "Stitched by the Suture Priests from whatever holds a seam at the zenith's altitude, meaning not much, and not for long."
    woundwall_pike: 'Planted along the last wall pilgrims are permitted to cross, more boundary marker than weapon until someone tries to cross it anyway.'
    wraith_banner: ''
    wraith_boots: 'Every step echoes across two planes at once. The neighbours in both have filed a formal noise complaint, and for once, both complaints agree on every detail.'
    wraith_crowned_helm: "The crown still hums with its last owner's final thoughts, and most of them turn out to be regrets. A few, oddly specific, concern a shopping list he never got to finish."
    wraith_grimoire: 'A running tally of debts owed by the dead. It updates itself. It is never in your favor.'
    wraith_lantern_shard: "Broken off the lantern a wraith carries everywhere it drifts. The flame inside was never fire — it's memory, and memory, it turns out, burns considerably slower."
    wraith_lantern_staff: 'Topped with a lantern the Nave-Stone Wraiths use to lure barge-folk off the safe paths. It still burns cold, and it still works.'
    wraith_scripture: "It writes itself when nobody's watching, in a hand that keeps changing along with whoever's reading it. Scholars who've studied it can't agree if that's fascinating or deeply, personally alarming. It's usually both."
    wraith_spellbook: "Written by someone with very strong opinions about the afterlife's customer service."
    wraith_touch_gauntlets: "Everything they touch turns faintly, politely dead. Roughly the effect of your love life, several regulars at the tavern have pointed out, but now at least it's wearable."
    wraith_whisper_amulet: 'A translucent pendant that murmurs in a tongue you almost follow. Its last owner translated exactly one word before selling it off in a hurry: behind. Nobody since has requested a second.'
    wraith_whisper_knives: 'Quenched in wraith ectoplasm, they cut cleanly through armor and, somewhat less cleanly, through sleep. The wounds close properly, victims report. The dreams never quite do.'
    yajin_starter_dagger: "Yajin's twin blades have known better days, their edges dulled by countless failed attempts at violence."
    yeast: 'A virulent strain of parasitic fungus that burrows into flesh and refuses to let go.'
    yeast_cake: 'A risen dough cake that smells of ambition and poor ventilation. Handymen use it as industrial sealant.'
    yeti_frostbite_daggers: "Carved from a yeti's claws mid-blizzard. Every cut comes with a complimentary chill."
    yeti_fur_tuft: ''
    yeti_jawbreaker: 'Named for the jaws it breaks, made from the jaw it once was.'
    yeti_scalp_hood: 'Smells like something that was definitely, probably, almost certainly real.'
    yeti_skull_crown: 'A hollow yeti skull worn as a crown. The previous owner filed a complaint. In person. Loudly.'
    yetihide_stompers: 'Boots lined with yeti fur. Guaranteed to keep your feet warm and your enemies at bay. The smell alone is a weapon.'
    zenith_alloy: 'An alloy that only takes at the highest forge on the mountain, where the air is thin enough that the smiths swear it stops arguing with them. It holds an edge nothing lower can match.'
    zenith_crown: 'Worn by whichever pilgrim makes it furthest up the fractured peak before the climb ends them. It has changed heads more times than the current wearer would like to think about.'
    zenith_greaves: "Plated to survive the climb up the fractured peak, joints reinforced where most pilgrims' knees give out first."
    zenith_signet: 'Marks its wearer as having stood at the true zenith, before the fracture, according to a claim exactly nobody currently alive can verify or deny.'
    zenith_staff: "Cut from a shard of the zenith's original peak, before the Scar took the rest of it. It points true toward whatever's left standing."
    zenithscar_draught: "Drawn from the meltwater that pools along the Scar and settles clear if you wait, cloudy if you're in a hurry. Most drinkers here are in a hurry."
    zenithscar_draught_of_summit_vigil: "Bitter enough to keep a sentry awake through a watch the quiet part of them would rather sleep through. It respects neither the sentry's wishes nor the enemy's."
    zenithscar_fangs: "Twin blades ground on opposite walls of the same crack, which is why they never sit quite parallel. The gap does the work you'd rather not admit to."
    zenithscar_greatblade: 'Balanced along the exact seam where the world came apart, so it always knows which way to fall. Usually onto someone.'
    zephyr_legwraps: 'So light they feel like wearing nothing. Which is also an option, but less protective.'
    zephyr_silk_strand: ''
    zukin_muru: 'A shinobi cowl for people who want to look like they left quietly, even when they slam the door.'
