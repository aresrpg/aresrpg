wallet_legacy:
  sui: SUI
  how_to_get: How to get SUI
  your_address: Your Wallet Address
  send_sui: Send SUI to this address. Click to copy.
  buy_directly: Buy Directly
  buy_with_card: Buy SUI with a credit card. Delivered straight to your wallet.
  buy_on_exchange: Buy on an Exchange
  withdraw_to_wallet: Buy SUI on an exchange, then withdraw it to your wallet address
    shown above.
  faq: FAQ
  wallet_description: Your personal wallet. Only you can access it. Deposit SUI to
    use in the shop.
  moonpay_desc: Credit card, Apple Pay, bank transfer
  transak_desc: Credit card, bank transfer, 100+ countries
  faq_what_is_sui: What is SUI?
  faq_what_is_sui_answer: SUI is a digital currency, like digital cash. It lives on
    a fast, secure network called the Sui blockchain. You use small amounts of SUI
    to buy items in the AresRPG shop. Think of it like game credits, except we can't
    take them from you.
  faq_why_sui: Why does AresRPG use SUI?
  faq_why_sui_answer: SUI is our preferred payment method. Transactions are instant
    (under 1 second) and cost fractions of a cent. No middleman fees. We may support
    traditional currencies (USD, EUR, etc.) in the future, but that requires significant
    legal work and comes with heavy fees and taxes we're not ready to take on yet.
  faq_legal: Is it legal?
  faq_legal_answer: Yes. Buying and holding cryptocurrency is legal in most countries.
    SUI is a legitimate digital asset traded on major regulated exchanges worldwide.
    You're simply using it as a payment method to spend on our shop. No NFTs, no crypto
    schemes.
  faq_eula: Is it allowed by the game's terms?
  faq_eula_answer: Yes. As long as cryptocurrency is used solely as a payment method
    and doesn't involve NFTs or speculative crypto schemes, it's fully compliant.
    Many major game stores even support crypto payments.
  faq_access: Who can access my wallet?
  faq_access_answer: "Only you. Your wallet is created from your Google login using
    Sui's zkLogin technology. Nobody (not even the AresRPG team) can access your
    funds or move them. Important: this wallet is meant for shop purchases only. Do
    not store large amounts here. Deposit only what you plan to spend."
  faq_balance: I sent SUI but my balance didn't update?
  faq_balance_answer: No worries. Our refresh system might be temporarily slow. Double
    check that you sent SUI to the correct address (copy it from above), and if it
    still doesn't show up, contact the team on Discord with your transaction ID for
    further help.
  add_funds: Add Funds
