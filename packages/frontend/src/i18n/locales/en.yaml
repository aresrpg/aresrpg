    movement_points: MOVEMENT POINTS (MP)
    critical_stat: CRITICAL
    wisdom_xp: WISDOM XP BONUS
    wisdom_xp_desc: Every point of effective Wisdom, including active effects, adds 1% to the XP you earn. At 100 effective Wisdom you gain double XP.
    chance_loot: CHANCE & LOOT
    chance_loot_desc: The winning team's average effective Chance, including active effects, multiplies every resolved drop rate. At 600 average team Chance the rate doubles. A drop rate can never exceed 100%.
    mob_loot_band: MOB LEVEL & DROP RATE
    mob_loot_band_desc: The authored chance is the midpoint. Across a mob's level band it scales from 80% to 120%, capped at 100%. Fixed-level mobs use the authored chance exactly. Drop quantity does not scale with mob level.
