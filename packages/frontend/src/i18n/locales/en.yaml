  welcome_title: 'Welcome to Nauvis.'
  welcome_body: 'AresRPG rewards players who learn, prepare, and work smart. Learn to optimize and automate your gameplay while spending as little SUI as possible. Follow this journey to get your footing.'
  hoe_title: 'We all need a hoe.'
  hoe_body: 'Buy a {{item}} or craft one through Characters → Jobs → Handyman. Open the recipe and select ingredients to see their sources. Look for Tinkers around Thebes and in forests; stronger players can hunt wild boars in plains and forests for gnawed branches.'
  hoe_objective: 'Own {{item}}'
  wheat_title: 'Let’s get our hands dirty.'
  wheat_body: 'Crafting your own gear starts with gathering ingredients. Wheat is used in food and materials for equipment, so it’s a good place to begin. Find a wheat node on Nauvis and gather your first crop!'
  wheat_objective: 'Harvest wheat'
  pickaxe_title: 'Your next rock star.'
  pickaxe_body: 'Your next upgrades will need more than crops. A {{item}} lets you mine minerals for crafting gear. Find one on the market or make it yourself. Your mining career has to start somewhere.'
  pickaxe_objective: 'Own {{item}}'
  quartz_title: 'Leave no stone unturned.'
  quartz_body: 'Wheat alone won’t get you geared up. Weapons and jewelry also need minerals like quartz. Use your pickaxe to gather some for your next crafts.'
  quartz_objective: 'Harvest quartz'
  sickle_title: 'A cut above.'
  sickle_body: 'Plants and mushrooms provide ingredients for potions and crafting materials. A {{item}} opens the herbalist profession. Buy one from another player or craft your own.'
  sickle_objective: 'Own {{item}}'
  mushroom_title: 'Room for one more.'
  mushroom_body: 'You’ll need more than crops and minerals to keep crafting. Green mushrooms are used in potions, leather, and other materials. Gather your first one, then keep leveling your gathering jobs to unlock more ingredients.'
  mushroom_objective: 'Harvest a green mushroom'
  token_title: 'Make your own luck.'
  token_body: 'You’re going to need plenty of items for your next crafts. Increasing your Chance improves your odds of getting loot from fights. Let’s find a {{item}} talisman and equip it!'
  token_objective: 'Own {{item}}'
  croissant_title: 'Bread before battle.'
  croissant_body: 'Lose a fight and your HP drops to zero. You can wait for it to recover, or eat to get back into action faster. Grab a {{item}}, or bake one through Characters → Jobs → Baker.'
  croissant_objective: 'Own {{item}}'
  lorito_title: 'Time to ruffle some feathers.'
  lorito_body: 'Stronger gear needs materials you won’t find in a wheat field. Dungeons offer new loot and XP, but you’ll have to fight for them. Pack some healing food, bring a key to Gilded Lorito in Thebes, and clear its final room.'
  lorito_objective: 'Complete the Gilded Lorito dungeon'
  suize_title: 'One last secret.'
  suize_body: 'Well done, adventurer. Better harvests open up new recipes, so I have one final challenge: harvest Suize yourself. Where can you find it? Consider that your first unsupervised problem.'
  suize_objective: 'Harvest Suize'
  welcome_objective: ''
