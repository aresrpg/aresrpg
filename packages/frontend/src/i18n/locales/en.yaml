    section_classes: CLASSES
    section_economy: ECONOMY
    combat_desc: Combat is turn-based on a grid. On your turn you spend Action Points (AP) to cast spells and Movement Points (MP) to move. Line of sight is a per-spell flag — most spells need it, some don't. You fight mob groups in the world and other players in the Kolizeum. Damage scales with the matching elemental stat and any raw damage bonus.
    elements: ELEMENTS
    element_earth: EARTH
    element_fire: FIRE
    element_water: WATER
    element_air: AIR
    stat_strength: Strength
    stat_intelligence: Intelligence
    stat_chance: Chance
    stat_agility: Agility
    critical_hits: CRITICAL HITS
    crit_desc: Each spell or weapon has its own base crit rate, written as a 1 in N chance. Critical reduces N, but the final rate can never exceed 1 in 2 (50%).
    crit_bonus_desc: On a critical hit the spell applies its dedicated critical effects (stronger damage or extra effects) in place of its normal ones.
    blocking: SHIELDS
    blocking_desc: Some spells grant a shield that soaks incoming damage of a matching element until it is used up. There is no stamina or guard stance, shields are the only damage absorption.
    resistance: RESISTANCE
    resistance_desc: Elemental resistance is a percentage reduction applied to the final damage, capped at 50% per element. Negative resistance (a weakness) amplifies the damage instead.
    mob_level_bands: MOB LEVEL BANDS
    mob_level_bands_desc: Within an authored level range, mob HP, XP, Agility, Wisdom, positive resistance, and scalable spell values rise from 60% to 160%. AP and MP rise from 100% to 130%. Negative resistance reverses that curve, shrinking the weakness magnitude from 160% at minimum level to 60% at maximum level.
    life_steal: LIFE STEAL
    life_steal_desc: "Drain spell effects deal damage and heal the caster for half of the health the target actually loses. Only a player's drain heals: a mob casting the same spell deals its damage and heals nothing."
    life_steal_note: Damage runs through the standard damage formula first, then the caster heals for half of the health the intended target actually lost — a hit redirected onto another fighter, or one the target converts into healing, steals nothing back.
    chatiment: CHÂTIMENT
    chatiment_desc: Châtiment converts actual nonlethal HP lost into its characteristic. Each active fighter turn has its own cap; later turns stack as separate five-turn bonuses. Mob damage feeds fully. Player-sourced damage and its cap are halved. Ares does not use erosion.
    healing: HEALING
    healing_desc: Heals apply the spell's authored base value, scaled up by a percentage of your Intelligence, plus a flat Heal bonus from gear and buffs. Healing is capped at the target's maximum health.
    healing_intel_value: +1% healing per Intelligence point
    heal_bonus: Heal bonus
    heal_bonus_value: Flat bonus from gear/buffs, added after the Intelligence scaling
    mobs: Mobs
    healing_mobs_value: Scale with Intelligence only, no heal bonus
    leveling_desc: Max level is 200. Fight mobs within your level range for optimal XP.
    points_per_level: POINTS PER LEVEL
    stat_points: Stat points
    stat_points_value: '{{n}} per level'
    stat_costs_desc: Characteristic costs depend on class and current natural value. See each class page for its complete ladder.
    spell_points: Spell points
    spell_points_value: '{{n}} per level'
    xp_milestones: XP MILESTONES
    level_10: Level 10
    level_50: Level 50
    level_100: Level 100
    base_stats: BASE STATS
    stat_vitality: Vitality
    stat_vitality_desc: +1 max HP per point
    stat_wisdom: Wisdom
    stat_wisdom_desc: XP gain bonus
    stat_strength_desc: Earth damage scaling
    stat_intelligence_desc: Fire damage, healing scaling
    stat_chance_desc: Water damage, more loot
    stat_agility_desc: Air damage scaling
    derived_formulas: DERIVED FORMULAS
    max_health: MAX HEALTH
    loot_desc: Each defeated mob rolls every entry in its loot table once. A successful entry produces a random quantity within its authored range.
    stat_rolling: STAT ROLLING
    stat_rolling_desc: Each stat is rolled uniformly within its template range. Every value is equally likely.
    archimobs: ARCHIMOBS
    archimobs_desc: 0.5% chance to spawn as the mob's archimob instead — a named, permanently stronger variant. The only rarity mechanic mobs have.
    max_members: Max members
    groups_desc: A party is a shared roster of up to {{max}} players with leader election. Being partied does nothing by itself in a fight — everyone, partied or not, must send their own join-fight transaction to enter; there is no passive or proximity inclusion.
    groups_xp: XP SHARING
    groups_xp_desc: Defeated mobs form one base-XP pool. Eligible fighters give it the Retro party coefficient, mismatched total player and mob levels reduce it, then each player receives their level's share of the party total. A player below one third of the highest player's level does not increase the coefficient. Wisdom applies last; personal damage does not matter.
    groups_loot: LOOT SHARING
    groups_loot_desc: Each defeated mob makes one shared loot roll. Successful drops are assigned round-robin across winning players; adding players never creates extra rolls.
    dungeons_desc: Find a dungeon portal in a searched zone, spend its key, then clear the rooms in order. Each portal has its own live staging lobby.
    dungeon_entry: Entry
    dungeon_entry_value: A key at a discovered zone portal
    dungeon_instance: Instance
    dungeon_instance_value: Portal-local lobby with public or group fights
    dungeon_completion: Completion
    dungeon_completion_value: Clear every room
    dungeon_reward: Reward
    dungeon_reward_value: Standard loot distribution
    classes_desc: 12 classes. Weapons are universal — any class can equip and use any weapon type — but wielding the weapon designed for your class grants +10% damage and crit damage. Each class unlocks its spells at fixed levels as you rank up.
    table_class: CLASS
    table_weapon: AFFINITY
    table_hp: HP
    role_warrior: Warrior
    role_assassin: Assassin
    role_berserker: Berserker
    role_druid: Druid
    role_chronomancer: Chronomancer
    role_guardian: Guardian
    role_archer: Archer
    role_prospector: Prospector
    role_brawler: Brawler
    role_tomoda: Beastmaster
    role_gambler: Gambler
    role_healer: Healer
    weapon_daggers: Daggers
    weapon_spear: Spear
    weapon_bow: Bow
    weapon_axe: Axe
    weapon_sword: Sword
    marketplace: MARKETPLACE
    marketplace_desc: Gear and characters list on the kiosk at any price you set; buyers pay instantly. Resources trade against SUI in swap pools instead, no listings. Every sale pays a 10% royalty — the marketplace is the only way to sell.
    section_forgemagie: FORGEMAGIE
    forgemagie_desc: Forgemagie is the rune crafting system. Crush equipment into runes, then apply those runes to other gear to modify its stats. A high-risk, high-reward endgame system for perfecting equipment.
    crushing: CRUSHING
    crushing_desc: "Each stat line on the crushed item rolls independently — higher stat values and heavier stats produce more runes. There is no server: the yield divisor combines a fixed per-item-level curve with the item template's own taux, a shared on-chain inflation coefficient (1%-4000%) that crushing itself pushes down for that template and up for its neighbors."
    crushing_tiers_desc: Rune tier (Ba/Pa/Ra) is selected probabilistically. Higher stat values bias toward Ra runes.
    rune_tiers: RUNE TIERS
    rune_ba: 'Tier 1: lowest weight per rune'
    rune_pa: 'Tier 2: medium weight per rune'
    rune_ra: 'Tier 3: highest weight per rune, double XP'
    rune_weight_desc: Each rune starts from value × unit weight; Retro rounds the result up to a whole weight. Weight is auto-computed.
    rune_table_stat: STAT
    rune_table_note: Range, Movement, and Action runes apply once each; Critical Chance up to 10 times. Critical and Critical Outcomes have no rune at all.
    rune_stat_range: Range
    rune_stat_movement: Movement
    rune_stat_action: Action
    rune_stat_raw_damage: Raw Damage
    rune_stat_critical_chance: Critical Chance
    rune_stat_earth_resist: Earth Resistance
    rune_stat_fire_resist: Fire Resistance
    rune_stat_water_resist: Water Resistance
    rune_stat_air_resist: Air Resistance
    stat_unit_weights: STAT UNIT WEIGHTS
    stat_unit_weights_desc: Each stat has a unit weight reflecting its combat power. Items with heavy stat lines yield more runes when crushed, consume more item budget, and are harder to over-mage.
    rune_application: RUNE APPLICATION
    rune_application_desc: 'Temporarily unlocked at level 1 of the gear category’s corresponding craft job for testing. Apply runes to equipment, one at a time, to modify its stats. Three outcomes are possible:'
    outcome_critical_success: Critical Success
    outcome_critical_success_desc: Rune passes, no stats lost
    outcome_neutral: Neutral Success
    outcome_neutral_desc: Rune passes, other stats may decrease
    outcome_critical_failure: Critical Failure
    outcome_critical_failure_desc: Rune fails, stats lost equal to rune weight
    success_rate: SUCCESS RATE
    success_rate_desc: 'Success depends on how close the stat is to its maximum: near 0% is ~99% success, near max is ~50%, and exotic stats sit at ~1% regardless of level. Whether a success lands Critical (no loss) or Neutral (weight paid) shifts the same way, plus a small +0.2% per job level above 1. There is no cap on which item level your job can work on.'
    puits: SINK (PUITS)
    puits_desc: A weight counter, shown in the UI, that accumulates when stat losses exceed the rune weight. It absorbs future losses before other stats are affected. It persists on the item and follows it between workbenches and owners.
    over_maging: OVER-MAGING
    over_maging_desc: Push stats above their natural maximum. Each stat line is capped at 101 extra weight. Max over-mage depends on the stat's unit weight — a light stat like Vitality (weight 0.25) can be pushed ~404 points over, a heavy one like Wisdom (weight 3) only ~33.
    forgemagie_tips: TIPS
    forgemagie_tips_desc: "For exotic/over-mage: strip cheap stats first to build a large sink, then pass the hard stat while buffered, then re-add lost stats (easy since they're far below max). Over-maged and exotic stats are lost first on failure."
    forgemagie_xp: EXPERIENCE
    forgemagie_xp_desc: 'XP is awarded only on success (Critical or Neutral). Higher level items and heavier runes give significantly more XP. Ra runes grant double XP compared to Ba and Pa runes. Formula: max(1, runeWeight × (1 + itemLevel / 50) × tierMultiplier) where tierMultiplier is 2 for Ra, 1 otherwise.'
