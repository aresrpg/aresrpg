    section_loot: LOOT & DROPS
    section_groups: GROUPS
    section_dungeons: DUNGEONS
    section_classes: CLASSES
    section_economy: ECONOMY
    combat_desc: Combat is turn-based on a grid. On your turn you spend Action Points (AP) to cast spells and Movement Points (MP) to move. Line of sight is a per-spell flag — most spells need it, some don't. You fight mob groups in the world and other players in the Kolizeum. Damage scales with the matching elemental stat and any raw damage bonus.
    elements: ELEMENTS
    element_earth: EARTH
    element_fire: FIRE
    element_water: WATER
    element_air: AIR
    stat_strength: Strength
    stat_intelligence: Intelligence
    stat_chance: Chance
    stat_agility: Agility
    critical_hits: CRITICAL HITS
    crit_desc: Each spell or weapon has its own base crit rate, written as a 1 in N chance. Critical reduces N, but the final rate can never exceed 1 in 2 (50%).
    crit_bonus_desc: On a critical hit the spell applies its dedicated critical effects (stronger damage or extra effects) in place of its normal ones.
    blocking: SHIELDS
    blocking_desc: Some spells grant a shield that soaks incoming damage of a matching element until it is used up. There is no stamina or guard stance, shields are the only damage absorption.
    resistance: RESISTANCE
    resistance_desc: Elemental resistance is a percentage reduction applied to the final damage, capped at 60% per element. Negative resistance (a weakness) amplifies the damage instead.
    life_steal: LIFE STEAL
    life_steal_desc: "Drain spell effects deal damage and heal the caster for half of the health the target actually loses. Only a player's drain heals: a mob casting the same spell deals its damage and heals nothing."
    life_steal_note: Damage runs through the standard damage formula first, then the caster heals for half of the health the intended target actually lost — a hit redirected onto another fighter, or one the target converts into healing, steals nothing back.
    healing: HEALING
    healing_desc: Heals apply the spell's authored base value, scaled up by a percentage of your Intelligence, plus a flat Heal bonus from gear and buffs. Healing is capped at the target's maximum health.
    healing_intel_value: +1% healing per Intelligence point
    heal_bonus: Heal bonus
    heal_bonus_value: Flat bonus from gear/buffs, added after the Intelligence scaling
    mobs: Mobs
    healing_mobs_value: Scale with Intelligence only, no heal bonus
    leveling_desc: Max level is 200. Fight mobs within your level range for optimal XP.
    points_per_level: POINTS PER LEVEL
    stat_points: Stat points
    stat_points_value: '{{n}} per level'
    spell_points: Spell points
    spell_points_value: '{{n}} per level'
    xp_milestones: XP MILESTONES
    level_10: Level 10
    level_50: Level 50
    level_100: Level 100
    base_stats: BASE STATS
    stat_vitality: Vitality
    stat_vitality_desc: +1 max HP per point
    stat_wisdom: Wisdom
    stat_wisdom_desc: XP gain bonus
    stat_strength_desc: Earth damage scaling
    stat_intelligence_desc: Fire damage, healing scaling
    stat_chance_desc: Water damage, more loot
    stat_agility_desc: Air damage scaling
    derived_formulas: DERIVED FORMULAS
    max_health: MAX HEALTH
    loot_desc: Each drop entry has its own fixed chance, rolled independently when the mob dies. Quantity is random within the entry's range.
    stat_rolling: STAT ROLLING
    stat_rolling_desc: Each stat is rolled uniformly within its template range. Every value is equally likely.
    archimobs: ARCHIMOBS
    archimobs_desc: 0.5% chance to spawn as the mob's archimob instead — a named, permanently stronger variant. The only rarity mechanic mobs have.
    max_members: Max members
    groups_desc: A party is a shared roster of up to {{max}} players with leader election. Being partied does nothing by itself in a fight — everyone, partied or not, must send their own join-fight transaction to enter; there is no passive or proximity inclusion.
    groups_xp: XP SHARING
    groups_xp_desc: A won fight's total XP splits evenly across every fighter in it, then each player's own Wisdom and the mob group's age bonus apply on top. How much damage you personally dealt does not change your share.
    groups_loot: LOOT SHARING
    groups_loot_desc: Loot is not split. Every winning fighter independently rolls the mob group's full loot table using their own Chance stat — a bigger party never shrinks anyone's odds.
    dungeons_desc: 'Dungeons are entered from anywhere in their world with a key — no group instance: every keyholder inside shares the same space, just like the open world.'
    dungeon_entry: Entry
    dungeon_entry_value: Key item, from anywhere in the world
    dungeon_instance: Instance
    dungeon_instance_value: Shared — every keyholder sees each other
    dungeon_completion: Completion
    dungeon_completion_value: Clear every room
    dungeon_reward: Reward
    dungeon_reward_value: Standard loot distribution
    classes_desc: 12 classes. Weapons are universal — any class can equip and use any weapon type — but wielding the weapon designed for your class grants +10% damage and crit damage. Each class unlocks its spells at fixed levels as you rank up.
    table_class: CLASS
    table_weapon: AFFINITY
