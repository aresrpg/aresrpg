docs_page:
  title: Docs
  nav_label: Docs sections
  home: Home
  play: Play
  menu: Menu
  previous: Previous
  next: Next
  search: Search guides, items and mobs
  search_empty: No page matches this search.
  data_note: Numbers on these pages come from the same content files as the game.
  kinds:
    guide: Guide
    item: Item
    mob: Mob
  groups:
    start: Start here
    mechanics: 'Game mechanics'
    automated: 'Automated play'
    reference: 'Reference'
    economy: Economy
    build: Build
  guides:
    overview: What AresRPG is
    first_hour: 'Beginner guide'
    market: Marketplace
    agents: 'Connect an assistant'
    build: Build on AresRPG
    kares: KARES token
    ways: 'Ways to play'
    bots: 'Hosted bots'
  overview:
    lede: 'AresRPG is a tactical MMORPG that runs as a protocol on Sui. Characters, items, fights and the market are on-chain objects and transactions. The game you see is one client of that protocol, and there are several.'
    counts:
      items: Items
      spells: Spells
      mobs: Mobs
      recipes: Recipes
      classes: Classes
      jobs: Jobs
    protocol_title: 'A protocol, not one client'
    protocol:
      - 'The rules of the game are smart contracts. A fight, a craft, a harvest or a sale is a transaction, and its result is the same whichever interface sent it.'
      - 'Your account owns your characters and items. No interface holds them for you, except a hosted bot you choose to hand a character to.'
      - 'Every interface reads the same state. A fight started in the 3D world can be watched from another page, and loot won by a bot shows in your inventory.'
    loop_title: 'What you do in the game'
    loop:
      - 'Fight groups of mobs on a grid, in turns. Each turn you spend action points on spells and movement points on steps.'
      - 'Gather resources and craft tools, gear and consumables in your jobs.'
      - 'Clear dungeons with a party, room after room, for the boss loot.'
      - 'Trade with other players on the marketplace, for SUI.'
  ways:
    lede: 'The protocol has no single way in. Each interface below plays the same characters, with the same loot and the same market. They differ in who makes the moves and in what you need to run them.'
    note: "You can use several interfaces at once. Each account plays in one game session at a time; the site's pages can stay open beside it."
    specs:
      runs_in: Runs in
      role: Your role
      good_for: Good for
      status: Status
    play:
      manual: Manual
      automated: Automated
    items:
      world:
        name: Voxel world
        status: Playable
        body: The full game in your browser. Walk the planets, form a party and fight on the grid yourself.
          On a phone, the same client switches to touch controls.
        runs_in: Browser with a capable GPU
        role: You play every move
        good_for: Exploring and party fights
      agent:
        name: Your agent
        status: Work in progress
        body: Connect Claude, ChatGPT or Grok to a hosted AresRPG bot. Agree on an objective, then watch it
          play your character from inside the game.
        runs_in: ChatGPT, Claude or Grok
        role: Set the objective, then watch
        good_for: Hands-off runs
      sdk:
        name: Your own client
        status: Source available
        body: Build on the public SDK the game itself uses. The license permits commercial clients, remakes,
          fan tools and bots that run on the official deployment. Your client or bot signs with its
          own Sui wallet.
        runs_in: Anything you build
        role: You write the client
        good_for: Custom clients, tools, bots
  bots:
    lede: "A hosted bot plays your heroes for you on AresRPG's servers."
    wallet_title: 'The bot wallet'
    wallet:
      - 'A bot plays from its own wallet, separate from your game wallet. It is a 1-of-2 multisig: the hosted service can sign for it, and so can your Google account.'
      - 'Heroes and items you hand over move to that wallet. Play is custodial while they are there: the service signs the moves.'
      - 'You can take everything back from your own account at any time, even when the bot is offline. A recall needs your signature only.'
      - 'The bot pays its own network fees. Keep some SUI in the bot wallet. Transfer moves SUI and KARES between your two wallets.'
    does_title: 'What a bot does'
    does:
      - 'Each hero runs one activity at a time, such as fighting around a city, gathering and crafting, or clearing a dungeon. You choose it, and the bot follows it until it ends or you stop it.'
      - 'Heroes of the same bot wallet can fight as a team.'
      - 'You can pause the bot or stop a hero at any time. An action already sent to the chain still finishes.'
      - 'A bot waits when it has nothing approved to do, or when its wallet has no SUI for fees.'
    control_title: 'Who can command it'
    control:
      - "An assistant (ChatGPT, Claude or Grok): agree on an objective in chat. It calls the bot's tools within what you approved."
  first_hour:
    lede: 'The goal of your first hour: a character, a few won fights, and a tool you crafted
      yourself. The drop rates and the recipe below are the real ones.'
    drop_chance: '{{chance}}% drop chance'
    steps:
      - title: Create a character.
        body: Creation costs {{price}} SUI plus gas. Your class decides your spells, so choose with
          care.
      - title: Win your first fights.
        body: These mobs roam around the first city. Walk up to a group and challenge it.
      - title: Collect the parts for a tool.
        body: Your first farming tool is made from mob drops. Each part is listed with its best
          source.
      - title: Craft it.
        body: Open the {{job}} job and craft the tool. A craft can fail and still uses its
          ingredients, so bring spare parts.
      - title: Aim for the first dungeon.
        body: With a party and this key, you can enter the dungeon of the first city.
  market:
    lede: Players sell to players. Items and resources trade through on-chain listings, and the
      seller is paid in SUI.
    royalty: Royalty
    royalty_floor: Minimum royalty
    lot_sizes: Lot sizes
    points:
      - The buyer pays the listed price, plus the royalty, plus gas.
      - The seller receives the listed price and collects it in a separate action.
      - On a cheap listing the minimum royalty matters. Compare the full cost of a lot, not only
        its listed price.
  kares:
    lede: KARES is not ready yet. It will be added soon.
    note: This page will describe the token, its supply and its reward pools when it launches. No
      balance, price or reward figure is published before then.
    live_lede: 'KARES is the AresRPG token. It trades on Aftermath.'
  agents:
    lede: Connect ChatGPT, Claude or Grok to a hosted AresRPG bot. You agree on an objective, and
      the assistant plays your character within it. This feature is a work in progress.
    steps:
      - Choose your assistant and add the AresRPG connection address as a custom connector.
      - Sign in with Google, then approve the exact bot and what it may do.
      - Hand over a character from your inventory. You can recall it at any time.
    points:
      - The assistant never receives a wallet key, and never asks for one in chat.
      - Hosted play is custodial. A shared 1-of-2 account holds the character and the hosted agent
        signs the moves. Your Google sign-in stays your authentication and your recovery.
      - A connected bot is not always an active one. It waits when it has no approved next step.
    guide: Read the connection guide
    index: Open the agent playbook
  build:
    lede: The game client is built on a public SDK. You can build your own client, tool or bot on
      the same actions.
    source_title: Source repository
    source_body: SDK source, license and the matching release.
    playbook_title: Agent playbook
    playbook_body: 'The guides for builders: connection, custody, SDK, protocol, combat and economy.'
    blocks_title: Building blocks
    blocks:
      - 'Action composition: build the same transactions the game sends.'
      - 'Offline planning: inspect recipes and progression without a signer.'
      - 'Combat simulation: plan a turn before you commit it.'
      - 'Deployment pins: check that you talk to the official deployment.'
    license_title: License
    allowed_title: Allowed
    allowed:
      - Publishing and operating commercial clients, game remakes, fan tools, services and bots.
      - Automation that plays for profit.
    forbidden_title: Not allowed
    forbidden:
      - Deploying or republishing the game contracts, or derivatives of them, on any blockchain.
      - Using the AresRPG name or logo as your brand.
    license_note: This page is a summary. The license text is binding. Keep the license and copyright
      notices when you redistribute.
    license_link: Read the license

