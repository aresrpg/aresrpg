    critical_hits: 暴击
    crit_desc: 每个技能或武器都有基础暴击率，以N分之一表示。暴击属性会减少N，但最终概率不会超过二分之一（50%）。
    crit_bonus_desc: 暴击时，技能会用专属暴击效果替换普通效果，例如更强伤害或额外效果。
    blocking: 护盾
    blocking_desc: 部分技能提供护盾，吸收对应元素伤害直至耗尽。没有耐力或防御姿态，护盾是唯一的伤害吸收机制。
    resistance: 抗性
    resistance_desc: 元素抗性按百分比降低最终伤害，每种元素上限为50%。负抗性则会放大受到的伤害。
    mob_level_bands: 怪物等级段
    mob_level_bands_desc: 在设定等级范围内，怪物生命、经验、敏捷、智慧、正抗性及可缩放技能数值从60%增长到160%，AP和MP从100%增长到130%。负抗性反向变化，弱点幅度由最低等级的160%减至最高等级的60%。
    life_steal: 吸血
    life_steal_desc: 吸血效果造成伤害，并按目标实际损失生命的一半治疗施法者。只有玩家施放时会治疗，怪物使用相同技能只造成伤害。
    life_steal_note: 先按标准公式结算伤害，再按原目标实际损失生命的一半治疗。伤害转移给其他战斗者或被目标转化为治疗时，不会吸取生命。
    chatiment: 惩戒
    chatiment_desc: 惩戒将实际受到的非致命生命损失转化为对应属性。每个当前战斗者回合有独立上限，后续回合以独立的五回合加成叠加。怪物伤害全额计入，玩家伤害及其上限减半。Ares不使用侵蚀机制。
    healing: 治疗
    healing_desc: 治疗以技能基础值为起点，受智力百分比加成，再加装备和增益提供的固定治疗加成，最多恢复到目标最大生命。
    healing_intel_value: 每点智力增加1%治疗量
    heal_bonus: 治疗加成
    heal_bonus_value: 装备/增益的固定加成，在智力缩放后计算
    mobs: 怪物
    healing_mobs_value: 仅受智力影响，无固定治疗加成
    leveling_desc: 最高等级为200级。挑战与你等级接近的怪物可获得最佳经验。
    points_per_level: 每级点数
    stat_points: 属性点
    stat_points_value: 每级{{n}}点
    stat_costs_desc: 属性消耗取决于职业与当前基础属性。完整成长阶梯见各职业页面。
    spell_points: 技能点
    spell_points_value: 每级{{n}}点
    xp_milestones: 经验里程碑
    level_10: 10级
    level_50: 50级
    level_100: 100级
    base_stats: 基础属性
    stat_vitality: 体力
    stat_vitality_desc: 每点增加1最大生命
    stat_wisdom: 智慧
    stat_wisdom_desc: 经验收益加成
    stat_strength_desc: 地系伤害加成
    stat_intelligence_desc: 火系伤害与治疗加成
    stat_chance_desc: 水系伤害与更多掉落
    stat_agility_desc: 风系伤害加成
    derived_formulas: 派生公式
    max_health: 最大生命
    loot_desc: 每只被击败的怪物都会对掉落表中的每个条目抽取一次。成功条目会在设定范围内随机生成数量。
    stat_rolling: 属性随机生成
    stat_rolling_desc: 每项属性在模板范围内均匀随机生成，每个数值机会相同。
    archimobs: 精英变种
    archimobs_desc: 每只符合条件的怪物都有1%概率被有独立名字且永久更强的变种替代，每个成员独立抽取。
    max_members: 最大成员数
    groups_desc: 队伍是最多{{max}}位玩家的共享名单，可选举队长。组队本身不会自动加入战斗，所有人都必须发送自己的加入交易，不存在被动或靠近即加入。
    groups_xp: 经验分配
    groups_xp_desc: 击败的怪物形成基础经验池。符合条件的战斗者提供Retro队伍系数，玩家与怪物总等级不匹配会降低经验，再按个人等级占队伍总等级比例分配。低于最高等级玩家三分之一的玩家不会提高系数。智慧最后计算，个人伤害不影响分配。
    groups_loot: 战利品分配
    groups_loot_desc: 每只被击败的怪物进行一次共享掉落抽取。成功掉落轮流分给获胜玩家，增加玩家不会增加抽取次数。
    dungeons_desc: 前往城市内的地下城入口，消耗钥匙后依次攻克房间。每个地下城都有一个实时准备大厅。
    dungeon_entry: 进入
    dungeon_entry_value: 在城市入口使用对应钥匙
    dungeon_instance: 副本
    dungeon_instance_value: 支持公开或队伍战斗的地下城大厅
    dungeon_completion: 完成
    dungeon_completion_value: 通关所有房间
    dungeon_reward: 奖励
    dungeon_reward_value: 标准战利品分配
    classes_desc: 共有12种职业。任何职业都能使用所有武器，但使用对应职业的亲和武器可获得10%伤害和暴击伤害加成。各职业随等级在固定节点解锁技能。
    table_class: 职业
    table_weapon: 亲和武器
    table_hp: 生命
    role_warrior: 战士
    role_assassin: 刺客
    role_berserker: 狂战士
    role_druid: 德鲁伊
    role_chronomancer: 时空法师
    role_guardian: 守护者
    role_archer: 弓箭手
    role_prospector: 寻宝者
    role_brawler: 斗士
    role_tomoda: 驯兽师
    role_gambler: 赌徒
    role_healer: 治疗者
    weapon_daggers: 匕首
    weapon_spear: 长矛
    weapon_bow: 弓
    weapon_axe: 斧
    weapon_sword: 剑
    marketplace: 市场
    marketplace_desc: 装备和角色可在售货亭自由定价上架，买家即时付款。资源则在交换池中与SUI兑换，无需挂单。每笔销售支付10%版税，市场是唯一的销售途径。
    section_forgemagie: 符文锻造
    forgemagie_desc: 符文锻造可将装备分解成符文，再将符文应用于其他装备以修改属性。这是一套高风险高回报的终局装备完善系统。
    crushing: 分解
    crushing_desc: 被分解物品的每项属性独立抽取，数值越高、权重越大，符文产量越多。产量无需服务器决定：除数由固定物品等级曲线与模板自身的链上通胀系数（1%至4000%）共同决定。分解会降低本模板系数，并提高邻近模板的系数。
    crushing_tiers_desc: 符文阶级（Ba/Pa/Ra）随机选择。属性越高，越倾向于获得Ra符文。
    rune_tiers: 符文阶级
    rune_ba: 1阶：每枚符文权重最低
    rune_pa: 2阶：每枚符文权重中等
    rune_ra: 3阶：每枚符文权重最高，双倍经验
    rune_weight_desc: 符文权重等于数值乘以单位权重，Retro会向上取整。权重自动计算。
    rune_table_stat: 属性
    rune_table_note: 射程、移动和行动符文各应用一次，暴击概率最多10次。Critical和Critical Outcomes没有对应符文。
    rune_stat_range: 射程
    rune_stat_movement: 移动
    rune_stat_action: 行动
    rune_stat_raw_damage: 固定伤害
    rune_stat_critical_chance: 暴击概率
    rune_stat_earth_resist: 地系抗性
    rune_stat_fire_resist: 火系抗性
    rune_stat_water_resist: 水系抗性
    rune_stat_air_resist: 风系抗性
    stat_unit_weights: 属性单位权重
    stat_unit_weights_desc: 每项属性的单位权重反映其战斗强度。高权重属性使物品分解产出更多符文，消耗更多装备预算，也更难超限强化。
    rune_application: 应用符文
    rune_application_desc: 为测试暂时在对应制作专业1级开放。每次对装备应用一个符文以修改属性，可能出现三种结果：
    outcome_critical_success: 完美成功
    outcome_critical_success_desc: 符文生效，不损失属性
    outcome_neutral: 普通成功
    outcome_neutral_desc: 符文生效，其他属性可能下降
    outcome_critical_failure: 严重失败
    outcome_critical_failure_desc: 符文失败，损失与符文权重相等的属性
    success_rate: 成功率
    success_rate_desc: 成功率取决于属性距上限的程度：接近0%时约99%，接近上限时约50%，异属性约1%，与等级无关。完美成功（无损失）与普通成功（支付权重）的比例同样变化，并在专业每超过1级时增加0.2%。专业可加工的物品等级没有上限。
    puits: 余量（PUITS）
    puits_desc: 界面显示的权重计数器。当属性损失超过符文权重时会累积余量，之后优先吸收损失。余量保存在物品上，随物品在工作台和所有者之间流转。
    over_maging: 超限强化
    over_maging_desc: 可将属性提升至自然上限之上，每项最多增加101权重。轻量属性如体力（权重0.25）可额外提升约404点，智慧（权重3）则只能约33点。
    forgemagie_tips: 技巧
    forgemagie_tips_desc: 异属性或超限强化时，可先移除低成本属性积累余量，再利用缓冲强化困难属性，最后补回损失属性（远低于上限时较容易）。失败时优先损失超限和异属性。
    action_points: 行动值（AP）
    movement_points: 移动值（MP）
    critical_stat: 暴击
    wisdom_xp: 智慧经验加成
    wisdom_xp_desc: 每点有效智慧（包括主动效果）增加1%经验收益，有效智慧达到100时经验翻倍。
    chance_loot: 幸运与掉落
    chance_loot_desc: 获胜队伍的平均有效幸运（包括主动效果）会提高每项掉率。队伍平均幸运为600时，掉率翻倍，但不会超过100%。
    mob_loot_band: 怪物等级与掉率
    mob_loot_band_desc: 设定概率是中间值，在怪物等级段内从80%缩放至120%，最高100%。固定等级怪物使用原概率，掉落数量不随怪物等级变化。
