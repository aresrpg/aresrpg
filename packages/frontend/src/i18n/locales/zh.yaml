  world_character_body: 这是你当前使用的角色。右键点击附近其他角色，即可查看可用的玩家互动。
  world_character_tabs_title: 操控多个角色
  world_character_tabs_body: 你最多可以拥有六个角色。邀请自己的其他角色入队并开启队伍跟随，他们便会随你移动，并在抵达后自动加入符合条件的世界战斗。
  fight_title: 你的首场链上战斗
  fight_body: 战斗采用回合制。选择移动和技能，所有操作会一起准备。结束回合会将整个回合作为一笔Sui交易提交，并计算后续怪物回合，直到下一位玩家能够行动。所有权威战斗状态均在Sui上结算。获胜后，最后一笔Sui交易使用链上随机数抽取共享战利品，将每份奖励放入对应玩家的背包。
  equipment_gear_title: 装备
  equipment_gear_body: 装备中的物品属于当前角色。将装备拖到人偶上，检查加成，然后一并确认更改。
  equipment_inventory_title: 共享背包
  equipment_inventory_body: 此账户的所有角色共享背包。选择上方另一个角色，即可让其装备相同的可用物品。
  stats_title: 属性
  stats_body: 分配属性点让角色更强。体力增加生命，智慧提高经验收益及AP/MP损失抗性，幸运增强水系伤害和掉落概率，敏捷增强风系伤害、暴击、牵制与脱离牵制能力。
  spells_title: 技能
  spells_body: 角色成长会解锁新技能。升级获得的技能点可以在这里用于强化已解锁技能。
