    combat_desc: 战斗在网格上按回合进行。每回合使用行动值（AP）施放技能，移动值（MP）进行移动。技能各自决定是否需要视线，多数需要，部分不需要。你可以在世界中挑战怪物群，也可在竞技场与玩家战斗。伤害受对应元素属性和固定伤害加成影响。
