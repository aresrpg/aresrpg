  faq: 常见问题
  wallet_description: 你的个人钱包，只有你能访问。存入SUI，用于网络费用和玩家市场交易。
  moonpay_desc: 信用卡、Apple Pay、银行转账
  transak_desc: 信用卡、银行转账，覆盖100多个国家
  faq_what_is_sui: 什么是SUI？
  faq_what_is_sui_answer: SUI是一种数字货币，类似数字现金。它运行于名为Sui区块链的快速安全网络。你使用少量SUI支付网络费用，也可在市场与其他玩家直接交易。
  faq_why_sui: AresRPG为什么使用SUI？
  faq_why_sui_answer: SUI是我们首选的支付方式。交易即时完成（不到1秒），费用不足一美分，无中间商费用。未来可能支持美元、欧元等传统货币，但这需要大量法律工作，并涉及我们尚未准备承担的高额费用和税务。
  faq_legal: 这合法吗？
  faq_legal_answer: 是的。在大多数国家，购买和持有加密货币是合法的。SUI是全球主要受监管交易所交易的合法数字资产。AresRPG将其用于网络费用和玩家市场交易。
  faq_eula: 游戏条款允许吗？
  faq_eula_answer: 是的。只要加密货币仅作为支付方式，不涉及NFT或投机性加密方案，就符合规定。许多大型游戏商店也支持加密货币支付。
  faq_access: 谁能访问我的钱包？
  faq_access_answer: 只有你。钱包通过Google登录和Sui的zkLogin技术创建。任何人，包括AresRPG团队，都不能访问或转移你的资金。此钱包仅用于AresRPG活动，请勿存入大额资金，只存入计划使用的金额。
  faq_balance: 发送SUI后余额没有更新？
  faq_balance_answer: 别担心，刷新可能暂时延迟。请确认发送到正确地址（可从上方复制）。若仍未显示，请在Discord联系团队并提供交易ID。
