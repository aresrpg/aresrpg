    section_economy: KINH TẾ
    combat_desc: Chiến đấu theo lượt trên lưới. Trong lượt, dùng điểm hành động để tung phép và điểm di chuyển để đi. Mỗi phép quy định có cần tầm nhìn hay không. Bạn đánh nhóm quái ngoài thế giới và đấu người chơi ở đấu trường. Sát thương tăng theo thuộc tính nguyên tố tương ứng và sát thương cố định.
