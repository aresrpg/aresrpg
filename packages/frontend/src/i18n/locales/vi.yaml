    critical_hits: CHÍ MẠNG
    crit_desc: Mỗi phép hoặc vũ khí có tỷ lệ chí mạng cơ bản 1 trên N. Chỉ số chí mạng giảm N nhưng tỷ lệ cuối không vượt 1 trên 2 (50%).
    crit_bonus_desc: Khi chí mạng, phép dùng hiệu ứng chí mạng riêng thay cho hiệu ứng thường, như sát thương mạnh hơn hoặc hiệu ứng thêm.
    blocking: LÁ CHẮN
    blocking_desc: Một số phép tạo lá chắn hấp thụ sát thương đúng nguyên tố cho tới khi hết. Không có thể lực hay tư thế thủ; lá chắn là cơ chế hấp thụ duy nhất.
    resistance: KHÁNG
    resistance_desc: Kháng nguyên tố giảm sát thương cuối theo phần trăm, tối đa 50% mỗi nguyên tố. Kháng âm làm tăng sát thương nhận.
    mob_level_bands: KHOẢNG CẤP QUÁI
    mob_level_bands_desc: 'Trong khoảng cấp quy định, máu, kinh nghiệm, Nhanh nhẹn, Trí tuệ, kháng dương và giá trị phép co giãn tăng từ 60% lên 160%. Điểm hành động và di chuyển tăng từ 100% lên 130%. Kháng âm đảo đường cong: độ yếu giảm từ 160% ở cấp thấp nhất xuống 60% ở cấp cao nhất.'
    life_steal: HÚT MÁU
    life_steal_desc: Hút máu gây sát thương và hồi cho người dùng một nửa máu mục tiêu thực mất. Chỉ người chơi được hồi; quái dùng cùng phép chỉ gây sát thương.
    life_steal_note: Tính sát thương theo công thức chuẩn trước, rồi hồi một nửa máu mục tiêu dự định thực mất. Đòn bị chuyển sang người khác hoặc đổi thành hồi máu không hút lại gì.
    chatiment: TRỪNG PHẠT
    chatiment_desc: Trừng phạt đổi lượng máu thực mất không gây chết thành thuộc tính tương ứng. Mỗi lượt của người đang hành động có giới hạn riêng; lượt sau cộng thành thưởng riêng kéo dài năm lượt. Sát thương quái tính đủ, sát thương người chơi và giới hạn giảm nửa. Ares không dùng xói mòn.
    healing: HỒI MÁU
    healing_desc: Hồi máu dùng giá trị gốc của phép, tăng theo phần trăm Trí lực rồi cộng thưởng Hồi máu cố định từ trang bị và tăng cường. Không vượt máu tối đa của mục tiêu.
    healing_intel_value: +1% hồi máu mỗi điểm Trí lực
    heal_bonus: Thưởng hồi máu
    heal_bonus_value: Thưởng cố định từ trang bị/tăng cường, cộng sau Trí lực
    mobs: Quái vật
    healing_mobs_value: Chỉ theo Trí lực, không có thưởng hồi máu
    leveling_desc: Cấp tối đa là 200. Đánh quái cùng khoảng cấp để nhận kinh nghiệm tốt nhất.
