welcome_title: Chào mừng đến AresRPG
welcome_body: AresRPG là MMORPG hoàn toàn trên chuỗi với nền kinh tế do người chơi vận hành. Tạo nhân vật đầu tiên, vào thế giới và chiến đấu với quái vật.
welcome_need_sui: 'Bạn cần một ít SUI để chơi: nhân vật đầu tiên giá {{price}} SUI và cần giữ ít nhất {{fee}} SUI để trả phí. Nạp SUI vào địa chỉ bên dưới để bắt đầu.'
insufficient_sui: Cần giữ ít nhất {{fee}} SUI trong số dư để trả phí.
