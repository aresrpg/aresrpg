  game_title: AresRPG · MMORPG voxel trên chuỗi
  world_image: Thế giới voxel AresRPG
  sale_description: Đợt bán công khai đầu tiên của KARES. Cùng xây dựng chương tiếp theo của AresRPG.
  formula_chastisement: G = min(ΔMáu × S, GIỚI HẠN × S − Glượt) · S = 1 với quái, ½ với người chơi
  formula_drop: đồ rơi = min(100%, tỷ lệ cơ bản × khoảng cấp quái × (600 + May mắn trung bình nhóm) / 600)
  formula_xp: KN = quỹ KN cơ bản × hệ số nhóm × cân bằng cấp × cấp người chơi / cấp nhóm × (100 + Trí tuệ) / 100
