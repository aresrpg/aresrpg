  allocation_rationale: 'Khi ra mắt có 590.000 KARES (59%): bán, thanh khoản và đội ngũ. Lịch mở thêm tối đa khoảng 82.000 trong năm đầu, tức 13,90% lượng ban đầu, chưa tính đốt. Staking dừng khi không ai stake. Quỹ cộng đồng mở theo lịch. Chiến đấu có thể phát ít hơn. Tất cả dùng token sẵn có, không lạm phát do tạo mới. Quyên góp chỉ phân phối lại token. Không bảo đảm kết quả giá.'
