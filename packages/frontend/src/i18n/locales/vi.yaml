tutorial:
  progress: '{{current}} / {{total}}'
  skip: Bỏ qua hướng dẫn
  back: Quay lại
  next: Tiếp theo
  finish: Hoàn tất
  fight_enter: Vào trận
  reset_title: Hướng dẫn
  reset_hint: Hiện lại phần giới thiệu khi bạn mở từng trang lần tới.
  reset_action: Đặt lại
  world_compass_title: Thế giới và khu vực chung
  world_compass_body: AresRPG có nhiều thế giới mở khóa theo tiến trình của bạn. Mỗi thế giới chia thành các khu vực có quái vật, tài nguyên và ngục tối. Ai cũng có thể khám phá khu vực và kết quả được chia sẻ với mọi người chơi.
  world_hud_title: Máu và ô dùng nhanh
  world_hud_body: Khu vực này hiển thị máu và các ô dùng nhanh vật phẩm. Khi vào trận, cùng vị trí này trở thành thanh phép.
  world_fps_title: Điều khiển thế giới
  world_fps_body: Địa hình được tạo tất định từ dữ liệu đã công bố. Sui lưu thế giới và vị trí X/Z có thẩm quyền, còn độ cao được tính cục bộ. Vì vậy chế độ Phẳng chỉ đổi cách hiển thị cùng không gian. Bạn cũng có thể đổi chất lượng và giới hạn trận ngoài thế giới cho thành viên nhóm.
  world_character_title: Người chơi trong thế giới
  world_character_body: Đây là nhân vật đang hoạt động của bạn. Nhấp chuột phải vào nhân vật khác ở gần để mở các tương tác.
  world_character_tabs_title: Chơi nhiều nhân vật
  world_character_tabs_body: Bạn có thể sở hữu tối đa sáu nhân vật. Mời các nhân vật khác của mình vào nhóm và bật Theo trưởng nhóm để họ đi cùng bạn, rồi tự tham gia các trận ngoài thế giới phù hợp khi tới nơi.
  fight_title: Trận chiến trên chuỗi đầu tiên
  fight_body: Trận đấu diễn ra theo lượt. Chọn di chuyển và phép, các hành động được chuẩn bị cùng nhau. Kết thúc lượt gửi cả lượt bằng một giao dịch Sui, rồi tính các lượt quái tiếp theo cho tới khi người chơi khác có thể hành động. Trạng thái chiến đấu có thẩm quyền được chốt trên Sui. Sau chiến thắng, giao dịch Sui cuối dùng ngẫu nhiên trên chuỗi để chia chiến lợi phẩm và đưa thưởng vào túi đồ của từng người nhận.
  equipment_gear_title: Trang bị
  equipment_gear_body: Vật phẩm đang trang bị thuộc nhân vật đã chọn. Kéo trang bị lên hình nhân, xem chỉ số cộng thêm rồi xác nhận tất cả thay đổi.
  equipment_inventory_title: Túi đồ dùng chung
  equipment_inventory_body: Mọi nhân vật trong tài khoản dùng chung túi đồ. Chọn nhân vật khác phía trên để trang bị những vật phẩm còn sẵn cho họ.
  stats_title: Thuộc tính
  stats_body: Dùng điểm thuộc tính để mạnh hơn. Sinh lực tăng máu; Trí tuệ tăng kinh nghiệm và kháng mất điểm hành động/di chuyển; May mắn tăng sát thương nước và tỷ lệ chiến lợi phẩm; Nhanh nhẹn tăng sát thương gió, chí mạng, khóa chân và thoát khóa chân.
  spells_title: Phép
  spells_body: Nhân vật tiến bộ sẽ mở phép mới. Lên cấp cho điểm phép để nâng các phép đã mở tại đây.
  jobs_title: Nghề
  jobs_body: Theo dõi tiến trình thu thập và chế tạo, xem công thức và làm vật phẩm tại đây. Nếu có nhiều nhân vật, bạn có thể cố định trang này cho thợ chế tạo trong Cài đặt.
  runeforge_title: Lò khắc ngọc
  runeforge_body: Khi nghề chế tạo phù hợp đạt cấp {{level}}, bạn có thể nâng trang bị bằng ngọc khắc. Nghiền vật phẩm để lấy ngọc rồi dùng tại đây.
