wallet_legacy:
  sui: SUI
  how_to_get: Cách nhận SUI
  your_address: Địa chỉ ví của bạn
  send_sui: Gửi SUI tới địa chỉ này. Nhấp để sao chép.
  buy_directly: Mua trực tiếp
  buy_with_card: Mua SUI bằng thẻ tín dụng, nhận thẳng vào ví.
  buy_on_exchange: Mua trên sàn
  withdraw_to_wallet: Mua SUI trên sàn rồi rút về địa chỉ ví phía trên.
  faq: Câu hỏi thường gặp
  wallet_description: Ví cá nhân chỉ bạn có thể truy cập. Nạp SUI để trả phí mạng và giao dịch với người chơi.
  moonpay_desc: Thẻ tín dụng, Apple Pay, chuyển khoản
  transak_desc: Thẻ tín dụng, chuyển khoản, hơn 100 quốc gia
  faq_what_is_sui: SUI là gì?
  faq_what_is_sui_answer: SUI là tiền kỹ thuật số, giống tiền mặt số. Nó hoạt động trên mạng nhanh và an toàn gọi là chuỗi Sui. Bạn dùng lượng nhỏ SUI trả phí mạng và có thể giao dịch trực tiếp với người chơi trên chợ.
  faq_why_sui: Vì sao AresRPG dùng SUI?
  faq_why_sui_answer: SUI là phương thức thanh toán ưu tiên. Giao dịch tức thì, dưới một giây, phí chỉ một phần xu và không có phí trung gian. Tương lai có thể hỗ trợ USD, EUR và tiền truyền thống khác, nhưng cần nhiều thủ tục pháp lý cùng phí và thuế lớn mà chúng tôi chưa sẵn sàng đảm nhận.
  faq_legal: Có hợp pháp không?
  faq_legal_answer: Có. Mua và giữ tiền mã hóa là hợp pháp ở phần lớn quốc gia. SUI là tài sản số được giao dịch trên các sàn lớn được quản lý trên thế giới. AresRPG dùng nó cho phí mạng và giao dịch giữa người chơi.
  faq_eula: Điều khoản trò chơi có cho phép không?
  faq_eula_answer: Có. Khi tiền mã hóa chỉ dùng để thanh toán, không liên quan NFT hay mô hình đầu cơ, nó phù hợp điều khoản. Nhiều cửa hàng game lớn cũng hỗ trợ thanh toán bằng tiền mã hóa.
  faq_access: Ai có thể truy cập ví của tôi?
  faq_access_answer: Chỉ bạn. Ví được tạo từ đăng nhập Google bằng công nghệ zkLogin của Sui. Không ai, kể cả đội AresRPG, có thể truy cập hoặc chuyển tiền của bạn. Ví này chỉ dành cho hoạt động AresRPG. Không giữ số tiền lớn; chỉ nạp phần định dùng.
  faq_balance: Đã gửi SUI nhưng số dư chưa cập nhật?
  faq_balance_answer: Đừng lo, hệ thống cập nhật có thể đang chậm. Kiểm tra đã gửi đúng địa chỉ bằng cách sao chép phía trên. Nếu vẫn chưa thấy, liên hệ nhóm trên Discord kèm mã giao dịch.
