    loot_desc: Mỗi quái bị hạ gieo từng mục trong bảng rơi một lần. Mục thành công cho số lượng ngẫu nhiên trong khoảng quy định.
    stat_rolling: GIEO THUỘC TÍNH
    stat_rolling_desc: Mỗi thuộc tính được gieo đều trong khoảng mẫu. Mọi giá trị có xác suất như nhau.
    archimobs: QUÁI BIẾN THỂ HIẾM
    archimobs_desc: Mỗi quái phù hợp có 1% cơ hội được thay bằng biến thể có tên riêng và mạnh hơn vĩnh viễn. Từng con gieo độc lập.
    max_members: Thành viên tối đa
    groups_desc: Nhóm gồm tối đa {{max}} người và có chọn trưởng nhóm. Chỉ ở cùng nhóm không tự vào trận; mọi người phải gửi giao dịch tham gia riêng, không tự vào chỉ vì đứng gần.
    groups_xp: CHIA KINH NGHIỆM
    groups_xp_desc: Quái bị hạ tạo quỹ kinh nghiệm gốc. Người đủ điều kiện tạo hệ số nhóm Retro; chênh lệch tổng cấp hai bên giảm quỹ, rồi chia theo tỷ trọng cấp từng người. Người dưới một phần ba cấp cao nhất không tăng hệ số. Trí tuệ áp dụng cuối, sát thương cá nhân không ảnh hưởng.
    groups_loot: CHIA CHIẾN LỢI PHẨM
    groups_loot_desc: Mỗi quái bị hạ gieo đồ chung một lần. Đồ rơi được chia luân phiên cho người thắng; thêm người không tăng số lần gieo.
    dungeons_desc: Đến lối vào ngục trong thành phố, dùng chìa khóa rồi vượt các phòng theo thứ tự. Mỗi ngục có một sảnh chuẩn bị đang hoạt động.
    dungeon_entry: Vào
    dungeon_entry_value: Chìa phù hợp ở lối vào thành phố
