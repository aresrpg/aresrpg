    nft: Quà gắn với NFT
    physical: Thẻ quà tặng giấy
    game_wallet: Thưởng kỳ cựu Hytale
  campaigns:
    oeuftermath:
      title: Aftermath Eggs · Oeuftermath
      description: Người giữ Aftermath Egg lúc chụp dữ liệu nhận thẻ thú Oeuftermath. Kiểm tra ví đã giữ Egg khi đó; mua Egg sau này không tạo điều kiện nhận.
    suicune:
      title: SWEEBS · Suicune
      description: Người giữ SWEEBS lúc chụp dữ liệu nhận thẻ thú Suicune. Kết nối ví đủ điều kiện để nhập vào tài khoản trò chơi.
    suifren_bullshark:
      title: Suifren Bullsharks
      description: Đã chọn 500 ví giữ Bullshark đủ điều kiện từ dữ liệu chụp. Kiểm tra thẻ thú trong ví khi đó; chỉ giữ Bullshark không đảm bảo được chọn.
    suifren_capy:
      title: Suifren Capys
      description: Đã chọn 500 ví giữ Capy đủ điều kiện từ dữ liệu chụp. Kiểm tra thẻ thú trong ví khi đó; chỉ giữ Capy không đảm bảo được chọn.
    primemachin:
      title: Prime Machin
      description: Thẻ thú được gửi tới NFT Prime Machin trong dữ liệu chụp. Trước tiên nhận quà gắn với NFT qua Studio Mirai, rồi kết nối ví nhận tại đây để nhập.
    vaporeon:
      title: Người giữ Vaporeon
      description: Ví được chọn từ dữ liệu người giữ Vaporeon nhận thẻ thú Vaporeon. Kiểm tra ví lúc chụp dữ liệu rồi nhập thẻ tại đây.
    sui_basecamp_singapore:
      title: Sui Basecamp · Singapore
      description: Rương Sui được tặng dưới dạng thẻ giấy tại Sui Basecamp ở Singapore. Quét QR trên thẻ và đăng nhập để nhận rương. Giữ kín mã trước khi nhận.
    hytale_veterans:
      title: Kỳ cựu Hytale · Top 100
      description: Lời cảm ơn đặc biệt cho 100 người chơi Hytale đủ điều kiện đứng đầu về bộ sưu tập, thời gian chơi, kinh nghiệm nhân vật và nghề. Thưởng gửi tới địa chỉ Sui trong bản sao lưu Hytale. Dùng tài khoản Google gốc để vào ví đó.
    hytale_supporters:
      title: Người ủng hộ Hytale · Mark of the Unbroken
      description: Dành cho mọi ví Hytale đã liên kết có tổng mua cửa hàng ghi nhận hơn {threshold} SUI, không cần thuộc top 100. Danh hiệu gửi tới địa chỉ Sui trong bản sao lưu. Đăng nhập tài khoản Google gốc để tìm thẻ quà.
