  catalogue_title: Airdrop được hỗ trợ
  check_wallet: Đủ điều kiện cho một đợt tặng này? Kiểm tra ví dùng lúc chụp dữ liệu. Kết nối ví bên ngoài phía dưới để nhập thẻ quà. Với thưởng gửi vào ví trò chơi, đăng nhập cùng tài khoản Google. Thẻ giấy được nhận qua mã QR.
