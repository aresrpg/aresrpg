game_maintenance_title: Đang bảo trì
game_maintenance_body: Hợp đồng thông minh AresRPG đang tạm dừng để bảo trì. Hãy xem Discord để cập nhật.
gas_budget_toast: Thao tác vượt mức phí mạng dự trữ. Nó chưa được thực hiện và không tốn phí — hãy báo cho chúng tôi.
game_paused_toast: Trò chơi tạm dừng để cập nhật. Thao tác chưa được thực hiện — hãy thử lại sau vài phút.
movement_sync_toast: Vị trí vẫn đang đồng bộ. Hãy tiếp tục di chuyển bình thường rồi thử lại sau một lát.
fight_path_changed_toast: Bàn đấu đã thay đổi trước khi gửi bước đi. Lượt của bạn đã được khôi phục — hãy thử lại.
party_member_unavailable_toast: Nhân vật đó đã ở trong một nhóm.
fight_turn_already_forced_toast: Đã có người buộc kết thúc lượt này.
fight_placement_unavailable_toast: Ô xuất phát đó không khả dụng. Hãy chọn ô trống khác.
network_testnet: MẠNG THỬ NGHIỆM
