    weapon_axe: Rìu
    weapon_sword: Kiếm
    marketplace: CHỢ
    marketplace_desc: Trang bị và nhân vật được đăng trên quầy với giá bạn chọn, người mua trả ngay. Tài nguyên đổi lấy SUI trong bể hoán đổi, không cần đăng bán. Mỗi lần bán trả 10% bản quyền; chợ là cách bán duy nhất.
    section_forgemagie: KHẮC NGỌC
    forgemagie_desc: Khắc ngọc cho phép nghiền trang bị thành ngọc rồi dùng lên trang bị khác để đổi chỉ số. Đây là hệ thống cuối game rủi ro cao, phần thưởng lớn để hoàn thiện đồ.
    crushing: NGHIỀN
    crushing_desc: 'Mỗi dòng thuộc tính được gieo riêng khi nghiền; giá trị và trọng lượng cao cho nhiều ngọc hơn. Không cần máy chủ quyết định: số chia sản lượng kết hợp đường cong theo cấp vật phẩm với hệ số lạm phát của mẫu trên chuỗi, từ 1% tới 4000%. Nghiền làm giảm hệ số mẫu đó và tăng mẫu lân cận.'
    crushing_tiers_desc: Bậc ngọc Ba/Pa/Ra được chọn theo xác suất. Chỉ số cao thiên về ngọc Ra.
    rune_tiers: BẬC NGỌC
    rune_ba: 'Bậc 1: trọng lượng thấp nhất'
    rune_pa: 'Bậc 2: trọng lượng trung bình'
    rune_ra: 'Bậc 3: trọng lượng cao nhất, kinh nghiệm gấp đôi'
    rune_weight_desc: Trọng lượng ngọc bằng giá trị nhân trọng lượng đơn vị; Retro làm tròn lên số nguyên. Tính tự động.
    rune_table_stat: THUỘC TÍNH
    rune_table_note: Ngọc Tầm, Di chuyển và Hành động áp dụng mỗi loại một lần; Tỷ lệ chí mạng tối đa mười lần. Critical và Critical Outcomes không có ngọc.
    rune_stat_range: Tầm
    rune_stat_movement: Di chuyển
    rune_stat_action: Hành động
    rune_stat_raw_damage: Sát thương cố định
    rune_stat_critical_chance: Tỷ lệ chí mạng
    rune_stat_earth_resist: Kháng đất
    rune_stat_fire_resist: Kháng lửa
    rune_stat_water_resist: Kháng nước
    rune_stat_air_resist: Kháng gió
    stat_unit_weights: TRỌNG LƯỢNG ĐƠN VỊ
    stat_unit_weights_desc: Mỗi thuộc tính có trọng lượng phản ánh sức mạnh chiến đấu. Thuộc tính nặng cho nhiều ngọc khi nghiền, dùng nhiều ngân sách vật phẩm và khó nâng vượt mức.
    rune_application: KHẮC NGỌC
    rune_application_desc: 'Tạm mở từ cấp 1 nghề chế tạo tương ứng để thử nghiệm. Dùng từng ngọc lên trang bị để đổi chỉ số. Có ba kết quả:'
    outcome_critical_success: Thành công hoàn hảo
    outcome_critical_success_desc: Ngọc thành công, không mất thuộc tính
    outcome_neutral: Thành công thường
    outcome_neutral_desc: Ngọc thành công, chỉ số khác có thể giảm
    outcome_critical_failure: Thất bại nghiêm trọng
    outcome_critical_failure_desc: Ngọc thất bại, mất chỉ số tương đương trọng lượng ngọc
    success_rate: TỶ LỆ THÀNH CÔNG
    success_rate_desc: 'Thành công tùy mức gần tối đa: gần 0% là khoảng 99%, gần tối đa khoảng 50%, thuộc tính ngoại lai khoảng 1% bất kể cấp. Tỷ lệ thành công hoàn hảo hoặc thường đổi tương tự, cộng 0,2% mỗi cấp nghề trên cấp 1. Nghề không giới hạn cấp vật phẩm có thể xử lý.'
    puits: DƯ TRỌNG (PUITS)
    puits_desc: Bộ đếm trọng lượng tích lũy khi mất chỉ số nhiều hơn trọng lượng ngọc. Nó hấp thụ tổn thất tiếp theo trước các chỉ số khác, được giữ trên vật phẩm khi đổi bàn hay chủ.
    over_maging: NÂNG VƯỢT MỨC
    over_maging_desc: Có thể nâng thuộc tính vượt tối đa tự nhiên, mỗi dòng thêm tối đa 101 trọng lượng. Sinh lực nhẹ, trọng lượng 0,25, có thể thêm khoảng 404 điểm; Trí tuệ nặng, trọng lượng 3, chỉ khoảng 33.
    forgemagie_tips: MẸO
    forgemagie_tips_desc: Với ngoại thuộc tính hoặc vượt mức, bỏ chỉ số rẻ để tích dư trọng, khắc chỉ số khó khi có đệm rồi thêm lại chỉ số mất, dễ hơn khi còn thấp. Chỉ số vượt mức và ngoại lai mất trước khi thất bại.
    action_points: ĐIỂM HÀNH ĐỘNG
    movement_points: ĐIỂM DI CHUYỂN
    critical_stat: CHÍ MẠNG
    wisdom_xp: THƯỞNG KN TỪ TRÍ TUỆ
    wisdom_xp_desc: Mỗi điểm Trí tuệ hiệu lực, gồm hiệu ứng đang có, tăng 1% kinh nghiệm. 100 Trí tuệ cho gấp đôi kinh nghiệm.
    chance_loot: MAY MẮN VÀ ĐỒ RƠI
    chance_loot_desc: May mắn hiệu lực trung bình của đội thắng, gồm hiệu ứng, nhân mọi tỷ lệ đồ rơi. Trung bình 600 sẽ gấp đôi tỷ lệ, nhưng không quá 100%.
    mob_loot_band: CẤP QUÁI VÀ TỶ LỆ RƠI
    mob_loot_band_desc: Tỷ lệ quy định là điểm giữa. Trong khoảng cấp quái, nó co giãn từ 80% tới 120%, tối đa 100%. Quái có cấp cố định dùng đúng tỷ lệ gốc. Số lượng rơi không đổi theo cấp.
