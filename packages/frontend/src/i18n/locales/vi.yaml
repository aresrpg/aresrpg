  chapter_secret: Bí mật cuối cùng
  welcome_title: Chào mừng đến Nauvis.
  welcome_body: AresRPG thưởng cho người biết học hỏi, chuẩn bị và làm việc thông minh. Học cách tối ưu, tự động hóa lối chơi và tốn ít SUI nhất có thể. Hãy theo hành trình này để làm quen.
  hoe_title: Ai cũng cần một cái cuốc.
  hoe_body: Nauvis là thế giới đầu tiên. Trang bị mạnh hơn giúp bạn tới những thế giới nguy hiểm, còn công cụ thu thập cho nguyên liệu để chế tạo. Mua {{item}} từ người khác hoặc tự làm qua Nhân vật → Nghề → Thợ đa năng.
  hoe_objective: Sở hữu {{item}}
  wheat_title: Bắt tay vào việc nào.
  wheat_body: Tự chế trang bị bắt đầu từ thu thập nguyên liệu. Lúa mì dùng làm thức ăn và vật liệu trang bị nên rất hợp để khởi đầu. Tìm một bụi lúa mì ở Nauvis và thu hoạch lần đầu!
  wheat_objective: Thu hoạch lúa mì
  pickaxe_title: Ngôi sao khai mỏ tiếp theo.
  pickaxe_body: Nâng cấp tiếp theo cần nhiều hơn cây trồng. {{item}} giúp khai thác khoáng sản để làm trang bị. Tìm trên chợ hoặc tự chế. Sự nghiệp khai mỏ phải bắt đầu từ đâu đó.
  pickaxe_objective: Sở hữu {{item}}
  quartz_title: Không bỏ sót viên đá nào.
  quartz_body: Chỉ lúa mì thì chưa đủ để sắm trang bị. Vũ khí và trang sức còn cần khoáng sản như thạch anh. Dùng cuốc chim thu thập một ít cho các món tiếp theo.
  quartz_objective: Khai thác thạch anh
  sickle_title: Sắc hơn một bậc.
  sickle_body: Cây cỏ và nấm cung cấp nguyên liệu cho thuốc và chế tạo. {{item}} mở nghề hái thuốc. Mua từ người khác hoặc tự làm.
  sickle_objective: Sở hữu {{item}}
  mushroom_title: Thêm một cây nấm nữa.
  mushroom_body: Muốn chế tạo tiếp, bạn cần hơn cây trồng và khoáng sản. Nấm xanh dùng cho thuốc, da và các vật liệu khác. Hái cây đầu tiên rồi tiếp tục nâng nghề thu thập để mở thêm nguyên liệu.
  mushroom_objective: Hái một cây nấm xanh
  token_title: Tự tạo vận may.
  token_body: Bạn sẽ cần nhiều vật phẩm để chế tạo tiếp. Tăng May mắn giúp tăng cơ hội nhận chiến lợi phẩm. Hãy tìm bùa {{item}} và trang bị!
  token_objective: Sở hữu {{item}}
  croissant_title: Ăn bánh trước khi đánh.
  croissant_body: Thua trận khiến máu về không. Bạn có thể chờ hồi hoặc ăn để quay lại nhanh hơn. Kiếm {{item}} hoặc nướng qua Nhân vật → Nghề → Thợ bánh.
  croissant_objective: Sở hữu {{item}}
  lorito_title: Đến lúc làm xù lông rồi.
  lorito_body: Trang bị mạnh hơn cần vật liệu không có trên đồng lúa. Ngục tối cho chiến lợi phẩm và kinh nghiệm mới, nhưng bạn phải chiến đấu. Mang thức ăn hồi máu và chìa khóa tới Gilded Lorito ở Thebes, rồi vượt qua phòng cuối.
  lorito_objective: Hoàn thành ngục tối Gilded Lorito
  suize_title: Bí mật cuối cùng.
  suize_body: 'Làm tốt lắm, nhà thám hiểm. Thu hoạch tốt hơn mở ra công thức mới, nên còn một thử thách cuối: tự thu hoạch Suize. Tìm ở đâu ư? Coi như bài toán đầu tiên không có người kèm.'
  suize_objective: Thu hoạch Suize
  welcome_objective: ''
  finished_objective: ''
