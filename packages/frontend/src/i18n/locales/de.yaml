  gameplay:
    game_mechanics: SPIELMECHANIKEN
    section_combat: KAMPF
    section_leveling: AUFSTIEG
    section_stats: STATISTIKEN
    section_loot: BEUTE & DROPS
    section_groups: GRUPPEN
    section_dungeons: DUNGEONS
    section_classes: KLASSEN
    section_economy: WIRTSCHAFT
    combat_desc: Der Kampf ist rundenbasiert auf einem Raster. In deinem Zug gibst du Aktionspunkte (AP) aus, um Zauber zu wirken, und Bewegungspunkte (BP), um dich zu bewegen. Sichtlinie ist ein Flag pro Zauber — die meisten Zauber brauchen sie, manche nicht. Du kämpfst gegen Monstergruppen in der Welt und gegen andere Spieler im Kolizeum. Der Schaden skaliert mit dem passenden Elementar-Stat und etwaigem Rohschaden-Bonus.
    elements: ELEMENTE
    element_earth: ERDE
    element_fire: FEUER
    element_water: WASSER
    element_air: LUFT
    stat_strength: Stärke
    stat_intelligence: Intelligenz
    stat_chance: Glück
    stat_agility: Agilität
    critical_hits: KRITISCHE TREFFER
    crit_desc: Jeder Zauber und jede Waffe hat eine eigene Basis-Kritrate, angegeben als Chance von 1 zu N. Der Krit-Wert senkt N, aber die endgültige Chance kann 1 zu 2 (50 %) nie überschreiten.
    crit_bonus_desc: Bei einem kritischen Treffer wendet der Zauber seine eigenen kritischen Effekte an (stärkerer Schaden oder zusätzliche Effekte) anstelle seiner normalen.
    blocking: SCHILDE
    blocking_desc: Manche Zauber gewähren einen Schild, der eingehenden Schaden eines passenden Elements absorbiert, bis er aufgebraucht ist. Es gibt keine Ausdauer und keine Verteidigungshaltung, Schilde sind die einzige Schadensabsorption.
    resistance: WIDERSTAND
    resistance_desc: Elementar-Widerstand ist eine prozentuale Reduktion, die auf den finalen Schaden angewendet wird, gedeckelt bei 50% pro Element. Negativer Widerstand (eine Schwäche) verstärkt den Schaden stattdessen.
    mob_level_bands: MONSTER-LEVELBÄNDER
    mob_level_bands_desc: Innerhalb eines Levelbands steigen LP, EP, Beweglichkeit, Weisheit, positive Widerstände und skalierbare Zauberwerte von 60% auf 160%. AP und BP steigen von 100% auf 130%. Negativer Widerstand folgt der umgekehrten Kurve; die Schwäche sinkt von 160% auf Mindestlevel auf 60% auf Höchstlevel.
    life_steal: LEBENSRAUB
    life_steal_desc: 'Drain-Zaubereffekte verursachen Schaden und heilen den Wirker um die Hälfte der Lebenspunkte, die das Ziel tatsächlich verliert. Nur der Drain eines Spielers heilt: Ein Monster, das denselben Zauber wirkt, verursacht seinen Schaden und heilt sich nicht.'
    life_steal_note: Der Schaden durchläuft zuerst die Standard-Schadensformel, dann heilt sich der Wirker um die Hälfte der Lebenspunkte, die das vorgesehene Ziel tatsächlich verloren hat — ein auf einen anderen Kämpfer umgeleiteter Treffer, oder einer, den das Ziel in Heilung umwandelt, gibt nichts zurück.
    chatiment: CHÂTIMENT
    chatiment_desc: Châtiment wandelt tatsächlich verlorene, nicht tödliche LP in die angegebene Eigenschaft um. Jeder aktive Kämpferzug hat eine eigene Obergrenze; spätere Züge erzeugen getrennte Boni für fünf Züge. Monsterschaden zählt vollständig. Von Spielern verursachter Schaden und seine Obergrenze werden halbiert. Ares verwendet keine Erosion.
    healing: HEILUNG
    healing_desc: Heilungen wenden den festgelegten Basiswert des Zaubers an, hochskaliert um einen Prozentsatz deiner Intelligenz, plus einen festen Heilbonus durch Ausrüstung und Buffs. Die Heilung ist auf die maximalen LP des Ziels begrenzt.
    healing_intel_value: +1% Heilung pro Intelligenz-Punkt
    heal_bonus: Heilbonus
    heal_bonus_value: Fixer Bonus durch Ausrüstung/Buffs, addiert nach der Intelligenz-Skalierung
    mobs: Monster
    healing_mobs_value: Skaliert nur mit Intelligenz, kein Heilbonus
    leveling_desc: Maximallevel ist 200. Bekämpfe Mobs in deiner Levelreichweite für optimale EP.
    points_per_level: PUNKTE PRO LEVEL
    stat_points: Stat-Punkte
    stat_points_value: '{{n}} pro Level'
    stat_costs_desc: Die Kosten hängen von Klasse und aktuellem natürlichem Wert ab. Die Klassenseite zeigt die vollständige Leiter.
    spell_points: Zauberpunkte
    spell_points_value: '{{n}} pro Level'
    xp_milestones: EP-MEILENSTEINE
    level_10: Level 10
    level_50: Level 50
    level_100: Level 100
    base_stats: BASIS-STATS
    stat_vitality: Vitalität
    stat_vitality_desc: +1 max LP pro Punkt
    stat_wisdom: Weisheit
    stat_wisdom_desc: XP-Gewinn-Bonus
    stat_strength_desc: Erdschaden-Skalierung
    stat_intelligence_desc: Feuerschaden, Heilungsskalierung
    stat_chance_desc: Wasserschaden, mehr Beute
    stat_agility_desc: Luftschaden-Skalierung
    derived_formulas: ABGELEITETE FORMELN
    max_health: MAX LEBEN
    loot_desc: Jedes besiegte Monster würfelt jeden Eintrag seiner Beutetabelle einmal. Ein erfolgreicher Eintrag erzeugt eine zufällige Menge innerhalb seiner festgelegten Spanne.
    stat_rolling: STAT-WÜRFE
    stat_rolling_desc: Jeder Stat wird gleichmäßig in seiner Template-Reichweite gewürfelt. Jeder Wert ist gleich wahrscheinlich.
    archimobs: ARCHI-MOBS
    archimobs_desc: Jeder geeignete Mob hat eine Chance von 1 %, durch seinen benannten, dauerhaft stärkeren Archimob ersetzt zu werden. Jedes Mitglied würfelt unabhängig.
    max_members: Max Mitglieder
    groups_desc: Eine Gruppe ist ein gemeinsamer Kader von bis zu {{max}} Spielern mit Anführerwahl. Gruppiert zu sein bewirkt in einem Kampf für sich genommen nichts — jeder, gruppiert oder nicht, muss seine eigene Kampfbeitritts-Transaktion senden, um teilzunehmen; es gibt keine passive Aufnahme oder Aufnahme durch Nähe.
    groups_xp: EP-AUFTEILUNG
    groups_xp_desc: Besiegte Mobs bilden einen Basis-EP-Pool. Berechtigte Kämpfer geben ihm den Retro-Gruppenfaktor, unpassende Gesamtstufen von Spielern und Mobs verringern ihn, danach erhält jeder Spieler den Anteil seiner Stufe an der Gruppenstufe. Ein Spieler unter einem Drittel der Stufe des höchsten Spielers erhöht den Faktor nicht. Weisheit gilt zuletzt; persönlicher Schaden spielt keine Rolle.
    groups_loot: BEUTE-AUFTEILUNG
    groups_loot_desc: Jedes besiegte Monster führt einen gemeinsamen Beutewurf aus. Erfolgreiche Drops werden reihum an die siegreichen Spieler vergeben; zusätzliche Spieler erzeugen keine weiteren Würfe.
    dungeons_desc: Reise zum Dungeoneingang in seiner festgelegten Stadt, verbrauche den Schlüssel und räume die Räume der Reihe nach. Jeder Dungeon hat eine eigene Live-Lobby.
    dungeon_entry: Eingang
    dungeon_entry_value: Ein passender Schlüssel am Stadteingang
    dungeon_instance: Instanz
    dungeon_instance_value: Dungeon-Lobby mit öffentlichen oder Gruppenkämpfen
    dungeon_completion: Abschluss
    dungeon_completion_value: Jeden Raum leeren
    dungeon_reward: Belohnung
    dungeon_reward_value: Standard-Beuteverteilung
    classes_desc: 12 Klassen. Waffen sind universell — jede Klasse kann jeden Waffentyp ausrüsten und verwenden — aber das Führen der für deine Klasse vorgesehenen Waffe gewährt +10% Schaden und kritischen Schaden. Jede Klasse schaltet ihre Zauber auf festen Leveln frei, während du aufsteigst.
    table_class: KLASSE
    table_weapon: AFFINITÄT
    table_hp: LP
    role_warrior: Krieger
    role_assassin: Assassine
    role_berserker: Berserker
    role_druid: Druide
    role_chronomancer: Chronomant
    role_guardian: Wächter
    role_archer: Bogenschütze
    role_prospector: Schürfer
    role_brawler: Raufbold
    role_tomoda: Bestienmeister
    role_gambler: Spieler
    role_healer: Heiler
    weapon_daggers: Dolche
    weapon_spear: Speer
    weapon_bow: Bogen
    weapon_axe: Axt
    weapon_sword: Schwert
    marketplace: MARKTPLATZ
    marketplace_desc: Ausrüstung und Charaktere listest du im Kiosk zu einem Preis deiner Wahl; Käufer zahlen sofort. Ressourcen werden stattdessen gegen SUI in Swap-Pools gehandelt, ohne Angebote. Jeder Verkauf zahlt eine Tantieme von 10% — der Marktplatz ist der einzige Weg zu verkaufen.
    section_forgemagie: FORGEMAGIE
    forgemagie_desc: Forgemagie ist das Runen-Herstellungssystem. Zerstöre Ausrüstung zu Runen und wende diese auf andere Gegenstände an, um deren Werte zu verändern. Ein risikoreiches, aber lohnendes Endgame-System zur Perfektion der Ausrüstung.
    crushing: ZERSTÖREN
    crushing_desc: 'Jede Stat-Zeile des zerstörten Gegenstands wird unabhängig gewürfelt — höhere Werte und schwerere Stats erzeugen mehr Runen. Es gibt keinen Server: Der Ertragsteiler kombiniert eine feste Kurve pro Gegenstandslevel mit dem eigenen Taux des Item-Templates, einem gemeinsamen On-Chain-Inflationskoeffizienten (1%-4000%), den das Zerstören selbst für dieses Template senkt und für seine Nachbarn anhebt.'
    crushing_tiers_desc: Die Runenstufe (Ba/Pa/Ra) wird probabilistisch ausgewählt. Höhere Werte bevorzugen Ra-Runen.
    rune_tiers: RUNENSTUFEN
    rune_ba: 'Stufe 1: geringstes Gewicht pro Rune'
    rune_pa: 'Stufe 2: mittleres Gewicht pro Rune'
    rune_ra: 'Stufe 3: höchstes Gewicht pro Rune, doppelte EP'
    rune_weight_desc: Das Gewicht beginnt bei Wert × Einheitsgewicht; Retro rundet auf das nächste ganze Gewicht auf. Es wird automatisch berechnet.
    rune_table_stat: STAT
    rune_table_note: Reichweite-, Bewegungs- und Aktions-Runen gelten je einmal; Kritische Chance bis zu 10-mal. Kritisch und Kritische Ergebnisse haben überhaupt keine Rune.
    rune_stat_range: Reichweite
    rune_stat_movement: Bewegung
    rune_stat_action: Aktion
    rune_stat_raw_damage: Rohschaden
    rune_stat_critical_chance: Kritische Chance
    rune_stat_earth_resist: Erdresistenz
    rune_stat_fire_resist: Feuerresistenz
    rune_stat_water_resist: Wasserresistenz
    rune_stat_air_resist: Luftresistenz
    stat_unit_weights: STAT-EINHEITSGEWICHTE
    stat_unit_weights_desc: Jeder Stat hat ein Einheitsgewicht, das seine Kampfstärke widerspiegelt. Items mit schweren Stat-Linien ergeben mehr Runen beim Zermalmen, verbrauchen mehr Item-Budget und sind schwerer zu über-schmieden.
    rune_application: RUNENANWENDUNG
    rune_application_desc: 'Für Tests vorübergehend auf Stufe 1 des zur Ausrüstungskategorie gehörenden Handwerksberufs freigeschaltet. Wende Runen einzeln auf Ausrüstung an, um ihre Werte zu verändern. Drei Ergebnisse sind möglich:'
    outcome_critical_success: Kritischer Erfolg
    outcome_critical_success_desc: Rune gelingt, keine Werte verloren
    outcome_neutral: Neutraler Erfolg
    outcome_neutral_desc: Rune gelingt, andere Werte können sinken
    outcome_critical_failure: Kritischer Fehlschlag
    outcome_critical_failure_desc: Rune scheitert, Werteverlust gleich Runengewicht
    success_rate: ERFOLGSRATE
    success_rate_desc: 'Der Erfolg hängt davon ab, wie nah der Wert am Maximum ist: nahe 0% sind ~99% Erfolg, nahe Max sind ~50%, und exotische Stats liegen unabhängig vom Level bei ~1%. Ob ein Erfolg Kritisch (kein Verlust) oder Neutral (Gewicht bezahlt) ausfällt, verschiebt sich genauso, plus kleine +0,2% pro Berufsstufe über 1. Es gibt keine Obergrenze dafür, an welchem Gegenstandslevel dein Beruf arbeiten kann.'
    puits: SENKE (PUITS)
    puits_desc: Ein in der Oberfläche angezeigter Gewichtszähler, der sich ansammelt, wenn Werteverluste das Runengewicht übersteigen. Er absorbiert zukünftige Verluste, bevor andere Werte betroffen sind. Er bleibt am Gegenstand und folgt ihm zwischen Werkbänken und Besitzern.
    over_maging: ÜBER-SCHMIEDEN
    over_maging_desc: Treibe Werte über ihr natürliches Maximum. Jede Wertzeile ist auf 101 zusätzliches Gewicht begrenzt. Das maximale Über-Schmieden hängt vom Einheitsgewicht des Stats ab — ein leichter Stat wie Vitalität (Gewicht 0,25) kann um ~404 Punkte überschritten werden, ein schwerer wie Weisheit (Gewicht 3) nur um ~33.
    forgemagie_tips: TIPPS
    forgemagie_tips_desc: 'Für Exo/Over-Mage: Entferne zuerst günstige Stats, um eine große Senke aufzubauen, dann setze den schweren Stat mit Puffer durch, dann füge verlorene Stats wieder hinzu (einfach, da weit unter Maximum). Over-Mage- und exotische Stats gehen bei Fehlschlägen zuerst verloren.'
    forgemagie_xp: ERFAHRUNG
    forgemagie_xp_desc: 'EP werden nur bei Erfolg vergeben (Kritisch oder Neutral). Höherstufige Gegenstände und schwerere Runen geben deutlich mehr EP. Ra-Runen gewähren doppelte EP im Vergleich zu Ba- und Pa-Runen. Formel: max(1, Runengewicht × (1 + Gegenstandslevel / 50) × Stufenmultiplikator), wobei der Multiplikator 2 für Ra und 1 sonst beträgt.'
    action_points: AKTIONSPUNKTE (AP)
    movement_points: BEWEGUNGSPUNKTE (BP)
    critical_stat: KRITISCH
    wisdom_xp: WEISHEITS-XP-BONUS
    wisdom_xp_desc: Jeder Punkt effektiver Weisheit, einschließlich aktiver Effekte, erhöht die erhaltenen EP um 1 %. Bei 100 effektiver Weisheit erhältst du doppelte EP.
    chance_loot: GLÜCK & BEUTE
    chance_loot_desc: Das durchschnittliche effektive Glück des Siegerteams, einschließlich aktiver Effekte, multipliziert jede aufgelöste Droprate. Bei durchschnittlich 600 Glück verdoppelt sich die Rate. Sie kann niemals 100% überschreiten.
    mob_loot_band: MONSTERLEVEL & DROPRATE
    mob_loot_band_desc: Die festgelegte Chance ist der Mittelpunkt. Ein Monster auf Mindestlevel nutzt 80%, eines auf Höchstlevel 120%, gedeckelt bei 100%. Monster mit festem Level nutzen exakt die festgelegte Chance. Die Dropmenge skaliert nicht mit dem Level.
