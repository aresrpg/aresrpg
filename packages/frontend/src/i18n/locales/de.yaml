    HERBALIST: Herbalisten sammeln Pflanzen und Blumen fur die Alchemie. Jede Stufe erfordert ein hoheres Berufslevel.
    MINER: Bergleute fordern Erze und Mineralien aus Gesteinsvorkommen. Seltene Metalle werden mit steigendem Level verfugbar.
