    section_economy: WIRTSCHAFT
    combat_desc: Der Kampf ist rundenbasiert auf einem Raster. In deinem Zug gibst du Aktionspunkte (AP) aus, um Zauber zu wirken, und Bewegungspunkte (BP), um dich zu bewegen. Sichtlinie ist ein Flag pro Zauber — die meisten Zauber brauchen sie, manche nicht. Du kämpfst gegen Monstergruppen in der Welt und gegen andere Spieler im Kolizeum. Der Schaden skaliert mit dem passenden Elementar-Stat und etwaigem Rohschaden-Bonus.
    elements: ELEMENTE
    element_earth: ERDE
    element_fire: FEUER
    element_water: WASSER
    element_air: LUFT
    stat_strength: Stärke
    stat_intelligence: Intelligenz
    stat_chance: Glück
    stat_agility: Agilität
    critical_hits: KRITISCHE TREFFER
    crit_desc: Jeder Zauber und jede Waffe hat eine eigene Basis-Kritrate, angegeben als Chance von 1 zu N. Der Krit-Wert senkt N, aber die endgültige Chance kann 1 zu 2 (50 %) nie überschreiten.
    crit_bonus_desc: Bei einem kritischen Treffer wendet der Zauber seine eigenen kritischen Effekte an (stärkerer Schaden oder zusätzliche Effekte) anstelle seiner normalen.
    blocking: SCHILDE
    blocking_desc: Manche Zauber gewähren einen Schild, der eingehenden Schaden eines passenden Elements absorbiert, bis er aufgebraucht ist. Es gibt keine Ausdauer und keine Verteidigungshaltung, Schilde sind die einzige Schadensabsorption.
    resistance: WIDERSTAND
    resistance_desc: Elementar-Widerstand ist eine prozentuale Reduktion, die auf den finalen Schaden angewendet wird, gedeckelt bei 60% pro Element. Negativer Widerstand (eine Schwäche) verstärkt den Schaden stattdessen.
    life_steal: LEBENSRAUB
    life_steal_desc: 'Drain-Zaubereffekte verursachen Schaden und heilen den Wirker um die Hälfte der Lebenspunkte, die das Ziel tatsächlich verliert. Nur der Drain eines Spielers heilt: Ein Monster, das denselben Zauber wirkt, verursacht seinen Schaden und heilt sich nicht.'
    life_steal_note: Der Schaden durchläuft zuerst die Standard-Schadensformel, dann heilt sich der Wirker um die Hälfte der Lebenspunkte, die das vorgesehene Ziel tatsächlich verloren hat — ein auf einen anderen Kämpfer umgeleiteter Treffer, oder einer, den das Ziel in Heilung umwandelt, gibt nichts zurück.
    healing: HEILUNG
    healing_desc: Heilungen wenden den festgelegten Basiswert des Zaubers an, hochskaliert um einen Prozentsatz deiner Intelligenz, plus einen festen Heilbonus durch Ausrüstung und Buffs. Die Heilung ist auf die maximalen LP des Ziels begrenzt.
    healing_intel_value: +1% Heilung pro Intelligenz-Punkt
    heal_bonus: Heilbonus
    heal_bonus_value: Fixer Bonus durch Ausrüstung/Buffs, addiert nach der Intelligenz-Skalierung
    mobs: Monster
    healing_mobs_value: Skaliert nur mit Intelligenz, kein Heilbonus
    leveling_desc: Maximallevel ist 200. Bekämpfe Mobs in deiner Levelreichweite für optimale EP.
    points_per_level: PUNKTE PRO LEVEL
    stat_points: Stat-Punkte
    stat_points_value: '{{n}} pro Level'
    spell_points: Zauberpunkte
    spell_points_value: '{{n}} pro Level'
