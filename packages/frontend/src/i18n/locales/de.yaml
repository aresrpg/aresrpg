  item_descriptions:
    aberrant_edge: 'Falsch geschmiedet. Der Stahl biegt sich statt zu brechen. Befiehl es vorsichtig—es gehorcht Winkeln, nicht Kraft.'
    aberrant_faceguard: 'Nach einem Gesicht geformt, das keines mehr war. Hält Gespräche fern.'
    aberrant_treads: 'Geformt nach etwas, das nie ganz ein Fuß war. Hinterlässt die falschen Spuren.'
    abyss_core: 'Pulsierender Orb konzentrierter Leereenergie. Enthält die Träume einer toten Realität. Mit existenzieller Vorsicht handhaben.'
    abyss_loop: 'Aus Wasser gezogen, das das Licht gänzlich verschluckte. Trägt noch dessen Gewicht.'
    abyssal_blood_wheat: 'Getreide durchdrungen von Hämoglobin mit Meinungen über Blutgruppen.'
    abyssal_codex: 'Ein aus der Tiefsee geborgenes Zauberbuch. Die durchnässten Seiten lassen sich trotzdem noch umblättern.'
    abyssal_conduit_staff: ''
    abyssal_edge: 'Ein Schwert, das Licht um seine Klinge zu absorbieren scheint. Die Dunkelheit ist kosmetisch. Der Schaden nicht.'
    abyssal_warplate: 'Der Unterschied zwischen Kriegsgeschichte und Nachruf.'
    abyssgrown_blade: 'Sie ließ ihre eigene Hohlkehle wachsen, ihre eigene Schneide, ihren eigenen leisen Widerwillen, gescheidet zu werden, wofür der Schmied nichts beansprucht.'
    abyssgrown_cuirass_of_moonlit_mire: 'Er wuchs nach dem Anpassen weiter, was der Träger an dem Tag entdeckte, als er nicht mehr passte und, sanft, zu bestehen begann.'
    abyssgrown_extract: 'Ein Konzentrat, das nach dem Abfüllen von selbst dichter wurde, sodass ein altes Fläschchen härter zuschlägt als ein frisches und das Etikett nie mithält.'
    abyssgrown_gauntlets: 'Sie ließen Klauen wachsen, die der Schmied nie hinzufügte und nicht entfernen kann, was der Träger als Bonus zu werten beschloss.'
    abyssgrown_helm_of_quiet_drowning: 'Gewachsen, nicht geschmiedet, aus einer Schale, die das tiefe Weald begann und aufgab. Der Träger erbt sowohl den Schutz als auch die unerledigte Sache.'
    abyssgrown_pendant_of_moonlit_mire: 'In seinem Herzen wuchs eine Höhlung, die, wie der Träger schwört, einen Tropfen Wasser birgt, älter als das Weald. Er weigert sich zu verdunsten, was die Behauptung stützt.'
    abyssgrown_pendant_of_quiet_drowning: 'Perlen an einer Schnur, die leise klicken, wenn der Träger atmet, ein Trost in der stillen Tiefe, bis man merkt, dass sie einen Schlag nach jedem Atemzug klicken, nicht mit ihm.'
    abyssgrown_sabatons: 'Sie ließen ein Profil wachsen, das niemand entwarf, abgestimmt auf einen Gang, den niemand kennt, und der dem Träger trotzdem passt.'
    abyssgrown_signet_of_moonlit_mire: 'Seine Siegelfläche ließ ein Muster wachsen, das sich bei jedem Wegsehen leicht verändert und das nie zwei Zeugen gleich beschrieben.'
    abyssrift_breastplate_of_torn_ground: 'Gewichtslos in der dünnen Schwerkraft, was toll ist, bis du wirklich zuschlagen musst.'
    abyssrift_legguards_of_split_sky: 'Ausgelegt für Stürze, die die dünne Schwerkraft fast überlebbar macht. Fast.'
    abyssrift_poultice_of_split_sky: 'Kühl bei Berührung, wie die andere Seite der Naht. Frag nicht, woher sie das wissen.'
    abyssrift_treads_of_split_sky: 'Nicht die fliegende Sorte. Die Sorte „der Boden ging und du improvisierst“.'
    abyssrift_visor_of_torn_ground: 'Der Schlitz zeigt dir genau, was vorn ist. Der Boden war nie vorn.'
    abyssrift_warbelt_of_torn_ground: 'Nimmt die Last, damit deine Wirbelsäule es nicht muss. Die bleibt skeptisch und laut.'
    adamantite_beastcaller: 'In Yetifell gewickelt und mit alten Rufglyphen geritzt. Klopf dreimal auf den Boden, und etwas taucht auf, meist kalt und übellaunig.'
    adamantite_chopper: ''
    adamantite_earth_cleaver: 'Ein Langschwert angetrieben von einem noch geschmolzenen Glutherz. Schwer genug die Erde zu spalten. Oder was drauf steht.'
    adamantite_fang_daggers: 'Zwillingsklingen mit Rex-Fängen bestückt und in Grabseide gebunden. Schnell genug, die Brise zu spalten, und was sich dahinter verbarg.'
    adamantite_katana: 'Ein Katana mit Gletscherherz im Griff. Die Klinge ist so fein dass sie Angeberei durchschneidet. Und Menschen. Die Kaelte betaeubt die Schuld.'
    adamantite_longbow: 'Gliedmaßen aus Haiflosse und Frostschalenplatten. Zum Spannen braucht es beide Arme und einen Groll.'
    adamantite_tidestaff: 'In Frostshamble-Seide gewickelt mit Gletscherkern gekroent. Summt im Rhythmus ferner Gezeiten. Nutzlos zum Schwimmen.'
    adamantite_trident: 'Drei Zinken aus gefrorener Krebsschale die nie taut. Effektiv gegen Fische, fischaehnliche Feinde und gesunden Menschenverstand.'
    adamantite_war_greaves: 'Zwischen zwei Aufgeboten geschmiedet, wann immer die Schmieden Eisen übrig hatten.'
    adamantite_waraxe: 'Frostschalenplatten an der Klinge, Gletscherherz im Knauf. Das Gewicht trainiert die Arme. Die Kaelte trainiert die Entschlossenheit.'
    adamantite_warhelm: 'In Grabwasser statt Salzlake abgeschreckt. Verträgt Dellen erstaunlich gut.'
    adamantsteel: 'Adamant, von Schmieden zu Stahl gefaltet, die darauf bestehen, dass das Metall erst zustimmen muss. Die gelungenen Chargen wirken tatsächlich seltsam willig.'
    aetherwing: ''
    alchemical_base: 'Die Grundlage aller alchemistischen Arbeit. Riecht nach nasser Bibliothek und gebrochenen Versprechen.'
    allweather_cinch: 'Funktioniert gleich gut in Sümpfen, Wüsten und Tundra. Sieht überall gleich schlecht aus.'
    aloe_crystal_salve: 'Kristallisiertes Aloe-Gel geschichtet mit Kräuterrückständen. Heiler schwören darauf, Patienten fluchen darüber.'
    aloe_vera: 'Ein saftiges Blatt voller beruhigendem Gel. Heiler schwören darauf, Alchemisten horten es, und alle anderen fragen sich, warum man sich wegen einer Pflanze prügelt.'
    alpha_cleave: 'Dem Alpha des Rudels abgenommen. Er gab sie nicht freiwillig, und ehrlich gesagt das Rudel auch nicht.'
    alpha_fang: 'Fünfzehn Zentimeter vergilbter Eckzahn. Der Alpha, der ihn trug, war für Kommentare nicht verfügbar. Oder zum Atmen.'
    alpha_fang_circlet: 'Woelfe betrauern ihre Toten mit Heulen, das ueber den ganzen Archipel traegt. Dieser Reif erinnert sich an jedes.'
    amber: 'Fossiliertes Baumharz mit Kaefern die vor Millionen Jahren starben endlich zu etwas nuetze.'
    amber_powder: 'Riecht wie ein Wald der vor sehr langer Zeit starb und immer noch verbittert darueber ist.'
    ambivalent_torc_ap: 'Ein Amulett, das einen Aktionspunkt zufällig vergibt, nicht absichtlich. Der Träger kann nicht entscheiden, ob er gesegnet oder belastet wurde.'
    amphibian_oil: 'Aus Koa-Drüsen gewonnen. Imprägniert Leder, schmiert Getriebe, und lässt alles für immer nach Sumpf riechen.'
    amulet_of_the_first_hollow: 'Geborgen aus der Höhlung der allerersten je katalogisierten Leeremotte, aus einer Zeit, als die Katalogisierer sie noch nummerierten statt benannten. Es stammt aus der Zeit vor der Namenskonvention. Es erinnert sich, eine Nummer gewesen zu sein.'
    ancient_hermit_robe: 'Aus einer Robe geschnitten, getragen durch hundert Bestattungen. Das Gewebe hält noch immer Grabstaub.'
    ancient_marrow: 'Irgendwie noch flüssig nach Jahrhunderten in einem Skelett. Schmeckt nach Traurigkeit und altem Kupfer. Fragt bitte nicht, woher wir das wissen.'
    ancient_ram_splitter: ''
    ancient_tusk_cleaver: 'Aus einer fehlgewachsenen Rippe geschnitzt. Die Schneide hält noch immer.'
    ancient_tusk_fragment: 'Ein Splitter, gebrochen aus einer Rippe, die wuchs, wo keine Rippe sollte.'
    anglerbone_cord: 'Auf die Wirbelknochen einer Anglerkönigin aufgezogen, in völliger Dunkelheit noch schwach leuchtend. Praktisch zur Orientierung. Weniger praktisch, um verborgen zu bleiben.'
    anglerdeep_key: 'Schlüpfrig von einer Weald-Nässe, die nie trocknet, warm, wie Anglerlicht warm ist, kurz bevor es das nicht mehr ist. Die Anglertiefen-Matrone behält sie besser im Auge, als sie zugibt.'
    anglerhide_helm: 'Aus der Haut der Anglerkönigin geschnitten, die Lockdrüsen dunkel und ruhend gelassen, größtenteils. Man prüft besser nicht, wie tief sie ruhen.'
    anglerlight_lure_staff: 'Bekrönt von einem gefangenen Köderlicht, das noch im Takt pulst, der Beute durch das tiefe Weald lockt. Man starrt es besser nicht zu lange an.'
    anglerlight_oil: 'Aus den Lockdrüsen der Anglerkönigin gewonnen, noch in der Flasche schwach leuchtend. Am besten geschluckt, bevor es anfängt, Dinge anzulocken.'
    antiphon_breastplate_of_last_verse: 'Wasserfest, feuerfest, soßenfest. Über die Möbel legen oder über sich selbst, je nachdem, was gerettet werden muss.'
    antiphon_grips_of_last_verse: 'Gemacht für den Waschtag. Wringen Sie ein Hemd aus, einen Mopp, oder jemandem die Wahrheit.'
    antiphon_grips_of_twelve_voices: 'Mehl bis zum Unterarm, für immer. Der Teig hat sich genau einmal gewehrt.'
    antiphon_poultice_of_twelve_voices: 'Zwölf Kräuter, zwölf Gebete, eine Paste. Keiner weiß, welches Kraut wirkt, und vielleicht keines.'
    antiphon_treads_of_twelve_voices: 'Straßenschuhe enden an der Vorhalle. Die Kathedrale ist da streng, und die Lava respektiert die Tradition.'
    antiphon_visor_of_last_verse: 'Lässt Suppe, Lava und Ehrgeiz mit derselben unparteiischen Gründlichkeit ab. Kinnriemen inklusive.'
    antiphon_visor_of_twelve_voices: 'Geschlitzt, damit zwölf enge Blicke zu einem werden. Es ist trotzdem irgendwie schlechter.'
    apexbound_cuirass_of_summit_vigil: 'Standardpanzer für die Gipfelwache, so gewichtet, dass der Träger eine ganze Runde reglos stehen kann, ohne zu schwanken. Sich hinzusetzen ist ein eigenes Problem, das er nicht löst.'
    apexbound_gauntlets: 'Gedacht für die Hände, die den Gipfel erreichen und dort noch etwas greifen müssen. Die meisten tun es nicht. Diese setzen voraus, dass du es tust.'
    apexbound_girdle_of_sealed_wound: 'Zweimal gewickelt, so wie die Wandscherben alles wickeln, dem sie nicht ganz zutrauen, geschlossen zu bleiben. Bisher hat die Hüfte mitgespielt.'
    apexbound_helm_of_sealed_wound: 'Gegossen, um standzuhalten, was die Wunde ausatmet, wenn man sie zuzwingt. Das Visier versiegelt von innen — was verrät, wovor es den Träger wirklich schützt.'
    apexbound_pendant_of_summit_vigil: 'Dazu bestimmt, am Brustbein dessen zu ruhen, der die höchste Wache hält, nah genug am Herzen, um mitzuzählen, wie schnell es schlägt.'
    apexbound_ration: 'Feldmedizin für die Verteidiger der Mauer, in Wachs versiegelt und dafür ausgelegt, länger zu halten als die meisten Verteidiger. Düster, aber ehrlich beschriftet.'
    apprentice_blade: 'Das erste Schwert eines Schmieds das nicht sofort bricht. Ein Meilenstein. Ein niedriger aber immerhin.'
    aragog_fang: 'Ein gifttriefender Reißzahn, aus dem Rachen der Spinnenkönigin gerissen. Das Gift auf seiner Oberfläche wechselt zwischen Violett und Schwarz und löst alles auf, was es berührt.'
    aragog_fangs: ''
    arcane_bread: 'In großen Mengen gebacken, einmal gesegnet, nie hinterfragt. Hält eine Kolonne in Bewegung.'
    arcane_pastry: ''
    arcane_reagent: 'Sieben Kräuter, ein Schuss Wasser und kein irdischer Grund für das violette Leuchten. Alchemisten nennen das Forschung; alle anderen ein Warnsignal.'
    arcane_solution: 'Endgame alchemistisches Reagenz das vor rohem magischem Potenzial pulsiert. Ein Tropfen auf Haut verursacht temporare Synasthesie.'
    arcane_spore: 'So gesättigt mit roher Magie, dass sie in dauerhafter Erregung verharrt, summt sie auf einer Höhe, die nahes Glas zerspringen lässt und Gelehrtenfußnoten ungefragt neu ordnet. Die einzige überlieferte Sicherheitsregel für den Umgang damit: nicht niesen.'
    arcaneshroom: 'Ein Pilz, durchdrungen von arkaner Restenergie, die ihn mit einem schwachen, anklagenden Schimmern leuchten lässt, als hielte er den Sammler persönlich verantwortlich für die Störung seiner gelehrten Kontemplation. Ihn mit bloßer Haut anzufassen soll unwillkürliches Schweben, vorübergehende Synästhesie und ein unerklärliches Verlangen nach staubigen Folianten verursachen.'
    arcanite: 'Summt vor Restmagie die Kompasse kreisen laesst und Zauberer unertraeglich selbstgefaellig macht.'
    arcanite_hoe: 'Durchdrungen von genug arkaner Energie um toten Boden sprossen zu lassen. Lasst auch tote Bauern sprossen aber daruber reden wir nicht.'
    arcanite_pickaxe: 'Zerschmettert realitatsversteinerte Mineralien wie ein Steuereintreiber Traume zerschmettert. Die Ader hat keine Chance.'
    arcanite_powder: 'Ordnet sich spontan zu arkanen Symbolen um wenn man es unbeaufsichtigt laesst. Sehr ablenkend.'
    arcanite_sickle: 'Geschmiedet aus kristallisiertem Mana und schlechten Entscheidungen. Schneidet verfluchtes Dickicht als schulde es Geld.'
    arcanize_flour: 'Violettes Mehl, das kurz schwebt, Bäcker arbeiten schnell.'
    archaeo_belt: 'Gefiedert, versteinert, und immer noch ueberzeugt, dass es fliegen konnte.'
    archaeo_longbow: 'Befiedert mit den Federn eines Vogels, der die Tiefen durchquerte, lange bevor jemand einen Kalender führte, um das Datum festzuhalten. Die Pfeile scheinen die alte Route noch zu kennen. Sie nehmen sie, ob man dorthin zielte oder nicht.'
    archaeo_plume: 'Eine Urfeder eines Wesens, das evolutionaer noch unentschlossen ist, ob es Echse oder Vogel sein will.'
    archaeo_plume_javelin: 'Befiedert mit Urfedern. Sie fliegt gerader, als alles mit Federn eigentlich duerfte.'
    archimob_legguards: 'Aus der Haut des Rudelfuehrers gefertigt. Der Rest des Rudels schickt bis heute unaufgefordert Dankeskarten.'
    arisen_tokeko: ''
    ashen_philter: 'Grau, körnig und technisch trinkbar. Die Asche setzt sich nie, was dir sagt, wo du bist.'
    ashen_visor: 'Riecht dauerhaft nach Lagerfeuer und fragwuerdigen Entscheidungen. Blockt beides teilweise.'
    ashraptor_fang_pendant: 'Der Fang erinnert sich noch an das Feuer. Manchmal erinnert sich auch Ihr Schluesselbein daran.'
    backbone: 'Zuerst entlang der Wirbelsäule gepanzert, nach der soliden Theorie, dass eine stehende Leiche die Linie immer noch hält.'
    backswing: 'Die Rückholbewegung richtet mehr Schaden an als der beabsichtigte Schlag. Der Schmied nennt das ein Feature. Der Träger nennt es eine Überraschung.'
    bag_aloe_vera: 'Ein einst respektabler Behälter, der nun aus jeder Naht ein viskoses botanisches Sekret absondert — die unvermeidliche Folge davon, fünfzig Aloe-Vera-Exemplare in einem Raum einzusperren, der für erheblich weniger gelatinöse Pflanzen ausgelegt war. Alchemisten behaupten mit bewundernswerter Überzeugung, dass die therapeutischen Eigenschaften durch Kompression zunehmen, eine Behauptung, die das Äußere des Beutels — glitschig, übelriechend und schwach pulsierend — kaum stützt.'
    bag_amber: 'Ein schwerer Sack fossilierter Traenen. Der Baum weinte damit du reich werden konntest.'
    bag_arcaneshroom: 'Fünfzig Arkanpilze in einem Gefäß konsolidiert, das mit so konzentrierter Restmagie brummt, dass es sein eigenes schwaches Gravitationsfeld entwickelt hat, wodurch kleine Gegenstände mit der Unvermeidlichkeit von Motten zu einer besonders gelehrten Flamme zu ihm driften. Der Beutel schwebt gelegentlich, wenn er unbeaufsichtigt gelassen wird, was sein Besitzer dann zunehmend skeptischen Gastwirten erklären muss.'
    bag_arcanite: 'Das Summen wird lauter wenn man mehr als zehn traegt. Niemand weiss warum und niemand will es herausfinden.'
    bag_arcanize: 'Violette Lumineszenz sickert durch die Nähte. Das Korn summt beunruhigend.'
    bag_barley: 'Ein Gerstensack, der mit dem Geräusch von unter Protest geernteten Getreide rasselt.'
    bag_blood_wheat: 'Er pulsiert leise, nach einem Rhythmus, den niemand entschlüsselt hat. Beunruhigend in einem Getreidesack. Erheblich schlimmer in Gepäck, neben dem man schlafen wollte.'
    bag_bloodstone: 'Alles darin faerbt sich irgendwann rot. Statistisch gesehen auch alles daneben.'
    bag_burnt_wheat: 'Das Öffnen setzt ein rauchiges Aroma frei und den Eindruck einer schrecklichen Entscheidung.'
    bag_crimson_truffle: 'Fuenfzig Trueffel, ein Beutel, und ein Marktwert, fuer den die Naht nie ausgelegt war.'
    bag_cursed_fungus: 'Fünfzig verfluchte Pilze, versiegelt in einem Beutel, der in einer rotierenden Auswahl von Sprachen murmelt, von denen keine einer lebenden Zivilisation angehört, und seinen Träger mit Namen anspricht, die er nicht erkennt, die aber dennoch ein unwillkürliches Frösteln erzeugen. Erfahrene Kräuterkundige tragen ihn auf Armlänge, nicht weil das Handbuch es empfiehlt, sondern weil der Beutel selbst den Vorschlag gemacht hat.'
    bag_cursed_gem: 'Der Beutel fluestert deine tiefsten Aengste. Meist ueber Inventarverwaltung und Gewichtslimits.'
    bag_draconite: 'Heiss bei Beruehrung, leises Knurren. Der letzte Kurier hinterliess eine Ein-Stern-Bewertung und keine neue Adresse.'
    bag_draconize: 'Die Schuppen aussen sind vielleicht natuerlich, oder das Getreide drinnen organisiert gerade eine Gewerkschaft.'
    bag_dragonlily: 'Fuenfzig Drachenlilien, ueberlappende Schuppen, rascheln gerade genug, um die Veranda-Katze die ganze Nacht wachzuhalten.'
    bag_duskite: 'Alter Bergmannsreim: Was Duskit nimmt, Duskit behält, und das Licht geht hinein und schläft nie. In der Praxis heißt das nur: Der Sack ist schwerer, als er aussieht, und billiger, als er sein sollte.'
    bag_green_mushroom: 'Fünfzig grüne Pilze. Rechtlich und botanisch verschieden von der lustigen Sorte.'
    bag_himalayan_wheat: 'Geerntet in Höhen ohne Luft und ohne Anbauvorschriften.'
    bag_ivory_shrooms: 'Fünfzig lumineszierende Pilze mit rücksichtsloser Dichte gepackt, sodass der Beutel ein stetiges phosphoreszierendes Leuchten ausstrahlt, das aus peinlicher Entfernung sichtbar ist und als tragbares Nachtlicht fungiert, das niemand angefordert hat und das jeder im Umkreis von dreißig Metern gezwungen ist anzuerkennen. Händler haben versucht, dies als Vorteil statt als Nachteil zu vermarkten, mit vorhersehbaren Ergebnissen.'
    bag_jade: 'Genug gruene Steine um einen Haendler erst vor Freude und dann vor Misstrauen weinen zu lassen.'
    bag_malt: 'Das Fermentationsaroma deutet darauf hin, dass dieses Malz seine Karriere als Getränk plant.'
    bag_moonstone: 'Leuchtet nachts durch den Stoff und macht Tarnung fuer Diebe voellig unmoeglich.'
    bag_nightcap: 'Ein Beutel mit fünfzig Nachtkappen, der das Umgebungslicht in seiner unmittelbaren Nähe zu verschlingen scheint und eine lokalisierte Dunkelheitstasche erzeugt, die dem Träger mit der stillen Beharrlichkeit eines schlechten Gewissens folgt. Längere Nähe soll ein schleichendes existentielles Unbehagen hervorrufen, das Kräuterkundige gelernt haben, für Professionalität zu halten.'
    bag_obsidianite: "Behandeln Sie es sanft, oder auch nicht, und bereiten Sie in beiden Fällen im Voraus Ihre Ausrede für den Heiler vor. Er hat bereits jede Version von 'ich habe es nur getragen' gehört."
    bag_phantom_spore: 'Fünfzig Sporen, die nur manchmal da sind, so wie ein Versprechen nur manchmal gehalten wird. Zählen Sie zweimal. Ein drittes Mal aus reinem Trotz. Die Zahl wird sich nie mit sich selbst einig.'
    bag_quartz: 'Fuenfzig truebe Kristallstuecke die klappern wie ein Sack voller gebrochener Versprechen.'
    bag_red_orchid: 'Ein Lederbeutel mit fünfzig blutroten Orchideen, so dicht gepackt, dass der Beutel von innen ein tiefes, permanentes Purpurrot angenommen hat, als wäre er Schauplatz eines sehr kleinen und sehr botanischen Verbrechens. Beim Öffnen entweicht ein Parfüm, das zu gleichen Teilen aus metallischer Süße und stiller Bedrohung besteht.'
    bag_suize: 'Die Koerner darin fangen Licht ein, als bewuerben sie sich um ein besseres Gefaess.'
    bag_tanjirize: 'Ein warmer Beutel, als wäre das Tanjirize darin überzeugt, es gehöre in die Sonne.'
    bag_ukranize: 'Ukranize-Korn mochte nie guten Boden — man erzählt sich, es wachse am liebsten dort, wo die Ernte am schwersten zu erreichen ist. Kluge Pflanze. Furchtbar für die Knie.'
    bag_wheat: 'Fünfzig Scheffel Weizen. Der Spreuwächter gab sein Leben; die Bäckerei zuckte mit den Schultern.'
    bag_witherbloom: 'Jede Blüte hebt sich ihre beste Vorstellung für den Moment ihres Todes auf, mit dem theatralischen Ernst eines Schauspielers, der in Erinnerung bleiben will. Öffnet man den Beutel, greift jeder Barde in Hörweite mitten im Gespräch nach der Feder.'
    baked_compound: 'Ein gehaerteter Klumpen aus Mehl und Sporen. Alchemisten lieben es. Alle anderen hinterfragen den Geruch.'
    banner_shard: 'Vom Aschenbanner gerissen, bevor es fiel. Trägt noch das Gewicht der Linie, die es kennzeichnete.'
    barbfin_battleaxe: 'Flossen mit Widerhaken wie etwas, das aus tieferem Wasser heraufgezogen wurde, als das Weald technisch besitzt. Niemand hat gefragt, woher die Flossen wirklich stammen.'
    bark_grimoire: 'Seiten aus gepresster Rinde. Die Zauber sind meistens Zeichnungen wuetender Schafe.'
    barley_bread: 'Ein dichtes Brot das wie die Persoenlichkeit eines Bauern schmeckt. Saettigend, zuverlaessig und freudlos.'
    barley_flour: 'Ein grobes Mehl, das Brauer begehren und Bäcker tolerieren.'
    barley_hardtack: 'Military rations that outlast the soldiers who carry them. Jewelers use the crumbs as polishing abrasive.'
    basalt_carapace_of_black_choir: 'Vulkanplatte, die das Licht trinkt. In einem düsteren Schiff bist du praktisch ein Loch.'
    basalt_core: 'Der ungeschmolzene Kern einer Lavabombe. Außen kalt, innen noch unentschlossen. Dräng ihn nicht.'
    basalt_crest_of_black_choir: 'Schwer genug, dass du zum Klagelied nickst, ob gewollt oder nicht.'
    basalt_crest_of_molten_antiphon: 'Ihn aufzusetzen macht Sie auf dem Fest nicht unsichtbar. Aber er hält die Tropfen brennenden Wachses ab.'
    basalt_falchion_of_molten_antiphon: 'Du schlägst, sie antworten, das Gespräch endet. Selten ein langer Dialog.'
    basalt_fists_of_molten_antiphon_choir: 'Der Chor singt eine Zeile, dann wieder, härter. Diese auch. Lern das Tempo oder trag die zweite Strophe.'
    basalt_fists_of_molten_antiphon_pyre: 'Drahtborsten über den Knöcheln. Schmutz, Rost und Hoffnung gehen gleich leicht ab.'
    basalt_flail_of_black_choir: 'An der Kette geschwungen klingt sie wie eine Totenglocke. Passend zu ihren Terminen.'
    basalt_greaves: 'Das sturste Ding, das du je an ein Knie schnallst. Es hat Ansichten über Bewegung.'
    basalt_knobstick_of_molten_antiphon: 'Ahorn, gut bemehlt, geschwungen mit der Autorität von jemandem, der die ganze Nacht auf Sie gewartet hat.'
    basalt_locket_of_black_choir: 'Birgt einen einzigen tiefen Ton, in Stein versiegelt. Brich es in der Not; bereue es in der Stille danach.'
    basalt_maul: 'Zugelassen für Teppiche, Wandbehänge und alles andere, das mit dem Staub auch einen Groll festhält.'
    basic_pickaxe: 'Das passiert, wenn Budgetbeschränkungen auf unterirdische Ambitionen treffen.'
    bear_battleaxe: 'Durchdrungen von Baerenwut und einer unvernuenftigen Menge Koerperwaerme.'
    bear_claw: 'Erst kuerzlich an einem viel groesseren, viel weniger kooperativen Baeren befestigt.'
    bear_claw_ring: 'Der Baer hat dafuer gekaempft. Er hat verloren. Meist wegen einer Formsache.'
    bear_club: 'Der Baer forderte Tantiemen fuer dieses Design. Die Rechtsabteilung sagte nein. Der Baer widersprach, laut.'
    bearclaw_gauntlets: 'Mit Klauen bestückt, einem Moosbären entrissen, der sie nicht mehr brauchte. Die Griffkraft überträgt sich; das Temperament offenbar auch.'
    bearfury_battleaxe: 'Der Baer dessen Klaue fuer diese Axt verwendet wurde war ziemlich verargert. Verstaendlich.'
    bearheart_signet: 'Besetzt mit einem Klauensplitter von der Größe der Klaue des Bärenpatriarchen selbst. Wer ihn lange genug trägt, vergisst, wie man zuschlägt — man erinnert sich nur noch, wie man einen Schlag übersteht.'
    beast_hauler_sash: 'Geschnallt von jedem, der die Bergungskarren zog. Ausgefranst genau dort, wo das Seil auflag.'
    beastcaller_talisman: 'Aufgefädelt aus Statik-Hirten-Schnur, summt schwach, wenn die Herde nahe ist. Rex-Rudel halten den Träger kurzzeitig für einen der ihren.'
    behemoth_pearl: 'Gefunden in der Kehle eines uralten Titan-Koa. Ein Vermögen wert, sofern man sie höflich herausholt.'
    behemoth_pearl_amulet: 'Besetzt mit einem Splitter, zu glatt, um von selbst gebrochen zu sein.'
    bent_sword: 'Geschmiedet von jemandem der Haerten mit Drauftreten verwechselt hat. Funktional. Kaum.'
    berserk: 'Forged for those who answer every problem with more axe. Rage not included, but implied.'
    binding_paste: 'Klebstoff der organische und mineralische Materialien verbindet. Schmiede und Schneider kaufen es schneller als Alchemisten brauen konnen.'
    binding_ring: "Bindet spektrale Energie an sterbliches Fleisch. Das Kleingedruckte erwaehnt 'leichte existenzielle Drift' und nichts weiter."
    binding_thread: 'Bindet einen Geist an diese Ebene. Durchschneide es und sieh mehrere Probleme auf einmal verschwinden.'
    bisonbrute_bow: 'Bespannt mit Bisonbrute-Sehne. Jeder Pfeil traegt das emotionale Gewicht einer Stampede.'
    blizzard_tassets: 'Thorium-Beinplatten mit Frostkristallen besetzt. Jeder Schritt klingt wie brechendes Glas.'
    blockhead: 'Vom Lehrling des Schmieds benannt, der es als Beleidigung meinte, und trotzdem befördert wurde.'
    blood_wheat: 'Schneidet man ihn, blutet er — ein dicker, dunkler Saft von der Farbe einer alten Wunde, als sei der Boden, der ihn hervorbrachte, zuerst verletzt und erst danach befragt worden.'
    blood_wheat_flour: 'In blassem Karmesin gemahlen, am besten zu Brot gebacken, das man schnell isst und nie darüber nachdenkt. Das gelegentliche Pochen ist, beteuern die Bäcker, rein kosmetischer Natur.'
    bloodstone: 'Dunkelrotes Mineral dessen Farbe definitiv von Eisenoxid stammt und nicht von alten Fluechen wahrscheinlich.'
    bloodstone_powder: 'Beunruhigend warm in der Handflaeche. Alchemisten lieben es. Alle anderen halten gesunden Abstand.'
    bloodveil_orchid: 'Eine karmesinrote Orchidee, deren Blütenblätter einen so dunklen Saft weinen, dass er alles befleckt, was er berührt — auch deinen Ruf als ernsthafter Kräuterkundiger.'
    bloodwheat_bread: 'Die karmesinrote Krume pulsiert schwach beim Schneiden. Baecker bestehen auf thermische Reaktion. Baecker luegen.'
    blue_antenna: "Pulsiert noch immer mit dem letzten Gedanken des Insekts: 'Warum hat der Riese meinen Partner zerquetscht?'"
    blunt_cudgel: 'Ein Stock mit dem Anspruch eine Waffe zu sein. Deine Feinde sterben... vor Lachen.'
    boar_gorer: 'Für die Eberjagd entworfen, funktioniert aber bei allem, was mit schlechtem Urteilsvermögen angreift.'
    boar_hide: 'Dick, borstig, und riecht nach Schlamm. Das Wildschwein war unangemessen wütend darüber. Standardverfahren.'
    bogforged_core: 'Ein Kern, über kaltem Sumpffeuer gehärtet, das ihn dicht und auf leise falsche Weise fühlbar lässt, die nie ganz verschwindet.'
    bogforged_elixir_of_fen_below: 'Über Sumpffeuer destilliert, das kalt brennt, was ihm eine Kühle verleiht, die auf der Zunge verweilt, lange nachdem die Heilung getan ist.'
    bogforged_greataxe_of_fen_below: 'Für den geschmiedet, der ins Untere Fenn hinabsteigt und auf dem Rückweg noch etwas zu schwingen gedenkt, was nicht viele tun.'
    bogforged_greataxe_of_rising_tide: 'Auf einem Sumpfamboss gehämmert, der Funken ganz verschluckt, was der Schmied verstörend fand und die Axt offenbar angenehm.'
    bogforged_sash: 'Gewebt aus Moorschilf, das nie ganz trocknet. Sie klärt den Kopf wunderbar — hauptsächlich, indem sie ihn leert. Der Träger fühlt sich großartig und könnte nicht mehr sagen, warum.'
    bogforged_vambraces_of_rising_tide_matron: 'Auf die Flut abgestimmt, die das Weald zu entbehren vorgibt, bei Hochwasser gehärtet, wenn das Metall kurz mitzuspielen bereit ist.'
    bogforged_vambraces_of_rising_tide_mire: 'In Sumpfwasser gehärtet, so übel, dass das Metall härter herauskam und der Schmied eine Woche lang hustete.'
    bogsteel: 'Sumpfeisen eingekocht und gefaltet, bis es eine Schneide hält, was es widerwillig tut und nur für die, die es sich hart verdient haben.'
    bone_charm_necklace: 'Kleine Knochen auf einer Schnur. Sieht je nach Outfit tribal-schick oder serienkiller-schick aus.'
    bone_flail: 'Zusammengebaut aus dem, was der Bonelet zurueckliess. Klappert bei jedem Schwung.'
    bone_greatbow: ''
    bone_marrow_club: 'Ausgehöhlt aus dem eigenen Oberschenkelknochen eines Knochenschlurfers und mit Blei gefüllt, zur Sicherheit. Irgendwo unten, so heißt es, bemerkt Nerak solche Dinge irgendwann doch. Eine gute Ausrede sollte man bereithalten.'
    bone_wand: ''
    boneguard_edge: 'Einem Knochenwächter entrissen, der sich in dem Moment, ehrlich gesagt, nicht sonderlich dagegen wehrte — hauptsächlich, weil er gründlich, geradezu fachmännisch tot war.'
    boneherald_greatsword: 'Geschworen auf Knochen, älter als jede Krone, die je für eine bessere eingeschmolzen wurde. Der Schwur, darin sind sich alle einig, ist unbrechbar. Das Schwert selbst, wird der Herold Sie erinnern, steht durchaus noch zum Verkauf.'
    bonelord_flail: 'Die Knochen sind echt. Gebunden mit Sehne von dem Ding, das diese Sümpfe durchstreifte. Es schwingt schwerer als Physik erlaubt; frag nicht warum.'
    bonelord_greatsword: ''
    bonelord_legguards: 'Aus Oberschenkelknochen geschnitzt, zu groß für alles, was noch atmet. Der Sitz ist makellos.'
    brackish_breastplate_of_brackish_deep: 'Druckgeprüft für Tiefen, die das Weald offiziell nicht hat, die Art Sache, die ein Schmied auf einen Panzer stanzt und dann nicht gern bespricht.'
    brackish_composite: 'Ein geschichtetes Material, in Salzwasser ausgehärtet, das es stärker und seltsamer macht, mit einem Geruch, der sich genau dann verstärkt, wenn man es lieber nicht hätte.'
    brackish_edge_of_brackish_deep: 'Die Salzwasserhärtung ließ sie gerade so korrodiert, dass sie auf eine Weise verletzt, die ein sauberer Schnitt nicht kennt, was das Weald als Vorzug zählt.'
    brackish_grips_of_brackish_deep: 'Das Salz kam in die Gelenke und blieb; sie klemmen nun ab und zu im denkbar schlechtesten Moment, zuverlässig.'
    brackish_legguards_of_brackish_deep: 'Zum Waten in Wasser zugelassen, das alles andere vom Bein wegfaulen ließe, was es mit diesen letztlich auch tut; der Schmied sagt nur nicht, wann.'
    brackish_legguards_of_silt_throne: 'Von einem Höfling geborgen, der zu lange im ertrunkenen Saal saß und, technisch gesehen, noch immer sitzt.'
    brackish_poultice_of_silt_throne: 'Mit Salzschlamm gefüllt, der eine Wunde reinzieht und genug brennt, dass der Patient genau weiß, wann er wirkt.'
    brackish_recurve_of_brackish_deep: 'Mit Sehne bespannt, die im Salz aufquoll und nie zurückschrumpfte, sodass er schwerer zieht, als er aussieht, und die Arme belohnt, die damit rechneten.'
    brackish_twin_knives_of_silt_throne: 'Aus dem ertrunkenen Saal ausgebaggerte Hofdolche, noch gekreuzt, wie man sie auf einen Leib legte, den der Schlamm längst beanspruchte.'
    brackish_waraxe_of_brackish_deep: 'Die Korrosion kroch in den Schaft und hielt inne, von nichts Erkennbarem abgehalten, worauf sich der Träger möglichst nicht zu sehr verlässt.'
    brackish_warbelt_of_silt_throne: 'Seine Hofschnalle korrodierte zu einer abstrakten Form, die nun nichts bedeutet, was ehrlicher ist als das, was sie zuvor bedeutete.'
    breach_ash: 'Der Ruß, der nie landet. Hier treibt er seitwärts, aus Trotz gegen die Schwerkraft.'
    breachforged_brew_of_nine_faults: 'Aus dem Mark-Salz eines Torwächters gebraut, getrunken von Wachen, die Breschen statt Schafe zählen. Schließt zuerst die kleinen Wunden — die großen, so die Annahme, können warten.'
    breachforged_carapace_of_fifth_breach: 'Im Ganzen von einer Leeremotte geschält, die die fünfte Bresche überwuchs und nirgendwo mehr häuten konnte. Sitzt wie ein zweites Außenskelett, denn funktional ist es jetzt eines.'
    breachforged_carapace_of_nine_faults: 'Jede Naht ist eine Stelle, an der sie nachgeben könnte. Bisher nicht. „Bisher“ leistet viel.'
    breachforged_cincture_of_fifth_breach: 'Geschnürt von einem Torwächter, der jede Schwelle mit der Handspanne maß, bevor er entschied, ob sie offen bleiben durfte. Die Schnalle klickt noch immer in fünf verschiedenen Stellungen. Niemand erinnert sich, was sie bedeuten.'
    breachforged_circle_of_nine_faults: 'Getragen an der Zählhand eines Torwächters, dessen Aufgabe es war, Breschen zu erfassen, bevor sie zum Problem wurden. Er zählt noch immer. Der zusätzliche Reaktionsschlag, den er verleiht, ist der Ring, der die Arbeit des Wächters für dich vollendet.'
    breachforged_claymore_of_nine_faults: 'Geschwungen von einem Torwächter, der aufhörte, Verwerfungen zu zählen, und anfing, sie persönlich zu schließen. Zu schwer, um präzise zu zielen. Präzision war ohnehin nie der Plan.'
    breachforged_crest_of_nine_faults: 'Neun Grate, einer je Riss, den der Schmelzer zählte, bevor er aufgab.'
    breachforged_fists_of_fifth_breach: 'Gegossen aus den Knöcheln eines Torwächters, der zuerst zuschlug und danach die Ausweise prüfte. Jeder Treffer hinterlässt einen schwachen bogenförmigen Bluterguss, wie eine winzige Tür.'
    breachforged_greatbow_of_fifth_breach: 'Bespannt von einem Torhüter, der Reichweite in überschrittenen Schwellen zählte, nie in Schritten. Der Pfeil bleibt jedem Bedauern um eine volle Schwelle voraus.'
    breachforged_philter_of_fifth_breach: 'Abgefüllt von dem Torwächter, der die fünfte Schicht zog, damals, als Schichten noch endeten. Schmeckt, als stünde man sehr lange still.'
    breachforged_splitter_of_fifth_breach: 'Vier frühere hielten nicht. Diese wurde in schlechterer Laune geschmiedet.'
    bread_leavening_agent: 'Lasst Brot mit alchemistischer Effizienz aufgehen. Backer halten es fur ein Wunder. Alchemisten halten Backer fur leicht zu beeindrucken.'
    bristleguard_cuirass: 'Tuskerhaut in eigener Galle gegerbt, denn Tusker sind genau die Sorte Kreatur, die darauf besteht.'
    bristlemail_gauntlets: 'Kettenglieder durchzogen von Eberborsten, die sich aus Prinzip nicht glaetten lassen.'
    bristlemail_pants: 'Sich in Tuskerleder zu setzen ist technisch ein Glaubensakt. Die Borsten widersprechen diesem Glauben.'
    bristlemail_patch: 'Eberhauchaut so dicht, dass sie Pfeile stoppt. Naturkevlar, nur dass es schrecklich riecht und niemand dir dankt.'
    bronze_greaves: 'Aus Bronze gehämmert, dicht genug, eine Klinge abzulenken, und schwer genug, jede Treppe zum Todfeind zu machen. Der Schmied, so erzählt man, hatte Unterarme wie gefällte Bäume. Von den Trägern wird erwartet, sich selbst welche anzueignen.'
    bronze_helm_of_the_shore: 'Eine Bronzekuppel verziert mit Seepocken, die kein Schrubben entfernen kann. Der ursprüngliche Besitzer war ein Küstenwächter, der das Meer liebte, bis das Meer ihn zurückliebte. Endgültig.'
    bronze_wolf_cuirass: 'Bronzeplatten über Timberwolfsfell. Das letzte Heulen des Wolfes soll im Metall konserviert sein — obwohl die meisten Träger nach der dritten Treppe nur noch ihr eigenes schweres Atmen hören.'
    browbeaten: 'So oft an derselben Stelle von denselben herabfallenden Trümmern eingedellt, dass die Delle unter den Pilgern einen eigenen Namen trägt.'
    bulwark_band: 'Dein Finger ist jetzt, rechtlich gesehen, eine Festung.'
    bulwark_of_the_risen: 'Geborgen aus einem Grabhügel, der sich bei Dämmerung wieder öffnete. Die Toten brauchten es nicht mehr.'
    bulwark_stubborn: 'Weigert sich aufzugeben, aus purem, grossartigem Trotz. Bisher funktioniert es.'
    burnt_wheat_flour: 'Vorgeröstetes Mehl, ein rücksichtsvoller Service für Bäcker.'
    caller_embrace: 'Fingerspitzen leuchten, wenn sich ein Vertrauter naehert. Praktisch. Gelegentlich etwas zu vertraut.'
    canticle_cuisses: 'Die Rippen pfeifen beim Gehen ein Fünftelton. Der Chor hat gelernt, um Sie herum zu transponieren.'
    canticle_greataxe: 'Aufbewahrt für die sturen Scheite ganz unten im Stapel. Beendet nebenbei die meisten anderen Streitigkeiten auf dem Grundstück.'
    cantor_basalt: 'Küchenbodenware, glattgetreten von vier Jahrhunderten auf und ab gehender Köche.'
    canvas_boots: 'Wasserdicht fuer die ersten drei Sekunden. Danach Schwaemme mit Schnuersenkeln. Komfort: feucht.'
    cape_fuwa_black: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_fuwa_white: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_kamui: 'A cloak cut from something that should not have had a hide. It remembers being worn by worse.'
    cape_lorito_agility: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_chance: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_intelligence: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_strength: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_vitality: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_wisdom: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    capstone_lattice: 'Ein kristallines Gerüst, das nur unter dem Druck aushärtet, den es allein am Gipfel gibt, was es genau so schwer zu beschaffen macht, wie es klingt.'
    capstone_treads_of_last_ascent: 'Die Sohle, die nur ein einziges Mal zählt, beim letzten Schritt — genau der Moment, in dem den meisten Trägern die Füße abhandenkommen, um sie zu würdigen.'
    capstone_visor_of_last_ascent: 'Die Krone, die man dem Pilger reicht, der die Spitze erreicht — in dem kurzen Moment, bevor er begreift, was das Erreichen der Spitze tatsächlich kostet.'
    capstone_warbelt_of_first_dawn: 'Beschwert, um einen Körper gegen den Aufwind zu verankern, der an allem in Gipfelnähe zerrt. Er verankert gut. Woran er dich verankert, ist deine Sache.'
    capuche_bara: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_air: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_earth: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_fire: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_water: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_wisdom: ''
    capuche_mo: 'A tattered hood strung with tiny skulls. Mo never explains where they came from, and nobody asks twice.'
    casque_hayate: 'Swift-wind steel. Light enough to run in, loud enough to be heard coming.'
    cataclysm_brew_of_nine_faults: 'Aschepropheten brauen dies in der Nacht vor einem Kataklysmus, den sie bereits gesehen haben und nicht ungesehen machen können. Es verhindert nichts. Es beruhigt nur die Hand, die zusehen muss.'
    cataclysm_core_rift: 'Der dichte Knoten, wo ein Beben sich verausgabte. Warm, geduldig, noch unentschieden, ob fertig.'
    cataclysm_core_void: 'Wiegt nichts und fällt trotzdem. Physiker wurden befragt; die Physiker gingen.'
    cataclysm_extract: 'Das Letzte, was man aus einem verbrauchten Beben destilliert. Bitter, stark und rastlos.'
    cataclysm_tassets_of_fifth_breach: 'An der Hüfte gepanzert von dem Torwächter, der am Tag, als das Zählen aufhörte, etwas zu bedeuten, die fünfte Schicht übernahm. Das Metall erinnert sich an Habachtstellung. Die Beine des Trägers weniger.'
    cataclysm_tassets_of_nine_faults: 'Benannt nach der Anzahl Risse, über die der tragende Torwächter bei einer einzigen Patrouille stieg. Der zehnte Riss ist der, den niemand zählte.'
    cataclysm_warboots_of_fifth_breach: 'Zum schnellen Überqueren eines wachsenden Spalts. Die Theorie stimmt. Der Spalt nicht.'
    cataclysm_warboots_of_nine_faults: 'Gebaut, um zu stehen, wo sonst nichts steht. Das „sonst nichts“ schließt den Boden ein.'
    celestial_wafer: 'Es wurde zweimal katalogisiert, unter zwei verschiedenen Theorien, eine Unstimmigkeit, deren Klärung niemandem zugewiesen wurde.'
    chantmarked_crusher_of_twelve_voices: 'Großküchenqualität. Was er den Kartoffeln antat, tut er auch der Moral an.'
    chantmarked_edge_of_last_verse: 'Der Teil des Lieds, nachdem alle es für beendet hielten. Eine Überraschung. Stets die letzte.'
    chantmarked_grips_of_twelve_voices: 'Geeicht an einem Gurkenglas, das vor der Gründung des Chors versiegelt wurde. Es ging auf. Irgendwann.'
    chantmarked_legguards_of_last_verse: 'Reserviert für Gottesdienste, Beerdigungen und Tage, an denen beides zusammenfällt. Hier sind das die meisten Tage.'
    chantmarked_legguards_of_twelve_voices: 'Gebügelt bis zu einer Falte, die Briefe öffnen könnte. Sich hinzusetzen wäre Vandalismus.'
    chantmarked_rod_of_twelve_voices: 'Das Wischende vertrocknete vor Jahren. Seitdem dirigiert der Stiel den Chor, schlecht.'
    chantmarked_tonic_of_last_verse: 'Für wenn der Kampf vorbei war und dann, unhöflich, doch nicht. Kauft dir einen Refrain mehr.'
    chantmarked_twin_knives_of_last_verse: 'Großmutters Stricknadeln. Der Schal wurde nie fertig; der Einbrecher hat sich nie erholt.'
    chantmarked_visor_of_last_verse: 'Der Knauf obendrauf ist Konstruktionsfehler und Tragegriff in einem.'
    chantmarked_warbelt_of_last_verse_choir: 'Die Zeile, zu der das Lied stets zurückkehrt. Schnall ihn um und du kehrst auch zurück. Nervig.'
    chantmarked_warbelt_of_last_verse_pyre: 'Schlaufen für Hammer, Blechschere, Wachs, Weihwasser. Eine leere Schlaufe heißt, der Ärger war schneller.'
    charged_vault_key: 'Geschmiedet aus Voltglas, dauerhaft geladen mit statischer Elektrizität aus den Gewitterzellen des Plateaus. Der Tresor des Sturmwärters wurde öfter vom Blitz getroffen, als irgendwer gezählt hat, und dieser Schlüssel ist der Grund, warum er sich noch öffnet.'
    charite_brick: 'Dichter Ziegel aus verbranntem Mehl und Bernstein. Ruestungsschmiede mahlen ihn als Bindemittel.'
    chief_mark_brand: 'Markiert Rekruten, die zu unerfahren sind, um sich zu wehren. Heizt schnell auf, verblasst langsam.'
    chipped_axe: 'Die Klinge hat mehr Splitter als eine Tuete Chips. Jeder Schlag schickt Fragmente. Natuerliche AoE.'
    chitin_cutlass: 'Halb Chitin, halb rostiges Metall. Ueberraschend effektiv darin, Naehe bereuen zu lassen.'
    chitin_gauntlets: 'Lamellierte Insektenhülle zu Panzerhandschuhen geformt, leicht, aber doch widerstandsfähig genug, um Streiftreffer abzuwehren. Der vorherige Träger fand sie angeblich sehr bequem, bis das Giftbläschen platzte.'
    chitin_longsword: 'Diese Klinge wurde aus dem Panzer eines namenlosen Tiefenbiests geschlagen, ihre Schneide gezackt, doch beunruhigend scharf.'
    chitin_shellplate: 'Man sagt, sie schützt vor Meuchelmördern – hauptsächlich weil der Gestank sicherstellt, dass niemand nah genug kommt, um es zu versuchen.'
    chitin_walkers: 'Diese Stiefel zappeln bei jedem Schritt, denn die Chitinplatten sind bloß eine Hülle für die Kreaturen, die darin leben.'
    choir_conductor_staff: 'Zeig damit, und der ganze Scheiterhaufen hält dein Tempo. Lass ihn fallen, und das Feuer improvisiert. Lass ihn nicht fallen.'
    choir_hymnbread: 'Gebacken während einer Predigt, die kein Ende fand. Die Kruste wurde irgendwann in der vierten Stunde fest.'
    choir_obsidian: 'Polierte Vulkanplatte. Kühl bei Berührung, unempfindlich gegen Messernarben wie heiße Pfannen.'
    choir_procession_boots: 'Für den langsamen würdigen Gang zum Altar gebaut. Renn los und die Würde geht zuerst.'
    choirblade_altus: 'Ein ganzes Klaftermaß abgelagerte Eiche. Jedes Kind der Gemeinde weiß genau, wie viel Ärger er abmisst.'
    choirforged_cuirass: 'Voller Plattenschutz in Gestalt einer Backschürze. Die Rüsche ist tragend.'
    choirforged_draught: 'Der letzte Ausguss der Kanne. Bitter, körnig, und irgendwie die stärkste Tasse des Tages.'
    choirforged_gauntlets_of_cooling_vent: 'Geschlitzt, um Hitze abzuführen, was sie tun, direkt auf deine Handgelenke. Ein Handel, kein Geschenk.'
    choirforged_greatblade_of_cooling_vent: 'Kommt heraus, wenn der Braten ganz ist und die Familie sitzt. Der Braten ist selten das Einzige, das zerlegt wird.'
    choirforged_greaves_of_ashen_song: 'Fahrradklammern in einer Kathedrale ohne Fahrräder. Vorsorge ist ihr eigener Lohn.'
    choirforged_helm: 'Gusseisen, Familiengröße. Die Delle links stammt vom Vorbesitzer, der einmal eine Meinung hatte.'
    choirforged_ration_of_ashen_song: 'Das hat jemandes Mutter gepackt. Die Brote sind in Dreiecke geschnitten; die Apokalypse kann warten.'
    choirforged_sabatons_of_ashen_song: 'Zugelassen für Hochwasser, Schlamm und flaches Magma. Eine Nummer zu groß, wie es sich gehört.'
    choirforged_signet: 'Eisen, verbeult, eine Größe, die niemandem passt. Er hat Nadeln abgewehrt, Splitter, und ein Attentat.'
    choirmaster_locket: 'Jeder Schlüssel der Kathedrale an einem einzigen Eisenring. Wer ihn trägt, haftet für jede verschlossene Tür und jedes Geräusch dahinter.'
    chokepoint: 'Sitzt genau dort, wo sich die Kehle bis auf nichts verengt. Der Juwelier, der es entwarf, beharrt darauf, dass das Zufall ist.'
    cinchward: 'Zieht sich von selbst zusammen, wenn der Träger vergisst, in der Nähe der Wunde vorsichtig zu atmen. Er hat feste Ansichten zur Haltung.'
    cinder_band: 'Ein Splitter eines einst ganzen Herzens. Es erinnert sich. Es will den Rest zurueck.'
    cinder_bow: ''
    cinder_cleave: ''
    cinder_crown: 'Das Gluehen laesst dich wichtig wirken. Das komplette Set laesst dich unausweichlich wirken.'
    cinder_cuirass: 'Mit Glutherzsplittern ausgekleidet. Hält euch in der Tundra warm und versetzt euch überall sonst leicht in Brand. Ein thermischer Kompromiss, den jeder überlebende Winterkämpfer kennt.'
    cinder_fangs: ''
    cinder_fists: 'Nur einen Fingerschnippen davon entfernt, auch das Problem der anderen fuenf Teile zu werden.'
    cinder_greaves: 'Jeder Stuhl, auf dem du sitzt, erinnert sich an dich. Die Glut auch.'
    cinder_heart: 'Noch glühend aus der Brust eines Feuerstahlgolems gerissen, heiß genug, um allein als ganze Schmiede zu dienen. Zu nah aufgestellte Ambosse schmelzen einfach. Der Schmiedekult nennt das längst keinen Unfall mehr.'
    cinder_heart_amulet: 'Das Stueck, zu dem alle anderen still und leise zurueckwollen.'
    cinder_heart_scepter: 'Richte ihn auf das vollstaendige Set, und etwas in deiner Brust bekommt Ideen.'
    cinder_heart_staff: 'Trägt eine Glut, die nie ganz erkaltet. Die Kolonne erinnert sich an ihre Wärme.'
    cinder_locket: 'Enthaelt eine Glut, die es aus Prinzip ablehnt, zu erloeschen.'
    cinder_loop: 'Mit Splittern eines Glutherzens besetzt. Angenehm warm und ab und zu viel zu warm nach ein paar Drinks.'
    cinder_maul: ''
    cinder_sash: 'Aus Aschherz-Faden gewoben. Macht eine Wache in der kältesten Stunde erträglich.'
    cinder_striders: 'Waermt dich im Winter. Verfolgt dich nachts. Das Set beobachtet irgendwie immer.'
    cinder_waistguard: 'Nie kuehl bei Beruehrung. Das ganze Set hat hoeflich, gemeinsam, Fieber.'
    cinderchant_robe: 'Gesteppt, bodenlang, leicht angesengt. Darin zu sterben ist vertretbar; darin die Tür zu öffnen nicht.'
    cinderchoir_alloy: 'Klingt beim Schlagen einen Akkord an, was reizend ist, bis man es leise bearbeiten muss.'
    cinderchoir_brew_of_molten_antiphon: 'Nahe den Schloten gebraut, kühlt es nie ganz ab. Meist wärmt es dich. Manchmal warnt es dich.'
    cinderchoir_cincture_of_black_choir_pyre: 'Warm in der Hand und still grau rieselnd. Du findest wochenlang Asche in deiner Verpflegung.'
    cinderchoir_cincture_of_black_choir_vitrified: 'Ein Schneiderband, geeicht in Daumen und Handspannen. Es hat drei Kaiser vermessen und alle drei belogen.'
    cinderchoir_crest_of_black_choir: 'Seit der Aschenflut verkehrt herum getragen. Riecht nach Lauge und stiller Entschlossenheit.'
    cinderchoir_locket_of_black_choir: 'Birgt eine Prise eines verbrannten Gesangbuchs. In stillen Nächten ordnet sich die Asche zu lesbaren Versen. Lies sie nicht.'
    cinderchoir_tassets_of_black_choir_pyre: 'Glimmt sanft am Saum. Modisch, warm und eine echte Gefahr in der Nähe von trockenem Gras.'
    cinderchoir_tassets_of_black_choir_vitrified: 'Verstärkt, wo das Beten am schnellsten durchscheuert. Die Flicken sind neu; die Knie darunter sind verloren.'
    cinderchoir_warboots_of_molten_antiphon: 'Sohlen aus erkaltender Schlacke gegossen. Sie halten die Tageshitze bis in die eisige Nacht. Meist ein Geschenk.'
    cindercloth_gloves: 'Verwandelt jeden Haendedruck in eine kleine Sicherheitseinweisung.'
    cindercloth_hood: 'Haelt den Kopf warm. Haelt die Augenbrauen nirgendwo Bestimmtes.'
    cindercloth_legs: 'Elektrische Entladung ist technisch inbegriffen. Sie war in keiner Version je als Feature gedacht.'
    cindercloth_robe: 'Moenche webten dies unter einem Geluebde zweitgradiger Verbrennungen. Die meisten hielten es. Weniger behielten Augenbrauen.'
    cindercloth_sandals: 'Hinterlaesst gluehende Fussspuren. Heimlichkeit war hier nie wirklich der Plan.'
    claude_axe: 'Einst vom unermüdlichen Claude geführt, dessen Ausdauer im Kampf zur Legende wurde — und dessen Ausdauer im Schlafgemach zu einer ganz anderen Warnung.'
    cleancut: 'Hinterlässt eine so präzise Schneide, dass sich die Wunde falsch darum schließt. Chirurgen untersuchen die Narben. Sie veröffentlichen ihre Erkenntnisse nicht.'
    clearsight: 'Verbessert die Sicht an der Narbe, was weniger gnädig ist, als es klingt. Manches sieht man besser nur halb.'
    cobalt_battlecleaver: 'Zweihaendig, doppelschneidig, noch warm vom Aschenhaut-Echsen. Schlecht fuer Briefe, gut fuer Feinde.'
    cobalt_club: 'Kweebec-Holz so dicht, dass es vergass, einst von Photosynthese gelebt zu haben.'
    cobalt_crushers: 'Verstärkte Knöchel für den Fall, dass Worte versagen. Worte versagen immer.'
    cobalt_daggers: 'Zweifach mit Druesenextrakt bestrichen, und einmal, inoffiziell, mit schlechten Entscheidungen.'
    cobalt_longblade: 'Eine zuverlaessige Klinge erwaermt von Aschenschuppen. Tut genau was man erwartet. In einer Welt voller Ueberraschungen ist das etwas wert.'
    cobalt_mace: 'Gehaertet mit Wabenwachs und daemmergeschmiedetem Stahl. Sie setzt ein Gesetz durch: der Schwarm zuerst.'
    cobalt_pike: 'Spitze aus Sonnenschuppe und Schaft aus Kweebec-Rinde. Lang genug um aus sicherer Entfernung zu stechen. Strategie oder Feigheit, deine Wahl.'
    cobalt_shortbow: 'Wurfarme aus Kweebec-Rinde, bespannt mit sturmgeladenen Federn, die vor jedem Schuss summen.'
    cobalt_staff: 'Kweebec-Rinde, gekrönt von einem Amulett, eigens für Geduld geschnitzt, die es auch braucht — es kanalisiert Wassermagie mit der ganzen ruhigen Gelassenheit eines Wasserhahns, der nie ganz zugeht.'
    cobalt_sword: 'Mit Aschenhaut-Echsenleder umhuellt. Warm im Griff und verraet absolut nichts.'
    cobalt_waraxe: 'Aus sonnenwarmer Schuppe geschnitten und in Bernsteinwachs versiegelt, summt sie einen Ton, den die Woolice fürchten gelernt haben, noch bevor sie die Klinge sehen. Ein nützlicher Ruf. Selten ein verdienter, murren die Hirten.'
    cobalt_wargreaves: 'Schwer genug, dass Kniebeugen zum Training werden. Leicht genug, um zu rennen, wenn das Training schiefgeht.'
    cobalt_warhelm: 'Standardausrüstung für Soldaten, die sich noch nichts verdient haben, das einen schickeren Helm rechtfertigt.'
    cobalt_warplate: 'Schützt die lebenswichtigen Organe. Die unwichtigen sind auf sich allein gestellt.'
    cocoon_king_amulet: 'Eine goldene Seidenkette, noch warm vom Kokon, aus dem sie geschnitten wurde. Der König verlangt sie nie laut zurück. Muss er auch nicht — die Gedanken des Trägers werden Tag für Tag leiser.'
    cocoon_king_cowl: 'Aus derselben goldenen Seide gewebt, tief über die Augen gezogen. Alles jenseits der Armreichweite verschwimmt zu einem behaglichen goldenen Dunst — Gnade oder Absicht, ganz wie man mag.'
    codex_of_the_damned: 'In Grableder gebunden. Jeder enthaltene Zauber hat seinen Wirker schon einmal im Stich gelassen.'
    codex_of_the_deep: ''
    coiffe_fuwa_black: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_fuwa_white: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_pepe: 'A humble green cap. The starter flex. Every royal was once just a pepe in a hat.'
    coiffe_pepe_royal: 'The pepe ascended. A gilded crown for those who bought the top and never sold.'
    collapse_alloy: 'Aus Dingen gemischt, die zusammen fielen. Es wirkt nur stabil, weil die Teile längst aufgaben.'
    collapse_bludgeon_of_last_tremor: 'Einmal geschwungen von einem Riftling, der einen Territorialstreit klärte, woraufhin das Territorium aufhörte zu widersprechen. Beendet Sätze, Kämpfe und gelegentlich Möbel, ungefähr in dieser Reihenfolge.'
    collapse_greaves: 'Absichtlich schwer. In einer Welt, in der man wegschweben kann, ist das Trost, keine Klage.'
    collapse_helm_of_widening_crack: 'Schützt den Kopf vor allem außer dem, was direkt darüber ist, der eigentlichen Gefahr hier.'
    collapse_pendant_of_widening_crack: 'Birgt eine Prise Staub vom Ersten, das hier fiel. Es gibt hier sehr viel Staub.'
    colophon: 'Der Druckervermerk am Ende überlebte den Drucker, die Druckerei und den größten Teil der Sprache, in der das Buch geschrieben wurde.'
    concussion: 'Klinisch benannt von der letzten Person, die sie traf, im kurzen Moment bevor diese vergaß, wie Sprache funktioniert.'
    convergence_pendant: 'Zwei Edelsteine, eine Fassung, ein andauernder Streit darueber, wessen Sonnenaufgang zaehlt.'
    copper_band: "Faerbt den Finger nach einer Stunde gruen. Der Juwelier besteht auf 'Patina' nicht 'Kupfervergiftung'."
    copper_cleaving_axe: ''
    copper_hoe: 'Das billigste Ackergerät aus Kupfer, und jedes Kupferwerkzeug im Moor trägt am Ende genau denselben Grünton, ob es will oder nicht.'
    copper_pickaxe: 'Weich genug um bei schlechtem Schlag zu beulen. Bergleute kompensieren mit mehr Schlagen. Der Berg ist wie immer nicht beeindruckt.'
    copper_sickle: 'Kupfer oxidiert binnen einer Woche zu gruner Patina. Krauterkundige finden das asthetisch passend. Das Kupfer hat keine Meinung.'
    corbac_head: 'A crow-skull crown for the carrion-minded. The beak points at whatever you are about to loot.'
    cordwood: 'Gemessen in der alten Einheit, die niemand mehr für Holz benutzt, weil nicht mehr genug Holz übrig ist, um sie zu brauchen.'
    core_forge_key: 'Die Legende besagt, der Glutkönig habe einen einzigen echten Schlüssel aus seinem eigenen gehüteten Herzfeuer geprägt, zu heiß für bloße sterbliche Hände. Dies ist nicht jener Schlüssel. Mehrere Schmiede schwören, er komme nahe genug heran.'
    coronet_band_of_silent_court: 'Niemand erinnert sich, diesem Ergebnis zugestimmt zu haben, eine Behauptung, die nie geprüft wurde.'
    coronet_edge_of_silent_court: 'Sein Verhalten widerspricht seiner eigenen Beschreibung, eine Fußnote, die der Schöpfer nie geschrieben hat.'
    coronet_lattice: 'Seine Einordnung wird seit seinem Fund angezweifelt, worüber das Vermessungsteam noch immer streitet.'
    coronet_legguards_of_silent_court: 'Es wurde gebaut, um einen Punkt zu beweisen, an den sich niemand erinnert, eine Tatsache, die der Schöpfer als Feature betrachtet.'
    coronet_poultice_of_empty_seats: 'Die Person, die es abfüllte, einigte sich nie auf eine endgültige Fassung, und bisher hat noch niemand eine Rückerstattung verlangt.'
    coronet_resin: 'Niemand kann mit Sicherheit sagen, woher dies stammt, und die Akte wurde still geschlossen, ungeklärt.'
    coronet_rod_of_silent_court: 'Das Entwurfskomitee war sich darüber nie wirklich einig, was entweder beruhigend oder zutiefst beunruhigend ist.'
    coronet_tonic_of_silent_court: 'Sein Nachgeschmack ist Ansichtssache, eine Tatsache, die auf dem Etikett diskret ausgelassen wurde.'
    coronet_torc_of_empty_seats: 'Es funktioniert angeblich genau wie beschrieben, und trotzdem gilt das immer noch als Erfolg.'
    coronet_treads_of_silent_court: 'Der Entwurf überstand drei getrennte Einwände, also hat sich niemand die Mühe gemacht, sich zu beschweren.'
    coronet_visor_of_empty_seats: 'Es funktioniert nur aufgrund einer Formsache, und das Komitee kam nie wieder zusammen, um es zu überdenken.'
    coronet_warblade_of_silent_court: 'Es wurde mit geteilter Entscheidung genehmigt, und der Streit überdauerte alle, die ihn begonnen hatten.'
    corvid_eye: 'Klein, schwarz, und scheint immer noch zu beobachten. Apotheker mahlen diese für Nachtsichtsalben. Ethisch trüb.'
    corvid_feather_lance: 'Mit Kraehenfedern fuer Aerodynamik befiedert. Die Kraehen sind immer noch sauer.'
    crab_claw_grips: 'Gefertigt aus Scheren, die ein Leben lang Dinge festklammerten und nicht losließen. Die Handschuhe erbten diese Eigenschaft. Zum Ausziehen benötigt man warmes Wasser, Geduld und einen Freund, der nicht urteilt.'
    crab_claw_hatchet: 'Die Klaue oeffnet und schliesst sich noch von selbst. Meist ungelegen.'
    crab_claw_joint: 'Das Scharniermechanismus einer massiven Schere. Ingenieure studieren diese. Die Technik ist besser als alles, was wir gebaut haben.'
    crab_pincer_shivs: 'Geschärfte Krabben-Gelenkscheren. Sie zwicken bevor sie schneiden, was irgendwie schlimmer ist.'
    crab_shell: 'Ein stabiler Panzer, geerntet von einem Krebstier, das offenbar einen Streit mit jemandem sehr Hungrigem verloren hat.'
    crab_shell_cuirass: "Der Rüstungsschmied sah die Krabbe an, sagte 'das ist im Grunde schon ein Brustpanzer' und verlangte den vollen Preis für etwas, das im Wesentlichen Umformen und eine Schicht Öl war."
    cracked_bone: 'Ein Oberschenkelknochen, der bessere Jahrhunderte gesehen hat. Überraschend stabil trotz der Risse. Hunde wollen ihn immer noch. Nekromanten auch.'
    cracked_mace: 'Der Kopf rasselt bei jedem Schwung. Strukturelle Integritaet ist ein Vorschlag keine Garantie.'
    crazy_belt: 'Ein Gürtel eines Goblins, tiefrot gefärbt mit Pigmenten, die definitiv kein Beerensaft sind.'
    crazy_helmet: 'Zusammengebaut von einem Goblin, der einmal ein unzuverlaessiges Geruecht ueber Helme hoerte.'
    crazy_tunic: 'Eine purpurne Tunika, ehemals getragen von einem Goblin, dessen Verstand schon lange fort war.'
    crimson_brick: 'Ein blutroter Ziegel der stundenlang Waerme abstrahlt. Stabschnitzer hoehlen ihn fuer Stabgehaeuse aus.'
    crimson_truffle: 'Eine unterirdische Delikatesse, so selten, dass ihr Preis per Auktion festgelegt wird, nie durch vernuenftige Marktlogik.'
    crimson_truffle_heart: 'Der dichte, pulsierende Kern aus der tiefsten Kammer, die je eine Purpurtruffel bildete.'
    crooked_staff: "Ein Gehstock mit Groessenwahn. Der einzige Zauber den er wirkt ist 'leichte Peinlichkeit'."
    crow_feather: 'Eine schillernde schwarze Feder. Federmacher zahlen gut. Der Geist der Krähe wird deine Federzüge verfolgen. Angeblich.'
    crown_dust: 'Es wurde zweimal katalogisiert, unter zwei verschiedenen Theorien, von einem Gremium, das sich seither aufgelöst hat.'
    crown_of_quills: 'Eine Krone, die vergessen hat, was sie krönt. Sie sitzt unbequem, nicht von ihrer eigenen Autorität oder ihrem Zweck überzeugt.'
    crown_of_the_void_sovereign: 'Die Leere hat offiziell keinen Herrscher. Diese Krone war eine Selbsternennung, der niemand Anwesendes die Dichte hatte zu widersprechen. Katalogisierer führen den Besitzer als „umstritten“.'
    crownfire_rod: 'Es funktioniert vorläufig, bis zur weiteren Prüfung, also hat sich niemand die Mühe gemacht, sich zu beschweren.'
    crownless_blade: 'Sein Zweck wurde erst nach der Fertigstellung überdacht, ein kleiner Trost, angesichts der Alternative.'
    crownless_cuisses: 'Es funktioniert unter Vorbehalt, keine Rückerstattung, keine weiteren Fragen.'
    crownless_signet: 'Es tut, was ihm gesagt wird, irgendwann, ein Kompromiss, nachdem alle das Streiten aufgegeben hatten.'
    crownrot_cuirass_crown: 'Seine Zuverlässigkeit ist Gegenstand anhaltender Debatten, und der Schöpfer machte weiter, bevor der Gedanke zu Ende war.'
    crownrot_cuirass_godbone: 'Es tut, was ihm gesagt wird, irgendwann, eine Lösung, die kaum etwas löste.'
    crownrot_greaves_of_gilded_ruin: 'Es tut genau eine Sache und bestreitet selbst das, was entweder als Konstruktionsfehler oder als Absicht gelten kann.'
    crownrot_helm_crown: 'Es funktioniert angeblich genau wie beschrieben, und der Schöpfer machte weiter, bevor der Gedanke zu Ende war.'
    crownrot_helm_godbone: 'Die Anleitung ging in einer hitzigen Debatte verloren, was der Träger einfach zu glauben beschlossen hat.'
    crownrot_ration_of_rotting_halo: 'Es schmeckt wie eine überstürzte Entscheidung, daher können die Ergebnisse erheblich variieren.'
    crownrot_signet: 'Es funktioniert, technisch gesehen, unter den meisten Bedingungen, und der Träger hat gelernt, mit der Ungewissheit zu leben.'
    crude_branch: 'Was für den einen Brennholz ist, ist anscheinend für den anderen eine legendäre Handwerkskomponente.'
    crude_hatchet: 'Eher ein scharfer Stein auf einem Stock. Die Hoehlenmensch-Aesthetik ist kostenlos.'
    crude_ring: 'Gebogener Draht mit Schmuck-Ambitionen. Wenn man blinzelt sieht es fast absichtlich aus.'
    crystal_bread: 'Die Kruste funkelt. Die Krume schimmert. Dein Zahnarzt wird eine Meinung dazu haben, handwerklich gepraegt.'
    crystal_focus_staff: "Bestückt mit einem gebrochenen Splitter, der jeden Zauber dorthin lenkt, wohin es ihm gerade gefällt — selten dorthin, wohin man zielte. Die alten Magier nennen das 'Charakter'. Alle im Wirkungsbereich nennen es kürzer und deutlicher."
    crystal_ice_staff: 'Der Kristall, der ihn krönt, ist noch nie geschmolzen — nicht durch Schmiedeglut, nicht durch den Sommer, nicht aus reinem Trotz. Praktisch, um ein Getränk kühl zu halten. Deutlich überzeugender an einem Feind.'
    crystal_tide_staff: 'Ein Stab mit einem roten Kristall, der mit Gezeitenenergie pulsiert. Er tropft gelegentlich, was den dramatischen Effekt zunichte macht, den der Träger bei wichtigen Momenten sorgfältig vorbereitet hat.'
    crystal_ward_tome: 'Mit zersplittertem Kristall besetzt. Jeder Zauber, der dadurch gewirkt wird, klingt wie ein sehr langsam fallender Kronleuchter.'
    crystallized_loaf: 'So mineralreich, dass Schmiede ihn wegen der Splitter zerschlagen statt ihn zu essen. Verstaendlich.'
    crystallized_tanjirize: 'Tanjirize, das eine Verwandlung durchlief, die kein Botaniker erklären kann und über die die meisten lieber nicht nachdenken.'
    cuirass_of_the_hollow_king: 'Keine Rüstung, die ein König in Auftrag gab — eine Rüstung, die eine Leeremotte wachsen ließ und für deren Tragen sich später ein König die Ehre nahm. Der Unterschied war genau einer Person wichtig, und die kann nicht mehr widersprechen.'
    cured_gauntlets: 'Richtig gegerbtes Leder. Endlich riecht es nicht nach nassem Hund. Es riecht nach trockenem Hund.'
    cursed_amalgam: 'Der Höhepunkt einer Kräuterkundler-Karriere in einem Glas. Es flüstert nachts. Niemand fragt, was es sagt.'
    cursed_boot_contradiction: 'Ein verfluchter Stiefel, der Bewegungsfreiheit gegen Eigensinn tauscht. Der Träger bewegt sich unbeholfen, aber hält sich durch reine Widerspruch für unbesiegbar.'
    cursed_fungus: 'Der unbestrittene Gipfel alchemistischen Ehrgeizes, ein Pilz von derart konzentrierter Bösartigkeit, dass er die Namen derer flüstert, die sich nähern, in einer Stimme wie trockene Blätter, die über einen Sargdeckel kratzen. Erfahrene Sammler berichten, dass er nicht so sehr geerntet wird, als dass er sich nehmen lässt — eine Unterscheidung, die keinerlei Trost spendet.'
    cursed_gem: 'Fluestert dunkle Versprechungen jedem zu der ihn zu lange haelt wobei es meist um Rueckenschmerzen geht.'
    cursed_gem_powder: 'Das Fluestern wurde nach dem Mahlen schlimmer. Jetzt kritisiert es deine Handwerkstechnik in Echtzeit.'
    cursed_helm_paradox: 'Ein verfluchter Helm, der den Verstand stumpf macht und den Körper stärkt. Er gewährt Leben durch den Verlust von Klarheit, ein in Paradox geschriebenes Geschäft.'
    cursed_loaf: 'Fluestert Rezepte jedem zu der es haelt. Das Brot hat Meinungen ueber deine Technik und sie sind nicht nett.'
    cursed_root: 'Mit echter Anstrengung von verfluchtem Pilz gerissen, denn sie hat die Angewohnheit, härter zurückzugreifen, als es sich für etwas ohne Rückgrat gehört. Sie bleibt im Lager warm und zuckt gelegentlich. Erfahrene Kräuterkundige nennen das normal, in einem Ton, der absolut niemanden überzeugt.'
    cursed_straw: 'Von einer Vogelscheuche genommen, die deutlich lebendiger war als erwartet. Zuckt noch, wenn niemand hinschaut.'
    cursed_straw_amulet: 'Ein Schwur von etwas, das technisch gesehen keinen Mund hat. Er wurde trotzdem gehalten, aus reiner Boshaftigkeit.'
    cursed_wheat: 'Eine Ähre von schwarzer Magie geschwärztes Getreide, ihre Körner flüstern voller Unzufriedenheit.'
    deadweight: 'Schwerer, als die Aufgabe erfordert, und die Aufgabe hat sich über den Überschuss noch nie beschwert.'
    deathgrip: 'Verriegelt die Finger im Moment des Aufpralls und bleibt einen Herzschlag länger verriegelt, als dem Träger lieb ist.'
    deathless_blade: 'Aus der Grabhügel gezogen. Geschärft an der Grenze zwischen den Reichen. Ein Werkzeug, das seine Arbeit kennt.'
    deep_scale: 'Schwarz wie der Abgrund, aus dem sie stammt. Der Leviathan trug Tausende davon. Du hast eine. Sei bescheiden.'
    deepbreath: 'Sitzt so eng, dass ein voller Atemzug bewusste Anstrengung braucht. Die meisten Träger bemerken es ab der zweiten Woche nicht mehr.'
    deepmoss_leggings: 'Mit Moos gepolstert, das feucht bleibt, egal wie lange man es trägt, gewonnen von dort, wo auch immer die Moosbären hausen. Es hat eine Meinung zum Trockenbleiben. Diese Meinung verliert.'
    deepreach: 'Erweitert die Reichweite des Zauberers bis in Orte, die er lieber nicht persönlich aufsuchen würde.'
    deepscale_fists: 'Knöchel verstärkt gegen alles, was in alten Gräbern nistet.'
    deepwater_breastplate: 'Im Moorwasser gegerbt, bis der Rost aufgab. Riecht nach Sumpf, weil sie aus dem Sumpf stammt.'
    deepwater_stilts: 'Hebt den Träger über das Schlimmste des Schlicks. Das Schlimmste findet trotzdem einen Weg nach oben.'
    deepweald_longbow: 'Straff genug gespannt, um einen Pfeil lautlos durch die dichte Finsternis des Weald zu schießen, wo Schall weiter trägt, als Sicht es je tat. Das Rudel jagt hier nach Gehör; du solltest es auch.'
    deepwoven_carapace_of_deep_canopy: 'Geschichtet wie das Blätterdach, nach dem er heißt, jede Lage aus der darunter gewachsen, was seine Ausbesserung eher zur Gärtnerei als zur Schmiedearbeit macht.'
    deepwoven_cincture_of_drowned_weald_matron: 'Aus dem Faden der Matrone selbst gewickelt, der einen Knoten hält, den keine menschliche Hand knüpfte, und sich nicht davon abbringen lässt.'
    deepwoven_cincture_of_drowned_weald_mire: 'Ein gewebter Gürtel, der sich in kaltem Wasser von selbst strafft, ein hilfreicher Reflex, bis man sich erinnert, dass er nicht erst fragt.'
    deepwoven_composite: 'Unter Druck an der tiefsten Werkbank des Weald gewebt, wo sich die Lagen so eng verbinden, dass die Naht eher ein Gerücht als ein Merkmal wird.'
    deepwoven_crest_of_deep_canopy: 'Mit lebender Kronenranke durchzogen, die auf dem Kopf des Trägers weiterwächst, langsam, in eine Richtung, die er nicht wählt.'
    deepwoven_crest_of_drowned_weald: 'Unter Wasser so dicht gewebt, dass er nie ganz trocknete, und wiegt nun ein Haar mehr, als er sollte, für immer, aus Trotz.'
    deepwoven_philter_of_drowned_weald_matron: 'In Matronenseide gezogen, die sich nie ganz auflöst, sodass ein Faden davon stets zurückbleibt und ausbessert, worum ihn niemand bat.'
    deepwoven_philter_of_drowned_weald_mire: 'Die schlichte Fassung, die die Führer tragen, halb so stark und doppelt so verlässlich, ein Tausch, der einen hier unten am Atmen hält.'
    deepwoven_splitter_of_deep_canopy: 'Zum Fällen der Kronenranke ausbalanciert, die die Ebenen zuschnürt, eine banale Aufgabe, die er mit maßlos übertriebener Begeisterung verrichtet.'
    deepwoven_tassets_of_deep_canopy: 'In überlappenden Wedeln gewachsen wie das Blätterdach droben, sodass ein tiefer Hieb nur die Blätter teilt und weitere Blätter findet.'
    demon_codex: ''
    dented_mace: "Mehr Beulen als eine Parkplatz-Stossstange. Jede ist eine Lektion in 'tiefer als die Kniescheibe'."
    diadem_casque_of_broken_diadem_crown: 'Der Träger besteht darauf, dass es funktioniert; die Beweise sind unschlüssig, eine Entscheidung unter erheblichem Zeitdruck.'
    diadem_casque_of_broken_diadem_godbone: 'Die Handwerkskunst ist solide; die Prämisse nicht, was genauso beruhigend ist, wie es klingt.'
    diadem_charm_of_falling_crown: 'Seine Wirksamkeit wurde nie unabhängig überprüft, was niemand mehr die Energie hat zu bestreiten.'
    diadem_chausses: 'Es wurde aus purer Sturheit fertiggestellt, was niemand mehr die Energie hat zu bestreiten.'
    diadem_cordial_of_falling_crown: 'Das Etikett listet eine Zutat auf, die niemand identifizieren kann, eine Tatsache, die auf dem Etikett diskret ausgelassen wurde.'
    diadem_elixir_of_broken_diadem: 'Seine Wirkung setzt ein, oder auch nicht, unvorhersehbar, also wird es mit einem Achselzucken statt einer Garantie verkauft.'
    diadem_lattice_crown: 'Seine genauen Eigenschaften hängen davon ab, wen man fragt, eine Unstimmigkeit, deren Klärung niemandem zugewiesen wurde.'
    diadem_lattice_godbone: 'Ob es ein oder mehrere Materialien sind, ist noch ungeklärt, und die zweite Erklärung wurde nie ganz ausgeschlossen.'
    diadem_vambraces_crown: 'Es erledigt die Aufgabe, die ihm schließlich zugewiesen wurde, was entweder das ganze Konzept oder nur ein Rundungsfehler ist.'
    diadem_vambraces_godbone: 'Es erfüllt seine erklärte Funktion mit sichtbarem Widerwillen, also wurde die Debatte auf unbestimmte Zeit vertagt.'
    diamond: 'Ein Splitter komprimierten Kohlenstoffs, der vergaß, prächtig zu werden, der kargen Umklammerung der Erde entrissen.'
    diamond_bag: 'Der Inhalt dieses Beutels könnte ein kleines Königreich kaufen, eignet sich jedoch eher enttäuschend als Wurfwaffe.'
    diamond_bread_1: 'Ein Laib Brot, bestreut mit zermahlenen Diamanten, jeder Bissen ein befriedigendes Knacken, das den Kiefer bestraft.'
    diamond_powder: 'Der Beweis, dass das Einzige, was in dieser Welt unzerbrechlich ist, das Preisschild daran ist.'
    diving_crude_grips: 'Unten im gefluteten Schacht greifen sie alles mit einer Kraft, die keine lebende Hand aufbringen sollte. Hier oben greifen sie genauso fest nach der eigenen Geduld — drei Tage zum Trocknen, und jede Stunde riecht wie ein Gezeitentümpel mit einer schlechten Woche.'
    diving_visor: 'Gefertigt aus einer Krabbe, die drei Fischer und eine Möwe besiegt hat, bevor sie unterging. Das Visier klappt noch unerwartet zu, was der Schmied als Sicherheitsmerkmal bezeichnet.'
    doomed_axe: 'Der letzte Totengräber behielt diese. Siebenhundert Gräber und noch mehr. Die Arbeit stoppt nicht, also rostet das Werkzeug nicht.'
    doomed_battleaxe: 'Standardausgabe nach dem dritten Aufgebot. Niemand fragt, wohin das zweite verschwand.'
    doomed_club: 'Wenn Reden nicht mehr hilft, ist dies der naechste Satz. Reden hilft hier selten.'
    doomed_fang_daggers: 'Zwillingsklingen der Aschwitwe. Sie erinnern sich noch an den Biss.'
    doomed_grimoire: 'Jeder Eintrag vor der Bestattung protokolliert. Die Ränder füllen sich noch immer.'
    doomed_longsword: 'Jeder Schwung fluestert den Namen von jemandem, den du vergessen hast. Zufall, wahrscheinlich.'
    doomed_mace: 'Geschmiedet aus Versprechen, die niemand hielt. Jeder Schlag ist eine viel zu spaete Entschuldigung.'
    doomed_shortbow: 'Pfeile aus diesem Bogen kommen vor dem Ton an. Ziele beschweren sich selten.'
    doomed_spear: 'Requiriert von einem Lanzenreiter, der keine Beschwerden mehr einreicht.'
    doomed_staff: 'Leitet Wassermagie durch einen Kern aus komprimiertem Grauen. Sehr effizient, moralisch fragwuerdig.'
    doomed_sword: 'Die letzte Kreation des Schmieds vor dem Ruhestand. Der Ruhestand war nicht freiwillig.'
    doomhammer_eternal: 'Der Hammer, mit dem eine Linie Zerschlagener Soldaten Streitigkeiten, Kämpfe und schließlich die eigene Dienstakte beendete. Schwingt noch immer, als wäre der Streit nicht ganz vorbei.'
    draconite: 'Kristallisierte Drachenessenz die Drachen sehr gerne zurueck haetten hoert bitte auf sie abzubauen.'
    draconite_powder: 'Raucht bei Zimmertemperatur leicht. Lagerung erfordert einen feuerfesten Tresor und sehr viel Gelassenheit.'
    draconize_flour: 'Erfordert feuerfeste Handschuhe zum Kneten. Der fertige Laib hat gelegentlich zurueckgeknurrt.'
    dragon_fire_breath: ''
    dragon_frost_breath: ''
    dragon_petal_extract: "Acht Zutaten, ein Fläschchen, keine einzige Erklaerung fuer die Waerme, die das Etikett 'Magie' nennt."
    dragon_pollen: 'Feiner goldener Staub, von den Staubblättern der Drachenlilie geerntet, der jedes je erdachte alchemistische Messgerät leicht in Aufruhr versetzt und eine Wärme abgibt, die Nähe zu Kräften verrät, die man besser ungestört ließe. Allgemein allergen, außerordentlich wertvoll und mit dem zarten, unverkennbaren Duft der Reue behaftet.'
    dragon_void_essence: ''
    dragonite_crust: 'Die Kruste wehrt sich beim Brechen. Axtschmiede betten Splitter fuer selbstschaerfende Kanten ein.'
    dragonlily: 'Eine botanische Unmöglichkeit, gehüllt in schillernde Schuppen und einen übelriechenden Duft verströmend, den man bestenfalls als Kreuzung zwischen Bestattungsinstitut und Schwefelgrube beschreiben kann und den selbst echte Drachen unangenehm genug finden, um ihn zu meiden. Gelehrte sind sich uneins, ob es sich um eine Pflanze handelt, die vorgibt ein Reptil zu sein, oder ein Reptil, das jeden Ehrgeiz aufgegeben hat.'
    drakar: 'Draconic plate that runs warm to the touch. Small dragons find it flattering; large ones find it rude.'
    draugature: 'Ein Band aus gehärtetem Leder, geschmiedet in der unbarmherzigen Kälte der Hügelgräber, geflochten aus den Sehnen der rastlosen Toten, die durch die gefrorene Einöde wandern.'
    draugr_bone: 'Überraschend schwer entzweizubrechen. Die alte Totenstarre, sagen die Gräber, lässt einen Draugr nie wirklich los — und hat offenbar den Teil überlesen, in dem sie nach dem Tod eigentlich enden sollte.'
    draugr_bone_staff: ''
    draugr_daggers: 'Man sagt, der Dorfdepp hat sie geschmiedet. Der Dorfdepp widerspricht und behauptet, er habe Standards.'
    draugr_fractured_amulet: 'Ein rissiger Talisman draugrischer Herkunft, dessen runen Einschübe über altem Knochen gesplittert sind.'
    draugr_helmet: 'Sie zu tragen verleiht weder Autorität noch Respekt, doch sie versteckt eine schwindende Haarlinie vortrefflich.'
    dread_lance: ''
    driftwalkers: 'Hinterlaesst keine Spuren. Vor allem, weil du den Boden nie lang genug beruehrst, um welche zu machen.'
    drowned_amber: 'Harz, das unter Wasser erhärtete und einschloss, was gerade vorbeikam, was man besser nicht bei Kerzenlicht betrachtet.'
    drowned_root_grimoire: 'In Wurzelrinde gebunden, noch feucht von wo auch immer, die Seiten weich vor Fäulnis, doch die Tinte irgendwie unberührt. Man munkelt, das Tiefen-Orakel habe die Ränder beschrieben.'
    drownmarked_casque_matron: 'Aus einer Platte geschnitten, die die Anglertiefen-Matrone abwarf und nicht zurückholte, was entweder Glück ist oder eine Einladung, die niemand angenommen haben will.'
    drownmarked_casque_mire: 'Trägt die blasse Gezeitenlinie, die das tiefe Weald auf allem hinterlässt, was es nimmt und zurückgibt, also mehr Dinge, als das Weald zuzugeben mag, zurückzugeben.'
    drownmarked_chausses_of_rising_tide: 'Auf genau der Höhe markiert, auf die das Wasser stieg in der Nacht, als das Weald die unteren Ebenen nahm, getragen als Mahnung und, mitunter, als Warnung.'
    drownmarked_cordial_of_rising_tide: 'An der Kehre jener Flut gemischt, die das Weald schlicht abstreitet, welche der Brauer nach Gefühl abpasst und zu erklären verweigert.'
    drownmarked_elixir: 'Trägt die blasse Gezeitenlinie all dessen, was das tiefe Weald berührt hat, die das Etikett als Echtheitsmerkmal führt und die Klugen als Zeichen dafür lesen, wo es gewesen ist.'
    drownmarked_kris_of_fen_below: 'Sein Wellenmuster vertieft sich, je länger er in Fennwasser liegt, sodass ein alter eine Wunde schlägt, die keine gerade Klinge zunähen könnte.'
    drownmarked_loop_matron: 'Aus einem Fang gegossen, den die Matrone in etwas ließ, das zu vollenden sie für nicht lohnend hielt, eine Auszeichnung, die der Träger lieber nicht teilte.'
    drownmarked_loop_mire: 'Von Sumpfwasser zu einem Schwarz gefärbt, das Kerzenlicht schluckt, getragen von jenen, deren Hände lieber nicht auffallen.'
    drownmarked_resin: 'Harz, das aus einem Baum troff, den das tiefe Wasser nahm, noch langsam weinend, was die Handwerker als Zeichen deuten, dass er nicht fertig gestorben ist.'
    drownmarked_saber_of_fen_below: 'Aus der Schicht geborgen, die die Führer das Untere Fenn nennen, ein Name, den sie eher zur Warnung als zur Wegweisung aussprechen.'
    drownmarked_saber_of_rising_tide: 'Der Form des Wassers nachgekrümmt, in dem er gehärtet wurde, schneidet er mit der Strömung und sträubt sich gegen jeden, der ihn dagegen führt.'
    drownmarked_tome_of_rising_tide: 'Die Tinte verläuft bei jedem Öffnen unter Wasser ein wenig mehr, was die Gelehrten des tiefen Weald für das Buch halten, das sich selbst überarbeitet.'
    dualpact_circlet: 'An zwei Elemente gebunden, die sich nur auf das Sorgerecht einigen konnten, sonst auf nichts.'
    duke_breastplate: 'Graviert mit einem Wappen zweier Goblins, die um eine Muenze kaempfen. Keiner gewinnt.'
    duke_crossbow: ''
    duke_rapier: 'Einem Goblin-Herzog entwendet, der laut und oft schwor, er benutze es nur, um sich den Rücken zu kratzen. Keine Seele am Hof glaubte ihm, und doch ließ ihn jede weiter davon erzählen.'
    duke_sash: 'Getragen zu jeder Hinrichtung, der er persoenlich fernblieb. Der Schein zaehlt.'
    duke_signet: 'Ein Siegel in Form eines Strichmaennchens mit erhobenem Daumen. Er hat es selbst in Auftrag gegeben.'
    duke_signet_ring: 'Adel, Goblin-Art: verliehen dafuer, wie viele Standesgenossen man persoenlich die Treppe hinuntergestossen hat.'
    duke_sword: 'Gehoerte einst einem Goblin-Herzog, der sehr starke Meinungen ueber Steuern hatte.'
    dungeon_key_goblin_cave: 'Dieser rostige Eisenschlüssel summt von latenter Magie und ermöglicht es seinem Träger, die verborgenen Schutzzauber zu passieren, die den Schatzschatz des Goblin-Königs bewachen.'
    duskfire_rusk: 'Gluetht schwach in der Daemmerung. Gerber weichen Leder darin ein, fuer ein Finish, das niemand so recht erklaeren kann.'
    duskite: 'Ein Mineral das Licht so aggressiv absorbiert dass Bergleute es staendig in ihren eigenen Taschen verlieren.'
    duskite_powder: 'So dunkel, dass echter Schatten im Vergleich sonnendurchflutet wirkt. Kosmetikhändler probierten es genau einmal, so erzählt man sich, und die Kundin wurde nie wieder gesehen, wie sie den Laden bei Tageslicht verließ.'
    earthsea_tassets: 'Halb erdig, halb ozeanisch. Jede Haelfte ist ueberzeugt, die andere sei nur fuer die Show.'
    ectoplasm: 'Durchscheinendes Geisterresidue. Geht durch nicht-verzauberte Behälter hindurch. Lagerung ist ein Abenteuer für sich.'
    ectoplasm_locket: 'Oeffnet sich zu einem Portraet, das kein Lebender je erkannt hat. Manche Toten schon, doch sie schweigen.'
    ectoplasmic_tome: 'Der Einband sickert durchscheinenden Schleim. Der Bibliothekar sagte, es sei ein Feature, kein Fehler.'
    ekusoni: 'An exorcist mask that hums faintly near the recently deceased. Probably nothing.'
    elder_totem: 'Über Jahrzehnte von arthritischen Händen geschnitzt. Strahlt ruhige Weisheit und leichte Missbilligung von allem aus, was du heute getan hast.'
    elder_totem_amulet: 'Geschnitzt aus Kweebec-Altholz von so kleinen Händen, dass die Werkzeugspuren wie Kalligrafie aussehen. Das Totem zeigt ein Wesen, das die Kweebec weder benennen, beschreiben noch dessen Existenz anerkennen. Sie verlangen allerdings stattlich für sein Abbild.'
    elder_totem_talisman: 'Geschnitzt aus einem Totem, das die Himmelsmatrone laenger bewachte, als Pandora einen Namen traegt.'
    elemental_catalyst_air: ''
    elemental_catalyst_earth: ''
    elemental_catalyst_fire: ''
    elemental_catalyst_water: ''
    elixir_of_agility: 'Fluessige Reflexe, Katzenklasse. Urteilsvermoegen nicht inbegriffen, und das zeigt sich fast sofort.'
    elixir_of_chance: 'Destillierte Wahrscheinlichkeit. Verbessert deinen Charakterbogen. Dein tatsaechliches Glueck bleibt, tragischerweise, unveraendert.'
    elixir_of_intelligence: 'Schaerft den Verstand fuer eine Stunde und das Ego fuer erheblich laenger.'
    elixir_of_strength: 'Lasst dich vorubergehend zuschlagen wie jemand doppelt so gross. Nebenwirkungen: Ubermut und unwillkurliches Muskeln-Zeigen.'
    elixir_of_vitality: 'Standardausgabe vor einem Vorstoß. Sie fragt nicht, ob man bereit ist.'
    embalmed_ancestral_club: 'Was nach den Einbalsamierungsriten übrig blieb. Schwerer, als es sein sollte.'
    embalmed_bow: 'Konserviert in Begräbnisspitzen. Aus dem Arsenal eines Leichenwahrers gezogen. Die Sehne war nie für die Lebenden bestimmt; sie hält trotzdem.'
    embalmed_club: 'Jeder Schlag weckt etwas, das aus sehr gutem Grund geschlafen hat.'
    embalmed_cuirass: 'Gefüttert mit Einbalsamierungsseide aus den Lagern der Totengräber. Behält seine Form, wenn alles andere längst nachgegeben hat.'
    embalmed_grips: 'In dieselbe Seide gewickelt wie die Toten. Der Griff lockert sich selbst danach nicht.'
    embalmed_legguards: 'Deine Beine sind einbalsamiert und irgendwie extrem gut accessoirisiert.'
    embalmed_locket: 'Enthält ein auf Grabseide gemaltes Porträt. Das Gesicht darin ist seit der Sitzung nicht gealtert.'
    embalmed_silk: 'Bandagen, einem Frostschlurfer abgenommen, frisch gehalten durch Jahrhunderte der Kälte statt durch die Kunst eines Einbalsamierers. Ergeben feine Verbände, sofern man beschlossen hat, nicht zu fragen, wo sie schon waren.'
    embalmed_silk_ring: 'Ein Ring, gewebt aus einbalsamierter Seide. Die Toten haben einen überraschend festen Händedruck, wenn sie ihn tragen.'
    ember_core: 'Eine kleine Sonne in Mineral gefangen. Brennt durch Beutel. Erfahrene Abenteurer tragen diese in Tontöpfen.'
    ember_core_scepter: 'Eine in Eisen gefasste Glut, tröstlich, bis man bemerkt, dass die Hitze nie aufgehört hat zu steigen. Die alten Schmiede haben einen Ausdruck für dieses Gefühl. Er lässt sich nicht freundlich übersetzen.'
    ember_reduction: 'Ausgelassenes Fett der Refektoriumsbraten. Braten, Abdichten, Hunde bestechen — ein Topf für alles.'
    ember_scripture: 'In einer Schrift getuscht, die nur unter Hitze erscheint. Es zu lesen verlangt einen Herd und die Geduld eines Heiligen.'
    ember_shortbow: 'Von ihm gelöste Pfeile glühen den ganzen Weg bis zum Ziel, was der Pfeilmacher schön nennt und der Schütze das Ende jeder Überraschung, für immer.'
    ember_silk: 'Faden, gesponnen aus Kokons, die ewig glimmen, warm bei Berührung und gefährlich für die unvorsichtige Hand.'
    ember_silkblade: 'Geschmiedet aus entzündeten Seidenfasern, gehärtet zu einer brennenden Klinge, die sich weigert abzukühlen. Flexibel genug, um sie zu verknoten – vorausgesetzt, deine Finger sind gegen drittgradige Verbrennungen immun.'
    ember_studded_belt: 'Das Magmooligan stand in Flammen, als die Wolle geschoren wurde. Der Scherer kurz darauf ebenfalls. Der Gürtel bewahrt eine gemütliche Wärme und ein leises Gefühl gegenseitigen Bedauerns.'
    ember_walkers: 'Die Sohlen kuehlen nie ab — ein Wunder der Verzauberung oder ein ernstes Konstruktionsproblem.'
    emberchant_breastplate_of_last_verse: 'Mit einem einzigen sauberen Ruck vom Altartisch gezogen. Die Leuchter haben nichts bemerkt.'
    emberchant_breastplate_of_twelve_voices: 'Acht Lagen Füllwatte zwischen Ihnen und der Welt. Die Welt versteht den Wink.'
    emberchant_composite: 'Beim Singen geschichtet, weil die alten Schmiede schworen, es setze die Maserung. Es tut es. Keiner weiß warum.'
    emberchant_core: 'Eine Kohle, die schlicht nicht ausgeht. Schmieden lieben sie; wer sie in die Tasche steckt, lernt schnell aufzuhören.'
    emberchant_extract: 'Was nach dem Kochen übrig bleibt. Der Koch nennt es Brühe; der Alchemist nennt es Lösungsmittel; der Abfluss nennt es Kollege.'
    emberchant_hand_axe_of_twelve_voices: 'Klein genug zum Werfen, gemein genug zum Behalten. Die Wahl verfolgt jeden Kampf.'
    emberchant_legguards_of_last_verse: 'Winterwolle in einem Gebäude, das ein Drache heizt. Großmutter akzeptiert keine Gegenargumente.'
    emberchant_tonic_of_last_verse: 'Honig, Kräuter und ein Hauch Asche. Löst sich langsam genug auf, um die Predigt zu überdauern.'
    emberchant_treads_of_last_verse: 'Dick genug gestrickt, um um Mitternacht über die kalten Steinplatten zu gehen, ohne die Gruft zu wecken.'
    emberchant_waraxe_of_twelve_voices: 'Der Chor hat zwölf Stimmen. Diese schlichtet Streit mit allen zwölf auf einmal.'
    emberglow_staff: 'Der Glutkern an seiner Spitze stirbt nie ganz. Die Verbrennungen an den Fingerspitzen des Trägers auch nicht.'
    embermaw_gauntlets: 'Restwärme von Zinderherzfragmenten macht diese Handschuhe unangenehm warm. Wie ein Händedruck von einem Fieberkranken.'
    emberwalk_striders: 'Lassen dich unbekümmert über ein Bett aus Glut gehen. Der Rückweg ist ein Extraposten.'
    emberweave_hauberk: 'Gewebt aus Fasern, die sich noch ans Brennen erinnern und dich es auch nicht vergessen lassen.'
    empyrean_charm_of_broken_diadem: 'Es erfüllt seine erklärte Funktion mit sichtbarem Widerwillen, und der Unterschied wurde irgendwann unwichtig.'
    empyrean_elixir: 'Die Dosierungsanleitung widerspricht sich auf halbem Weg des Etiketts, und bisher hat noch niemand eine Rückerstattung verlangt.'
    empyrean_sash_of_falling_crown: 'Sein Zweck wurde erst nach der Fertigstellung überdacht, und der Schöpfer steht größtenteils dazu.'
    enchanting_dust: 'Pulverisierter magischer Ruckstand den Juweliere auf Zubehor streuen damit es unheilvoll leuchtet.'
    enka_muru: 'A traveller’s cloak stitched for long roads and short conversations.'
    enriched_dough: 'Teig so mineralisiert dass er praktisch als geologische Probe gilt. Handwerker schwoeren darauf.'
    ensable_crystal: 'Gehoert in eine Vitrine, laut jedem Museum, das sich je geweigert hat, dafuer zu bezahlen.'
    ensable_key: 'Falsch eingesetzt, fuellt sich das Schloss mit Obsidian. Das Glueck bevorzugt die Vorsichtigen.'
    ensable_pincers: 'Etwas dort unten will das so dringend zurueck, dass es immer noch danach sucht.'
    etched_signet: 'Traegt ein graviertes Wappen das ein Wolf eine Katze oder abstrakte Kunst sein koennte. Der Juwelier war sich auch unsicher.'
    eternal_biscuit: ''
    eternal_eclipse_blade: 'Existiert in dauerhaftem Schatten, unabhängig von der Lichtquelle, genau wie der Leeremotten-Flügel, aus dem sie geschnitten wurde. Astronomen haben Meinungen dazu. Die Klinge hat nie danach gefragt.'
    eternal_wisdom_chain: 'Trägt einen Schlüssel für jede Kiste, die je über diesen Posten ging.'
    eternwool_band: 'Aus derselben Charge wie hundert andere gegossen. Dieser kam zurück.'
    ethereal_ukranize: 'Es wurde dort gefunden, wo es laut Aufzeichnungen nicht sein sollte, also listet das Register beide einfach nebeneinander auf.'
    evenhand: 'Ausbalanciert auf einen Bruchteil, den der Schmied nicht preisgibt. Jeder Träger schwört, sie bevorzuge ihn persönlich. Tut sie nicht.'
    executioners_verdict: 'Klingt beim Abschwung wie der Hammer eines Kriegsgerichts, gefällt von dem Zerschlagenen Soldaten, der in diesem Jahrhundert den kürzeren zog. Das Urteil ist immer dasselbe. Papierkram ist nicht erforderlich.'
    faded_spellbook: 'Die Haelfte fehlt der Rest ist verschmiert. Enthaelt einen lesbaren Spruch: eine Einkaufsliste von vor 200 Jahren.'
    fangs_of_the_abyss: 'Aus etwas herausgezogen, das am Grund der Leere hätte schlafen sollen. Die Griffe zucken manchmal noch.'
    farpoint: 'Auf ein Ziel gerichtet, das der Träger kaum noch sehen kann. Bis sie trifft, stimmt das schon nicht mehr.'
    farshot: 'Auf eine Reichweite gespannt, die kein vernünftiger Bogenschütze an der Narbe braucht, wo alles Schießenswerte ohnehin schon riechbar nah ist.'
    farwalker: 'Gebaut für eine Distanz, die an der Mauer eigentlich niemand braucht. Jemand hat sie offenbar trotzdem gebraucht.'
    faultline_extract: 'Aus einem lebenden Riss gezogen. Man trägt Handschuhe; der Riss schert sich nicht darum.'
    faultline_grips_of_split_sky: 'Geformt am Vorderbein eines Riftlings, an dem Tag, als der Himmel über der Verwerfung endlich aufgab, fest zu wirken. Die Griffkraft verdreifacht sich. Die Tiefenwahrnehmung übersteht den Tausch nicht.'
    faultline_hand_axe_of_torn_ground: 'Als Schürfwerkzeug verkauft. Ausschließlich für das andere benutzt.'
    faultline_poultice_of_split_sky: 'In die Nähte eines häutenden Riftlings gepackt, damit sich die neue Schale nicht schief setzt. Wirkt bei Menschen ungefähr genauso: ungleichmäßig, aber es wirkt.'
    faultline_quartz: 'Wuchs entlang eines Bruchs, also makellos überall außer auf der einen Linie, die zählt.'
    faultline_torc_of_split_sky: 'Ein Torwächter trug dies, während er einen Himmel anstarrte, der technisch aufgehört hatte, ein einziger Himmel zu sein. Spiegelt den Horizont zweimal entlang der Naht. Die zweite Spiegelung blickt angeblich zurück.'
    faultline_torc_of_torn_ground: 'Erdet dich, wörtlich, an eine Welt, deren Boden ein Dauerwitz ist. Gemischte Ergebnisse.'
    faultline_treads_of_torn_ground: 'Besohlt mit den abgestreiften Fußplatten eines Riftlings, die gebrochenen Boden mit demselben Instinkt greifen wie einst das lebende Glied. Eine Sohle findet immer Halt. Die andere streitet noch darüber.'
    faultline_visor_of_split_sky: 'Hier hat der Horizont eine Naht. Ihn nach Glück anzustarren ist optional und unklug.'
    faultline_warbelt_of_split_sky: 'Breit genug für ein kleines Arsenal. Der Träger hängt eins dran und bereut das Gewicht.'
    featherfall_daggers: 'Niemand erinnert sich, diesem Ergebnis zugestimmt zu haben, und das Komitee kam nie wieder zusammen, um es zu überdenken.'
    feathergilt_ingot: 'Seine Einordnung wird seit seinem Fund angezweifelt, also wird Käufern geraten, selbst zu urteilen.'
    feathergilt_visor_of_silent_court_crown: 'Es funktioniert nur unter schriftlichem Protest, also wurde die Uneinigkeit stillschweigend in den Entwurf aufgenommen.'
    feathergilt_visor_of_silent_court_godbone: 'Es erledigt seine Aufgabe und entschuldigt sich anschließend dafür, also wurde die ursprüngliche Beschwerde nie förmlich zurückgezogen.'
    feathergilt_waraxe_of_silent_court: 'Sein Schöpfer weigerte sich, mehr zu erklären, und der Träger hat gelernt, mit der Ungewissheit zu leben.'
    fen_amulet: 'Moorgeboren und moorduftig. Passt gut zu sozialer Isolation.'
    fen_gland: 'Zieht Beute an. Vertreibt buchstaeblich alle anderen, einschliesslich der eigenen Art, auf Distanz.'
    fen_impaler: 'Aus einem Sumpf gezogen, der einen foermlichen, triefnassen Einspruch einlegte.'
    fen_mace: 'Gesegnet von etwas, das im tiefsten Teil des Sumpfes lebt. Du willst es nicht treffen.'
    fen_moss_clump: 'Giftiges Sumpfmoos das auf Sumpfkreaturen gedeiht. Kräuterkundler verwenden es in Gegengiften. Die Ironie entgeht ihnen nicht.'
    fen_moss_mallet: 'Ein Schlegel, bedeckt von lebendigem Sumpfmoos, das sich über Nacht regeneriert. Schlagen Sie hart genug, und das Moos seufzt.'
    fen_reaper_axe: 'Erntet Schilf und Knochen mit derselben Geduld. Dem Moor geht keines von beidem je aus.'
    fen_reed: 'Eisenhartes Schilf, das nur wächst, wo das Fenn am tiefsten ist, geerntet von jenen, die bereit sind, einen Arm hineinzustrecken und darauf zu vertrauen, dass er zurückkommt.'
    fen_trident: 'Drei Zinken beschichtet mit Sumpfschlamm. Der Geruch allein haelt die meisten Feinde fern. Verbuendete leider auch.'
    fenrot_composite: 'Material, bis genau zum richtigen Grad verrotten gelassen, ein Zeitfenster, das die Meister eifersüchtig hüten und die Lehrlinge regelmäßig verderben.'
    fenrot_draught: 'Gärt mit jedem Tag, an dem er nicht getrunken wird, ein wenig mehr, bis er irgendwann aufhört, Medizin zu sein, und anfängt, eine Entscheidung zu sein.'
    fenrot_draught_of_moonlit_mire: 'Nach einem Mond benannt, der so tief nie hinreicht, was der Brauer poetisch findet und der Trinkende, zu Recht, als Warnung.'
    fenrot_gauntlets: 'Die Fäulnis hat die Feinmotorik vor Jahren aufgefressen. Was bleibt, ist ein Griff, der wirklich noch nie losgelassen hat — absichtlich oder nicht.'
    fenrot_girdle_of_moonlit_mire: 'Von Sumpfwasser in eine Farbe gefärbt, die sich nur bei Mondlicht als etwas lesen lässt, das so tief nie hinreicht, sodass sie mit Absicht ein Rätsel bleibt.'
    fenrot_girdle_of_quiet_drowning: 'Faulig genug geworden, um sich im Dunkeln einhändig zu schnüren, eine kleine Gnade, die das Fenn gewährt und sofort büßen lässt.'
    fenrot_greatblade: 'Lange genug im Fenn gelassen, um Narben und Grübchen zu tragen, was der Schmied zu Charakter umdeutete und entsprechend höher ansetzte.'
    fenrot_greaves: 'Weich vor Fäulnis auf eine Weise, die sich als leises Gehen erweist, die einzige Währung, die das Fenn achtet.'
    fenrot_helm_of_moonlit_mire: 'Das Leder ist vor Fäulnis weich geworden und geblieben, was einen Schlag besser abfedert als alles, was die Trockenlandbewohner verkaufen.'
    fenrot_helm_of_quiet_drowning: 'Eng genug versiegelt, um das Fenn draußen zu halten, und, wie manche Träger beunruhigt bemerken, eng genug, einen angehaltenen Atem drinnen zu halten.'
    fenrot_ration: 'Feldmedizin, in Fennblatt gewickelt, das sie frisch hält und ihr einen Geschmack verleiht, den nie jemand gut nannte, nur wirksam.'
    feran_gauntlets: 'Waechst innerhalb einer Woche nach. Die Ferans, unbeeindruckt, bereuen schon jetzt nichts.'
    feran_hide_belt: 'Gegerbtes Feran-Leder, geschmeidig und dunkel wie eine mondlose Küste. Der Feran war ein Einzelgänger der Wattflächen, und der Gürtel trägt sein Temperament — er knarrt gereizt bei Nässe und weigert sich kategorisch, zu irgendetwas Modischem zu passen.'
    feran_hunting_charm: 'Ein Knochentotem vom Gürtel eines Feran. Riecht nach Beuteblut und Hinterhalt. Ranger zahlen das Doppelte. Keine Fragen.'
    feran_pelt: 'Geflecktes Katzenfell, unglaublich geschmeidig. Lederarbeiter werden bei der Qualität wehmütig. Der Feran war weniger emotional.'
    feran_stalker_gloves: 'Das Fell stellt sich auf, wenn Beute naht — aber auch bei Gewittern, nahe Lagerfeuern und just in der Sekunde, da der Träger lügt. Ein Jagdhandschuh und ein Gewissen, in ein einziges Fell genäht, ob man den zweiten Teil bestellt hat oder nicht.'
    fingerbind: 'Passt auf jeden Finger, an dem es bisher ausprobiert wurde, was der Schmied, der es fertigte, nie beruhigend fand.'
    fire_spellbook: ''
    firesteel_grimoire: ''
    firstlight_carapace_of_closing_age: 'Mit dem blassen Metall beplattet, das sich nur dort bildet, wo die erste Dämmerung noch hinreicht. Diese Fläche wird jedes Jahr kleiner, und die Schmiede haben es bemerkt.'
    firstlight_extract: 'In der genauen Minute des ersten Lichts destilliert, was den Alchemisten einen Versuch pro Tag lässt und bis Mittag ein sehr kurzes Gemüt.'
    firstlight_halberd_of_world_wound: 'Lang genug, um den Rand der Wunde auf genau der Distanz zu halten, die die Wandscherben für überlebbar halten. Das Maß ist präzise und nicht verhandelbar.'
    firstlight_locket_of_world_wound: 'Birgt eine Prise der ersten Dämmerung, versiegelt, bevor sie verblassen konnte. Ist sie nicht. Dem Träger wird geraten, es nicht zu öffnen, um den Grund zu erfahren.'
    firstlight_warboots_of_world_wound: 'Geschnürt, um einen Pilger durch die eine Stunde zu tragen, in der die Wunde still bleibt. Verpass das Zeitfenster, und die Stiefel sind die geringste Sorge.'
    fish_scale: 'Regenbogenschimmernde Schuppe eines Hechts. Juweliere polieren sie zu billigen Anhängern. Der Fisch hatte kein Mitspracherecht.'
    flame_crystal_staff: 'Gekroent von einer Glut, die nicht sterben will, ganz wie der Magier, der ihn traegt.'
    flare_band: 'In der Hand mild. Ein echtes Risiko, sobald du tatsaechlich etwas wirkst.'
    flooded_nave_key: 'Klebrig von Schiffswasser, das nie ganz trocknet. Der Ertrunkene Prior führt dort unten noch immer eine Gemeinde; niemand hat erklärt, wem er noch predigt.'
    flying_fish_wing: 'Eine durchscheinende Flosse, die aus Gewohnheit noch immer versucht, Wind zu fangen.'
    footnote: 'Zitiert eine Quelle, die nicht mehr existiert, für eine Behauptung, die auch niemand widerlegen konnte.'
    fortress_legguards: 'Deine Beine werden zur Festung. Deine Beweglichkeit wird zur Erinnerung.'
    fracture_cordial_of_long_collapse: 'Fermentiert in einem Riftling-Nest, in einer Schale, die sich nie ganz schloss. Es heilt langsam und verlangt nichts dafür, was nach allem anderen in dieser Welt fast verdächtig ist.'
    fracture_hauberk_rift: 'Aus zerbrochenen Klingen geschichtet. Jede brach bei der Arbeit; du beendest ihre.'
    fracture_hauberk_void: 'Kettenhemd, zugeschnitten auf den Körperbau eines Riftlings vor der Häutung, jeder Ring absichtlich leicht falsch gegossen. Es hält zusammen, wie der Riftling es tat: kaum, und nur unter Spannung.'
    fracture_ingot: 'Mit einem Haarriss in der Mitte gegossen, als „Charakter“ verkauft. Es hält. Meistens.'
    fracture_loop_rift: 'Im Ring ist ein Riss, den du kaum siehst. Du wirst garantiert ständig daran denken.'
    fracture_loop_void: 'Mit einem Stein besetzt, der keiner ist. Direkt in die leere Fassung zu sehen empfiehlt sich kein zweites Mal.'
    fracture_resin: 'Härtet schneller, als du dich lösen kannst. Frag jeden Lehrling, bei seinem Spitznamen.'
    fracture_sash: 'An beiden Enden ausgefranst, wie die Haut eines Riftlings an einer Häutungslinie ausfranst, und ebenso stur formfest. Sie zu ersetzen fühlt sich irgendwie wie Verrat an.'
    fracture_scepter_of_long_collapse: 'Gewinnt Kämpfe weniger, als dass es sie aufschiebt, eine bröckelnde Wand nach der anderen, mit derselben Geduld, mit der ein Riftling einen einstürzenden Tunnel übersteht. Langsame Magie. Verlässliche Magie.'
    frost_grimoire: 'Seine Seiten bleiben feucht, egal wie viele Feuer man daneben entzündet. Es zu lesen fühlt sich an wie Ertrinken im Wissen — eine Empfindung, die der Autor, wer auch immer das war, offenbar lehrreich fand.'
    frost_recurve: 'Ein Reflexbogen durchdrungen von glazialer Essenz. Die Pfeile frieren im Flug. Die Finger des Schuetzen auch.'
    frost_sabre: 'Eine gekrümmte Klinge, die Reif hinter sich herzieht. Jeder Hieb beendet eine Beziehung.'
    frost_shard: 'Dauerhaft gefrorener Kristall, der jeder Umgebung Wärme entzieht. Bleibt kalt, damit du es nicht musst.'
    frost_shard_spear: 'Ein Frostsplitter auf Thorium montiert. Er taut nie, was das Halten zu einer charakterbildenden Erfahrung macht.'
    frost_shard_sword: ''
    frost_titan_cudgel: 'Womit ein Frosttitan sich die Zähne stochert. Was dich mit einem Schlag plättet.'
    frost_totemic_club: 'Gekrönt mit einem gefrorenen totemischen Abbild. Sein Gesichtsausdruck ändert sich mit dem Wetter. Und deinem Glück.'
    frostbound_band: 'Zeigt die Stunde lautlos an. Jemand zieht ihn noch auf, aus Gewohnheit.'
    frostclaw_warhelm: 'Aus Titanklauen-Chitin geschmiedet und in Gletscherschmelzwasser gehärtet. Die Kälte hat ihn nie gestört. Sie werden jedoch zittern.'
    frostfang_bow: 'Einmal abgeschossen, und jeder Wolf im Umkreis antwortet.'
    frostfang_requiem: 'Halb Schwert, halb Trauergesang. Rate mal, welche Hälfte du zuerst hörst.'
    frostfur_hatchet: ''
    frostfur_tuft: 'Weißes Fell eines Frostwolfs, dauerhaft kalt beim Anfassen. Nützlich für Mäntel. Unhöflich gegenüber dem Wolf.'
    frosthewn_axe: 'Aus einem Gletscher gehauen, mit Adamantit geschärft. Wird jedes Mal kalt serviert.'
    frosthowl_stilettos: 'Dolche die in der Kaelte pfeifen. Das Geraeusch ist zutiefst beunruhigend fuer Feinde und Verbuendete. Vor allem Verbuendete.'
    frostkoa_cleaver: 'In Eisfrosch-Galle geschmiedet, schwitzt die Klinge einen kalten Schweiß, der sich weigert, selbst hier unten zu gefrieren. Sie bittet nie um Mitgefühl. Sie bekommt trotzdem welches.'
    frostkoa_eye_pendant: 'Das Auge blinzelt nach eigenem Zeitplan. Du hast beschlossen, nicht daran zu denken.'
    frostkoa_staff: 'Aus einem Rueckgrat geschnitten, das ein letztes, sehr entschlossenes Quaken von sich gab.'
    frostmaw_scale: 'Von der ältesten Häutung der Aschwitwe abgestreift. An den Rändern noch schwach warm.'
    frostshamble_girdle: 'Haelt deine Hose oben und etwas erheblich weniger Lebendiges hinter dir am Schlurfen.'
    frostshamble_helm: 'Fluestert die ganze Nacht. Meist Kritiken. Keine davon positiv.'
    frostshamble_longsword: ''
    frostshamble_pendant: 'Murmelt, sobald die Sonne untergeht. Verraet erst viel zu spaet, was es eigentlich will.'
    frostshamble_treads: 'Hinterlaesst Fussspuren, die noch ein paar Schritte weiterschlurfen, nachdem du stehen geblieben bist.'
    frostshell_aegis: 'Schichten aus gefrorenem Krabbenpanzer über Thoriumplatten. Meeresbiologie, bewaffnet.'
    frostshell_grimoire: 'Gebunden in gefrorenem Krabbenpanzer. Es stellt sich vor, bevor es Frostbeulen vorstellt.'
    frostshell_pendant: 'Ein polierter Frostschalen-Splitter an einer Thoriumkette. Er strahlt Kälte und milde existenzielle Angst aus.'
    frostshell_plate: 'Gefrorene Krabbenrüstung, die nie auftaut. Schmiede bearbeiten sie in Schmieden unter null Grad, die ganze Zeit meckernd.'
    frostshell_signet: 'Gefertigt aus einem Panzerfragment einer Frostklaue. Die Krabbe hat das Spendenformular nicht unterschrieben.'
    frostward_mace: ''
    frostweaver_wraps: 'Gewoben aus Yeti-Fell und verstärkt mit Splittern eines glazialen Herzens. Der Yeti möchte sie zurück.'
    frostwolf_fang_ring: 'Beisst zurueck, wenn du ihn abzustreifen versuchst. Das Rudel vergisst keine Beleidigungen.'
    frostwolf_hauberk: 'Du wirst nie wieder frieren. Du wirst auch nie wieder in den Sueden eingeladen.'
    frostwolf_leggings: 'Weich wie ein Bau. Gepanzert wie eine Belagerung. Das Rudel enthaelt Vielfalt.'
    frostwolf_mitts: 'Deine Haende bleiben warm. Jeder, dem du die Hand schuettelst, wird daran erinnert, wer das Sagen hat.'
    frostwolf_paws: 'Krallt sich ins Eis, als haette es persoenlich deine Familie beleidigt. Es ist kompliziert.'
    frostwolf_staff: ''
    frozen_striders: 'Eisbehandeltes Leder, das das Stillstehen endlich aufgibt. Endlich Bewegung.'
    fungal_flatbread: 'Ein duennes Brot mit Elfenbeinorchideenpaste. Schneider weichen es ein um Stoffe zu impraegnieren.'
    galerunner_crown: 'Aerodynamisch genug, um eine halbe Sekunde von deiner Rückzugszeit abzuschneiden.'
    gecko_chopper: 'Gefuehrt, so die Legende, vom groessten Geckokoenig, den Pandora nie hatte.'
    gecko_saber: ''
    gecko_scale_leggings: 'Der Geckoschwanz wuchs binnen einer Woche nach. Ihr Ruf braucht vermutlich deutlich laenger.'
    gecko_tail_segment: 'Freiwillig vom Gecko abgeworfen. Es wackelt noch. Du kannst es für Alchemie verwenden oder tanzen lassen. Deine Wahl.'
    gecko_venom_lance: 'Die Wunde ist der leichte Teil, in einem Moment vorbei. Was das Geckogift hinterlässt, braucht erheblich länger, um einem das Erscheinen zu verzeihen.'
    gecko_venom_sac: 'Klein aber wirksam. Das Gift ist nicht tödlich für Menschen, aber es wird deine ganze Woche ruinieren. Apotheker lieben sie.'
    genesis_blade: 'Geschmiedet, so behaupten die Pilger, die den Aufstieg noch wagen, aus dem, wie die Welt vor ihrem Bruch aussah. Niemand ist in der Lage, das zu bestätigen.'
    genesis_greataxe_of_origin_line: 'Schwer genug, dass der erste Hieb die meisten Streitigkeiten beilegt und der zweite vor allem fürs Protokoll ist. Einen dritten gibt es selten.'
    genesis_hauberk: 'Aus Draht geflochten, gezogen, bevor jemand daran dachte, das Wie festzuhalten. Die Technik starb mit ihrem Schmied; das Panzerhemd hat den Verlust bislang überdauert.'
    genesis_loop: 'Aus der ersten Legierung gegossen, zu der die Welt je erkaltete, wenn man den Prüfern glauben darf — und das tut man meist, wenn sie sich einig sind, was selten ist.'
    genesis_mail: 'Aus einem Metall geflochten, von dem die Pilger schwören, es sei älter als der Bruch, auch wenn die Schmiede, die es genau wüssten, nicht überlebt haben, um es zu bestätigen.'
    genesis_moss: 'Moos, das nur dort wächst, wo das erste Licht noch hinfällt, und in dem Moment stirbt, in dem es beschattet wird. Sammler arbeiten flink und entschuldigen sich bei niemandem im Besonderen.'
    genesis_suize: 'Der Ursprungsstamm des Suize, älter als der Anbau selbst. Er wird jene wohl überdauern, die ihn zu kultivieren versuchen.'
    ghost_cap: 'Ein durchscheinender Pilz, der im Dunkeln schwach leuchtet, als würde er Sie dafür verspotten, dass Sie stundenlang bei Tageslicht nach ihm gesucht haben.'
    ghost_wafer: 'Von einem erloschenen Grabirrlicht abgekratzt. Bogner verarbeiten ihn zu Sehnenharz.'
    ghostcap_alloy: 'Metall, mit Geisterkappen-Sporen versetzt, die es schwach glühen lassen, angenehm zu bearbeiten und auf einer dunklen Werkbank nicht zu verlieren.'
    ghostcap_almanac_of_deep_canopy: 'Seine Seiten sind gepresste Geisterkappe, nur in der Finsternis lesbar, in der sie leuchten, was das tiefe Weald zum einzigen Ort macht, ihn wirklich zu lesen.'
    ghostcap_carapace_of_drowned_weald: 'Mit Geisterkappen-Pilzen besetzt, die weiterleuchten, wenn der Träger sich nicht mehr rührt, eine schlechte Eigenschaft in einem Versteck und eine schlimmere in einem Sarg.'
    ghostcap_falchion_of_drowned_weald: 'Seine Klinge ist von Geisterkappen-Sporen durchzogen, die entlang jedes Schnitts leuchten, sodass die Wunde aufleuchtet, bevor der Schmerz kommt.'
    ghostcap_fists_of_deep_canopy_matron: 'Mit einer selteneren Kappe besetzt, die nur in echter Finsternis leuchtet, was unter dem tiefen Blätterdach immer ist, sodass sie nie erlöschen.'
    ghostcap_fists_of_deep_canopy_mire: 'Die Pilzkappen an den Knöcheln leuchten heller, je härter man zuschlägt, und machen aus einer Prügelei eine ungewollte Lichtschau.'
    ghostcap_flail_of_drowned_weald: 'Sein Kopf ist eine gehärtete Geisterkappe, die beim Ausholen aufleuchtet und dem Ziel genau sagt, wann es zusammenzucken soll, ohne es je ganz zuzulassen.'
    ghostcap_philter_of_drowned_weald: 'Leuchtet nach dem Trinken eine Stunde schwach, lang genug, um aus der Finsternis zu finden, und gerade lang genug, dass etwas dich findet.'
    ghostcap_warboots_of_drowned_weald_matron: 'Mit leuchtenden Kappen besohlt, die den Träger im Dunkeln verraten, was der Macher für einen fairen Tausch dafür hielt, sich nie zu verirren.'
    ghostcap_warboots_of_drowned_weald_mire: 'Gegen Wasser abgedichtet, das nie ganz aus ihnen abläuft, sodass jeder Schritt mit einem kleinen, privaten Schmatzen aufsetzt, das nur der Träger hört.'
    gilded_brew_of_last_regent: 'Das Rezept wurde mehr diskutiert als tatsächlich gebraut, was der Brauer als beabsichtigt bezeichnet.'
    gilded_carapace_of_hollow_throne: 'Es funktioniert nach dem Ehrensystem, was niemand bestätigen kann, ohne den Streit neu zu entfachen.'
    gilded_chopper_of_hollow_throne: 'Es erledigt seine Aufgabe und entschuldigt sich anschließend dafür, daher wurde das Handbuch absichtlich vage gehalten.'
    gilded_circle_of_last_regent: 'Seine Zuverlässigkeit ist Gegenstand anhaltender Debatten, daher wurde das Handbuch absichtlich vage gehalten.'
    gilded_extract: 'Es wurde mit knapper Mehrheit für echt erklärt, und die zweite Erklärung wurde nie ganz ausgeschlossen.'
    gilded_locket_of_last_regent: 'Es funktioniert nur unter schriftlichem Protest, ein Detail, das alle Beteiligten zu vergessen beschlossen haben.'
    gilded_philter_of_hollow_throne: 'Das Rezept wurde mehr diskutiert als tatsächlich gebraut, was das Etikett im Kleingedruckten offenlegt.'
    gilded_stilettos_of_last_regent: 'Es wurde trotz einhelligen Zögerns fertiggestellt, ein Kompromiss, den niemand wirklich verteidigen will.'
    gilded_tassets_of_hollow_throne: 'Seine Entstehungsgeschichte ändert sich je nach Erzähler, und der Unterschied wurde irgendwann unwichtig.'
    gildsteel: 'Es wurde dort gefunden, wo es laut Aufzeichnungen nicht sein sollte, also bleiben beide Einträge unversöhnt in den Akten.'
    girthstone: 'Von einem Schneider bemessen, der die Ambitionen des Trägers maß statt seiner Taille. Beide erwiesen sich als größer als erwartet.'
    glacial_basinet: 'Ein Helm so kalt, dass er von innen beschlägt. Sicht optional, Überleben Pflicht.'
    glacial_brand: 'Ein Langschwert in Gletscherschmelzwasser gehaertet. Die Klinge vereist zwischen Schlaegen, sieht dramatisch aus und loest nichts.'
    glacial_buckle: 'Die Schnalle ist ein Frostsplitter, der nie schmilzt. Praktisch. Gelegentlich tragend.'
    glacial_cinch: 'Ein Gürtel, geschmiedet aus glazialer Herzlegierung. Er zieht sich fest und lockert sich nie, ganz wie eine Unterkühlung.'
    glacial_fortress_greaves: 'Sich darin zu bewegen ist ein volles Training. Stillstehen auch.'
    glacial_grasp: 'Alles, was du berührst, gefriert leicht. Einschließlich deiner Waffe, deiner Verbündeten und deines Mittagessens.'
    glacial_grips: 'Leichte Handschuhe für Bogenschützen und Zauberwirker des hohen Nordens geschmiedet. Die Handfläche ist mit einer transluzenten Membran ausgekleidet, die das taktile Gefühl verbessert und gleichzeitig vor Kälte isoliert. Die Hände bleiben selbst bei tödlichen Temperaturen präzise. Die Membran leuchtet nachts leicht phosphoreszierend — manche finden das nützlich, andere beunruhigend.'
    glacial_heart: 'Der gefrorene Kern einer Yeti-Brust, mit genug Kälte, um einen See zu gefrieren. Hat er schon.'
    glacial_loop: 'Ein Ring aus gefrorenem Kristall, der sich regeneriert, wenn er absplittert. Die Garantie ist buchstäblich unbegrenzt.'
    glacial_march_boots: 'Für den ewigen Marsch durch die Eiswüste gebaut. Oder den Arbeitsweg. Gleiche Energie.'
    glacial_medallion: 'Ein Medaillon aus reinem Frostkristall. Es hört nie auf, kalt zu sein. Ganz wie dein Ex.'
    glacial_morningstar: ''
    glacial_pike: 'Mit glazialer Kristallspitze. Hält Feinde auf Abstand, den sie sich nicht ausgesucht haben.'
    glacial_recurve: 'Bespannt mit gefrorenen Sehnen, die sich nie lockern — anders als dein Griff beim Abschuss.'
    glacial_signet: 'Aus dem Herzkristall eines Gletschers geschnitten. Er betäubt den Finger, den er ziert, was der Macher als Vorzug beschwört.'
    glacial_verdict: 'Die Klinge fällt ihr eigenes Urteil bei jedem Kampf: schuldig, zu nah gestanden zu haben.'
    glacial_visor: 'Das Visier beschlägt bei warmem Wetter. Der Vorbesitzer löste das, indem er nie an warme Orte ging.'
    glacial_waistguard: 'Gefüllt mit aschgegerbtem Leder. Hält eine Linie besser als einen Glanz.'
    glasschant_daggers: 'Die gute Schere. Man hat Ihnen verboten, sie zu benutzen. Sie benutzen sie.'
    glassong_grips: 'Gummi bis zum Ellbogen. Das Spülwasser hier löst Löffel auf, deshalb fallen sie etwas dicker aus.'
    glasswrought_brew_of_molten_antiphon: 'Seit dem Morgengrauen auf dem Herd gezogen. Stark genug, um mit ihm zu streiten.'
    glasswrought_carapace_of_black_choir: 'Mit der Fläche nach vorn festgeschnallt. Klappt flach zusammen und entfaltet sich mit einem Kreischen, das den Raum leert.'
    glasswrought_claymore_of_black_choir: 'Klingt beim Aufprall in klarem Hochton. Der Ton war für einige das Letzte, was sie hörten.'
    glasswrought_falchion_of_black_choir: 'Gezahnt für Krusten, die sich wehren. In dieser Gemeinde tun sie das.'
    glasswrought_fists_of_black_choir: 'Gepolstert für eine Pfanne, die nie gespült wurde — aus Prinzip und wegen der Patina.'
    glasswrought_focus_of_molten_antiphon: 'Angeblich Phönixfedern. Der Staub entzündet sich, was eine Art von Gründlichkeit ist.'
    glasswrought_philter_of_black_choir_pyre: 'Brennt zweimal: beim Einnehmen, und nochmal, wenn Sie danach Ihre Meinung sagen.'
    glasswrought_philter_of_black_choir_vitrified: 'Heilsam, laut der Putzfrau. Grau, laut allen anderen.'
    glasswrought_stilettos_of_molten_antipho: 'Zwei Schälmesser, dünn wie Ausreden. Schälen einen Apfel in einem Streifen oder ein Schloss in einer Sitzung.'
    glasswrought_tassets_of_molten_antiphon: 'Hoch gesäumt gegen Spülwasser und Ratten. Zweckmäßigkeit sah nie düsterer aus.'
    gobadoc_eye: 'Ein blutunterlaufenes Auge, dem Goblin-Kriegsherrn entrissen. Es rollt noch nervös umher, als suche es das nächste Fressen.'
    gobeline_ring: 'Zierlich nach Goblin-Standards, was bedeutet: nur drei scharfe Kanten und ein verdächtiger Fleck. Der Edelstein ist ein poliertes Stück Buntglas, auf das der Goblin-Juwelier extrem stolz war. Dies anzumerken gilt in der Goblin-Kultur als schwere Beleidigung. Und als Todesurteil.'
    goblin_cleaver: 'Einem Goblin gestohlen, der behauptete, es sei ein Erbstück. Der Rost sagt etwas anderes.'
    goblin_ear: 'Ein in einer handgemachten Salzlösung konserviertes Goblinöhr. Wird in verschiedenen alchimistischen Zubereitungen als Grundkomponente verwendet. Goblins finden diese Praxis beleidigend. Alchimisten finden die Reaktion der Goblins akademisch faszinierend, was die diplomatischen Beziehungen nicht verbessert.'
    goblin_grudge_axe: 'Jeder Goblin, der diese Axt besaß, benutzte sie schließlich an einem anderen Goblin. Tradition ist Tradition.'
    goblin_gunpowder: 'Selbstgemachter Sprengstoff. Goblins messen Mengen nach Gefühl. Die Überlebensraten spiegeln diese Methodik wider.'
    goblin_knuckle_ring: 'Geschmiedet aus dem Lieblingsknöchel eines Goblins — seinem eigenen. Der Goblin war angeblich philosophisch über den Verlust, bis er es nicht mehr war. Passt perfekt an jeden Finger, weil Goblins offenbar universell große Knöchel haben. Evolution ist rätselhaft.'
    goblin_loot_bag: 'Ein kleiner Jutesack voller gestohlener Schmuckstücke. Hauptsächlich Knöpfe, ein Hühnerknochen, und jemandes bedauerlicher Liebesbrief.'
    goblin_masher: 'Goblins würzen ihr Essen nicht, sie stellen es diesem hier vor. Die Technik überträgt sich bemerkenswert gut auf Schädel.'
    goblin_raider_vest: "Zusammengeflickt aus mindestens vier verschiedenen Rüstungen, von denen keine zusammenpasste und keine legal erworben wurde. Ein verblasstes Abzeichen auf der Brust sagt 'Eigentum von' gefolgt von einem Namen, der so aggressiv ausgekratzt wurde, dass ein Loch entstand."
    goblin_scimitar: 'Goblins schmieden keine Schwerter. Sie finden sie. Dieses wurde in jemandes Brustkorb gefunden.'
    goblin_stompers: 'Zusammengenäht von Goblin-Schustern, die offensichtlich starke Meinungen über Fußkomfort hatten, aber keine Ausbildung. Der linke Stiefel ist etwas größer als der rechte. Ob dies Absicht war, bleibt Gegenstand heftiger akademischer Debatte.'
    goblin_sword: 'Der Grünstich stammt vom Kupfergehalt, Goblinblut, oder beidem — Philosophen raten, lieber nicht zu fragen.'
    goblin_tooth: 'Ein goldbekapppter Eckzahn aus dem Maul eines Goblinooffiziers gerissen. Das Gold ist echt. Die Zahnmedizin war es nicht.'
    goblin_tooth_belt: 'Jeder Zahn gehoerte jemandem, der einen Goblin-Haeuptling persoenlich verärgert hatte. Die Liste war lang.'
    goblin_trinket_chain: "Eine Kette aus gestohlenen Schmuckstücken, entwendeten Münzen und mindestens einem Zahn, der nicht dem Goblin gehörte. Goblins nennen das 'Haute Couture'. Alle anderen nennen es Beweismittel."
    goblin_wartop: 'Ein Helm, der durch mehr Goblinschädel ging als besonders hartnäckige Kopfschmerzen. Jeder Besitzer ritzte seinen Namen innen ein, was eine geschichtete Geschichte zunehmend schlechter Handschrift ergab. Die Beulen verleihen Charakter. Die Blutflecken liefern Kontext.'
    godbone_saber: 'Es erledigt die Aufgabe, die ihm schließlich zugewiesen wurde, und die Unterlagen spiegeln davon nichts wider.'
    godbone_shard: 'Seine genauen Eigenschaften hängen davon ab, wen man fragt, und die Akte wurde still geschlossen, ungeklärt.'
    godbone_torc: 'Es wurde während eines Streits geschmiedet, den niemand gewann, also hat der Träger aufgehört zu fragen.'
    godflesh_plate: 'Seine Garantie erlischt in dem Moment, in dem man es hinterfragt, und der zweite Entwurf kam nie zustande.'
    gods_maw_key: 'Aus etwas gegossen, das einst zum Gott gehörte, als der Gott es noch benutzte. Der Schlund fordert ihn nicht so sehr zurück, als dass er ihn erwartet.'
    godspear_impaler: 'Geschmiedet, um an einer Schwelle eine Linie zu halten, die kein Torwächter je allein halten sollte. Welches Ende man greift, zählt weniger als die Frage, ob man auf der richtigen Seite des Tores steht.'
    godspine_staff: 'Seine Funktion wurde durch Münzwurf entschieden, ein Unterschied ohne nennenswerten Unterschied.'
    godstep_sandals: 'Es tut genau eine Sache und bestreitet selbst das, was entweder beruhigend oder zutiefst beunruhigend ist.'
    golden_fleece: 'Schimmert wie echtes Gold. Jeder Preisrichter hat irgendwann mal reingebissen, um es zu pruefen.'
    golden_fleece_amulet: 'Gewachsen an einem dreifachen Champion, der sich nie anstrengen musste.'
    golden_fleece_helm: 'So dicht gewebt, dass er Pfeile stoppt und jede Chance, ernst genommen zu werden.'
    golden_fleece_legguards: 'So bequem, dass zwei verschiedene Abenteurer darin mitten im Kampf eingenickt sind. Ungeschlagene Bilanz.'
    golden_larvae: ''
    golden_mushroom: 'Das Gold des armen Mannes—genauso nutzlos, viel schwerer zu finden, und in der Taverne nicht auszugeben.'
    golden_nightcap: ''
    golden_silk: 'Gesponnen von einer Matrone, die älter ist als die meisten Imperien. Jeder Faden ist mehr wert als dein gesamtes Inventar.'
    golden_silkling: 'Eine Larve aus kostbarem Faden gesponnen, deren winzige Form jene unbeugsame Entschlossenheit ausstrahlt, die schwache Schläge in vernichtende Hiebe verwandelt.'
    golden_wheat: ''
    grasploop: 'Das Letzte, was viele Kletterer hielten, bevor sie nichts mehr zu halten brauchten.'
    grave_dust: 'Feines graues Pulver aus den Knochen eines Hollows. Nekromanten zahlen gut. Dein Ruf in der Stadt wird sich jedoch nicht erholen.'
    great_woolame: 'Dieses Langschwert wurde aus den glitzernden Überresten der letzten Mahlzeit eines Wolligans gezogen, sein Metall seltsam erhalten durch die potenten Magensäure des Geschöpfs. Eine gründliche Reinigung wird dringend empfohlen.'
    greater_healing_potion: 'Gebraut aus Nachtkappe und fragwurdigen Korperflussigkeiten. Schliesst Wunden schnell genug um Chirurgen neidisch zu machen.'
    greater_stamina_tonic: 'Bernsteinfarben, dickfluessig, und ueberflutet dich mit mehr Ehrgeiz, als deine Beine gerade einloesen koennen.'
    green_bread: 'Dicht, teigig und schimmert schwach — dieses Pilzbrot erhält den Körper, stellt aber den Geist auf die Probe. Manche Gefangene verlangen extra danach, nur um zu beweisen, dass sie den absoluten Tiefpunkt erreicht haben.'
    green_mushroom: 'Ein kränklicher Pilz, dessen blasses Grün darauf hindeutet, dass er von etwas anderem als Sonnenlicht gedeiht.'
    green_mushroom_powder: 'Ein Beutel fein gemahlener Sporen, geerntet von pilzen aus üppigen wäldern. Ihre toxischen eigenschaften, konzentriert in einer einzigen, tödlichen prise.'
    green_sap: 'Klebrig, süß, und leicht empfindungsfähig. Der Kweebec hat die Extraktion nicht geschätzt. Das ist im Grunde Baumblut.'
    green_stew: 'Diese Emulsion aus Waldwuchs und Verzweiflung stellt Lebenskraft wieder her bei jenen, die verzweifelt genug sind, ihre Ähnlichkeit mit Goblin-Galle zu ignorieren.'
    grimoire_of_embers: 'Jeder gewirkte Zauber versengt eine Seite aus dem gehäuteten Haut-Pergament eines Aschenschattens. Beendet man das Buch, hat man das Temperament des Schattens gleich mit den Beschwörungen auswendig gelernt.'
    grimoire_of_tides: 'Die Seiten bleiben dauerhaft feucht. Es zu lesen fuehlt sich wie Ertrinken an, was der Autor als Feature ansah.'
    grimoire_of_warding: ''
    grimreminder: 'An neue Pilger als Lektion darüber ausgegeben, was die Narbe mit Begeisterung anstellt. Die meisten behalten sie lange, nachdem die Lektion angekommen ist.'
    grips_of_the_deathless: 'Jede Prophezeiung braucht eine Hand, die ruhig genug ist, um ohne Zittern auf den schlimmen Ausgang zu zeigen. Dies waren die Handschuhe dieser Hand. Der Prophet ist fort. Die Ruhe blieb.'
    groundpounder_boots: 'Jeder Schritt hinterlaesst einen tellergrossen Abdruck. Subtilitaet war nie das Ziel.'
    groundswing: 'Setzt sich bei einem Fehlschlag bis in den Boden fort, was oft genug vorkommt, dass die Maurer der Mauer eine laufende Strichliste führen.'
    guardian_chain: 'Glied für Glied dem des Letzten Wächters nachgeschmiedet, getragen von denen, die der Wächter persönlich für würdig befunden hat, die letzte Mauer zu halten.'
    guardian_core: 'Das dichte Herzmetall, aus dem Brustpanzer eines gefallenen Wächters geborgen — und nur aus einem gefallenen. Niemand hat bislang herausgefunden, wie man einen stehenden Wächter um seinen bittet.'
    guardian_gauntlets: 'Dem eigenen Griff des Letzten Wächters nachgegossen, das einzige bekannte Paar, das nicht gerade an der Mauer getragen wird. Jeder nimmt an, dass es dafür einen Grund gibt.'
    guardian_waistplate: "Schuetzt alles zwischen Brust und Beinen. Auch bekannt als 'alles Wichtige'."
    guardians_verdict: 'Vom Letzten Wächter geschwungen, in den seltenen Fällen, in denen Worte nicht genügen. Jeder, der es hat niedergehen sehen, ist sich einig: Worte hätten ohnehin nicht genügt.'
    hadean_ice: 'Eis von vor der Existenz der Sonne. Es schmilzt nicht. Es interessiert sich nicht. Es hat Galaxien überlebt. Du bist eine Unannehmlichkeit.'
    hadean_ichor: 'Das Blut der Leere selbst. Jeder der es ohne Schutzverzauberungen berührt, vergisst seinen eigenen Namen. Vorübergehend.'
    hades_breath_weapon: 'Kanalisiert, was auch immer das Tor darunter zwischen den Öffnungen ausatmet. Riecht auch danach, was der Verzauberer vor der Anprobe wirklich hätte erwähnen sollen.'
    hades_heart: 'Dem Knochenherrn nach dem dritten Versuch entrissen. Schlägt noch immer in einem Takt, zu dem niemand marschieren kann.'
    hades_key: 'Geschnitten aus einem Zahn, gezogen aus etwas, das dieses Tor bewachte, bevor die Torwächter die Schicht übernahmen. Ihn zu halten lässt die Backenzähne mitfühlend schmerzen. Niemand hat bisher erklärt, warum.'
    halfturn: 'Zu schwer, um sie zweimal zu schwingen in der Zeit, in der die meisten Waffen drei schaffen. Der erste Schlag ist meist der einzige, der zählt.'
    halo_draught: 'Die Dosierungsanleitung widerspricht sich auf halbem Weg des Etiketts, was der Brauer als beabsichtigt bezeichnet.'
    halo_splitter: 'Es funktioniert nur aufgrund einer Formsache, was technisch wahr und völlig unbrauchbar ist.'
    halo_striders: 'Diese Stiefel bestreiten das Konzept des Gehens. Sie glauben, dass Bewegung eine Frage der philosophischen Meinung ist, nicht des physischen Faktums.'
    haloforged_brew_of_last_regent: 'Es wurde gebraut, um einen Streit zu klären, was misslang, daher können die Ergebnisse erheblich variieren.'
    haloforged_carapace_of_last_regent: 'Der Entwurf durchlief mehrere unvereinbare Fassungen, also wurde die ursprüngliche Beschwerde nie förmlich zurückgezogen.'
    haloforged_circle_of_last_regent: 'Es funktioniert nach dem Ehrensystem, was der Schöpfer als Charakter bezeichnet.'
    haloforged_crest_of_last_regent: 'Sein Schöpfer weigerte sich, mehr zu erklären, ein Kompromiss, den niemand wirklich verteidigen will.'
    haloforged_fists_of_hollow_throne: 'Niemand hat bestätigt, dass es tut, was das Etikett behauptet, worüber der Träger beschlossen hat, nicht mehr nachzudenken.'
    haloforged_fists_of_last_regent: 'Das Entwurfskomitee war sich darüber nie wirklich einig, also bleibt die Sache vorerst ungeklärt.'
    haloforged_philter_of_hollow_throne: 'Niemand, der daran mitgebraut hat, einigte sich je auf eine endgültige Fassung, und der Brauer weigert sich immer noch, Partei zu ergreifen.'
    haloforged_resin: 'Es wurde mit knapper Mehrheit für echt erklärt, was sich je nach Jahreszeit und Fragendem ändert.'
    haloglass: 'Seine Reinheit wird auf einer verhandelbaren, gleitenden Skala bewertet, von einem Gremium, das sich seither aufgelöst hat.'
    hardening_compound: 'Waehrend des Schmiedens aufs Metall gepinselt, damit es sich nicht anders ueberlegt, ein Schwert zu werden.'
    hauler_harness: 'Mehr Taschen als Panzerplatten. Prioritäten eben.'
    healing_potion: 'Standard Schlachtfeldmittel. Leuchtet schwach, heilt ausreichend, riecht schlimmer als die Wunde.'
    heartmender_torc: 'Summt einen tiefen Ton, wenn in der Nähe jemand im Sterben liegt. Auf Festen sehr beliebt.'
    heartstring: 'Zieht ständig leicht in Richtung der Narbe, so wie ein Kompass nach Norden zieht. Manche Träger hören auf, dagegen anzukämpfen.'
    heartwood_core: 'Der innerste Ring eines Baumes, der mitten durch ein Schlachtfeld wuchs. Zählt mehr als Jahre.'
    heartwood_spear: 'Beschaftet mit einem Splitter des eigentlichen Herzens des Weltenbaums, der binnen einer Woche nachwuchs. Der Baum scheint nichts dagegen zu haben, Stücke von sich selbst zu verleihen.'
    heartwood_summoner_club: 'Aus Weald-Kernholz geschnitzt, das noch antwortet, wenn man daran klopft, in einer Sprache, die niemand übersetzt hat. Die Moosbären scheinen sie bestens zu verstehen.'
    heavy_leather_vest: 'Der Feran, dem dieses Fell gehoerte, war allen Berichten zufolge der faulste einer ohnehin sehr faulen Art.'
    hemmed_leggings: 'Wenigstens sind die Saeume gerade. Alles andere ist in Arbeit.'
    hermit_pilgrim_trousers: 'Ab der vierten Woche jenseits jeder Rettung befleckt. Neue werden nicht ausgegeben.'
    hermit_sage_cowl: 'Getragen während der langen Schichten. Der Geruch lässt sich nie ganz auswaschen.'
    hermit_sash: 'Mit Strichmarken für jede übergebene Kiste versehen. Niemand hat seither nachgezählt.'
    hermitude_bow: 'Ein Bogen für die Einzeljagd tief im Wald über Wochen. Das Design bevorzugt Präzision gegenüber Kraft — der Einsiedler hat keine Mannschaft, um massives Wild zurückzubringen. Ein Pfeil, ein Tier, eine Mahlzeit. Die Philosophie ist einfacher als die meisten Jagdbücher.'
    highguard: 'So lange von den Wächtern der Mauer über dem Kopf gehalten, dass die Haltung in drei Sprachen einen eigenen Namen trägt, keiner davon schmeichelhaft.'
    himalayan_flour: 'Der Gipfel der Müllerei, das Mehl beurteilt die Bäcker.'
    hive_ring: 'Aus königlichem Gelee geschnitzt, in Gift gehärtet, summt er missbilligend über Entscheidungen, die der Träger noch gar nicht getroffen hat. Man lernt, nicht mehr zu fragen, woher er das weiß. Jede Familie hat so einen Verwandten.'
    hive_warden_mace: 'Bis zum Griff mit Wachs überzogen, das die Wabenmutter selbst gepresst hat. Jeder Scarak in den tiefen Stollen weicht dem Träger respektvoll aus — zumindest die klugen; von den törichten erzählt die Sage nie ein zweites Mal.'
    hive_wax: 'Bernsteinfarben und wasserdicht, geerntet aus Wabenkammern, die die Scarak mitten im Streit verliessen.'
    hive_wax_girdle: 'Aus Bienenwachs und alchemistischer Flamme geformt, erinnert sie sich an die Gestalt ihres letzten Trägers mit beunruhigender Genauigkeit. Niemand im Dorf sagt, wohin diese Person verschwand. Mehrere wechseln sehr schnell das Thema.'
    hiveguard_mace: 'Versiegelt gegen Feuer wie Flut, ganz so, wie die alten Sagen es von den Lieblingen der Wabenmutter erzählen. Die Scaraks billigen ihn — mit derselben widerwilligen Miene, mit der eine alte Tante eine Hochzeit billigt, die sie nicht selbst arrangiert hat.'
    hivewax_belt: 'Chitin von Scaraks, die starben, wie sie gelebt hatten — Schulter an Schulter, zehntausend stark, bis zuletzt überzeugt, der Schwarm halte sie sicher.'
    hollow_ichor: 'Aus den ältesten Höhlungen des Sumpfes gewonnen. Einbalsamierer verdünnen ihn vor Gebrauch; keiner sagt, warum.'
    hollow_judge_mace: 'Mit Grabseide umwickelt, gekerbt von alten Urteilen. Sie kannte nie Gnade.'
    hollow_knuckles: 'Mit Seide über altem Plattenmetall gepolstert. Trifft härter, als die Polsterung vermuten lässt.'
    hollow_legguards: 'Aus einem Grabhügel, der schon einmal geplündert war. Auch beim zweiten Mal blieb nichts übrig.'
    hollow_mace: 'Aus einem Oberschenkelknochen geschnitzt, der seinen Besitzer ueberlebt hat und das nicht verschweigt.'
    hollow_reckoning_blade: ''
    hollow_root_key: 'Nie geschnitten, nur gewachsen, aus einer Wurzel, die der Wurzelmaul-Tyrann stets zurueck ins Dunkel nagt.'
    hollow_shiv: 'Zwillingsklingen in Grabseide gewickelt. Die Toten haben, wie sich zeigt, bemerkenswert guten Geschmack bei Griffen.'
    hollow_signet: 'Drückt ein leeres Siegel ins Wachs. Die Leere ist Absicht.'
    hollow_tome: 'Die Hälfte der Namen ist gestrichen. Das Buch schreibt sie trotzdem weiter.'
    hollowcrown_draught: 'Das Etikett listet eine Zutat auf, die niemand identifizieren kann, was das Etikett im Kleingedruckten offenlegt.'
    holy_bible: 'Göttliche Schrift, die ein Gewissen reinigen kann – vorausgesetzt, man besitzt noch ein Gewissen zu reinigen.'
    hornhead_hatchet: 'Um ein gebrochenes Horn geschmiedet. Der Hornkopf will es zurueck, hat aber keine Daumen.'
    hornhead_horn: 'Ein spiralförmiges Widdershorn, noch warm. Der Vorbesitzer rammte einen Baum und verlor.'
    hunting_javelin: 'Fuer Kleinwild konzipiert. Funktioniert auch bei Grosswild wenn man oft genug wirft und fest genug glaubt.'
    hush_moth_wing: 'Flügelstaub einer Motte, die fliegt, ohne je auch nur den kleinsten Laut von sich zu geben. Alchemisten schätzen ihn genau deswegen. Erklärt hat die Motte das nie.'
    hymn_ember: 'Die Wärme, die ein Stein behält, wenn das Feuer weiterzieht. Abgefüllt, solange es noch ging.'
    hymn_of_endings: 'Es funktioniert nach eigener Aussage angemessen, und der Schöpfer steht größtenteils dazu.'
    hymnbound_core: 'Gewachster Anzündblock aus dem Privatvorrat des Küsters. Zündet beim ersten Mal, was hier als Wunder gilt.'
    hymnbound_cuirass: 'Über allem getragen, an nichts gebunden. Taschen tief genug, um ein Weihrauchfass darin zu verlieren.'
    hymnbound_gauntlets_of_ashen_song: 'Für die Feuerlilienbeete hinter der Apsis. Die Dornen brennen; die Handschuhe widersprechen.'
    hymnbound_girdle_choir: 'Zwingt dich in die Chorhaltung: Brust raus, Kinn hoch, leichtes Ziel für alle darunter.'
    hymnbound_girdle_pyre: 'Glüht matt rot entlang der Schnalle. Entweder eine Warnung oder eine Modeaussage, und es klärt sich nie.'
    hymnbound_hatchet_of_ashen_song: 'Leicht in der Hand, schwer in den Folgen. Hinterlässt feinen grauen Staub, der überallhin kriecht.'
    hymnbound_helm: 'Klingt in der Dämmerung leise, ohne angebrachte Glocke. Der Schmied nimmt dazu keine Fragen mehr.'
    hymnbound_ingot: 'Massives Eisen, auf dem Herd erhitzt, von Groll geführt. Falten und Widerspruch kapitulieren gleichermaßen.'
    hymnbound_sabatons_of_cooling_vent: 'Leiten die Bodenhitze durch die Ferse ab. Warme Füße, versengte Abdrücke, bislang keine Klagen.'
    incandescent_lance: 'Gluetht mit Hitze, die nie nachlaesst, und einem Griff, der eindeutig nicht dazu passt.'
    infernal_cleaver: 'Brennt mit der Wut tausender Mitarbeitergespräche. Ironisch, in einer Eiswelt. Bisher hat sich niemand beschwert.'
    inferno_clutch: 'Das Leder kühlt seit den Scheiterhaufengruben nicht mehr ab. Der Griff strafft sich von selbst bei Hitze.'
    inferno_pendant: 'Der Stein in seiner Mitte ist seit den ersten Scheiterhaufen nicht abgekühlt.'
    inferno_shard: 'Verschmolzener Ofenabfall, aus dem Rost gekratzt. Der Ofen hebt seine Quittungen auf.'
    infested_legguards: 'Diese Beinschienen wimmeln von kolonien parasitären Wachstums, das chitinöse Geflecht hat sich längst mit dem Eisen darunter verbunden.'
    infested_ring: 'Ein Reif aus ausgehöhltem Chitin, dessen Rillen von namenlosen Dingen wimmeln, die sich winden und beißen.'
    infested_sash: 'Pulsierende Adern durchziehen den verunreinigten Stoff, als wäre das Kleidungsstück selbst noch am Leben und verdaut würde. Es zu tragen bedeutet eine intime Beziehung zur Krankheit.'
    infinity_amber: ''
    infinity_arcanite: 'Strahlt genug Restladung aus, um ein Wachfeuer durch jeden Sturm brennen zu lassen.'
    infinity_bloodstone: ''
    infinity_cursed_gem: ''
    infinity_diamond: ''
    infinity_draconite: ''
    infinity_duskite: ''
    infinity_jade: ''
    infinity_moonstone: ''
    infinity_obsidianite: ''
    infinity_quartz: ''
    iron_battleaxe: 'Aus Schattenstahl-Splittern geschmiedet. Die Dunkelheit ist tragend. Das Gewicht formt den Charakter.'
    iron_battlecleaver: 'Die Legende nennt sie das Beil, das ein Zeitalter beendete. Die Geschichte erinnert sich vor allem an den Zaun.'
    iron_battleplate: 'Schattenritter schmieden ihre Ruestung nur bei Finsternissen — viel zu selten fuer die Nachfrage.'
    iron_bludgeon: 'Ein gegossenes Eisenprügel — keine wirklich entworfene Waffe, eher ein Metallstück mit einem greifbaren Ende. Wirksam genau deshalb, weil es nicht raffiniert ist. Rüstungsschmiede verkaufen es leicht errötend. Käufer erwerben es schamlos, weil die Ergebnisse keinen Zweifel lassen.'
    iron_flanged_mace: 'Jeder Schlag riecht schwach nach Stall. Niemand hat erklaert, warum. Niemand will es.'
    iron_gauntlets: "Standardausrüstung der Schattenritter. Die Griffspuren des Vorbesitzers sind noch im Metall sichtbar, eingefroren in einem Ausdruck von 'Oh nein, nicht schon wieder.'"
    iron_kneeguards: 'Geborgen von einem Schattenritter, der vor dem falschen Altar kniete. Die Knieschoner überlebten. Seine Karriere in der organisierten Dunkelheit nicht.'
    iron_legplates: 'Knochenweißes Eisen aus den unsterblichen Schmieden unten, wo die Schmiede während der Arbeit nie ein Wort sprechen. Friedlich, bis man sich genau erinnert, warum sie verstummt sind.'
    iron_pounder: ''
    iron_sickle: 'Eine gebogene Klinge die Krauter mit chirurgischer Prazision schneidet. Der Vorbesitzer war kein Chirurg was das Blut erklart.'
    iron_war_spear: 'Bestückt mit einem uralten Marksplitter, der sich weigert, ganz zu trocknen. Was auch immer sein Leben ließ, um diesen Speer zu schaffen, hat nicht aufgehört beizutragen — nennen Sie es Hingabe, oder ein unvollendetes Geschäft.'
    iron_warhelm: 'Der Schmied, der diesen Helm schmiedete, arbeitete ausschließlich bei Mondlicht und behauptete, die Schatten flüsterten ihm das Design zu. Die Schatten flüsterten auch den Preis. Er war nicht angemessen.'
    ironbark_treads: 'Rinde eines Baumes, der die Axt kommen sah und zuerst ging. Schritte klingen schwach nach Zustimmung.'
    ironbound_bread: "Dient in Notfaellen als Schild. Bewertungen nennen es 'rustikal'. Die Bewertungen sind grosszuegig."
    ironbrow_casque: 'Lässt dich einschüchternd wirken. Lässt deinen Nacken schmerzen. Kompromisse eben.'
    ironbuckle_girdle: 'Allein die Schnalle wiegt mehr als so manch ganzer Gürtel. Das allein ist schon das Verkaufsargument.'
    irongrip_signet: 'Zieht sich leicht zusammen, wenn du wütend bist. Lockert sich, wenn du dich beruhigst. Bleibt meistens eng.'
    ironhide_girdle: 'Dick genug, um eine Klinge abzulenken, steif genug, dass Knien eine Entscheidung wird, kein Reflex.'
    ironjaw: 'Gebaut, um dem Träger die Zähne dort zu lassen, wo er den Kampf begann. Ein bescheidenes Ziel, in dieser Höhe selten erreicht.'
    ironloaf_slab: 'Weniger Brot, mehr Baumaterial. Ruestungsschmiede mahlen es zu Fuellmasse und schauen nie zurueck.'
    ivory_orchid_paste: 'Eine Paste so geschmeidig, dass sie Friedensverträge aushandeln könnte, wenn Friedensverträge nach Höhlenpilz und Reue röchen.'
    ivory_shrooms: 'Cremefarbene Pilze, die gegen die dunkle Erde, aus der sie sprießen, fast leuchten. Beweis dafür, dass selbst an den dunkelsten Orten Schönheit existiert—meistens kurz bevor sie dich tötet.'
    iyashi_living_branch: 'Der Baum, von dem sie stammt, starb vor Jahrhunderten. Niemand hat es dem Ast gesagt. Er treibt jeden Frühling noch aus.'
    jade: 'Grun genug um einen Smaragd neidisch zu machen und trotzdem billiger als ein Tavernenessen.'
    jade_hoe: 'Ein Ackergerat so schon dass Bauern zogern es zu benutzen. Dann siegt der Hunger wie immer.'
    jade_pickaxe: 'Benutzt Jade um Jade abzubauen. Die philosophischen Implikationen gehen den meisten Bergleuten verloren die zu beschaftigt sind reich zu werden.'
    jade_powder: 'Ein feines gruenes Pulver das alles beschmutzt was es beruehrt einschliesslich deines Rufs als sauberer Bergmann.'
    journeyman_saber: 'Gut genug um einen Goblin zu toeten wenn er stillhaelt und zustimmt erstochen zu werden.'
    key_aragog: 'Bedekt mit Seide und Giftresten, pulsiert dieser verzierte Schlüssel im Herzschlag der schrecklichsten Kolonie des Verbotenen Waldes.'
    kiln_potholder: 'Ein gestepptes Quadrat, das keinen Ofen fürchtet. Tragen Sie alles in der Küche, außer einer Melodie, einer Nadel, oder dem Gefühl in den Fingerspitzen.'
    kindling: 'Aus Holz geschnitzt, das die Wunde nie zu Ende verbrannt hat. Es erinnert sich noch an die Form des Feuers.'
    kneebreakers: 'Am Gelenk verstärkt, wo drei frühere Paare versagten. Der Träger geht einwandfrei. Alle anderen finden das verdächtig.'
    knucklebone: 'Aus den Knöcheln einer Form gegossen, über die niemand Aufzeichnungen führte. Sitzt, als wäre er für eine etwas größere Hand gemacht.'
    knucklevow: 'Eingraviert mit einem Versprechen, das kein Lebender mehr lesen kann. Das Metall erinnert sich besser daran als jeder Übersetzer könnte.'
    koa_eye: 'Hervorquellend, unblinkend, und irgendwie immer noch urteilend. Reagenz für Sichttränke. Nebenwirkungen können Paranoia einschließen.'
    koa_eye_ring: 'Gefasst mit einem polierten Koa-Auge, das beunruhigenderweise noch immer nach etwas zu suchen scheint.'
    koa_eye_signet: 'Koas haben ungefähr denselben Gesichtsausdruck, ob sie nun glücklich, wütend oder gerade zu Schmuck verarbeitet werden. Das Auge in diesem Ring blinzelt gelegentlich noch, obwohl niemand sicher ist, ob es Absicht ist.'
    koa_slime: 'Zähflüssiger Froschschleim. Rutscht aus Behältern, überzieht alles andere. Alchemisten lieben ihn. Alle anderen hassen dich.'
    koa_slime_brigandine: 'Lederplatten lackiert mit Koa-Schleim, der zu einer erstaunlich widerstandsfähigen Beschichtung aushärtet. Der Koa produzierte diesen Schleim als Stressreaktion, was bedeutet, diese Rüstung besteht buchstäblich aus Angst. Sie glänzt noch bei Regen und verleiht dir das Aussehen eines sehr gut befeuchteten Kriegers.'
    koa_slime_codex: 'Die Seiten kleben mit Koa-Schleim zusammen. Lesen erfordert Geschick und einen starken Magen.'
    koa_slime_rod: 'Ein mit gehaertetem Koa-Schleim ueberzogener Stock. Leitet Magie oder tut so.'
    koa_tongue: 'Knapp ein Meter greiffähiger Muskel. Dehnt sich, schnappt zu, und fängt gelegentlich etwas anderes als Fliegen.'
    koagulant_longbow: 'Die Bogensehne sondert dünnen Schleim ab. Niemand weiß warum. Niemand will es wissen.'
    koagulant_wand: 'Pulsiert mit klebriger Energie und heilt Wunden, indem er sie mit etwas ueberzieht, das man besser nicht genau betrachtet.'
    kraken_depth_staff: 'Soll die tiefsten Meeresgräben kanalisieren. Träger berichten, beobachtet zu werden. Sie werden es.'
    kraken_ink: 'Aus den tiefsten Drüsen des Kraken gewonnen. Schreibt Prophezeiungen. Auch ganz normale Einkaufslisten. Wählerisch ist sie nicht.'
    kraken_key: 'Von Salz und Seepocken zerfressen. Das Tentakelmotiv am Griff ist alles andere als subtil.'
    kraken_tide_boots: 'Greift auf jeder Oberfläche, nass oder trocken. Die Kraken-Sohlen lesen die Gezeiten vor dir.'
    kweebec_leaf_charm: 'Ein lebendes Blatt, das sich weigert zu welken. Druiden verwenden sie als Fokusgegenstand. Das Blatt beurteilt deinen Charakter still.'
    kweebec_vine_sash: 'Gebunden waehrend eines dreitaegigen Kweebec-Gesangs, dessen Worte selbst die Kweebec vergassen.'
    lantern_shard_ring: 'Ein Splitter einer Geisterlaterne, noch schwach glühend. Er flüstert die Uhrzeit, was nützlich wäre, wenn er nicht ständig falsch läge und nicht zutiefst passiv-aggressiv auf Korrekturen reagieren würde.'
    larvano: 'Pulsiert wie ein winziger Herzschlag. Der Scarak-Schwarm, aus dem es stammt, zaehlt seine Verluste noch immer.'
    last_guardian_aegis: 'Vom Letzten Wächter getragen, seit die Narbe noch keinen Namen hatte, verbeult an Stellen, die seither nichts ein zweites Mal verbeulen konnte. Nicht ein einziges Mal war sie der Grund, warum die Mauer fiel.'
    lastbreath: 'Zugeschnitten auf die letzte Person, die sie trägt. Der Rüstmeister erklärt nie, was das bedeutet, und niemand hat zweimal gefragt.'
    lastmile: 'Benannt nach dem Stück, von dem jeder Pilger schwört, es sei kürzer als das letzte. Das stimmt nie.'
    lastwhisper: 'Trägt einen Zauber, der so alt ist, dass die Silben glattgeschliffen sind. Was er ursprünglich sagte, wirkt noch immer.'
    lava_chitin: 'Magmaklauen-Panzer, natuerlich feuerfest. Riecht schwach nach dem Streit, den er verloren hat.'
    leather_heavy_boots: 'Drei Schichten Tusker-Leder. Ihre Fuesse werden Ihre Knie bequem ueberleben.'
    leather_treatment: 'Chemisches Bad das Rohhäute in geschmeidiges Leder verwandelt. Gerber konnen ohne standige Versorgung nicht arbeiten.'
    legguards_of_the_primordial: 'Gegossen aus der Haut, die ein Aschprophet abwirft, wenn eine Vision zu lange dauert. Der Schritt des Trägers verlangsamt sich zum Tempo eines Propheten: bedacht, ohne Eile, und stets pünktlich zur schlechten Nachricht.'
    legweight: 'Schwerer als vorgeschrieben, nach der Theorie, dass ein zu müdes Bein zum Laufen eben stehen bleibt und kämpft.'
    leviathan_tentacles: 'Steif gegerbt, nachdem es von etwas losgerissen wurde, das der Kraken Familie nennt. Zuckt noch. Gelegentlich.'
    lightless_striders: 'Sohlen so schwarz, dass sie in der Dunkelheit des Waldes verschwinden. Am dritten Tag sieht der Träger nicht mehr, wohin er tritt. Am vierten spielt es keine Rolle mehr.'
    liquid_koa: 'Ein Schleim, der nie lernte, eine Form zu halten, und sich damit abgefunden hat. Fast.'
    litany_of_cinders: 'Eine endlose Rolle Hausarbeit. Laut vorgelesen bringt sie den Staub dazu, sich vor lauter schlechtem Gewissen selbst zu ordnen.'
    living_spark: 'Ein Funke der sich weigert zu sterben. Entzündet sich ständig in der Tasche. Feuermagier nutzen sie als Feuerzeuge. Sicherheitsrisiko.'
    living_spark_greataxe: 'Der Kopf knistert noch von dem, was er zuletzt gefällt hat, und niemand ist sich ganz sicher, was das war. Die Berichte sind abgelegt und versiegelt. Was mit Sicherheit bekannt ist: Die Axt sucht sich ihre Ziele aus. Wer den Stiel hält, ist meist nur Passagier.'
    longdraw: 'Ein voller Atemzug zum Spannen, ein voller Atemzug zum Bereuen. Beide sind unnötig, wenn das Ziel schnell genug ist.'
    longreach: 'Erweitert die Reichweite des Trägers über das hinaus, was die meisten Gegner für fair halten. Fairness war nie Teil der Vorgabe.'
    lorito_helmet: 'A full parrot pulled over the ears. The sprout on top is load-bearing, emotionally.'
    lumber_cleaver: 'Aus einem Holzfaellercamp umfunktioniert. Riecht nach Kiefernharz und existenziellen Berufswechseln.'
    lure_light_pendant: 'Birgt einen Splitter gefangenen Anglerlichts, das im eigenen Takt pulst, gleichgültig, was es trägt. Die echten Köder des Weald haben begonnen, sich dem Träger zu nähern. Das gilt nicht als gutes Zeichen.'
    magmooligan_charm: 'Ein vulkanisches Wollamulett, das sanfte Wärme ausstrahlt und schwach nach Schwefel und Verrat riecht. Der Magmooligan, von dem es stammt, graste friedlich neben einem Lavastrom, als sich eine Gelegenheit ergab. Nun ja. Als du zugeschlagen hast.'
    magmooligan_hauberk: 'Gefilzte Vulkanwolle über alten Bronzeringen, warm genug für Schneestürme und unerträglich überall sonst. In kalten Nächten blökt etwas im Gewebe noch immer, leise. Der Schwur des Rüstmachers, das Tier sei vorher gründlich fertig gewesen, klingt mit jeder Erzählung weniger überzeugend.'
    magmooligan_waraxe: 'Magmooligans sind klein, gemein und stecken ständig Dinge in Brand, ohne einen Grund, den ein vernünftiges Wesen akzeptieren würde. Diese Axt ist, was übrig bleibt, wenn ein Schmied endlich einen fängt. Beruhigt hat sich das Feuer nie.'
    magmooligan_wool: 'Feuerfeste Wolle, die noch glimmt. Weber berichten von leichten Verbrennungen und existenziellen Fragen über brennbare Stoffe.'
    magmooligan_wool_ring: 'Aus vulkanischer Wolle gefilzt. Haelt den Finger warm — ein seltsamerer Trost, als es klingt.'
    malt_bread: 'Verdaechtig suesses Brot das vielleicht in deinem Beutel gaerte. So oder so steigt die Moral.'
    malt_flour: 'Mehl mit Malzunterton, das Brot nach Bier schmecken lässt.'
    marchworn: 'Bereits eingetragen von jemandem, der nicht überlebte, um es weiter zu tragen. Großzügig geschnitten, aus professioneller Höflichkeit.'
    marginalia: 'Der Haupttext ist unauffällig. Alles Wissenswerte wurde von jemandem an den Rand gekritzelt, der offensichtlich anderer Meinung war.'
    marrow_cinch: 'Geschnitzt aus einer Wirbelsäule, die einst aufrecht stand und die ganze Zeit über feste Meinungen hatte. Er zieht sich von selbst zusammen, sobald eine Mahlzeit ausfällt, und beurteilt Ihre Gewohnheiten aus dem, was vom Jenseits übrig ist.'
    marrow_knuckles: 'Handschuhe geschnitzt aus den Markknochen von etwas, das vor langer Zeit starb und es noch nicht ganz überwunden hat. Kalt im Sommer, kälter im Winter, eiskalt wenn Untote in der Nähe sind. Ein furchtbares Frühwarnsystem, denn wenn die Finger taub werden, atmet dir das Ding bereits in den Nacken. Bildlich. Tote atmen nicht.'
    marrow_ring: "Nekromanten lieben sie für die 'frisch ausgegrabene' Ästhetik ohne die Graberei."
    matriarch_tusk: 'Aus dem Ashback-Großstoßzahn gerissen, nach einem Kampf, von dem die Herde noch heute erzählt. Die Erde erinnert sich, so hart getroffen worden zu sein; seither hat sie niemandem verziehen.'
    matron_chitin: 'Exoskelettplatte der weißen Witwe selbst. Dunkler als Obsidian und doppelt so hart. Rüstungsschmiede weinen vor Freude.'
    matron_chitin_gauntlets: 'Gepanzert mit Panzerschale der Aschwitwe. Noch schwach warm vom Bau.'
    matron_silk_slippers: 'Aus der Seide gesponnen, die die Anglertiefen-Matrone bei ihren tiefsten Jagden verliert, weich genug, um den Boden des Weald lautlos zu durchqueren. Stille ist hier unten alles, worauf es ankommt.'
    maw_cleaver: 'Wer auch immer es machte, änderte auf halbem Weg die Meinung, was der Schöpfer als Charakter bezeichnet.'
    maw_crusher_fists: 'Sein Verhalten widerspricht seiner eigenen Beschreibung, was entweder ein Konstruktionsfehler oder der ganze Sinn ist.'
    maw_tooth_ring: 'Ein Ring, der seine eigene Existenz entschieden leugnet, während er getragen wird. Er ist gleichzeitig absolut sicher und völlig zweifelhaft.'
    maw_visage: 'Ein Helm, der darauf besteht, recht zu haben, auch wenn die Fakten anderes nahelegen. Er bezieht Stellung zu absolut nichts Besonderem.'
    mender_cuisses: 'Gepolstert mit Heilkraeutern. Knien, atmen, den Papierkram — Verzeihung, die Kraeuter — den Rest erledigen lassen.'
    militia_breastplate: 'Standard fuer Dorfwachen die sich keine richtige Ruestung leisten koennen. Lenkt Pfeile ab wenn man fest genug glaubt.'
    millstone: 'Dorfmühlsteine mahlten sechs Generationen lang Weizen, bevor jemand auf die Idee kam, einen zu schwingen. Es funktioniert. Den Müller hat niemand gefragt.'
    mineral_biscuit: 'Ein mit Diamantstaub angereicherter Keks. Technisch essbar, praktisch ein Mahlstein fuer die Backenzaehne.'
    minor_healing_brew: 'Ein lauwarmer gruner Schleim der Papierschnitte und Egos heilt. Schmeckt nach Reue mit einem Hauch Moos.'
    mire_bloom: 'Eine blasse Blume, die sich nur in völliger Dunkelheit öffnet und beim ersten Anflug von Licht schließt, was das Pflücken zu einem Herumtasten und Hoffen macht.'
    mire_heart: 'Das tatsächliche Herz eines Sumpfschrecks. Schlägt noch. Sehr langsam. In einem versiegelten Behälter aufbewahren, es sei denn du willst Albträume.'
    mire_judge_mace: 'Benannt nach der Art, wie er Streitigkeiten in den tieferen Regionen des Weald beilegt, nämlich endgültig. Der Düster-Pfeifer komponierte ein Lied darüber; niemand hört es gern.'
    mire_waders: 'Standardausrüstung für jeden, der jenseits der Schilflinie postiert ist. Trockene Füße sind nicht Teil der Abmachung.'
    mirefang_kris: 'Gewellte Klinge wie der Fang eines Sumpfschleichers, offen gesagt, weil sie genau daraus gegossen ist. Gleitet leichter hinein, als er sollte.'
    mirefang_loop: 'Aus einem einzelnen gekrümmten Fang gebogen, klein genug, dass man ihn vergisst zu tragen, bis etwas im Weald zuerst darauf reagiert.'
    mireglass_infusion: 'Schlammglas eingeschmolzen und neu erstarrt, mit etwas Lebendigem eingerührt, das laut den Handwerkern die Härtung verbessert, ohne je zu sagen, wessen.'
    mireweald_brew_of_deep_canopy: 'Grün und dick und schwach in Bewegung, was der Brauer nur als Absetzen beschwört und lieber nicht zu genau beobachtet sähe.'
    mireweald_carapace_of_drowned_weald: 'Über eine ganze Jahreszeit um seinen Träger gewachsen, sitzt er perfekt und geht, wenn es sein muss, ab, wie Rinde von einem Baum abgeht.'
    mireweald_crest_of_deep_canopy: 'Getarnt für die Schicht, in der das Blätterdach das wenige Licht schluckt, das so tief gelangt, also zum Verbergen, was das Weald belohnt.'
    mireweald_lattice: 'Ein lebendes Kristallgerüst, das nach der Ernte weiterwächst, langsam, in die Richtung, in die es der letzte Bearbeiter drehte, aus Sturheit oder Gewohnheit.'
    mireweald_tassets_of_deep_canopy: 'Lebende Beplattung, die das wenige Licht photosynthetisiert, das sie erreicht, also nichts, weshalb sie stattdessen langsam den Träger frisst. Langsam.'
    mireweave_grips: 'Aus Sumpfseide gewoben, die die Sporenrücken zwischen Wurzelsystemen spinnen, klebrig genug, einen Griff zu verbessern, und unangenehm genug, dass niemand fragt, wie sie geerntet wird.'
    mirrormelt_essence: 'Destilliert aus der einzigen Stelle Mirrormeres, die nie ganz zufriert. Sie erinnert sich an alles, was in sie geschmolzen ist.'
    mithril_axe: 'Baerenkrallen fuer den Griff, Magmaklauen-Chitin fuer die Schneide. Spaltet alles mit vulkanischem Enthusiasmus.'
    mithril_battleaxe: 'Zweihaendig, doppelschneidig, dreifaches Bedauern. Magmaklauen-Chitin haelt die Schneide ewig heiss. Woertlich.'
    mithril_cinder_striders: 'Das verbesserte Paar. Irgendwie waermer, irgendwie lauter, irgendwie immer noch beobachtend.'
    mithril_club: 'Baerenkrallen-Nieten, Eberleder-Wicklung, Goldvlies-Futter. Leichter als es aussieht, schwerer als gehofft. Sehr ueberzeugend.'
    mithril_longbow: 'Gebaut aus den eigenen Schwanzfedern eines Sturmfalken, aufgezogen auf Mithril-Draht. Der Schütze heimst den Ruhm ein. Der Wind hätte, könnte er sprechen, einige Korrekturen anzubringen.'
    mithril_mace: ''
    mithril_sword: 'Mit goldenem Vlies gefüttert und so leicht, dass sie sich in der Hand kaum bemerkbar macht — genau das ist das Problem für jeden, der auf der anderen Seite von ihr steht.'
    mokan: 'A wide woven hat. Keeps the rain off and the questions away.'
    molten_verse_casque_of_glass_cathedral: 'Birgt im Kamm den Fingerknochen eines Heiligen, fürs Glück. Das Glück des Heiligen ist aktenkundig.'
    molten_verse_charm_of_rising_hymn: 'Eine Glasperle, die nie ganz erkaltet. Tröstlich in der Hand, bis du sie vergisst und aufs Pergament legst.'
    molten_verse_hauberk_of_glass_cathedral_choir: 'Ausgegeben an alle, die die verglasten Böden schrubben. Die Flecken haben Dienstalter.'
    molten_verse_hauberk_of_glass_cathedral_pyre: 'Aus den großen Vorhängen des Kirchenschiffs geschnitten. Die Motten nahmen den Saum; die Erhabenheit blieb.'
    molten_verse_hauberk_of_rising_hymn: 'Wird wärmer, je länger der Kampf dauert. Lange Kämpfe enden mit dir glühend und dem Feind verschwunden.'
    molten_verse_sash_of_glass_cathedral: 'Mit einem Band aus buntem Glas durchzogen. Hübsch, bis ein Lichtreflex dich selbst blendet.'
    molten_verse_scepter: 'Löscht Kerzen, Laternen und Begeisterung auf Distanz. Der lange Stiel ist für die Kronleuchter.'
    momaku: 'A spirit-mask banner draped down the back to frighten debtors and impress no one already dead.'
    moonclad_band_of_silt_throne: 'Ein Ring aus Mondklauen-Schale, der selbst in der fiebrigen Wärme des tiefen Weald kühl bleibt, an den sich der Träger mehr klammert, als er zugibt.'
    moonclad_breastplate_of_silt_throne: 'Seine Mondklauen-Beplattung soll in Nächten, in denen der Mond sich zeigt, schwach leuchten, was so tief im Weald nie heißt, sodass die Behauptung vor jeder Prüfung sicher ist.'
    moonclad_crusher_of_silt_throne: 'Mit blasser Schale beschlagen, die jeden Riss, den er schlägt, in Weiß zeigt und eine saubere, leuchtende Zählung führt, die der Träger nicht abstellen kann.'
    moonclad_pike_of_brackish_deep: 'Mit Mondklauen-Schale bespitzt, die bis zur Spitze kalt bleibt, ein schwacher Trost für den, der das ferne Ende in der fiebrig-warmen Finsternis hält.'
    moonclad_poultice_of_silt_throne: 'In blasse Schale gehüllt, die gegen Fieber kühl bleibt, ein Trost, den der ertrunkene Hof schätzte und den der ertrunkene Hof nicht mehr braucht.'
    moonclad_tonic_of_brackish_deep_matron: 'Unter der blassen Schale abgefüllt, die es kühl hält, das Nächste zu mondbeschienenem Wasser, das man so tief unten braut.'
    moonclad_tonic_of_brackish_deep_mire: 'Die Sumpfwasserbasis setzt sich in Schichten ab, lässt man sie stehen, die der Brauer zu schütteln rät, ohne je zu sagen, was die unterste Schicht ist.'
    moonclad_torc_of_silt_throne: 'Ein Halsring aus blasser Schale, den der Hof trug, um Mondlicht durch eine Halle einzufangen, die nun hundert Fuß unter Schlamm liegt. Er hat seither keins mehr eingefangen.'
    moonclad_treads_of_brackish_deep: 'Mit Mondklauen-Schale beplattet, die unter dem Fuß kalt bleibt, das Nächste zu Mondlicht, das der Träger so tief unten spüren wird.'
    moonclad_visor_of_silt_throne: 'Mit Mondklauen-Schale beplattet, die das wenige Mondlicht einfängt, das so tief gelangt, also fast keines, weshalb es vor allem daran erinnert, dass es einst einen Mond gab.'
    moonclaw_shard: 'Ein Klauensplitter der Mondklauen-Kaiserin. Er leuchtet im Mondschein. Verzauberer, die ihn berühren, wollen ein Schnurren hören.'
    moonfang_precision_band: 'Gefasst mit einem Knochenfragment eines Mondräubers, der seine Beute nie verfehlte. Präzision wird durch Nähe übertragen. Bogenschützen, die ihn tragen, bemerken, dass ihre Schüsse sich leicht von selbst korrigieren. Das ist keine Krücke, betonen sie. Es ist eine Zusammenarbeit. Philosophisch diskutabel, aber praktisch effektiv.'
    moonfang_waistguard: 'Geborgen aus dem Fell einer Bestie, die bei Vollmond jagte und den Rest der Zeit schlief. Das Leder trägt noch etwas Nächtliches, das sich am helllichten Tag schwer erklären lässt. Träger beschreiben eine ungewöhnliche Klarheit in der Dunkelheit. Nicht eigentlich Nachtsicht. Eher das Gefühl, dass die Dunkelheit auf ihrer Seite ist.'
    moonlit_choker: 'Fest verschlossen, bevor sich die Gräber in der Dämmerung öffnen. Erst nach der Wache gelockert.'
    moonlit_claw: 'Leuchtet schwach im Mondlicht, von einem Mondfang, der einst eine Legende war. Jetzt ist es Bastelmaterial.'
    moonlit_recurve: ''
    moonrise_boots: 'Aus Wolle gefilzt, die sich noch lebendig fuehlt und gelegentlich zu grasen versucht.'
    moonstone: 'Leuchtet schwach im Sternenlicht was voellig nutzlos ist da Bergleute unter Tage arbeiten.'
    moonstone_hoe: 'Bestellt den Boden mit Mondresonanz. Das Korn wachst 12% schneller. Der Bauer altert 12% schneller. Fairer Handel.'
    moonstone_pickaxe: 'Der Kopf pulsiert mit blasser Lumineszenz. Bergleute schworen er findet Adern von selbst. Die Spitzhacke hat keinen Kommentar.'
    moonstone_powder: 'Glitzert im Dunkeln was es leicht zu finden und unmoeglich vor Steuereintreibern zu verstecken macht.'
    moonstone_sickle: 'Leuchtet schwach im Sternenlicht. Krauterkundige behaupten es steigert den Ertrag. Alchemisten sagen das sei Placebo. Beide irren sich.'
    mules_burden: 'Mehr Befestigungspunkte als die Ausruestungskiste eines Show-Handlers. Auch schwerer.'
    muleteer_march: 'Legte mehr Meilen hinter der Nachschubkolonne zurück als jeder lebende Soldat. Verlor nie einen Wagen.'
    neckoath: 'Getragen von Pilgern, die schworen, die Mauer zu erreichen oder dabei zu sterben. Die meisten von ihnen tragen es noch.'
    nerak_key: 'Knochen, geritzt mit Runen, die Drohungen in Sprachen murmeln, die kein Lebender mehr spricht. Die Toten mögen keine Besucher besonders. Ihre Schlösser, wie sich zeigt, empfinden genau dasselbe.'
    nerak_marrow: 'Geschwärztes Mark, gewonnen aus Neraks eigenen uralten Knochen, das noch leise mit einem Leben summt, das es nicht haben sollte. Alchemisten schätzen es wegen seiner Kraft. Alle anderen meiden es wegen des Flüsterns, dessen Worte noch niemand ganz erfasst hat.'
    nerak_marrow_bow: 'Bespannt mit einer Sehne, die Nerak vor Jahrhunderten verlor und nie zurückforderte. Spannt man ihn, summt die Sehne denselben tiefen Ton, den sein Hof noch immer unter der Erde singt — ob man mitsingen wollte oder nicht.'
    nexus_blade: 'An dem Damm geschmiedet, wo drei Wege die Toten treffen. Sie summt noch immer in der Dämmerung.'
    nightcap: 'Ein biolumineszenter Pilz, der mit einem beunruhigenden azurblauen Schimmer pulsiert und auf Ursprünge in Höhlen hindeutet, in denen Sonnenlicht weniger eine Erinnerung als ein Gerücht ist. Alchemisten begehren ihn wegen seiner einschläfernden Eigenschaften, obwohl der Pilz selbst ihren Zuneigungen gegenüber zutiefst gleichgültig bleibt.'
    nightcap_elixir_base: 'Die Grundlage jedes fragwürdigen Tranks, der je nach Mitternacht von jemandem gebraut wurde, der ins Bett hätte gehen sollen.'
    nightfang_daggers: 'Zwillingsklingen die im Schatten verschwinden und in Wirbelsaeulen auftauchen.'
    nightfang_razors: ''
    novice_wand: 'Aus einem Ast geschnitzt der offensichtlich nicht bereit war. Sprueht gelegentlich Funken. Meist ungelegen.'
    null_essence: 'Flüssige Abwesenheit. Löst Behälterwände auf bei zu langer Lagerung. Verzauberer zahlen obszöne Preise. Lagerung ist dein Problem.'
    oblivion_saber: ''
    obsidian_arc_bow: 'Bespannt mit gewachster Schürzenschnur. Die Vorhänge fielen vor Jahren; die Stange hat umgeschult.'
    obsidian_casque_of_glass_cathedral: 'Gewölbt wie ein Kapellendach und ähnlich gut darin, die Meinung der Gemeinde draußen zu halten.'
    obsidian_choir_plate: 'Die Rüstung des inneren Heiligtums, wo nur Vertraute stehen. Vertrauen wird sparsam vergeben und schnell entzogen.'
    obsidian_cordial_choir: 'Zum Kochen, beharrt das Etikett. Der Koch beharrt auf dem Gegenteil.'
    obsidian_cordial_of_rising_hymn: 'Eine helle, aufsteigende Wärme, die die Stimmung hebt und, kurz, die Härchen an den Armen.'
    obsidian_cordial_pyre: 'Ein Schluck und die Ohren klingeln, die Augen tränen, und die Wunden schließen aus purer Einschüchterung.'
    obsidian_core: 'Die dichte Mitte eines Glasstroms. Schneide falsch und das Ganze stimmt für tausend Messer.'
    obsidian_elixir_of_glass_cathedral: 'Ein kleines Glas vor dem Schlafengehen. Das Bett ist optional; das Glas nicht.'
    obsidian_extract: 'Politur für die großen Herde. Der Glanz hält eine Woche; der Geruch hält eine Ehe.'
    obsidian_flux: 'Ätzpaste, die Ruß, Lack und Fingerabdrücke ablöst. Überlegen Sie, welche davon Sie noch brauchten.'
    obsidian_psalter: 'Jedes Rezept endet mit derselben Anweisung: drinlassen, bis es aufhört zu schreien. Funktioniert bei Braten. Funktioniert bei Ketzern.'
    obsidian_signet: 'Drückt ein Zeichen in heißes Wachs und, bei Gelegenheit, in manche Stirn. Es siegelt so oder so.'
    obsidian_stompers: 'Polierte Glassohlen, spiegelblank. Das Letzte, was ein gestürzter Feind sieht, ist sein überraschtes Gesicht.'
    obsidianite: 'Vulkanglas das in Kanten zerbricht scharf genug um Stein und Karriereambitionen zu durchschneiden.'
    obsidianite_powder: 'Mikroskopische Splitter, suspendiert in Mineralstaub, mit Sicherheitshinweisen lang genug, um das Wartezimmer eines Heilers zu tapezieren. Sie sind, ausnahmslos, alle berechtigt.'
    ocean_grimoire: 'Geschrieben in Tinte, die nur unter Wasser erscheint. Sehr unpraktisches Lernmaterial.'
    ocean_sigil: 'Geschnitzte Koralle mit Talokan-Runen. Gelehrte haben drei von neun entschlüsselt. Die anderen sechs sind schlimmer.'
    old_hoe: 'Ein rustikales Ackergerät, verstärkt mit gezackten blauen Antennen, deren Sinneshaare noch immer mit Restreflexen zucken.'
    onyxium_aegis_pendant: 'Enthält ein konserviertes Rabenauge, das bei Gefahr blinzelt. Blinzelt manchmal auch einfach so. Unklar, warum.'
    onyxium_bastion_greaves: 'So bequem, dass drei Soldaten mitten in der Schlacht darin einschliefen. Das Kommando fand das nicht lustig.'
    onyxium_bulwark_helm: "Krabbenpanzer klappern leise im Kampf. Veteranen nennen es 'den Applaus'. Es ist kein Applaus."
    onyxium_caravanner_mail: 'Getragen von einem Aschenschatten, der Waren entlang der Verwerfungsstraßen transportierte und wegen des Geruchs nie überfallen wurde. Handelskarawanen beauftragen noch immer das Muster, wenn schon nicht die Quelle.'
    onyxium_cleaver: ''
    onyxium_conduit: 'Gekrönt mit einem lebenden Kweebec-Blatt, umwickelt mit Magmooligan-Holz. Summt, wenn man ihn ignoriert.'
    onyxium_crit_band: 'Gepresst aus dem noch heißen Kern eines Aschenschattens, gerade genug abgekühlt, um es ohne Reue zu tragen. Bleibt warm auf der Haut, auf eine Weise, die die Konzentration genau in den falschen Momenten schärft.'
    onyxium_crushfists: 'Gebaut, um einen Ansturm in einem Schlagabtausch zu beenden. Ein zweiter ist selten nötig.'
    onyxium_edge: ''
    onyxium_fortress_girdle: 'Aus dem Fell einer Kreatur, die zu faul war, um vor Gefahr zu fliehen, und stattdessen eine Rüstung entwickelte.'
    onyxium_fortress_plate: 'Aus Stammesrelikten von jemandem zusammengesetzt, dem Überleben wichtiger war als Zurückhaltung. Man sieht es.'
    onyxium_greathelm: 'Peripheres Sehen gegen ein Kinnstück eingetauscht, das fast alles aufhält.'
    onyxium_guardian_mace: 'Standardausgabe für die Grabwächter. Die Dellen überdauern den Träger.'
    onyxium_hatchet: ''
    onyxium_hauler_boots: 'Getragen von einem Aschenschatten, der Erz einen Hang hinaufschleppte, der eigentlich unbesteigbar war, während er die ganze Zeit schwelte. Ermüdet nicht. Raucht gelegentlich.'
    onyxium_iron_wall_grips: 'Die Schuppen biegen sich noch bei geballter Faust, als hätte der ursprüngliche Besitzer nie ganz losgelassen.'
    onyxium_ironfoot: 'Mit Koa-Essenz durchtränkt. Die Augen an den Schnallen folgen dir durch den Raum. Höflich.'
    onyxium_loadbearer: 'Aus Aschenschatten-Haut gegerbt, nach einem Verfahren, das Rauch, Geduld und ein praktisches Verständnis dafür erfordert, was eigentlich nicht mehr warm sein sollte. Trägt mehr Gewicht, als es aussieht.'
    onyxium_longbow: ''
    onyxium_packmule_grips: 'Fingerpanzer, abgeformt an einer glutschleppenden Aschenschatten-Vorderpranke: ein Kontinent, keine verlorene Glut. Was du hältst, bleibt gehalten, bis der Schatten losgelassen hätte.'
    onyxium_porter_legguards: 'Ein Jahrhundert kniete ein Aschenschatten vor derselben Esse; die Knieplatten tragen diese Abnutzung. Gut fürs Schleppen bergauf. Fürs Knien anderswo — nie wieder.'
    onyxium_sages_locket: 'Um den Nackenkamm eines Aschenschattens gewunden gefunden, nach Jahrhunderten noch warm. Es behält seine Weisheit für sich — deine gleich mit — und begleicht die Schuld in purer Zähigkeit.'
    onyxium_scholars_visage: 'Der Brauenwulst eines Aschenschattens, das offenbar viel nachdachte, nach dem Verschleiß des Wulstes zu urteilen. Hält den Träger in langen Ratssitzungen wach. Gelehrte beharren, es sei das Design. Es ist die Hitze.'
    onyxium_spirit_club: 'In seinem Kopf nistet ein Grabirrlicht. Es leuchtet nur, wenn in der Nähe etwas stirbt.'
    onyxium_striders: 'Ausgegeben an den, der den entferntesten Posten zieht. Der Rückweg ist länger als der Hinweg.'
    onyxium_trident: ''
    onyxium_war_signet: 'Verliehen, wann immer jemand den Appell unversehrt übersteht. Wechselt öfter den Träger, als es sollte.'
    onyxium_warbelt: 'Durch drei Feldzüge getragen und für einen vierten neu geschnallt. Das Leder erinnert sich an alle.'
    onyxium_warblade: 'Geschmiedet nach dem Muster, das der Klauenkamm eines Aschenschattens in erkaltender Lava hinterließ, was entweder brillantes Reverse Engineering oder ein Zufall ist, den niemand zweimal testen möchte.'
    onyxium_warchain: 'Jedes Glied trägt den Stempel eines Feldzugs. Niemand hat sie je alle gezählt.'
    onyxium_ward_ring: 'Das eingebettete Auge sieht Dinge, die es lieber nicht sehen sollte. Es hat eine Meinung zu deinen Entscheidungen.'
    onyxium_wargreaves: 'Verkratzt an der Stelle, wo man kniet. Der Sumpf fordert seinen Tribut von der Haltung.'
    onyxium_warplate: 'Ein volles Harnisch aus geborgenem Kriegsstahl. Anlegen kostet mehr Mühe als Ablegen.'
    orb_of_purity: 'Jede Mutter im Bleichwald warnt ihre Kinder vor der Kugel, die einen neu beginnen lässt. Ein Drücken, und man wird makellos, unschuldig und vollkommen ahnungslos wiedergeboren. Magische Amnesie bleibt Amnesie; sie hat nur bessere Manieren.'
    orchid_spore_blend: 'Gemahlene Orchideenblüten vermischt mit zerdrückten Sporen in einem Verfahren, das schlimmer riecht als das Ergebnis schmeckt.'
    origin_composite: 'Aus den ältesten Fasern des Berges zu etwas gepresst, das sich weigert, sich seinem Alter gemäß zu benehmen. Verdächtig federnd für ein Relikt.'
    origin_crest_of_world_wound: 'Mit der Linie gezeichnet, an der die Welt riss, damit der Träger nie vergisst, wo unten ist. Unten ist hier eine Richtung mit eigener Meinung.'
    origin_philter_of_world_wound_genesis: 'Vom Wundenorakel abgemessen, das die Dosis nie erklärt und sich damit noch nie geirrt hat. Vertrauen ist die einzige Zutat, die du beisteuerst.'
    origin_philter_of_world_wound_scar: 'Im Takt gemischt, den die Narben-Sänger halten, ein Maß je Zeile ihres Lieds, weshalb keine zwei Ansätze gleich schmecken und keiner je überstürzt wird.'
    ornate_bronze_legplates: 'Der Hornkopf, dessen Horn diese Beinschienen ziert, stürmte siebzehnmal, bevor der Schmied den Wink verstand. Der achtzehnte Angriff war der letzte des Hornkopfs und die Sternstunde des Schmieds.'
    ornate_bronze_plate: 'Dick. Dicht. Unnachgiebig. Wie das Horn des Hornkopfs und deine Persönlichkeit.'
    packrat_thinking_cap: 'Zusaetzliche Taschen im Inneren. Niemand im Showring fragt, was drin ist.'
    padded_boots: 'Extra Polsterung, wenn man auf Dinge tritt, auf die man nicht treten sollte — also im Grunde alles in dieser Welt. Hält die Füße dankbar still, während der Rest von euch zu Recht in Panik gerät.'
    padded_coif: 'So dick gepolstert, dass sie Schläge und Gedanken gleichermaßen dämpft. Sie bleiben ewig stehen und wissen nicht mehr, warum.'
    paragon_spellbook: ''
    parrot_hat: 'It is a parrot. On your head. It does not talk, which is somehow worse.'
    patchwork_trousers: 'Genaht aus was gerade herumlag. Jedes Bein hat eine andere Farbe. Mode oder Hilferuf?'
    patience_amulet: 'Der Slothian wartete hundert Jahre auf einen wuerdigen Besitzer. Technisch gesehen wartet er noch.'
    patience_charm: 'Glatt geschliffen von Jahrhunderten, in denen er waehrend Streitereien gehalten wurde, an denen er nie beteiligt war.'
    patience_club: 'Er bewegt sich langsam, so wie alles, was ein Slothianer tut, sich langsam bewegt, und schlägt ein, als hätte sich der Boden selbst entschieden, doch nicht länger zu bleiben. Niemand hat ihm je Eile vorgeworfen.'
    pearl_shard: 'Ein gesprungenes Perlenfragment aus dem Inneren eines Einsiedlerkrebspanzers. Für Juweliere etwas wert, für die Krabbe nichts.'
    pearl_shard_mace: 'Besetzt mit Krabbenperlen-Splittern. Jeder Treffer klingt wie ein Trauerwindspiel.'
    pearl_shard_pendant: 'Eine gesprungene Perle von einer Auster, die sich angeblich gewehrt hat. Der Sammler verlor zwei Finger und gewann gesunden Respekt vor Muscheln. Die Perle leuchtet schwach unter Wasser, was schön und völlig nutzlos ist, da man dort nicht atmen kann.'
    pebble_pendant: "Ein glatter Flusskiesel an einer Schnur. Der Juwelier nannte es 'minimalistisches Design'. Alle anderen nannten es einen Stein."
    pet_admin: ''
    pet_aloe_gaia: 'Eine medizinische Variante, die einen beruhigenden Saft absondert, der kleine Schnitte, Sonnenbrand und verletzten Stolz behandelt. Jeder Kratzer wird wie eine tödliche Wunde behandelt — sie schwebt ängstlich, bis ihre Sorge anerkannt wird. Der Saft schmeckt furchtbar, was sie für vorbeugend hält.'
    pet_amber_cactee: 'Riecht nach uralten Kiefernwaeldern und schlechten Lebensentscheidungen. Faengt gelegentlich Fliegen in seinem Harz.'
    pet_anorak: 'Die smaragdgrünen Runen, die in den Panzer dieser Spinne geätzt sind, pulsieren mit der gebundenen Essenz von Aragog, der großen Spinne, auf eine handhabbare Größe reduziert.'
    pet_arcane_gaia: 'Ein Gaia-Exemplar, das mit leuchtenden arkanen Runen beschrieben ist, die in Sequenzen pulsieren, die kein lebender Gelehrter zu entschlüsseln vermochte, obwohl mehrere konkurrierende Übersetzungen veröffentlicht haben, die von tiefgründigen kosmologischen Wahrheiten bis zu etwas reichen, das ein Inventarverzeichnis zu sein scheint. Es trägt Lasten mit der würdevollen Resignation einer Kreatur, die ahnt, für Größeres bestimmt gewesen zu sein.'
    pet_arcanite_cactee: 'Summt ein Schlaflied in Frequenzen die kleine Tiere einschlaefern und Zauberern Migraene bereiten.'
    pet_arcanize_bricheton: 'Runenmuster auf seiner Haut in Sequenzen identifiziert als antikes Getreide-Inventarsystem — Beweis, dass selbst Brichetons ihre Bücher führen, auch wenn ihre Buchhalter offensichtlich Zauberer waren.'
    pet_arisen_bouloute: ''
    pet_arisen_corbac: ''
    pet_arisen_lootbox: ''
    pet_arisen_modni: ''
    pet_arisen_timon: ''
    pet_barley_bricheton: 'Doppelt so groß wie der Weizen-Winzling und halb so bescheiden. Es wühlt durch die Gerstenreihen, als besäße es die Urkunde.'
    pet_blood_bricheton: 'Seine Augen färben sich nach Einbruch der Dunkelheit karmesinrot, und er nimmt reges, anhaltendes Interesse an Ihrem Puls. Heiler nennen diese Angewohnheit beunruhigend. Nekromanten nennen sie ein Kompliment und bestehen darauf, dass Sie das auch tun sollten.'
    pet_bloodstone_cactee: 'Seine Nadeln bleiben dauerhaft karmesinrot. Tieraerzte lehnen die Untersuchung grundsaetzlich ab.'
    pet_bouloute: ''
    pet_burnt_bricheton: 'Ein rußbedeckter Begleiter, der im Winter Wärme spendet und das ganze Jahr ein Versicherungsproblem darstellt. Versicherungsgesellschaften haben spezifische Klauseln entwickelt. Sie bleiben unzureichend.'
    pet_chomperion: ''
    pet_chromafin: ''
    pet_corbac: ''
    pet_cryofin: ''
    pet_cursed_bricheton: 'Der ultimative Begleiter des Bauern, ein Warzenschwein so durchtränkt mit landwirtschaftlichem Fluch, dass Ernten bei seinem Vorbeigehen welken. Paradoxerweise gedeihen Unkräuter prächtig. Das Universum hat Humor.'
    pet_cursed_gaia: 'Der ultimative Begleiter des Kräuterkundler-Berufs, ein Gaia, der so gründlich von verfluchter Pilzenergie durchdrungen ist, dass er ungebetene Kommentare über die Gewichtsverteilung des Inventars seines Besitzers in Sprachen murmelt, die vor der aufgezeichneten Geschichte liegen. Es ist ein unvergleichliches Lasttier, dessen Treue absolut ist und dessen nächtliches Flüstern laut denen, die längeren Besitz überlebt haben, etwas ist, das man irgendwann nicht mehr hört.'
    pet_cursed_gem_cactee: 'Murmelt duestere Prophezeiungen ueber Inventargewicht waehrend es treu dein Zeug traegt. Zerrissene Kreatur.'
    pet_deadmaw: 'Hades verleiht seine Hunde selten an Sterbliche, doch dieses versengte Untier trotzt nun treu an der Seite eines neuen Herrn.'
    pet_diamantine_cactee: 'Ein Kaktus, der einen Diamanten statt einer Blüte trieb. Er hat Ansichten über Druck, die meisten davon ungefragt.'
    pet_doris: ''
    pet_draconite_cactee: 'Strahlt Hitze aus wie ein Ofen mit Gefuehlen. Furchtbar fuer deine Ledertasche, wunderbar in kalten Naechten.'
    pet_draconize_bricheton: 'Ein beschupptes Warzenschwein, das dich ansieht, als waere es der Drache und du der Reinkarnationswitz.'
    pet_dragon_gaia: 'Imposant, schillernd, und nur eine schlechte Laune von einer Neugestaltung des Lagers entfernt.'
    pet_duskite_cactee: 'Alte Geschichte: In der tiefen Galerie erlosch einst eine Kerze und kehrte nie zurück — hier wuchs, was blieb. Perfekt, um mitten im Streit zu verschwinden. Gewonnen hat dadurch noch niemand.'
    pet_ensable_crayfish: ''
    pet_gaia: 'Ein Setzling mit gerade genug Geist, um es zu verübeln, getreten zu werden. Er merkt sich jeden Stiefel.'
    pet_heraklion: 'Der berüchtigte Skelettlord Nerak züchtete diese Hunde, um die Lebenden zu jagen; ihre hohlen Rippen hallen wider von einem Appetit, den selbst der Tod nicht stillen konnte. Eine Domestizierung bleibt... inadvisabel.'
    pet_ice_corgi: ''
    pet_ivory_gaia: 'Ein sanfter Geist der Erde, gebunden, die Schätze des Landes vor jenen zu hüten, die sie rücksichtslos plündern würden.'
    pet_jade_cactee: 'Bemerkenswert gelassen fuer einen wandelnden Kaktus. Meditiert zu unpassenden Zeiten wie im Kampf.'
    pet_jones: 'Bete, dass seine Gier nach Verehrung größer ist als die nach den Fingern seines Hüters.'
    pet_krinan: ''
    pet_lasgalen_rabbit: ''
    pet_lootbox: ''
    pet_malt_bricheton: 'Riecht permanent nach Gärung und trägt Waren mit dem unsicheren Gang einer Kreatur, die Gerste in ihrer gefährlichsten Form entdeckt hat. Das ist der Geruch von Engagement, sagt es sich.'
    pet_melted_koa: 'Gefunden zusammengerollt an einem erkaltenden Scheiterhaufen. Weigert sich, die Wärme zu verlassen.'
    pet_modni_lyk: ''
    pet_moonstone_cactee: 'Nur bei Vollmond und bewoelkten Dienstagen sichtbar. Niemand weiss warum Dienstage.'
    pet_moray: ''
    pet_nightcap_gaia: 'Eine nachtaktive Variante der Gaia-Art, die sich mit einem Enthusiasmus an ewige Dunkelheit angepasst hat, der an philosophisches Engagement grenzt, und die Besitztümer ihres Besitzers durch lichtlose Korridore trägt, während sie eine stille und umfassende Missbilligung jeder Entscheidung ausstrahlt, die zu dieser Vereinbarung führte.'
    pet_obsidianite_cactee: 'Jeder Stachel ist glasscharf und meint das mit voller Ernsthaftigkeit. Die alte Warnung auf seiner Kiste besteht aus einer Zeile, und diese Zeile stimmt: nicht umarmen.'
    pet_ocean_lootbox: ''
    pet_phacochere_son: 'Der Kümmerling des Wurfs, folgt seinem Elternteil überallhin, außer in tatsächlich gefährliche Situationen.'
    pet_phantom_gaia: 'Großmutter schwor, ihre Ziege liefe bei jedem Vollmond durch die Kellerwand und käme nach Sporen riechend zurück. Niemand glaubte ihr, bis die Ziegen es selbst taten. Diese hier zieht die Wand noch immer der Tür vor.'
    pet_quartz_cactee: 'A pale little cactus whose spines set into cloudy crystal. It hums quietly near ore veins, mostly to itself.'
    pet_radient: 'Ein urzeitlicher Jäger, dessen leuchtendes Fell mit der eingefangenen Essenz des Himmelslichts lodert.'
    pet_rock_koa: 'Fels-Koa: ein Koa, das „entwickle eine dickere Haut“ als wörtliche Konstruktionsvorgabe nahm — wiegt eine skandalöse Menge, sinkt wie ein Urteilsspruch, gewinnt jeden Starrwettbewerb rein geologisch.'
    pet_siluri: 'Der letzte einer uralten Blutlinie, dieses wettergezeichnete Geschöpf trägt die Last von Jahrtausenden auf seiner zeitgezeichneten Schale. Der Legende nach hat es den Säugetieren die ganze „Ausrottungs“-Sache noch immer nicht verziehen.'
    pet_suize_bricheton: 'Seine Kristallstosszaehne klingen im Wind, in einer Melodie, die jeder andere Bricheton sehr persoenlich nimmt.'
    pet_talokan_feu: ''
    pet_tanjirize_bricheton: 'Ein kupferfelliges Lasttier, das Gewürzhändler anzieht und persönlichen Raum auf eine Distanz zurückdrängt, die ungefähr den empfindlichsten Nasen der Gegend entspricht.'
    pet_timon: ''
    pet_tokeko: ''
    pet_truffle_gaia: 'Eine Gaia, deren Nase so weit ueber jedes vernuenftige Mass verfeinert wurde, dass sie Sie persoenlich beleidigend findet.'
    pet_ukranize_bricheton: 'Gezüchtet, so sagen die Hirten, aus einem Tier, das einst ein hungerndes Dorf drei Winter lang klaglos trug. Geklagt hat es seither nicht. Leicht gepackt hat es einen aber auch noch nie reisen lassen.'
    pet_vainquished: ''
    pet_velkarion_wyrmling: ''
    pet_wheat_bricheton: 'Von der ersten Ernte gemästet und überzeugt, jedes Korn verdient zu haben. Folgt dem Pflug und beurteilt die Furchen.'
    pet_wind_koa: 'Wind-Koa: ein Koa, so windschnittig, dass es gelegentlich vergisst zu bleiben — meist an einer Schnur angeleint, und es summt, wenn der Druck fällt, nur um damit anzugeben, recht gehabt zu haben.'
    pet_wither_gaia: 'Wo immer sie geht, ordnen sich die Blumen zu etwas an, das fast zu schön ist, um es Sterben zu nennen. Ein hingebungsvolles Lasttier, sofern man sich damit abgefunden hat, was sie einem Garten bis zur Teezeit antut.'
    pet_zot: ''
    phacochef_tusk: 'Ein kolossaler Hauer, beim erderschütternden Ansturm von Phacochefs Schädel abgesplittert. Mineralerzadern durchziehen das Elfenbein und summen noch immer vor seismischer Kraft.'
    phacochere_key: 'Aus einem Warzenschweinzahn geschnitzt und mit Schlamm versiegelt. Riecht genau so wie man es von einem Schweinedungeon-Schlussel erwartet.'
    phantom_distillate: 'Aus einem gefangenen Irrlicht gewonnen. Flackert ein und aus, ganz wie sein Ursprung.'
    phantom_essence: ''
    phantom_razors: 'So dünn, dass sie kaum existieren. Opfer bemerken den Schnitt erst, wenn sie versuchen etwas aufzuheben und merken, dass sie weniger Finger haben. Subtil bis zum Äußersten und absolut unehrlich.'
    phantom_spore: 'Halb in dieser Welt, halb dort, wohin Sporen gehen, die lieber unberührt blieben, gleitet sie durch unwürdige Finger wie ein Gerücht durch eine geschlossene Tür. Sie zu ernten verlangt einen leeren Geist — einen Zustand, den die meisten Kräuterkundigen nur durch Zufall erreichen.'
    piranha_amulet: 'Zaehne eines Fisches, der alles frisst, einschliesslich der Gefuehle seines eigenen Schwarms.'
    piranha_cleaver: 'Gezackt mit echten Piranhazähnen, offenbar noch immer überzeugt, dass alles vor ihm eine Mahlzeit ist. Um fair zu sein: Bisher hat es sich damit selten geirrt.'
    piranha_tooth: 'Klein, dreieckig, stets im Zweihunderterpack verkauft. Ein einzelner Piranha ist nie das Problem.'
    plague_fang: 'Ein gezackter Rattenzahn beschichtet mit etwas, das man wirklich nicht identifizieren möchte. Mit dicken Handschuhen anfassen. Dickeren.'
    plague_fang_signet: 'Der Juwelier, der diesen Fangzahn fasste, trug Handschuhe. Dann dickere Handschuhe. Dann eine Zange. Der Zahn nahm es offenbar persönlich.'
    plague_mace: 'Trägt ein schwaches grünes Leuchten und einen nicht schwachen grünen Geruch. Der Schmied trug Handschuhe. Und eine Maske. Und eine Entschuldigung.'
    plague_razmo_fang_blades: 'Reguläre Ungezieferklingen. Die Grabratten beißen zurück; diese beißen zuerst.'
    plague_treads: 'Jeder Abdruck verfaerbt sich binnen einer Stunde gruen. Der Plaguemo haelt das fuer eine Signatur, kein Symptom.'
    plaguefang_blade: 'Gehärtet in Extrakt, gewonnen aus einem Pestfang, mit einer Schneide, die eine Farbe angenommen hat, zu der Metallkundler starke, besorgte Meinungen haben. Sie schneidet einwandfrei. Die Nachsorge ist es, über die niemand reden möchte.'
    plaguemo_boots: 'Der Gerber, der diese Haeute gerbte, ueberlebte drei getrennte Seuchen und einen sehr peinlichen Ausschlag.'
    plaguemo_skullcap: 'Aus der eigenen Schaedelplatte des Plaguemo gefertigt, seltsamerweise der unbedenklichste Teil des Vorgangs.'
    plainsteel: 'Keine Gravur, kein Blattgold, kein cleverer Name, bis jemand anderes ihm einen gab. Der Stahl hat nie um Aufmerksamkeit gebeten.'
    pocari_sweat: ''
    polar_fortress_plate: 'So schwer gepanzert, dass Beweglichkeit zum philosophischen Konzept wird. Aber nichts dringt durch. Nichts.'
    polar_reaver_breastplate: 'Erbeutet von einem Plünderer, der den Sumpf für offenes Gelände hielt. War er nicht.'
    polar_reaver_greataxe: 'Die bevorzugte Waffe des Kapitäns. Niemand bleibt neutral, sobald sie schwingt.'
    polar_reavers_crook: 'Einst ein Hirtenstab, jetzt der eines Diebes. Die Schafe hatten Glück.'
    polishing_resin: "Kristallklare Beschichtung fur Schmuck und Feinmetallarbeit. Gibt allem den 'frisch vom Boss erbeutet'-Glanz."
    pollen_mote: 'Ein einzelnes Koernchen schwebenden Pollens, das sich nie ganz zur Landung durchringt.'
    practice_longsword: 'Ein stumpfes Ubungsschwert. Das einzige was es schneidet ist deine Wurde.'
    praetorian_oath: 'Geschworen, bevor das Banner fiel. Niemand hat ihn je aus dem Dienst entlassen.'
    preserving_oil: 'Verhindert dass organische Materialien sich zersetzen. Backer nutzen es fur frisches Brot. Nekromanten fur andere Dinge.'
    primal_catalyst: 'Endgame Universal-Reagenz das alle vier Elementaressenzen kombiniert. Erforderlich fur legendare Ausrustung aller Berufe.'
    primeval_codex: 'In Seiten gebunden, die älter sind als der Bruch selbst, das einzig bekannte Zeugnis dessen, wie der Zenit unversehrt aussah. Die Tiefen-Prüfer streiten seit Generationen über das letzte Kapitel.'
    primordial_band_of_first_dawn: 'Älter als der Finger, für den er gedacht ist, um ein Maß, das den Träger sich kurz und heilsam klein fühlen lässt.'
    primordial_bone: 'Aus der untersten Schicht des ältesten Grabhügels geborgen. Älter als jeder dort noch verzeichnete Name.'
    primordial_cleaver: 'Älter als die meisten Lehren, die es zu beenden half. Der Griff bleibt warm aus Gründen, die der Prophet, der es trug, nie erklärte und die der jetzige Besitzer nicht mehr hinterfragt.'
    primordial_draconize: ''
    primordial_lance: 'Eine uralte Waffe, älter als die meisten Zivilisationen. Immer noch schärfer als eine gewöhnliche politische Debatte.'
    primordial_legplates: 'Geborgen nach dem gescheiterten vierten Vorstoß. Der fünfte trug sie trotzdem.'
    primordial_poultice_of_first_dawn: 'Mit Moos gefüllt, das sich nur bei erstem Licht öffnet, sodass die Wunde darunter nach einem Zeitplan heilt, den die Sonne setzt und nicht du.'
    primordial_tonic_of_last_ascent_genesis: 'Aus dem ältesten lebenden Moos gezogen, das man je fand, das im Moment des Pflückens nachwächst und leicht verärgert wirkt, gebraut zu werden.'
    primordial_tonic_of_last_ascent_scar: 'Der billige Trank, am Fuß des Aufstiegs an jeden verkauft, der glaubt, eine Flasche mache den Berg kürzer. Tut sie nicht. Bei dem, was wehtut, hilft sie ein wenig.'
    primordial_totem_club: 'Geschnitzt von wem auch immer hier prophezeite, bevor die Zerreißung Prophezeiungen größtenteils überflüssig machte. Das Gesicht des Totems ist glatt gescheuert, weil es zu oft recht hatte.'
    primordial_treads_of_first_dawn: 'Aus Leder gefertigt, das älter ist als das Schusterhandwerk selbst. Sie knarren eine Sprache, und die Schuster, die sie übersetzen könnten, sind alle längst dahin.'
    primordial_trident: ''
    primordial_warblade_of_last_ascent: 'So oft neu geschmiedet, dass die Schmiede das Original unter den Reparaturen verloren. Was auch immer sie einst war, sie besteht nun ganz aus dem Willen, weiterzuschlagen.'
    primordial_worldpiercer: 'Das Letzte, was du vor dem Stufe-100-Tor fertigst, und das Erste, das es übersteht.'
    prisma_arcane_crown: 'Geschmiedet aus den Scheren einer Krabbe, die genau den falschen Erzmagier zwickte. Der Geist beschwert sich noch immer.'
    prisma_bastion_mace: 'Ausgegeben an den letzten, der die Linie hielt. Das war vor langer Zeit.'
    prisma_convergence_amulet: 'Jedes Glied ist eine eigene Aschenschatten-Glut, abgekühlt und verbunden von jemandem mit mehr Geduld als Verstand. Sie dazu zu bringen, im Gleichklang zu glühen, erfordert eine ganz besondere Art von Stille.'
    prisma_dual_plate: 'Zwei Halbplatten von zwei verschiedenen Aschenschatten, an einer Naht schmiedeverschweißt, die in kalten Nächten noch schwach glüht. Keine der Hälften erinnert sich, dem zugestimmt zu haben.'
    prisma_dual_sash: 'Zwei Aschenschatten-Häute übereinandergelegt, jede isoliert genau das, was die andere nicht kann. Die Überlappung bleibt warm genug, um Wäsche zu trocknen.'
    prisma_elementalist_grips: 'Die letzte Wärme eines Aschenschattens, ins Leder gefaltet, bevor sie ganz abkühlen konnte. Handflächen bleiben durch jeden Winter warm. Händeschütteln wird unangenehm.'
    prisma_ember_band: 'Noch lange nach der Schmiede warm. Kühlt nie ganz ab, wie alles hier.'
    prisma_emberstep: 'Hinterlässt bei jedem Abdruck eine leichte Versengung. Verblasst, bevor jemand auf die Idee kommt zu folgen.'
    prisma_flameguard: 'In den Gruben gebrannt, wo die Scheiterhaufenpriester die Toten verbrennen. Kühlt nie ganz ab.'
    prisma_flameheart_pendant: 'Unter der Rüstung getragen, nah genug, um den Scheiterhaufen durch die Platte zu spüren.'
    prisma_flamelegs: 'Am nächsten zu den Scheiterhaufengruben getragen. Der Saum hört nie auf zu rauchen.'
    prisma_gale_sash: 'Für das letzte Aufgebot gebunden. Die an jenem Tag verlesenen Namen stehen noch irgendwo verzeichnet.'
    prisma_gale_vest: 'Getragen bei der letzten Ablösung, bevor die Marschen verstummten. Sie schweigen noch immer.'
    prisma_hybrid_crown: 'Halb Kapuze, halb Krone, völlig unentschlossen, so wie sich die Silhouette eines Aschenschattens nie ganz auf eine Form festlegt. Die Unentschlossenheit ist tragend.'
    prisma_longsword: 'Baerenklauen als Parierstange, Sturmfedern in der Hohlkehle. Wunderschoen. Deiner Meinung vollkommen gleichgueltig.'
    prisma_mace: 'Mit Faengen besetzt und in gestohlener Wolle umwickelt. Verstaerkt jeden Groll hinter dem Schlag.'
    prisma_sabre: 'Fuer die Rudeljagd geschliffen. Allein ist sie nur sehr scharf; sie bevorzugt Gesellschaft.'
    prisma_spellbinder_sash: 'Mit demselben Signalcode wie die Handschuhe durchwoben. Liest sich schneller, als es sollte.'
    prisma_spellweave_gloves: 'Markiert mit dem alten Signalcode der Scheiterhaufenpriester. Die Finger sind schneller als das Lesen.'
    prisma_stormheart: 'Warmgehalten von dem, der den letzten Appell hielt. Schlägt noch immer im Takt, den sonst niemand hört.'
    prisma_stormlegs: 'Zugeschnitten für die letzte Kolonne, die die Linie marschierte. Sie kehrte nicht zurück.'
    prisma_tempest_ring: 'Getragen bei der letzten Ablösung, bevor die Posten verstummten.'
    prisma_tidal_treads: 'Gegossen in den Schloten, die ein Aschenschatten bevorzugte, um sich zwischen Patrouillen die Füße zu wärmen. Bleiben wochenlang heiß nach der Fertigung, was Schmiede als Feature führen und Träger als Beschwerde.'
    prisma_tide_signet: 'Geprägt mit dem, was bei einem Aschenschatten als Gesicht durchging, bevor das Feuer es fertig umgestaltete. Damit versiegelte Dokumente kommen mit einem schwachen Brandgeruch an. Empfänger fragen selten, warum.'
    prisma_tidewalker_legs: 'Geschnitten aus einem Aschenschatten, der so lange stillstand, bis der Boden seine Form auswendig kannte. Beweglichkeit sickert durch die Sohlen ab; Zähigkeit strömt nach. Rennen fällt aus dem Angebot.'
    prisma_windcrown: 'Verliehen an den, der den letzten Appell hielt. Niemand antwortete auf den letzten Namen.'
    prisma_windweave_grips: 'Getragen von Läufern, die Nachrichten zwischen den Grablinien überbrachten. Keiner von ihnen hörte je auf zu laufen.'
    prisma_zephyr_boots: 'Eingetragen von Läufern, die Nachrichten schneller trugen, als der Krieg voranschritt.'
    prismatic_saber: 'Ein Glutkern pulsiert im Knauf, geborgen aus einem Aschenschatten, der noch nicht fertig abgekühlt war, als der Schmied ihn erreichte. Wechselt die Farbe mit der Stimmung des Trägers, ob dieser will oder nicht.'
    pristine_malt: ''
    pyre_ash: 'Eine Kehrschaufel Kathedralenboden: Asche, Glasglitzer, und pro Schaufel ein verlorener Ohrring.'
    pyre_chain_girdle: 'Glieder warm im Ruhezustand, heiß im Kampf. Sie hält deine Hose und die Feinde auf Abstand.'
    pyre_channeler_staff: 'Von den Scheiterhaufenpriestern getragen. Die Asche legt sich nie ganz um ihn.'
    pyre_cleaver: 'Das im Knauf eingebettete Ascheherz halt die Schneide dauerhaft heiss. Toll fur den Kampf. Furchtbar fur Scheiden.'
    pyre_crown_fragment: 'Ein Stück des Kopfschmucks des Aschentyrannens. Strahlt Autorität und extreme Hitze aus. Anhänger bilden sich unwillkürlich in der Nähe.'
    pyre_handler_mitts: 'Genäht für den Brennofen des Chorglases. Halten Sie alles. Bereuen Sie nichts.'
    pyre_walkers: 'Sohlen dick genug, um Kohlenbetten in normalem Tempo zu überqueren. Normal, für diesen Posten.'
    pyrecleaver: 'Offiziell für Brennholz. Die Gemeinde geht sehr höflich daran vorbei.'
    pyreguard_cuirass: 'Getragen von denen, die dem Feuer am nächsten standen. Versengt, nie durchgebrannt.'
    pyrehymn_cuirass: 'Gebrannt, nicht geschmiedet. Sie kam aus dem Ofen und hatte deine Probleme schon satt.'
    pyrehymn_draught_of_cooling_vent: 'Aus dem Dampf eines abkühlenden Schlots abgefüllt. Schmeckt nach Mineralien und leiser Reue. Belebt trotzdem.'
    pyrehymn_gauntlets_of_ashen_song: 'Geschirrtücher fest ums Handgelenk gewickelt. Irgendwo vermisst eine Küchenschublade sie schmerzlich.'
    pyrehymn_girdle: 'Ein Band aus versengtem Leder, das ein Feuer an der Taille stoppt. Es hat mehrere gestoppt. Man sieht es.'
    pyrehymn_greaves_of_cooling_vent_choir: 'Aus erkalteter Schlacke gegossen, samt Fehlern. Die Fehler tragen jetzt Last, also lass sie.'
    pyrehymn_greaves_of_cooling_vent_pyre: 'Geschlitzt, um die Hitze nach unten abzuführen, sodass deine Stiefel die Last tragen und schweigen.'
    pyreward_diadem: 'Zu jeder Stunde warm an der Stirn. An dem Tag, an dem es kalt wird, lauf auch.'
    quartz: 'Ein truber Kristall der auf Frequenzen schwingt die nur eingebildete Alchemisten zu verstehen behaupten.'
    quartz_choker: 'Halskette aus poliertem Quarz, der Umgebungslicht einfängt und es nachts sanft zurückgibt. Nützlich als Nachtlicht. Nutzlos als Waffe. Einige Abenteurer benutzen es, um im Dunkeln zu lesen, was Grimoire-Verleger schätzen, aber Assassinen in der Dunkelheit nicht.'
    quartz_powder: 'Gemahlener Quarz gemischt mit Diamantstaub. Niesen in der Naehe wird dringend abgeraten.'
    quickbite: 'Drei Treffer in der Zeit, die man braucht, um den ersten zu bemerken. Die Fauna der Narbe wartet nicht mehr ab, um es herauszufinden.'
    quickstep_sash: 'Mehr Zierde als Schutz. Sieht aber beim Ausweichen fantastisch aus.'
    quillbound_cord: 'Es hält einer Prüfung kaum stand, eine Behauptung, die nie geprüft wurde.'
    quillweave_grips: 'Es funktioniert nach eigener Aussage angemessen, was der Träger einfach zu glauben beschlossen hat.'
    ramrage_sash: 'Gewoben aus Widderwut-Wolle. Nahezu unzerstörbar. Der Geruch hingegen ist ewig.'
    ramrage_waraxe: 'Ausbalanciert mit einem Ramrage-Horn-Gegengewicht. Balance ist relativ bei zwanzig Kilo Axtgewicht.'
    ramrage_warhelm: 'Verziert mit Wutwidderhoernern. Tueren werden zu einer echten Geduldsprobe fuer die Menge.'
    rangers_longbow: 'Langschwert der Ranger, poliert durch Jahre des Dienstes in dunklen Wäldern. Jeder Kratzer am Holz bezeugt einen Pfeil, der in die Dunkelheit geschossen wurde, ohne die Gewissheit zu treffen. Einige dieser Schüsse haben Leben gerettet. Andere haben nur Hirsche erschreckt. Beide zählen in den Regimentsarchiven.'
    raptor_bone_bow: 'Aus den eigenen Rippen eines Raptors geschnitzt, die noch die Form seines letzten wütenden Ansturms tragen. Jeder Pfeil verlässt die Sehne schnell, zornig und völlig unbeeindruckt von Ihrer Meinung dazu.'
    raptor_claw: 'Gebogen, rasiermesserscharf, und noch warm. Waffenschmiede schmieden daraus Dolche. Der Raptor benutzte sie als Dosenöffner.'
    raptor_hide_boots: 'Raptoren sind die Art der Natur zu sagen, dass alles in der Nahrungskette irgendwann Schuhwerk wird. Diese hier zucken noch, wenn sie Beute wittern.'
    raptor_javelin: 'Mit einer Raptorklaue bestückt, die bessere Tage gesehen hat. Und schlimmere Beute.'
    raptor_scale_greaves: 'Der Spenderraptor protestierte mit etwa sechzig Stundenkilometern. Er holte nicht wieder auf.'
    rat_bile: 'Extrahiert aus der Bosheitsdrüse der Ratte. Wissenschaftler bestehen darauf, dass diese Drüse nicht existiert. Die Ratten widersprechen.'
    rat_trousers: 'Ein Flickwerk aus Nagetierfellen, wobei jede Naht die Geschichte eines verzweifelten Kampfes unter den Stadtstraßen erzählt. Sie zu tragen ist der Beweis, dass die Würde das erste Opfer der Armut ist.'
    raven_beak: 'Hart wie Eisen und scharf wie Bosheit. Waffenschmiede befestigen diese an Flegeln. Der Rabe hatte andere Pläne dafür.'
    raven_coif: 'Der Archaeopteryx, der diese Federn verlor, hinterliess im Grunde ein Versprechen kuenftiger Rache.'
    raven_eye_pendant: 'In Bernstein und Kupfer gefasst, verleiht es die Geduld eines Falken und das Urteil eines Geiers.'
    raven_flight_bow: 'Befiedert mit Federn, die mitten im Sturzflug fielen. Die Pfeile wissen noch, wo unten ist.'
    raven_grips: 'Mit Feranpelz gefuettert und passend bekrallt. Die Feran haben dem Schneider nicht verziehen.'
    raven_hauberk: 'Feranfelle: ethisch fragwuerdig, strukturell tadellos und angeblich waschmaschinenfest, doch niemand hat es gewagt.'
    raven_trousers: 'Fell unten, Daunenfutter oben. Im Spiegel zutiefst befremdlich, in Bewegung irgendwie perfekt.'
    rawhide_belt: 'Ungegerbtes Leder das vage nach existenzieller Angst und nassem Tier riecht. Erstes echtes Projekt eines Gerbers.'
    razendril: 'Ein Rattenzahn, sorgfältig zu einer Klinge von überraschender Eleganz und Tödlichkeit geschliffen.'
    razlord_trophy_belt: 'Behängt mit Andenken von Dingen, die sie nicht mehr brauchten. Jede Saison schwerer.'
    razmaster_grudge: 'Abgenommen einer Grabratte, die eindeutig zuerst gebissen hatte.'
    razmaster_longsword: 'Der Razmaster legt alle Streitigkeiten gleich bei. Diese Klinge ist das Schlussargument.'
    razmo_bone_pike: 'Geschnitzt aus einem Razmo-Oberschenkelknochen. Die Bissspuren sind ein Merkmal.'
    razmo_pelt: 'Ein zerlumptes Rattenfell. Lederarbeiter nehmen es an, aber sie werden dich dafür absolut verurteilen.'
    razmoket: 'Der abgetrennte Schwanz einer gewöhnlichen Abwasserratte, der noch Spuren des Drecks trägt, den er durch feuchte Tunnel schleppte.'
    razord_fangblade: 'Um einen Fang geschmiedet, der sich jedem Einschmelzversuch widersetzte. Die Schmiede bauten schliesslich darum herum.'
    razord_skullcap: 'Razord-Federn fuettern das Innere, und die Meinungen des Traegers werden merklich schaerfer.'
    razorfang: 'Gefertigt aus den riesigen Reißzähnen von Abwassergeschöpfen, tragen diese ausgezackten Klingen den Fluch der Seuche.'
    reaver_visage: 'Reaver-Visier, geschmiedet, um Schrecken statt Schutz zu inspirieren. Es gelingt beides, jedoch in unterschiedlichem Maße, je nachdem, auf welcher Seite der Maske man sich befindet. Die Außenseite inspiriert Panik. Die Innenseite inspiriert leichte Klaustrophobie und unfreiwillige Meditation.'
    recurve_practice_bow: 'Der Recurve gibt Kraft. Die schlechte Handwerkskunst nimmt sie. Ergebnis: kaum besser als Steine werfen.'
    red_gaia: 'Vom Eisenlehm der Schlucht gefärbt und still stolz darauf. Sie weint einen roten Saft, den die Heiler für gewollt ausgeben.'
    red_orchid: 'Diese purpurrote Orchidee behält ihre lebhafte Farbe selbst nach längerem Backen, ihre Blütenblätter so dick wie gegerbtes Leder.'
    refined_solution: 'Ein gereinigtes alchemistisches Medium das sich aus reiner Sturheit weigert zu oxidieren.'
    reforged_ember: 'Geschabter Schwefel, bonbonrot und ungeduldig. Ein Streichen, keine Rückerstattung.'
    regalfall_breastplate_of_empty_seats: 'Es funktioniert, technisch gesehen, unter den meisten Bedingungen, was genauso beruhigend ist, wie es klingt.'
    regalfall_grips_of_empty_seats: 'Es funktioniert vorläufig, bis zur weiteren Prüfung, ein kleiner Trost, angesichts der Alternative.'
    regalfall_legguards_of_silent_court: 'Seine Garantie erlischt, sobald man es hinterfragt, ein Detail, das alle Beteiligten zu vergessen beschlossen haben.'
    regalfall_tonic_of_silent_court: 'Seine Wirkung setzt ein, oder auch nicht, unvorhersehbar, also formell gesehen auf eigene Gefahr zu trinken.'
    regalfall_warbelt_of_silent_court: 'Die Anleitung ging in einer hitzigen Debatte verloren, also wurde der ursprüngliche Streit für unentschieden erklärt.'
    regent_ore: 'Zwei getrennte Berichte beschreiben es widersprüchlich, was sich je nach Jahreszeit und Fragendem ändert.'
    regent_spellbook: ''
    reinforced_mitts: 'Metallnieten an den Knoecheln fuer Schutz und bedrohliche Aesthetik. Haendeschuetteln wird zum Statement.'
    relic_aragog: 'Die Mutter der Spinnen verlor diesen Zahn freiwillig — und mit freiwillig meinen wir, jemand hat ihn herausgebrochen, während sie einen besonders großen Abenteurer verdaute. Er tropft immer noch vor Gift, das eure Feinde ihre Lebensentscheidungen überdenken lässt.'
    relic_chairman: ''
    relic_dragon_fire: 'Der Drache starb vor Jahrhunderten. Der Zentralheizung hat es niemand gesagt. Irgendwo unter dem Kirchenschiff brennt es weiter nach Plan, und die Heizkörper klopfen vor jedem Gottesdienst zweimal.'
    relic_dragon_frost: 'Eine einzelne kristallisierte Träne, vergossen von einem Frostdrachen während einer emotionalen Meinungsverschiedenheit mit einem Gletscher. Sie schmilzt nie, wird nie warm und macht Getränke aus der anderen Raumseite unangenehm kalt. Alchemisten haben versucht sie zu untersuchen, doch ihre Instrumente frieren ständig ein.'
    relic_dragon_void: 'Einem Drachen entrissen, der so lange Leerenenergie konsumiert hatte, dass er vergaß wie Sonnenlicht schmeckt. Der Kieferknochen summt auf einer Frequenz, die Möbel sich selbst umstellen lässt und jeden in der Nähe plötzlich an jede peinliche Sache erinnert, die er je getan hat. Krieger berichten von deutlich mehr Stärke, aber auch deutlich mehr existenzieller Verunsicherung.'
    relic_duke: ''
    relic_ensable: 'Laeuft oefter rueckwaerts als vorwaerts. Keine Garantie, weder ausdruecklich noch stillschweigend.'
    relic_fenrik: ''
    relic_gobeline: 'Die Goblins verehren dieses Artefakt mit dem gleichen Eifer, den sie darauf verwenden, nicht gefressen zu werden – also: verzweifelt und ohne Würde.'
    relic_guardian: ''
    relic_koa: ''
    relic_kraken: 'Entnommen einem Leviathan, so alt, dass er sich an ein Meer anderer Farbe erinnert.'
    relic_magmalug: ''
    relic_nerak: 'Angeblich aus Neraks eigener Wirbelsäule geschnitten von einem Knochenhändler, der mitten im Satz zu Staub zerfiel — die überzeugendste Rezension, die der Hof je erhalten hat, wie man dort findet. Trage sie, und der Wind beginnt, dir Dinge zu erzählen. Am besten antwortet man nicht.'
    relic_pale_weaver: ''
    relic_past: 'Ein Echo aus einem vergessenen Zeitalter. Dieser Artefakt wurde einst im Schmelztiegel der Schöpfung geschmiedet, doch sein Schöpfer ist seither aus allen bekannten Reichen verschwunden. Geblieben ist nur ein leises Summen uralter Macht — ein Flüstern dessen, was einst war.'
    relic_phacochef: 'Aus dem Maul eines Ebers gerissen, der so stur war, dass er einmal einen Berg gerammt hat und gewann. Der Gestank allein verleiht seinem Träger übernatürliche Zähigkeit — oder vielleicht bleibt einfach jeder weit weg.'
    relic_ramrage: ''
    relic_razmo: ''
    relic_rex: ''
    relic_rrexn: 'Die Notizen des Schöpfers bestehen nur aus durchgestrichenen Ideen, und trotzdem gilt das immer noch als Erfolg.'
    relic_seraph: ''
    relic_wanilla: ''
    reset_spells_scroll: 'Enthält verbotenes Wissen so erschütternd, dass dein Gehirn einfach Gewalt wählte und dein gesamtes Betriebssystem löschte. Wenigstens wirst du endlich diese peinliche Bemerkung vergessen, die du im Wirtshaus gemacht hast.'
    resonance_band: 'Klingt von selbst, wenn der richtige Ton in der Nähe erklingt. Nützliche Warnung, außer die Note ist dein Begräbnis.'
    resonant_pike: 'Der Besenkopf war vor drei Jahrhunderten durch. Der Stiel verweigert den Ruhestand.'
    rex_bone_cuisses: 'Oberschenkelschützer, verstärkt mit Rex-Knochenplatten. Gehen ist Training. Laufen ist ein Wunschtraum.'
    rex_bone_signet: 'Ein aus Rex-Knochen gefertigter Siegelring. Ihn zu tragen bedeutet, der Welt zu verkünden, man habe einem Wesen getrotzt, das einen hätte verschlucken können — oder zumindest nah genug an der Leiche gewesen zu sein, um ein Stück mitzunehmen.'
    rex_fang: 'Ein Zahn länger als dein Unterarm. Der Rex der ihn wachsen ließ war sehr groß und sehr wütend. In dieser Reihenfolge.'
    rex_fang_claymore: 'Ein Rex-Alpha spendete seinen grossten Fang. Unfreiwillig.'
    rex_hunter_longbow: 'Speziell fur die Rex-Jagd entworfen. Die Testjager wurden nie wiedergesehen, aber der Bogen kam zuruck.'
    rex_jawbone_cleaver: 'Ein Beil aus dem Kieferknochen eines Rex Alpha. Die Zaehne an der Schneide sind original.'
    rex_jawbone_talisman: 'Ein aus dem Kieferknochen eines Rex gefertigtes Talisman. Träger berichten von gesteigertem Selbstvertrauen und geringerer Tavernenfrequenz — denn drinnen belästigt sie auch niemand mehr.'
    rex_knuckle_guards: 'Mit Rex-Reißzahnfragmenten an den Knöcheln verstärkt. Zuschlagen zählt jetzt als prähistorisch.'
    rex_ribcage_plate: 'Eine Rüstungsplatte, aus einer Rex-Rippe geformt. Der Knochen war breit genug, um einen ganzen Menschen zu bedecken — was viel über die Größe des Tieres aussagt und wenig Schmeichelhaftes über die Größe des Menschen.'
    rex_scale_breastplate: 'Schuppe fuer Schuppe von etwas geschaelt, das die Nahrungskette beherrschte und es wusste.'
    rex_sinew_belt: 'Ein aus Rex-Sehnen geflochtener Gürtel. Er reißt nicht — zumindest nicht, bevor Sie es tun. Das ist ein Versprechen der Widerstandsfähigkeit, das wenige Gürtel zu geben wagen und noch weniger halten können.'
    rex_stompers: 'Mit Rex-Knochen verstärkt. Jeder Schritt klingt wie ein kleines Erdbeben. Zurückhaltung war nie der Plan.'
    rex_tooth_talisman: 'Verleiht angeblich Mut. Meistens nur einen dauerhaften Nackenkrampf.'
    rift_torn_band_of_split_sky: 'Besetzt mit einem Splitter der abgestreiften Schale eines Riftlings, noch schwach warm von einer Häutung, die vor Wochen endete. Fängt das Licht absichtlich falsch ein, genau wie das Wesen, das sie wachsen ließ.'
    rift_torn_breastplate_of_split_sky: 'Wehrt den Sturm ab, die meisten Klingen und exakt nichts vom existenziellen Schwindel.'
    rift_torn_crusher_of_torn_ground: 'Trägt einen Groll nach, so wie die Schale eines Riftlings einen Riss trägt: langsam, dann auf einmal, dann dauerhaft. Schläge bergab werden empfohlen. Schläge bergauf sind technisch auch möglich.'
    rift_torn_extract: 'Sickert in langsamen Tropfen aus dem zerrissenen Boden. Sammle es geduldig oder gar nicht.'
    rift_torn_grips_of_torn_ground: 'Wenn der Boden unzuverlässig wird, lernt man zuzugreifen. Diese greifen zurück.'
    rift_torn_legguards_of_torn_ground: 'Geborgen aus einer Riftling-Häutung, die nie ganz aushärtete. Biegt sich in Winkeln, die ein Knie nicht sollte, und das ist der Sinn — der Boden hier bleibt nie lange genug flach, um zu widersprechen.'
    rift_torn_tonic_of_torn_ground_faultline: 'Ein Kraftschub, der zuschlägt wie der Boden, der dir entgegenkommt, was er auch könnte.'
    rift_torn_tonic_of_torn_ground_void: 'Leeremotten säumen ihre Baue mit etwas, das nicht ganz Staub und nicht ganz Licht ist. Destilliert füllt es den Magen und leert den Kopf, in dieser Reihenfolge.'
    rift_torn_twin_knives_of_torn_ground: 'Zwei Klingen, gewachsen aus derselben Riftling-Häutung, die noch immer streiten, welche das Original ist. Die Lücke zwischen ihnen ist genau der Punkt, an dem der Plan eines Gegners aufhört zu passen.'
    riftsteel: 'In der Naht geschmiedet, wo zwei Welten mahlen. Es erinnert den Druck und trägt Groll.'
    riftsunder_blade: 'Der erste Schlag ist höflich. Über die nächsten vier werden deine Rippen reden wollen.'
    riftsunder_cleaver: 'Teilt, was auch immer es trifft, in ein sauberes „Vorher“ und „Nachher“, genau wie der Riftling, nach dem es benannt ist, sich von seiner eigenen Häutungslinie trennte. Ein „später“ gehört selten zum Ergebnis.'
    riftsunder_cuirass_of_widening_crack: 'Vorne verläuft eine Naht, die jede Saison um Haaresbreite wächst und demselben Riss folgt, der den Riftling spaltete, von dem sie stammt. Niemand hat es dem Träger noch gesagt. Jemand sollte.'
    riftsunder_draught: 'Gewonnen aus dem Hohlraum eines Riftling-Knochens, hohl, weil der Riftling, strukturell gesehen, nicht ganz fertig existiert. Eine Dosis kauft eine klare Entscheidung.'
    riftsunder_extract: 'So tief aus der Verwerfung gezogen, wie ein Seil und ein tapferer Idiot reichen.'
    riftsunder_fangs: 'Kleine Wunden. Viele davon. Das Ausbluten übernimmt die Verhandlung.'
    riftsunder_helm_of_last_tremor: 'Das letzte Beben, das ein bestimmter Riftling je auslöste, hinterließ ein Summen in diesem Schalenhelm, das seither nicht verblasst ist. Überdauert das Gehör. Dann, vermutlich, überdauert es dich.'
    riftsunder_lattice: 'Eine erstarrte Steinwelle, mitten im Einsturz gefangen. Wirkt vorläufig. Wirkt seit Jahrhunderten so.'
    riftsunder_ration: 'Gebacken nach dem Rezept, das eine Kompanie Zerschlagener Soldaten befolgte, bevor die Kompanie aufhörte, vollständig zu sein. Dicht genug, um als Waffe zu dienen. Manche taten es.'
    riftsunder_ration_of_last_tremor: 'Was auch immer ein Riftling zwischen den Häutungen isst, getrocknet und zu Riegeln gepresst. Hält sich jahrelang. Schmeckt wie das Innere einer sehr alten Schublade.'
    ring_of_the_worldeater: 'Aus einer Fassung gebrochen, die zu groß für einen Finger ist, und trotzdem getragen, an einer Kette. Der Weltenfresser verschlang sieben Welten, bevor jemand prüfte, ob er einfach nur hungrig war. Seither hat es niemand mehr geprüft.'
    ringfast: 'Lässt sich nicht abnehmen. Das wurde jedem Käufer vor dem Kauf deutlich erklärt. Die meisten kaufen ihn trotzdem.'
    riven_casque: 'Mit Rabatt verkauft, weil das linke Drittel fehlt. Richte deine Feinde entsprechend aus.'
    riven_charm: 'Sauber entlang derselben Linie gerissen, an der die Schale eines Riftlings bei der ersten Häutung reißt, und ebenso als Glücksbringer angesehen. Die Logik reist schlecht außerhalb dieser Welt. Hier ist sie Gesetz.'
    riven_chausses_of_long_collapse: 'Die halb gehäuteten Beine eines Riftlings, mitten im Einsturz erwischt, noch immer im Winkel des Sturzes gebogen, der ihm den Rest gab. Träger berichten vom gleichen Knie, das nachgibt, pünktlich, für immer.'
    riven_longsword_of_long_collapse: 'Hier ist Schwerkraft nur ein Vorschlag, ein Abwärtsschlag braucht etwa eine Woche. Nimm Proviant mit.'
    riven_saber_of_screaming_rift: 'Geschnitten aus der eigenen abgetrennten Gliedklinge eines Riftlings, die noch immer schwach auf der Frequenz des Risses klagt, aus dem sie stammt. Gerichtsmediziner beschreiben das Geräusch beim Aufprall als „wenig hilfreich“.'
    roadworn: 'So oft die Pilgerstraße gegangen, dass das Leder vergaß, je neu gewesen zu sein. Es erinnert sich an jede Meile seither.'
    root_cellar_key: 'Er klappert in einem kalten Luftzug, den kein Keller hervorbringen sollte. Der Kellerschlund hat hundert davon geprägt; ein Schloss brauchte er noch nie.'
    roothold_treads: 'Du wirst nicht von der Stelle bewegt. Nicht weil du nicht könntest. Weil du nicht willst.'
    rotted_flesh: 'Einen Zombie häuten ist einfach. Der Geruch hält wochenlang. Deine Gruppenmitglieder werden diesen Verrat nicht vergessen.'
    rough_mitts: 'Dicke Lederfaeustlinge die Geschicklichkeit fuer Waerme opfern. Ein Schwert greifen ist jetzt Mannschaftssport.'
