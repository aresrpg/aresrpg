  finish: Abschließen
  fight_enter: Kampf betreten
  reset_title: Tutorials
  reset_hint: Zeigt jede Einführung beim nächsten Besuch der jeweiligen Seite erneut.
  reset_action: Zurücksetzen
  world_compass_title: Welten und geteilte Zonen
  world_compass_body: AresRPG enthält mehrere Welten, die du im Verlauf freischaltest. Jede Welt ist in Zonen mit Monstern, Ressourcen und Dungeons unterteilt. Jeder kann eine Zone entdecken, und diese Entdeckung wird mit allen Spielern geteilt.
  world_hud_title: Leben und Schnellplätze
  world_hud_body: Dieses HUD zeigt dein Leben und deine Schnellplätze für Gegenstände. Sobald ein Kampf beginnt, wird derselbe Bereich zu deiner Zauberleiste.
  world_fps_title: Deine Weltsteuerung
  world_fps_body: Das Gelände wird deterministisch aus veröffentlichten Daten erzeugt. Sui speichert die Welt und die verbindliche X/Z-Position, während das Gelände die Höhe lokal ableitet. Flach verändert daher nur die Darstellung. Hier kannst du außerdem die Qualität ändern und Weltkämpfe auf Gruppenmitglieder beschränken.
  world_character_title: Spieler in der Welt
  world_character_body: Das ist dein aktiver Charakter. Klicke mit der rechten Maustaste auf einen Charakter in der Nähe, um die verfügbaren Interaktionen zu öffnen.
  world_character_tabs_title: Spiele mehrere Charaktere
  world_character_tabs_body: Du kannst bis zu sechs Charaktere besitzen. Lade deine anderen Charaktere in eine Gruppe ein und aktiviere Gruppenfolge, damit sie mitreisen und geeigneten Weltkämpfen bei ihrer Ankunft automatisch beitreten.
  fight_title: Dein erster On-Chain-Kampf
  fight_body: Kämpfe sind rundenbasiert. Wähle Bewegung und Zauber, und deine Aktionen werden gemeinsam vorbereitet. Runde beenden übermittelt den vollständigen Zug als eine Sui-Transaktion und berechnet die folgenden Monsterzüge, bis wieder ein Spieler handeln kann. Der verbindliche Kampfzustand wird vollständig auf Sui abgewickelt. Nach dem Sieg nutzt eine letzte Sui-Transaktion On-Chain-Zufall, um die gemeinsame Beute auszuwürfeln und jede Belohnung dem zugewiesenen Inventar hinzuzufügen.
  equipment_gear_title: Ausrüstung
  equipment_gear_body: Ausgerüstete Gegenstände gehören zum ausgewählten Charakter. Ziehe Ausrüstung auf die Figur, prüfe die neuen Boni und bestätige anschließend alle Änderungen gemeinsam.
  equipment_inventory_title: Geteiltes Inventar
  equipment_inventory_body: Dein Inventar wird von allen Charakteren dieses Kontos geteilt. Wähle oben einen anderen Charakter, um ihm dieselben verfügbaren Gegenstände anzulegen.
  stats_title: Eigenschaften
  stats_body: Verteile Eigenschaftspunkte, um stärker zu werden. Vitalität erhöht Leben, Weisheit verbessert XP und Widerstand gegen AP/BP-Verlust, Chance verbessert Wasserschaden und Beutechance, und Agilität verbessert Luftschaden, kritische Treffer, Fesselung und Flucht.
  spells_title: Zauber
  spells_body: Neue Zauber werden mit dem Fortschritt deines Charakters freigeschaltet. Stufenaufstiege gewähren Zauberpunkte, die du hier zum Verbessern freigeschalteter Zauber ausgeben kannst.
  jobs_title: Berufe
  jobs_body: Verfolge Sammel- und Handwerksfortschritt, prüfe Rezepte und stelle verfügbare Gegenstände her. Bei mehreren Charakteren kannst du diese Seite in den Einstellungen auf einen festen Handwerker sperren.
  runeforge_title: Runenschmiede
  runeforge_body: Ab Berufsstufe 70 kann der passende Handwerksberuf Ausrüstung mit Runen verbessern. Runen erhältst du durch das Zerstören von Gegenständen und kannst sie hier anwenden.
