welcome_body: AresRPG ist ein vollständig On-Chain-MMORPG mit einer spielergesteuerten Wirtschaft. Erstelle deinen ersten Charakter, betrete die Welt und finde Monster zum Kämpfen.
welcome_need_sui: Du brauchst etwas SUI zum Spielen — dein erster Charakter kostet {{price}} SUI, und mindestens {{fee}} SUI müssen für Gebühren in deinem Guthaben bleiben. Zahle etwas SUI auf deine Adresse unten ein, um zu beginnen.
