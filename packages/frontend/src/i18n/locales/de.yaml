    rune_wisdom_ra: ''
    runic_blade: 'Runen laufen die ganze Klinge entlang, und keine zwei Gelehrten sind sich einig, was sie bedeuten. Der Verzauberer beharrt, es sei ein alter Dialekt. Der Schmied beharrt, es sei bloß eine Verzierung, die ihm gefiel. Die Klinge selbst hat niemand gefragt.'
    runic_grimoire: 'Die Hälfte seiner Seiten enthält echte Zauber. Die andere Hälfte sind Beschwerden über Magier, die sie ständig falsch machten, an den Rand gekritzelt von einer Hand, die im Kult niemand zuzugeben bereit ist zu erkennen.'
    runic_ink: 'Biolumineszente Tinte die magische Ladung behalt. Von Handwerkern benutzt um funktionelle Runen einzuschreiben.'
    runic_warden_blade: 'Kweebec-Runen leuchten bei Daemmerung am schwaechsten, genau wie einst der Zeremonienspeer, aus dem dies geschmiedet wurde.'
    rustshore_cutlass: 'Eine Seemannsklinge, die weit mehr Wirtshausschlaegereien als Seeschlachten erlebt hat.'
    rusty_daggers: 'Der Tetanus ist ein Feature kein Bug. Jeder Treffer kommt mit kostenlosem Infektionsrisiko.'
    sabertooth_axe: 'Der Fangzahn ist die Klinge. Der Griff ist nur fuer die moralische Unterstuetzung da.'
    sabertooth_fang: 'Laenger als ein Dolch. Schaerfer als die meisten Konter. Die Katze brauchte ihn nicht mehr.'
    salve_biscuit: 'Halb Brot, halb Verband. Alchemisten zerbroeseln ihn zu Heilpaste. Schmeckt nach Medizin, wirkt wie ein Wunder.'
    sandwraith_legplates: "Knochenweiße Platten, die in einer Wüstengruft neben einem Zettel auftauchten: 'NEHMT SIE UND GEHT.' Niemand weiß, wer den Zettel hinterließ. Niemand will es herausfinden. Der Sand, der ständig aus den Gelenken rieselt, stammt aus keiner bekannten Wüste, und Fegen ist zwecklos — er erscheint morgens wieder."
    sandwraith_reaper: 'Halb vergraben aus den Dünen gezogen. Der frühere Besitzer wurde deutlich vergrabener gefunden.'
    sapling_bark: 'Von einem Kweebec-Setzling geschält. Es formte sich selbständig zu Rüstungsplatten. Selbst tot hat dieses Holz Ambitionen.'
    sapling_bark_boots: 'Das Holz lebt technisch gesehen noch — und ist technisch gesehen noch immer wuetend darueber.'
    sapling_channeler: 'Geschnitzt aus einem Schössling, der noch nicht entschieden hatte, was er werden wollte. Die Kweebecs betrachten den ganzen Stab als Geiselnahme. Sie betrachten ihn als Waffe. Ganz unrecht hat keiner von beiden.'
    sash_of_the_void_emperor: 'Die größte je erfasste Leeremotte trug dies in ihre letzte Häutung und kam nie wieder heraus. Was sie in dieser Schale ersetzt hat, wurde noch nicht katalogisiert, und die Katalogisierer haben es nicht eilig.'
    saurian_bow: 'So straff bespannt, dass es etwas erlegt, das bis vor kurzem noch aktiv Jagd auf dich machte.'
    saurian_fang: 'Genug Griff, um eine zappelnde Mahlzeit zu halten. Genug Biss, um das Zappeln zu beenden.'
    saurian_gauntlets: 'Beschuppte Knoechel, Lagerfeuergeruch inklusive. Der vorherige Besitzer hat dem Upcycling NICHT zugestimmt.'
    saurian_greataxe: ''
    saurian_ripper: 'Aus Knochen geschnitzt, der noch warm genug ist, um die Schmiede nervoes zu machen.'
    saurian_scale: 'Dick, schillernd, und trägt leichte Feuchtigkeit. Rüstungsschmiede verweben sie in aquatische Platten. Chemische Reinigung nicht empfohlen.'
    saurian_scale_helm: 'Die alten Echsenkönige verstanden nie, warum kleinere Völker sich mit Helmen abmühten — ihr eigener Schädel durchbrach mühelos eine Mauer. Sie nahmen an, wer einen trug, wollte einfach angeben. Die Sage gibt zu: ganz falsch lagen sie damit nicht.'
    saurian_staff: ''
    saurian_throwing_spear: 'Mehr durch den Instinkt der Triftschlange ausbalanciert als durch Handwerk. Einmal geworfen, korrigiert er selbst seine Bahn.'
    saurian_war_axe: ''
    saurian_war_harness: 'Zurechtgestutzt aus einem Harnisch, gebaut für einen Saurier drei Größen über jedem Träger seither, während der Rüstmacher unentwegt über Handwerk und Würde schimpfte. Sie trägt noch einen schwachen Hauch eines Reviers, das niemand zurückzuerobern gewagt hat.'
    saurian_war_horn: 'Aus einer Kehle geschnitzt, die seit zehntausend Jahren nicht mehr geatmet hat. Um 3 Uhr morgens immer noch zu laut.'
    saurian_waraxe: 'Geschliffen im Winkel, den die Steinkönige bevorzugten, bevor sie unter den Tiefen einschliefen — sie soll sich an alte Rechnungen besser erinnern als an neue. Sie hat feste Meinungen zu Schädeln. Wen man dazu befragen könnte, hat noch niemand gefunden.'
    scale_mail_gauntlets: 'Jede Schuppe wurde einem Raptor entrissen, der lautstark und ausfuehrlich protestierte.'
    scale_plate: 'Eine dicke Reptilienschuppe so groß wie ein Teller. Rüstungsschmiede lieben es. Der Raptor ist weniger begeistert von der Vereinbarung.'
    scaled_hide: 'Winzige überlappende Schuppen, die das Licht fangen. Lederarbeiter nähen dutzende zusammen. Es ist mühsam. Sie klagen.'
    scar_iron: 'Eisen, direkt aus dem freigelegten Gestein der Narbe gebrochen, das noch die Kälte der Tiefe trägt, aus der es stammt. Schmiede lassen es erst warm werden, aus Respekt und leichter Selbsterhaltung.'
    scar_maul: 'Aus Narbengestein gebrochen, schwer genug, dass ihn zu schwingen sich anfühlt wie das letzte Argument, das die Wunde je zu hören braucht.'
    scar_sigil_amulet: 'Mit demselben Siegel geprägt, das die Narben-Sänger in die Bruchwände ritzen, um abzuwehren, was immer die Wunde wieder heraufschickt.'
    scar_suture_daggers: 'Den Ritualklingen der Nahtpriester nachgebildet, dünn genug, um eine Wunde zu schließen oder eine zu öffnen — je nach Winkel. Die Priester beteuern, es sei stets das Erstere.'
    scarab_cleaver_axe: 'Wie ein Fluegel geformt. Fliegt genauso gut, wie sich die anderen Versprechen des Haendlers hielten.'
    scarak_chitin_belt: 'Käferplatten, die ineinandergreifen wie ein Rätsel, gebaut von einem Insekt ohne Hobbys und ohne Freunde. Er schnürt sich selbst, gehorcht noch dem letzten Befehl des Schwarms: pressen.'
    scarak_cleaver: 'Der Scarak-Schwarm hielt drei Ratsversammlungen ab, um dies zurueckzuholen. Alle drei scheiterten.'
    scarak_crown: 'Einen Scarak-Kopf auf dem eigenen Kopf tragen. Da steckt eine philosophische Rekursion drin, über die die Scaraks definitiv nicht nachgedacht haben.'
    scarak_overlord_ring: 'Standardausgabe für die Grabwächter. Läuft nicht an; nichts läuft in den Grabhügeln an.'
    scarak_shell: 'Chitinplatte, die klickt wenn man sie schnippt. Macht ordentliche Dachschindeln. Die Königin wäre wütend, hätte sie Emotionen.'
    scarak_shell_plate: 'Chitinplatten, geerntet während der Häutungssaison. Die Scaraks waren wütend, aber technisch gesehen auch nackt, was ihrem Protest die Autorität nahm.'
    scarak_stinger: 'Direkt aus einem Scarak gezogen und auf einen Stock gesteckt. Zuckt noch.'
    scarforged_alloy: 'Auf der eigenen Hitze der Narbe zusammengeschlagen, die die Schmiede sorgsam einteilen — die Narbe heizt nicht auf Verlangen nach.'
    scarforged_grips_of_first_dawn: 'Im Kälte gehärtet, die sich bei Morgengrauen am Grund des Bruchs sammelt. Die Kälte weicht nie ganz, was der Träger sich abgewöhnt zu bemerken.'
    scarforged_legguards_of_last_ascent: 'Auf dem Ambossstein der Narbe selbst flachgeschlagen, was der Platte eine leichte Welle lässt, die kein Polieren herausbekommt. Niemand versucht es mehr.'
    scarforged_resin: 'Saft, über Narbenhitze eingekocht, bis er glasig aushärtet und eine Naht besser hält als die meisten Metalle. Er riecht, schwach und für immer, nach dem Feuer, das ihn schuf.'
    scarforged_tonic_of_last_ascent: 'Für den letzten Vorstoß in einer einzigen Schluckration pro Kletterer ausgegeben, mit der Begründung, dass, wer einen zweiten Schluck braucht, den Aufstieg ohnehin nicht beendet.'
    scarforged_visor_of_first_dawn: 'So geneigt, dass es das erste Licht einfängt, das je die Narbe überquerte — ein Licht, das laut den Schmieden anders sei. Widerlegt hat sie niemand, hauptsächlich weil ihnen niemand irgendetwas bewiesen hat.'
    scarforged_warbelt_of_last_ascent: 'Mit einer Schnalle geschlossen, aus dem Rand der Narbe geschnitten, weshalb er nie ganz bündig schließt. Der Spalt ist klein, und er ist immer da.'
    scarguard_helm: 'Standardausrüstung für jeden, der an der letzten Mauer Wache steht, das Visier so geneigt, dass der Träger die Wunde nie zu lange direkt ansehen muss.'
    scarhewn_axe: 'Aus der zerbrochenen Wand der Narbe selbst geschlagen, die Schneide so zackig belassen wie die Bruchlinie es ist. Sie schneidet, als hätte die Welt den Widerstand längst aufgegeben.'
    scarwalk_leggings: 'Von Pilgern dünn getragen, die den Rand der Narbe öfter abgeschritten haben, als die Beinlinge, ehrlich gesagt, gebaut waren.'
    schism_cuirass_of_last_tremor: 'Abgeschreckt an dem Tag, als die Linie eines Zerschlagenen Soldaten endlich, formell, zum letzten Mal aus der Reihe brach. Das Metall hörte an diesem Nachmittag auf zu klingen. Seitdem gab es keinen Laut mehr.'
    schism_gauntlets_rift: 'Der linke Handschuh erinnert sich an den Griff eines Zerschlagenen Soldaten um einen Schild, den es nicht mehr gibt. Der rechte Handschuh hat nie etwas gehalten. Träger bevorzugen unbewusst eine Seite.'
    schism_gauntlets_void: 'Die Finger werden nie richtig warm. Gut fürs Gemüt, schrecklich zum Händeschütteln.'
    schism_girdle_of_widening_crack: 'Von einem Quartiermeister der Zerschlagenen Soldaten so konstruiert, dass er nach dem Zerbrechen weiterfunktioniert, was entweder brillantes Design oder ein sehr trauriger Kommentar zu Erwartungen ist. Vermutlich beides.'
    schism_greaves: 'Linke und rechte Beinschiene wurden aus zwei verschiedenen Zerschlagenen Soldaten geschmiedet, die nie in derselben Ära dienten. Sie sind sich über die Marschordnung noch immer nicht ganz einig.'
    schism_resin: 'Quillt aus einem Stein, der sich spaltete und keiner Hälfte je verzieh.'
    schism_sabatons_rift: 'Die Leere sickert durch die Sohlen hoch. Träger melden warmes Herz und unerträgliche Zehen.'
    schism_sabatons_void: 'Beschwerte Sohlen, damit die dünne Schwerkraft dich nicht mitten im Schritt fortträgt.'
    schism_signet_of_last_tremor: 'Hörte auf zu summen, in dem Moment, als das letzte Beben eines Riftlings in seiner Schale erstarb. Jetzt liegt er nur noch kalt auf der Hand, was der vorherige Träger beunruhigender fand, als das Summen es je war.'
    schism_signet_of_widening_crack: 'Die Gravur wird jedes Jahr um ein Haar länger und folgt derselben sich verbreiternden Linie, die das ursprüngliche Rangabzeichen des Zerschlagenen Soldaten spaltete. Juweliere lehnen eine zweite Begutachtung ab.'
    scorch_grimoire: 'Der Einband ist angesengt. Der Inhalt ist schlimmer. Wer Kapitel drei laut vorliest, verliert seine Augenbrauen.'
    scorched_loaf: 'Absichtlich verkohlt, und wag es nicht, etwas anderes anzudeuten. Dieser Biss ist der ganze Sinn, nicht die Schande eines Bäckers.'
    scorchtouch_grips: 'Alles, was du beruehrst, wird waermer. Haendedruecke sind zum diplomatischen Zwischenfall geworden.'
    scrap_battleaxe: ''
    scrap_cuirass: "Aus geborgenen Metallplatten gehammert. Die Luecken sind 'Belueftungsmerkmale' laut dem Schmied. Sicher."
    scrawled_tome: 'Schwimmend im Ertrunkenen Kirchenschiff gefunden, die Tinte noch feucht von dem, was die Kahnfahrer als ein Jahrzehnt unter Wasser beschwören. Niemand hat die letzte Seite übersetzt; die ersten drei genügten als Abschreckung.'
    scythe_of_the_abyss: 'Wenn der Abgrund eine Waffe reicht. Überraschend guter Kundenservice.'
    sealed_core: 'Ein Kern, um ein Genesis-Fragment geschmiedet und versiegelt, wie das Orakel eine Wunde versiegelt — fest und mit einem schriftlichen Vermerk, der vom Öffnen abrät.'
    senshi_starter_sword: 'Es ist ein Stock. Du hast einen Griff drangeklebt. Du verarschst damit niemanden, am wenigsten die Goblins, die ihren Kumpels garantiert davon erzählen werden.'
    sentinel_gorget: 'Schützt den Hals. Eine überraschend unterschätzte Überlebensstrategie.'
    sentinel_teeth: ''
    sentinel_tooth: 'Man fragt sich, welche Art von Narr sich einem Krokodil nähert, um um seine Zähne zu ringen, und doch sind wir hier.'
    seraph_chain: 'Es wurde mit geteilter Entscheidung genehmigt, was die durchgestrichene Garantieklausel erklärt.'
    seraph_heart_pendant: 'Dieses Amulett macht sich selbst rückgängig mit stiller Beharrlichkeit. Es ist gleichzeitig hier und anderswo, getragen und verworfen, real und umstritten.'
    seraph_lance: 'Der Schöpfer ist sich immer noch nicht sicher, ob es richtig fertig ist, was die durchgestrichene Garantieklausel erklärt.'
    seraph_petal: 'Ob es ein oder mehrere Materialien sind, ist noch ungeklärt, und der Bericht wurde trotzdem eingereicht, samt Vorbehalten.'
    seraph_plume: 'Seine Reinheit wird auf einer verhandelbaren, gleitenden Skala bewertet, also listet das Register beide einfach nebeneinander auf.'
    seraphbound_casque_of_falling_crown: 'Es hält einer Prüfung kaum stand, also wurde es trotzdem ausgeliefert, samt aller Zweifel.'
    seraphbound_cordial_crown: 'Sein Nachgeschmack ist Ansichtssache, also wird es mit einem Achselzucken statt einer Garantie verkauft.'
    seraphbound_cordial_godbone: 'Es wurde gebraut, um einen Streit zu klären, was misslang, also formell gesehen auf eigene Gefahr zu trinken.'
    seraphbound_longsword: 'Der Entwurf überstand drei getrennte Einwände, was entweder das ganze Konzept oder nur ein Rundungsfehler ist.'
    seraphbound_loop_of_broken_diadem: 'Der Entwurf durchlief mehrere unvereinbare Fassungen, was technisch wahr und völlig unbrauchbar ist.'
    seraphbound_resin: 'Es wurde als Beweismittel in einem nie beendeten Streit verzeichnet, also wird Käufern geraten, selbst zu urteilen.'
    seraphbound_stompers: 'Der Träger schwört darauf; alle anderen zweifeln, also wurde die Debatte auf unbestimmte Zeit vertagt.'
    seraphbound_vambraces: 'Seine Funktion wurde durch Münzwurf entschieden, und der Streit überdauerte alle, die ihn begonnen hatten.'
    seraphic_amalgam: 'Zwei getrennte Berichte beschreiben es widersprüchlich, worüber das Vermessungsteam noch immer streitet.'
    seraphine_hauberk: 'Die Notizen des Schöpfers bestehen nur aus durchgestrichenen Ideen, also wurde die Uneinigkeit stillschweigend in den Entwurf aufgenommen.'
    shadow_blade: ''
    shadow_knight_signet: 'Die Inschrift innen bedeutet, grob uebersetzt, eine Drohung. Die Schattenritter beharren darauf, es sei ein Versprechen.'
    shadow_knight_visor: 'Der Sehschlitz bleibt bewusst schmal. Schattenritter halten peripheres Sehen fuer eine moralische Schwaeche.'
    shadow_stilettos: 'Aus lichtschluckenden Splittern geschmiedet. Ihre Feinde sehen auch den Fehlschlag nicht kommen.'
    shadowsteel_belt: 'Haelt deine Hose oben und, angeblich, deine Todesangst zurueck. Eine dieser Behauptungen ist unbestaetigt.'
    shadowsteel_morningstar: 'Die Stacheln trinken Licht, statt es zu reflektieren — eine wirklich miserable Nachtlampe.'
    shadowsteel_shard: 'Abgebrochen von einer Rüstung, in der die Dunkelheit keine Zierde, sondern tragende Struktur war. Schmiede handhaben es mit Zangen, einem Gebet und der besonderen Vorsicht jener, die wissen, was denen widerfährt, die das Gebet auslassen.'
    shark_bone_choker: 'Eine Kette aus Haiwirbeln. Modisch in Küstenstädten. Buchstäblich überall sonst furchteinflößend.'
    shark_fin: 'Eine Rückenflosse eines Hammerhais. Suppenhändler wurden für weniger verhaftet.'
    shark_fin_saber: 'Gezackt nach dem Vorbild von Haizähnen. Die Haie sind, verständlicherweise, immer noch verstimmt.'
    shark_harpoon: "Mit einer 'ethisch bezogenen' Haiflosse bestückt. Der Hai würde dem Wort 'ethisch' widersprechen."
    shark_leather_belt: 'Rau genug, um als Schleifpapier durchzugehen. Der Hai hat die Metapher nicht ueberlebt.'
    shark_mail: 'Haiflossenschuppen auf Mithril-Ringe genäht. Wasserdicht, haifest und ein Gesprächsthema.'
    shark_scale_tassets: 'Haiflossenschuppen an den Schenkeln. Du bist jetzt unter Wasser aerodynamisch. Rechtlich gesehen ein Fisch.'
    shark_vertebra_ring: 'Ein einzelner, polierter Haiwirbel. Der Kiefer, aus dem er stammt, jagt technisch gesehen noch.'
    sharkhide_fists: 'Haihaut über Thoriumplatten gewickelt. Die raue Textur dient nebenbei als Käsereibe.'
    sheep_eye: 'Ein abgetrenntes Auge eines Wolligans ist viel weniger einschüchternd, wenn es nicht blinzeln kann – was sich als immer herausstellt.'
    shellguard_mitts: 'Gefüttert mit Krabbenchitin, dick genug, um Schläge und Feinmotorik gleichermaßen zu dämpfen. Ihre Finger sind sicher, Ihre Geschicklichkeit nicht — und was darunter steckt, ist kaum totzukriegen.'
    shiny_barley: ''
    shoddy_spear: 'Ein spitzer Stock mit Traeumen vom Militaerdienst. Die Spitze wackelt aber Hingabe ist alles.'
    shore_amulet: 'Geschnitzt aus dem Panzer einer Krabbe, die den falschen Fischer gezwickt hat. Der eingeschlossene Sand rasselt bei Gefahr. Oder beim Gehen. Er kann den Unterschied nicht feststellen.'
    shore_finns: 'Der Panzer großer Krabben, zu robuster Beinrüstung geformt, die leise knistert mit dem Geruch von Meersalz und sonnengebackener Flut.'
    shore_mace: 'Mit Seepocken besetzt, die Textur und Tetanusrisiko hinzufügen.'
    silentedge: 'Macht beim Ziehen, beim Schlag und beim Auftreffen kein Geräusch. An die Stille danach erinnert man sich.'
    silk: 'Filamente von einwandfreier Qualität, glatt wie Wasser und stärker als Ketten. Eine Schade wegen der Knoten — sie halten fest, aber Familienbande sollten niemals derart auf die Probe gestellt werden.'
    silk_boots: 'Unmöglich leicht, gewebt aus der Seide von Spinnen, die mit Fliegen bestochen wurden. Die Vereinbarung hielt genau lang genug für ein Paar. Der Lehrling des Schuhmachers ist noch in Therapie.'
    silk_bound_lexicon: 'Gebunden mit Silkling-Kokonfaden. Die Haelfte der Zauber ist unleserlich die andere gefaehrlich.'
    silk_cocoon: 'Halb geformt und klebrig. Was drin ist, ist entweder eine Larve oder, beunruhigend, Ihr Mittagessen.'
    silk_cowl: 'Gewoben aus Geschoepfen, die ihr ganzes Leben auf Aufwinden reiten und nie nach unten sehen.'
    silk_gloves: 'Der Gipfel der Mode für jene, die keinen einzigen Tag ihres Lebens gearbeitet haben, und deren Blut erheblich wärmer fließt, als ihre Hände es je sein werden.'
    silk_leggings: 'Leicht wie eine Brise. Zaeh wie das, was die Brise ueberhaupt erst verursachte.'
    silk_tunic: 'Gewoben von hoehlenbewohnenden Spinnen, die nur in vollkommener Dunkelheit und Stille arbeiten.'
    silk_woven_gauntlets: 'So leicht, dass man vergisst, Handschuhe zu tragen. Man erinnert sich im denkbar schlechtesten Moment.'
    silkamu: 'Aus Fäden gewebt, die keine Spinne freiwillig hergab. Die Spinnengewerkschaft hat ein Kopfgeld auf den Weber ausgesetzt, zahlbar in Fliegen.'
    silkling_stingers: 'Die fast mikroskopischen Widerhaken sorgen dafür, dass Wunden wochenlang eitern – was wohl der eigentliche Sinn ist.'
    silkwinder_lance: 'In Spinnenseide gewickelt, die sie durch die Luft pfeifen lässt. Feinde hören sie kommen, können aber nie ausweichen.'
    silt_wrapped_core: 'Ein Handwerkskern, in Schlamm gehüllt, den man zum Gebrauch aufbrechen muss und der sich über Nacht neu bildet, lässt man ihn zu lange zwischen den Arbeiten liegen.'
    silt_wrapped_cuirass_of_quiet_drowning: 'Von einer Schlammkruste überzogen, die im Trockenen zu Stein erhärtet und im Nassen erweicht, was im Weald bedeutet, dass er stets, im Stillen, im Übergang ist.'
    silt_wrapped_gauntlets: 'Mit Schlamm verkrustet, der über den Knöcheln aushärtet, sodass der erste Schlag auch eine Handvoll Weald-Boden liefert.'
    silt_wrapped_greaves: 'Die Schlammkruste fügt jedem Schritt das Gewicht eines Steins hinzu, was der Träger etwa dann nicht mehr bemerkt, wenn alle anderen es tun.'
    silt_wrapped_lance: 'Ihre Schlammhülle springt beim ersten Treffer ab und nimmt die Aufmerksamkeit des Feindes mit, die der zweite Treffer nutzt.'
    silt_wrapped_maul_of_quiet_drowning: 'Seine Schlammhülle fügt einen Stein Gewicht hinzu und beim Aufprall einen kleinen Schwall Weald-Boden, sodass jeder Schlag ein wenig Heimat zurücklässt.'
    silversteel_saber: 'Glaenzt bei jedem verfuegbaren Licht. Zieht Aufmerksamkeit an, meist die Art, die man vermeiden wollte.'
    sky_shard: 'Ein verfestigtes Stück Gewitterwolke. Schwebt wenn man loslässt. Arkanisten binden sie in Stäbe. Die Schwerkraft ist beleidigt.'
    sky_shard_diadem: 'Getragen von dem, der zuletzt das Aschenbanner trug. Das Amt wechselt häufig.'
    skybound_ring: 'In den Scheiterhaufengruben gebrannt, bis das Metall nichts anderes mehr kannte.'
    skyburial_bow: 'Es funktioniert unter Vorbehalt, worüber der Träger beschlossen hat, nicht mehr nachzudenken.'
    skyburial_leggings: 'Der Träger schwört darauf; alle anderen zweifeln, also hat der Träger aufgehört zu fragen.'
    skyheld_carapace_of_hollow_throne: 'Es wurde aus purer Sturheit fertiggestellt, eine Entscheidung unter erheblichem Zeitdruck.'
    skyheld_claymore_of_last_regent: 'Es funktioniert, aber nur, wenn man nicht nach dem Warum fragt, also bleibt die Sache vorerst ungeklärt.'
    skyheld_crest_of_hollow_throne_crown: 'Seine Wirksamkeit wurde nie unabhängig überprüft, was niemand bestätigen kann, ohne den Streit neu zu entfachen.'
    skyheld_crest_of_hollow_throne_godbone: 'Wer auch immer es machte, änderte auf halbem Weg die Meinung, eine Lösung, die kaum etwas löste.'
    skyheld_halberd_of_hollow_throne: 'Es wurde trotz einhelligen Zögerns fertiggestellt, also wurde der ursprüngliche Streit für unentschieden erklärt.'
    skyheld_stilettos_of_hollow_throne: 'Der Schöpfer ist sich immer noch nicht sicher, ob es richtig fertig ist, also wurde es trotzdem ausgeliefert, samt aller Zweifel.'
    slackline: 'Nie wirklich locker. So nannte ihn der vorherige Besitzer, kurz bevor das nicht mehr stimmte.'
    slag_clinker: 'Was der Ofen ausspuckt, sobald er beschlossen hat, mit etwas fertig zu sein. Bergleute heben es trotzdem auf — Abfall, sagt das alte Sprichwort, ist bloß Erz, das man nicht höflich genug gefragt hat.'
    sloth_fur: 'Unglaublich weich und riecht nach Moos und Geduld. Schneider lieben es. Der Slothian hat nur sehr langsam geseufzt.'
    slothian_wisdom_stone: 'Ein moosbedeckter Stein, der mit altem Wissen summt. Er kennt die Antworten. Er denkt nur nicht, dass du bereit bist.'
    smoldering_wheat: ''
    solomonk: 'The cowl of a monk who traded three vows of silence for one very loud hat.'
    soul_binder: 'Destilliert aus dem, was bleibt, nachdem ein Wiedergänger endlich zur Ruhe gebracht wurde. Hält geistgebundene Ausrüstung zusammen.'
    soul_shard: 'Ein kristallisiertes Fragment, mitten im Ritus einem Wiedergänger entrissen. Summt noch von etwas Unvollendetem.'
    soul_shard_loop: 'Hält einen Splitter von etwas, das noch nicht ganz gegangen ist.'
    soulbinder_scepter: 'Trägt einen Bruchteil dessen, was die Seelenprüfer am Tor darunter binden, summend mit geliehener Beständigkeit. Ein Aschprophet nutzte es, um Fragen zu stellen, die die Toten gewöhnlich nicht zweimal beantworten.'
    soulking_spellbook: ''
    sounding_hull_key: 'Geborgen aus dem Wrack, das der Rumpfwärter noch immer bewacht. Er summt leise bei jedem Gezeitenwechsel, als zähle er auf etwas herunter.'
    spark_pendant: 'Ein gefangener Funke, zu stur, um zu wissen, dass er vor Jahrzehnten haette erloeschen sollen.'
    spark_ring: 'Ein Kupferreif mit Magnetsteinherz, der Funken sprüht, sobald sein Träger wütend, ängstlich oder allzu versunken ins Nachdenken übers Abendessen ist. Der Verzauberer nannte ihn Stimmungsring. Das Dorf nennt ihn Brandgefahr.'
    spectral_arcanize: ''
    spectral_edge: 'Halb in dieser Welt, halb in der nächsten. Der Zoll an der Grenze ist sehr eigen.'
    spectral_essence: 'Destilliert vom Seelenlosen Regenten selbst. Riecht wie die Leere zwischen den Sternen. Absolut ruinöser Marktwert.'
    spectral_fang_daggers: 'Aus verdichteten Geisterbeschwerden geschmiedet. Jeder Stich kommt mit einer detaillierten Klageschrift.'
    spectral_ruin_blade: 'Geschmiedet aus einem Leeremotten-Panzer, dünn genug, um bei richtigem Licht hindurchzusehen, und dünn genug, um bei jedem Licht damit zu schneiden. Die Geister früherer Besitzer bieten gelegentlich ungebetenen Rat.'
    spice_rusk: 'Zweimal gebacken und so aromatisch, dass Waffenschmiede das Oel fuer alles Moegliche ausser Backen verwenden.'
    spicebark_bread: 'Ein Biss, und jede Nase im Umkreis dreier Tische kapituliert bedingungslos.'
    spider_fang_club: ''
    spider_fang_daggers: 'Zwillingsklingen aus kristallisiertem Gift, die leise summen, sobald Gewalt wahrscheinlich wird.'
    spider_leg: 'Behandle es mit Vorsicht, es sei denn, du genießt das Gefühl unsichtbarer Spinnen, die wochenlang unter deiner Haut krabbeln.'
    spider_silk_gland: 'Ein gallertartiges Organ, das Faden staerker als gleich dicker Stahldraht erzeugt. Trotzdem vorsichtig behandeln.'
    spider_silk_grips: 'Laesst nicht los, was sie haelt. Wunderbar im Kampf, katastrophal beim Haendeschuetteln.'
    spider_silk_treads: 'Praktisch lautloses Schuhwerk aus Höhlenspinnenseide. Perfekt für Tarnung, katastrophal für die Ankündigung bei Abendgesellschaften. Die Seide klebt manchmal an Oberflächen, was entweder ein Konstruktionsfehler oder die letzte Rache der Spinne ist.'
    spider_thread_pants: 'Gesponnen aus Faden, den keine Spinne je freiwillig hergab. Ethischer Bezug stand nie zur Debatte.'
    spine_daggers: 'Von einer gewissen Elorie fuer Grausamkeit gezuechtet, nicht fuer Gnade. Wer gewann, ist nicht ueberliefert.'
    spine_gauntlets: 'Hauerstacheln auf Lederhandflächen montiert. Jeder Händedruck wird zur Verhandlung. Jeder Klaps auf den Rücken zur Kriegserklärung. Die Herstellung beinhaltete das Ziehen von Stacheln aus einem sehr wütenden Tier, was den restlichen Groll der Handschuhe erklärt.'
    spine_pants: 'Verstaerkt mit Stacheln eines kleinen Wesens mit sehr entschiedener Meinung zum Daraufsitzen.'
    spore_cracker: ''
    stabilizing_agent: 'Bewahrt fluechtige Mischungen davor, ungeplante Explosionen zu werden. Ueber misslungene Chargen spricht man nicht.'
    staff_of_the_deep: 'Aus einem versunkenen Tempel geborgen, an dessen Bau sich niemand erinnert. Die Seepocken sind der am wenigsten seltsame Teil.'
    stamina_tonic: 'Mineral-Stimulans das deine Beine uberzeugt sie seien nicht mude. Deine Beine wissen es besser, gehorchen aber aus chemischer Angst.'
    starter_staff: 'Dieser verwitterte Bambusstab hat unzählige Wanderer durch Sümpfe und Moorland geführt. Seltsamerweise funktioniert er gleichermassen als Gehhilfe und als spontane Lektion in Demut.'
    starter_weapon_ikari: 'Dick, stumpf und schwerfällig — alles, was eine Meisterwaffe nicht sein sollte. Man könnte einen Feind damit zu Tode prügeln, vorausgesetzt, man schafft es überhaupt, sie über die Schultern zu heben.'
    steadyhand: 'Stoppt das Zittern, das die Narbe irgendwann jedem verpasst. Nur die Hand. Der Rest des Zitterns bleibt Ihr Problem.'
    steel_cuirass: 'Der Vorbesitzer hinterliess eine Nachsendeadresse. Niemand war mutig genug, sie zu pruefen.'
    steel_flail_sword: 'Eine flexible, daemmergeschmiedete Klinge, umwickelt mit Borstenkette. Biegt sich wie ein Versprechen, das niemand halten will.'
    steel_gauntlets: 'Die Finger bewegen sich im Dunkeln perfekt und versteifen sich, sobald Sonnenlicht sie beruehrt.'
    steel_greaves: 'Die letzte Schoepfung des Schattenritters vor seinem Ruhestand als Imker in voelliger Dunkelheit.'
    steel_incandescent_sword: 'So heiß geschmiedet, dass der Schmied seinen eigenen Namen irgendwo im Abschrecken verlegt haben soll. Die Klinge erinnert sich perfekt an die Hitze. Was er an jenem Tag verlor, hat die Klinge ihm nie zurückgegeben.'
    steel_longsword: 'Wolfssehne umwickelt eine Klinge aus Schattenritterstahl. Scharf, dunkel und an deinen Gefuehlen voellig desinteressiert.'
    steel_recurve: 'Bespannt mit Alphawolf-Sehne, die sich leicht strafft, sobald man beim Zuggewicht luegt.'
    steel_treads: 'Geschmiedet waehrend einer Finsternis von einem Ritter, der auf totaler Stille bestand und sie fast erreichte.'
    steel_warhelm: 'So dunkel, dass sie Komplimente wie Licht schluckt. Das Visier oeffnet sich nur von innen — jemandes Idee eines Scherzes.'
    stitched_trousers: 'Doppelt genaht fuer Haltbarkeit. Der Schneider war so stolz dass er innen unterschrieb. In sichtbarer Tinte. Schlecht.'
    stoneheart: 'Zu jeder Stunde, in jeder Jahreszeit kalt anzufassen, ganz gleich, was der Trägerin oder dem Träger widerfährt.'
    stormfeather: 'Eine Feder die beim Schütteln funkelt. Sturmmagier verweben diese in Zauberstäbe. Postboten weigern sich sie zu liefern.'
    stormfeather_daggers: 'Sturmfalkenfedern in Stahl gefaltet, bis das Metall vergaß, je etwas anderes gewesen zu sein. Jeder Schlag trifft mit dem Grollen eines Donners aus einem Sturm, der längst ohne ihn weitergezogen ist.'
    stormfeather_longbow: 'Jeder Pfeil knistert vor dem Loslassen. Jeder Schuetze schwoert, das sei Absicht gewesen.'
    stormfeather_loop: 'Aus stets knisternden Federn geflochten. Ein Haendedruck kommt hier mit einem kleinen, entschuldigenden Schlag.'
    stormhowl_bow: 'Jeder Pfeil schreit auf dem Weg zum Ziel. Die Nachbarn haben sich beschwert.'
    stormtide_coif: 'Kann sich nicht entscheiden, ob er für Wassermagier oder Erdritter gedacht ist. Dient widerwillig beiden.'
    stormwalker_boots: 'Durchqueren jeden Sturm klaglos. Die Stiefel, nicht der Traeger — der beschwert sich staendig.'
    stormweave_leggings: 'Grau geworden durch Abnutzung, nicht durch Färbung. Niemand erinnert sich an die ursprüngliche Farbe.'
    stumpwork: 'Gebaut für die Bäume, die die Wunde nur halb überlebten. Die Arbeit zu Ende zu bringen, erwies sich als stetige, verlässliche Arbeit.'
    suize_flour: 'Kristallin und so lichtfangend, dass Baecker schwoeren, es lasse Brot teurer schmecken.'
    summit_alloy: 'Die stärkste Legierung, die die Gipfelesse halten kann, bevor der Schmelztiegel selbst nachgibt. Die Schmiede kennen die genaue Temperatur und schreiben sie nie auf.'
    summit_cuirass_of_sealed_wound: 'Über die Naht gepasst, an deren Schließen die Nahtpriester am härtesten arbeiteten, sodass der Träger die Ausbesserung mit sich herumträgt. An einer Brust hält sie besser als an der Narbe.'
    summit_draught: 'Gebraut gegen den Schwindel, der Kletterer nahe der Spitze packt, wo die Luft dünn wird und der Verstand mit dem Abgrund zu verhandeln beginnt. Vor Verhandlungsbeginn trinken.'
    summit_extract: 'Unter Druck aus Gipfelmoos gewonnen, so konzentriert, dass ein einziger Tropfen die Arbeit eines ganzen Fläschchens leistet und im Ersatz ungefähr ebenso viel kostet.'
    summit_girdle_of_summit_vigil: 'Geschnürt, um einen Posten durch eine Wache aufrecht zu halten, die niemand stehend überleben sollte. Er hielt die letzten drei; sentimental ist er deswegen nicht.'
    summit_greaves: 'Am Schienbein verstärkt für das letzte Stück des Aufstiegs, wo der Berg aufhört, Griffe zu bieten, und anfängt, sie zurückzunehmen.'
    summit_helm_of_summit_vigil: 'Dem zugeteilt, der die längste Wache am Gipfel zieht, mit der Begründung, ein schwererer Helm halte den Kopf vom Einnicken ab. Tut er auch. Vor allem, indem er wehtut.'
    summit_ore: 'Adamant, ganz am Gipfel gebrochen, wo das Erz dem am nächsten liegt, woraus der Berg darunter besteht. Schwer auf eine fast absichtlich anmutende Art.'
    summit_sabatons_genesis: 'Über Sohlen beplattet, die laut den Schmieden die allerersten je geschnittenen waren. Ob wahr oder nicht, sie gehen, als hätten sie nichts mehr zu beweisen.'
    summit_sabatons_scar: 'Eisenbeschlagen für Halt auf Narbengestein, das sich unter dem Fuß mit der Geduld von etwas verschiebt, das darauf wartet, dass du ihm traust.'
    sundered_casque: 'Ein Riss zieht über die Stirn. Der Schmied nennt ihn „Entlastungskanal“. Der Schmied lügt.'
    sundered_charm: 'Die Hälfte des Einheitsmedaillons eines Zerschlagenen Soldaten, von der Art, die paarweise ausgegeben wurde und nie zur Trennung gedacht war. Die andere Hälfte ist irgendwo da draußen, vermutlich immer noch bemüht, das Paar zu vervollständigen.'
    sundered_chausses_of_screaming_rift: 'Die kniende Haltung des letzten Befehls eines Zerschlagenen Soldaten, im Gelenk fixiert von dem, was das Werk des Risses vollendete. Wiederaufstehen erfordert jedes Mal eine bewusste Entscheidung.'
    sundered_cordial: 'Keine Heilung. Eine Pause. Nutze sie, um zu überdenken, was dich hierher brachte.'
    sundered_cordial_of_long_collapse: 'Ausgegeben an Zerschlagene Soldaten, die technisch gesehen noch auf der Liste stehen. Heilt, was es kann, und ist ehrlich über den Rest.'
    sundered_elixir_of_screaming_rift: 'Das Letzte, was eine Einheit Zerschlagener Soldaten braut, bevor sie aufhört, eine Einheit zu sein. Laut beim Schlucken. Danach still.'
    sundered_sash: 'Das einzige Stück der Ausrüstung eines Zerschlagenen Soldaten, das nie auseinanderfiel, ganz gleich wie gründlich der Rest der Geschichte es tat. Es hält. Es hält einfach.'
    sundered_stompers_of_long_collapse: 'Jeder Schritt landet wie das Urteil, das ein Kriegsgericht eines Zerschlagenen Soldaten nie fällen konnte. Langsam, bedacht und absolut endgültig, sofern die Schwerkraft es zulässt.'
    sundered_stompers_of_screaming_rift: 'Der Riss darunter beantwortet jeden Schritt eines Zerschlagenen Soldaten, was den Sinn der Schleichlektionen ziemlich zunichtemacht. Überraschungsauftritte sind, strukturell bedingt, ausgeschlossen.'
    sundered_vambraces_of_long_collapse: 'Angelegt für einen Appell, dessen Abnahme nie zu Ende kam. Die Arme erinnern sich ans Bereitstehen, lange nachdem der Geist lieber nicht mehr würde. Ausdauer ohne Ende ist, technisch gesehen, immer noch Ausdauer.'
    sundered_vambraces_of_screaming_rift: 'Dick gepolstert über den „Ohren“ des Arms, was anatomisch keinen Sinn ergibt, bis man sich erinnert, wessen Arm das war. Blockt Schall fast so gut wie Klingen.'
    sunglass_shard: 'Aus Glas geschnitten, das von zwei Sonnen verschmolzen wurde, die sich sonst nie einig sind.'
    sunken_mere_key: 'Unter dem Eis hervorgeholt, wo der Frostdrache schläft, kalt genug, um eine ungeschützte Hand binnen Sekunden zu betäuben. Sie zurückzuholen war leichter als erwartet, was niemanden beruhigt.'
    sunscale_chopper: 'Geschaerft mit Schuppen, die genug Sonnenlicht tranken, um eine ganze Generation zu leuchten.'
    sunscale_cuirass: 'Ein Harnisch aus glänzenden Schuppen, der vor Stahl und Zaubern schützt – vorausgesetzt, man röstet nicht darin.'
    sunwarmed_ring: 'Haelt noch die Waerme einer Eidechse, die sie, mit allem Respekt, nicht mehr braucht.'
    sunwarmed_scale: 'Eine breite Plattenschuppe einer Aschenhauteidechse, noch warm lange nachdem die Echse das Gespraech verliess.'
    surimi: 'Dieser heilige Überrest des Surimi pulsiert vor uralter Macht, seine Oberfläche glatt abgerieben von den Händen längst verstorbener Pilger. Seltsam, dass Heiligkeit so verdächtig nach verarbeitetem Meeresfrüchten schmeckt.'
    suture_belt: 'So geschnürt, wie die Nahtpriester eine Wunde schnüren, bevor sie sich weiten kann. Wirkt an einer Hüfte etwa so gut wie an der Narbe.'
    suture_loop: 'Zu einer geschlossenen Schlaufe gebogen, so wie die Nahtpriester alles schließen — nach der Theorie, dass die Narbe nicht auftrennen kann, was nie offen gelassen wurde.'
    swamp_conduit: 'Kanalisiert Sumpfwasser in etwas vage Magisches. Der Geruch ist völlig gewöhnlich.'
    swamp_scale: 'Dunkelgrün und permanent schleimig. Das Krokodil hat eine Ersatzschuppe gezüchtet. Lederarbeiter akzeptieren sie mit sichtbarer Zurückhaltung.'
    swamp_trident: 'Drei korrodierte Metallzinken, perfekt zum Aufspiessen von Sumpfbewohnern.'
    swampfire_grips: 'Mehrere der schlechtesten Entscheidungen der Geschichte sind direkt ins Leder eingebrannt.'
    talokan_aero_tail: 'Smaragdgruen und giftig. Die Farbe erledigt die Arbeit des Warnhinweises kostenlos.'
    talokan_pearl: 'Eine Tiefseeperle, die von den Talokan als Währung getragen wird. Leuchtet schwach blau unter Wasser. Landhändler akzeptieren sie widerwillig.'
    talokan_sting_daggers: 'Korallenkantig und salzkrustig. Sie riechen nach Ebbe und Reue.'
    talokan_tail_nakwa: 'Jeder Lederarbeiter will eine. Pro Versuch kommen weniger Finger zurueck, als man hoffen wuerde.'
    talokan_tide_ring: 'Aus verdichtetem Meersalz und Talokan-Perle gefertigt. Löst sich auf, wenn man damit schwimmt. Schwimm nicht damit.'
    talokan_trident: 'Die Korallenspitze regeneriert sich zwischen Kaempfen. Die Natur unterstuetzt deine Gewohnheiten.'
    tanjirize_flour: 'Gewürztes Mehl, das alles aggressiv aromatisch macht.'
    tanjirize_rod: 'Der Wanderstab eines Pilgers, der der Wunde zu nahe kam und verändert zurückkehrte. Zum Gehen taugt er noch bestens. Er tut inzwischen auch andere Dinge.'
    tanned_girdle: 'Ein sonnengetrockneter Ledergürtel, durch Zeit und Witterung gehärtet. Er hat keine magischen Eigenschaften und behauptet keine zu haben. Er hält Hosen und Eingeweide gleichzeitig an Ort und Stelle — was bereits mehr ist als die meisten Ausrüstungsgegenstände leisten.'
    tectonic_severance: 'Legenden besagen, der Schmied spaltete beim Probeschwung einen Berg. Der Berg klagte.'
    temperedglass: 'Chorglasplatten, die jeden Ofen überstehen. Der Kuchen klebt trotzdem an, so will es das Gesetz.'
    tempering_flux: 'Alchemistischer Fluss der den Schmelzpunkt seltener Metalle senkt. Waffenschmiede konnen ohne ihn buchstablich nicht schmieden.'
    tempest_requiem: 'Jeder Pfeil trägt das kleine Gewitter, das ein Aschprophet drei Verse vor seiner Ankunft kommen sah. Die zusätzliche Reichweite ist keine Kraft. Es ist das Wissen, wo der Wind stehen wird.'
    tempest_whisper_bow: 'Ein Bogen bespannt mit Himmelssplitter-Filament. Die Pfeile fliegen so schnell dass sie vor dem Klang ankommen.'
    terminal_casque_genesis: 'Von den Tiefen-Prüfern getragen, während sie über die ältesten Aufzeichnungen streiten. Dick gepolstert, denn die Streitgespräche ziehen sich und enden mitunter handgreiflich.'
    terminal_casque_scar: 'Der letzte Helm, den die Waffenkammer der Mauer je schmiedete, denn jenseits dieser Höhe gibt es keine nächstgrößere und keinen nächsten Träger, der eine bräuchte.'
    terminal_chausses_of_origin_line: 'Für das Bein geschnitten, das die Grenze erreichen und dort halten will — was die Beplattung durchsetzt, indem sie das Laufen wahrhaft unangenehm macht.'
    terminal_cordial_of_final_scar: 'Im Lazarett der Mauer für die aussichtslosen Fälle bereitgehalten, dann als peinlich wirksam bei denen befunden, die es nicht waren. Der Ruf hat sich entsprechend angepasst.'
    the_tenderizer: 'An die letzten Metzger der Narbe als Küchenwerkzeug vermarktet. Fast sofort zweckentfremdet. Der Hersteller äußert sich nicht mehr dazu.'
    thick_ursine_hide: 'Ein Fell, eine komplette Ruestung, ein Baer, der im Jenseits Beschwerde einlegt.'
    thickskull: 'Das Kompliment war wörtlich gemeint. Er hat mehr Leben gerettet als die in das Futter eingewebte Verzauberung.'
    thorium_warhammer: 'Besetzt mit Rexzaehnen und mit Haifischflosse verstaerkt. Ersetzt Finesse durch rohe Gewalt. Die Ergebnisse sprechen fuer sich. Laut.'
    thorium_warplate: 'Standardausgabe für jeden, der eine Kolonne noch zusammenhält. Heute selten.'
    threefold: 'Einmal vom Schmied geschmiedet, zweimal weiter gefaltet von etwas, das kein Schmied ist. Niemand hat gefragt, was.'
    throatlatch: 'Vom ersten Träger verschlossen und seither nie wieder geöffnet. Der Riegel funktioniert noch immer. Getestet hat das niemand.'
    throneless_cleaver_of_rotting_halo: 'Die Handwerkskunst ist solide; die Prämisse nicht, ein Kompromiss, nachdem alle das Streiten aufgegeben hatten.'
    throneless_draught_of_gilded_ruin: 'Es schmeckt wie eine überstürzte Entscheidung, und der Brauer weigert sich immer noch, Partei zu ergreifen.'
    throneless_extract: 'Niemand kann mit Sicherheit sagen, woher dies stammt, also bleiben beide Einträge unversöhnt in den Akten.'
    throneless_gauntlets_of_gilded_ruin: 'Es wurde während eines Streits geschmiedet, den niemand gewann, und der zweite Entwurf kam nie zustande.'
    throneless_lattice: 'Es wurde als Beweismittel in einem nie beendeten Streit verzeichnet, und der Bericht wurde trotzdem eingereicht, samt Vorbehalten.'
    throneless_pendant_crown: 'Der Träger besteht darauf, dass es funktioniert; die Beweise sind unschlüssig, keine Rückerstattung, keine weiteren Fragen.'
    throneless_pendant_godbone: 'Niemand hat bestätigt, dass es tut, was das Etikett behauptet, eine Tatsache, die der Schöpfer als Feature betrachtet.'
    throneless_sabatons_of_gilded_ruin_crown: 'Es funktioniert, aber nur, wenn man nicht nach dem Warum fragt, ein Unterschied ohne nennenswerten Unterschied.'
    throneless_sabatons_of_gilded_ruin_godbone: 'Seine Entstehungsgeschichte ändert sich je nach Erzähler, und die Unterlagen spiegeln davon nichts wider.'
    throneless_sabatons_of_rotting_halo: 'Es wurde gebaut, um einen Punkt zu beweisen, an den sich niemand erinnert, eine Fußnote, die der Schöpfer nie geschrieben hat.'
    tide_shard: 'Ein kristallisiertes Fragment lebendigen Ozeans, das ständig tropft. Riecht nach Salz und unerledigten Dingen.'
    tide_throne_key: 'In Korallen gegossen, die erst unterhalb der Gezeitenlinie aushärten. Der Ertrunkene Regent hält dort unten noch immer Hof — und erwartet sie noch immer zurück.'
    tidebinder_cord: 'Verknotet mit der Präzision eines Seemanns und einer Spur magischer Unfähigkeit.'
    tidebound_band_of_brackish_deep: 'Läuft an und hellt auf in einem Zyklus, der nichts mit Abnutzung zu tun hat, den der Träger irgendwann nicht mehr mit der Flut vergleicht, die es angeblich nicht gibt.'
    tidebound_breastplate_of_brackish_deep: 'In Wasser geschmiedet, zu salzig zum Trinken und zu süß, um irgendetwas zu erhalten, ein Kompromiss, den der Panzer als bleibenden, schwachen Geruch trägt.'
    tidebound_core: 'Ein Kern, der in einem langsamen Zyklus schwerer und leichter wird, den kein Handwerker mit irgendetwas in Verbindung brachte, am wenigsten mit einem Sog, den das Weald schlicht bestreitet.'
    tidebound_grips_of_silt_throne_matron: 'Aus dem ertrunkenen Hof geborgen und nie entsalzt, hinterlassen sie einen blassen weißen Abdruck auf allem, was der Träger lange berührt.'
    tidebound_grips_of_silt_throne_mire: 'Aus dem ertrunkenen Hof geborgene Panzerhandschuhe, noch im Griff um etwas gekrümmt, das der Schlamm längst nahm.'
    tidebound_treads_of_brackish_deep: 'Die Salzwassergerbung ließ sie für immer feucht und für immer leise, ein fairer Tausch an einem Ort, wo Lärm Zähne anzieht.'
    tidebound_treads_of_silt_throne: 'Hofschuhwerk, gebaut, um bei Zeremonien vollkommen still zu stehen, nun perfekt, um vollkommen still zu stehen, während etwas Großes vorbeizieht.'
    tidebound_visor_of_brackish_deep: 'Salzverkrustet vom Tragen dort, wo die Flut hinreicht, die das Weald zu haben leugnet und die Korrosion des Visiers bezeugt.'
    tidebound_visor_of_silt_throne: 'Aus der schlammverstopften Halle geborgen, die die Führer des Weald noch Thronsaal nennen, mehr aus Gewohnheit als aus einem Beweis, dass je ein Thron dort stand.'
    tidecaller_mail: 'Klingt wie eine Boje im Sturm. Deine Verbündeten wissen immer, wo du bist. Die Feinde auch.'
    tideflame_treads: 'Stiefel, die bei jedem Kontakt mit Wasser mit blauer Flamme brennen. Der Effekt ist spektakulär bei Flussüberquerungen und katastrophal an Regennächten in Städten. Feuerwehrleute in Hafengebieten haben eine offizielle Petition gegen ihre Verbreitung eingereicht.'
    tidesurge_leggings: 'Schimmern wie der Ozean bei Sonnenuntergang. Riechen wie der Ozean bei Ebbe.'
    tidewalker_soles: 'Auf dem Wasser gehen. Nicht wörtlich. Aber nah genug dran, um Physiker zu ärgern.'
    timberfall: 'Zugelassen, um die versteinerten Bäume zu fällen, die die Wunde stehen ließ. Funktioniert ungefähr genauso gut an allem, was einmal ein Mensch war.'
    timberwolf_legguards: 'Wolfsfell-gefütterte Beinschienen, die im Winter warm halten und bei allem anderen überhitzen. Das Fellmuster bewegt sich im Feuerschein und erzeugt den beunruhigenden Eindruck, dass dort drinnen noch etwas lebt und nur seine Zeit abwartet.'
    tin_cap: 'Ein puppenkleiner Helm, der Hirn gegen Haltbarkeit tauscht. Sie werden Ihre eigenen guten Ideen überleben.'
    titan_bear_moss: 'Moos das im lebenden Fell eines Titanbären wuchs. Durchdrungen von Jahrhunderten Raubtierenergie. Druiden werden wild.'
    titan_koa_greaves: 'Die zähe Haut eines Titanen-Koa, zu Beinschienen geformt. Sie quaken, wenn du die Knie beugst.'
    titan_koa_lance: 'Drei Winter lang an der Grablinie aufgestellt. Zeigt noch immer in dieselbe Richtung.'
    titan_koa_stompers: 'Für den Schlamm gebaut, nicht für Stille. Die Kolonne sollte nie leise sein.'
    titan_koa_warspear: ''
    titan_shell_hauberk: 'Gekocht und flach geschlagen. Was sie zuvor trug, hinterlässt noch immer einen Geruch.'
    title_veteran: "Press this searing brand against your flesh to prove you're a veteran and it'll be granted to you for life — because nothing says 'battle-hardened warrior' like voluntary third-degree burns."
    tokek_paw: 'Eine abgetrennte Pfote eines Tokek-Geckos, noch leicht warm und nach nichts greifend.'
    tome_of_elemental_spite: ''
    tome_of_oblivion: 'Das letzte Kapitel schreibt sich beim Lesen von selbst, in welchem Staub auch immer eine Leeremotte hinterlässt, wenn sie mitten im Satz aufhört zu existieren. Kritiker sind sich einig, dass das Ende ehrlich ist, wenn auch sonst nichts.'
    tool_herbalist: "Der Gipfel landwirtschaftlicher Eleganz – vorausgesetzt, der gewünschte Look ist 'schmutzverschmierte Verzweiflung'."
    totem_club: 'Geschnitzt mit Symbolen, die kein Lebender lesen kann. Schlaegt man hart genug zu, uebersetzen sie sich von selbst.'
    training_battleaxe: 'Eine Trainings-Kampfaxt aus gehärtetem Holz, die Gewicht und Balance einer echten Axt simuliert ohne den fatalen Nachteil scharfer Kanten. Ideal zum Erlernen der richtigen Form. Ausbilder bestehen auf dem Begriff Training. Rekruten vergessen ihn regelmäßig.'
    training_helmet: 'Schuetzt gegen sanfte Brisen und scharfe Beleidigungen. Kampfschutz: theoretisch.'
    tremor_brew_of_nine_faults: 'Heilt und verankert ein dauerhaftes leichtes Zittern in beiden Händen. Unterm Strich positiv, heißt es.'
    tremor_crest_of_fifth_breach: 'Vibriert stets leicht. Nach einer Woche merkst du es nicht mehr. Genau das ist das Problem.'
    tremor_fists_of_nine_faults: 'Liefern den Schlag, dann noch ein Nachsummen. Das Extra lässt sich nicht abschalten.'
    tribal_cudgel: 'Umwickelt mit totemischen Amuletten, die Geister kanalisieren, welche angeblich jeden Schwung ebenso nach Form wie nach Kraft beurteilen. Ihrer Meinung nach bleiben sie unbeeindruckt. Die Keule schlägt trotzdem gleich hart zu.'
    tribal_summoner_totem: 'Ein von Wildling-Schamanen geschnitztes Totem. Die Schnitzereien zeigen Tiere. Die abgebildeten Tiere haben Beschwerde eingereicht.'
    tribal_totem: 'Ein geschnitztes Knochenfetisch mit Restenergie. Der Häuptling trug dies in den Kampf. Es hat ihm nicht geholfen.'
    truelength: 'Am eigenen Unterarm des Schmieds bemessen, ein Maß, das mit ihm starb. Das Schwert bleibt die einzige Kopie.'
    truestrike: 'Geführt von Pilgern, denen beigebracht wurde, dass die Narbe Überzeugung mehr belohnt als Zielgenauigkeit. Die Klinge widerspricht dem, still, jedes Mal.'
    truffle_essence_compound: ''
    tusk_bludgeon: 'Ein Stosszahn-Knueppel. Das Tusklet starb an natuerlichen Ursachen. Natuerlich hast du sie verursacht.'
    tusk_buckle_belt: 'Die Schnalle ist ein echter Hauerzahn. Das Leder riecht nach etwas, das dich angriff und verlor. Das Anlegen erfordert einen kurzen Ringkampf, den der Gürtel etwa jedes zweite Mal gewinnt.'
    tusk_ivory: 'Dichtes Elfenbein eines Warzenschweinstoßzahns. Schnitzer formen daraus Schachfiguren, weil das anscheinend ein Markt ist.'
    tusker_musk_gland: 'Erzeugt einen Geruch, der einen Raum, ein Gebäude oder einen kleinen Bezirk räumen kann. Alchemisten extrahieren Pheromone daraus.'
    twine_belt: 'Geflochten aus allem, was am Wegesrand wuchs. Hält zusammen durch reinen Trotz und einen Knoten, der in keinem Lehrbuch steht. Garantie: keine.'
    tyrants_gavel: 'Diente dazu, über Deserteure zu urteilen. Davon gab es in den Marschen reichlich.'
    ukranize_flour: 'Gemahlen aus Korn, das hundert schlechte Ernten durchquerte, um hierher zu gelangen, backt dieses Mehl zu Broten so widerstandsfähig, dass ein Dorf die Reste angeblich eine ganze Generation lang als Türstopper nutzte.'
    uncertain_bow_range: 'Ein Bogen, der auf Distanz schießt, argumentiert aber, ob Distanz real ist. Seine Pfeile erreichen Ziele nur aus theoretischer Notwendigkeit.'
    underweald_casque: 'Für die Ebenen unter den Wurzeln gedacht, wo die Finsternis vollkommen ist und die einzige echte Aufgabe eines Helms darin besteht, dich davor zu bewahren, dir den Schädel an der Decke aufzuschlagen.'
    underweald_charm: 'Ein Knoten aus Wurzel und Knochen, von dem Führer schwören, er wehre die Dinge unten ab. Es wurde nie von jemandem geprüft, der zurückkam, es zu bestätigen.'
    underweald_elixir_of_fen_below: 'Aus dem gebraut, was am Grund des Unteren Fenns wächst, heilt gut und schmeckt genau nach dem Ort, von dem es kommt.'
    underweald_hauberk_matron: 'Mit Schuppen überlappt, welche die Anglertiefen-Matrone zu Hunderten abwirft, was reichlich klingt, bis man erfährt, was sie mit jedem tut, der sie einsammelt.'
    underweald_hauberk_mire: 'Aus Sumpfeisen geflochten, das nie rostet, weil es nie lange genug trocken war, um anzufangen, eine Eigenschaft, die die Schmiede als Vorzug verkaufen.'
    underweald_loop: 'Ein schlichter Wurzelring aus den unteren Ebenen, von Führern als Abzeichen getragen, das grob bedeutet: war dort unten und kam zurück.'
    underweald_stompers_of_rising_tide: 'Beschwert, um in der Strömung Halt zu finden, denn hier unten ist der Boden ein Vorschlag, den das Wasser nach Belieben überstimmt.'
    ursine_heart: 'Wiegt acht Kilogramm und strahlt noch Wärme aus. Verzauberer binden diese in Schutzamulette. Bären machten es umsonst.'
    ursine_signet: 'In das Wachs von Requisitionsformularen gedrückt. Das Wachs härtet nie richtig aus.'
    ursine_totem_club: ''
    velkarion_breath_weapon: 'Ein Kamineisen, das einst den großen Scheiterhaufen selbst umrührte. Es hat Ansichten zu Ihrer Anzündholz-Anordnung.'
    velkarion_ember: 'Ein Splitter der Drachenflamme selbst, verwahrt im Marmeladenglas. Geht er aus, muss die ganze Kathedrale neu gezündet werden.'
    velkarion_key: 'Das große Feuertor hat neun Schlösser, sechs Siegel und genau einen Schlüssel, und der Küster verwahrt ihn haargenau dort, wo Sie es vermuten.'
    venom_band: 'Der Alchemist, der diese Beschichtung stabilisierte, verlor zwei Finger beim Beweis. Es wirkt.'
    venom_battleaxe: 'Das Spinnengift auf dieser Klinge erhöht den Schaden kaum. Der Gesichtsausdruck des Gegners, wenn er die Farbe der Schneide bemerkt, leistet erheblich mehr der eigentlichen Arbeit.'
    venom_belt: 'Drei gescheiterte Gegengifte und ein sehr geduldiger Priester waren noetig, um dieses Futter zu stabilisieren.'
    venom_concentrate: 'Gereinigtes Toxin, verwendet in vergifteten Waffen und mehreren bedauerlichen Wettschulden in Tavernen.'
    venom_gland: "Prall gefuellt mit Gift. Ein Stich verwandelt Ihren Abend von 'Abenteuer' in 'Verhandlung mit einem Heiler.'"
    venom_legguards: 'Gesaettigt mit Giften, die technisch gesehen wohl nur fuer dich persoenlich harmlos sind.'
    verdant_aloe: ''
    verger_teaspoon: 'Der Glücksteelöffel des Küsters an einer Schnurschlaufe. Rühren Sie Ihren Tee damit um, und die Minute wartet höflich, bis Sie fertig sind.'
    vitrified_casque_of_rising_hymn: 'Gestrickt für eine Kanne, die trotzdem explodierte. Hält einen Kopf auf Serviertemperatur.'
    vitrified_chausses: 'So eng geschnitten, dass der Schneider zweimal beruhigt werden musste. Knien ist eine Erinnerung.'
    vitrified_cord: 'Doppelt geknotet, wie Mutter es verlangte. Sie zu lösen ist der Anfang aller Unfälle.'
    vitrified_crown: 'In einem Blitzschlag verschmolzen. Getragen fühlst du dich kurz auserwählt. Das Gefühl lügt.'
    vitrified_edge: 'Langsam gekühlt, damit das Glas nicht bricht. Es behielt die Geduld und verlor die Gnade.'
    vitrified_elixir: 'Salzwasser und Sturheit. Der Chor schwört darauf, eine Oktave höher als zuvor.'
    vitrified_glaive: 'Lang genug, um Brot über dem großen Scheiterhaufen zu bräunen, ohne die Augenbrauen ganz zu verlieren. Ganz.'
    vitrified_lattice: 'Ein erstarrtes Netz aus geschmolzenen Fäden. Fass es an den dicken Stellen; die dünnen fassen dich.'
    vitrified_stompers: 'Jeder Tritt klingt wie ein angeschlagenes Glas. Du kündigst dich ständig an.'
    vitrified_tear: 'Flachglas, abgekühlt nach dem Zeitplan des Vulkans. Die Blasen nennt man Charakter.'
    vitrified_vambraces: 'Keine Rüstung. Eine Ansage. Irgendwer in dieser Kathedrale wird gleich geputzt.'
    void_anchor_belt: 'Beschwert, um auf nachgebendem Boden den Halt zu sichern. Der Sumpf gibt immer nach.'
    void_distillate: 'Flussiges Nichts aus Uberresten der Leere-Familie. Zu langes Hineinstarren verursacht existenzielle Angst und leichte Ubelkeit.'
    void_eye_lens: 'Eine kristallisierte Linse eines Leerenauges. Sieht in Paralleldimensionen. Die meisten sind irgendwie schlimmer als diese.'
    void_eye_talisman: 'Mit einer Linse besetzt, geschliffen zum Beobachten der Grablinie, sobald die Sonne sinkt.'
    void_grips: 'Finger befleckt von Wasser, das nie Tageslicht sieht. Der Fleck lässt sich nicht auswaschen.'
    void_oracle_staff: 'Sieht alle möglichen Zukünfte. In den meisten stirbst du. Es zeigt sie dir trotzdem.'
    void_shard: 'Ein Fragment des Nichts in physischer Form. Zu langes Ansehen verursacht Nasenbluten und philosophische Krisen.'
    void_shepherd_club: ''
    void_treads: 'Jeder Schritt sinkt kurz ein und löst sich sauber. Der Sumpf hat noch nicht gelernt, sie zu halten.'
    void_whisper_bow: 'Verschießt Pfeile, die erst bei Ankunft existieren. Quantenbogenschießen ist ein Haftungsausschluss, der nur auf sich warten lässt.'
    voidbake_tablet: 'In den Scheiterhaufengruben gebrannt, bis sie nichts anderes mehr war. Schmiede pressen sie flach, bevor sie erkaltet.'
    voidcleave: 'Spaltet Rüstung, Moral und gelegentlich dimensionale Barrieren. Mit existenzieller Vorsicht handhaben.'
    voidgazer_crown: 'Blickt durch Sehschlitze, dünn gewacht vom vielen Beobachten. Der Sumpf blickt zurück.'
    voidpierce_stilettos: 'Auf eine Schneide geschliffen, fein genug, um zwischen den Panzerplatten einer Leeremotte hindurchzugleiten, ohne dass diese es lange bemerkt. Funktioniert bei den meisten Dingen mit derselben Missachtung von Vorwarnung.'
    voidpiercer_bow: 'Pfeile aus diesem Bogen treffen ein, bevor die Sehne vollständig losgelassen wird. Kausalität ist hier eher ein Vorschlag.'
    voidpiercer_spear: 'Durchbohrt die Leere zwischen Dimensionen. Nuetzlich fuer Spiesse.'
    voidreaver_greatsword: ''
    voidreaver_longsword: ''
    voidstaff_nihil: 'Geschnitzt aus kristallisierter Leeremotten-Stille — jener genauen Ruhe zwischen einem Flügelschlag und dem nächsten. Wirkt Zauber, die technisch nie stattfanden, wozu das Finanzamt eine dezidierte Meinung hat.'
    voidwalker_boots: 'Gewachsen, nicht genäht, an den Beinen einer Leeremotte, die lernte, zwischen einem Fleck aus Nichts und dem nächsten zu treten. Nebenwirkungen: ein leises Summen in den Ohren und das unerschütterliche Gefühl, etwas vergessen zu haben.'
    volatile_extract: 'Ein instabiles Reagenz das horbar vibriert. Vorsichtig handhaben oder gar nicht.'
    walker_belt: 'Modisch genug, vorausgesetzt, dein Stilvorbild ist eine torkelnde Leiche.'
    walker_hat: 'Der Kopf des vorherigen Trägers steckt noch drin, wenn auch in deutlich schlechterem Zustand als der Helm selbst.'
    wallbreaker: 'Zugelassen für das Mauerwerk, aus dem die Mauer selbst besteht. Die Zulassung war nicht theoretisch. Es gibt ein Loch als Beweis.'
    war_barrow_key: 'Gefertigt für ein Schloss, das nie zweimal aufgehen sollte.'
    warden_spear: 'Der Zeremonienspeer eines Setzlingswaechters, umfunktioniert zu Gewalt, die die Kweebec nie ganz verziehen.'
    warlord_plate: 'Aus einer Rüstung geschnitten, zu alt, um sie einzuordnen. Das Schuppenmuster gleicht nichts Verzeichnetem.'
    warped_staff: 'Falsch getrocknet mit permanenter Verdrehung. Leitet Magie in unvorhersehbaren Spiralen. Zielen ist eher ein Konzept.'
    water: 'Reines, erfrischendes Wasser, das den Durst stillt und den Körper von Verunreinigungen reinigt. Ein seltener Stoff in einer Welt, in der die meisten Flüssigkeiten dich töten wollen.'
    waxseal_wafer: 'Duenn, kristallin und luftdicht, sobald sie haertet. Handwerker horten sie und geben nichts zu.'
    weald_heartplate: 'Als Rinde um ein Herz aus gepresstem Moos gewachsen, noch warm, wie lebendes Holz warm bleibt. Dem Titanenbären fehlt ein sehr ähnlich geformtes Stück Fell.'
    weald_knot_belt: 'In denselben Wurzelknoten geknüpft, mit denen die Führer des Weald einen sicheren Pfad markieren. Ob die Knoten so tief unten noch etwas bedeuten, ist eine andere Frage.'
    wealdwarden_halberd: 'Getragen von dem, den die Rudel des Weald genug achten, um ihn nicht allein herauszufordern. Alleingang ist theoretisch möglich. Das Weald rät davon ab.'
    weaver_daggers: 'Mit Spinnenseidendruese bestrichen. Das Gift wirkt langsam. Die Reue kommt frueh.'
    weaver_silk_vest: "Aus Spinnenseide gesponnen, so fein, dass sie fast unsichtbar ist. Der Schneider berechnete das Doppelte, weil, Zitat, 'Sie können nicht beweisen, dass sie nicht da ist.'"
    weaving_solution: 'Starkt Textilfasern fur kampftaugliche Belastung. Schneider tranken jeden Faden darin bevor sie etwas ernsthaftes nahen.'
    weighted_club: 'Jemand hat Steine in einen hohlen Baumstamm gestopft und das Ingenieurswesen genannt. Es funktioniert. Philosophen streiten darüber, ob Absicht ausreicht, um ein Werkzeug zu definieren. Zerbrochene Schädel nicht.'
    welcome_doormat: 'Borstenmatten an die Knöchel geschnallt. Sie werden alles aufnehmen, was die Welt an Ihnen abtritt, und Sie werden willkommen sagen.'
    wheat: 'Friedliche Bauern verbringen endlose Stunden damit, dieses Getreide zu ernten, nur damit Soldaten es eine Woche später als Belagerungsbrennholz verbrennen.'
    wheat_barley: 'Eine bescheidene Garbe blassgrüner Gerste, ihre Körner prall gefüllt mit dem Versprechen von Brot oder Bier.'
    wheat_burnt: 'Eine Handvoll von Flammen geschwärztes Korn, dessen goldene Verheißung zu Kohle und bitterer Erinnerung zerfiel.'
    wheat_draconize: 'Weizen grown in vulkanischer Erde, getränkt von Drachenblut, seine Körner heiß genug, um Wasser bei Berührung zu sieden. Ein einziger Laib ernährt eine Familie eine Woche lang, vorausgesetzt, die Familie genießt innere Verbrennung.'
    wheat_flour: 'Manche Abenteurer träumen von legendären Schwertern, andere von knusprigen Baguettes frisch aus dem Ofen. Letztere leben meist länger, wenn auch deutlich weniger ruhmreich.'
    wheat_malt: 'Manche Krieger bevorzugen ihren Mut fermentiert, andere destilliert — dieses Getreide bedient beide Philosophien.'
    wheat_purple: 'Bauern haben auf die harte Tour gelernt, dass die Ernte leuchtender Nutzpflanzen die häufigste Ursache für spontane Zauberei in ländlichen Gemeinden ist.'
    wheat_suize: 'Die Ernte war traditionell; die Authentifizierung alles andere als, für immer verewigt in kalter Blockchain-Umarmung.'
    wheat_tanjirize: 'Goldene Halme, geerntet von den Ahnenfeldern des Dämonenjägers, noch immer nachhallend von der Wärme einer Sonne, die nie wirklich untergeht.'
    wheat_ukraine: 'Dieser robuste Weizen strebt nach fernen Horizonten, seine Fasern gefärbt im Blau wolkenloser Himmel und im Gold endloser Steppen.'
    wheat_white: 'Hochwachsen-Ernte, gesegnet mit uralten Inschriften, um die lange Winterlagerung zu überdauern.'
    whisker_bundle: 'Sechs Feran-Barthaare, jedes ein Praezisionsinstrument, das der Feran sehr gerne zurueckhaette.'
    whisker_weave_belt: 'Sechs Feran trugen unfreiwillig dazu bei, einen Guertel, den keiner von ihnen je oeffentlich tragen wird.'
    whittled_shortbow: 'Waehrend einer langweiligen Wache geschnitzt. Die Sehne ist aus geflochtenem Gras. Effektive Reichweite: deine Phantasie.'
    widow_club: 'Umwickelt mit Witwenseide, die beim Aufprall haertet. Die Spinnen haben ihre Seide nicht freiwillig gegeben.'
    widow_fang_daggers: 'Zwei Fangzähne von zwei verschiedenen Witwen. Ein Einvernehmen haben sie bis heute nicht gefunden.'
    widow_thread: 'Hauchduenn, absurd stark. Gesponnen von etwas, das Beute vier Groessen ueber dem Vernuenftigen frisst.'
    widows_kiss_daggers: ''
    wildling_bow: ''
    wildling_shortbow: 'Aus einem Wildling-Lager gestohlen. Die Besitzer wurden nicht befragt.'
    wildling_spear: ''
    wildlord_club: ''
    wildlord_war_girdle: 'Vor jedem Appell geschnallt. Nie aus einem guten Grund geschnallt.'
    windfire_cuirass: 'Kann sich nicht zwischen Feuer- und Luftaffinität entscheiden. Verbrennt den Rücken, kühlt die Vorderseite.'
    windshear_loop: 'Dreht sich frei am Finger, als wolle er entkommen. Die Verzauberung funktioniert wie vorgesehen.'
    windslicer_gloves: 'Dünn wie ein Versprechen, schnell wie eine Ausrede. Perfekt für flinke Finger.'
    windstrider_sandals: 'Offen genug, um rasch abzutropfen. Nasse Füße trocknen schneller als in schweren Stiefeln.'
    windwalker_vest: 'Leicht genug, um mit der Kolonne Schritt zu halten. Die Marschtrommler trugen nie etwas Schwereres.'
    wisdoms_embrace_gauntlets: 'Zählte jede Requisition zweimal, bevor unterschrieben wurde. Solche Gewohnheiten sterben schwer.'
    wither_concentrate: 'Aus der tiefsten Moorfäule abgefüllt. Der Korken hält selten bis zum Quartiermeister.'
    wither_pastry: 'Ein Gebaeck das alles Organische zersetzt ausser sich selbst. Alchemisten nutzen es als nekrotisches Reagenz.'
    wither_petal: ''
    witherbloom: 'Eine Blume, die die volle Pracht ihrer Blüte erst in den letzten Momenten ihres Verfalls erreicht, wobei sich die Blütenblätter mit theatralischem Timing entfalten, das ein Gespür für Dramatik verrät. Dichter verfassen ganze Elegien über sie, während Alchemisten lediglich ihre Zersetzungsrate mit klinischer Distanz notieren.'
    wizard_staff: 'Als Gehstock getarnt. Das Feuer an der Spitze ist weniger ueberzeugend.'
    wolf_fang_blade: 'Eine Klinge mit eingebetteten Wolfszaehnen. Der Wolf hat sich nicht freiwillig gemeldet.'
    wolf_pelt: 'Dickes Waldwolfsfell. Warm, haltbar, und trägt einen leichten Moschusduft, der Pferde zutiefst beunruhigt.'
    wolf_sinew: 'Elastisch und zäh. Bogenbauer zahlen Spitzenpreise. Die Meinung des Wolfes zu der Sache ist nicht mehr relevant.'
    wolf_sinew_band: 'Aus der Sehne eines Alphawolfs geflochten. Sie strafft sich fast unmerklich, kurz bevor Sie einen Fehler machen.'
    wolf_sinew_belt: 'Das Alphatier gab seine Sehnen nicht freiwillig her. Allerdings melden sich Alphas nie freiwillig für irgendetwas außer Gewalt. Immerhin hält dieser jetzt eine Hose oben.'
    wolf_trek_boots: 'Gehoerte einst einem Wolf, der jeden Jaeger Pandoras zu Fuss abhaengte, den man auf ihn ansetzte.'
    wolfbone_blade: 'Der Griff ist aus einem Wolfsfemur geschnitzt. Er heult bei starkem Wind, oder vielleicht ist es nur der Wind.'
    wolfcrest_helm: 'Gekrönt mit einem präparierten Wolfskopf, der mit einem Ausdruck zwischen bedrohlich und leicht genervt nach vorn starrt. Der Tierpräparator war angeblich betrunken, was die leicht schielenden Augen und die links herausragende Zunge erklärt.'
    wooden_greataxe: 'Mehr Zaunpfahl als Waffe. Die Splitter machen den halben Schaden.'
    wool_fists: "Nichts sagt 'verzweifelter Schläger' so sehr, wie Feinde mit verpupptem Vieh zu verprügeln."
    woolame_old: 'Geborgen aus den glänzenden Tiefen des Verdauungstrakts eines Wooligan, trägt diese Klinge den unverkennbaren Glanz des gastrischen Überlebens.'
    woolamu: 'Diese Strähne gesponnener Wolle wärmt die Brust, bringt aber absolut nichts auf dem Schlachtfeld. Zumindest stirbt der Träger kuschelig.'
    woolano: 'Das perfekte Accessoire für Helden, die ihren Schmuck lieber waschmaschinenfest mögen.'
    wooliboots: 'Perfekt, wenn die Kälte durch die Dielen kriecht und die Würde schon längst zur Tür hinaus ist.'
    wooligan_hammer: 'Der Wooligan benutzte ihn zum Gras platten. Du fandest eine kreativere Verwendung.'
    wooligan_hat: 'Garantiert warm für den Kopf, leider aber nicht für das Gehirn darin.'
    wooling_fleece: 'Ein Büschel fettiger Wolle von einem Lamm gerissen, das absolut nicht zugestimmt hat. Riecht nach Reue und Scheunenboden.'
    wooling_practice_bow: 'Bespannt mit Wooling-Darm. Das Opfer des Woolings war unfreiwillig aber geschaetzt.'
    worldbreaker_battleaxe: ''
    worldheart_striders: 'Besohlt mit etwas aus dem tiefsten Teil des Bruchs, das noch schwach in einem Rhythmus pocht, den niemand genau einem Herzschlag zugeordnet hat — den aber auch niemand ausgeschlossen hat.'
    worldsplitter: 'Die Legende besagt, der erste Testschwung schuf eine Schlucht. Die Legende übertreibt, aber nur leicht.'
    worldwound_brew_of_closing_age_genesis: 'Eines der letzten Rezepte, die aufgeschrieben wurden, bevor die Alchemisten aufhörten, überhaupt etwas aufzuschreiben. Es wirkt; die Randnotiz, die das Warum erklärt, ist nicht erhalten.'
    worldwound_brew_of_closing_age_scar: 'Eingekocht, bis er der Art von Verletzung standhält, die die Wunde austeilt, also jenen, von denen niemand zu genesen erwartet. Manche tun es jetzt.'
    worldwound_carapace_of_world_wound: 'Gewachsen, nicht geschmiedet, aus einer Schale, die die Wunde selbst begann und nie vollendete. Die Lücken sind genau dort, wo ihr die Lust verging.'
    worldwound_circle_of_closing_age: 'In den letzten Jahren geschmiedet, als die Juweliere aufhörten, ihr Werk zu signieren. Niemand war sicher, dass noch jemand da sein würde, den Namen zu lesen.'
    worldwound_circle_of_world_wound: 'Ein Reif, aus einem einzigen Faden Wundmetall gebogen, so nahtlos geschlossen, dass man nicht sagen kann, wo er begann. Das Metall kann es. Es nimmt es übel.'
    worldwound_edge: 'Entlang derselben Linie geführt, an der die Wirklichkeit riss, als sich die Narbe erstmals öffnete. Die Wunde behält die Form des Schnitts; die Klinge erinnert sich an die Wunde.'
    worldwound_fists_of_closing_age: 'Gegen das Ende von allem geschmiedet, als die Schmiede aufhörten zu verzieren und nur noch machten, was halten würde. Diese halten.'
    worldwound_fists_of_world_wound: 'An den Knöcheln mit Wundglas beplattet, das mit jedem Schlag ein wenig abblättert. Beunruhigend für den Feind; von allen anderen als vertretbarer Verschleiß eingestuft.'
    worldwound_pendant: 'Birgt einen Splitter der Wunde selbst, versiegelt so, wie das Wundenorakel alles andere versiegelt — sorgfältig und ohne großes Vertrauen, dass es hält.'
    worldwound_warboots_of_closing_age: 'Besohlt, um den glitschigen Rand der Wunde zu fassen, wo ein Fehltritt zugleich, praktischerweise, der letzte ist, um den du dich je sorgen musst.'
    wound_key: 'Um das herum verschweißt, was das Wundenorakel im Herzen der Narbe versiegelt hält. Sie dreht sich nicht so sehr, als dass man sie überredet — und nur kurz.'
    wound_marked_composite: 'Ein geschichtetes Material, das das Mal der Wunde durch und durch trägt, sodass Schneiden das Mal nie entfernt — es macht nur zwei daraus.'
    wound_marked_elixir: 'Die schlichte Fassung, die die Nahtpriester für sich behalten, ohne das Getue, das sie für Pilger veranstalten. Es schmeckt schlechter und wirkt schneller.'
    wound_marked_elixir_of_origin_line: 'Von den Nahtpriestern aus dem Abfluss ihrer eigenen Arbeit destilliert, den sie für harmlos erklären und selbst trinken, um es zu beweisen. Bislang sind sie noch da.'
    wound_marked_greataxe_of_final_scar: 'Trägt eine Kerbe, die die Wunde ihr zusetzte, bevor der Schmied sie je berührte. Der Schmied arbeitete um die Kerbe herum, nach der vernünftigen Annahme, sie sei aus gutem Grund da.'
    wound_marked_lattice_genesis: 'Dasselbe Gitter, an der ältesten Spalte des Berges statt an der Narbe gewachsen, wo es sauberer ausfällt und, so beteuern die Handwerker, ein wenig selbstgefällig dabei wirkt.'
    wound_marked_lattice_scar: 'Ein sprödes Gerüst, entlang des Narbenrands gewachsen, wo der Kristall die Form des Bruchs annimmt, ob der Handwerker will oder nicht.'
    wound_marked_loop: 'Einmal von der Wunde berührt und mit einer eigenen Narbe zurückgeblieben, die der Ring anmutiger trägt, als es den meisten seiner Träger gelingt.'
    wound_marked_vambraces_of_origin_line: 'Mit demselben Mal geritzt, das die Wunde auf allem hinterlässt, was sie streift. Die Schmiede fügten es absichtlich hinzu, was die Wunde überflüssig und ein wenig beleidigend fand.'
    wound_pilgrim_boots: 'Besohlt für den langen Aufstieg zur Wunde und, seltener, für den Weg hinab. Die meisten Paare machen nur je die eine Reise.'
    wound_salve: 'In die Risse gestopft, die die Narbe selbst nicht schließen will, gedacht für Wunden, die sie eigenhändig verursacht hat. Auch bei kleineren Verletzungen wirksam, was die einzige Gnade dabei ist.'
    wound_ward_bow: 'Bespannt, um Pfeile entlang der Bruchlinien der Narbe zu verschießen, ohne sie weiter zu dehnen — eine Disziplin, die die Wandscherben ausnahmslos durchsetzen.'
    woundstitch_grips: 'Von den Nahtpriestern aus dem genäht, was auf der Höhe des Zenits eine Naht zusammenhält, also aus nicht viel und nicht für lange.'
    woundwall_pike: 'Entlang der letzten Mauer aufgepflanzt, die Pilger überschreiten dürfen, eher Grenzstein als Waffe — bis jemand trotzdem versucht, sie zu überschreiten.'
    wraith_banner: ''
    wraith_boots: 'Jeder Schritt hallt gleichzeitig durch zwei Ebenen. Die Nachbarn in beiden haben eine förmliche Lärmbeschwerde eingereicht, und ausnahmsweise stimmen beide Beschwerden in jedem Detail überein.'
    wraith_crowned_helm: 'Die Krone summt noch mit den letzten Gedanken ihres Vorbesitzers, und die meisten davon erweisen sich als Reue. Ein paar, seltsam konkret, betreffen eine Einkaufsliste, die er nie fertigstellte.'
    wraith_grimoire: 'Eine laufende Liste der Schulden der Toten. Sie aktualisiert sich selbst. Nie zu deinen Gunsten.'
    wraith_lantern_shard: 'Abgebrochen von der Laterne, die ein Geist überallhin trägt, wohin er treibt. Die Flamme darin war nie Feuer — sie ist Erinnerung, und Erinnerung, wie sich zeigt, brennt erheblich langsamer.'
    wraith_lantern_staff: 'Gekrönt von einer Laterne, mit der die Kirchenschiff-Wraiths Kahnfahrer von den sicheren Pfaden locken. Sie brennt noch immer kalt, und sie wirkt noch immer.'
    wraith_scripture: 'Es schreibt sich selbst, wenn niemand hinsieht, in einer Handschrift, die sich mit jedem Leser ändert. Gelehrte, die es studiert haben, sind sich uneins, ob das faszinierend oder zutiefst, persönlich beunruhigend ist. Meist ist es beides.'
    wraith_spellbook: 'Verfasst von jemandem mit sehr starken Meinungen zum Kundenservice des Jenseits.'
    wraith_touch_gauntlets: 'Alles, was sie berühren, wird leicht, höflich tot. Ungefähr die Wirkung Ihres Liebeslebens, wie mehrere Stammgäste in der Taverne angemerkt haben, nur dass man es jetzt wenigstens tragen kann.'
    wraith_whisper_amulet: 'Ein durchscheinender Anhänger, der in einer Sprache murmelt, der man fast folgen kann. Sein letzter Besitzer übersetzte genau ein Wort, bevor er ihn hastig verkaufte: hinter dir. Niemand seither hat um ein zweites gebeten.'
    wraith_whisper_knives: 'In Geister-Ektoplasma gehärtet, schneiden sie sauber durch Rüstung und, etwas weniger sauber, durch Schlaf. Die Wunden heilen ordentlich, berichten die Opfer. Die Träume nie ganz.'
    yajin_starter_dagger: 'Yajins Zwillingsklingen haben bessere Tage gesehen, ihre Schneiden stumpf von unzähligen gescheiterten Versuchen der Gewalt.'
    yeast: 'Ein virulenter Stang parasitärer Pilze, der sich ins Fleisch gräbt und sich nicht abschütteln lässt.'
    yeast_cake: 'Ein aufgegangener Teigkuchen der nach Ehrgeiz und schlechter Lueftung riecht. Handwerker nutzen ihn als Dichtmittel.'
    yeti_frostbite_daggers: 'Aus Yeti-Krallen mitten im Schneesturm geschnitzt. Jeder Schnitt kommt mit einer Gratis-Kälte.'
    yeti_fur_tuft: 'Weiß wie frischer Schnee, warm wie schlechtes Gewissen. Der Yeti brauchte es nicht mehr. Er besteht darauf.'
    yeti_jawbreaker: 'Benannt nach dem, was es mit Kiefern anstellt, gefertigt aus dem, was mal einen hatte.'
    yeti_scalp_hood: 'Riecht nach etwas, das definitiv, wahrscheinlich, fast sicher echt war.'
    yeti_skull_crown: 'Ausgehöhlter Yeti-Schädel, umfunktioniert zur Kopfbedeckung. Der ursprüngliche Besitzer reichte keine Beschwerde ein.'
    yetihide_stompers: 'Mit Yeti-Fell gefütterte Stiefel. Garantiert, dass Ihre Füße warm und Ihre Feinde auf Abstand bleiben — nicht wegen magischer Eigenschaften, sondern weil niemand an jemanden herantreten möchte, der nach nassem Yeti riecht.'
    zenith_alloy: 'Eine Legierung, die nur in der höchsten Esse des Berges gelingt, wo die Luft so dünn ist, dass die Schmiede schwören, sie höre auf zu widersprechen. Sie hält eine Schärfe, die nichts Tieferes erreicht.'
    zenith_crown: 'Getragen von jenem Pilger, der am weitesten den zerbrochenen Gipfel hinaufkommt, bevor der Aufstieg ihn beendet. Sie hat öfter den Kopf gewechselt, als ihr jetziger Träger daran denken möchte.'
    zenith_greaves: 'Geplattet, um den Aufstieg des zerbrochenen Gipfels zu überstehen, die Gelenke dort verstärkt, wo den meisten Pilgern zuerst die Knie versagen.'
    zenith_signet: 'Weist seinen Träger als jemanden aus, der am wahren Zenit stand, vor dem Bruch — laut einer Behauptung, die genau niemand mehr Lebender bestätigen oder widerlegen kann.'
    zenith_staff: 'Aus einem Splitter des ursprünglichen Gipfels des Zenits geschnitten, bevor die Narbe den Rest nahm. Er weist zielsicher auf das, was noch steht.'
    zenithscar_draught: 'Aus dem Schmelzwasser geschöpft, das sich entlang der Narbe sammelt und klar wird, wenn man wartet, trüb, wenn man es eilig hat. Die meisten Trinker hier haben es eilig.'
    zenithscar_draught_of_summit_vigil: 'Bitter genug, um einen Posten durch eine Wache wach zu halten, die der stille Teil von ihm lieber verschlafen würde. Er achtet weder die Wünsche des Postens noch die des Feindes.'
    zenithscar_fangs: 'Zwillingsklingen, an gegenüberliegenden Wänden desselben Risses geschliffen, weshalb sie nie ganz parallel liegen. Der Spalt erledigt die Arbeit, die du lieber verschweigst.'
    zenithscar_greatblade: 'Genau entlang der Naht ausbalanciert, an der die Welt auseinanderbrach, sodass sie stets weiß, wohin sie fallen soll. Meist auf jemanden.'
    zephyr_legwraps: 'So leicht, dass es sich anfühlt, als trüge man nichts. Was ebenfalls eine Option ist, aber weniger schützend.'
    zephyr_silk_strand: 'Windgetränkter Seidenfaden, der von selbst schwebt. Schneider verehren ihn. Ihre Katzen betrachten ihn als persönlichen Feind.'
    zukin_muru: 'A shinobi cowl for people who want to look like they left quietly, even when they slam the door.'
