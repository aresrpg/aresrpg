  job_desc:
    FARMER: Bauern ernten Getreide auf Feldern in der ganzen Welt. Hohere Stufen schalten seltenere Pflanzen frei.
    HERBALIST: Herbalisten sammeln Pflanzen und Blumen fur die Alchemie. Jede Stufe erfordert ein hoheres Berufslevel.
    MINER: Bergleute fordern Erze und Mineralien aus Gesteinsvorkommen. Seltene Metalle werden mit steigendem Level verfugbar.
    SWORD_SMITH: Schwertschmiede fertigen Langschwerter, Schwerter und Dolche. Kombiniere Erze und Legierungen fur machtige Klingenwaffen.
    AXE_SMITH: Axtschmiede fertigen Axte und Streitaxte. Schwere Waffen aus raffinierten Metallen und seltenen Materialien.
    BLUNT_SMITH: Stumpfwaffenschmiede erschaffen Keulen und Streitkolben. Robuste Waffen fur Frontkampfer.
    STAFF_CARVER: Stabschnitzer formen Stabe und Zauberbucher. Unverzichtbare Werkzeuge fur intelligenzbasierte Zauberer.
    BOWYER: Bogenbauer fertigen Bogen und Speere. Prazisionswaffen fur agilitatsorientierte Kampfer.
    ARMORSMITH: Rustungsschmiede schmieden Helme und Brustplatten. Schwere Rustung fur maximalen physischen Schutz.
    TAILOR: Schneider nahen Hosen und Stiefel. Leichte Rustungsteile fur Agilitat und Mobilitat.
    TANNER: Gerber fertigen Gurtel und Handschuhe. Vielseitige Accessoires mit ausgewogenen Werten.
    JEWELER: Juweliere erschaffen Amulette und Ringe. Accessoires mit machtigen magischen Boni.
    ALCHEMIST: Alchemisten brauen Tranke aus gesammelten Krautern. Verbrauchsguter zum Heilen und Verstarken.
    BAKER: Bäcker bereiten Brot und Nahrung aus geerntetem Getreide zu. Verbrauchsgüter für die Gesundheit.
    HANDYMAN: Handwerker fertigen Schlussel, Werkzeuge und Nutzgegenstande. Unverzichtbar fur Dungeons und Spezialaktivitaten.
