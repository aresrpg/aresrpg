  moonpay_desc: Kreditkarte, Apple Pay, Banküberweisung
  transak_desc: Kreditkarte, Banküberweisung, 100+ Länder
  faq_what_is_sui: Was ist SUI?
  faq_what_is_sui_answer: SUI ist eine digitale Währung, wie digitales Bargeld. Sie
    existiert auf einem schnellen, sicheren Netzwerk namens Sui blockchain. Du verwendest
    kleine Beträge für Netzwerkgebühren und den Handel mit anderen Spielern.
  faq_why_sui: Warum nutzt AresRPG SUI?
  faq_why_sui_answer: SUI ist unsere bevorzugte Zahlungsmethode. Transaktionen sind
    sofort (unter 1 Sekunde) und kosten Bruchteile eines Cents. Keine Zwischenhändler-Gebühren.
    In Zukunft werden wir möglicherweise traditionelle Währungen (USD, EUR usw.) unterstützen,
    aber das erfordert erheblichen rechtlichen Aufwand und bringt hohe Gebühren und
    Steuern mit sich, die wir noch nicht tragen können.
  faq_legal: Ist das legal?
  faq_legal_answer: Ja. Der Kauf und Besitz von Kryptowährung ist in den meisten Ländern
    legal. SUI ist ein legitimes digitales Asset, das auf großen regulierten Börsen
    weltweit gehandelt wird. AresRPG nutzt es für Netzwerkgebühren und den Handel zwischen Spielern.
  faq_eula: Ist es laut den Nutzungsbedingungen des Spiels erlaubt?
  faq_eula_answer: Ja. Solange Kryptowährung ausschließlich als Zahlungsmittel verwendet
    wird und keine NFTs oder spekulative Krypto-Machenschaften involviert sind, ist
    es vollständig konform. Viele Spiele unterstützen sogar Krypto-Zahlungen.
  faq_access: Wer kann auf mein Wallet zugreifen?
  faq_access_answer: "Nur du. Dein Wallet wird aus deinem Google-Login über Sui's
    zkLogin-Technologie erstellt. Niemand (nicht einmal das AresRPG-Team) kann auf
    deine Mittel zugreifen oder sie bewegen. Wichtig: Dieses Wallet ist nur für AresRPG-Aktivitäten
    gedacht. Lagere hier keine großen Beträge."
  faq_balance: Ich habe SUI gesendet, aber mein Guthaben hat sich nicht aktualisiert?
  faq_balance_answer: Keine Sorge. Unser Aktualisierungssystem kann vorübergehend
    langsam sein. Überprüfe, ob du SUI an die richtige Adresse gesendet hast (kopiere
    sie von oben), und wenn es immer noch nicht angezeigt wird, kontaktiere das Team
    auf Discord mit deiner Transaktions-ID für weitere Hilfe.
