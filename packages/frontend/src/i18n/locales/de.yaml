    weapon_bow: Bogen
    weapon_axe: Axt
    weapon_mace: Streitkolben
    weapon_club: Keule
    weapon_sword: Schwert
    marketplace: MARKTPLATZ
    marketplace_desc: Ausrüstung und Charaktere listest du im Kiosk zu einem Preis deiner Wahl; Käufer zahlen sofort. Ressourcen werden stattdessen gegen SUI in Swap-Pools gehandelt, ohne Angebote. Jeder Verkauf zahlt eine Tantieme von 10% — der Marktplatz ist der einzige Weg zu verkaufen.
    section_forgemagie: FORGEMAGIE
    forgemagie_desc: Forgemagie ist das Runen-Herstellungssystem. Zerstöre Ausrüstung zu Runen und wende diese auf andere Gegenstände an, um deren Werte zu verändern. Ein risikoreiches, aber lohnendes Endgame-System zur Perfektion der Ausrüstung.
    crushing: ZERSTÖREN
    crushing_desc: 'Jede Stat-Zeile des zerstörten Gegenstands wird unabhängig gewürfelt — höhere Werte und schwerere Stats erzeugen mehr Runen. Es gibt keinen Server: Der Ertragsteiler kombiniert eine feste Kurve pro Gegenstandslevel mit dem eigenen Taux des Item-Templates, einem gemeinsamen On-Chain-Inflationskoeffizienten (1%-4000%), den das Zerstören selbst für dieses Template senkt und für seine Nachbarn anhebt.'
    crushing_tiers_desc: Die Runenstufe (Ba/Pa/Ra) wird probabilistisch ausgewählt. Höhere Werte bevorzugen Ra-Runen.
    rune_tiers: RUNENSTUFEN
    rune_ba: 'Stufe 1: geringstes Gewicht pro Rune'
    rune_pa: 'Stufe 2: mittleres Gewicht pro Rune'
    rune_ra: 'Stufe 3: höchstes Gewicht pro Rune, doppelte EP'
    rune_weight_desc: Jede Rune hat ein Gewicht gleich ihrem Wert multipliziert mit dem Einheitsgewicht des Stats. Das Gewicht wird automatisch berechnet.
    rune_table_stat: STAT
    rune_table_note: Reichweite-, Bewegungs- und Aktions-Runen gelten je einmal; Kritische Chance bis zu 10-mal. Kritisch und Kritische Ergebnisse haben überhaupt keine Rune.
    rune_stat_range: Reichweite
    rune_stat_movement: Bewegung
    rune_stat_action: Aktion
    rune_stat_raw_damage: Rohschaden
    rune_stat_critical_chance: Kritische Chance
    rune_stat_earth_resist: Erdresistenz
    rune_stat_fire_resist: Feuerresistenz
    rune_stat_water_resist: Wasserresistenz
    rune_stat_air_resist: Luftresistenz
    stat_unit_weights: STAT-EINHEITSGEWICHTE
    stat_unit_weights_desc: Jeder Stat hat ein Einheitsgewicht, das seine Kampfstärke widerspiegelt. Items mit schweren Stat-Linien ergeben mehr Runen beim Zermalmen, verbrauchen mehr Item-Budget und sind schwerer zu über-schmieden.
    rune_application: RUNENANWENDUNG
    rune_application_desc: 'Schaltet sich auf Stufe 70 in EINEM BELIEBIGEN Beruf frei — Sammeln oder Handwerk, je nachdem, welchen du zuerst hochgelevelt hast. Wende Runen einzeln auf Ausrüstung an, um deren Werte zu verändern. Drei Ergebnisse sind möglich:'
    outcome_critical_success: Kritischer Erfolg
    outcome_critical_success_desc: Rune gelingt, keine Werte verloren
    outcome_neutral: Neutraler Erfolg
    outcome_neutral_desc: Rune gelingt, andere Werte können sinken
    outcome_critical_failure: Kritischer Fehlschlag
    outcome_critical_failure_desc: Rune scheitert, Werteverlust gleich Runengewicht
    success_rate: ERFOLGSRATE
    success_rate_desc: 'Der Erfolg hängt davon ab, wie nah der Wert am Maximum ist: nahe 0% sind ~99% Erfolg, nahe Max sind ~50%, und exotische Stats liegen unabhängig vom Level bei ~1%. Ob ein Erfolg Kritisch (kein Verlust) oder Neutral (Gewicht bezahlt) ausfällt, verschiebt sich genauso, plus kleine +0,2% pro Berufsstufe über 1. Es gibt keine Obergrenze dafür, an welchem Gegenstandslevel dein Beruf arbeiten kann.'
    puits: SENKE (PUITS)
    puits_desc: Ein in der Oberfläche angezeigter Gewichtszähler, der sich ansammelt, wenn Werteverluste das Runengewicht übersteigen. Er absorbiert zukünftige Verluste, bevor andere Werte betroffen sind. Setzt sich zurück, wenn der Gegenstand die Forgemagie-Werkbank verlässt.
    over_maging: ÜBER-SCHMIEDEN
    over_maging_desc: Treibe Werte über ihr natürliches Maximum. Jede Wertzeile ist auf 101 zusätzliches Gewicht begrenzt. Das maximale Über-Schmieden hängt vom Einheitsgewicht des Stats ab — ein leichter Stat wie Vitalität (Gewicht 0,2) kann um ~505 Punkte überschritten werden, ein schwerer wie Weisheit (Gewicht 3) nur um ~33.
    forgemagie_tips: TIPPS
    forgemagie_tips_desc: 'Für Exo/Over-Mage: Entferne zuerst günstige Stats, um eine große Senke aufzubauen, dann setze den schweren Stat mit Puffer durch, dann füge verlorene Stats wieder hinzu (einfach, da weit unter Maximum). Bewege den Gegenstand nicht während einer Sitzung. Die Senke wird zurückgesetzt. Over-Mage- und exotische Stats gehen bei Fehlschlägen zuerst verloren.'
    forgemagie_xp: ERFAHRUNG
    forgemagie_xp_desc: 'EP werden nur bei Erfolg vergeben (Kritisch oder Neutral). Höherstufige Gegenstände und schwerere Runen geben deutlich mehr EP. Ra-Runen gewähren doppelte EP im Vergleich zu Ba- und Pa-Runen. Formel: max(1, Runengewicht × (1 + Gegenstandslevel / 50) × Stufenmultiplikator), wobei der Multiplikator 2 für Ra und 1 sonst beträgt.'
    action_points: AKTIONSPUNKTE (AP)
    movement_points: BEWEGUNGSPUNKTE (BP)
    critical_stat: KRITISCH
    wisdom_xp: WEISHEITS-XP-BONUS
    wisdom_xp_desc: Weisheit erhöht die gesamte XP, die du erhältst. Bei 600 Weisheit erhältst du doppelte XP, darüber mit abnehmendem Ertrag.
    chance_loot: GLÜCK & BEUTE
    chance_loot_desc: Dein Glücks-Wert erhöht die Droprate jedes Beuteeintrags. Bei 700 Glück wird jede Droprate verdoppelt. Eine Droprate kann garantiert nie überschreiten.
