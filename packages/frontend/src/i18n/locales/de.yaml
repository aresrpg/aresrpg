    base_stats: BASIS-STATS
    stat_vitality: Vitalität
    stat_vitality_desc: +1 max LP pro Punkt
    stat_wisdom: Weisheit
    stat_wisdom_desc: XP-Gewinn-Bonus
    stat_strength_desc: Erdschaden-Skalierung
    stat_intelligence_desc: Feuerschaden, Heilungsskalierung
    stat_chance_desc: Wasserschaden, mehr Beute
    stat_agility_desc: Luftschaden-Skalierung
    derived_formulas: ABGELEITETE FORMELN
    max_health: MAX LEBEN
    loot_desc: Jeder Beuteeintrag hat seine eigene feste Chance, die unabhängig gewürfelt wird, wenn der Mob stirbt. Die Menge ist zufällig innerhalb der Spanne des Eintrags.
    stat_rolling: STAT-WÜRFE
    stat_rolling_desc: Jeder Stat wird gleichmäßig in seiner Template-Reichweite gewürfelt. Jeder Wert ist gleich wahrscheinlich.
    archimobs: ARCHI-MOBS
    archimobs_desc: 0,5% Chance, stattdessen als Archimob zu spawnen — eine benannte, dauerhaft stärkere Variante. Der einzige Seltenheits-Mechanismus, den Mobs haben.
    max_members: Max Mitglieder
    groups_desc: Eine Gruppe ist ein gemeinsamer Kader von bis zu {{max}} Spielern mit Anführerwahl. Gruppiert zu sein bewirkt in einem Kampf für sich genommen nichts — jeder, gruppiert oder nicht, muss seine eigene Kampfbeitritts-Transaktion senden, um teilzunehmen; es gibt keine passive Aufnahme oder Aufnahme durch Nähe.
    groups_xp: EP-AUFTEILUNG
    groups_xp_desc: Die gesamte EP eines gewonnenen Kampfes wird gleichmäßig auf jeden Kämpfer darin aufgeteilt, dann wirken die eigene Weisheit jedes Spielers und der Alters-Bonus der Mobgruppe zusätzlich. Wie viel Schaden du persönlich verursacht hast, ändert deinen Anteil nicht.
    groups_loot: BEUTE-AUFTEILUNG
    groups_loot_desc: Die Beute wird nicht geteilt. Jeder siegreiche Kämpfer würfelt unabhängig die vollständige Beutetabelle der Mobgruppe mit seinem eigenen Glücks-Stat — eine größere Gruppe verringert niemandes Chancen.
    dungeons_desc: 'Dungeons betrittst du von überall in ihrer Welt aus mit einem Schlüssel — keine Gruppeninstanz: Alle Schlüsselinhaber darin teilen sich denselben Raum, genau wie in der offenen Welt.'
    dungeon_entry: Eingang
    dungeon_entry_value: Schlüsselgegenstand, von überall in der Welt
    dungeon_instance: Instanz
    dungeon_instance_value: Geteilt — alle Schlüsselinhaber sehen sich
    dungeon_completion: Abschluss
    dungeon_completion_value: Jeden Raum leeren
    dungeon_reward: Belohnung
    dungeon_reward_value: Standard-Beuteverteilung
    classes_desc: 12 Klassen. Waffen sind universell — jede Klasse kann jeden Waffentyp ausrüsten und verwenden — aber das Führen der für deine Klasse vorgesehenen Waffe gewährt +10% Schaden und kritischen Schaden. Jede Klasse schaltet ihre Zauber auf festen Leveln frei, während du aufsteigst.
    table_class: KLASSE
    table_weapon: AFFINITÄT
    table_hp: LP
    role_warrior: Krieger
    role_assassin: Assassine
    role_berserker: Berserker
    role_druid: Druide
