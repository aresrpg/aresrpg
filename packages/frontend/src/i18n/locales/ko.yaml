    combat_desc: 전투는 격자 위에서 턴제로 진행됩니다. 내 턴에 AP로 주문을 쓰고 MP로 이동합니다. 시야 필요 여부는 주문마다 다르며 대부분은 필요합니다. 월드에서는 몬스터 무리와, 콜리제움에서는 플레이어와 싸웁니다. 피해는 해당 원소 능력치와 고정 피해 보너스에 따라 증가합니다.
    elements: 원소
    element_earth: 땅
    element_fire: 불
    element_water: 물
    element_air: 바람
    stat_strength: 힘
    stat_intelligence: 지능
    stat_chance: 행운
    stat_agility: 민첩
    critical_hits: 치명타
    crit_desc: 주문과 무기는 각각 N분의 1로 표시되는 기본 치명타 확률이 있습니다. 치명타 능력치는 N을 낮추지만 최종 확률은 2분의 1(50%)을 넘지 않습니다.
    crit_bonus_desc: 치명타가 나면 일반 효과 대신 더 강한 피해나 추가 효과 등 전용 치명타 효과가 적용됩니다.
    blocking: 보호막
    blocking_desc: 일부 주문은 해당 원소의 피해를 소진될 때까지 흡수하는 보호막을 줍니다. 지구력이나 방어 자세는 없으며 피해 흡수는 보호막으로만 가능합니다.
    resistance: 저항
    resistance_desc: 원소 저항은 최종 피해를 비율로 줄이며 원소마다 최대 50%입니다. 음수 저항은 약점으로 작용해 피해를 늘립니다.
    mob_level_bands: 몬스터 레벨 구간
    mob_level_bands_desc: 정해진 레벨 구간에서 몬스터의 체력, 경험치, 민첩, 지혜, 양수 저항 및 조정 가능한 주문 수치는 60%에서 160%로 증가합니다. AP와 MP는 100%에서 130%로 증가합니다. 음수 저항은 반대로 최소 레벨의 160%에서 최대 레벨의 60%로 약점 크기가 줄어듭니다.
    life_steal: 생명력 흡수
    life_steal_desc: 흡혈 효과는 피해를 주고 대상이 실제로 잃은 체력의 절반만큼 시전자를 회복합니다. 플레이어만 회복하며 몬스터가 같은 주문을 쓰면 피해만 줍니다.
    life_steal_note: 먼저 일반 피해 공식을 적용한 뒤 원래 대상이 실제로 잃은 체력의 절반을 회복합니다. 다른 전투원에게 전환되거나 대상이 치유로 바꾼 피해는 흡수하지 못합니다.
    chatiment: 응징
    chatiment_desc: 응징은 실제로 잃은 비치명적 체력을 해당 능력치로 바꿉니다. 행동 중인 전투원의 매 턴마다 별도 상한이 있으며 이후 턴의 보너스는 각각 5턴 동안 중첩됩니다. 몬스터 피해는 전부 반영하고 플레이어 피해와 상한은 절반입니다. Ares에는 침식이 없습니다.
    healing: 치유
    healing_desc: 치유는 주문 기본값에 지능 비율을 적용하고 장비와 강화 효과의 고정 치유 보너스를 더합니다. 대상의 최대 체력을 넘을 수 없습니다.
    healing_intel_value: 지능 1당 치유량 +1%
    heal_bonus: 치유 보너스
    heal_bonus_value: 지능 계산 후 장비와 강화 효과의 고정 보너스 추가
    mobs: 몬스터
    healing_mobs_value: 지능만 적용, 치유 보너스 없음
    leveling_desc: 최대 레벨은 200입니다. 자신의 레벨대 몬스터와 싸우면 효율적으로 경험치를 얻습니다.
    points_per_level: 레벨당 포인트
    stat_points: 능력치 포인트
    stat_points_value: 레벨당 {{n}}
    stat_costs_desc: 능력치 비용은 직업과 현재 기본 수치에 따라 달라집니다. 직업별 페이지에서 전체 성장표를 확인하세요.
    spell_points: 주문 포인트
    spell_points_value: 레벨당 {{n}}
    xp_milestones: 경험치 이정표
    level_10: 레벨 10
    level_50: 레벨 50
    level_100: 레벨 100
    base_stats: 기본 능력치
    stat_vitality: 활력
    stat_vitality_desc: 1포인트당 최대 체력 +1
    stat_wisdom: 지혜
    stat_wisdom_desc: 경험치 획득 보너스
    stat_strength_desc: 땅 피해 증가
    stat_intelligence_desc: 불 피해 및 치유량 증가
    stat_chance_desc: 물 피해와 추가 전리품
    stat_agility_desc: 바람 피해 증가
    derived_formulas: 파생 공식
    max_health: 최대 체력
    loot_desc: 처치한 몬스터마다 드롭 목록의 각 항목을 한 번 추첨합니다. 성공한 항목은 정해진 범위 안에서 무작위 수량을 줍니다.
    stat_rolling: 능력치 추첨
    stat_rolling_desc: 각 능력치는 템플릿 범위에서 균등하게 추첨되며 모든 값의 확률이 같습니다.
    archimobs: 희귀 변종 몬스터
    archimobs_desc: 해당 몬스터마다 1% 확률로 이름이 있고 항상 더 강한 희귀 변종으로 바뀝니다. 각 개체는 독립적으로 추첨됩니다.
    max_members: 최대 인원
    groups_desc: 파티는 파티장을 정할 수 있는 최대 {{max}}명의 명단입니다. 파티 소속만으로 전투에 들어가지는 않으며 모두 자신의 참가 거래를 보내야 합니다. 가까이 있다는 이유만으로 자동 참가하지 않습니다.
    groups_xp: 경험치 분배
    groups_xp_desc: 처치한 몬스터가 기본 경험치 총량을 만듭니다. 자격을 갖춘 전투원이 Retro 파티 계수를 제공하고 양측 총레벨 차이로 경험치가 줄어든 뒤 개인 레벨 비중으로 배분됩니다. 최고 레벨의 3분의 1 미만인 플레이어는 계수를 높이지 않습니다. 지혜는 마지막에 적용하며 개인 피해량은 무관합니다.
    groups_loot: 전리품 분배
    groups_loot_desc: 처치한 몬스터마다 공동 드롭을 한 번 추첨합니다. 나온 아이템은 승리 플레이어에게 순서대로 배분하며 인원이 늘어도 추첨 횟수는 늘지 않습니다.
    dungeons_desc: 해당 도시의 던전 입구로 가서 열쇠를 사용하고 방을 순서대로 돌파하세요. 던전마다 하나의 준비 대기실이 있습니다.
    dungeon_entry: 입장
    dungeon_entry_value: 도시 입구에서 알맞은 열쇠 사용
    dungeon_instance: 인스턴스
    dungeon_instance_value: 공개 또는 파티 전투가 있는 던전 대기실
    dungeon_completion: 완료
    dungeon_completion_value: 모든 방 돌파
    dungeon_reward: 보상
    dungeon_reward_value: 일반 전리품 배분
    classes_desc: 직업은 12개입니다. 모든 직업이 모든 무기를 쓸 수 있지만 직업에 맞는 무기는 일반 및 치명타 피해가 10% 증가합니다. 각 직업의 주문은 정해진 레벨에 열립니다.
    table_class: 직업
    table_weapon: 친화 무기
    table_hp: HP
    role_warrior: 전사
    role_assassin: 암살자
    role_berserker: 광전사
    role_druid: 드루이드
    role_chronomancer: 시간술사
    role_guardian: 수호자
    role_archer: 궁수
    role_prospector: 탐광자
    role_brawler: 싸움꾼
    role_tomoda: 야수 조련사
    role_gambler: 도박사
    role_healer: 치유사
    weapon_daggers: 단검
    weapon_spear: 창
    weapon_bow: 활
    weapon_axe: 도끼
    weapon_sword: 검
    marketplace: 거래소
    marketplace_desc: 장비와 캐릭터는 원하는 가격으로 키오스크에 등록하고 구매자가 즉시 결제합니다. 자원은 판매 등록 없이 교환 풀에서 SUI와 교환됩니다. 모든 판매에 10% 로열티가 적용되며 거래소가 유일한 판매 경로입니다.
    section_forgemagie: 룬 강화
    forgemagie_desc: 룬 강화는 장비를 분쇄해 룬을 얻고 다른 장비에 적용해 능력치를 바꾸는 시스템입니다. 장비를 완성하기 위한 고위험·고보상 후반 콘텐츠입니다.
    crushing: 분쇄
    crushing_desc: 분쇄한 아이템의 능력치 줄마다 독립적으로 추첨하며 높은 수치와 무거운 능력치일수록 더 많은 룬을 줍니다. 서버가 결과를 결정하지 않습니다. 생산량 제수는 아이템 레벨 곡선과 템플릿의 온체인 계수(1%~4000%)를 결합합니다. 분쇄하면 해당 템플릿 계수는 내려가고 이웃 템플릿은 올라갑니다.
    crushing_tiers_desc: 룬 등급(Ba/Pa/Ra)은 확률로 정해집니다. 능력치가 높을수록 Ra 룬이 나올 가능성이 커집니다.
    rune_tiers: 룬 등급
    rune_ba: '1등급: 룬당 무게 최소'
    rune_pa: '2등급: 룬당 무게 중간'
    rune_ra: '3등급: 룬당 무게 최대, 경험치 두 배'
    rune_weight_desc: 룬 무게는 수치에 단위 무게를 곱한 뒤 Retro 방식으로 올림합니다. 자동으로 계산됩니다.
    rune_table_stat: 능력치
    rune_table_note: 사거리, 이동, 행동 룬은 각각 한 번, 치명타 확률 룬은 최대 10번 적용됩니다. Critical과 Critical Outcomes에는 룬이 없습니다.
    rune_stat_range: 사거리
    rune_stat_movement: 이동
    rune_stat_action: 행동
    rune_stat_raw_damage: 고정 피해
    rune_stat_critical_chance: 치명타 확률
    rune_stat_earth_resist: 땅 저항
    rune_stat_fire_resist: 불 저항
    rune_stat_water_resist: 물 저항
    rune_stat_air_resist: 바람 저항
    stat_unit_weights: 능력치 단위 무게
    stat_unit_weights_desc: 각 능력치의 단위 무게는 전투력을 반영합니다. 무거운 능력치는 분쇄 시 더 많은 룬을 주지만 아이템 예산을 더 쓰고 한도 이상 강화하기 어렵습니다.
    rune_application: 룬 적용
    rune_application_desc: 테스트를 위해 해당 제작 직업 1레벨부터 임시 개방되어 있습니다. 장비에 룬을 하나씩 적용해 능력치를 바꿀 수 있으며 결과는 세 가지입니다.
    outcome_critical_success: 대성공
    outcome_critical_success_desc: 룬 성공, 능력치 손실 없음
    outcome_neutral: 일반 성공
    outcome_neutral_desc: 룬 성공, 다른 능력치가 감소할 수 있음
    outcome_critical_failure: 대실패
    outcome_critical_failure_desc: 룬 실패, 룬 무게만큼 능력치 손실
    success_rate: 성공 확률
    success_rate_desc: 성공률은 최대치에 얼마나 가까운지에 따라 달라집니다. 0% 근처는 약 99%, 최대치 근처는 약 50%, 특수 능력치는 레벨과 무관하게 약 1%입니다. 무손실 대성공과 무게를 지불하는 일반 성공의 비율도 비슷하게 변하며 직업 1레벨 초과분마다 0.2%가 추가됩니다. 작업 가능한 아이템 레벨에는 제한이 없습니다.
    puits: 잔여 무게(PUITS)
    puits_desc: 능력치 손실이 룬 무게를 넘으면 UI에 표시되는 잔여 무게가 쌓입니다. 이후 다른 능력치보다 먼저 손실을 흡수하며 작업대나 소유자가 바뀌어도 아이템에 남습니다.
    over_maging: 한도 초과 강화
    over_maging_desc: 능력치를 자연 최대치 이상으로 올릴 수 있으며 각 줄의 추가 무게는 101까지입니다. 가벼운 활력(무게 0.25)은 약 404포인트를, 무거운 지혜(무게 3)는 약 33포인트를 더 올릴 수 있습니다.
    forgemagie_tips: 도움말
    forgemagie_tips_desc: 특수 능력치나 초과 강화를 할 때는 저렴한 능력치를 먼저 줄여 잔여 무게를 쌓고 어려운 능력치를 적용한 뒤 손실을 복구하세요. 최대치보다 한참 낮으면 복구가 쉽습니다. 실패하면 초과 및 특수 능력치를 먼저 잃습니다.
    action_points: 행동 포인트(AP)
    movement_points: 이동 포인트(MP)
    critical_stat: 치명타
    wisdom_xp: 지혜 경험치 보너스
    wisdom_xp_desc: 활성 효과를 포함한 유효 지혜 1당 경험치가 1% 증가합니다. 유효 지혜 100이면 경험치가 두 배입니다.
    chance_loot: 행운과 전리품
    chance_loot_desc: 활성 효과를 포함한 승리 팀의 평균 유효 행운이 각 드롭률을 높입니다. 평균 행운 600이면 두 배가 되지만 100%를 넘지는 않습니다.
    mob_loot_band: 몬스터 레벨과 드롭률
    mob_loot_band_desc: 기본 확률은 구간 중간값입니다. 몬스터 레벨에 따라 80%~120%로 조정되지만 최대 100%입니다. 고정 레벨 몬스터는 기본 확률을 그대로 쓰며 드롭 수량은 레벨에 따라 변하지 않습니다.
