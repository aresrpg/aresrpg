  game_description: AresRPG는 Sui 기반 브라우저 복셀 MMORPG입니다. 캐릭터, 아이템과 성장 기록이 온체인에 존재합니다.
  game_title: AresRPG · 온체인 복셀 MMORPG
  world_image: AresRPG 복셀 월드
  sale_description: KARES 첫 공개 판매입니다. AresRPG의 다음 장을 함께 만들어 주세요.
  formula_chastisement: G = min(ΔHP × S, 상한 × S − 현재 턴 G) · S = 몬스터 1, 플레이어 ½
  formula_drop: 드롭률 = min(100%, 기본값 × 몬스터 구간 × (600 + 팀 평균 행운) / 600)
  formula_xp: 경험치 = 기본 경험치 총량 × 파티 계수 × 레벨 균형 × 플레이어 레벨 / 파티 레벨 × (100 + 지혜) / 100
