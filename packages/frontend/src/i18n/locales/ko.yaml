tutorial:
  progress: '{{current}} / {{total}}'
  skip: 튜토리얼 건너뛰기
  back: 뒤로
  next: 다음
  finish: 완료
  fight_enter: 전투 입장
  reset_title: 튜토리얼
  reset_hint: 다음에 각 페이지를 방문할 때 소개를 다시 표시합니다.
  reset_action: 초기화
  world_compass_title: 월드와 공유 구역
  world_compass_body: AresRPG에는 성장에 따라 열리는 여러 월드가 있습니다. 각 월드는 몬스터, 자원, 던전이 있는 구역으로 나뉩니다. 누구나 구역을 발견할 수 있으며 발견 내용은 모든 플레이어에게 공유됩니다.
  world_hud_title: 체력과 빠른 슬롯
  world_hud_body: 이 HUD에는 체력과 빠른 아이템 슬롯이 표시됩니다. 전투가 시작되면 같은 자리가 주문 바로 바뀝니다.
  world_fps_title: 월드 설정
  world_fps_body: 지형은 공개된 데이터에서 결정론적으로 생성됩니다. Sui는 월드와 기준 X/Z 위치를 저장하고 높이는 로컬 지형에서 계산합니다. 따라서 평면 모드는 같은 공간의 표현만 바꿉니다. 그래픽 품질을 바꾸거나 월드 전투를 파티원 전용으로 제한할 수도 있습니다.
  world_character_title: 월드의 플레이어
  world_character_body: 현재 조종 중인 캐릭터입니다. 근처의 다른 캐릭터를 마우스 오른쪽 버튼으로 클릭하면 상호작용 메뉴가 열립니다.
  world_character_tabs_title: 여러 캐릭터로 플레이
  world_character_tabs_body: 최대 여섯 캐릭터를 소유할 수 있습니다. 다른 내 캐릭터를 파티에 초대하고 파티장 따라가기를 켜면 함께 이동하며 도착 후 참가 가능한 월드 전투에 자동으로 합류합니다.
  fight_title: 첫 온체인 전투
  fight_body: 전투는 턴제로 진행됩니다. 이동과 주문을 선택하면 행동이 함께 준비됩니다. 턴 종료는 전체 턴을 Sui 거래 한 건으로 제출하고 다음 플레이어가 행동할 때까지 이어지는 몬스터 턴을 계산합니다. 전투의 기준 상태는 모두 Sui에서 확정됩니다. 승리 후 마지막 Sui 거래가 온체인 난수로 공동 전리품을 추첨하고 각 보상을 지정된 플레이어의 가방에 넣습니다.
  equipment_gear_title: 장비
  equipment_gear_body: 장착한 아이템은 선택한 캐릭터의 소유입니다. 장비를 인형에 드래그하고 보너스를 확인한 뒤 변경 사항을 함께 확정하세요.
  equipment_inventory_title: 공유 가방
  equipment_inventory_body: 이 계정의 모든 캐릭터가 가방을 공유합니다. 위에서 다른 캐릭터를 선택해 같은 사용 가능한 아이템을 장착할 수 있습니다.
  stats_title: 능력치
  stats_body: 능력치 포인트로 강해지세요. 활력은 체력을, 지혜는 경험치와 AP/MP 감소 저항을 높입니다. 행운은 물 피해와 드롭 확률을, 민첩은 바람 피해와 치명타, 태클 및 태클 탈출 능력을 높입니다.
  spells_title: 주문
  spells_body: 캐릭터가 성장하면 새 주문이 열립니다. 레벨업으로 얻은 주문 포인트를 여기서 사용해 열린 주문을 강화할 수 있습니다.
  jobs_title: 생산 직업
  jobs_body: 채집과 제작 진행도를 확인하고 제작법을 살펴보며 아이템을 만드세요. 캐릭터가 여러 명이면 설정에서 전용 제작 캐릭터로 이 페이지를 고정할 수 있습니다.
  runeforge_title: 룬 대장간
  runeforge_body: 해당 제작 직업이 {{level}}레벨에 도달하면 룬으로 장비를 강화할 수 있습니다. 아이템을 분쇄해 룬을 얻고 여기서 사용하세요.
