  welcome_body: AresRPG는 배우고 준비하며 영리하게 플레이하는 사람에게 보답합니다. SUI를 최대한 아끼며 플레이를 최적화하고 자동화하는 법을 익히세요. 이 여정으로 첫걸음을 시작해 보세요.
  hoe_title: 누구에게나 괭이는 필요하죠.
  hoe_body: 나우비스는 첫 번째 월드입니다. 더 강한 장비로 위험한 월드에 도전하고, 채집 도구로 제작 재료를 모으세요. 다른 플레이어에게 {{item}}을(를) 사거나 캐릭터 → 생산 직업 → 만능공에서 직접 만드세요.
  hoe_objective: '{{item}} 소유'
  wheat_title: 이제 손에 흙을 묻혀 볼까요.
  wheat_body: 직접 장비를 만들려면 재료부터 모아야 합니다. 밀은 음식과 장비 재료에 쓰이니 시작하기 좋습니다. 나우비스에서 밀을 찾아 첫 수확을 해 보세요!
  wheat_objective: 밀 수확
  pickaxe_title: 다음은 채광 스타입니다.
  pickaxe_body: 다음 업그레이드에는 농작물만으로 부족합니다. {{item}}이(가) 있으면 장비 제작용 광물을 캘 수 있습니다. 거래소에서 구하거나 직접 만드세요. 채광 경력도 첫걸음부터 시작이니까요.
  pickaxe_objective: '{{item}} 소유'
  quartz_title: 돌 하나도 놓치지 마세요.
  quartz_body: 밀만으로는 장비를 갖출 수 없습니다. 무기와 장신구에는 석영 같은 광물도 필요합니다. 곡괭이로 다음 제작에 쓸 재료를 모으세요.
  quartz_objective: 석영 채집
  sickle_title: 한 수 위의 날카로움.
  sickle_body: 식물과 버섯은 물약과 제작 재료를 제공합니다. {{item}}으로 약초 채집을 시작할 수 있습니다. 다른 플레이어에게 사거나 직접 만드세요.
  sickle_objective: '{{item}} 소유'
  mushroom_title: 버섯 하나 더.
  mushroom_body: 제작을 계속하려면 농작물과 광물 외에도 재료가 필요합니다. 초록 버섯은 물약, 가죽 등 여러 재료에 쓰입니다. 첫 버섯을 채집하고 채집 직업을 키워 더 많은 재료를 해금하세요.
  mushroom_objective: 초록 버섯 채집
  token_title: 행운은 직접 만드는 것.
  token_body: 다음 제작에는 많은 아이템이 필요합니다. 행운을 높이면 전투에서 전리품을 얻을 확률이 오릅니다. {{item}} 부적을 찾아 장착해 보세요!
  token_objective: '{{item}} 소유'
  croissant_title: 전투 전에 빵부터.
  croissant_body: 전투에서 패배하면 체력이 0이 됩니다. 회복을 기다리거나 음식을 먹고 빨리 복귀할 수 있습니다. {{item}}을(를) 구하거나 캐릭터 → 생산 직업 → 제빵사에서 구워 보세요.
  croissant_objective: '{{item}} 소유'
  lorito_title: 깃털을 좀 날려 볼 시간.
  lorito_body: 더 강한 장비에는 밀밭에서 구할 수 없는 재료가 필요합니다. 던전에는 새로운 전리품과 경험치가 있지만 싸워서 얻어야 합니다. 회복 음식과 열쇠를 챙겨 테베의 Gilded Lorito로 가서 마지막 방을 돌파하세요.
  lorito_objective: Gilded Lorito 던전 완료
  suize_title: 마지막 비밀.
  suize_body: 잘했어요, 모험가. 더 좋은 수확은 새 제작법으로 이어집니다. 마지막 과제는 직접 Suize를 채집하는 것입니다. 어디서 찾느냐고요? 처음으로 스스로 풀어 볼 문제라고 생각하세요.
  suize_objective: Suize 수확
  welcome_objective: ''
  finished_objective: ''
