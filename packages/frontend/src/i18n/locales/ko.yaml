wallet_legacy:
  sui: SUI
  how_to_get: SUI를 얻는 방법
  your_address: 내 지갑 주소
  send_sui: 이 주소로 SUI를 보내세요. 클릭하면 복사됩니다.
  buy_directly: 직접 구매
  buy_with_card: 신용카드로 SUI를 구매하면 지갑으로 바로 받습니다.
  buy_on_exchange: 거래소에서 구매
  withdraw_to_wallet: 거래소에서 SUI를 구매한 뒤 위 지갑 주소로 출금하세요.
  faq: 자주 묻는 질문
  wallet_description: 본인만 접근할 수 있는 개인 지갑입니다. 네트워크 수수료와 플레이어 거래에 쓸 SUI를 입금하세요.
  moonpay_desc: 신용카드, Apple Pay, 계좌 이체
  transak_desc: 신용카드, 계좌 이체, 100개 이상의 국가
  faq_what_is_sui: SUI란 무엇인가요?
  faq_what_is_sui_answer: SUI는 디지털 현금과 같은 디지털 화폐입니다. Sui 블록체인이라는 빠르고 안전한 네트워크에서 작동합니다. 소량의 SUI로 네트워크 수수료를 내고 거래소에서 다른 플레이어와 직접 거래할 수 있습니다.
  faq_why_sui: AresRPG는 왜 SUI를 사용하나요?
  faq_why_sui_answer: SUI는 주 결제 수단입니다. 거래는 1초 이내에 처리되고 수수료는 1센트의 일부에 불과하며 중개 수수료가 없습니다. 향후 USD, EUR 등 일반 화폐를 지원할 수 있지만, 아직 감당하기 어려운 법적 절차와 높은 수수료 및 세금이 필요합니다.
  faq_legal: 합법인가요?
  faq_legal_answer: 네. 대부분의 국가에서 암호화폐 구매와 보유는 합법입니다. SUI는 전 세계 주요 규제 거래소에서 거래되는 디지털 자산입니다. AresRPG에서는 네트워크 수수료와 플레이어 간 거래에 사용합니다.
  faq_eula: 게임 약관에서 허용하나요?
  faq_eula_answer: 네. 암호화폐가 NFT나 투기성 구조 없이 결제 수단으로만 쓰이면 약관에 부합합니다. 많은 대형 게임 상점도 암호화폐 결제를 지원합니다.
  faq_access: 누가 내 지갑에 접근할 수 있나요?
  faq_access_answer: 본인만 가능합니다. 지갑은 Google 로그인과 Sui의 zkLogin 기술로 만들어집니다. AresRPG 팀을 포함해 누구도 자금에 접근하거나 이동할 수 없습니다. 이 지갑은 AresRPG 활동용이므로 큰 금액을 보관하지 말고 사용할 만큼만 입금하세요.
  faq_balance: SUI를 보냈는데 잔액이 갱신되지 않나요?
  faq_balance_answer: 갱신이 잠시 지연될 수 있습니다. 위에서 주소를 복사해 올바른 주소로 보냈는지 확인하세요. 계속 표시되지 않으면 거래 ID와 함께 Discord로 문의하세요.
