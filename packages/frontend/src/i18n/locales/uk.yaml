  finished_title: 'Автоматизацію відкрито'
  finished_body: 'AresRPG — це також гра про автоматизацію. Багато майбутніх можливостей спиратимуться на неї. Ви виконали всі завдання для початківців і отримали автоматичний збір ресурсів! Виберіть ресурс, натисніть «Почати» й дозвольте персонажу збирати його. Панель керування можна згорнути під час роботи.'
  reset_title: 'Завдання для початківців'
  reset_hint: 'Скидає завдання цього облікового запису в цьому браузері. Наявні предмети знову зарахуються після початку подорожі.'
  reset_action: 'Скинути завдання'
  storage_failed: 'Не вдалося зберегти прогрес у цьому браузері. Після перезавантаження його може бути втрачено.'
  chapter_welcome: 'Вітаємо'
  chapter_tools: 'Перші інструменти'
  chapter_gear: 'Спорядження'
  chapter_supplies: 'Припаси'
  chapter_dungeon: 'Підземелля'
  chapter_secret: 'Остання таємниця'
  welcome_title: 'Вітаємо на Наувісі.'
  welcome_body: 'AresRPG винагороджує тих, хто вчиться, готується та грає розумно. Оптимізуй і автоматизуй гру, витрачаючи якомога менше SUI. Ця подорож допоможе освоїтися.'
  hoe_title: 'Кожному потрібна мотика.'
  hoe_body: 'Купіть {{item}} або виготовте через Персонажі → Професії → Майстер на всі руки. Відкрийте рецепт і виберіть інгредієнти, щоб побачити їхні джерела. Шукайте Tinker біля Thebes і в лісах; сильніші гравці можуть добувати обгризені гілки з кабанів на рівнинах і в лісах.'
  hoe_objective: 'Мати {{item}}'
  wheat_title: 'Забруднімо руки землею.'
  wheat_body: 'Створення власного спорядження починається зі збору інгредієнтів. Пшениця потрібна для їжі та матеріалів для спорядження, тож із неї варто почати. Знайди пшеницю на Наувісі та збери свій перший урожай!'
  wheat_objective: 'Зібрати пшеницю'
  pickaxe_title: 'Кам’яна кар’єра.'
  pickaxe_body: 'Для наступних покращень знадобиться дещо більше, ніж урожай. За допомогою {{item}} ти добуватимеш мінерали для спорядження. Купи інструмент або створи його самостійно. Кар’єру шахтаря треба з чогось починати.'
  pickaxe_objective: 'Мати {{item}}'
  quartz_title: 'Під кожним каменем.'
  quartz_body: 'Самою пшеницею не спорядишся. Для зброї та прикрас потрібні й мінерали, зокрема кварц. Добудь трохи своєю киркою для наступних рецептів.'
  quartz_objective: 'Добути кварц'
  sickle_title: 'Гострий початок.'
  sickle_body: 'Рослини та гриби дають інгредієнти для зілля й матеріалів. З {{item}} ти зможеш опанувати травництво. Купи інструмент в іншого гравця або створи власний.'
  sickle_objective: 'Мати {{item}}'
  mushroom_title: 'Ще один гриб.'
  mushroom_body: 'Щоб продовжувати майструвати, знадобиться більше, ніж урожай та мінерали. Зелені гриби потрібні для зілля, шкіри й інших матеріалів. Збери перший і розвивай збиральні професії, щоб відкрити більше інгредієнтів.'
  mushroom_objective: 'Зібрати зелений гриб'
  token_title: 'Створи власну удачу.'
  token_body: 'Для наступних рецептів тобі знадобиться чимало предметів. Більше Удачі підвищує шанси отримати здобич у боях. Знайдімо талісман {{item}} і спорядимо його!'
  token_objective: 'Мати {{item}}'
  croissant_title: 'Хліб перед битвою.'
  croissant_body: 'Після поразки твої ОЗ падають до нуля. Можна чекати на відновлення або поїсти, щоб швидше повернутися до бою. Роздобудь {{item}} або спечи самостійно в розділі Персонажі → Професії → Пекар.'
  croissant_objective: 'Мати {{item}}'
  lorito_title: 'Час скубти пір’я.'
  lorito_body: 'Для кращого спорядження потрібні матеріали, яких не знайти на пшеничному полі. Підземелля дають нову здобич і досвід, але за них доведеться битися. Візьми лікувальну їжу й ключ до Золотого Лоріто у Фівах та пройди останню кімнату.'
  lorito_objective: 'Пройти підземелля Золотого Лоріто'
  suize_title: 'Остання таємниця.'
  suize_body: 'Молодець, шукачу пригод. Кращий урожай відкриває нові рецепти. Останнє випробування: самостійно збери Suize. Де його знайти? Це твоє перше завдання без моєї допомоги.'
  suize_objective: 'Зібрати Suize'
  welcome_objective: ''
  finished_objective: ''
  saving: Збереження…
  automation_reward_action: 'Відкрити автоматичний збір'

