    combat_desc: "Бій покроковий на сітці. У свій хід ви витрачаєте Очки дії (ОД), щоб накладати заклинання, та Очки руху (ОР), щоб пересуватися. Лінія видимості — це прапорець для кожного заклинання окремо: більшості заклинань вона потрібна, деяким — ні. Ви б'єтеся з групами монстрів у світі та з іншими гравцями в Колізеумі. Шкода масштабується з відповідним стихійним статом і будь-яким бонусом сирої шкоди."
    elements: СТИХІЇ
    element_earth: ЗЕМЛЯ
    element_fire: ВОГОНЬ
    element_water: ВОДА
    element_air: ПОВІТРЯ
    stat_strength: Сила
    stat_intelligence: Інтелект
    stat_chance: Удача
    stat_agility: Спритність
    critical_hits: КРИТИЧНІ УДАРИ
    crit_desc: Кожне заклинання чи зброя має власний базовий шанс критичного удару, виражений як 1 з N. Характеристика критичного удару зменшує N, але кінцевий шанс ніколи не може перевищувати 1 з 2 (50%).
    crit_bonus_desc: Під час критичного удару заклинання застосовує свої спеціальні критичні ефекти (посилена шкода або додаткові ефекти) замість звичайних.
    blocking: ЩИТИ
    blocking_desc: Деякі заклинання надають щит, що поглинає вхідну шкоду відповідної стихії, доки не вичерпається. Немає ні витривалості, ні стійки захисту, щити є єдиним поглинанням шкоди.
    resistance: ОПІР
    resistance_desc: Стихійний опір є відсотковим зниженням, застосованим до фінальної шкоди, обмеженим 50% на стихію. Від'ємний опір (слабкість) натомість підсилює шкоду.
    mob_level_bands: ДІАПАЗОНИ РІВНІВ МОНСТРІВ
    mob_level_bands_desc: У межах заданого діапазону рівнів здоров'я, XP, спритність, мудрість, додатний опір і масштабовані значення заклинань зростають від 60% до 160%. AP і MP зростають від 100% до 130%. Від'ємний опір використовує зворотну криву, зменшуючи слабкість зі 160% на мінімальному рівні до 60% на максимальному.
    life_steal: КРАДІЖКА ЖИТТЯ
    life_steal_desc: "Ефекти заклинань висмоктування завдають шкоди та зцілюють заклинача на половину здоров'я, яке ціль справді втратила. Зцілює лише висмоктування гравця: монстр, що читає те саме заклинання, завдає шкоди й не зцілюється."
    life_steal_note: Шкода спершу проходить через стандартну формулу шкоди, потім заклинач зцілюється на половину здоров'я, яке справді втратила призначена ціль — удар, перенаправлений на іншого бійця, або перетворений ціллю на зцілення, не повертає нічого.
    chatiment: ПОКАРАННЯ
    chatiment_desc: Покарання перетворює фактично втрачені нелетальні ОЗ на відповідну характеристику. Кожен хід активного бійця має власну межу; наступні ходи створюють окремі бонуси на п'ять ходів. Шкода від мобів враховується повністю. Шкода від гравця та її межа зменшуються вдвічі. В Ares немає ерозії.
    healing: ЗЦІЛЕННЯ
    healing_desc: Зцілення застосовує базове значення заклинання, збільшене на відсоток вашого Інтелекту, плюс фіксований бонус Зцілення від спорядження та бафів. Зцілення обмежене максимальним здоров'ям цілі.
    healing_intel_value: +1% зцілення за кожну одиницю Інтелекту
    heal_bonus: Бонус зцілення
    heal_bonus_value: Фіксований бонус від спорядження/бафів, додається після масштабування Інтелекту
    mobs: Моби
    healing_mobs_value: Масштабується тільки з Інтелектом, без бонусу зцілення
    leveling_desc: Максимальний рівень 200. Бийтесь з мобами у вашому діапазоні рівнів для оптимального XP.
