      title: 'Власники Vaporeon'
      description: 'Обрані гаманці зі знімка власників Vaporeon отримують ваучер на улюбленця Vaporeon. Перевірте гаманець, використаний тоді, та імпортуйте ваучер тут.'
    sui_basecamp_singapore:
      title: 'Sui Basecamp · Сінгапур'
      description: 'Sui Crates роздають як фізичні подарункові картки на Sui Basecamp у Сінгапурі. Відскануйте QR-код картки та увійдіть, щоб отримати скриню. Не розголошуйте код до отримання.'
    hytale_veterans:
      title: 'Ветерани Hytale · Топ 100'
      description: 'Особлива подяка 100 найкращим відповідним гравцям Hytale за колекції предметів, час гри, XP персонажів і професії. Нагороди надходять на адресу Sui, записану в резервній копії Hytale. Використовуйте початковий обліковий запис Google для доступу до цього гаманця.'
    hytale_supporters:
      title: 'Прихильники Hytale · Mark of the Unbroken'
      description: 'Для кожного прив’язаного гаманця Hytale з понад {threshold} SUI зареєстрованих покупок у крамниці, незалежно від топ-100. Титул надходить на адресу Sui з резервної копії. Увійдіть із початковим обліковим записом Google, щоб знайти ваучер.'

