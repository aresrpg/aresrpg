  faq: FAQ
  wallet_description: Ваш особистий гаманець. Лише ви маєте до нього доступ. Поповніть
    SUI для використання в крамниці.
  moonpay_desc: Кредитна картка, Apple Pay, банківський переказ
  transak_desc: Кредитна картка, банківський переказ, 100+ країн
  faq_what_is_sui: Що таке SUI?
  faq_what_is_sui_answer: 'SUI: це цифрова валюта, як цифрова готівка. Вона існує
    на швидкій та безпечній мережі під назвою Sui blockchain. Ви використовуєте невеликі
    суми SUI для покупки предметів у крамниці AresRPG. Думайте про це як про ігрові
    кредити, тільки ми не можемо їх у вас забрати.'
  faq_why_sui: Чому AresRPG використовує SUI?
  faq_why_sui_answer: 'SUI: наш основний спосіб оплати. Транзакції миттєві (менше
    1 секунди) і коштують частки цента. Без посередницьких комісій. У майбутньому
    ми можемо додати підтримку традиційних валют (USD, EUR тощо), але це потребує
    значної юридичної роботи та супроводжується великими комісіями і податками, які
    ми поки не готові нести.'
  faq_legal: Чи це законно?
  faq_legal_answer: 'Так. Купівля та зберігання криптовалюти є законною у більшості
    країн. SUI: це легітимний цифровий актив, що торгується на великих регульованих
    біржах по всьому світу. Ви просто використовуєте його як спосіб оплати в нашій
    крамниці. Жодних NFT, жодних криптосхем.'
  faq_eula: Чи дозволено це за умовами гри?
  faq_eula_answer: Так. Доки криптовалюта використовується виключно як спосіб оплати
    без NFT чи спекулятивних криптосхем, це повністю відповідає правилам. Багато великих
    ігрових магазинів навіть підтримують крипто-платежі.
  faq_access: Хто може отримати доступ до мого гаманця?
  faq_access_answer: 'Тільки ви. Ваш гаманець створюється через ваш Google-вхід за
    допомогою технології zkLogin від Sui. Ніхто (навіть команда AresRPG) не може отримати
    доступ до ваших коштів чи переміщувати їх. Важливо: цей гаманець призначений лише
    для покупок у крамниці. Не зберігайте тут великі суми. Поповнюйте лише те, що
    плануєте витратити.'
  faq_balance: Я надіслав SUI, але мій баланс не оновився?
  faq_balance_answer: Не хвилюйтесь. Наша система оновлення може тимчасово працювати
    повільно. Переконайтеся, що ви надіслали SUI на правильну адресу (скопіюйте її
    зверху), і якщо баланс досі не оновився, зверніться до команди в Discord з вашим
    ID транзакції для подальшої допомоги.
