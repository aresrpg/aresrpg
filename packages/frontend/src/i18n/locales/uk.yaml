  job_desc:
    FARMER: Фермери збирають зернові на полях по всьому світу. Вищі рівні відкривають рідкісніші культури для просунутих рецептів.
    HERBALIST: Травники збирають рослини та квіти для алхімії. Кожен рівень потребує вищого рівня професії.
    MINER: Шахтарі видобувають руди та мінерали з каменів. Рідкісні метали стають доступними з підвищенням рівня.
    SWORD_SMITH: Ковалі мечів кують довгі мечі, мечі та кинджали. Поєднуйте руди та сплави для потужної зброї.
    AXE_SMITH: Ковалі сокир виготовляють сокири та бойові сокири. Потужна зброя з рафінованих металів.
    BLUNT_SMITH: Ковалі дробильної зброї створюють булави та палиці. Міцна зброя для воїнів першої лінії.
    STAFF_CARVER: Різьбярі посохів формують посохи та книги заклинань. Необхідні інструменти для магів.
    BOWYER: Лучники виготовляють луки та списи. Точна далекобійна зброя для спритних бійців.
    ARMORSMITH: Бронярі кують шоломи та нагрудники. Важка броня для максимального фізичного захисту.
    TAILOR: Кравці шиють штани та чоботи. Легка броня для спритності та мобільності.
    TANNER: Шкіряники виготовляють паски та рукавиці. Універсальні аксесуари зі збалансованими характеристиками.
    JEWELER: Ювеліри створюють амулети та кільця. Аксесуари з потужними магічними бонусами.
    ALCHEMIST: Алхіміки варять зілля зі зібраних трав. Витратні матеріали для зцілення та підсилення.
    BAKER: Пекарі готують хліб та їжу зі зібраних зернових. Витратні матеріали для відновлення здоров'я.
    HANDYMAN: Майстри виготовляють ключі, інструменти та корисні предмети. Необхідні для підземель та спеціальних активностей.
