      - 'Бот сам сплачує мережеві комісії. Тримайте трохи SUI в його гаманці. «Переказ» переміщує SUI та KARES між двома вашими гаманцями.'
    does_title: 'Що робить бот'
    does:
      - 'Кожен герой виконує одне заняття за раз: бої довкола міста, збір і створення предметів або проходження підземелля. Ви обираєте його, і бот дотримується його до кінця або доки ви не зупините.'
      - 'Герої одного гаманця бота можуть битися командою.'
      - 'Ви можете будь-коли поставити бота на паузу або зупинити героя. Дія, уже надіслана в мережу, все одно завершиться.'
      - 'Бот чекає, коли не має схвалених дій або коли в його гаманці немає SUI на комісії.'
    control_title: 'Хто може ним керувати'
    control:
      - 'Асистент (ChatGPT, Claude або Grok): домовтеся про мету в чаті. Він викликає інструменти бота в межах того, що ви схвалили.'
  first_hour:
    lede: 'Мета першої години — персонаж, кілька виграних боїв і інструмент, який ви виготовили самі. Шанси випадіння й рецепт нижче — справжні.'
    drop_chance: 'Шанс випадіння {{chance}}%'
    steps:
      - title: 'Створіть персонажа.'
        body: 'Створення коштує {{price}} SUI плюс газ. Клас визначає ваші закляття, тож обирайте уважно.'
      - title: 'Виграйте перші бої.'
        body: 'Ці моби бродять біля першого міста. Підійдіть до групи й киньте їй виклик.'
      - title: 'Зберіть частини для інструмента.'
        body: 'Перший фермерський інструмент виготовляють із трофеїв мобів. Для кожної частини вказано найкраще джерело.'
      - title: 'Виготовте його.'
        body: 'Відкрийте професію «{{job}}» і виготовте інструмент. Виготовлення може не вдатися, а інгредієнти все одно витратяться, тож візьміть запасні частини.'
      - title: 'Вирушайте до першого підземелля.'
        body: 'З групою й цим ключем ви можете увійти до підземелля першого міста.'
  market:
    lede: 'Гравці продають гравцям. Предмети й ресурси торгуються через ончейн-пропозиції, а продавець отримує оплату в SUI.'
    royalty: 'Роялті'
    royalty_floor: 'Мінімальне роялті'
    lot_sizes: 'Розміри лотів'
    points:
      - 'Покупець сплачує вказану ціну, роялті та газ.'
      - 'Продавець отримує вказану ціну й забирає її окремою дією.'
      - 'На дешевій пропозиції важить мінімальне роялті. Порівнюйте повну вартість лота, а не лише вказану ціну.'
  kares:
    lede: 'KARES ще не готовий. Його скоро додадуть.'
    note: 'Ця сторінка опише токен, його пропозицію та пули нагород після запуску. До того не публікуються ні баланс, ні ціна, ні розміри нагород.'
    live_lede: 'KARES — токен AresRPG. Він торгується на Aftermath.'
  agents:
    lede: 'Підключіть ChatGPT, Claude або Grok до розміщеного бота AresRPG. Ви узгоджуєте мету, і асистент грає вашим персонажем у її межах. Ця функція ще в розробці.'
    steps:
      - 'Оберіть асистента й додайте адресу підключення AresRPG як власний конектор.'
      - 'Увійдіть через Google, потім схваліть конкретного бота й те, що йому дозволено.'
      - 'Передайте персонажа зі свого інвентарю. Ви можете повернути його будь-коли.'
    points:
      - 'Асистент ніколи не отримує ключ гаманця й ніколи не просить його в чаті.'
      - 'Розміщена гра є кастодіальною. Спільний акаунт 1 з 2 тримає персонажа, а розміщений агент підписує ходи. Ваш вхід через Google лишається вашою автентифікацією та способом відновлення.'
      - 'Підключений бот не завжди активний. Він чекає, коли не має схваленого наступного кроку.'
    guide: 'Читати інструкцію з підключення'
    index: 'Відкрити посібник для агентів'
  build:
    lede: 'Ігровий клієнт побудовано на публічному SDK. Ви можете створити власний клієнт, інструмент чи бота на тих самих діях.'
    source_title: 'Репозиторій коду'
    source_body: 'Код SDK, ліцензія та відповідний реліз.'
    playbook_title: 'Посібник для агентів'
    playbook_body: 'Посібники для розробників: підключення, зберігання активів, SDK, протокол, бій і економіка.'
    blocks_title: 'Складові'
    blocks:
      - 'Композиція дій: створюйте ті самі транзакції, що надсилає гра.'
      - 'Офлайн-планування: переглядайте рецепти й прогрес без підписанта.'
      - 'Симуляція бою: плануйте хід, перш ніж його підтвердити.'
      - 'Піни розгортання: перевіряйте, що працюєте з офіційним розгортанням.'
    license_title: 'Ліцензія'
    allowed_title: 'Дозволено'
    allowed:
      - 'Публікація й робота комерційних клієнтів, ремейків гри, фанатських інструментів, сервісів і ботів.'
      - 'Автоматизація, що грає заради прибутку.'
    forbidden_title: 'Заборонено'
    forbidden:
      - 'Розгортання або повторна публікація ігрових контрактів чи їхніх похідних у будь-якому блокчейні.'
      - 'Використання назви чи логотипа AresRPG як власного бренду.'
    license_note: 'Ця сторінка — короткий виклад. Юридичну силу має текст ліцензії. Зберігайте ліцензію та повідомлення про авторські права під час повторного поширення.'
    license_link: 'Читати ліцензію'

