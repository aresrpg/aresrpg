  item_descriptions:
    aberrant_edge: 'Кована невірно. Сталь гнеться, не ламається. Командуй обережно—вона підкоряється кутам, не силі.'
    aberrant_faceguard: 'Виліплена з обличчя, що перестало ним бути. Відбиває охоту до розмов.'
    aberrant_treads: 'Виготовлені за формою, що ніколи не була справжньою ступнею. Лишають хибні сліди.'
    abyss_core: 'Пульсуюча куля концентрованої енергії порожнечі. Містить сни мертвої реальності. Тримайте з екзистенційною обережністю.'
    abyss_loop: 'Витягнене з води, що поглинула світло цілком. Досі несе його вагу.'
    abyssal_blood_wheat: 'Зерно, просякнуте гемоглобіном, з думками про групи крові.'
    abyssal_codex: 'Гримуар, витягнутий із морських глибин. Просякнуті водою сторінки чомусь досі гортаються.'
    abyssal_conduit_staff: ''
    abyssal_edge: 'Меч, що нiби поглинає свiтло навколо клинка. Темрява косметична. Ушкодження - нi.'
    abyssal_warplate: 'Рiзниця мiж бойовою iсторiєю та некрологом.'
    abyssgrown_blade: 'Виростив собі власний дол, власне лезо, власну легку неохоту до того, щоб його вкладали в піхви, — і нічого з цього коваль собі не приписує.'
    abyssgrown_cuirass_of_moonlit_mire: 'Вона й далі росла після припасування, що власник виявив того дня, коли вона перестала пасувати й почала, лагідно, наполягати.'
    abyssgrown_extract: "Концентрат, що сам собою погустішав після розливу, тож старий флакон б'є сильніше за свіжий, а етикетка ніколи не встигає."
    abyssgrown_gauntlets: 'У них виросли пазурі, яких коваль не додавав і не може прибрати, що власник вирішив вважати перевагою.'
    abyssgrown_helm_of_quiet_drowning: 'Вирощений, а не викуваний, з панцира, що його глибокий Вельд почав і покинув. Власник успадковує і захист, і незавершену справу.'
    abyssgrown_pendant_of_moonlit_mire: 'У її серці виросла порожнина, що, як присягається власник, містить краплю води, старішу за Вельд. Вона відмовляється випаровуватися, що підкріплює твердження.'
    abyssgrown_pendant_of_quiet_drowning: 'Намистини на шнурку, що тихо клацають, коли власник дихає, — розрада в тихій глибині, доки не збагнеш, що вони клацають на такт після кожного подиху, а не разом із ним.'
    abyssgrown_sabatons: 'У них виріс візерунок протектора, якого ніхто не проєктував, підігнаний під ходу, якої ніхто не впізнає, і який усе одно пасує власнику.'
    abyssgrown_signet_of_moonlit_mire: 'На її печатному боці виріс візерунок, що трохи змінюється щоразу, коли відводиш погляд, і жодні двоє свідків ніколи не описали його однаково.'
    abyssrift_breastplate_of_torn_ground: 'Невагомий у розрідженій гравітації — чудово, доки не треба справді когось ударити.'
    abyssrift_legguards_of_split_sky: 'Розраховані на падіння, які розріджена гравітація робить майже виживними. Майже.'
    abyssrift_poultice_of_split_sky: 'Прохолодний там, де торкається, — як інший бік шва. Не питай, звідки вони це знають.'
    abyssrift_treads_of_split_sky: 'Не з тих, що літають. З тих, де «ґрунт зник, і ти імпровізуєш».'
    abyssrift_visor_of_torn_ground: 'Щілина показує точно те, що попереду. Підлога ніколи не була попереду.'
    abyssrift_warbelt_of_torn_ground: 'Бере навантаження, щоб цього не робив твій хребет. Хребет лишається скептичним і не мовчить.'
    adamantite_beastcaller: 'Обмотаний хутром єті й помережаний давніми гліфами поклику. Стукни по землі тричі — і щось з’явиться, зазвичай холодне й у кепському гуморі.'
    adamantite_chopper: ''
    adamantite_earth_cleaver: 'Довгий меч з живим жаросерцем що досi тлiє. Досить важкий щоб розколоти землю. Або те що на нiй стоїть.'
    adamantite_fang_daggers: 'Парні леза з іклами рекса, обв’язані поховальним шовком. Досить швидкі, щоб розтяти вітерець і те, що за ним ховалося.'
    adamantite_katana: 'Катана з крижаним серцем у руков ятi. Лезо настiльки тонке що рiже пиху. I людей теж. Холод притупляє провину.'
    adamantite_longbow: 'Плечі з акулячого плавця й пластини мерзлого панцира. Натягнути можна лише двома руками й давньою образою.'
    adamantite_tidestaff: 'Обгорнутий шовком фростшамбла та увiнчаний крижаним ядром. Гуде в ритмi далеких припливiв. Марний для плавання.'
    adamantite_trident: 'Три зубцi з крижаного панцира краба що нiколи не тане. Ефективний проти риб, рибоподiбних ворогiв та здорового глузду.'
    adamantite_war_greaves: 'Виковані між зборами, коли в кузнях лишалося зайве залізо.'
    adamantite_waraxe: 'Пластини крижаного панцира на лезi, крижане серце в навершi. Вага тренує руки. Холод тренує рiшучiсть.'
    adamantite_warhelm: "Гартований у могильній воді замість розсолу. Добре тримає вм'ятини."
    adamantsteel: 'Адамант, складений у сталь ковалями, які наполягають, що метал спершу мусить на це погодитися. Вдалі партії й справді видаються дивно згідливими.'
    aetherwing: ''
    alchemical_base: 'Основа всiєї алхiмiчної роботи. Пахне вологою бiблiотекою та порушеними обiцянками.'
    allweather_cinch: 'Однаково добре працює в болотах, пустелях і тундрі. Виглядає погано геть усюди.'
    aloe_crystal_salve: 'Кристалізований гель алое з рослинними залишками. Цілителі клянуться ним, пацієнти клянуть його.'
    aloe_vera: 'Соковитий листок, сповнений заспокійливого гелю. Цілителі клянуться ним, алхіміки скуповують, а всі інші дивуються, чому через рослину варто битися.'
    alpha_cleave: 'Забрано в альфи зграї. Він не віддав добровільно, і зграя, чесно кажучи, теж.'
    alpha_fang: "П'ятнадцять сантиметрів пожовклого ікла. Альфа, що його носив, був недоступний для коментарів. Чи дихання."
    alpha_fang_circlet: "Вовки оплакують мертвих виттям, що лунає над усім архіпелагом. Цей обруч пам'ятає кожне."
    amber: 'Скам янiла деревна смола з комахами що загинули мiльйони рокiв тому нарештi стала кориснiю.'
    amber_powder: 'Пахне як лiс що помер дуже давно i досi ображений через це.'
    ambivalent_torc_ap: 'Амулет, що дарує пункт дії випадково, а не навмисно. Його носій не може вирішити, чи був він благословенний чи обтяжений.'
    amphibian_oil: 'Очищена з залоз коа. Водонепроникна для шкіри, змащує шестерні, і назавжди надає всьому запах болота.'
    amulet_of_the_first_hollow: "Здобутий з порожнини, залишеної найпершим занесеним у каталог Порожнеч-Метеликом, ще тоді, коли каталогізатори їх нумерували, а не називали. Він старший за саму традицію назв. Він пам'ятає, що був числом."
    ancient_hermit_robe: 'Відрізаний від ряси, зношеної за сотню поховань. У плетиві й досі тримається могильний пил.'
    ancient_marrow: 'Якимось чином все ще рідкий після століть у скелеті. Смак суму і старої міді. Будь ласка, не питайте, як ми дізналися.'
    ancient_ram_splitter: ''
    ancient_tusk_cleaver: 'Вирізане з ребра, що виросло криво. Лезо й досі тримається.'
    ancient_tusk_fragment: 'Скалка, відламана від ребра, що виросло там, де жодне ребро не повинне рости.'
    anglerbone_cord: 'Нанизаний на хребці самої Королеви-Вудильниці, ще ледь люмінесцентний у повній темряві. Зручно для орієнтування. Менш зручно, щоб лишатися непоміченим.'
    anglerdeep_key: 'Слизький від вельдської вологи, що ніколи не сохне, теплий так, як буває тепле принадне світло за мить до того, як перестає. Матрона Глибин стежить за ними пильніше, ніж показує.'
    anglerhide_helm: 'Скроєний зі шкіри Королеви-Вудильниці, залози-принади лишили темними й сплячими, здебільшого. Краще не перевіряти, наскільки сплячими.'
    anglerlight_lure_staff: 'Увінчана полоненим світлом-принадою, що досі пульсує ритмом, який вабить здобич крізь глибокий Вельд. Краще не задивлятися на неї надто довго.'
    anglerlight_oil: 'Витоплена із залоз-принад Королеви-Вудильниці, ледь люмінесцентна навіть у пляшці. Найкраще ковтнути, перш ніж вона почне щось приваблювати.'
    antiphon_breastplate_of_last_verse: 'Не пропускає воду, вогонь і підливу. Накинь на меблі або на себе — залежно від того, що треба рятувати.'
    antiphon_grips_of_last_verse: 'Зроблені для дня прання. Викрути сорочку, швабру, або з когось правду.'
    antiphon_grips_of_twelve_voices: 'Борошно по лікоть, назавжди. Тісто дало відсіч рівно один раз.'
    antiphon_poultice_of_twelve_voices: 'Дванадцять трав, дванадцять молитов, одна паста. Ніхто не пам’ятає, яка трава діє, а може, жодна.'
    antiphon_treads_of_twelve_voices: 'Вуличне взуття закінчується на ґанку. Собор у цьому непохитний, і лава шанує традицію.'
    antiphon_visor_of_last_verse: 'Зціджує суп, лаву й амбіції з однаковою безсторонньою ретельністю. Ремінець на підборіддя додається.'
    antiphon_visor_of_twelve_voices: 'Прорізаний так, що дванадцять вузьких оглядів стають одним. І все одно чомусь гірше видно.'
    apexbound_cuirass_of_summit_vigil: "Статутний нагрудник для вартування на вершині, обтяжений так, щоб власник міг простояти цілий хід не хитаючись. Сісти — то окрема проблема, якої вона не розв'язує."
    apexbound_gauntlets: 'Призначені для рук, що досягають піка й мусять іще щось стиснути після приходу. Більшість не доходить. Ці припускають, що ти дійдеш.'
    apexbound_girdle_of_sealed_wound: 'Обмотаний двічі, так, як Уламки Стіни обмотують усе, чому не цілком довіряють лишатися стуленим. Досі талія співпрацювала.'
    apexbound_helm_of_sealed_wound: 'Відлитий, щоб витримати те, що Рана видихає, коли її силують стулитися. Забороло замикається зсередини — і це підказує, від кого воно насправді береже власника.'
    apexbound_pendant_of_summit_vigil: "Призначена лягати на груднину того, хто тримає найвищу варту, досить близько до серця, щоб вести лік, як швидко воно б'ється."
    apexbound_ration: 'Польова медицина для захисників стіни, запечатана у віск і розрахована зберігатися довше за більшість захисників. Похмуро, але маркування чесне.'
    apprentice_blade: 'Перший меч коваля що не ламається одразу. Досягнення. Скромне але все ж.'
    aragog_fang: 'Ікло, що сочиться отрутою, вирване з пащі Королеви Павуків. Токсин на його поверхні коливається між пурпуровим і чорним, розчиняючи все, до чого торкається.'
    aragog_fangs: ''
    arcane_bread: 'Спечений партією, освячений раз і назавжди. Тримає колону в русі.'
    arcane_pastry: ''
    arcane_reagent: 'Сім трав, хлюпіт води й жодної земної причини для фіолетового сяйва. Алхіміки звуть це дослідженням; решта — тривожним знаком.'
    arcane_solution: 'Ендгейм алхiмiчний реагент що пульсує сирим магiчним потенцiалом. Одна крапля на шкiру спричиняє тимчасову синестезiю.'
    arcane_spore: 'Насичена сирою магією до стану безперервного збудження, вона гуде на тоні, що розбиває поблизьке скло і переставляє виноски науковців, не питаючи дозволу. Єдине правило безпеки, передане нащадкам щодо поводження з нею: не чхати.'
    arcaneshroom: 'Гриб, просякнутий залишковою арканною енергією, що змушує його випромінювати тьмяне звинувачувальне сяйво, ніби він вважає збирача особисто відповідальним за порушення його вченого споглядання. Контакт з голою шкірою, як відомо, спричиняє мимовільну левітацію, тимчасову синестезію та незрозумілу тягу до запилених фоліантів.'
    arcanite: 'Гуде залишковою магiєю вiд якої компаси крутяться а чарiвники стають нестерпно самовдоволеними.'
    arcanite_hoe: 'Насичена достатньою кiлькiстю аркановї енергiї щоб мертва земля проросла. Також проростають мертвi фермери але про це не говорять.'
    arcanite_pickaxe: 'Розбиває затвердiлi реальнiстю мiнерали як податкiвець розбиває мрiї. Жила не має шансiв.'
    arcanite_powder: 'Спонтанно перегруповується в аркановi символи коли залишений без нагляду. Дуже вiдволiкає.'
    arcanite_sickle: 'Викувана з кристалiзованої мани та поганих рiшень. Рiже проклятi хащi наче вони їй виннi грошi.'
    arcanize_flour: 'Фіолетове борошно, що левітує, пекарі працюють швидко.'
    archaeo_belt: "Пірчастий, скам'янілий і досі переконаний, що вмів літати."
    archaeo_longbow: "Оперена пір'ям птаха, що перетинав глибини задовго до того, як хтось вів календар, аби записати дату. Стріли й досі наче пам'ятають старий шлях. Вони летять ним незалежно від того, куди цілилися ви."
    archaeo_plume: 'Пра-перо істоти, яка еволюційно й досі не вирішила, ящірка вона чи птах.'
    archaeo_plume_javelin: "Оперений пра-пір'ям. Летить пряміше, ніж будь-що пернате мало б право летіти."
    archimob_legguards: 'Здерта зі шкіри вожака зграї. Решта зграї й досі, незапрошено, шле подячні листівки.'
    arisen_tokeko: ''
    ashen_philter: 'Сірий, зернистий і технічно питний. Попіл ніколи не осідає — і це підказує, де ти.'
    ashen_visor: 'Постійно пахне багаттям і сумнівними рішеннями. Частково затримує і те, і те.'
    ashraptor_fang_pendant: "Ікло досі пам'ятає вогонь, з якого його вирвали. Іноді про це згадує і ваша ключиця."
    backbone: 'Броньований уздовж хребта першим — за тверезою теорією, що труп, який досі стоїть, усе ще тримає лінію.'
    backswing: 'Зворотний рух завдає більше шкоди, ніж запланований удар. Коваль називає це особливістю. Носій називає це несподіванкою.'
    bag_aloe_vera: "Колись поважний контейнер, що тепер сочиться в'язким ботанічним секретом з кожного шва — неминучий наслідок утримання п'ятдесяти зразків алое вера у просторі, розрахованому на значно менше желатинових рослин. Алхіміки з гідною подиву переконаністю стверджують, що терапевтичні властивості зростають при стисканні — твердження, яке зовнішній вигляд мішка, слизький, смердючий і ледь пульсуючий, мало підтримує."
    bag_amber: 'Важкий мiшок скам янiлих слiз. Дерево плакало щоб ви збагатiлись.'
    bag_arcaneshroom: "П'ятдесят арканових грибів, зібраних у посудину, що гуде від такої концентрованої залишкової магії, що розвинула власне слабке гравітаційне поле, змушуючи дрібні предмети дрейфувати до неї з невідворотністю метеликів до особливо книжкового полум'я. Мішок іноді левітує, коли залишений без нагляду, що його власник потім має пояснювати дедалі скептичнішим шинкарям."
    bag_arcanite: 'Гудiння стає голоснiшим коли несеш бiльше десяти. Нiхто не знає чому i нiхто не хоче дiзнатися.'
    bag_arcanize: 'Фіолетова люмінесценція просочується крізь шви. Зерно гуде тривожною частотою.'
    bag_barley: 'Мішок ячменю, що брязкає звуком зерна, зібраного під протест охоронця.'
    bag_blood_wheat: 'Він ледь чутно пульсує за графіком, якого ніхто не встановив. Тривожно для мішка зерна. Значно гірше для багажу, поруч з яким ви збиралися спати.'
    bag_bloodstone: 'Усе всередині рано чи пізно червоніє. Статистично — і все навколо теж.'
    bag_burnt_wheat: 'Відкриття вивільняє димний аромат і враження жахливого аграрного рішення.'
    bag_crimson_truffle: "П'ятдесят трюфелів в одному мішку — і ринкова вартість, на яку шви ніколи не були розраховані."
    bag_cursed_fungus: "П'ятдесят проклятих грибів, запечатаних у мішку, що бурмоче ротаційною добіркою мов, жодна з яких не належить живій цивілізації, звертаючись до носія іменами, яких той не впізнає, але які все одно викликають мимовільний холодок. Досвідчені травники тримають його на витягнутій руці — не тому що посібник рекомендує, а тому що мішок сам це запропонував."
    bag_cursed_gem: 'Мiшок шепоче вашi найглибшi страхи. Здебiльшого про управлiння iнвентарем та лiмiти ваги.'
    bag_draconite: "Гарячий на дотик, тихо гарчить. Останній кур'єр лишив відгук на одну зірку і жодної адреси для пересилки."
    bag_draconize: 'Луска зовні може бути природною — або означати, що зерно всередині створює профспілку.'
    bag_dragonlily: "П'ятдесят драконолілій, луска внапуск, шурхотить рівно настільки, щоб ганковий кіт не спав усю ніч."
    bag_duskite: 'Стара шахтарська приказка: що дускіт бере, те дускіт лишає собі, а світло входить і ніколи не спить. На практиці це означає лише, що мішок важчий, ніж здається, і дешевший, ніж мав би бути.'
    bag_green_mushroom: "П'ятдесят зелених грибів. Юридично й ботанічно відмінні від веселого різновиду."
    bag_himalayan_wheat: 'Зібрано на висотах без повітря і без аграрних норм.'
    bag_ivory_shrooms: "П'ятдесят люмінесцентних грибів, запакованих з такою безрозсудною щільністю, що мішок випромінює стійке фосфоресцентне сяйво, помітне з прикрою відстані, працюючи як портативний нічник, якого ніхто не просив і який кожен у тридцятиметровому радіусі змушений визнати. Торговці намагалися подавати це як перевагу, а не вад, з передбачуваними результатами."
    bag_jade: 'Достатньо зелених каменiв щоб торговець заплакав вiд радостi а потiм вiд пiдозри.'
    bag_malt: "Легкий аромат бродіння натякає, що солод планує кар'єру напою."
    bag_moonstone: 'Свiтиться крiзь тканину вночi роблячи непомiтнiсть для злодiїв абсолютно неможливою.'
    bag_nightcap: "Мішок із п'ятдесятьма нічними грибами, що, здається, поглинає навколишнє світло в безпосередній близькості, створюючи локалізовану кишеню темряви, яка слідує за носієм із тихою наполегливістю нечистого сумління. Тривале перебування поруч, як повідомляють, викликає повзучу екзистенціальну тривогу, яку травники навчилися плутати з професіоналізмом."
    bag_obsidianite: 'Поводьтеся з ним обережно чи ні — в обох випадках заздалегідь приготуйте виправдання для цілителя. Він чув уже всі варіанти фрази «я просто ніс його».'
    bag_phantom_spore: "П'ятдесят спор, що бувають тут лише вряди-годи, як обіцянка, яку тримають лише часом. Порахуйте двічі. Втретє — з упертості. Число ніколи не збіжиться саме із собою."
    bag_quartz: 'П ятдесят шматкiв каламутного кристалу що грюкотять як мiшок розбитих обiцянок.'
    bag_red_orchid: "Шкіряна торбинка з п'ятдесятьма кривавими орхідеями, запакованими так щільно, що мішок набув глибокого й незмивного багряного кольору зсередини, ніби був місцем дуже маленького й дуже ботанічного злочину. Відкриваючи, відчуваєш аромат, що рівними частинами складається з металевої солодкості та тихої загрози."
    bag_suize: 'Зерна всередині ловлять світло, наче претендують на кращу тару.'
    bag_tanjirize: 'Теплий мішечок, ніби танжириз переконаний, що належить сонцю.'
    bag_ukranize: 'Зерно укранізу ніколи не любило добру землю — кажуть, воно росте там, де врожай найважче дістати. Мудра культура. Жахлива для колін.'
    bag_wheat: "П'ятдесят бушелів пшениці. Вартовий Полови віддав життя; пекарня лише знизала плечима."
    bag_witherbloom: "Кожна квітка бере найкращу свою виставу на саму мить смерті, з театральною відданістю актора, що прагне бути запам'ятованим. Відкрий мішок — і кожен бард у межах чутності хапається за перо посеред розмови."
    baked_compound: 'Затверділий шматок борошна та спор. Алхіміки в захваті. Решта сумнівається в запаху.'
    banner_shard: 'Відірваний від попелястого штандарта до його падіння. Досі несе вагу лінії, яку той позначав.'
    barbfin_battleaxe: 'Плавці в колючках, наче щось витягнуте з глибшої води, ніж Вельд технічно має. Ніхто не питав, звідки насправді ті плавці.'
    bark_grimoire: 'Сторiнки з пресованої кори. Заклинання здебiльшого малюнки злих овець.'
    barley_bread: 'Щільний хліб зі смаком фермерської натури. Поживний, надійний і безрадісний.'
    barley_flour: 'Грубе борошно, яке пивовари жадають, а пекарі терплять.'
    barley_hardtack: 'Military rations that outlast the soldiers who carry them. Jewelers use the crumbs as polishing abrasive.'
    basalt_carapace_of_black_choir: 'Вулканічна пластина, що п’є світло. У тьмяному нефі ти, по суті, діра.'
    basalt_core: 'Нерозплавлена серцевина лавової бомби. Ззовні холодна, всередині ще вагається. Не квап її.'
    basalt_crest_of_black_choir: 'Досить важка, щоб ти кивав у такт панахиді — хотів ти того чи ні.'
    basalt_crest_of_molten_antiphon: 'Надягнувши його, невидимим на святі не станеш. Зате він спиняє краплі гарячого воску.'
    basalt_falchion_of_molten_antiphon: 'Ти б’єш, вони відповідають, розмова закінчується. Рідко довгий діалог.'
    basalt_fists_of_molten_antiphon_choir: 'Хор співає рядок, потім повторює, сильніше. Ці теж. Вивчи темп або отримай другий куплет.'
    basalt_fists_of_molten_antiphon_pyre: 'Дротяна щетина по кісточках. Бруд, іржа та надія відходять з однаковою легкістю.'
    basalt_flail_of_black_choir: 'Розмахнута на ланцюзі, вона звучить як похоронний дзвін. Доречно, зважаючи на її зустрічі.'
    basalt_greaves: 'Найупертіша річ, яку ти колись прив’яжеш до коліна. У неї свої погляди на рух.'
    basalt_knobstick_of_molten_antiphon: 'Кленова, добре обсипана борошном, замахується з авторитетом того, хто прочекав тебе цілу ніч.'
    basalt_locket_of_black_choir: 'Береже одну низьку ноту, замкнену в камені. Розбий у кризу; пошкодуй у тиші опісля.'
    basalt_maul: 'Розрахована на килими, гобелени та все інше, що тримає в собі образу разом із пилом.'
    basic_pickaxe: 'Ось що стається, коли бюджетні обмеження зустрічаються з підземними амбіціями.'
    bear_battleaxe: 'Насичена ведмежою люттю i нерозумною кiлькiстю тiлесного тепла.'
    bear_claw: 'Донедавна була частиною значно більшого і значно менш згідливого ведмедя.'
    bear_claw_ring: 'Ведмідь бився за це. І програв. Здебільшого через формальність.'
    bear_club: 'Ведмідь вимагав роялті за цей дизайн. Юристи відмовили. Ведмідь не погодився. Гучно.'
    bearclaw_gauntlets: 'Оснащені пазурами, вирваними в Мохового Ведмедя, якому вони більше не знадобилися. Сила хвату передається; норов, схоже, теж.'
    bearfury_battleaxe: 'Ведмiдь чий кiготь пiшов на цю сокиру був дуже незадоволений. Зрозумiло.'
    bearheart_signet: "Оправлений уламком кігтя завбільшки з кіготь самого Ведмежого Патріарха. Носи достатньо довго — і забудеш, як завдавати удар; пам'ятатимеш лише, як його пережити."
    beast_hauler_sash: 'Затягнутий тими, хто тяг вози з трофеями. Витерся саме там, де лежала мотузка.'
    beastcaller_talisman: 'Нанизаний зі шнура Статичного Пастуха, тихо гуде, коли зграя поруч. Зграї рексів на мить приймають носія за одного зі своїх.'
    behemoth_pearl: 'Знайдена в горлянці стародавнього Коа-Титана. Коштує статок — якщо вдасться дістати її ввічливо.'
    behemoth_pearl_amulet: 'Оправлений уламком, надто гладким, щоб відколотися сам собою.'
    bent_sword: 'Хтось явно переплутав загартування з наступанням. Все ще працює. Ледве.'
    berserk: 'Forged for those who answer every problem with more axe. Rage not included, but implied.'
    binding_paste: "Адгезивна сполука що з'єднує органiчнi та мiнеральнi матерiали. Ковалi та кравцi купують це швидше нiж алхiмiки варять."
    binding_ring: "Пов'язує спектральну енергію зі смертною плоттю. Дрібний шрифт згадує лише 'легкий екзистенційний дрейф'."
    binding_thread: "Прив'язує привида до цього світу. Розріж — і кілька твоїх проблем миттю щезнуть."
    bisonbrute_bow: 'Натягнутий сухожиллям бiзонобрута. Кожна стрiла несе емоцiйну вагу тупоту.'
    blizzard_tassets: 'Торієві накульшники, вкриті кристалами інею. Кожен крок звучить як биття скла.'
    blockhead: 'Названа підмайстром коваля, який мав на увазі образу, і все одно отримав підвищення.'
    blood_wheat: "Зріж її — і вона стікає кров'ю: густим темним соком кольору старої рани, ніби земля, що її зростила, спершу зазнала болю, а питання лишила на потім."
    blood_wheat_flour: 'Змелене у блідо-багряний колір, найкраще запікати в хліб, який їдять швидко й не думають про нього. Час від часу відчутне биття, наполягають пекарі, суто косметичне.'
    bloodstone: 'Темно-червоний мiнерал який точно отримав свiй колiр вiд оксиду залiза а не вiд давнiх прокляти мабуть.'
    bloodstone_powder: 'Незатишно теплий на долоні. Алхіміки його обожнюють. Усі інші тримаються подалі.'
    bloodveil_orchid: 'Багряна орхідея, чиї пелюстки плачуть соком настільки темним, що він плямує все, чого торкнеться, зокрема й твою репутацію серйозного травника.'
    bloodwheat_bread: "Багряний м'якуш слабо пульсує коли ріжеш. Пекарі кажуть це термічна реакція. Пекарі брешуть."
    blue_antenna: "Досі пульсує останньою думкою комахи: 'Чому гігант розчавив мою пару?'"
    blunt_cudgel: 'Палиця з претензiями на зброю. Ворогi помруть... вiд смiху. Колись.'
    boar_gorer: 'Створено для полювання на кабанів, але працює проти будь-чого, що атакує з поганим розрахунком.'
    boar_hide: 'Товста, щетиниста, і пахне болотом. Кабан був невиправдано розлючений втратою. Стандартна процедура.'
    bogforged_core: 'Осердя, загартоване над холодним болотяним вогнем, що лишає його щільним і тихо неправильним на дотик так, що це ніколи до кінця не минає.'
    bogforged_elixir_of_fen_below: 'Дистильований над болотяним вогнем, що горить холодом, надаючи йому прохолоди, яка затримується на язиці ще довго після того, як зцілення завершене.'
    bogforged_greataxe_of_fen_below: 'Викувана для того, хто спускається в Нижній Фен і сподівається ще чимось замахнутися на зворотному шляху, — що роблять небагато хто.'
    bogforged_greataxe_of_rising_tide: 'Кована на болотяному ковадлі, що ковтає іскри цілком, — що коваль вважав бентежним, а сокира, вочевидь, знайшла до вподоби.'
    bogforged_sash: 'Зіткане з драговинного очерету, що ніколи повністю не висихає. Воно чудово прояснює розум — здебільшого спорожнюючи його. Носій почувається чудово й уже не годен пояснити, чому.'
    bogforged_vambraces_of_rising_tide_matron: 'Підлаштовані під приплив, якого Вельд удає, ніби не має, загартовані на повній воді, коли метал на мить погоджується співпрацювати.'
    bogforged_vambraces_of_rising_tide_mire: 'Загартовані в болотяній воді, такій паскудній, що метал вийшов твердішим, а коваль вийшов кашляючи цілий тиждень.'
    bogsteel: 'Болотяне залізо, уварене й складене, доки не візьме лезо, — що воно робить неохоче й лише для тих, хто заслужив це важкою працею.'
    bone_charm_necklace: 'Кiсточки нанизанi на шнурок. Виглядає або племiнно або серiйно-вбивчо залежно вiд вбрання.'
    bone_flail: 'Зiбраний з того, що лишив кiсточник. Тарахтить з кожним ударом.'
    bone_greatbow: ''
    bone_marrow_club: 'Видовбана з власної стегнової кістки Мозкового Волоцюги і напхана свинцем про всяк випадок. Десь унизу, кажуть, Нерак рано чи пізно помічає такі речі. Краще заздалегідь мати напоготові гарне виправдання.'
    bone_wand: ''
    boneguard_edge: 'Взято у кісткового стража, який, якщо чесно, у ту мить не надто опирався — здебільшого через те, що був цілком, по-фаховому мертвий.'
    boneherald_greatsword: 'Присягнута на кістках, старіших за будь-яку корону, коли-небудь перелиту на кращу. Присяга, з цим погоджуються всі, непорушна. А сам меч, нагадає вам герольд, і досі цілком продається.'
    bonelord_flail: "Кістки справжні. Зв'язані сухожиллям того, що блукало цими болотами. Вона коливається важче, ніж дозволяє фізика. Не питай чому."
    bonelord_greatsword: ''
    bonelord_legguards: 'Вирізьблені зі стегнових кісток, завеликих для будь-кого живого. Приляга бездоганно.'
    brackish_breastplate_of_brackish_deep: 'Атестований на тиск глибин, яких Вельд офіційно не має, — таке коваль вибиває на нагруднику, а потім не любить про це говорити.'
    brackish_composite: 'Шаруватий матеріал, витриманий у солоній воді, що робить його міцнішим і дивнішим, схильним до запаху, який посилюється саме тоді, коли ти волів би, щоб ні.'
    brackish_edge_of_brackish_deep: "Гартування в солоній воді лишило його рівно настільки роз'їденим, щоб ранити так, як не вміє чистий поріз, — що Вельд зараховує до переваг."
    brackish_grips_of_brackish_deep: 'Сіль забилася в суглоби й лишилася; тож вони час від часу заклинюють у найгіршу можливу мить, надійно.'
    brackish_legguards_of_brackish_deep: 'Атестовані для броду у воді, що згноїла б із ноги будь-що інше, — що з часом зробить і з ними; коваль лише не каже коли.'
    brackish_legguards_of_silt_throne: 'Вилучені з царедворця, що засидівся в утопленій залі й, технічно, сидить там досі.'
    brackish_poultice_of_silt_throne: 'Начинена солоним багном, що витягує рану дочиста й пече рівно настільки, щоб пацієнт точно знав, коли вона діє.'
    brackish_recurve_of_brackish_deep: 'Натягнутий жилою, що набрякла в солі й ніколи не всохла назад, тож тягнеться важче, ніж здається, і винагороджує руки, що на це чекали.'
    brackish_twin_knives_of_silt_throne: 'Дворові кинджали, вичерпані з утопленої зали, досі схрещені так, як їх поклали на тіло, яке мул давно забрав.'
    brackish_waraxe_of_brackish_deep: 'Корозія заповзла в держак і спинилася, стримана нічим упізнаваним, — на що власник намагається не надто покладатися.'
    brackish_warbelt_of_silt_throne: "Його дворова пряжка з'їлася до абстрактної форми, що тепер нічого не означає, — і це чесніше за те, що вона означала раніше."
    breach_ash: 'Сажа, що ніколи не осідає. Тут вона дрейфує вбік, на зло гравітації.'
    breachforged_brew_of_nine_faults: "Заварений на кістковій солі Вартового Брами, його п'ють вартові, що рахують проломи замість овець. Спершу гоїть малі рани — за теорією, що великі почекають своєї черги."
    breachforged_carapace_of_fifth_breach: "Знятий цілком з Порожнеч-Метелика, що переріс п'ятий пролом і йому вже не було куди линяти. Сидить як другий екзоскелет, бо функціонально ним тепер і є."
    breachforged_carapace_of_nine_faults: 'Кожен шов — місце, де вона могла б піти тріщиною. Поки що ні. Оте «поки що» тягне на собі багато.'
    breachforged_cincture_of_fifth_breach: "Затягнута Вартовим Брами, який вимірював кожен поріг долонею, перш ніж вирішити, лишати його відкритим чи ні. Пряжка досі клацає у п'яти різних положеннях. Що вони означають — того вже ніхто не скаже."
    breachforged_circle_of_nine_faults: 'Носився на рахунковій руці Вартового Брами, чиєю роботою був підрахунок проломів до того, як вони стануть проблемою. Він досі рахує. Додаткова мить готовності, яку він дарує, — це перстень, що довершує роботу Вартового за тебе.'
    breachforged_claymore_of_nine_faults: 'Розмахувана Вартовим Брами, який перестав рахувати розломи й почав закривати їх особисто. Занадто важкий, щоб цілитися з якоюсь точністю. Точність ніколи й не була планом.'
    breachforged_crest_of_nine_faults: 'Дев’ять гребенів, по одному на кожну тріщину, яку плавильник устиг полічити до того, як кинув.'
    breachforged_fists_of_fifth_breach: 'Виковані з кісточок пальців Вартового Брами, який спершу бив, а посвідчення перевіряв потім. Кожен удар лишає ледь помітний синець у формі арки — наче крихітні двері.'
    breachforged_greatbow_of_fifth_breach: 'Натягнутий Вартовим Брами, який вимірював дальність перетнутими порогами, а не кроками. Стріла надійно випереджає будь-який жаль, що її послав.'
    breachforged_philter_of_fifth_breach: "Розлитий тим Вартовим Брами, хто витягнув п'яту зміну — ще тоді, коли зміни закінчувались. На смак — як довго стояти нерухомо."
    breachforged_splitter_of_fifth_breach: 'Чотири попередні не спрацювали. Цю кували в значно гіршому настрої.'
    bread_leavening_agent: 'Змушує хлiб пiдiйматися з алхiмiчною ефективнiстю. Пекарi вважають це дивом. Алхiмiки вважають пекарiв легковражаючими.'
    bristleguard_cuirass: 'Шкіра тускера, дублена його ж жовчю, — саме тускер із тих істот, що на цьому наполягли б.'
    bristlemail_gauntlets: 'Кільця, протягнуті крізь кабанячу щетину, що з принципу не хоче лежати рівно.'
    bristlemail_pants: 'Сідати в шкірі тускера — це, технічно, акт віри. Щетина з цією вірою не згодна.'
    bristlemail_patch: 'Шкіра живота кабана настільки щільна, що зупиняє стріли. Кевлар природи, тільки жахливо пахне і ніхто не дякує.'
    bronze_greaves: 'Викуваний із бронзи, достатньо щільної, щоб відхилити клинок, і достатньо важкої, щоб зробити кожні сходи смертельним ворогом. Коваль, кажуть, мав передпліччя як повалені дерева. Від носіїв очікують відростити такі самі.'
    bronze_helm_of_the_shore: 'Бронзовий купол, прикрашений мушлями, які не відчистити ніяким скребком. Попередній власник був береговим вартовим, який любив море, поки море не полюбило його у відповідь. Назавжди.'
    bronze_wolf_cuirass: 'Бронзові пластини поверх вовчої шкіри. Кажуть, останній вовчий вий збережений у металі — хоча більшість носіїв після третього прольоту сходів чують лише власне важке дихання.'
    browbeaten: "Вм'яте в те саме місце тими самими уламками так часто, що вм'ятина отримала власне ім'я серед прочан."
    bulwark_band: 'Твій палець тепер, юридично кажучи, фортифікаційна споруда.'
    bulwark_of_the_risen: 'Знайдено в кургані, що знову розкрився на смерку. Мертвим це вже було ні до чого.'
    bulwark_stubborn: 'Не здається з чистої, чудової впертості. Поки що це працює.'
    burnt_wheat_flour: 'Попередньо підсмажене борошно, уважна послуга для пекарів.'
    caller_embrace: 'Кінчики пальців світяться, коли близько фамільяр. Зручно. Іноді — надто інтимно.'
    canticle_cuisses: 'Рубчики висвистують п яту частку тону на кожному кроці. Хор навчився транспонувати довкола тебе.'
    canticle_greataxe: 'Тримають для впертих колод на дні стосу. Заразом кладе край більшості інших суперечок у господарстві.'
    cantor_basalt: 'Камінь для кухонної підлоги, вигладжений чотирма століттями кухарів, що міряють її кроками.'
    canvas_boots: 'Водонепроникнi першi три секунди. Потiм це губки зi шнурками. Комфорт: вологий.'
    cape_fuwa_black: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_fuwa_white: 'A soft, absurdly fluffy cloak. Zero armor value, infinite nap value.'
    cape_kamui: 'A cloak cut from something that should not have had a hide. It remembers being worn by worse.'
    cape_lorito_agility: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_chance: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_intelligence: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_strength: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_vitality: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    cape_lorito_wisdom: 'A parrot-feather cloak dyed to a gemstone hue. Loud, cheerful, and entirely cosmetic.'
    capstone_lattice: 'Кристалічний каркас, що застигає лише під тиском, який трапляється тільки на піку, а тому здобути його рівно настільки важко, як і звучить.'
    capstone_treads_of_last_ascent: 'Підошва, що має значення лише раз, на останньому кроці, — саме тієї миті, коли в більшості власників уже не лишається ніг, щоб її оцінити.'
    capstone_visor_of_last_ascent: 'Вінець, який вручають прочанину, що дістався верхівки, у ту коротку мить, перш ніж він усвідомить, чого насправді коштує ця верхівка.'
    capstone_warbelt_of_first_dawn: 'Обтяжений, щоб заякорити тіло проти висхідного потоку, що смикає все поблизу піка. Якорить добре. До чого саме він тебе якорить — то вже твоя справа.'
    capuche_bara: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_air: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_earth: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_fire: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_water: 'A plain hooded cowl offered in a spread of gemstone linings. Cheap, honest, everywhere.'
    capuche_bara_wisdom: ''
    capuche_mo: 'A tattered hood strung with tiny skulls. Mo never explains where they came from, and nobody asks twice.'
    casque_hayate: 'Swift-wind steel. Light enough to run in, loud enough to be heard coming.'
    cataclysm_brew_of_nine_faults: 'Попелясті Пророки варять це в ніч перед катаклізмом, який вони вже бачили і не можуть розбачити. Це нічого не запобігає. Просто заспокоює руку, що мусить дивитися.'
    cataclysm_core_rift: 'Щільний вузол, що лишається там, де вичерпався поштовх. Теплий, терплячий, ще не певний, чи скінчив.'
    cataclysm_core_void: 'Нічого не важить і все одно падає. Порадилися з фізиками; фізики пішли.'
    cataclysm_extract: 'Останнє, що переганяють із вичерпаного поштовху. Гірке, потужне й не схильне сидіти тихо.'
    cataclysm_tassets_of_fifth_breach: "Виковані на стегно тим Вартовим Брами, хто витягнув п'яту зміну того дня, коли лік перестав щось важити. Метал пам'ятає стійку струнко. Ноги власника — вже гірше."
    cataclysm_tassets_of_nine_faults: 'Названі за кількістю тріщин, які переступив Вартовий Брами в одному патрулюванні. Десята тріщина — та, яку ніхто не порахував.'
    cataclysm_warboots_of_fifth_breach: 'Щоб на швидкості перетнути щілину, що ширшає. Теорія слушна. Щілина не згодна.'
    cataclysm_warboots_of_nine_faults: 'Зроблені стояти там, де більше ніщо не встоїть. Оте «ніщо» включає ґрунт.'
    celestial_wafer: 'Його каталогізували двічі — за двома різними теоріями, розбіжність, яку нікому не доручили усунути.'
    chantmarked_crusher_of_twelve_voices: 'Їдальняного ґатунку. Що вона зробила з картоплею, те зробить і з бойовим духом.'
    chantmarked_edge_of_last_verse: 'Частина пісні після того, як усі вирішили, що вона скінчилася. Несподіванка. Завжди остання.'
    chantmarked_grips_of_twelve_voices: 'Відкалібровані на слоїку огірків, закатаному ще до заснування хору. Він відкрився. Зрештою.'
    chantmarked_legguards_of_last_verse: 'Приберігається для відправ, похоронів і днів, коли те й інше збігається. Тут таких днів більшість.'
    chantmarked_legguards_of_twelve_voices: 'Випрасувані до стрілки, якою можна розкривати листи. Сісти в них — це вандалізм.'
    chantmarked_rod_of_twelve_voices: 'Робочий кінець висох роки тому. Відтоді держак диригує хором — кепсько.'
    chantmarked_tonic_of_last_verse: 'На випадок, коли бій скінчився, а потім, нахабно, ні. Купує тобі ще один приспів.'
    chantmarked_twin_knives_of_last_verse: 'Бабусині спиці. Шарф так і не був дов язаний; грабіжник так і не оговтався.'
    chantmarked_visor_of_last_verse: 'Ґудзик нагорі — водночас конструкторська помилка і зручна ручка для перенесення.'
    chantmarked_warbelt_of_last_verse_choir: 'Рядок, до якого пісня завжди повертається. Застібнеш — і ти теж повертаєшся. Дратівливо.'
    chantmarked_warbelt_of_last_verse_pyre: 'Петлі для молотка, ножиць, воску, свяченої води. Порожня петля означає, що халепа знайшла тебе першою.'
    charged_vault_key: 'Викуваний з вольтоскла, назавжди заряджений статичною електрикою з грозових осередків плато. Сховище Штормового Вартового вражала блискавка більше разів, ніж хтось лічив, і саме цей ключ — причина, чому воно досі відчиняється.'
    charite_brick: "Щільна цегла з паленого борошна та бурштину. Зброярі мелють її на зв'язувальну речовину."
    chief_mark_brand: 'Ним таврують новобранців, надто зелених, щоб опиратися. Нагрівається швидко, стирається повільно.'
    chipped_axe: 'Лезо має бiльше вищерблень нiж пачка чiпсiв. Кожен замах розкидає уламки. Природний AoE.'
    chitin_cutlass: 'Напiв хiтиновий, напiв iржавий метал. Напрочуд ефективний щоб жалкувати про наближення.'
    chitin_gauntlets: 'Ламельована оболонка комахи, перероблена на рукавиці — легкі, але досить міцні, щоб відводити ковзні удари. Попередній власник, схоже, вважав їх дуже зручними аж до того моменту, як несподівано луснула отруйна залоза.'
    chitin_longsword: 'Цей клинок вирізано з панцира безіменної глибинної потвори, його лезо зазубрене, але страхітливо гостре.'
    chitin_shellplate: 'Кажуть, що вона захищає від зрадників, здебільшого тому, що сморід гарантує — ніхто не підійде достатньо близько, щоб спробувати.'
    chitin_walkers: 'Ці чоботи ворушаться з кожним кроком, адже хітинові пластини — лише оболонка для істот, що живуть усередині.'
    choir_conductor_staff: 'Наведи його — і все багаття тримає твій темп. Впусти — і вогонь імпровізує. Не впускай.'
    choir_hymnbread: 'Спечена під час казання, яке відмовлялося закінчуватись. Скоринка схопилася десь на четвертій годині.'
    choir_obsidian: 'Полірована вулканічна плита. Прохолодна на дотик, байдужа і до слідів ножа, і до гарячих пательень.'
    choir_procession_boots: 'Зроблені для повільної гідної ходи до вівтаря. Кинешся бігти — гідність зникне першою.'
    choirblade_altus: 'Цілий ярд витриманого дуба. Кожна дитина в парафії точно знає, скільки халепи вона вимірює.'
    choirforged_cuirass: 'Повний латний захист у формі пекарського фартуха. Рюш — несуча конструкція.'
    choirforged_draught: 'Останній налив із казанка. Гіркий, із крупинками, і чомусь найміцніша чашка за день.'
    choirforged_gauntlets_of_cooling_vent: 'Прорізані, щоб віддавати жар, — і віддають, просто тобі на зап’ястя. Це угода, а не дарунок.'
    choirforged_greatblade_of_cooling_vent: 'Дістають, коли печеня ціла і родина за столом. Печеня рідко буває єдиним, що розрізають.'
    choirforged_greaves_of_ashen_song: 'Велосипедні защіпки в соборі, де немає велосипедів. Передбачливість — сама собі винагорода.'
    choirforged_helm: 'Чавун, родинний розмір. Вм ятина зліва — від того разу, коли попередній власник висловив свою думку.'
    choirforged_ration_of_ashen_song: 'Це спакувала чиясь мати. Канапки нарізані трикутниками; апокаліпсис зачекає.'
    choirforged_sabatons_of_ashen_song: 'Розраховані на повінь, багнюку та неглибоку магму. На розмір більші, як і належить.'
    choirforged_signet: 'Залізний, пом ятий, один розмір — нікому не пасує. Відвів голки, скалки та один замах.'
    choirmaster_locket: 'Усі ключі собору на одному залізному кільці. Хто його носить, той відповідає за кожні замкнені двері й кожен звук за ними.'
    chokepoint: 'Лягає точнісінько там, де горло звужується нанівець. Ювелір, який його створив, наполягає, що це збіг.'
    cinchward: 'Само затягується, коли носій забуває обережно дихати біля рани. Має тверді переконання щодо постави.'
    cinder_band: "Уламок серця, що колись було цілим. Він пам'ятає. І хоче повернути решту."
    cinder_bow: ''
    cinder_cleave: ''
    cinder_crown: 'Сяйво робить тебе значущим. Повний набір робить тебе невідворотним.'
    cinder_cuirass: 'Підбита фрагментами попільного серця. Зігріває в тундрі і трохи підпалює всюди інде.'
    cinder_fangs: ''
    cinder_fists: "Одне клацання пальцями — і це вже проблема інших п'яти частин."
    cinder_greaves: "Кожне сидіння пам'ятає, що ти тут сидів. Жарина — теж."
    cinder_heart: 'Вирване ще розплавленим із грудей вогнесталевого голема, досить гаряче, щоб самотужки правити за цілий горн. Ковадла, поставлені надто близько, просто плавляться. Кузняний культ уже перестав називати це випадковістю.'
    cinder_heart_amulet: 'Частина, до якої всі інші й досі тихо намагаються повернутись.'
    cinder_heart_scepter: 'Наведи на повний набір — і щось у грудях починає щось задумувати.'
    cinder_heart_staff: "Носить вуглину, що ніколи не гасне повністю. Колона пам'ятає її тепло."
    cinder_locket: 'Тримає жарину, яка з принципу відмовляється гаснути.'
    cinder_loop: 'Оздоблений скалками жарового серця. Приємно теплий, а часом і надто теплий після кількох чарок.'
    cinder_maul: ''
    cinder_sash: 'Зітканий з нитки попелястого серця. Робить варту стерпною в найхолоднішу годину.'
    cinder_striders: 'Гріє взимку. Лишає слід уночі. Набір якось завжди стежить.'
    cinder_waistguard: 'Ніколи не холодний на дотик. Увесь набір чемно гарячкує разом.'
    cinderchant_robe: 'Стьобаний, до підлоги, злегка обсмалений. Померти в ньому — прийнятно; відчинити в ньому двері — ні.'
    cinderchoir_alloy: 'На удар видає акорд — це чарівно рівно доти, доки не треба обробити його тихо.'
    cinderchoir_brew_of_molten_antiphon: 'Зварений біля жерел, тож так і не вистигає. Здебільшого гріє. Іноді застерігає.'
    cinderchoir_cincture_of_black_choir_pyre: 'Тепла на дотик і тихо сипле сірим. Тижнями знаходитимеш попіл у пайку.'
    cinderchoir_cincture_of_black_choir_vitrified: 'Кравецька стрічка, розмічена в пальцях і п ядях. Виміряла трьох імператорів і збрехала всім трьом.'
    cinderchoir_crest_of_black_choir: 'Носять догори дном від часів попільної повені. Пахне лугом і тихою рішучістю.'
    cinderchoir_locket_of_black_choir: 'Береже дрібку спаленого співаника. Тихими ночами попіл складається в читні вірші. Не читай їх.'
    cinderchoir_tassets_of_black_choir_pyre: 'Тихо тліє на подолі. Модно, тепло і справжня загроза біля сухої трави.'
    cinderchoir_tassets_of_black_choir_vitrified: 'Підсилені там, де молитва протирає найшвидше. Латки нові; коліна під ними — справа пропаща.'
    cinderchoir_warboots_of_molten_antiphon: 'Підошви, відлиті з остигаючого стоку. Тримають денний жар до крижаної ночі. Здебільшого — дарунок.'
    cindercloth_gloves: 'Кожне рукостискання перетворює на короткий інструктаж з техніки безпеки.'
    cindercloth_hood: 'Тримає голову в теплі. Брови — ніде конкретно.'
    cindercloth_legs: 'Електричний розряд технічно входить у комплект. Жодна версія не задумувала це як фічу.'
    cindercloth_robe: 'Ченці зіткали це під обітницю опіків другого ступеня. Обітницю здебільшого дотримали. Брови — рідше.'
    cindercloth_sandals: 'Лишає світні сліди. Скритність тут ніколи й не планувалась.'
    claude_axe: 'Колись нею махав невтомний Клод, чия витривалість у бою стала легендою — а витривалість у спальні стала пересторогою зовсім іншого штибу.'
    cleancut: 'Лишає настільки точний розріз, що рана довкола нього загоюється неправильно. Хірурги вивчають ці шрами. Своїх висновків вони не публікують.'
    clearsight: 'Покращує видимість біля Шраму, що не таке вже й милосердя, як звучить. Дещо краще бачити лише наполовину.'
    cobalt_battlecleaver: 'Дворучний, двосiчний, ще теплий вiд попельної ящiрки. Жахливий для листiв, чудовий для ворогiв.'
    cobalt_club: 'Деревина квібека настільки щільна, що забула, як колись жила фотосинтезом.'
    cobalt_crushers: 'Підсилені кістяшки на випадок, коли слова не допомагають. Слова ніколи не допомагають.'
    cobalt_daggers: 'Двічі вкриті залозним екстрактом і раз, неофіційно, поганими рішеннями.'
    cobalt_longblade: 'Надiйний клинок зiгрiтий попельними лусками. Робить саме те що очiкуєш. У свiтi сюрпризiв це щось варте.'
    cobalt_mace: 'Загартована вощиною й сутінковою сталлю. Насаджує один закон: вулик — понад усе.'
    cobalt_pike: 'Наконечник з теплої луски та древко з кори квiбека. Досить довга щоб колоти здалеку. Стратегiя чи боягузтво вирiшуйте самi.'
    cobalt_shortbow: 'Плечі з кори квібека, тятива з грозових пер, що гудуть перед кожним пострілом.'
    cobalt_staff: 'Кора квібека, увінчана амулетом, вирізаним спеціально для терпіння, якого й справді потребує — вона направляє водну магію зі спокоєм крана, який вперто відмовляється закритися до кінця.'
    cobalt_sword: 'Обгорнутий шкірою попелошкірої ящірки. Теплий у руці й анітрохи себе не видає.'
    cobalt_waraxe: 'Вирізана з нагрітої сонцем луски й запечатана в бурштиновому воску, вона гуде нотою, і вулиси лякаються її, ще навіть не встигнувши побачити лезо. Корисна репутація. Рідко заслужена, бурчать пастухи.'
    cobalt_wargreaves: 'Достатньо важкі, щоб присідання стали тренуванням. Достатньо легкі, щоб втекти, коли тренування піде не так.'
    cobalt_warhelm: 'Стандартна видача для солдатів, які ще не заслужили на крутіший шолом.'
    cobalt_warplate: 'Захищає життєво важливі органи. Решта — самі по собі.'
    cocoon_king_amulet: 'Золотий шовковий ланцюжок, ще теплий від кокона, з якого його зрізали. Король ніколи не вимагає його назад вголос. Йому й не треба — думки носія тихішають з кожним днем.'
    cocoon_king_cowl: 'Зітканий з того ж золотого шовку, носиться низько на очах. Усе за межею витягнутої руки розмивається у затишну золоту імлу — милосердя це чи весь задум, вирішуй сам.'
    codex_of_the_damned: 'Оправлений у могильну шкіру. Кожне закляття тут хоч раз підвело свого чарівника.'
    codex_of_the_deep: ''
    coiffe_fuwa_black: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_fuwa_white: 'The matching hood. Wearing both at once is a documented cause of spontaneous cuteness.'
    coiffe_pepe: 'A humble green cap. The starter flex. Every royal was once just a pepe in a hat.'
    coiffe_pepe_royal: 'The pepe ascended. A gilded crown for those who bought the top and never sold.'
    collapse_alloy: 'Сплав із того, що впало разом. Здається стабільним лише тому, що складники вже здалися.'
    collapse_bludgeon_of_last_tremor: 'Один раз розмахнутий Розривником, що владнав суперечку про територію, — і територія перестала сперечатися. Закінчує речення, бійки і часом меблі, приблизно в такому порядку.'
    collapse_greaves: 'Важкі навмисно. У світі, де можна відлетіти, це втіха, а не скарга.'
    collapse_helm_of_widening_crack: 'Захищає голову від усього, крім того, що прямо над нею, — а саме це тут і небезпечно.'
    collapse_pendant_of_widening_crack: 'Береже дрібку пилу від першого, що тут упало. Пилу тут дуже багато.'
    colophon: 'Видавнича марка наприкінці пережила видавця, друкарню і більшу частину мови, якою книгу було написано.'
    concussion: 'Клінічно названий останнім, кого вона вдарила, у ту коротку мить перед тим, як він забув, як працює мова.'
    convergence_pendant: 'Два самоцвіти, одна оправа, одна нескінченна суперечка про те, чий світанок рахувати.'
    copper_band: "Зеленить палець через годину. Ювелiр наполягає що це 'патина' а не отруєння мiддю. Заспокоює."
    copper_cleaving_axe: ''
    copper_hoe: 'Найдешевший мідний інвентар фермера — і кожен мідний інструмент драговини рано чи пізно вдягає той самий відтінок зелені, хоче він того чи ні.'
    copper_pickaxe: "Достатньо м'яке щоб вм'ятини вiд поганого удару. Шахтарi компенсують кiлькiстю ударiв. Гора як завжди не вражена."
    copper_sickle: 'Мiдь окислюється у зелену патину за тиждень. Травники вважають це естетично доречним. Мiдь думок не має.'
    corbac_head: 'A crow-skull crown for the carrion-minded. The beak points at whatever you are about to loot.'
    cordwood: 'Виміряна в старій одиниці, якою вже ніхто не міряє деревину, бо деревини не лишилося настільки, щоб вона знадобилась.'
    core_forge_key: 'Легенда каже, що Жаротлінний Король викував єдиний справжній ключ із власного тліючого серця-вогню, надто гарячого для смертних рук. Це не той ключ. Але кілька ковалів присягаються, що майже той.'
    coronet_band_of_silent_court: 'Жодна душа не пригадує, щоб погоджувалася на такий результат, твердження, яке жодного разу не перевіряли.'
    coronet_edge_of_silent_court: 'Його поведінка суперечить власному опису, виноска, яку творець так і не написав.'
    coronet_lattice: 'Його класифікацію оскаржують відтоді, як його знайшли, про що дослідницька команда й досі сперечається.'
    coronet_legguards_of_silent_court: "Його створили, щоб довести думку, яку ніхто вже не пам'ятає, факт, який творець вважає перевагою."
    coronet_poultice_of_empty_seats: 'Той, хто це розлив, так і не визначився з остаточною версією, і поки що ніхто не вимагав повернення коштів.'
    coronet_resin: "Ніхто не може напевно сказати, звідки це взялося, і справу тихо закрили — нерозв'язаною."
    coronet_rod_of_silent_court: 'Комітет із дизайну насправді так і не дійшов згоди щодо цього, що або заспокоює, або глибоко тривожить.'
    coronet_tonic_of_silent_court: 'Його післясмак — питання особистої думки, факт, який тихенько оминули на етикетці.'
    coronet_torc_of_empty_seats: 'Працює саме так, як описано, — начебто, і чомусь це досі вважають успіхом.'
    coronet_treads_of_silent_court: 'Дизайн пережив три окремі заперечення, тож ніхто не потрудився подати скаргу.'
    coronet_visor_of_empty_seats: 'Функціонує лише завдяки формальності, і комітет так і не зібрався знову, щоб це переглянути.'
    coronet_warblade_of_silent_court: 'Його схвалили розділеним рішенням, і суперечка пережила всіх, хто її розпочав.'
    corvid_eye: 'Маленьке, чорне, і, здається, все ще спостерігає. Аптекарі перемелюють для мазі нічного зору. Етично каламутно.'
    corvid_feather_lance: "Оперена вороновим пiр'ям для аеродинамiки. Круки досi ображенi."
    crab_claw_grips: 'Зроблені з клешень, які все життя чіплялися за речі і відмовлялися відпускати. Рукавиці успадкували цю рису. Для зняття потрібна тепла вода, терпіння і друг, який не засудить.'
    crab_claw_hatchet: 'Клешня й досі сама відкривається й закривається. Здебільшого не вчасно.'
    crab_claw_joint: 'Шарнірний механізм масивної клішні. Інженери їх вивчають. Інженерія краща за все, що ми побудували.'
    crab_pincer_shivs: 'Загострені суглоби крабових клешень. Спершу щипають, потім ріжуть — якось це гірше.'
    crab_shell: 'Міцна оболонка, здобута з ракоподібного, що явно програло суперечку з кимось дуже голодним.'
    crab_shell_cuirass: 'Зброяр глянув на краба, сказав «та це вже готовий нагрудник», і взяв повну ціну за те, що по суті було переліпленням і шаром олії.'
    cracked_bone: 'Стегнова кістка, яка бачила кращі століття. На диво міцна попри тріщини. Собаки все ще хочуть її. Некроманти теж.'
    cracked_mace: 'Голова булави гримить з кожним замахом. Структурна цiлiснiсть це побажання а не гарантiя.'
    crazy_belt: 'Пояс гобліна, пофарбований у темно-червоний колір пігментами, які точно не є ягодним соком.'
    crazy_helmet: 'Зібраний гобліном, який раз почув ненадійну чутку про шоломи з чужих вуст.'
    crazy_tunic: 'Малинова туніка, яку раніше носив гоблін, що давно втратив розум.'
    crimson_brick: 'Кроваво-червона цегла що випромінює тепло годинами після печі. Різьбярі вирізують з неї корпуси жезлів.'
    crimson_truffle: 'Підземний делікатес, настільки рідкісний, що його ціну визначають на аукціоні, а не якоюсь тверезою ринковою логікою.'
    crimson_truffle_heart: 'Щільне пульсуюче ядро, вилучене з найглибшої камери, яку коли-небудь утворював багряний трюфель.'
    crooked_staff: "Палиця з iлюзiями магiчної величi. Єдине закляття що вона кидає це 'легкий сором'."
    crow_feather: 'Переливчасте чорне перо. Виробники гусячих пер добре платять. Привид ворони переслідуватиме ваші штрихи. Нібито.'
    crown_dust: 'Його каталогізували двічі — за двома різними теоріями, комітетом, який відтоді розпустили.'
    crown_of_quills: 'Корона, що забула, що вона коронує. Вона сидить неспокійно, не переконана у своїй власній владі чи меті.'
    crown_of_the_void_sovereign: 'У порожнечі офіційно немає володаря. Ця корона була самопризначенням, якому ніхто з присутніх не мав достатньої щільності, щоб заперечити. Каталогізатори вказують власника як «спірний».'
    crownfire_rod: 'Працює тимчасово, до подальшого розгляду, тож ніхто не потрудився подати скаргу.'
    crownless_blade: 'Його призначення переглянули вже після завершення, невелика втіха, зважаючи на альтернативу.'
    crownless_cuisses: 'Функціонує з застереженням, повернень немає, подальші питання не приймаються.'
    crownless_signet: 'Робить, що йому кажуть, — врешті-решт, компроміс, досягнутий, коли всі облишили сперечатися.'
    crownrot_cuirass_crown: 'Його надійність — предмет постійних дискусій, і творець пішов далі, не довівши думку до кінця.'
    crownrot_cuirass_godbone: 'Робить, що йому кажуть, — врешті-решт, рішення, яке майже нічого не вирішило.'
    crownrot_greaves_of_gilded_ruin: 'Робить рівно одну річ — і навіть це заперечує, що є або дефектом конструкції, або взагалі суттю задуму.'
    crownrot_helm_crown: 'Працює саме так, як описано, — начебто, і творець пішов далі, не довівши думку до кінця.'
    crownrot_helm_godbone: 'Інструкцію загубили під час гарячої суперечки, що носій вирішив просто прийняти на віру.'
    crownrot_ration_of_rotting_halo: 'На смак — як поспішне рішення, тож результати можуть значно відрізнятися.'
    crownrot_signet: 'Технічно функціонує в більшості умов, і носій навчився миритися з цією невизначеністю.'
    crude_branch: 'Дрова для одного — це, очевидно, легендарний компонент для крафту для іншого.'
    crude_hatchet: 'Скорiше загострений камiнь на палицi. Печерний стиль безкоштовно.'
    crude_ring: 'Зiгнутий дрiт з амбiцiями ювелiрного виробу. Якщо примружитись виглядає майже навмисно.'
    crystal_bread: "Скоринка виблискує. М'якуш мерехтить. У твого стоматолога буде авторська думка."
    crystal_focus_staff: 'Оснащений тріснутим уламком, що вигинає кожне заклинання туди, куди йому заманеться, а це рідко буває туди, куди цілилися ви. Старі маги звуть це «характером». Усі, хто стоїть на лінії вогню, звуть це коротшим словом.'
    crystal_ice_staff: 'Кристал, що вінчає його, жодного разу не танув — ні від кузняного жару, ні влітку, ні з упертості. Зручний, щоб охолодити напій. Значно переконливіший на ворогові.'
    crystal_tide_staff: 'Жезл з червоним кристалом на вершині, що пульсує приливною енергією. Іноді капає, що руйнує драматичний ефект, ретельно підготовлений носієм у важливі моменти.'
    crystal_ward_tome: 'Вкритий уламками кристалу. Кожне закляття крізь нього звучить, як дуже повільно падає люстра.'
    crystallized_loaf: 'Такий мінералізований, що коваль радше розбиває його на скалки, ніж їсть. Логічно.'
    crystallized_tanjirize: 'Танжерайз, що зазнав перетворення, якого жоден ботанік не годен пояснити і про яке більшість воліє не думати.'
    cuirass_of_the_hollow_king: 'Не броня, замовлена королем, — броня, яку виростив Порожнеч-Метелик, а король пізніше приписав собі честь її носіння. Різниця важила лише для однієї людини, і заперечувати вона вже не може.'
    cured_gauntlets: 'Правильно вичинена шкiра. Нарештi щось що не пахне мокрим собакою. Пахне сухим натомiсть.'
    cursed_amalgam: 'Вінець кар єри травника, зібраний в одну банку. Вночі він шепоче. Ніхто не питає, що саме.'
    cursed_boot_contradiction: 'Прокляте зберігаються, що міняє свободу руху на упертість. Носій рухається неловко, але вважає себе непереможним через чисту суперечність.'
    cursed_fungus: 'Безсумнівна вершина травницьких амбіцій, гриб настільки сконцентрованої зловмисності, що шепоче імена тих, хто наближається, голосом, схожим на шурхіт сухого листя по кришці труни. Досвідчені збирачі повідомляють, що його не стільки збирають, скільки він дозволяє себе взяти — розрізнення, яке не приносить жодного заспокоєння.'
    cursed_gem: 'Шепоче темнi обiцянки кожному хто тримає його надто довго хоча обiцянки здебiльшого про бiль у спинi.'
    cursed_gem_powder: 'Шепотiння погiршилося пiсля подрiбнення. Тепер воно критикує вашу технiку крафту в реальному часi.'
    cursed_helm_paradox: 'Прокляте шолом, що загальнює розум, натомість укріплює тіло. Він дарує життя через втрату ясності, угода, написана в парадоксі.'
    cursed_loaf: "Шепоче рецепти кожному хто тримає. Хліб має думку про вашу техніку і вона не люб'язна."
    cursed_root: 'Видертий із проклятого гриба зі справжнім зусиллям, бо той має звичку хапати у відповідь сильніше, ніж личить будь-чому без хребта. У сховищі він лишається теплим і час від часу здригається. Досвідчені травники звуть це нормою тоном, який не переконує геть нікого.'
    cursed_straw: 'Взята від опудала, яке було значно жвавіше, ніж очікувалось. Все ще смикається, коли ніхто не дивиться.'
    cursed_straw_amulet: 'Клятва, дана істотою, що технічно не має рота. Вона все одно її дотримала, зі злості.'
    cursed_wheat: 'Стебло зерна, почорніле від темної магії; його зерна шепочуть від невдоволення.'
    deadweight: 'Важча, ніж потрібно для роботи, а робота на цей надлишок жодного разу не скаржилася.'
    deathgrip: 'Замикає пальці в мить удару й лишається замкненою на удар довше, ніж хотілося б носію.'
    deathless_blade: "Витягнена з кістяків. Загострена на межі двох світів. Знаряддя, що пам'ятає свою роботу."
    deep_scale: 'Чорна, як безодня, звідки вона родом. Левіафан носив їх тисячами. У тебе — одна. Май скромність.'
    deepbreath: 'Сидить так щільно, що повний вдих потребує свідомого зусилля. Більшість носіїв перестають це помічати з другого тижня.'
    deepmoss_leggings: 'Підбиті мохом, що лишається ледь вологим, хоч би скільки ти його носив, узятим звідти, де б не кублилися Мохові Ведмеді. Він має думку щодо того, щоб лишатися сухим. Ця думка програє.'
    deepreach: 'Розширює досяг заклинача до місць, куди він особисто волів би не потикатися.'
    deepscale_fists: 'Кісточки зміцнені проти того, що гніздиться у старих могилах.'
    deepwater_breastplate: 'Дублена в болотній воді, аж поки іржа не здалася. Пахне драговиною, бо сама з драговини.'
    deepwater_stilts: 'Підіймають над найгіршим мулом. Найгірше однаково знаходить шлях нагору.'
    deepweald_longbow: 'Натягнутий досить туго, щоб безшумно пустити стрілу крізь густу пітьму Вельду, де звук лине далі, ніж будь-коли сягав зір. Зграя тут полює на слух; тобі варто так само.'
    deepwoven_carapace_of_deep_canopy: 'Шаруватий, як намет крон, на честь якого названий, кожен шар виріс із нижнього, через що його полагодження — радше справа садівництва, ніж ковальства.'
    deepwoven_cincture_of_drowned_weald_matron: "Намотаний з нитки самої Матрони, тримає вузол, якого не в'язала людська рука, і відмовити його від цього не вдасться."
    deepwoven_cincture_of_drowned_weald_mire: 'Тканий пояс, що сам затягується в холодній воді, — корисний рефлекс, доки не згадаєш, що він спершу не питає.'
    deepwoven_composite: 'Витканий під тиском на найглибшому верстаку Вельду, де шари сходяться так щільно, що шов стає радше чуткою, ніж прикметою.'
    deepwoven_crest_of_deep_canopy: 'Пронизаний живою наметовою лозою, що й далі росте на голові власника, повільно, у напрямку, якого він не обирає.'
    deepwoven_crest_of_drowned_weald: 'Витканий під водою так щільно, що ніколи до кінця не висох, і тепер важить на волосину більше, ніж мав би, — назавжди, на зло.'
    deepwoven_philter_of_drowned_weald_matron: 'Настояне на шовку Матрони, що ніколи цілком не розчиняється, тож одна нитка його завжди лишається, латаючи те, чого його не просили латати.'
    deepwoven_philter_of_drowned_weald_mire: 'Проста версія, яку носять провідники, удвічі слабша й удвічі надійніша, — обмін, що тут, унизу, тримає тебе живим.'
    deepwoven_splitter_of_deep_canopy: "Збалансований, щоб рубати наметову лозу, що обв'язує яруси, — буденна робота, яку він виконує з нестримно надмірним завзяттям."
    deepwoven_tassets_of_deep_canopy: 'Виросли внапусток вайями, як намет угорі, тож низький удар лише розсуває листя й знаходить іще листя.'
    demon_codex: ''
    dented_mace: "Бiльше вм'ятин нiж на бамперi на парковцi. Кожна урок 'цiлься нижче колiна'."
    diadem_casque_of_broken_diadem_crown: 'Носій наполягає, що воно працює; докази непереконливі, рішення, ухвалене під значним тиском часу.'
    diadem_casque_of_broken_diadem_godbone: 'Майстерність бездоганна; передумова — ні, що заспокоює рівно настільки, наскільки це звучить.'
    diadem_charm_of_falling_crown: 'Його ефективність жодного разу не перевірялася незалежно, що вже ніхто не має сил заперечувати.'
    diadem_chausses: 'Його завершили суто з упертості, що вже ніхто не має сил заперечувати.'
    diadem_cordial_of_falling_crown: 'На етикетці вказано інгредієнт, який ніхто не може впізнати, факт, який тихенько оминули на етикетці.'
    diadem_elixir_of_broken_diadem: 'Його дія настає — або ні, — непередбачувано, тож продається знизуванням плечима замість гарантії.'
    diadem_lattice_crown: 'Його точні властивості залежать від того, кого запитати, розбіжність, яку нікому не доручили усунути.'
    diadem_lattice_godbone: "Чи це один матеріал, чи кілька — досі не з'ясовано, і другого пояснення так і не спростували остаточно."
    diadem_vambraces_crown: 'Виконує роботу, яку йому врешті доручили, що є або суттю всього задуму, або просто похибкою округлення.'
    diadem_vambraces_godbone: 'Виконує заявлену функцію з видимою неохотою, тож дискусію відклали на невизначений термін.'
    diamond: 'Уламок стиснутого вуглецю, що забув стати величним, виритий з скупих обіймів землі.'
    diamond_bag: 'Вміст цієї торбини міг би купити маленьке королівство, хоча й робить доволі розчаровуючу метальну зброю.'
    diamond_bread_1: 'Коврига хліба, посипана товченими діамантами — кожен укус приносить задовольний хрускіт, що карає щелепу.'
    diamond_powder: "Доказ того, що єдина річ, яку неможливо розбити у цьому світі — це цінник, що до неї прив'язаний."
    diving_crude_grips: 'Внизу, у затопленій шахті, вони хапають усе з силою, яку жодна жива рука не мала б витримати. Тут, нагорі, вони так само міцно хапають ваше терпіння — три дні до висихання, і щогодини пахнуть припливною калюжею, в якої видався важкий тиждень.'
    diving_visor: 'Виготовлений з краба, що побив трьох рибалок і чайку, перш ніж здатися. Забрало досі несподівано зачиняється, що майстер називає перевагою конструкції.'
    doomed_axe: 'Останній могильник утримував це. Сім сотень могил і рахунок йде. Робота не зупиняється, знаряддя не іржавіє.'
    doomed_battleaxe: 'Стандартна видача після третього набору. Про другий ніхто не питає.'
    doomed_club: 'Коли слова не діють, це — наступне речення. Тут слова рідко діють.'
    doomed_fang_daggers: 'Парні клинки Попелястої Вдови. Укус тих, кого вони торкнулись, назавжди лишився в металі.'
    doomed_grimoire: 'Кожен запис зроблено до похорону. Поля досі заповнюються.'
    doomed_longsword: "Кожен замах шепоче iм'я того, кого ви забули. Збiг обставин, мабуть."
    doomed_mace: 'Викувана з обіцянок, яких ніхто не дотримав. Кожен удар — це вибачення, що спізнилось.'
    doomed_shortbow: 'Стрiли з цього лука прибувають ранiше за звук. Цiлi рiдко встигають поскаржитися.'
    doomed_spear: 'Реквізовано в списника, який більше не подає скарг.'
    doomed_staff: 'Спрямовує водну магiю через ядро стисненого жаху. Дуже ефективно, морально сумнiвно.'
    doomed_sword: 'Остання творiння коваля перед виходом на пенсiю. Пенсiя не була добровiльною.'
    doomhammer_eternal: 'Молот, яким лінія Розбитих Солдатів завершувала суперечки, бої і, зрештою, власний послужний список. Все ще розмахується так, ніби суперечка не зовсім скінчилася.'
    draconite: 'Кристалiзована есенцiя дракона яку дракони дуже хотiли б повернути будь ласка припинiть її видобувати.'
    draconite_powder: 'Ледь димить навіть за кімнатної температури. Зберігання вимагає вогнетривкого сховища й міцних нервів.'
    draconize_flour: 'Замішувати можна лише у вогнетривких рукавицях. Готовий хліб часом гарчав у відповідь.'
    dragon_fire_breath: ''
    dragon_frost_breath: ''
    dragon_petal_extract: "Вісім інгредієнтів, один флакон, і жодного пояснення тепла, яке етикетка звe 'магією'."
    dragon_pollen: 'Дрібний золотий порох, зібраний з тичинок драконолілії, який ледь збурює будь-який коли-небудь винайдений алхімічний вимірювач і випромінює тепло, що виказує близькість сил, які краще не турбувати. Всуціль алергенний, надзвичайно цінний і несе тонкий, але безпомильний запах жалю.'
    dragon_void_essence: ''
    dragonite_crust: 'Кірка чинить опір коли її ламають. Ковалі вбудовують уламки в сокири для самозагострення.'
    dragonlily: 'Ботанічна неможливість, укрита переливчастою лускою та джерело смердючих пахощів, які найкраще описати як суміш похоронного бюро з сірчаною ямою, — навіть справжні дракони вважають це достатньо неприємним, щоб уникати. Вчені досі не можуть домовитись, чи це рослина, що вдає рептилію, чи рептилія, що зреклася будь-яких амбіцій.'
    drakar: 'Draconic plate that runs warm to the touch. Small dragons find it flattering; large ones find it rude.'
    draugature: 'Смуга загартованої шкіри, викуваної в невблаганному холоді могильних склепів, сплетена з сухожиль неспокійних мерців, що блукають замерзлими пустками.'
    draugr_bone: 'На диво важко зламати навпіл. Старе трупне заклякання, кажуть копачі, тримає драугра просто-таки навіки — і, вочевидь, пропустило ту частину, де воно мало б скінчитися після смерті.'
    draugr_bone_staff: ''
    draugr_daggers: 'Кажуть, що сільський дурень зробив їх. Сільський дурень заперечує, стверджуючи, що в нього є стандарти.'
    draugr_fractured_amulet: 'Розтрісканий амулет draugr-походження, його рунічні вставки розколоті на старій кістці.'
    draugr_helmet: 'Носіння її не дарує ні влади, ні поваги, зате чудово приховує рідіюче волосся.'
    dread_lance: ''
    driftwalkers: 'Не лишає слідів. Здебільшого тому, що ти торкаєшся землі надто коротко для сліду.'
    drowned_amber: "Смола, що затвердла під водою й ув'язнила те, що проходило тоді повз, — і що краще не роздивлятися при світлі свічки."
    drowned_root_grimoire: "Оправлений у кореневу кору, ще вологу невідь-звідки, сторінки м'які від гнилі, та чорнило чомусь недоторкане. Подейкують, що береги списав Оракул Глибин."
    drownmarked_casque_matron: 'Скроєний з панцирної пластини, яку Матрона Глибин скинула й не повернулася по неї, — це або удача, або запрошення, яке ніхто не хоче мати прийнятим.'
    drownmarked_casque_mire: 'Несе бліду лінію припливу, яку глибокий Вельд лишає на всьому, що бере й повертає, — а це більше речей, ніж Вельд любить визнавати, що повертає.'
    drownmarked_chausses_of_rising_tide: 'Позначені точно на висоті, до якої піднялася вода тієї ночі, коли Вельд забрав нижні яруси, носяться як спогад і, час від часу, як пересторога.'
    drownmarked_cordial_of_rising_tide: 'Змішана на переломі припливу, якого Вельд нібито не має, — момент, який варильник вловлює чуттям і відмовляється пояснювати.'
    drownmarked_elixir: 'Несе бліду лінію припливу всього, чого торкнувся глибокий Вельд, — що етикетка подає як знак справжності, а мудрі читають як позначку того, де він побував.'
    drownmarked_kris_of_fen_below: 'Його хвиляста візерунок глибшає, чим довше він лежить у фенській воді, тож старий завдає рани, якої не зашив би жоден прямий клинок.'
    drownmarked_loop_matron: 'Відлита з ікла, яке Матрона лишила в чомусь, що визнала не вартим завершення, — відзнака, якою власник волів би не ділитися.'
    drownmarked_loop_mire: 'Забарвлена багновою водою в чорноту, що ковтає світло свічки, носиться тими, хто волів би, щоб їхні руки не впадали в око.'
    drownmarked_resin: 'Смола, що витекла з дерева, яке забрала глибока вода, і досі поволі плаче, — що майстри вважають знаком, що воно ще не домерло.'
    drownmarked_saber_of_fen_below: 'Вилучена з шару, який провідники звуть Нижнім Феном, — назву, яку вони вимовляють радше щоб відрадити, ніж щоб указати шлях.'
    drownmarked_saber_of_rising_tide: 'Вигнута за формою води, в якій гартувалася, вона ріже за течією й опирається кожному, хто замахується проти неї.'
    drownmarked_tome_of_rising_tide: 'Чорнило розпливається трохи більше щоразу, коли книгу відкривають під водою, — що вчені глибокого Вельду вперто звуть книгою, яка сама себе переписує.'
    dualpact_circlet: "Прив'язаний до двох стихій, які домовились лише про спільну опіку — і більш ні про що."
    duke_breastplate: "Гравіювання: два гобліни б'ються за одну монету. Жоден не перемагає."
    duke_crossbow: ''
    duke_rapier: 'Викрадена у гоблінського герцога, який голосно й часто присягався, що користувався нею лише почухати спину. Жодна душа при дворі йому не вірила, і всі однаково дозволяли йому розповідати це знову й знову.'
    duke_sash: 'Вдягали на кожну страту, куди він особисто не приходив. Імідж важливий.'
    duke_signet: 'Печатка у формі чоловічка з великим пальцем угору. Він сам це замовив.'
    duke_signet_ring: 'Шляхетність по-гоблінськи: за кількість посадовців, яких особисто зіштовхнув зі сходів.'
    duke_sword: 'Колись належав гоблiнському герцогу, який мав дуже сильнi думки про оподаткування.'
    dungeon_key_goblin_cave: 'Ця іржава залізна ключа вібрує від слабкої магії, дозволяючи своєму власнику минути приховані перепони, що охороняють скарби Короля Гоблінів.'
    duskfire_rusk: 'Ледь світиться в сутінках. Чинбарі мочать у ній шкіру заради оздоблення, якого ніхто до пуття не пояснить.'
    duskite: 'Мiнерал що поглинає свiтло настiльки агресивно що шахтарi постiйно гублять його у власних кишенях.'
    duskite_powder: 'Настільки темна, що справжня тінь порівняно з нею здається сонячною. Продавці косметики спробували її лише раз, за переказом, і відтоді ту покупчиню ніхто не бачив, щоб виходила з крамниці серед білого дня.'
    earthsea_tassets: 'Наполовину земний, наполовину океанський. Кожна половина певна, що інша — лише про показуху.'
    ectoplasm: 'Напівпрозорий залишок привида. Проходить крізь незачаровані контейнери. Зберігання — пригода сама по собі.'
    ectoplasm_locket: 'Розкривається портрет, якого не впізнав жоден живий. Кілька мертвих впізнали, та мовчать.'
    ectoplasmic_tome: 'Палітурка сочиться прозорим слизом. Бібліотекар сказав, що це нормально. Бібліотекар теж був прозорим, що мало б бути знаком. Ніхто не ставив додаткових запитань.'
    ekusoni: 'An exorcist mask that hums faintly near the recently deceased. Probably nothing.'
    elder_totem: 'Вирізаний десятиліттями артритичними руками. Випромінює спокійну мудрість і легке несхвалення всього, що ви зробили сьогодні.'
    elder_totem_amulet: 'Вирізаний зі старого дерева Квібеків руками настільки маленькими, що сліди інструментів виглядають як каліграфія. Тотем зображує істоту, яку Квібеки відмовляються називати, описувати чи визнавати. Але за її подобу беруть щедро.'
    elder_totem_talisman: "Вирізьблена з тотема, який Небесна Матрона стерегла довше, ніж Пандора має ім'я."
    elemental_catalyst_air: ''
    elemental_catalyst_earth: ''
    elemental_catalyst_fire: ''
    elemental_catalyst_water: ''
    elixir_of_agility: 'Рідкі рефлекси котячого рівня. Здатність приймати рішення не входить — і це видно майже одразу.'
    elixir_of_chance: 'Дистильована ймовірність. Покращує аркуш характеристик. Твоє реальне везіння, на жаль, незмінне.'
    elixir_of_intelligence: 'Гострить розум на годину, а его — набагато довше.'
    elixir_of_strength: "Тимчасово змушує бити як хтось удвiчi бiльший. Побiчнi ефекти: самовпевненiсть та мимовiльне напруження м'язiв."
    elixir_of_vitality: 'Видають перед наступом за статутом. Не питає, чи ти готовий.'
    embalmed_ancestral_club: 'Те, що лишилося після обряду бальзамування. Важче, ніж належить.'
    embalmed_bow: 'Зберігається в похоронних спеціях. Витягнена з арсеналу охоронця трупів. Тятива ніколи не була для живих; вона все ж тримається.'
    embalmed_club: 'Кожен удар будить те, що спало не просто так.'
    embalmed_cuirass: 'Підбитий бальзамувальним шовком зі складів могильників. Тримає форму, коли все інше вже здалося.'
    embalmed_grips: 'Обгорнуті тим самим шовком, що й мертві. Хватка не слабне навіть потім.'
    embalmed_legguards: 'Твої ноги замумійовані і, чомусь, напрочуд стильно оздоблені.'
    embalmed_locket: 'Береже портрет, написаний на поховальному шовку. Обличчя не постаріло від дня сеансу.'
    embalmed_silk: "Пов'язки, зняті з морозного волоцюги, збережені свіжими століттями холоду, а не мистецтвом бальзамувальника. Виходять чудові бинти — якщо вирішити не питати, де вони побували."
    embalmed_silk_ring: 'Кільце, зіткане з бальзамованого шовку. У мерців напрочуд міцне рукостискання, коли вони це носять.'
    ember_core: 'Крихітне сонце, замкнене в мінералі. Пропалює сумки. Досвідчені авантюристи носять їх у глиняних горщиках.'
    ember_core_scepter: "Жар, вправлений у залізо, заспокійливий рівно до тієї миті, коли помічаєш, що він не переставав наростати. У старих ковалів є слово для цього відчуття. М'яко воно не перекладається."
    ember_reduction: 'Витоплений жир із трапезних печень. Смажити, просочувати, підкуповувати гончаків — один слоїк на все.'
    ember_scripture: 'Написаний чорнилом, що проступає лише в теплі. Читати його потребує вогнища й терпіння святого.'
    ember_shortbow: 'Випущені з нього стріли світяться весь шлях до цілі — оперувальник називає це красою, а лучник називає це кінцем будь-якої несподіванки назавжди.'
    ember_silk: 'Нитка, спрядена з коконів, що вічно тліють без згасання. Тепла на дотик і надзвичайно небезпечна для необережних рук, що не знають меж своєї цікавості.'
    ember_silkblade: "Кувалася з шовкових волокон, що спалахнули й загартувалися в палаюче лезо, яке відмовляється остигати. Досить гнучке, щоб зав'язатися у вузол — якщо ваші пальці мають імунітет до опіків третього ступеня."
    ember_studded_belt: 'Магмуліган палав, коли цю вовну стригли. Стригаль теж зайнявся невдовзі. Пояс зберігає затишне тепло і легкий присмак взаємного жалю.'
    ember_walkers: 'Підошви ніколи не холонуть — диво чарів це чи серйозна вада задуму, ще питання.'
    emberchant_breastplate_of_last_verse: 'Зірвана з вівтарного столу одним чистим ривком. Свічники нічого не помітили.'
    emberchant_breastplate_of_twelve_voices: 'Вісім шарів вати між тобою і світом. Світ розуміє натяк.'
    emberchant_composite: 'Шарували, співаючи, бо старі ковалі божилися, що це закріплює зерно. Воно закріплює. Ніхто не знає чому.'
    emberchant_core: 'Вуглина, що просто не гасне. Кузні її люблять; хто носить її в кишені, швидко вчиться цього не робити.'
    emberchant_extract: 'Те, що лишається після кипіння. Кухар зве це бульйоном; алхімік — розчинником; стік — колегою.'
    emberchant_hand_axe_of_twelve_voices: 'Досить мала, щоб метнути, досить лиха, щоб лишити. Цей вибір переслідує в кожному бою.'
    emberchant_legguards_of_last_verse: 'Зимова вовна в будівлі, яку опалює дракон. Бабуся заперечень не приймає.'
    emberchant_tonic_of_last_verse: 'Мед, трави і шепіт попелу. Тане досить повільно, щоб пережити проповідь.'
    emberchant_treads_of_last_verse: 'Сплетені досить товсто, щоб опівночі перейти холодний плитняк і не збудити крипту.'
    emberchant_waraxe_of_twelve_voices: 'У хорі дванадцять голосів. Ця залагоджує суперечки всіма дванадцятьма разом.'
    emberglow_staff: 'Вугілля на верхівці ніколи повністю не згасає. Як і опіки на пальцях власника.'
    embermaw_gauntlets: 'Залишкове тепло від фрагментів попільного серця робить ці рукавиці некомфортно теплими. Як рукостискання з гарячковим хворим.'
    emberwalk_striders: 'Дають безтурботно перейти ложе з жарин. Дорога назад — окрема покупка.'
    emberweave_hauberk: "Зіткана з волокна, яке пам'ятає власну пожежу — і тобі забути не дасть."
    empyrean_charm_of_broken_diadem: 'Виконує заявлену функцію з видимою неохотою, і різниця десь по дорозі перестала мати значення.'
    empyrean_elixir: 'Інструкція з дозування суперечить сама собі на середині етикетки, і досі жодна людина не вимагала повернення коштів.'
    empyrean_sash_of_falling_crown: 'Його призначення переглянули вже після завершення, і творець здебільшого це підтверджує.'
    enchanting_dust: 'Порошковий магiчний залишок яким ювелiри посипають аксесуари щоб тi зловiсно свiтилися.'
    enka_muru: 'A traveller’s cloak stitched for long roads and short conversations.'
    enriched_dough: 'Тісто настільки збагачене мінералами що майже геологічний зразок. Майстри клянуться ним.'
    ensable_crystal: 'Місце йому у вітрині — так каже кожен музей, що завжди відмовлявся за нього платити.'
    ensable_key: 'Встав неправильно — і замок заповнюється обсидіаном. Талан любить обережних.'
    ensable_pincers: 'Щось там, унизу, прагне повернути це так сильно, що досі шукає.'
    etched_signet: 'Має вигравiруваний герб що може бути вовком котом або абстрактним мистецтвом. Ювелiр теж не впевнений.'
    eternal_biscuit: ''
    eternal_eclipse_blade: 'Існує в постійній тіні незалежно від джерела світла — так само, як крило Порожнеч-Метелика, з якого його викроєно. Астрономи мають думки з цього приводу. Клинок їх ніколи не питав.'
    eternal_wisdom_chain: 'Несе ключ для кожного ящика, що коли-небудь пройшов через цей пост.'
    eternwool_band: 'Відлитий з тієї ж партії, що й сотня інших. Цей повернувся.'
    ethereal_ukranize: 'Його знайшли там, де за записами його бути не мало, тож у реєстрі просто вказали обидва варіанти поряд.'
    evenhand: 'Зважена до частки, яку коваль не розкриває. Кожен носій присягається, що вона прихильна саме до нього. Це не так.'
    executioners_verdict: 'Дзвенить, як молоток військового трибуналу, при змаху, винесений тим Розбитим Солдатом, кому випав короткий жереб того століття. Вирок завжди той самий. Паперова тяганина не потрібна.'
    faded_spellbook: 'Половина сторiнок зникла решта розмазанi. Один розбiрливий заклинок: список покупок 200-рiчної давнини.'
    fangs_of_the_abyss: "Вирвані з чогось, що мало б вічно спати на дні порожнечі, не тривожене ніким. Рукояті досі іноді посмикуються, ніби пам'ятають про своє справжнє походження."
    farpoint: 'Націлений на ціль, яку носій ледве ще бачить. До моменту влучання це вже не так.'
    farshot: 'Натягнутий на дистанцію, яка жодному розсудливому лучнику не потрібна біля Шраму, де все варте пострілу вже й так чути на нюх.'
    farwalker: 'Створений для відстані, яка нікому не мала бути потрібна біля стіни. Комусь вона все ж таки знадобилася.'
    faultline_extract: 'Виточене з живої тріщини. Робітники в рукавицях; тріщині до рукавиць байдуже.'
    faultline_grips_of_split_sky: 'Виліплені на передній кінцівці Розривника того дня, коли небо над розломом нарешті перестало вдавати твердість. Сила хвату потроюється. Відчуття глибини цього обміну не переживає.'
    faultline_hand_axe_of_torn_ground: 'Продавали як шукацький інструмент. Використовують виключно для іншого.'
    faultline_poultice_of_split_sky: 'Набивається в шви линяючого Розривника, щоб новий панцир не застиг криво. На людях працює приблизно так само: нерівномірно, але працює.'
    faultline_quartz: 'Виріс уздовж розлому, тож бездоганний усюди, крім єдиної лінії, що має значення.'
    faultline_torc_of_split_sky: 'Вартовий Брами носив це, вдивляючись у небо, що технічно вже перестало бути єдиним небом. Відбиває обрій двічі вздовж шва. Друге відбиття, кажуть, дивиться у відповідь.'
    faultline_torc_of_torn_ground: 'Заземлює тебе, буквально, до світу, чий ґрунт — суцільний жарт. Результати мішані.'
    faultline_treads_of_torn_ground: 'Підбиті линялими стопними пластинами Розривника, що чіпляються за розколоту землю з тим самим інстинктом, що й колишня жива кінцівка. Одна підошва завжди знаходить опору. Друга досі про це сперечається.'
    faultline_visor_of_split_sky: 'Тут у обрію є шов. Витріщатися на нього на удачу — необов’язково й нерозумно.'
    faultline_warbelt_of_split_sky: 'Достатньо широкий, щоб повісити невеликий арсенал. Власник так і робить, а потім шкодує про вагу.'
    featherfall_daggers: "Ніхто не пам'ятає, щоб погоджувався на такий результат, і комітет так і не зібрався знову, щоб це переглянути."
    feathergilt_ingot: 'Його класифікацію оскаржують відтоді, як його знайшли, тож покупцям радять судити самостійно.'
    feathergilt_visor_of_silent_court_crown: 'Погоджується працювати лише під письмовим протестом, тож розбіжність тихо ввібрали в сам дизайн.'
    feathergilt_visor_of_silent_court_godbone: 'Виконує свою роботу, а потім за це вибачається, тож первісну скаргу так і не відкликали офіційно.'
    feathergilt_waraxe_of_silent_court: 'Його творець відмовився щось пояснювати далі, і носій навчився миритися з цією невизначеністю.'
    fen_amulet: 'Народжений у болоті і пахне болотом. Добре поєднується з соціальною ізоляцією.'
    fen_gland: 'Приваблює здобич. Буквально всіх інших відштовхує здалеку — навіть власний вид.'
    fen_impaler: 'Витягнуте з болота, яке подало офіційне, геть мокре заперечення.'
    fen_mace: 'Благословлена чимось, що живе в найглибшiй частинi болота. Ви не хочете з ним зустрiтися.'
    fen_moss_clump: 'Токсичний болотний мох, що процвітає на болотних створіннях. Травники використовують у протиотрутах. Іронія від них не вислизає.'
    fen_moss_mallet: 'Молот, вкритий живим болотним мохом, що повністю відростає за одну ніч. Вдарте щось достатньо сильно — і мох зітхне тихо та сумно. Незрозуміло чому саме.'
    fen_reaper_axe: 'Жне очерет і кістки з однаковим терпінням. Драговині ніколи не бракує ні того, ні іншого.'
    fen_reed: 'Твердий, мов залізо, очерет, що росте лише там, де фен найглибший, збираний тими, хто готовий засунути руку й повірити, що вона повернеться.'
    fen_trident: 'Три зуби, вкриті болотним мулом. Один тільки запах тримає більшість ворогів на відстані. На жаль, і союзників теж.'
    fenrot_composite: 'Матеріал, залишений гнити рівно до потрібного ступеня, — вікно, яке майстри ревно бережуть, а підмайстри регулярно псують.'
    fenrot_draught: 'Бродить трохи більше з кожним днем, коли його не випито, доки зрештою не перестає бути ліками й не стає рішенням.'
    fenrot_draught_of_moonlit_mire: "Названий на честь місяця, що ніколи не сягає так глибоко, — що варильник вважає поетичним, а той, хто п'є, слушно вважає пересторогою."
    fenrot_gauntlets: "Гниль з'їла тонку моторику ще років тому. Залишилася хватка, яка, чесно кажучи, ще жодного разу не розтискалася — навмисно чи ні."
    fenrot_girdle_of_moonlit_mire: 'Пофарбований багновою водою в колір, що читається як щось лише під місячним світлом, яке ніколи не сягає так глибоко, тож він навмисне лишається загадкою.'
    fenrot_girdle_of_quiet_drowning: 'Згнив до гнучкості, щоб затягуватися однією рукою в темряві, — мала милість, яку фен дарує й одразу змушує за неї платити.'
    fenrot_greatblade: 'Пролежав у фені досить довго, щоб узятися виразками й шрамами, що коваль перейменував на характер і відповідно підняв ціну.'
    fenrot_greaves: "М'які від гнилі так, що виявляються тихими в русі, — єдина валюта, яку шанує фен."
    fenrot_helm_of_moonlit_mire: "Шкіра розм'якла від гнилі й такою лишилася, що, як виявилося, гасить удар краще за все, що продають сухопутні."
    fenrot_helm_of_quiet_drowning: 'Замкнений щільно, щоб не пустити всередину фен, і, як дехто з власників тривожно зауважує, щільно, щоб утримати всередині затамований подих.'
    fenrot_ration: 'Польова медицина, загорнута у фенський лист, що тримає її свіжою й надає смаку, який ніхто ніколи не назвав добрим, лише дієвим.'
    feran_gauntlets: 'Відростають за тиждень. Феранам байдуже — вони вже ні про що не шкодують.'
    feran_hide_belt: 'Вичинена шкіра ферана, гнучка і темна як безмісячне узбережжя. Феран був самотнім хижаком припливних рівнин, і пояс несе його вдачу — роздратовано скрипить, коли мокрий, і категорично відмовляється поєднуватися з чимось модним.'
    feran_hunting_charm: "Кістяний тотем з пояса ферана. Пахне кров'ю здобичі і засідкою. Рейнджери платять подвійну ціну. Без питань."
    feran_pelt: 'Плямиста шкура котячих, неймовірно еластична. Шкіряники плачуть від якості. Феран був менш зворушений.'
    feran_stalker_gloves: 'Хутро стає дибки, коли здобич близько — а ще під час грози, біля багать і тієї миті, коли власник бреше. Мисливська рукавиця і сумління, зшиті в одну шкуру, чи просили ви про друге, чи ні.'
    fingerbind: 'Підходить до кожного пальця, на якому його пробували. Коваль, що його викував, ніколи не знаходив це заспокійливим.'
    fire_spellbook: ''
    firesteel_grimoire: ''
    firstlight_carapace_of_closing_age: 'Обшитий блідим металом, що утворюється лише там, куди ще сягає перший світанок. Тієї поверхні щороку меншає, і ковалі це помітили.'
    firstlight_extract: 'Дистильована точно в хвилину першого світла, що дає алхімікам одну спробу на день і дуже коротку витримку вже до полудня.'
    firstlight_halberd_of_world_wound: 'Достатньо довга, щоб тримати край Рани на точній відстані, яку Уламки Стіни вважають придатною для виживання. Міра точна й не обговорюється.'
    firstlight_locket_of_world_wound: "Містить дрібку першого світанку, запечатану, перш ніж вона встигла згаснути. Не згасла. Власнику радять не відкривати й не з'ясовувати чому."
    firstlight_warboots_of_world_wound: 'Зашнуровані, щоб пронести прочанина крізь ту єдину годину, коли Рана мовчить. Проґав це вікно — і чоботи стануть найменшим клопотом.'
    fish_scale: 'Веселкова луска щуки. Ювеліри полірують у дешеві кулони. Риба не мала права голосу.'
    flame_crystal_staff: 'Увінчаний жариною, що відмовляється гаснути — як і маг, що її несе.'
    flare_band: 'У руці — лагідна. Справжня небезпека тієї миті, коли щось накладаєш.'
    flooded_nave_key: 'Слизький від нефової води, що ніколи повністю не висихає. Потонулий Пріор досі веде там паству; ніхто не пояснив, кому саме він проповідує.'
    flying_fish_wing: 'Прозорий плавець, що й досі за звичкою намагається впіймати вітер.'
    footnote: 'Посилається на джерело, якого більше не існує, заради твердження, яке також ніхто не спромігся спростувати.'
    fortress_legguards: 'Ноги стають фортецею. Мобільність стає спогадом.'
    fracture_cordial_of_long_collapse: 'Заброджена в гнізді Розривників, у панцирі, що ніколи не закрився до кінця. Гоїть повільно й нічого не просить натомість — після всього іншого в цьому світі це майже підозріло.'
    fracture_hauberk_rift: 'Складена з поламаних клинків. Кожен зламався за роботою; тобі завершувати їхню.'
    fracture_hauberk_void: 'Кольчуга, скроєна під тіло Розривника перед линькою, кожне кільце навмисно відлите трохи криво. Тримається так само, як тримався Розривник: ледве, і лише під напругою.'
    fracture_ingot: 'Відлитий з волосяною тріщиною посередині, продають як «характер». Тримається. Переважно.'
    fracture_loop_rift: 'У кільці є тріщина, яку майже не видно. Ти абсолютно точно думатимеш про неї постійно.'
    fracture_loop_void: 'Оздоблене каменем, який ним не є. Дивитися прямо на порожню оправу вдруге не радять.'
    fracture_resin: 'Застигає швидше, ніж ти встигнеш вивільнитися. Спитай будь-якого учня — за прізвиськом.'
    fracture_sash: 'Обтріпаний з обох кінців так само, як тріпається шкіра Розривника на лінії линьки, і так само вперто тримає форму. Замінити його — чомусь відчувається як зрада.'
    fracture_scepter_of_long_collapse: 'Не так виграває бої, як відкладає їх, по одній стіні, що кришиться, за раз — тим самим терпінням, з яким Розривник переживає тунель, що обвалюється. Повільна магія. Надійна магія.'
    frost_grimoire: 'Її сторінки лишаються вологими, скільки б вогнищ ви не розпалили поруч. Читати її — все одно що тонути в знаннях, і відчуття це, вочевидь, автор, хоч би ким він був, вважав повчальним.'
    frost_recurve: 'Рекурсивний лук, насичений чистою льодовиковою есенцією з самих глибин. Стріли замерзають просто в польоті. Пальці стрільця зазнають тієї ж долі практично одразу.'
    frost_sabre: 'Вигнутий клинок, що тягне за собою паморозь. Кожен змах — це кінець стосунків.'
    frost_shard: 'Навіки замерзлий кристал, що витягує тепло з усього поруч. Залишається холодним, щоб тобі не довелося.'
    frost_shard_spear: 'Осколок льоду, закріплений на торії. Він ніколи не відтає, що робить його утримання досвідом, що гартує характер.'
    frost_shard_sword: ''
    frost_titan_cudgel: 'Те, чим крижаний титан чистить зуби. Те, що сплющить тебе одним ударом.'
    frost_totemic_club: 'Увінчаний замерзлим тотемним зображенням. Його різьблений вираз змінюється з погодою. І з твоєю удачею.'
    frostbound_band: 'Позначає годину без жодного звуку. Хтось і досі заводить його — за звичкою.'
    frostclaw_warhelm: 'Викуваний з хітину титанового кігтя та загартований у льодовиковому стоці. Холод йому байдужий. Тобі — ні.'
    frostfang_bow: 'Раз пущена — і кожен вовк на милі довкола озивається у відповідь.'
    frostfang_requiem: 'Наполовину меч, наполовину похоронний спів. Здогадайся, яку половину ти почуєш першою.'
    frostfur_hatchet: ''
    frostfur_tuft: 'Біле хутро мороз-вовка, назавжди холодне на дотик. Корисне для пальт. Нечемне щодо вовка.'
    frosthewn_axe: 'Витесана з льодовика, з лезом з адамантиту. Подається холодною. Завжди.'
    frosthowl_stilettos: 'Кинджали що свистять на холодi. Звук глибоко тривожний i для ворогiв i для союзникiв. Переважно для союзникiв.'
    frostkoa_cleaver: 'Викуваний у жовчі крижаної жаби, клинок стікає холодним потом, який відмовляється замерзати навіть тут, унизу. Він ніколи не просить співчуття. Але однаково його отримує.'
    frostkoa_eye_pendant: 'Око кліпає за власним розкладом. Ти вирішив про це не думати.'
    frostkoa_staff: 'Вирізаний із хребта, що видав останнє, вельми переконливе кумкання.'
    frostmaw_scale: 'Скинутий під час найдавнішої линьки Попелястої Вдови. Краї й досі ледь теплі.'
    frostshamble_girdle: 'Тримає штани і дещо значно менш живе, що волочиться позаду.'
    frostshamble_helm: 'Шепоче цілу ніч. Здебільшого критику. Жодної схвальної.'
    frostshamble_longsword: ''
    frostshamble_pendant: 'Бурмоче після темряви. Каже, чого хоче, лише коли вже запізно.'
    frostshamble_treads: 'Лишає сліди, що ще кілька кроків шаркають самі, коли ти вже стоїш.'
    frostshell_aegis: 'Шари замерзлого панцира краба поверх торієвої пластини. Морська біологія, озброєна.'
    frostshell_grimoire: 'Оправлений у замерзлий панцир краба. Спершу відрекомендується, а вже потім відморозить тобі пальці.'
    frostshell_pendant: 'Полірований уламок крижаного панцира на торієвому ланцюжку. Випромінює холод і легку травму.'
    frostshell_plate: 'Замерзлий панцир краба, який ніколи не відтає. Ковалі обробляють його в морозних горнах, увесь час нарікаючи.'
    frostshell_signet: 'Зроблений з уламка панцира мороз-клешні. Краб так і не підписав форму пожертви.'
    frostward_mace: ''
    frostweaver_wraps: 'Сплетені з хутра єті, підсилені уламками крижаного серця. Єті має що сказати з цього приводу.'
    frostwolf_fang_ring: 'Кусає у відповідь, коли намагаєшся зняти. Зграя образ не забуває.'
    frostwolf_hauberk: 'Тобі більше ніколи не буде холодно. І тебе більше ніколи не покличуть на південь.'
    frostwolf_leggings: "М'який, як лігво. Броньований, як облога. Зграя вміщає в собі багато чого."
    frostwolf_mitts: 'Твої руки завжди теплі. А кожен, хто тисне їх, пригадує, хто тут головний.'
    frostwolf_paws: 'Чіпляється за лід так, ніби той образив твою родину особисто. Все складно.'
    frostwolf_staff: ''
    frozen_striders: 'Шкіра, оброблена льодом, що нарешті облишила нерухомість. Рух — нарешті.'
    fungal_flatbread: 'Тонкий хліб з пастою слонової орхідеї. Кравці замочують його для водонепроникності тканин.'
    galerunner_crown: 'Достатньо аеродинамічний, щоб зекономити пів секунди на відступі.'
    gecko_chopper: 'За легендою, ним володів найвеличніший король гекон, якого Пандора насправді не мала.'
    gecko_saber: ''
    gecko_scale_leggings: 'Хвіст гекона відріс за тиждень. Ваша репутація, певно, потребуватиме значно більше часу.'
    gecko_tail_segment: 'Добровільно відкинутий геконом. Все ще звивається. Можете використати в алхімії або дивитися, як танцює. Ваш вибір.'
    gecko_venom_lance: "Рана — це найлегша частина, все закінчується за мить. А те, що лишає по собі отрута геккона, набагато довше не може пробачити вам, що ви взагалі з'явилися."
    gecko_venom_sac: 'Крихітний але потужний. Отрута не смертельна для людей, але зіпсує весь ваш тиждень. Аптекарі їх обожнюють.'
    genesis_blade: 'Викуваний, за словами прочан, які ще долають сходження, з того, яким світ був до розлому. Ніхто не в змозі це підтвердити.'
    genesis_greataxe_of_origin_line: 'Достатньо важка, щоб перший удар владнав більшість суперечок, а другий був радше для протоколу. Третій буває рідко.'
    genesis_hauberk: 'Сплетена з дроту, витягнутого перш ніж хтось додумався записати як. Техніка померла разом із ковалем; сорочка ж поки що ту втрату пережила.'
    genesis_loop: 'Відлита з першого сплаву, до якого світ колись охолов, якщо вірити Ревізорам, — а їм здебільшого вірять, коли вони згодні, що трапляється рідко.'
    genesis_mail: 'Сплетена з металу, який прочани присягаються старішим за розлам, хоча ковалі, що знали б напевно, не дожили, аби це підтвердити.'
    genesis_moss: 'Мох, що росте лише там, куди ще падає перше світло, і гине тієї ж миті, коли його затінюють. Збирачі працюють хутко й перепрошують ні перед ким конкретно.'
    genesis_suize: 'Первісний штам суайзу, старіший за саме вирощування. Він, імовірно, переживе тих, хто спробує його культивувати.'
    ghost_cap: 'Напівпрозорий гриб, що слабо світиться у темряві, ніби глузує з вас за години пошуків серед білого дня.'
    ghost_wafer: 'Зіскребли з погаслого могильного вогника. Лучники переробляють це на смолу для тятив.'
    ghostcap_alloy: 'Метал, засіяний спорами примарного капелюшка, що тримають його ледь світним, приємним в обробці й неможливим загубити на темному верстаку.'
    ghostcap_almanac_of_deep_canopy: 'Його сторінки — пресований примарний капелюшок, читабельні лише в темряві, де вони світяться, що робить глибокий Вельд єдиним місцем, де його справді можна прочитати.'
    ghostcap_carapace_of_drowned_weald: 'Усіяний грибами-примарними-капелюшками, що світяться далі, коли власник перестає рухатися, — погана риса в схованці й гірша в труні.'
    ghostcap_falchion_of_drowned_weald: 'Його лезо пронизане спорами примарного капелюшка, що світяться вздовж кожного розрізу, тож рана спалахує раніше, ніж приходить біль.'
    ghostcap_fists_of_deep_canopy_matron: 'Усіяні рідкіснішим капелюшком, що світиться лише в справжній темряві, а під глибоким наметом вона завжди, тож вони жодного разу не тьмяніють.'
    ghostcap_fists_of_deep_canopy_mire: "Грибні капелюшки на кістянках світяться яскравіше, чим сильніше б'єш, перетворюючи бійку на небажане світлове шоу."
    ghostcap_flail_of_drowned_weald: 'Його головка — затверділий примарний капелюшок, що спалахує на замаху, підказуючи цілі точну мить, коли здригнутися, і ніколи до кінця цього не дозволяючи.'
    ghostcap_philter_of_drowned_weald: "Слабко світиться годину після того, як його вип'єш, — достатньо, щоб знайти вихід із темряви, і рівно стільки, щоб щось знайшло тебе."
    ghostcap_warboots_of_drowned_weald_matron: 'Підбиті світними капелюшками, що видають власника в темряві, — що майстер вважав чесним обміном за те, щоб ніколи не заблукати.'
    ghostcap_warboots_of_drowned_weald_mire: 'Загерметизовані проти води, що ніколи до кінця з них не витікає, тож кожен крок опускається з тихеньким, приватним хлюпом, який чує лише власник.'
    gilded_brew_of_last_regent: 'Рецепт більше обговорювали, ніж варили, що виготовлювач наполегливо називає навмисним.'
    gilded_carapace_of_hollow_throne: 'Працює на чесному слові, що ніхто не може підтвердити, не розпочавши суперечку знову.'
    gilded_chopper_of_hollow_throne: 'Виконує свою роботу, а потім за це вибачається, тож інструкцію навмисно залишили розпливчастою.'
    gilded_circle_of_last_regent: 'Його надійність — предмет постійних дискусій, тож інструкцію навмисно залишили розпливчастою.'
    gilded_extract: 'Його визнали автентичним із невеликою перевагою, і другого пояснення так і не спростували остаточно.'
    gilded_locket_of_last_regent: 'Погоджується працювати лише під письмовим протестом, деталь, яку всі причетні домовилися забути.'
    gilded_philter_of_hollow_throne: 'Рецепт більше обговорювали, ніж варили, про що на етикетці зазначено дуже дрібним шрифтом.'
    gilded_stilettos_of_last_regent: 'Його завершили попри одностайне вагання, компроміс, який ніхто не готовий захищати повністю.'
    gilded_tassets_of_hollow_throne: 'Його історія походження змінюється залежно від того, хто розповідає, і різниця десь по дорозі перестала мати значення.'
    gildsteel: 'Його знайшли там, де за записами його бути не мало, тож обидва записи так і залишаються неузгодженими.'
    girthstone: 'Пошитий кравцем, який виміряв амбіції носія, а не його талію. Обидві виявилися більшими за очікуване.'
    glacial_basinet: "Шолом настільки холодний, що запотіває зсередини. Видимість — необов'язкова, виживання — обов'язкове."
    glacial_brand: 'Довгий меч загартований у льодовиковiй водi. Клинок покривається iнеєм мiж ударами, виглядає драматично i нiчого не вирiшує.'
    glacial_buckle: 'Пряжка — це уламок паморозі, який ніколи не тане. Зручно. Часом навіть тримає вагу.'
    glacial_cinch: 'Викуваний зі сплаву крижаного серця. Стягує міцно й ніколи не послаблюється. Спершу попроси ввічливо.'
    glacial_fortress_greaves: 'Рухатися в цьому — повноцінне тренування. Стояти на місці — теж повноцінне тренування.'
    glacial_grasp: 'Усе, чого торкаєшся, злегка замерзає. Твоя зброя — теж. Твоя дружба — також.'
    glacial_grips: 'Легкі рукавиці, wykuті для лучників і заклинателів Крайньої Півночі. Долоня підбита напівпрозорою мембраною, що покращує тактильну чутливість і одночасно ізолює від холоду. Руки залишаються точними навіть при смертельних температурах. Мембрана злегка фосфоресціює вночі — одні вважають це корисним, інші — тривожним.'
    glacial_heart: 'Замерзле серце в грудях єті, з холодом, якого досить, щоб заморозити озеро. Уже заморозило.'
    glacial_loop: 'Кільце з мерзлого кристала, що відновлюється при сколюванні. Колись тобі перестане бути холодно. Колись.'
    glacial_march_boots: 'Створені для вічного маршу крізь мерзлі пустки. Або для походу на роботу. Та сама енергія.'
    glacial_medallion: 'Медальйон із чистого крижаного кристала. Коштує статок. На дотик — як борг.'
    glacial_morningstar: ''
    glacial_pike: 'Наконечник із крижаного кристала. Тримає ворогів на відстані, яку вони самі не обирали.'
    glacial_recurve: 'Натягнутий замороженими жилами, які ніколи не слабшають — на відміну від твоєї хватки під час пострілу.'
    glacial_signet: 'Вирізьблений із серця-кристала льодовика. Знечулює палець, на якому сидить, — і майстер божиться, що це перевага.'
    glacial_verdict: 'Клинок сам виносить вирок у кожному бою: винен у тому, що підійшов надто близько.'
    glacial_visor: 'Запотіває в теплу погоду. Попередній власник вирішив це, просто не думаючи надто багато.'
    glacial_waistguard: 'Набитий шкірою, дубленою попелом. Тримає лінію краще, ніж блиск.'
    glasschant_daggers: 'Ті самі добрі ножиці. Тобі казали ніколи їх не чіпати. Ти ними ріжеш.'
    glassong_grips: 'Гума аж до ліктя. Тутешня вода в мийці розчиняє ложки, тож їх роблять товщими.'
    glasswrought_brew_of_molten_antiphon: 'Настоюється на плиті від світанку. Досить міцний, щоб із ним посперечатися.'
    glasswrought_carapace_of_black_choir: 'Пристібається пласким боком уперед. Складається пласко, а розкладається з вереском, від якого порожніє кімната.'
    glasswrought_claymore_of_black_choir: 'На удар видає чисту високу ноту. Ця нота стала для кількох останнім, що вони чули.'
    glasswrought_falchion_of_black_choir: 'Зубчастий — для шкоринок, що чинять опір. У цій парафії вони таки чинять.'
    glasswrought_fists_of_black_choir: 'Підбиті для пательні, якої ніколи не мили — з принципу і заради нагару.'
    glasswrought_focus_of_molten_antiphon: 'Пера фенікса, буцімто. Пил спалахує — що ж, це теж різновид ретельності.'
    glasswrought_philter_of_black_choir_pyre: 'Пече двічі: коли набираєш у рот, і ще раз — коли потім кажеш усе, що думаєш.'
    glasswrought_philter_of_black_choir_vitrified: 'Цілющі, за словами прибиральниці. Сірі, за словами всіх інших.'
    glasswrought_stilettos_of_molten_antipho: 'Два ножики для чищення, тонкі, як відмовки. Оббілують яблуко однією стрічкою або замок за один захід.'
    glasswrought_tassets_of_molten_antiphon: 'Підшита високо — від помиїв і щурів. Практичність ще ніколи не виглядала так похмуро.'
    gobadoc_eye: 'Налите кров ю око, вирване у Гоблінського Воєначальника. Досі нервово блукає, ніби шукає наступне, що з їсти.'
    gobeline_ring: 'Витончене за гоблінськими стандартами — лише три гострих краї та одна підозріла пляма. Дорогоцінний камінь — відполірований шматочок кольорового скла, яким гоблінський ювелір надзвичайно пишався. Вказати на це — тяжка образа в гоблінській культурі. А також смертний вирок.'
    goblin_cleaver: 'Вкрадено у гобліна, який наполягав, що це сімейна реліквія. Іржа каже інше.'
    goblin_ear: 'Відрізані слухові органи гобліна, досі слизькі від ікору та смердючі через сумнозвісну гігієну цих створінь.'
    goblin_grudge_axe: 'Кожен гоблін, що володів цією сокирою, зрештою використав її на іншому гобліні. Традиція є традиція.'
    goblin_gunpowder: 'Саморобна вибухова суміш. Гобліни вимірюють кількість за відчуттями. Рівень виживання відображає цю методологію.'
    goblin_knuckle_ring: 'Виковане з улюбленої кісточки гобліна — його власної. Кажуть, гоблін сприйняв втрату філософськи, поки не перестав. Підходить на будь-який палець, бо у гоблінів, схоже, кісточки універсального розміру. Еволюція — річ загадкова.'
    goblin_loot_bag: 'Маленький мішечок з мішковини, повний вкрадених дрібничок. Переважно ґудзики, курячий кістка і чийсь прикрий любовний лист.'
    goblin_masher: 'Гобліни не приправляють їжу, а знайомлять її з оцим. Техніка напрочуд добре переноситься на черепи.'
    goblin_raider_vest: "Зшитий щонайменше з чотирьох різних обладунків, жоден з яких не підходив і жоден не був здобутий законно. На грудях вицвілий знак 'Власність' з ім'ям, яке вишкрябано настільки агресивно, що залишилась діра."
    goblin_scimitar: 'Гобліни не кують мечів. Вони їх знаходять. Цей знайшли у чиїйсь грудній клітці.'
    goblin_stompers: 'Зшиті гоблінськими шевцями, які мали тверді переконання щодо комфорту ніг, але жодного навчання. Лівий чобіт трохи більший за правий. Чи було це навмисно — предмет лютих наукових дискусій.'
    goblin_sword: 'Зеленуватий відтінок — від міді, крові гобліна чи обох — філософі радять не запитувати.'
    goblin_tooth: 'Золотий ікло, вирваний з рота гоблінського офіцера. Золото справжнє. Стоматологія — ні.'
    goblin_tooth_belt: 'Кожен зуб належав тому, хто особисто розлютив гоблінського вождя. Список був довгим.'
    goblin_trinket_chain: 'Ланцюжок із крадених дрібничок, поцуплених монет і щонайменше одного зуба, що не належав гобліну. Гобліни називають це «високою модою». Решта — «речовим доказом».'
    goblin_wartop: "Шолом, що пройшов через більше гоблінських черепів, ніж особливо наполегливий головний біль. Кожен власник вирізав своє ім'я всередині, створивши багатошарову історію дедалі гіршого почерку. Вм'ятини додають характеру. Плями крові — контексту."
    godbone_saber: 'Виконує роботу, яку йому врешті доручили, і жодні документи цього не відображають.'
    godbone_shard: "Його точні властивості залежать від того, кого запитати, і справу тихо закрили — нерозв'язаною."
    godbone_torc: 'Його викували під час суперечки, яку ніхто не виграв, тож носій перестав про це питати.'
    godflesh_plate: "Гарантія анулюється тієї миті, коли ви це заперечите, а другий чернетковий варіант так і не з'явився."
    gods_maw_key: 'Відлитий із чогось, що колись було частиною бога, ще коли бог цим користувався. Паща не так вимагає його назад, як сприймає повернення за належне.'
    godspear_impaler: 'Викуваний, щоб тримати лінію на порозі, який жоден Вартовий Брами не мав тримати наодинці. Яким кінцем ти його тримаєш, важить менше, ніж те, з правильного ти боку брами чи ні.'
    godspine_staff: 'Його функцію визначили підкиданням монети, розрізнення без особливої різниці.'
    godstep_sandals: 'Робить рівно одну річ — і навіть це заперечує, що або заспокоює, або глибоко тривожить.'
    golden_fleece: 'Виблискує наче справжнє золото. Кожен суддя хоч раз намагався його вкусити для перевірки.'
    golden_fleece_amulet: 'Виросло на трикратному чемпіоні, якому жодного разу не довелось старатись.'
    golden_fleece_helm: 'Сплетений так щільно, що зупиняє стріли — і будь-який шанс на серйозне ставлення.'
    golden_fleece_legguards: 'Такі зручні, що двоє різних шукачів пригод задрімали в них просто в бою. Рекорд незламний.'
    golden_larvae: ''
    golden_mushroom: 'Золото бідака—таке ж марне, набагато важче знайти, і неможливо витратити в таверні.'
    golden_nightcap: ''
    golden_silk: 'Спрядений матроною, яка жила довше за більшість імперій. Кожна нитка коштує більше за весь ваш інвентар.'
    golden_silkling: 'Личинка, сплетена з дорогоцінної нитки, чия крихітна форма випромінює ту непохитну рішучість, що перетворює слабкі удари на нищівні атаки.'
    golden_wheat: ''
    grasploop: 'Останнє, за що трималися чимало скелелазів, перш ніж перестали потребувати за щось триматися.'
    grave_dust: 'Дрібний сірий порошок з кісток голлоу. Некроманти добре платять. Ваша репутація в місті, однак, не відновиться.'
    great_woolame: 'Цей довгий меч було витягнуто з блискучих решток останньої трапези вовнюка, його метал дивно збережений потужними шлунковими кислотами створіння. Ретельне очищення наполегливо рекомендується перед використанням.'
    greater_healing_potion: 'Зварена з екстракту нiчника та сумнiвних бiологiчних рiдин. Загоює рани достатньо швидко щоб хiрурги заздрили.'
    greater_stamina_tonic: 'Бурштинова, густа, заливає тебе амбіціями, на які твої ноги ще не готові.'
    green_bread: "Густий, тістоподібний і слабко світиться — цей хліб із грибів тіло живить, а дух випробовує. Деякі в'язні спеціально його просять, аби довести, що дійшли до дна."
    green_mushroom: 'Хворобливий гриб, чиє бліде зеленіння натякає, що він процвітає не на сонячному світлі.'
    green_mushroom_powder: 'Мішечок дрібно мелених спор, зібраних із зелених лісових грибів. Їхні токсичні властивості зосереджені в одній смертельній щепоті.'
    green_sap: 'Липкий, солодкий, і трохи розумний. Квібек не оцінив вилучення. Це фактично деревна кров.'
    green_stew: 'Ця емульсія лісового зросту та відчаю відновлює життєву силу тих, хто достатньо відчайдушний, щоб ігнорувати її схожість з жовчю гобліна.'
    grimoire_of_embers: "Кожне закляття обпалює сторінку, вирвану з линялого шкіро-пергаменту Тіні Жару. Дочитай книгу — і завчиш норов Тіні напам'ять разом із заклинаннями."
    grimoire_of_tides: 'Сторінки завжди вологі. Читати його — наче тонути, і автор вважав це перевагою, а не хибою.'
    grimoire_of_warding: ''
    grimreminder: 'Видається новим прочанам як урок того, що Шрам робить із запалом. Більшість зберігає її ще довго після засвоєння уроку.'
    grips_of_the_deathless: 'Кожне пророцтво потребує руки, досить твердої, щоб вказати на лихий кінець не тремтячи. Це були рукавиці тієї руки. Пророк зник. Твердість лишилася.'
    groundpounder_boots: 'Кожен крок лишає слід завбільшки з тарілку. Про делікатність тут ніколи й не йшлося.'
    groundswing: 'При промаху йде аж у землю, що трапляється достатньо часто, аби муляри стіни вели цьому лік.'
    guardian_chain: 'Викуваний ланка за ланкою на взір того, що в Останнього Вартового, носиться тими, кого Вартовий особисто визнав гідними тримати останню стіну.'
    guardian_core: 'Щільний серце-метал, добутий з нагрудника полеглого Вартового, і лише з полеглого. Ніхто досі не збагнув, як попросити своє в Вартового, що ще стоїть.'
    guardian_gauntlets: 'Відлиті під власний хват Останнього Вартового, єдина відома пара, яку саме зараз не носять на стіні. Усі припускають, що на те є причина.'
    guardian_waistplate: 'Захищає все між грудьми та ногами. Також відоме як «все важливе».'
    guardians_verdict: 'Здіймається Останнім Вартовим у ті рідкісні миті, коли слів замало. Кожен, хто бачив його замах, погоджується: слів однаково не вистачило б.'
    hadean_ice: 'Лід з часів до існування сонця. Не тане. Йому байдуже. Він пережив галактики. Ви — незручність.'
    hadean_ichor: "Кров самої порожнечі. Кожен, хто торкнеться без захисних чарів, забуває власне ім'я. Тимчасово."
    hades_breath_weapon: 'Проводить те, що видихає брама внизу між відкриттями. І пахне цим теж — про що зачарувальнику справді варто було попередити перед приміркою.'
    hades_heart: "Вирване з Кісткового Лорда лише з третьої спроби. Досі б'ється в ритмі, що не пасує жодному маршу."
    hades_key: 'Виточений із зуба, вирваного в чогось, що стерегло цю браму до того, як Вартові Брами перейняли зміну. Тримати його — і кутні зуби ниють у співчутті. Чому — досі ніхто не пояснив.'
    halfturn: 'Занадто важка, щоб замахнутися двічі за час, коли більшість зброї встигає тричі. Зазвичай значення має лише перший удар.'
    halo_draught: 'Інструкція з дозування суперечить сама собі на середині етикетки, що виготовлювач наполегливо називає навмисним.'
    halo_splitter: 'Функціонує лише завдяки формальності, що технічно правда і абсолютно некорисно.'
    halo_striders: 'Ці чоботи оспорюють концепцію ходіння. Вони вважають, що рух — це питання філософської думки, а не фізичного факту.'
    haloforged_brew_of_last_regent: 'Його варили, щоб покласти край суперечці, — не вийшло, тож результати можуть значно відрізнятися.'
    haloforged_carapace_of_last_regent: 'Дизайн пройшов через кілька непримиренних чернеток, тож первісну скаргу так і не відкликали офіційно.'
    haloforged_circle_of_last_regent: 'Працює на чесному слові, що творець називає характером.'
    haloforged_crest_of_last_regent: 'Його творець відмовився щось пояснювати далі, компроміс, який ніхто не готовий захищати повністю.'
    haloforged_fists_of_hollow_throne: 'Ніхто не підтвердив, що воно робить те, що заявлено, про що носій вирішив більше не думати.'
    haloforged_fists_of_last_regent: 'Комітет із дизайну насправді так і не дійшов згоди щодо цього, тож питання наразі залишається невирішеним.'
    haloforged_philter_of_hollow_throne: 'Той, хто це розлив, так і не визначився з остаточною версією, і виготовлювач досі відмовляється визначитися.'
    haloforged_resin: 'Його визнали автентичним із невеликою перевагою, що змінюється залежно від пори року й того, хто питає.'
    haloglass: 'Його чистоту оцінюють за рухомою, договірною шкалою, комітетом, який відтоді розпустили.'
    hardening_compound: 'Наноситься на метал під час кування, щоб той не передумав ставати мечем.'
    hauler_harness: 'Більше кишень, ніж обладунків. Пріоритети.'
    healing_potion: 'Стандартний бойовий вiдновлювач. Слабко свiтиться, лiкує прийнятно, смердить гiрше за рану.'
    heartmender_torc: 'Гуде низьким тоном, коли хтось поруч помирає. Дуже популярний на вечірках.'
    heartstring: 'Постійно ледь тягне до Шраму — так, як компас тягне на північ. Дехто з носіїв перестає опиратися.'
    heartwood_core: 'Найглибше кільце дерева, що виросло крізь поле бою. Рахує більше, ніж просто роки.'
    heartwood_spear: 'Насаджений на скалку самого серця світового дерева, яке відросло за тиждень. Дереву, здається, не шкода позичати шматки самого себе.'
    heartwood_summoner_club: 'Витесаний із вельдської серцевини, що досі відгукується, коли по ній постукати, мовою, якої ніхто не переклав. А от Мохові Ведмеді, схоже, чудово її розуміють.'
    heavy_leather_vest: 'Феран, якому належало це хутро, був, за всіма свідченнями, найлінивішим серед і так лінивого виду.'
    hemmed_leggings: 'Принаймнi пiдгин рiвний. Все iнше ще в роботi.'
    hermit_pilgrim_trousers: 'Заплямовані безнадійно вже на четвертому тижні. Нових ніхто не видає.'
    hermit_sage_cowl: 'Носили під час довгих змін. Запах ніколи не змивається до кінця.'
    hermit_sash: 'Позначений зарубками за кожен переданий ящик. Відтоді ніхто не перераховував.'
    hermitude_bow: 'Лук, призначений для полювання поодинці в густому лісі протягом тижнів. Конструкція надає перевагу точності над силою — у самітника немає команди, щоб тягти масивну здобич. Одна стріла, одна тварина, один прийом їжі. Філософія простіша за більшість книг з полювання.'
    highguard: 'Тримали над головою вартові стіни так довго, що постава отримала власну назву трьома мовами, і жодна не лестива.'
    himalayan_flour: 'Вершина мукомельства, борошно судить пекарів.'
    hive_ring: 'Вирізане з маточного молочка, загартованого отрутою, воно незадоволено дзижчить через рішення, яких носій ще навіть не ухвалив. Врешті перестаєш питати, звідки воно знає. У кожній родині є такий родич.'
    hive_warden_mace: "Обмащений до самого держака воском, витисненим самою Матір'ю Стільників. Кожен скарак у глибоких штольнях шанобливо обходить носія десятою дорогою — принаймні розумні; про дурних переказ ніколи не згадує двічі."
    hive_wax: 'Бурштинова й водостійка, зібрана з бджолиних камер, які скараки покинули посеред сварки.'
    hive_wax_girdle: "Виліплений із бджолиного воску й алхімічного полум'я, він пам'ятає форму останнього власника з тривожною точністю. Ніхто в селі не скаже, куди та людина поділася. Дехто дуже швидко міняє тему."
    hiveguard_mace: 'Запечатаний і від вогню, і від повені — так, як у старих переказах завжди буває з улюбленцями Матері Стільників. Скараки схвалюють його з тим самим неохочим виглядом, з яким стара тітка схвалює весілля, яке влаштовувала не вона.'
    hivewax_belt: 'Хітин скараків, що загинули так само, як жили — плече до плеча, десять тисяч разом, до останнього переконані, що рій береже їх.'
    hollow_ichor: 'Здобута з найдавніших порожнин драговини. Бальзамувальники розводять її перед вжитком; чому — ніхто не каже.'
    hollow_judge_mace: 'Обгорнута в поховальний шовк, з зарубками старих вироків. Милосердя не знала ніколи.'
    hollow_knuckles: "Підбиті шовком поверх старої пластини. Б'ють сильніше, ніж здається з вигляду."
    hollow_legguards: 'Взято з кургану, вже пограбованого раз. Другого разу теж нічого не лишилося.'
    hollow_mace: 'Витесана зі стегнової кістки, що пережила власника — і аж ніяк цього не приховує.'
    hollow_reckoning_blade: ''
    hollow_root_key: 'Ніколи не зрізаний, лише вирощений з кореня, який Тиран Коренепаща безнастанно вгризає назад у пітьму.'
    hollow_shiv: 'Парні леза, обмотані поховальним шовком. Мерці, як виявляється, мають напрочуд добрий смак на руків’я.'
    hollow_signet: 'Тисне порожню печатку у воску. Ця порожнеча — і є суть.'
    hollow_tome: 'Половина імен викреслена. Книга однаково продовжує їх записувати.'
    hollowcrown_draught: 'На етикетці вказано інгредієнт, який ніхто не може впізнати, про що на етикетці зазначено дуже дрібним шрифтом.'
    holy_bible: 'Божественне писання, здатне очистити совість – за умови, що у вас ще є совість, яку можна очистити.'
    hornhead_hatchet: 'Викована навколо зламаного рогу. Рогач хоче повернути але не має великих пальцiв.'
    hornhead_horn: 'Спіральний ріг барана, ще теплий. Попередній власник вдарив головою в дерево і програв.'
    hunting_javelin: 'Мисливський дротик, призначений для максимальної дальності при мінімальній підготовці. Наконечник зазублений, щоб залишатися в здобичі після удару. Його видалення вимагає або терпіння, або відмови від здобичі. Більшість мисливців обирають терпіння. У здобичі такого вибору немає.'
    hush_moth_wing: 'Пилок з крил метелика, що літає, жодного разу не побажавши видати бодай звук. Алхіміки цінують його саме за це. Сам метелик так і не пояснив чому.'
    hymn_ember: 'Тепло, яке камінь тримає після того, як вогонь пішов далі. Закорковане, поки корок ще тримався.'
    hymn_of_endings: 'Функціонує задовільно — за власним визнанням, і творець здебільшого це підтверджує.'
    hymnbound_core: 'Вощений брикет розпалу з особистого запасу паламаря. Займається з першого разу, що тут вважається дивом.'
    hymnbound_cuirass: 'Носиться поверх усього, не зобов язується ні до чого. Кишені такі глибокі, що в них губиться кадило.'
    hymnbound_gauntlets_of_ashen_song: 'Для грядок вогняних лілей за апсидою. Колючки печуть; рукавиці з цим не згодні.'
    hymnbound_girdle_choir: 'Затягує тебе в поставу хору: груди вперед, підборіддя вгору — легка ціль для будь-кого знизу.'
    hymnbound_girdle_pyre: 'Тьмяно жевріє червоним уздовж пряжки. Це або застереження, або модна заява — і ніколи не прояснюється.'
    hymnbound_hatchet_of_ashen_song: 'Легка в руці, важка в наслідках. Лишає дрібний сірий пил, що лізе в усе.'
    hymnbound_helm: 'На смерканні тихо дзвенить, хоч дзвона й немає. Коваль перестав відповідати на питання про це.'
    hymnbound_ingot: 'Суцільне залізо, нагріте на плиті, кероване образою. Складки й незгода здаються однаково.'
    hymnbound_sabatons_of_cooling_vent: 'Відводять жар землі через п’яту. Ноги в теплі, сліди обвуглені, скарг поки нема.'
    incandescent_lance: "Пломеніє жаром, що не згасає, і руків'ям, яке явно не розраховане на це."
    infernal_cleaver: 'Палає люттю тисячі атестацій. Іронічно — для крижаного світу. Поки що ніхто не скаржився.'
    inferno_clutch: 'Шкіра не вистигає з часів вогняних ям. Біля тепла хватка стискається сама.'
    inferno_pendant: 'Камінь у його серці не вистигав відтоді, як уперше запалали вогнища.'
    inferno_shard: 'Сплавлені рештки з печі, вигребені з колосників. Піч зберігає свої квитанції.'
    infested_legguards: 'Ці нагінники вирують колоніями паразитичних наростів, хітинова сітка давно зросталася з залізом під ними.'
    infested_ring: 'Обідок з порожнистого хітину, в жолобках якого кишать безіменні створіння, що повзають і кусають.'
    infested_sash: "Пульсуючі вени пронизують заражену тканину, ніби одяг досі живий і перетравлює. Носити його — означає мати інтимний зв'язок із хворобою."
    infinity_amber: ''
    infinity_arcanite: 'Випромінює достатньо залишкового заряду, щоб вартовий вогонь горів крізь будь-яку бурю.'
    infinity_bloodstone: ''
    infinity_cursed_gem: ''
    infinity_diamond: ''
    infinity_draconite: ''
    infinity_duskite: ''
    infinity_jade: ''
    infinity_moonstone: ''
    infinity_obsidianite: ''
    infinity_quartz: ''
    iron_battleaxe: 'Викувана з уламкiв тiньового лицаря. Темрява несуча. Вага формує характер.'
    iron_battlecleaver: "Легенда зве її сокирою, що скінчила епоху. Історія ж пам'ятає здебільшого паркан."
    iron_battleplate: 'Лицарі тіні кують броню лише під час затемнень — цього далеко не досить для попиту.'
    iron_bludgeon: 'Лита залізна дубина — не справді розроблена зброя, а скоріше шматок металу з тим кінцем, за який можна вхопитися. Ефективна саме тому, що не є вишуканою. Зброярі продають її злегка почервонівши. Покупці купують її без сорому, бо результати не залишають сумнівів.'
    iron_flanged_mace: 'Кожен удар ледь тхне хлівом. Ніхто не пояснив чому. Ніхто й не хоче.'
    iron_gauntlets: 'Стандартні рукавиці тіньового лицаря. Відбитки попереднього власника досі видно на металі, застиглі у виразі «о ні, тільки не знову».'
    iron_kneeguards: "Зняті з тіньового лицаря, що вклонився не тому вівтарю. Наколінники вціліли. Кар'єра лицаря в організованій темряві — ні."
    iron_legplates: 'Кістково-біле залізо з невмирущих кузень унизу, де ковалі під час роботи не промовляють жодного слова. Мирно — доки не пригадаєш точно, чому вони замовкли.'
    iron_pounder: ''
    iron_sickle: 'Вигнуте лезо що зрiзує трави з хiрургiчною точнiстю. Попереднiй власник не був хiрургом що пояснює кров.'
    iron_war_spear: 'З наконечником зі стародавнього уламка мозку, що відмовляється висихати повністю. Те, що віддало життя заради цього списа, не перестало робити свій внесок — звіть це відданістю або незавершеною угодою.'
    iron_warhelm: 'Коваль, що кував цей шолом, працював виключно при місячному світлі, стверджуючи, що тіні нашіптували йому дизайн. Тіні також нашептали ціну. Вона не була розумною.'
    ironbark_treads: 'Кора дерева, що побачило сокиру й пішло першим. Кроки лунають ледь чутною згодою.'
    ironbound_bread: 'У скруті годиться за щит. У відгуках пишуть «домашній стиль». Відгуки поблажливі.'
    ironbrow_casque: 'Виглядаєш грізно. Шия болить. Компроміси.'
    ironbuckle_girdle: 'Сама пряжка важить більше за більшість поясів. Це — головна перевага.'
    irongrip_signet: 'Трохи стискається, коли злишся. Послаблюється, коли заспокоюєшся. Переважно стиснуте.'
    ironhide_girdle: 'Досить товстий, щоб відхилити клинок, досить твердий, щоб стати навколішки було рішенням, а не рефлексом.'
    ironjaw: 'Створена, щоб зуби носія лишалися там, де він почав бій. Скромна амбіція, що рідко справджується на цій висоті.'
    ironloaf_slab: 'Радше будматеріал, ніж хліб. Зброярі мелють його на заповнювач і більше не озираються.'
    ivory_orchid_paste: 'Паста настільки гладка, що могла б вести мирні переговори, якби мирні угоди пахли печерними грибами та жалем.'
    ivory_shrooms: 'Кремові гриби, що здаються майже світляними на тлі темного ґрунту, з якого вони проростають. Доказ того, що навіть у найтемніших місцях існує краса—зазвичай безпосередньо перед тим, як вбити тебе.'
    iyashi_living_branch: 'Дерево, з якого вона походить, загинуло століття тому. Гілці про це не повідомили. Вона й досі бруньчиться щовесни.'
    jade: 'Достатньо зелений щоб смарагд позаздрив але якимось чином дешевший за обiд у таверн.'
    jade_hoe: 'Знаряддя настiльки гарне що фермери вагаються ним працювати. Потiм голод перемагає як завжди.'
    jade_pickaxe: 'Використовує нефрит щоб добувати нефрит. Фiлософськi наслiдки губляться для бiльшостi шахтарiв що надто зайнятi збагаченням.'
    jade_powder: 'Тонкий зелений порошок що забруднює все до чого торкається включно з вашою репутацiєю чистого шахтаря.'
    journeyman_saber: 'Достатньо щоб вбити гоблiна якщо вiн стоїть i погоджується бути заколотим. Прогрес!'
    key_aragog: 'Покрита шовком та залишками отрути, ця оздоблена ключа пульсує в такт серцебиттю найжахливішої колонії Забороненого Лісу.'
    kiln_potholder: 'Стьобаний квадрат, що не боїться жодної печі. Неси будь-що з кухні, окрім мелодії, голки та чутливості в пучках пальців.'
    kindling: "Вирізьблений із дерева, яке рана так і не спалила дощенту. Воно досі пам'ятає форму вогню."
    kneebreakers: 'Посилені у суглобі, де відмовили три попередні пари. Носій ходить нормально. Усім іншим це здається підозрілим.'
    knucklebone: 'Відлитий за суглобами форми, про яку ніхто не вів записів. Сидить, наче зроблений для руки трохи більшої за вашу.'
    knucklevow: "Викарбувана обіцянка, яку жоден живий вже не прочитає. Метал пам'ятає її краще за будь-якого перекладача."
    koa_eye: 'Опуклий, не моргає, і якось все ще вас засуджує. Реагент для зілля зору. Побічні ефекти можуть включати параноїю.'
    koa_eye_ring: 'Оздоблений відполірованим оком коа, що, як не тривожно, наче й досі щось шукає.'
    koa_eye_signet: 'У Коа приблизно однаковий вираз обличчя, коли вони щасливі, злі або перетворюються на прикраси. Око в цій каблучці досі інколи моргає, хоча ніхто не впевнений, чи це навмисне.'
    koa_slime: "В'язкий жаб'ячий слиз. Ковзає з контейнерів, покриває все інше. Алхіміки обожнюють. Всі інші ненавидять вас."
    koa_slime_brigandine: 'Шкіряні пластини, покриті слизом Коа, який твердне у напрочуд стійке покриття. Коа виробляв цей слиз як реакцію на стрес, тобто ця броня буквально зроблена з тривоги. Під дощем вона досі блищить, надаючи вам вигляд надзвичайно зволоженого воїна.'
    koa_slime_codex: 'Сторiнки злиплися слизом коа. Читання потребує вмiння та мiцного шлунку.'
    koa_slime_rod: 'Палиця покрита затвердiлим слизом коа. Спрямовує магiю або принаймнi вдає.'
    koa_tongue: "Метр хапального м'яза. Розтягується, клацає, і іноді ловить щось окрім мух."
    koagulant_longbow: 'Тятива виділяє тонкий слиз. Ніхто не знає чому. Ніхто й не хоче знати.'
    koagulant_wand: 'Пульсує липкою енергією, гоячи рани, вкриваючи їх чимось, що краще зайвий раз не роздивлятися.'
    kraken_depth_staff: 'Кажуть, він каналізує найглибші океанські западини. Носії відчувають, що за ними стежать. Так і є.'
    kraken_ink: 'Здобуте з найглибших залоз Кракена. Пише пророцтва. А ще звичайні списки покупок. Перебірливістю не страждає.'
    kraken_key: "Роз'їдений сіллю й черепашками. Мотив щупальця на руків'ї — зовсім не тонкий натяк."
    kraken_tide_boots: 'Чіпляється за будь-яку поверхню, суху чи мокру. Підошви кракенового походження читають приплив раніше за тебе.'
    kweebec_leaf_charm: "Живий листок, що відмовляється в'янути. Друїди використовують як фокусний предмет. Листок мовчки засуджує ваш характер."
    kweebec_vine_sash: "Зв'язана під час триденного співу квібеків, чиїх слів навіть самі квібеки до кінця не пам'ятають."
    lantern_shard_ring: 'Уламок привидного ліхтаря, що досі тьмяно світиться. Нашіптує час доби, що було б корисно, якби він не помилявся постійно і не реагував на виправлення пасивно-агресивно.'
    larvano: 'Пульсує, наче крихітне серцебиття. Вулик скараків, звідки воно взялося, і досі рахує втрати.'
    last_guardian_aegis: "Носиться Останнім Вартовим ще відтоді, як Шрам не мав імені, вм'ята в місцях, які відтоді ніщо не змогло вм'яти вдруге. Вона жодного разу не стала причиною падіння стіни."
    lastbreath: 'Пошитий на того, хто вдягне його останнім. Зброяр ніколи не пояснює, що це означає, і вдруге ніхто не питав.'
    lastmile: 'Названі на честь відрізка, який кожен прочанин присягається коротшим за попередній. Ніколи ним не є.'
    lastwhisper: 'Несе закляття таке давнє, що склади вже стерлися. Хай що воно казало спочатку — досі діє.'
    lava_chitin: 'Панцир магмокігтя, від природи вогнетривкий. Ледь чутно пахне програною суперечкою.'
    leather_heavy_boots: 'Три шари шкіри тускера. Ваші ноги переживуть коліна з чималим запасом.'
    leather_treatment: 'Хiмiчна ванна що перетворює сирi шкури на гнучку ремiсничу шкiру. Дубильники не працюють без постiйних поставок.'
    legguards_of_the_primordial: 'Виготовлені зі шкіри, яку скидає Попелястий Пророк, коли видіння затягується. Хода власника сповільнюється до пророчого темпу: виважена, неквапна — і завжди прибуває рівно тоді, коли й погані новини.'
    legweight: "Важчі за статут — за теорією, що нога, надто втомлена бігти, лишається на місці й б'ється."
    leviathan_tentacles: 'Задубілі після того, як їх відірвали від чогось, що Кракен зве родиною. Досі сіпаються. Іноді.'
    lightless_striders: 'Підошви такі чорні, що зникають у темряві пущі. На третій день носій перестає бачити, куди ступає. На четвертий це вже не має значення.'
    liquid_koa: 'Слиз, який ніколи не навчився тримати форму й змирився з цим. Майже.'
    litany_of_cinders: 'Нескінченний сувій хатньої роботи. Прочитаний уголос, він змушує пил перекладатися самотужки — від чистого сорому.'
    living_spark: 'Іскра, що відмовляється вмирати. Постійно спалахує у кишені. Вогняні маги використовують як запальничку. Небезпечно.'
    living_spark_greataxe: 'Лезо досі потріскує від того, що востаннє розрубало, і ніхто до кінця не певен, що то було. Звіти подано й запечатано. Точно відомо одне: сокира сама обирає цілі. Той, хто тримає держак, здебільшого просто їде за компанію.'
    longdraw: "Потрібен повний вдих, щоб натягнути, і повний вдих, щоб пошкодувати. Обидва необов'язкові, якщо ціль достатньо швидка."
    longreach: 'Розширює досяг носія за межі того, що більшість супротивників вважає чесним. Чесність ніколи не входила в задум.'
    lorito_helmet: 'A full parrot pulled over the ears. The sprout on top is load-bearing, emotionally.'
    lumber_cleaver: 'Розроблена для деревини. Використовується для всього іншого. На лезі досі є сліди смоли — що або заспокоює (свідчення невинного використання), або турбує, залежно від того, що смола покривала раніше. Лісоруби, які несли її в бій, здебільшого виживали. Деревина — значно рідше.'
    lure_light_pendant: 'Містить скалку полоненого принадного світла, що пульсує власним ритмом, байдуже до того, хто його носить. Справжні принади Вельду почали підбиратися ближче до власника. Це не вважають добрим знаком.'
    magmooligan_charm: 'Амулет з вулканічної вовни, що випромінює лагідне тепло і ледь пахне сіркою та зрадою. Магмуліган, з якого його зроблено, мирно пасся біля потоку лави, коли нагода постукала. Ну, коли ви вдарили.'
    magmooligan_hauberk: 'Повстяна вулканічна вовна поверх старих бронзових кілець, досить тепла для хуртовин і нестерпна будь-де інде. Холодними ночами щось у плетиві досі мекає, ледь чутно. Клятва зброяра, що звір був цілком мертвий заздалегідь, з кожним переказом звучить дедалі менш переконливо.'
    magmooligan_waraxe: 'Магмуліганчики маленькі, злі й весь час підпалюють щось без жодної причини, яку прийняла б розсудлива істота. Ця сокира — те, що лишилося, коли коваль нарешті одного впіймав. Вогонь так і не заспокоївся.'
    magmooligan_wool: 'Вогнетривка вовна, що ще тліє. Ткачі повідомляють про легкі опіки та екзистенційні питання щодо займистих тканин.'
    magmooligan_wool_ring: 'Звалялося з вулканічної вовни. Гріє палець — утіха дивніша, ніж здається.'
    malt_bread: 'Підозріло солодкий хліб що міг забродити у сумці. Так чи інакше мораль зросла.'
    malt_flour: 'Борошно із солодовим присмаком, від якого хліб нагадує пиво.'
    marchworn: 'Уже розношений тим, хто не вижив, щоб носити далі. Пошитий з запасом — із професійної ввічливості.'
    marginalia: 'Основний текст нічим не примітний. Усе варте уваги нашкрябане на полях кимось, хто явно був незгодний із написаним.'
    marrow_cinch: 'Вирізаний із хребта, що колись стояв рівно й весь цей час мав тверду думку. Він сам затягується щоразу, коли пропускаєш їжу, судячи ваші звички з того, що лишилося від потойбіччя.'
    marrow_knuckles: 'Рукавиці, вирізані з кісток чогось, що померло давно і ще не зовсім з цим змирилося. Холодні влітку, холодніші взимку, крижані коли поруч нежить. Жахлива система раннього попередження — коли пальці німіють, воно вже дихає вам у потилицю. Образно. Мертві не дихають.'
    marrow_ring: "Некроманти обожнюють їх за 'свіжовикопаний' вигляд без клопоту з риттям."
    matriarch_tusk: "Вирване з Попелоспинного Великоікла після бою, про який табун досі згадує. Земля пам'ятає, як її вдарили так сильно; відтоді вона нікому не пробачила."
    matron_chitin: 'Пластина екзоскелету білої вдови. Темніша за обсидіан і вдвічі твердіша. Зброярі плачуть від радості.'
    matron_chitin_gauntlets: 'Вкриті панциром Попелястої Вдови. Досі ледь теплі від її нори.'
    matron_silk_slippers: "Спрядені з шовку, який Матрона Глибин губить на найглибших ловах, достатньо м'які, щоб перетнути дно Вельду без жодного звуку. Тиша тут, унизу, — це все, що важить."
    maw_cleaver: 'Той, хто це створив, передумав на півдорозі, що творець називає характером.'
    maw_crusher_fists: 'Його поведінка суперечить власному опису, що є або дефектом конструкції, або взагалі суттю задуму.'
    maw_tooth_ring: 'Каблучка, що рішуче заперечує власне існування під час носіння. Вона одночасно абсолютно впевнена й повністю сумнівна.'
    maw_visage: 'Шолом, що наполягає на тому, щоб мати рацію, навіть коли факти свідчать про протилежне. Він займає принципові позиції щодо нічого особливого.'
    mender_cuisses: 'Набита цілющим зіллям. Стань на коліно, дихай, і хай папери — перепрошую, зілля — зроблять решту.'
    militia_breastplate: 'Стандартний для сiльських вартових що не можуть дозволити справжнiй обладунок. Вiдбиває стрiли якщо вiрити.'
    millstone: 'Сільські жорна мололи пшеницю шість поколінь поспіль, доки комусь не спало на думку ним замахнутися. Працює. Мельника ніхто не питав.'
    mineral_biscuit: 'Печиво збагачене діамантовим пилом. Технічно їстівне, практично жорно для корінних зубів.'
    minor_healing_brew: 'Тепла зелена рiдина що лiкує подряпини та побите его. Смак жалю з нотками моху.'
    mire_bloom: 'Бліда квітка, що розкривається лише в цілковитій темряві й стуляється від першого натяку на світло, тож збирати її — це намацувати наосліп і сподіватися.'
    mire_heart: "Справжнє серце болотного жаху. Все ще б'ється. Дуже повільно. Зберігайте у запечатаній ємності, якщо не хочете кошмарів."
    mire_judge_mace: 'Названий за те, як він залагоджує суперечки в глибинах Вельду, тобто назавжди. Похмурий Дудар склав про нього пісню; слухати її ніхто не любить.'
    mire_waders: 'Штатне взуття для всіх, кого ставлять за очеретяну межу. Сухі ноги в угоду не входять.'
    mirefang_kris: 'Хвилясте лезо, наче ікло Багнового Плазуна, — і, чесно кажучи, саме з нього й відлите. Входить легше, ніж мало б.'
    mirefang_loop: 'Зігнута з єдиного вигнутого ікла, достатньо мала, щоб забути, що носиш її, доки щось у Вельді не відреагує на неї першим.'
    mireglass_infusion: 'Мулисте скло, переплавлене й застигле наново з домішкою чогось живого, що, як присягаються майстри, покращує гарт, і ніколи не уточнюють чий.'
    mireweald_brew_of_deep_canopy: 'Зелений, густий і ледь рухливий, — що варильник присягається лише осадом, який осідає, і волів би, щоб ти не придивлявся надто пильно.'
    mireweald_carapace_of_drowned_weald: 'Виріс навколо свого власника за цілий сезон, тож сидить бездоганно й знімається, коли треба, так, як кора сходить із дерева.'
    mireweald_crest_of_deep_canopy: 'Замаскований для шару, де намет крон затуляє ту дещицю світла, що сягає так глибоко, тобто для того, щоб ховатися, — а Вельд це винагороджує.'
    mireweald_lattice: 'Каркас із живого кристала, що продовжує рости й після збору, повільно, у той бік, куди його повернув останній, хто брав до рук, — з упертості чи звички.'
    mireweald_tassets_of_deep_canopy: "Живі пластини, що фотосинтезують ту дещицю світла, яка їх сягає, тобто нічого, тож натомість повільно з'їдають власника. Повільно."
    mireweave_grips: 'Виткані з багнового шовку, який Спорохребетні прядуть між кореневими системами, досить липкого, щоб покращити хват, і досить бридкого, щоб ніхто не питав, як його збирають.'
    mirrormelt_essence: "Здобута з єдиної ділянки Миррормере, що ніколи не замерзає повністю. Пам'ятає все, що в ній розтануло."
    mithril_axe: 'Ведмежi кiгтi для хватки, хiтин магмакiгтя для леза. Колоду, черепи i фiлософськi аргументи з вулканiчним ентузiазмом.'
    mithril_battleaxe: 'Викувана в лаві, що так і не охолола до кінця. Голова злегка вібрує при температурах, що плавлять звичайні метали, що створює творчі проблеми зі зберіганням. Ковалі, що її виготовляли, працювали в коротких змінах. Довгі зміни не були варіантом. Скарги теж.'
    mithril_cinder_striders: 'Вдосконалена пара. Чомусь тепліша, чомусь гучніша, і досі якось стежить.'
    mithril_club: 'Заклепки з ведмежих кiгтiв, обмотка з вепрячої шкури, пiдкладка з золотого руна. Легший нiж виглядає, важчий нiж хотiлося б. Дуже переконливий.'
    mithril_longbow: "Зроблений із власного хвостового пір'я штормового яструба, натягнутого на мітриловий дріт. Усю славу забирає собі лучник. Вітер, якби вмів говорити, мав би що виправити."
    mithril_mace: ''
    mithril_sword: 'Підбитий золотим руном і настільки легкий, що ледь відчувається в руці — і саме в цьому проблема для кожного, хто стоїть по інший бік від нього.'
    mokan: 'A wide woven hat. Keeps the rain off and the questions away.'
    molten_verse_casque_of_glass_cathedral: 'У гребені береже кістку пальця святого, на удачу. Удача того святого добре задокументована.'
    molten_verse_charm_of_rising_hymn: 'Скляна намистина, що ніколи не остигає до кінця. Втішна в руці, доки не забудеш і не покладеш на пергамент.'
    molten_verse_hauberk_of_glass_cathedral_choir: 'Видається тому, хто шурує засклілі підлоги. Плями тут мають вислугу років.'
    molten_verse_hauberk_of_glass_cathedral_pyre: 'Викроєні з великих завіс нави. Міль забрала поділ; велич уціліла.'
    molten_verse_hauberk_of_rising_hymn: 'Гарячішає, що довше триває бій. Довгі бої закінчуються тим, що ти сяєш, а ворог зник.'
    molten_verse_sash_of_glass_cathedral: 'Прошита стрічкою з кольорового скла. Гарно, доки полиск не засліпить тебе самого.'
    molten_verse_scepter: 'Гасить свічки, ліхтарі та ентузіазм на відстані. Довгий держак — для люстр.'
    momaku: 'A spirit-mask banner draped down the back to frighten debtors and impress no one already dead.'
    moonclad_band_of_silt_throne: 'Кільце з панцира Місячного Пазура, що лишається прохолодним навіть у гарячковому теплі глибокого Вельду, за яке власник тримається більше, ніж визнає.'
    moonclad_breastplate_of_silt_throne: "Кажуть, його обшивка з Місячного Пазура ледь світиться ночами, коли з'являється місяць, — а так глибоко у Вельді це означає ніколи, тож твердження убезпечене від перевірки."
    moonclad_crusher_of_silt_throne: 'Облицьована блідим панциром, що показує білим кожну тріщину, яку завдає, ведучи охайний, світний підрахунок, який власник не може вимкнути.'
    moonclad_pike_of_brackish_deep: 'З вістрям із блідого місячного панцира, холодного аж до кінчика, — мала розрада тому, хто тримає дальній кінець у гарячково-теплій пітьмі.'
    moonclad_poultice_of_silt_throne: 'Загорнута в блідий панцир, що лишається холодним проти гарячки, — розрада, яку цінував утоплений двір і якої утопленому двору більше не треба.'
    moonclad_tonic_of_brackish_deep_matron: 'Розлитий під блідим панциром, що тримає його прохолодним, — найближче до осяяної місяцем води, що варять так глибоко внизу.'
    moonclad_tonic_of_brackish_deep_mire: 'Багнова основа розшаровується, якщо дати їй відстоятися, — варильник каже збовтувати й ніколи не каже, що таке нижній шар.'
    moonclad_torc_of_silt_throne: 'Шийне кільце з блідого панцира, яке двір носив, щоб ловити місячне світло крізь залу, тепер на тридцять метрів під мулом. Відтоді не впіймало жодного.'
    moonclad_treads_of_brackish_deep: 'Обшиті панциром Місячного Пазура, що лишається холодним під ногою, — це найближче до місячного світла, що власник відчує так глибоко внизу.'
    moonclad_visor_of_silt_throne: 'Обшите панциром Місячного Пазура, що ловить ту дещицю місячного світла, яка сягає так глибоко, тобто майже жодного, тож здебільшого просто нагадує, що колись був місяць.'
    moonclaw_shard: 'Уламок пазура Імператриці Місячного Пазура. Він світиться під місяцем. Чаклуни, що торкаються його, стверджують, ніби чують муркотіння.'
    moonfang_precision_band: 'Кільце, вирізане з кігтя альфи місячного ікла. Направляє удари у вразливі точки. Місячний ікол навчив власним прикладом.'
    moonfang_waistguard: 'Здобутий із хутра звіра, що полював при повному місяці і спав весь інший час. Шкіра досі несе щось нічне, що важко пояснити серед білого дня. Власники описують незвичайну ясність у темряві. Не зовсім нічний зір. Швидше відчуття, що темрява на їхньому боці.'
    moonlit_choker: 'Затягнутий туго до того, як могили відкриються на смерку. Послаблюють лиш по завершенні варти.'
    moonlit_claw: 'Слабко світиться під місячним сяйвом — залишок місяцеікла, що колись був легендою. Тепер це просто матеріал для крафту.'
    moonlit_recurve: ''
    moonrise_boots: "Звалялася з вовни, що досі пам'ятає, ніби жива, і часом намагається пастися."
    moonstone: 'Ледь свiтиться пiд зоряним свiтлом що абсолютно марно бо шахтарi працюють пiд землею.'
    moonstone_hoe: 'Оброблює грунт мiсячним резонансом. Пшениця росте на 12% швидше. Фермер старiє на 12% швидше. Чесна угода.'
    moonstone_pickaxe: 'Головка пульсує блiдим свiтлом. Шахтарi клянуться що вона сама знаходить жили. Кайло вiдмовляється коментувати.'
    moonstone_powder: 'Блищить у темрявi що робить його легким для знахiдки i неможливим для приховування вiд збирачiв податкiв.'
    moonstone_sickle: 'Слабо свiтиться пiд зоряним свiтлом. Травники кажуть це покращює врожай. Алхiмiки кажуть це плацебо. Обидва помиляються.'
    mules_burden: 'Більше кріплень, ніж у ящику виставкового хендлера. І важча за нього теж.'
    muleteer_march: 'Пройшла більше миль за обозом, ніж будь-який живий вояк. Жодного разу не втратила воза.'
    neckoath: 'Носили прочани, що присягнулися дістатися стіни або загинути. Більшість із них досі її носить.'
    nerak_key: 'Кістка, викарбувана рунами, що бурмочуть погрози мовами, якими вже ніхто живий не розмовляє. Мертві не надто люблять гостей. Їхні замки, виявляється, думають точнісінько так само.'
    nerak_marrow: 'Почорнілий мозок, добутий із власних стародавніх кісток Нерака, що досі ледь чутно гуде життям, якого не повинен мати. Алхіміки цінують його за силу. Усі інші уникають через шепіт, слів якого ще ніхто до кінця не розібрав.'
    nerak_marrow_bow: 'Натягнутий на сухожиллі, яке Нерак скинув століття тому й жодного разу не запитав, куди воно поділось. Натягни його — і тятива гуде тією ж низькою нотою, яку його двір досі співає під землею, хочете ви приєднатися чи ні.'
    nexus_blade: 'Викувано на греблі, де три дороги сходяться з мертвими. Досі гуде на смерку.'
    nightcap: 'Біолюмінесцентний гриб, що пульсує тривожним лазуровим сяйвом, натякаючи на походження з печер, де сонячне світло є радше чуткою, ніж спогадом. Алхіміки жадають його за снодійні властивості, хоча сам гриб залишається глибоко байдужим до їхніх залицянь.'
    nightcap_elixir_base: 'Основа кожного сумнівного зілля, звареного після півночі кимось, хто мав би вже лягти спати.'
    nightfang_daggers: "Парнi клинки що зникають у тiнi i з'являються в хребтах."
    nightfang_razors: ''
    novice_wand: 'Перший жезл, який отримує кожен учень мага. Навмисно неточний — щоб навчити зосередженості. Навмисно слабкий — щоб навчити смиренності. Навмисно незручний — щоб навчити терпінню. Академія, що його розробила, вважає незначне страждання законним педагогічним методом. Колишні учні мають неоднозначні думки.'
    null_essence: 'Рідка відсутність. Розчиняє стінки контейнерів при тривалому зберіганні. Чарівники платять непристойні ціни. Зберігання — ваша проблема.'
    oblivion_saber: ''
    obsidian_arc_bow: 'Натягнутий вощеним шнуром від фартуха. Штори впали багато років тому; карниз опанував другий фах.'
    obsidian_casque_of_glass_cathedral: 'Склепінчастий, мов дах каплиці, і десь так само вправний у тому, щоб не пускати всередину думки пастви.'
    obsidian_choir_plate: 'Обладунок внутрішнього святилища, де стоять лише довірені. Довіру видають скупо й швидко відкликають.'
    obsidian_cordial_choir: 'Для готування, наполягає етикетка. Кухар наполягає на протилежному.'
    obsidian_cordial_of_rising_hymn: 'Ясне висхідне тепло, що підіймає дух і, на мить, волоски на руках.'
    obsidian_cordial_pyre: 'Один ковток — і у вухах дзвенить, очі сльозяться, а рани стуляються з чистого переляку.'
    obsidian_core: 'Щільна серцевина скляного потоку. Розріжеш не так — і воно все голосує стати тисячею ножів.'
    obsidian_elixir_of_glass_cathedral: 'Одна маленька чарка перед сном. Ліжко — за бажанням; чарка — ні.'
    obsidian_extract: 'Полироль для великих плит. Блиск тримається тиждень; запах тримається ціле подружжя.'
    obsidian_flux: 'Їдка паста, що знімає сажу, лак і відбитки пальців. Зваж, що з цього тобі ще було потрібне.'
    obsidian_psalter: 'Кожен рецепт закінчується однією настановою: тримати в печі, доки не перестане кричати. Діє на печеню. Діє на єретиків.'
    obsidian_signet: 'Тисне знак у гарячий віск і, як нагода, в чиєсь чоло. Так чи так — запечатує.'
    obsidian_stompers: 'Полірувані скляні підошви, дзеркально-яскраві. Останнє, що бачить збитий ворог, — власне здивоване обличчя.'
    obsidianite: 'Вулканiчне скло що розбивається на краї достатньо гострi щоб рiзати камiнь i кар єрнi амбiцiї.'
    obsidianite_powder: 'Мікроскопічні уламки, завислі в мінеральному пилу, із попередженнями про безпеку, достатньо довгими, щоб обклеїти ними всю приймальню цілителя. І кожне з них, без винятку, виправдане.'
    ocean_grimoire: "Написаний чорнилом, яке з'являється лише пiд водою. Дуже незручний навчальний матерiал."
    ocean_sigil: "Різьблений корал із рунами талокан. Науковці розшифрували три з дев'яти. Решта шість — гірші."
    old_hoe: 'Селянське сільськогосподарське знаряддя, підсилене зубчастими синіми вусиками, чутливі волоски яких досі сіпаються від залишкових рефлексів.'
    onyxium_aegis_pendant: 'Містить збережене око вороняка, що кліпає, коли поруч небезпека. Іноді просто кліпає й так. Причина незрозуміла.'
    onyxium_bastion_greaves: 'Настільки зручні, що троє солдатів заснули просто в бою, їх носячи. Командування це не оцінило.'
    onyxium_bulwark_helm: 'Крабові панцирі тихо деренчать у бою. Ветерани звуть це «оплесками». Це не оплески.'
    onyxium_caravanner_mail: 'Носилася Тінню Жару, що возила товари розлам-шляхами і жодного разу не була пограбована — через запах. Торгові каравани й досі наймають за цим взірцем, якщо не за джерелом.'
    onyxium_cleaver: ''
    onyxium_conduit: 'Увінчаний живим листком квібека й обгорнутий деревом магмуліган. Тихо гуде, коли його ігнорують.'
    onyxium_crit_band: 'Спресована з ще гарячого осердя Тіні Жару, охолоджена рівно настільки, щоб носити без жалю. Тримає тепло на шкірі так, що загострює зосередженість саме в найгірші миті.'
    onyxium_crushfists: 'Створені зупиняти атаку за один обмін ударами. Другий рідко потрібен.'
    onyxium_edge: ''
    onyxium_fortress_girdle: 'Зроблений із хутра істоти, яка була такою лінивою, що еволюціонувала в броню замість того, щоб тікати від небезпеки.'
    onyxium_fortress_plate: 'Зібраний із племінних реліквій кимось, хто цінував виживання понад витонченість. І це помітно.'
    onyxium_greathelm: 'Периферійний зір віддано за наличник, що спиняє майже все.'
    onyxium_guardian_mace: "Штатне озброєння вартових гробниць. Вм'ятини переживають власника."
    onyxium_hatchet: ''
    onyxium_hauler_boots: 'Носилися Тінню Жару, що тягла руду вгору схилом, яким не мала б змоги піднятися, тліючи всю дорогу. Не втомлюється. Іноді димить.'
    onyxium_iron_wall_grips: 'Луска досі згинається, коли стискаєш кулак — ніби перший власник так і не відпустив по-справжньому.'
    onyxium_ironfoot: 'Просякнуті сутністю Коа. Очі на пряжках стежать за тобою по кімнаті. Чемно.'
    onyxium_loadbearer: 'Дублений зі шкіри Тіні Жару за процесом, що вимагає диму, терпіння й практичного розуміння речей, які не мали б лишатися теплими. Витримує більше ваги, ніж здається.'
    onyxium_longbow: ''
    onyxium_packmule_grips: 'Пальці, виліплені з Тіні Жару, що пронесла жарини через цілий континент, жодної не впустивши. Що б ти не тримав — не покладеш, поки не поклала б Тінь.'
    onyxium_porter_legguards: 'Протерті на коліні Тінню Жару, що століття простояла навколішки біля тієї самої кузні. Добрі для носіння вантажу вгору схилом. Погані для того, щоб коли-небудь ще стати навколішки деінде.'
    onyxium_sages_locket: 'Знайдений обвитим навколо шийного гребеня Тіні Жару, теплий і через століття. Тримає свою мудрість при собі — заразом і твою — та сплачує борг чистою витривалістю.'
    onyxium_scholars_visage: 'Надбрівний гребінь Тіні Жару, що, судячи зі стертості гребеня, вочевидь глибоко про щось замислювалась. Тримає носія настороженим на довгих радах. Вчені наполягають, що це завдяки конструкції. Насправді це через жар.'
    onyxium_spirit_club: 'У головці мешкає могильний блукаючий вогник. Світиться, лиш коли поруч щось конає.'
    onyxium_striders: 'Видають тому, кому випадає найдальший пост. Дорога назад завжди довша за дорогу туди.'
    onyxium_trident: ''
    onyxium_war_signet: 'Дають тому, хто цілим переживає перекличку. Змінює власника частіше, ніж слід.'
    onyxium_warbelt: "Зношений за три кампанії й перезастебнутий для четвертої. Шкіра пам'ятає їх усі."
    onyxium_warblade: 'Викуване за візерунком, який гребінь пазурів Тіні Жару лишив у застиглій лаві — це або блискучий зворотний інжиніринг, або збіг, який ніхто не хоче перевіряти вдруге.'
    onyxium_warchain: 'Кожна ланка позначена кампанією. Ніхто не порахував їх усі.'
    onyxium_ward_ring: 'Вправлене око бачить те, чого ти волів би не показувати. І має власну думку щодо твоїх рішень.'
    onyxium_wargreaves: 'Потерті там, де доводиться ставати на коліна. Драговина стягує данину і з постави.'
    onyxium_warplate: 'Повний обладунок з відновленої воєнної сталі. Одягнути важче, ніж зняти.'
    orb_of_purity: 'Кожна мати в Блідолісі попереджає дітей про кулю, що дозволяє почати спочатку. Один стиск — і ти народжуєшся заново бездоганним, невинним і цілковито безтямним. Магічна амнезія — все одно амнезія; просто з кращими манерами.'
    orchid_spore_blend: 'Мелені пелюстки орхідеї змішані з подрібненими спорами у процесі, який пахне гірше, ніж результат на смак.'
    origin_composite: 'Спресований з найдавніших волокон гори у щось, що відмовляється поводитися відповідно до свого віку. Підозріло пружний як на реліквію.'
    origin_crest_of_world_wound: 'Позначений лінією, якою розірвався світ, щоб власник ніколи не забував, де низ. Низ тут — це напрямок, що має власну думку.'
    origin_philter_of_world_wound_genesis: 'Відміряне Оракулом Рани, який ніколи не пояснює дозу й досі жодного разу в ній не помилився. Довіра — єдиний складник, який додаєш ти.'
    origin_philter_of_world_wound_scar: 'Змішане в ритмі, який тримають Співці Шраму, по одній мірці на рядок їхньої пісні, тому жодні дві партії не смакують однаково й жодну ніколи не кваплять.'
    ornate_bronze_legplates: 'Рогач, чий ріг прикрашає ці наголінники, атакував сімнадцять разів, поки коваль не зрозумів натяк. Вісімнадцята атака стала останньою для рогача і зірковою годиною коваля.'
    ornate_bronze_plate: 'Товстий. Щільний. Непоступливий. Як ріг Рогача і ваша особистість.'
    packrat_thinking_cap: 'Додаткові кишені зсередини. У виставковому колі ніхто не питає, що там.'
    padded_boots: 'Додатковий набив для випадків, коли наступаєте на те, чого не варто — а в цьому світі це майже все. Ноги мовчки вдячні, поки решта тіла цілком виправдано панікує.'
    padded_coif: "Така м'яка, що глушить і удари, і думки. Стоятимеш вічно, не пам'ятаючи навіщо."
    paragon_spellbook: ''
    parrot_hat: 'It is a parrot. On your head. It does not talk, which is somehow worse.'
    patchwork_trousers: 'Зшитi з того що лежало пiд рукою. Кожна штанина рiзного кольору. Мода чи крик про допомогу?'
    patience_amulet: 'Слотіан чекав на гідного власника сто років. Технічно, він досі чекає.'
    patience_charm: 'Згладжений століттями — його стискали під час сварок, до яких він насправді не мав жодного стосунку.'
    patience_club: "Рухається повільно, як усе, що робить слотіанець, і б'є так, ніби сама земля передумала лишатися на місці. Ніхто й ніколи не звинувачував його в поспіху."
    pearl_shard: 'Тріснутий фрагмент перлини зсередини панцира раку-самітника. Коштує щось ювелірам, нічого — крабу.'
    pearl_shard_mace: 'Всаджена осколками крабових перлин. Кожен удар звучить як дзвiночки на похоронi.'
    pearl_shard_pendant: 'Тріснута перлина з устриці, яка, за чутками, дала відсіч. Збирач втратив два пальці і здобув здорову повагу до двостулкових. Перлина слабко світиться під водою, що красиво і абсолютно марно, враховуючи, що ви там не дихаєте.'
    pebble_pendant: "Гладкий рiчковий камiнець на мотузцi. Ювелiр назвав 'мiнiмалiстичний дизайн'. Всi iншi назвали каменем."
    pet_admin: ''
    pet_aloe_gaia: 'Лікувальний варіант. Виділяє заспокійливий сік, що лікує дрібні порізи, сонячні опіки й поранену гордість. Наполягає на тому, щоб кожну подряпину лікувати як смертельну рану, тривожно ширяючи, доки ви не визнаєте її турботу. Сік на смак жахливий, що вона вважає профілактичним заходом.'
    pet_amber_cactee: 'Пахне давнiми сосновими лiсами i поганими життєвими рiшеннями. Iнколи ловить мух у свою смолу.'
    pet_anorak: "Смарагдові руни, витравлені на карапаксі цього павука, пульсують зв'язаною сутністю Арагога — великого павука, зменшеного до керованих розмірів."
    pet_arcane_gaia: 'Зразок Геї, вкритий світними арканними рунами, що пульсують у послідовностях, які жоден живий вчений не зміг розшифрувати, хоча кілька опублікували конкуруючі переклади — від глибоких космологічних істин до того, що виглядає як інвентарна відомість. Він несе тягар із гідною покорою створіння, яке підозрює, що було призначене для чогось більшого.'
    pet_arcanite_cactee: 'Наспiвує колискову на частотах що присипляють маленьких тварин i викликають мiгрень у чарiвникiв.'
    pet_arcanize_bricheton: 'Рунічні візерунки на шкірі — послідовності, визначені як стародавня система обліку зерна. Доказ того, що навіть бріхетони ведуть книги, хоч їхні бухгалтери були явно чаклунами.'
    pet_arisen_bouloute: ''
    pet_arisen_corbac: ''
    pet_arisen_lootbox: ''
    pet_arisen_modni: ''
    pet_arisen_timon: ''
    pet_barley_bricheton: 'Удвічі більший за пшеничного замориша й удвічі менш скромний. Риється в ячмінних рядах, наче має на них право власності.'
    pet_blood_bricheton: 'Його очі багряніють після заходу сонця, і він виявляє гострий, невпинний інтерес до вашого пульсу. Цілителі звуть цю звичку тривожною. Некроманти звуть її компліментом і наполягають, щоб ви теж так вважали.'
    pet_bloodstone_cactee: 'Його голки назавжди залишаються багряними. Ветеринари з принципу відмовляються його оглядати.'
    pet_bouloute: ''
    pet_burnt_bricheton: 'Покритий сажею компаньйон, що дає тепло взимку та постійну проблему зі страховкою цілий рік. Страхові компанії розробили спеціальні пункти. Їх все одно недостатньо.'
    pet_chomperion: ''
    pet_chromafin: ''
    pet_corbac: ''
    pet_cryofin: ''
    pet_cursed_bricheton: "Найвищий компаньйон фермера, бородавочник настільки просочений аграрним прокляттям, що врожаї в'януть при його проходженні. Парадоксально, бур'яни процвітають. Всесвіт має своєрідне почуття гумору."
    pet_cursed_gaia: "Найвищий супутник професії травника, Гея настільки ґрунтовно просякнута проклятою грибною енергією, що бурмоче незапрошені коментарі щодо розподілу ваги інвентарю свого власника мовами, що передують записаній історії. Це неперевершена в'ючна тварина, чия вірність абсолютна, а нічне шепотіння, за словами тих, хто пережив тривале володіння, є чимось, що врешті перестаєш чути."
    pet_cursed_gem_cactee: 'Бурмотить темні пророцтва про вагу інвентарю, вірно несучи ваші речі. Суперечлива істота, чиї пророцтва точні лише тому, що сама ж і несе цю ношу. Парадокс, який її ніскільки не бентежить.'
    pet_deadmaw: 'Аїд рідко оіддає своїх псів смертним, проте ця обпалена потвора вірно крокує поруч із новим господарем.'
    pet_diamantine_cactee: 'Кактус, що виростив діамант замість квітки. Має думки про тиск, здебільшого непрохані.'
    pet_doris: ''
    pet_draconite_cactee: 'Випромінює тепло, мов піч із почуттями. Жахливо для шкіряної торби, чудово для холодних ночей.'
    pet_draconize_bricheton: 'Лускатий бородавочник, який дивиться так, ніби дракон — це він, а ти — жарт про реінкарнацію.'
    pet_dragon_gaia: 'Величний, райдужний і за один поганий настрій — від переробки табору.'
    pet_duskite_cactee: 'Стара байка: у глибокій штольні згасла свічка і більше не запалилася — ось що виросло на тому місці. Ідеально, щоб зникнути посеред сварки. Жодного разу нікому не допомогло її виграти.'
    pet_ensable_crayfish: ''
    pet_gaia: "Паросток із рівно такою душею, щоб ображатися на те, що його топчуть. Пам'ятає кожен чобіт."
    pet_heraklion: 'Невідомий Скелетний Лорд Нерак вивів цих псів на полюванні за живими; їхні порожні ребра відлунюють голодом, який сама смерть не могла вгамувати. Одомашнення залишається... невтішним.'
    pet_ice_corgi: ''
    pet_ivory_gaia: 'Бліда як місячне світло на старому мармурі, ця Гея поводиться з гідністю давньої королівської родини у вигнанні. Відмовляється ходити по ґрунтових стежках, воліючи ледь ширяти над ними з видимою погордою. Іноді очищує найближчі джерела води без прохання, що було б мило, якби вона не виглядала при цьому так самовдоволено.'
    pet_jade_cactee: 'Надзвичайно спокiйний для ходячого кактуса. Медитує в невiдповiднi моменти наприклад пiд час бою.'
    pet_jones: 'Молися, щоб його жадоба поклоніння перевищувала жадобу до пальців власного хранителя.'
    pet_krinan: ''
    pet_lasgalen_rabbit: ''
    pet_lootbox: ''
    pet_malt_bricheton: 'Постійно пахне бродінням і несе речі хиткою ходою істоти, що відкрила ячмінь у найнебезпечнішій формі. Це запах відданості, каже воно собі.'
    pet_melted_koa: 'Знайдене згорнутим біля вогнища, що згасало. Відмовляється покидати тепло.'
    pet_modni_lyk: ''
    pet_moonstone_cactee: 'Видимий лише пiд час повного мiсяця та похмурих вiвторкiв. Нiхто не зрозумiв чому вiвторки.'
    pet_moray: ''
    pet_nightcap_gaia: 'Нічний варіант виду Гея, що адаптувався до вічної темряви з ентузіазмом, що межує з філософською відданістю, переносячи пожитки власника темними коридорами, водночас випромінюючи мовчазне та всеосяжне несхвалення кожного рішення, що привело до цієї домовленості.'
    pet_obsidianite_cactee: 'Кожна голка гостра, як скло, і цілком серйозно налаштована лишатися такою. Стародавнє попередження, намальоване на його ящику, складається з одного рядка, і цей рядок правдивий: не обіймати.'
    pet_ocean_lootbox: ''
    pet_phacochere_son: 'Найменьший у виводку, всюди слідує за батьком, окрім справжньої небезпеки.'
    pet_phantom_gaia: 'Бабуся присягалася, що її коза проходила крізь стіну льоху щоповні і поверталася з запахом спор. Ніхто їй не вірив, доки кози не почали робити те саме самі. Ця досі радше обирає стіну, ніж двері.'
    pet_quartz_cactee: 'A pale little cactus whose spines set into cloudy crystal. It hums quietly near ore veins, mostly to itself.'
    pet_radient: "Первісний мисливець, чиє світяща шерсть полум'яніє спійманою суттю небесного світла."
    pet_rock_koa: "Кам'яний Коа: коа, що сприйняв «наростити товщу шкіру» як буквальне інженерне технічне завдання — важить обурливо багато, тоне мов вирок, виграває будь-який конкурс витримки погляду самою лише геологією."
    pet_siluri: 'Останній з давнього роду, ця побита часом істота несе тягар тисячоліть на своїй стертий панцирі. Легенда каже, що він досі не простив ссавцям усю цю історію з «вимиранням».'
    pet_suize_bricheton: 'Кришталеві ікла дзвенять на вітрі мелодією, яку кожен інший бріхетон сприймає надто особисто.'
    pet_talokan_feu: ''
    pet_tanjirize_bricheton: 'Тварина з мідним хутром, що приваблює торговців спеціями і відштовхує особистий простір на відстань, що приблизно відповідає найменш чутливим носам у регіоні.'
    pet_timon: ''
    pet_tokeko: ''
    pet_truffle_gaia: 'Гая, чий нюх вдосконалили аж занадто — тепер вона вважає особисто вас образливим.'
    pet_ukranize_bricheton: 'Виведений, кажуть пастухи, від звіра, що колись три зими поспіль ніс голодне село, не поскаржившись жодного разу. Відтоді він так і не поскаржився. Але й жодного разу не дав вам подорожувати налегке.'
    pet_vainquished: ''
    pet_velkarion_wyrmling: ''
    pet_wheat_bricheton: 'Відгодований першим врожаєм і певний, що заслужив кожне зерно. Ходить за плугом і оцінює борозни.'
    pet_wind_koa: "Вітряний Коа: коа настільки аеродинамічний, що часом забуває залишатися на місці — прив'язаний мотузкою, здебільшого, і гуде, коли падає тиск, просто щоб похизуватися своєю правотою."
    pet_wither_gaia: "Куди б вона не йшла, квіти вкладаються у щось майже надто прекрасне, щоб зватися вмиранням. Віддана в'ючна тварина — за умови, що ви змирилися з тим, що вона встигає зробити з садом до полудня."
    pet_zot: ''
    phacochef_tusk: 'Колосальний ікол, відколотий від черепа Факошефа під час його землетрясного натиску. Жили мінеральної руди пронизують кістку, досі гудячи сейсмічною силою.'
    phacochere_key: 'Вирiзана з iкла бородавочника та запечатана глиною. Пахне саме так як ви очiкуєте вiд ключа до свинячого пiдземелля.'
    phantom_distillate: "Здобутий із впійманого вогника. Мерехтить то з'являючись, то зникаючи, як і його джерело."
    phantom_essence: ''
    phantom_razors: 'Настільки тонкі, що ледь існують. Жертви помічають поріз лише коли намагаються щось підняти і усвідомлюють, що пальців стало менше. Гранично тонкі й абсолютно нечесні.'
    phantom_spore: 'Наполовину в цьому світі, наполовину там, куди йдуть спори, що воліють залишатися неторканими, вона вислизає крізь недостойні пальці, як чутка вислизає під зачиненими дверима. Щоб зібрати її, потрібен порожній розум — стан, якого більшість травників досягає лише випадково.'
    piranha_amulet: 'Зуби риби, що поїдає все — включно з почуттями власного косяка.'
    piranha_cleaver: 'Зазубрений справжніми зубами піраньї, він і досі, вочевидь, впевнений, що все перед ним — це їжа. Якщо чесно, дотепер він рідко помилявся.'
    piranha_tooth: 'Маленький, трикутний і завжди продається сотнями. Одна-єдина піранья ніколи не є проблемою.'
    plague_fang: 'Зазубрений щурячий зуб, покритий чимось, що ви дійсно не хочете ідентифікувати. Тримайте товстими рукавицями. Товстішими.'
    plague_fang_signet: 'Ювелір, що вставляв цей ікло в оправу, вдягнув рукавиці. Потім товстіші рукавиці. Потім взяв обценьки. Ікло, схоже, образилось.'
    plague_mace: 'Випромінює тьмяне зелене сяйво і зовсім не тьмяний зелений запах. Коваль був у рукавицях. І масці. І з вибаченнями.'
    plague_razmo_fang_blades: 'Штатні клинки проти нечисті. Могильні щури теж кусають; ці кусають першими.'
    plague_treads: 'Кожен слід за годину зеленіє. Плагемо вважає це підписом, а не симптомом.'
    plaguefang_blade: 'Загартований в екстракті чумного ікла, з лезом, що набуло кольору, з приводу якого металурги мають тверду й тривожну думку. Ріже чудово. А от про подальший догляд говорити не хоче ніхто.'
    plaguemo_boots: 'Чинбар, що обробив ці шкури, пережив три окремі чуми й одну вкрай незручну висипку.'
    plaguemo_skullcap: 'Виготовлена з власної черепної пластини плагемо — як не дивно, найменш тривожної частини процесу.'
    plainsteel: 'Без гравіювання, без позолоти, без дотепної назви, доки хтось інший її не дав. Сталь ніколи не просила уваги.'
    pocari_sweat: ''
    polar_fortress_plate: 'Настільки важкоброньована, що рухливість стає легендою. Ніщо не проходить. Врешті — і ти теж.'
    polar_reaver_breastplate: 'Знято з розбійника, який сплутав драговину з відкритим полем. То було не так.'
    polar_reaver_greataxe: 'Улюблена зброя капітана. Ніхто не лишається нейтральним, коли вона замахується.'
    polar_reavers_crook: 'Колись пастуший посох, тепер злодійський. Вівцям пощастило більше.'
    polishing_resin: "Кристально чисте покриття для ювелiрних виробiв. Надає всьому блиску 'щойно здобутого з боса'."
    pollen_mote: 'Одна-єдина порошинка пилку, що ніяк не погоджується сісти.'
    practice_longsword: 'Затуплений тренувальний клинок. Едине що вiн рiже це вашу гiднiсть.'
    praetorian_oath: 'Складена до падіння штандарта. Ніхто так і не звільнив її від служби.'
    preserving_oil: 'Запобiгає розкладанню органiчних матерiалiв. Пекарi використовують для свiжого хлiба. Некроманти для iншого.'
    primal_catalyst: 'Ендгейм унiверсальний реагент що поєднує всi чотири стихiйнi есенцiї. Потрiбний для легендарного спорядження кожної професiї.'
    primeval_codex: 'Оправлений у сторінки, старіші за сам розлам, єдине відоме свідчення того, яким був цілий зеніт. Глибинні Ревізори переймаються останнім розділом уже кілька поколінь.'
    primordial_band_of_first_dawn: "Старіший за палець, для якого призначений, настільки, що власник на мить відчуває себе — і то на здоров'я — маленьким."
    primordial_bone: "Дістали з найглибшого шару найдавнішого кургану. Старша за будь-яке ім'я, ще записане там."
    primordial_cleaver: "Старіший за більшість доктрин, яким він поклав край. Руків'я лишається теплим з причин, які пророк-носій ніколи не пояснював, а нинішній власник облишив розпитування."
    primordial_draconize: ''
    primordial_lance: 'Спис, викуваний із зуба титана, чий вид не існує вже еони. Вістря ніколи не тупіє. Деякі теоретики припускають, що це тому, що ворог цього виду також ніколи не припинив існування.'
    primordial_legplates: "Врятовані після провалу четвертого штурму. П'ятий все одно їх носив."
    primordial_poultice_of_first_dawn: 'Начинена мохом, що розкривається лише на перше світло, тож рана під ним гоїться за розкладом, який задає сонце, а не ти.'
    primordial_tonic_of_last_ascent_genesis: 'Настояний на найдавнішому живому мосі, який будь-хто знаходив, — він відростає тієї ж миті, коли його зривають, і має вигляд ледь роздратований тим, що його заварюють.'
    primordial_tonic_of_last_ascent_scar: 'Дешевий відвар, що продають біля підніжжя підйому кожному, хто гадає, ніби пляшка вкоротить гору. Не вкоротить. Трохи допомагає з тим, що болить.'
    primordial_totem_club: 'Вирізьблений тим, хто тут пророкував до того, як розлам зробив пророцтво здебільшого зайвим. Обличчя тотема стерлося до гладкості від того, що надто часто виявлялося правим.'
    primordial_treads_of_first_dawn: 'Полагоджені зі шкіри, старішої за саме ремесло шевця. Вони риплять якоюсь мовою, а шевці, що переклали б її, усі давно щезли.'
    primordial_trident: ''
    primordial_warblade_of_last_ascent: 'Перекуваний стільки разів, що ковалі загубили оригінал під латками. Чим би він не був спершу, тепер він цілком зроблений із наміру бити далі.'
    primordial_worldpiercer: 'Останнє, що ти куєш перед брамою 100-го рівня, і перше, що її переживає.'
    prisma_arcane_crown: 'Викувана з клешень краба, що вщипнув геть не того архімага. Привид досі скаржиться.'
    prisma_bastion_mace: 'Видано тому, хто тримав лінію останнім. Це було дуже давно.'
    prisma_convergence_amulet: "Кожна ланка — окрема жарина Тіні Жару, охолоджена і з'єднана кимось із терпінням, більшим за здоровий глузд. Змусити їх світитися в унісон вимагає дуже особливого спокою."
    prisma_dual_plate: "Дві напівпластини з двох різних Тіней Жару, зварені в кузні по шву, що досі ледь світиться холодними ночами. Жодна з половин не пам'ятає, щоб погоджувалась на це."
    prisma_dual_sash: 'Дві шкури Тіні Жару, накладені одна на одну, кожна ізолює саме те, чого не може інша. Нахлест лишається досить теплим, щоб сушити білизну.'
    prisma_elementalist_grips: 'Останнє тепло Тіні Жару, згорнуте в шкіру, перш ніж встигло охолонути. Долоні лишаються теплими крізь будь-яку зиму. Рукостискання стають незручними.'
    prisma_ember_band: 'Теплий від кузні навіть через роки по тому. Не вистигає повністю, як і все тут.'
    prisma_emberstep: 'Лишає легкий опік у кожному сліді. Зникає раніше, ніж хтось надумає його вистежити.'
    prisma_flameguard: 'Обпалена в ямах, де жерці спалюють мертвих. Ніколи не вистигає повністю.'
    prisma_flameheart_pendant: 'Носять під обладунком, достатньо близько, щоб відчувати вогнище крізь пластину.'
    prisma_flamelegs: 'Носять найближче до вогняних ям. Поділ ніколи не перестає диміти.'
    prisma_gale_sash: "Зав'язаний для останнього збору. Імена, названі того дня, десь досі записані."
    prisma_gale_vest: 'Носили на останній зміні, перш ніж драговина замовкла. Вона мовчить і досі.'
    prisma_hybrid_crown: 'Наполовину каптур, наполовину корона, цілком нерішучий — так само, як силует самої Тіні Жару ніколи не визначається остаточно з формою. Ця нерішучість тут — несуча.'
    prisma_longsword: "Ведмежі кігті за гарду, штормове пір'я в долі. Прекрасний. Цілковито байдужий до твоєї думки."
    prisma_mace: 'Оздоблена іклами й обмотана краденою вовною. Підсилює кожну образу за ударом.'
    prisma_sabre: 'Загострений для зграї. Сам по собі просто дуже гострий — та воліє товариства.'
    prisma_spellbinder_sash: 'Прошитий тим самим сигнальним кодом, що й рукавиці. Читається швидше, ніж мав би.'
    prisma_spellweave_gloves: 'Позначені давнім сигнальним кодом жерців багать. Пальці рухаються швидше, ніж читання.'
    prisma_stormheart: "Зігріте тим, хто скликав останню перекличку. Досі б'ється в ритмі, який більше ніхто не чує."
    prisma_stormlegs: 'Пошиті для останньої колони, що йшла лінією. Вона не повернулася.'
    prisma_tempest_ring: 'Носили на останній зміні, перш ніж пости замовкли.'
    prisma_tidal_treads: 'Відлиті у виходах пари, які Тінь Жару полюбляла для зігрівання ніг між патрулями. Лишаються гарячими тижнями після виготовлення — ковалі називають це перевагою, носії — скаргою.'
    prisma_tide_signet: 'Відтиснена з того, що правило Тіні Жару за обличчя, перш ніж вогонь довершив його переробку. Документи, скріплені нею, прибувають з ледь чутним запахом гару. Одержувачі рідко питають чому.'
    prisma_tidewalker_legs: 'Викроєні з однієї Тіні Жару, що завмерла так надовго, що земля завчила її форму. Спритність стікає крізь підошви; витривалість заповнює звільнене місце. Біг перестає бути опцією.'
    prisma_windcrown: "Дісталася тому, хто востаннє скликав перекличку. На останнє ім'я ніхто не відгукнувся."
    prisma_windweave_grips: 'Носили гінці, що передавали звістки між лініями гробниць. Жоден із них не зупинився бігти.'
    prisma_zephyr_boots: 'Розношені бігунами, що несли звістку швидше, ніж посувалася війна.'
    prismatic_saber: 'У навершші пульсує жарина серцевина, здобута з Тіні Жару, що ще не встигла охолонути, коли до неї дістався коваль. Змінює колір за настроєм власника, хоче той цього чи ні.'
    pristine_malt: ''
    pyre_ash: 'Совок соборної підлоги: попіл, скляний блиск і по одній загубленій сережці на кожну лопатку.'
    pyre_chain_girdle: 'Ланки теплі в спокої, гарячі в бою. Тримає штани й змушує ворогів насторожитися.'
    pyre_channeler_staff: 'Носили жерці багать. Попіл довкола неї ніколи не осідає остаточно.'
    pyre_cleaver: "Тесак вогнища, викуваний із сталі, загартованої в вулканічному полум'ї. Він менше ріже, ніж припалює. Польові хірурги коротко розглядали його, поки хтось не нагадав їм, що обережність має свою корисність. М'ясники прийняли його без вагань."
    pyre_crown_fragment: 'Шматок головної прикраси Попільного Тирана. Випромінює авторитет і надзвичайну спеку. Послідовники мимоволі утворюються поблизу.'
    pyre_handler_mitts: 'Пошиті для печі, що випалює хорове скло. Тримай будь-що. Не шкодуй ні про що.'
    pyre_walkers: 'Підошва досить товста, щоб перейти вугляне ложе звичайним кроком. Звичайним — для цієї варти.'
    pyrecleaver: 'Формально — для дров. Парафіяни проходять повз неї дуже чемно.'
    pyreguard_cuirass: 'Носили ті, хто стояв найближче до вогнища. Обпалена, та вогонь її так і не пробив.'
    pyrehymn_cuirass: 'Випалена, а не кута. Вийшла з печі, вже втомлена від твоїх проблем.'
    pyrehymn_draught_of_cooling_vent: 'Розлита з пари охолодного жерла. Смак мінералів і легкого жалю. Однаково повертає до тями.'
    pyrehymn_gauntlets_of_ashen_song: 'Кухонні рушники, туго намотані до зап ястка. Десь за ними страшенно сумує шухляда.'
    pyrehymn_girdle: 'Смуга обпаленої шкіри, що спиняє пожежу на поясі. Уже спинила кілька. Це помітно.'
    pyrehymn_greaves_of_cooling_vent_choir: 'Відлиті з остиглого стоку, разом із вадами. Вади тепер несуть навантаження, тож не чіпай.'
    pyrehymn_greaves_of_cooling_vent_pyre: 'Прорізані, щоб віддавати жар донизу, тож твої чоботи приймають найгірше й мовчать.'
    pyreward_diadem: 'У будь-яку годину теплий на чолі. У день, коли він охолоне, тікай і ти.'
    quartz: 'Каламутний кристал що вiбрує на частотах якi нiбито розумiють лише пихатi алхiмiки.'
    quartz_choker: "Чокер із полірованого кварцу, що поглинає навколишнє світло й м'яко повертає його вночі. Корисний як нічник. Марний як зброя. Деякі авантюристи використовують його для читання в темряві, що видавці гримуарів схвалюють, але вбивці, присутні в темряві, — ні."
    quartz_powder: 'Мелений кварц змiшаний з дiамантовим пилом. Чхати поруч наполегливо не рекомендується.'
    quickbite: 'Три удари за час, потрібний, щоб помітити перший. Фауна Шраму вже перестала чекати, щоб перевірити.'
    quickstep_sash: 'Більше прикраса, ніж захист. Зате фантастично виглядає під час ухилень.'
    quillbound_cord: 'Ледь витримує ретельну перевірку, твердження, яке жодного разу не перевіряли.'
    quillweave_grips: 'Функціонує задовільно — за власним визнанням, що носій вирішив просто прийняти на віру.'
    ramrage_sash: 'Зіткана з вовни баранячої люті. Майже незнищенна. Запах, однак, — вічний.'
    ramrage_waraxe: 'Збалансована противагою з рогу рамрейджа. Баланс - поняття вiдносне, коли сокира важить двадцять кiло.'
    ramrage_warhelm: 'Прикрашений рогами шаленого барана. Дверні пройоми стають справжнім випробуванням терпіння натовпу.'
    rangers_longbow: 'Довгий лук рейнджерів, відполірований роками служби в темних лісах. Кожна подряпина на дереві свідчить про стрілу, пущену в темряву без впевненості у влученні. Деякі з цих пострілів врятували життя. Інші просто злякали оленів. Обидва враховуються в архівах полку.'
    raptor_bone_bow: 'Вирізаний із власних ребер раптора, що досі зберігають форму його останнього лютого кидка. Кожна стріла зривається з тятиви швидко, люто й геть байдужа до вашої думки з цього приводу.'
    raptor_claw: 'Вигнутий, гострий як бритва, і все ще теплий. Зброярі кують з них кинджали. Раптор використовував як відкривачку.'
    raptor_hide_boots: 'Раптори — це спосіб природи нагадати, що все в харчовому ланцюгу є чиїмось взуттям. Ці ще сіпаються, коли чують здобич.'
    raptor_javelin: 'Наконечник з кігтя раптора, що бачив кращі дні. І гіршу здобич.'
    raptor_scale_greaves: 'Раптор-донор протестував зі швидкістю миль сорок на годину. Наздогнати не встиг.'
    rat_bile: 'Добута із залози злоби щура. Вчені наполягають, що ця залоза не існує. Щури не згодні.'
    rat_trousers: 'Одяг з латок, пошитий із шкур гризунів — кожен шов розповідає історію відчайдушної боротьби під міськими вулицями. Носити їх — це доказ, що гідність є першою жертвою злиднів.'
    raven_beak: 'Твердий як залізо і гострий як злоба. Зброярі кріплять їх до ціпів. Ворон мав інші плани на нього.'
    raven_coif: "Археоптерикс, що зронив це пір'я, залишив, по суті, обіцянку майбутньої помсти."
    raven_eye_pendant: 'Запечатаний у бурштині й міді, дає терпіння яструба і суд грифа.'
    raven_flight_bow: "Оперена пір'ям, що випало в піке. Стріли й досі пам'ятають, де верх, а де низ."
    raven_grips: 'Підбиті хутром ферана й пазурами в тон. Ферани так і не пробачили кравцю.'
    raven_hauberk: 'Хутро феранів: сумнівне етично, бездоганне структурно, і нібито придатне для пральної машини — хоч ніхто не наважився перевірити.'
    raven_trousers: 'Хутро знизу, пухова підкладка зверху. У дзеркалі моторошно, у русі — чомусь ідеально.'
    rawhide_belt: 'Невичинена шкiра що пахне екзистенцiйною тривогою та мокрою тваринкою. Перший справжнiй проект дубильника.'
    razendril: 'Щурячий іклак, ретельно витесаний у клинок несподіваної елегантності та смертоносності.'
    razlord_trophy_belt: 'Обвішаний знаками, знятими з того, кому вони вже не потрібні. З кожним сезоном важчає.'
    razmaster_grudge: 'Знято з могильного щура, який явно кусав першим.'
    razmaster_longsword: 'Размайстер вирiшує всi суперечки однаково. Цей клинок — останнiй аргумент.'
    razmo_bone_pike: 'Вирiзана зi стегнової кiстки размо. Слiди зубiв це особливiсть.'
    razmo_pelt: 'Обшарпана шкура щура. Шкіряники приймають, але абсолютно засуджують за це.'
    razmoket: 'Відрубаний хвіст звичайної каналізаційної щура, все ще забруднений нечистотами з темних тунелів.'
    razord_fangblade: 'Викувана навколо ікла, що не піддавалося жодній спробі розплавити. Ковалі зрештою збудували клинок довкола нього.'
    razord_skullcap: "Пір'я разорда встеляє нутро, і думки носія помітно гострішають."
    razorfang: 'Вирізані з велетенських іклів стічних тварюк, ці зазубрені леза несуть прокляття моровиці.'
    reaver_visage: 'Носили полярні жнеці, що патрулювали крижані пустки. Морозні руни на ньому — суто декоративні. Переважно.'
    recurve_practice_bow: 'Рекурсивний лук для навчального залу. Він прощає помилки постави краще за більшість луків, що інструктори вважають прикрим — пробачені помилки мають тенденцію зберігатися. Сам лук не скаржиться. Його результати говорять мовчки.'
    red_gaia: 'Забарвлена залізистою глиною каньйону й тихо цим пишається. Точить червоний сік, який зілляри вдають навмисним.'
    red_orchid: 'Ця пурпурова орхідея тримає яскравий відтінок навіть після довгого випікання, її пелюстки товсті, як дублена шкіра.'
    refined_solution: 'Очищене алхiмiчне середовище яке вiдмовляється окислюватися з чистої впертостi.'
    reforged_ember: 'Зішкребена сірка, цукерково-червона й нетерпляча. Одне черкання, повернення коштів немає.'
    regalfall_breastplate_of_empty_seats: 'Технічно функціонує в більшості умов, що заспокоює рівно настільки, наскільки це звучить.'
    regalfall_grips_of_empty_seats: 'Працює тимчасово, до подальшого розгляду, невелика втіха, зважаючи на альтернативу.'
    regalfall_legguards_of_silent_court: 'Гарантія анулюється тієї миті, коли ви це заперечите, деталь, яку всі причетні домовилися забути.'
    regalfall_tonic_of_silent_court: 'Його дія настає — або ні, — непередбачувано, тож пийте на власний ризик, якщо формально.'
    regalfall_warbelt_of_silent_court: 'Інструкцію загубили під час гарячої суперечки, тож первісну суперечку визнали нічиєю.'
    regent_ore: 'Два окремі звіти описують це суперечливими термінами, що змінюється залежно від пори року й того, хто питає.'
    regent_spellbook: ''
    reinforced_mitts: 'Підсилені рукавиці для тих, хто вважає, що голі кулаки недостатньо переконливі. Металеві пластини на тильній стороні перетворюють будь-яку суперечку на завершену дискусію.'
    relic_aragog: 'Мати Павуків скинула цей ікло добровільно — під добровільно ми маємо на увазі, що хтось його вирвав, поки вона перетравлювала особливо великого шукача пригод. Він досі капає отрутою, від якої ваші вороги переосмислюють свої життєві рішення.'
    relic_chairman: ''
    relic_dragon_fire: 'Дракон помер століття тому. Центральному опаленню ніхто не сказав. Десь під навою воно досі горить за розкладом, і батареї стукають двічі перед кожною відправою.'
    relic_dragon_frost: 'Одна кристалізована сльоза, пролита крижаним драконом під час того, що свідки описують як емоційну суперечку з льодовиком. Ніколи не тане, ніколи не нагрівається, і відома тим, що робить напої некомфортно холодними з іншого кінця кімнати. Алхіміки намагалися її вивчити, але їхні інструменти постійно замерзають.'
    relic_dragon_void: 'Вирвана з дракона, який так довго поглинав енергію пустки, що забув смак сонячного світла. Щелепа гуде на частоті, від якої меблі самі переставляються, а будь-хто поруч раптово згадує кожну ганебну річ, яку коли-небудь робив. Воїни, що носять її, повідомляють про значно більшу силу, хоча й про значно більше екзистенційне занепокоєння.'
    relic_duke: ''
    relic_ensable: 'Частіше йде назад, ніж уперед. Жодної гарантії — ні явної, ні прихованої.'
    relic_fenrik: ''
    relic_gobeline: "Гобліни шанують цей артефакт із тією самою ревністю, яку виявляють у небажанні бути з'їденими — тобто: відчайдушно й без гідності."
    relic_guardian: ''
    relic_koa: ''
    relic_kraken: "Вирваний із левіафана, настільки давнього, що пам'ятає море іншого кольору."
    relic_magmalug: ''
    relic_nerak: 'Кажуть, вирізана з самого хребта Нерака кістяним торговцем, який розсипався на порох посеред речення — двір вважає це найпереконливішим відгуком, який коли-небудь отримував. Надягніть її, і вітер почне вам щось розповідати. Краще не відповідати.'
    relic_pale_weaver: ''
    relic_past: 'Відлуння забутої епохи. Цей артефакт колись викували в горнилі творіння, та його майстер відтоді зник з усіх відомих світів. Лишився тільки тихий гул прадавньої сили — шепіт того, що колись було.'
    relic_phacochef: 'Вирваний з пащі кабана, настільки впертого, що він одного разу боднув гору і переміг. Один лише сморід надає власнику надприродну стійкість — а може, всі просто тримаються подалі.'
    relic_ramrage: ''
    relic_razmo: ''
    relic_rex: ''
    relic_rrexn: 'Нотатки творця складаються суцільно з закреслених ідей, і чомусь це досі вважають успіхом.'
    relic_seraph: ''
    relic_wanilla: ''
    reset_spells_scroll: 'Містить заборонене знання настільки руйнівне, що твій мозок обрав насильство і повністю видалив твою операційну систему. Принаймні ти нарешті забудеш той найгірший вислів, який відкотив у таверні.'
    resonance_band: 'Дзвенить сам, коли поруч звучить потрібна нота. Корисне попередження, хіба що нота — це твій похорон.'
    resonant_pike: 'Щетина стерлася три століття тому. Держак відмовляється йти на пенсію.'
    rex_bone_cuisses: 'Захист стегон, підсилений кістковими пластинами рекса. Ходьба — тренування. Біг — мрія.'
    rex_bone_signet: 'Вирізаний з кістки рекса з вставкою ікла. Натискання на віск залишає відбиток. Натискання на ворогів — більше.'
    rex_fang: 'Зуб довший за ваше передпліччя. Рекс, що виростив його, був дуже великий і дуже злий. У такому порядку.'
    rex_fang_claymore: 'Рекс-альфа пожертвував найбiльшим iклом. Мимовiльно.'
    rex_hunter_longbow: 'Створений спецiально для полювання на рексiв. Мисливцiв-випробувачiв бiльше не бачили, але лук повернувся.'
    rex_jawbone_cleaver: 'Тесак з щелепи рекс альфи. Зуби на лезi орiгiнальнi.'
    rex_jawbone_talisman: 'Одне ікло рекса, відполіроване та закріплене як талісман. Попередній власник не був рексом. Той, хто був до нього, — був.'
    rex_knuckle_guards: 'Підсилені фрагментами ікла рекса на кістяшках. Удари тепер вважаються доісторичними.'
    rex_ribcage_plate: 'Виготовлений з грудної клітки рекс-альфи. Майстри наполягають, що він уже був мертвий, коли його знайшли.'
    rex_scale_breastplate: 'Знята луска за лускою з того, хто панував у харчовому ланцюгу — і чудово це знав.'
    rex_sinew_belt: 'Пояс, сплетений із сухожиль Рекса. Він не рветься — принаймні не раніше, ніж розірветесь ви. Це обіцянка міцності, яку наважуються давати небагато поясів і ще менше можуть виконати.'
    rex_stompers: 'Підсилені кісткою рекса. Кожен крок звучить як невеликий землетрус. Непомітність не входила в план.'
    rex_tooth_talisman: 'Нібито дає відвагу. Насправді — переважно хронічний біль у шиї.'
    rift_torn_band_of_split_sky: 'Оздоблений скалкою линялого панцира Розривника, досі ледь теплою від линьки, завершеної тижні тому. Ловить світло неправильно — навмисно, як і істота, що його виростила.'
    rift_torn_breastplate_of_split_sky: 'Відхиляє шквал, більшість клинків і геть нічого з екзистенційного запаморочення.'
    rift_torn_crusher_of_torn_ground: 'Тримає образу так, як панцир Розривника тримає тріщину: повільно, потім одразу, потім назавжди. Удари під гору рекомендовані. Удари в гору також технічно можливі.'
    rift_torn_extract: 'Сочиться повільними краплями з розірваної землі. Збирай терпляче або ніяк.'
    rift_torn_grips_of_torn_ground: 'Коли підлога перестає бути надійною, ти вчишся хапатися. Ці хапаються у відповідь.'
    rift_torn_legguards_of_torn_ground: 'Врятовані з линьки Розривника, що так і не затверділа повністю. Згинаються під кутами, під якими коліно не повинне, і в цьому суть — земля тут не лишається рівною достатньо довго, щоб сперечатися.'
    rift_torn_tonic_of_torn_ground_faultline: 'Приплив сили, що б’є, наче підлога, яка здіймається тобі назустріч — а вона й може.'
    rift_torn_tonic_of_torn_ground_void: 'Порожнеч-метелики встеляють нори чимось, що не зовсім пил і не зовсім світло. Перегнане, воно спершу наповнює шлунок, потім спорожняє голову — саме в такому порядку.'
    rift_torn_twin_knives_of_torn_ground: 'Два леза, вирощені з тієї самої линьки Розривника, і досі сперечаються, яке з них оригінал. Проміжок між ними — саме те місце, де план супротивника перестає підходити.'
    riftsteel: 'Куте у шві, де труться два світи. Пам’ятає тиск і тримає образу.'
    riftsunder_blade: 'Перший удар — ввічливий. А ось про наступні чотири твої ребра захочуть поговорити.'
    riftsunder_cleaver: "Розколює все, у що влучає, на чітке «до» і «після» — так само, як Розривник, чиє ім'я він носить, відокремився від власної лінії линьки. «Потім» рідко входить до результату."
    riftsunder_cuirass_of_widening_crack: 'Спереду є шов, що щосезону росте на волосину, простежуючи ту саму тріщину, яка розколола Розривника, з якого вона взята. Носію про це ще ніхто не сказав. Хтось мав би.'
    riftsunder_draught: 'Здобутий з порожнини кістки Розривника — порожньої, бо Розривник, у структурному сенсі, ще не до кінця існує. Одна доза купує одне ясне рішення.'
    riftsunder_extract: 'Дістають з такої глибини розлому, куди сягне мотузка й хоробрий дурень.'
    riftsunder_fangs: 'Дрібні рани. Багато. Перемовини веде кровотеча.'
    riftsunder_helm_of_last_tremor: 'Останній трем, який колись спричинив певний Розривник, лишив у цій панцирній касці гудіння, що відтоді не вщухло. Переживає слух. А тоді, ймовірно, переживає й тебе.'
    riftsunder_lattice: 'Застигла кам’яна брижа, спіймана посеред обвалу. Виглядає тимчасовою. Виглядає так уже століттями.'
    riftsunder_ration: 'Спечений за рецептом, якого дотримувалася рота Розбитих Солдатів, поки рота ще була цілою. Досить щільний, щоб бути зброєю. Дехто ним і був.'
    riftsunder_ration_of_last_tremor: 'Те, що їсть Розривник між линьками, висушене й спресоване в брикети. Зберігається роками. На смак — як нутро дуже старої шухляди.'
    ring_of_the_worldeater: 'Вирвана з гнізда, завеликого для пальця, і все одно ношена — на ланцюжку. Світлоїд зжер сім світів, перш ніж хтось перевірив, чи не був він просто голодний. Відтоді ніхто не перевіряв.'
    ringfast: 'Не знімається. Це чітко пояснювали кожному покупцю перед продажем. Більшість все одно купує.'
    riven_casque: 'Продають зі знижкою через відсутню ліву третину. Розставляй ворогів відповідно.'
    riven_charm: 'Тріснутий рівно по тій самій лінії, де тріскає панцир Розривника під час першої линьки, і вважається настільки ж щасливим через це. Ця логіка погано подорожує за межі цього світу. Тут вона — святе письмо.'
    riven_chausses_of_long_collapse: 'Напівлинялі ноги Розривника, застиглого в момент обвалу, досі зігнуті під кутом падіння, що його доконало. Носії повідомляють про те саме коліно, що підводить — за розкладом, вічно.'
    riven_longsword_of_long_collapse: 'Тут гравітація — лише порада, тож удар зверху летить десь тиждень. Візьми обід із собою.'
    riven_saber_of_screaming_rift: 'Викроєна з власного відтятого кінцівки-леза Розривника, і досі ледь чутно виє на частоті розлому, з якого походить. Судмедексперти описують звук удару як «непотрібний».'
    roadworn: "Пройшов прочанський шлях стільки разів, що шкіра забула, якою була новою. Пам'ятає кожну милю відтоді."
    root_cellar_key: 'Торохтить холодним протягом, якого льох виробляти не повинен. Льохопащ викарбувала їх сотню; замок їй жодного разу не знадобився.'
    roothold_treads: 'Тебе не зрушити. Не тому, що не можеш. А тому, що не хочеш.'
    rotted_flesh: "Здерти зомбі легко. Запах тримається тижнями. Ваші товариші по групі запам'ятають цю зраду."
    rough_mitts: 'Грубо зшиті рукавиці зі сирої шкіри. Їх виготовлення зайняло двадцять хвилин, знос займе двадцять років, а елегантність залишатиметься на нулі весь цей час. Функціональність перемагає стиль — як завжди у прагматиків.'
