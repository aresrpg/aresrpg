    marketplace: РИНОК
    marketplace_desc: Спорядження та персонажі виставляються в кіоску за ціною, яку ви встановлюєте; покупці платять миттєво. Ресурси натомість обмінюються на SUI у пулах свопів, без оголошень. Кожен продаж сплачує 10% роялті — маркетплейс є єдиним способом продажу.
    section_forgemagie: ФОРЖЕМАГІЯ
    forgemagie_desc: 'Форжемагія: це система рун. Роздрібнюйте спорядження на руни, потім застосовуйте їх на інше спорядження для зміни характеристик. Високоризикова, але надзвичайно вигідна система для вдосконалення спорядження.'
    crushing: РОЗДРІБНЕННЯ
    crushing_desc: 'Кожна лінія характеристики роздрібненого предмета оцінюється незалежно — вищі значення та важчі характеристики дають більше рун. Сервера немає: дільник виходу поєднує фіксовану криву за рівнем предмета з власним taux шаблону предмета — спільним ончейн-коефіцієнтом інфляції (1%-4000%), який саме роздрібнення знижує для цього шаблону і підвищує для його сусідів.'
    crushing_tiers_desc: Рівень руни (Ba/Pa/Ra) обирається ймовірнісно. Вищі характеристики схиляють до Ra рун.
    rune_tiers: РІВНІ РУН
    rune_ba: 'Тір 1: найменша вага за руну'
    rune_pa: 'Тір 2: середня вага за руну'
    rune_ra: 'Тір 3: найвища вага за руну, подвійний досвід'
    rune_weight_desc: Кожна руна має вагу, рівну її значенню, помноженому на одиничну вагу характеристики. Вага обчислюється автоматично.
    rune_table_stat: СТАТ
    rune_table_note: Руни Дальності, Руху та Дії застосовуються по одному разу кожна; Шанс криту — до 10 разів. Критичний удар і Критичні результати не мають рун взагалі.
    rune_stat_range: Дальність
    rune_stat_movement: Рух
    rune_stat_action: Дія
    rune_stat_raw_damage: Сира шкода
    rune_stat_critical_chance: Шанс криту
    rune_stat_earth_resist: Опір землі
    rune_stat_fire_resist: Опір вогню
    rune_stat_water_resist: Опір води
    rune_stat_air_resist: Опір повітря
    stat_unit_weights: ОДИНИЧНІ ВАГИ ХАРАКТЕРИСТИК
    stat_unit_weights_desc: Кожна характеристика має одиничну вагу, що відображає її бойову потужність. Предмети з важкими лініями характеристик дають більше рун при подрібненні, споживають більше бюджету і їх складніше пере-кувати.
    rune_application: ЗАСТОСУВАННЯ РУН
    rune_application_desc: 'Розблоковується на 70 рівні БУДЬ-ЯКОЇ професії — збиральної чи ремісничої, залежно від того, яку ви прокачали першою. Застосовуйте руни до спорядження по одній, щоб змінити його характеристики. Можливі три результати:'
    outcome_critical_success: Критичний успіх
    outcome_critical_success_desc: Руна спрацювала, характеристики не втрачені
    outcome_neutral: Нейтральний успіх
    outcome_neutral_desc: Руна спрацювала, інші характеристики можуть знизитися
    outcome_critical_failure: Критична невдача
    outcome_critical_failure_desc: Руна не спрацювала, втрата характеристик рівна вазі руни
    success_rate: ШАНС УСПІХУ
    success_rate_desc: 'Успіх залежить від того, наскільки близька характеристика до максимуму: близько до 0% — це ~99% успіху, близько до максимуму — ~50%, а екзотичні характеристики залишаються на ~1% незалежно від рівня. Чи стане успіх Критичним (без втрат), чи Нейтральним (вага сплачена), змінюється так само, плюс невеликі +0,2% за кожен рівень професії понад 1. Немає обмеження на те, з яким рівнем предметів може працювати ваша професія.'
    puits: ПОГЛИНАЧ (PUITS)
    puits_desc: Лічильник ваги, показаний в інтерфейсі, що накопичується, коли втрати характеристик перевищують вагу руни. Поглинає майбутні втрати перед тим, як інші характеристики постраждають. Скидається, коли предмет залишає верстат форжемагії.
    over_maging: НАД-МАГІЯ
    over_maging_desc: Підвищуйте характеристики вище їх природного максимуму. Кожна лінія характеристики обмежена 101 додатковою вагою. Максимум над-магії залежить від одиничної ваги характеристики — легку характеристику, як-от Живучість (вага 0,2), можна перевищити приблизно на 505 очок, важку, як-от Мудрість (вага 3), лише приблизно на 33.
    forgemagie_tips: ПОРАДИ
    forgemagie_tips_desc: 'Для екзотичного/овер-мейджу: спершу зніміть дешеві характеристики, щоб накопичити великий колодязь, потім проведіть складну характеристику з буфером, потім додайте втрачені характеристики назад (легко, бо далеко від максимуму). Не переміщуйте предмет під час сесії. Колодязь скидається. Овер-мейдж та екзотичні характеристики втрачаються першими при невдачі.'
    forgemagie_xp: ДОСВІД
    forgemagie_xp_desc: 'Досвід нараховується лише при успіху (Критичному або Нейтральному). Предмети вищого рівня та важчі руни дають значно більше досвіду. Руни Ra дають подвійний досвід порівняно з рунами Ba та Pa. Формула: max(1, вагаРуни × (1 + рівеньПредмета / 50) × множникТіру), де множник дорівнює 2 для Ra, 1 для інших.'
    action_points: ОЧКИ ДІЇ (ОД)
    movement_points: ОЧКИ РУХУ (ОР)
    critical_stat: КРИТИЧНИЙ УДАР
    wisdom_xp: БОНУС ДОСВІДУ ВІД МУДРОСТІ
    wisdom_xp_desc: Мудрість збільшує весь досвід, який ви отримуєте. За 600 Мудрості ви отримуєте подвійний досвід, далі з ефектом спадної віддачі.
    chance_loot: УДАЧА ТА ЗДОБИЧ
    chance_loot_desc: Ваша Удача підвищує шанс випадіння кожного предмета здобичі. За 700 Удачі кожен шанс подвоюється. Шанс випадіння ніколи не перевищує гарантований.
