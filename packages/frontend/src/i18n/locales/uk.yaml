title: WebGPU недоступний
body: 'Світ потребує WebGPU та захищеного з’єднання (HTTPS або localhost). Відкрийте його в сумісному браузері.'
engine_graphics_failure: Не вдалося запустити графіку. Перевірте графічні налаштування браузера або оновіть відеодрайвер, а потім перезавантажте сторінку.
graphics_help:
  firefox_update: 'У вас Firefox {version}. Для WebGPU потрібен Firefox {required} або новіший: відкрийте меню, потім Довідка → Про Firefox, щоб оновитися, і перезавантажте сторінку.'
  firefox_unsupported: 'Firefox поки не підтримує WebGPU в цій системі. Відкрийте гру в Chrome або Edge.'
  firefox_settings: 'У Firefox відкрийте Налаштування → Загальні → Швидкодія, зніміть позначку «Використовувати рекомендовані налаштування швидкодії» та ввімкніть «Використовувати апаратне прискорення, якщо можливо», потім перезапустіть Firefox. Mac на Intel поки не підтримуються: використовуйте Chrome або Safari 26.'
  safari: 'Для WebGPU потрібен Safari 26 або новіший. Оновіться до macOS 26, iOS 26 або iPadOS 26 і перезавантажте сторінку.'
  chromium: 'Увімкніть Налаштування → Система → «Використовувати графічне прискорення, якщо доступно», потім перезапустіть браузер. На сторінці chrome://gpu WebGPU має бути позначено як апаратно прискорений.'
  chromium_linux: 'У Linux увімкніть «Unsafe WebGPU Support» і «Vulkan» у chrome://flags, увімкніть Налаштування → Система → «Використовувати графічне прискорення, якщо доступно», потім перезапустіть браузер.'
  other: 'Відкрийте гру в останній версії Chrome, Edge або Safari 26 з увімкненим графічним прискоренням.'
