    combat_desc: "Бій покроковий на сітці. У свій хід ви витрачаєте Очки дії (ОД), щоб накладати заклинання, та Очки руху (ОР), щоб пересуватися. Лінія видимості — це прапорець для кожного заклинання окремо: більшості заклинань вона потрібна, деяким — ні. Ви б'єтеся з групами монстрів у світі та з іншими гравцями в Колізеумі. Шкода масштабується з відповідним стихійним статом і будь-яким бонусом сирої шкоди."
    elements: СТИХІЇ
    element_earth: ЗЕМЛЯ
    element_fire: ВОГОНЬ
