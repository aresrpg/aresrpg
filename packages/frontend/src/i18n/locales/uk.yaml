adventure:
  goblins_title: 'Розчистити шлях'
  goblins_objective: 'Підійдіть до гоблінів і виберіть дію атаки.'
  equip_title: 'Спорядження в дорогу'
  equip_objective: 'Екіпіруйте всі нагороди, включно з улюбленцем, і натисніть {{confirm}}.'
  equip_body: 'Відкрийте інвентар і екіпіруйте всі здобуті предмети. Натисніть {{confirm}}, щоб застосувати зміни. У справжній грі це надсилає транзакцію Sui; тут усе безкоштовне й лише імітується.'
  speak_title: 'Незнайомець на мосту'
  speak_objective: 'Знайдіть Скіата на мосту та поговоріть із ним.'
  invite_title: 'Разом сильніші'
  invite_objective: 'Відкрийте меню Скіата та запросіть його до групи.'
  switch_title: 'Ваш Ядзін'
  switch_objective: 'Виберіть вкладку Скіата. Ви керуєте обома героями з різними закляттями та спорядженням.'
  follow_title: 'Іти за лідером'
  follow_objective: 'Виберіть лідера Сенші. Увімкніть Іти за лідером на панелі групи.'
  guards_title: 'Королівська варта'
  guards_objective: 'Перейдіть міст і здолайте королівську варту. Ставте пастки Ядзіна й штовхайте в них ворогів.'
  boss_title: 'Реліквія Ґобадока'
  boss_objective: 'Бийтеся з Ґобадоком, королем гоблінів, за його реліквію. Він значно сильніший за вартових.'
  dialogue_greeting: 'Ти тут уперше! Я Скіат.'
  dialogue_danger: 'Цей світ небезпечний. Самотужки далеко не зайдеш. Ходімо разом.'
  dialogue_relic: 'Ґобадок, король гоблінів, охороняє могутню реліквію. Допоможи пройти варту, і ми знайдемо його.'
  journal: 'Пригода в Моссвуді'
  chapter: 'Король гоблінів'
  speak_action: 'Поговорити зі Скіатом'
  invite_action: 'Запросити Скіата'
  rebirth_title: 'Ви померли від ран…'
  rebirth_victory: 'Ти переміг Ґобадока. Молодець! Але його атака отруїла тебе. Ти знепритомнів, а його армія пожерла твоє беззахисне тіло. Перемога коштувала тобі життя.'
  rebirth_body: 'Продовжте з Google, щоб відродитися й увійти до справжньої гри.'
  goblins_body: 'Моссвуд здається мирним, доки гобліни не вирішують, що ви станете їхнім наступним обідом. Їхній табір перекриває вихід. Підійдіть до загону й почніть бій. Витрачайте очки дії на закляття та плануйте пересування: кожен хід важливий. Перемога принесе перше спорядження та підніме вас до 200-го рівня.'
  speak_body: 'Гобліни переможені, але ліс іще має зуби. Ядзін на ім’я Sceat спостерігав за боєм із мосту й не поспішає йти далі сам. Поговоріть із ним. Він шукає реліквію Гобадока, короля гоблінів, і потребує супутника, здатного дати відсіч.'
  invite_body: 'У Sceat є план. На жаль, він веде до найбільшого гобліна в лісі. Удвох шансів більше, особливо з різними вміннями. Відкрийте меню Sceat та запросіть його до групи. У цій пригоді ви керуєте обома героями й вирішуєте, як поєднувати їхні здібності.'
  switch_body: 'Супутник — це не просто ще одна смужка здоров’я. Sceat — Ядзін: він використовує пастки й позиціювання там, де Сенші покладається на силу. Виберіть його в перемикачі персонажів. Кожен герой має власні закляття та спорядження. Вибір героя важливий не менше за вибір закляття.'
  follow_body: 'Групу зібрано. Тепер варто триматися разом. Виберіть Сенші лідером та ввімкніть слідування за лідером у керуванні групою. Sceat ітиме за вами під час дослідження, тож не доведеться проходити ту саму дорогу двічі. У бою ви й далі самі обираєте рухи та закляття кожного героя.'
  guards_body: 'Гобадок не залишає вхід без охорони. Його вартові готові до бою, а вам треба узгодити дії двох героїв. Перевірте нове спорядження перед сутичкою. Поєднуйте силу Сенші з пастками Sceat: ворога на вигідній позиції часто легше здолати, ніж того, за ким доводиться бездумно ганятися.'
  boss_body: 'За вартовими чекає Гобадок із реліквією, яку шукає Sceat. Король гоблінів здобув свій титул не за поразки. Ви навчилися битися разом, але цей противник зовсім іншого рівня. Підійдіть до нього із супутником і дізнайтеся, на що здатен ваш новий союз.'

