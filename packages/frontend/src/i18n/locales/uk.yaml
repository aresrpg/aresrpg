    runic_blade: 'Руни тягнуться вздовж усього клинка, і жодні двоє науковців не погоджуються, що вони означають. Чарівник наполягає, що це старий діалект. Коваль наполягає, що це лише прикраса, вигляд якої йому сподобався. У самого клинка ніхто не питав.'
    runic_grimoire: 'Половина її сторінок містить справжні заклинання. Інша половина — скарги на магів, які раз у раз усе плутали, нашкрябані на полях рукою, яку в культі ніхто не зізнається впізнавати.'
    runic_ink: 'Бiолюмiнесцентне чорнило що зберiгає магiчний заряд. Використовується умiльцями для нанесення функцiональних рун.'
    runic_warden_blade: 'Руни квібеків слабше за все сяють на світанку — так само, як колись і церемоніальний спис, з якого це викували.'
    rustshore_cutlass: 'Клинок моряка, що бачив набагато більше шинкових бійок, ніж морських битв.'
    rusty_daggers: 'Правець це фiча а не баг. Кожен удар з безкоштовним ризиком iнфекцiї.'
    sabertooth_axe: "Iкло i є лезом. Руків'я тут лише для моральної пiдтримки."
    sabertooth_fang: 'Довше за кинджал. Гостріше за більшість дотепних відповідей. Коту воно вже було ні до чого.'
    salve_biscuit: 'Наполовину хліб наполовину бинт. Алхіміки кришать його в цілющу пасту. Смак ліків ефект чуда.'
    sandwraith_legplates: "Білі як кістка пластини, що з'явилися в пустельній гробниці разом із запискою 'БЕРІТЬ І ЙДІТЬ.' Ніхто не знає, хто залишив записку. Ніхто не хоче дізнатися. Пісок, що безперервно сиплеться зі стиків, не з жодної відомої пустелі, і замітати його марно — до ранку з'являється знову."
    sandwraith_reaper: 'Викопана напівзасипаною в дюнах. Її колишнього власника знайшли значно ретельніше засипаним.'
    sapling_bark: 'Знята з молодого квібека. Сама переформувалася в бронепанелі. Навіть мертва, ця деревина має амбіції.'
    sapling_bark_boots: 'Деревина технічно ще жива і технічно досі лютує через таку домовленість.'
    sapling_channeler: 'Виточений із паростка, що ще не визначився, ким хоче стати. Квібеки вважають увесь цей посох ситуацією із заручником. Ви вважаєте його зброєю. Цілком неправий тут ніхто.'
    sash_of_the_void_emperor: 'Найбільший з відомих Порожнеч-Метеликів носив це у свою останню линьку і більше не вийшов. Що замінило його в тій оболонці — ще не занесено в каталог, і каталогізатори не поспішають.'
    saurian_bow: 'Натягнутий достатньо туго, щоб звалити те, що донедавна активно на тебе полювало.'
    saurian_fang: 'Досить хватки, щоб втримати здобич, що пручається. І досить укусу, щоб це припинити.'
    saurian_gauntlets: 'Лускаті кісточки, запах багаття включено. Попередній власник НЕ погоджувався на цю переробку.'
    saurian_greataxe: ''
    saurian_ripper: 'Вирізаний із кістки, яка досі досить тепла, щоб нервувати ковалів.'
    saurian_scale: 'Товста, переливчаста, і несе легку вологу. Зброярі вплітають у водну броню. Хімчистка не рекомендована.'
    saurian_scale_helm: 'Старі ящіро-королі ніколи не розуміли, навіщо менші народи морочаться зі шоломами — їхній власний череп сам пробивав стіну. Вони вважали, що будь-хто в шоломі просто хизується. І, як визнає переказ, не так уже й помилялися.'
    saurian_staff: ''
    saurian_throwing_spear: 'Зрівноважений радше інстинктом дрейфового змія, ніж ремеслом. Кинутий раз, сам виправляє свій курс.'
    saurian_war_axe: ''
    saurian_war_harness: 'Обрізаний зі спорядження, побудованого для завра втричі більшого за будь-якого носія відтоді, поки зброяр невпинно бурчав про ремесло і гідність. Досі несе слабкий подих території, яку ніхто не наважився повернути собі.'
    saurian_war_horn: 'Вирізаний із горлянки, що не дихала десять тисяч років. Опівночі все одно лунає надто гучно.'
    saurian_waraxe: "Вирізана під кутом, який любили кам'яні королі, перш ніж заснути під глибинами; кажуть, вона пам'ятає старі рахунки краще за нові. У неї є тверда думка щодо черепів. Кого про це запитати — досі ніхто не знайшов."
    scale_mail_gauntlets: 'Кожну луску вирвано з раптора, що заперечував — гучно й довго.'
    scale_plate: 'Товста луска рептилії розміром з тарілку. Зброярі обожнюють. Раптор менш ентузіастичний щодо цієї домовленості.'
    scaled_hide: 'Крихітні лусочки, що ловлять світло. Шкіряники зшивають десятки разом. Це нудно. Вони скаржаться.'
    scar_iron: 'Залізо, вирване просто з оголеної породи Шраму, що досі тримає холод глибини, звідки походить. Ковалі дають йому зігрітися, перш ніж обробляти, — з поваги й легкого інстинкту самозбереження.'
    scar_maul: 'Виламаний зі шрам-каменю, важкого настільки, що замах ним відчувається як останній довід, який рані взагалі колись доведеться почути.'
    scar_sigil_amulet: 'Викарбуваний тією ж печаттю, яку Співці Шраму вирізьблюють у стінах розлому, покликаний відганяти все, що Рана надсилає, видираючись назад.'
    scar_suture_daggers: 'Змодельовані за ритуальними лезами Жерців Шва, достатньо тонкі, щоб закрити рану або відкрити її — залежно від кута. Жерці запевняють, що це завжди перше.'
    scarab_cleaver_axe: 'Формою — крило. Літає рівно так само добре, як справджувались інші обіцянки торговця.'
    scarak_chitin_belt: 'Жучині пластини, що зчіплюються, наче головоломка, зроблена комахою без хобі та друзів. Він затягується сам, досі коряючись останньому наказу вулика: стиснути.'
    scarak_cleaver: 'Вулик скараків тричі скликав раду, щоб повернути це. Усі три рази марно.'
    scarak_crown: 'Носити голову скарака на своїй голові. Тут є філософська рекурсія, про яку скараки точно не задумувались.'
    scarak_overlord_ring: 'Штатна видача вартовим гробниць. Не тьмяніє; в курганах ніщо не тьмяніє.'
    scarak_shell: 'Хітинова пластина, що клацає, коли щиглика. Непогана черепиця. Королева була б в люті, якби мала емоції.'
    scarak_shell_plate: 'Хітинові пластини, зібрані під час линяння. Скараки були в люті, але технічно голі, тож їхній протест не мав авторитету.'
    scarak_stinger: 'Вирвано прямо зi скарака та насаджено на палицю. Ще посмикується.'
    scarforged_alloy: 'Збитий на власному жарі Шраму, який ковалі ретельно ощаджують — Шрам не розігрівається на прохання.'
    scarforged_grips_of_first_dawn: 'Загартовані в холоді, що на світанку застоюється на дні розлому. Той холод ніколи до кінця їх не полишає, і власник привчається цього не помічати.'
    scarforged_legguards_of_last_ascent: 'Розплескані на власному ковадло-камені Шраму, що лишає в пластині ледь помітну хвилю, яку не бере жодне полірування. Ніхто вже й не пробує.'
    scarforged_resin: 'Сік, уварений на жарі Шраму, доки не застигне склисто й не триматиме шов краще за більшість металів. Він пахне, слабко й назавжди, вогнем, що його створив.'
    scarforged_tonic_of_last_ascent: 'Видається по одному ковтку на верхолаза для останнього ривка, з міркування, що той, кому потрібен другий ковток, однаково не завершить підйому.'
    scarforged_visor_of_first_dawn: 'Нахилене, щоб уловити перше світло, що коли-небудь перетнуло Шрам, — світло, яке ковалі звуть іншим. Ніхто їх не спростував, головно тому, що ніхто нічого їм не довів.'
    scarforged_warbelt_of_last_ascent: 'Застібається пряжкою, вирізаною з краю Шраму, тож ніколи не сходиться врівень. Щілина мала, і вона завжди на місці.'
    scarguard_helm: 'Статутний для кожного, хто стоїть на варті біля останньої стіни, забороло нахилене так, щоб власнику ніколи не доводилося довго дивитися просто на Рану.'
    scarhewn_axe: 'Відколота від власної розбитої стіни Шраму, лезо лишили таким само зазубреним, як і сама лінія розлому. Вона рубає так, ніби світ уже облишив опір.'
    scarwalk_leggings: 'Витерті до основи прочанами, які міряли край Шраму більше разів, ніж ці штани, чесно кажучи, були розраховані витримати.'
    schism_cuirass_of_last_tremor: 'Загартована того дня, коли лава Розбитого Солдата нарешті, офіційно, востаннє порушила стрій. Метал того ж дня перестав дзвеніти. Відтоді — жодного звуку.'
    schism_gauntlets_rift: "Ліва рукавиця пам'ятає хват Розбитого Солдата на щиті, якого більше не існує. Права рукавиця не тримала нічого взагалі. Носії мимоволі надають перевагу одному боку."
    schism_gauntlets_void: 'Пальці так і не прогріваються як слід. Зручно для нервів, жахливо для рукостискань.'
    schism_girdle_of_widening_crack: 'Сконструйований квартирмейстером Розбитого Солдата так, щоб працювати й після поломки — це або блискучий задум, або дуже сумний коментар щодо очікувань. Мабуть, і те, і те.'
    schism_greaves: 'Ліва й права поножа були викувані з двох різних Розбитих Солдатів, які ніколи не служили в одну епоху. Вони й досі не зовсім погоджуються щодо порядку маршу.'
    schism_resin: 'Сочиться з каменя, що розколовся навпіл і не пробачив жодній половині.'
    schism_sabatons_rift: 'Порожнеча просочується крізь підошви. Власники повідомляють про тепле серце й нестерпні пальці ніг.'
    schism_sabatons_void: 'Обважнені підошви, щоб розріджена гравітація не понесла тебе посеред кроку.'
    schism_signet_of_last_tremor: 'Перестала гудіти тієї миті, коли останній трем Розривника згас у його панцирі. Тепер вона просто холодно лежить на руці, що попередній носій вважав тривожнішим, ніж будь-коли було те гудіння.'
    schism_signet_of_widening_crack: 'Гравіювання щороку видовжується на волосину, простежуючи ту саму лінію розширення, що розколола первісну знаку рангу Розбитого Солдата. Ювеліри відмовляються оцінювати його вдруге.'
    scorch_grimoire: 'Грімуар, обкладинка якого постійно тепла на дотик. Сторінки всередині виглядають злегка обпаленими, але залишаються читабельними — що свідчить про те, що вогняна магія має власні стандарти збереження документів.'
    scorched_loaf: 'Спалений навмисне, і не смій натякати на інше. Оцей хрускіт — весь сенс, а не сором пекаря.'
    scorchtouch_grips: 'Усе, до чого торкаєшся, теплішає. Рукостискання стали дипломатичним інцидентом.'
    scrap_battleaxe: ''
    scrap_cuirass: "Нагрудник, зварений із різноманітних знайдених металевих шматків. Він захищає — у тому сенсі, що щось повинно пробити всі ці шари, перш ніж досягти плоті. З'єднання неймовірні, але тримаються — а це головне."
    scrawled_tome: 'Знайдений у Затопленому Нефі, де плавав; чорнило досі вологе після того, що човнярі присягаються було десятиліттям під водою. Останню сторінку ніхто не переклав; перші три відбили бажання.'
    scythe_of_the_abyss: 'Коли безодня простягає тобі зброю. Напрочуд гарний сервіс.'
    sealed_core: 'Осердя, викуване навколо уламка генези й запечатане так, як Оракул запечатує рану — щільно і з письмовою поміткою, що радить не відкривати.'
    senshi_starter_sword: "Це палиця. Ти примотав до неї руків'я. Нікого не обдуриш, особливо гоблінів, які точно розкажуть про це своїм друзякам."
    sentinel_gorget: 'Захищає шию. Що є напрочуд недооціненою стратегією виживання.'
    sentinel_teeth: ''
    sentinel_tooth: 'Хто знає, який бовдур підходить настільки близько до крокодила, щоб той йому зуби не повибивав? Але ми тут.'
    seraph_chain: 'Його схвалили розділеним рішенням, що пояснює закреслений пункт про гарантію.'
    seraph_heart_pendant: 'Цей амулет нерухомо розпускається сам собою. Він одночасно тут і в іншому місці, надіяний і викинутий, реальний і оспорюваний.'
    seraph_lance: 'Творець досі не впевнений, що завершив це правильно, що пояснює закреслений пункт про гарантію.'
    seraph_petal: "Чи це один матеріал, чи кілька — досі не з'ясовано, і звіт все одно подали — з усіма застереженнями."
    seraph_plume: 'Його чистоту оцінюють за рухомою, договірною шкалою, тож у реєстрі просто вказали обидва варіанти поряд.'
    seraphbound_casque_of_falling_crown: 'Ледь витримує ретельну перевірку, тож це все одно відправили, попри всі сумніви.'
    seraphbound_cordial_crown: 'Його післясмак — питання особистої думки, тож продається знизуванням плечима замість гарантії.'
    seraphbound_cordial_godbone: 'Його варили, щоб покласти край суперечці, — не вийшло, тож пийте на власний ризик, якщо формально.'
    seraphbound_longsword: 'Дизайн пережив три окремі заперечення, що є або суттю всього задуму, або просто похибкою округлення.'
    seraphbound_loop_of_broken_diadem: 'Дизайн пройшов через кілька непримиренних чернеток, що технічно правда і абсолютно некорисно.'
    seraphbound_resin: 'Його занесли як доказ у суперечку, яку так і не завершили, тож покупцям радять судити самостійно.'
    seraphbound_stompers: 'Носій присягається ним; усі інші сумніваються, тож дискусію відклали на невизначений термін.'
    seraphbound_vambraces: 'Його функцію визначили підкиданням монети, і суперечка пережила всіх, хто її розпочав.'
    seraphic_amalgam: 'Два окремі звіти описують це суперечливими термінами, про що дослідницька команда й досі сперечається.'
    seraphine_hauberk: 'Нотатки творця складаються суцільно з закреслених ідей, тож розбіжність тихо ввібрали в сам дизайн.'
    shadow_blade: ''
    shadow_knight_signet: 'Напис усередині перекладається приблизно як погроза. Лицарі тіні наполягають, що це обіцянка.'
    shadow_knight_visor: 'Прорізь для очей навмисно вузька. Лицарі тіні вважають периферійний зір моральною вадою.'
    shadow_stilettos: 'Викувані з світлопоглинних скалок. Ваші вороги не побачать навіть промаху.'
    shadowsteel_belt: 'Тримає штани і, нібито, твій смертний жах. Одне з цих тверджень не перевірене.'
    shadowsteel_morningstar: "Шипи п'ють світло, а не відбивають його, тож нічником вона вкрай нікудишня."
    shadowsteel_shard: 'Відламаний від обладунків, де темрява була не прикрасою, а несучою конструкцією. Ковалі беруть його щипцями, молитвою і тією особливою обережністю людей, які чули, що стається з тими, хто молитву пропускає.'
    shark_bone_choker: 'Намисто з акулячих хребців. Модне в прибережних містечках. Буквально жахливе будь-де інде.'
    shark_fin: 'Спинний плавець акули-молота. Торговців супом заарештовували й за менше.'
    shark_fin_saber: 'Зазубрена за подобою акулячих зубів. Акули, цілком зрозуміло, досі цим обурені.'
    shark_harpoon: 'Оснащений «етично здобутим» акулячим плавцем. Сама акула не погодилася б зі словом «етично».'
    shark_leather_belt: 'Груба настільки, що годиться за наждак. Акула цю метафору не пережила.'
    shark_mail: 'Луска з акулячого плавця, нашита на мітрилові кільця. Водостійка, акулостійка й неабияка тема для розмов.'
    shark_scale_tassets: 'Луска з акулячого плавця на стегнах. Тепер ти обтічний під водою. Юридично — риба.'
    shark_vertebra_ring: 'Один-єдиний хребець акули, відшліфований. Щелепа, з якої він походить, технічно, досі полює.'
    sharkhide_fists: 'Акуляча шкіра, обгорнута навколо торієвих пластин. Шорстка текстура заодно згодиться як тертка для сиру.'
    sheep_eye: 'Відторгнуте око Вовлігана набагато менш лякає, коли воно не може кліпати — а це, як виявляється, завжди.'
    shellguard_mitts: 'Підбиті крабовим хітином, досить товстим, щоб глушити і удари, і дрібну моторику. Пальці цілі, спритність — ні, а те, що лишилося під панциром, майже неможливо вбити.'
    shiny_barley: ''
    shoddy_spear: 'Загострена палиця з iлюзiями вiйськової служби. Наконечник хитається але вiдданiсть це все.'
    shore_amulet: 'Вирізаний з панцира краба, який ущипнув не того рибалку. Пісок всередині брязкає, коли наближається небезпека. Або коли ви йдете. Різниці він не бачить.'
    shore_finns: 'Панцир великих крабів, перетворений на міцні наголінники, що тихо потріскують від запаху морської солі та припікаючого сонця.'
    shore_mace: 'Обросла морськими жолудями, що додають текстури та ризику правця.'
    silentedge: "Не видає звуку ні при вихопленні, ні при змаху, ні при ударі. Саме тишу опісля люди й запам'ятовують."
    silk: "Нитки бездоганної якості, гладкі як вода та міцніші за ланцюги. Шкода через вузли — вони міцно тримають, але родинні зв'язки ніколи не мали піддаватися таким випробуванням."
    silk_boots: 'Неймовірно легкі, виткані з шовку павуків, підкуплених мухами для співпраці. Домовленість тривала рівно стільки, щоб закінчити одну пару. Підмайстер шевця досі на терапії.'
    silk_bound_lexicon: 'Зшитий ниткою кокона шовкопряда. Половина заклинань нечитабельна iнша небезпечна.'
    silk_cocoon: 'Напівсформований і липкий. Всередині — або личинка, або, що тривожно, ваш обід.'
    silk_cowl: 'Зіткана з істот, що все життя ширяють у висхідних потоках і жодного разу не глянули вниз.'
    silk_gloves: 'Вершина моди для тих, хто жодного дня не працював, і чия кров значно тепліша за їхні руки.'
    silk_leggings: 'Легкий, як вітерець. Міцний, як те, що той вітерець спершу породило.'
    silk_tunic: 'Зіткана печерними павуками, що працюють лише в цілковитій темряві й тиші.'
    silk_woven_gauntlets: 'Такі легкі, що забуваєш про рукавиці. Згадаєш у найгірший можливий момент.'
    silkamu: 'Зіткано з ниток, які жоден павук не віддав добровільно. Павуча профспілка оголосила нагороду за голову ткача, з оплатою мухами.'
    silkling_stingers: 'Майже мікроскопічні шипки гарантують, що рани гнитимуть тижнями — що, мабуть, і було метою.'
    silkwinder_lance: 'Спис, древко якого обмотане зачарованими шовковими нитками. Шовк поглинає вібрації ударів, роблячи кожен удар плавнішим — що є елегантним способом сказати, що спис не тремтить у руці після того, як пронизав когось.'
    silt_wrapped_core: 'Ремісниче осердя в мулистій оболонці, яку треба розколоти, щоб скористатися, і яка відновлюється за ніч, якщо лишити її надто довго між роботами.'
    silt_wrapped_cuirass_of_quiet_drowning: "Вкрита мулистою шкаралупою, що на сухому твердне на камінь, а на вологому м'якшає, — що у Вельді означає, що вона завжди, тихцем, у стані переходу."
    silt_wrapped_gauntlets: 'Вкриті мулом, що твердне на кістянках, тож перший удар кулаком доставляє й жменю дна Вельду.'
    silt_wrapped_greaves: 'Мулиста шкаралупа додає вагу каменя до кожного кроку, яку власник перестає помічати десь тоді, коли її помічають усі інші.'
    silt_wrapped_lance: 'Його мулиста шкаралупа відколюється від першого удару й забирає з собою увагу ворога, чим користується другий удар.'
    silt_wrapped_maul_of_quiet_drowning: 'Його мулистий кожух додає вагу каменя і, від удару, невеликий сплеск дна Вельду, тож кожен удар лишає по собі трохи домівки.'
    silversteel_saber: 'Виблискує за будь-якого світла. Приваблює увагу — здебільшого ту, якої ви намагалися уникнути.'
    sky_shard: "Затверділий шматок грозової хмари. Плаває, якщо відпустити. Арканісти прив'язують до посохів. Гравітація ображена."
    sky_shard_diadem: 'Носить той, хто востаннє тримав попелястий штандарт. Ця посада часто змінюється.'
    skybound_ring: 'Обпалений у вогняних ямах, аж поки метал не забув усе інше.'
    skyburial_bow: 'Функціонує з застереженням, про що носій вирішив більше не думати.'
    skyburial_leggings: 'Носій присягається ним; усі інші сумніваються, тож носій перестав про це питати.'
    skyheld_carapace_of_hollow_throne: 'Його завершили суто з упертості, рішення, ухвалене під значним тиском часу.'
    skyheld_claymore_of_last_regent: 'Працює, але лише якщо не питати чому, тож питання наразі залишається невирішеним.'
    skyheld_crest_of_hollow_throne_crown: 'Його ефективність жодного разу не перевірялася незалежно, що ніхто не може підтвердити, не розпочавши суперечку знову.'
    skyheld_crest_of_hollow_throne_godbone: 'Той, хто це створив, передумав на півдорозі, рішення, яке майже нічого не вирішило.'
    skyheld_halberd_of_hollow_throne: 'Його завершили попри одностайне вагання, тож первісну суперечку визнали нічиєю.'
    skyheld_stilettos_of_hollow_throne: 'Творець досі не впевнений, що завершив це правильно, тож це все одно відправили, попри всі сумніви.'
    slackline: 'Насправді ніколи не слабне. Так його називав попередній власник — якраз перед тим, як це перестало бути правдою.'
    slag_clinker: "Те, що піч виплюнула, вирішивши, що з чимось покінчено. Шахтарі все одно це збирають — відходи, каже старе прислів'я, це просто руда, яку не попросили ввічливо."
    sloth_fur: "Неймовірно м'яке і пахне мохом та терпінням. Кравці обожнюють. Слотіан просто дуже повільно зітхнув."
    slothian_wisdom_stone: 'Камінь, порослий мохом, що гуде давніми знаннями. Він знає відповіді. Просто вважає, що ви не готові.'
    smoldering_wheat: ''
    solomonk: 'The cowl of a monk who traded three vows of silence for one very loud hat.'
    soul_binder: "Здобутий з того, що лишається, коли мерця нарешті впокорено. Утримує разом спорядження, зв'язане з духами."
    soul_shard: 'Кристалізований уламок, вирваний з мерця посеред обряду. Й досі бринить чимось незавершеним.'
    soul_shard_loop: 'Тримає скалку чогось, що ще не пішло остаточно.'
    soulbinder_scepter: "Несе частку того, що Аудитори Душ зв'язують біля брами внизу, гудячи позиченою сталістю. Попелястий Пророк використовував його, щоб ставити запитання, на які мертві зазвичай не відповідають двічі."
    soulking_spellbook: ''
    sounding_hull_key: 'Врятований з уламків, які досі патрулює Вартовий Корпусу. Він тихо гуде щоразу, коли міняється приплив, ніби відлічує до чогось.'
    spark_pendant: 'Полонена іскра, надто вперта, щоб знати, що мала згаснути десятиліття тому.'
    spark_ring: 'Мідний обідок із серцем-магнітом, що сипле іскрами щоразу, як власник злий, тривожний або надто напружено думає про вечерю. Чарівник назвав це кільцем настрою. Село називає це пожежною небезпекою.'
    spectral_arcanize: ''
    spectral_edge: 'Наполовину в цьому світі, наполовину в наступному. Митниця на кордоні дуже прискіплива.'
    spectral_essence: 'Дистильована від самого Бездушного Регента. Пахне порожнечею між зірками. Абсолютно руйнівна ринкова вартість.'
    spectral_fang_daggers: 'Виковані зі скупчених привидних скарг. Кожен удар — із детальною претензією в комплекті.'
    spectral_ruin_blade: 'Викований з панцира Порожнеч-Метелика, тонкого настільки, щоб просвічувати при належному світлі, і тонкого настільки, щоб різати за будь-якого світла. Привиди колишніх власників часом дають непрошені поради.'
    spice_rusk: 'Двічі випечена й настільки ароматна, що зброярі витоплюють з неї олію зовсім не для випічки.'
    spicebark_bread: 'Один укус — і всі носові пазухи в радіусі трьох столів здаються без умов.'
    spider_fang_club: ''
    spider_fang_daggers: 'Парні клинки з кристалізованої отрути, що ледь чутно гудуть, коли насувається насильство.'
    spider_leg: 'Керуйтеся обережно, хіба що вам до вподоби відчуття невидимих павуків, що повзають під шкірою тижнями.'
    spider_silk_gland: 'Драглистий орган, що виробляє нитку міцнішу за сталевий дріт того ж діаметра. Все одно поводьтеся з ним обережно.'
    spider_silk_grips: 'Не відпускає те, що тримає. Чудово в бою, катастрофічно під час рукостискання.'
    spider_silk_treads: 'Практично безшумне взуття з шовку печерних павуків. Ідеальне для стелсу, жахливе для оголошення присутності на вечірках. Шовк іноді прилипає до поверхонь — конструктивна вада чи остання помста павука.'
    spider_thread_pants: 'Спрядена з нитки, яку жоден павук добровільно не віддавав. Про етичне походження й не йшлося.'
    spine_daggers: 'Вирощені якоюсь Елорі заради жорстокості, не милосердя. Історія не зафіксувала, що перемогло.'
    spine_gauntlets: 'Голки іклача на шкіряних долонях. Кожне рукостискання стає переговорами. Кожне поплескування по спині — оголошенням війни. Виготовлення передбачало витягування голок з дуже розлюченої істоти, що пояснює залишкову образу рукавиць.'
    spine_pants: 'Зміцнені колючками маленької істоти з дуже чіткою думкою щодо того, щоб на ній сиділи.'
    spore_cracker: ''
    stabilizing_agent: 'Не дає летким сумішам перетворитися на позапланові вибухи. Про невдалі партії не говорять.'
    staff_of_the_deep: "Витягнутий із затопленого храму, чиє зведення давно стерлося з пам'яті. Черепашки — найменш дивна деталь тут."
    stamina_tonic: 'Мiнеральний стимулятор що переконує ноги що вони не втомилися. Ноги знають краще але пiдкоряються з хiмiчного страху.'
    starter_staff: 'Цей потертий бамбуковий посох провів незліченних мандрівників через болота та пустища. Цікаво, що він однаково добре слугує як опора для ходьби і як імпровізований урок скромності.'
    starter_weapon_ikari: 'Товста, тупа і незграбна — усе, чим майстерська зброя не повинна бути. Нею можна забити ворога до смерті, якщо, звісно, ви спершу зможете підняти її вище плечей.'
    steadyhand: 'Зупиняє тремор, який Шрам зрештою дає кожному. Лише руку. Решта тремтіння — вже ваша проблема.'
    steel_cuirass: 'Попередній власник залишив адресу для пересилки. Ніхто досі не наважився її перевірити.'
    steel_flail_sword: 'Гнучкий сутінково-кований клинок, обгорнутий щетинокольчугою. Гнеться, як обіцянка, яку ніхто не збирається тримати.'
    steel_gauntlets: 'Пальці бездоганно згинаються в темряві й ціпеніють, щойно їх торкне сонце.'
    steel_greaves: 'Останній витвір лицаря тіні перед тим, як піти на спокій розводити бджіл у цілковитій темряві.'
    steel_incandescent_sword: "Викуваний за такого жару, що коваль, кажуть, десь у гартуванні загубив власне ім'я. Клинок пам'ятає той жар досконало. Що він тоді втратив, клинок йому так і не повернув."
    steel_longsword: 'Звичайний сталевий довгий меч, що звичайно виконує свою функцію. Жодних прокльонів, магічних властивостей, трагічної історії. Він ріже те, що йому подають, і залишається чистим після швидкого протирання. Колекціонери ігнорують його. Ті, хто вижив, обирають його.'
    steel_recurve: 'Тятива з жили альфа-вовка, що ледь напинається щоразу, коли ви брешете про силу натягу.'
    steel_treads: 'Викувані під час затемнення лицарем, що вимагав цілковитої тиші й майже її досяг.'
    steel_warhelm: 'Така темна, що поглинає компліменти разом зі світлом. Забрало відчиняється лише зсередини — чийсь жарт.'
    stitched_trousers: 'Штани, зшиті з кількох різних шматків шкіри, кожен зі своєю власною історією. Шви видимі та навмисні — виробник вважає видимий ремонт ознакою чесності. Деякі власники стверджують, що чують шепіт у швах у ночі повного місяця.'
    stoneheart: 'Холодна на дотик у будь-яку годину, будь-якої пори року, хай що відбувається з тим, хто її носить.'
    stormfeather: 'Перо, що іскрить при струшуванні. Маги бурі вплітають їх у палички. Поштарі відмовляються доставляти.'
    stormfeather_daggers: "Пір'я штормового яструба, вплетене в сталь, аж поки метал не забув, що колись був чимось іншим. Кожен удар приходить із гуркотом грому бурі, що давно пішла собі далі без нього."
    stormfeather_longbow: 'Кожна стріла тріщить перед пострілом. Кожен лучник присягається, що так і задумано.'
    stormfeather_loop: "Сплетена з пір'я, що не перестає потріскувати. Рукостискання тут супроводжується маленьким винуватим ударом струму."
    stormhowl_bow: 'Кожна стрiла кричить до цiлi. Сусiди скаржилися.'
    stormtide_coif: 'Не може вирішити, для водних магів він чи для земляних лицарів. Служить обом неохоче.'
    stormwalker_boots: 'Проходять крізь будь-яку бурю без нарікань. Черевики, не власник — той нарікає безупинно.'
    stormweave_leggings: 'Посіріли від зношення, а не від фарби. Первісний колір загубився десь у минулому.'
    stumpwork: 'Створений для дерев, що пережили рану лише наполовину. Довершити справу виявилося стабільною, надійною роботою.'
    suize_flour: 'Кристалічна і настільки світлоловка, що пекарі присягаються — хліб від неї смакує дорожче.'
    summit_alloy: 'Найміцніший сплав, який горно вершини здатне втримати, перш ніж здасть саме горнило. Ковалі знають точну температуру й ніколи її не записують.'
    summit_cuirass_of_sealed_wound: 'Припасована над швом, який Жерцям Шва було найважче стягнути, тож власник носить це латання при собі. На грудях воно тримається краще, ніж трималося на Шрамі.'
    summit_draught: 'Зварений проти запаморочення, що охоплює верхолазів біля вершини, де повітря рідшає, а розум починає торгуватися з прірвою. Пий, доки перемовини не почалися.'
    summit_extract: 'Витягнута з вершинного моху під тиском, настільки концентрована, що одна крапля робить роботу цілої флящини й коштує приблизно стільки ж, щоб її поповнити.'
    summit_girdle_of_summit_vigil: 'Затягнутий, щоб тримати вартового на ногах крізь варту, яку ніхто не мав пережити стоячи. Він утримав трьох останніх; сентиментів із цього не робить.'
    summit_greaves: 'Посилені на гомілці для останнього відрізка сходження, де гора перестає давати опори й починає забирати їх назад.'
    summit_helm_of_summit_vigil: 'Видається тому, кому випадає найдовша варта на вершині, з міркування, що важчий шолом не дає голові куняти. І не дає. Здебільшого болем.'
    summit_ore: 'Адамант, добутий на самій вершині, де руда найближча до того, з чого гора складається під низом. Важкий так, ніби це навмисно.'
    summit_sabatons_genesis: 'Обшиті пластинами поверх підошов, які ковалі присягаються були найпершими коли-небудь скроєними. Правда це чи ні, вони ступають так, ніби їм більше нема чого доводити.'
    summit_sabatons_scar: 'Підковані для опори на шрам-камені, що зсувається під ногою з терплячістю чогось, що чекає, доки ти йому довіришся.'
    sundered_casque: 'По лобі йде тріщина. Коваль зве її «каналом розвантаження напруги». Коваль бреше.'
    sundered_charm: 'Половина медальйона підрозділу Розбитого Солдата — з тих, що видавалися парами, які ніколи не мали розлучатися. Друга половина десь там, і, певно, досі намагається завершити пару.'
    sundered_chausses_of_screaming_rift: 'Колінна стійка останнього наказу Розбитого Солдата, замкнена в суглобі тим, що довершило роботу розлому. Щоб підвестися, щоразу потрібне свідоме рішення.'
    sundered_cordial: 'Не ліки. Пауза. Скористайся нею, щоб переглянути те, що привело тебе сюди.'
    sundered_cordial_of_long_collapse: 'Видається Розбитим Солдатам, які, формально, ще в списках. Лікує, що може, і чесний щодо решти.'
    sundered_elixir_of_screaming_rift: 'Останнє, що варить підрозділ Розбитих Солдатів, перш ніж перестати бути підрозділом. Гучний на смак. Тихий опісля.'
    sundered_sash: 'Єдина частина спорядження Розбитого Солдата, що ніколи не розпадалася, хай як ретельно розпалося все інше в цій історії. Тримає. Просто тримає.'
    sundered_stompers_of_long_collapse: 'Кожен крок падає, як вирок, якого військовий трибунал Розбитого Солдата не встиг ухвалити. Повільний, зважений і цілком остаточний, наскільки дозволяє гравітація.'
    sundered_stompers_of_screaming_rift: 'Розлом унизу відповідає на кожен крок Розбитого Солдата, що доволі сильно псує сенс уроків непомітності. Несподівані появи структурно виключені.'
    sundered_vambraces_of_long_collapse: "Пристебнуті для переклички, що її так і не довели до кінця. Руки пам'ятають стійку готовності навіть тоді, коли розум давно цього не хоче. Витривалість без кінця — усе ще, технічно, витривалість."
    sundered_vambraces_of_screaming_rift: 'Товсто підбиті над «вухами» руки, що не має анатомічного сенсу, поки не згадаєш, чиєю ця рука була. Блокує звук майже незгірш за клинки.'
    sunglass_shard: 'Вирізаний зі скла, сплавленого двома сонцями, які більше ні в чому не згодні.'
    sunken_mere_key: 'Витягнутий з-під криги, де спить Мороз-Дракон, холодний настільки, щоб за секунди заніміти голу руку. Повернути його виявилося легше, ніж усі очікували, і нікого це не заспокоює.'
    sunscale_chopper: 'Лезо з лусок, що напились сонця так, що світять ціле покоління гекон.'
    sunscale_cuirass: 'Кіраса з виблискуючих лусок, що захищає від сталі та заклять, якщо не спечешся всередині.'
    sunwarmed_ring: 'Досі зберігає тепло ящірки, якій воно, з усією повагою, більше не знадобиться.'
    sunwarmed_scale: 'Широка пластинчаста луска попелошкірої ящірки, досі тепла ще довго після того, як та ящірка пішла.'
    surimi: 'Ця священна реліквія Сурімі пульсує давньою силою, її поверхню відполірували дотики давно загиблих паломників. Дивно, що святість так підозріло нагадує перероблені морепродукти.'
    suture_belt: 'Затягнутий так, як Жерці Шва затягують рану, перш ніж вона встигне розширитися. На талії діє приблизно так само добре, як і на Шрамі.'
    suture_loop: 'Зігнута в замкнуту петлю так, як Жерці Шва замикають усе, за теорією, що Шрам не може розпустити те, що ніколи не лишали відкритим.'
    swamp_conduit: 'Спрямовує болотну воду в щось приблизно магічне. Запах цілком буденний.'
    swamp_scale: 'Темно-зелена і вічно слизька. Крокодил виростив запасну. Шкіряники приймають з видимою неохотою.'
    swamp_trident: 'Три зубцi з корозiйного металу iдеальнi щоб наколоти те що вилазить з болота.'
    swampfire_grips: 'Кілька найгірших рішень в історії просто вбилися в цю шкіру.'
    talokan_aero_tail: 'Смарагдовий і отруйний. Колір сам виконує роботу попереджувального знаку — задарма.'
    talokan_pearl: 'Глибоководна перлина, яку талокани носять як валюту. Слабо блакитно світиться під водою. Наземні торговці приймають неохоче.'
    talokan_sting_daggers: 'З коралових крайок i солоною кiркою. Пахнуть вiдливом i жалем.'
    talokan_tail_nakwa: 'Кожен шкіряник хоче собі таку. Пальців після спроби повертається менше, ніж хотілося б.'
    talokan_tide_ring: 'Зроблене зі спресованої морської солі та талоканської перлини. Розчиняється, якщо плаваєш. Не плавай.'
    talokan_trident: 'Кораловий наконечник регенерує мiж боями. Природа потурає вашим звичкам.'
    tanjirize_flour: 'Пряне борошно, що робить все агресивно ароматним.'
    tanjirize_rod: 'Ціпок прочанина, який підійшов надто близько до Рани й повернувся зміненим. Для ходьби він досі чудово годиться. Тепер він робить і дещо інше.'
    tanned_girdle: 'Ремінь зі шкіри, дубленої на сонці, загартований часом і кліматичними умовами. Він не має магічних властивостей і не претендує на них. Він одночасно утримує штани і нутрощі на місці — що вже більше, ніж роблять більшість предметів спорядження.'
    tectonic_severance: 'Легенди кажуть, коваль, який кував цю зброю, розколов гору пробним ударом. Гора подала в суд.'
    temperedglass: 'Листи хорового скла, що витримують будь-яку піч. Пироги однаково прилипають — такий закон.'
    tempering_flux: 'Алхiмiчний флюс що знижує температуру плавлення рiдкiсних металiв. Ковалi буквально не можуть кувати без нього.'
    tempest_requiem: 'Кожна стріла несе маленьку грозу, яку Попелястий Пророк побачив за три вірші до її приходу. Додана дальність — не сила. Це знання, де стоятиме вітер.'
    tempest_whisper_bow: 'Лук натягнутий нiттю з небесного уламка. Стрiли летять так швидко що прибувають ранiше звуку.'
    terminal_casque_genesis: 'Носиться Глибинними Ревізорами, поки вони сперечаються про найдавніші записи. Товсто підбитий, бо суперечки тягнуться й подеколи доходять до бійки.'
    terminal_casque_scar: 'Останній шолом, який колись викувала збройня стіни, бо за цією висотою немає ні більшого розміру, ні наступного власника, якому він мав би знадобитися.'
    terminal_chausses_of_origin_line: 'Скроєні для ноги, що має намір дійти до межі й там спинитися, і пластини це втілюють, роблячи біг по-справжньому неприємним.'
    terminal_cordial_of_final_scar: 'Тримали в лазареті стіни для безнадійних випадків, а потім виявили, що вона до незручності добре діє й на не безнадійні. Репутація змінилася відповідно.'
    the_tenderizer: 'Продавався останнім різникам Шраму як кухонне начиння. Перепрофільований майже миттєво. Виробник більше не коментує.'
    thick_ursine_hide: 'Одна шкура, один повний обладунок, один ведмідь, що скаржиться на тому світі.'
    thickskull: 'Комплімент був буквальним. Він врятував більше життів, ніж закляття, вшите в підкладку.'
    thorium_warhammer: 'Оздоблений iклами рекса та змiцнений акулячим плавцем. Замiнює витонченiсть грубою силою. Результати говорять самi за себе. Голосно.'
    thorium_warplate: 'Штатна видача тому, хто ще тримає колону разом. Нині рідкість.'
    threefold: 'Викувана коваль раз, і ще двічі згорнута чимось, що ковалем не є. Ніхто не питав, чим саме.'
    throatlatch: 'Застебнутий першим носієм і відтоді жодного разу не розстібнутий. Застібка досі працює. Ніхто не перевіряв.'
    throneless_cleaver_of_rotting_halo: 'Майстерність бездоганна; передумова — ні, компроміс, досягнутий, коли всі облишили сперечатися.'
    throneless_draught_of_gilded_ruin: 'На смак — як поспішне рішення, і виготовлювач досі відмовляється визначитися.'
    throneless_extract: 'Ніхто не може напевно сказати, звідки це взялося, тож обидва записи так і залишаються неузгодженими.'
    throneless_gauntlets_of_gilded_ruin: "Його викували під час суперечки, яку ніхто не виграв, а другий чернетковий варіант так і не з'явився."
    throneless_lattice: 'Його занесли як доказ у суперечку, яку так і не завершили, і звіт все одно подали — з усіма застереженнями.'
    throneless_pendant_crown: 'Носій наполягає, що воно працює; докази непереконливі, повернень немає, подальші питання не приймаються.'
    throneless_pendant_godbone: 'Ніхто не підтвердив, що воно робить те, що заявлено, факт, який творець вважає перевагою.'
    throneless_sabatons_of_gilded_ruin_crown: 'Працює, але лише якщо не питати чому, розрізнення без особливої різниці.'
    throneless_sabatons_of_gilded_ruin_godbone: 'Його історія походження змінюється залежно від того, хто розповідає, і жодні документи цього не відображають.'
    throneless_sabatons_of_rotting_halo: "Його створили, щоб довести думку, яку ніхто вже не пам'ятає, виноска, яку творець так і не написав."
    tide_shard: 'Кристалізований уламок живого океану, що безперестанку скрапує. Пахне сіллю й незакінченими справами.'
    tide_throne_key: 'Відлита з коралу, що твердне лише нижче лінії відпливу. Потоплений Регент і досі тримає там свій двір — і досі чекає, що ключ повернуть.'
    tidebinder_cord: "Зав'язана з моряцькою точністю та дещицею магічної некомпетентності."
    tidebound_band_of_brackish_deep: 'Тьмяніє й ясніє за циклом, що не має нічого спільного зі зношенням, який власник зрештою перестає звіряти з припливом, якого нібито немає.'
    tidebound_breastplate_of_brackish_deep: 'Викуваний у воді, надто солоній, щоб пити, і надто прісній, щоб щось зберігати, — компроміс, який нагрудник носить як слабкий, незмінний запах.'
    tidebound_core: 'Осердя, що важчає й легшає за повільним циклом, який жоден майстер ні з чим не зіставив, а надто з припливом, що його наявність Вельд заперечує.'
    tidebound_grips_of_silt_throne_matron: 'Виловлені з утопленого двору й ніколи не знесолені, вони лишають блідий білий відбиток на всьому, чого власник торкається довго.'
    tidebound_grips_of_silt_throne_mire: 'Латні рукавиці, вилучені з утопленого двору, досі зігнуті у хваті довкола чогось, що мул давно забрав.'
    tidebound_treads_of_brackish_deep: 'Вичинка в солоній воді лишила їх навіки вологими й навіки безшумними, — чесний обмін у місці, де звук приваблює зуби.'
    tidebound_treads_of_silt_throne: 'Дворове взуття, зроблене, щоб стояти цілком нерухомо на церемоніях, тепер ідеальне, щоб стояти цілком нерухомо, поки повз проходить щось велике.'
    tidebound_visor_of_brackish_deep: 'Взялося соляною кіркою від носіння там, куди сягає приплив, який Вельд заперечує, а корозія заборола підтверджує.'
    tidebound_visor_of_silt_throne: 'Вилучене із замуленої зали, яку провідники Вельду досі звуть тронною, радше за звичкою, ніж за доказом, що там колись був трон.'
    tidecaller_mail: 'Дзвенить як буй у шторм. Союзники завжди знають, де ти. Вороги теж.'
    tideflame_treads: 'Чоботи, наповнені і крижаною, і попільною есенцією. Ліва нога тепла, права — холодна. Баланс досягнуто.'
    tidesurge_leggings: 'Мерехтять як океан на заході. Пахнуть як океан під час відпливу.'
    tidewalker_soles: 'Ходиш по воді. Не буквально. Але достатньо, щоб дратувати фізиків.'
    timberfall: "Розрахований звалювати скам'янілі дерева, які лишила стояти рана. Так само непогано працює на всьому, що колись було людиною."
    timberwolf_legguards: 'Наголінники з вовчим хутром, які тримають ноги в теплі взимку і перегрівають у будь-яку іншу пору. Візерунок хутра рухається у світлі вогню, створюючи тривожне враження, що щось ще живе всередині і просто чекає свого часу.'
    tin_cap: 'Крихітний купол, що міняє розум на живучість. Переживеш власні геніальні ідеї.'
    titan_bear_moss: 'Мох, що ріс у живому хутрі титанового ведмедя. Просякнутий століттями енергії верхівкового хижака. Друїди дичавіють.'
    titan_koa_greaves: 'Цупка шкіра титанового коа, оформлена в поножі. Вони квакають, коли ти згинаєш коліна.'
    titan_koa_lance: 'Три зими простояв на межі могил. Досі вказує в той самий бік.'
    titan_koa_stompers: 'Створені для багна, не для тиші. Колона ніколи не мала бути тихою.'
    titan_koa_warspear: ''
    titan_shell_hauberk: 'Виварена й розплющена молотом. Те, що носило її раніше, й досі лишає запах.'
    title_veteran: "Press this searing brand against your flesh to prove you're a veteran and it'll be granted to you for life — because nothing says 'battle-hardened warrior' like voluntary third-degree burns."
    tokek_paw: 'Відірвана лапа гекона-токея, ще ледь тепла, що хапає порожнечу.'
    tome_of_elemental_spite: ''
    tome_of_oblivion: 'Останній розділ пишеться сам, поки ти читаєш, з того пилу, що лишає Порожнеч-Метелик, коли перестає існувати посеред речення. Критики згодні хоча б у тому, що фінал чесний.'
    tool_herbalist: "Вершина сільської елегантності — якщо ваш стиль називається 'забруднене відчаєм'."
    totem_club: 'Різьблений символами, яких не прочитає жоден живий. Вдар достатньо сильно — і вони наче самі перекладаються.'
    training_battleaxe: 'Тренувальна бойова сокира з загартованого дерева, що імітує вагу і баланс справжньої сокири без фатального недоліку гострих країв. Ідеальна для навчання правильній техніці. Інструктори наполягають на слові тренувальна. Новобранці регулярно його забувають.'
    training_helmet: 'Захищає вiд легких вiтрiв i рiзких образ. Бойовий захист: теоретичний.'
    tremor_brew_of_nine_faults: 'Відновлює здоров’я і залишає легкий постійний тремор в обох руках. Кажуть, у підсумку в плюс.'
    tremor_crest_of_fifth_breach: 'Постійно ледь вібрує. За тиждень ти перестаєш це помічати. Оце й проблема.'
    tremor_fists_of_nine_faults: 'Завдають удару, а тоді ще трохи дрижаків. Це «ще трохи» вимкнути не можна.'
    tribal_cudgel: "Обмотаний тотемними оберегами, що каналізують духів, які, кажуть, судять кожен замах не менш за форму, ніж за силу. За всіма свідченнями, вони й досі незворушні. Кийок б'є однаково сильно, хоч би що вони собі думали."
    tribal_summoner_totem: 'Племінний тотем для виклику, що спілкується з духами предків через систему ритмічних ударів. Духи відповідають. Не завжди те, що просили, але відповідають. Різниця між тим, що закликають, і тим, що отримують, становить цілу усну традицію в цьому племені.'
    tribal_totem: 'Вирізаний кістяний фетиш, що потріскує залишковою силою. Вождь ніс це в бій. Йому це не допомогло.'
    truelength: 'Виміряна за власним передпліччям коваля — міра, що померла разом із ним. Меч лишається єдиним її втіленням.'
    truestrike: 'Тримають прочани, навчені, що Шрам винагороджує переконання більше за влучність. Клинок мовчки не погоджується — щоразу.'
    truffle_essence_compound: ''
    tusk_bludgeon: 'Палиця з iклiв кабанчика. Кабанчик помер природно. Природно ви це спричинили.'
    tusk_buckle_belt: 'Пряжка — справжній ікло. Шкіра пахне чимось, що кинулось на вас і програло. Застібання потребує короткої боротьби, яку пояс виграє приблизно вдвічі.'
    tusk_ivory: 'Щільна кістка бивня бородавочника. Різьбярі вирізають з них шахові фігури, бо, мабуть, це ринок.'
    tusker_musk_gland: 'Виробляє запах, здатний очистити кімнату, будівлю або невеликий район. Алхіміки добувають з неї феромони.'
    twine_belt: 'Сплетений з усього, що росло при дорозі. Тримається на чистому впертості та вузлі, який не визнав би жоден моряк. Попередній власник обрав гравітацію.'
    tyrants_gavel: 'Ним виносили вирок дезертирам. У цих багнах їх було чимало.'
    ukranize_flour: 'Змелене зі зерна, що подолало сотню поганих врожаїв, аби потрапити сюди, це борошно випікається у хліб настільки міцний, що одне село, кажуть, ціле покоління використовувало залишки як дверний упор.'
    uncertain_bow_range: 'Лук, що стріляє на відстань, але сперечається про те, чи є відстань реальною. Його стріли досягають цілей лише з теоретичної необхідності.'
    underweald_casque: 'Призначений для ярусів під корінням, де темрява цілковита, а єдина справжня робота шолома — не дати тобі розколоти власний череп об стелю.'
    underweald_charm: 'Вузол із кореня й кістки, що, як присягаються провідники, відганяє те, що внизу. Його жодного разу не випробував той, хто повернувся підтвердити.'
    underweald_elixir_of_fen_below: 'Зварений з того, що росте на дні Нижнього Фену, добре гоїть і смакує точнісінько тим місцем, звідки походить.'
    underweald_hauberk_matron: 'Внапусток викладена лускою, яку Матрона Глибин скидає сотнями, — звучить щедро, доки не дізнаєшся, що вона робить із кожним, хто її збирає.'
    underweald_hauberk_mire: 'Сплетена з болотяного заліза, що ніколи не іржавіє, бо ніколи не бувало сухим досить довго, щоб почати, — властивість, яку ковалі продають як перевагу.'
    underweald_loop: 'Проста коренева каблучка з нижніх ярусів, яку провідники носять як відзнаку, що означає, грубо кажучи, «спускався туди й повернувся».'
    underweald_stompers_of_rising_tide: 'Обтяжені, щоб утримати опору в течії, бо тут, унизу, дно — це пропозиція, яку вода вільна відхилити.'
    ursine_heart: "Важить вісім кілограмів і все ще випромінює тепло. Чарівники прив'язують до захисних амулетів. Ведмеді робили це безкоштовно."
    ursine_signet: 'Втискається у віск бланків реквізиції. Віск ніколи не застигає як слід.'
    ursine_totem_club: ''
    velkarion_breath_weapon: 'Камінне залізо, що колись ворушило саме велике вогнище. Має власну думку про те, як ти складаєш розпал.'
    velkarion_ember: 'Скалка полум я самого дракона, що зберігається в слоїку з-під варення. Якщо згасне — доведеться розпалювати весь собор заново.'
    velkarion_key: 'Велика брама вогнища має дев ять замків, шість печатей і рівно один ключ, і паламар тримає його саме там, де ти думаєш.'
    venom_band: 'Алхімік, що стабілізував це покриття, втратив два пальці, доводячи, що воно діє. Воно діє.'
    venom_battleaxe: 'Павучина отрута на цьому лезі майже не додає шкоди. Набагато більшу частину справжньої роботи виконує вираз обличчя супротивника, коли той помічає колір леза.'
    venom_belt: 'Три невдалі протиотрути й один надзвичайно терплячий жрець стабілізували підкладку цього пояса.'
    venom_concentrate: 'Очищена отрута для зброї з отруєними вістрями та кількох прикрих таверенних парі.'
    venom_gland: "Набрякла отрутою. Один укол — і ваш вечір із 'пригоди' стає 'переговорами з цілителем'."
    venom_legguards: 'Просякнуті токсинами, що технічно, мабуть, безпечні саме для тебе.'
    verdant_aloe: ''
    verger_teaspoon: 'Щаслива чайна ложечка паламаря на петлі зі шпагату. Розмішай нею чай — і хвилина ввічливо зачекає, поки ти закінчиш.'
    vitrified_casque_of_rising_hymn: 'Сплетена для чайника, який однаково вибухнув. Тримає голову при температурі подавання.'
    vitrified_chausses: 'Скроєні так вузько, що кравця довелося двічі відмовляти. Стати на коліна — це вже спогад.'
    vitrified_cord: 'Зав язані подвійним вузлом, як наполягала мати. Розв язати їх — саме так починаються нещасні випадки.'
    vitrified_crown: 'Сплавлена одним ударом блискавки. У ній ти на мить почуваєшся обраним. Це відчуття бреше.'
    vitrified_edge: 'Остуджений повільно, щоб скло не тріснуло. Він зберіг терплячість і втратив милосердя.'
    vitrified_elixir: 'Солона вода і впертість. Хор божиться ним — на октаву вище, ніж раніше.'
    vitrified_glaive: 'Досить довга, щоб підрум янити хліб над великим вогнищем і не втратити брови цілком. Цілком.'
    vitrified_lattice: 'Застигла мережа з розплавлених ниток. Бери за товсте; тонке бере тебе.'
    vitrified_stompers: 'Кожен крок дзвенить, мов ударений келих. Ти повсякчас сповіщаєш про себе.'
    vitrified_tear: 'Листове скло, охолоджене за розкладом вулкана. Бульбашки тут звуть характером.'
    vitrified_vambraces: 'Це не обладунок. Це заява. Когось у цьому соборі зараз відшурують.'
    void_anchor_belt: 'Обтяжений, щоб тримати опору на землі, що осідає під ногами. Драговина осідає завжди.'
    void_distillate: 'Рiдке нiщо видобуте з решток родини Порожнечi. Тривале споглядання спричиняє екзистенцiйну тривогу та легку нудоту.'
    void_eye_lens: 'Кристалізована лінза Ока Порожнечі. Бачить паралельні виміри. Більшість з них якось гірші за цей.'
    void_eye_talisman: 'Оправлений лінзою, шліфованою для нагляду за лінією гробниць після смеркання.'
    void_grips: 'Пальці забарвлені водою, що ніколи не бачить світла. Пляма не змивається.'
    void_oracle_staff: 'Бачить усі можливі майбутні. У більшості з них ти помираєш. І все одно показує.'
    void_shard: 'Фрагмент ніщоти у фізичній формі. Довгий погляд спричиняє кровотечу з носа та філософські кризи.'
    void_shepherd_club: ''
    void_treads: 'Кожен крок трохи тоне і чисто виринає. Драговина ще не навчилася їх утримувати.'
    void_whisper_bow: 'Випускає стріли, які не існують, доки не влучать. Квантова стрільба з лука давно потребує застереження про відповідальність.'
    voidbake_tablet: 'Випалена у вогняних ямах, аж поки не перестала бути чимось іншим. Ковалі розплющують її, доки не вихолола.'
    voidcleave: 'Клинок, кожен удар якого залишає тимчасову тріщину у візуальному просторі — не в реальності, лише в зовнішності. Ефект триває близько трьох секунд перед закриттям. Достатньо для психологічної дестабілізації противника. Недостатньо для виправдання цін, що вимагають ковалі порожнечі.'
    voidgazer_crown: 'Дивиться крізь щілини, стерті від вічної варти. Драговина дивиться у відповідь.'
    voidpierce_stilettos: 'Заточені до леза, достатньо тонкого, щоб прослизнути між пластинами панцира Порожнеч-Метелика так, що той помічає це значно пізніше. Діє на більшість речей з такою самою зневагою до попереджень.'
    voidpiercer_bow: 'Стріли з цього лука прибувають до цілі раніше, ніж тетива повністю відпущена. Причинність тут радше пропозиція.'
    voidpiercer_spear: 'Пронизує порожнечу мiж вимiрами. Корисний для шашликiв.'
    voidreaver_greatsword: ''
    voidreaver_longsword: ''
    voidstaff_nihil: 'Вирізьблений із кристалізованої тиші Порожнеч-Метелика — тієї точної миші спокою між одним помахом крил і наступним. Творить заклинання, яких технічно ніколи не було, з приводу чого податкова має тверду думку.'
    voidwalker_boots: 'Вирощені, а не зшиті, на ногах Порожнеч-Метелика, що навчився ступати від однієї латки нічого до іншої. Побічні ефекти: тихе гудіння у вухах і невитравне відчуття, ніби щось забув.'
    volatile_extract: 'Нестабiльний реагент що чутно вiбрує. Поводьтесь обережно або не чiпайте взагалi.'
    walker_belt: 'Досить модно, якщо ваш стиль — це труп, що бродить.'
    walker_hat: 'Голова попереднього власника все ще всередині, хоча й у значно гіршому стані, ніж сам шолом.'
    wallbreaker: 'Розрахований на кладку, з якої зроблена сама стіна. Розрахунок був не теоретичним. Є діра на доказ.'
    war_barrow_key: 'Викуваний для замка, що не мав відчинятися двічі.'
    warden_spear: 'Церемоніальний спис вартового-паростка, перекований на насильство, якого квібеки так і не пробачили до кінця.'
    warlord_plate: 'Вирізана з обладунку, надто старого, щоб датувати. Візерунок луски не збігається з жодним у реєстрі.'
    warped_staff: 'Неправильно висушений з постiйним скрученням. Спрямовує магiю непередбачуваними спiралями. Прицiл це скорiше вайб.'
    water: 'Чиста, свіжа вода, що вгамовує спрагу й очищує тіло від забруднень. Рідкісна речовина у світі, де більшість рідин прагнуть тебе вбити.'
    waxseal_wafer: 'Тонка, кристалічна й герметична щойно тверднe. Майстри їх запасають і нічого не визнають.'
    weald_heartplate: 'Виріс корою навколо серця зі спресованого моху, ще теплий так, як уміє лишатися теплим живе дерево. Титановому Ведмедеві бракує дуже схожого за формою шматка шкури.'
    weald_knot_belt: "Зав'язаний тими самими кореневими вузлами, якими провідники Вельду позначають безпечну стежку. Чи ті вузли ще щось означають так глибоко — окреме питання."
    wealdwarden_halberd: 'Її носить той, кого зграї Вельду шанують достатньо, щоб не випробовувати наодинці. Використання поодинці технічно можливе. Вельд його не радить.'
    weaver_daggers: 'Наконечник із павучої шовкової залози. Отрута повільна. Жаль приходить раніше за неї.'
    weaver_silk_vest: 'Зіткана з павутиння настільки тонкого, що воно майже невидиме. Кравець взяв подвійну ціну, бо, цитую, «ви не можете довести, що його тут немає».'
    weaving_solution: 'Змiцнює текстильнi волокна для бойового рiвня навантаження. Кравцi замочують кожну нитку перед серйозним шиттям.'
    weighted_club: 'Хтось напхав каміння в порожнє поліно і назвав це інженерією. Працює. Філософи сперечаються, чи достатньо наміру для визначення інструменту. Зламані черепи — ні.'
    welcome_doormat: 'Щетинисті мати, прив язані до кісточок. Ти вбереш усе, що світ об тебе витре, і скажеш ласкаво просимо.'
    wheat: 'Мирні фермери проводять незліченні години, збираючи це зерно, аби солдати спалили його як облогове паливо через тиждень.'
    wheat_barley: 'Скромний сніп блідо-зеленого ячменю, зерна якого налиті обіцянкою хліба чи пива.'
    wheat_burnt: 'Жменя зерна, почорнілого від вогню — його золота обіцянка перетворилася на вугілля та гіркий спогад.'
    wheat_draconize: "Пшениця, вирощена у вулканічному ґрунті, просякнутому драконячою кров'ю, її зерна настільки гарячі, що закип'ячують воду при дотику. Одна хлібина годує сім'ю тиждень, якщо сім'я не проти внутрішнього згорання."
    wheat_flour: 'Деякі шукачі пригод мріють про легендарні мечі, інші — про хрусткі багети, щойно з печі. Другі зазвичай живуть довше, хоча й значно менш славно.'
    wheat_malt: 'Деякі воїни воліють свою відвагу зброджену, інші — перегнану. Це зерно задовольнить обидві філософії.'
    wheat_purple: 'Селяни гірким досвідом навчилися, що збирання світящого врожаю — першопричина спонтанного чаклунства у сільських громадах.'
    wheat_suize: 'Пшениця, вирощена на болотистих землях дельти. Поглинає навколишню вологу настільки ефективно, що врожай ніколи по-справжньому не висихає. Мірошники відмовляються її чіпати. Пивовари платять втричі дорожче.'
    wheat_tanjirize: 'Золоті стебла, зібрані на ancestralних полях винищувача демонів, що досі вібрують від тепла сонця, яке ніколи по-справжньому не сідає.'
    wheat_ukraine: 'Ця загартована пшениця тягнеться до далеких обріїв, її волокна пофарбовані у блакить безхмарних небес та золото нескінченних степів.'
    wheat_white: 'Високогірний врожай, благословенний давніми написами, щоб пережити довге зберігання взимку.'
    whisker_bundle: 'Шість вусів ферана, кожен — точний інструмент, який феран дуже хотів би отримати назад.'
    whisker_weave_belt: 'Шість феранів мимоволі долучилися до цього пояса, який жоден із них ніколи не вдягне на людях.'
    whittled_shortbow: 'Вирізаний під час нудної варти. Тятива зроблена з плетеної трави. Ефективний на короткій відстані, якщо ви оптимістично ставитесь до визначення короткої відстані. Лучник, що його зробив, явно мав багато часу на роздуми.'
    widow_club: 'Обгорнута павутиною вдови, що твердне при ударi. Павуки не вiддавали свою павутину добровiльно.'
    widow_fang_daggers: 'Два iкла вiд двох рiзних вдiв. Вони досi не ладять.'
    widow_thread: 'Тонше павутини, абсурдно міцне. Спрядене тим, хто їсть здобич на чотири розміри більшу за розумне.'
    widows_kiss_daggers: ''
    wildling_bow: ''
    wildling_shortbow: 'Вкрадений з табору дикунiв. Власникiв не питали про угоду.'
    wildling_spear: ''
    wildlord_club: ''
    wildlord_war_girdle: 'Застібають перед кожною перекличкою. Жодного разу не з доброї причини.'
    windfire_cuirass: 'Не може визначитися між вогняною й повітряною спорідненістю. Пече спину, морозить перед, а постійне здригання виснажує все, крім волі стояти на ногах.'
    windshear_loop: 'Вільно обертається на пальці, ніби намагається втекти. Зачарування працює як задумано.'
    windslicer_gloves: 'Тонкі як обіцянка, швидкі як відмовка. Ідеальні для спритних пальців.'
    windstrider_sandals: 'Досить відкриті, щоб швидко стікала вода. Мокрі ноги сохнуть швидше, ніж у важких чоботях.'
    windwalker_vest: 'Достатньо легкий, щоб не відставати від колони. Похідні барабанщики важчого не носили.'
    wisdoms_embrace_gauntlets: 'Двічі перераховував кожну реквізицію, перш ніж підписати. Такі звички не вмирають легко.'
    wither_concentrate: 'Розлитий із найглибшої болотної гнилі. Корок рідко витримує дорогу до квартирмейстра.'
    wither_pastry: 'Тістечко що розкладає все органічне крім себе. Алхіміки використовують як некротичний реагент.'
    wither_petal: ''
    witherbloom: 'Квітка, що досягає повної пишноти цвітіння лише в останні миті свого тління, розгортаючи пелюстки з театральним відчуттям моменту, що натякає на схильність до драматизму. Поети складають про неї цілі елегії, тоді як алхіміки лише фіксують швидкість її розкладання з клінічною відстороненістю.'
    wizard_staff: 'Замаскований пiд тростину. Вогонь на кiнчику менш переконливий.'
    wolf_fang_blade: 'Клинок з вовчими iклами вбитими в лезо. Вовк не був добровольцем.'
    wolf_pelt: 'Товста шкура лісового вовка. Тепла, міцна, і несе легкий мускус, який глибоко непокоїть коней.'
    wolf_sinew: 'Еластичне і міцне. Лучники платять найвищу ціну. Думка вовка з цього приводу більше не актуальна.'
    wolf_sinew_band: 'Сплетене з жили альфа-вовка. Ледь помітно стискається щоразу, коли ви ось-ось помилитеся.'
    wolf_sinew_belt: 'Вожак не віддав свої жили добровільно. Втім, вожаки ніколи не добровольці — хіба що коли йдеться про насильство. Принаймні цей тепер тримає штани.'
    wolf_trek_boots: 'Колись належали вовку, що перехожив кожного мисливця, якого Пандора на нього посилала.'
    wolfbone_blade: 'Рукоять вирізана з стегнової кістки лісового вовка. Виє в сильний вітер, що є тактичною перевагою за сумнівною логікою: ворог відволічеться на шум.'
    wolfcrest_helm: "Увінчаний збереженою вовчою головою, яка дивиться вперед з виразом між загрозливим і злегка незадоволеним. Таксидерміст був, мабуть, п'яний, що пояснює злегка закошені очі і язик, що стирчить зліва."
    wooden_greataxe: 'Скорiше стовп паркану нiж зброя. Скалки завдають половину шкоди.'
    wool_fists: "Ніщо не каже 'відчайдушний бористь' так виразно, як биття ворогів зброєю з побічних продуктів худоби."
    woolame_old: 'Вилучена з блискучих глибин травного тракту вуллігана, цей клинок несе невмирущий відблиск виживання в кислоті.'
    woolamu: 'Цей клаптик пряденої вовни зігріває груди, але зовсім нічого не дає на полі бою. Хоча власник помре в затишку.'
    woolano: 'Ідеальний аксесуар для героїв, які віддають перевагу прикрасам, що можна прати в машині.'
    wooliboots: 'Ідеальні, коли холод повзе крізь підлогу, а гідність вже давно втекла дверима.'
    wooligan_hammer: 'Вулiган вирiвнював ним траву. Ви знайшли бiльш творче застосування.'
    wooligan_hat: 'Гарантовано гріє голову, але на жаль, не мізки всередині.'
    wooling_fleece: 'Жмуток жирної вовни, вирваний з ягняти, яке абсолютно не погоджувалось. Пахне жалем і підлогою стодоли.'
    wooling_practice_bow: 'Натягнутий кишкою вулiнга. Жертва вулiнга була мимовiльною але оцiненою.'
    worldbreaker_battleaxe: ''
    worldheart_striders: 'Підбиті чимось, видобутим з найглибшої частини розлому, що досі слабо пульсує в ритмі, який ніхто точно не прирівняв до серцебиття — але й не виключив.'
    worldsplitter: 'Легенда каже, що перший пробний замах створив каньйон. Легенда перебільшує, але лише трохи.'
    worldwound_brew_of_closing_age_genesis: 'Один з останніх рецептів, записаних до того, як алхіміки перестали записувати будь-що. Він діє; примітка на берегах, що пояснює чому, не збереглася.'
    worldwound_brew_of_closing_age_scar: 'Уварений доти, доки не встоює проти того роду ушкоджень, які роздає Рана, тобто тих, від яких ніхто не сподівається піти живим. Дехто тепер таки йде.'
    worldwound_carapace_of_world_wound: 'Вирощений, а не викуваний, з панцира, що його сама Рана почала й ніколи не завершила. Прогалини — саме там, де вона втратила цікавість.'
    worldwound_circle_of_closing_age: "Викуване в останні роки, коли ювеліри перестали підписувати свою роботу. Ніхто не був певен, що лишиться комусь прочитати ім'я."
    worldwound_circle_of_world_wound: 'Обручка, зігнута з єдиної нитки ран-металу, зімкнена так безшовно, що не скажеш, де початок. Метал знає. І має на це образу.'
    worldwound_edge: "Проведене вздовж тієї самої лінії, якою розірвалася реальність, коли Шрам уперше розкрився. Рана пам'ятає, якої форми надав розріз; клинок пам'ятає рану."
    worldwound_fists_of_closing_age: 'Викувані під кінець усього, коли ковалі облишили оздоблення й почали робити лише те, що витримає. Ці витримують.'
    worldwound_fists_of_world_wound: 'Кістянки вкриті ран-склом, що потроху лущиться з кожним ударом. Тривожно для ворога; усі інші вважають це прийнятним зношенням.'
    worldwound_pendant: 'Містить скалку самої Рани, запечатану так, як Оракул Рани запечатує все інше — обережно і без особливої певності, що воно втримається.'
    worldwound_warboots_of_closing_age: 'Підбиті, щоб чіплятися за слизький край Рани, де один хибний крок — це, до речі, і останній, за який тобі колись доведеться хвилюватися.'
    wound_key: 'Приварений навколо того, що Оракул Рани тримає запечатаним у серці Шраму. Він не так обертається, як його вмовляють — і то ненадовго.'
    wound_marked_composite: 'Шаруватий матеріал, що несе знак Рани наскрізь, тож розрізання ніколи не прибирає знак — воно лише робить з нього два.'
    wound_marked_elixir: 'Проста версія, яку Жерці Шва тримають для себе, без вистави, що її вони влаштовують прочанам. Смакує гірше й діє швидше.'
    wound_marked_elixir_of_origin_line: "Дистильований Жерцями Шва зі стоків їхньої власної роботи, які вони запевняють безпечними й п'ють самі, щоб довести. Досі вони ще тут."
    wound_marked_greataxe_of_final_scar: "Несе карб, який Рана лишила на ній перш ніж її торкнувся коваль. Коваль обробив усе довкола карбу, за розсудливою теорією, що той з'явився не просто так."
    wound_marked_lattice_genesis: 'Та сама ґратка, вирощена біля найдавнішого жерла гори, а не біля Шраму, де вона виходить чистішою і, запевняють майстри, ледь самовдоволеною з цього приводу.'
    wound_marked_lattice_scar: 'Крихкий каркас, що росте вздовж краю Шраму, де кристал набуває форми розлому, хоче того майстер чи ні.'
    wound_marked_loop: 'Одного разу зачеплена Раною й лишена з власним шрамом, який перстень носить граційніше, ніж вдається більшості його власників.'
    wound_marked_vambraces_of_origin_line: 'Прокреслені тим самим знаком, який Рана лишає на всьому, чого торкнеться. Ковалі додали його навмисне, що Рана визнала зайвим і трохи образливим.'
    wound_pilgrim_boots: 'Підбиті для довгого підйому до Рани і, значно рідше, для спуску назад. Більшість пар долають лише дорогу туди.'
    wound_salve: 'Забита в тріщини, які сам Шрам не бажає загоювати, призначена для ран, що він завдав власноруч. Діє й на дрібніші ушкодження — і це єдина милість, яку тут можна знайти.'
    wound_ward_bow: 'Натягнутий так, щоб пускати стріли вздовж ліній розлому Шраму, не розширюючи їх далі — дисципліна, яку Уламки Стіни впроваджують без винятків.'
    woundstitch_grips: 'Зшиті Жерцями Шва з того, що тримає шов на висоті зеніту, тобто з небагато чого, і ненадовго.'
    woundwall_pike: 'Встромлена вздовж останньої стіни, яку прочанам дозволено перетинати, радше межовий стовп, ніж зброя — доки хтось усе одно не спробує її перетнути.'
    wraith_banner: ''
    wraith_boots: 'Кожен крок лунає одразу у двох площинах буття. Сусіди з обох подали офіційну скаргу на шум, і, як не дивно, обидві скарги збігаються в кожній деталі.'
    wraith_crowned_helm: 'Корона досі гуде останніми думками свого попереднього власника, і більшість із них, як виявляється, — жалкування. Кілька, дивно конкретних, стосуються списку покупок, який він так і не встиг дописати.'
    wraith_grimoire: 'Живий облік боргів мертвих. Оновлюється сам. Ніколи не на твою користь.'
    wraith_lantern_shard: "Відламана від ліхтаря, який привид несе всюди, куди б не блукав. Полум'я всередині ніколи не було вогнем — це пам'ять, а пам'ять, як виявляється, горить значно повільніше."
    wraith_lantern_staff: 'Увінчаний ліхтарем, яким Привиди Нефового Каменю заманюють човнярів зі безпечних стежок. Він досі горить холодом — і досі працює.'
    wraith_scripture: 'Вона пише сама себе, коли ніхто не дивиться, почерком, що змінюється разом із тим, хто її читає. Науковці, які її вивчали, не можуть дійти згоди, чи це захопливо, чи глибоко й особисто тривожно. Зазвичай — і те, і інше.'
    wraith_spellbook: 'Написане тим, хто мав дуже тверду думку про клієнтський сервіс потойбіччя.'
    wraith_touch_gauntlets: 'Все, до чого вони торкаються, стає ледь помітно, ввічливо мертвим. Приблизно такий самий ефект, як і ваше особисте життя, зауважили кілька завсідників таверни — тільки тепер це хоча б можна вдягнути.'
    wraith_whisper_amulet: 'Напівпрозорий кулон, що бурмоче мовою, яку ви майже розумієте. Його останній власник переклав рівно одне слово, перш ніж поспіхом продати амулет: позаду. Відтоді ніхто не просив другого.'
    wraith_whisper_knives: 'Загартовані в ектоплазмі привида, вони чисто розрізають броню і, дещо менш чисто, сон. Рани загоюються як слід, повідомляють жертви. Сни — ніколи повністю.'
    yajin_starter_dagger: 'Близнюкові леза Яджина знали кращі часи, їхні краї затуплені незліченними невдалими спробами насильства.'
    yeast: 'Вірулентний штам паразитичного гриба, що врізається в плоть і відмовляється відпускати.'
    yeast_cake: 'Пиріг з піднятого тіста що пахне амбіціями та поганою вентиляцією. Майстри використовують як герметик.'
    yeti_frostbite_daggers: 'Вирізані з кігтів єті просто посеред заметілі. Кожен поріз — з безкоштовним ознобом у комплекті.'
    yeti_fur_tuft: 'Білий, як свіжий сніг, теплий, як почуття провини. Єті це вже не було потрібно. Він наполягає.'
    yeti_jawbreaker: 'Назва — за тим, що він робить із щелепами. Матеріал — з того, що колись щелепу мало.'
    yeti_scalp_hood: 'Пахне тим, що безумовно, ймовірно, майже напевно було справжнім.'
    yeti_skull_crown: 'Порожній череп єті носять як корону. Колишній власник поскаржився. Особисто. Голосно.'
    yetihide_stompers: 'Чоботи, підбиті хутром єті. Гарантовано тримають ноги в теплі, а ворогів — на відстані. Сам запах — вже зброя.'
    zenith_alloy: 'Сплав, що вдається лише в найвищому горні гори, де повітря настільки розріджене, що ковалі присягаються — там воно перестає з ними сперечатися. Тримає лезо, якого не досягне ніщо нижче.'
    zenith_crown: 'Її носить той прочанин, що піднявся найвище розколотою вершиною, перш ніж сходження його доконало. Вона змінила голів більше, ніж нинішній власник хотів би думати.'
    zenith_greaves: 'Обшиті пластинами, щоб пережити сходження розколотою вершиною, суглоби посилені там, де в більшості прочан першими здають коліна.'
    zenith_signet: 'Позначає власника як того, хто стояв на справжньому зеніті, до розлому, за твердженням, яке саме ніхто з нині живих не може ані підтвердити, ані спростувати.'
    zenith_staff: 'Витесаний з уламка первісної вершини зеніту, ще до того, як Шрам забрав решту. Він точно вказує на те, що ще стоїть.'
    zenithscar_draught: "Набраний із талої води, що застоюється вздовж Шраму й відстоюється до прозорості, якщо чекати, і каламутніє, якщо поспішати. Тут більшість тих, хто п'є, поспішають."
    zenithscar_draught_of_summit_vigil: 'Достатньо гіркий, щоб тримати вартового притомним крізь варту, яку тиха його частина радше проспала б. Він не зважає ні на бажання вартового, ні на ворожі.'
    zenithscar_fangs: 'Два леза, гострені на протилежних стінах однієї тріщини, тому вони ніколи не лягають цілком паралельно. Проміжок робить роботу, у якій ти волів би не зізнаватися.'
    zenithscar_greatblade: 'Збалансований точно вздовж шва, яким світ розпався, тож він завжди знає, в який бік падати. Зазвичай на когось.'
    zephyr_legwraps: 'Такі легкі, що ніби нічого не вдягнено. Що теж варіант, але менш захисний.'
    zephyr_silk_strand: 'Шовкова нитка з вітром, що плаває сама. Кравці її обожнюють. Їхні коти вважають її особистим ворогом.'
    zukin_muru: 'A shinobi cowl for people who want to look like they left quietly, even when they slam the door.'
