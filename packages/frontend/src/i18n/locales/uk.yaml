    loot_desc: Кожен запис здобичі має власний фіксований шанс, що кидається незалежно, коли моб гине. Кількість випадкова в межах діапазону запису.
    stat_rolling: КИДКИ СТАТІВ
    stat_rolling_desc: Кожен стат кидається рівномірно в діапазоні шаблону. Кожне значення рівноймовірне.
    archimobs: АРХІ-МОБИ
    archimobs_desc: 0,5% шанс з'явитися як архі-моб замість звичайного — іменований, постійно сильніший варіант. Єдиний механізм рідкості, який мають моби.
    max_members: Макс учасників
    groups_desc: Група — це спільний ростер до {{max}} гравців з обранням лідера. Перебування в групі саме по собі нічого не дає в бою — кожен, у групі чи ні, має надіслати власну транзакцію приєднання до бою, щоб увійти; немає ні пасивного, ні за близькістю включення.
    groups_xp: РОЗПОДІЛ XP
    groups_xp_desc: Загальний XP виграного бою рівномірно розподіляється між усіма бійцями в ньому, після чого зверху застосовуються власна Мудрість кожного гравця та бонус віку групи мобів. Скільки шкоди ви особисто завдали, не змінює вашу частку.
    groups_loot: РОЗПОДІЛ ЗДОБИЧІ
    groups_loot_desc: Здобич не ділиться. Кожен переможний боєць незалежно кидає повну таблицю здобичі групи мобів, використовуючи власний стат Удачі — більша група ніколи не зменшує шанси нікого.
    dungeons_desc: 'У підземелля можна увійти з будь-якого місця у його світі за допомогою ключа — без групового інстансу: усі власники ключів усередині перебувають у спільному просторі, як і у відкритому світі.'
    dungeon_entry: Вхід
    dungeon_entry_value: Ключовий предмет, з будь-якого місця у світі
    dungeon_instance: Інстанс
    dungeon_instance_value: Спільний — усі власники ключів бачать одне одного
    dungeon_completion: Завершення
    dungeon_completion_value: Пройти всі кімнати
