    max_health: МАКС ЗДОРОВ'Я
    loot_desc: Кожен переможений монстр один раз перевіряє кожен запис своєї таблиці здобичі. Успішний запис дає випадкову кількість у заданому діапазоні.
    stat_rolling: КИДКИ СТАТІВ
    stat_rolling_desc: Кожен стат кидається рівномірно в діапазоні шаблону. Кожне значення рівноймовірне.
    archimobs: АРХІ-МОБИ
    archimobs_desc: Кожен придатний моб має 1% шанс бути заміненим своїм іменованим, постійно сильнішим архімобом. Кожен учасник кидає незалежно.
    max_members: Макс учасників
    groups_desc: Група — це спільний ростер до {{max}} гравців з обранням лідера. Перебування в групі саме по собі нічого не дає в бою — кожен, у групі чи ні, має надіслати власну транзакцію приєднання до бою, щоб увійти; немає ні пасивного, ні за близькістю включення.
    groups_xp: РОЗПОДІЛ XP
    groups_xp_desc: Переможені моби утворюють базовий запас XP. Допущені бійці дають йому груповий коефіцієнт Retro, невідповідність сумарних рівнів гравців і мобів зменшує його, після чого кожен гравець отримує частку свого рівня в сумарному рівні групи. Гравець нижче третини рівня найсильнішого гравця не збільшує коефіцієнт. Мудрість застосовується останньою; особиста шкода не має значення.
    groups_loot: РОЗПОДІЛ ЗДОБИЧІ
    groups_loot_desc: Кожен переможений монстр виконує один спільний кидок здобичі. Успішні предмети по черзі призначаються гравцям команди-переможця; додаткові гравці не створюють нових кидків.
    dungeons_desc: Дістаньтеся входу до підземелля в його визначеному місті, витратьте ключ і проходьте кімнати по черзі. Кожне підземелля має одне живе лобі.
    dungeon_entry: Вхід
    dungeon_entry_value: Відповідний ключ біля входу до міста
    dungeon_instance: Інстанс
    dungeon_instance_value: Лобі підземелля з публічними або груповими боями
    dungeon_completion: Завершення
    dungeon_completion_value: Пройти всі кімнати
    dungeon_reward: Нагорода
    dungeon_reward_value: Стандартний розподіл здобичі
    classes_desc: 12 класів. Зброя універсальна — будь-який клас може екіпірувати та використовувати будь-який тип зброї — але володіння зброєю, розробленою для вашого класу, дає +10% шкоди та критичної шкоди. Кожен клас розблоковує свої заклинання на фіксованих рівнях під час прокачування.
    table_class: КЛАС
    table_weapon: СПОРІДНЕНІСТЬ
    table_hp: HP
    role_warrior: Воїн
    role_assassin: Асасін
    role_berserker: Берсерк
    role_druid: Друїд
    role_chronomancer: Хрономант
    role_guardian: Страж
