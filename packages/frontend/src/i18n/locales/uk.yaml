      description: 'Скриня ACT Airdrop для гравців, обраних за рейтингом ACT. У ній один шолом Helios Warlord.'
    nogas_presale:
      title: 'Nogas'
      description: 'Плащ із пласкою жабою для кожного гаманця, що брав участь у пресейлі NOGAS на Blast. Перевірте гаманець, з якого ви брали участь.'
    blast_crew:
      title: 'Шолом Crew'
      description: 'Косметичний подарунок учасникам продажу KARES на Blast. Після розподілу підключіть використаний гаманець.'
    oeuftermath:
      title: 'Aftermath Eggs · Oeuftermath'
      description: 'Власники Aftermath Egg на знімку отримують ваучер на улюбленця Oeuftermath. Перевірте гаманець, на якому тоді було яйце. Пізніша купівля не дає права на нагороду.'
    suicune:
      title: 'SWEEBS · Suicune'
      description: 'Власники SWEEBS на знімку отримують ваучер на улюбленця Suicune. Підключіть відповідний гаманець, щоб імпортувати його в ігровий обліковий запис.'
    suifren_bullshark:
      title: 'Suifren Bullsharks'
      description: 'Із знімка обрано 500 відповідних гаманців власників Bullshark. Перевірте тодішній гаманець на наявність ваучера. Саме володіння Bullshark не гарантує відбору.'
    suifren_capy:
      title: 'Suifren Capys'
      description: 'Із знімка обрано 500 відповідних гаманців власників Capy. Перевірте тодішній гаманець на наявність ваучера. Саме володіння Capy не гарантує відбору.'
