      title: 'Prime Machin'
      description: 'Ваучери на улюбленців адресовано NFT Prime Machin зі знімка. Спочатку заберіть подарунок при вашому NFT через Studio Mirai, потім підключіть тут гаманець одержувача для імпорту.'
