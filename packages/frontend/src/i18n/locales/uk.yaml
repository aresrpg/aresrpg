    level_10: Рівень 10
    level_50: Рівень 50
    level_100: Рівень 100
    base_stats: БАЗОВІ СТАТИ
    stat_vitality: Живучість
    stat_vitality_desc: +1 макс HP за очко
    stat_wisdom: Мудрість
    stat_wisdom_desc: Бонус до досвіду
    stat_strength_desc: Масштабування шкоди землі
    stat_intelligence_desc: Шкода вогню, масштабування зцілення
    stat_chance_desc: Шкода води, більше здобичі
    stat_agility_desc: Масштабування шкоди повітря
    derived_formulas: ПОХІДНІ ФОРМУЛИ
    max_health: МАКС ЗДОРОВ'Я
    loot_desc: Кожен переможений монстр один раз перевіряє кожен запис своєї таблиці здобичі. Успішний запис дає випадкову кількість у заданому діапазоні.
    stat_rolling: КИДКИ СТАТІВ
    stat_rolling_desc: Кожен стат кидається рівномірно в діапазоні шаблону. Кожне значення рівноймовірне.
    archimobs: АРХІ-МОБИ
    archimobs_desc: Кожен придатний моб має 1% шанс бути заміненим своїм іменованим, постійно сильнішим архімобом. Кожен учасник кидає незалежно.
    max_members: Макс учасників
    groups_desc: Група — це спільний ростер до {{max}} гравців з обранням лідера. Перебування в групі саме по собі нічого не дає в бою — кожен, у групі чи ні, має надіслати власну транзакцію приєднання до бою, щоб увійти; немає ні пасивного, ні за близькістю включення.
    groups_xp: РОЗПОДІЛ XP
    groups_xp_desc: Переможені моби утворюють базовий запас XP. Допущені бійці дають йому груповий коефіцієнт Retro, невідповідність сумарних рівнів гравців і мобів зменшує його, після чого кожен гравець отримує частку свого рівня в сумарному рівні групи. Гравець нижче третини рівня найсильнішого гравця не збільшує коефіцієнт. Мудрість застосовується останньою; особиста шкода не має значення.
    groups_loot: РОЗПОДІЛ ЗДОБИЧІ
    groups_loot_desc: Кожен переможений монстр виконує один спільний кидок здобичі. Успішні предмети по черзі призначаються гравцям команди-переможця; додаткові гравці не створюють нових кидків.
    dungeons_desc: Дістаньтеся входу до підземелля в його визначеному місті, витратьте ключ і проходьте кімнати по черзі. Кожне підземелля має одне живе лобі.
    dungeon_entry: Вхід
    dungeon_entry_value: Відповідний ключ біля входу до міста
    dungeon_instance: Інстанс
    dungeon_instance_value: Лобі підземелля з публічними або груповими боями
    dungeon_completion: Завершення
    dungeon_completion_value: Пройти всі кімнати
    dungeon_reward: Нагорода
    dungeon_reward_value: Стандартний розподіл здобичі
    classes_desc: 12 класів. Зброя універсальна — будь-який клас може екіпірувати та використовувати будь-який тип зброї — але володіння зброєю, розробленою для вашого класу, дає +10% шкоди та критичної шкоди. Кожен клас розблоковує свої заклинання на фіксованих рівнях під час прокачування.
    table_class: КЛАС
    table_weapon: СПОРІДНЕНІСТЬ
    table_hp: HP
    role_warrior: Воїн
    role_assassin: Асасін
    role_berserker: Берсерк
    role_druid: Друїд
    role_chronomancer: Хрономант
    role_guardian: Страж
    role_archer: Лучник
    role_prospector: Шукач
    role_brawler: Бійець
    role_tomoda: Повелитель звірів
    role_gambler: Гравець
    role_healer: Цілитель
    weapon_daggers: Кинджали
    weapon_spear: Спис
    weapon_bow: Лук
    weapon_axe: Сокира
    weapon_sword: Меч
    marketplace: РИНОК
    marketplace_desc: Спорядження та персонажі виставляються в кіоску за ціною, яку ви встановлюєте; покупці платять миттєво. Ресурси натомість обмінюються на SUI у пулах свопів, без оголошень. Кожен продаж сплачує 10% роялті — маркетплейс є єдиним способом продажу.
    section_forgemagie: ФОРЖЕМАГІЯ
    forgemagie_desc: 'Форжемагія: це система рун. Роздрібнюйте спорядження на руни, потім застосовуйте їх на інше спорядження для зміни характеристик. Високоризикова, але надзвичайно вигідна система для вдосконалення спорядження.'
    crushing: РОЗДРІБНЕННЯ
    crushing_desc: 'Кожна лінія характеристики роздрібненого предмета оцінюється незалежно — вищі значення та важчі характеристики дають більше рун. Сервера немає: дільник виходу поєднує фіксовану криву за рівнем предмета з власним taux шаблону предмета — спільним ончейн-коефіцієнтом інфляції (1%-4000%), який саме роздрібнення знижує для цього шаблону і підвищує для його сусідів.'
    rune_tiers_desc: Рівень руни (Ba/Pa/Ra) обирається ймовірнісно. Вищі характеристики схиляють до Ra рун.
    rune_tiers: РІВНІ РУН
    rune_ba: 'Тір 1: найменша вага за руну'
    rune_pa: 'Тір 2: середня вага за руну'
    rune_ra: 'Тір 3: найвища вага за руну, подвійний досвід'
    rune_weight_desc: Вага починається зі значення × одиничну вагу; Retro округлює результат вгору до цілого. Вона обчислюється автоматично.
    rune_table_stat: СТАТ
    rune_table_note: Руни Дальності, Руху та Дії застосовуються по одному разу кожна; Шанс криту — до 10 разів. Критичний удар і Критичні результати не мають рун взагалі.
    rune_stat_range: Дальність
    rune_stat_movement: Рух
    rune_stat_action: Дія
    rune_stat_raw_damage: Сира шкода
    rune_stat_critical_chance: Шанс криту
    rune_stat_earth_resist: Опір землі
    rune_stat_fire_resist: Опір вогню
    rune_stat_water_resist: Опір води
    rune_stat_air_resist: Опір повітря
    stat_unit_weights: ОДИНИЧНІ ВАГИ ХАРАКТЕРИСТИК
    stat_unit_weights_desc: Кожна характеристика має одиничну вагу, що відображає її бойову потужність. Предмети з важкими лініями характеристик дають більше рун при подрібненні, споживають більше бюджету і їх складніше пере-кувати.
    rune_application: ЗАСТОСУВАННЯ РУН
    rune_application_desc: 'Тимчасово розблоковано на 1 рівні ремісничої професії, що відповідає категорії спорядження, для тестування. Застосовуйте руни по одній, щоб змінити характеристики. Можливі три результати:'
    outcome_critical_success: Критичний успіх
    outcome_critical_success_desc: Руна спрацювала, характеристики не втрачені
    outcome_neutral: Нейтральний успіх
    outcome_neutral_desc: Руна спрацювала, інші характеристики можуть знизитися
    outcome_critical_failure: Критична невдача
    outcome_critical_failure_desc: Руна не спрацювала, втрата характеристик рівна вазі руни
    success_rate: ШАНС УСПІХУ
    success_rate_desc: 'Успіх залежить від того, наскільки близька характеристика до максимуму: близько до 0% — це ~99% успіху, близько до максимуму — ~50%, а екзотичні характеристики залишаються на ~1% незалежно від рівня. Чи стане успіх Критичним (без втрат), чи Нейтральним (вага сплачена), змінюється так само, плюс невеликі +0,2% за кожен рівень професії понад 1. Немає обмеження на те, з яким рівнем предметів може працювати ваша професія.'
    puits: ПОГЛИНАЧ (PUITS)
    puits_desc: Лічильник ваги, показаний в інтерфейсі, що накопичується, коли втрати характеристик перевищують вагу руни. Поглинає майбутні втрати перед тим, як інші характеристики постраждають. Зберігається на предметі та переходить з ним між верстатами й власниками.
    over_maging: НАД-МАГІЯ
    over_maging_desc: Підвищуйте характеристики вище їх природного максимуму. Кожна лінія характеристики обмежена 101 додатковою вагою. Максимум над-магії залежить від одиничної ваги характеристики — легку характеристику, як-от Живучість (вага 0,25), можна перевищити приблизно на 404 очок, важку, як-от Мудрість (вага 3), лише приблизно на 33.
    forgemagie_tips: ПОРАДИ
    forgemagie_tips_desc: 'Для екзотичного/овер-мейджу: спершу зніміть дешеві характеристики, щоб накопичити великий колодязь, потім проведіть складну характеристику з буфером, потім додайте втрачені характеристики назад (легко, бо далеко від максимуму). Овер-мейдж та екзотичні характеристики втрачаються першими при невдачі.'
    action_points: ОЧКИ ДІЇ (ОД)
    movement_points: ОЧКИ РУХУ (ОР)
    critical_stat: КРИТИЧНИЙ УДАР
    wisdom_xp: БОНУС ДОСВІДУ ВІД МУДРОСТІ
    wisdom_xp_desc: Кожне очко ефективної Мудрості, включно з активними ефектами, додає 1 % до отриманого XP. За 100 ефективної Мудрості ви отримуєте подвійний XP.
    chance_loot: УДАЧА ТА ЗДОБИЧ
    chance_loot_desc: Середня ефективна Удача команди-переможця, включно з активними ефектами, множить кожен розрахований шанс випадіння. За середньої Удачі 600 шанс подвоюється і ніколи не перевищує 100%.
    mob_loot_band: РІВЕНЬ МОНСТРА І ШАНС ЗДОБИЧІ
    mob_loot_band_desc: Заданий шанс є серединою діапазону. Монстр мінімального рівня використовує 80%, а максимального — 120%, з обмеженням 100%. Монстри фіксованого рівня використовують заданий шанс без змін. Кількість не масштабується з рівнем.
