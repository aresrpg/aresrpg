    lede: 'AresRPG — тактична MMORPG, що працює як протокол у мережі Sui. Персонажі, предмети, бої та ринок — це ончейн-об’єкти й транзакції. Гра, яку ви бачите, — один із клієнтів цього протоколу, і їх кілька.'
