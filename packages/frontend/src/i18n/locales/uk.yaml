    protocol:
      - 'Правила гри — це смартконтракти. Бій, створення предмета, збір чи продаж — це транзакція, і її результат однаковий, хай який інтерфейс її надіслав.'
      - 'Ваш акаунт володіє вашими персонажами та предметами. Жоден інтерфейс не зберігає їх за вас, окрім розміщеного бота, якому ви самі передаєте персонажа.'
      - 'Усі інтерфейси читають той самий стан. За боєм, розпочатим у 3D-світі, можна стежити з іншої сторінки, а здобич бота з’являється у вашому інвентарі.'
    loop_title: 'Що ви робите у грі'
    loop:
      - 'Бийтеся з групами монстрів на сітці, по ходах. Щоходу ви витрачаєте очки дії на закляття та очки руху на кроки.'
      - 'Збирайте ресурси й створюйте інструменти, спорядження та витратні предмети у своїх професіях.'
      - 'Проходьте підземелля групою, кімната за кімнатою, заради здобичі з боса.'
      - 'Торгуйте з іншими гравцями на ринку за SUI.'
  ways:
    lede: 'У протоколу немає єдиного входу. Кожен інтерфейс нижче грає тими самими персонажами, з тією самою здобиччю й тим самим ринком. Вони відрізняються тим, хто робить ходи і що потрібно для запуску.'
    note: 'Можна користуватися кількома інтерфейсами одночасно. Кожен акаунт грає в одній ігровій сесії водночас; сторінки сайту можуть лишатися відкритими поруч із нею.'
