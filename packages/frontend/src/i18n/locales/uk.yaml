    stat_points: Очки статів
    stat_points_value: '{{n}} за рівень'
    stat_costs_desc: Вартість залежить від класу та поточного природного значення. Сторінка класу показує всю шкалу.
    spell_points: Очки заклинань
    spell_points_value: '{{n}} за рівень'
