  how_to_get: Як отримати SUI
  your_address: 'Адреса SUI'
  send_sui: 'Надсилайте SUI через мережу Sui. Натисніть, щоб скопіювати.'
  buy_directly: Купити напряму
  buy_with_card: Купіть SUI кредитною карткою. Доставка прямо на ваш гаманець.
  buy_on_exchange: Купити на біржі
  withdraw_to_wallet: Купіть SUI на біржі, потім виведіть його на адресу гаманця,
