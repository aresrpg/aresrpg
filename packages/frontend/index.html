<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="{{THEME_COLOR}}" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="{{APP_NAME}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="{{META_DESCRIPTION}}" />

    <link rel="canonical" href="{{APP_URL}}" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:title" content="{{META_TITLE}}" />
    <meta property="og:description" content="{{SOCIAL_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{APP_URL}}" />
    <meta property="og:site_name" content="{{APP_NAME}}" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="{{SOCIAL_IMAGE_URL}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="AresRPG voxel world" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{META_TITLE}}" />
    <meta name="twitter:description" content="{{SOCIAL_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SOCIAL_IMAGE_URL}}" />
    <meta name="twitter:image:alt" content="AresRPG voxel world" />

    <title>{{META_TITLE}}</title>
    <link rel="stylesheet" href="/src/landing/landing.css" />
    <link rel="stylesheet" href="/src/document.css" />
    <style>
      {{LOADING_STYLES}}
    </style>
  </head>
  <body>
    <template id="boot-game">{{LOADING_SCREEN}}</template>
    <!-- The shell of an engine-less page, painted before any script loads; React replaces it when ready. -->
    <template id="boot-light">
      <div class="light-page aui-aura" data-boot-light aria-busy="true">
        <div class="light-page-scene" aria-hidden="true"></div>
        <header class="light-page-header">
          <span class="light-page-brand"><strong>AresRPG</strong></span>
          <span class="aui-skeleton aui-skeleton--chip"></span>
        </header>
        <main class="light-page-main">
          <section class="aui-panel light-page-card">
            <span class="aui-skeleton aui-skeleton--title"></span>
            <span class="aui-skeleton aui-skeleton--line"></span>
            <span class="aui-skeleton aui-skeleton--line aui-skeleton--short"></span>
            <span class="aui-skeleton aui-skeleton--block"></span>
          </section>
        </main>
      </div>
    </template>
    <template id="boot-landing">{{LANDING_SCREEN}}</template>
    <div id="root"></div>
    <script src="/landing/initial_shell.js"></script>
    <noscript>{{LOADING_SCREEN}}</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
