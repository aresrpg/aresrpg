<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>simulator board-pane harness (throwaway — not part of the app)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (!globalThis.process)
        globalThis.process = {
          env: {},
          argv: [],
          browser: true,
          version: '',
          emit: function () {},
          nextTick: function (f) {
            var a = [].slice.call(arguments, 1)
            queueMicrotask(function () {
              f.apply(null, a)
            })
          },
        }
    </script>
    <!-- The boot shim and the app stylesheet load HERE, not from the entry module: the entry lives inside
         simulator/, whose import allowlist (`simulator-consumes-shared-only`) does not include them, and
         whose reverse fence (`simulator-no-reverse-leak`) forbids an outside module importing it. Module
         scripts evaluate in document order, so the shim still runs before the harness graph. -->
    <script type="module">
      import '/src/boot_shim'
      import '/src/index.css'
    </script>
    <script type="module" src="/src/simulator/board_harness_main.jsx"></script>
  </body>
</html>
