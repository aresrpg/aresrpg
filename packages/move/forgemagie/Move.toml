# aresrpg_forgemagie — the standalone Retro rune-forge package (package-split 2026-07-12: the aresrpg core
# measured 102,193 B of a 102,400 B protocol publish cap — 207 B headroom; forgemagie was the DECISIONS-ledgered
# next candidate after the kolizeum split). Feature → core arrows only: it READS core (config dials, character
# job xp, item templates/stats) and drives the brand-gated core value doors (`*_brand` twins) with its OWN
# `Forge` witness pinned in GameConfig. Core never names this package (ledgered law).
[package]
name = "aresrpg_forgemagie"
version = "0.1.0"
edition = "2024"
authors = ["AresRPG"]

# FRAMEWORK PIN: single-rev, matched to the build CLI's OWN framework hash (1.76.0-6effb4523834) — identical to
# every sibling package so the whole graph compiles against one lineage. A pin that diverges from the CLI's
# implicit framework is what produced the `Sui`/`Sui_1` dual (#1284); check_move_lock_revs.mjs now fails on it.
[dependencies.Sui]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/sui-framework"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[dependencies.MoveStdlib]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/move-stdlib"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

# Kiosk (PersonalKioskCap — the ownership proof the scribe/crush doors thread).
# The default dependency serves the verified testnet lineage.
[dependencies.Kiosk]
git = "https://github.com/MystenLabs/apps.git"
subdir = "kiosk"
rev = "a1cd20107340bf8f6e6913ed20b9fafe92fe3d03"

# THE core game package (config / version / admin / character_link / item / item_stats / extract / extension /
# fight_marker). Arrow flows feature → core, never back.
[dependencies.aresrpg]
local = "../aresrpg"

# The pure-math combat foundation (the sealed forgemagie closed form + taux + rune_catalog + prng + job_xp).
[dependencies.aresrpg_foundation]
local = "../foundation"

[environments]
testnet = { chain-id = "4c78adac" }
mainnet = { chain-id = "35834a8a" }

# The future mainnet ceremony owns the real Kiosk pin.
# Until then, the verified testnet dependency remains the default.

[addresses]
# `aresrpg_forgemagie` binds implicitly to 0x0 via the [package] name; per-network published ids self-record.
