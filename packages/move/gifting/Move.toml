# aresrpg_gifting — the standalone player-facing satellite package (package-split 2026-07-13: the aresrpg core
# exceeded the 102,400-byte protocol publish cap; the leaf item/character lifecycle modules extracted here,
# mirroring the kolizeum/forgemagie pattern). Holds gift + airdrop + loot_box + consume + pool + creation: all
# authored by the single pinned `Gifting` witness. Feature → core arrows only: it READS core (config dials,
# templates, character reads) and drives the brand-gated core value doors (`mint_and_lock_output_brand` /
# `heal_hp_brand` / `character::new_brand`) with its OWN `Gifting` witness pinned in GameConfig. Core never names
# this package (ledgered law).
[package]
name = "aresrpg_gifting"
version = "0.1.0"
edition = "2024"
authors = ["AresRPG"]

# FRAMEWORK PIN: single-rev, matched to the build CLI's OWN framework hash (1.76.0-6effb4523834) — identical to
# every sibling package so the whole graph compiles against one lineage. A pin that diverges from the CLI's
# implicit framework is what produced the `Sui`/`Sui_1` dual (#1284); check_move_lock_revs.mjs now fails on it.
[dependencies.Sui]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/sui-framework"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[dependencies.MoveStdlib]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/move-stdlib"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

# Kiosk (PersonalKioskCap + kiosk lock/rules — the ownership proof + the kiosk-lock constitution the gift/airdrop/
# loot_box/pool doors thread). The default dependency serves the verified testnet lineage.
[dependencies.Kiosk]
git = "https://github.com/MystenLabs/apps.git"
subdir = "kiosk"
rev = "a1cd20107340bf8f6e6913ed20b9fafe92fe3d03"

# THE core game package (config / version / admin / character / character_link / item / item_listing_rule /
# extract / extension / consumable_effect / fight_marker). Arrow flows feature → core, never back.
[dependencies.aresrpg]
local = "../aresrpg"

[environments]
testnet = { chain-id = "4c78adac" }
mainnet = { chain-id = "35834a8a" }

# The future mainnet ceremony owns the real Kiosk pin.
# Until then, the verified testnet dependency remains the default.

[addresses]
# `aresrpg_gifting` binds implicitly to 0x0 via the [package] name; per-network published ids self-record.
