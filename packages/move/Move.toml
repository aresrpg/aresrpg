[package]
name = "aresrpg"
edition = "2024"
license = "LicenseRef-AresRPG-Source-Available"
authors = ["Sceat"]

[dependencies]
# Personal kiosk + royalty/lock rules (the kiosk-lock constitution). MVR (@mysten/kiosk) once
# the mvr resolver is installed; until then the corpus's verified pin.
Kiosk = { git = "https://github.com/MystenLabs/apps.git", subdir = "kiosk", rev = "a1cd20107340bf8f6e6913ed20b9fafe92fe3d03" }
# The immutable static layer (curves, grids, formulas, prng, spell algebra) — published
# first, pinned at publish; pure functions only, the client twin mirrors it byte for byte.
aresrpg_math = { local = "../move-math" }

[addresses]
# Fixed proceeds sink (one home, never a per-sale field).
treasury = "0x37cf46b499f740e653644bd2f7a8ed97f248e8b3c69d5d12c97d7845a54c0cd8"

# Package management: https://docs.sui.io/guides/developer/packages/move-package-management
