[package]
# Package name stays "aresrpg": the deployed testnet package, the Move.lock pin
# ([pinned.testnet.aresrpg], root = true) and all 18 `module aresrpg::*` declarations
# bind to the implicit `aresrpg = "0x0"` named address this name provides. The public
# game is Koshi; the on-chain namespace rebrand is a deliberate later republish+reindex,
# never a rename that silently breaks the build + desyncs from the live package.
name = "aresrpg"
version = "0.1.0"
edition = "2024"

authors = ["AresRPG"]

[dependencies.Kiosk]
git = "https://github.com/MystenLabs/apps.git"
subdir = "kiosk"
rev = "a1cd20107340bf8f6e6913ed20b9fafe92fe3d03"

# FRAMEWORK REV PIN (upgrade-safety, the FeatureNotYetSupported saga): a package linking a DUAL framework rev is
# rejected by testnet-128's UPGRADE path; a trivial single-rev package upgraded fine (devops control) — so it is the
# DUAL, not the version. What was believed about the fix was wrong for a year, and #1284 measured it: `override = true`
# does NOT reach a dependency's own edge. Kiosk resolves its framework to the build CLI's IMPLICIT rev, so the graph
# is single-rev if and only if OUR pin is that same rev — pinning anything else (however deliberate) manufactures the
# `Sui`/`Sui_1` pair. Proven on scratch builds: pin = 6effb4523834 (the CLI's own) → one rev per environment; pin =
# anything else → two, every time, whatever Kiosk is pinned to.
# STANDING RULE: NO floating revs — pins only, and the framework pin MUST equal the build CLI's framework hash
# (`sui --version`); re-pin every manifest together when the CLI moves, and keep CI's installed sui on that same
# build. VERIFICATION is no longer prose: `bun run check:move-locks` (in `bun run lint`) fails on a second rev.
[dependencies.Sui]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/sui-framework"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[dependencies.MoveStdlib]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/move-stdlib"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[addresses]
# `aresrpg` (the package's own modules) is bound implicitly to 0x0 by the [package]
# name under modern Sui address management; the per-network published id self-records
# in Move.lock. `server` is the sponsor/authority key asserted by auth::authenticate.
server = "0xc96926171ab8aa859296a7e051f2aee6986603e32e663e4f38cf1901fa00024a"
# SEC-2: the paid-character price sink. Caller-supplied price/treasury made the 10-SUI gate decorative
# (mint for 1 MIST paid to yourself) — the contract is now the sole authority on both.
treasury = "0x3d1342fb7de99c69ce821183bcfc5b6374d81453bf5ca9bf7e383e75b3722983"
[dependencies.aresrpg_foundation]
local = "foundation"
