# aresrpg_fight — the GENERIC tactical combat ENGINE (S-46 final split). Knows NOTHING of items/characters/
# GameConfig: entries take PLAIN inputs (stat scalars, foundation Stats/SpellLevel, dial snapshots); trust =
# witness TYPE-PARAMETER branding (`create<W: drop>` stamps type_name::get<W>() into the Fight; FightOutcome
# echoes it — the consuming package self-authenticates at claim, compile-time, zero stored bindings/ceremony).
[package]
name = "aresrpg_fight"
version = "0.1.0"
edition = "2024"
authors = ["AresRPG"]

[dependencies.Sui]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/sui-framework"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[dependencies.MoveStdlib]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/move-stdlib"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[dependencies.aresrpg_foundation]
local = "../foundation"

# Read-only SpellTemplate imports (cast resolution reads the frozen level rows) — engine → spells, never back.
[dependencies.aresrpg_spells]
local = "../spells"

[environments]
testnet = { chain-id = "4c78adac" }
mainnet = { chain-id = "35834a8a" }

[addresses]
