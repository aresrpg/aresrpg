# aresrpg — THE core game package (S-46 merge of items/game/kolizeum/dungeon/pools into one module set).
# Cross-module trust within it is now public(package); the multi-package cap machinery (ExtensionCap/CreatorCap/custody)
# is dissolved. Depends on Sui + Kiosk + the sibling packages aresrpg_foundation / aresrpg_fight / aresrpg_social / aresrpg_spells.
[package]
name = "aresrpg"
version = "0.1.0"
edition = "2024"
authors = ["AresRPG"]

# FRAMEWORK PIN: single-rev, matched to the build CLI's OWN framework hash (`sui --version` →
# 1.76.0-6effb4523834) — identical to every sibling package so the whole graph compiles against one lineage.
# Measured, not assumed (#1284): a pin that DIVERGES from the CLI's implicit framework is what produced the
# `Sui`/`Sui_1` dual — Kiosk's transitive edge resolves to the CLI's rev whatever `override = true` says, so
# the two only collapse when our pin IS that rev. Re-pin here whenever the CLI moves; check_move_lock_revs.mjs
# fails the build if a second rev ever reappears.
[dependencies.Sui]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/sui-framework"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

[dependencies.MoveStdlib]
git = "https://github.com/MystenLabs/sui.git"
subdir = "crates/sui-framework/packages/move-stdlib"
rev = "6effb4523834cf2536be21d8ebe577b0cc9e0160"
override = true

# Kiosk LOCK + TransferPolicy (the kiosk-lock constitution: every item/character in a personal kiosk). The default
# dependency serves the verified testnet lineage.
[dependencies.Kiosk]
git = "https://github.com/MystenLabs/apps.git"
subdir = "kiosk"
rev = "a1cd20107340bf8f6e6913ed20b9fafe92fe3d03"

# The pure-math combat foundation (spell/effect/formula/target/grid/prng/book/board). Stays standalone (S-46:
# "only generic math lives elsewhere"). Arrow flows downward (aresrpg → foundation), never back.
[dependencies.aresrpg_foundation]
local = "../foundation"

# The GENERIC branded combat engine (S-46 final split): core doors construct the private FightBrand witness and
# call `create<W>/join<W>`; claims assert the echoed brand. Arrow: core → engine, never back.
[dependencies.aresrpg_fight]
local = "../engine"

# Standalone social (party + friends). Core reads FriendList read-only (kolizeum allowlist snapshot).
[dependencies.aresrpg_social]
local = "../social"

# Standalone spell data. Core reads SpellTemplate read-only (spell_level spend door).
[dependencies.aresrpg_spells]
local = "../spells"

[environments]
testnet = { chain-id = "4c78adac" }
mainnet = { chain-id = "35834a8a" }

# The future mainnet ceremony owns the real Kiosk pin.
# Until then, the verified testnet dependency remains the default.

[addresses]
# `aresrpg` binds implicitly to 0x0 via the [package] name; the per-network published id self-records in Move.lock.
# Fixed proceeds/royalty sink for shop + pool sales (one home, never a per-sale field).
treasury = "0x37cf46b499f740e653644bd2f7a8ed97f248e8b3c69d5d12c97d7845a54c0cd8"
