# Final promotion door: every artifact was already built from the owner-pushed release tag.
# This workflow only verifies that immutable preparation record and moves Vercel's domains.
name: activate production
run-name: activate v${{ inputs.version }} mainnet ${{ inputs.request_id }} ${{ inputs.preparation_run }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prepared release version without the v prefix, for example 2.3.0'
        required: true
        type: string
      request_id:
        description: Release recovery identity
        required: true
        type: string
      preparation_run:
        description: Exact successful release preparation run
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: production-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_ir5eY7QCUS7qgcTBq81H89FM
      VERCEL_PROJECT_ID: prj_sBuXZOg6DJTciA0SYyTQZhESAekP
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUI_NETWORK: mainnet
      PREPARATION_RUN: ${{ inputs.preparation_run }}
      REQUEST_VERSION: ${{ inputs.version }}
    steps:
      - name: assert activator is the authorized owner
        run: |
          test "${{ github.event.sender.id }}" = "11330271" || {
            echo "::error::activator is not authorized (id mismatch)"
            exit 1
          }
          test "${{ github.actor }}" = "Sceat" || {
            echo "::error::activator is not authorized (login mismatch)"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /package.json
            /bun.lock
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - name: setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: install the locked activation CLI
        run: bun install --frozen-lockfile --ignore-scripts
      - name: locate this tag's successful preparation
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          test "$version" = "$REQUEST_VERSION" || { echo "::error::tag version mismatch"; exit 1; }
          source_sha=$(git rev-parse HEAD)
          [[ "$PREPARATION_RUN" =~ ^[0-9]+$ ]] || exit 1
          run_id="$PREPARATION_RUN"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e --arg sha "$source_sha" \
            '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/release.yml"' >/dev/null
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"
      - name: download immutable release manifest
        run: |
          mkdir -p "$RUNNER_TEMP/production-release"
          gh run download "${{ steps.release.outputs.run_id }}" \
            --name "production-release-v${{ steps.release.outputs.version }}" \
            --dir "$RUNNER_TEMP/production-release"
      - name: verify source, staged deployment, and public image digests
        id: manifest
        run: |
          manifest="$RUNNER_TEMP/production-release/release-manifest.json"
          jq -e --arg sha "${{ steps.release.outputs.source_sha }}" --arg version "${{ steps.release.outputs.version }}" --arg network "$SUI_NETWORK" \
            '.status == "prepared" and .source_sha == $sha and .version == $version and .network == $network and (.vercel.built | type == "boolean") and (.vercel.built == false or (.vercel.staged_url | startswith("https://")))' \
            "$manifest" >/dev/null
          for image in server indexer; do
            digest=$(jq -r ".images.$image.digest" "$manifest")
            repository=$(jq -r ".images.$image.repository" "$manifest")
            [ -n "$digest" ] && [ "$digest" != null ] || { echo "::error::$image digest is missing"; exit 1; }
            docker manifest inspect "$repository@$digest" >/dev/null || {
              echo "::error::$repository@$digest is not anonymously pullable; make the GHCR package public"
              exit 1
            }
          done
          echo "url=$(jq -r .vercel.staged_url "$manifest")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(jq -r .vercel.built "$manifest")" >> "$GITHUB_OUTPUT"
      - name: inspect the staged production deployment
        if: steps.manifest.outputs.frontend == 'true'
        run: bun run vercel inspect "${{ steps.manifest.outputs.url }}" --scope aresrpg --token="$VERCEL_TOKEN"
      - name: promote the prepared deployment without rebuilding
        if: steps.manifest.outputs.frontend == 'true'
        run: bun run vercel promote "${{ steps.manifest.outputs.url }}" --yes --scope aresrpg --token="$VERCEL_TOKEN"
      - name: verify production answers
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://aresrpg.world/ >/dev/null
      - name: publish the prepared GitHub Release
        run: gh release edit "v${{ steps.release.outputs.version }}" --draft=false
