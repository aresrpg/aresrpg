#
# THE BOARD DRAINS ITSELF — board hygiene stops being a hand pass.
#
# ROOT CAUSE (#845): every landing here is a FAST-FORWARD PUSH into `edge`. GitHub fires a
# `Fixes #N` close-keyword only when a pull request is MERGED into the DEFAULT branch, so the
# native close chain is inert in this repo and a fixed row outlives its fix. The `landing` job
# below is that chain rebuilt: the board drains as work lands, not on a calendar.
#
# The jobs, in order of how much of the work they carry:
#   landing   — PRIMARY. Every edge push resolves the event's exact before..after commit range and
#               reads the landed commits' associated PR bodies for close-keyword refs. The promotion
#               engine dispatches it explicitly with that same range (`base`+`sha`) because
#               GITHUB_TOKEN ff-pushes do not self-trigger workflows — one range, two arrival paths.
#               Each still-open row closes with the landing PR and commit as evidence.
#   backstop  — the same sweep on a daily schedule over pull requests merged into edge in the last
#               14 days, so a missed, failed, or raced landing run self-heals.
#   link_gate — BLOCKING. A pull request into `edge` must carry a close-keyword the `landing` job
#               will actually read (`Fixes #N` — a SPACE, never `Fixes-#N`), or the `no-issue` label
#               declaring it closes no row on purpose. Same parser, same sources as `landing`, so a
#               green gate MEANS the board drains on landing rather than hoping it does. Read-only.
#   ref_gate  — a conventional pull request with ZERO issue refs gets ONE warning comment: the
#               close chain has nothing to close. A WARNING, never a merge blocker.
#   stale     — the background backstop for rows nobody ever picked up: 7 days without human
#               activity earns `stale-warning`, 7 more earn a not-planned close. Exempt by label:
#               P0, P1, security, owner-gated, epic.
#   sealed_check — a scheduled autopsy of closed P0/P1 rows. It proves each named `Sealed check:`
#               existed in the close-time tree or comments re-open-candidate evidence. It NEVER
#               changes issue state: re-opening stays a human judgment.
#
# SCHEDULES FIRE FROM THE DEFAULT BRANCH (#809, and gate.yml's `release_pins` header says the same):
# until this file reaches master, the `schedule:` trigger runs ZERO times, so `backstop` and `stale`
# are reachable only via workflow_dispatch. `landing` is dispatched on edge by the promotion
# engine itself, so it works the moment this lands there without relying on the suppressed push
# event. This is stated rather than assumed on purpose: an arming path disjoint from its check is
# the #858 disease.
#
# Least privilege: read-only at the top, one write scope per job, and none of them can touch code.
# Fork-safe: no secrets anywhere in this file. `ref_gate` is skipped for fork pull requests, whose
# GITHUB_TOKEN is read-only by design — commenting would 403, and `pull_request_target` (which would
# hand a write token to a fork-triggered run) is not worth a warning comment.
# Board text is untrusted DATA: the script parses it for issue numbers and places it in JSON bodies.
# No board-derived string is ever interpolated into a shell command here.
name: board hygiene
on:
  push:
    branches: [edge]
  pull_request:
    # `labeled`/`unlabeled` are here for link_gate: applying `no-issue` is how a red gate is answered,
    # so the label has to re-run it. Every other pull_request job in this file is marker-idempotent
    # and simply reports the same verdict again.
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [edge, master]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: 'Edge tip immediately BEFORE the landing — the swept range is base..sha'
        required: false
        type: string
      sha:
        description: 'Exact SHA just fast-forwarded to edge — supply both, or neither for the backstop'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: board-hygiene-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  landing:
    name: close on landing
    # A branch-creation or force-push push event carries no usable base to compare against; the
    # daily backstop reconciles those instead of failing loudly on an unreachable commit. A
    # dispatch carries the landed range explicitly; a dispatch WITHOUT it is a hand-run backstop
    # (the mirror of the `inputs.sha == ''` gate the backstop and stale jobs read).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.sha != '') ||
      (github.event_name == 'push' &&
      github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: close every row this landing added
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          LANDED_BASE: ${{ inputs.base }}
          LANDED_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            node scripts/board_hygiene.mjs landing --event "$GITHUB_EVENT_PATH"
            exit
          fi
          # Both ends or nothing: a landing is a RANGE, and a missing base must throw rather than
          # coerce to `sha^`, which would silently sweep the tip of a multi-commit fast-forward and
          # leave the rest of the pull request's rows open — the exact shape of the bug this closes.
          for CANDIDATE in "$LANDED_BASE" "$LANDED_SHA"; do
            case "$CANDIDATE" in
              *[!0-9a-fA-F]*|'') echo "::error::landing dispatch needs base AND sha as full SHAs (base='$LANDED_BASE' sha='$LANDED_SHA')"; exit 1 ;;
            esac
            if [ "${#CANDIDATE}" -ne 40 ]; then echo "::error::landing dispatch SHAs must be 40 hex characters: $CANDIDATE"; exit 1; fi
          done
          node scripts/board_hygiene.mjs landing --base "$LANDED_BASE" --head "$LANDED_SHA"

  backstop:
    name: landed-but-open backstop
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: replay the landing sweep over recently merged pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/board_hygiene.mjs backstop --since-days 14

  stale:
    name: stale ladder
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: warn at 7 days of silence, close 7 days after the warning
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/board_hygiene.mjs stale

  sealed_check:
    name: sealed-check re-open candidates
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # The schedule is loaded from the default branch, but the protected edge tip owns this audit.
      # Full history is required because evidence is verified in each row's close-time tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: edge
          fetch-depth: 0
      - name: flag missing sealed-check proof without reopening anything
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/board_hygiene.mjs sealed-check

  link_gate:
    name: issue-link gate
    # Scoped to pull requests into `edge`, where every unit of work enters. The edge->master promotion
    # is a train artifact carrying already-gated work and a version bump — it closes no row of its own.
    # Read-only and secret-free, so it runs for fork pull requests exactly as it does for ours. It
    # cannot apply `promote-requested`: chain-money PRs therefore stay label-bare until their seat
    # key deliberately releases the hold (label-is-the-hold law).
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'edge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: a landing must drain a row, and batches must name the SSOT check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/board_hygiene.mjs link-gate --pr ${{ github.event.pull_request.number }}

  ref_gate:
    name: issue-ref gate (warning only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: warn when a conventional pull request references no row
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/board_hygiene.mjs ref-gate --pr ${{ github.event.pull_request.number }}
