# THE DEPLOY (owner 2026-08-20): the app builds HERE, where the art tree restores from the
# actions cache in seconds, and ships to Vercel as a PREBUILT output (`vercel deploy
# --prebuilt`) — Vercel's own git builds are retired because their uncacheable full clone of
# the 1.9GB tree burned 20+ minutes per push. A plain `push` trigger, NOT workflow_run:
# workflow_run only fires from the DEFAULT branch's copy of this file. The gate dependency is
# explicit instead — the first
# step waits for the gate workflow to conclude GREEN on this exact sha; red cannot deploy.
# THE SPLIT (owner 2026-08-20): edge.aresrpg.world deploys HERE on every edge commit;
# aresrpg.world (production) deploys ONLY from release.yml when the owner pushes a fresh
# semver tag (`bun pm version patch`). This file carries the deploy
# secret, so it lives OUTSIDE gate.yml (fork-safe, no-secrets by its own law); push events
# on edge only come from this repo's owners.
name: deploy
on:
  push:
    branches: [edge]
permissions:
  contents: read
  actions: read # the gate-poll below reads workflow run conclusions
jobs:
  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_ir5eY7QCUS7qgcTBq81H89FM
      VERCEL_PROJECT_ID: prj_sBuXZOg6DJTciA0SYyTQZhESAekP
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: wait for the gate to conclude GREEN on this sha (red cannot deploy)
        run: |
          for i in $(seq 1 60); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true)
            if [ "$conclusion" = "success" ]; then echo "gate green"; exit 0; fi
            if [ -n "$conclusion" ]; then echo "::error::gate concluded '$conclusion' — refusing to deploy"; exit 1; fi
            echo "gate still running ($i/60)…"; sleep 20
          done
          echo "::error::gate never concluded within 20 minutes"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same art-cache scheme as the gate — the 1.8GB tree restores from cache, not git.
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: pull the Vercel environment
        run: bunx vercel pull --yes --environment=preview --git-branch=edge --scope aresrpg --token="$VERCEL_TOKEN"
      - name: build
        run: bunx vercel build --scope aresrpg --token="$VERCEL_TOKEN"
      - name: deploy the prebuilt output
        id: deploy
        run: echo "url=$(bunx vercel deploy --prebuilt --scope aresrpg --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: point edge.aresrpg.world at the fresh edge deploy
        # `alias set` is the one CLI command that ignores VERCEL_ORG_ID and falls back to the
        # token's personal scope — the explicit team scope is mandatory here.
        run: bunx vercel alias set "${{ steps.deploy.outputs.url }}" edge.aresrpg.world --scope aresrpg --token="$VERCEL_TOKEN"
