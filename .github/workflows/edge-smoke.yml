name: edge smoke

on:
  pull_request:
    paths:
      - '.github/workflows/edge-smoke.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Step zero: the instrument asserts its own sight before a single second of spend.
      # Runs 30710423166 (and its 08:13Z sibling) burned a full install+browser+45min job on an
      # empty key: the signer threw mid-suite and the failure read like an ordinary red instead
      # of "the smoke cannot see". A blind instrument must never be mistaken for a verdict — so
      # this fails LOUD and first. Never a skip, never a green.
      - name: step zero — the real-signing smoke must be able to see
        env:
          VITE_DEV_KEY: ${{ secrets.VITE_DEV_KEY }}
        run: |
          if [ -z "${VITE_DEV_KEY//[[:space:]]/}" ]; then
            echo "::error title=blind smoke::real-signing smoke is BLIND — VITE_DEV_KEY absent/empty; re-set the Actions secret"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Node for the presence-relay probe
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: prod presence-relay — MQTT CONNECT to CONNACK
        run: node scripts/relay_probe.mjs
      - name: restore the newest promote-queue schedule heartbeat
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/promote-queue-heartbeat
          key: promote-queue-heartbeat-probe-${{ github.run_id }}
          restore-keys: |
            promote-queue-heartbeat-
      - name: promote-queue schedule heartbeat is fresh
        if: github.event_name == 'schedule'
        run: node scripts/promote_queue_heartbeat.mjs "$RUNNER_TEMP/promote-queue-heartbeat"
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile --linker=hoisted
      # Step zero's second half. A key that exists but funds nothing reds every signing row below, each one
      # reading like a broken product while the real fact — nobody topped the wallet up — appears nowhere.
      # Placed before the browser install so the two reds stay distinguishable AND the funding one is cheap.
      - name: step zero — the smoke wallet can still pay for what it signs
        env:
          VITE_DEV_KEY: ${{ secrets.VITE_DEV_KEY }}
        run: bun scripts/smoke_wallet_floor.mjs
      - name: install Playwright chromium (the version the frontend devDep pins)
        working-directory: packages/frontend
        run: bunx playwright install --with-deps chromium
      - name: prod-smoke — edge deployment
        working-directory: packages/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../../test/gold/out/pw-prod-smoke-report
          PROD_SMOKE_ORIGIN: https://edge.aresrpg.world
          VITE_DEV_KEY: ${{ secrets.VITE_DEV_KEY }}
        run: >-
          xvfb-run --auto-servernum bunx playwright test
          --config ../../test/gold/playwright.prod-smoke.config.ts
          --reporter=list,html
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-smoke-playwright-report
          path: test/gold/out/pw-prod-smoke-report
          if-no-files-found: warn
