name: edge smoke

on:
  pull_request:
    paths:
      - '.github/workflows/edge-smoke.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile --linker=hoisted
      - name: install Playwright chromium (the version the frontend devDep pins)
        working-directory: packages/frontend
        run: bunx playwright install --with-deps chromium
      - name: prod-smoke — edge deployment
        working-directory: packages/frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../../test/gold/out/pw-prod-smoke-report
          PROD_SMOKE_ORIGIN: https://edge.aresrpg.world
          VITE_DEV_KEY: ${{ secrets.VITE_DEV_KEY }}
        run: >-
          xvfb-run --auto-servernum bunx playwright test
          --config ../../test/gold/playwright.prod-smoke.config.ts
          --reporter=list,html
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-smoke-playwright-report
          path: test/gold/out/pw-prod-smoke-report
          if-no-files-found: warn
