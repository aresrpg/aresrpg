# The enforcement ladder in CI (docs/CODE_LAW.md). Two jobs:
#   ladder    — `bun run lint`: eslint + prettier + the constraint gate (keystroke + commit tiers).
#   fp-codeql — the custom FP query pack as a native GitHub code-scanning analysis (the deep tier).
#
# gate.yml stays the fast deterministic fight-replay gate and is untouched; this file adds the
# constraint + dataflow tiers. Fork-safe: no secrets. Legs whose tooling is absent on a hosted
# runner SKIP loudly via the repo's own fail-open-on-absence mechanism — never weakened, never
# deleted. See the PR / CODE_LAW for the CI-vs-local leg split.
name: checks
on:
  pull_request:
    branches: [edge, master]
  push:
    branches: [edge, master]
permissions:
  contents: read
jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: install semgrep (dataflow leg — commit tier)
        # Pinned: semgrep-gate.sh's fixture self-test compares exact match counts, which can shift
        # between semgrep versions. This is the version the committed baselines were validated against.
        run: pipx install semgrep==1.170.0
      - name: enforcement ladder — bun run lint
        run: bun run lint

  smoke:
    # BOOT SMOKE — the class killer for the migration-stub throw family (a shape-correct-but-empty content
    # stub that throws at module load: invisible to lint + unit tests, fatal in the browser). Builds the
    # frontend, serves dist, drives the logged-out landing headless, and FAILS on any uncaught page error or
    # any non-allowlisted console.error at boot (scripts/boot_smoke.mjs owns the allowlist + its rationale).
    # Fork-safe: no secrets, no backend. Budget < 3 min.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: install Playwright chromium (the version the frontend devDep pins)
        run: bunx playwright install --with-deps chromium
        working-directory: packages/frontend
      - name: boot smoke — zero uncaught errors + zero unexpected console.error on the default page
        run: |
          bunx vite build
          node scripts/boot_smoke.mjs
        working-directory: packages/frontend

  fp-codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: init CodeQL (FP query pack only)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          # Only the aresrpg FP pack (docs/CODE_LAW.md deep tier). Default security-and-quality
          # queries are left to GitHub's default CodeQL setup — this job does not duplicate them.
          config: |
            disable-default-queries: true
            queries:
              - uses: ./scripts/codeql/aresrpg-fp
      - name: analyze (native code scanning — baseline ratchet)
        uses: github/codeql-action/analyze@v3
        with:
          category: aresrpg-fp
