# The enforcement ladder in CI (docs/CODE_LAW.md). Two jobs:
#   ladder    — `bun run lint`: eslint + prettier + the constraint gate (keystroke + commit tiers).
#   fp-codeql — the custom FP query pack as a native GitHub code-scanning analysis (the deep tier).
#
# gate.yml stays the fast deterministic fight-replay gate and is untouched; this file adds the
# constraint + dataflow tiers. Fork-safe: no secrets. Legs whose tooling is absent on a hosted
# runner SKIP loudly via the repo's own fail-open-on-absence mechanism — never weakened, never
# deleted. See the PR / CODE_LAW for the CI-vs-local leg split.
name: checks
on:
  pull_request:
    branches: [edge, master]
  push:
    branches: [edge, master]
permissions:
  contents: read
jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: install semgrep (dataflow leg — commit tier)
        # Pinned: semgrep-gate.sh's fixture self-test compares exact match counts, which can shift
        # between semgrep versions. This is the version the committed baselines were validated against.
        run: pipx install semgrep==1.170.0
      - name: enforcement ladder — bun run lint
        run: bun run lint

  tests:
    # Per-package suites (issue #119): the ladder above is lint-only and gate.yml runs a single
    # deterministic file, so neither surfaces the artifact-skip debt #96/#117 catalogued. This job
    # runs each package's own `test` script as an independent matrix leg (fail-fast: false — one
    # red package must never hide another) and appends its pass/skip/fail triplet to the run
    # summary. Extraction failures are swallowed (`|| true`); the test's own exit code still fails
    # the leg — a parse miss must never mask a real red.
    # #641 UNMASK: engine's leg used to be swallowed here too, for the same environment-dependent
    # burn-down (#125 — closed, folded into #279, which only ever covered frontend) the frontend
    # note below still cites. #641's audit found engine's row was never actually closed out: 6 real
    # failures were hiding behind a forced-success conclusion. All 6 are now fixed at the root —
    # 2 stale pre-dispose mesh-count assertions + 1 stale prettier-form string assertion + 3 tests
    # whose default 5s bun:test timeout was too tight for their real GPU-pool-alloc/world-gen cost
    # under load, not GPU/headless variance as #580 first suspected (dispose_terrain.test.js,
    # pool_renderer.test.js, ground_height.test.js, board_highlights.test.js). Engine now keeps a
    # hard exit code like the other six legs — a real red there fails the run.
    # #801 UNMASK: frontend was the last masked leg (`case … frontend) exit 0`), waived for
    # fight_trace_tee #568 + crush_actions #589 — both closed 2026-07-23, so the waiver outlived its
    # own reasons while six genuine reds shipped as green check-runs in a 32h window (#801's
    # measurement). The mask is gone: EVERY leg now exits its suite's real code. The flake that stood
    # in the way (#769, a playback assertion sampling the pace queue mid-drain on a wall-clock window)
    # is fixed at the root in the same commit — the tests await the queue's own drained signal.
    # No leg in this job may be re-masked: severities only ratchet up (FROZEN.md).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [fight, sim, world, inventory, party, sdk, engine, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: test — packages/${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test-${{ matrix.package }}.log
      - name: pass/skip/fail → step summary
        if: always()
        run: |
          (
            log=/tmp/test-${{ matrix.package }}.log
            pass=$(grep -oE '^ *[0-9]+ pass' "$log" | grep -oE '[0-9]+' || echo 0)
            skip=$(grep -oE '^ *[0-9]+ skip' "$log" | grep -oE '[0-9]+' || echo 0)
            fail=$(grep -oE '^ *[0-9]+ fail' "$log" | grep -oE '[0-9]+' || echo 0)
            {
              echo "| package | pass | skip | fail |"
              echo "|---|---|---|---|"
              echo "| ${{ matrix.package }} | $pass | $skip | $fail |"
            } >> "$GITHUB_STEP_SUMMARY"
          ) || true

  smoke:
    # BOOT SMOKE — the class killer for the migration-stub throw family (a shape-correct-but-empty content
    # stub that throws at module load: invisible to lint + unit tests, fatal in the browser). Builds the
    # frontend, serves dist, drives the logged-out landing headless, and FAILS on any uncaught page error or
    # any non-allowlisted console.error at boot (scripts/boot_smoke.mjs owns the allowlist + its rationale).
    #
    # ENCYCLOPEDIA LEG (issue #165) — a second, independent class killer: the prod encyclopedia once
    # rendered with ~zero item icons and empty obtention data and no gate caught it. Drives the real
    # encyclopedia items tab (a DEV-mode Vite server + the sanctioned dev_wallet Playwright login — see
    # scripts/encyclopedia_smoke.mjs's header for why boot_smoke's prod build/preview can't reach this
    # auth-gated route) against live testnet data and asserts icon-render truth + item-detail truth.
    #
    # Fork-safe: no secrets, no backend. Budget < 4 min.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: install Playwright chromium (the version the frontend devDep pins)
        run: bunx playwright install --with-deps chromium
        working-directory: packages/frontend
      - name: boot smoke — zero uncaught errors + zero unexpected console.error on the default page
        run: |
          bunx vite build
          node scripts/boot_smoke.mjs
        working-directory: packages/frontend
      - name: encyclopedia smoke — icon truth + detail truth (issue #165)
        run: node scripts/encyclopedia_smoke.mjs
        working-directory: packages/frontend

  fp-codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: init CodeQL (FP query pack only)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          # Only the aresrpg FP pack (docs/CODE_LAW.md deep tier). Default security-and-quality
          # queries are left to GitHub's default CodeQL setup — this job does not duplicate them.
          config: |
            disable-default-queries: true
            queries:
              - uses: ./scripts/codeql/aresrpg-fp
      - name: analyze (native code scanning — baseline ratchet)
        uses: github/codeql-action/analyze@v3
        with:
          category: aresrpg-fp
