# The enforcement ladder in CI (docs/CODE_LAW.md). Two jobs:
#   ladder    — `bun run lint`: eslint + prettier + the constraint gate (keystroke + commit tiers).
#   fp-codeql — the custom FP query pack as a native GitHub code-scanning analysis (the deep tier).
#
# gate.yml stays the fast deterministic fight-replay gate and is untouched; this file adds the
# constraint + dataflow tiers. Fork-safe: no secrets. A leg whose tooling is absent on a hosted
# runner is ARMED here (semgrep, sui) rather than skipped: #896 measured the alternative — the
# Move field-cap leg printed `SKIP: sui CLI absent/unusable` and exited 0 on every CI run since it
# landed, so a green `ladder` meant "some gates ran" with nothing distinguishing it from "all of
# them did". Legs that genuinely belong elsewhere name their other verdict path in the SKIP text
# (the CodeQL deep tier names the fp-codeql job below). See the PR / CODE_LAW for the leg split.
name: checks
on:
  pull_request:
    branches: [edge, master]
  push:
    branches: [edge, master]
permissions:
  contents: read
jobs:
  loc-ledger:
    name: LoC ledger gate
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref != 'master' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: new code pays rent (#1603)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail

          ledger_tmp=$(mktemp -d)
          trap 'rm -rf "$ledger_tmp"' EXIT
          range="${BASE_SHA}...${HEAD_SHA}"
          pathspecs=(':(top,glob)**')
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            case "$pattern" in
              ''|'#'*) continue ;;
            esac
            pathspecs+=(":(top,exclude,glob)$pattern")
          done < .github/loc-ledger-excludes

          git diff --no-renames --numstat "$range" -- > "$ledger_tmp/all"
          git diff --no-renames --numstat "$range" -- "${pathspecs[@]}" > "$ledger_tmp/included"

          sum_stats() {
            awk '
              BEGIN { added = deleted = binary = files = 0 }
              $1 == "-" || $2 == "-" { binary++; files++; next }
              { added += $1; deleted += $2; files++ }
              END { print added, deleted, binary, files }
            ' "$1"
          }
          read -r all_added all_deleted all_binary all_files < <(sum_stats "$ledger_tmp/all")
          read -r added deleted binary files < <(sum_stats "$ledger_tmp/included")
          excluded_added=$((all_added - added))
          excluded_deleted=$((all_deleted - deleted))
          excluded_binary=$((all_binary - binary))
          excluded_files=$((all_files - files))
          net=$((added - deleted))

          budget=$(
            node --input-type=module <<'NODE'
          import { parse_close_refs } from './scripts/board_hygiene.mjs'

          // Keep the board parser's quoted-evidence rules and numeric validation as the one parser
          // home. Full-width hashes hide unrelated issue close-refs; only declarations become refs.
          const declaration_refs = String(process.env.PR_BODY ?? '')
            .replaceAll('#', '＃')
            .replace(/\bloc-budget\s*:\s*(\d+)\b/gi, 'fixes #$1')
          const [strictest_budget] = parse_close_refs(declaration_refs, '')
          if (strictest_budget !== undefined) process.stdout.write(String(strictest_budget))
          NODE
          )

          verdict=GREEN
          reason='net LoC is at or below +400 — report only'
          rc=0
          if [ "$net" -gt 400 ]; then
            if [ -z "$budget" ]; then
              verdict=RED
              reason='net LoC exceeds +400 and the PR body has no loc-budget declaration'
              rc=1
            elif [ "$net" -gt "$budget" ]; then
              verdict=RED
              reason="net LoC exceeds the declared loc-budget: $budget"
              rc=1
            else
              reason="net LoC is within the declared loc-budget: $budget"
            fi
          fi

          {
            echo '### LoC ledger (#1603)'
            echo
            echo '| added | deleted | excluded | net | loc-budget | verdict |'
            echo '|---:|---:|---:|---:|---:|:---|'
            printf '| %d | %d | +%d/-%d across %d files (%d binary) | %+d | %s | **%s** |\n' \
              "$added" "$deleted" "$excluded_added" "$excluded_deleted" "$excluded_files" \
              "$excluded_binary" "$net" "${budget:-none}" "$verdict"
            echo
            echo "$reason."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          exit "$rc"

  ladder:
    runs-on: ubuntu-latest
    # 20, not 15: this job compiles the Move set twice on EVERY run — once as the field-cap leg's
    # freshness witness, once inside the size preflight below, which builds each package into its
    # own throwaway --install-dir so no prior command's output can reach the measured number.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # #1101's fixture-adjudication row judges every commit in the PR, not only the aggregate
          # tree diff. The event supplies exact base/head SHAs; their commit objects must be present.
          fetch-depth: 0
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: install semgrep (dataflow leg — commit tier)
        # Pinned: semgrep-gate.sh's fixture self-test compares exact match counts, which can shift
        # between semgrep versions. This is the version the committed baselines were validated against.
        run: pipx install semgrep==1.170.0
      - name: install sui (arms the Move field-cap leg — #896)
        # Pinned, same reason semgrep is: the field-cap verdict is only rendered against build output
        # this toolchain produced. Only the `sui` member is extracted from the release tarball.
        # A tag names a location, not bytes — SUI_SHA256 pins the artifact itself and SUI_VERSION
        # asserts the toolchain that answers, so neither can drift under the tag unnoticed (#945).
        # Provenance: sha256 read from the release-asset digest API for
        # sui-testnet-v1.76.0-ubuntu-x86_64.tgz; version string is the ceremony machine's own
        # `sui --version`. Both read 2026-07-27 — bumping SUI_RELEASE re-reads both.
        #
        # #1284 — THIS PIN IS LOAD-BEARING, not housekeeping. Every Move.toml pins the framework at
        # the build CLI's OWN framework commit, because that is the only configuration that resolves
        # to a single framework rev (Kiosk's transitive edge takes the CLI's implicit rev whatever
        # `override = true` says). So CI's sui and the ceremony's sui must be the SAME build: if they
        # drift, CI re-resolves the locks against a different framework and the Move framework-rev
        # gate in `bun run lint` goes red — by design, loudly, instead of a dual reaching a publish.
        # Bumping this pin means re-pinning every packages/move/**/Move.toml in the same commit.
        env:
          SUI_RELEASE: testnet-v1.76.0
          SUI_SHA256: 4a34ef21e56650772064f946919d262d9e22102034007dccec3cc3418b93505d
          SUI_VERSION: sui 1.76.0-6effb4523834
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_RELEASE}/sui-${SUI_RELEASE}-ubuntu-x86_64.tgz"
          echo "${SUI_SHA256}  /tmp/sui.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/sui.tgz -C "$HOME/.local/bin" ./sui
          rm -f /tmp/sui.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          installed=$("$HOME/.local/bin/sui" --version)
          if [ "$installed" != "$SUI_VERSION" ]; then
            echo "sui version drift: expected '${SUI_VERSION}', got '${installed}'" >&2
            exit 1
          fi
          echo "$installed"
      - name: build Move packages (the field-cap leg's freshness witness)
        # Also the repo's only Move compile in CI: a package that no longer builds now reds here
        # instead of at the publish ceremony.
        run: |
          set -euo pipefail
          for manifest in packages/move/*/Move.toml; do
            sui move build --path "$(dirname "$manifest")"
          done
      - name: test Move packages (#1242 — 1100+ Move tests now gate, not just build)
        # fail-fast OFF by hand (no `set -e`): every package's suite must report, one red package must
        # never hide another. `overall` latches the worst exit code across the loop.
        run: |
          set -uo pipefail
          overall=0
          for manifest in packages/move/*/Move.toml; do
            dir="$(dirname "$manifest")"
            echo "::group::sui move test — $dir"
            sui move test --path "$dir" || overall=1
            echo "::endgroup::"
          done
          exit "$overall"
      - name: republish window — mode gate + Move package size (#1581)
        # The ceremony preflight has two modes and CI owns the half that needs no chain.
        #   · --mode-check is hermetic (repo bytes + the GitHub context) and FAILS when a
        #     packages/move/REPUBLISH_WINDOW marker rides a master-bound run — the window lives on
        #     edge and must never be promoted to production. That refusal is the whole reason this
        #     step is armed here rather than left to the ceremony operator's terminal.
        #   · --size-only measures every package's predicted on-chain MovePackage object size and
        #     fails on the chain's 102400-byte ceiling OR the package's committed SIZE_BUDGETS row.
        #     It needs a local build and NOTHING else — no fullnode, no identity, no upgrade cap —
        #     which is exactly why it can run on a pull request. The compat leg still cannot, so it
        #     stays in the ceremony.
        #
        # #1581 — THIS RUNS UNCONDITIONALLY, and that is the fix. It used to be `if [ -f
        # packages/move/REPUBLISH_WINDOW ]`, so in the steady state (no marker) NOTHING in CI ever
        # measured a package's size. `aresrpg` crossed the chain ceiling on edge at ff00a0b6 and sat
        # there breaching — every queued Move upgrade dead on arrival with MovePackageTooBig — until
        # a human happened to run the ceremony preflight by hand. A gate that only arms during a
        # ceremony cannot catch what a PR lands; the numbers now print on every Move PR, green ones
        # included, so headroom is a thing contributors see rather than discover.
        run: |
          set -euo pipefail
          node packages/move/scripts/ceremony_preflight_compat.mjs --mode-check
          node packages/move/scripts/ceremony_preflight_compat.mjs --size-only
      - name: the landing engine's own harnesses (#1573)
        # These pin the promotion asserts, the post-landing dispatch argv and the stamper split, and
        # until now NOTHING ran them — the machinery that closes the board was guarded by tests no
        # gate invoked, which is how a dispatch could go wrong twice without CI noticing. The split
        # check is the static half of "the unattended engine cannot mint its own `promoted`"; the
        # runtime half is promote-queue.yml's forge-canary. Pure bash, no network.
        run: |
          bash .github/scripts/test/promote-green-eval-check.sh
          bash .github/scripts/test/promote-land-dispatch-check.sh
          bash .github/scripts/test/promote-split-check.sh
      - name: the smoke suites' own decision gates
        # Same disease as the step above, one layer out: `bun ares test unit` carries these rows but no
        # workflow invokes that slice, so a gate could land and never run. All are pure — the prod-smoke
        # signing guard/verdict/ledger decisions (#1723), the workflow-registry reconciliation over
        # captured bytes (#835), and the two board-automation suites (#2013): board_hygiene's drain
        # verbs (#1885) and the sentry-triage valve (#1991), which decide what the unattended engine
        # closes and files. `bun run test` walks packages/* only, so a root-level scripts/*.test.mjs is
        # reachable from nowhere until it is named here — 99 assertions had never executed in CI. No
        # network, no browser, milliseconds. The live half of each stays where it belongs: edge-smoke.yml
        # signs on testnet, board-hygiene.yml and sentry-triage.yml read the real board.
        run: bun test test/gold/specs_prod_smoke/signing_ledger_test.ts scripts/check-workflow-registry.test.mjs scripts/board_hygiene.test.mjs scripts/sentry_triage.test.mjs
      - name: enforcement ladder — bun run lint
        run: bun run lint

  tests:
    # Per-package suites (issue #119): the ladder above is lint-only and gate.yml runs a single
    # deterministic file, so neither surfaces the artifact-skip debt #96/#117 catalogued. This job
    # runs each package's own `test` script as an independent matrix leg (fail-fast: false — one
    # red package must never hide another) and appends its pass/skip/fail triplet to the run
    # summary. Extraction failures are swallowed (`|| true`); the test's own exit code still fails
    # the leg — a parse miss must never mask a real red.
    # #641 UNMASK: engine's leg used to be swallowed here too, for the same environment-dependent
    # burn-down (#125 — closed, folded into #279, which only ever covered frontend) the frontend
    # note below still cites. #641's audit found engine's row was never actually closed out: 6 real
    # failures were hiding behind a forced-success conclusion. All 6 are now fixed at the root —
    # 2 stale pre-dispose mesh-count assertions + 1 stale prettier-form string assertion + 3 tests
    # whose default 5s bun:test timeout was too tight for their real GPU-pool-alloc/world-gen cost
    # under load, not GPU/headless variance as #580 first suspected (dispose_terrain.test.js,
    # pool_renderer.test.js, ground_height.test.js, board_highlights.test.js). Engine now keeps a
    # hard exit code like the other six legs — a real red there fails the run.
    # #801 UNMASK: frontend was the last masked leg (`case … frontend) exit 0`), waived for
    # fight_trace_tee #568 + crush_actions #589 — both closed 2026-07-23, so the waiver outlived its
    # own reasons while six genuine reds shipped as green check-runs in a 32h window (#801's
    # measurement). The mask is gone: EVERY leg now exits its suite's real code. The flake that stood
    # in the way (#769, a playback assertion sampling the pace queue mid-drain on a wall-clock window)
    # is fixed at the root in the same commit — the tests await the queue's own drained signal.
    # No leg in this job may be re-masked: severities only ratchet up (FROZEN.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #996 HERMETIC: this job is REQUIRED, so its verdict may only depend on bytes in the repo.
    # Two frontend rows (src/chain/read_templates.test.js, src/chain/live_reads.test.js) default to
    # reading LIVE Sui testnet, which puts remote availability and off-repo seed-corpus content on
    # the gate — a blip or a content edit reds every open PR on commits that touch nothing. Both
    # files already honour ARES_SKIP_LIVE=1 (their own convention); setting it here is what makes
    # the required leg hermetic. The live reads keep an honest home in the advisory `live-canary`
    # job below — this removes their GATE power, not their signal.
    env:
      ARES_SKIP_LIVE: '1'
    strategy:
      fail-fast: false
      matrix:
        package: [fight, sim, world, inventory, party, sdk, engine, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: test — packages/${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test-${{ matrix.package }}.log
      - name: pass/skip/fail → step summary
        if: always()
        run: |
          (
            log=/tmp/test-${{ matrix.package }}.log
            pass=$(grep -oE '^ *[0-9]+ pass' "$log" | grep -oE '[0-9]+' || echo 0)
            skip=$(grep -oE '^ *[0-9]+ skip' "$log" | grep -oE '[0-9]+' || echo 0)
            fail=$(grep -oE '^ *[0-9]+ fail' "$log" | grep -oE '[0-9]+' || echo 0)
            {
              echo "| package | pass | skip | fail |"
              echo "|---|---|---|---|"
              echo "| ${{ matrix.package }} | $pass | $skip | $fail |"
            } >> "$GITHUB_STEP_SUMMARY"
          ) || true

  tests-indexer:
    name: tests (indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install Rust toolchain
        # Pin the compiler used to validate the standalone indexer crate; rustup verifies the
        # toolchain artifacts and the version assertion makes accidental runner drift loud.
        env:
          RUST_TOOLCHAIN: 1.91.1
          RUSTC_VERSION: rustc 1.91.1 (ed61e7d7e 2025-11-07)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt \
            --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          installed=$(rustc --version)
          if [ "$installed" != "$RUSTC_VERSION" ]; then
            echo "rustc version drift: expected '${RUSTC_VERSION}', got '${installed}'" >&2
            exit 1
          fi
          echo "$installed"
      - name: cargo fmt --check
        working-directory: packages/rpc/indexer
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: packages/rpc/indexer
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        working-directory: packages/rpc/indexer
        run: cargo test

  live-canary:
    # THE LIVE READS' NEW HOME (#996) — the two frontend rows the `tests` job above now skips
    # (src/chain/read_templates.test.js, src/chain/live_reads.test.js) run here against live Sui
    # testnet, on the same trigger, so the drift they were built to catch (a gRPC wrapper
    # re-migration, an item.move event-type/field-name change) is still measured on every PR.
    #
    # ADVISORY BY CONSTRUCTION — and that is a deliberate exception to this file's no-masking law,
    # not an oversight of it. The promotion engine fails CLOSED on any non-green check-run on the
    # head sha (.github/scripts/promote-green-eval.sh gate 1, name-independent) and derives its
    # required set from THIS FILE's job names (gate 2, issue #725) — so a job added here that can
    # report red does not merely gate the PR, it wedges the land-on-green queue until a human
    # clears it. A verdict that depends on remote availability and on off-repo seed-corpus content
    # must never hold that lever: that is the exact coupling #996 exists to remove. The test step
    # therefore records its outcome in the step summary and always exits 0; `continue-on-error`
    # covers the same property for the infra steps around it. The signal is the summary line, read
    # by a human; it is not, and must not become, an exit code.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: live chain reads vs testnet — advisory verdict, never an exit code
        working-directory: packages/frontend
        run: |
          bun test src/chain/read_templates.test.js src/chain/live_reads.test.js 2>&1 | tee /tmp/live-canary.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" = 0 ]; then verdict='PASS'; else verdict="FAIL (exit $rc)"; fi
          {
            echo "### live-canary — advisory, gates nothing (#996)"
            echo ""
            echo "\`packages/frontend/src/chain/{read_templates,live_reads}.test.js\` vs live Sui testnet: **$verdict**"
            echo ""
            echo "A FAIL here is not evidence of a code defect on its own — testnet being down or a"
            echo "seed-corpus edit produce the same red. Read the log before blaming the diff."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE CANARY VERDICT: $verdict"

  smoke:
    # BOOT SMOKE — the class killer for the migration-stub throw family (a shape-correct-but-empty content
    # stub that throws at module load: invisible to lint + unit tests, fatal in the browser). Builds the
    # frontend, serves dist, drives the logged-out landing headless, and FAILS on any uncaught page error or
    # any blocking console.error at boot (scripts/boot_smoke_filter.mjs owns that decision + its rationale:
    # the allowlist, plus the #1361 exemption for browser-native WebSocket failures aimed at our own relays).
    #
    # ENCYCLOPEDIA LEG (issue #165) — a second, independent class killer: the prod encyclopedia once
    # rendered with ~zero item icons and empty obtention data and no gate caught it. Drives the real
    # encyclopedia items tab (a DEV-mode Vite server + the sanctioned dev_wallet Playwright login — see
    # scripts/encyclopedia_smoke.mjs's header for why boot_smoke's prod build/preview can't reach this
    # auth-gated route) against live testnet data and asserts icon-render truth + item-detail truth.
    #
    # Fork-safe: no secrets, no backend. Budget < 4 min.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install deps
        run: bun install --frozen-lockfile
      - name: install Playwright chromium (the version the frontend devDep pins)
        run: bunx playwright install --with-deps chromium
        working-directory: packages/frontend
      - name: boot smoke — zero uncaught errors + zero unexpected console.error on the default page
        run: |
          bunx vite build
          node scripts/boot_smoke.mjs
        working-directory: packages/frontend
      - name: encyclopedia smoke — icon truth + detail truth (issue #165)
        run: node scripts/encyclopedia_smoke.mjs
        working-directory: packages/frontend

  fp-codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: init CodeQL (FP query pack only)
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          languages: javascript-typescript
          build-mode: none
          # Only the aresrpg FP pack (docs/CODE_LAW.md deep tier). Default security-and-quality
          # queries are left to GitHub's default CodeQL setup — this job does not duplicate them.
          config: |
            disable-default-queries: true
            queries:
              - uses: ./scripts/codeql/aresrpg-fp
      - name: analyze (native code scanning — baseline ratchet)
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          category: aresrpg-fp
