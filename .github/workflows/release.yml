# © 2026 Sceat — All rights reserved. See LICENSE.
# Release preparation — every owner-pushed vX.Y.Z tag publishes changed backend images to GHCR,
# and stages a production-variable Vercel deployment without moving aresrpg.world. The separate
# manual activation workflow promotes that exact deployment and publishes the generated draft
# GitHub Release after production answers. Discord communication is a separate owner-requested action.
# The tag commit is already an edge commit produced by `bun pm version`; Actions never creates or
# moves release tags.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  actions: read # the prod-deploy job polls the gate run's conclusion
jobs:
  tag-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.release.outputs.created }}
      prepare: 'true'
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags visible for the idempotence check
          # This job reads only the root version — never art.
          filter: blob:none
          sparse-checkout: |
            bun.lock
            package.json
          sparse-checkout-cone-mode: false
      - name: resolve version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}" || { echo "::error::tag $GITHUB_REF_NAME does not match package version $version"; exit 1; }
          git fetch origin edge --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/edge || { echo "::error::release tag is not an edge commit"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: create draft release if absent
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          target=$(git rev-list -n 1 "$TAG")
          [ "$target" = "$GITHUB_SHA" ] || { echo "::error::$TAG points at $target instead of $GITHUB_SHA"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "draft release already exists — resuming preparation"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # PRODUCTION PREPARE: the release tag builds with production variables but never moves aresrpg.world.
  # The manual activate-production workflow promotes this exact staged deployment after the
  # owner has paused gameplay, published content, and rolled the prepared Helm release.
  prepare-production:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: team_ir5eY7QCUS7qgcTBq81H89FM
      VERCEL_PROJECT_ID: prj_sBuXZOg6DJTciA0SYyTQZhESAekP
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: wait for the gate to conclude GREEN on this sha (red cannot deploy)
        run: |
          for i in $(seq 1 60); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true)
            if [ "$conclusion" = "success" ]; then echo "gate green"; exit 0; fi
            if [ -n "$conclusion" ]; then echo "::error::gate concluded '$conclusion' — refusing to deploy"; exit 1; fi
            echo "gate still running ($i/60)…"; sleep 20
          done
          echo "::error::gate never concluded within 20 minutes"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same art-cache scheme as the gate — the 1.8GB tree restores from cache, not git.
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: pull the Vercel environment
        run: bunx vercel pull --yes --environment=production --scope aresrpg --token="$VERCEL_TOKEN"
      - name: build
        run: bunx vercel build --prod --scope aresrpg --token="$VERCEL_TOKEN"
      - name: stage v${{ needs.tag-and-release.outputs.version }} without moving production domains
        id: deploy
        run: echo "url=$(bunx vercel deploy --prebuilt --prod --skip-domain --scope aresrpg --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

  backend-plan:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      server: ${{ steps.plan.outputs.server }}
      server_version: ${{ steps.plan.outputs.server_version }}
      server_previous_version: ${{ steps.plan.outputs.server_previous_version }}
      indexer: ${{ steps.plan.outputs.indexer }}
      indexer_version: ${{ steps.plan.outputs.indexer_version }}
      indexer_previous_version: ${{ steps.plan.outputs.indexer_previous_version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: wait for the gate to conclude GREEN on this sha
        run: |
          for i in $(seq 1 60); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true)
            if [ "$conclusion" = "success" ]; then echo "gate green"; exit 0; fi
            if [ -n "$conclusion" ]; then echo "::error::gate concluded '$conclusion' — refusing image publication"; exit 1; fi
            echo "gate still running ($i/60)…"; sleep 20
          done
          echo "::error::gate never concluded within 20 minutes"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            bun.lock
            package.json
            packages/engine
            packages/fight
            packages/immutable
            packages/indexer
            packages/protocol
            packages/sdk/package.json
            packages/server
            seed/content
            seed/structures
      - name: derive changed backend images from release-tag inputs
        id: plan
        run: |
          current_tag="v${{ needs.tag-and-release.outputs.version }}"
          previous_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Fxv "$current_tag" | head -1 || true)
          server_version="${{ needs.tag-and-release.outputs.version }}"
          indexer_version="${{ needs.tag-and-release.outputs.version }}"
          server_previous_version=""
          indexer_previous_version=""
          server=true
          indexer=true

          if [ -n "$previous_tag" ]; then
            server_previous_version=$(git show "$previous_tag:packages/server/package.json" | node -e \
              "let value=''; process.stdin.on('data', chunk => value += chunk).on('end', () => console.log(JSON.parse(value).version))")
            indexer_previous_version=$(git show "$previous_tag:packages/indexer/Cargo.toml" | awk -F'"' '/^version = / { print $2; exit }')
            server=false
            indexer=false
            if ! git diff --quiet "$previous_tag" "$GITHUB_SHA" -- \
              packages/engine/package.json packages/engine/src \
              packages/fight/package.json packages/fight/src \
              packages/immutable/package.json packages/immutable/src \
              packages/protocol/package.json packages/protocol/src \
              packages/server/package.json packages/server/src packages/server/Dockerfile \
              seed/content seed/structures; then server=true; fi
            if ! diff -q \
              <(git show "$previous_tag:bun.lock" | sed -E '/^[[:space:]]+"version": "[0-9]+\.[0-9]+\.[0-9]+",$/d') \
              <(sed -E '/^[[:space:]]+"version": "[0-9]+\.[0-9]+\.[0-9]+",$/d' bun.lock) >/dev/null; then
              server=true
            fi
            if ! git diff --quiet "$previous_tag" "$GITHUB_SHA" -- \
              packages/indexer/Cargo.toml packages/indexer/Cargo.lock packages/indexer/Dockerfile packages/indexer/src; then indexer=true; fi
          fi

          {
            echo "previous_tag=$previous_tag"
            echo "server=$server"
            echo "server_version=$server_version"
            echo "server_previous_version=$server_previous_version"
            echo "indexer=$indexer"
            echo "indexer_version=$indexer_version"
            echo "indexer_previous_version=$indexer_previous_version"
          } >> "$GITHUB_OUTPUT"

  build-server:
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest || steps.alias.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
            !music
          sparse-checkout-cone-mode: false
      - name: authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create Buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: reuse this immutable server semver on a preparation rerun
        id: image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/server:${{ needs.backend-plan.outputs.server_version }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            if [ "${{ needs.backend-plan.outputs.server }}" = true ]; then
              revision=$(docker buildx imagetools inspect "$image" --format '{{json .Image.Config.Labels}}' \
                | jq -r '.["org.opencontainers.image.revision"]')
              [ "$revision" = "$GITHUB_SHA" ] || {
                echo "::error::$image already belongs to source $revision, refusing semver reuse for $GITHUB_SHA"
                exit 1
              }
            else
              previous_release="${{ needs.backend-plan.outputs.previous_tag }}"
              previous_release="${previous_release#v}"
              source="ghcr.io/${{ github.repository_owner }}/server:$previous_release"
              if ! docker manifest inspect "$source" >/dev/null 2>&1; then
                source="ghcr.io/${{ github.repository_owner }}/server:${{ needs.backend-plan.outputs.server_previous_version }}"
              fi
              expected=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' | tr -d '"')
              actual=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
              [ "$actual" = "$expected" ] || {
                echo "::error::$image does not alias the expected unchanged server digest"
                exit 1
              }
            fi
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: build and push server
        id: build
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.server == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/server:${{ needs.backend-plan.outputs.server_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.backend-plan.outputs.server_version }}
            org.opencontainers.image.licenses=LicenseRef-AresRPG-Source-Available
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/server:buildcache,mode=max
          provenance: false
          sbom: true
      - name: alias unchanged server digest to this release
        id: alias
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.server != 'true'
        run: |
          repository="ghcr.io/${{ github.repository_owner }}/server"
          previous_release="${{ needs.backend-plan.outputs.previous_tag }}"
          previous_release="${previous_release#v}"
          source="$repository:$previous_release"
          if ! docker manifest inspect "$source" >/dev/null 2>&1; then
            source="$repository:${{ needs.backend-plan.outputs.server_previous_version }}"
          fi
          docker manifest inspect "$source" >/dev/null || { echo "::error::no previous server image exists"; exit 1; }
          docker buildx imagetools create --tag "$repository:${{ needs.backend-plan.outputs.server_version }}" "$source"
          digest=$(docker buildx imagetools inspect "$repository:${{ needs.backend-plan.outputs.server_version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: attest server provenance
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.server == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-indexer:
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest || steps.alias.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: packages/indexer
      - name: authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create Buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: reuse this immutable indexer semver on a preparation rerun
        id: image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/indexer:${{ needs.backend-plan.outputs.indexer_version }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            if [ "${{ needs.backend-plan.outputs.indexer }}" = true ]; then
              revision=$(docker buildx imagetools inspect "$image" --format '{{json .Image.Config.Labels}}' \
                | jq -r '.["org.opencontainers.image.revision"]')
              [ "$revision" = "$GITHUB_SHA" ] || {
                echo "::error::$image already belongs to source $revision, refusing semver reuse for $GITHUB_SHA"
                exit 1
              }
            else
              previous_release="${{ needs.backend-plan.outputs.previous_tag }}"
              previous_release="${previous_release#v}"
              source="ghcr.io/${{ github.repository_owner }}/indexer:$previous_release"
              if ! docker manifest inspect "$source" >/dev/null 2>&1; then
                source="ghcr.io/${{ github.repository_owner }}/indexer:${{ needs.backend-plan.outputs.indexer_previous_version }}"
              fi
              expected=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' | tr -d '"')
              actual=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
              [ "$actual" = "$expected" ] || {
                echo "::error::$image does not alias the expected unchanged indexer digest"
                exit 1
              }
            fi
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: build and push indexer
        id: build
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.indexer == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: packages/indexer
          file: packages/indexer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/indexer:${{ needs.backend-plan.outputs.indexer_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.backend-plan.outputs.indexer_version }}
            org.opencontainers.image.licenses=LicenseRef-AresRPG-Source-Available
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indexer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indexer:buildcache,mode=max
          provenance: false
          sbom: true
      - name: alias unchanged indexer digest to this release
        id: alias
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.indexer != 'true'
        run: |
          repository="ghcr.io/${{ github.repository_owner }}/indexer"
          previous_release="${{ needs.backend-plan.outputs.previous_tag }}"
          previous_release="${previous_release#v}"
          source="$repository:$previous_release"
          if ! docker manifest inspect "$source" >/dev/null 2>&1; then
            source="$repository:${{ needs.backend-plan.outputs.indexer_previous_version }}"
          fi
          docker manifest inspect "$source" >/dev/null || { echo "::error::no previous indexer image exists"; exit 1; }
          docker buildx imagetools create --tag "$repository:${{ needs.backend-plan.outputs.indexer_version }}" "$source"
          digest=$(docker buildx imagetools inspect "$repository:${{ needs.backend-plan.outputs.indexer_version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: attest indexer provenance
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.indexer == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/indexer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-manifest:
    needs: [tag-and-release, backend-plan, build-server, build-indexer, prepare-production]
    if: >-
      always() &&
      needs.tag-and-release.outputs.prepare == 'true' &&
      needs.backend-plan.result == 'success' &&
      needs.prepare-production.result == 'success' &&
      (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') &&
      (needs.build-indexer.result == 'success' || needs.build-indexer.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: pins.json
      - name: write immutable release manifest
        env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
          PREVIOUS_TAG: ${{ needs.backend-plan.outputs.previous_tag }}
          SERVER_BUILT: ${{ needs.backend-plan.outputs.server }}
          SERVER_VERSION: ${{ needs.backend-plan.outputs.server_version }}
          SERVER_DIGEST: ${{ needs.build-server.outputs.digest }}
          INDEXER_BUILT: ${{ needs.backend-plan.outputs.indexer }}
          INDEXER_VERSION: ${{ needs.backend-plan.outputs.indexer_version }}
          INDEXER_DIGEST: ${{ needs.build-indexer.outputs.digest }}
          VERCEL_URL: ${{ needs.prepare-production.outputs.url }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-release"
          jq -n \
            --arg version "$VERSION" \
            --arg source_sha "$GITHUB_SHA" \
            --arg previous_tag "$PREVIOUS_TAG" \
            --arg vercel_url "$VERCEL_URL" \
            --arg server_version "$SERVER_VERSION" \
            --arg server_digest "$SERVER_DIGEST" \
            --arg indexer_version "$INDEXER_VERSION" \
            --arg indexer_digest "$INDEXER_DIGEST" \
            --arg game_original "$(jq -r .testnet.package_original pins.json)" \
            --arg game_latest "$(jq -r .testnet.package pins.json)" \
            --arg seed_original "$(jq -r .testnet.seed_package_original pins.json)" \
            --arg seed_latest "$(jq -r .testnet.seed_package pins.json)" \
            --argjson server_built "$SERVER_BUILT" \
            --argjson indexer_built "$INDEXER_BUILT" \
            '{
              schema: 1,
              status: "prepared",
              version: $version,
              source_sha: $source_sha,
              previous_tag: $previous_tag,
              network: "testnet",
              vercel: {staged_url: $vercel_url},
              packages: {
                game: {original: $game_original, latest: $game_latest},
                seed: {original: $seed_original, latest: $seed_latest}
              },
              images: {
                server: {repository: "ghcr.io/aresrpg/server", version: $server_version, digest: $server_digest, built: $server_built},
                indexer: {repository: "ghcr.io/aresrpg/indexer", version: $indexer_version, digest: $indexer_digest, built: $indexer_built}
              }
            }' > "$RUNNER_TEMP/production-release/release-manifest.json"
          cat "$RUNNER_TEMP/production-release/release-manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - name: retain the production activation record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-v${{ needs.tag-and-release.outputs.version }}
          path: ${{ runner.temp }}/production-release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
