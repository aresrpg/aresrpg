# Owner-dispatched tags prepare immutable GHCR images and stage Vercel without moving production.
# Activation promotes that exact preparation. Actions never creates or moves release tags.
name: release
run-name: prepare ${{ github.ref_name }} mainnet ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Release recovery identity
        required: true
        type: string
env:
  SUI_NETWORK: mainnet
permissions:
  contents: write
  actions: read # release certification waits for this source's successful gate
jobs:
  tag-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.release.outputs.created }}
      prepare: 'true'
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: authorize the release owner and network
        env:
          ACTOR_ID: ${{ github.event.sender.id }}
          ACTOR: ${{ github.actor }}
        run: |
          test "$ACTOR_ID" = "11330271" && test "$ACTOR" = "Sceat"
          test "$SUI_NETWORK" = mainnet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags visible for the idempotence check
          filter: blob:none
          sparse-checkout: |
            bun.lock
            package.json
          sparse-checkout-cone-mode: false
      - name: resolve version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}" || { echo "::error::tag $GITHUB_REF_NAME does not match package version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: create draft release if absent
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          target=$(git rev-list -n 1 "$TAG")
          [ "$target" = "$GITHUB_SHA" ] || { echo "::error::$TAG points at $target instead of $GITHUB_SHA"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "draft release already exists — resuming preparation"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Preparation can build ahead; only a green verification can certify its manifest.
  verify-gate:
    needs: tag-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: require successful verification of the exact release source
        run: |
          for i in $(seq 1 135); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/runs?event=push&branch=edge&head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true)
            if [ "$conclusion" = "success" ]; then echo "gate green"; exit 0; fi
            if [ -n "$conclusion" ]; then echo "::error::gate concluded '$conclusion' — refusing release certification"; exit 1; fi
            echo "gate still running ($i/135)…"; sleep 20
          done
          echo "::error::gate never concluded within 45 minutes"; exit 1

  # Stage production variables without moving domains; activation follows reviewed backend rollout.
  prepare-production:
    needs: [tag-and-release, backend-plan]
    if: needs.backend-plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: team_ir5eY7QCUS7qgcTBq81H89FM
      VERCEL_PROJECT_ID: prj_sBuXZOg6DJTciA0SYyTQZhESAekP
      ARES_DEPLOYMENT_ID: ares-${{ github.run_id }}-${{ github.run_attempt }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VITE_NETWORK: mainnet
      VITE_GRAPHQL_URL: https://graphql.mainnet.sui.io/graphql
      VITE_SUI_RPC_URL: https://fullnode.mainnet.sui.io:443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: pull the Vercel environment
        run: bun run vercel pull --yes --environment=production --scope aresrpg --token="$VERCEL_TOKEN"
      - name: build
        run: bun run vercel build --prod --scope aresrpg --token="$VERCEL_TOKEN"
      - name: pin prebuilt deployment assets
        run: bun --env-file=.vercel/.env.production.local scripts/pin_vercel_deployment.ts
      - name: stage v${{ needs.tag-and-release.outputs.version }} without moving production domains
        id: deploy
        run: echo "url=$(bun run vercel deploy --prebuilt --prod --skip-domain --scope aresrpg --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

  backend-plan:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ needs.tag-and-release.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      bot: ${{ steps.plan.outputs.bot }}
      bot_digest: ${{ steps.plan.outputs.bot_digest }}
      discord: ${{ steps.plan.outputs.discord }}
      discord_digest: ${{ steps.plan.outputs.discord_digest }}
      server: ${{ steps.plan.outputs.server }}
      server_digest: ${{ steps.plan.outputs.server_digest }}
      indexer: ${{ steps.plan.outputs.indexer }}
      indexer_digest: ${{ steps.plan.outputs.indexer_digest }}
      frontend: ${{ steps.plan.outputs.frontend }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            packages/fight
            packages/immutable
            packages/indexer
            packages/protocol
            packages/server
            packages/discord
            seed/content
            seed/structures
            scripts/release_inputs.mjs
            package.json
      - name: setup the pinned locale parser
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: derive changed backend images from release-tag inputs
        id: plan
        run: |
          previous_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          bot=true
          bot_digest=""
          discord=true
          discord_digest=""
          server=true
          indexer=true
          frontend=true
          server_digest=""
          indexer_digest=""
          if [ -n "$previous_tag" ]; then
            export PREVIOUS_TAG="$previous_tag"
            node --input-type=module <<'NODE' > "$RUNNER_TEMP/runtime-plan.json"
          import { runtime_fingerprints } from './scripts/release_inputs.mjs'
          const before = await runtime_fingerprints(process.cwd(), process.env.PREVIOUS_TAG)
          const after = await runtime_fingerprints(process.cwd(), process.env.GITHUB_SHA)
          console.log(JSON.stringify(Object.fromEntries(Object.keys(after).map(key => [key, before[key] !== after[key]]))))
          NODE
            bot=$(jq -r .bot "$RUNNER_TEMP/runtime-plan.json")
            discord=$(jq -r .discord "$RUNNER_TEMP/runtime-plan.json")
            server=$(jq -r .server "$RUNNER_TEMP/runtime-plan.json")
            indexer=$(jq -r .indexer "$RUNNER_TEMP/runtime-plan.json")
            frontend=$(jq -r .frontend "$RUNNER_TEMP/runtime-plan.json")
            # Build pins are runtime inputs; ledgers are not. A network switch also needs a new frontend.
            git show "$previous_tag:pins.json" | jq --arg n "$SUI_NETWORK" 'select(.network == $n) | del(.seed_ledger)' > "$RUNNER_TEMP/before-pins.json"
            git show "$GITHUB_SHA:pins.json" | jq --arg n "$SUI_NETWORK" 'select(.network == $n) | del(.seed_ledger)' > "$RUNNER_TEMP/after-pins.json"
            if ! cmp -s "$RUNNER_TEMP/before-pins.json" "$RUNNER_TEMP/after-pins.json"; then frontend=true; fi
            previous_run=$(gh run list --workflow release.yml --commit "$(git rev-list -n 1 "$previous_tag")" --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            previous_manifest="$RUNNER_TEMP/previous-release/release-manifest.json"
            if [ -n "$previous_run" ] && gh run download "$previous_run" --name "production-release-$previous_tag" --dir "$RUNNER_TEMP/previous-release" &&
              jq -e --arg sha "$(git rev-list -n 1 "$previous_tag")" --arg version "${previous_tag#v}" \
                --arg repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" '
                (.schema == 1 or .schema == 2) and .status == "prepared" and .source_sha == $sha and .version == $version and
                (.network == "mainnet") and
                .images.server.repository == ($repository + "/server") and
                .images.indexer.repository == ($repository + "/indexer") and
                ([.images.server.digest, .images.indexer.digest] |
                  all(type == "string" and test("^sha256:[0-9a-f]{64}$")))
              ' "$previous_manifest" >/dev/null; then
              if jq -e '.images.bot.repository == "ghcr.io/aresrpg/bot" and (.images.bot.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$previous_manifest" >/dev/null; then
                bot_digest=$(jq -r .images.bot.digest "$previous_manifest")
              else
                bot=true
              fi
              if jq -e '.images.discord.repository == "ghcr.io/aresrpg/discord" and (.images.discord.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$previous_manifest" >/dev/null; then
                discord_digest=$(jq -r .images.discord.digest "$previous_manifest")
              else
                discord=true
              fi
              server_digest=$(jq -r .images.server.digest "$previous_manifest")
              indexer_digest=$(jq -r .images.indexer.digest "$previous_manifest")
            else
              echo "No reusable mainnet preparation manifest; rebuilding all artifacts"
              bot=true
              discord=true
              server=true
              indexer=true
              frontend=true
            fi
          fi
          {
            echo "previous_tag=$previous_tag"
            echo "bot=$bot"
            echo "bot_digest=$bot_digest"
            echo "discord=$discord"
            echo "discord_digest=$discord_digest"
            echo "server=$server"
            echo "server_digest=$server_digest"
            echo "indexer=$indexer"
            echo "indexer_digest=$indexer_digest"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"
  build-server:
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest || steps.alias.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/server
      IMAGE_VERSION: ${{ needs.backend-plan.outputs.version }}
      IMAGE_DIGEST: ${{ needs.backend-plan.outputs.server_digest }}
      IMAGE_CHANGED: ${{ needs.backend-plan.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons/*
            /seed/icons/currency/
            !seed/icons/currency/*
            /seed/icons/currency/kares.png
            !seed/models
            !music
          sparse-checkout-cone-mode: false
      - name: authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: reuse this immutable server semver on a preparation rerun
        id: image
        run: bash scripts/release_image.sh inspect
      - name: build and push server
        id: build
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.server == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/server:${{ needs.backend-plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.backend-plan.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-AresRPG-Source-Available
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/server:buildcache,mode=max
          provenance: false
          sbom: true
      - name: alias unchanged server digest to this release
        id: alias
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.server != 'true'
        run: bash scripts/release_image.sh alias
      - name: attest server provenance
        if: needs.backend-plan.outputs.server == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/server
          subject-digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true
  build-bot:
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest || steps.alias.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/bot
      IMAGE_VERSION: ${{ needs.backend-plan.outputs.version }}
      IMAGE_DIGEST: ${{ needs.backend-plan.outputs.bot_digest }}
      IMAGE_CHANGED: ${{ needs.backend-plan.outputs.bot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
            !music
          sparse-checkout-cone-mode: false
      - name: authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: reuse this immutable bot semver on a preparation rerun
        id: image
        run: bash scripts/release_image.sh inspect
      - name: build and push bot
        id: build
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.bot == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packages/bot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bot:${{ needs.backend-plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.backend-plan.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-AresRPG-Source-Available
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bot:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bot:buildcache,mode=max
          provenance: false
          sbom: true
      - name: alias unchanged bot digest to this release
        id: alias
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.bot != 'true'
        run: bash scripts/release_image.sh alias
      - name: attest bot provenance
        if: needs.backend-plan.outputs.bot == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bot
          subject-digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true
  build-discord:
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest || steps.alias.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/discord
      IMAGE_VERSION: ${{ needs.backend-plan.outputs.version }}
      IMAGE_DIGEST: ${{ needs.backend-plan.outputs.discord_digest }}
      IMAGE_CHANGED: ${{ needs.backend-plan.outputs.discord }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons/*
            /seed/icons/items/
            !seed/icons/items/*_hd.*
            /seed/icons/mobs/
            !seed/icons/mobs/*_hd.*
            !seed/models
            !music
          sparse-checkout-cone-mode: false
      - name: authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: reuse this immutable discord semver on a preparation rerun
        id: image
        run: bash scripts/release_image.sh inspect
      - name: build and push discord
        id: build
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.discord == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packages/discord/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/discord:${{ needs.backend-plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.backend-plan.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-AresRPG-Source-Available
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/discord:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/discord:buildcache,mode=max
          provenance: false
          sbom: true
      - name: alias unchanged discord digest to this release
        id: alias
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.discord != 'true'
        run: bash scripts/release_image.sh alias
      - name: attest discord provenance
        if: needs.backend-plan.outputs.discord == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/discord
          subject-digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

  build-indexer:
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest || steps.alias.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/indexer
      IMAGE_VERSION: ${{ needs.backend-plan.outputs.version }}
      IMAGE_DIGEST: ${{ needs.backend-plan.outputs.indexer_digest }}
      IMAGE_CHANGED: ${{ needs.backend-plan.outputs.indexer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            packages/indexer
            scripts/release_image.sh
      - name: authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: reuse this immutable indexer semver on a preparation rerun
        id: image
        run: bash scripts/release_image.sh inspect
      - name: build and push indexer
        id: build
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.indexer == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packages/indexer
          file: packages/indexer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/indexer:${{ needs.backend-plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.backend-plan.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-AresRPG-Source-Available
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indexer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indexer:buildcache,mode=max
          provenance: false
          sbom: true
      - name: alias unchanged indexer digest to this release
        id: alias
        if: steps.image.outputs.exists != 'true' && needs.backend-plan.outputs.indexer != 'true'
        run: bash scripts/release_image.sh alias
      - name: attest indexer provenance
        if: needs.backend-plan.outputs.indexer == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/indexer
          subject-digest: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true

  release-manifest:
    needs:
      [
        tag-and-release,
        verify-gate,
        backend-plan,
        build-server,
        build-discord,
        build-indexer,
        build-bot,
        prepare-production,
      ]
    if: >-
      always() &&
      needs.tag-and-release.outputs.prepare == 'true' &&
      needs.verify-gate.result == 'success' &&
      needs.backend-plan.result == 'success' &&
      needs.build-bot.result == 'success' &&
      (needs.prepare-production.result == 'success' || needs.prepare-production.result == 'skipped') &&
      (needs.build-discord.result == 'success' || needs.build-discord.result == 'skipped') &&
      (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') &&
      (needs.build-indexer.result == 'success' || needs.build-indexer.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            pins.json
            scripts/release_manifest.sh
      - name: write immutable release manifest
        env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
          PREVIOUS_TAG: ${{ needs.backend-plan.outputs.previous_tag }}
          BOT_BUILT: ${{ needs.backend-plan.outputs.bot }}
          BOT_DIGEST: ${{ needs.build-bot.outputs.digest }}
          DISCORD_BUILT: ${{ needs.backend-plan.outputs.discord }}
          DISCORD_DIGEST: ${{ needs.build-discord.outputs.digest }}
          SERVER_BUILT: ${{ needs.backend-plan.outputs.server }}
          SERVER_DIGEST: ${{ needs.build-server.outputs.digest }}
          INDEXER_BUILT: ${{ needs.backend-plan.outputs.indexer }}
          INDEXER_DIGEST: ${{ needs.build-indexer.outputs.digest }}
          VERCEL_URL: ${{ needs.prepare-production.outputs.url }}
          FRONTEND_BUILT: ${{ needs.backend-plan.outputs.frontend }}
        run: bash scripts/release_manifest.sh
      - name: retain the production activation record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-v${{ needs.tag-and-release.outputs.version }}
          path: ${{ runner.temp }}/production-release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
