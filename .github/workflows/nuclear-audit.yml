# GitHub Actions schedules only fire from the default branch (#809), and GITHUB_TOKEN ff-pushes do
# not self-trigger workflows. The promotion engine's explicit post-edge workflow_dispatch is the
# live enforcement tooth; the push trigger remains for human pushes and schedules stay advisory.
name: nuclear audit

on:
  push:
    branches: [edge]
    paths:
      - 'packages/*/src/**'
      - 'api/**'
      - 'scripts/nuclear_audit.mjs'
      - 'scripts/fixtures/nuclear_audit_baseline.json'
      - 'scripts/fixtures/nuclear_audit_tests.mjs'
      - 'scripts/fixtures/nuclear_audit/**'
      - '.github/workflows/nuclear-audit.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact SHA just fast-forwarded to edge (defaults to the dispatched ref HEAD)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  nuclear-audit:
    name: nuclear-audit (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: prove the three scanners and ratchet semantics
        run: node --test scripts/fixtures/nuclear_audit_tests.mjs
      - name: census clones, import fan-out, and repeated literals
        run: |
          set +e
          node scripts/nuclear_audit.mjs
          RC=$?
          set -e
          if [ "$RC" -eq 1 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::warning::scheduled census exceeded the committed baseline (advisory; landing dispatches enforce)"
            exit 0
          fi
          exit "$RC"
