# The CI gate — every PR and push into edge/master passes it. A GREEN edge push then deploys
# through deploy.yml; production deploys through release.yml on a fresh semver tag only
# (prebuilt Vercel output built in CI — the git integration is retired).
# Fork-safe by construction: no secrets in this workflow, ever.
name: gate
on:
  pull_request:
    branches: [edge, master]
  push:
    branches: [edge, master]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Metadata-only clone: the 1.8GB art tree restores from the actions cache below
          # (keyed by its own git tree hash) — a run downloads art only when art CHANGED.
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test
  tests_move:
    # The on-chain game's own suite: both Move packages must build AND test clean.
    name: tests (move)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads only the Move packages — never the 1.8GB asset tree.
          sparse-checkout: |
            packages/move
            packages/move-math
            packages/control
            packages/seed
      - name: sui version pin
        id: sui_version
        # Pinned release (brew left the runner image, 2026-08-19). Bump deliberately with the
        # Move toolchain — a floating version would shift the compiler under the bytecode gates.
        run: echo "version=testnet-v1.78.0" >> "$GITHUB_OUTPUT"
      - name: cache sui
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sui-bin
          key: sui-${{ runner.os }}-${{ steps.sui_version.outputs.version }}
      - name: ensure sui — cached binary if it runs, release download otherwise
        run: |
          mkdir -p "$HOME/sui-bin"
          echo "$HOME/sui-bin" >> "$GITHUB_PATH"
          if ! "$HOME/sui-bin/sui" --version 2>/dev/null; then
            # the release tarball prefixes members with ./ — extract the one cli binary only
            curl -fsSL "https://github.com/MystenLabs/sui/releases/download/${{ steps.sui_version.outputs.version }}/sui-${{ steps.sui_version.outputs.version }}-ubuntu-x86_64.tgz" \
              | tar -xz -C "$HOME/sui-bin" ./sui
            "$HOME/sui-bin/sui" --version
          fi
      - name: move-math — build + test
        run: |
          sui move build --path packages/move-math
          sui move test --path packages/move-math
      - name: seed — build + test
        run: |
          sui move build --path packages/control
          sui move test --path packages/control
          sui move build --path packages/seed
          sui move test --path packages/seed
      - name: move — build + test
        run: |
          sui move build --path packages/move
          sui move test --path packages/move
      - name: move — gas ratchet
        # The ÷10 plan's micro-ratchet: one complete three-mob wave runs under its own
        # unit-test gas ceiling. It guards instruction growth; executed receipt benchmarks
        # separately own transaction floors, storage, and rebates. A fight-path inflation reds HERE
        # before it reaches a player. The ceiling only ratchets DOWN.
        run: |
          sui move test --path packages/move one_three_mob_wave --gas-limit 120000000 --statistics
  tests_indexer:
    # The chain projectionist's suite + the Move↔indexer parity gates (packages/indexer/
    # src/gates.rs): the layout snapshot and the event census read the COMPILED Move build,
    # so both packages build first — a Move struct or event change reds HERE in the same
    # commit it lands, instead of rotting the graph behind an advancing watermark.
    name: tests (indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Indexer + the Move packages its parity gates compile — never the asset tree.
          sparse-checkout: |
            packages/move
            packages/move-math
            packages/control
            packages/seed
            packages/indexer
      - name: sui version pin
        id: sui_version
        # Pinned release (brew left the runner image, 2026-08-19). Bump deliberately with the
        # Move toolchain — a floating version would shift the compiler under the bytecode gates.
        run: echo "version=testnet-v1.78.0" >> "$GITHUB_OUTPUT"
      - name: cache sui
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sui-bin
          key: sui-${{ runner.os }}-${{ steps.sui_version.outputs.version }}
      - name: ensure sui — cached binary if it runs, release download otherwise
        run: |
          mkdir -p "$HOME/sui-bin"
          echo "$HOME/sui-bin" >> "$GITHUB_PATH"
          if ! "$HOME/sui-bin/sui" --version 2>/dev/null; then
            # the release tarball prefixes members with ./ — extract the one cli binary only
            curl -fsSL "https://github.com/MystenLabs/sui/releases/download/${{ steps.sui_version.outputs.version }}/sui-${{ steps.sui_version.outputs.version }}-ubuntu-x86_64.tgz" \
              | tar -xz -C "$HOME/sui-bin" ./sui
            "$HOME/sui-bin/sui" --version
          fi
      - name: compile the Move packages (the parity gates' ground truth)
        run: |
          sui move build --path packages/move-math
          sui move build --path packages/control
          sui move build --path packages/seed
          sui move build --path packages/move
      - name: cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/indexer/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/indexer/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo fmt --check
        working-directory: packages/indexer
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: packages/indexer
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (includes the Move-parity gates)
        working-directory: packages/indexer
        run: cargo test
  bundle-gate:
    # Reproduces the deploy build on PULL REQUESTS so a bundle-tripping commit fails before it
    # lands; on pushes the deploy workflow's own build is the proof, so this job skips there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same art-cache scheme as the gate job — art downloads only when art changed.
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: bundle-cleanliness gate — no source maps, retired endpoints, or key material in dist
        working-directory: packages/frontend
        run: |
          bunx vite build
          ! find dist -name "*.map" | grep .
          ! grep -RlE --include="*.js" --include="*.css" --include="*.html" --include="*.json" \
            "rpc\.aresrpg\.world|sponsor\.aresrpg\.world|suiprivkey1[a-z0-9]{20,}|BEGIN PRIVATE KEY" dist
