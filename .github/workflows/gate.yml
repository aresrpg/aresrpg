# The CI gate — every PR into edge/master passes it; master merges deploy (Vercel git integration).
# Fork-safe by construction: no secrets in this workflow, ever (FROZEN.md rule 8).
# The ladder only grows: today it runs the proven-green core (the deterministic fight-replay gate
# + the root typecheck). The full constraint gates (check-constraints, semgrep/depcruise/CodeQL,
# localnet suite) join as they are wired for CI — each addition is a PR like any other.
name: gate
on:
  pull_request:
    branches: [edge, master]
  push:
    branches: [edge, master]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck — bun run typecheck
        run: bun run typecheck
      - name: fight-replay gate (deterministic capsules)
        working-directory: packages/sim
        run: bun test test/replay_gate.test.js
      - name: order-independence gate (module-global test-flake class)
        run: bun run test:order-independence
  api_image_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: api image boot smoke
        run: |
          set -euo pipefail
          cp packages/sdk/src/deployment/release.json api/release.json
          image_name=aresrpg-api-smoke
          container_name=aresrpg-api-smoke
          listen_line='[sponsor] station-only net=testnet :9528'
          docker build --tag "$image_name" api
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --env GAS_STATION_URL=http://127.0.0.1:1 \
            --env GAS_STATION_AUTH=ci-smoke \
            "$image_name"
          for attempt_number in {1..30}; do
            container_logs=$(docker logs "$container_name" 2>&1)
            container_running=$(docker inspect --format '{{.State.Running}}' "$container_name")
            if grep -Fq "$listen_line" <<<"$container_logs"; then
              printf '%s\n' "$container_logs"
              test "$container_running" = true
              exit 0
            fi
            if test "$container_running" != true; then
              printf '%s\n' "$container_logs" >&2
              exit 1
            fi
            sleep 1
          done
          printf 'api image did not reach its listen line after %s attempts\n' "$attempt_number" >&2
          docker logs "$container_name" >&2
          exit 1
  tests_api:
    # Issue #683: the sponsor's unit suite (a MONEY path — scope/station/fail-closed families) ran
    # in no CI workflow; api_image_smoke above only proves the image boots. Each file below is its
    # own bun process on purpose — sponsor.mjs/sponsor_state.mjs memoize Redis + the PTB allowlist
    # once at module load, the same module-global class scripts/order-independence-gate.sh guards
    # elsewhere — so api/run_tests.sh (the package's own `test` script) runs them one process per
    # file, never the combined single-process run the files' own headers forbid.
    name: tests (api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        working-directory: api
        run: bun install --frozen-lockfile
      - name: sponsor api unit suite — one bun process per file (module-load memoization)
        working-directory: api
        run: bun run test
  release_pins:
    # Issue #848 (one instance of the #858 class: a check's arming path disjoint from the check).
    # check_release_pins.mjs — #770's remedy — was armed by its own header comment and nothing
    # else. It lands HERE, unfiltered, rather than on a path filter or a schedule:
    #   · #770 was chain drift with an UNTOUCHED repo (two upgrades executed, neither recording
    #     landed), so no `packages/move/**` path filter could ever have seen it;
    #   · `schedule:` fires only from the default branch — a scheduled leg authored on edge runs
    #     zero times until it reaches master (#809, still open, is exactly that);
    #   · gate.yml's pull_request/push triggers fire from the branch the file lives on, so this
    #     executes on every PR and every landing, and the promotion PR into master — the one PR
    #     allowed to move the pins — is gated by the same leg. promote-green-eval.sh derives its
    #     required set from gate.yml's own jobs (#725), so this job joins the promotion bar with
    #     no registry to remember.
    # The fullnode is a HARD dependency, never a silent skip: exit 1 = the chain disagrees with
    # the pins (deterministic — never retried), exit 2 = the chain could not be read (retried
    # once, then RED). testnet only — mainnet's packages are unpublished (no upgrade_cap rows in
    # release.json), so every mainnet row reads UNKNOWN; that leg joins when mainnet publishes.
    name: release-pin chain gate (testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile
      - name: release pins vs chain — check_release_pins.mjs (#770)
        run: |
          run_pin_gate() { node packages/move/scripts/check_release_pins.mjs --network testnet; }
          status=0
          run_pin_gate || status=$?
          test "$status" -eq 0 && exit 0
          test "$status" -eq 2 || exit "$status"
          echo "release-pin gate: fullnode unreadable (exit 2) — one retry, then this job is RED" >&2
          run_pin_gate
  bundle-gate:
    # Issue #737: scripts/assert_clean_bundle.mjs only ran inside Vercel's own build (postbuild),
    # so a commit that tripped it landed green here in CI while every deployment silently
    # ERRORed (an outage with zero READY deploys). This job reproduces Vercel's own buildCommand
    # (packages/frontend/vercel.json) so a tripping commit fails CI and can never land.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile
      - name: bundle-cleanliness gate — vite build && assert_clean_bundle.mjs
        working-directory: packages/frontend
        run: bunx vite build && node scripts/assert_clean_bundle.mjs
