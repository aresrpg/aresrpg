# The CI gate — every PR and push into edge passes it. A GREEN edge push then deploys
# through deploy.yml; production deploys through release.yml on a fresh semver tag only
# (prebuilt Vercel output built in CI — the git integration is retired).
# Fork-safe by construction: no secrets in this workflow, ever.
name: gate
on:
  pull_request:
    branches: [edge]
  push:
    branches: [edge]
permissions:
  contents: read
jobs:
  changes:
    name: verification input changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      browsers: ${{ steps.inputs.outputs.browsers }}
      move: ${{ steps.inputs.outputs.move }}
      indexer: ${{ steps.inputs.outputs.indexer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/ci_inputs.mjs
            move-packages.json
          sparse-checkout-cone-mode: false
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR base or the previous commit need not have passed verification.
          BASE_SHA=$(gh run list --workflow gate.yml --branch edge --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          export BASE_SHA
          node scripts/ci_inputs.mjs
  source:
    name: TypeScript (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Metadata-only clone: the 1.8GB art tree restores from the actions cache below
          # (keyed by its own git tree hash) — a run downloads art only when art CHANGED.
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: TypeScript tests + coverage
        run: bun run test
  tests_move:
    needs: changes
    if: needs.changes.outputs.move == 'true'
    # The on-chain game's own suite: every Move package must build, test, and retain coverage.
    name: tests (move)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads only the Move packages — never the 1.8GB asset tree.
          sparse-checkout: |
            packages/move
            packages/move-combat
            packages/move-math
            packages/control
            packages/seed
            packages/kares
            scripts/coverage_move.sh
            move-packages.json
      - name: sui version pin
        id: sui_version
        # Pinned release (brew left the runner image, 2026-08-19). Bump deliberately with the
        # Move toolchain — a floating version would shift the compiler under the bytecode gates.
        run: |
          echo "version=$(jq -er '.sui_cli.release' move-packages.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -er '.sui_cli.linux_archive_sha256' move-packages.json)" >> "$GITHUB_OUTPUT"
      - name: cache sui
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sui-bin
          key: sui-${{ runner.os }}-${{ steps.sui_version.outputs.version }}-${{ steps.sui_version.outputs.sha256 }}
      - name: ensure sui — cached binary if it runs, release download otherwise
        run: |
          mkdir -p "$HOME/sui-bin"
          echo "$HOME/sui-bin" >> "$GITHUB_PATH"
          release='${{ steps.sui_version.outputs.version }}'
          expected="sui ${release##*-v}-"
          actual=$("$HOME/sui-bin/sui" --version 2>/dev/null || true)
          if [[ "$actual" != "$expected"* ]]; then
            archive="$RUNNER_TEMP/sui.tgz"
            curl -fsSL "https://github.com/MystenLabs/sui/releases/download/$release/sui-$release-ubuntu-x86_64.tgz" -o "$archive"
            echo "${{ steps.sui_version.outputs.sha256 }}  $archive" | sha256sum --check --strict
            tar -xz -f "$archive" -C "$HOME/sui-bin" ./sui
          fi
          actual=$("$HOME/sui-bin/sui" --version)
          [[ "$actual" == "$expected"* ]] || { echo "::error::unexpected Sui compiler: $actual"; exit 1; }
      - name: move-math — build
        run: sui move build --path packages/move-math
      - name: control + combat + seed — build
        run: |
          sui move build --path packages/control
          sui move build --path packages/move-combat
          sui move build --path packages/seed
      - name: move — build
        run: sui move build --path packages/move
      - name: coverage (all Move packages)
        run: sh scripts/coverage_move.sh
      - name: move — gas ratchet
        # Runtime-shaped combat probes live with the production machine. White Ant covers two
        # full-map colony rows over nine fighters; Cro Wani reproduces testnet FUAVPN…WJe's
        # ten-fighter circle buff + attack (68.2M computation before fighter-first targeting).
        # JCeiXxJ5 captures a six-mob dungeon wave and asserts its complete resulting BCS state.
        # Executed receipts separately own transaction floors, storage, and rebates. Ceilings only
        # ratchet DOWN.
        run: |
          sui move test --path packages/move-combat one_three_mob_wave --gas-limit 350000 --statistics
          sui move test --path packages/move-combat captured_six_mob --gas-limit 32000000 --statistics
          sui move test --path packages/move-combat one_white_ant_turn --gas-limit 300000 --statistics
          sui move test --path packages/move-combat one_crowani_turn --gas-limit 400000 --statistics
          sui move test --path packages/move single_stackable_craft --gas-limit 1100000 --statistics
          sui move test --path packages/move maximum_stackable_craft --gas-limit 1100000 --statistics
  tests_indexer:
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    # The chain projectionist's suite + the Move↔indexer parity gates (packages/indexer/
    # src/gates.rs): the layout snapshot and the event census read the COMPILED Move build,
    # so both packages build first — a Move struct or event change reds HERE in the same
    # commit it lands, instead of rotting the graph behind an advancing watermark.
    name: tests (indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Indexer + the Move packages its parity gates compile — never the asset tree.
          sparse-checkout: |
            packages/move
            packages/move-combat
            packages/move-math
            packages/control
            packages/seed
            packages/kares
            packages/indexer
            packages/protocol
            scripts/coverage_indexer.sh
            move-packages.json
      - name: sui version pin
        id: sui_version
        # Pinned release (brew left the runner image, 2026-08-19). Bump deliberately with the
        # Move toolchain — a floating version would shift the compiler under the bytecode gates.
        run: |
          echo "version=$(jq -er '.sui_cli.release' move-packages.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -er '.sui_cli.linux_archive_sha256' move-packages.json)" >> "$GITHUB_OUTPUT"
      - name: cache sui
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sui-bin
          key: sui-${{ runner.os }}-${{ steps.sui_version.outputs.version }}-${{ steps.sui_version.outputs.sha256 }}
      - name: ensure sui — cached binary if it runs, release download otherwise
        run: |
          mkdir -p "$HOME/sui-bin"
          echo "$HOME/sui-bin" >> "$GITHUB_PATH"
          release='${{ steps.sui_version.outputs.version }}'
          expected="sui ${release##*-v}-"
          actual=$("$HOME/sui-bin/sui" --version 2>/dev/null || true)
          if [[ "$actual" != "$expected"* ]]; then
            archive="$RUNNER_TEMP/sui.tgz"
            curl -fsSL "https://github.com/MystenLabs/sui/releases/download/$release/sui-$release-ubuntu-x86_64.tgz" -o "$archive"
            echo "${{ steps.sui_version.outputs.sha256 }}  $archive" | sha256sum --check --strict
            tar -xz -f "$archive" -C "$HOME/sui-bin" ./sui
          fi
          actual=$("$HOME/sui-bin/sui" --version)
          [[ "$actual" == "$expected"* ]] || { echo "::error::unexpected Sui compiler: $actual"; exit 1; }
      - name: compile the Move packages (the parity gates' ground truth)
        run: |
          sui move build --path packages/move-math
          sui move build --path packages/control
          sui move build --path packages/move-combat
          sui move build --path packages/seed
          sui move build --path packages/move
      - name: cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            packages/indexer/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/indexer/Cargo.lock') }}-llvm-cov-0.9.0
          restore-keys: cargo-${{ runner.os }}-
      - name: install Redis for projection recovery tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: cargo fmt --check
        working-directory: packages/indexer
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: packages/indexer
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: install pinned cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          if ! cargo llvm-cov --version 2>/dev/null | grep -qx 'cargo-llvm-cov 0.9.0'; then
            cargo install cargo-llvm-cov --version 0.9.0 --locked
          fi
      - name: cargo test + LLVM coverage (includes the Move-parity gates)
        run: sh scripts/coverage_indexer.sh
  bundle-gate:
    # Reproduces the deploy build on PULL REQUESTS so a bundle-tripping commit fails before it
    # lands; on pushes the deploy workflow's own build is the proof, so this job skips there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same art-cache scheme as the gate job — art downloads only when art changed.
          filter: blob:none
          sparse-checkout: |
            /*
            !seed/icons
            !seed/models
          sparse-checkout-cone-mode: false
      - name: art tree key
        id: art
        run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
      - name: cache the art tree
        id: art_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            seed/icons
            seed/models
          key: art-${{ steps.art.outputs.tree }}
      - name: materialize the art tree (cache miss only)
        if: steps.art_cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout set --no-cone '/*'
          git checkout HEAD -- seed/icons seed/models
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        run: bun install --frozen-lockfile
      - name: bundle-cleanliness gate — game and independent launchpad
        run: |
          for application in frontend launchpad; do
            bun run --cwd "packages/$application" build
            if find "packages/$application/dist" -name "*.map" | grep .; then exit 1; fi
            if grep -RlE --include="*.js" --include="*.css" --include="*.html" --include="*.json" \
              "rpc\.aresrpg\.world|sponsor\.aresrpg\.world|suiprivkey1[a-z0-9]{20,}|BEGIN PRIVATE KEY" "packages/$application/dist"; then exit 1; fi
          done
  browsers:
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    name: browser (${{ matrix.target.os }}, ${{ matrix.target.browser }}, ${{ matrix.suite.project }}, ${{ matrix.suite.shard }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { project: ui, shard: '1/1' }
          - { project: workloads, shard: '1/3' }
          - { project: workloads, shard: '2/3' }
          - { project: workloads, shard: '3/3' }
        target:
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: firefox }
          - { os: macos-latest, browser: chrome }
    env:
      BROWSER: ${{ matrix.target.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install --with-deps ${{ matrix.target.browser }}
      - name: browser compatibility tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "$BROWSER" = firefox ]; then
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a bun run test:browser --headed --project=${{ matrix.suite.project }} --shard=${{ matrix.suite.shard }}
          else
            bun run test:browser --project=${{ matrix.suite.project }} --shard=${{ matrix.suite.shard }}
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-${{ matrix.target.os }}-${{ matrix.target.browser }}-${{ matrix.suite.project }}-${{ strategy.job-index }}
          path: |
            test-results/browser
            test-results/browser-results.json
          retention-days: 7
  gate:
    name: gate
    needs: [changes, source, tests_move, tests_indexer, bundle-gate, browsers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every required verification completed
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.source.result }}" = success
          check_lane() {
            [ "$1" = success ] || { [ "$2" = false ] && [ "$1" = skipped ]; }
          }
          check_lane "${{ needs.tests_move.result }}" "${{ needs.changes.outputs.move }}"
          check_lane "${{ needs.tests_indexer.result }}" "${{ needs.changes.outputs.indexer }}"
          check_lane "${{ needs.browsers.result }}" "${{ needs.changes.outputs.browsers }}"
          test "${{ github.event_name == 'push' || needs.bundle-gate.result == 'success' }}" = true
