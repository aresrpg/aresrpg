# The CI gate — every PR into edge/master passes it; master merges deploy (Vercel git integration).
# Fork-safe by construction: no secrets in this workflow, ever.
name: gate
on:
  pull_request:
    branches: [edge, master]
  push:
    branches: [edge, master]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test
  tests_move:
    # The on-chain game's own suite: both Move packages must build AND test clean.
    name: tests (move)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install sui
        run: brew install sui
      - name: move-math — build + test
        run: |
          sui move build --path packages/move-math
          sui move test --path packages/move-math
      - name: move — build + test
        run: |
          sui move build --path packages/move
          sui move test --path packages/move
  tests_indexer:
    # The chain projectionist's suite + the Move↔indexer parity gates (packages/indexer/
    # src/gates.rs): the layout snapshot and the event census read the COMPILED Move build,
    # so both packages build first — a Move struct or event change reds HERE in the same
    # commit it lands, instead of rotting the graph behind an advancing watermark.
    name: tests (indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install sui
        run: brew install sui
      - name: compile the Move packages (the parity gates' ground truth)
        run: |
          sui move build --path packages/move-math
          sui move build --path packages/move
      - name: cargo fmt --check
        working-directory: packages/indexer
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: packages/indexer
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (includes the Move-parity gates)
        working-directory: packages/indexer
        run: cargo test
  bundle-gate:
    # Reproduces Vercel's own buildCommand (#737) so a bundle-tripping commit fails HERE and can
    # never land as a zero-READY-deploys outage.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile
      - name: bundle-cleanliness gate — no source maps, retired endpoints, or key material in dist
        working-directory: packages/frontend
        run: |
          bunx vite build
          ! find dist -name "*.map" | grep .
          ! grep -RlE --include="*.js" --include="*.css" --include="*.html" --include="*.json" \
            "rpc\.aresrpg\.world|sponsor\.aresrpg\.world|suiprivkey|BEGIN PRIVATE KEY" dist
