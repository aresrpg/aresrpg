# promote.yml — the `/promote` REQUEST handler (maintainer-triggered, signature-preserving).
#
# `/promote` lands NOW or refuses (owner ruling 2026-08-23 — the land-on-green queue and its
# cron sweep are DELETED; a promotion never waits). Trigger = the authorized maintainer
# commenting `/promote` on a PR targeting edge OR master (explicit command, never an approval
# side-effect). This job asserts the commenter's identity, applies the `promote-requested`
# label (audit breadcrumb only), then invokes the landing engine (.github/scripts/promote-land.sh):
#   • green + fast-forward → it lands NOW (byte-identical ff-push; signatures survive).
#   • behind its base       → refused as `stale`; the author rebases locally (commits stay
#                             signed — the API rebase returns unsigned copies edge's
#                             required_signatures would reject) and `/promote`s again.
#   • not green             → refused as `not-green`; fix, then `/promote` again.
#
# BRANCH CLEANUP: a successful land also deletes the PR's head branch (best-effort, non-fatal —
# see the engine). GitHub's repo-level `delete_branch_on_merge` setting NEVER fires for this flow:
# landings are fast-forward PUSHES, not merge-button events, so no auto-delete is ever triggered
# and landed branches pile up (34 as of 2026-07-21). `master` and `edge` are guarded by NAME and
# never deleted — a master landing's head IS `edge` (the release PR) and must persist; only
# `master` and `edge` survive long-term (repository policy 2026-07-21).
#
# GOVERNANCE: the master hop is deploy-class and fires only on an explicit maintainer command; the edge
# hop is routine integration. "Who may land code" is enforced by the engine's asserts (authorized
# /promote comment + approval story + green + fast-forward) plus, for master, the `promoted` stamp
# this workflow mints and the ruleset requires server-side — NEVER by a
# ruleset review rule or a bypass grant — the bot holds zero bypass privilege and clears the exact
# same required checks, signatures, linear-history and ff rules as any other pusher.
#
# FROZEN BY DESIGN (seat ruling 2026-07-29, issue #1573). This handler is the SPLIT's privileged
# half: it is the one place that mints the `promoted` status master's ruleset requires, and it runs
# only behind a maintainer-identity assert on a human comment. The HANDLER definition stays pinned
# to the default branch, while its checkout below executes the shared engine from protected `edge`:
# this keeps the mint frozen but prevents master's stale script copy from bypassing landing fixes
# (#972). Only this handler holds statuses:write, so the engine code can iterate at
# edge speed while the code that mints deploy permission cannot. Changing this file changes who may put a commit on production:
# it reaches master only through the authorized maintainer's promotion command, which is the acceptance this
# ruling records.
name: promote
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: write # dispatch release.yml after a master ff-push (GITHUB_TOKEN pushes don't self-trigger)
  pull-requests: write # label, comment, read reviews, open the next standing draft
  statuses: write # THE mint: the `promoted` stamp lives here alone (F1a; split 2026-07-29, #1573)
jobs:
  request:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/promote'))
    # Keep the landing lock behind the event-shape/command gate above: an ordinary issue comment
    # must never enter this group. Preserve every admitted request in the shared FIFO instead of
    # letting Actions' single-pending default replace an older /promote before its first step.
    concurrency:
      group: promotion-landing
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: assert commenter is the authorized maintainer (numeric id is immortal; login is a readable second factor)
        run: |
          # Numeric user IDs never change and freed logins are re-registerable — pin the id and
          # keep the login as a human-readable second factor. BOTH must hold. This gates who may
          # APPLY the label; the engine re-checks the authorized /promote command before it ever lands.
          test "${{ github.event.comment.user.id }}" = "11330271" || { echo "commenter is not authorized (id mismatch) — refusing"; exit 1; }
          test "${{ github.event.comment.user.login }}" = "Sceat" || { echo "commenter is not authorized (login mismatch) — refusing"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fixed trusted ref, never the triggering PR head. This changes only which reviewed engine
          # executes; it does not arm a PR. Chain-money PRs still open label-bare and remain held
          # until the authorized /promote here applies `promote-requested` (label-is-the-hold law).
          ref: edge
          fetch-depth: 0
          # The engine needs ref math + .github scripts/templates only.
          filter: blob:none
          sparse-checkout: .github
      - name: ensure the promote-requested label exists, then apply it
        run: |
          gh label create promote-requested --repo "$GITHUB_REPOSITORY" --color BFD4F2 \
            --description "an authorized /promote was requested here" --force >/dev/null
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label promote-requested >/dev/null
      - name: stamp `promoted` on the head sha (master hop only) — the maintainer command is the mint
        # THE SPLIT (seat ruling 2026-07-29, issue #1573). master's ruleset requires a `promoted`
        # status on the sha AT PUSH TIME, and exactly one place may mint it: here, behind the
        # maintainer-identity assert above. The engine itself never stamps — a landing can only
        # ever fast-forward a sha the authorized maintainer already approved.
        #
        # ORDER: the stamp is written BEFORE the engine's asserts run, and that is sound — a commit
        # status carries no permission of its own, and the push it enables is still gated by the
        # engine (green + fast-forward + release-tipped + republish-window) and by every other rule
        # on master. A rebase produces a NEW sha carrying no stamp; the author re-/promotes, which
        # simply requires the maintainer to repeat the deploy command.
        run: |
          BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          if [ "$BASE" != master ]; then echo "edge hop — no promoted stamp needed"; exit 0; fi
          SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context=promoted \
            -f description="promoted to master by an authorized /promote" >/dev/null
          echo "stamped promoted on $SHA"
      - name: attempt landing (shared engine)
        id: land
        run: |
          set +e
          bash .github/scripts/promote-land.sh "$PR"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: interpret the result — land silently, or post one-time guidance
        # Guidance bodies live as markdown templates under .github/promote-comments/ (readable, and
        # no backticks-in-shell) — the stale one has its base substituted for __BASE__.
        run: |
          RESULT='${{ steps.land.outputs.promote_result }}'
          case "$RESULT" in
            landed)
              # rc=4 is a real landing whose board sweep never got dispatched (#1605 fail-loud):
              # say so in red rather than reporting a half-finished landing as a clean one.
              if [ "${{ steps.land.outputs.rc }}" = 4 ]; then
                echo "::error::landed, but a landing automation dispatch failed — re-run it manually"; exit 1
              fi
              echo "landed — nothing to comment" ;;
            stale)
              BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
              sed "s/__BASE__/${BASE}/g" .github/promote-comments/stale.md > "${RUNNER_TEMP}/body.md"
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/body.md" ;;
            not-green)
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file .github/promote-comments/not-green.md ;;
            *)
              echo "refused: ${RESULT:-<none>} (rc=${{ steps.land.outputs.rc }}) — see the landing step log"; exit 1 ;;
          esac
