# promote.yml — the `/promote` REQUEST handler (owner-triggered, signature-preserving).
#
# `/promote` is a one-time land REQUEST, not a babysat rebase→wait→re-comment loop (issue #105).
# Trigger = the owner commenting `/promote` on a PR targeting edge OR master (explicit command,
# never an approval side-effect). This job asserts the commenter is the owner, applies the
# `promote-requested` label, then invokes the SHARED landing engine (.github/scripts/promote-land.sh):
#   • green + fast-forward → it lands NOW (byte-identical ff-push; signatures survive; label removed).
#   • behind its base       → it reports `stale`; this job posts the ONE-TIME author rebase command.
#                             The author rebases locally (commits stay signed — the API rebase is
#                             OFF the table, it returns unsigned copies edge's required_signatures
#                             would reject) and force-pushes; the queue (promote-queue.yml) lands it
#                             on the next green cycle with zero further `/promote`.
#   • not yet green         → it reports `not-green`; the queue lands it when the checks pass.
#
# BRANCH CLEANUP: a successful land also deletes the PR's head branch (best-effort, non-fatal —
# see the engine). GitHub's repo-level `delete_branch_on_merge` setting NEVER fires for this flow:
# landings are fast-forward PUSHES, not merge-button events, so no auto-delete is ever triggered
# and landed branches pile up (34 as of 2026-07-21). `master` and `edge` are guarded by NAME and
# never deleted — a master landing's head IS `edge` (the release PR) and must persist; only
# `master` and `edge` survive long-term (owner rule 2026-07-21).
#
# GOVERNANCE: the master hop is deploy-class and fires only on the owner's explicit word; the edge
# hop is routine integration. "Who may land code" is enforced by the engine's asserts (owner
# /promote comment + approval story + green + fast-forward + the `promoted` stamp), NEVER by a
# ruleset review rule or a bypass grant — the bot holds zero bypass privilege and clears the exact
# same required checks, signatures, linear-history and ff rules as any other pusher.
name: promote
on:
  issue_comment:
    types: [created]
# Serialize every landing run (this handler + the queue) so concurrent ff-pushes can't race.
concurrency:
  group: promotion-landing
  cancel-in-progress: false
permissions:
  contents: write
  actions: write # dispatch release.yml after a master ff-push (GITHUB_TOKEN pushes don't self-trigger)
  pull-requests: write # label, comment, read reviews, open the next standing draft
  statuses: write # stamp the `promoted` commit status (F1a — closes the direct-push-to-master hole)
jobs:
  request:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/promote')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: assert commenter is the owner (numeric id is immortal; login is a readable second factor)
        run: |
          # Numeric user IDs never change and freed logins are re-registerable — pin the id and
          # keep the login as a human-readable second factor. BOTH must hold. This gates who may
          # APPLY the label; the engine re-checks the owner's /promote word before it ever lands.
          test "${{ github.event.comment.user.id }}" = "11330271" || { echo "commenter is not the owner (id mismatch) — refusing"; exit 1; }
          test "${{ github.event.comment.user.login }}" = "Sceat" || { echo "commenter is not the owner (login mismatch) — refusing"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: ensure the promote-requested label exists, then apply it
        run: |
          gh label create promote-requested --repo "$GITHUB_REPOSITORY" --color BFD4F2 \
            --description "queued for land-on-green (issue #105)" --force >/dev/null
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label promote-requested >/dev/null
      - name: attempt landing (shared engine)
        id: land
        run: |
          set +e
          bash .github/scripts/promote-land.sh "$PR"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: interpret the result — land silently, or post one-time guidance
        # Guidance bodies live as markdown templates under .github/promote-comments/ (readable, and
        # no backticks-in-shell) — the stale one has its base substituted for __BASE__.
        run: |
          RESULT='${{ steps.land.outputs.promote_result }}'
          case "$RESULT" in
            landed)
              echo "landed — nothing to comment" ;;
            stale)
              BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
              sed "s/__BASE__/${BASE}/g" .github/promote-comments/stale.md > "${RUNNER_TEMP}/body.md"
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/body.md" ;;
            not-green)
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file .github/promote-comments/not-green.md ;;
            *)
              echo "refused: ${RESULT:-<none>} (rc=${{ steps.land.outputs.rc }}) — see the landing step log"; exit 1 ;;
          esac
