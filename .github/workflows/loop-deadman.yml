#
# THE LOOP DEAD-MAN — the standing loops get a heartbeat monitor that is not on the same laptop.
# This file is the ARMING; scripts/loop_deadman.mjs owns the staleness table, every decision, and
# the WHY — read its header rather than a second copy of it here.
#
# SCHEDULES FIRE FROM THE DEFAULT BRANCH (#809, same as board-hygiene.yml's header): until this file
# reaches `master`, the `schedule:` trigger runs ZERO times and `workflow_dispatch` below is the only
# door. Stated rather than assumed — an arming path disjoint from its check is the #858 disease.
#
# Fork-safe: no secrets beyond the run's own GITHUB_TOKEN.
name: loop dead-man
on:
  schedule:
    # Twice daily, 12h apart — the same period as the tightest bar in the table. Off-minute on
    # purpose: GitHub's scheduler drops and delays runs clustered on the hour, and every bar in the
    # table carries hours of slack precisely so a late run is never a false alarm.
    - cron: '19 3,15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the verdict without touching the board'
        required: false
        default: false
        type: boolean
      loop:
        description: 'Check only this loop (default: every row in the staleness table)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: loop-deadman
  cancel-in-progress: false
jobs:
  deadman:
    name: are the standing loops alive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: measure each loop's newest board artifact against its staleness bar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Empty on a schedule run, where `inputs` does not exist at all.
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          ONLY_LOOP: ${{ inputs.loop }}
        run: |
          set -euo pipefail
          # $DRY_RUN_FLAG is deliberately unquoted — empty must vanish rather than pass "" as argv.
          # The loop name is quoted: it reaches the script as one argv element, never as shell text.
          if [ -n "$ONLY_LOOP" ]; then
            node scripts/loop_deadman.mjs $DRY_RUN_FLAG --loop "$ONLY_LOOP"
          else
            node scripts/loop_deadman.mjs $DRY_RUN_FLAG
          fi
