# promote-queue.yml — the land-on-green half of the promotion queue (issue #105).
#
# When the CI workflows (gate + checks) COMPLETE on a commit — a PR sync, an author's
# rebase-push, a re-run — this job evaluates EVERY open `promote-requested` PR oldest-first and
# lands each that is a green fast-forward ancestor of its base, via the SHARED engine
# (.github/scripts/promote-land.sh) — the exact same asserts + ff-push as the `/promote` handler,
# never duplicated. The `promoted` stamp is NOT shared: it is minted by promote.yml alone (see the
# permissions block below).
#
# WHY workflow_run, NOT check_suite (the subtle trap issue #105 offered as an alternative):
#   GitHub suppresses `check_suite` "if the check suite was created by GitHub Actions" (recursion
#   prevention, per the events docs). gate/checks ARE GitHub Actions, so check_suite:completed
#   would NEVER fire for our own CI — the queue would silently never land. `workflow_run` is the
#   purpose-built "run after another workflow completes" trigger and fires correctly for them.
#
# Queue semantics: a landing moves the base, so at most the oldest eligible PR lands per event;
# the rest go stale and land on their authors' next rebase-push (which re-runs gate/checks and
# re-fires this event). The engine re-verifies ALL of the head's check-runs are green, so a PR
# waits for every check (not just gate/checks) before it lands. No polling, no babysitting — the
# owner's one `/promote` already blessed each PR. Silent: guidance is posted once by promote.yml.
#
# THE STRAND (#1530): `workflow_run` fires only on a NEW gate/checks completion. If a PR's full
# check rollup settles green sometime AFTER the last gate/checks event this trigger list produced
# — e.g. a slow third-party check finishes minutes later — the queue evaluated the PR too early,
# found it ineligible, and no later event ever re-fires it: the PR sits clean, all-green,
# promote-requested, and the queue stays dark until an UNRELATED PR's CI happens to complete.
# `schedule:` below is the dead-man sweep that closes it: a low-frequency tick re-runs this same
# job on an otherwise-quiet repo. It is not a new engine — it shares the cheap gate (skip when
# nothing is promote-requested), the same landing engine, and the same `promotion-landing`
# concurrency lock (queue: max, cancel-in-progress: false) as every other trigger, so a scheduled
# tick can never race a workflow_run or a `/promote` request, only wait its turn in the same FIFO.
# The engine re-verifies everything from scratch every run, so a tick that finds nothing eligible
# (or re-confirms an already-landed PR is gone) is a clean no-op — safe by construction, exactly
# as #1530 itself proposed.
#
# SECURITY: a workflow_run's triggering head is UNTRUSTED (a fork PR's code) and stays excluded
# exactly as before — the checkout below takes a FIXED BRANCH REF and never a PR ref, so a
# triggering head can only enter as DATA (`refs/pull/<n>/head`, fetched inside the engine), never
# as executed code. That ref is `edge`, this repo's protected trust root: signature-required,
# linear history, CI-gated, and itself only reachable through this same landing flow (the master
# hop additionally through the authorized maintainer's identity-checked `/promote`). Nothing can arrive on edge
# that master would not accept, so pinning here costs no trust — while pinning to the DEFAULT
# branch pinned the engine to master's stale copy and froze every landing fix that had already
# shipped (issue #1573): the code that lands PRs must be the code CI actually gates. Landing is
# further gated by the engine's owner-/promote + approval asserts, and edge's required_signatures
# rejects any unsigned (e.g. API-rebased) commit.
#
# BOOTSTRAP: `workflow_run` (like `issue_comment` and `schedule`) only triggers from the workflow
# file on the DEFAULT branch (master). This file activates the queue the moment it reaches master
# via a release promotion; until then the live `/promote` handler on master is unchanged. Note the
# two are different questions: WHICH FILE runs is fixed by GitHub at master, WHICH ENGINE it
# executes is the checkout ref below — edge.
name: promote-queue
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
  schedule:
    # Dead-man sweep for #1530 (see the header comment above). Every 10 minutes is tight enough
    # that a stranded PR's wait is player-felt-short, loose enough to stay a background hum next
    # to the workflow_run path that fires on every real CI completion.
    - cron: '*/10 * * * *'
permissions:
  contents: write
  actions: write # dispatch release.yml after a master ff-push (GITHUB_TOKEN pushes don't self-trigger)
  pull-requests: write # read/label PRs, open the next standing draft
  # `statuses: write` is deliberately ABSENT (seat ruling 2026-07-29, issue #1573): this engine runs
  # unattended on every CI completion, so it must never be able to MINT the `promoted` status that
  # master's ruleset requires — an engine that stamps its own permission slip is not a gate. The
  # stamper is promote.yml (master-pinned, owner-identity gated, one stamp per owner's word). A
  # queue-side master push whose sha carries no stamp is rejected server-side, and the engine names
  # that cause instead of dying on a cryptic push error. Proven at runtime by the forge-canary step
  # below and statically by .github/scripts/test/promote-split-check.sh.
jobs:
  land:
    if: github.event_name == 'schedule' || github.event.workflow_run.event == 'pull_request'
    # Keep the landing lock behind the triggering-run gate above: only PR CI, or the schedule
    # dead-man sweep (#1530), can make a queued head newly eligible — base-branch CI must never
    # queue here. This side must also opt into the shared FIFO; a default-single queue run could
    # otherwise replace a pending /promote handler.
    concurrency:
      group: promotion-landing
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: write this schedule run's queue heartbeat
        if: github.event_name == 'schedule'
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > "$RUNNER_TEMP/promote-queue-heartbeat"
      - name: publish the queue heartbeat
        if: github.event_name == 'schedule'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/promote-queue-heartbeat
          key: promote-queue-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}
      - name: forge-canary — this engine must be UNABLE to mint a commit status (#1573)
        # The runtime half of the split's tooth: attempt a no-op `forge-canary` status mint with
        # THIS job's own token. Refusal is the pass. If the mint ever succeeds, statuses:write came
        # back to this workflow and the unattended engine could stamp its own `promoted` — exactly
        # the hole the split closed — so the run reds here, before any landing is attempted.
        #
        # It fails CLOSED: only a permission refusal (403) proves the tooth. Any other failure
        # leaves this engine's stamping power UNKNOWN, and an engine in an unknown auth state has
        # no business landing commits on production.
        env:
          # workflow_run carries the triggering head; schedule carries none — fall back to this
          # run's own checked-out sha (master, the file's own ref). Either is a valid sha to probe:
          # the canary only proves the TOKEN can't mint, never anything about the sha itself.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail
          if OUT=$(gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=forge-canary \
            -f description="split canary — this mint must be refused" 2>&1); then
            echo "::error::engine can forge stamps — the split regressed (statuses:write is back on promote-queue.yml)"
            exit 1
          fi
          case "$OUT" in
            *"HTTP 403"*) echo "status mint refused with 403, as required — this engine cannot stamp 'promoted'" ;;
            *) echo "::error::forge-canary proved nothing: the mint failed for an unexpected reason, so this engine's stamping power is unknown — $OUT"; exit 1 ;;
          esac
      - name: any promote-requested PRs? (cheap gate — skip the checkout when idle)
        id: gate
        run: |
          COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --label promote-requested --state open --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          [ "$COUNT" = "0" ] && echo "no promote-requested PRs — nothing to do" || echo "$COUNT promote-requested PR(s) to evaluate"
      - name: checkout the TRUSTED engine (edge, never the triggering PR head)
        if: steps.gate.outputs.count != '0'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: edge
          fetch-depth: 0
      - name: stale-engine canary — the checked-out engine must be the CURRENT one (#1573)
        if: steps.gate.outputs.count != '0'
        # The failure class this ref change exists to kill: an engine checked out from a branch that
        # trails the one it is developed and gated on runs code nobody has looked at in a thousand
        # commits, and every landing fix already shipped is frozen out of the path that lands PRs.
        # Assert the tree carries the files the current engine sources and dispatches; a miss means
        # the ref is stale, and it is named as that class rather than surfacing later as a cryptic
        # "no such file" from inside a landing.
        run: |
          MISSING=
          for F in .github/scripts/promote-land.sh .github/scripts/promote-green-eval.sh; do
            [ -f "$F" ] || MISSING="$MISSING $F"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::stale-engine: the landing checkout is missing$MISSING — this job's ref trails the branch the engine is developed on"
            exit 1
          fi
          echo "engine checkout is current (landing engine + green-eval present)"
      - name: land eligible promote-requested PRs (oldest-first)
        if: steps.gate.outputs.count != '0'
        run: |
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --label promote-requested --state open \
            --json number,createdAt --jq 'sort_by(.createdAt) | .[].number')
          DISPATCH_FAILED=0
          while IFS= read -r PR; do
            [ -z "$PR" ] && continue
            set +e
            bash .github/scripts/promote-land.sh "$PR"
            RC=$?
            set -e
            echo "PR #$PR → rc=$RC"
            # rc=4 means the PR LANDED but its board sweep was never dispatched. A refusal (rc=1) or
            # a queued PR (rc=3) is routine and stays quiet; a landing whose automations went
            # missing is the #1605 fail-loud case — carry it to the end, then redden this run.
            if [ "$RC" = 4 ]; then DISPATCH_FAILED=1; fi
          done <<< "$PRS"
          if [ "$DISPATCH_FAILED" = 1 ]; then
            echo "::error::a landing automation dispatch failed — the board sweep did not run for a landed PR"
            exit 1
          fi
