#
# THE SECURITY BASELINE (#1848). Until this file, no security query had ever run over this tree:
# checks.yml's `fp-codeql` job sets `disable-default-queries: true` and runs only the aresrpg FP
# pack, deferring the security suite to a code-scanning DEFAULT SETUP that is `not-configured`.
# This workflow runs the standard suite over BOTH languages, including the rust indexer
# (packages/rpc/indexer — the keyless read layer and gas-station surface, scanned by nothing).
# `fp-codeql` is untouched and keeps its own category: style/dataflow law is a different concern
# from vulnerabilities, and the two analyses must not overwrite each other.
#
# WHY A SEPARATE FILE AND NOT A JOB IN checks.yml: .github/scripts/promote-green-eval.sh DERIVES
# the promotion's required-check set by parsing gate.yml + checks.yml and taking every job name a
# PR head can carry. A schedule-only job added to checks.yml would join that set and never
# register a check-run on any PR — the permanent-wedge class sealed by #1789. Its own file keeps
# this analysis defense-in-depth at the GitHub level, outside the queue's bar, exactly where
# default-setup code scanning already sits.
#
# WHY IT REACHES THE DEFAULT BRANCH — the actual #1848 gap: alerts track the DEFAULT branch, and
# master had zero analyses ever, because a GITHUB_TOKEN fast-forward push does not self-trigger
# workflows (promote-queue.yml:67 — release.yml is handed an explicit workflow_dispatch after a
# master ff, checks.yml is not, so its push-triggered analysis never runs there). `schedule:`
# depends on no push at all: GitHub fires it from the default branch, so the run's ref IS
# refs/heads/master by construction — the gap closes without anyone remembering to dispatch.
#
# The checkout deliberately takes NO `ref:` override. codeql-action files its SARIF under the
# RUN's ref/sha (GITHUB_REF/GITHUB_SHA), so checking master out of a run whose context is another
# branch would publish master's findings AS that branch's analysis — a provenance lie, and the
# scheduled path would gain nothing since its context is already master. Checkout-as-triggered
# keeps the code analyzed and the ref reported identical on every path.
#
# BOOTSTRAP: `schedule` and `workflow_dispatch` only exist once this file reaches `master` (#809,
# same as loop-deadman.yml) — until the promotion that lands it, this workflow runs zero times.
# Fork-safe: no secrets beyond the run's own GITHUB_TOKEN.
name: security scan
on:
  schedule:
    # Daily, off-minute on purpose: GitHub delays and drops runs clustered on the hour, and a
    # baseline scan carries a full day of slack, so a late run is never a false alarm.
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    name: codeql security suite (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Generous on purpose: rust extraction resolves the indexer's sui-indexer-alt-framework git
    # dependency from source. A scheduled scan costs nothing by waiting; it costs a whole day of
    # baseline by timing out.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      # Each language is an independent analysis: a rust extraction failure must not withhold the
      # javascript baseline (or the reverse).
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: init CodeQL (standard security suite)
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          languages: ${{ matrix.language }}
          # `none` is not a preference for rust — it is the ONLY build mode CodeQL supports for
          # it (rust-analyzer extracts from Cargo.toml, no full build; GA since CodeQL 2.23.3,
          # and this action pin is later). javascript-typescript has never needed a build either,
          # which is why one matrix leg covers both without a build step or toolchain setup.
          build-mode: none
          # No `queries:` override, deliberately: that IS the default `code-scanning` suite — the
          # standard security queries this repo has never run. Widening to security-extended is a
          # later ratchet, taken once this baseline has been triaged rather than on day one.
      - name: analyze
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          # Distinct from fp-codeql's `aresrpg-fp`, and distinct per language: categories are how
          # code scanning keeps concurrent analyses of one ref from replacing each other.
          category: security-${{ matrix.language }}
