# CI FIGHT BOTS — fights + the starter craft are verified by BOTS, never by a browser (standing ruling). Five
# SDK-driven legs (solo · coop · spectate · timeout · craft) run against a disposable LOCALNET stood up inside
# the job: the driver
# publishes the current Move source, seeds the in-repo `active` corpus, self-grants four faucet-funded actors
# with characters, and drives real PTBs. NO SECRETS, no testnet dependency, no private seed content — every
# key is generated for this throwaway chain and dies with it.
#
# WHY push-to-edge and NOT pull_request: the publish path runs the trunk-ancestry gate (#1298, no override) —
# the publishing tree's HEAD must be an ancestor of GitHub's `edge`. A PR branch is by definition not, so a
# PR-triggered run could only ever refuse. This is the same reason `gold-smoke.yml` stops at a bare localnet.
name: fight bots

on:
  push:
    branches: [edge]
  workflow_dispatch:

# One run per ref: fight bots hold a whole docker stack and a chain, so stacking runs would fight over both.
concurrency:
  group: fight-bots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fight_bots:
    runs-on: ubuntu-latest
    # The DRIVER is internally bounded (every wait fails loud); this ceiling only catches a wedged runner or a
    # cold image build. Fork-safe: no secrets, ever (FROZEN.md rule 8).
    timeout-minutes: 45
    env:
      # compose interpolates the sponsor profile's `${SPONSOR_DEV_KEY:?…}` at PARSE time, so even a
      # localnet-only up demands the var. A benign placeholder — this job never boots the sponsor.
      SPONSOR_DEV_KEY: fight-bots-config-only-not-a-key
      # The localnet image's Sui binary: runners are x86_64, dev machines aarch64 (compose threads it through).
      SUI_ARCH: x86_64
      # The minimal corpus that ships in THIS repo — the authored corpus lives in the private seed repo.
      GOLD_CORPUS: active
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install
        run: bun install --frozen-lockfile

      # The publish path shells out to `sui move build` / `sui client publish` — the CLI must match the
      # framework revision the Move packages pin.
      - name: install the Sui CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sui.tgz \
            https://github.com/MystenLabs/sui/releases/download/testnet-v1.75.1/sui-testnet-v1.75.1-ubuntu-x86_64.tgz
          sudo tar -xzf /tmp/sui.tgz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/sui*
          sui --version

      - name: fight bots — boot the localnet and drive all five legs
        run: node scripts/fight_bots.mjs --boot

      - name: the verdict table + logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fight-bots-verdict
          path: |
            test/gold/out/fight_bots_verdict.json
            test/gold/out/corpus_manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: teardown — no container of this stack survives (kill-your-own-rigs law)
        if: always()
        run: node test/gold/down_gold.mjs
# ── A TESTNET VARIANT, deliberately NOT wired ───────────────────────────────────────────────────────────────
# Running these legs against testnet would need a funded, long-lived key (a repo secret), would spend real gas
# on every push, and would race every other actor on a shared chain — none of which a per-push gate should do.
# The localnet legs above are "exactly the same minus latency". If a soak against testnet is ever wanted, it
# belongs behind an explicit manual dispatch with its own budget, roughly:
