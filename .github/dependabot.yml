#
# Every entry targets `edge`: nothing PRs into master except an edge→master promotion
# (#1783 — four dependabot PRs opened against master directly). Minors and patches ride one
# grouped PR per ecosystem; MAJORS are deliberately left out of every group so each arrives as
# its own review row, read against its breaking-change notes and landed through the normal
# train — never batched, never auto-merged.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'edge'
    schedule:
      interval: 'weekly'

  # The workspace root. `bun`, not `npm`: the lockfile this repo actually resolves against is
  # bun.lock, which the npm ecosystem does not read — it would update package.json manifests and
  # leave the lockfile lying (#1848).
  - package-ecosystem: 'bun'
    directory: '/'
    target-branch: 'edge'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      bun-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # packages/rpc/indexer — the money-path read layer. Its sui-indexer-alt-framework dependency is
  # a git rev pinned to the mainnet framework and stays hand-managed (the rev must match the sui
  # CLI, see its Cargo.toml); this entry covers the crates.io half, which was covered by nothing.
  - package-ecosystem: 'cargo'
    directory: '/packages/rpc/indexer'
    target-branch: 'edge'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
