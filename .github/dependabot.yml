#
# Use the default branch (edge) so grouping also applies to security updates.
# Weekly minor/patch batches and security fixes each get their own grouped PR.
# Major updates remain separate reviews; no updates are auto-merged.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']

  # The workspace root. `bun`, not `npm`: the lockfile this repo actually resolves against is
  # bun.lock, which the npm ecosystem does not read — it would update package.json manifests and
  # leave the lockfile lying (#1848).
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    # 0.186.0 changes renderer disposal to async; world cleanup needs a separate migration.
    ignore:
      - dependency-name: 'three'
        versions: ['0.186.0']
      - dependency-name: '@types/three'
        versions: ['0.186.0']
    groups:
      bun-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      bun-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']

  # packages/indexer — the money-path read layer. Its sui-indexer-alt-framework dependency is
  # a git rev pinned to the mainnet framework and stays hand-managed (the rev must match the sui
  # CLI, see its Cargo.toml); this entry covers the crates.io half, which was covered by nothing.
  - package-ecosystem: 'cargo'
    directory: '/packages/indexer'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
