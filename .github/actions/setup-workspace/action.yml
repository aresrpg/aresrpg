# Runs after a blob:none checkout that leaves out seed/icons and seed/models: the 1.8GB art tree
# restores from the actions cache, keyed by its own git tree hash, so art downloads only when it changed.
name: Set up the workspace
description: Restore the art tree, then install Bun and the locked workspace dependencies.
runs:
  using: composite
  steps:
    - name: art tree key
      id: art
      shell: bash
      run: echo "tree=$(git rev-parse HEAD:seed/icons)-$(git rev-parse HEAD:seed/models)" >> "$GITHUB_OUTPUT"
    - name: cache the art tree
      id: art_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          seed/icons
          seed/models
        key: art-${{ steps.art.outputs.tree }}
    - name: materialize the art tree (cache miss only)
      if: steps.art_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git sparse-checkout set --no-cone '/*'
        git checkout HEAD -- seed/icons seed/models
    - name: setup Bun
      id: setup_bun
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - name: setup Bun (retry)
      if: steps.setup_bun.outcome == 'failure'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - name: cache bun downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - name: install
      shell: bash
      run: bun install --frozen-lockfile
