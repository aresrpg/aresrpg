<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>AresRPG — Mob Icon Showcase</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!--
      SCRATCH SHOWCASE — one creature GLB, framed for the encyclopedia mob_icon render. NOT product code.
      Loads the mob through the REAL game render SDK (create_mob_model → the shared DRACO/GLTF loader + the
      metalness gold-kill + the S-82 pixel-art sampler + the mob-shade emissive floor), so a rendered icon
      matches EXACTLY what the fixed fight/roam path draws. Auto-fits the camera to the model's real scaled
      bounds (whole model in frame + margin, any silhouette) — the render_mob_icons.mjs two-tier idiom, same
      standard as the hat auto-fit. Deterministic clock: window.__seek(t) poses one idle frame and draws;
      window.__ready flips once the model has mounted + drawn. Params: ?glb= (served GLB url) ?fill= (frame
      fill fraction, default 0.82) ?yaw= (deg, model turn — default 22 for a 3/4 portrait) ?transparent=1.
    -->
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer } from 'three/webgpu'
      import { create_mob_model } from '/src/player/mob_model.js'

      const q = new URLSearchParams(location.search)
      const GLB = q.get('glb') || ''
      const FILL = q.has('fill') ? Number(q.get('fill')) : 0.82
      const YAW = (q.has('yaw') ? Number(q.get('yaw')) : 22) * (Math.PI / 180)
      const TRANSPARENT = q.has('transparent')
      const TONE = q.get('tone') || 'neutral' // agx | neutral | none — icon rig (not the world's AgX crush)
      const EXPO = q.has('expo') ? Number(q.get('expo')) : 1.0
      const FOV = 40

      try {
        if (TRANSPARENT) {
          document.documentElement.style.background = 'transparent'
          document.body.style.background = 'transparent'
        }
        const canvas = document.getElementById('c')
        const renderer = new WebGPURenderer({ canvas, antialias: true, alpha: TRANSPARENT })
        await renderer.init()
        renderer.setPixelRatio(1)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setClearColor(0x000000, TRANSPARENT ? 0 : 1)
        // The world uses AgX (which crushes a mob's away-facing faces to black — the reason mob_model lays an
        // emissive floor). An ICON wants the mob bright + saturated like the shipped set, not the world crush,
        // so default to a neutral curve; agx/none selectable for a match probe.
        renderer.toneMapping =
          TONE === 'agx' ? THREE.AgXToneMapping : TONE === 'none' ? THREE.NoToneMapping : THREE.NeutralToneMapping
        renderer.toneMappingExposure = EXPO

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100)

        // Portrait rig: soft sky fill + an overhead-ish warm key + a cool rim — the same family the worn
        // showcase uses; the mob-shade emissive floor (create_mob_model) lifts any face the key can't reach.
        scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x14121a, 1.2))
        const key = new THREE.DirectionalLight(0xf5d0a9, 1.7)
        key.position.set(3, 6, 5)
        scene.add(key)
        const rim = new THREE.DirectionalLight(0x4a9eff, 1.1)
        rim.position.set(-4, 3, -5)
        scene.add(rim)

        const mob = await create_mob_model(GLB, { label: GLB })
        const root = mob.root
        root.rotation.y = YAW
        scene.add(root)

        // Idle pose: mix the first clip and hold a mid frame so limbs/wings read naturally (static if no clips).
        const mixer = mob.clips.length ? new THREE.AnimationMixer(root) : null
        if (mixer) mixer.clipAction(mob.clips[0]).play()

        let drew = false
        function frame_camera() {
          root.updateWorldMatrix(true, true)
          const box = new THREE.Box3().setFromObject(root)
          const size = box.getSize(new THREE.Vector3())
          const center = box.getCenter(new THREE.Vector3())
          const tan = Math.tan((FOV / 2) * (Math.PI / 180))
          // square canvas ⇒ fit the larger of width/height; divide by FILL so the silhouette leaves a margin.
          const half = Math.max(size.x, size.y) / 2
          const dist = half / tan / FILL + size.z / 2
          camera.position.set(center.x, center.y + size.y * 0.04, center.z + dist)
          camera.lookAt(center)
          camera.updateProjectionMatrix()
        }
        function draw() {
          frame_camera()
          renderer.render(scene, camera)
          drew = true
        }

        window.__seek = (t) => {
          if (mixer) mixer.setTime(Math.max(0, t))
          draw()
        }
        window.addEventListener('resize', () => {
          renderer.setSize(window.innerWidth, window.innerHeight)
          camera.aspect = window.innerWidth / window.innerHeight
          draw()
        })
        draw() // first paint

        Object.defineProperty(window, '__ready', { get: () => drew })
        window.__info = () => ({ drew, clips: mob.clips.length, height: mob.measured?.height })
      } catch (err) {
        window.__fatal = String(err && err.message ? err.message : err)
        console.error('[mob-icon-showcase] fatal', err)
      }
    </script>
  </body>
</html>
